[[procedure.sequence]]
id = "cargo-fix-maybe-fix"
title = "Cargo Fix Maybe Fix"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-19-cargo-fix-maybe-fix-then"

[procedure.sequence.when.not]
field = "level"
equals = 0
count = "slot:cargo-fix-diagnostics"
field-equals = "error"
