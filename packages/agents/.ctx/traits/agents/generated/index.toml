id = "agents"
schema-version = "0.2"
version = "0.2.0"
name = "Agents"
summary = "Shared reviewed-multi-agent doctrine: the role declarations, review/escalation prompt doctrine, and typed review-verdict schema a bounded refinement loop reports findings against, for dependents that declare it instead of pasting the roles, doctrine, or schema into their own trait source."

[metadata]
tag = [
    "first-party",
    "knowledge",
    "agents",
]

[[slot]]
id = "phase-brief"
schema = "schema:text"
description = "The scope contract the doctrine's judgment clause binds to — a consumer's phase or design contract."

[[slot]]
id = "product-brief"
schema = "schema:text"
description = "The house-rules digest the doctrine's judgment clause binds to — a consumer's product-contract summary."

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "The shape of an acceptable fix: the invariant it must establish and what to replace or delete — never just the cited call sites."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "leftover"
description = "One adjudicated leftover: real follow-on work that the shipped result does not require, with its reason class, prerequisites, standalone-evidence, and completion check."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "The falsifiable check that will confirm this item is complete once someone takes it up."

[schema.fields.evidence]
schema = "schema:text"
required = true
description = "Why the shipped result stands alone without this item — the second question's verified answer."

[schema.fields.needs]
schema = "[schema:text]"
required = true
description = "What must happen before this item can be done; may be empty."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "Why this is a leftover rather than in-scope now: needs-unlanded (depends on work not yet landed), needs-human (requires an owner/authority action this run cannot take), or out-of-budget (explicitly outside this phase or task's stated scope boundary — never work merely left undone because an execution or refinement round ran out; a competent engineer's in-task-doable work is always a blocker, not a leftover)."
allowed = [
    "needs-unlanded",
    "needs-human",
    "out-of-budget",
]

[schema.fields.what]
schema = "schema:text"
required = true
description = "The follow-on work item, stated concretely in exactly one sentence."

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if a blocking defect remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
description = "The blocking defects that must be fixed before merge: correctness bugs, house-rule violations (core purity, a new dependency, a new #[allow], required byte-stability broken), failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the phase), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Present when status is revise; empty or absent when approved."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the phase contract is a placeholder or lacks a falsifiable Done-when; a prerequisite phase named in Deps has not landed in this tree; the group is marked SUPERSEDED or CANCELLED; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the phase's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Present when escalation is needs-owner; absent otherwise."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS phase that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-phase seam citations ONLY: counterpart work the execution plan assigns to a DIFFERENT phase, each citing that phase's id. Never in-phase scope — an unimplemented item of THIS phase's checklist is a blocker, and unimplemented in-phase scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-phase seam exists."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise only when at least one blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[[agent]]
id = "worker"
description = "Implements a draft or agreed design and applies reviewer fixes."
summary = "Implementation role."

[[agent]]
id = "reviewer"
description = "Drafts and/or reviews the work in a bounded refinement loop."
summary = "Review role."

[[agent]]
id = "scribe"
description = "Writes the commit message for a completed run; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "clerk"
description = "Extracts and distills context so later steps never re-read source files."
summary = "Context-extraction role."

[prompt.leftover-doctrine]
text = """                    The worker proposes leftovers explicitly in its work summary — including an explicit empty list when none exist; a leftover is never something you invent on the worker's behalf. Each proposal's "what" is exactly one sentence. Adjudicate every proposal with two questions, in order: first, could a competent engineer have done this work inside THIS task? If yes, it is not a leftover — it is unfinished scope, and you raise it as a BLOCKER instead. Running out of refinement rounds or effort budget is never a legitimate answer to this question — "out-of-budget" means the phase or task's own scope statement explicitly excludes the work, not that time ran out doing it. Second, does the shipped result stand alone without it? If the result does not stand alone — a caller is left broken, a contract is left half-honored, a claim is left unverified — approval is withheld until either the gap is closed or the item is out of this phase's own scope entirely (in which case it is not this phase's leftover to report at all). Only a proposal that survives both questions enters slot:leftovers, reproduced with its full typed fields (what, reason, needs, evidence, done-when); a leftover list is never treated as failure and never affects status or loop exit — it is a durable, honest record of real follow-on work, not an escape hatch for undone scope. Return the leftovers list as a required typed output alongside your verdict; an empty list is a valid, signed claim that none exist — never omit the field."""
description = "Shared leftover-review doctrine: the two questions a reviewer applies to every worker-proposed leftover before it survives into slot:leftovers."

[prompt.review-verdict-doctrine]
text = """
If the work summary ends with a Blocker dispositions section, those ids are the blockers raised last pass: verify each disposition's quoted done-when directly with your tools FIRST; a blocker whose done-when still fails returns with recurrence-of set to its id — never silently rewritten as a new blocker.
                    Consult the phase contract {slot:phase-brief} and house rules {slot:product-brief}, and inspect the actual working tree with your tools — never review the summary alone; run the gates named in the phase's own Definition of Done if the summary does not prove they ran.
                    Before citing any house rule in a blocker, verify it against the phase's declared rule-authority: open that resource yourself with your tools, confirm the rule's source path/section and quoted line(s) in {slot:product-brief} match the authority exactly, and drop the blocker rather than raise it if you cannot verify both — an unsourced or misquoted rule is not a rule. When a blocker does cite a house rule, set its rule-source and rule-quote fields to the verified citation; leave both unset for blockers that are not rule-based (correctness bugs, duplication, and the like).
                    Judge the work SOLELY against this phase's stated scope and Definition of Done. A phase is complete when its own DoD holds — even if the overall project does not yet build or pass whole-project gates, which belong to later phases. Do not invent acceptance criteria the phase does not state, and do not fail the work for deliverables or gates scoped to a different phase.
                    Hold the work to correctness, robustness, pragmatism, elegance, leanness, and reuse. A BLOCKER makes the work genuinely unmergeable: a correctness bug, a house-rule violation, a gate the phase's own Definition of Done requires that is failing, clear over-build (accretion, defensive validation for impossible states, scope creep), OR un-abstracted duplication — logic re-implemented or copied where existing code should have been reused or a shared abstraction extracted. Everything else — subjective style, naming, taste, optional improvements, follow-up, or gates that belong to later phases — is ADVISORY.
                    Report each blocker as a typed entry: a stable kebab-case id (reused verbatim if it returns), where (paths), what (the defect and its failure), root-cause (the missing invariant, not just where it shows), required-fix (the invariant an acceptable fix must establish and what to replace or delete — never just the cited call sites), and done-when (the falsifiable check you will apply next round). A blocker with recurrence-of set is proof the prior fix treated a symptom: state in root-cause why it was symptomatic, prescribe the structural fix in required-fix, and make clear that another point-patch at the cited sites will not clear it — for recurring duplication that means consolidate into one shared path and delete the copy, and do not approve until the duplicate is gone rather than the named case merely fixed.
                    The phase contract is the standard you measure against, split by the draft's SCOPE SPLIT: withhold approval while any agent-doable checklist item or Done-when of THIS phase is unimplemented or unverifiable in the working tree, or while an owner-only item lacks the substitute evidence its class allows. Verify each item yourself with your tools; every unimplemented or partially implemented agent-doable item is a BLOCKER (one typed entry naming the item), not a note. Audit the split itself with one test: if a competent engineer with this repository and a shell — but no screen, no payment authority, and no owner authority — could complete and verify the item, it is agent-doable no matter what the draft claims: PROMOTE it and raise the blocker. You may promote owner-only to agent-doable; you may NEVER demote an item the draft classified doable. When the work summary claims a NEW wall discovered mid-run, apply the same test with heightened suspicion and accept it only with a named reason class and substitute evidence you verified. Record every accepted owner-only item in the owner-items field (item, class, reason, the substitute evidence you verified, close-out); an owner-item never justifies skipping doable work, and an owner-item whose substitute evidence is missing or unverified is a BLOCKER, not an owner-item. Cross-phase seams are the other exception: when a missing counterpart (the other side of a wire contract, the consumer of a new API, the native half of a typed bridge) is assigned by the execution plan to a DIFFERENT phase, SEARCH the execution-plan resource, confirm that phase, and judge the seam by failure-safety — if the intermediate state fails SAFELY (a typed or clearly-handled error, no data corruption, no silent wrong behavior), the seam is not a defect: cite the owning phase by id in the remaining field. Neither exception ever converts an implementable item of this phase's own checklist. Block on a seam when it fails unsafely or no other phase owns it.
                    The loop is bounded and ADVISORY, so spend your rounds where they change the outcome. The refinement loop exits early the moment every reviewer approves; if it uses its full budget with blockers still open, the run does NOT fail — it proceeds to commit with your final verdict attached as the record of what is still wrong. That makes your verdict a durable report, not a gate: rank blockers by real consequence, state each one once and precisely, and never repeat a blocker the worker cannot act on merely to withhold approval — a blocker whose only possible resolution is an owner decision belongs in owner-items or escalation-reason, and repeating it costs a round and changes nothing. Approve when the phase's own DoD holds; withhold approval when it does not, knowing the work still lands and your objections travel with it.
                    Escalation: set escalation to needs-owner if and only if the RUN AS A WHOLE cannot reach an approvable state — the phase contract is a placeholder or lacks a falsifiable Done-when (or the draft opens with CONTRACT PROBLEM and you confirm it), a prerequisite phase named in Deps has not landed in this tree, the group is marked SUPERSEDED or CANCELLED, or a contradiction poisons the entire phase leaving no separable agent-doable work. A single item outside in-run capability or authority is NOT escalation — it is an owner-item with substitute evidence, and the run still completes. Escalation is ADVISORY: it never stops the loop, and your flag plus escalation-reason (one sentence naming the owner action that would clear it) are recorded for owner triage. Never escalate merely because the work is large or incomplete; judge only what is in front of you. Otherwise set escalation to none and omit escalation-reason.
                    Put blocking defects in the blockers field and non-blocking notes in advisory. Set status to revise only when blockers is non-empty; otherwise approved — advisory never blocks. Do not promote taste to a blocker to earn another round. Return the typed verdict."""
input = [
    "slot:phase-brief",
    "slot:product-brief",
]
description = "Shared blocker-reporting and escalation doctrine for a typed multi-reviewer refinement loop: how to judge severity, report a blocker, and record owner-triage escalation."
