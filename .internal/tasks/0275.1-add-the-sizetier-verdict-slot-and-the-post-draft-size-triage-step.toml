schema-version = "0.2"
key = "0275.1"
title = "Add the sizeTier verdict slot and the post-draft size-triage step"
status = "draft"
raised = "2026-09-01"
content = """
Build the triage substrate for Stage 1: a typed size verdict and the 1-frame step that
fills it.

1. In .ctx/traits/authored/implement/source/shared/data.ts, add a sizeTier typed slot —
   a verdict carrying tier (light | standard) plus reasons and evidence — alongside the
   existing verdict1/verdict2 slots (which use agents.reviewVerdictSchema).
2. Author the 1-frame size-triage step shaped like the feasibilityGate prior art
   (packages/toolkit/src/sequence/feasibility.ts) in its warn-mode form: a single
   sequence.prompt round with doctrine text in literal template segments and typed refs in
   interpolations, writing the typed verdict into the sizeTier slot. The gate's block-mode
   abortIf is a blocked terminal at runtime (modules/core/src/procedure/runtime/guards.rs)
   — correct for a gate with one passing verdict, wrong for a classifier — so the triage
   step declares no until/abortIf at all: light and standard are both valid, successful
   outcomes, the step is bounded to one frame by construction, and both verdicts complete
   the triage and proceed. Routing on the tier value is 0275.2's work.

The smart drafter classifies the drafted change against repository evidence only — files
it will touch, novel logic vs cosmetic adjustment, blast radius beyond the rendering
layer — with no task facet, into the typed slot. Classification conventions (what makes
a change light vs standard, what counts as evidence) live in the slot's schema field
descriptions, not in prompt text, per the prompt-doctrine ruling.

This task produces the slot and the step; wiring them into basic's flow is 0275.2.
"""
scope = """
## Decisions
- The gate stays inside the implement trait — no toolkit sizeGate extraction (single-
  consumer rule; packages/toolkit/src/sequence/ extraction is explicitly deferred), and
  no toolkit-wide severity schema change.
- Triage input is the drafted change plus repository evidence only; no task facet
  (owner ruling).
- The shape contract is feasibilityGate's warn arm
  (packages/toolkit/src/sequence/feasibility.ts): one prompt frame, doctrine in literal
  template segments, typed refs in interpolations, no abort guard — both tier verdicts
  complete the triage successfully and reach 0275.2's routing. Never wire either tier
  value to an abort path.
- Trait authoring only — no Rust changes.
- Exact symbol names, file placement of the step builder, and edit sequencing are the
  architect's call.
"""
validation = """
## Watch
- Prompts carry task doctrine only: classification conventions belong in schema field
  descriptions and slot descriptions, never in prompt text.
- Committed generated/*/index.toml and trait.lock are build outputs of ctx traits build
  implement — never hand-edit.
- No assertions on committed trait canonical content (no frozen-inventory proofs); the
  existing gates are the proof for a trait-package edit.
- In a run worktree, isolate the build cache (CARGO_TARGET_DIR=target cargo …) before
  trusting a gate failure.

## Done when
The implement trait sources declare a sizeTier typed verdict slot (tier: light |
standard, with reasons and evidence, conventions in field descriptions) and a 1-frame
size-triage step following the feasibilityGate warn-arm shape — completing successfully
for either tier verdict, with no abort path on either value — and the landing recipe runs
green: just ts-build → ctx traits build implement, plus just ts-typecheck.
"""
[relations]
parent = "0275"

[[checks]]
name = "TS workspace builds"
command = "just ts-build"
timeout-ms = 900000

[[checks]]
name = "implement canonicals regenerate from source with no tracked drift"
command = "CARGO_TARGET_DIR=target cargo run -p ctx-traits-cli -- traits build implement && git diff --exit-code -- .ctx/traits/authored/implement"
timeout-ms = 1800000


[[checks]]
name = "TS typecheck passes"
command = "just ts-typecheck"
timeout-ms = 600000
