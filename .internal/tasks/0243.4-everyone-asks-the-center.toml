### 1. dashboard.rs — event-scoped selected-preview refresh
Removed symbol: field `DashboardSnapshot::refresh_selected_preview: bool`
(dashboard.rs:1226).
New field in its place, on `struct DashboardSnapshot` (dashboard.rs:1215):
