### 4. worker.rs tests — the missing dashboard regressions
Reuse `CenterPeer`, `accept_center_subscription`, `accept_center_client`,
`read_center_request`, `write_center_response`, `complete_center_hello`
(app/test_support.rs), plus the file's own `WorkerLoop`, `finish_snapshot`,
`row`, `current_repo_row`. Add one helper
`fn parked_ask_row(title: &str) -> ctx_traits_io::center::CenterPublicRow`
(a `current_repo_row` whose summary carries `"status": "waiting-on-human"`,
`"next_frame_kind": "ask"`, `"interrupted": false`). New tests:
- `failed_complete_snapshot_projection_keeps_the_accepted_rows_and_reconnects`:
  set `FAIL_CENTER_PROJECTIONS` to 1 before `WorkerLoop::start`; the peer's
  first stream sends one snapshot row plus `snapshot-end`; assert the worker
  emits `Err`, that
  `worker.send(Command::Render { all_repos: true, screen: Screen::Sessions })`
  serviced afterwards reprojects the accepted row map and reports no sessions
  (nothing partial was committed), and that the peer's second `accept`
  (reconnect) then delivers a snapshot the worker accepts.
- `failed_delta_projection_keeps_the_accepted_rows_and_reconnects`: first
  stream sends row A + `snapshot-end` (accepted, title "before"); the test
  gates the peer with an `mpsc` channel, sets `FAIL_CENTER_PROJECTIONS` to 1,
  then lets the peer send a `row-changed` delta carrying title "after"; assert
  the worker emits `Err`, that
  `worker.send(Command::Render { all_repos: true, screen: Screen::Sessions })`
  still projects title "before" (accepted map intact), and
  that the peer's second stream is accepted and its snapshot lands "after".
  Both tests store 0 back into `FAIL_CENTER_PROJECTIONS` before returning; the
  `CenterPeer` environment lock serializes them.
- `parked_ask_presentation_survives_a_render_with_an_unavailable_center_get`:
  seed one accepted projection with
  `state.reload_from_center_rows(&rows, false)` (enrichment off), overwrite
  `state.sessions[0].phase` with `"ask: approve the change (wait 1m)"` to stand
  for the last accepted parked-Ask presentation, then run
  `handle_one_command(Command::Render { all_repos: true, screen: Screen::Sessions }, &snapshots, &previews, &explanations, &mut state, &rows, false)`
  — the same seven-argument shape the file's existing `Command::Refresh` tests
  use (worker.rs:642, 681), with `snapshots`/`previews`/`explanations` the
  `mpsc::Sender` halves created in the test and `rows` a
  `HashMap<String, ctx_traits_io::center::CenterPublicRow>` holding the seeded
  row keyed by its ledger path — against a peer
  that answers the single `get` request with
  `{"type": "error", "data": {"message": "center unavailable"}}`; assert the
  emitted phase still starts with `"ask: approve the change (wait 1m); "` and
  contains `"legacy session has no pinned document"` — the drift warning
  `run::trait_source_drift_from_parts` appends for a row without a pinned
  trait source, deduplicated by `append_phase_warning` (dashboard.rs:1745).
