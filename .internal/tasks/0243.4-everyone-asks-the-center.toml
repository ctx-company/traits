`SessionPreviewRequest::ledger_path` is `camino::Utf8PathBuf`, hence `as_str()`.
The renderer stays the only selection owner; do not add one in the worker.

### 2. dashboard.rs — test-only projection-failure seam
A failed `reload_from_center_rows` cannot be provoked deterministically from
the environment (`current_repo_key`, `InventoryContext::discover`), so add a
`#[cfg(test)]` counter beside `State::reload_from_center_rows`
(dashboard.rs:1601), mirroring center.rs's `LEDGER_READS` test-counter
precedent. New symbol:
  `#[cfg(test)] static FAIL_CENTER_PROJECTIONS: std::sync::atomic::AtomicUsize = std::sync::atomic::AtomicUsize::new(0);`
(module-private in `app::dashboard`; the `worker` child module reaches it as
`super::FAIL_CENTER_PROJECTIONS`). At the very top of
`State::reload_from_center_rows(&mut self, rows: &[ctx_traits_io::center::CenterPublicRow], enrich_session_presentations: bool) -> crate::Result<()>`,
before `let reload_started`, add a `#[cfg(test)]` guard that consumes one count
with `fetch_update(SeqCst, SeqCst, |remaining| remaining.checked_sub(1))` and,
when it consumed one, returns
`Err(crate::Error::Command { message: "injected center projection failure".to_string() })`
before mutating anything. No production behavior changes.

