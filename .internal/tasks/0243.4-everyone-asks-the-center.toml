content = """
Owner ruling (2026-08-26). The bulk of this task landed on main in merge
d02eb425 at gates-green: every designated read surface (stats, tasks,
merge lookup, story, dispatch preflight, run liveness) is center-backed
and fail-loud, and the dashboard runs a live center subscription with a
delta reducer (modules/cli/src/app/dashboard/worker.rs) instead of
filesystem inventory polling. 48 review rounds of that work are already
reviewer-verified. This task now covers ONLY the remainder below; ground
against current main, not against the task's original full scope.

A prior session's reviewer kept this task at closure/discovery
equilibrium for 20+ rounds by unrolling depth past the landed state.
The remainder is a closed list. Anything discovered beyond it is board
material for a follow-up task, not additional cells for this one.
"""
scope = """
## Decisions — the closed remainder

Dashboard subscription hardening:
- Make `SnapshotEnd` and delta projection transactional: retain the
  accepted row map and worker session state until `reload_from_center_rows`
  succeeds; a failed projection must never leave a wiped or partial view.
- On a failed `SnapshotEnd` or delta projection, discard the subscription
  and reconnect for a fresh complete snapshot (or retain and retry the
  complete candidate); update `last_snapshot_at` only after an `Ok`
  snapshot.
- Preserve parked-Ask presentation and trait-source drift warnings when
  `Command::Render` reprojects accepted rows, and retain the last accepted
  parked-Ask presentation while `center::get` is unavailable.
- Split periodic `Command::Refresh` from center-row application so the
  periodic tick refreshes only non-session state and never calls
  `center::get`.
- Replace the hand-rolled `repo_key(state_repo_root)` filter with fallible
  `state::current_repo_key()`.
- Refresh the currently selected by-path session preview after relevant
  subscription deltas or activity events; an unchanged selection must not
  re-request.

Center cache correctness:
- Change the unchanged-row predicate so a fingerprint-matching row is
  reusable when it has either a cached session or an explicit
  `parse_error`, so unchanged corrupt ledgers stop bypassing the cache.
- Replace the same-version narrower-summary simulation with a version-1
  index fixture carrying the preceding summary shape, and assert the
  current center rebuilds it.

Tasks surface:
- Parity tests for readable and corrupt rows, and a failure test proving a
  center request error can never produce a successful partial proposal or
  reconcile report.

Proofs and gates (one regression per behavior above, then):
- chmod-after-snapshot proofs covering stats, tasks proposals/reconcile,
  merge lookup, and a dashboard snapshot with zero client ledger reads
  (cold and warm).
- Dashboard subscription proofs for delta-only appearance and center
  kill/restart degraded-mode recovery.
- Ledger-read-count and real-process idle-exit regressions for an
  unchanged corrupt ledger, including a list/stats request after the
  initial snapshot.
- Rerun `CTX_BIN="$CARGO_TARGET_DIR/debug/ctx" just test` and the focused
  suites, then fold this task's work into one task-scoped commit.

## Explicitly excluded (spilled to 0261, not cells here)
- Reconnect-delay parity after rejected projections.
- Simultaneous two-version center process coverage.
- Symmetric shared-index versioning redesign (legacy table version vs v2
  projection marker).
- Regression coverage beyond the behaviors named above.
"""
validation = """
