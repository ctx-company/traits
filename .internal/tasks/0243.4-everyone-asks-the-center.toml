schema-version = "0.2"
key = "0243.4"
title = "Everyone asks the center"
status = "done"
raised = "2026-08-24"
content = """
This plan separates GOALS from APPROACH. The GOALS section is binding: each
Done-when names an observable outcome and the existing command that decides
it. The APPROACH section is the architect's suggested route — file names,
symbols, reading order, proof mechanics. Deviate from any of it whenever a goal
requires it and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

Owner ruling (2026-08-26) rescoped this task to a closed remainder after the
bulk landed in merge d02eb425: every designated read surface (stats, tasks,
merge lookup, story, dispatch preflight, run liveness) is center-backed and
fail-loud, and the dashboard runs a live center subscription with a delta
reducer instead of filesystem inventory polling.

That remainder has since landed too. Commit c48331996 ("0243.4: complete
center reader regressions") is an ancestor of HEAD and carries every
production edit, regression, and process proof the remainder named. Reading
the code at HEAD finds no missing cell. What was never done is board closure:
this task still sits open with no closure evidence, and no gate has been run
against the current tree to prove the landed work is still green under the
commits that followed it.

Two later commits moved the baseline underneath the original plan text, so the
old step list is now actively wrong in two places:
- 763351a66 replaced the global projection-failure counter with a row-keyed
  map so concurrent dashboard projections cannot consume another test's
  injection.
- Task 0262 (done) made the center index metadata-only: `CenterRow` no longer
  carries a full session, `Get` reopens one selected ledger on demand, and
  marker-gated migration drops the old payload table.

So this task is a verification-and-closure task. Prove the named behaviors are
present and their gates green at HEAD, then close. Do not reimplement landed
behavior, and do not restore the superseded internals named under Excluded.
Anything discovered beyond the named behaviors is board material for 0261, not
a cell here.
"""
scope = """
## GOALS — binding

1. The dashboard's center-subscription behaviors are present and green:
   transactional projection with rollback and reconnect after a rejected
   candidate, parked-Ask presentation surviving a `Command::Render` whose
   `center::get` fails, and selected-preview refresh scoped to the changed
   ledger rather than fired on every snapshot. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`.

2. The center's index migration and read-avoidance behaviors are present and
   green: a genuine version-1 index is migrated by a current open, and an
   unchanged fingerprint over an unreadable ledger provokes no ledger read.
   Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io center`.

3. The tasks reports derive from one shared center mapping and fail loud:
   proposals and reconcile agree with the pure derivations over the same rows,
   an explicitly unreadable row leaks into neither, and a failed center request
   returns `Err` rather than a partial report. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib tasks`.

4. The real-process center proofs are present and green: readers served from
   an unreadable ledger both warm and after a kill/restart against the same
   persisted index, and a subscription that recovers across a center kill
   without any client request. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`.

5. The per-round workspace gate is green at the tree this task closes on.
   Decided by `CTX_BIN="$CARGO_TARGET_DIR/debug/ctx" just test`.

6. The task closes on evidence, not on history. If goals 1-5 pass unmodified,
   this task closes with no source edit and no new commit — c48331996 is
   already its task-scoped commit and must not be duplicated. A source edit is
   justified only by a gate that is actually red, and then only far enough to
   make that gate green.

## APPROACH — suggested route, not a boundary

### Read before running
The behaviors below already exist. Read them to know what a red gate would
mean, and to recognise a stale-plan repair from a real defect.

- Event-scoped preview: `DashboardSnapshot::changed_ledger_path:
  Option<String>` (modules/cli/src/app/dashboard.rs:1189), `None` from
  `from_state`; `State::apply_snapshot` (~dashboard.rs:1559) stays the only
  selection owner and clears the preview on identity change or on an event for
  the selected ledger.
- Projection-failure seam: `FAIL_CENTER_PROJECTION_ROWS`
  (dashboard.rs:1208), keyed by worker thread name, ledger path and title,
  consumed before any projection mutation (~dashboard.rs:1600).
- Transactional projection in modules/cli/src/app/dashboard/worker.rs: a
  candidate is projected before the accepted `rows` map is assigned, a
  rejection breaks the stream so reconnect resends a complete snapshot, and
  `last_snapshot_at` advances only on an accepted projection.
- Changed-path plumbing: `apply_delta` (worker.rs:420) returns the affected
  ledger path, carried through `emit_subscription_snapshot` (worker.rs:533)
  and `emit_snapshot` (worker.rs:569); complete snapshots and cached-row
  renders pass `None`. An `ActivityLine` delta returns its row's path while
  leaving the row map untouched.
- Parked-Ask presentation: failed enrichment restores the previous phase and
  `append_phase_warning` deduplicates the trait-source warning
  (~dashboard.rs:1699).
- Center shape after 0262: `CenterRow` (modules/io/src/center.rs:1437) holds
  summary, fingerprint metadata and liveness only. The v1 migration fixture is
  at center.rs:5787; the zero-read proof is
  `unchanged_unreadable_fingerprint_does_not_parse` (center.rs:5941).
- Tasks reuse: `session_facts_from_center` (modules/cli/src/app/tasks.rs:326)
  and `proposals_from_center` (tasks.rs:355) both go through
  `readable_center_rows` (tasks.rs:382); there is no second mapping in the
  handlers.
- Process-proof harness: `write_repo_scoped_completed_ledger`
  (modules/cli/tests/proof_center.rs:262) and the shared assertion
  `assert_center_backed_readers_serve` (proof_center.rs:298), used by both
  proofs at proof_center.rs:3565 and 3639.
- `.internal/briefs/0243.4-ledger-read-call-sites.md` is the governing
  exception map for direct ledger reads. Whole-store parsing belongs to the
  center; writer/mutation paths and explicit selected-detail paths may reopen
  one authoritative ledger.

### Run order
Run goals 1-4's commands first — they are the narrow filters and name the
defect fastest — then goal 5's workspace gate. `just test` deliberately does
not compile the integration proof binaries, so the `proof_center` command must
be run separately; it is not implied by the gate.

### If a gate is red
Diagnose before editing. Distinguish a real defect from a fixture that a later
commit invalidated, and from cross-test interference — the projection seam is
row-keyed precisely because a global counter was consumed by unrelated
concurrent projections. Reuse the harness above rather than adding a parallel
one. Keep any repair scoped to the red gate and fold it into one commit with a
clean worktree; existing merge, fixup and rescope commits are baseline history
and are never rewritten.

## Excluded — not cells here

- Restoring superseded internals: the global `FAIL_CENTER_PROJECTIONS`
  counter, `CenterRow.session` / any assertion that a center row carries a
  full session, and the old unchanged-row predicate that required a cached
  session or explicit parse error. 0262's metadata-only index is binding.
- Removing the worker's bounded 500 ms reconnect delay. It was deferred out of
  this task once and is now baseline.
- A second implementation commit reapplying c48331996's edits.
- Subscription, dashboard or compatibility coverage beyond the behaviors named
  in the goals, and any redesign of the two-marker
  `center_meta` / `center_projection_meta` scheme — that is 0261's.
- Center-mediated spawn, pause, resume and interrupt — that is 0243.5's.
- Any grep-driven deletion of the bounded, declared one-ledger reopens in the
  brief; merge's pre-mutation read is required, not a fallback.
- Any direct-reader fallback when a center request fails. Stats, tasks, merge
  lookup and the dashboard inventory stay fail-loud.
"""
validation = """
## Watch
- Ground against HEAD, not against this task's original scope or against merge
  d02eb425. Most of what the old plan text demanded is landed; re-deriving it
  is the failure mode that held this task at closure/discovery equilibrium for
  20+ rounds once already.
- Landed history is not a green gate. Run the commands; do not infer their
  result from c48331996 being an ancestor.
- The excluded list is an owner ceiling. A finding in an excluded area is
  advisory board material for 0261, never a blocker cell.
- A green run here means no source edit. Do not manufacture one.

## Done when
- Dashboard subscription behaviors green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`
  exits 0 and reports a non-zero passing count.
- Center migration and read-avoidance behaviors green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io center` exits 0 and
  reports a non-zero passing count.
- Tasks parity and fail-loud behaviors green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib tasks` exits 0
  and reports a non-zero passing count.
- Center process proofs green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`
  exits 0 and reports a non-zero passing count.
- Per-round workspace gate green:
  `CTX_BIN="$CARGO_TARGET_DIR/debug/ctx" just test` exits 0.
- `git status --short` is empty. If every gate above passed unmodified, no new
  commit exists and the work summary says so; if a gate was red, exactly one
  task-scoped commit holds the repair and the summary names which gate it
  fixed.
"""

