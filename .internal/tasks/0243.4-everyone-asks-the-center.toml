- `center_kill_and_restart_recovers_a_subscription_without_a_client_request`:
  subscribe first, drain the empty snapshot, THEN write the ledger and assert
  an `Appeared` delta arrives with no client request (real-process delta-only
  appearance); SIGKILL the center and assert the subscription reports its
  disconnect (degraded mode); resubscribe so arbitration restarts a center from
  the persisted index and assert the fresh snapshot again carries the row.

