### 8. proof_center.rs — the two missing process proofs
Reuse `SENTINEL_TEST_LOCK`, `scratch`, `CenterEnvironment`, `spawn_sentinel`,
`await_socket`, `await_socket_removal`, `ChildGuard`, `PROCESS_DEADLINE`,
`controlled_command`, `git_init`. Add one fixture helper
`fn write_repo_scoped_completed_ledger(root: &std::path::Path, repo_key: &str) -> Utf8PathBuf`
writing a completed, task-bound session (merged terminal merge frame with
`landed=<sha>` evidence) at `<runs_root>/<repo_key>/session.json`, because the
CLI readers scope by `ctx_traits_io::state::current_repo_key()`; the test
derives that key with
`ctx_traits_io::state::repo_key(&ctx_traits_io::state::canonical_repo_root(<repo>)?)`.
- `center_backed_readers_serve_an_unreadable_ledger_warm_and_after_restart`:
  git_init a scratch repo, write a board task under it, spawn the sentinel,
  take one warm `center::list` snapshot, then `chmod 000` the ledger. A
  top-level `fn` in this file (not a closure), placed beside the two proofs —
  `fn assert_center_backed_readers_serve(socket: &std::path::Path, index: &std::path::Path, runs_root: &std::path::Path, repo: &std::path::Path, home: &std::path::Path, board: &std::path::Path, task_key: &str, run_id: &str, ledger_path: &camino::Utf8Path)`
  returning `()` and panicking on any failure — then runs, with
  `controlled_command(std::path::Path::new(env!("CARGO_BIN_EXE_ctx")), &args, repo, home)`
  overridden by `.env` onto this sentinel's `socket`/`index`/`runs_root` (and
  `CTX_CENTER_EXECUTABLE` pointed at a non-existent path so nothing can spawn
  a second center): `ctx traits internal stats --json` (exit 0, total-runs 1),
  `ctx tasks proposals --board <board> --json` (exit 0, ok envelope naming
  `task_key`), `ctx tasks reconcile --board <board> --json` (exit 0, ok
  envelope), an in-process `center::subscribe(None)` drained
  SnapshotStart..SnapshotEnd carrying the row with a readable summary (the
  dashboard's only session source), and `ctx traits merge <run_id>` asserted to
  fail NAMING `ledger_path` rather than with "center records no run-session
  ledger" —
  isolating the center lookup from the deliberate post-lookup authoritative
  reopen. Then SIGKILL the sentinel, restart one against the same persisted
  index with the ledger still at mode 000, and call the same helper again
