schema-version = "0.2"
key = "0119"
title = "`@ctx-traits/rust`: the compiler is the reviewer"
status = "ready"
raised = "2026-08-05"
content = """


A Rust fix loop whose blockers come from `cargo` rather than from a model is the
strongest demo the product has — every finding carries file, line, column and a
compiler-assigned code, so "did the run fix it?" is answered by re-running the
compiler instead of asking an agent. It is also the honest completion of a package
whose README already claims it: `@ctx-traits/rust` is two role factories against a
README promising a complete trait package.

The parsing constraint is the whole design: `cargo check --message-format json` and
`cargo clippy --message-format json` emit NDJSON (226 lines on this repo, mostly
`compiler-artifact`/`build-script-executed` noise). A typed command-output slot
expects exactly one JSON value, so raw cargo output arrives in a `schema:text` slot
and is reduced by a DETERMINISTIC step, never a model: keep only
`reason == "compiler-message"`, project to `{file, line, column, code, level,
message}` from `message.spans[0]` + `message.code.code`, drop anything without a
primary span, dedupe keyed on `(file, line, column, code)` (the same diagnostic is
emitted once per compilation unit), sort deterministically → byte-identical
evidence across runs.

FORMAT SETTLED (measured 2026-07-28, do not re-litigate): plain
`--message-format json`. `json-diagnostic-short` is 27% smaller but shortens only
`rendered` (which the reduce step discards anyway); the projected form is ~90 bytes
per diagnostic — 8% of raw. The real capture-size lever is `--quiet` plus dropping
non-`compiler-message` lines.

The loop: `capture (check + clippy) → reduce → for-each over diagnostics or one
batched fix frame → re-run both → exit when the reduced list is empty`, bounded,
`onExhausted: "block"`. Ship as BOTH a standalone trait and an exported sequence
factory the toolkit (0118) can compose: the factory takes the cargo invocation and
round budget; the trait is the thin package wiring it to a worker seat.

"""
validation = """
## Watch

- The diagnostic SHAPE is not fully stable across toolchains — pin what is read
  (`reason`, `message.code.code`, `message.level`,
  `message.spans[].{file_name,line_start,column_start}`) and degrade loudly on an
  unrecognized shape; a fix loop that quietly ignores diagnostics is worse than none.
- `cargo` exits non-zero when diagnostics exist — the capture step's success
  criterion must NOT be exit 0 (that is what `sequence.check`'s exit-code verdict is
  for, separately from capture).
- Clippy and check overlap: dedup across both, one loop.
- `--fix` at most as a pre-pass whose result is re-captured, never as the fix step.
- Warnings-vs-errors is a stated policy: default errors-block / warnings-report,
  caller can widen.

## Done when

One command reduces a real check+clippy run on this repo into a deduplicated,
deterministically ordered diagnostic list; a bounded loop drives an agent through
them and exits only when a fresh capture is clean; the machinery is reachable as
both trait and factory; a run that cannot clear every diagnostic blocks rather than
committing.

Full original contract: `archived/board/execution-plan.md` (Group 134, P553).
"""
