content = '''
This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

The window's own chrome is the last piece of the Sessions frame. `tokens.md`
fixes it: the core screens are 1440×900 with `cornerRadius 10` and clip, and
the title bar is h 36 at padding [0,20], carrying 12px traffic lights, a 34×18
logo box, and the screen menu at gap 18 in sans 12.5 (`tokens.md:71-76`). The
export measures the same frame as a clipped column — title bar first, then one
flex-filling `Columns` row holding rail · main · preview — with the title bar
spanning 100% width, centring its children, and pushing the menu right through
a flex spacer; the bar takes no fill of its own and sits on `canvas #0c0d10`
(`reference/sessions.html:24-93`). The window frame is the one place a corner
radius is legal; inside the canvas there is none (`grammar.md:31-37`).

The menu lists the screens that exist. Today that is exactly one entry —
`Sessions`, `text-bright` because it is current (`screens/sessions.md:7-10`).
The export already renders Traits, Tasks and Config beside it
(`reference/sessions.html:57-83`); parent Correction 1 resolves that as export
drift, and each later screen adds its own entry together with the switch that
reaches it (`0266.1`, `0267.1`, `0268.1`, `0269.1` each depend on this task).
`screens/merges.md:12-15` fixes where the Merges entry lands when it arrives,
between Tasks and Config, so the eventual order is Sessions · Traits · Tasks ·
Merges · Config. This cut renders the frame, the traffic controls and the
one-entry menu row — without a mark, per Correction 1 — and establishes the
menu as the surface those entries slot into. An entry without a screen behind it is a promise the board
has not paid for.

## Five corrections to the draft this plan replaces

**Correction 1 — the draft's Done-when contradicts the parent on the logo, and
this plan resolves it to one outcome: the mark is omitted.** The draft required
"the 34×18 logo" unconditionally. Every reference file points a
background-image at `ctx-logo-white.png` (`reference/sessions.html:45-51` and
the equivalent lines in the other four exports), and `git ls-files
"*ctx-logo*"` plus a repository-wide logo/icon glob match nothing: no bytes, no
source shape, no provenance, no licence. Parent Correction 1 permits either a
real tracked asset inside the desktop project or omission plus a reported gap,
and forbids assuming that URL resolves (`0265:23-31`). No approved mark exists
to ship: `0260` owns bundle, icon and packaging work but supplies no title-bar
asset today (`0260:7-23`), and inventing, generating or approximating one is
excluded. So this plan takes the grounded branch and binds it — the bar renders
no mark, and the missing asset is raised as an explicit `0260` finding. Goal 3
carries that single outcome; there is no alternative acceptance path, and a
mark appearing anyway does not satisfy this task. If an owner-approved tracked
mark surfaces before this cell runs, that is an owner correction against this
plan, raised as a finding rather than resolved inside the cell.

**Correction 2 — this cut extends the landed Sessions frame; it does not
assemble a second one.** `0265.8` mounts the rail into the Sessions composition
and explicitly excludes the title bar and screen menu (`0265.8:150-173`,
`:353-366`, `:437-455`). The frame is assembled once: the title bar is added
above the existing rail/main/preview row inside the composition that already
exists, spanning the whole body width. Standing up a parallel root, window,
mount, asset path or theme path beside the landed one is the failure mode, not
a shortcut.

**Correction 3 — native versus custom controls is a discovery decision, and
the three colours are not tokens.** `tokens.md` names no traffic-light colour;
the export hardcodes the macOS values close `#ff5f57`, minimize `#febc2e`, zoom
`#28c840` as 12px circles with 8px between them, the cluster measuring 52px
followed by a 16px gap (`reference/sessions.html:28-50`;
`reference/traits.html:28-50` expresses the same geometry). Parent Correction 3
requires that, if custom controls are drawn rather than the platform's being
used, those three values get one grounded home beside the token set, marked as
platform chrome rather than as tokens, and never appear as call-site literals
(`0265:40-42`). Which branch applies depends on what `0256.1` landed for window
decoration and on the locked gpui revision's window options — inspect both
before choosing, and never display native chrome and a second hand-drawn bar at
once. The artifacts require these controls to *render*; they define no click
behaviour for hand-drawn ones, so this plan claims none and none is invented.

**Correction 4 — "no radius inside the canvas" cannot become a blanket grep.**
Rule 3 forbids corner radii inside the canvas and reserves radius 10 for the
window frame (`grammar.md:31-37`), but rule 4's status markers are 5px
*ellipses* (`grammar.md:39-43`) and the traffic controls are circles that are
title chrome rather than canvas content. A check or review pass that bans every
circular or rounded primitive would red on the sanctioned outcome. What is
forbidden is a rounded *rectangular* element inside the canvas — a chip, pill,
card or bordered menu item — and that is what the closing read looks for.

**Correction 5 — the draft had no bounded review.** Parent `0265` and the
rewritten sibling `0265.8` both close on one targeted repair-and-rerun round
with a hard stop (`0265:137-141`; `0265.8:559-566`). Goal 10 states the same
finite condition here, so the cell cannot iterate indefinitely against a visual
contract.

## Grounded at HEAD 2265ed19e

Nothing this task edits exists yet. The top level holds no desktop or app
crate; no `Cargo.toml` in the tree names gpui; root `Cargo.toml:3-12` lists
only the existing workspace members and excludes only `packages/cdk`; root
`Cargo.lock` contains no `name = "gpui"`; and `cargo metadata --no-deps`
returns only the existing workspace packages. There is no gpui source tree, no
desktop manifest, no desktop lockfile, no desktop asset directory, no tracked
font or logo file, no README or `Justfile` desktop command and no desktop CI
lane. `0256.1` — still `ready` — is the task that establishes the standalone
project, its manifest and lockfile, window setup, asset mechanism and
documented non-interactive build-and-test commands (`0256.1:7-17`).

Every desktop path, module name, component name, symbol, signature, gpui API,
window-options call, asset call, locked gpui revision and command named below
is therefore a guess to be replaced by discovery against what `0256.1`,
`0265.1`, `0265.3` and `0265.8` actually landed. Binding them here would be
fabrication. What is checkable today, and the only board coverage this task can
honestly declare, is that the workspace stayed gpui-free and its per-round gate
stayed green.

The desktop lane is nonetheless guaranteed to exist *when this cell runs*, and
the guarantee is a code fact rather than a hope. An open leaf derives `Blocked`
while any `depends-on` target is not `Done`
(`modules/core/src/task/graph.rs:129-172`); this task depends on `0265.8`,
which depends on `0265.1` and `0265.3`, and `0265.1` depends on all five `0256`
leaves including `0256.1`. So this task cannot dispatch until the standalone
shell, the accepted Sessions model, the token/font entry point, the Sessions
mount, the bottom bar and the rail have all landed. The first act of this cell
is to locate that lane's documented non-interactive command and record it
verbatim in the work summary. If no such command is found, the prerequisite
chain has not in fact landed: stop and report that, rather than substituting a
workspace command for rendered-behaviour proof. It is deliberately *not*
declared as a `[[checks]]` entry, because a check must exist in the repository
at the moment the plan is written and this one does not.

What that lane will actually cover is equally unknown here, so this plan
promises none of it and pins no coverage mechanics onto it. **Rendered-frame
evidence**, the phrase the goals below use, means two things taken together:
the landed lane's documented command, run as it exists and exiting 0; and, for
every outcome that command does not itself decide, the run's own observation of
the running frame and the composed element tree, by whatever means that harness
already supports. Which of the two decided which outcome, and the mechanics
used, are named in the work summary. Adding coverage inside the landed harness
is fine where a goal needs it; standing up a second validation lane beside it
is not.

Two further facts constrain the frame. First, the artifacts do not decide
whether 1440×900 is OS outer bounds or gpui content bounds, whether the window
is resizable, or which concrete clipping API applies — bind that geometry to
the landed shell's actual window/content model rather than to an API guessed
here. Second, the existing TUI `Screen` enum is CLI-private, holds
`Sessions, Traits, Merges, Trust, Tasks` in a different order with no `Config`
(`modules/cli/src/app/dashboard.rs:167-195`), and the parent forbids importing
CLI-private rendering types into the desktop (`0265:61-63`). Desktop navigation
stays desktop-local and contains only screens that exist.
