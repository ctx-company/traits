schema-version = "0.2"
key = "0255.2"
title = "Dispatch assigned agent intent"
status = "ready"
raised = "2026-08-24"
content = """
## Outcome
Resolve effective intent for an ordinary ready frame from root `Trait.intent` plus only the canonical `Agent` selected by `SequenceFrame.assigned_agent.role`. For each of `require`, `focus`, `avoid`, and `block`, retain surviving root items in root order, remove a root item when the assigned agent repeats its canonical `GuidanceItem.id` in that same group, and append the assigned agent's items in agent source order. The replacement therefore renders at the agent layer position and uses the agent occurrence's summary/description. Declarations for every unassigned agent are inert.

After replacement, reject an effective canonical ID present in both `require` and `avoid` when either surviving occurrence is assigned-agent-sourced. Keep accepting and rendering a collision whose effective require and avoid occurrences are both root-sourced. Compare IDs only; do not infer contradiction from prose or include `focus`/`block` in this rule. An absent assignment means root-only guidance. A present assigned role missing from the loaded canonical trait is an explicit composition error.

Static ready preview, live CLI dispatch, and live MCP dispatch must consume the same resolved `intent_items`. Preserve the complete existing CLI prompt bytes when the assigned agent has no non-empty intent: both `Agent.intent = None` and `Agent.intent = Some(Intent::default())` are legacy-compatible cases. Preserve existing MCP onboarding bytes unless the assigned agent contributes at least one item across `require`, `focus`, `avoid`, or `block`; only in that scoped case does MCP receive the same categorized `<intent>` envelope as CLI. Keep `Agent.system` outside categorized intent and on its existing CLI/MCP system-prompt argument channel.

## Touched files
The complete implementation allowlist is `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/frame_prompt.rs`, and new `modules/cli/tests/proof_agent_intent_dispatch.rs`. No other file may be edited, generated, renamed, or removed.

## Symbol contract
In `modules/core/src/model_view/compile.rs`, add private `#[derive(Clone, Copy, PartialEq, Eq)] enum IntentItemSource { Root, AssignedAgent }`. Add exact helper `fn effective_intent_groups<'a>(root: Option<&'a crate::r#trait::Intent>, assigned: &'a crate::r#trait::Intent) -> crate::Result<[(&'static str, Vec<(IntentItemSource, &'a GuidanceItem)>); 4]>`. Pair root and assigned groups by their existing fixed order, filter root IDs repeated by the assigned list in that group, append all assigned items, and retain `IntentItemSource` on every survivor. Check effective `require` against effective `avoid` in avoid order; when an intersection contains `AssignedAgent` on either side, return `crate::r#trait::Error::invalid_field("intent", format!("effective guidance id {id:?} cannot appear in both require and avoid when assigned-agent intent participates"))` converted to `crate::Error`. Do not add an error variant.

Change exact signature `pub fn frame_guidance(trait_ref: &Trait) -> Option<FrameGuidance>` to `pub fn frame_guidance(trait_ref: &Trait, assigned_agent: Option<&crate::r#trait::Agent>) -> crate::Result<Option<FrameGuidance>>`. When `assigned_agent.and_then(|agent| agent.intent.as_ref())` is absent or its `require`, `focus`, `avoid`, and `block` lists are all empty, execute the current root `format_intent` path unchanged. Only when that selected intent contains at least one item, call `effective_intent_groups` and pass each selected `GuidanceItem` reference into existing `format_guidance_group` with `GuidanceTag::GroupNamed`, `intent_builtin`, and the existing warning/normalization/finding accumulators. Do not duplicate `format_guidance_item_element`, `resolve_guidance_directive`, `sanitize_model_text`, or `leaf_element`. Keep root behavior rendering through unchanged `format_behavior`. Return `Ok(None)` only when both rendered strings are empty and otherwise `Ok(Some(FrameGuidance { intent, behavior }))`.

Add these exact tests to the existing test module in `modules/core/src/model_view/compile.rs`: `fn frame_guidance_merges_assigned_agent_intent_in_layer_order()`, `fn frame_guidance_replaces_root_item_at_agent_layer_with_agent_directive()`, `fn frame_guidance_excludes_unselected_agent_intent()`, `fn frame_guidance_rejects_cross_layer_require_avoid_collision()`, `fn frame_guidance_accepts_root_only_require_avoid_collision()`, and `fn frame_guidance_is_byte_identical_when_assigned_agent_has_no_intent()`. The order test must cover all four groups; the replacement test must assert one occurrence and the agent-local directive; the refusal test must assert the deterministic conflicting ID. The byte-identity test must compare root-only rendering against both an assigned agent with `intent: None` and an assigned agent with `intent: Some(Intent::default())`, using non-empty root intent so either regression is observable.

In `modules/core/src/model_view/compile_sections.rs`, keep exact test signature `fn agent_intent_is_static_agents_only_and_keeps_system_separate()` and change only its root frame-guidance call to pass `None` and unwrap `crate::Result<Option<FrameGuidance>>` in two explicit steps. Do not change `format_agents`, `format_agent_element`, static `source="agent:<id>"` rendering, or any production symbol in this file.

In `modules/cli/src/app/frame_prompt.rs`, add exact helper `fn assigned_agent<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::Agent>>`. Return `Ok(None)` for no assignment; otherwise compare `agent.id` to the exact `frame.assigned_agent.role` and return the one canonical declaration. If absent, return `crate::Error::Command` with a message naming both the assigned role and loaded trait ID. Do not fall back to declaration order.

Edit `pub(crate) struct ResolvedFramePrompt` by adding exact field `pub(crate) assigned_agent_intent_participated: bool`. Keep exact signature `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>`. Resolve `assigned_agent(loaded, frame)?` once, pass that same declaration to changed `ctx_traits_core::model_view::frame_guidance`, derive `agent_identity` from that same declaration's sanitized description, and retain one effective `intent_items` string. Set `assigned_agent_intent_participated` to true exactly when the selected declaration's intent contains at least one item across `require`, `focus`, `avoid`, or `block`; both `None` and `Some(Intent::default())` must set it to false. Remove private `fn frame_agent_identity(loaded: &ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> String`; this is the only removed symbol in the task.

Add exact helper `fn intent_block(intent_items: &str) -> String` in `modules/cli/src/app/frame_prompt.rs`. It must own the current byte shape from `<intent>
` through `</intent>

`, call unchanged `fn intent_spec_block() -> String`, and indent the already-effective item string once. Keep exact signature `pub(crate) fn frame_prompt(context: &ResolvedFramePrompt, schema: &Value, correction: Option<&str>) -> String` and replace only its inline construction with `intent_block`, retaining its existing non-empty guard and exact bytes. Keep exact signature `pub(crate) fn mcp_frame_prompt(session: &str, session_store: Option<&str>, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, context: &ResolvedFramePrompt, role: &str, harness_id: &str) -> String`; insert `intent_block(&context.intent_items)` before `Resolved prompt instructions:` only when `assigned_agent_intent_participated` is true and `intent_items` is non-empty. Structure the empty insertion so legacy MCP bytes are identical.

Add `modules/cli/tests/proof_agent_intent_dispatch.rs` with one exact public-path test `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. The test may define fixtures and closures only inside that function; add no shared support API. In an isolated `support::ScratchRoot`, author a schema `0.6` trait whose guided unassigned agent is declared before the actually assigned guided agent. Drive `ctx traits internal preview --file <fixture> --json`, a real custom CLI harness capture, and a real custom harness configured with MCP transport. Extract the complete `<intent>...</intent>` block from all three captures and assert equality, root-before-agent ordering, same-group replacement count and agent text, and absence of unassigned guidance. Configure CLI and MCP `system-prompt-flag`, capture argv, and assert the unique assigned `Agent.system` text is the flag value and absent from every intent block. In the same test, run a cross-layer require/avoid fixture and assert failure before a harness marker is created. Then use frozen literal pre-change oracles with non-empty root intent and a root-only require/avoid collision for both `intent: None` and present-but-empty assigned intent; assert exact preview, CLI, and MCP prompt bytes and successful acceptance in both cases. No symbols other than this test are added in the new file.
"""
scope = """
## Ordered work
1. Edit `modules/core/src/model_view/compile.rs` first. Add `IntentItemSource`, `effective_intent_groups`, the changed fallible `frame_guidance`, and the six exact `frame_guidance_*` tests. Keep both absent and present-but-empty assigned intent on the old renderer call so byte compatibility is structural, not recreated by a second renderer. Run the focused core command before proceeding.
2. Edit `modules/core/src/model_view/compile_sections.rs` second. Adjust only `agent_intent_is_static_agents_only_and_keeps_system_separate` for the new arguments and nested result; confirm its assertions still separate static declarations from runtime frame guidance.
3. Edit `modules/cli/src/app/frame_prompt.rs` third. Add `assigned_agent`, remove `frame_agent_identity`, resolve once in `resolved_frame_prompt`, add `ResolvedFramePrompt::assigned_agent_intent_participated` with the at-least-one-item predicate, and thread the selected declaration into core guidance and identity. Then add `intent_block` and use it from unchanged-signature `frame_prompt` and `mcp_frame_prompt`, preserving the empty MCP insertion exactly for both absent and present-but-empty assigned intent.
4. Add `modules/cli/tests/proof_agent_intent_dispatch.rs` fourth with only `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. Build test-owned scratch traits and custom capture harnesses inside the test. Use hard-coded pre-change prompt strings for the absent-intent and present-but-empty-intent root-collision oracles; do not generate expected strings by calling the implementation under test. Run the focused integration command.
5. Run `CARGO_TARGET_DIR=target just test-full`. Review the complete diff against the four-file allowlist and every outcome/exclusion. A failure or review finding permits at most two targeted repair-and-rerun rounds, changing files only in the same order when dependencies require it. Stop successfully only after focused tests and the landing gate exit 0 and the final review is clean; otherwise stop with the concrete remaining blocker.

## Reuse
`modules/core/src/model_view/compile.rs` remains the only effective-intent authority and the only directive renderer. Reuse unchanged `intent_groups`, `format_intent`, `format_guidance_group`, `format_guidance_item_element`, `resolve_guidance_directive`, `intent_builtin`, `sanitize_model_text`, and `leaf_element`; selection supplies references and never clones their rendering rules. Reuse `GuidanceItem.id` as the already-canonical slug; parsing, normalization, and local scoped validation remain in unchanged `modules/core/src/trait/guidance.rs` and `modules/core/src/trait/intent.rs`.

`modules/cli/src/app/frame_prompt.rs` remains the common consumer for unchanged callers in `modules/cli/src/app/preview.rs` and `modules/cli/src/app/drive.rs`. Reuse one `ResolvedFramePrompt.intent_items` value and one `intent_block`; do not render or resolve independently for preview, CLI, or MCP. Reuse `SequenceFrame.assigned_agent.role` as the assignment authority and the loaded trait's exact canonical declaration for both identity and intent.

The complete touched-file set remains `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/frame_prompt.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`.

## Exclusions
Do not edit `modules/cli/src/app/preview.rs` or `modules/cli/src/app/drive.rs` unless compilation proves a signature-only call-site change unavoidable; if that occurs, stop as a scope blocker rather than silently widening the allowlist. Do not add resolver logic to either file. Do not edit canonical schema, CDK, generated SDK files, procedure item types, `AgentRole`, persisted frame wire data, assignment scoring, readiness/transitions assignment, harness selection, behavior composition, prompt-scoped guidance, named/nested control flow, retries, persistent sessions, parallel siblings, or task files other than this one.

Do not select the first declaration, merge any unassigned agent, normalize IDs again, compare prose, reject root-only require/avoid collisions, or involve `focus`/`block` in contradiction detection. Do not alter static all-agent authoring output, `Report::behavior_text`, behavior rendering, root intent validation, or agent-local validation. Do not copy directive resolution, sanitization, intent specifications, or categorized-envelope formatting.

Do not add `intent` to `AgentRole`, serialize it into frames, route `Agent.system` through guidance, change `composed_system_prompt`, or alter CLI body fallback. Do not unconditionally add intent to MCP onboarding. Siblings `0255.3` through `0255.15` own agent behavior, prompt intent/behavior, nested control flow, retry refresh, persistent refresh, and parallel isolation; `0255.4` specifically owns assigned-agent behavior and `0255.5`/`0255.6` own prompt intent authoring/dispatch.
"""
validation = """
## Done when
1. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance` exits 0 with six matching tests from `modules/core/src/model_view/compile.rs`. They prove exact four-group root-agent order, same-group replacement at the agent position using agent-local text, selected-agent-only input, deterministic cross-layer require/avoid refusal naming the canonical ID, accepted root-only collision, and exact equality between root-only rendering and rendering with assigned agents whose intent is either absent or `Some(Intent::default())`. The byte-equality fixture has non-empty root intent so the present-but-empty case is observable. The signature-only adjustment in `modules/core/src/model_view/compile_sections.rs` remains covered by the landing gate.
2. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch` exits 0 with the one test in `modules/cli/tests/proof_agent_intent_dispatch.rs`. It proves static ready preview, a live custom CLI capture, and a live custom MCP-transport capture contain identical effective categorized intent; declaration order does not select the unassigned agent; replacement/order/text are exact; cross-layer contradiction fails before dispatch; assigned `system` remains only on the configured argument/channel; and frozen literal pre-change preview/CLI/MCP bytes remain unchanged for non-empty root intent with a root-only collision when assigned intent is absent and when it is present but empty.
3. `CARGO_TARGET_DIR=target just test-full` exits 0 after changes to `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/frame_prompt.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`. This is the required landing gate; do not claim the archived dependency's failed closure checks establish a green baseline.
4. Judgment review confirms the diff touches only `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/frame_prompt.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`; contains one core resolver, one canonical assigned-agent lookup, one effective item string, and one categorized intent-envelope helper; has no declaration-order selection, unassigned leakage, root-only byte change, duplicated renderer/resolver, or `system` channel change; and respects every exclusion above. This criterion intentionally has no fabricated automated check.

Run verification in this strict order: `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`, then `CARGO_TARGET_DIR=target just test-full`. Perform no more than two targeted repair-and-rerun rounds. Success requires all three commands to exit 0 and the substantive final review to pass; otherwise report the concrete remaining failure rather than marking the task complete.
"""

