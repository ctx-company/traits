schema-version = "0.2"
key = "0283.1"
title = "Notify and commit become typed runtime effects, not ctx-notify / git shell steps"
status = "ready"
raised = "2026-09-07"
content = """
Deferred follow-on to 0283 (the step-walk). The step-walk removes the worst of
the procedure's shell — the proof `sh -c`, the brief and proof-command
projections, the changed-files capture. What remains are the notify chain
(`ctx-notify begin/update/log/finish`) and the git commit steps
(stage-commit + final). Both are still the trait stitching shell commands, and
that is the thing that makes traits look like shell scripting around the API.

This task lifts them into first-class typed runtime EFFECTS: the trait declares
intent ("notify the owner of this verdict", "commit this stage") and core
executes it, reading the verdict/stage state directly — no argv, no ctx-notify,
no `git` step in the procedure.

## GOALS, binding

1. **Notification is a typed effect.** The trait declares a notification intent
   bound to the verdict/stage state; core emits it. No `ctx-notify` argv steps,
   no scribe digest projected into text slots for a command line.
   Excluded: any `ctx-notify` invocation in the generated canonical.

2. **Commit is a typed effect.** The trait declares that a done stage commits
   (and the final tree commits); core performs the commit and moves the task
   branch. No `git add`/`git commit`/`git status` steps in the procedure.
   Excluded: any `git` argv step in the generated canonical's mechanics.

3. **The procedure carries no shell in its own mechanics.** After this and
   0283, the only shell anywhere near a run is a seat running a genuine
   external tool inside its own judgment (e.g. the reviewer running a build to
   validate) — never a step the procedure emits.
"""
scope = """
## Decisions

- Design the effect mechanism in core/cdk once, generically, then adopt it in
  implement — but do NOT spread to other families until it is proven here
  (same staging rule as 0283).
- Open question for the design pass: whether an "effect" is a new sequence
  item kind the runtime executes, or a capability the runtime resolves from a
  declared intent on a slot. Settle before building.
"""
validation = """
## Done when

- The implement generated canonicals carry no `ctx-notify` and no `git` argv;
  notify and commit are declared as typed effects and executed by core.
- A live run still notifies the owner and commits stages as before, with the
  procedure itself free of shell.
"""

[relations]
parent = "0283"
depends-on = ["0283"]
