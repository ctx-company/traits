schema-version = "0.2"
key = "0255.3"
title = "Author and inspect agent behavior"
status = "ready"
raised = "2026-08-24"
content = """
## Outcome
Let trait authors attach behavior to direct agents, every built-in agent template, `seats(...)` results, and agents collected transitively through `.prompt(...)`. Lower additive `tone`, `method`, and `format` plus scalar `verbosity`, `directness`, `scope-control`, `initiative`, and `uncertainty` through the existing behavior normalizer into canonical schema-version `0.6` data. Validate the canonical declaration through the shared behavior authorities, emit its generated SDK type, and render every declared agent's behavior in the authoring-only `Agents` section with `source="agent:<id>"`.

Scoped behavior is legal only at schema `0.6`. A populated declaration is deterministic and digest-covered; a truly absent declaration remains omitted and preserves the existing canonical bytes. Empty authored behavior may remain a present schema-`0.6` declaration, matching empty agent intent. Agent `system` stays a separate standing-instruction field. Static rendering describes assigned and unassigned declarations but does not resolve assignments, change root behavior, or feed agent behavior into `Report::behavior_text` or `frame_guidance`.

The complete touched-file allowlist is `modules/core/src/trait/behavior.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`. No file may be created, renamed, removed, or edited outside this list, and `packages/cdk/src/generated.ts` may change only through `just sdk-generate`.

## Symbol contract
In `modules/core/src/trait/behavior.rs`, keep exact root entry point `pub fn validate_taxonomy(&self) -> crate::Result<()>`, changing it only to delegate to new private `fn validate_axes(&self, field_path: &str) -> crate::Result<()>` with `"behavior"`. Add exact crate-visible entry point `pub(crate) fn validate_scoped(&self, field_path: &str) -> crate::Result<()>`, also delegating to `validate_axes`. `validate_axes` must call unchanged `validate_guidance_list` for `tone`, `method`, and `format`, and unchanged `validate_guidance_option` for `verbosity`, `directness`, `scope_control`, `initiative`, and `uncertainty`, forming paths from the supplied prefix. It adds no parsing, vocabulary, contradiction rule, or cross-axis duplicate rule.

In `modules/core/src/trait/agent.rs`, change the import to `use super::{Behavior, Intent};`. Add exact `Agent` field `#[serde(default, skip_serializing_if = "Option::is_none")] pub behavior: Option<Behavior>` immediately after `intent`. Keep exact signature `pub fn instantiate_agent_template(template: &AgentTemplate, id: impl Into<String>, description: Option<String>, summary: Option<String>) -> Agent` and initialize `behavior: None`. Keep exact signature `pub fn validate_agents(agents: &[Agent], schema_version: &str) -> crate::Result<()>`; when behavior is present, reject versions before `0.6` at `agent[index].behavior`, otherwise call `behavior.validate_scoped(&format!("agent[{i}].behavior"))`. Preserve all intent, system, session, ID, description, and summary behavior. Keep exact test helper `fn agent(system: Option<&str>) -> Agent` and initialize `behavior: None` so the existing literal remains the byte-compatibility authority.

Add exact Rust tests in `modules/core/src/trait/agent.rs`: `fn agent_behavior_decodes_all_axes_from_builtin_custom_and_rich_forms()`, `fn agent_behavior_requires_schema_0_6()`, `fn agent_behavior_reports_shared_validation_failures_at_indexed_paths()`, `fn agent_behavior_rejects_arrays_on_scalar_axes_during_decode()`, and `fn agent_behavior_is_deterministic_and_absence_preserves_legacy_bytes()`. Across these tests, exercise each of the three additive and five scalar axes in built-in, custom, and rich forms; malformed IDs, blank and second-person text, indexed additive duplicates, every pre-`0.6` version, scalar arrays, exact indexed paths, repeat canonical serialization, and the unchanged absent-agent JSON bytes. Do not weaken or rename existing intent/system tests.

In `modules/core/src/model_view/compile.rs`, change exact private signature to `fn format_behavior(behavior: &crate::r#trait::Behavior, trait_id: &str, tag: GuidanceTag, field_prefix: &str, source: Option<&str>, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String`. Build every additive and scalar field path from `field_prefix`, and pass `source` unchanged into existing `format_guidance_group` and `format_guidance_item_element`. In exact existing symbols `pub fn compile_model_view_with_evidence(trait_ref: &Trait, profile: ExtendedRenderProfile, source_digest: Option<&str>, resource_plan: &Plan) -> Report` and `pub fn frame_guidance(trait_ref: &Trait) -> Option<FrameGuidance>`, change only root call sites to pass `"behavior"` and `None`. Do not edit `behavior_axes`, `behavior_builtin`, directive lookup, sanitization, leaf formatting, `FrameGuidance`, or `frame_guidance` semantics.

In `modules/core/src/model_view/compile_sections.rs`, keep exact signature `fn format_agent_element(trait_ref: &Trait, index: usize, agent: &crate::r#trait::agent::Agent, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String`. After the existing agent body and source-attributed intent, append non-empty behavior by calling shared `format_behavior` with `GuidanceTag::Namespaced`, field prefix `agent[index].behavior`, and source `agent:<id>`. Add exact separate test `fn agent_behavior_is_static_agents_only_and_keeps_system_separate()` in the existing test module. It must cover assigned and unassigned declarations, additive and scalar output, source attribution, local text containing a forged `</behavior>` close tag, separate `System:`, no active-agent claim, no leakage into `Report::behavior_text`, and root-only `frame_guidance`. Preserve exact existing test `fn agent_intent_is_static_agents_only_and_keeps_system_separate()` because ready sibling 0255.2 names it.

In `packages/cdk/src/agent.ts`, import type `Behavior` beside `Intent`; add exact optional members `readonly behavior?: Behavior;` to both `export interface AgentFields` and `export interface AgentTemplateFields`. Keep exact signature `function agentOf(fields: AgentFields, extraMeta: Parameters<typeof withDeclaration>[4] = {}): AgentHandle`, adding `behavior: normalizeBehavior(fields.behavior)` at its one declaration-lowering choke point. Keep exact signature `function agentTemplateOf(template: AgentTemplateDefinition, id: string, fields: AgentTemplateFields, extraMeta: Parameters<typeof withDeclaration>[4] = {}): AgentHandle`, forwarding behavior with `...(fields.behavior === undefined ? {} : { behavior: fields.behavior })` so exact-optional-property semantics never emit an undefined key. Add no other production symbol and do not edit `seats`, handles, functional registrars, or sequence code.

In `packages/cdk/src/trait.ts`, keep exact signature `export function assembleSingleTraitDraft(fields: TraitFields, baselineSchemaVersion: SchemaVersion = "0.5"): { readonly draft: CanonicalTraitDraft; readonly merged: ReturnType<typeof mergeDeclarationSets>; readonly diagnostics: readonly CdkDiagnostic[]; readonly sourceMap: SourceMap; }`. Extend only its merged-agent inference predicate so an own `intent` or own `behavior` key selects `"0.6"`; preserve explicit `fields["schema-version"]` precedence and the supplied baseline. Update the adjacent `SchemaVersion` documentation to name agent-local intent or behavior. Do not edit `packages/cdk/src/variant.ts`; its existing `NATIVE_VARIANT_SCHEMA_VERSION` argument already supports this transitive inference.

In generator-owned `packages/cdk/src/generated.ts`, the only accepted semantic output is exact optional member `readonly "behavior"?: CanonicalBehavior | undefined;` on existing `export type CanonicalAgent`. It must be produced by `just sdk-generate`, not manually edited. Any other generated change, including any change under `packages/config`, is a blocker.

In `packages/cdk/test/cdk.test.ts`, add behavior-focused cases under the existing agent-template coverage with exact titles `%s: normalizes declaration-only behavior`, `normalizes every behavior axis and guidance form on direct agents`, `normalizes agent behavior through seats without losing AgentHandle prompt usability`, `normalizes direct agent behavior and infers schema 0.6 only when it is present`, and `an explicit schema version takes precedence over agent-behavior inference`. Cover every built-in template, all eight axes, additive scalar-to-list normalization, built-in/custom/rich guidance, direct agents, `seats(...)`, passing the resulting `AgentHandle` to a prompt, explicit-version precedence, behavior-driven inference, and omission when behavior is absent. Keep existing `is byte-stable` and other intent-free/behavior-free fixture assertions unchanged so their literal files continue to prove legacy bytes without expanding the touched-file allowlist.

In `packages/cdk/test/functional.test.ts`, add exact test `a behavior-guided agent collected through .prompt is normalized and infers schema 0.6`, comparing a behavior-guided declaration reachable only through `.prompt(...)` with an otherwise equivalent ordinary declaration that stays at `0.5`. Extend, without creating another family assembly path, existing test `native variants infer 0.6 for guided transitively collected agents and retain 0.5 for ordinary leaves` with a behavior-guided native leaf; retain its intent-guided leaf and exact ordinary `0.5` JSON oracle. These tests must prove transitive ordinary/native collection rather than explicit top-level `agent` authoring.

No symbol is removed by this task. The only new production symbols are `Behavior::validate_scoped` and `Behavior::validate_axes`; all other production work extends the exact existing symbols and fields named above.
"""
scope = """
## Ordered work
1. Edit `modules/core/src/trait/behavior.rs` first. Add `validate_axes` and `validate_scoped`, and make unchanged-signature `validate_taxonomy` delegate with the root prefix. Reuse the two existing shared guidance validators for all eight axes.
2. Edit `modules/core/src/trait/agent.rs` second. Add `Agent.behavior`, initialize both direct Rust constructor sites, add schema gating and scoped validation, then add the five exact `agent_behavior_*` tests. Do not proceed until all direct `Agent` literals in this file initialize the field.
3. Edit `modules/core/src/model_view/compile.rs` third. Generalize only `format_behavior` with `field_prefix` and `source`, then update its two root call sites to `"behavior"` and `None`.
4. Edit `modules/core/src/model_view/compile_sections.rs` fourth. Append behavior after the existing body/intent in `format_agent_element`, and add `agent_behavior_is_static_agents_only_and_keeps_system_separate` without renaming or weakening the intent test.
5. Run `just sdk-generate` exactly once after the Rust schema edits. Inspect the diff immediately: retain only `CanonicalAgent.behavior` in `packages/cdk/src/generated.ts`; stop if the generator changes `packages/config/src/generated.ts` or any file outside the complete allowlist.
6. Edit `packages/cdk/src/agent.ts` sixth. Add the two typed fields, lower through unchanged `normalizeBehavior` in `agentOf`, and conditionally forward from `agentTemplateOf`.
7. Edit `packages/cdk/src/trait.ts` seventh. Widen only the merged-agent own-property inference predicate and its adjacent documentation; leave explicit versions and baseline flow intact.
8. Edit `packages/cdk/test/cdk.test.ts` eighth. Add the five named behavior cases while retaining stable fixture files and existing intent cases unchanged.
9. Edit `packages/cdk/test/functional.test.ts` ninth. Add the `.prompt(...)` ordinary case and extend the existing native intent-inference structure with behavior and ordinary leaves.
10. Run `pnpm --dir packages/cdk run test`, then `CARGO_TARGET_DIR=target just test`, in that order. Review the complete diff against every outcome, exact symbol contract, allowlist, generated-output restriction, and exclusion. A command failure or review finding permits at most two targeted repair-and-rerun rounds; keep repairs inside this same order where dependencies require it. Stop successfully only when both commands exit 0, `just test` confirms generated definitions are drift-free, and the substantive review is clean. Otherwise stop with the concrete remaining failure.

## Reuse
`modules/core/src/trait/behavior.rs` remains the only behavior validation authority. Reuse unchanged `GuidanceItemList`, `GuidanceItem`, `deserialize_optional_guidance_item`, `validate_guidance_list`, and `validate_guidance_option`; agent validation supplies only the scoped prefix. `modules/core/src/trait/agent.rs` reuses its established optional schema-gated `intent` path, `schema_version_at_least`, constructor defaults, and canonical serialization behavior.

`modules/core/src/model_view/compile.rs` remains the only behavior renderer. Reuse unchanged `behavior_axes`, `behavior_builtin`, `format_guidance_group`, `format_guidance_item_element`, `resolve_guidance_directive`, `sanitize_model_text`, and `leaf_element`. `modules/core/src/model_view/compile_sections.rs` supplies attribution and location only; it must not reproduce directive resolution or sanitization.

`packages/cdk/src/agent.ts` remains the sole agent-lowering choke point. Reuse unchanged `packages/cdk/src/normalize.ts::normalizeBehavior`; direct agents, all five templates, `seats(...)`, and `.prompt(...)` collection already converge on `agentOf`. `packages/cdk/src/trait.ts::assembleSingleTraitDraft` remains the single schema-inference authority, while unchanged `packages/cdk/src/variant.ts` continues to supply the native baseline. `just sdk-generate` remains the generated-type authority.

The complete touched-file set remains `modules/core/src/trait/behavior.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`.

## Exclusions
Do not edit `modules/core/src/trait/encoding.rs`, `modules/core/src/trait/mod.rs`, migration code, schema-version registration, `packages/cdk/src/normalize.ts`, `packages/cdk/src/variant.ts`, functional registrars, handles, `seats`, sequence code, prompt schema or prompt item types, CLI code, MCP code, transports, task siblings, fixture JSON, or any generated config file. Do not create, rename, remove, or edit any file outside `modules/core/src/trait/behavior.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`.

Do not add agent-specific guidance parsing, behavior vocabulary, representation, renderer, emitter, compatibility shim, schema version, migration, runtime resolver, assignment inference, contradiction rule, cross-axis duplicate check, categorized `system`, or manual generated-source edit. Do not alter directive lookup, sanitization, behavior axis definitions, root behavior output, `Report::behavior_text`, `frame_guidance`, runtime composition, assignment, preview/CLI/MCP dispatch, prompt-scoped intent, or prompt-scoped behavior. Sibling 0255.4 owns assigned-agent behavior resolution and dispatch; siblings 0255.5 and 0255.7 own prompt-scoped intent and behavior.
"""
validation = """
## Done when
