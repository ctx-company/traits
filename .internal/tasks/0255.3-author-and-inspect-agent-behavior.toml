2. `CARGO_TARGET_DIR=target just test` exits 0 after tests in `modules/core/src/trait/agent.rs` and `modules/core/src/model_view/compile_sections.rs` prove schema-`0.6` gating, all eight axes in built-in/custom/rich forms, scalar decode rejection, shared malformed/duplicate validation at indexed paths, deterministic populated canonical JSON, byte-neutral absence, assigned and unassigned static rendering, source attribution, sanitization, separate `system`, no active-agent claim, no `Report::behavior_text` leakage, and root-only frame guidance. The same gate's existing `just sdk-check` stage proves generator drift is absent after `modules/core/src/trait/behavior.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/model_view/compile.rs`, and `modules/core/src/model_view/compile_sections.rs` changes.
