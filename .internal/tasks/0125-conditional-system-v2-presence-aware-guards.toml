title = "Conditional system v2 remainder: fail-closed conditional binding"
status = "ready"
raised = "2026-08-05"
content = """


Re-verified against the tree 2026-08-10 — three quarters of the original scope
landed under schema-version 0.3 and this task now covers only the remainder.

**Landed (do not rebuild):**
- Presence conditions: `present`/`absent` with tri-state truth semantics
  (Matched/NotMatched/Unmeasurable) over optional ports and declared-optional
  fields — `modules/core/src/trait/condition.rs:112`, validation at
  `:1186-1310` (refuses presence over required ports/fields); CDK
  `condition.present`/`condition.absent`.
- Count-to-count comparison: `validate_count_threshold`
  (`condition.rs:1454-1499`) with a `CountOperand` RHS; CDK
  `condition.count(...)` chains.
- The check-polymorphism rider: loop `until`/`abort-if` accept a
  `sequence.check` step directly through the same `lowerCheckGuard` branch
  `check:` uses (`packages/cdk/src/sequence.ts:360-361`, `:1045-1049`).
  (Spelling note: the field is `abort-if` — `stop-if` never existed.)

**Remaining scope — conditional binding with FAIL-CLOSED semantics:** a cap or
constraint that is SUPPLIED by the caller but unmeasurable in the result must
DISCARD the candidate rather than pass it. `present` routes a boolean; it binds
nothing. Design the binding form (likely a guard modifier or a typed
keep-guard shape), with static validation that every referenced optional
field/port is declared optional.

Explicitly OUT (unchanged): arithmetic between arbitrary fields, ordered
folds/replay logic (stays in pinned scripts by design), any general canonical
expression language (standing house refusal).

"""
