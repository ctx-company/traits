schema-version = "0.2"
key = "0089"
title = "The `command` peer: anyone's backend, in either direction, with no Rust"
status = "ready"
raised = "2026-08-04"
content = """


Third slice of the peer arc. 0073 makes a subprocess a handoff backend; this makes the same
subprocess a correspondent a run can talk to and hear from.

"""
scope = """
## Decisions

- **One executor, two payloads.** The command *channel* (0073) and the command *peer* are the same
  subprocess contract — JSON on stdin, JSON on stdout, non-zero exit is a failure with stderr as the
  recorded reason — differing only in what the payload carries. Two implementations of a hundred-line
  contract is how they drift; build 0073's and give it a second payload type.
- **Direction is declared in config**, because a script cannot implement `capabilities()`.
  `tells = true` / `answers = true` alongside `wire`, `fidelity` and `budget-bytes`. Same doctrine as
  0073 and the harness registry: first-party variants ship compiled-in defaults a table merges over,
  `command` has none, so its table is required.
- **`deferred` is legal here and is the interesting case.** A script that files a ticket and exits
  without an answer parks the run with an open question, which is then answered by `ctx traits answer`
  — or, later, by the watcher in 0091. That is how a bespoke approval system integrates without us
  shipping an adapter for it.
- **No templating.** 0073's rule, unchanged: the script receives the full typed request and composes
  in a real language.
- **It runs with the user's privileges and we say so**, in the docs and in `doctor`. Unchanged from
  0073, and unchanged in being the precise gap 0074 exists to close.
- **The host still owns the request.** A command peer receives a rendered payload and structured
  state; it does not get the ledger, the worktree, or any other peer's secret.

## Scope

The `command` peer variant reusing 0073's executor and versioned envelope/receipt schemas with a
`ask` payload added; config-declared direction and shape with required fields; `resolve()`
checking the program exists and is executable; bounds via 0084; `--dry-run` printing argv,
environment keys and the stdin payload while executing nothing.

"""
validation = """
## Watch

- **Reply validation is not the script's job.** Whatever it prints is checked against the trait's
  declared reply schema before it becomes a slot value. A script is untrusted input like any other
  ingress (0088).
- The payload schema becomes a public contract the moment someone writes a script against it. Version
  it from the first commit — 0073 already says this, and now two payload types share the versioning.
- `--dry-run` must not execute the program, in either direction. A dry run that asks production is
  the exact failure `--dry-run` exists to prevent.
- Do not pass another peer's secrets into the environment.

## Done when

A user adds a correspondent with a config table and an executable, with no Rust and no rebuild; the
same executor serves the handoff channel and the peer; a script can be told things, can answer, or
both, as its table declares; a script that exits without an answer parks the run with an open
question; a reply failing the declared schema is refused; a hanging or oversized script is bounded and
recorded; and `--dry-run` prints the full invocation for both verbs while executing nothing.
"""

[relations]
depends-on = [
    "0087",
    "0073",
]
