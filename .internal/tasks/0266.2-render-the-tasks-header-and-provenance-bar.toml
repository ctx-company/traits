content = """
## Owner ruling 2026-09-01 (binding, supersedes conflicting text below)

`0266.1` closed done under the three-round review cap with its desktop half
unbuilt: `desktop/src/shell.rs` still renders the hardcoded zero-count Tasks
sections and `desktop/src/center_link.rs` has no served-board consumer. The
owner rules that THIS run lands that missing half as in-scope work: consume
`0266.1`'s landed served-board path over the existing center link (request,
result, freshness — the same patterns the Sessions screen uses), render the
real sections from served state, and build this task's chrome on top. Every
sentence below that forbids building the `0266.1` prerequisite privately, or
directs a park/summon when its desktop artifacts are absent, is satisfied by
this ruling — do not summon the owner about `0266.1` again. The served-board
model from `0266.1` (commit 38855280c) remains the sole board source; a
parallel or private board model stays forbidden.

This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it wherever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

This cut is the Tasks screen's chrome, sitting on the board answer `0266.1`
serves. It owns five things: the screen header — repository-named title over one
italic narrated summary — for this screen; the aggregate board digest that the
bar cites as provenance; the honest `synced` state word and its failure and
stale replacements; the one captured resolution instant that this bar and
`0266.5`'s preview footer both read; and the `new task` action rendered inert in
the bar's grammar.

It resolves almost nothing. The board resolution, its typed presence outcomes,
its sections, counts and join facts, and its freshness events are all `0266.1`'s
and arrive already answered. The reusable header is `0265.13`'s, the reusable
bottom bar, the semantic state presentation and the one `placeholders` module
are `0265.3`'s, the repository display-name projection is `0265.8`'s, and the
tokens and IBM Plex faces are `0265.1`'s. The one genuinely new shared value here
is the aggregate digest — and even that is a fold over per-document digests
`Board::load` already computed in the same walk (`task_files.rs:227`), not a
second read.

Everything else on this screen belongs to a sibling: the sections and rows
(`0266.1`), the row's right-hand state stack (`0266.6`), the action's behaviour
(`0266.3` creates the draft, `0266.8` binds the two together), the preview column
(`0266.4`, `0266.5`), and the TUI migration (`0266.7`).

## Nine corrections to the draft this plan replaces

**Correction 1 — the header is a component this task does not own, and the
dependency edge was missing.** `0265.13` extracts the reusable screen header —
title, the single italic summary at fixed width 560, the title-stack gap 5, the
top-right `∷` and the breadcrumb prohibition — explicitly because three later
screens consume it, and `0267.2`, `0268.2` and `0269.2` each carry an explicit
`0265.13` `depends-on` edge for exactly that reason. This task, the fourth
instance of the same leaf, carried only `0266.1`. Parent edges are not inherited
by children (`graph::derived_status`, `modules/core/src/task/graph.rs:115-177`),
and `0266.1`'s own chain — `0265.5` → `0265.3`, `0265.9` → `0265.8`, `0258` —
reaches the bar, the placeholders module and the repository name but never
reaches `0265.13`. Without the edge this task could dispatch before the header
existed and would then rebuild it privately, which is the duplication the three
sibling files already name a defect. The edge is added. The header is composed
here, never re-implemented.

**Correction 2 — the draft omitted `∷`, and the header is not optional about
it.** Grammar rule 6 puts `∷` in mono 14 `text-secondary`, wrapper padding
`[2,8]`, at the top right of a full-width `space-between` row
(`grammar.md:58-66`; `reference/tasks.html:277-291`). The draft's watch list
described the summary and the breadcrumb ban and never mentioned the glyph.
Composing `0265.13`'s header gets it for free; a hand-built title block would
silently drop it. This is one more reason the answer to Correction 1 is
composition.

**Correction 3 — "no fills, borders or icons" is a rule about the action, not
about the bar, and the draft's phrasing inverts it.** Grammar rule 8 gives the
bar itself a 1px `border-soft` and padding `[10,14]`, and the export confirms it
(`grammar.md:74-84`; `reference/tasks.html:715-717`). The ghost-text prohibition
applies to the *buttons* — `new task` is text, not a control with a fill, a
border or an icon. Read the draft's watch item literally and it produces a
borderless bar, which contradicts the rule it was quoting.

**Correction 4 — the `<sha>` is a fold, not a tree walk, and three plausible
alternatives are wrong.** `registry::compute_tree_digest`
(`modules/io/src/registry.rs:805-831`) is a real generic content-tree digest, but
calling it after the board resolution is a second traversal over a *different*
file set — it would include `board.toml`, which task loading explicitly excludes
(`task_files.rs:24-29,205-207`), and it would cover files the resolution never
accepted. `board_fingerprint` is a stat sweep of `(archived, name, mtime-seconds,
len)` that deliberately reads no contents (`task_files.rs:124-167`) — a change
detector, never provenance. `task_board_cache::BoardSnapshotRecord` is
explicitly discardable derived evidence that becomes `None` when missing,
unreadable, malformed or mismatched (`task_board_cache.rs:1-10,31-91`) — it can
never back a `synced` claim. And a Git object id such as `HEAD:.internal/tasks`
cannot name an uncommitted board at all, so the bar would claim `synced` at a
name the rows do not come from (`0266:52-55`). What is correct is cheap:
`Board::load` already computes `Digest::source(&text)` per first-wins document in
the same pass and hands back a `BTreeMap<String, String>` keyed by task key
(`task_files.rs:186-250`). A deterministic fold over those pairs in key order
names exactly the documents the rows came from and costs no second walk.

**Correction 5 — the artifacts disagree on the digest's displayed width, and the
draft did not notice.** `screens/tasks.md:24` says only `<sha>`; grammar rule 8's
example is eight hex characters (`81e5a394`, `grammar.md:83`); the export renders
seven (`81e5a39`, `reference/tasks.html:733`). The spec and grammar are content
authority and the export is measurement, so **eight** wins, and the width is
fixed here rather than left to the run. Separately, the displayed form is never
the identity: the served and shared value stays the full digest, because a
truncated hex string is collision-prone and a face that compares boards on seven
or eight characters is comparing nothing.

**Correction 6 — the summary's counts are a projection of the served partition,
and the artifacts leave three questions the draft would have let the renderer
answer by itself.** `screens/tasks.md:11-13` tags the numbers `data:` and only
the phrasing `placeholder:`, and gives exactly one example — seven, three, one,
one. It does not say what happens at zero or one, whether "three states" means
the three fixed sections or the populated ones, or whether "one live run, one
waiting on you" counts rows or runs. Left open, each face invents an answer and
they disagree. This plan fixes one derivation over `0266.1`'s served model
(goal 2) and requires the phrasing module to be total over zero, one and many.

**Correction 7 — the title's repository name is a served projection, and
`ctx-company/traits` is an illustration.** `0265.8` fixes the display name as a
pure total projection of `repo_key` and `repo_path`: split on `/`, drop empty
segments, take the final two joined by `/`, and fall back to `repo_key` verbatim
when fewer than two remain (`0265.8:194-215`). That same function feeds the rail
row, the rail footer and — here — the header title, so the three cannot disagree
about which repository is on screen. `CenterPublicRow` already carries both
fields (`center.rs:3778-3788`). The desktop must not derive repository identity
from `current_dir`; `state::repo_key` is a basename slug plus a path hash
(`modules/io/src/state.rs:149-160`) and a cwd-derived title would name a
plausible board the rows did not come from. The export's `ctx-company/traits` is
legitimate only as the expected output of a fixture path that projects to it.

**Correction 8 — `synced` is a claim about the current answer, and the current
loader cannot make it unaided.** `Board::load` treats a `read_dir` failure as no
entries (`task_files.rs:197-200`), so today an absent board, an unreadable board
and an empty board are one outcome, and `synced · 0 tasks` for a directory that
does not exist states a fact nobody established. `0266.1` owns making those three
typed and distinct; this cut consumes them and must not restore the flattening —
nor the TUI reader's `sync().unwrap_or_default()`, which erases a sync failure
outright (`dashboard.rs:6154`). The binding semantics: a clean, complete
resolution earns `synced`, and a legitimately empty board can be clean and
carries the digest of an empty document set; an absent or unreadable board cannot
be `synced` and has no digest; parse failures, duplicate keys and dangling edges
make the answer non-clean even when rows resolved; and a stale or rejected answer
keeps the previous complete model only behind an explicit marker and never
presents its old digest or old time as current.

**Correction 9 — the sync time is one captured instant with two consumers, not a
clock either of them reads.** Grammar rule 12 requires both the bar and the
preview footer to cite provenance, and `0266.5`'s footer renders
`.internal/tasks · synced <time>` from "the same center-side resolution the
bottom bar cites" (`0266.5:12,20`). That instant is captured on the center side
when a resolution completes successfully, travels in the answer, and updates only
when the answer updates. Formatting it for display is presentation and belongs to
each call site; reading a second clock, or ticking a timer to refresh it, is a
second reader wearing a different hat. The center's own two-second scan already
exists (`center.rs:65,3026-3038`) and `0266.1` attaches board freshness to it;
this cut adds no timer, no poll, no watcher and no request of its own.
