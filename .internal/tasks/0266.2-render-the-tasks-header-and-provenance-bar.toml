## GOALS — binding

Each goal names an observable outcome, what decides it, and what it excludes.
Where a goal names a file, a symbol or a proof mechanic, that naming lives in
APPROACH; what binds here is the outcome.

1. **The header is `0265.13`'s component, composed once, with the Tasks screen's
   data.** The Tasks main pane renders the reusable screen header above
   `0266.1`'s sections: title `tasks — <active repository display name>` in sans
   13 `text-heading`, exactly one italic narrated summary in sans 12
   `text-secondary` at fixed width 560, title-stack gap 5, `∷` in mono 14
   `text-secondary` with wrapper padding `[2,8]` at the top right of a full-width
   `space-between` row, and no breadcrumb anywhere on the screen (content
   Corrections 1 and 2; `grammar.md:58-66`; `screens/tasks.md:11-13`;
   `reference/tasks.html:259-291`). The repository name is `0265.8`'s
   `repo_display_name` projection over the served `repo_key`/`repo_path`, the same
   function the rail and its footer use (content Correction 7). With no active or
   usable repository scope, the Tasks answer fails visibly rather than titling a
   plausible board.
   Decided by rendered evidence in the desktop lane: the header present above the
   sections with the title, one summary line and the `∷`; the title naming the
   repository the served rows belong to, over at least a normal multi-segment
   path and a `repo_path` that forces the `repo_key` fallback; no breadcrumb
   anywhere; and the closing diff read showing the header markup is composed, not
   re-declared, and that no colour, size, spacing, family or padding literal
   appears at this call site.
   Excluded: a second header implementation, a Tasks-private title block, or any
   edit to `0265.13`'s owned region beyond passing it this screen's strings; a
   second Tasks main-pane composition — the pane's padding `[18,40,20,40]` and gap
   28 are already established (`tokens.md:79`; `reference/tasks.html:255-258`) and
   this cut inserts into it; a breadcrumb, a second summary line, a subtitle, an
   icon or a second `∷`; deriving the repository from `current_dir`,
   `Utf8Path::new(".")` or any filesystem probe; the export's literal
   `ctx-company/traits` as shipped data.

2. **The summary's counts are one fixed derivation over the served answer, and
   the phrasing is total.** Four numbers come from `0266.1`'s accepted served
   model and nothing else: **open** is the count of rows the served partition
   places in `In progress`, `Ready` and `Draft` together; **states** is how many
   of those three sections are non-empty, so a board whose seven open tasks are
   all ready reads as one state rather than three; **live** is the number of open
   *rows* whose served join fact is a live claiming run; **waiting** is the number
   of open *rows* whose served join fact is pending or awaiting-owner. Rows, not
   runs, so no task can contribute twice and no count can exceed **open** (content
   Correction 6). The sentence is produced by a single entry added to `0265.3`'s
   one `placeholders` module, which receives those four integers and owns only the
   wording; it is total and grammatical at zero, at one and at many, and no count
   literal is written into it.
   Decided by direct tests over the count derivation and the phrasing entry,
   proven by the declared `just test` check: a board with no open tasks; one open
   task in one section; open tasks spread across two of the three sections; open
   tasks in all three; exactly one live and exactly one waiting row; several of
   each; and none of either — asserting in every case that the four numbers match
   the served model and that the rendered sentence is grammatical. Plus rendered
   evidence that exactly one summary line appears and that it is the module's
   output.
   Excluded: any count computed from a fresh provider call, a filesystem read or a
   second projection of the board; counting joined runs rather than rows, or
   counting a task in two of the four numbers where the served join says one
   precedence outcome; a count literal, a spelled example number or the example
   sentence "Seven open across three states — one live run, one waiting on you."
   inlined anywhere; a second placeholders module or an inline placeholder string
   at the call site; closing a `data:` leaf as placeholder-served text; rendering
   the summary from cached, stale or last-accepted counts while the bar states
   failure.

3. **The board digest is a deterministic fold over the resolution's own
   per-document digests, computed once, shared.** One shared function folds the
   `(key, digest)` pairs the board resolution already produced — in key order —
   into a single content digest naming exactly the first-wins documents that
   resolution accepted (content Correction 4). It is stable across repeated
   resolutions of unchanged content; it changes when any accepted document's
   content changes, when a document is added, and when one is removed; it does not
   depend on directory iteration order; and a clean but empty document set yields
   a well-defined digest rather than an error or a blank. It is computed on the
   center's board-resolution path in the same pass that produced the rows, carried
   in the board answer, and consumed by the desktop as an opaque value.
   Decided by direct tests over the fold with scratch boards, proven by the
   declared io check — stability, content change, addition, removal, order
   independence, archived documents included exactly as the landed resolution
   includes them, and the empty-but-clean case — and by the declared
   `proof_center` check showing the same digest crossing the real socket in the
   same answer as the rows it describes.
   Excluded: a second directory walk, including `registry::compute_tree_digest`,
   after the resolution; `board_fingerprint` or any stat signature as the digest;
   `task_board_cache` as its source; any `git` invocation on this path, anywhere;
   computing or recomputing the digest in the desktop process; a digest over
   `board.toml`, over parse-failed documents, or over non-winning duplicate copies;
   serving per-document prose to make the digest checkable, which goal 6's bound
   forbids.

4. **The bar cites provenance in grammar rule 8's form, with an honest state
   word.** The Tasks pane ends in `0265.3`'s reusable bottom bar: full width,
   `space-between`, 1px `border-soft`, padding `[10,14]`, all text mono 11. On a
   clean, complete answer the left side is `synced` in `ok` followed by
   `· .internal/tasks @ <digest>` in `text-secondary`, where `<digest>` is the
   first **eight** hex characters of the served digest after its `sha256:` prefix
   is stripped, while the full digest remains the shared and served value (content
   Correction 5; `grammar.md:74-84`; `reference/tasks.html:715-742`). Every typed
   non-clean, stale, rejected or failed outcome replaces the `synced` claim
   visibly and atomically — state word, detail, digest and time change together,
   never a new state word beside an old digest — and follows the landed desktop
   failure idiom rather than one invented literal, preserving the typed error
   detail (content Correction 8).
   Decided by rendered evidence in the desktop lane: the clean case with the state
   word in `ok` and the eight-character digest projection; a legitimately empty but
   clean board still rendering `synced` with the empty-set digest; and each typed
   non-clean, absent, unreadable, stale and failed outcome the served answer can
   carry, rendering something other than `synced` and never showing a digest or
   time it cannot currently claim. Plus direct tests over the display projection,
   proven by the declared `just test` check, covering a full prefixed digest and
   inputs short enough to expose a panic or a silent pad.
   Excluded: `synced` as a static label, a default, or a state rendered while the
   answer is stale, rejected or failed; an empty or absent board answered as
   `0 tasks · synced`; a fabricated digest string, a placeholder digest or a blank
   where a digest cannot be established; the truncated form used as identity, for
   comparison, or as the value any other face receives; a second bottom-bar
   implementation or a Tasks-private bar; a borderless bar (content Correction 3);
   a fill, border, icon, radius or glyph outside `↰ ↳ → · ∷` anywhere in this
   chrome; light-column token values.

5. **`new task` renders inert in the bar's action grammar.** The right-hand side
   of the bar carries `new task` as the primary action in mono 11 `text-bright`,
   ghost text with no fill, no border and no icon (content Correction 3). It is
   rendered and not bound: this cut sends no create request, opens no modal,
   inserts no optimistic row and writes nothing.
   Decided by rendered evidence that the action is present, bright and in the
   bar's grammar, and by the closing diff read showing no create request, no
   handler, no modal, no optimistic insertion and no write path attached to it.
   Excluded: the creation capability and its typed refusal (`0266.3`); binding the
   action to it (`0266.8`); a disabled-looking treatment, a tooltip, a fill or a
   border added to signal inertness; a placeholder click handler that logs, no-ops
   visibly, or shows a "coming soon" string.

6. **One resolution instant, two consumers, no clock and no timer on the client.**
   The answer carries exactly one instant, captured on the center side when a
   resolution completes successfully. The bar's provenance and — later —
   `0266.5`'s preview footer both read that instant; formatting it for display is
