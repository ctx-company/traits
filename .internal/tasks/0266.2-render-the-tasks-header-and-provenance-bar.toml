## APPROACH — suggested route, not a boundary

### Discover before editing

Neither the desktop side nor the center's board capability exists at the HEAD
this plan was written against. `0266.1`, `0265.13`, `0265.3`, `0265.8`, `0265.9`,
`0265.5`, `0258` and the `0256` chain all land first. Read what landed; do not
carry a guess from this file into an edit.

- Find the desktop project from root `Cargo.toml`'s exclude list and the
  top-level listing, then its manifest, README, justfile or CI lane, for the
  documented non-interactive build-and-test command. Record it verbatim and run
  it once as a baseline before any edit. If no such lane exists, report an unmet
  prerequisite; `just test` is not a substitute and a parallel desktop harness is
  not invented.
- Read what `0266.1` actually served: whether the aggregate digest and the
  captured instant are already fields on its answer, and what its typed
  board-presence, non-clean, stale and failure outcomes are called. Extend that
  family; do not open a second one.
- Read `0265.13`'s header component signature, `0265.3`'s bar, semantic state
  presentation and `placeholders` module, `0265.8`'s `repo_display_name`, and
  `0256.5`/`0266.1`'s landed desktop failure idiom, before writing any chrome.

### Edit order

1. The shared digest fold in `modules/io/src/task_files.rs`, beside the landed
   board resolution, over the `digests` map `Board::load` already builds
   (`task_files.rs:186-250`) — goal 3's shared half, with its focused tests.
2. The board answer's digest and instant fields in `modules/io/src/center.rs`, on
   `0266.1`'s landed board request/result family, resolved and folded in the
   connection worker rather than the model owner (`center.rs:3278-3429` shows the
   shape) — goals 3 and 6's center halves.
3. The shared count derivation and the `placeholders` summary entry — goal 2 —
   placed so the phrasing is the module's and the counts are not.
4. The desktop header call site composing `0265.13` with the projected repository
   name and the composed summary — goal 1.
5. The desktop bar call site composing `0265.3` with the state word, the digest
   display projection and the inert action — goals 4 and 5.
6. The desktop lane's rendered evidence, then the focused proofs, then the
   declared checks.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like `fn board_digest(digests: &BTreeMap<String, String>) ->
Digest` in `ctx-traits-io` beside the landed resolution, hashing a canonical
ordered serialization of the pairs through `Digest::from_bytes`
(`modules/core/src/digest.rs:120-133`); an added `digest`/`resolved_at` pair on
`0266.1`'s board answer type; a pure
`board_summary_counts(sections, joins) -> (open, states, live, waiting)` beside
the landed section derivation; a `placeholders` entry shaped like
`board_summary(open, states, live, waiting) -> String`; and a display projection
shaped like `fn short_board_digest(digest: &str) -> String` taking eight
characters after the `sha256:` prefix. Note the prior art: `dashboard.rs:5533`
already has a CLI-private `short_digest` that strips the prefix and takes twelve
for trust-modal bodies. It is not the same projection and it is not reachable
from the desktop; if a shared prefix-stripping helper falls out cheaply, take it,
but do not build a general digest-formatting abstraction for two call sites with
different widths. Names, module paths and component signatures follow whatever
conventions the prerequisites established. The behaviours goals 1-7 fix are not
suggestions; where they live and what they are called are.

### What the focused proofs are expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- The digest fold over scratch boards: repeated resolution of unchanged content;
  a document's content edited; a document added; a document removed; the same
  document set discovered in a different order; archived documents per the landed
  resolution; a clean board with no documents.
- The typed outcomes as this chrome consumes them: absent board, unreadable
  board, empty-but-clean board, parse failure, duplicate key, dangling edge — each
  distinguishable, and only the clean cases carrying a digest.
- The count derivation over a served model with zero, one, two and three
  populated sections, and with zero, one and several live and waiting rows; the
  phrasing entry over each of those, checked for grammaticality rather than for a
  literal sentence.
- The display projection over a full `sha256:`-prefixed digest and over inputs
  short enough to expose a panic or a silent pad.
- Over the real socket: the digest and instant arriving in the same answer as the
  rows they describe, from a scratch repository; the instant advancing when the
  answer changes and not when it does not; the answer still within the wire bound.
- In the desktop lane: the header with title, one summary line and `∷`; the
  repository name over a multi-segment path and a fallback path; no breadcrumb;
  the clean bar with `synced` in `ok` and the eight-character digest; each
  non-clean, stale and failed outcome replacing it; the inert bright `new task`;
  and no fill, border, icon or radius on the action.

Tests use scratch boards, scratch repositories and arbitrary ids. No test may
depend on this repository's committed board content or write into it, and no
design example string — `ctx-company/traits`, `81e5a394`, `81e5a39`, or the
narrated summary sentence — is fixture authority except as the expected output of
a scratch input that legitimately produces it.

### Reuse points

`Board::load`'s per-document `digests` map (`task_files.rs:186-250`) as the one
walk the fold comes out of; `Digest::from_bytes`/`Digest::source`
(`modules/core/src/digest.rs:120-133`) as the hashing primitive; `0266.1`'s
landed board resolution, typed presence and cleanliness outcomes, served sections
and join facts as the sole source of every number and state word here;
`0265.13`'s screen header, `0265.3`'s bottom bar, semantic state presentation and
