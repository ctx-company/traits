schema-version = "0.2"
key = "0274"
title = "Stage 0 — reviewer-light substrate and the capped implement-quick experiment"
status = "draft"
raised = "2026-09-01"
content = """
Establish the bounded Stage 0 experiment for right-sizing review depth on simple UI
tasks, per .internal/brainstorms/smarter-trait-selection-behavior-where-ui-tasks-are-still-ge.md.
Today the implement trait family (.ctx/traits/authored/implement/, version 0.25.0) reviews
every change with a smart-seated reviewer in an unbounded loop (basic/complex), while the
quick variant has no review at all — just draft → implement → commit. Stage 0 builds the
substrate for a cheaper middle path and wires it into implement-quick as a live experiment:

- a reviewerLight role (reviewer template, separately configurable seat, model decided:
  haiku) plus a light-review step whose verdict contract hardens
  TasteOnlyBlocking: only contract-breaking findings block, taste/polish findings are recorded
  but never force another round;
- implement-quick extended with the diff baseline/capture steps it currently lacks and a
  capped loop (iterations: 3) of implement → capture diff → one reviewer-light round.

Stage 0 is the evidence source for Stage 1 (post-draft size triage in basic, a separate
slice): running selected UI cuts through implement:quick with the light reviewer validates
the decided haiku seat before basic routes anything to it.

Work items covered: reviewer-light-role-and-seat, light-review-step-nits-dont-block,
stage-0-implement-quick-experiment, trait-authoring-only-and-version-bump.
"""
scope = """
## Decisions
- Trait authoring plus seat configuration only: edits live in .ctx/traits/authored/implement/
  source/ and trait.toml. No Rust runtime changes, no dispatch_preflight changes, no toolkit
  severity-schema change (existing approve/revise verdict plus doctrine supplies that control).
- Dynamic model assignment IS role indirection: two declared reviewer roles with separate
  seats. Seats resolve once per run per role; mid-run re-seating machinery is explicitly
  parked and out of scope.
- The reviewer-light model is decided: haiku. Trait sources still carry no model — the seat
  resolves via machine-local seat config — and the quick experiment validates the choice.
- Only light-review approval counts as success. If the final permitted review still returns
  revise with blocking work, the run reports unresolved cap exhaustion; the cap never converts
  an unapproved result into approval and no synthetic approved verdict is ever produced.
- basic and complex variants are untouched in this charter; the no-ceiling standard loop is
  a standing ruling. Stage 1 triage/routing is a separate slice, not covered here.
- Dispatching the experiment itself (just implement-with implement:quick "<tasks>") is an
  owner step after landing, as is the gitignored .ctx/traits/runtime.toml seat entry.
"""
validation = """
## Watch
- Committed generated/*/index.toml canonicals and trait.lock are build outputs of
  ctx traits build — never hand-edited.
- No tests asserting on committed trait canonical content (no frozen-inventory proofs);
  for pure trait-package edits the existing gates are the proof.
- Prompts carry task doctrine only: format/schema/verdict conventions live in schema field
  descriptions, slot descriptions, and resources — never in prompt text.

## Done when
Every child task (0274.1, 0274.2) is closed and the stop condition holds: the implement
trait, landed through the trait-package recipe (just ts-build → ctx traits build implement)
with just test green, carries a reviewerLight role with its own seat (model decided:
haiku) and an implement-quick flow of
draft → diff baseline → capped (implement → capture diff → light review) × ≤3 →
commit tail, where light-review approval is the only success and exits the loop
immediately, the commit tail runs only after approval, and cap exhaustion with unresolved
blocking work is reported unresolved rather than approved — leaving the experiment
dispatchable by the owner with only a runtime.toml seat entry.
"""
