schema-version = "0.2"
key = "0255.4"
title = "Dispatch assigned agent behavior"
status = "ready"
raised = "2026-08-24"
content = """
## Outcome
Compose runtime behavior for an ordinary ready frame from root `Trait.behavior` plus only the canonical `Agent` already selected from `SequenceFrame.assigned_agent.role`. The additive axes are exactly `tone`, `method`, and `format`: for each axis, remove every root item whose already-canonical `GuidanceItem.id` occurs in the selected agent list, retain surviving root order, then append every selected-agent item in its source order. A repeated ID therefore renders once, with agent-local directive text, at the agent layer position. Compare canonical `Slug` values directly; do not normalize IDs again.

The scalar axes are exactly `verbosity`, `directness`, `scope-control`, `initiative`, and `uncertainty`: use the selected agent value when present and otherwise retain the root value. Differing scalar IDs are ordinary precedence, never a contradiction. A selected agent with `behavior: None` or `behavior: Some(Behavior::default())` does not participate and must take the existing root renderer path unchanged. With no assignment, behavior remains root-only; every unassigned declaration is inert. Agent behavior can participate when root behavior is absent.

Static ready preview, live CLI dispatch, and live MCP dispatch must consume the same effective `behavior_items` and the same categorized `<behavior>` block. Ordinary frame composition keeps its signature, ordering, information text, specifications, indentation, and bytes. MCP inserts categorized behavior after dependency-owned categorized intent only when selected-agent behavior participates and effective behavior is non-empty; otherwise its complete pre-task string remains unchanged. Keep `Agent.system` on its existing standing-instruction channel and out of categorized behavior.

## Touched files
The complete implementation allowlist is `modules/core/src/model_view/compile.rs`, `modules/cli/src/app/frame_prompt.rs`, and existing dependency proof `modules/cli/tests/proof_agent_intent_dispatch.rs`. No file may be created, renamed, removed, generated, or edited outside these three paths. In particular, no production edit is needed in `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/preview.rs`, or `modules/cli/src/app/drive.rs`.

## Dependency gate
Grounding was performed at clean HEAD `30b83718` without implementation edits. That baseline is not executable for this task: `Agent` has `intent` but no `behavior` (`modules/core/src/trait/agent.rs:92-124`); `frame_guidance` is infallible and root-only (`modules/core/src/model_view/compile.rs:523-544`); `resolved_frame_prompt` does root-only guidance resolution and a separate best-effort agent lookup (`modules/cli/src/app/frame_prompt.rs:463-512`); and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist.

Do not edit any implementation file until ready dependencies `0255.2` and `0255.3` are both present in the worktree. The required baseline is their joined contracts, including their overlapping `modules/core/src/model_view/compile.rs` and `modules/core/src/model_view/compile_sections.rs` changes, not either dependency's clean-HEAD signature in isolation. Confirm at minimum that `modules/cli/tests/proof_agent_intent_dispatch.rs` exists; `Agent` has `pub behavior: Option<Behavior>`; private `effective_intent_groups` exists; `frame_guidance(trait_ref, assigned_agent)` is fallible; `frame_prompt.rs::assigned_agent` performs exact canonical lookup; `ResolvedFramePrompt` has `assigned_agent_intent_participated`; `intent_block` owns intent envelope bytes; and scoped behavior validation/static agent behavior rendering from `0255.3` are present. If either dependency or any joined-state contract is absent, stop before edits and report that concrete blocker.

## Symbol contract
In `modules/core/src/model_view/compile.rs`, add exact private helper `fn layered_additive_guidance<'a, S: Copy>(root: &'a [GuidanceItem], scoped: &'a [GuidanceItem], root_source: S, scoped_source: S) -> Vec<(S, &'a GuidanceItem)>`. It must compare `GuidanceItem.id` directly, filter repeated IDs only from the root list, retain root order, and append all scoped items in source order. Edit dependency-owned exact helper `fn effective_intent_groups<'a>(root: Option<&'a crate::r#trait::Intent>, assigned: &'a crate::r#trait::Intent) -> crate::Result<[(&'static str, Vec<(IntentItemSource, &'a GuidanceItem)>); 4]>` only to delegate each repeated filter-and-append operation to `layered_additive_guidance` with `IntentItemSource::Root` and `IntentItemSource::AssignedAgent`. Preserve its effective-intent authority, source tracking, group order, contradiction rule, error text, and result type.

Add exact private helper `fn effective_behavior_axes<'a>(root: Option<&'a crate::r#trait::Behavior>, assigned: &'a crate::r#trait::Behavior) -> [(&'static str, Vec<&'a GuidanceItem>, bool); 8]`. Return axes in unchanged `behavior_axes` order. For `tone`, `method`, and `format`, call `layered_additive_guidance` and discard only its unit source marker after ordering; for `verbosity`, `directness`, `scope-control`, `initiative`, and `uncertainty`, select with `assigned.or(root)`. Do not scan declarations or accept an agent ID here: this helper receives only the one selected declaration's behavior.

Add exact private renderer `fn format_behavior_axes<'a>(axes: [(&'static str, Vec<&'a GuidanceItem>, bool); 8], trait_id: &str, tag: GuidanceTag, field_prefix: &str, source: Option<&str>, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String`. Move the loop from dependency-owned exact wrapper `fn format_behavior(behavior: &crate::r#trait::Behavior, trait_id: &str, tag: GuidanceTag, field_prefix: &str, source: Option<&str>, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String` into `format_behavior_axes`. Keep `format_behavior` as the static/root wrapper by passing `behavior_axes(behavior)` into the common renderer. Preserve field-prefix construction, source attribution, axis order, scalar handling, and exact rendered bytes.

Edit dependency-owned exact entry point `pub fn frame_guidance(trait_ref: &Trait, assigned_agent: Option<&crate::r#trait::Agent>) -> crate::Result<Option<FrameGuidance>>` only at behavior resolution. If `assigned_agent.and_then(|agent| agent.behavior.as_ref())` is absent or all three additive lists are empty and all five scalar options are absent, execute the existing root `format_behavior` call exactly. If selected behavior is populated, call `effective_behavior_axes(trait_ref.behavior.as_ref(), assigned_behavior)` and render it through `format_behavior_axes` with `GuidanceTag::GroupNamed`, field prefix `"behavior"`, and source `None`. Preserve dependency-owned intent resolution and all intent errors unchanged; return `Ok(None)` only when both effective rendered strings are empty.

Add these exact tests to the existing test module in `modules/core/src/model_view/compile.rs`: `fn frame_guidance_assigned_agent_behavior_merges_additive_axes_in_layer_order()`, `fn frame_guidance_assigned_agent_behavior_replaces_additive_items_at_agent_layer()`, `fn frame_guidance_assigned_agent_behavior_applies_scalar_precedence_and_preserves_omitted_axes()`, `fn frame_guidance_assigned_agent_behavior_excludes_unselected_declarations()`, and `fn frame_guidance_assigned_agent_behavior_is_byte_identical_when_absent_or_empty()`. Together they must cover all three additive axes, all five scalar axes, deterministic surviving-root-before-agent order, a repeated additive ID rendered exactly once with agent-local directive text, successful differing scalar IDs, omitted agent axes retaining root values, populated selected behavior with no root behavior, and absence of every unassigned marker. The byte test must use non-empty root behavior as its oracle and assert exact equality for root-only guidance, a selected agent with `behavior: None`, and a selected agent with `behavior: Some(Behavior::default())`.

In `modules/cli/src/app/frame_prompt.rs`, edit exact type `pub(crate) struct ResolvedFramePrompt` by adding field `pub(crate) assigned_agent_behavior_participated: bool`. Edit unchanged-signature resolver `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` to derive this flag from the same canonical declaration returned by dependency-owned `fn assigned_agent<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::Agent>>`. Resolve that declaration once; do not perform a behavior-specific lookup. The flag is true exactly when selected `Agent.behavior` has a non-empty `tone`, `method`, or `format` list or a present `verbosity`, `directness`, `scope_control`, `initiative`, or `uncertainty` value. `None`, `Some(Behavior::default())`, and no selected agent set it false. Pass the same declaration to `frame_guidance` and preserve dependency-owned intent participation and identity behavior.

Add exact helper `fn behavior_block(behavior_items: &str) -> String`. Move the existing `frame_prompt` byte shape from `<behavior>
` through `</behavior>

` into this helper, retaining the exact info text, unchanged `fn behavior_spec_block(items: &str) -> String`, one indentation pass, and every byte. Edit unchanged-signature `pub(crate) fn frame_prompt(context: &ResolvedFramePrompt, schema: &Value, correction: Option<&str>) -> String` only to replace its inline non-empty behavior construction with `behavior_block(&context.behavior_items)` in the same position.

Edit unchanged-signature `pub(crate) fn mcp_frame_prompt(session: &str, session_store: Option<&str>, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, context: &ResolvedFramePrompt, role: &str, harness_id: &str) -> String` so dependency-owned categorized intent is followed by `behavior_block(&context.behavior_items)` only when `context.assigned_agent_behavior_participated` is true and `context.behavior_items` is non-empty. The behavior block must precede `Resolved prompt instructions:` to match ordinary intent-before-behavior ordering. Structure the false branch as an empty insertion so MCP bytes are exactly pre-task bytes when behavior does not participate.

In existing `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only exact test `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`; add no second test, capture suite, or support API. Extend its one real scratch trait/custom harness setup with a behavior-only assigned-agent scenario that has no assigned-agent intent. Capture ordinary `internal preview --json`, a real custom CLI dispatch, and a real MCP-transport dispatch; extract each complete `<behavior>...</behavior>` block and assert byte equality, root-before-agent additive order, one replacement occurrence with agent-local text, every scalar override, omitted-root-axis retention, and absence of unassigned markers. Keep dependency-owned `Agent.system` assertions and additionally prove the unique system text is absent from every behavior block while remaining on the existing CLI and MCP system-prompt argument channels.

Within that same public test, add frozen literal pre-task preview, CLI, and MCP prompt oracles for both a selected agent with behavior absent and one with behavior present-but-empty, using non-empty root behavior. Preview and CLI must retain the exact root behavior block; MCP must retain the exact absence of categorized behavior. Expected strings must be literals independent of `frame_prompt`, `mcp_frame_prompt`, `behavior_block`, or any implementation under test.

No production or test symbol is removed by this task. New production symbols are only `layered_additive_guidance`, `effective_behavior_axes`, `format_behavior_axes`, `ResolvedFramePrompt::assigned_agent_behavior_participated`, and `behavior_block`; the five named core tests are the only new test symbols. Every other named symbol is edited or reused with the exact signature above.
"""
scope = """
## Ordered work
1. Run the dependency preflight before any edit. Verify the joined `0255.2`/`0255.3` state described above, including the existing proof file and both dependencies' overlapping core changes. Stop without modifying implementation if any required contract is absent.
2. Edit `modules/core/src/model_view/compile.rs` first. Extract `layered_additive_guidance`, make `effective_intent_groups` delegate without changing semantics, add `effective_behavior_axes`, extract `format_behavior_axes`, keep `format_behavior` as its root/static wrapper, and extend only the behavior branch of fallible `frame_guidance`. Add the five exact `frame_guidance_assigned_agent_behavior_*` tests. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_assigned_agent_behavior` and do not proceed unless all five tests pass.
3. Edit `modules/cli/src/app/frame_prompt.rs` second. Add `ResolvedFramePrompt::assigned_agent_behavior_participated`, derive it while reusing the one dependency-owned `assigned_agent` result in `resolved_frame_prompt`, add `behavior_block`, replace only the ordinary prompt's inline behavior block, and conditionally insert the same block into MCP after intent. Do not change either public(crate) composer signature or any caller.
4. Edit existing `modules/cli/tests/proof_agent_intent_dispatch.rs` third. Extend only `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible` with behavior-only preview/CLI/MCP captures, channel-separation assertions, and frozen absent/empty behavior oracles; reuse its existing scratch root, custom CLI/MCP harnesses, capture flow, and fixture scaffolding. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch` and require exactly its one test to pass.
5. Run `CARGO_TARGET_DIR=target just test-full`. Then inspect `git diff -- modules/core/src/model_view/compile.rs modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs` substantively against the three-file allowlist, all eight axes, replacement/order semantics, no-root behavior, no-participation byte oracles, one resolver, one renderer, MCP condition/order, unassigned exclusion, and `Agent.system` separation.
6. A focused command failure, landing-gate failure, or review finding permits at most two targeted repair-and-rerun rounds. Repair only the three allowlisted files and preserve their edit order when a core contract feeds CLI/tests. After each repair, rerun the affected focused command and then every later command in the strict verification order. Stop successfully only when both focused commands and the landing gate exit 0 and the final substantive review is clean; otherwise stop with the concrete remaining blocker.

## Reuse
`modules/core/src/model_view/compile.rs` remains the only effective intent/behavior authority and directive renderer. Reuse dependency-owned `effective_intent_groups` and its `IntentItemSource` tracking. Reuse unchanged `behavior_axes`, `format_guidance_group`, `format_guidance_item_element`, `resolve_guidance_directive`, `behavior_builtin`, `sanitize_model_text`, and `leaf_element`; selection passes references into those authorities and never copies their rules. Reuse `GuidanceItem.id` as the canonical `Slug`, and leave parsing, normalization, duplicate validation, and `Behavior::validate_scoped` in their existing trait modules.

`modules/cli/src/app/frame_prompt.rs` remains the common composer used unchanged by static preview (`modules/cli/src/app/preview.rs`), session preview, live CLI, and live MCP (`modules/cli/src/app/drive.rs`). Reuse dependency-owned `assigned_agent` once for identity, intent, and behavior; one `ResolvedFramePrompt.behavior_items` value; unchanged `behavior_spec_block`; and one `behavior_block`. Reuse the one existing public capture harness and test in `modules/cli/tests/proof_agent_intent_dispatch.rs`; do not recreate transport plumbing.

The complete touched-file set remains `modules/core/src/model_view/compile.rs`, `modules/cli/src/app/frame_prompt.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`.

## Exclusions
Do not edit schema, CDK, generated SDK files, behavior decoding or validation, static agent rendering, readiness, assignment, `AgentRole`, `SequenceFrame`, persisted wire data, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/preview.rs`, `modules/cli/src/app/drive.rs`, transport selection, retry/session logic, prompt-scoped guidance, `Report::behavior_text`, or any task file other than this one. If joined dependencies make a signature-only edit outside the three-file allowlist appear necessary, stop as a scope blocker rather than widening the task.

Do not scan all agent declarations in core, select by declaration order, resolve the selected agent twice, merge unassigned behavior, normalize canonical IDs again, treat scalar differences as contradictions, emit duplicate axis directives, duplicate rendering/sanitization/specification helpers, or route `Agent.system` through categorized behavior. Do not add behavior to `AgentRole`, frames, or persisted data. Do not change dependency-owned intent semantics, errors, participation condition, or intent-before-behavior order.

Static `Agents` output remains all-agent authoring inspection with `source="agent:<id>"`; runtime output remains root plus only the selected agent. Root `Report::behavior_text` remains root-only. CLI system delivery remains through `harness_argv`/`composed_system_prompt`, and MCP system delivery remains through `mcp_harness_argv`; neither transport path changes.
"""
validation = """
## Done when
1. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_assigned_agent_behavior` exits 0 with the five named tests in `modules/core/src/model_view/compile.rs`. They prove all three additive and five scalar axes, deterministic root-agent ordering, same-axis replacement rendered once with agent-local text, scalar precedence without contradiction, omitted-axis root retention, selected behavior without root behavior, unassigned exclusion, and exact root-output equality for selected behavior absent and present-but-empty using a non-empty root oracle.
2. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch` exits 0 with the single extended `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible` test in `modules/cli/tests/proof_agent_intent_dispatch.rs`. It proves byte-identical categorized behavior across ordinary preview, real custom CLI, and real MCP dispatch for behavior-only participation; additive ordering/replacement, all scalar outcomes, unassigned exclusion, and system-channel separation; and frozen literal preview/CLI/MCP compatibility for selected behavior absent and present-but-empty with non-empty root behavior.
3. `CARGO_TARGET_DIR=target just test-full` exits 0 after changes only to `modules/core/src/model_view/compile.rs`, `modules/cli/src/app/frame_prompt.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`. This is the landing gate covering generated drift, formatting, TypeScript checks/tests, Clippy, workspace builds, library tests, and integration proofs.
4. Review `git diff -- modules/core/src/model_view/compile.rs modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs` and confirm the complete diff stays within the three-file allowlist; uses one shared additive helper and one behavior renderer; derives behavior participation from the already-selected canonical agent; covers all eight axes and no-root behavior; preserves absent/empty ordinary and MCP byte oracles; inserts MCP intent before behavior only under the behavior-participation condition; excludes unassigned declarations; keeps intent behavior unchanged; and keeps `Agent.system` out of behavior. This judgment criterion intentionally has no `[[checks]]` entry because the command presents evidence but cannot encode the substantive verdict in its exit status.

Run verification in this strict order: `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_assigned_agent_behavior`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`, then `CARGO_TARGET_DIR=target just test-full`, followed by the stated diff review. Permit no more than two targeted repair-and-rerun rounds. Success requires both focused commands, the landing gate, and final review to pass; otherwise report the concrete remaining blocker instead of marking the task complete.
"""

