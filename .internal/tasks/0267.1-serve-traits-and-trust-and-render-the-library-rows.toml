key = "0267.1"
title = "Serve traits and trust and render the library rows"
status = "ready"
raised = "2026-08-29"
content = '''
Teach the center to answer one repository's authored trait library — inventory, trust states, variants and lock provenance — and render the Traits screen's section and rows from that answer. One cut, because the rendering is what proves the capability and the capability is what makes the rendering honest.

Today the library is reachable in-process only. `load_traits_and_trust` (`modules/cli/src/app/dashboard.rs:2418-2445`) calls `dashboard_trait_inventory` and then `build_trust_rows`, and the assembly beneath it — `ResolvedTraitEntry`, `TraitInventoryRow`, `resolve_trait_inventory`, `DashboardTraitRow` (`modules/cli/src/app/lifecycle_reporting.rs:1509-1740`) — is CLI-private. A separate desktop binary reaches none of it, and an inventory walk, trust parse or lock reader written for the desktop would be the capability-in-one-face defect the plan document forbids, even over identical bytes. So this cut extracts the pure assembly into shared core/IO, gives it an explicit repository scope, extends the center protocol with a typed library capability, and renders the `Authored — N` section from the served answer. Moving the TUI's two projections onto the same answer is `0267.5`, inside this same charter.

Five grounded corrections the draft this file replaces did not carry.

**The single-trust-read premise is false at this HEAD, so this is an improvement and not a preservation.** The scan claim holds; the read claim does not. Every resolved member reaches `push_resolved_trait_row`, which calls `lifecycle::resolve_named` (`lifecycle_reporting.rs:1625-1677`), which calls `resolve_trust_verdict_for_trait`, which calls `trust::read_store` (`modules/io/src/lifecycle.rs:85-116`) — one store read per member. After those N reads `build_trust_rows` reads the store again (`dashboard.rs:2621-2624`), and a selected Traits preview reads it a third time through `read_store().unwrap_or_default()`, which silently turns a read error into an empty document (`dashboard.rs:3737-3750`). HEAD is N+1 reads for list assembly. This cut loads one `trust::Document` per resolution and threads it through every verdict and both projections; a run that "preserves the existing property" preserves N+1 reads. `build_trust_rows_from` (`dashboard.rs:2626-2717`) is already the pure document-taking half and shows the shape. `trust::read_store` is the right primitive — missing store yields an empty document, malformed TOML and invalid sequence evidence fail (`modules/io/src/trust.rs:497-524,691-713`) — and `read_store_with_sequences` is not, because it may write legacy evidence back (`trust.rs:527-535`) and this capability is read-only.

**Inventory is bound to the calling process's cwd; the center is machine-wide.** `InventoryContext::discover` resolves through `state::discover_invocation_root` and `repo_root_for_relative_paths_from` (`modules/io/src/inventory.rs:64-81`). That is correct for a one-shot CLI and wrong as the only constructor for a daemon serving many repositories, and no explicit-root constructor exists at HEAD. The capability takes an explicit repository scope and refuses an unknown or unusable one rather than answering from whatever cwd the center or the desktop inherited. The scope must resolve for a repository with no run row, so joining a session row is not sufficient; `CenterPublicRow.repo_key`/`repo_path` (`modules/io/src/center.rs:3778-3788`), the machine checkout index (`state.rs:470-557`) and `state::canonical_repo_root`/`repo_key` (`state.rs:128-160`) are the existing identity evidence.

**A source-only package has no decoded prose, and none may be invented for it.** `discovery::trait_authoring_packages` yields exactly `{trait_id, source_path}` (`modules/io/src/discovery.rs:63-119`), and `ctx traits list` already appends such rows for authored packages absent from protocol inventory (`lifecycle_reporting.rs:1845-1879`). There is no `Trait`, so no `description` and no `effective_summary()` exist to render. The parent requires the row and forbids fabricated leaves, and both hold: the row's description position is derived from the typed source-only state and the package's own authored source path — the only two facts HEAD has — never from procedure topology, never from the reference export, and never from a decoded document that does not exist. This is not an owner-level gap: the row is renderable from real evidence, and the trust position carries the state word `source-only`.

**Unreadable rows discard the tier they came from, which would corrupt the `Authored` projection.** `TraitInventoryRow::Unreadable` carries only id/path/error and `dashboard_trait_inventory` fills `origin: None` for it (`lifecycle_reporting.rs:1541-1551,1724-1735`), and repo-authored winners are exactly the `origin = None` rows (`lifecycle_reporting.rs:1570-1578`). Deriving the desktop's `Authored` section from `origin = None` over today's shape would file every unreadable vendored, user-global and built-in package under this repository's authored library. The extracted unreadable arm carries its tier/origin. In the same region, family detection swallows read errors with `.ok().flatten()` (`lifecycle_reporting.rs:1588-1597`), so a malformed `[family]` table silently degrades into a standalone row; in a fail-loud resolution that must be a typed failure of that package, not a quiet reshape of it.

**The family aggregate has no defined precedence once `moved` and `unreadable` are reachable.** `aggregate_trust_label` (`modules/cli/src/app/trust_story.rs:185-212`) covers verified/blocked/partial/unreviewed over three verdict strings; `TrustClass` adds moved-approval, moved-block and orphaned (`trust_story.rs:15-87`); neither defines what a family reads as when one member is moved or unreadable. Leaving that to each renderer is how a family reads flatly trusted while a member is not. This cut fixes the precedence once, in the typed mapping, and tests it.
'''
scope = '''
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected files, symbols, signatures, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or matcher observes it is the run's call.

## Decisions

- **In scope**: one shared, repository-scoped resolution of the authored trait library — tier inventory, per-member trust verdicts from one loaded trust document, family membership and variant keys, source-only and unreadable rows, the conservative family aggregate with its typed word mapping, and the lock provenance value — extracted into shared core/IO out of CLI-private code; the typed center protocol extension that serves it with event-driven freshness; the desktop's `Traits` menu entry and switch; and the `Authored — N` section with its dotless rows rendered from the served answer.

- **The parent's corrections bind.** `0267`'s content corrections 1-6 and 9-12 govern this leaf; where this file restates one it does not narrow it.

- **This leaf owns the provenance resolution** (`0267` Correction 4), despite `0267.2`'s stale wording. `0267.2`'s bar and `0267.4`'s footer each consume one immutable served value; neither recomputes it.

- **The desktop reads no manifest, family table, trust store, lockfile or `git`.** It asks the center over the socket the window already holds, and it imports no CLI-private type. Where the semantics it needs live in `ctx-traits-cli`, they are extracted and shared; a copy in gpui is a defect even when it compiles.

- **Existing faces keep their wording byte-for-byte.** `ctx traits list` and the TUI render their current strings — including the `blocked (v/t verified)` and `partial (v/t)` parentheticals — through the extracted typed value. This cut changes no CLI or TUI output.

- **Out of scope**: the header and lock provenance bar (`0267.2`), the preview column (`0267.3`, `0267.4`), moving the TUI's Traits and Trust screens and removing their two-second poll (`0267.5`), trait authoring, any new trust mutation on any face, the light theme, pencil work of any kind, and every shared primitive `0265` already built.

## Prerequisites

`0265.5` — the row vocabulary these rows compose, which chains back through `0265.3` to `0265.1` and the whole of item `0256`. `0265.9` — the title bar whose menu this screen's entry joins. `0258` — the source places the four new screens after its work item. A charter's `depends-on` is not inherited by its children (`derived_status` evaluates dependencies only for open leaves, `modules/core/src/task/graph.rs:115-177`), so all three are named on this leaf and reach the rest of the family through child-to-child edges. Bind to the desktop project, components and non-interactive command those tasks actually landed, not to a path guessed here.

## Done when

1. **One repository-scoped resolution answers the library, with the trust document loaded once.** The capability takes an explicit repository root or repo key, refuses an unknown or unusable scope with a typed error rather than resolving against the center's or the desktop's cwd, and answers for a selected repository that has no run row at all. Inside one resolution the trust document is loaded exactly once and threaded through every member verdict and both projections — this is a stated improvement over HEAD's N+1 reads, not a preserved property. Tier ordering, winner/shadow resolution, exact-digest trust identity and append-only sequence authority are consumed, not redefined. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` and `just test`, plus the diff read for a second `read_store` call on the resolution path.

2. **The answer carries both projections without a second scan.** It retains per-member records with their tier/origin, family id and the family table's actual variant key, so the TUI's existing non-built-in Traits list and its unfiltered Trust list are both derivable from it byte-for-byte by `0267.5`, and the desktop's genuinely repo-authored `Authored` list is derivable from the same records. Collapsing the wire answer to family-only rows, or serving a pre-filtered list, fails this. Unreadable rows carry their tier/origin so a non-authored failure never lands in `Authored`. Decided by `just test` and `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch packages spanning the authored, vendored and built-in tiers.

3. **Every reachable trust state has one typed word, from one site.** The extracted mapping covers all-verified (`trusted` on the desktop, `verified` in the TUI), `blocked`, `partial`, `unreviewed`, `moved`, `unreadable`, `source-only` and `orphaned`; the all-good word is the only face-specific difference, and states render as words with semantic colour — never pills, icons or badges. A family row carries the conservative aggregate, never one member's verdict, under this explicit precedence, most severe first: any member blocked (a block recorded against other bytes included) reads `blocked`; else any member unreadable reads `unreadable`; else all members verified reads the all-good word; else at least one verified reads `partial`; else at least one member whose only evidence is for other bytes reads `moved`; else `unreviewed`. `ctx traits list` and the TUI keep their current label strings, parentheticals included. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_trust_family_report` and `just test`, over scratch families mixing verified, unreviewed, blocked, moved and unreadable members.

4. **Provenance is one earned, computed value.** `pinned` is earned across the current resolved authored members of the resolution and is withheld — with the failure rendered in its place — when a relevant package lock is missing, unparseable, missing an entry for a current member, or carrying a canonical digest that disagrees with the resolved member. The evidence set is one triple per successfully joined current member, `(id, variant, lock canonical digest)`, with `variant` `None` for a standalone package and the family table's actual member key otherwise, ordered by id then variant in ASCII byte order with `None` first; `N digests` is that set's cardinality and never the raw lock-entry count; `<sha>` is a digest over that same ordered set computed through the existing `digest` primitives, never a Git object id, an invented or shortened hash, or a hash of unrelated lock bytes. Source-only packages have no current resolved member and never withhold `pinned` from others. The value is computed once in the resolution, served immutable, and cited identically by `0267.2` and `0267.4`. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` and `just test`, over scratch locks covering present, missing, malformed, missing-entry and digest-mismatched cases.

5. **Degrade per package, fail loud per resolution.** One unreadable package stays a typed row with its error visible and never aborts the scan; a source-only authored package is a typed ordinary row, counted in `Authored — N`, with the `source-only` word and a description position derived only from its typed state and its authored source path. A failed repository scope, a failed or invalid trust-store read, a malformed family contract or a failed provenance resolution fails the whole answer loudly rather than shipping a partial library that reads as complete. No stale answer is presented as current: a last accepted answer stays visible only behind an explicit stale or outage marker, and there is no desktop-side filesystem or `git` fallback. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` and `just test`.

6. **The wire capability is bounded, event-driven and off the model owner.** The library request, response and freshness event are typed protocol additions at the existing client boundary, not fields bolted onto `CenterPublicRow`. Blocking inventory, trust and lock work runs in the connection worker after bounded owner-side scope resolution, never inside the sole model/SQLite owner's request handling and never on the periodic scan's own work. Freshness reaches clients as stream events with no timer on any client; a trust-store change can invalidate several repositories' answers, so invalidation is not attached to one run row. Lines stay inside the 1 MiB bound with compact list and member data, and a later selection is addressable by stable identity — trait id plus canonical digest, plus member/default identity for a family — without rescanning the inventory. `ctx-traits-io` still depends only on `ctx-traits-core` and its existing third-party set: no CLI-level type, no filesystem watcher, no new heavyweight dependency. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for a client timer or owner-path read.

7. **The `Traits` pane renders the section and its rows from the served answer.** The title-bar menu gains a `Traits` entry with the current entry bright, and its switch reaches a pane that is not empty. The pane renders one `Authored — N` section over the served repo-authored projection, `N` being the number of family, standalone and source-only rows in it. Each row is dotless — grammar rule 4 admits 5px dots for frames, tasks, merges and rail repositories only — with a left stack of the served name in Sans 12.5 over the served description in Sans 11 `text-secondary`, and a right stack in Mono 10.5 carrying the trust state word plus `· N variants` above the family table's actual variant names in `text-muted`. Selection is `surface-raised` with `text-bright` and nothing else — no border, radius, accent bar, pill, icon or dot — and exactly one title is bright. Geometry matches `reference/traits.html:287-579` and `tokens.md:71-85`. Fonts are the IBM Plex faces `0265.1` resolved, with no silent system fallback. Every leaf is served: no export literal — `ctx-company/traits`, `implement`, the example descriptions, variant sets, counts, `trusted` and every reference hash — is hardcoded. No repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented; it is decided by the bounded review in `validation`, run against `screens/traits.md`, `grammar.md` and the dark column of `tokens.md` leaf by leaf and naming for each leaf the served source it renders from, together with `just test` proving the shared code those leaves render through. Once `0256.1`'s non-interactive desktop command exists, run it as additional proof and, if it is repo-root-relative and carries its verdict in its exit code, declare it here.

8. **The workspace is unmoved.** Root Cargo resolution, the root `Cargo.lock` and the existing gates stay gpui-free and the desktop project stays outside the workspace. Decided by `just test` and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no second copy of the inventory assembly, the family aggregate or the trust word mapping is created; no CLI-private type is imported by the desktop; no inventory, trust or lockfile semantics are redefined; no light-theme value is touched; no pencil artifact is edited; no trait authoring or new trust mutation is opened; the TUI's direct readers and its two-second poll are `0267.5`'s to remove and are not half-removed here; and no work belonging to `0267.2`-`0267.5`, `0266`, `0268`, `0269` or `0261` is done.
'''
validation = '''
## Approach

Suggested route, not a boundary. Every symbol is named because the grounding supports it; take a different one wherever a goal requires it and say so in the work summary.

**Reuse points, named.** `InventoryContext::candidate_ids`/`resolve_tiers` and `Tier`'s binding order (`modules/io/src/inventory.rs:32-207`) are the one discovery authority — no second tier scan in the center or the desktop. `run::load_trait` is the decode/digest chokepoint, returning the typed `Trait`, package root, source digest and canonical digest (`modules/io/src/run.rs:3744-3816`) — no second manifest parse. `Trait::effective_summary` (`modules/core/src/trait/mod.rs:485-493`) is the one prose projection; `family_manifest::read_family_table` with `FamilyTable.default` and the actual keys of `FamilyTable.variants` (`modules/io/src/family_manifest.rs:23-35`) is the variant authority — never `variant_names()`, which emits the synthetic `default` selector first for diagnostics (`family_manifest.rs:59-70`). `trust::read_store`, `Document::record_for_current` and `classify_records` (`modules/io/src/trust.rs:73-280`) stay the trust authority, and `build_trust_rows_from` (`dashboard.rs:2626-2717`) is the existing pure document-taking join. `trust_story::aggregate_trust_label` (`trust_story.rs:185-212`) and `TrustClass` (`trust_story.rs:15-87`) are what the typed aggregate is extracted and widened from. `discovery::trait_authoring_packages` (`discovery.rs:63-119`) supplies source-only evidence, folded into the one resolution rather than appended by a second caller as `ctx traits list` does today (`lifecycle_reporting.rs:1845-1879`). `lockfile::read_lockfile` (`modules/io/src/lockfile.rs:22-64`), `layout::package_lock_path` (`modules/io/src/layout/mod.rs:375-383`), `Lockfile::trait_entry` and `LockEntry::canonical_digest` (`modules/core/src/lockfile.rs:31-55,109-123,182-193`) are the pin join. `Digest::from_bytes`/`canonical` (`modules/core/src/digest.rs:103-166`) is the one hash construction. `CenterPublicRow.repo_key`/`repo_path` (`center.rs:3778-3788`), `state::read_repo_index` (`state.rs:470-557`) and `state::canonical_repo_root`/`repo_key` (`state.rs:128-160`) are the scope evidence. The `Start`/`Control` dispatch shape (`center.rs:3278-3315,3380-3429`), the bounded snapshot/delta stream with its lagging-subscriber eviction (`center.rs:2336-2485`), the periodic two-second scan cadence (`center.rs:65,3026-3038`) and the typed client wrappers (`center.rs:904-1003`) are the center precedents. The TUI reducer's transaction boundary — stage, project the complete candidate, commit only on success, drop and reconnect on rejection, keep last-accepted behind an explicit stale marker (`modules/cli/src/app/dashboard/worker.rs:254-457`) — is the client precedent the desktop reducer follows.

**Edit order.**

1. **Shared core/IO assembly** — lift `ResolvedTraitEntry`, `TraitInventoryRow` and the body of `resolve_trait_inventory` (`lifecycle_reporting.rs:1509-1677`) out of the CLI into shared code, and have `lifecycle_reporting` call it so no second copy exists. Suggested shape changes: a third `SourceOnly { id, source_path }` arm; tier/origin retained on the `Unreadable` arm; the family key kept explicitly per member alongside `family` and `variant`; `name`, `effective_summary()`, declared agent ids and declared port ids retained only as far as this cut's list consumer and `0267.3`/`0267.4`'s named blocks demonstrate; the `.ok().flatten()` at `lifecycle_reporting.rs:1588-1597` replaced by a typed per-package failure. Take the loaded `trust::Document` as a parameter so `lifecycle::resolve_named`'s per-member `read_store` leaves this path — the pure verdict derivation, not the store read, is what each member needs.
2. **Explicit repository scope** — a constructor beside `InventoryContext::discover` taking a repository root, with tier ordering and winner/shadow semantics untouched (`inventory.rs:64-81`), plus the typed refusal for an unknown or unusable scope.
3. **Typed trust presentation** — one shared enum of the eight states with the family precedence of Done-when 3, returning the typed state plus verified/total counts. Render the existing CLI/TUI labels from it so `aggregate_trust_label`'s strings are unchanged; the desktop word comes from the same site.
4. **Provenance** — the current-member/lock join, the minimal serializable ordered evidence shape (a `Vec` of `(id, variant, canonical digest)` records serialized once through the existing canonical serialization and fed to `Digest::from_bytes`), and the served `{ pinned, sha, digest_count }` value with its typed failure. No delimiter-concatenation hashing: that is a second hash construction.
5. **`modules/io/src/center.rs`** — the typed `Request` arm with its explicit scope, the `ResponseResult` arm carrying the compact library answer, the freshness event or delta and its repository fan-out, the early-return dispatch branch beside `Start`/`Control` so the request never becomes a `ModelCommand::Request`, and the public client wrapper on the action timeout rather than the 2s stream timeout, since this walks directories.
6. **The desktop pane** — the `Traits` menu entry and switch in the landed title bar, the library reducer over the served answer with the TUI reducer's transaction posture, and the section plus dotless rows over `0265.5`'s row vocabulary in the tokens `screens/traits.md` names.

**What must be proven** (observations, not mechanics): over scratch repositories only — a standalone package, a multi-variant family, a family mixing verified, unreviewed, blocked, moved and unreadable members, a source-only authored package, an unreadable package beside readable ones, and packages at the vendored and built-in tiers; a missing trust store and a malformed one; locks present, missing, malformed, missing a current member's entry and digest-mismatched; an unknown and an unusable repository scope; a repository with no run row; freshness delivered as an event after a change; a rejected snapshot projection leaving the last accepted answer behind an explicit marker; center outage and recovery; and a lagging subscriber evicted and re-snapshotted. `modules/cli/tests/proof_center.rs` is the existing process-boundary suite and already covers bounded streams, snapshot ordering, backpressure eviction and reconnect; `modules/cli/tests/proof_trust_family_report.rs` already proves partial family reporting with scratch fixtures and per-member preservation.

## Watch

- **Do not claim the single-trust-read property as preserved.** HEAD is N+1 reads (content, Correction 1). Leaving `lifecycle::resolve_named` on the per-member path keeps them.
- **`Authored` is not the TUI's built-in filter.** The TUI keeps `origin != Some("built-in")`, so vendored and user-global winners stay in its list; the desktop section is genuinely repo-authored. Serving one pre-filtered list cannot feed both.
- **No design example string is ever data.** `ctx-company/traits`, `implement`, `basic`/`quick`/`complex`, the example descriptions and every sha and count in `reference/traits.html` are illustrations; the export is geometry authority only, and `grammar.md` plus `screens/traits.md` are the specification. A leaf rendering an export literal is worse than an omitted leaf because it reads as evidence.
- **No dots on trait rows**, states are words rather than pills or icons, one bright title per list, sans is content and mono is machinery, and only the dark token column is implemented.
- **Nothing is served to the GUI that the TUI and CLI cannot also reach**, and nothing shared is copied instead of extracted.
- **No poll loop on any client**, and no inventory, trust or lock read on gpui's UI thread or on the center's model-owner request path.
- **Fail loud, no silent staleness, no direct-reader fallback.** A blank sha, an invented short hash, a Git object id standing in for lock bytes, or a raw lock-entry count presented as `N digests` each make the bar lie.
- **`ctx-traits-io` depends only on `ctx-traits-core` and its existing third-party set** (`modules/io/Cargo.toml:12-29`); the desktop lane inherits everything it drags in.
- **No test may depend on committed repo content** — not this repository's trait set, its `trait.lock` files or its board. Scratch fixtures only; path/word/file-existence inventories are banned workspace-wide.
- **Workspace gate cost must not move**: gpui must not enter root resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing CI lanes. Do not declare a check forbidding the string `gpui` in `Justfile` or `.github/workflows/` — a separate desktop lane there is sanctioned. Rust is pinned to 1.97.1; isolate with `CARGO_TARGET_DIR=target` when a failure looks like a phantom "cannot find X".
- **The declared checks are workspace-side.** They prove the served capability and the shared code are green and the workspace stayed gpui-free; the rendered pane is decided by the bounded review below and, once it exists, `0256.1`'s desktop command.

## Bounded review

One review pass over the completed diff before calling this done: walk `screens/traits.md`'s menu entry, section, and row leaves against the rendered pane, naming the served source for each; compare the literal geometry against `reference/traits.html:287-579` and `tokens.md:71-85`; exercise the scratch boundaries listed above; then read the diff for the properties no fixture shows directly — one assembly, one trust-document load, one provenance resolution, retained per-member records with tier/origin, explicit repository scope, no client timer, no desktop filesystem or `git` read, no CLI-private import, no second copy of an extracted rule. Then run the declared checks.

At most one targeted repair-and-rerun round: repair one named defect and rerun whatever evidence shows the repair holds and broke nothing already proven. If a second round would be needed, stop and report the failing command with its output, or the failing leaf with its evidence, rather than iterating.
'''
