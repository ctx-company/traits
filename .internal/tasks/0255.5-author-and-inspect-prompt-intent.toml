schema-version = "0.2"
key = "0255.5"
title = "Author and inspect prompt intent"
status = "ready"
raised = "2026-08-24"
content = """
## Outcome
Let trait authors attach `require`, `focus`, `avoid`, and `block` intent only to prompt sequence items through the object and functional CDK APIs. Lower top-level, named, and CDK-materialized nested prompt declarations into one canonical `SequenceItem.intent` field, infer schema `0.6` from every such declaration, validate through the existing scoped intent authority, emit generated typing, and render each declaration statically with the established `sequence:<container>/<item-id-or-step-N>` source.

Prompt intent is declaration-only in this task. Static inspection must show declarations regardless of readiness without claiming that a prompt is active or ready. Siblings `0255.6`, `0255.7`, and `0255.9` own top-level runtime dispatch, prompt behavior, and named-sequence runtime dispatch respectively. A populated prompt intent is deterministic and digest-covered; omitted intent must remain absent and preserve the prior sequence-item canonical bytes and digest. Empty authored intent remains a present `{}` declaration and therefore infers schema `0.6`.

The complete touched-file allowlist is `modules/core/src/trait/procedure/model.rs`, `modules/core/src/trait/procedure/validate.rs`, `modules/core/src/trait/port.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/sequence.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`. No file may be created, renamed, removed, or edited outside this list, and `packages/cdk/src/generated.ts` may change only through `just sdk-generate`.

## Symbol contract
In `modules/core/src/trait/procedure/model.rs`, change the existing import to exact `use crate::r#trait::{GuardExpr, Intent, PromptMap, Trait};`. Extend existing `pub struct SequenceItem` immediately after `pub prompt: String` with exact field `#[serde(default, skip_serializing_if = "Option::is_none")] pub intent: Option<Intent>`. This remains a shared canonical field because serde has one sequence-item model; public authoring and semantic validation, not a second Rust item shape, enforce prompt-only legality. Do not change existing `pub fn effective_kind(&self) -> SequenceKind` or any other procedure model.

In `modules/core/src/trait/procedure/validate.rs`, keep exact existing signature `fn validate_sequence_item_declaration(trait_ref: &Trait, item: &SequenceItem, base: &str, sets: &SequenceValidationSets<'_>) -> crate::Result<()>`. Immediately after computing `let kind = item.effective_kind()`, call new exact private helper `fn validate_prompt_intent(trait_ref: &Trait, item: &SequenceItem, kind: SequenceKind, base: &str) -> crate::Result<()>` before shape-specific validation. Its order is fixed: return `Ok(())` when `item.intent` is absent; reject every `kind != SequenceKind::Prompt` at `{base}.intent`; reject prompt intent when `!crate::r#trait::schema_version_at_least(trait_ref.schema_version.as_str(), "0.6")` at `{base}.intent`; then return `intent.validate_scoped(&format!("{base}.intent"))`. Do not add intent checks to individual kind branches or change root `Intent::validate_taxonomy`.

Inside the existing test module in `modules/core/src/trait/procedure/validate.rs`, add exact fixture helper `fn prompt_intent_fixture(schema_version: &str, intent: serde_json::Value) -> Trait`; it constructs one otherwise-valid top-level prompt and one otherwise-valid named prompt so tests can mutate only the placement under examination. Add exact tests `fn prompt_intent_accepts_all_groups_on_top_level_and_named_items()`, `fn prompt_intent_requires_schema_0_6()`, `fn prompt_intent_rejects_every_non_prompt_kind()`, `fn prompt_intent_reports_shared_validation_failures_at_indexed_paths()`, `fn prompt_intent_allows_focus_block_overlap_and_root_only_require_avoid_collisions()`, `fn prompt_intent_populated_serialization_is_deterministic_and_digest_covered()`, and `fn prompt_intent_absence_preserves_sequence_item_canonical_bytes()`. The non-prompt test must enumerate all ten non-prompt `SequenceKind` variants: `Ask`, `Command`, `Check`, `Project`, `Sequence`, `Branch`, `Loop`, `ForEach`, `Parallel`, and `Terminal`. Use existing `item_from_toml`, `crate::digest::canonical_json`, and `crate::digest::canonical_digest`; add no second validation/parser helper.

In `modules/core/src/trait/port.rs`, keep exact signature `fn validate_port_default_command(command: &PortDefaultCommand, base: &str) -> crate::Result<()>` and add only `intent: None` to its sole explicit production `crate::r#trait::procedure::SequenceItem` literal. TOML-derived test helpers require no literal changes.

In `modules/core/src/model_view/compile_sections.rs`, keep exact signature `fn format_procedure(trait_ref: &Trait, proc: &crate::r#trait::procedure::Model, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String`. While its existing loops visit top-level and named sequence items, collect rendered intent only when `item.effective_kind() == SequenceKind::Prompt` and `item.intent` is present. Call unchanged `format_intent` with `GuidanceTag::Namespaced`; use field prefixes `procedure.sequence[index].intent` and `sequence.<id>.sequence[index].intent`, and sources `sequence:procedure/<item-id-or-step-N>` and `sequence:<id>/<item-id-or-step-N>`, where fallback numbering is one-based exactly like `sourceMapForSequenceItems`. Build the existing `<procedure>` leaf with the existing body and `leaf_element` call first, then append non-empty rendered intent strings outside that leaf. Return the exact old string when no prompt intent exists; never insert generated intent XML into the author-controlled body before `leaf_element` because `body_integrity` would escape valid closing tags.

Add exact test `fn prompt_intent_is_static_declaration_only_with_sequence_sources()` to the existing test module in `modules/core/src/model_view/compile_sections.rs`. Its schema-`0.6` fixture contains top-level, named, and generated-nested prompt declarations plus root intent. It must assert built-in, custom, rich, and forged `</intent>` text all pass through unchanged `format_intent` directive resolution and sanitization; exact top-level/named/generated sources use the shared source grammar and fallback; declarations render without readiness; no active/ready assertion appears; prompt intent does not enter `Report::behavior_text`; and unchanged `frame_guidance` contains only root guidance.

In `packages/cdk/src/sequence.ts`, add exact type-only import `import type { Intent } from "./trait.js";` and import existing `normalizeIntent` from `./normalize.js`. Add exact private fragment `type PromptIntentFields = { readonly intent?: Intent };`. Change the three existing declaration headers to exact `type PromptSequenceFields = Omit<SequenceCommonFields, "input"> & PromptIntentFields & { ...existing members unchanged };`, `type TextPromptSequenceFields = Omit<SequenceCommonFields, "input"> & PromptIntentFields & { ...existing members unchanged };`, and `type InputPromptSequenceFields = Omit<SequenceCommonFields, "input"> & PromptIntentFields & { ...existing members unchanged };`. Do not add the fragment to `SequenceCommonFields`, `AskSequenceFields`, or any non-prompt public field type; existing `export type PromptRegistrarOptions = Omit<PromptSequenceFields | TextPromptSequenceFields | InputPromptSequenceFields, "id" | "kind" | "agent" | "title"> & { readonly output?: SequenceOutputValue | readonly SequenceOutputValue[]; readonly id?: string };` inherits it without a signature change.

Extend existing `interface SequenceFieldsProbe` with exact member `readonly intent?: Intent;`. Keep exact signature `function sequenceOf(fields: SequenceFields): SequenceHandle`. After resolving `kind`, throw a deterministic error naming the item and prompt-only rule when `rawFields.intent !== undefined && kind !== "prompt"`; this protects evaluated/untyped trait sources instead of silently compacting an illegal property. For `kind === "prompt"` with present intent, assign `canonical.intent = normalizeIntent(rawFields.intent)` on the existing `Mutable<CanonicalSequenceItem>` before `compactAs`. Do not normalize elsewhere. Omission produces no key; `{}` normalizes to a present `{}` key.

In `packages/cdk/src/trait.ts`, add exact private helper `function sequenceContainerHasPromptIntent(container: JsonValue | undefined): boolean`. It accepts only a non-array object container, reads only that object's own `sequence` array, and returns true only for a non-array object item with its own `intent`, its own canonical `prompt`, and `kind` either absent or exactly `"prompt"`; use `Object.hasOwn(item, "intent")` so `{}` counts. Keep exact signature `export function assembleSingleTraitDraft(fields: TraitFields, baselineSchemaVersion: SchemaVersion = "0.5"): { readonly draft: CanonicalTraitDraft; readonly merged: ReturnType<typeof mergeDeclarationSets>; readonly diagnostics: readonly CdkDiagnostic[]; readonly sourceMap: SourceMap; }`. Preserve explicit `fields["schema-version"]` precedence and the supplied baseline; otherwise select `0.6` when an existing merged agent owns `intent`, `sequenceContainerHasPromptIntent(procedureValue)` is true, or any declaration in `merged.sequence` satisfies the helper. Generated branch/loop/for-each bodies already reside in `merged.sequence`; do not add a recursive JSON walk. Intent-free ordinary and native drafts stay on their existing `0.5` baseline.

In generator-owned `packages/cdk/src/generated.ts`, the only accepted semantic output from `just sdk-generate` is exact optional member `readonly "intent"?: CanonicalIntent | undefined;` on existing `export type CanonicalSequenceItem`. No generated config definition or other generated semantic output may change, and generated TypeScript must not be hand-edited.

In `packages/cdk/test/cdk.test.ts`, add exact tests titled `normalizes all prompt-intent groups and guidance forms across top-level, named, and inline-nested prompts`, `prompt intent infers schema 0.6 while explicit versions and intent-free 0.5 bytes remain stable`, and `non-prompt sequence builders reject intent at typecheck and evaluated runtime`. Keep tests inline with no new module-level helper. Cover all four groups; scalar, built-in, custom, and rich normalization; each of the three prompt input spellings; top-level procedure, named `sequence.linear`, and inline branch/loop body materialization; own empty intent; explicit `0.5` precedence for Rust to reject; otherwise-equivalent omission at `0.5`; and unchanged existing `is byte-stable` fixture bytes. The negative test must use `@ts-expect-error` against every author-facing non-prompt builder options surface (`ask`, `command`, `check`, `project`, `terminal`, `loop`, `forEach`, `branch`, and `parallel`); generated `kind = "sequence"` invocation has no author options surface and remains covered by Rust's exhaustive kind test. Also pass a non-empty illegal intent through an evaluated/untyped cast and assert `sequenceOf` throws rather than drops it.

In `packages/cdk/test/functional.test.ts`, add exact test titled `agent.prompt, step.prompt, and defineStep.prompt preserve prompt intent through nested lowering and infer schema 0.6`. Use exactly two inline builds: one `procedure.from` build containing a top-level `agent.prompt` and a `step.prompt` inside a nested `flow.when` body, and one `evaluateTraitFunction` build invoking a declaration created by `defineStep.prompt`. Assert the canonical prompt items retain normalized intent and each assembled trait infers `0.6`. Add no helper or production functional symbol and do not edit registrars.

No production symbol is removed. The only new production symbols are private `validate_prompt_intent`, private `PromptIntentFields`, and private `sequenceContainerHasPromptIntent`; `SequenceItem.intent` and `SequenceFieldsProbe.intent` are new fields. The only new Rust test helper is `prompt_intent_fixture`, and the eight exact `prompt_intent_*` tests named above are the complete focused Rust filter surface.
"""
scope = """
## Ordered work
1. Edit `modules/core/src/trait/procedure/model.rs` first: import `Intent` and add optional `SequenceItem.intent` immediately after `prompt`, preserving serde omission.
2. Edit `modules/core/src/trait/procedure/validate.rs` second: call one new `validate_prompt_intent` before shape branches, implement its fixed absence/kind/schema/scoped-validation order, then add `prompt_intent_fixture` and the seven exact focused tests. Reuse `Intent::validate_scoped` and do not duplicate guidance rules.
3. Edit `modules/core/src/trait/port.rs` third: initialize the one explicit production `SequenceItem` literal with `intent: None` and make no other change.
4. Edit `modules/core/src/model_view/compile_sections.rs` fourth: collect top-level and named prompt intent during existing iteration, append it after the unchanged procedure leaf, and add `prompt_intent_is_static_declaration_only_with_sequence_sources`.
5. Edit `packages/cdk/src/sequence.ts` fifth: add `PromptIntentFields`, extend the probe, enforce the runtime kind guard, and normalize exactly once into the canonical prompt item.
6. Edit `packages/cdk/src/trait.ts` sixth: add `sequenceContainerHasPromptIntent`, scan only `procedureValue` and `merged.sequence`, and extend schema inference without changing explicit precedence or baseline handling.
7. Edit `packages/cdk/test/cdk.test.ts` seventh: add the three exact object/type/runtime tests while keeping fixture files and existing stable-byte assertions unchanged.
8. Edit `packages/cdk/test/functional.test.ts` eighth: add the one exact registrar test and prove nested preservation without editing functional implementation.
9. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core prompt_intent` first. Stop for a targeted repair if the exact eight focused tests do not pass.
10. Run `just sdk-generate` second, after the Rust schema edit. Inspect all generator output immediately; accept only `CanonicalSequenceItem.intent` in `packages/cdk/src/generated.ts`. Any change to `packages/config/src/generated.ts` or any other file is a blocker, not permission to widen scope.
11. Run `pnpm --dir packages/cdk run test` third, then `CARGO_TARGET_DIR=target just test` fourth. Inspect the complete diff against the nine-file allowlist, prompt-only typing and validation, shared renderer/normalizer use, source convention, absent-byte neutrality, generated-output restriction, and all runtime exclusions.
12. A failed command or substantive review finding permits at most two targeted repair-and-rerun rounds. After a repair, rerun the affected command and every later command in the strict sequence. Stop successfully only when every command exits 0 and the final substantive review is clean; otherwise stop with the concrete remaining blocker.

## Reuse
`modules/core/src/trait/intent.rs::Intent::validate_scoped` remains the sole scoped-intent authority. It already delegates group validation to `modules/core/src/trait/guidance.rs::validate_guidance_list`, which owns slug checks, within-group duplicate IDs, blank rich text, and imperative second-personless text. Reuse `GuidanceItemList` scalar/object/array decoding and canonical serialization. Do not duplicate parsing, add prompt-specific vocabulary, or tighten root `Intent::validate_taxonomy`; root-only require/avoid collisions remain valid while prompt-local intersections reject.

`modules/core/src/trait/procedure/validate.rs::validate_sequence_item_declaration` is already reached for every `procedure.sequence[index]` and `sequence.<id>.sequence[index]`, including CDK-materialized nested prompt leaves. Use that one traversal and the effective `SequenceKind`; do not add checks to ten shape branches. `modules/core/src/encoding.rs` already invokes procedure validation with the full `Trait`, and existing `schema_version_at_least` already recognizes `0.6`.

`modules/core/src/model_view/compile.rs::format_intent` remains the only intent renderer and must stay unchanged. It already resolves built-ins and custom rich directives, sanitizes local text, and emits source-attributed namespaced elements. Reuse the one-based item fallback and source grammar established by `packages/cdk/src/normalize.ts::sourceMapForSequenceItems`; `format_procedure` supplies only field paths, container/item attribution, and placement outside the procedure leaf.

`packages/cdk/src/normalize.ts::normalizeIntent` remains the sole TypeScript intent normalizer. Existing `sequenceOf` is the canonical prompt-lowering choke point. Existing `step.prompt` delegates to `dispatchAgentPrompt`, installed lowering spreads `PromptRegistrarOptions` into `sequence.prompt`, and `defineStep.prompt` delegates through `agent.prompt`; no functional emitter or registrar change is needed. Existing `materializeSequenceItem`, `sequence.linear`, and `procedure` place inline nested leaves into generated named declarations already included in `merged.sequence`.

`packages/cdk/src/trait.ts::assembleSingleTraitDraft` remains the sole schema-inference authority. Reuse its merged-agent own-property check, explicit-version precedence, and native baseline argument. `just sdk-generate` remains the only generated-type authority.

## Exclusions
Do not edit schema-version registration, migrations, `modules/core/src/encoding.rs`, `modules/core/src/trait/intent.rs`, `modules/core/src/trait/guidance.rs`, `modules/core/src/model_view/compile.rs`, `packages/cdk/src/normalize.ts`, `packages/cdk/src/procedure.ts`, `packages/cdk/src/variant.ts`, any functional registrar/context/step implementation, handles, runtime readiness/frame composition, CLI or MCP transport, agent `system`, behavior code, fixture files, generated config definitions, task siblings, or any file outside `modules/core/src/trait/procedure/model.rs`, `modules/core/src/trait/procedure/validate.rs`, `modules/core/src/trait/port.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/sequence.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`.

Do not create a second sequence-item model, expose intent through `SequenceCommonFields`, allow intent on `ask` merely because it has prompt text, recursively walk arbitrary JSON, duplicate `normalizeIntent`, duplicate guidance validation or rendering, invent a source/location grammar, add a readiness or active-prompt claim, feed prompt intent into `Report::behavior_text` or `frame_guidance`, resolve effective/runtime intent, route guidance into `Agent.system`, add compatibility shims, hand-edit generated TypeScript, or update fixtures to hide byte drift.
"""
validation = """
## Done when
1. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core prompt_intent` exits 0 with exactly eight matching tests from `modules/core/src/trait/procedure/validate.rs` and `modules/core/src/model_view/compile_sections.rs`. They prove schema `0.6` accepts top-level and named prompt intent across all four groups and built-in/custom/rich forms; every pre-`0.6` version and every non-prompt `SequenceKind` rejects at the indexed `.intent` path; shared duplicate/malformed/blank/second-person and local require/avoid failures retain exact indexed paths; focus/block overlap and root-only require/avoid collisions remain accepted; populated serialization is deterministic and changes the canonical digest; omitted intent preserves the prior literal sequence-item canonical bytes and digest; and static top-level/named/generated-nested declarations use exact shared sources, sanitization, and directive rendering without readiness claims, behavior-text leakage, or root frame-guidance changes.
2. `just sdk-generate` exits 0. Immediate generator review shows the only generated semantic change is `readonly "intent"?: CanonicalIntent | undefined;` on `CanonicalSequenceItem` in `packages/cdk/src/generated.ts`; `packages/config/src/generated.ts` and every other generated output are unchanged.
3. `pnpm --dir packages/cdk run test` exits 0 after `packages/cdk/test/cdk.test.ts` proves all four groups and scalar/built-in/custom/rich normalization through prompt/text/input spellings on top-level, named, and inline-nested prompts; own empty intent and all guided locations infer `0.6`; explicit older versions remain explicit; otherwise-equivalent intent-free ordinary/native drafts remain `0.5`; existing fixture bytes remain unchanged; non-prompt builders lack the field at typecheck; and evaluated/untyped illegal placement throws. The same command covers `packages/cdk/test/functional.test.ts`, where `agent.prompt`, `step.prompt`, and `defineStep.prompt`, including a nested flow body, preserve intent through the one lowering path and infer `0.6`.
4. `CARGO_TARGET_DIR=target just test` exits 0 after edits to `modules/core/src/trait/procedure/model.rs`, `modules/core/src/trait/procedure/validate.rs`, `modules/core/src/trait/port.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/sequence.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generated `packages/cdk/src/generated.ts`. This per-round gate supplies formatting, generated drift, TypeScript typecheck, lint, and workspace library coverage.
5. Judgment review confirms the complete diff touches exactly the needed subset of the nine-file allowlist; every exact field, helper, unchanged signature, and test named above is present; one validator and one normalizer cover every lowering path; prompt-only typing and semantic rejection agree; static sources match `sequence:<container>/<item-id-or-step-N>`; the old procedure output and sequence-item canonical bytes are exact when intent is absent; generated output is restricted; no runtime/readiness/frame/transport behavior is introduced; no exclusion is violated; and no symbol is removed. This criterion intentionally has no fabricated automated check.

Run verification in this strict order: `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core prompt_intent`, `just sdk-generate`, `pnpm --dir packages/cdk run test`, then `CARGO_TARGET_DIR=target just test`. The clean observed baseline is HEAD `9fd7ebb9`: the CDK suite passed 278/278 and focused existing agent-intent tests passed 6/6. The archived `0255.1` closure's failed broad checks are not green-baseline evidence. Perform no more than two targeted repair-and-rerun rounds; success requires all four commands and substantive final review to pass, otherwise report the concrete blocker instead of completing the task.
"""
