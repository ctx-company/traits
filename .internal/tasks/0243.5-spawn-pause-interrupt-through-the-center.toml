schema-version = "0.2"
key = "0243.5"
title = "Spawn, interrupt, and pause go through the center"
status = "ready"
raised = "2026-08-24"
content = """
This plan separates GOALS from APPROACH. The GOALS section is binding: each
Done-when names an observable outcome and the existing command that decides
it. The APPROACH section is the architect's suggested route — file names,
symbols, reading order, proof mechanics. Deviate from any of it whenever a goal
requires it and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

The center learns to act, without ever owning what it acts on. Four shared,
IO-owned capabilities — start-detached-correlated-by-token, interrupt, pause,
and resume-as-start-by-session-id — usable by the dashboard today and by the
0258 desktop face later. No face contacts a driver's control socket or mutates
orphan evidence itself.

SPAWN — a viewer sends start(target); the center mints a spawn-request token,
forks the driver DETACHED and keeps no handle; the driver comes up exactly as
if typed in a terminal and its register (0243.3) carries the token back; the
center matches it, answers the requesting viewer with the session id, and
every subscriber gets the appeared delta. A driver that dies before
registering is reported to the requester with its stderr.

INTERRUPT and PAUSE — the center is a CLIENT of the driver's existing per-run
control socket, addressed by the socket + token read from lock-holder metadata
(0243.2) or received at register. Interrupt is today's mechanism, unforked.
Pause is a variant: stop at the next frame boundary, write outcome `paused`,
exit — a deliberate sibling of interrupted, resumable by the same `--session`
resume that exists today. Resume through the center is start with a session id
instead of a trait.

Pause is the primitive the future move/adopt stands on: pause -> copy ->
resume. `paused` is therefore an ordinary `DriveOutcomeKind` wire value in the
ledger, with no center-only memory of "paused by whom" that a copy would lose.

WORKTREE RULING (recorded here; implemented and proven). A paused
`--worktree` run RETAINS its worktree and branch, exactly like every existing
resumable outcome. Proof from current code: `traits run`/`traits drive` Clap
help both already state the worktree and branch are retained after every
outcome; `io::worktree::resume_or_prepare_worktree` re-enters the same
registered worktree; there is no pause-time release primitive; and the ledger
does not carry uncommitted mid-run changes, so releasing would destroy work
the ledger cannot rebuild. The pool cost is bounded and already handled:
`target_slot.rs` assigns four stable cache slots by worktree path, a parked
worktree keeps its slot, and a fifth run shares the least-recently-assigned
slot rather than blocking or failing. A release/bundle mechanism for dirty
state belongs to future move/adopt work, not here.

THIS TASK IS NOW A VERIFICATION-AND-CLOSURE TASK. The implementation landed:
commit bc4a5f8ed ("0243.5: route driver control through center") is an
ancestor of HEAD and carries every production edit and regression the original
step list named. Reading the code at HEAD finds no missing cell — the core
pause vocabulary, the typed control command, split detached spawning, the
center's start/control protocol with token correlation, the dashboard's
rewiring onto the center client, and all seven real-process proofs are
present. What was never done is board closure: this task still sits open with
no closure evidence, and no gate has been run against the current tree to
prove the landed work is still green under the commits that followed it.

Later work moved the baseline underneath the original step list, so parts of
that text are now actively wrong; the corrections are named under APPROACH.
Prove the named behaviors are present and their gates green at HEAD, then
close. Do not reimplement landed behavior, and do not "repair" current code
back to the superseded plan text.
"""
scope = """
## GOALS — binding

1. The core pause vocabulary and the ONE settled-pause predicate are present
   and green: `paused` round-trips as an ordinary `DriveOutcomeKind` wire
   value, and a single `is_settled_pause` predicate answers "a driver exited
   cleanly having recorded a durable resumable pause" for every such outcome,
   with `SessionState::derive` untouched so a paused row stays nonterminal and
   resumable. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core pause`.
   Excluded: narrowing that predicate. It now also covers `AwaitingOwner`
   because 0253.4 made a parked ask another durable resumable outcome; the
   superset is binding, and the three-variant list in this task's original
   text is superseded.

2. Typed driver control over the existing per-run control socket is present
   and green: the wire byte parses to a typed command, an unrecognized byte
   invokes no callback and is not acknowledged, and a pause request reaches
   the lock holder through the same shared socket/ack/handoff path interrupt
   uses. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io run_control`.
   Excluded: a second copy of the socket transport, and any path that signals
   a pid instead of writing the command byte.

3. The center's action protocol is present and green: start and control
   requests round-trip and skip the query freshness barrier; a spawn token
   completes exactly one pending start, a repeat of the same token is an
   idempotent no-op, and a tokenless registration completes none; a pending
   start blocks idle exit and is pruned by elapsed time; control resolution
   reports missing, ambiguous, not-live, and holderless/mismatched-holder
   targets as distinct typed results without contacting a socket; and orphan
   repair preserves a settled-pause outcome while still clearing stale holder
   metadata. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io center`.
   Excluded: restoring the pre-0262 center. `CenterRow` is metadata-only and
   its scans run in bounded warm slices; that baseline is binding here.

4. The dashboard is a caller, not a driver toucher: spawn parsing is a pure
   seam returning only the user's own arguments plus the task key, each typed
   control result renders distinctly, the start-result mapping carries a
   pre-registration stderr through unchanged, and optimistic dispatch
   correlation is driven by the registered session id and the task/session
   join rather than a timer. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`.
   Excluded: adding any dashboard pause key, modal, or hint. Pause ships as
   the shared center API plus its proofs; the desktop face adopts it in
   0258.3.

5. The real-process proofs are present and green: a center-started run
   outlives its requester and appears exactly once to two independent
   subscribers; a child that exits before registering is reported with its
   exit code and bounded stderr; dropping the requester mid-start leaves the
   detached driver running; interrupt reaches a run rediscovered after a
   center restart; an in-flight pause persists `paused` before its delta and
   resume continues at the next frame with no gap or duplicate; a paused
   `--worktree` run retains its worktree and resume reuses it; and a failed
   pause outcome write reports `harness-failed` and emits no Ended
   notification. Decided by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`.
   Excluded: a second process harness. These proofs live in the existing
   `proof_center.rs` harness and drive the public center client, never a
   private seam.

6. The per-round workspace gate is green at the tree this task closes on.
   Decided by `just test`. `just test-full` remains the landing gate and is
   enforced at merge by the runtime's `[merge] gate`, not by a check here.

7. The task closes on evidence, not on history. If goals 1-6 pass unmodified,
   this task closes with no source edit and no new commit — bc4a5f8ed is
   already its task-scoped commit and must not be duplicated. A source edit is
   justified only by a gate that is actually red, and then only far enough to
   make that gate green, in exactly one task-scoped commit with a clean
   worktree.

## APPROACH — suggested route, not a boundary

### Read before running

The behaviors below already exist at HEAD. Read them to know what a red gate
would mean, and to tell a stale-plan repair from a real defect.

- Core: `DriveOutcomeKind::Paused` and its wire mapping
  (modules/core/src/procedure/session.rs:1106, :1153), `is_settled_pause`
  (session.rs:1224), tests at session.rs:6490 and :6497.
  `SessionState::derive` (modules/core/src/procedure/activity.rs) maps only
  `Interrupted`/`Killed` to `Cancelled` and is deliberately untouched.
- Run control: `ControlCommand` (modules/io/src/run_control.rs:52);
  `request_interrupt` (:581) and `request_pause` (:586) both delegate to
  private `request_control` (:590), so the validated-holder token, bounded
  connect/read/write, exact ack comparison, and never-signal-a-pid handoff are
  shared, not duplicated. `bind_control_listener` invokes the callback and
  writes the ack only for a recognized byte. Tests at :687, :699, :724.
- Process: `spawn_detached` keeps its signature and delegates to private
  `spawn_detached_with` (modules/io/src/process.rs:28, :61);
  `spawn_detached_split` (:129) writes distinct truncated stdout/stderr files
  through the same setsid shim, and dropping the returned `Child` never kills
  it.
- Driver side: `PAUSED` / `is_paused` / `request_pause`
  (modules/cli/src/app/interrupt.rs:21, :200, :228) — pause sets the pause
  flag before the interrupt flag and never escalates to kill. The control
  callback maps interrupt to `request_stop` and pause to `request_pause`
  (modules/cli/src/app/drive.rs:1223), and the registration carries
  `spawn_token_from_env()` (drive.rs:1266). `cooperative_stop_status` /
  `cooperative_stop_detail` (drive.rs:1637, :1645) are reused at the three
  EXISTING cooperative boundaries — conductor-lease wait, the between-wave
  checkpoint that drains `pending_wave_cache`, and the attach wait. No fourth
  boundary exists, which is why an in-flight harness call is never
  interrupted.
- Center: `spawn_token_from_env` (modules/io/src/center.rs:294), `PendingStart`
  (:1486), `settled_pause` delegating to core's predicate (:2752),
  `run_control_request` (:3397), `resume_argv` (:3431), `run_start` (:3471),
  `prune_pending_starts` (:3589), and the public client API `start_trait`
  (:836), `start_session` (:857), `control` (:878). Start and control run in
  the connection worker, never on the model owner; the owner handles only the
  small `WatchStart`/`ForgetStart`/`ResolveRow` commands. The spawn token is
  absent from `CenterRow`, from SQLite persistence, and from
  `CenterPublicRow`: it is transient correlation state.
- Dashboard: `control_message` (modules/cli/src/app/dashboard.rs:4972) is the
  one typed-result rendering seam; `spawn_start_request` (:5862) and
  `apply_spawn_request` (:5845) are the pure spawn seam; resume and
  answer-triggered resume call `worker.start_session` (:5167, :5226); kill
  calls `worker.control(.., ControlAction::Interrupt)` (:5199);
  `apply_action_results` (:5908) has no timer. Worker action calls each run on
  their own short-lived thread and report through `ActionResult`
  (modules/cli/src/app/dashboard/worker.rs:106, :119, :127, :140), and
  `start_action_result` (:226) is the single mapping seam.
- Proofs: the seven named proofs sit at modules/cli/tests/proof_center.rs:2592,
  :2668, :2708, :2750, :2781, :2867, :2937, over the shared
  `SENTINEL_TEST_LOCK` / `CenterEnvironment` / sentinel / subscription-reader
  harness and one `write_fixture_harness` with bounded `WhenFileAppears`
  polling.

### Where the original step list is now wrong

Do not "restore" any of these; current code is correct and its tests encode it.

- `resume_argv` is exactly `traits internal drive --session <value>
  --progress none` (center.rs:3431), and `run_start` passes the resolved
  repository-local ledger path as `<value>`, preserving ledger identity. The
  original text's `traits drive ...` with a bare session id is stale — this
  was already true in bc4a5f8ed, not later drift.
- For a session row with empty `repo_path`, the center derives the repository
  from the repository-local ledger path and fails loudly if that derivation is
  impossible. It never falls back to the center's cwd; it is simply not the
  original text's unconditional refusal.
- `start_action_result` preserves `task_key` on `Exited` and on client error,
  contrary to the original prose. That is deliberate: `apply_action_results`
  uses the preserved key to clear stale optimistic dispatch state on failure,
  and both the worker mapping test and the dashboard regression require it.
- `is_settled_pause` covers `AwaitingOwner` as well (0253.4).
- `mint_spawn_token`, `complete_pending_start`, and `control_command` do not
  exist as named helpers; those small operations are inline. The behavior and
  the reuse boundaries are present, which is what the goals ask for.
- `FixtureRelease` has no `Clone, Copy` derive; it is used by value and the
  proofs compile against that shape.
- Every line number in the original step list is stale, mostly from 0253.4 and
  0262. Ground against symbols and tests, not old numbers.

### Run order

Run goals 1-5's commands first — they are the narrow filters and name a defect
fastest — then goal 6's workspace gate. `just test` deliberately does not
compile the integration proof binaries, so `--test proof_center` must be run
separately; it is not implied by the gate.

### If a gate is red

Diagnose before editing. Distinguish a real defect from a fixture a later
commit invalidated, and from cross-test interference; isolate the build with
`CARGO_TARGET_DIR=target` before trusting a "cannot find" failure. Reuse the
harness above rather than adding a parallel one. Keep any repair scoped to the
red gate and preserve every invariant named under Excluded.

### Reuse points (do not reimplement)

`run_control::request_control`'s socket/ack/handoff logic; the driver `flock` +
`control_token` authentication; `select_row`; `handle_request`'s single
parse/liveness/persist/delta path; `process::spawn_detached_with`'s setsid shim
and drop-does-not-kill contract; `DriverNotifier`'s reconnect/backoff;
`drive_loop`'s `pending_wave_cache` drain boundary;
`worktree::resume_or_prepare_worktree`; and `proof_center.rs`'s
`CenterEnvironment`, `SENTINEL_TEST_LOCK`, `write_drive_fixture`,
`write_fixture_harness`, `spawn_sentinel`, and subscription readers.

## Excluded — not cells here

- A second implementation commit reapplying bc4a5f8ed's edits.
- Any center path that blocks start or control on the model owner, the
  dashboard UI thread, or the worker's subscription loop.
- Treating a control ack as a durable outcome, or optimistically mutating a
  center row after one. The authoritative result is the later delta the
  driver's own outcome write produces.
- The center's inherited cwd as a fallback for a start's repository.
- Signalling a pid instead of writing the control byte.
- A new cooperative-stop checkpoint for pause; a pause-time `--worktree`
  teardown or any worktree release/bundle primitive.
- Any "paused by whom" field, new session status, or change to
  `SessionState::derive` or `center::terminal`.
- Any dashboard pause key, modal, or hint.
- A refusal path for resuming an already-live session: the existing driver
  lock returns `driver-lock-busy`, which surfaces honestly as `Exited`.
- Center-side retry of a start that exited, and persistence of pending starts
  across a center restart.
- Move/adopt work and the 0243.6 key it would land under.
- Anything discovered beyond the named behaviors: that is board material, not
  a cell here.
"""
validation = """
## Watch
- Ground against HEAD, not against this task's original strict edit sequence.
  Reapplying that sequence would duplicate or regress landed behavior; several
  of its instructions now contradict 0253.4 and 0262, which are done.
- Landed history is not a green gate. Run the commands; do not infer their
  result from bc4a5f8ed being an ancestor.
- An ack is not an outcome. Any assertion about a visible result belongs on
  the delta the driver's durable write produces, never immediately after the
  ack.
- No test may assert over committed repo content. "No driver socket or ledger
  mutation remains on the dashboard's spawn, resume, or kill paths" is a
  review reading of the code, never a test.
- A green run here means no source edit. Do not manufacture one.

## Done when
- Core pause vocabulary and the settled-pause predicate green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core pause` exits 0 and
  reports a non-zero passing count.
- Typed driver control green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io run_control` exits 0
  and reports a non-zero passing count.
- Center protocol, start correlation, control resolution, and settled-pause
  orphan repair green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io center` exits 0 and
  reports a non-zero passing count.
- Dashboard center-routing seams green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`
  exits 0 and reports a non-zero passing count.
- Real-process start, interrupt, pause, and resume-continuity proofs green:
  `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`
  exits 0 and reports a non-zero passing count.
- Per-round workspace gate green: `just test` exits 0.
- `git status --short` is empty. If every gate above passed unmodified, no new
  commit exists and the work summary says so; if a gate was red, exactly one
  task-scoped commit holds the repair and the summary names which gate it
  fixed and which invariant it preserved.
"""

