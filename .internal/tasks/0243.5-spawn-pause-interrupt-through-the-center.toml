  subscribers sees exactly one `Appeared`.
- `center_start_of_a_child_that_exits_before_registering_reports_its_stderr()`
  — `Exited` carries the exit code and bounded stderr, and the center then
  reaches idle exit, proving no pending entry was left behind.
- `dropping_the_requester_mid_start_leaves_the_detached_driver_running()` —
  the child still registers and appears by delta.
- `center_interrupt_stops_a_run_rediscovered_after_a_center_restart()` — the
