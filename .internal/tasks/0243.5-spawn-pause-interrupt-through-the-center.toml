  that test asserts token selection, not the command discriminant. The
  production call site at `:430` is the `try_acquire` body changed above.

**3. `modules/io/src/process.rs`**
- Extract today's `spawn_detached` body into private
  `fn spawn_detached_with(exe: &Utf8Path, args: &[String], cwd: &Utf8Path,
  stdout: Stdio, stderr: Stdio, envs: &[(&str, &str)]) -> crate::Result<Child>`
  (setsid shim selection, `pre_exec` fallback, null stdin, env application,
