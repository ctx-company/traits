- Add `pub fn spawn_detached_split(exe: &Utf8Path, args: &[String], cwd:
  &Utf8Path, stdout_path: &Utf8Path, stderr_path: &Utf8Path, envs:
  &[(&str, &str)]) -> crate::Result<Child>`: two distinct truncated files, so
