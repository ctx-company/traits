schema-version = "0.2"
key = "0243.5"
title = "Spawn, interrupt, and pause go through the center"
status = "ready"
raised = "2026-08-24"
content = """
The center learns to act, without ever owning what it acts on. Four shared,
IO-owned capabilities — start-detached-correlated-by-token, interrupt, pause,
and resume-as-start-by-session-id — usable by the dashboard today and by the
0258 desktop face later. No face may contact a driver's control socket or
mutate orphan evidence itself after this task.

SPAWN — a viewer sends start(target); the center mints a spawn-request token,
forks the driver DETACHED and keeps no handle; the driver comes up exactly as
if typed in a terminal and its register (0243.3) carries the token back; the
center matches it, answers the requesting viewer with the session id, and
every subscriber gets the appeared delta. A driver that dies before
registering is reported to the requester with its stderr.

INTERRUPT and PAUSE — the center is a CLIENT of the driver's existing per-run
control socket, addressed by the socket + token read from lock-holder metadata
(0243.2) or received at register. Interrupt is today's mechanism, unforked.
Pause is a variant: stop at the next frame boundary, write outcome `paused`,
exit — a deliberate sibling of interrupted, resumable by the same `--session`
resume that exists today. Resume through the center is start with a session id
instead of a trait.

Pause is the primitive the future move/adopt stands on: pause -> copy ->
resume. `paused` is therefore an ordinary `DriveOutcomeKind` wire value in the
ledger, with no center-only memory of "paused by whom" that a copy would lose.

WORKTREE RULING (recorded here, implemented and proven below). A paused
`--worktree` run RETAINS its worktree and branch, exactly like every existing
resumable outcome. Proof from current code: `traits run`/`traits drive` Clap
help both already state the worktree and branch are retained after every
outcome; `io::worktree::resume_or_prepare_worktree` re-enters the same
registered worktree; there is no pause-time release primitive; and the ledger
does not carry uncommitted mid-run changes, so releasing would destroy work
the ledger cannot rebuild. The pool cost is bounded and already handled:
`target_slot.rs` assigns four stable cache slots by worktree path and
documents that a parked worktree keeps its slot, and a fifth run shares the
least-recently-assigned slot rather than blocking or failing. A release/bundle
mechanism for dirty state belongs to future move/adopt work, not here.
"""
scope = """
## Decisions

Every capability is an IO-owned typed API on `ctx_traits_io::center`, reusable
by any face. The dashboard becomes a caller. Blocking start/control work runs
on neither the center's model owner, the dashboard's UI thread, nor the
dashboard worker's subscription loop.

Acknowledgement of a control action is never treated as a durable outcome: the
authoritative visible result is the later `RowChanged`/`Ended` delta the
driver's own `record_drive_outcome` produces. No center path optimistically
mutates a row after an ack.

### Edit order (strict)

**1. `modules/core/src/procedure/session.rs`**
- Add variant `Paused` to `pub enum DriveOutcomeKind` (placed next to
  `PausedProviderCredits`); add `"paused" => Self::Paused` to
  `DriveOutcomeKind::from_wire`; add `Self::Paused => "paused"` to
  `DriveOutcomeKind::as_str`.
- Add `pub fn is_settled_pause(&self) -> bool` on `impl DriveOutcomeKind`,
  true for `Paused | PausedProviderCredits | PausedBudgetExhausted`. This is
  the ONE predicate for "a driver exited cleanly having recorded a durable
  resumable pause"; center orphan repair consumes it, nothing copies it.
- Do NOT touch `SessionState::derive`
  (`modules/core/src/procedure/activity.rs`): only `Interrupted`/`Killed` map
  to `Cancelled`, so a `paused` outcome over `awaiting-agent-output` already
  derives `WaitingOnAgent` — nonterminal and resumable, which is required.

**2. `modules/io/src/run_control.rs`**
- Add `#[derive(Debug, Clone, Copy, PartialEq, Eq)] pub enum ControlCommand {
  Interrupt, Pause }` with `pub fn from_wire(byte: u8) -> Option<Self>`
  (`b'i'` -> `Interrupt`, `b'p'` -> `Pause`, anything else `None`) and
  `pub fn wire(self) -> u8`.
- Change `fn bind_control_listener(socket_path: Utf8PathBuf, on_command:
  Arc<dyn Fn(ControlCommand) + Send + Sync>) -> crate::Result<ControlListener>`:
  the accepted connection's single byte is now parsed by
  `ControlCommand::from_wire`. An unreadable or unrecognized byte invokes NO
  callback and writes NO `CONTROL_ACK` — the client then reports "not
  confirmed" exactly as it does for a refused socket.
- Change `pub fn try_acquire(facts: &crate::run_liveness::LiveRunFacts,
  on_command: Arc<dyn Fn(ControlCommand) + Send + Sync>)
  -> crate::Result<Option<DriverLockGuard>>`; rename the parameter and update
  the doc comment. Everything else about the guard, socket lifetime, and
  teardown ordering is unchanged.
- Add private `fn request_control(ledger_path: &Utf8Path, holder:
  &DriverHolder, command: ControlCommand) -> crate::Result<bool>` holding
  today's `request_interrupt` body verbatim except that it writes
  `command.wire()` instead of the literal `b"i"`.
- `pub fn request_interrupt(ledger_path: &Utf8Path, holder: &DriverHolder)
  -> crate::Result<bool>` keeps its signature and becomes a one-line delegate
  to `request_control(.., ControlCommand::Interrupt)`.
- Add `pub fn request_pause(ledger_path: &Utf8Path, holder: &DriverHolder)
  -> crate::Result<bool>` delegating to `request_control(..,
  ControlCommand::Pause)`. Socket selection, connect/stream bounds,
  acknowledgement, and the never-signal-a-pid handoff safety are shared, not
  duplicated.
- Update the closure arity at the surviving `try_acquire` call sites:
  `modules/io/src/run_liveness.rs:476`, `modules/cli/src/app/drive.rs:1205`,
  `modules/cli/tests/proof_center.rs:1223` and `:1917`,
  `modules/cli/tests/proof_merge_on_completion.rs:561`. The two dashboard call
  sites (`modules/cli/src/app/dashboard.rs:11017` and `:11085`) need no arity
  edit: both sit inside kill-action tests deleted in step 8.
- Update the one in-module `bind_control_listener` call site,
  `modules/io/src/run_control.rs:629` inside
  `request_interrupt_uses_the_validated_holders_token_without_reprobing`: its
  closure becomes `Arc::new(move |_command: ControlCommand| { observed.store(
