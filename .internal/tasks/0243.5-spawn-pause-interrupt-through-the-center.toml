**6. `modules/io/src/center.rs`**
- `pub struct DriverRegistration` gains
  `#[serde(default, skip_serializing_if = "Option::is_none")]
  pub spawn_token: Option<String>`. Ephemeral request correlation only: it is
  never written to the ledger, the SQLite index, `CenterRow`, or
  `CenterPublicRow`. Add `const SPAWN_TOKEN_ENV: &str =
  "CTX_CENTER_SPAWN_TOKEN"` and `pub fn spawn_token_from_env() -> Option<String>`
  so the center owns the name; the `DriverNotifier::new` construction at
  `modules/cli/src/app/drive.rs:1244` — the ONE production literal — supplies
  `spawn_token: ctx_traits_io::center::spawn_token_from_env()`. A terminal run
  carries `None`; every notifier reconnect repeats the same token.
  A struct literal must name every field, so the five existing non-driver
  literals each gain `spawn_token: None` in the same edit that adds the field:
  `modules/io/src/center.rs:2854` (`fn test_registration`), `:3168` (the
  registration `Request` in `registration_requires_holder_and_binds_events_to_its_ledger`),
  `:3302` (`fn registered_notifier_stream`), and
  `modules/cli/tests/proof_center.rs:1239` and `:1923`. `Some(token)` is
  reserved for the new correlation regressions named under Done-when; no
  existing test starts correlating a start by acquiring a token.
- Protocol additions (`enum Request`, `enum ResponseResult`, and `Request::id`):
  - `Start { id: String, target: StartTarget }` — the token is minted
    center-side by `fn mint_spawn_token() -> String` as
    `format!("{}-{}", std::process::id(), next_id("start"))`, unique among a
    center's pending starts by construction and never colliding with a
    restarted center's ids. A client never supplies or sees it.
  - `Control { id: String, session_id: String, repo_key: Option<String>,
    command: ControlAction }`
  - `ResponseResult::Start(StartWireResult)` and
    `ResponseResult::Control(ControlWireResult)`.
  - `#[serde(tag = "type", content = "data", rename_all = "kebab-case")]
    pub enum StartTarget { Trait { args: Vec<String>, repo_path: String },
    Session { session_id: String, repo_key: Option<String> } }` — a trait start
    carries its caller's explicitly resolved repository path; the center's own
    inherited cwd is never used as a fallback anywhere on this path.
    `Trait { args }` is EXACTLY the user-supplied trait arguments (what the
    dashboard modal's non-comment lines contain, e.g. `["<trait-id>", "--set",
    "task=0243.5"]`). It never carries the `traits run` command prefix and
    never carries `--progress` or its value. Constructing the executable argv
    is `run_start`'s exclusive job (step 6.1), so no caller may prepend or
    append any of it; doing both would launch
    `traits run traits run ... --progress none --progress none`.
  - `pub enum ControlAction { Interrupt, Pause }` (wire-serialized; maps 1:1 to
    `run_control::ControlCommand` through
    `fn control_command(action: ControlAction) -> crate::run_control::ControlCommand`).
  - `enum StartWireResult { Started { session_id: String },
    Exited { code: Option<i32>, stderr: String } }`.
  - `enum ControlWireResult { Acknowledged, Missing, Ambiguous(Vec<String>),
    NotLive, Unverifiable, Refused }`.
  - Add both new variants to `fn snapshot_request` returning `false`: neither
    takes the query freshness barrier.
- Model-owner work stays small and non-blocking. Add to `enum ModelCommand`:
  - `WatchStart { token: String, notify: mpsc::SyncSender<String>,
    reply: mpsc::SyncSender<crate::Result<()>> }`
  - `ForgetStart { token: String }`
  - `ResolveRow { session_id: String, repo_key: Option<String>,
    reply: mpsc::SyncSender<crate::Result<RowResolution>> }`
  with private `struct ResolvedRow { session_id: String, ledger_path:
  Utf8PathBuf, repo_path: String, live: bool, holder:
  Option<crate::run_control::DriverHolder> }` and private
  `enum RowResolution { Missing, One(ResolvedRow), Ambiguous(Vec<String>) }`,
  built through the existing `select_row` seam (exact-before-prefix,
  repo-scoped, ambiguity reported) — no second resolution rule.
- `CenterModel` gains private `pending_starts: HashMap<String, PendingStart>`
  with `struct PendingStart { notify: mpsc::SyncSender<String>, since:
  Instant }`. `handle_request(Request::Register { .. })`, after its existing
  `refresh_ledger` + `live`/`live_holder` update, calls new
  `fn complete_pending_start(model: &mut CenterModel, ledger: &Utf8Path,
  token: Option<&str>)`: on a token hit it removes the entry and `try_send`s
  the row's `summary.session_id`. Removal-before-send makes a notifier
  reconnect that repeats the token an idempotent no-op.
- `fn has_live` gains `|| !self.pending_starts.is_empty()`, so a center cannot
  idle-exit while a correlation is outstanding. That liveness must be bounded,
  not open-ended: new `fn prune_pending_starts(&mut self)`, called from the
  idle branch of `run_server_at`, retains an entry only while
  `entry.since.elapsed() < ACTION_TIMEOUT`, so a lost worker can never pin the
  center alive forever. Elapsed time is the SOLE pruning predicate:
  `mpsc::SyncSender` exposes no non-mutating disconnected query, and a probe
  `try_send` would either deliver a bogus session id or merely report a full
  channel, so receiver liveness must not be consulted here. Prompt cleanup
  after a normal request comes from step 6's rule that EVERY `run_start`
  return path sends `ForgetStart` — including the requester-disconnect path and
  a failure to write the final response — leaving the timeout as a backstop
  only for a worker that died without unwinding. Pending starts are transient
  request state: never persisted, never consulted for recovery.
- Start execution lives entirely in the connection worker (never the model
  owner, whose `STREAM_TIMEOUT` budget cannot cover worktree preparation).
  `fn serve_connection_worker` gains a `paths: CenterPaths` parameter (cloned
  per accept at `modules/io/src/center.rs:2103` in `run_server_at`) and
  intercepts `Request::Start` and `Request::Control` before the generic
  `ModelCommand::Request` dispatch, exactly as it already intercepts
  `Request::Subscribe`.
  - Call sites for that signature change: update the production accept at
  `:2103` FIRST, then every direct in-module test call — `:3096`
  (`notifications_require_registration_on_each_connection`), `:3133` and
  `:3154` (both in `registration_requires_holder_and_binds_events_to_its_ledger`),
  `:3221` and `:3225` (both in `stalled_peer_does_not_delay_another_typed_request`)
  — each passing `paths(scratch("<that test's name>"))` from the existing
  `fn paths(root: Utf8PathBuf) -> CenterPaths` / `fn scratch(name: &str)`
  test helpers (`CenterPaths` already derives `Clone`), reusing one scratch
  root per test where a test starts two workers. The helper `fn
  handshaken_worker(jobs: mpsc::SyncSender<ModelCommand>)` at `:3262` gains a
  leading `paths: CenterPaths` parameter passed to its `serve_connection_worker`
  call at `:3266`; its four callers — `:3332`, `:3344`, `:3349` (all in
  `accepted_hostile_peers_do_not_delay_a_second_request`, sharing one cloned
  value) and `:3525` (`bounded_socket_transport_carries_all_queries_and_large_get`)
  — supply their own scratch-rooted `CenterPaths`. None of these tests sends
  `Request::Start`, so the value is carried, never used, and no scratch root is
  shared between tests.
  - `fn run_start(paths: &CenterPaths, jobs: &mpsc::SyncSender<ModelCommand>,
  target: StartTarget, token: &str) -> crate::Result<StartWireResult>`:
  1. Resolve argv and cwd. This is the ONE place a start's executable argv is
     built. `Trait { args, repo_path }` -> `["traits", "run", ..args,
     "--progress", "none"]` in `repo_path`, where `args` arrived carrying
     neither the prefix nor the progress flag.
     `Session { session_id, repo_key }` -> `ResolveRow`, then
     `resume_argv(&resolved.session_id)` in `resolved.repo_path`; an empty
     `repo_path`, `Missing`, or `Ambiguous` fails loudly with a typed protocol
     error and never falls back to the center's cwd.
  2. `WatchStart` with the token.
  3. `crate::process::spawn_detached_split` on `center_executable()` with
     `[(run_liveness::SPAWNED_LOG_PATH_ENV, stdout_path),
     (SPAWN_TOKEN_ENV, token)]`, logs at
     `fn start_log_paths(paths: &CenterPaths, token: &str)
     -> crate::Result<(Utf8PathBuf, Utf8PathBuf)>` under
     `paths.runs_root.join("start-logs")` (center-owned and token-unique, so
     concurrent starts never overwrite each other, and the proof harness's
     `CTX_CENTER_RUNS_ROOT` already scopes it).
  4. Poll the `WatchStart` receiver against `child.try_wait()` until one wins:
     registration -> `Started { session_id }`; actual child exit ->
     `Exited { code: status.code(), stderr }` with stderr read from the stderr
     log and truncated to `const START_STDERR_BYTES: usize = 8 * 1024` (far
     inside `MAX_LINE_BYTES`). On observing an exit, drain the receiver ONCE
     more before concluding `Exited`: a very short run can register and then
     finish before the next poll, and that must report `Started`, not a
     spurious pre-registration failure. No five-second grace and no
     `STREAM_TIMEOUT` bound governs this wait; the loop's own ceiling is
     `ACTION_TIMEOUT`, past which it returns a typed protocol error rather
     than waiting on a driver that neither registered nor exited.
  5. Drop the `Child` and send `ForgetStart` on every exit path — the
     `Started` path, the `Exited` path, the typed-error path, the
     requester-disconnect path, and a failure to write the final response —
     so the pending entry is normally gone the moment the request ends and
     `prune_pending_starts`'s `ACTION_TIMEOUT` is only a backstop. The
     detached child keeps running; it appears to every subscriber through the
     ordinary `Appeared` delta.
- Control execution also lives in the connection worker:
  `fn run_control_request(jobs: &mpsc::SyncSender<ModelCommand>, session_id:
  &str, repo_key: Option<&str>, action: ControlAction)
  -> crate::Result<ControlWireResult>` asks the owner for a `RowResolution`,
  maps `Missing`/`Ambiguous` straight through, `!live` -> `NotLive`, live with
  `holder == None` or
  `holder.session_id != resolved.session_id` -> `Unverifiable` (a held lock
  with missing/malformed/stale metadata is authoritatively live but must never
  be guessed at), then calls `run_control::request_interrupt` /
  `request_pause` with that one validated holder — `true` -> `Acknowledged`,
  `false` -> `Refused`. No row mutation follows an ack.
- Orphan-repair fix in `CenterModel::refresh_after_probe`: in the
  `DriverProbe::Unheld` maintenance branch, the
  `if !terminal(&summary) { record_interrupted_outcome_in_session(..) }` guard
  becomes `if !terminal(&summary) && !settled_pause(&summary) { .. }`, with new
  `fn settled_pause(summary: &crate::run_summary::RunSummary) -> bool` reading
  `summary.last_drive_outcome.as_deref().map(DriveOutcomeKind::from_wire)` and
  delegating to core's `is_settled_pause`. Derived from ledger/summary evidence
  only, never from center memory; the existing paused-credit and paused-budget
  cases share this one predicate. Stale holder metadata is still cleared under
  maintenance ownership and the row still goes `live = false`; only the
  outcome overwrite is suppressed. `terminal()` and public `SessionState` are
  untouched, so a paused row stays resumable to every reader.
- Public client API (each mirrors the existing `list`/`get` encode-decode
  shape and adds nothing else):
  - `pub fn start_trait(args: &[String], repo_path: &Utf8Path)
    -> crate::Result<StartResult>` — `args` is the user-supplied trait
    arguments only; the client encodes them into `StartTarget::Trait`
    unchanged and never prepends `traits run` or appends `--progress none`.
  - `pub fn start_session(session_id: &str, repo_key: Option<&str>)
    -> crate::Result<StartResult>`
  - `pub fn control(session_id: &str, repo_key: Option<&str>,
    action: ControlAction) -> crate::Result<ControlResult>`
  - `pub enum StartResult { Started { session_id: String },
    Exited { code: Option<i32>, stderr: String } }` and
    `pub enum ControlResult { Acknowledged, Missing, Ambiguous(Vec<String>),
    NotLive, Unverifiable, Refused }`.
  - Add private `fn request_with_timeout(request: Request, timeout: Duration)
    -> crate::Result<ResponseResult>` (today's `request` body with the read
    bound threaded through the existing `read_line_bounded(stream, false,
    timeout)` parameter); `fn request` delegates with `STREAM_TIMEOUT`. Start
    and control use `const ACTION_TIMEOUT: Duration =
    Duration::from_secs(600)`, because registration follows worktree
    preparation and cannot be held to the two-second query bound.
  - `fn resume_argv(session_id: &str) -> Vec<String>` moves here verbatim from
    the dashboard: `["traits", "drive", "--session", <id>, "--progress",
    "none"]`, still deliberately without `--worktree`.

**7. `modules/cli/src/app/dashboard/worker.rs`**
- Add `pub(super) struct ActionResult { pub message: String, pub session_id:
  Option<String>, pub task_key: Option<String> }`, an `actions:
  mpsc::Receiver<ActionResult>` + retained `mpsc::Sender<ActionResult>` on
  `Handle`, and `pub(super) fn action_results(&self) -> Vec<ActionResult>`
  draining like the existing `explanation_results`.
- Add `pub(super) fn start_trait(&self, args: Vec<String>, cwd:
  camino::Utf8PathBuf, task_key: Option<String>)`,
  `pub(super) fn start_session(&self, session_id: String, display_id: String)`,
  and `pub(super) fn control(&self, session_id: String, display_id: String,
  action: ctx_traits_io::center::ControlAction)`. Each spawns its own
  short-lived thread that calls the center client and sends one
  `ActionResult`. They must NOT run inside `handle_one_command`: that runs on
  the subscription loop's thread, and a multi-second start there would stall
  every delta.
- Neither start method formats its own text. Add one pure mapping seam,
  `fn start_action_result(result: Result<ctx_traits_io::center::StartResult,
  String>, task_key: Option<String>, display_id: Option<&str>)
  -> ActionResult`, and require BOTH `start_trait` and `start_session` to
  build their `ActionResult` solely through it (`start_trait` passes
  `display_id: None`, `start_session` passes `Some(&display_id)` and
  `task_key: None`). Its three branches are exhaustive and fixed:
  - `Ok(StartResult::Started { session_id })` -> `session_id: Some(session_id)`,
    `task_key` passed through, message naming the started/resumed session.
  - `Ok(StartResult::Exited { code, stderr })` -> `session_id: None`,
    `task_key: None`, and a message that contains the exit code AND, when
    `stderr` is non-empty, the center-provided stderr string UNCHANGED and
    entire (no first-line trim, no re-truncation — the center already bounded
    it to `START_STDERR_BYTES`). This is the only path by which a driver that
    died before registering explains itself, so dropping it silently loses the
    task's required failure evidence.
  - `Err(error)` -> `session_id: None`, `task_key: None`, message containing
    the client error text.
  `control` likewise formats nothing itself: `Ok(result)` renders through
  step 8's `super::control_message(&result, &display_id)` and `Err(error)`
  renders a message naming `display_id` and the error, both with
  `session_id: None, task_key: None`.

**8. `modules/cli/src/app/dashboard.rs`**
- `State.worker` is `Option<worker::Handle>` and unit tests build
  `State::new_without_worker()`, so the decisions must be testable without a
  worker. Extract two pure seams and unit-test those, leaving each dispatch a
  thin `if let Some(worker) = &state.worker`:
  - `fn spawn_start_request(text: &str) -> Result<(Vec<String>, Option<String>),
    String>` — today's line parsing, `FORBIDDEN` flag rejection, real-Clap
    validation, and `task_dispatch_key`, returning `(user_args, task_key)` or
    the exact refusal message. `user_args` is today's `user_args` vector
    VERBATIM: the non-comment lines only. Validation still builds today's
    `["ctx", "traits", "run", ..user_args, "--progress", "none"]` argv, but
    that vector is now TEMPORARY — it exists only to feed
