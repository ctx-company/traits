validation = """
## Watch
- A start must never block the model owner or the dashboard subscription
  thread; a control request must never perform driver socket I/O on the model
  owner. Both would deadlock registration or stall every subscriber.
- An ack is not an outcome. Assert visible results through the delta the
  driver's own durable write produces, never immediately after the ack.
- Center cwd is never a fallback for a start's repository.
- Every new regression is a behavioural proof over scratch fixtures; no test
  may assert over committed repo content, so "no `run_control`/`run_session`
  call remains on the dashboard's spawn, resume, or kill paths" is a review
  reading of the diff, never a test.

## Done when

Each bullet names the exact `#[test] fn ...()` symbol to add, grouped under
the existing command that runs it.

`cargo test -p ctx-traits-core pause`
- `paused_drive_outcome_kind_round_trips_the_wire_value()` —
  `from_wire("paused")` is `Paused` and `Paused.as_str()` is `"paused"`.
- `settled_pause_covers_every_durable_resumable_pause()` — `is_settled_pause`
  is true for `Paused`, `PausedProviderCredits`, `PausedBudgetExhausted` and
  false for `Interrupted`, `Killed`, `Completed`, `Other("paused-ish")`.

`cargo test -p ctx-traits-io run_control`
- `control_command_parses_only_the_known_wire_bytes()` — `b'i'`/`b'p'` map to
  `Interrupt`/`Pause`, every other byte is `None`, and `wire()` round-trips.
- `unrecognized_control_byte_invokes_no_callback_and_is_not_acknowledged()` —
  a live listener sent `b'x'` runs neither branch and writes no ack.
- `pause_request_delivers_the_pause_command_to_the_lock_holder()` —
  `request_pause` against a `try_acquire`d guard returns true and the callback
  observes `ControlCommand::Pause`.

`cargo test -p ctx-traits-io center`
- `register_with_a_spawn_token_completes_exactly_one_pending_start()` — the
  matching watcher receives the row's session id and a second pending token
  does not fire.
- `repeated_registration_with_the_same_spawn_token_completes_nothing()` — a
  notifier reconnect repeating the token is an idempotent no-op.
- `register_without_a_spawn_token_completes_no_pending_start()` — a terminal
  run never resolves someone else's start.
- `pending_start_blocks_idle_exit_until_action_timeout_prunes_it()` — inserts
  one pending start with `since: Instant::now() - (ACTION_TIMEOUT -
  Duration::from_secs(1))` and asserts `prune_pending_starts` retains it and
  `has_live` is still true; then sets `since: Instant::now() -
  ACTION_TIMEOUT` and asserts the entry is dropped and `has_live` is false.
  Both sides of the boundary are asserted with a synthesized `since`, so the
  test neither sleeps nor consults the receiver. Build each `since` with
  `Instant::now().checked_sub(..).expect("monotonic clock predates
  ACTION_TIMEOUT")` rather than bare `-`, so a machine booted seconds ago
  fails loudly instead of panicking inside an operator.
- `control_resolution_reports_missing_ambiguous_and_not_live_targets()` — the
  three distinct typed results come out of the `select_row` seam.
- `control_resolution_rejects_a_holderless_or_mismatched_live_row_as_unverifiable()`
  — a held row with absent metadata, and one whose `holder.session_id` differs,
  both yield `Unverifiable` and contact no socket.
- `discovery_preserves_every_settled_pause_outcome_and_clears_stale_metadata()`
  — an unheld ledger whose last outcome is `paused`,
  `paused-provider-credits`, or `paused-budget-exhausted` keeps that outcome
  through `refresh_after_probe`, goes `live = false`, and loses stale holder
  metadata; existing `discovery_repairs_an_unheld_nonterminal_ledger` stays
  green for the non-pause case.
- `start_and_control_requests_round_trip_and_skip_the_snapshot_barrier()` —
  both requests and both wire results serialize and deserialize, and
  `snapshot_request` returns false for each.
- `resume_argv_is_exact_and_never_carries_worktree()` — moved verbatim from
  `dashboard.rs`; argv is exactly
  `traits drive --session <id> --progress none`.

`cargo test -p ctx-traits-cli --lib dashboard`
- `spawn_start_request_returns_only_user_arguments_and_the_task_key()` — the
  returned vector equals the request's non-comment lines exactly: it does not
