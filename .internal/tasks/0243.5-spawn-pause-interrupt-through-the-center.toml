**4. `modules/cli/src/app/interrupt.rs`**
- Add `static PAUSED: AtomicBool`.
- Add `pub fn request_pause()`: stores `true` into `PAUSED` FIRST, then into
  `INTERRUPTED`, so any thread that observes the interrupt flag already
  observes the pause discriminant. Never touches `SIGINT_COUNT` or
  `run_kill` — a pause is not an escalation.
- Add `pub fn is_paused() -> bool`.
- Extend `pub fn reset()` to clear `PAUSED` (signature unchanged) so a
  long-lived host process never carries a pause into the next drive.
- `handle_sigint` and `request_stop` are unchanged: a real `SIGINT` sets only
  `INTERRUPTED`, so it still means interrupt.

**5. `modules/cli/src/app/drive.rs`**
- At the `run_control::try_acquire` call site (line 1205) pass
  `std::sync::Arc::new(|command| match command {
  ctx_traits_io::run_control::ControlCommand::Interrupt =>
  crate::app::interrupt::request_stop(),
  ctx_traits_io::run_control::ControlCommand::Pause =>
  crate::app::interrupt::request_pause() })`.
- Add `fn cooperative_stop_status() -> &'static str` returning `"paused"` when
  `crate::app::interrupt::is_paused()` and `"interrupted"` otherwise, plus
  `fn cooperative_stop_detail() -> &'static str` returning the matching
  capability message ("drive paused at a frame boundary; resume with the same
  --session to continue from the parent cursor" / today's SIGINT wording).
  Use both at the three existing cooperative-stop checkpoints — `drive_loop`
  (line ~2159, the `is_interrupted() && pending_wave_cache.is_empty()` guard),
  `wait_for_attach_advance` (line ~4780), and the conductor-lease wait (line
