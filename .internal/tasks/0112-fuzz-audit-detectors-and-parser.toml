schema-version = "0.2"
key = "0112"
title = "Fuzz the audit detectors and the canonical parser"
status = "ready"
raised = "2026-08-05"
content = """


The hidden-content audit is what the launch rides on; a byte-level fuzzer over the
detectors + parser is the highest-credibility test we can ship — it pre-empts the
"here's an injection your scanner misses" reply and any panic-on-malformed-input
embarrassment. Verified absent 2026-07-27: no fuzz targets anywhere in the tree.

All targets are pure-core: `scan_hidden_content` (`modules/core/src/audit.rs`) + its
sub-scanners (`scan_bidi_controls`, `scan_homoglyphs`, `scan_base64_blobs`);
`sanitize_model_text` (`model_view/sanitize.rs`); canonical decode (`decode_trait`
in `encoding.rs`, `Reference::parse`, `Digest::parse`). Land a `fuzz/` dir
(`cargo-fuzz`) or a proptest harness under `#[cfg(test)]`.

Property targets: detectors never panic and are total over arbitrary UTF-8/bytes;
`decode_trait` never panics on arbitrary TOML; `decode → canonical_json → decode`
round-trips stably; every seeded injection class is still caught.

"""
validation = """
## Watch

- Detectors/decode are pure, so fuzzing needs no IO; keep targets deterministic and
  CI-fast.
- Seed the corpus from real fixtures (and 0110's corpus once it exists); a labeled
  detector-P/R fixture set (the un-migrated P236) would improve the seeds but is not
  a prerequisite.

## Done when

Fuzz targets for the detectors, sanitizer, and canonical decode build and run; a seed
corpus is committed; a crash/panic or a missed seeded-injection fails the run.

Full original contract: `archived/board/execution-plan.md` (Group 55, P238).
"""
