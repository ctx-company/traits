## GOALS — binding

1. **The center creates a task on request, inside the one task protocol family,
   off the model owner.** The creation request and its result join whatever task
   or board request and result family `0266.1` landed, over the same socket the
   board answer arrives on; a second, parallel, creation-only or GUI-only
   protocol is a defect. The board is selected from the request's repository
   identity and `0266.1`'s shared board-directory convention, never from the
   center process's working directory and never from a copied CLI constant
   (content Correction 6). The board load, the serialization and the write run
   outside the sole model/SQLite owner's request handling (content Correction 5).
   Decided by the declared `proof_center` check over the real socket: a task
   created into a scratch repository's board while the center process's cwd is
   elsewhere, the created document present on disk with the requested title and
   parentage, and the center answering an unrelated request while a board write
   is in progress, so the isolation is observed rather than asserted. Plus the
   closing diff read for any board work inside `handle_request`.
   Excluded: a second task protocol family; a creation reachable only by the
   desktop; deriving the board directory from `std::env::current_dir` or
   `Utf8Path::new(".")`; a `git` invocation on the creation path; changing run
   subscription semantics, the delta reducer or run controls; any center-side
   read the board answer does not already own.

2. **`TaskProviderMut::create` stays the only writer, and it is hardened at that
   boundary.** The center and every face reach creation through the existing
   provider verb (`provider.rs:258-273`, `task_files.rs:345-389`); key
   assignment, filename derivation, `TaskDocument` construction and the write
   itself exist in exactly one place and are not reimplemented, wrapped-and-
   duplicated or partially copied into the center or a face. At that boundary,
   an empty or whitespace-only title is refused with `WriteError::InvalidField`
   before anything is written, a created task carries a raised date from the
   shared UTC date projection, and no placeholder title is ever persisted
   (content Correction 2).
   Decided by the declared `ctx-traits-io --lib task_files` check over scratch
   board directories: an empty title and a whitespace-only title each refused as
   an invalid field with no file left behind; a valid create storing the
   owner-supplied title and a `YYYY-MM-DD` raised date; and the existing
   top-level and child key assignment, parentage, validation and steps round
   trips still intact.
   Excluded: a second creation implementation anywhere; a default, generated or
   placeholder title; a new date or calendar dependency, or a second UTC-date
   conversion beside `audit_journal::today_date_utc`; changing `slugify`'s
   fallback, the key allocation rules, or the archived-directory routing; a
   validation rule beyond the title that no goal here names; any change to
   `update`, whose refusals are not this cut's.

3. **One center-side serialization point per board, answering rather than
   queueing.** Concurrent creations for one board pass through a single
   center-side serialization point, so two concurrent requests cannot mint the
   same key or overwrite one another's document (content Correction 3). A
   contender is answered immediately with a typed occupied refusal; it is never
   queued, never blocked on, and never silently retried on its behalf. A
   creation for a different board is not made to wait and is not spuriously
   reported occupied.
   Decided by the declared `proof_center` check: with contention forced
   deterministically through a bounded seam rather than by racing threads and
   hoping, one creation succeeds and the contender is answered with the typed
   occupied refusal, immediately rather than by waiting out a timeout;
   separately, a creation issued after the holder releases succeeds without
   duplicating a key or losing either document; and a concurrent creation on a
   second board succeeds meanwhile.
   Excluded: a blocking or bounded-wait acquisition on the request path
   (`file_lock::lock_exclusive_blocking` is the shape this goal forbids); an
   internal retry loop, backoff or queue; a global lock that serializes
   unrelated boards; a sleep or timing window standing in for the proof; making
   the serialization point a client responsibility.

4. **Refusals are typed data a face can render.** Every expected refusal —
   invalid title, occupied board, an unknown or ambiguous parent, and whatever
   absent/unreadable-board outcomes `0266.1` established — reaches the caller as
   a typed, matchable value in the action-specific result arm, following the
   established `Start`/`Control` client-helper split where a generic
   `ResponseResult::Error` means transport or protocol failure only (content
   Correction 4). The public client helper distinguishes the two.
   Decided by the declared `proof_center` check: each refusal class asserted as
   its own typed value over the real socket, distinguishable from one another
   and from a transport failure, with no task file written for any of them.
   Excluded: mapping an expected refusal onto `ResponseResult::Error { message
   }` or onto a stringly-typed status; a face parsing a refusal out of a message
   string; widening `WriteError` with cases no caller here matches; making
   refusal rendering this cut's job — the desktop's is `0266.8`'s and the TUI's
   is goal 6's existing message.

5. **A requested draft is created as a draft, and the changed board answer
   announces it.** The new-task path explicitly carries `0266.1`'s canonical
   draft representation, so the created top-level task is `draft` and not a
   `Ready`-deriving document with an unset status (content Correction 1). After
   a successful create the center invokes `0266.1`'s single board
   refresh/broadcast route, so a subscribed face receives the complete changed
   board answer without issuing a second request and without any timer; the new
   task appears exactly once, carrying draft status. A refused creation produces
   no board change.
   Decided by the declared `proof_center` check over the real socket: a
   subscriber that has accepted the board answer receiving the changed answer
   after a creation without asking again, the new task present exactly once with
   the draft state the answer carries, and a refused creation emitting no board
   change; plus the declared `ctx-traits-io --lib task_files` check for a
   requested draft round-tripping through the provider and summarizing as the
   canonical representation; plus the closing diff read for any client timer,
   interval, tick or optimistic insertion added on the creation path.
   Excluded: hard-coding every center creation to `draft`, which would change
   Split's meaning (content Correction 8); a client-side timer, poll or
   re-request to observe the result; an optimistic row inserted before or
   instead of the answer changing; a second board event stream or a
   creation-specific notification beside `0266.1`'s; relying on the center's
   periodic scan as the mechanism that carries the result; re-deriving `draft`
   on any client from a field that does not say so.

6. **Both TUI Split creations go through the center, observably unchanged.**
   `apply_split_step` and `TaskAction::Split` (`dashboard.rs:7236-7269,
   7334-7354`) share one submission path to the center's creation, and no direct
   `open_read_write(...).create(...)` call remains in the TUI. Each site
   preserves its payload — the queue child's title, content, parent, validation
   and steps; the manual child's title and parent — its confirmation and skip
   behaviour, its split-queue progression across accepted and skipped children,
   its success message naming the created key and parent, and its refusal
   message. Split's existing status semantics are preserved (content Correction
   8). Creation success is observed through the center's board answer, not
   through a new poll and not through an inserted row.
   Decided by the declared `ctx-traits-cli --lib dashboard` check over scratch
   fixtures: both sites creating through the center helper, an accepted and a
   skipped queue child advancing the queue identically to today, a refusal
   rendering its message without advancing state incorrectly, and no remaining
   direct provider create call on either path.
   Excluded: changing what Split creates, when it prompts, what it names, or its
   queue ordering; adding a `ctx tasks create` command; routing `ctx tasks
   list`/`show` through the socket, which must keep working with no center
   running; removing the TUI's existing board reader or its poll, which is
   `0266.7`'s to remove; building a generic TUI command framework — any widening
   of the action worker's result is bounded to the demonstrated create result;
   asserting any TUI test against this repository's own board.

7. **Nothing else is opened, and the workspace does not move.** No task mutation
   beyond creation — no editing, claiming, closing, status change or deletion —
   is added; no desktop file is touched; no CLI create command is added; no
   preview, row-state or header work is done. `ctx-traits-io` still depends only
   on `ctx-traits-core` and its existing third-party set, with no filesystem
   watcher and no date/time dependency. Root Cargo resolution and the root
   `Cargo.lock` stay gpui-free and the per-round workspace gate stays green.
   Decided by the declared root metadata and lockfile check, the declared `just
   test` and `ctx-traits-cli --lib tasks` checks, and the closing diff read for
   the rest. No board check can decide the diff-read half: a check runs in a
   clean detached worktree of the merged sha with no base to diff against.
   Excluded: a grep forbidding the string `gpui` in `Justfile` or
   `.github/workflows/`, since a separate desktop lane there is sanctioned and
   such a check would red on the sanctioned outcome; adding the desktop project
   to root workspace members; replacing the files backend or migrating the board
   store, which `.internal/docs/the-board-one-door.md` lists as future work;
   anything belonging to `0266.2`, `.4`, `.5`, `.6`, `.7` or `.8`.

8. **The pass is reviewed once and bounded.** The completed diff is read against
   these goals and the parent's corrections before the task is called done.
   Exactly one targeted repair-and-rerun round is allowed; if a second would be
   needed, stop and report the exact failing command with its evidence, or the
   unresolved refusal, concurrency, board-update or TUI-migration contract,
   rather than iterating. The work summary names what `0266.1` actually landed
   for the board answer, the board-directory helper, the draft representation
   and the board event; where the serialization point and the wire refusal type
   landed; how contention was forced deterministically; and every deviation from
   the approach below.

## APPROACH — suggested route, not a boundary

### Discover before editing

- Read `0266.1`'s landed surfaces first: the center's task/board request and
  result family, the board answer's shape and its refresh/broadcast route, the
  board-presence outcomes, the shared board-directory helper, and the canonical
  `draft` representation with its `TaskStatus`/`DerivedStatus` spelling. Every
  name below is a guess against them. If any is absent, report an unmet
  prerequisite and stop rather than building it here.
- Read the TUI as it then stands. `0266.7` is a sibling, not a prerequisite, so
  `Screen::Tasks` may still hold its direct reader and `resync_tasks_board_after_write`
  (`dashboard.rs:6254-6275`), or may already be on the served answer. Fit the
  creation to what is there; do not remove `0266.7`'s reader and do not assume it
  is gone.
- Read whether the connection worker gained a board-specific "short resolve, then
  blocking work" helper in `0266.1`. If so, extend it; if not, `Start`/`Control`
  (`center.rs:3278-3348,3380-3429`) are the shape to follow.

### Edit order

1. `modules/core/src/task/provider.rs`: the serializable wire shape for the
   creation payload — the cheapest form is `Serialize`/`Deserialize` on `NewTask`
   itself, which every field supports once `draft` lands — and a serializable
   creation-refusal type. A dedicated refusal enum is likely leaner than
   widening `WriteError` with an occupied case and serde derives, given
   `InvalidField.field` is `&'static str`; either is acceptable if goal 4 holds.
2. `modules/io/src/task_files.rs`: the title refusal and the raised-date stamp
   inside `Board::create`, so every caller inherits both (goal 2). Reuse
   `crate::audit_journal::today_date_utc()` exactly as the close path does
   (`task_files.rs:518`).
3. `modules/io/src/center.rs`: the create request and its typed result inside
   `0266.1`'s family; the connection-worker path that resolves the repository
   row, acquires the per-board serialization point, calls
   `FilesTaskBoard::open_read_write(dir).create(payload)`, and on success invokes
   the landed board refresh/broadcast; and the public client helper mapping
   protocol failure apart from typed refusal, following `start_trait`/`control`
   (`center.rs:838-902`).
4. `modules/cli/src/app/dashboard.rs`: one submission helper both Split sites
   call, replacing both direct `create` calls, preserving payloads, messages and
   queue progression (goal 6). If the landed TUI architecture needs the call off
   the event loop, the existing action worker
   (`dashboard/worker.rs:119-159`, drained at `dashboard.rs:2813-2818,5908-5927`)
   is the reuse point, widened only as far as the create result needs.
5. The focused proofs, then the declared checks in the order under Bounded
   refinement.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like `Request::CreateTask { id, repo_key, new_task }` and a
`ResponseResult::CreateTask(CreateWireResult)` inside `0266.1`'s family, with
`CreateWireResult::{Created(TaskSummary), Occupied, InvalidField { field, reason
}, ParentMissing, ...}` covering the board-presence outcomes `0266.1` defined; a
public `center::create_task(new_task, repo_key) -> crate::Result<CreateResult>`
beside `start_trait`/`control`; the per-board serialization point as a lock file
under the center's own state directory or the board directory, opened with
`file_lock::open_lock_file_no_follow` and taken with `try_lock_exclusive`
(`file_lock.rs:12-42`), whose `Ok(false)` is exactly the occupied answer this
task wants — but check first whether `0266.1` put a board-scoped guard somewhere
better; and a `dashboard::submit_task_creation(...)` the two Split sites share.
Names, module paths and signatures follow whatever conventions the prerequisite
established. The behaviours goals 1-7 fix are not suggestions; where they live
and what they are called are.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- Provider, over scratch board directories: empty and whitespace-only titles
  refused as invalid fields with no file written; a valid create storing the
  title and a `YYYY-MM-DD` raised date; a requested draft round-tripping and
  summarizing as the canonical draft state; top-level and child key assignment,
  parentage, validation and steps unchanged.
- Center, over the real socket: a creation into a scratch repository selected by
  repository identity while the center's cwd is elsewhere; the created document
  on disk carrying the provider's key, filename and formatting; each refusal
  class as its own typed value; forced contention yielding no duplicate key and
  an immediate occupied answer; a second board unaffected; an unrelated request
  served while a board write is in progress.
- Subscription, in the same harness: a subscriber receiving the changed board
  answer after a creation without a second request, the new task present exactly
  once with draft status, and a refused creation emitting no board change.
- TUI, over scratch fixtures: both Split sites creating through the center
  helper, accepted and skipped queue progression preserved, and success and
  refusal messages rendered.

A deterministic contention proof needs a bounded seam around the serialization
point — a test-only hold or ordering hook — rather than two threads and a
prayer. Tests use scratch boards, scratch repositories and scratch center tuples
with arbitrary keys; no test reads or writes this repository's committed
`.internal/tasks`.

### Reuse points

`TaskProviderMut::create` and `Board::create` with `next_top_level_key`,
`next_child_key`, `slugify` and `write_document`
(`task_files.rs:345-389,331-343,735-785`) as the one write implementation;
`FilesTaskBoard::open_read_write` and `ReadWriteBoard` (`task_files.rs:787-855`)
