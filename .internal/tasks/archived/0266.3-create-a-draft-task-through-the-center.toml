## Owner ruling 2026-09-01 (binding, supersedes conflicting text below)

The board-changed center event (`BoardChanged` WireMessage/CenterEvent and
its scan-driven emission) does not exist — it was 0266.1's residue. THIS
run builds it as in-scope work, then does its own task on top. Every
sentence below that forbids building that center prerequisite, or directs
a park when it is absent, is satisfied by this ruling — do not park on it
again. The served board model stays the sole source.


This plan separates GOALS from APPROACH, and only the GOALS bind. Each goal names
an observable outcome, what decides it, and what it excludes. The APPROACH
section — discovery order, file and symbol guesses, signatures, edit order,
commands and proof mechanics — is the architect's suggested route from the
grounding at HEAD `d6cc41546`. Deviate from any of it wherever a goal requires
it, and report the deviation in the work summary; a deviation is not a violation
and needs no escalation.

`screens/tasks.md` tags the board bar's right-hand action `data:` and says what
it does: `new task` creates a draft. It is the one write on an otherwise
read-mostly screen, and the spec gives it no placeholder exit, so it has to work.

This cut builds the write itself and nothing that renders it: the center creates
the draft over the same socket the board answer arrives on, an existing non-GUI
face reaches the same creation in the same release, and the board answer that
already feeds the sections changes so the new task appears without anything
polling for it. No desktop process writes a task file, names one, or formats one;
this cut has no reason to edit desktop code at all. Binding the bar's action and
rendering its failure is `0266.8`, deliberately separate.

## Grounded at HEAD d6cc41546, and what is not there yet

The worktree was clean at grounding. **`0266.1` had not landed**: it is `ready`,
and its own prerequisites `0256.1`, `0265.5`, `0265.9` and `0258` are `ready`
too. There is no desktop project, no gpui package, no desktop manifest and no
desktop command; `cargo metadata --format-version 1 --no-deps` resolves no gpui.
There is no task or board arm anywhere in the center protocol: `Request` carries
register/notification, subscribe, start/control and run queries only
(`modules/io/src/center.rs:84-153`), `ResponseResult` has no task result
(`center.rs:196-209`), and `CenterDelta` carries only run-row and activity
variants (`center.rs:262-281`).

So every name this plan gives to a `0266.1` surface — the board answer, the
board-presence outcomes, the board-directory helper, the board event, the
canonical `draft` representation — is a guess to be replaced by reading what
`0266.1` actually landed. **The first act of this cell is that read.** If the
center-served board answer, the shared board-directory convention, the board
freshness event or the canonical `draft` representation is absent at execution
time, the prerequisite is unmet: stop and report that, rather than building any
of them locally. Building `0266.1`'s capability here would be a second board
implementation, which is the charter's named defect.

What *is* readable today, and what the goals lean on, is the whole write side:
`NewTask` and `WriteError` (`modules/core/src/task/provider.rs:85-103,198-222`),
`TaskProviderMut::create` (`provider.rs:258-273`), `Board::create` and its key,
filename and document rules (`modules/io/src/task_files.rs:345-389,735-785`),
`write_document` (`task_files.rs:331-343`), `open_read_write` and `ReadWriteBoard`
(`task_files.rs:787-855`), the nonblocking flock primitives
(`modules/io/src/file_lock.rs:12-42`), `audit_journal::today_date_utc`
(`audit_journal.rs:139-149`), the center's client helper pattern
(`center.rs:780-902`), its connection-worker interception of `Start`/`Control`
(`center.rs:3278-3348,3380-3429`) against the sole model/SQLite owner's
`handle_request` path (`center.rs:2915-2970`), the repository index
(`modules/io/src/state.rs:477-558`), and the TUI's two Split creation sites
(`modules/cli/src/app/dashboard.rs:7236-7269,7334-7354`).

## Eight corrections

**Correction 1 — `NewTask.status = None` is not a draft.** An open childless
document with no stored status derives `Ready`
(`modules/core/src/task/graph.rs:156-172`), and a created draft that derives
`Ready` is dispatchable, which is exactly what archived `0250` says a draft is
not. Stored `TaskStatus` at HEAD is the closed set `ready|done|cancelled`
(`modules/core/src/task/mod.rs:22-31`). The new-task request must therefore carry
the canonical `draft` representation `0266.1` landed, explicitly. This cut
consumes that representation; it does not add, widen or reinterpret it, and it
does not invent a client-side reading of `draft`.

**Correction 2 — `create` accepts an unnamed, undated document today, and the
screen that creates it renders both fields.** `Board::create` performs no title
validation at all — the existing `empty_title_refused` test
(`task_files.rs:1418-1437`) covers `update`, not `create` — and `slugify` falls
back to the literal `task` for an all-non-alphanumeric title
(`task_files.rs:764-785`), so an empty title produces `NNNN-task.toml`. It also
writes `raised: None` (`task_files.rs:358-377`) while `facts` on this very screen
renders `raised`. Ruling, per parent Correction 7: an empty or whitespace-only
title is refused **at the IO provider boundary** with `WriteError::InvalidField`
so every face inherits one rule; a created task carries a raised date; and no
placeholder title (`untitled`, `New task`) is ever persisted, because an invented
title reads as evidence. The date comes from the shared UTC `YYYY-MM-DD`
projection already used for the `closed` field (`audit_journal.rs:139-149`,
consumed at `task_files.rs:518`) — not from a new calendar conversion and not
from a new dependency.

**Correction 3 — creation has no serialization, and the failure is silent
corruption rather than an error.** `create` loads the board, computes the next
key from the loaded snapshot, and writes with no lock
(`task_files.rs:345-389`); `next_top_level_key` and `next_child_key` are pure
functions of that snapshot (`task_files.rs:735-762`); and `write_document` is
`create_dir_all` then `std::fs::write` (`task_files.rs:331-343`), which
overwrites. Two concurrent creations therefore compute the same next key: with
different titles they produce two documents claiming one key, which only a later
`sync` reports as a duplicate; with the same title one silently overwrites the
other. Key allocation and write are one operation or they are broken. Per the
parent, the serialization point is **center-side**, one per board, and contention
is answered immediately as a typed refusal — never queued, never silently
retried, never blocked on.

**Correction 4 — an expected refusal must survive as data, and today it cannot.**
`WriteError` has no occupied or busy case and derives no serde traits
(`provider.rs:198-222`); its `InvalidField.field` is `&'static str`, so
deserializing `WriteError` itself is not a free win. `NewTask` derives neither
`Serialize` nor `Deserialize` (`provider.rs:85-103`) although every field is
serializable once `draft` lands. So both halves of the wire are capabilities to
add. The binding shape: the request carries the typed creation payload, and an
expected refusal — invalid title, occupied board, unknown parent, an absent or
unreadable board — arrives as **typed data the face matches on**, following the
established `StartWireResult`/`ControlWireResult` split where the generic
`ResponseResult::Error` means transport or protocol failure and the
action-specific arm means an answered outcome (`center.rs:196-209,780-902`).
Flattening a refusal into `ResponseResult::Error { message }` is the defect: it
makes "the board is busy, try again" indistinguishable from "the center broke".

**Correction 5 — the write must not run on the model owner's path.** The sole
model/SQLite owner drains `ModelCommand::Request` and calls `handle_request`
(`center.rs:2915-2970`) under a two-second reply timeout
(`center.rs:3330-3336`); a board load, a lock acquisition and two filesystem
writes there stall every other client and can exceed that timeout under exactly
the contention this task introduces. `Start` and `Control` already demonstrate
the alternative: the connection worker intercepts the request, asks the model
owner only for short identity resolution via `ModelCommand::ResolveRow`, performs
the blocking work itself, and writes the response
(`center.rs:3278-3348,3380-3429`). If `0266.1` landed a more specific board-side
equivalent, use that one.

**Correction 6 — the board is chosen by repository identity, never by the
center's cwd.** `.internal/tasks` is a CLI-private constant
(`modules/cli/src/app/tasks.rs:20-26`) and the center serves many repositories;
it already resolves repository identity through the machine checkout index
(`state::RepoIndexEntry`, `read_repo_index`, `state.rs:477-558`). A center that
resolved the board from `current_dir` would create a task on the wrong board —
the same class of defect `0265.15` records for the config layer stack. This cut
consumes `0266.1`'s shared board-directory convention rather than copying the
CLI constant or re-deriving a path.

**Correction 7 — the answer changing is the signal, and there are two ways to get
that wrong.** The target's contract is that the changed board answer announces
the result. The first wrong route is a client timer; the TUI already carries the
one not to reproduce (a two-second fingerprint poll,
`dashboard.rs:6277-6361`). The second is an optimistic insertion — a face
appending the row it believes it just created, which is the same
capability-in-one-face defect in the write direction and diverges the instant a
refusal is misread. A successful create invokes the single board
refresh/broadcast route `0266.1` landed, and every face learns about the new task
the same way, exactly once. The center's existing periodic scan may remain as a
recovery detector, but it is not the mechanism this cut relies on: a creation
whose result only appears because a two-second scan happened to notice has not
satisfied the goal.

**Correction 8 — both TUI Split sites move, and repointing them is not licence to
change what they do.** The TUI has exactly two production `NewTask` construction
sites: `apply_split_step`, which creates a confirmed queue child carrying title,
content, parent, validation and steps (`dashboard.rs:7236-7269`), and
`TaskAction::Split`, which creates a manually titled child as `NewTask { title,
parent, ..Default::default() }` (`dashboard.rs:7334-7354`). Both call
`FilesTaskBoard::open_read_write(...).create(...)` directly. Moving one leaves a
second product write path around the center, so both move onto one submission
path. Two consequences: the manual path's local empty-title trim stays a courtesy
and is not the rule — Correction 2's provider refusal is — and **Split's existing
status semantics are preserved**. Both sites pass `status: None` today and
therefore create `Ready`-derived children; the center API accepts the typed
payload and it is the *new-task* caller that asks for `Draft`. Hard-coding every
center creation to draft would silently change what Split means and would
contradict faithful reuse of the existing provider verb. `ctx tasks list`/`show`
are not the consumer to move: they are one-shot reads that must keep working with
no center running (parent Correction 10), and the parent explicitly rejects
inventing a `ctx tasks create` command, which does not exist today
(`modules/cli/src/app/surface/cli.rs:116-272`).
