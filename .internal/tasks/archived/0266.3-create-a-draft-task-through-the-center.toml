`lock_exclusive_blocking`; the center's connection-worker interception shape and
`ModelCommand::ResolveRow` (`center.rs:3278-3348,3380-3429`); the public client
helper pattern of `start_trait`/`control` (`center.rs:838-902`); `read_repo_index`
and `RepoIndexEntry` (`state.rs:477-558`) for repository identity;
`0266.1`'s board answer, board-directory helper, draft representation and board
refresh/broadcast route; `proof_center`'s scratch center, socket and
snapshot/delta harness, including its two-subscriber patterns
