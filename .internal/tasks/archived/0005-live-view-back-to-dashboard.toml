schema-version = "0.1"
key = "0005"
title = "Leave the live view for the dashboard, and make the dashboard preview actually live"
status = "done"
raised = "2026-07-28"
content = """


Two halves of one complaint: the two surfaces are a one-way street, and the one you land back on is stale.

## Half 1 — the live view is a dead end

`q` opens a confirm and exits the pane back to the shell (P551). There is no way from a live run into the dashboard, so watching a run and then wanting to see the other five means quitting and re-launching.

Bind a key — `d` reads well against the existing `q` — that leaves the live pane and opens the dashboard in the same terminal, on the SESSIONS screen with this run selected. The run keeps going; this is a view change, not a lifecycle action, exactly as `q` already is.

## Half 2 — the dashboard preview is a snapshot

Selecting a session shows a reconstruction of its ledger. `refresh_attached_view` rebuilds only when the ledger's `state_digest` changes, and the trace tail is spliced on top — so a *selected* (not attached) session's preview can sit still while the run moves. The owner expects the preview to track the run the way the live view does.

Make the preview refresh on the reload tick for the selected row, not only for the attached one, and keep the digest short-circuit (it is the thing that makes this cheap — a rebuild is a trait+plan reconstruction, not a file read).

## Watch

- **Do not put a rebuild on the 250 ms draw loop.** `refresh_attached_view`'s own doc says the reload tick is the correct cadence and the draw loop is not; a per-draw reconstruction would reintroduce the P522 reload storm on a bigger surface.
- Coming back from the live view must not leave the terminal in raw mode or the alternate screen — route through the existing restore ladder, the same one `q` uses.
- If the run being watched has already finished by the time the dashboard opens, land on it anyway and show its terminal state. Silently selecting nothing is worse than showing a finished run.

## Done when

A key in the live view opens the dashboard with that run selected and the run still going; a selected session's preview updates as its ledger advances, without a rebuild on every draw.
"""
