equal modulo the sanctioned rule-6 wrap (0046) — with any surviving
hunk explained in the commit message; trait.toml gains
[variant.guarded.budget]; `ctx traits export implement
--update-skill-lock` refreshes the projection lock; `ctx traits check`
green; `just test` green. No frozen-inventory or golden tests added.
"""
