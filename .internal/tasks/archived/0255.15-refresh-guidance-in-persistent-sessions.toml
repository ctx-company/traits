## Outcome
Prove that each accepted outer-frame transition recomposes effective categorized guidance from session-pinned canonical bytes, the authoritative current frame, its exact canonical assigned agent, and its exact ready prompt before delivery to preview, CLI, warm persistent/shared CLI, or MCP. A resident CLI conversation retains process and conversation state while each new user turn carries current trait-agent-prompt guidance. Consecutive MCP frames each receive newly composed onboarding bytes through the existing per-frame process path. Prior-agent, prior-prompt, peer, container, neighboring, and unassigned guidance never survives a frame transition.

Production flow is intentionally unchanged. The outer drive loop already rereads authoritative session status, selects `session.next_frame`, loads session-pinned bytes through `load_trait_for_session`, and creates a frame-local `ResolvedFramePrompt`; preview already calls the same composer; `HarnessSession::prompt` already sends each newly composed prompt to a resident CLI process; MCP already composes each outer frame before starting its process. `pending_wave_cache` stores outcomes, not prompts or guidance. This task adds proof only and introduces no resolver, composer, renderer, cache identity, session field, drive branch, MCP persistence, or system-transport change.

Canonical `session = "persistent"` remains agent-local. A declared `session:<id>` remains shared across roles only when every member uses the same CLI harness and attach mode; non-CLI shared membership remains refused. MCP coverage means consecutive procedure frames through ordinary MCP dispatch, never a shared or resident MCP conversation.

`Agent.system` remains standing instruction content. For a harness convention with a system-prompt flag, the resident process receives composed standing instructions on startup argv once; later turns send user prompts through the healthy process. In a shared conversation, later agents may change categorized guidance but do not replace the first member's standing system context. Categorized refresh must not place any system marker in `<intent>` or `<behavior>`, cause warm fallback, or respawn a healthy process.

