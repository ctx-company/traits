content = """

Owner directive 2026-08-12: bring every first-party trait family up to
the authoring format refactor now demonstrates (contract: task 0102;
refactor is the reference implementation — read refactor/source/ for
the target layout before starting; task 0183 describes it in full).

plan is in the old style: four variants (complex, default, direct,
quick) as flat source/variants/*.ts files, each built from named
`sequence.prompt("<id>", {...})` step objects assembled into a
`variant({...})` default export; shared slots in source/data.ts, the
TASK_FORMAT_DOCTRINE resource in source/resource.ts; agents declared
inline per variant file (`agent.reviewer("smart-1", ...)`).

The four variants are depth tiers over the same pipeline — ground &
refine the described work, split it into task files, write them to
.internal/tasks/ — which makes them the textbook case for shared stage
modules: each variant's index.ts should read as its depth policy over
the same named stages.

"""
scope = """
## Decisions

- Format-only migration: no prompt rewording, no flow changes.
  Generated canonicals are the proof (see Done when).
- Target layout: source/shared/{agent,data,resource}.ts (+ intent/
  metadata if plan has content for them) and shared/stage modules for
  the refine/split/write pipeline; source/variant/<vid>/index.ts
  default-exports a defineVariant hook body composing those stages with
  flow.* + condition.*, returning the report data; `#trait/*` alias
  imports; barrels per refactor.
- Inline agent declarations move to shared/agent.ts (they repeat across
  variants today).
- TASK_FORMAT_DOCTRINE stays a resource of this trait
  (single-trait-packages rule: fold doctrine into the consuming trait;
  split only when a second consumer exists).

## Watch

- The hand-chosen sequence ids ("refine-task", "split", "write", ...)
  must survive via the registrars' `id:` override — history and ledgers
  resolve on them.
- plan writes to committed .internal/tasks/ — the task-board authority
  contract (0110-era) is prompt text that must port verbatim.
- Landing recipe: `just ts-build` FIRST, then `ctx traits build`, then
  `ctx traits export plan --update-skill-lock`.

"""
validation = """
## Done when

`just ts-build` green; `ctx traits build` regenerates all four
