title = "Subscription pressure is a run signal, not a surprise"
status = "done"
raised = "2026-08-05"
closed = "2026-08-10"
origin = "behavior landed by 22cad8dc (2026-08-09); this run is an audit-and-close pass verifying all Done-when/Watch clauses against the working tree, no code changes required"
content = """


`claude-code`'s stream emits `rate_limit_event` with a full usage picture on nearly
every turn — sampled from this repo's own debug traces:
`{"status":"allowed_warning","resetsAt":...,"rateLimitType":"seven_day","utilization":0.98,...}`,
960 `allowed_warning` / 684 `allowed` / **41 `rejected`** across four limit types,
utilization observed up to 0.99 — and ctx never reads it. `provider_error.rs`
classifies `CreditsExhausted` only for API-key providers by string-matching the
refusal AFTER the turn is lost; a subscription harness degrades toward a hard
`rejected` that the drive loop reads as ordinary `harness-failed`, spending retries
on a condition no retry can clear.

Decode `rate_limit_event` into the P504 activity model so utilization, limit type
and `resetsAt` are first-class run evidence — visible live, persisted in the ledger,
available to `story`. Act on it at the frame boundary only: **`rejected` → pause the
run, do not retry** (typed and resumable, `resetsAt` recorded); **`allowed_warning`
above a configurable threshold → surface it, owner decides** (a "pause at 0.95"
default would have paused runs that then completed fine). Extend
`CreditsExhaustedEvidence` (or a sibling) so subscription exhaustion carries
`resets-at` rather than a top-up URL.

"""
validation = """
## Watch

- Never pause MID-frame — a frame is an atomic harness subprocess; the check belongs
  where the next frame would dispatch.
- `utilization` is per-limit-type (four observed, including an overage variant) —
  "the" utilization is a false singular; read them separately and pause on whichever
  actually rejects.
- `resetsAt` is an epoch and must never be converted to a duration in the ledger.
- Do NOT auto-resume when the reset passes — record readiness, let the owner (or a
  later task) resume.
- Codex/opencode emit different (or no) usage telemetry: do claude-code properly and
  report an explicit `unsupported` capability for the rest.
- Related but distinct: the teamclaude account-rotation proxy (task 0003, archived)
  spreads load across accounts at the spawn layer; this task is about the runtime
  SEEING pressure and pausing honestly. Per-seat credential routing proper (was
  P557) landed its claude-code shape via teamclaude's TC_ACCT pinning — a generic
  per-harness mechanism can be filed separately if another harness needs it.

## Done when

A run's ledger and live view carry utilization/limit-type/reset evidence from the
harness stream; a `rejected` rate-limit pauses the run with a typed reason naming
when it can resume, consuming no retries; the warning threshold is configurable and
off by default; a harness without usage telemetry says so as a capability rather
than silently behaving as if it has headroom.

Full original contract: `archived/board/execution-plan.md` (Group 135, P556) and
`archived/board/run-problems-log.md` (Group 135 queue entry).
"""
