content = """

after run-414acdf0 exhausted max-iterations with the mechanism built and reviewed; decisions in this
file are the contract — they were settled deliberately, do not re-open them without a concrete
contradiction)

First of the 0078 children. The maxed-out run built the whole mechanism and its reviewer marked
every implementation step done — the run died polishing proofs, not code. This task lands that
work; it does not extend it.

The work is `.internal/tasks/assets/0078-retry-core.patch` — 13 files, 1380 insertions, 246
deletions, exported verbatim from the run's worktree (`wt-18ef5c297dd4`, diff against its tip
`462212eb`). `git apply --check` passed against main as of 2026-08-04; on later drift use
`git apply --3way` (preimage blobs live in `462212eb`). It contains:

- race/verdict classification and the bounded, jittered mechanical retry loop around
  rebase→gate→fast-forward in `modules/cli/src/app/merge.rs`;
- `merge.retry-attempts` (default 5, first attempt counts toward the bound) and
  `merge.retry-backoff-ms` (exponential base) in `modules/io/src/harness_config.rs`, requirement
  semantics, zero rejected, doctor output in `modules/cli/src/app/doctor.rs`;
- attempt-tagged captured/observed revision evidence accumulated in `RetryWarnings`, consumed by
  both merged and parked terminal frames, idempotent on final persistence;
- exhaustion story rendering in `modules/cli/src/app/merge_story.rs` (a park after N attempts names
  the count and every observed revision; a `--no-wait` first-attempt stop never claims exhaustion);
- the typed `TransientGitLock { reason: TransientLockReason }` race in `modules/io/src/error.rs`,
  its `mcp.rs` envelope arm, and the narrow lock/control retry policy in `modules/io/src/worktree.rs`;
- dirty-checkout narrowing: a landing that does not touch the checkout's dirty files proceeds;
  overlapping staged/unstaged/untracked work is refused without mutating the owner's tree;
- `proof_config.rs` coverage for both keys (35 passing) and the `proof_merge_on_completion.rs`
  suite as the run left it (20 passing);
- regenerated `packages/config` SDK output.

## Decisions (inherited from 0078, binding)

- Races retry, verdicts park. Retryable: `MAIN_ADVANCED_INFIX`, `FAST_FORWARD_FAILED`,
  `MAIN_NOT_CLEAN_INFIX`, `CHECKOUT_BRANCH_PROBE_FAILED`, `CHECKOUT_CLEANLINESS_PROBE_FAILED`, and
  classified transient git lock/control failures. Never retried: `GATE_FAILED_PREFIX`,
  `GATE_LEFT_DIRTY`, `GATE_DISK_FLOOR_PREFIX`, `HARVEST_*`, `DEEP_REFUSE_REGRESSION_PREFIX`,
  `BRANCH_MISMATCH_PREFIX`, and anything unrecognized.
- A retry always re-runs the gate; nothing carries a green forward across a base change.
- Never retry into model spend: every retry is mechanical-only; needing the merger again is a park.
- `--no-wait` still means one attempt.

"""
