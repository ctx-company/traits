schema-version = "0.2"
key = "0054"
title = "`?` opens a modal chat with the guide, not a one-shot strip"
status = "done"
raised = "2026-08-02"
content = """


## Today

`?` expands a two-line strip under the panes: one `Ask: <text>` input row, then
`Guide: thinking...`, then `Guide: <answer>` (`run_view.rs::ask_lines`). It holds exactly one
exchange — asking again resets `input` and clears `answer` (`apply_ask_presentation_key`), so the
previous question and its answer are gone. `Esc` collapses the strip and discards everything.
There is no history, no scrollback, and the conversation competes with the panes for height.

## Target

`?` opens a MODAL over the live view containing a real conversation:

- the exchange history fills the modal body — every question and every answer in this run's
  session, oldest at top, newest at the bottom, scrollable with the same keys as the panes;
- the input sits at the BOTTOM of the modal, always visible, with the same editing behaviour the
  strip has today (Unicode-aware movement, deletion, reset, submission);
- the run keeps going underneath: frames dispatch, panes update, tokens accrue. The modal is a
  view over the run, never a pause of it;
- `q` or `Esc` closes the modal and returns to the live view;
- `?` reopens it with **the conversation still there** — closing is hiding, not discarding. The
  history lives as long as the live view does.

## Where

- `run_view.rs`: `AskPane`/`AskPhase` grow from a single `answer: Option<String>` into an ordered
  exchange log; `ask_lines` is replaced by modal body rendering; the collapsed strip disappears
  entirely (see 0053, which removes its duplicate hint row).
- `tui_kit.rs` already owns `Modal` (used for the quit confirmation) and the scroll-delta mapping
  — extend rather than fork: this modal needs a scrollable body plus a focused input line, which
  the confirm-modal shape does not have today.
- Dispatch is unchanged: the existing `guide_dispatch` / `ask_results` channel and generation
  counter carry each question; only the presentation and the retention change.

"""
validation = """
## Watch

- **Keys while the modal is open belong to the modal.** `q` closes it rather than opening the
  quit-confirm; `d` types a `d` rather than opening the dashboard. That ordering already exists
  after the 0009 merge (the ask guard runs before `live_view_key_action`) and must be preserved —
  see the resolution note in commit `144463ce`.
- An in-flight question must survive closing: closing the modal while the guide is thinking has
  to leave the request alive and land its answer in the history, ready to read on reopen. The
  generation counter exists for exactly this — do not cancel on close.
- Modal height/width must degrade at the narrow breakpoint and never exceed the terminal; the
  body scrolls, the input never scrolls out of view.
- Retention is per live-view session and in-memory only unless persistence is decided explicitly.
  If the conversation should survive detach/reattach, that is a ledger question — decide it, do
  not let it happen by accident.
- Same renderer as 0044/0048/0051/0053; the modal must render identically in the attached
  dashboard view.

## Done when

`?` opens a modal whose body holds the full question/answer history for the run and whose input
sits at the bottom; asking repeatedly appends rather than replaces; the body scrolls with the
standard keys; `q`/`Esc` closes and `?` reopens with the history intact; a question asked and
then closed on still delivers its answer into the history; the run continues dispatching
throughout; and the modal renders correctly in both the live view and an attached dashboard at
both breakpoints.
"""
