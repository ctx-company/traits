schema-version = "0.1"
key = "0026"
title = "One word: `variant`. Retire `family`/`leaf`."
status = "done"
raised = "2026-07-29"
content = """


The codebase carries three words for two concepts: a package holds `variants`,
but the manifest calls them `[family.leaf.<selector>]`, and code says `family`,
`leaf`, `selector`, and `variant` interchangeably. Pick `variant` and use it
everywhere.

## Scope

- Manifest: `[family.leaf.<selector>]` → a variant table.
- `FamilyTable`, `leaf_for_variant`, `relative_path`, `family_manifest.rs`, and
  every `leaf`-named local.
- CLI surface, errors, `doctor` rows, and the approval report already say
  "variants" to the user (`family: implement / variants: default, quick, …`) —
  the internals should match what is already the user-facing word.

## Watch

- The manifest key is PERSISTED. A rename needs a compatibility read of the old
  table shape, exactly like the P569 path renames, or every committed package
  breaks.
- "Family" may still be worth keeping for the PACKAGE that holds variants —
  decide deliberately whether the noun survives for the container, or whether
  a package simply has variants and `family` disappears entirely. Half-retiring
  it is worse than either.
- Do this while the store is small. Every trait package on disk carries the
  key.

## Done when

One word names the concept in manifest, code, and output; old manifests still
read; no `leaf`/`selector` remains as a synonym for variant.
"""
