content = """


The event rows put two spaces on each side of their separator; every other
bullet in the UI uses one. It reads as a gap rather than a separator, and it
is inconsistent with the rows immediately around it.

"""
scope = """
## Decisions

- **One space each side**, matching every other separator in the renderer.
  `EVENT_PREFIX_SEP` (`run_view.rs:2303`) is `"  ·  "`; the journey, title and
  step lines all push `" · "`. The event rows are the outlier.
- **The two extra columns go to the tail**, not to padding. `event_row_line`
  computes its truncation budget as the width remaining after the prefix, so
  narrowing the separator gives that budget back to the text — which is the
  point on a narrow terminal.

## Scope

`EVENT_PREFIX_SEP` and any snapshot or width assertion that encodes the old
prefix width.

"""
validation = """
## Watch

- The prefix is deliberately never truncated (P552: a terminal narrower than
  the prefix is left to clip it). Changing its width changes where that
  boundary falls, so anything asserting an exact column will move.
- One separator constant is easy to change and easy to miss a caller of. If
  any other row builds the same prefix by hand rather than through
  `EVENT_PREFIX_SEP`, fix it to use the constant rather than matching the new
  spacing by eye.

## Done when

History and current-activity rows read `HH:MM:SS · tail` with one space each
side of the bullet, matching the rest of the UI; the reclaimed width goes to
the tail; and no row still builds the old spacing by hand.
"""
