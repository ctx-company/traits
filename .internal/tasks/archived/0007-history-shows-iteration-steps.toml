schema-version = "0.2"
key = "0007"
title = "History reads as a step log, with the iteration on the line"
status = "done"
raised = "2026-07-28"
content = """


## What is wrong

In a loop, the same step names recur every round — `Building Produce`, `Building Review`, `Building Produce` again. History shows them as a flat sequence, so a reader cannot tell round 2's review from round 7's, and cannot see where a round began or ended.

## What to build

One line per step, carrying its own round:

```
00:19:13 · Building Produce (2)
00:24:41 · Building Review (2)
00:31:02 · Building Produce (3)
```

The elapsed prefix is P548's clock format, already landed. The `(N)` is the loop iteration the step ran in, 1-based for a reader (the runtime's `position-path` carries it 0-based). Steps outside any loop carry no number — a bare `Draft the work` is not round 1 of anything.

Exact ornamentation is open: `(2)`, `#2`, or `round 2` all read fine. Pick one and use it everywhere, including `story`, so the same run reads the same way live and afterwards.

## Where the data is

`position-path` on each sequence status already carries `{kind: "loop", id, index, iteration}` — the iteration is recorded per step, per round, and is what the ledger uses for its own bookkeeping. Nothing new needs capturing; the renderer is dropping it.

"""
validation = """
## Watch

- Take the iteration from `position-path`, never from a counter the renderer keeps. A view-local counter drifts the moment a run resumes, and a resumed run is exactly when a reader most needs the history to be right.
- Nested loops exist in the model. Decide what a step inside two loops shows — outermost, innermost, or both — rather than letting it fall out of whichever path element happens to be found first.
- This is P552's `<history>` pane content; land them together or make sure the line format agrees, or the two panes will format the same event differently.

## Done when

Every history line shows its time, its step, and the round it ran in; steps outside a loop show no round; the format matches what `story` prints for the same run.
"""
