validation = """
## Watch

- **Font substitution is the failure mode, not a fallback.** A screenshot, a
  clean build and a green render all survive the system quietly substituting a
  face. The proof must assert resolution against the bundled bytes, and
  registration failure must be visible at startup or render.
- **Licence obligations travel with the bytes.** Redistributing OFL faces
  without the copyright and licence text beside them is a defect, and a
  mutable branch URL is not a pinned source.
- **Do not drift the light column.** It is recorded for a later theme;
  implementing or repairing it now creates a second source of truth against a
  normative document. `.internal/docs/design/**` is read-only input.
- **Copying the export is right for geometry and wrong for content.** The
  export's main list is a frame list; this task owns the compact run rows.
  Route the landed row's demonstrated presentation through the tokens, and do
  not invent row structure from `reference/sessions.html`.
- **Workspace cost must not move.** Font binaries live in the desktop lane's
  assets. gpui must not enter root resolution, the root `Cargo.lock`,
  `just test`, `just test-full`, or the existing macOS/Linux CI lanes. A
  separate desktop CI lane is sanctioned; extending an existing one is not.
- **The declared checks are workspace-side invariants, not proof of this
  task's render.** They show the workspace stayed gpui-free and green. The
  repaint and the fonts are proven in the desktop lane `0256.1` established,
  whose exact command becomes declarable as a check only after it exists.
- One repair cycle, then stop with the exact failing command. Do not iterate
  against a font or render failure without a bound.

## Done when

- The desktop lane's documented non-interactive build-and-test command — named
  verbatim in the work summary — exits 0 with the token module, the vendored
  faces, the font-resolution proof and the repainted rows in the tree, and the
  `0256.2`-`0256.5` tests pass unmodified.
- That command's font proof shows every family and variant the repainted call
  sites request resolving to a bundled face, and a forced registration failure
  is visible rather than silently substituted.
- The closing diff read shows: all 32 dark colours, the three washes, the type
  scale, the used weights and the layout constants of `tokens.md:6-85` present
  once behind one entry point; no light-column value; no colour, size, spacing,
  weight or font-family literal at a repainted call site; no second token
  table; the OFL text beside the font bytes; and no change to row projection,
  identity, ordering, delta handling, selection or stale posture.
- `test -f Cargo.lock && metadata="$(cargo metadata --format-version 1)" && !
  printf '%s' "$metadata" | rg -q '"name":"gpui"' && ! rg -q '^name = "gpui"$'
  Cargo.lock` exits 0.
- `just test` exits 0.
- The task commit touches no file under `.internal/docs/design/`, no
  sibling-owned screen region, no packaging surface and no center, core or IO
  semantics.
- `git status --short` is empty, the work is in one task-scoped commit, and the
  work summary names the desktop path, the desktop command, the locked gpui
  revision, the vendored faces and their upstream revision, any owner
  correction raised against `tokens.md`, and any deviation from the approach.
"""

