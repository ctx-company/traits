schema-version = "0.2"
key = "0059"
title = "Tasks become canonical TOML documents"
status = "ready"
raised = "2026-08-03"
content = '''


First slice of the task-interface arc (0059 → 0060 → 0061 → 0062 → 0063). Nothing else in the
arc is expressible until the board is machine-readable.

## Why

The board is 51 markdown files whose structure is prose. `**Status:**` is written a dozen
different ways ("ready to implement", "ready to investigate", "SPLIT 2026-08-03 — …",
"ready to implement (half 2 needs a capability …)"), and dependencies are sentences —
"(depends on 0028)". Anything that wants to list, filter, enforce or transition tasks has to
parse English. This product's whole thesis is deterministic typed artifacts with digests; the
board should be one too.

## Shape

```toml
schema-version = "0.1"
key = "0050"
title = "Root-cause the park-report ledger-contract failure"
status = "ready"
raised = "2026-08-01"

content = """
The contract prose — everything a run reads verbatim today.
"""

[relations]
depends-on = ["0049"]
parent = "0010"

[[steps]]
id = "s1"
title = "Repair the defect at its layer"
done = true
content = """
Refresh `output_ports` after any projection that writes a port-backed slot …
"""
```

Archival is NOT a field — it is a provider mechanic (0060). The document must not encode where
it lives.

'''
scope = """
## Decisions

- **TOML is the canonical storage format.** Markdown is an IMPORT path for adoption, never
  storage — the same relationship the CDK already has between TS authoring and TOML canonicals.
- **`schema-version` is required** on every task document, so the format can evolve the way
  trait canonicals do.
- **Structure the envelope, never the contract.** Identity, status and relations are typed
  fields; `content` is opaque prose that nothing parses. In particular `## Done when` stays
  prose — it is read by agents, not by code.
- **Steps are nested in the document; subtasks are separate tasks.** A subtask is a task in its
  own right (own key, own file, own dispatchability) linked by `relations.parent`. A step is an
  ordered work item inside one task with no independent existence.
- **Stored status is `ready | done | cancelled`.** Everything else is derived and belongs to
  0060: `blocked` (unmet `depends-on`), `in-flight`/`parked` (joined from the session store),
  and a parent's status (from its children — all children done ⇒ parent done).
- **No priority, estimate or assignee.** This is a dispatch queue for a loop that runs one unit
  at a time. The moment it grows a planning model it stops being an interface.

## Scope

The schema and its version, a parser/serialiser, a markdown importer (H1 → title, body →
content, checkbox lists → steps), and migration of the existing board.

"""
validation = """
## Watch

- **The migration needs judgment, not a script.** Prose statuses and prose dependencies have to
  become real values and real edges, and some will be wrong; expect to hand-fix. The two split
  index files (0010, 0051) have no stored status at all under the new model — their status is
  derived from children.
- Migrate `archived/` too (15 files): archived tasks are still edge targets and must resolve.
- Task files are not part of any trait canonical, so this needs **no trait rebuild and no trust
  re-approval**.
- These five arc files (0059–0063) are themselves markdown and get migrated by this task.
- Do not "improve" content while migrating. Convert the container; leave the prose byte-identical.

## Done when

Every task on the board — live and archived — is a TOML document carrying `schema-version`;
statuses come from the closed set; prose dependencies exist as `depends-on` edges; a markdown
file can be imported into a task document; and nothing in the repo reads the board by parsing
prose.
"""
