schema-version = "0.2"
key = "0086"
title = "The plannotator trait puts the owner inside the loop"
status = "done"
raised = "2026-08-04"
content = """


The deliverable the three component slices exist for, and the reason they were sized the way they
were. 0093, 0084 and 0085 are each defensible on their own, but none of them was found by reading
the code — each was found by trying to author this trait and hitting a wall.

Every demo of an agent loop shows a human at the ends: type a prompt, read a result. This one puts
the owner *inside* the loop as a typed participant — annotating a plan the run then refines against,
and holding the outer gate that the machine reviewer cannot open for it. The run does not ask on
every round; it earns the right to ask.

"""
scope = """
## Decisions

- **A standalone package, not an `implement` variant.** Same shape as `implement-guided`
  (`package.toml`, `source/index.ts`, `agent.ts`, `schema.ts`, `data.ts`, `sequence/*.ts`), because
  the spine differs where it matters: two owner gates and an unbounded loop. Forking a variant to
  change its control flow produces a file that reads like the original and behaves nothing like it.
- **Not a built-in.** It hard-depends on a third-party binary this project neither ships nor owns, so
  it lives in this repo's package set as a dogfood and demo artifact. A built-in that cannot run on a
  clean machine is a broken built-in.
- **The spine is nine steps and the names are fixed:** `plan-draft`, `plan-owner-review`,
  `plan-review`, `implement-loop` wrapping `implement-work` / `implement-review` /
  `implement-owner-review`, then `summary-brief`, `summary-commit`. Phase-prefixed so the journey
  reads as three movements rather than nine unrelated rows.
- **The owner is summoned only when the machine reviewer is already satisfied.** The inner gate —
  `implement-owner-review` runs only `when verdict.status == approved` — is the whole escalation
  ladder. It is what makes an owner-in-the-loop design tolerable rather than a pager.
- **The reviewer reviews against the owner's notes, not only against the plan.** `implement-review`
  receives the plan, the work summary *and* the owner's annotations, and an unsatisfied annotation is
  a `blocker`, never advisory. Without this the outer gate is a rubber stamp: the owner would be
  re-summoned to re-discover the same unaddressed note.
- **Three owner-decision states — Missing | Rejected | Approved.** Missing is "the slot was never
  written". Only Approved advances. No reset step: `until` exits on Approved, so a stale Approved is
  unreachable by construction rather than by cleanup.
- **The loop spells out both conditions** — `until: all([verdict.status == approved,
  ownerDecision.decision == approved])` — even though the reviewer's is implied by the gate that
  produces the owner's. The source is the demo; an implied condition is one a viewer has to be told.
- **No `iterations`, no `on-exhausted`** (0093). This loop ends when the work is right. A bound
  chosen to approximate "never" would be the one dishonest line in a trait whose subject is honesty.
- **plannotator is used exactly as shipped**, in two deliberately different ways: plan mode over
  stdin (hook JSON, no intermediate file) for `plan-owner-review`, and `annotate <file> --gate
  --json` for `implement-owner-review`, whose briefing is written to a scratch `.md` first. The plan
  is a plan and the review is an annotation — matching the tool's own two surfaces rather than
  forcing one of them to do both jobs.
- **The brief is a git-tracked artifact**, written to `.internal/briefs/<slug>.md` and shown to the
  owner with no decision attached. `summary-brief` is a scribe prompt returning `{slug, markdown}`, a
  `project` step lifting both, and a command step writing the file — the same shape `commit.ts`
  already uses for `CTX_COMMITMSG`.

## Scope

The `plannotate` package and its nine steps; slot schemas for `draft`, `planDecision`, `plan`,
`workSummary`, `verdict` (`status` / `blockers` / `advisory` / `briefing`), `ownerDecision` and
`brief`; the agent table; `.internal/briefs/` created and tracked; and a one-page run script for the
recording — what to type, what to annotate, and what the viewer is meant to notice.

"""
validation = '''
## Watch

- **Every plannotator step is silent while a human reads it**, and `.ctx/traits/runtime.toml` sets
  `command-idle-seconds = 600`. Without 0084 the demo dies mid-take at ten minutes with no
  explanation on screen. Prove the effective bound per step before recording, not during.
- **plannotator always exits 0** — dismissed, denied and approved alike. Exit status carries no
  decision, the single JSON line is the only signal, and a parse failure must fail the step loudly
  rather than leave a slot quietly Missing and let the loop spin.
- **`annotate` rejects a path on its name before checking existence** (`/\.mdx?$/i`), so `/dev/stdin`
  and `/dev/fd/63` are out and the scratch file must end in `.md`.
- `PLANNOTATOR_ORIGIN` shapes the plan-mode deny wording, which is the text the run consumes as
  feedback. Set it deliberately; the default reads as addressed to a different tool.
- The owner-notes input is absent on round 1. Attach it hidden-until-produced (`input.optional`), the
  same way `implement-guided` attaches `verdict`, or the first round cannot run.
- Confirm whether `annotate` without `--gate` blocks until its window closes. If it does not, the
  brief display is fire-and-forget and `summary-commit` will land while the owner is still reading —
  harmless, but it should be a decision rather than a surprise on stage.
- A missing `plannotator` on PATH must fail before the first frame. Discovering it at the plan gate
  means the demo dies after the run has already spent a model call drafting.
- Never rebuild the package while a run is live.
- The hand-wiring here is deliberate and temporary. 0087/0088 generalise exactly this shape — a run
  that stops and asks a person — and 0097 is the migration onto it. Ship this version as written; do
  not wait for the interface, and do not pre-emptively bend the trait toward it.

## Done when

A run drafts a plan, blocks in plannotator until the owner acts, refines the plan against the
annotations, loops worker and reviewer with no iteration count, summons the owner only on a round the
reviewer approved, exits only when both approve, writes a git-tracked brief, and commits; a rejected
plan annotation is provably present in the refined plan; the owner is never summoned on a rejected
round; a missing binary fails before the first frame; and the whole thing runs end to end in one
unedited take.
'''

[relations]
depends-on = [
