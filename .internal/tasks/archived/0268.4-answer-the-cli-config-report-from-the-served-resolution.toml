**Edit order.**

1. **Read what `0268.1` landed** before writing anything: the compact answer type and its module, the explicit-scope assembler and whether a client wrapper exists, the seat identity and winner representation, the runtime rows, the trust join, the served document set and citation, the verdict, the warning and typed-failure variants, the captured instant, and the answering-process context. Done-when 1, 3, 4, 5 and 6 all depend on that reading, not on a guess.
