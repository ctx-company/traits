content = """
This is the parity half of the Config screen, and on this screen it is the sharpest cut in the charter. `.internal/docs/gpui-desktop-face-plan.md:9-18,22-30,90-98` fixes the product rule — the center carries capabilities, faces render them, a capability reachable only from the GUI is a defect — and Config is the one screen with no dashboard equivalent to move, so nothing else in the family catches a GUI-only capability. `0268.1` teaches the center to serve one repository-scoped runtime answer; this cut makes a non-GUI face report that same answer, from that same resolution, without moving a byte of what `ctx traits doctor --config` already prints.

The surface that exists today is `ctx traits doctor --config` (`modules/cli/src/app/surface/cli.rs:403-423`; routed at `modules/cli/src/app/command_handlers.rs:327-350`; handled at `modules/cli/src/app/doctor.rs:114`). It resolves through `ctx_traits_io::harness_config::resolve_config_report(Utf8Path::new("."))`, builds the CLI-private `ConfigDoctorReport`/`ConfigDoctorValue` (`doctor.rs:25-54,106-112`) and emits text or JSON (`doctor.rs:999-1087`). Which command structure carries the parity answer is route guidance and lives under `## Approach`, where it is not a boundary; what is fixed here is that one public read-only non-GUI CLI surface reports this shape, that one resolution answers both faces, that the landed report is neither duplicated nor contradicted, and that no second `runtime.toml` parser appears anywhere (`0268` Correction 10; Done-when 5).

Eight grounded corrections the draft this file replaces did not carry.

**A missing runtime document is absence, not a loud failure, and the draft's rule was unsatisfiable.** The draft required a *missing* runtime document to fail loudly while also requiring every landed `ctx traits doctor --config` answer to stay unchanged. Both cannot hold: `resolve_config_report` skips layer paths that do not exist (`modules/io/src/harness_config.rs:3903-3913`), and the standing public proof `doctor_reports_effective_defaults_and_rejects_conflicting_path` creates a scratch Git repository with no runtime file and requires the command to exit zero reporting built-in defaults such as `budget.attach-wait-seconds: 1800` (`modules/cli/tests/proof_config.rs:18-40`). A run obeying the draft literally would have had to red that proof to close. `0268` Correction 1 is the governing rule and it is carried here: absence resolves and is identified as built-in defaults; malformation, refusal, unreadability, stale or never-built generated output, malformed trust evidence and an unusable explicit scope are the loud failures.

**`proof_doctor` was the wrong evidence.** The draft declared it as "doctor's config-reporting proof". Its only `--config` case is `verbose_conflicts_with_config_and_migrate_config` (`modules/cli/tests/proof_doctor.rs:255-273`), which asserts a Clap flag conflict and observes no resolution, no seat, no winner, no provenance and no verdict. `0268` Correction 10 requires the correction: `modules/cli/tests/proof_config.rs` is the standing config-semantics suite — 35 tests passing at this HEAD — `modules/cli/tests/proof_center.rs` is the process-boundary suite for the served answer, and `modules/cli/tests/proof_runtime_ts.rs:50-153` is the generated-runtime success-and-refusal proof. Keeping `proof_doctor` as this task's only config check would have closed it without observing its own outcome.

**Extending doctor does not automatically satisfy "one resolution answers both faces" — today's handler already resolves twice.** `handle_doctor_config` calls `resolve_config_report(".")` at `doctor.rs:115`, then calls `resolve_runtime_assignments(&[])` at `doctor.rs:796`, whose implementation re-enters `resolve_config_report(Utf8Path::new("."))` (`harness_config.rs:2934-2940`). Calling `0268.1`'s assembler beside that, as a third resolution feeding a new section, would satisfy the draft's letter and defeat its point. Whichever route is taken, the new answer is produced by exactly one assembly, and any existing internal re-resolution the chosen route can honestly feed from that assembly is fed from it rather than left to resolve again.

**Every candidate command structure carries a compatibility obligation the draft did not name, and that obligation is what the goals bind.** No sibling public read-only config report exists — the other Config command is hidden under `ctx traits internal config` with only the authoring operations `build`, `accept` and `init` (`surface/cli.rs:2085-2097,2933-2984`) — so a sibling report is a *new* public Clap surface, and it must still call the same prerequisite assembler rather than resolve independently. Extending doctor adds no surface but inherits a harder constraint: the current command is cwd-relative (`Utf8Path::new(".")`) and degrades gracefully outside a repository, while `0268` Correction 2 introduces an explicit repository scope that refuses an unknown, empty, relative or unusable value. Redefining every existing invocation to require a discovered Git repository would be a regression. The route is chosen under `## Approach`; what the goals bind is that the shipped behaviour the chosen route touches is proven preserved rather than asserted to be.

**Today's `absent` string is not the new typed absence, and the two must not be conflated.** `add_assignment_rows` renders an optional model or reasoning effort as the literal string `absent` and falls back to a synthesised built-in `ConfigWinner` when no winner was recorded (`doctor.rs:1199-1293`; the same fallback at `:120-131`). That old answer stays exactly as it is. It is not, however, a source for the screen-shaped projection: `ProfileAssignment.model` and `reasoning_effort` are both optional (`harness_config.rs:1969-1973`), `finalize_assignment` accepts a harness-only assignment as a usable physical seat (`:6657-6667`), and `proof_config::doctor_config_renders_every_seat_through_one_uniform_listing` configures five of exactly that shape (`proof_config.rs:813-859`). Rewritten `0268.3` fixes the honest form: a genuinely absent model or effort is a typed absence with no source entry beside it. The new projection consumes `0268.1`'s typed seat data; it does not re-infer screen semantics from `ConfigDoctorValue`.

**Every leaf of the screen's shape is a join or a captured fact, not a field the CLI can recompute.** The seats are `configured_seats_for_role`'s catalog-free enumeration with list-seat identity preserved (`harness_config.rs:2611-2664`) and never `resolved_seats_for_role`'s dispatch path (`:2717-2743`) and never `expand_role_seats`' alias map, which keeps the base role beside `<role>-N` and so double-counts physical seats (`:6348-6397`); winner keys are `agent.role.<role>.<field>` for a single table and `agent.role.<role>.<1-based seat>.<field>` for a list entry, with a count-expanded alias inheriting the single table's winner (`record_assignment_winners`, `:6171-6211`). The harness row is the distinct harness ids the rendered seats' effective assignments select, in rendered-seat order — not the built-in enumeration `detect_builtin_harnesses` probes on every doctor invocation (`:8039-8104`; `doctor.rs:963-971`). The center row is the answering process's package version over the socket it serves or would serve, which a private tuple can override (`center.rs:545-610`), so it comes from the served runtime row rather than a recomputed `production_paths`. The store row is `state::global_trait_root()` verbatim (`state.rs:323-336`). The approved-traits row is `0268` Correction 8's inventory-plus-current-evidence join with duplicates counted once and variants kept distinct, never `Document.digests.len()` over append-only event history (`trust.rs:37-70,157-227,227-325`), and the digest count is the distinct current digest values among approved members. And the citation cannot be derived from winner sources, because a document that contributed to the resolution need not win any displayed knob: the physical document vector is local to `resolve_config_report` and discarded today, which is precisely why `0268.1` records and serves it. The verdict, the citation with its set-size qualifier, and the one captured completion instant are consumed from the served answer — never reconstructed from file mtimes, a render-time clock or a CLI-local string.

**A retired `model-tier` declaration is a warning, and this cut must not promote it.** At this HEAD `resolve_config_report` pushes `retired model-tier declaration in <path>` onto `tier_warnings` and succeeds (`harness_config.rs:3907,3913-3916,4104-4109`), and `0268.1` preserves that shipped behaviour rather than turning it into a failure. The parity answer carries the warning through as a warning.

**The draft had no stop condition.** Every rewritten sibling in this family prescribes one completed review pass and at most one targeted repair-and-rerun round, stopping with the failing command or the concrete unmet invariant if a second round would be needed. That bound is added here.
