## Approach

Suggested route, not a boundary. `0268.1` has not landed at this HEAD — the center protocol carries no config request, result or delta (`modules/io/src/center.rs:84-209,265-281`), `ConfigReport` carries no document list, verdict, instant, trust join or screen rows (`harness_config.rs:1433-1442`), and no explicit-scope config entry point exists — so no prerequisite symbol name or signature is stated below. Discover them from what `0268.1` actually landed and say in the work summary where the landed shape differed from what is described here.

