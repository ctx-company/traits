## Decisions

- **In scope**: a read-only non-GUI surface reporting the Config screen's shape — the configured seats with their configured model selector and reasoning effort, the runtime `harness` / `center` / `store` rows, and the approved-traits summary with its distinct-digest count — from the same resolution `0268.1` teaches the center to serve, with each value's winning layer, reason and source document preserved, together with that answer's verdict, its cited document and its one captured instant.

- **One public read-only non-GUI CLI surface reports that shape from that resolution.** Which command structure carries it is route guidance under `## Approach` and is not a goal; the goals bind the outcome — a non-GUI face reports the shape from the served resolution, the landed report's existing answers do not change, and the shipped behaviour the chosen route touches is proven preserved rather than asserted to be.

- **`0268`'s corrections bind.** The parent's outcome invariants govern this leaf and are not narrowed here; Corrections 1, 2, 5, 7, 8 and 10 and Done-when 5 are the ones it touches directly. Where the evidence contradicts a correction's wording — as `0268.3` recorded for Correction 5's "an entry for the model value always" against a reachable harness-only seat — the honest form is implemented and the divergence is reported in the work summary rather than resolved by fabricating a value.

- **One resolution per new answer.** The new report is produced by the single shared assembly `0268.1` landed at the IO boundary. Not a second `runtime.toml` parser, not a copy of the doctor assembly, not a third `resolve_config_report` call standing beside the two `handle_doctor_config` already makes (`doctor.rs:115`; `harness_config.rs:2934-2940`), and not a private re-derivation of anything that assembly already carries.

- **Presentation stays in the CLI; meaning does not.** Text and JSON formatting, field naming and ordering are this cut's to write. Seat enumeration and identity, winner mapping, typed absence, the runtime-row definitions, the trust membership and digest count, the served document set and its citation, the verdict and the captured instant are consumed from the served answer. `ConfigDoctorReport` and `ConfigDoctorValue` stay CLI-private presentation types and are not promoted into a wire or shared shape.

- **Absence, malformation and refusal are three different outcomes.** No physical runtime document at any layer resolves successfully to built-in defaults and is identified as that origin. A malformed hand document, a `[repo.*]` block outside the global tier, `runtime.ts` beside hand TOML at the same tier, stale or never-built generated output, malformed trust evidence or invalid sequence evidence, and an unusable explicit repository scope each fail the whole new answer loudly, in the CLI's own error idiom, with the same typed verdict the screen shows and no partial rows presented beside a success verdict. A retired `model-tier` declaration stays a warning and a missing trust store stays an empty approved set.

