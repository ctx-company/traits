- Out of scope: the served answer's own shape, the explicit repository scope, the seat enumeration, the runtime rows, the trust join and the typed center capability (`0268.1`); all desktop rendering (`0268.2`, `0268.3`); any configuration-editing surface on any face; `--apply` and `--migrate-config` behaviour; the light theme; pencil work of any kind; and all work belonging to `0266`, `0267`, `0269` or `0261`.

