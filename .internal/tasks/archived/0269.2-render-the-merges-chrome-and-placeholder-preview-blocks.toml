## Why every region here but the title is placeholder-served

`screens/merges.md:19-20,30-31,34-36,43-45` tags each of them, and the code
agrees that nothing else is honest:

- The center protocol's requests and deltas cover registration, subscription,
  start/control, list/get/resolve, run lookup, stats and the standing wall, and
  carry **no** merge-queue order, awaiting-approval state, sign-off record,
  `watch`/`hold` verb or queue count (`modules/io/src/center.rs:84-281`).
  `ControlAction` is `Interrupt` and `Pause` only (`center.rs:240-245`), so the
  bar's two actions have no verb to bind to even if this cut wanted one.
- `RunSummary.landing` is durable **terminal** evidence — `landed`,
  `not-merged`, `parked`, `merge-failed` — and is `None` mid-run, for
  non-worktree runs and for clean-tree completed runs
  (`modules/io/src/run_summary.rs:48-68`, `169-186`). It cannot supply the bar's
  `landing` state word or the `merge` block's accent state value.
- `MergeStatus`'s `LockAcquired`, `GatesPassed` and `Reconciled` are durable
  **checkpoints** that `is_terminal` excludes by construction
  (`modules/core/src/procedure/session.rs:617-670`); one survives a crash
  unchanged, so reading it as "landing now" yields a permanently wrong bar.
- `MergeFrame` carries **no timestamps** by contract (`session.rs:1040-1066`), so
  the footer's `2 landed this week` has no derivable source at all.
- Live merge progress exists only as the CLI-private, per-invocation `MergeLive`
  sink (`modules/cli/src/app/merge.rs:44-96`) — a presentation channel for one
  in-process invocation, not durable center-served queue state.
- The TUI's `merges_from_center_rows` sorts by descending ledger mtime with
  ledger-path tie-breaking, skips unreadable and non-terminal rows, and
  classifies the rest as `Mergeable`, `Parked`, `Failed` or `Landed`
  (`modules/cli/src/app/dashboard.rs:2505-2609`). That is recency, not queue
  order, and none of those classes means "landing now" or "awaiting approval".
- The existing TUI preview is not a desktop model: it derives gates from the
  compact last terminal frame and performs direct Git and worktree reads on
  selection (`dashboard.rs:4277-4407`). It is `ctx-traits-cli`-private and sits
  beside ratatui rendering.
- `center::get` returns a full `Session`, but at this HEAD it resolves the row
  and reads its ledger **synchronously inside `handle_request`**
  (`center.rs:916-935`, `3595-3669`). This cut does not need selected detail and
  must not consume it.

So this cut has exactly **one data leaf** — the title's repository component,
which the compact subscription already carries. No center request, no
full-session reconstruction, no ledger, store, sidecar, worktree or Git read, no
timer and no new shared protocol. Existing merge behaviour stays first-class and
untouched: `ctx traits merge <run-id>` (`merge.rs:1-16`) and the TUI Merges
keymap's merge, deep-merge, print-path and drop (`dashboard/keymap.rs:90-111`).
The absent thing is named precisely in code, comment and commit message — **no
merge-queue order, no awaiting-approval state, no sign-off record, no queue
counts** — never "no merge surface exists".

