## Six corrections to the draft this plan replaces

**Correction 1 — the title is data; only the summary is placeholder.** The draft
calls the header "the title `merges — ctx-company/traits` over one italic
narrated summary" and its Done-when says every string in the header is served
from the shared module. `screens/merges.md:19-20` tags the summary `placeholder:`
and does not tag the title, and parent Correction 4 binds the title's repository
component as data from the center-served repository scope (`0269:106-110`).
Ruling: **the title's repository component is rendered from the selected
repository scope the center already serves** — `CenterPublicRow.repo_key` and
`repo_path` (`modules/io/src/center.rs:3778-3788`) — through the pure projection
`0265.8` lands: split `repo_path` on `/`, drop empty segments, join the final two
with `/` when two or more remain, otherwise use `repo_key` verbatim
(`0265.8:194-215`). A normal path ending in those segments projects to
`ctx-company/traits` without the string existing anywhere in this cut's code, an
ad-hoc key survives as itself, and empty and one-segment paths have a defined
answer. `ctx-company/traits` is an illustration; it is never hardcoded, never
placed in the `placeholders` module as data, and never resolved from the desktop
process's cwd, a desktop-side `git` call or a recomputed `repo_key(repo_path)`.

**Correction 2 — "no inline placeholder literals" governs placeholder facts, not
every string on the screen.** The draft's rule says "every string in the header,
the bar and all three preview blocks comes from the one shared module". Read
literally it routes the block headings `merge` and `landing`, the key labels
