and the `∷` glyph at padding `[2,8]` (`reference/merges.html:265-297`); the bar
at outer `border-soft` 1, padding `[10,14]`, `space-between`, each half gap 8,
all text mono 11 (`615-659`); the preview column 380 wide at padding `[18,22]`,
blocks full-width columns at internal gap 8 and bottom padding 20, a flex spacer
before a right-aligned footer (`661-733`, `875-901`; `tokens.md:80-85`).

This is the cut where grammar rules 6, 7, 8, 12 and 13 become code for a second
consumer: a title over exactly one italic narrated summary with no breadcrumbs
(`grammar.md:58-66`), key/value rows with sans keys and mono values that take a
