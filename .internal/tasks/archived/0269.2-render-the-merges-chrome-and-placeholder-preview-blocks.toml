This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it whenever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

`screens/merges.md:17-45` specifies the second half of the Merges screen: the
header above the sections `0269.1` renders, the landing bottom bar below them,
and the 380-wide preview column beside them. `0269.1` owns the menu, the three
sections, the five rows and the single selection; this cut owns everything that
brackets them, minus the two blocks `0269.4` owns.

Every region here is static except one. The header summary, the bar's state word
and detail, the `merge` block's values and prose, the `landing` consequence and
the queue footer are all tagged `placeholder:` and are served from the one shared
`placeholders` module. The single data leaf on the whole screen is the
repository component of the title.

