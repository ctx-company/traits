schema-version = "0.2"
key = "0105"
title = "optional outputs, output templates, uniform include"
status = "done"
raised = "2026-08-05"
content = """


The one semantic addition the new surface needs, per 0102's ledger (canonical/runtime
additions: optional outputs). P447 already gave inputs the `{ slot, optional: true }` marker
and command/check steps an `include:` field; this completes the symmetry on the output side and
makes `include:` uniform across step kinds.

"""
scope = """
## Decisions

- **Optional outputs.** `${slot.optional()}` in an output position lowers to
  `{ slot, optional: true }`; the runtime treats absence as a signed non-failure — the same
  epistemics as an empty leftovers list — never as a missing-output error. Object layer first
  (it is the semantic authority), runtime honoring it second.
- **Output templates.** `output.prompt` tagged templates: the prose is the instruction, its
  interpolated slots ARE the step's output contract, so instructions and contract cannot drift
  apart — the mirror of what input templates already guarantee. Lowering: instruction text
  appended to the assembled prompt, slots emitted as ordinary output bindings — no canonical
  change for this half. Build rules: a template with zero interpolations is an error; a
  duplicate slot across output entries is an error; slot authorship is checked against the
  registering agent.
- **`include:` on every step kind.** The typed replacement for prose-referenced attachments —
  a resource with its never-inline hint, a slot made available whole; composes with
  `.optional()`; becomes one of the derived-manifest feeds (0107).

## Scope

Output-side lowering for the optional marker and templates; `include:` on prompt steps merging
exactly as the landed command-step semantics; runtime distinction between an optional output
left unfilled and a required output missing; docs.

"""
validation = """
## Watch

- Output slots with declared authorship are the authorship-check testbed — verify against
  guarded production's two seats before calling this done.
- An optional output left unfilled must be distinguishable in the ledger from a step that
  failed to produce a required output.

## Done when

Builds + drift green with no canonical change from templates and a minimal, documented one for
optional outputs; a step leaving an optional output unfilled completes normally; a required
output left unfilled still fails exactly as today.
"""

[relations]
depends-on = ["0103"]
