schema-version = "0.1"
key = "0010.3"
title = "Requirement conflicts must be visible on ordinary commands"
status = "done"
raised = "2026-08-03"
content = """


Carried from blocker `requirement-conflicts-not-surfaced-by-commands` (0/3 steps done — nothing of
this landed).

## The gap

The resolver detects requirement conflicts, but they stay invisible unless someone runs
`doctor --config`. A person whose `$CTX_CONFIG` is being overruled by a repository requirement gets
no signal on the command they actually ran — which is the exact silent-discard failure 0010's Watch
section forbids.

## Remaining

- One CLI-level formatter/adapter converting structured requirement conflicts into the existing
  command warning representation — one adapter, not a per-command copy.
- Command dispatch plus the direct merge, host-install and frame-prompt consumers retain and
  surface report diagnostics EXACTLY ONCE (no duplication across layers, no swallowing).
- Public-path text and JSON tests proving a conflicting `$CTX_CONFIG` requirement warns on a normal
  command while the repository value remains effective.

## Done when

`cargo test -p ctx-traits-cli --test proof_config` passes with public command assertions showing one
visible structured conflict warning in both text and JSON, with the repository value still winning.
"""
