title = "The Traits (Library) screen"
status = "ready"
raised = "2026-08-29"
content = """
The visual charter (`.internal/docs/gpui-desktop-face-design.md`, 2026-08-28) adds four v1 screens after the plan document's item 3, and Traits is one of them. It has no board representation: `0256`-`0260` are a one-to-one image of the plan document's items 1-5 and none of them renders a trait library. This charter is that screen — authored trait rows, trust states, the lockfile provenance bar, and the selected-trait preview — built per `.internal/docs/design/screens/traits.md` on the vocabulary `0265` extracted while rendering Sessions.

The screen is small and fully specified. The main pane is a header titled after the authoring repository with a counts-from-data italic summary in placeholder phrasing, a single `Authored — N` section of deliberately dotless trait rows (a trait is not stateful in the frame sense), and a bottom bar reading `pinned` in ok with `skill-lock @ <sha> · N digests` provenance and an `author trait` action the spec itself tags a v1 placeholder. The 380-wide preview is four key/value blocks — `trait`, `facts`, `variants`, `ports` — and a footer citing the same provenance; every leaf in that column is `data:`. The committed reference export carries literal pixel values, hex colours and font declarations, so no pencil access is needed.

The stop condition none of the children owns alone is the plan document's: the trait library becomes something the center serves. Today it does not. `load_traits_and_trust` (`modules/cli/src/app/dashboard.rs:2418-2445`) runs `dashboard_trait_inventory` inside the CLI process and projects the result into the TUI's `Screen::Traits` and `Screen::Trust`; the assembly beneath it (`resolve_trait_inventory`, `modules/cli/src/app/lifecycle_reporting.rs:1509-1677`) is CLI-private, and `modules/io/src/trust.rs` holds `read_store` and `classify_records` below that. A separate desktop binary reaches none of it, and a reader written for the desktop — even over identical bytes — would be the capability-in-one-face defect. So this charter extends the center with an inventory, trust and lock-provenance capability and moves the existing face onto the same answer in the same release.

## How to read this plan

Goals and approach are separated, and only goals bind. `validation`'s Done-when list, together with the binding constraints and exclusions at the top of `scope`, is the contract; the corrections below bind only through the outcome invariant each one states.

The separation is plan-wide, not confined to the section titled "Suggested approach". Everywhere in this file — inside the corrections, the expected surfaces, the named reuse points, the item order, the closing review route — a named file, symbol, signature, call site, mechanism, command or proof mechanic is the architect's best guidance from the grounding at HEAD `d445a9a03`, never a boundary. Where the grounding names a route precisely, it is stated precisely so a child does not have to rediscover it; stating it precisely does not make it binding. A child that reaches a binding outcome by different files, different symbols, a different edit order, different commands or different proof mechanics is correct, and reports the deviation in its work summary. That report is neither a violation nor an owner escalation.

Proof mechanics are named only where the grounding shows them already occurring. What must be proven is stated; which fixture, matcher or literal output observes it is the run's call.

This charter lands no code of its own. Its work is the five children and the parent-level review that follows the last of them. A sixth implementation written against this file, instead of against the child that owns the leaf, is the failure mode to avoid.

## Grounded against HEAD d445a9a03

The corrections below are the places where reading the design artifacts or the existing code naively produces a wrong screen or an unbuildable child. Each one has two layers, and only the first binds:

- **The outcome invariant** — what must be true of the finished screen or the landed code. Every child inherits these. A child that silently guesses through an invariant has failed even where its own Done-when reads green.
- **The route** — the files, symbols, call sites, mechanisms and cheapest-known implementations named alongside it. These are guidance carried at the point where the evidence for them sits, so a child inherits the reading rather than repeating it. They do not bind.

A note before them, matching what `0265` and `0266` record for their own families: all five children still store `status = "draft"`, and `TaskStatus` is the closed stored set `ready|done|cancelled` (`modules/core/src/task/mod.rs:22-31`) whose `parse` rejects anything else (`mod.rs:208-220`), so none of those five documents loads on the board at this HEAD. `0266` Correction 1 owns making `draft` representable; **this charter does not depend on `0266` and must not assume that support has landed.** Activating the children — whether by `0266` landing first or by each document being set to a storable status when it is dispatched — is board bookkeeping outside this charter's code scope, and no test may assert on this repository's own board or its own trait set.

### Correction 1 — the single-trust-read premise is false at this HEAD

The draft this file replaces asserted repeatedly that the existing path already costs one inventory scan and one trust-store read, and told the children to preserve that. The scan claim holds; the read claim does not. Every resolved member goes through `lifecycle::resolve_named`, which calls `resolve_trust_verdict_for_trait`, which calls `trust::read_store` (`modules/io/src/lifecycle.rs:82-116`). After N such reads, `build_trust_rows` reads the store again (`dashboard.rs:2621-2624`), and a selected Traits preview can read it a third time (`dashboard.rs:3737-3750`). The comment at `dashboard.rs:2418-2422` claiming "no second trust-store read" describes the projection layer, not the assembly beneath it.

The invariant: **one repository-scoped resolution loads the trust document once and threads it through every verdict in that resolution**, and both the desktop projection and the moved TUI projections are built from that one resolution rather than each re-reading. This is a stated improvement over HEAD, not a preserved property, and a child that "preserves" the draft's claim without checking will preserve N+1 reads. `build_trust_rows_from` (`dashboard.rs:2626-2717`) is already the pure document-taking half and shows the shape; the per-member path is the half that needs a document passed in rather than fetched. Trust identity semantics themselves are not renegotiated: `trust::Document`, `record_for_current` and `classify_records` (`modules/io/src/trust.rs:66-227`) stay the exact-digest, append-only, identity-aware authority.

### Correction 2 — `Authored` is not the TUI's built-in filter, and unbuilt authored packages are not absent ones

The screen is explicitly an authored library: titled after the authoring repository, one `Authored — N` section. Repo-authored winners carry `origin = None`; vendored, user-global and built-in winners all carry an origin label (`lifecycle_reporting.rs:1570-1578`). The TUI's Traits list filters only `origin != Some("built-in")` (`dashboard.rs:2425-2428`), so vendored and user-global winners stay in it. Reusing that projection for the desktop would file non-authored rows under `Authored`; flattening both to one prefiltered list cannot serve both faces.

Two invariants:

- **The served answer carries enough origin/tier data for both projections to be derived from it** — the TUI's existing non-built-in list byte-for-byte, and a genuinely repo-authored list for the desktop. Neither face re-derives tier semantics itself; `inventory::Tier`'s binding order and winner/shadow result (`modules/io/src/inventory.rs`) stay the one authority.
- **An authored package with source but no generated manifest is carried as a typed source-only row and rendered.** `ctx traits list` already discovers those separately (`lifecycle_reporting.rs:1819`, `1845-1879`) while `dashboard_trait_inventory` does not. The one representation is this: the assembly's typed alternative gains a third arm beside its resolved and unreadable arms (`lifecycle_reporting.rs:1541-1551`), carrying the package id and its source path and no version, digest or trust verdict, because none exists until it is built. The desktop renders it as a row inside the `Authored — N` section, counted in `N`, whose trust position carries the state word `source-only` from the single mapping of Correction 6. It is not a failure of the answer and does not withhold `pinned` for other packages; it is not dropped either, because silently treating an unbuilt authored package as nonexistent is the opposite of fail-loud on the one screen whose whole subject is what this repository authored.

### Correction 3 — inventory is bound to the calling process's cwd, and the center is machine-wide

`InventoryContext::discover()` resolves against `state::discover_invocation_root()` (`inventory.rs:70-80`) — the current working directory. That is correct for a one-shot CLI and wrong as the sole API for a daemon serving many repositories: it would answer from whatever cwd the center inherited rather than from the repository the requesting face selected.

The invariant: **the library capability takes an explicit repository scope, and an unknown or unusable scope is refused rather than resolved against the center's or the desktop's cwd.** The refusal is typed and rendered. The scope must also resolve when the selected repository has no run row at all, so a contract that only finds a repository by joining an existing session row is insufficient. Route: center rows already carry authoritative `repo_key`/`repo_path` (`center.rs:3778-3788`) and the machine checkout index maps keys to paths (`state.rs:478-557`); the cheapest change is an explicit-root constructor beside `discover()` that keeps tier ordering and winner/shadow semantics identical.

### Correction 4 — there is no `skill-lock`, and `pinned` is an aggregate verdict nothing computes today

`grammar.md:110-124` and `screens/traits.md:21-22,31` both name `skill-lock @ <sha> · N digests`. No such file and no `trait.skill.lock` reader exists. Since July that evidence lives under `[[trait.projection]]` inside package-local `trait.lock`, and the core model says so explicitly (`modules/core/src/lockfile.rs:323-339`). Lockfiles are per package — `layout::package_lock_path` returns `<package>/trait.lock` (`modules/io/src/layout/mod.rs:375-383`), `lockfile::read_lockfile` reads one package root (`modules/io/src/lockfile.rs:22-64`) — there is no repository-level lockfile, and a `trait.lock` carries no self sha.

The invariants:

- **`pinned` is earned, per resolution, across every in-scope authored package.** It is withheld — and the failure rendered in its place — when a lockfile is missing, unparseable, missing an entry for a current member, or carrying a digest that disagrees with the resolved canonical digest. Counting lock entries is not the verdict: lockfiles retain entries for retired variants and aliases while current membership comes from the family table, so the join is current resolved members against exact `(id, variant)` entries.
- **`<sha>` is a content digest over the resolved lock evidence, computed one way.** The evidence set is the join the verdict above already builds: for every current resolved member in scope, the triple `(id, variant, the lock entry's canonical digest)` — `variant` being `None` for a standalone package and the family table's actual member key otherwise, exactly the key `Lockfile::trait_entry` takes and `LockEntry` stores (`modules/core/src/lockfile.rs:41`, `112-115`, `189`). That set is ordered canonically by `id` then `variant`, ASCII byte order with the `None` variant first, and digested through the existing `digest` primitives (`modules/core/src/digest.rs:103-213`, `sha256:<hex>`); no new hash construction is written. `N digests` is the cardinality of that same ordered set — the current members joined to a matching lock entry — never the raw lock-entry count. A Git object id is not that value, because it cannot name uncommitted or dirty lock bytes and would let the bar claim `pinned` at a sha the rows did not come from; a fabricated or shortened invented hash is forbidden; and no `git` call is made from the desktop process. The bar and the footer render the one value through the single shared digest presentation `0265`'s provenance vocabulary lands, so both cite byte-identical text.
- **One provenance resolution, cited identically by the bottom bar and the preview footer.** The displayed label stays the literal `skill-lock` because the visual artifact requires it, but its modern source and aggregation are stated where the resolution lands, so nobody reads the label as evidence of a file that does not exist.

Ownership, which also dissolves the graph gap: `0267.4` depends only on `0267.3`, so the encoded graph permits the footer to be rendered before `0267.2` exists. **The provenance resolution belongs to the center capability `0267.1` lands**, not to either renderer — `0267.2` and `0267.4` each consume one immutable value from an answer both already transitively depend on. That removes the need for a `0267.2`→`0267.4` edge rather than leaving it missing; if a run instead lands the resolution inside `0267.2`, it adds that edge before rendering the footer and reports the deviation.

### Correction 5 — one desktop row per family, but per-member records must survive

`FamilyTable` carries the declared default plus an ordered map of actual variant names to generated paths (`modules/io/src/family_manifest.rs:23-71`). The existing assembly expands one native family into one row per variant, which is what the TUI's `id:variant` rows and the whole Trust projection depend on. The design instead shows one package row with `· N variants` and the variant names beneath.

Invariants:

- **The served answer keeps per-member records and derives the family aggregate from them.** Collapsing to family rows in the answer breaks the Trust projection and the TUI's rows; deriving family rows on the desktop side would put the aggregation rule in one face.
- **Variant names are the family table's actual keys.** `variant_names()` emits the literal string `default` first (`family_manifest.rs:60-71`) — an invocation-selector helper, not a display list — and the design example uses real names like `basic`. Using that helper mislabels every family.
- **Singular family facts come from the declared default member, except trust.** The preview asks for one `version`, one `trust`, one `digest`, but a family has one per member. `version` and `digest` are the member the family table declares as `default` (`family_manifest.rs:23-71`) — the only representative the grounding supports — and a standalone package is its own representative. `trust` is not the default member's verdict: it is the conservative aggregate of Correction 6, because reading one member's verdict as the family's is exactly the collapse that rule exists to prevent.
- **List and lede prose come from one shared projection over authored summaries.** A family's root package manifest has no description; each generated `Trait` has `description`, optional `summary` and `effective_summary()` (`modules/core/src/trait/mod.rs:350-365`, `485-493`). The family row's description and the preview's lede are the declared default member's `effective_summary()`; each row of the `variants` block carries that variant member's own `effective_summary()`. Both faces read those values through the one shared projection rather than deriving prose themselves. Prose inferred from procedure topology, or copied from the reference export, is a fabricated leaf.
- **Selected detail is addressed by stable identity, never by list index.** The existing preview cache keys on trait id plus canonical digest (`dashboard.rs:3704-3750`); a family aggregate needs variant/default identity too, because members share an id.

### Correction 6 — the trust word, and the conservative family aggregate

`screens/traits.md` shows `trusted`; `TrustVerdict::display_name` returns `verified|blocked|unreviewed` (`modules/core/src/trait/mod.rs:289-299`), and the TUI additionally renders moved-variant and `orphaned` states. The design's all-good example is one state out of a set, and a screen that renders only it is unfinished.

Invariants: **one shared typed trust presentation covers every state a row can reach, with one word and colour per state per face, written once.** The mapping is over a typed state, not over a string, so neither face re-derives it and neither invents a state. The complete set of reachable states and their words:

| typed state | desktop word | TUI word |
| --- | --- | --- |
| all current digests verified | `trusted` | `verified` |
| any member blocked | `blocked` | `blocked` |
| some but not all verified, none blocked | `partial` | `partial` |
| none verified | `unreviewed` | `unreviewed` |
| record exists for other bytes of this trait | `moved` | `moved` |
| package failed to load | `unreadable` | `unreadable` |
| authored source with no generated manifest (Correction 2) | `source-only` | `source-only` |
| trust record with no current member (Trust screen only) | `orphaned` | `orphaned` |

Only the all-verified row differs, and it differs because both artifacts are normative. `screens/traits.md` specifies the desktop word `trusted`; the TUI keeps its existing `verified`, which is observable parity under Done-when 5 (`TrustVerdict::display_name`, `modules/core/src/trait/mod.rs:289-299`). The two words are two renderings of one typed state at one mapping site, not two derivations. Colour is semantic per grammar and is decided at that same site.

And **a family row's trust state is the conservative aggregate, never one member's verdict**: verified only when every member is verified, otherwise blocked, partial or unreviewed. That rule already exists as `trust_story::aggregate_trust_label` (`modules/cli/src/app/trust_story.rs:185-212`) and is proved by `modules/cli/tests/proof_trust_family_report.rs`; it is CLI-private, so it is extracted into shared core/IO for both consumers, returning the typed state plus its verified/total counts rather than only a label. The existing CLI and TUI label strings — including the `blocked (v/t verified)` and `partial (v/t)` parentheticals — are then rendered from that typed value so `ctx traits list` and the TUI keep their current wording byte-for-byte; the desktop renders the bare word and carries the counts in the row's existing `· N variants` leaf, because the parenthetical form is outside the closed glyph set of grammar rule 3. A copy in gpui is a defect even when it compiles, and a family that reads flatly trusted while one member is blocked is exactly the 0150 collapse that rule was written to prevent.

### Correction 7 — `task` and `duration` are not port invariants

`screens/traits.md:30` names a `ports` block of `task / duration`, and `0267.4`'s draft turned that example into a requirement. `Port` is an arbitrary typed declaration with an author-chosen id (`modules/core/src/trait/port.rs:69-109`); no schema invariant requires either name. The screen's own selected example, `implement`, declares `task` and no `duration`; `duration` occurs on the `plan` family. A generic selected trait can declare neither, or twenty.

The invariant: **the named `ports` block always renders, carries the trait's actually declared ports, and renders one data-derived empty-state leaf when there are none.** The heading is one of the four named blocks and never disappears with its data; a preview that drops a block when a trait declares no ports makes "no ports" indistinguishable from "block not implemented". The empty case renders exactly one leaf whose value is the word `none`, derived from the trait's empty declared-port set — a fact about the trait, so the preview column stays entirely `data:` and no `placeholder:` leaf enters it. Rendering a fixed `task`/`duration` pair, or inventing a value for a port a trait does not declare, are the worse failures, because they read as evidence.

### Correction 8 — `agents` is two different facts, and one of them is outside the glyph set

`facts` names `agents`. Agents are typed declarations with ids (`modules/core/src/trait/agent.rs:88-128`). The reference export writes `worker · smart ×2 · scribe`, which appears to count procedure assignments rather than declarations — and `×` is outside grammar rule 3's closed structural glyph set. The invariant: **`facts.agents` is the trait's declared agent ids, in declaration order, separated by the `·` rule 3 already admits.** Procedure assignment counts are a different fact and are not rendered on this screen, so the export's string is not reproduced — both because it counts assignments and because of the glyph. The two facts must not be blended into a string that looks like both. A trait declaring no agents renders the same one-leaf `none` empty-state form Correction 7 defines, for the same reason.

### Correction 9 — the export is measurement; `grammar.md` and `screens/traits.md` are the specification

`reference/traits.html` is the geometry authority and is worth copying from for exactly that: section gap 12, row gap 4, row padding `[8,12]`, left/right stack gap 2, top-meta gap 5 (`287-579`), against `tokens.md:71-85`'s 1440×900 window, 36 title bar, 260 rail, main padding `[18,40,20,40]` gap 28, and 380 preview with `[18,22]`.

It conflicts with the normative artifacts on content, and each conflict resolves toward the spec: the export renders the Facts block with no visible `facts` heading (`653-744`) though both `screens/traits.md` and this charter describe four named blocks; its fact keys are 12px with several Sans 11.5 values where grammar rule 7 requires Sans 11.5 keys and Mono 10.5 values; and its `×` violates rule 3. **No literal export content is ever hardcoded** — names, counts, versions, hashes, descriptions, trust states, variant names, agents and ports included. `ctx-company/traits`, `implement`, `basic`/`quick`/`complex`, `Five traits, all digest-pinned…`, `trusted` and every sha in the export are illustrations. A further conflict found during implementation resolves the same way and is reported.

### Correction 10 — where the library work runs inside the center, and what the wire can carry

There is no trait, trust or lock request, response or delta in the protocol today; requests and deltas are run-shaped (`center.rs:84-281`), subscription snapshots carry only `CenterPublicRow`, and broadcast routing derives repository scope from that row (`center.rs:2336-2485`). So this is a typed protocol extension, not a field added to an existing message. Invariants:

- **Library reads never run inside the sole model/SQLite owner's request handling.** `handle_request` still performs blocking ledger reads for `Get` (`center.rs:3649-3663`); `Start` and `Control` demonstrate the safer shape — short owner-side resolution, blocking work in the connection worker.
- **Freshness reaches clients as stream events with no timer on any client**, and **no new heavyweight dependency — in particular no filesystem watcher — enters `ctx-traits-io`**, which today depends only on core plus its existing third-party set (`modules/io/Cargo.toml:12-29`). The center's existing two-second periodic scan (`center.rs:65`, `3026-3038`) is a detection cadence that already exists and a cheap fingerprint can ride it; that is a route, and any center-owned detection meeting the invariants replaces it.
- **Trust is machine-global while inventories and locks are repository-scoped.** One trust-store change can invalidate several subscribed repositories, so invalidation cannot be attached to a single run row.
- **The listing stays compact.** Wire lines are bounded at 1 MiB (`center.rs:48-52`); full descriptions, agents, ports and per-variant detail belong to the selection-triggered detail answer, and answering one selection must not rescan the whole inventory.
- **Snapshot transactionality is inherited.** The TUI reducer is the precedent: stage rows between `SnapshotStart`/`SnapshotEnd`, project the complete candidate, commit only on success, retain the last accepted model behind explicit outage text, reconnect for a fresh snapshot after a rejected candidate (`dashboard/worker.rs:254-415`). No partial commit, no stale data presented as current, no desktop filesystem fallback, no silent empty list, no blank sha.

### Correction 11 — what `0267.5` actually has to move

Three things the draft understated:

- **The TUI still polls.** The dashboard timeout calls `reload_non_session`, which invokes the direct scanner every two seconds (`dashboard.rs:2830-2844`; `dashboard/worker.rs:45-55`, `529-550`). The move removes that live reader and poll for the moved screens; adding a center query beside it leaves two answers.
- **Both the list and the selected detail move.** Traits' preview reads manifests and the trust store directly today (`dashboard.rs:3704-3750`); migrating only the list projections leaves a direct reader behind on the same screen. The parent's own language — both screens consuming the same answer — settles this.
- **Existing mutations stay, and must be observed through the answer.** Traits/Trust are not read-only today: approve, block, family-approve and edit-source all exist (`dashboard.rs:5546-5801`). This charter opens no new mutation on any face, but a successful trust write must change the served answer and be observed through it, not force the old scanner back into use for a refresh.

Unchanged means observably unchanged: `Screen::Traits`' id/version/status/trust/digest/path/error/variant rows and `id:variant` rendering (`dashboard.rs:291-308`), and `Screen::Trust`'s full tier set including built-ins plus appended orphans, with its deterministic ordering — actionable rows before orphans, by trait id then digest — and its error text (`dashboard.rs:483-509`, `2626-2717`).

### Correction 12 — degrade per package, fail loud per resolution

These are two different failures and the draft conflated them. One unreadable package is represented as a typed row with its error shown inline (`lifecycle_reporting.rs:1541-1551`; `dashboard.rs:13407-13421`) and never aborts the scan — that degradation is existing behaviour and survives. A failed repository scope, a failed trust-store read or a failed provenance resolution is catastrophic for the whole answer and fails it loudly rather than shipping a partial library that looks complete.
