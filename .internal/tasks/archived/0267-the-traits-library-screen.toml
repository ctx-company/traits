scope = """
## Binding constraints and exclusions

These bound the outcome regardless of the route taken.

- **In scope**: the Traits screen as `screens/traits.md` specifies it — header, the `Authored — N` section, the dotless trait row form, the lock provenance bottom bar, and the selected-trait preview column — plus the center-side inventory, trust and lock-provenance capability each child needs, the repository scoping that capability requires (Correction 3), and the migration of the TUI's Traits and Trust screens onto the same answer inside this slice (`0267.5`).
- **The parity mechanism is the plan document's, not a variant of it.** A feature is something the center serves plus per-face rendering. The desktop reads no manifest, no family table, no trust store, no lockfile and no `git`; it asks the center, and so does at least one existing face by the time this charter closes — the migration is its own child rather than a rider on a rendering cut, so its regression surface is gated honestly.
- **Read-only, with one spec-tagged placeholder.** `author trait` is the leaf `screens/traits.md` itself tags a v1 `placeholder:`, served from the shared `placeholders` module as a tracked placeholder rather than left as an untracked dead control. Nothing in this slice authors a trait, and no new trust mutation is opened on any face; the TUI's existing trust actions stay as they are (Correction 11).
- **No change to inventory, trust or lockfile semantics.** Tier ordering, winner/shadow resolution, exact-digest trust identity, append-only records and lock entry meaning are consumed, not redefined. The additions are an explicit repository scope, a single-load trust threading, a provenance aggregation, and the wire types that carry them.
- **One resolution per answer, honestly claimed.** One repository-scoped assembly feeds the desktop and TUI projections; one loaded trust document serves every verdict in it (Correction 1); one provenance resolution is cited by the bar and the footer (Correction 4); selected detail does not rescan the inventory.
- **Nothing here is deferred to `0261`.** That task's own scope admits no production behaviour beyond reconnect-delay parity, two-version coexistence, shared-index versioning and subscription regressions; a capability assigned to it would be assigned to nothing.
- **The crate lives outside the cargo workspace.** `0256.1` establishes its location, manifest, lockfile and non-interactive lane; every child of this charter lands into it. gpui must never enter root `Cargo.toml` resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing macOS/Linux CI lanes.
- **The desktop imports no CLI-private type.** Where it needs semantics living inside `ctx-traits-cli` beside ratatui rendering — the inventory assembly, the conservative family aggregate, the trust word mapping — the pure derivation is extracted into shared core/IO code and both faces consume it. Copying it into gpui is a defect even when it compiles.
- **`ctx-traits-io` depends only on `ctx-traits-core` and its existing third-party set.** No CLI-level type and no new heavyweight dependency — in particular no filesystem watcher — enters the io crate, because the desktop lane inherits everything it drags in.
- **Extraction stops at demonstrated consumers.** Each shared piece is extracted by the first cut that renders through it and is only as wide as that cut needs. No design-system phase, and nothing built here for `0268`-`0269` before one of them exists.
- **`0256`/`0257`/`0258`/`0265`'s robustness contracts are inherited, not renegotiated.** No poll loop anywhere in the GUI; snapshot-then-delta transactionality preserved, so a rejected projection leaves the previous complete model visible and forces a fresh snapshot; socket receives, inventory scans, trust reads and lock resolution stay off gpui's UI thread; center-side library work stays off the sole model owner's request path; center failure stays visible and fail-loud, with last-accepted state shown only behind an explicit stale marker and never as current.
- **Out of scope**: the other three new screens (`0266`, `0268`, `0269`, each its own work item), trait authoring and any new trust mutation on any face, `ctx traits list`'s own CLI surface beyond the extraction it shares, the light theme (`tokens.md` records light values for later; v1 implements the dark column and must not drift it), pencil work of any kind, and every shared primitive `0265` already built.
- **This charter's `depends-on` gates nothing on its own.** `derived_status` derives a parent's status from its children and evaluates `depends-on` only for open leaves (`modules/core/src/task/graph.rs:115-177`), so the external prerequisites are named on the earliest child that consumes them — `0267.1` carries `0265.5`, `0265.9` and `0258` — and reach the rest through child-to-child edges. The order below documents the sequence; it is not the gate.

## Covered work item

`traits-screen` — the v1 Traits (Library) screen: authored rows, trust states, lock provenance bar, read-only, placeholder-marked, dark theme only, chrome citing `skill-lock @ <sha>` per grammar rule 12.

## Suggested approach — guidance, not a boundary

### Item order, and what each cut owns

The edges are already encoded on the children; this is what they mean in sequence.

1. `0267.1` (after `0265.5`, `0265.9`, `0258`) — the load-bearing cut: the shared inventory assembly with its explicit repository scope (Correction 3), the single-load trust threading (Correction 1), the two projections the origin data supports (Correction 2), the family aggregate over preserved per-member records (Corrections 5, 6), the provenance resolution both renderers consume (Correction 4), the typed center protocol extension (Correction 10), the `Traits` menu entry and switch, and the `Authored — N` section with its dotless rows.
2. `0267.2`, `0267.3`, `0267.5` (each after `0267.1`) — the header and provenance bar with its earned `pinned` and placeholder-served action; the preview's `trait` and `facts` blocks with the selection-triggered detail answer; the TUI move of both lists and both selected details, with the two-second poll removed (Correction 11).
3. `0267.4` (after `0267.3`) — the `variants` and `ports` blocks with the absent-port rule (Correction 7) and the provenance footer citing the same value the bar cites.

### Expected surfaces

- `modules/io/src/inventory.rs` — the explicit-root constructor beside `discover()`, with tier ordering and winner/shadow semantics untouched.
- Shared core/IO — the inventory assembly extracted out of `modules/cli/src/app/lifecycle_reporting.rs:1509-1740` (`resolve_trait_inventory`, `ResolvedTraitEntry`, `TraitInventoryRow`, `dashboard_trait_inventory`), the conservative family aggregate extracted out of `modules/cli/src/app/trust_story.rs:185-212`, and the one verdict-to-word mapping. Extracted, not copied: a second copy is the defect the extraction exists to prevent.
- `modules/io/src/center.rs` — one library capability with its repository scope, its list/detail split under the 1 MiB bound, its typed refusals, and freshness on the existing periodic cadence. Blocking work in the connection worker, not in the model owner's request path.
- `modules/cli/src/app/dashboard.rs` and `dashboard/worker.rs` — the TUI move: `load_traits_and_trust`, `build_trust_rows`, the preview path at `3704-3750`, and the `reload_non_session` poll at `2830-2844`.
- The desktop project `0256.1` establishes — its path, manifest, lockfile and non-interactive command are that task's to name, and children bind to what actually landed rather than to a guess made here. Likewise the vocabulary `0265` extracted: rows, headers, bars, rail, title menu, key/value blocks, preview footers, overflow, and the one `placeholders` module.

### Named reuse points

Prefer these over new derivations; where one is CLI-private, extract rather than copy.

- `InventoryContext::candidate_ids`/`resolve_tiers` and `Tier`'s binding order (`modules/io/src/inventory.rs:1-207`) — the one discovery authority.
- `resolve_trait_inventory` and its typed `Resolved`/`Unreadable` alternative (`lifecycle_reporting.rs:1509-1677`), and `dashboard_trait_inventory`'s projection and id sort (`1680-1740`).
- `family_manifest::read_family_table` and `FamilyTable.variants`' actual keys plus `default` (`modules/io/src/family_manifest.rs:23-71`) — never `variant_names()` for display, never variant names inferred from paths or aliases.
- `run::load_trait`, `Trait::effective_summary` (`modules/core/src/trait/mod.rs:485-493`), typed `Agent` and `Port`, and the existing canonical digest computation — no separate manifest parse for gpui.
- `trust::Document`, `record_for_current`, `classify_records` (`modules/io/src/trust.rs:66-227`), `build_trust_rows_from`'s pure join and ordering (`dashboard.rs:2626-2717`), and `trust_story::aggregate_trust_label` (`trust_story.rs:185-212`).
- `lockfile::read_lockfile`, `Lockfile::trait_entry` and `LockEntry::canonical_digest` (`modules/io/src/lockfile.rs`, `modules/core/src/lockfile.rs`) for the current-member pin join — no desktop lock parser.
- Center's typed client boundary, its "short model resolution then blocking work in the connection worker" shape, its bounded queues and lagging-subscriber eviction, and its existing periodic scan (`center.rs:65`, `3026-3038`).
- The landed TUI reducer's transaction boundary — stage, project the complete candidate, commit only on success, drop and reconnect on rejection, retain last-accepted behind an explicit stale marker (`dashboard/worker.rs:254-415`).
- `CenterPublicRow.repo_key`/`repo_path` (`center.rs:3778-3788`) and the machine checkout index (`state.rs:478-557`) for repository scope.

### The parent's closing pass

After the last child lands, and before this charter is called done, one review pass against the artifacts rather than against memory:

- Walk `screens/traits.md` leaf by leaf — menu entry and switch, the repository-qualified title, the one italic summary, the `Authored — N` count, each row's name, description, trust word and variant stack, the bar's pin verdict, provenance and action, the preview's `trait`, `facts`, `variants` and `ports` blocks, and the footer — confirming each `data:` leaf renders from a center-served source that a non-GUI face also consumes, and that the summary's phrasing and `author trait` are the only leaves coming from the shared `placeholders` module.
- Compare literal geometry against `reference/traits.html` (`287-579`) and `tokens.md:71-85`, applying Correction 9's content conflicts as resolutions rather than requirements.
- Exercise the boundaries the leaves depend on: a family with mixed verified/unreviewed/blocked members; a standalone package and a multi-variant one; an authored package with source but no generated manifest; an unreadable package beside readable ones; a trait declaring neither `task` nor `duration`; missing, malformed and digest-mismatched package locks; an unknown repository scope; an accepted and a rejected snapshot projection; a trust write observed through the served answer; center loss and recovery; and a lagging subscriber evicted.
- Read the diff for the properties no fixture shows directly: one assembly and one trust-document load feeding both faces, one provenance resolution feeding bar and footer, no inventory rescan for one selection, no client timer, no desktop filesystem or `git` read, and no second live reader left behind for the moved TUI screens.
- Run the focused proofs the children declare (`proof_trust_family_report`, the dashboard projections) plus `modules/cli/tests/proof_center.rs`, which is the existing process-boundary center suite and the right place to prove a new wire capability even though no child declares it today; then `just test-full` and the gpui-free root-resolution check below; then, if `0256.1` has by then established a desktop lane command, that command too as supplementary proof of the rendered screen.
"""
validation = """
## Watch

- **`grammar.md` and `screens/traits.md` are the specification; the export is measurement.** Copying a value out of `reference/traits.html` is right for geometry and wrong for content; the known conflicts are in content Correction 9 and a further one found during implementation is resolved the same way and reported.
- **No design example string is ever hardcoded.** `ctx-company/traits`, `implement`, `basic`/`quick`/`complex`, `worker · smart ×2 · scribe`, the narrated summary sentence and every sha and count in the export are illustrations. A leaf that renders one of them for a trait that does not carry it is worse than an omitted leaf, because it reads as evidence.
- **Nothing is served to the GUI that the TUI and CLI cannot also reach.** A bespoke inventory walk, a private trust-store parse, a manifest scanner or a lock parser written for the desktop is the capability-in-one-face defect even over identical bytes.
- **No dots on trait rows.** Rule 4 admits dots into frames, tasks, merges and rail repos only, and `screens/traits.md` calls the omission out explicitly; adding one because "it is a list" is a spec violation.
- **States are words, not pills or icons**, and every state a row can reach renders — blocked, partial, unreviewed, moved, unreadable, source-only, orphaned — not just the all-good example; content Correction 6's table is the complete set and its single mapping site.
- **No poll loop anywhere in the GUI**, and no blocking read on gpui's UI thread — inventory scans, trust reads and provenance resolution all included. The TUI's existing two-second poll for the moved screens is removed, not left beside a center query.
- **Fail-loud, no silent staleness, no direct-reader fallback.** A failed inventory, trust or provenance answer is stated on the screen rather than replaced by a stale library or a desktop-side read; last-accepted state appears only behind an explicit stale marker. One unreadable package still degrades to a typed row rather than aborting the scan (content Correction 12).
- **`pinned` and `<sha>` are claims, not decoration.** A blank sha, an invented short hash, a Git object id standing in for dirty lock bytes, or a raw lock-entry count presented as `N digests` each make the bar lie.
- **`ctx-traits-io` depends only on `ctx-traits-core` and its existing third-party set**; the center-side capability must not pull CLI-level types or a new heavyweight dependency — in particular no filesystem watcher — into it.
- **No test may depend on committed repo content.** Prove behaviour with scratch repositories, authored packages, family tables, trust stores and lockfiles — never by asserting on this repository's own trait set, its own `trait.lock` files, or its own board. Path/word/file-existence inventories are banned workspace-wide.
- **Grammar rules are normative**: semantic colour, states as words, the closed glyph set, no corner radius inside the canvas, status dots only in stateful lists (trait rows carry none, the preview carries none), one bright title per list, sans for content and mono for machinery, a title plus exactly one italic narrated summary and no breadcrumbs, ghost-text bottom-bar actions, overflow clipping only when content actually overflows, and provenance cited in bars and footers.
- **Placeholder doctrine**: only the leaves the spec tags `placeholder:` — the summary's phrasing and the `author trait` action — come from the shared module, and no placeholder string appears inline. The preview column is entirely `data:` and carries none; rendering a `data:` leaf as static content inverts the doctrine, and no `data:` leaf may close as an unrendered gap.
- **Fonts**: `tokens.md` names IBM Plex Sans and Mono and the repository ships no font faces; `0265.1` owns that resolution and this screen must not silently fall back to a system face.
- **Workspace gate cost must not move.** gpui must never enter root `Cargo.toml` resolution, the root `Cargo.lock`, `just test`, `just test-full`, or the existing macOS/Linux CI lanes. Equally, do not declare a check that forbids the string `gpui` in `Justfile`/`.github/workflows/`: a separate desktop lane there is sanctioned, and a check that reds on the sanctioned outcome is a wrong check.
- **No desktop board check exists yet**: `0256.1` is still `ready` and no standalone desktop validation command exists in the repository, so no child declares one. Once it lands, the exact desktop command becomes declarable.
- Rust is pinned to 1.97.1 by `rust-toolchain.toml`. Isolate builds with `CARGO_TARGET_DIR=target` when a gate failure looks like a phantom "cannot find X"; a shared cross-worktree target dir flakes gates.

## Done when — binding goals, and what decides each

1. **Every child is completed on its own terms.** All five (`0267.1`-`0267.5`) are `done` — that is the only accepted child state — each having run its own declared checks and, once `0256.1` had landed one, the desktop lane command. Cancellation does not satisfy this goal: a cancelled child leaves its leaves unrendered and its capability unbuilt, so this charter stays open. No board check at this level: child closure is the board's bookkeeping, and this parent's derived status is not evidence of it while the children are still unloadable drafts (see the note in `content`).
2. **Traits matches `screens/traits.md` leaf for leaf** — menu entry and switch, the repository-qualified header with its one italic summary, the `Authored — N` section, the dotless row with its name, description, trust word and variant stack, the bottom bar with its earned pin verdict, provenance and placeholder-served `author trait`, and the preview's `trait`, `facts`, `variants` and `ports` blocks with its footer — with every `data:` leaf rendering from a center-served source that at least one non-GUI face consumes, the two `placeholder:` leaves served from the shared module, and no leaf closing as an unrendered gap. The specific leaf values are the ones the corrections fix, not implementation choices: the row's description and the preview's lede are the declared default member's `effective_summary()` and each `variants` row is that member's own (Correction 5); `facts.agents` is the declared agent ids joined by `·` (Correction 8); the `ports` block always renders and shows one `none` leaf when the trait declares none (Correction 7); the trust word is the Correction 6 mapping; the provenance is the Correction 4 digest and count; and no export literal is reproduced (Correction 9). Decided by two things that exist today: the substantive leaf-by-leaf closing review in `scope`, run against the artifacts rather than from memory and naming for each leaf the served source it renders from, and `just test-full` — the landing gate of Done-when 6, declared in `[[checks]]` and runnable now — which proves the shared core/io/center/TUI code those leaves render through is green. Once `0256.1` has landed a desktop lane command, that command is additional proof of the rendered screen; its name is that task's to establish and is not guessed here. No board check is declared for the rendered screen itself, and none may be invented, because no repo-root command inspects a rendered gpui screen today.
3. **The library is one center-served, repository-scoped answer.** The capability takes an explicit repository scope and refuses an unknown or unusable one rather than falling back to the center's or the desktop's cwd, including when the selected repository has no run row; one assembly per resolution loads the trust document once and threads it through every verdict; that one assembly yields both the desktop's repo-authored projection and the TUI's existing non-built-in projection without a second scan; one provenance resolution is cited identically by the bar and the footer; selected detail is answered by stable identity without rescanning the inventory; library work runs off the center's model-owner request path; freshness arrives as stream events with no timer on any client; and the desktop process performs no manifest, family-table, trust, lock or `git` read. Decided by the center wire proof and the io/CLI tests inside the landing gate, by the desktop lane command once it exists, and by reading the diff for any timer, second read or desktop-side read.
4. **Every state and every boundary the screen can reach renders, and none is invented.** One shared site maps the typed trust state to a word for every state in Correction 6's table: the all-verified state renders `trusted` on the desktop and `verified` in the TUI, and `blocked`, `partial`, `unreviewed`, `moved`, `unreadable`, `source-only` and `orphaned` render identically on both. A family row carries the conservative aggregate rather than one member's verdict, its variant names are the family table's actual keys, and its singular `version` and `digest` come from the declared default member. An authored package with source but no generated manifest is carried as the typed source-only row of Correction 2 and rendered inside `Authored — N` with the `source-only` word; an unreadable package degrades to a typed row without aborting the scan. A trait declaring no ports still renders the `ports` block with one `none` leaf, and one declaring no agents renders `facts.agents` the same way. `pinned` is withheld with a rendered failure whenever a lockfile is missing, unparseable, missing a current member's entry, or digest-mismatched, and `N digests` counts only the joined current members. Decided by the children's own coverage of the aggregate, the projections and the pin join — run inside the landing gate — plus the closing review's boundary exercises.
5. **The TUI is unchanged in behaviour and reads through the served answer.** `Screen::Traits` and `Screen::Trust` render from the center-served answer — both their lists and both their selected details — with the same rows, `id:variant` rendering, built-in-origin difference between the two projections, ordering (actionable before orphans, by trait id then digest), and error text; the two-second direct poll for those screens is gone and no second live reader remains for them; existing trust writes still work and are observed through the served answer rather than through a reinstated scanner; and center-absent behaves in one defined sequence — the existing spawn-on-need path (`center::ensure_connected`, `center.rs:785`) is attempted first, a last accepted snapshot is shown only behind an explicit stale/error marker for as long as the center stays unavailable, and a typed outage is shown when no accepted snapshot exists, with no hard error and no filesystem fallback presented as current in any of the three cases. Decided by the dashboard projection tests and the trust-report proof inside the landing gate, plus the diff read for a surviving direct reader or timer.
6. **The workspace is unmoved.** Root Cargo resolution and the root lockfile contain no gpui, the desktop project is not a workspace member, and the full landing gate passes without building it: `just test-full`, plus the root-resolution command declared in `[[checks]]` below.

Exclusions, restated so they are checkable by reading the diff: no light-theme value is touched, no pencil artifact is edited, no CLI-private type is imported by the desktop, no second copy of the inventory assembly or the family trust aggregate is added, no filesystem-watcher dependency enters `ctx-traits-io`, no trait authoring or new trust mutation is opened on any face, no inventory/trust/lockfile semantics are redefined, and no work belonging to `0266`, `0268`, `0269` or `0261` is done here.

## Order and bounded refinement

Children run in the three stages listed in `scope`; within a stage, the encoded edges are the only ordering that binds. When the last child lands, the suggested closing route is: leaf-by-leaf review against `screens/traits.md`, then the literal geometry comparison against `reference/traits.html`, then the boundary exercises, then the diff read for the single-resolution and no-second-reader properties, then the focused proofs, then `just test-full` and the root-resolution check, with the desktop lane command added once `0256.1` has landed one. The reason for that shape is cheap evidence first, so a rendering or aggregation defect surfaces next to the leaf that owns it rather than inside a long gate. The sequence is guidance, not a boundary: a pass that reorders it, folds steps together, or reaches the same evidence another way is legitimate and reports the deviation in its work summary.

The stop condition binds. Permit at most one targeted repair-and-rerun round at this level: a round repairs one named defect in the child that owns it, then reruns whatever closing evidence is needed to show the repair holds and broke nothing already proven. If a second round would be needed, stop and report the failing command or the failing leaf with its evidence rather than iterating; that is the stop condition, not a judgement call.
"""

[relations]
depends-on = [
    "0265",
    "0258",
]

[[checks]]
name = "workspace landing gate remains green and gpui-free in cost"
command = "just test-full"
timeout-ms = 1800000

[[checks]]
name = "root Cargo resolution, workspace membership and lockfile remain gpui-free"
command = """m="$(mktemp)" && cargo metadata --format-version 1 >"$m" 2>/dev/null && grep -q '"name":"ctx-traits-cli"' "$m" && ! grep -q '"name":"gpui"' "$m" && grep -q '^name = "ctx-traits-cli"$' Cargo.lock && ! grep -q '^name = "gpui"$' Cargo.lock && echo "gpui absent from root resolution and lockfile"; rc=$?; rm -f "$m"; exit $rc"""
timeout-ms = 300000
