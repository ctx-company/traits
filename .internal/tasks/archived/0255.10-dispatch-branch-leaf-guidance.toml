content = """
## Dependency gate
Before any implementation edit, require the complete joined landed state of `0255.9` and every transitive dependency. Grounding was read-only at clean HEAD `7ee3d86e`; no validation command ran and no file was edited. That baseline is not implementation-ready: `SequenceItem` has no prompt `intent` or `behavior` in `modules/core/src/trait/procedure/model.rs:914-1019`; `frame_guidance` is root-only and infallible in `modules/core/src/model_view/compile.rs:511-544`; `resolved_frame_prompt` resolves root-only guidance in `modules/cli/src/app/frame_prompt.rs:463-489`; `resolve_declared_item` remains private in `modules/cli/src/app/preview.rs:216-262`; and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist. Stop before edits and report the first absent or mismatched joined contract. Every contract absence or mismatch is a blocker, not permission to recreate dependency work in this task.

Inspect the joined implementation and require exactly this exhaustive `0255.9` contract: canonical prompt `SequenceItem.intent` and `SequenceItem.behavior`; prompt-only validation and static source rendering; fallible root-agent-ready-prompt `frame_guidance`; `IntentItemSource::ReadyPrompt`; shared additive replacement, scalar precedence, scoped require/avoid refusal, and rendering; canonical assigned-agent lookup; `resolve_declared_item` relocated to `modules/cli/src/app/frame_prompt.rs`; private `ready_prompt`; all four `ResolvedFramePrompt` participation fields `assigned_agent_intent_participated`, `assigned_agent_behavior_participated`, `ready_prompt_intent_participated`, and `ready_prompt_behavior_participated`; shared `intent_block` and `behavior_block`; exactly one existing integration test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`; and deterministic missing-index, unresolved-position, and non-prompt errors. Any absence or mismatch in this enumerated contract stops implementation.

## Outcome
Resolve branch-bearing ready frames to the exact structurally selected prompt declaration. A live or historical branch activation exposes only the arm chosen once by the runtime's recorded `BranchDecision`; no-session preview may project both arm declarations, but each projected frame resolves only its own leaf. Static declaration output may audit every arm and its source without claiming that an arm is active or ready. The branch container, unselected arm, enclosing sequence/container, sibling declaration, and prior or later leaf never contribute scoped guidance to a frame.

Broaden only the path admission inside dependency-owned private `ready_prompt` in `modules/cli/src/app/frame_prompt.rs`. In addition to every empty-path and plain named-sequence shape already accepted by `0255.9`, admit these branch-bearing forms:

- Live or historical: a non-empty `position_path` whose first segment is `kind = "procedure"`, whose last segment is `kind = "item"`, whose non-empty middle contains only `kind = "sequence"` or `kind = "branch"`, and whose middle contains at least one `kind = "branch"`.
- No-session static preview: a non-empty `position_path` containing only `kind = "sequence"` or `kind = "branch"` segments and at least one `kind = "branch"`.

Return `Ok(None)` for non-`SequenceFrameKind::Step` frames and every malformed or excluded non-empty path, including any path containing `loop`, `for-each`, or `parallel`. For an admitted path, retain the joined source-index requirement, call unchanged `resolve_declared_item` exactly once, require `effective_kind() == SequenceKind::Prompt`, and return that exact declaration reference. The resolver's existing rightmost non-`item` owner-segment rule already selects direct, alternate, and recursively nested branch-arm leaves; do not inspect branch decisions, prompt evidence or text, `run_index`, neighboring declarations, or globally unique `item_id` values.

The complete implementation allowlist is exactly `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`. Create, remove, rename, generate, or edit no implementation file outside those paths. The task rewrite changes only `.internal/tasks/0255.10-dispatch-branch-leaf-guidance.toml`; implementation must not edit this or another task file.

## Symbol contract
In `modules/cli/src/app/frame_prompt.rs`, edit only the body of exact dependency-owned private symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve its exact signature, empty-path behavior, plain named-sequence behavior, source-index/error contract, single call to unchanged `resolve_declared_item`, and prompt-kind requirement; broaden only its structural admission predicate to the two branch-bearing path forms above.

In `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only the body of exact existing symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Extend its schema-`0.6` fixture and assertions in place. Add no test symbol, helper API, support harness, capture framework, production hook, or path-normalization helper.

No symbol is added, removed, renamed, or given a changed signature. The only edited symbols are unchanged-signature private `ready_prompt` and unchanged-signature test `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. Keep `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>` and `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged and reuse them. `resolved_frame_prompt` already owns one canonical assigned-agent reference, one canonical ready-prompt reference, one `frame_guidance` call, four participation flags, and one pair of effective strings for no-session preview, session/historical preview, ordinary and refreshed CLI dispatch, speculative dispatch, and MCP dispatch.
"""
scope = """
## Ordered work
1. Before touching `modules/cli/src/app/frame_prompt.rs` or `modules/cli/tests/proof_agent_intent_dispatch.rs`, run the dependency preflight in `content` against the complete joined landed state of `0255.9` and its transitive dependencies. Verify the exhaustive enumerated contract in this order: canonical prompt fields and validation/static rendering first, core composition and source contracts second, CLI selector/composer contracts third, and the sole integration proof last. Stop at the first contract absence or mismatch; do not recreate, rename, or repair dependency-owned work.
2. Edit `modules/cli/src/app/frame_prompt.rs` first. Change only the body of exact symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve joined empty-path and plain named-sequence admission. Add only branch-bearing live/historical `[procedure, (sequence|branch)+, item]` paths and no-session `(sequence|branch)+` paths, each with at least one `branch`; reject malformed and later-sibling control paths before the retained source-index requirement and one unchanged `resolve_declared_item` call.
3. Edit `modules/cli/tests/proof_agent_intent_dispatch.rs` second. Extend only the body of exact symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` using its existing `ScratchRoot`, CLI and MCP harnesses, capture addressing, categorized block extraction, marker checks, frozen compatibility machinery, and system-channel assertions.
4. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`. Require exit 0 with exactly one passing integration test before proceeding.
5. Run `CARGO_TARGET_DIR=target just test-full`. The existing `Justfile:152-180` gate performs frozen pnpm installation, SDK and builtin drift checks, TypeScript formatting/typechecking/tests, Rust formatting and Clippy, workspace binary builds, and all workspace tests.
6. Run `git status --short` to inspect the complete worktree file list, then inspect `git diff -- modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs`. Substantively review the exact two-file implementation allowlist, retained top-level/named behavior, branch-only path admission, single structural lookup, selected-arm isolation, nested and alternate choice refresh, malformed and later-control path exclusion, no-guidance bytes, static-versus-ready source semantics, MCP participation, and `Agent.system` separation.
7. A dependency-gate failure, focused-test failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`, preserving that edit order when both need repair. After each repair, rerun the affected command and every later verification step in order. Complete only when both commands exit 0, the implementation diff remains inside the exact allowlist, and substantive review is clean; otherwise stop and report the concrete dependency, test, scope, or review blocker.

## Focused proof
Within the sole test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, extend the dependency-owned schema-`0.6` fixture with distinguishable then- and otherwise-arm prompt declarations and at least one recursively nested branch reached through a mixture of sequence and branch segments. Arrange local indices and nearby top-level and named declarations so an incorrect top-level lookup, branch-container lookup, previous-leaf lookup, later-leaf lookup, or opposite-arm lookup selects a marker that assertions reject. Item IDs may address captures, but prove declaration selection from structural positions and marker exclusion rather than global item-ID uniqueness.

Exercise true and false outcomes in separate real sessions, including the nested choices. Do not mutate an entered activation to select another arm. For every applicable projected or selected leaf, extract and compare the complete categorized intent and behavior blocks across no-session preview, session preview, real CLI dispatch, and real MCP dispatch. No-session preview may expose separate frames for both arms; assert that each such frame contains only its own declaration's guidance. Session preview and live CLI/MCP captures must expose only the runtime-selected arm. A false branch without `otherwise` produces no leaf frame and must not be treated as a selected prompt.

Prove deterministic root-agent-current-leaf order; prompt-local same-axis additive replacement; prompt-over-agent-over-root scalar precedence with broader fallback for omitted axes; scoped require/avoid refusal before the existing harness marker; prompt-only MCP participation; and changed effective prompt text whenever the selected leaf changes. Assert absence from each frame of branch-container, opposite-arm, sibling, enclosing sequence/container, previous-leaf, later-leaf, unassigned-agent, and stale prior-choice markers.

Preserve all dependency-owned top-level and plain named-sequence assertions, root-only collision compatibility, absent-guidance and present-empty-guidance bytes and flags, ready-frame source omission, static declaration attribution, and legacy compatibility oracles. Static sources for arm declarations remain `sequence:<named-arm-id>/<item-id-or-step-N>` with one-based fallback numbering; all declarations remain auditable without an active/readiness label. Keep unique `Agent.system` text absent from categorized intent and behavior blocks and present only on the established CLI `harness_argv`/system-prompt and MCP `mcp_harness_argv` channels.

## Reuse
`modules/cli/src/app/frame_prompt.rs::resolve_declared_item` remains the only structural declaration resolver. Its rightmost non-`item` segment already names the owning selected-arm sequence and local index for direct, alternate, and recursively nested branch paths; its empty-path behavior continues to serve top-level prompts. Exact reused signature: `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>`.

Keep exact reused signature `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged. Reuse its one canonical assigned-agent lookup, one `ready_prompt` reference, one core `frame_guidance` call, all four participation flags, and one effective `intent_items`/`behavior_items` pair. Reuse shared `intent_block` and `behavior_block`; do not fork composition by preview/live state or CLI/MCP transport.

Reuse runtime branch guard evaluation, immutable `BranchDecision`, `ControlKind::Branch` selected-arm frame, `SequenceFrame.position_path`, `current_ready_item`, `build_sequence_frame`, cursor advancement, control-frame completion, and the outer drive-loop call to `resolved_frame_prompt` unchanged. Those paths already rebuild provenance and effective guidance for each current leaf. There is no ordinary branch guidance cache to invalidate.

No symbol is added or removed. The only edited exact signatures are `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>` in `modules/cli/src/app/frame_prompt.rs` and `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` in `modules/cli/tests/proof_agent_intent_dispatch.rs`; both signatures remain unchanged.

## Exclusions
Do not edit `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/preview.rs`, `modules/cli/src/app/drive.rs`, runtime readiness, control flow, transitions, frame builders, `SequenceFrame`, persisted session/state or wire models, trait/schema/validation files, static renderers, transport composers, CDK files, generated SDK files, harness argument construction, cache identity, or any task sibling.

Do not admit malformed paths or paths containing `loop`, `for-each`, or `parallel`; those controls belong to `0255.11`, `0255.12`, and `0255.13`. Do not implement retries, persistent/shared-session refresh, or parallel wave caching owned by `0255.14` and `0255.15` or later siblings. In particular, do not modify `pending_wave_cache` or its position digests.

Do not add a declaration resolver, selector helper, composer, renderer, participation helper, effective-string variant, path-normalization helper, cache field, compatibility shim, test helper, or test symbol. Do not replay guards in no-session preview, inspect `BranchDecision` during declaration lookup, infer selection from prompt evidence/text or `run_index`, scan neighboring declarations, globally match `item_id`, precompose all arms, copy leaf guidance onto a branch/sequence container, or claim all static declarations are active. Do not change static source grammar, ready-frame source omission, joined error text, categorized envelope bytes, root-only MCP omission, assigned-agent selection, or `Agent.system` transport.
"""
