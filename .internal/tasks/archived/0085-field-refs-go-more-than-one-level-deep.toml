schema-version = "0.2"
key = "0085"
title = "Field refs go more than one level deep"
status = "done"
raised = "2026-08-04"
content = """


Third of three component slices the plannotator trait (0086) needs, and the only one with real contract
risk. Land it last.

Object-schema slots already expose one typed `FieldRef` per declared field (`handles.d.ts:37`,
`slot.d.ts:46`), and `condition.equals(slot.verdict.status, "approved")` lowers to the same guard
`fieldEquals` emits by hand. It stops at one level: `FieldRef` does not re-expose fields, so
`slot.a.b` does not typecheck, and underneath, every resolver is a flat `object.get(field)`.

Any external tool whose output nests is therefore unreachable. plannotator's plan mode returns
`hookSpecificOutput.decision.behavior` — three levels — and the only way to guard on it today is a
chain of `project` steps through throwaway slots, which is a workaround written into trait source
where a later reader cannot tell it from intent.

"""
scope = """
## Decisions

- **A path, not a new accessor kind.** `slot.a.b.c` lowers to exactly the guard the one-level form
  already emits, carrying a path where it carries a name. No second grammar, no new condition verb,
  and one-level refs keep emitting byte-identical guards.
- **One resolver, four callers.** Guard evaluation (`guards.rs:877`), control-flow guard resolution
  (`control_flow.rs:918`), `project`'s `field`, and the ledger contract validator
  (`ledger_contract.rs:1520`) all route through one path walk. Four hand-rolled walkers is precisely
  how the recorded operand and the recomputed operand come to disagree.
- **The ledger contract is the actual work, not the accessor.** Guard operands are recorded with
  their field and re-derived on every state transition — `ledger_contract.rs:2642` reports
  "comparison LHS does not match the declared ref and field" and `:3367` checks the slot operand
  against "its exact revision order, digest, field, and value". A path encoding that disagrees with
  the recorded one by a single detail fails every transition, killing live runs rather than only
  resumes. That is 0050's exact failure class and it cost a full day of runs.
- **A missing intermediate evaluates false, never errors.** `a.b` where `a` is absent must behave
  identically to a missing `a`: the guard is false, the loop keeps its shape, and nothing blocks.
  An error here would make an optional slot's absence fatal at an arbitrary depth.
- **Objects only.** No list indexing, no wildcards, no filters. A path is a sequence of object field
  names and nothing else. If list access is ever wanted it is a different task with a different
  grammar and a different failure model.

## Scope

`FieldRef` re-exposing `ObjectFieldRefs` in the CDK so `slot.a.b.c` typechecks and carries its
provenance; one shared path resolver in core; guards, control flow, `project` and the ledger
contract validator all routed through it; the `field` string in the generated schema carrying a
dotted path.

"""
validation = """
## Watch

- **Decide the path encoding once and prove it round-trips**, because it lands in recorded guard
  operands that are re-derived on every transition. Write the contract test before the accessor.
- **A literal field name containing a dot becomes ambiguous.** Refuse it at validation, naming the
  slot and the field, rather than inventing an escaping scheme — schema field names are authored, so
  this is a constraint the author can satisfy.
- One-level refs are the overwhelming majority and are already correct. Prove they emit unchanged
  guards before and after, or this quietly relocks the fleet.
- 0062 extends field refs for a different purpose (task nodes carrying `content` at three depths).
  These want the same resolver; coordinate rather than growing a second path implementation.

## Done when

`condition.equals(slot.x.a.b, value)` typechecks and evaluates; a `project` step lifts a nested
field into a slot; the ledger contract re-derives the identical operand and a run using a nested
guard survives a resume; a missing intermediate reads false rather than erroring; a field name
containing a dot is refused by name; and one-level refs emit byte-identical guards to today.
"""
