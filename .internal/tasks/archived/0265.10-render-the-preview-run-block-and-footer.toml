## APPROACH — suggested route, not a boundary

### Discover before editing

None of the desktop side exists at the HEAD this plan was written against. Read
what `0256.1`, `0265.1`, `0265.2`, `0265.3` and `0257` landed; do not carry a
guess from this file into an edit.

- Find the desktop project from root `Cargo.toml`'s exclude list and the
  top-level listing, then its manifest, README, justfile or CI lane, for the
  documented non-interactive build-and-test command. Record it verbatim before
  any edit. If no such lane exists, the prerequisite chain has not landed:
  report that rather than substituting workspace commands.
- Read `0257`'s landed selected-detail contract — what it serves, whether it
  carries the reconstructed trait and its `variant`, and how the desktop
  requests it. Extend that one contract if the variant is not on it; a second
  detail request is a defect. Note the model-owner-versus-connection-worker
  precedent in content above before deciding where blocking work runs.
- Read `0265.2`'s landed claimed-task answer and its typed failure/refusal
  cases, and consume them as typed outcomes rather than flattening them to
  `Option`.
- Read whether a shared compact-duration formatter and a shared start-clock
  presentation already exist (`0265.5` may have landed the first). Consume
  what exists; extract only what does not, once, with a retained non-GUI
  consumer.
- Read `0265.3`'s landed state presentation and extend it minimally for a
  stored task status rather than mapping statuses here;
  `tasks::status_tone`'s done→pass, cancelled→fail, ready→default
  (`modules/cli/src/app/tasks.rs:29-44`) is the semantics to match, not code to
  import.
- Read `0265.1`'s token and font entry point and take every value from it, and
  `0265.3`'s Sessions mount for where the preview column attaches.

### Edit order

1. The shared formatting first, so the render side has something to consume:
   the compact-duration formatter and the start-clock presentation, each
   extracted only if absent, each with its CLI consumer moved onto it.
2. The shared state presentation extended for stored task status.
3. The presentation primitives: the preview column frame with ordered body
   slots plus spacer plus footer; the named block form; the key/value row with
   tone-carrying value segments; the footer line.
4. The selected preview projection: joining row, detail/variant and
