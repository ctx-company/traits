This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it wherever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

This cut opens the 380-wide preview column with the two blocks that bracket it:
the `run` identity block at the top and the provenance footer at the bottom.
Grammar rule 13 fixes the column at w 380 and orders identity → state → fact →
consequence → spacer → provenance footer (`grammar.md:117-124`); `tokens.md:79`
fixes its padding at [18,22] and `tokens.md:82` fixes block gap 8 with bottom
padding 20. The export measures the same shape: a full-height column, a `Run
Block` column with gap 8 and bottom padding 20 whose first child is a lowercase
`run` heading in IBM Plex Mono 11 `#585d68` (`text-muted`), followed by three
full-width `space-between`, `align-items: center` rows
(`reference/sessions.html:633-697`); then, at the column's foot, a `flex: 1 1 0`
spacer and a full-width right-aligned footer in IBM Plex Mono 10 `#4d525c`
(`text-faint`) (`reference/sessions.html:868-877`). Grammar rule 12 gives the
footer's semantic shape `<run id> · started <time>` (`grammar.md:110-115`), and
rule 7 fixes keys at sans 11.5 `text-secondary` and values at mono 10.5 `text`,
"state-colored only when the value IS a state" (`grammar.md:68-72`).

Building these two first is what makes the column a column. Three primitives
land here and three siblings compose into them: `0265.11` inserts the
`in progress` and `verdict` blocks, `0265.12` the `slots` block and `0265.15`
the `landing` block, all between this cut's identity block and its spacer; the
Traits and Config previews reuse the same column, key/value row and footer
rather than copying them. So the column must expose ordered content slots, not
two hardcoded children.

## Six corrections to the draft this plan replaces

**Correction 1 — `in review` is not a task state, and the draft made it the
contract.** The draft's block text named `0243.4 · in review` and its Watch item
said "the task's `in review` qualifies" for state colouring. Stored status is
the closed set `ready|done|cancelled` (`modules/core/src/task/mod.rs:22-31`;
`task::parse` rejects anything else at `mod.rs:208-220` and `FilesTaskBoard::
load` then records a parse failure and skips the document,
`modules/io/src/task_files.rs:186-250`); `blocked` is derived, and only for open
leaves (`task/graph.rs:115-177`). Parent Correction 2 resolves this explicitly:
render the served state word, and if the owner wants `in review` literally that
is a board-schema finding, not a string typed into the desktop (`0265:32-38`).
The design string is an illustration. This plan binds the served evidence
instead, and goal 6 carries the whole of it, including the three absences the
draft never mentioned — no stored status, no claimed task, and a failed or
refused answer.

**Correction 2 — `42m` is an example, not a format, and there is exactly one
compact duration formatter in this repository's future.** The only compact
helper today is CLI-private `tui::human_elapsed_text`, which renders `4s`,
`3m 12s`, `Nh Nm Ns` and always retains seconds
(`modules/cli/src/app/tui.rs:35-47`); an exact-minute input therefore renders
`42m 0s` under its contract, not `42m`. It is `pub(crate)` inside
`ctx-traits-cli` and the desktop may not import it (`0265:61-63`). `0265.5`
plans the same extraction, "lifted to shared code if and only if a second
consumer exists" — and this cut is that second consumer. Goal 5 is therefore
written order-independently: consume the shared formatter if a prerequisite
already landed one, otherwise perform that one extraction here with the CLI
retained as a consumer. Either order yields exactly one formatter, so no
`depends-on` edge to `0265.5` is added: the edge would force an ordering that
neither task's semantics require, and the anti-duplication outcome is carried by
the goal rather than by the board graph. What is forbidden either way is a
preview-private `42m` branch, a fork, or the zero-padded story clock
`elapsed_text`. Any desired zero-elision is a change to the one shared formatter
and all its consumers, raised as a finding rather than branched locally.

**Correction 3 — the draft's footer time has no boundary policy, and the field
is optional.** `RunSummary.started_at_epoch` is `Option<u64>`
(`modules/io/src/run_summary.rs:37-38`) and `Provenance` documents `None` for
ledgers written before the field existed
(`modules/core/src/procedure/session.rs:284-290`). "`<run id> · started
<time>`" unconditionally is not renderable. Goal 7 binds the honest form: the
run id renders, and the whole ` · started <time>` segment is omitted when there
is no start epoch — never epoch zero, never a current clock, never a dangling
`·`. It also fixes the two things the draft left undefined: minute precision
`HH:MM`, and the timezone policy. Existing `epoch_clock` renders `HH:MM:SS`
with a labelled UTC fallback and `local_utc_offset_seconds` resolves the offset
at the stamp being rendered via `libc::localtime_r`
(`modules/cli/src/app/run_view/render.rs:181-214`); both are `pub(super)` and
neither matches minute precision, so this cut consumes a shared start-clock
presentation if a prerequisite landed one and otherwise makes the smallest
shared extraction with the CLI retained as consumer. The footer primitive itself
receives already-presented text and knows nothing about epochs or timezones.

**Correction 4 — the variant is not in the compact row, and must not be
guessed.** `Session` carries `trait_id` and no variant field
(`session.rs:1424-1515`); native family identity is deliberately split, so every
generated `implement` member carries `id = "implement"` while the selected
member carries `variant = "basic"`
(`.ctx/traits/authored/implement/generated/basic/index.toml:1-6`). `Trait.
variant` is the native family member identity and is optional
(`modules/core/src/trait/mod.rs:350-365,495-515`), while legacy
`Metadata.variant` is documented as display-only
(`modules/core/src/trait/metadata.rs:12-32`). Splitting a hyphenated trait id is
not a substitute: hyphens are valid identity content, and the only existing
suffix inference, `harness_config::resolve_run_variant`
(`modules/io/src/harness_config.rs:3185-3230`), is private config-qualified
routing logic, not display authority. Goal 4 binds the trait id from the row and
the variant only from `0257`'s authoritative reconstruction, native before
legacy, with no dangling `·` when it is absent.

**Correction 5 — an unreadable row is not a run with zero elapsed.**
`RunSummary::unreadable` stays list-visible with empty `run_id` and `trait_id`,
`elapsed_seconds = 0`, no start epoch, no task and `parse_error = Some(...)`
(`run_summary.rs:255-295`). Rendering those fields as data produces a preview
that reads as a real run that took no time and claims no task — a plausible lie,
which is worse than an omitted leaf. Goal 8 makes `parse_error` an inspected
branch.

**Correction 6 — the draft named the robustness invariants in Watch but bound
none of them, and had no stop condition.** Selection-triggered reads, UI-thread
isolation, fail-loud posture and restart identity were prose; atomicity across
the three rows and the footer under out-of-order selection responses was absent
entirely, and it is the defect this composition invites, because the block joins
three independently-arriving sources under one selection. Goal 9 binds all of
it against the landed transaction precedent, and goal 11 supplies the bounded
close that `0265:137-141` and the rewritten siblings already use.

## Grounded at HEAD 351ee444d

Nothing this task edits exists yet. Root `Cargo.toml:1-12` lists only the
existing workspace crates and excludes only `packages/cdk`; no manifest or
lockfile in the tree names gpui; there is no desktop directory, no desktop
recipe in `Justfile` and no desktop lane in `.github/workflows/ci.yml`. The
prerequisite chain has not landed either: `0265.2`, `0265.3` and `0257` are all
still `ready`, and `0256.1` — the task that establishes the standalone project,
its manifest, lockfile, asset mechanism and documented non-interactive
build-and-test command — is `ready` too.

Every desktop path, module name, component name, symbol, signature, gpui API and
command named below is therefore a guess to be replaced by discovery against
what `0256.1`, `0265.1`, `0265.2`, `0265.3` and `0257` actually landed. Binding
them here would be fabrication.

The desktop lane is nonetheless guaranteed to exist *when this cell runs*, and
the guarantee is a code fact. An open leaf derives `Blocked` while any
`depends-on` target is not `Done` (`modules/core/src/task/graph.rs:115-177`);
this task depends on `0265.3`, which depends on `0265.1`, which carries the
whole of item `0256` including `0256.1`. So this cell cannot dispatch until the
standalone shell, the token/font entry point, the Sessions mount and the bottom
bar have landed. The first act of this cell is to locate that lane's documented
non-interactive command and record it verbatim in the work summary. If no such
command is found, the prerequisite chain has not in fact landed: stop and report
that, rather than substituting a workspace command for rendered-behaviour proof.
It is deliberately *not* declared as a `[[checks]]` entry, because a check must
exist in the repository at the moment the plan is written and this one does not.

What that lane will cover is unknown here, so this plan promises none of it and
pins no coverage mechanics onto it. **Rendered-preview evidence**, the phrase
the goals use, means two things taken together: the landed lane's documented
command, run as it exists and exiting 0; and, for every outcome that command
does not itself decide, the run's own observation of the running frame and the
composed element tree, by whatever means that harness already supports. Which of
the two decided which outcome, and the mechanics used, are named in the work
summary. Adding coverage inside the landed harness is right where a goal needs
it; standing up a second validation lane beside it is not.

What *is* readable today, and what the goals lean on, is the data side. The
compact facts this block needs already exist on `RunSummary`: `run_id`,
`trait_id`, `started_at_epoch`, `elapsed_seconds`, `task_key`, `trait_source`
and `parse_error` (`run_summary.rs:23-118`), projected from the session at
`run_summary.rs:131-145,187-201,235`. `elapsed_seconds` is durable ledger
evidence, so a live value moves only when an accepted center update carries a
newer row and reopening a finished run reproduces it. The claimed-task answer
