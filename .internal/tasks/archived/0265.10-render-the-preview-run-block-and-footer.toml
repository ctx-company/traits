## Watch

- **`grammar.md` and `screens/sessions.md` are the specification; the export is
  measurement.** Take the column, block, row and footer geometry from
  `reference/sessions.html:633-697,868-877`; take content from the rules with
  the parent's corrections applied. `0243.4 · in review`, `implement · basic`,
  `run-ab12ef · 42m` and `started 13:44` are illustrations. A leaf that renders
  one of them for a run that does not carry it is worse than an omitted leaf,
  because it reads as evidence.
- **`in review` is not a task state and never reaches the screen** (content
  Correction 1; `0265:32-38`; `modules/core/src/task/mod.rs:22-31`). Stored
  status is `ready|done|cancelled`, `blocked` is derived only for open leaves,
  and `0265.2` does not derive board status at all. If the owner wants
  `in review` literally, raise it as a board-schema finding.
- **Absence is rendered, not defaulted.** No stored status, no claimed task, no
  variant and no start epoch are four distinct absences with four distinct
  honest forms, and none of them is a guessed default, a blank field, a
  dangling `·`, or the previously selected run's value left on screen.
- **`parse_error` is inspected before any field is read as data.**
  `RunSummary::unreadable` carries empty ids, `elapsed_seconds = 0` and no task
  by design (`run_summary.rs:255-295`); rendering those as a run is a plausible
  lie.
- **One formatter, one clock presentation, both shared, both with a non-GUI
  consumer.** `tui::human_elapsed_text` and `epoch_clock`/
  `local_utc_offset_seconds` are CLI-private and may not be imported. A
  preview-private `42m` branch is the failure mode this cut invites; `42m 0s`
  under the shared contract is the correct outcome, and changing it is a change
  to the shared formatter and all its consumers.
- **The variant comes from the reconstruction or not at all.** Hyphens are
  valid trait-id content, so a suffix split is not an inference — it is a
  fabrication. `harness_config::resolve_run_variant` is private routing logic,
  not display authority.
- **Three sources, one commit.** The block joins the compact row, the
  authoritative detail and the claimed-task answer; the defect this shape
