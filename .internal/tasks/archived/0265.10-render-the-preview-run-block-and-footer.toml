- A run with a start epoch rendering `<run id> · started HH:MM`, and one
  without rendering the run id with no dangling ` · started`.
- A selected row carrying `parse_error` rendering unreadable, with no `0s` and
  no empty identity value presented as data.
- Selecting A then B with A's responses arriving last leaving B's three rows
  and footer intact; a rejected candidate leaving the previously accepted
  preview whole; a detail failure never combining with a prior run's variant,
  task or footer.
- Center loss and subscriber eviction leaving the preview visibly stale rather
  than current.
- No read fired for an unselected row, a hover or a delta for another run.
- A finished run's block and footer identical after the application closes and
  reopens.
- The `0256.2`-`0256.5` and `0257.3` proofs still passing unmodified.

