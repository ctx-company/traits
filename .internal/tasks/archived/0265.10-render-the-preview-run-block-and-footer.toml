- A trait id with a served variant, and one without, with no dangling `·`.
- Elapsed rendering from the served row through the shared formatter, and not
  moving without a newer accepted row.
- Stored status coloured with the key neutral; `None` status rendering the key
  alone; no claimed task rendering a visible absence; a failed or refused
  answer rendering loud — and none of the four leaving the previous run's task
