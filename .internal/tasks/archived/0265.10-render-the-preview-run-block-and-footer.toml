### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like a `preview_column(blocks, footer)` frame, a
`preview_block(heading, rows)` form, a `kv_row(key, segments)` where a segment
carries text plus a tone, and a `preview_footer(text)`; a shared
`human_elapsed_text`-shaped formatter and a shared `epoch_clock`-shaped
presentation with a minute-precision form, both in core or IO beside the types
they format; and a selected-preview projection type joining the three sources.
Names, module paths and signatures follow whatever conventions `0256.1`,
`0265.1`, `0265.3` and `0257` established. The behaviours goals 1-9 fix are not
suggestions; where they live and what they are called are.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- A 380-wide column at padding [18,22] whose children are, in order, the
  identity block, the flex spacer and the footer — and whose body sequence
  accepts additional blocks between identity and spacer.
- The `run` heading in mono 11 `text-muted` above three space-between rows in
  the order trait, run, task, with block gap 8 and bottom padding 20.
- A compound value rendering neutral identity, neutral `·` and one semantically
  coloured state segment — and no case where the whole value takes the state
