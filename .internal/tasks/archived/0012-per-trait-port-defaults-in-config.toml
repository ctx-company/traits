schema-version = "0.1"
key = "0012"
title = "Per-trait port defaults in config, so a path stops being hard-coded in trait source"
status = "done"
raised = "2026-07-28"
content = """


## The problem

`implement` hard-codes its inputs as resource declarations in TypeScript:

```ts
resource({ id: "execution-plan", path: ".plans/EXECUTION_PLAN.md", root: "repo", … })
resource({ id: "rule-authority", path: ".docs/PRODUCT.md", root: "repo", … })
```

Those paths are this repository's layout, baked into a package another project is meant to install. A user whose plan lives at `docs/roadmap.md` cannot use the trait without editing and rebuilding it — which moves its digest and drops its trust.

## What to build

Two changes, and the first is the substantive one.

**1. The path becomes a port with a default.** `execution-plan` stops being a fixed resource and becomes an input port whose value is a path, defaulting to `.plans/EXECUTION_PLAN.md`. The trait keeps working with no configuration; a caller can point it elsewhere.

**2. Defaults are settable per trait in config, not only at the call site (shape agreed with owner 2026-07-28).** One path, prefixed by scope:

```toml
# .ctx/traits/<trait>/config.toml — the trait's own sidecar, context implied
[defaults.port]
execution-plan = "docs/roadmap.md"

# a config covering many traits — the same path, scoped
[trait.implement.defaults.port]
execution-plan = "docs/roadmap.md"
```

Precedence: explicit `--set` > per-trait config > the port's declared default.

The word `defaults` earns its segment. `[trait.implement.port]` is shorter and says nothing about precedence; `defaults` states inline that a call-site `--set` wins, which is exactly what a reader needs and exactly what would otherwise be re-argued. It also leaves room for `defaults.agent` / `defaults.budget` later without a second rename.

The sidecar already exists and needs no new file: `.ctx/traits/<trait>/config.toml` has been budget-only since P312, carrying a `[budget]` table and a `schema-version`. `[defaults.port]` sits beside it.

Note for `tasks/0010`: a port default is unambiguously a DEFAULT in that task's classification — a nearer layer replaces it freely, and nothing here is a requirement a consumer must not weaken. It is the clean worked example for that side of the split.

## Watch

- **A defaulted port is still evidence.** Whatever value is used must land in the ledger as the port's accepted value with its source (default / config / `--set`), or a run's receipt stops explaining what it actually read. This is the difference between a default and a hidden assumption.
- **Resource semantics do not come free.** The current declarations carry `root: "repo"`, `trigger: "on-demand"`, hidden-content audit exemptions and digest tracking. A port carrying a path gets none of that automatically — decide whether the runtime resolves a path-valued port into resource evidence (keeping the audit) or whether the agent simply opens it (losing the audit). The second is simpler and weaker; say which was chosen.
- **This changes trait digests**, so the family rebuilds and needs re-approval — cheap now that `trust approve implement` covers every variant in one act, but real.
- Do not generalise to "every resource becomes a port". Only paths a CONSUMER legitimately owns should move; a trait's own bundled rubric is not one of them.

## Done when

`implement` resolves its plan and product-doc paths from ports with working defaults; a project can set them once in config; an explicit `--set` still wins; the value and its source appear in the ledger; and the trait works unchanged with no configuration at all.
"""
