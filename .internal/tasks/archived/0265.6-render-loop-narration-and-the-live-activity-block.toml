This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

Two leaves of `screens/sessions.md:19-31` sit between and beneath the frame rows
`0265.5` landed, and both are live.

The **loop-narration line** goes between frames: italic mono 10.5 `text-faint`,
illustrated as "round 2 — refinement reviewed, review re-runs". The screen tags
it precisely — the marker is `data:`, the copy phrasing is `placeholder:`
(`screens/sessions.md:22-24`) — so the line appears where the run's own loop
evidence puts it, wearing prose from the one shared module. The export fixes its
geometry: container padding `[8,12,2,12]` at full width, text IBM Plex Mono 10.5,
italic, weight 400, `#4d525c`, nowrap (`reference/sessions.html:349-359`).

The **activity block** sits under the current row: mono 10.5 `text-faint` lines,
newest at top at opacity 1.0 stepping to about 0.45, gap 3, carrying "the agent's
actual activity" (`grammar.md:104-108`). The export fixes it at full width,
column gap 3, padding `[4,12,6,27]` — the 27 left offset is the current row's
12 padding + 5 dot + 10 gap, so the lines align under the row's text
(`reference/sessions.html:460-463`, `413-459`). It is tagged
`data: center activity deltas`, and it is the sharpest no-poll surface in the
application: lines arrive as deltas on the subscription `0256.4` drives, are
received off the UI thread, and are never fetched on a timer.

Grammar rule 5 separates the two narration voices — inline narration is italic
mono 10.5 `text-faint`/`text-ghost`, a narrated *screen summary* is italic sans
12 `text-secondary` (`grammar.md:49-56`). This line is the former. Rules 1-4 bind
as they did for `0265.5`: colour chosen from a named state, states as words, the
closed glyph set, dots confined to stateful lists, and no corner radius inside
the canvas beyond rule 4's 5px ellipse (`grammar.md:6-47`). `text-faint` is
`#4d525c` and 10.5 is the mono meta step that `tokens.md:34`, `64` already name;
both arrive through `0265.1`'s token entry point, never as call-site literals.

## Six corrections to the draft this plan replaces

**Correction 1 — the marker is loop path segments and nothing else; other
segments carry iteration for unrelated bookkeeping.** Parent Correction 2 already
records that "loop marker exists" names no stored field, and that the durable
evidence is structural: `SequenceStatus.position_path` is a `Vec<PathSegment>` of
`{ kind, id, index, iteration, item_index }`
(`modules/core/src/procedure/runtime/state.rs:282-315`), and an active
`ControlFrame` carries `iteration_index`, `max_iterations`, `item_index` and
`item_total` (`state.rs:349-389`). The sharper point the draft misses is stated
in the repository's own doc comment on `story::format_step_title`: "Only loop
control segments own round numbers; item and other control segments may repeat an
iteration field for unrelated bookkeeping"
(`modules/cli/src/app/story.rs:29-44`). A narration line emitted because *some*
segment carried an `iteration` would invent a round for a `for-each` item or an
unrelated control frame. Ruling: only `kind == "loop"` segments produce a
narration line.

**Correction 2 — the round is one-based on display, and nested loops produce more
than one, which the existing precedent joins rather than flattens.**
`format_step_title` maps each loop segment's `iteration` with `saturating_add(1)`
and joins the collected rounds with `/` (`story.rs:33-43`, tests at
`story.rs:1120-1157`). Storage is zero-based; the human value is +1. A nested
loop therefore has an ordered *sequence* of rounds, not one number. Ruling: the
narration renders the one-based value(s) the shared projection supplies, and
nested evidence stays distinguishable — flattening a nested position to a single
round, or keeping the innermost and discarding the rest, presents a different
run's structure as this one's. Which of those values the phrase surfaces is the
run's call; erasing them is not.

**Correction 3 — the `review:` prefix in the export is not in the activity
event.** `ActivityEvent` carries `sequence`, `frame_id`, an `ActivityKind` from
the closed set (`Dispatching`, `Thinking`, `RunningTool`, `StreamingOutput`,
`ValidatingOutput`, `Retrying`, `Stalled`, `Compacting`, `NoActivityReported`,
`RateLimited`), optional bounded `text`, optional `tool`, tokens and optional
rate-limit evidence (`modules/core/src/procedure/activity.rs:55-144`). It has no
role and no structural path, so `review:` in
`reference/sessions.html:464-511` cannot come from the event. Ruling: any role or
frame prefix comes from the authoritative frame projection associated with the
current row — the same durable mapping `0265.5` chose for the current row's
trailing segment — or the prefix is omitted. A literal `review:` would fabricate
evidence, which parent Correction 2 forbids outright.

**Correction 4 — the block cannot render every `ActivityRecord` variant.**
`CenterDelta::ActivityLine { row, activity }` carries a whole `ActivityRecord`
(`modules/io/src/center.rs:265-281`), and that enum has four variants:
`Activity { at_epoch_ms, event }`, `StepSummary { at_epoch_ms, key, role, text }`,
`SessionTitle { at_epoch_ms, title }` and
`Narration { at_epoch_ms, frame_id, text }`
(`modules/io/src/activity_sidecar.rs:22-56`). Rule 11 says the content is the
agent's *actual activity*. A session title is chrome evidence for a different
surface, a step summary is a settled verdict, and a narration is the narrator's
voice rather than the agent's. The repository already draws this line:
`story::load_activity` routes only `Activity` into `events`, keeps
`step_summaries` and `narrations` in separate typed collections, and drops
`SessionTitle` for this purpose (`story.rs:205-267`). Ruling: the block renders
`Activity` records; the other three variants are not lines here and are not
silently reformatted into lines.

**Correction 5 — the fade is positional, and eight is a cap rather than a
target.** The export's newest line carries no `opacity` property at all — it is
the default 1.0 — and the seven beneath it carry `0.93, 0.86, 0.79, 0.72, 0.65,
0.55, 0.45` in order (`reference/sessions.html:464-511`; parent `0265:108-110`
restates the sequence). Nothing in the export or in rule 11 ties a step to a
timestamp or to age in seconds. Ruling: opacity is a function of the line's
visible index and nothing else; with fewer than eight lines the leading slots of
that sequence are used; the ramp is stepwise, not interpolated; and no clock,
timer or elapsed-time input participates. The draft's "eight lines" is the
maximum retained and rendered, not a count to pad up to — an empty or short block
renders exactly what evidence exists.

**Correction 6 — `ActivityEvent.sequence` alone cannot order the block.**
Consecutive same-kind `Thinking`/`StreamingOutput` events for one frame are
coalesced into a single persisted record at the sidecar append boundary, bounded
at 2048 characters, while `RunningTool`/`Dispatching`/`Retrying`/`Compacting`
persist one-for-one (`modules/cli/src/app/drive.rs:476-490`, `633-707`); the
durable coalesced event currently carries sequence 0. Ruling: "newest first"
means reverse arrival chronology over the accepted lines the detail model already
holds, using the record's `at_epoch_ms` and arrival order — not a sort on
`sequence`, and not a reversal of center delivery.

