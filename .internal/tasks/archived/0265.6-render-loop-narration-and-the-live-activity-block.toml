## Watch

- **Only loop segments own rounds.** The repository's own doc comment says item
  and other control segments "may repeat an iteration field for unrelated
  bookkeeping" (`story.rs:29-32`). A narration line emitted from any `iteration`
  invents a round for a `for-each` item.
- **Storage is zero-based, display is one-based, and nested loops carry more than
  one round.** `format_step_title` adds 1 and joins the collected rounds
  (`story.rs:33-43`). Flattening a nested position to a single number presents a
  different structure than the run recorded.
- **The marker's position and existence are data, never placeholder content.**
  Serving the marker itself statically would mark a wired region as unwired, and
  deriving it from adjacent row labels or flat row order is what parent
  `0265:38` forbids by name.
- **Narration is italic mono 10.5 `text-faint`**, rule 5's inline voice — not the
  italic sans 12 `text-secondary` narrated screen summary. Confusing the two
  collapses rule 5.
- **`review:` is not in the event.** `ActivityEvent` carries no role and no
  structural path (`activity.rs:55-144`). A literal prefix fabricates evidence,
  which parent Correction 2 forbids.
- **Not every `ActivityRecord` is activity.** Four variants travel through
  `CenterDelta::ActivityLine`; rule 11 asks for the agent's actual activity, and
  `story::load_activity` already routes summaries, titles and narrations
  elsewhere (`story.rs:205-267`).
- **The fade is positional, and eight is a cap.** Opacity is a function of the
  visible index against `1.0, 0.93, 0.86, 0.79, 0.72, 0.65, 0.55, 0.45`; an even
  ramp, an interpolated ramp, an age-derived opacity, or padding to eight all
  misread rule 11. An empty block renders nothing rather than an invented line.
- **`sequence` alone cannot order the block.** Coalesced thinking/output records
  currently persist with sequence 0 (`drive.rs:476-490`, `633-707`); ordering
  comes from arrival and `at_epoch_ms`. "Newest first" is a presentation
  reversal, never a reversal of center delivery.
- **`frame_id` is ambiguous across loop executions.** It is item-id-or-title
  (`drive.rs:3184-3196`). If `0257.3` does not serve an unambiguous current
  activity slice, report an unmet prerequisite contract; do not show an older
  execution's activity beneath the current row.
- **The block owns no timer and no fetch.** It renders the lines the accepted
