What must be reported is fixed by GOALS and Done when; this subsection only
suggests how. Quoting each executed command in a fenced block with its exit
status beside it reads better than prose. Naming the discovered desktop path
beside that lane's command helps the next cut declare it as a board check.
Stating the durable role mapping used for the line prefix, and any owner
