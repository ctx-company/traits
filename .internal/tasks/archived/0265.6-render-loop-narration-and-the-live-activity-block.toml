the accepted snapshot/delta model, the selected-detail reconstruction, the token
entry point, the `placeholders` module and the frame-row/list vocabulary have all
landed. Every desktop path, module name, symbol and signature named below is
therefore a guess to be replaced by reading what `0256.1`, `0265.1`, `0265.3`,
`0265.5` and `0257` actually landed.

**No command in this repository executes a gpui render, so none is declared as a
board check.** A check runs under `sh -c` in a clean detached worktree of the
merged sha, so a command written here on the expectation that a dependency
creates it later would read as evidence while being unrunnable. The six declared
checks are commands that exist in this tree today, and they include the
repository's own landing gate `just test-full` (`Justfile:148-180`).

**The desktop lane the dependency chain lands is nonetheless the binding gate for
rendered behaviour.** `0256.1` does not close until its documented independent
build and test commands pass from a clean checkout, so by execution time that
lane and its documented non-interactive command exist. Read the command out of
the landed lane's own documentation — manifest, README, justfile or CI lane —
extend that existing harness with this cut's cases, run it, and name it verbatim
with its outcome. Goal 14 binds it. If the lane is absent at execution time, the
prerequisite chain was not honoured: report an unmet dependency and do not pass
the task. Do not stand up a lane of the run's own.

**A prerequisite that does not serve an unambiguous current activity slice is a
defect to report, not permission to guess.** Durable activity identity is
`frame.item_id` or, absent that, `frame.title`
(`modules/cli/src/app/drive.rs:3184-3196`); it carries no path and no iteration,
so one id can name several loop executions. `0257.3` owns reconciling the
ledger/sidecar seed with later deltas and attributing them to the current
execution, and `0265.5` already treats a repeated id as ambiguous timing
evidence. This cut consumes that attribution. If it is missing, that is an unmet
prerequisite contract stated as a finding — never a licence to show an older
execution's activity beneath the current row.

**Static review decides the structural half and cannot decide the runtime half.**
The closing reads of `git diff main...HEAD`, `git diff --name-only main...HEAD`
and `git status --short` establish what a running harness does not show cheaply —
duplicated formatting logic, CLI-private imports, call-site literals, direct
sidecar or ledger reads, timers and polls, inline placeholder prose, scope, and
untouched design artifacts — and they satisfy the parent's review clause
(`0265:104-112`). They do not establish that a line rendered, in what order, at
what opacity, or at what position.
