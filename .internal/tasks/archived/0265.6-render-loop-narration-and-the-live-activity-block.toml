### Edit order

1. The loop-marker/placement consumption: read what `0257` serves, and extend the
   shared structural projection only if it does not already expose an explicit
   marker with its one-based round(s).
2. The shared activity-line derivation: the `ActivityRecord` variant routing and
   the bounded line text, extracted into core/IO with the CLI consumer moved onto
   it.
3. The `placeholders` entry for the loop phrasing, taking the round as data.
4. The narration line component and its container geometry.
5. The activity block component: a bounded newest-first view over the accepted
   lines with index-derived opacity, and its geometry beneath the current row.
6. Composition into `0265.5`'s frame list, and the rebind on accepted
   current-frame transition.
7. The focused proofs in the desktop lane and in the workspace, then the desktop
   command, then the declared checks and the remaining named commands.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like a shared `loop_rounds(position_path) -> Vec<usize>`
carrying the loop-only filter and the plus-one conversion, living beside the
projection types `0257` shares, with `story::format_step_title` moved onto it; a
shared `activity_line_text(&ActivityEvent) -> String` carrying the quoting and
tool-label semantics of `projection.rs:985-1025`, with the CLI retained as its
consumer; a desktop `loop_narration(round_phrase)` component and an
`activity_block(lines)` that owns the eight-line cap and the index-derived
opacity so no caller can set a per-line opacity. Names, module paths and
signatures follow whatever conventions `0256`, `0257`, `0265.1`, `0265.3` and
`0265.5` established. Whether the center answers already-filtered activity lines
or the desktop filters the accepted records is the run's call — note only that
the wire cap is 1 MiB (`center.rs:48-52`) and the block needs at most eight
lines, so a bounded projection is the safer shape.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- A reconstruction with no loop renders no narration line.
- A reconstruction with a recorded second round renders one line at the
  projection-supplied position carrying the one-based round.
- A non-loop control segment carrying an `iteration` renders no line.
- A nested-loop reconstruction keeps its rounds distinguishable.
- A different recorded round renders a different round in the same phrase.
- All four `ActivityRecord` variants present; only the `Activity` ones become
  lines.
- A `RunningTool` event renders the tool label, not raw tool-input JSON.
- Zero, one, fewer-than-eight, exactly-eight and more-than-eight lines: the count
  caps at eight, the newest is at top, and each visible line's opacity matches
  its slot.
- The empty case renders no line at all.
- The role prefix follows the served detail and is absent without one, with no
  dangling separator.
- An accepted delta updates the block; a rejected candidate leaves the previous
  block, list, markers and current row intact with no leaked line.
- A current-frame transition clears the previous frame's lines.
- A disconnect renders the stale posture rather than silently current lines.
- The `0256.2`-`0256.5` and `0257.3` coverage still passes with its semantics
  intact — ideally untouched, and any adaptation an extraction forced is
  reported rather than treated as a violation.

### Reuse points

`story::format_step_title`'s loop-only, plus-one, nested-preserving round
semantics (`story.rs:29-44`) as the derivation to extract, not to copy;
`story::load_activity`'s `ActivityRecord` variant routing (`story.rs:205-267`)
