title = "An ask pane: talk to the run while it runs"
status = "done"
raised = "2026-07-28"
content = """


## The idea

A "by the way" input under the live view: ask a question in the context of the current run and get an answer, without stopping it or reading a ledger. *"What blockers has the reviewer raised?"* *"Which files did round 3 touch?"* *"Why did the gate fail?"*

Layout, per the owner:

```
|--- progress ---| |--- history  ---|
|--- journey  ---| |--- activity ---|
|--- input -------------------------|
```

`input` spans the full width under P552's 2x2 grid.

## What answers it

A new seat — `[agent.role.guide]` — a small, fast model, sibling to `narrator`/`scribe`/`clerk` rather than to `worker`/`smart-*`. It is answering questions about material it is handed, not reasoning about the codebase, so it should cost what a narrator costs.

Its context is the run's own evidence: the ledger's accepted slot values, the step statuses, the activity history — the same material the panes already render. It reads; it never writes a slot, never advances a frame, never dispatches a step.

## Watch — the hard parts, in order

- **This is a read-only observer and must be structurally incapable of being anything else.** It gets no output slot, no submission channel, no tools that mutate. A guide that could write into the run would be a second, unreviewed author inside a procedure whose whole claim is that every write is typed and attributed.
- **Do not let it become the run's memory.** Answers are ephemeral and are not evidence; nothing in the ledger should depend on a question having been asked. If an exchange is worth keeping, that is `story`'s job (P550), not this pane's.
- **Cost is per question, and the pane invites questions.** The seat must be small by default and its token use must land in the run's own accounting like the narrator's does, or a chatty session silently doubles a run's cost.
- **Context selection is the real design work**, not the pane. A whole ledger will not fit; picking "the last N activity events plus every accepted verdict" is a guess. Start narrow and stated (verdicts, blockers, step statuses, current step) rather than dumping the ledger and hoping.
- **Screen space.** The 2x2 grid already loses rows to P552's header and borders on an inline viewport one row short of the terminal. The input pane should be one or two rows collapsed, expanding only while in use — not a permanent third of the screen.
- No guide seat configured means the pane is absent, not broken.

"""
validation = """
## Done when

A key opens an input under the live view; a question is answered from the run's own evidence by the `guide` seat; the answer never touches the ledger; the run is unaffected; token use appears in the run's accounting; and with no guide configured the pane simply is not there.
"""
