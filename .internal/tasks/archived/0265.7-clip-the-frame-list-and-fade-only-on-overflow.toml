1. **The frame list clips.** The container holding the frame rows sets clip, so
   content taller than the container is cut at the container's bounds rather than
   overflowing the pane, spilling into the bar, or forcing the pane to grow. The
   clipped viewport is the flex-filling region and the measured content inside it
   is the fit-content column of rows (`reference/sessions.html:289-296`).
   Decided by focused coverage in the landed desktop lane (goal 12) that content
   exceeding the container is visually cut at the container bound and that
   neither the pane nor the bar is displaced by it.
   Excluded: growing the pane to fit; a scrollbar, gutter or track; letting rows
   paint over the bar; clipping the pane rather than the list region.

2. **Overflow is decided by comparing resolved geometry, and equality is fit.**
   The primitive compares the clipped viewport's resolved height against its
   content's resolved height, taken from the layout pass. Strictly greater is
   overflow; equal is fit (content Correction 4). No row count, item count,
   estimated row height, character count or heuristic participates, because the
   list is heterogeneous by specification — a wrapped 430-wide description or an
   arriving activity line changes content height without changing row count.
   Decided by focused coverage in the landed desktop lane (goal 12) over content
   that fits, content at exact fit, and content that exceeds the viewport,
   including a case where the resolved content height changes while the row count
   stays fixed and the decision flips from fit to overflow; and by the closing
   static read for the absence of any count-based or fixed-row-height derivation.
   Excluded: `rows.len()` compared against a capacity; a per-row height constant;
   deciding overflow from the data model rather than from layout; treating exact
