5. The focused proofs in the desktop lane — fit first, since it is the case the
   export cannot demonstrate — then the desktop command, then the declared
   checks, then the closing diff read.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like a desktop `clipped_with_overflow_fade(content)` that owns
the clip, the measurement and the conditional overlay, so no caller can hand it a
visibility decision (goal 8), plus an internal overlay element taking the pane
width and the viewport's bottom edge as measured values rather than constants.
Names, module paths and signatures follow whatever conventions `0256`, `0265.1`,
`0265.3` and `0265.5` established. Whether the clip and the overlay are one
component or a container plus a pane-level overlay is the run's call, so long as
goal 4's parenting and goal 8's ownership hold — the constraint that decides it
is that the overlay cannot be a descendant of the thing it covers.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- Content shorter than the viewport: no overlay and no label present at all.
- Content exactly as tall as the viewport: still no overlay.
- Content taller than the viewport: the list is cut at the container bound, the
  overlay renders at the token height spanning the pane, the label renders
  centred and bottom-padded, and the bar is fully visible.
- The overlay is not clipped away and does not translate with the content.
- The overlay spans the pane, not the 40-inset list content width.
- A content-height change at a fixed row count still flips the decision and
  produces the fade. Rewrapping the 430-wide description, adding an activity
  line, or any other harness input that grows resolved content height without
  changing the row count are equally acceptable ways to drive it; which one the
  existing harness makes cheapest is the run's call.
- Fit to overflow and overflow to fit, driven by a content change: the overlay
  appears and then disappears, with no stale overlay left behind.
- Fit to overflow and overflow to fit, driven by a viewport resize: same.
- The component renders correctly over content whose type it does not know.

### Reuse points

`0265.5`'s frame-list primitive and its test harness as the content and the place
to extend coverage; `0265.3`'s bottom bar and main-pane composition as the
positioning context and the box the overlay must not cover; `0265.1`'s token
entry point for canvas, `text-faint`, the mono face, the 10.5 step and the fade
height and stops; `0256.1`'s desktop lane as the build-and-test command and the
established layout/measurement mechanism to reuse. `reference/sessions.html:251-254`,
`289-296`, `575-577` and `620-630` are the geometry measurement — pane,
clipped viewport, measured content, bar and overlay respectively — and
`grammar.md:86-91` with `screens/sessions.md:19-31` are the specification.
`modules/cli/src/app/tui_kit.rs:206-274` is named only as what this is *not*:
a row-count viewport with input behaviour, CLI-private, not to be imported and
not to be ported.

### Reporting mechanics — suggestions

What must be reported is fixed by GOALS and Done when; this subsection only
suggests how. Quoting each executed command in a fenced block with its exit
status beside it reads better than prose. Naming the discovered desktop path
beside that lane's command helps the next cut declare it as a board check.
Stating the measurement hook actually used, and any owner correction raised
against the design artifacts, under their own heading keeps them from being read
as commentary. Deviations from this approach are reported in the work summary as
deviations; that is a report, not a violation and not an escalation.

### If something is red

Isolate with `CARGO_TARGET_DIR=target` before trusting a phantom "cannot find X";
a shared cross-worktree target dir flakes gates. Rust is pinned to 1.97.1 by
`rust-toolchain.toml:21-24` and the desktop directory inherits that pin unless
`0256.1` gave it its own toolchain file. Keep any repair scoped to the one red
command and preserve every invariant named under Excluded.

## Excluded — not cells here

- Scroll input of any kind: wheel, drag, keyboard, programmatic scroll, scroll
  position or offset state, and making `scroll to end` clickable. Clipping is
  what this task owns; the label is text.
- The activity fade and loop narration (`0265.6`); the frame-row forms and the
  list-level selection rule (`0265.5`); the frame counter (`0265.14`); the
  header, bottom bar, preview column, rail, title bar and chrome.
- The subscription, socket reader, delta protocol and stale/recovery posture
  (`0256`); the detail reducer (`0257`). This cut consumes what they landed and
  adds no second one.
- The light column of `tokens.md`, and any edit to `.internal/docs/design/**`.
- Any ledger, store, sidecar or filesystem read on the desktop side; a GUI poll
  loop; a timer or animation clock; a blocking wait on gpui's UI thread.
- A design-system phase: component registry, palette abstraction, scroll
  framework, or primitives extracted for `0266`-`0269` before one of them
  consumes them.
- A `[[checks]]` entry that executes the desktop lane. No such command exists in
  the repository today, so declaring one now would be a fabrication. The lane
  still binds: goal 12 requires the run to discover it, extend it, run it green
  and report it verbatim.
- Packaging and release work (`0260`), the summons surface (`0259`).
- Anything discovered beyond these goals: that is board material, not a cell
  here.
"""
validation = """
## Watch

- **A fade over content that fits is a rule 9 violation** and the easiest one to
  ship by accident. It has to be provably absent in the fit case and present in
  the overflow case, both exercised by running layout. The static export shows
  only the overflow case, so it is evidence for half the rule and silent on the
  half most likely to break.
- **Exact fit is fit.** Content height equal to viewport height paints nothing;
  only strictly greater is overflow. An inclusive comparison ships a fade on a
  list that fits perfectly.
- **Nothing is painted before a valid measurement exists.** A default-on or
  optimistic overlay corrected on a later frame is the failure the rule names. A
  briefly-missing hint is a missing hint; a wrongly-present fade is a lie about
  the content.
- **A row count cannot decide overflow.** The list is heterogeneous by
  specification — a 430-wide description at line-height 16 rewraps and an
  activity line arrives, both changing content height at an unchanged row count
  (`screens/sessions.md:19-31`, `0265:108-110`).
- **The overlay cannot be a descendant of what it covers.** Inside the clipped
  viewport it is clipped; inside the scrolled content it scrolls away. The export
  parents it absolutely in the pane at `left: 0`, z-index 3, beside the clipped
  section at z-index 1 (`reference/sessions.html:251-254`, `289-295`, `620-630`).
- **`full-pane-width` is 800, not the 720 list inset — and both are
  measurements.** The pane's 40 horizontal padding is deliberately covered. 800
  is what the reference pane measured at one window size; derive the current
  width.
- **The overlay's bottom is the clipped viewport's bottom, not the bar's top.**
  The export's fade ends at 775 while the bar's top sits roughly 30 lower down
  the stack, separated by the pane's 28 gap. Anchoring to the bar paints across
  that gap and breaks on `0266`-`0269`, whose bars differ.
- **Re-measure on both sides.** A content change and a viewport resize each flip
  the answer. A measurement cached at construction, or keyed on item count,
  leaves a stale overlay over content that now fits.
- **The primitive measures.** A screen that has to tell it "you are overflowing"
  has had the rule pushed back onto it, and every later screen re-decides rule 9.
- **Rule 9 is not rule 11.** The activity block's positional 1.0-to-0.45 opacity
  ramp (`grammar.md:104-108`, `0265.6`) is a different rule with a different
  ramp; both are on screen at once during a live overflowing run. Merging them
  behind one "fade" abstraction collapses two rules into one.
- **The label is `scroll to end`, centred, mono 10.5 `text-faint`** — not a
  scrollbar, not an arrow glyph, not an icon, and not a button. Rule 3 closes the
  glyph set and forbids corner radius inside the canvas (`grammar.md:31-37`).
  Shipping the label without shipping scroll input is intentional here.
- **`ViewportScroll` is not this primitive.** It tracks a row-count length and an
  offset, measures no pixels, owns input behaviour that is out of scope, and is
  CLI-private (`modules/cli/src/app/tui_kit.rs:206-274`) — which the parent
  forbids the desktop from importing.
- **No literal values at a call site.** `#0c0d10`, `#4d525c`, IBM Plex Mono,
  10.5, the 100 height and the 80% stop all come from `0265.1`'s token entry
  point; a hex or a stop inside a primitive is the same defect as one inside a
  screen.
- **"Does not block the UI thread" means no added blocking work**, not a claim
  about which thread gpui lays out on. No sleep, join, I/O, timer, animation
  clock, poll loop, or second layout model beside gpui's own on the render path.
- **Workspace gate cost must not move**: gpui must not enter root resolution, the
  root `Cargo.lock`, `just test`, `just test-full`, or the existing CI lanes.
  Isolate builds with `CARGO_TARGET_DIR=target` if a failure looks like a phantom
  "cannot find X".
- **The declared checks are workspace-side invariants, not proof of this task's
  desktop behaviour.** They show the workspace stayed gpui-free and green. They
  do not show that anything clipped, measured or painted.
- **The rendered outcomes are decided by executing the desktop lane, not by
  reading the diff.** Goal 12 binds the lane `0256.1` landed. The closing diff
  read is code-shape review — what is parented where, imported, duplicated,
  literal, timed, or out of scope — and it is supplementary wherever a goal names
  a runtime outcome. An absent lane at execution time is an unmet dependency and
  the task does not pass.

## Done when

- Every command the run executed is green, and the work summary names each one
  verbatim with its outcome. Nothing is called done over a red command.
- The desktop lane's exact documented non-interactive build-and-test command,
  discovered from what `0256.1` landed and extended with this cut's cases, exits
  0, and the work summary names it verbatim with its outcome. Its coverage
  observes, by running the desktop: content shorter than the viewport rendering
  no overlay and no label at all; content exactly as tall as the viewport
  rendering none either; content taller than the viewport rendering the list cut
  at the container bound plus the canvas gradient overlay at the token height,
  reaching opaque at 80%, spanning the pane's full current width rather than the
  list inset, with its bottom at the clipped region's bottom edge and the bar
  fully visible beneath it, carrying `scroll to end` centred and bottom-padded in
  mono 10.5 `text-faint`; the overlay neither clipped away nor translating with
  the content; a resolved content-height change at a fixed row count flipping the
  decision from fit to overflow and producing the fade; and fit-to-overflow and
  overflow-to-fit transitions driven both by a content change and by a viewport
  resize, with the overlay appearing and disappearing accordingly and no stale
  overlay left behind. If that lane is absent, this clause is unmet, it is
  reported as an unmet dependency on `0265.5` → `0265.3` → `0265.1` → `0256.1`,
  and the task does not pass; no workspace command and no diff read substitutes
  for it.
- The closing static read of the diff printed by `git diff main...HEAD`, read
  against `grammar.md:31-37` and `86-91`, `screens/sessions.md:19-31`,
  `tokens.md:15-85` and `reference/sessions.html:251-296`, `575-577`, `620-630`,
  shows the structural half the lane does not observe: no overflow boolean or
  content height crossing the component's boundary from a caller; no row-count,
  item-count or fixed-row-height approximation; no unconditionally painted or
  default-on fade; exactly one overflow implementation in the desktop; no merging
  of rule 9 with rule 11's opacity ramp; no colour, size, family, stop, height or
  spacing literal at a render call site, and specifically no `#0c0d10`,
  `#4d525c`, `10.5`, `100`, `800`, `675` or gradient stop; no scrollbar, track,
  arrow, icon, corner radius, click target, hover state or cursor change; no
  blocking wait, sleep, join, filesystem, socket, ledger or sidecar read, timer,
  interval, spawned tick, animation clock or poll loop; no CLI-private import,
  `ViewportScroll` included; the overlay parented in the pane's positioning
  context rather than inside the clipped subtree; no generality beyond one
  container and its overlay — no variants, options or configuration without a
  current caller; none of the sibling behaviours goal 10 names introduced; and no
  scroll-input handling beyond what clipping requires.
- The work summary states the gpui measurement hook actually used and the
  discovered desktop path, and raises any conflict found between the design
  artifacts as an owner correction rather than an edit to
  `.internal/docs/design/**`.
- The declared root-resolution check, run verbatim from the repository root,
  exits 0.
- `just test` exits 0, green and unchanged in cost.
- `just test-full` exits 0 — the repository's landing gate (`Justfile:148-180`),
  including `just ts-test`, `just lint`, `cargo build --workspace --bins` and the
  full `cargo test --workspace` over the integration proof binaries. It is
  unconditional: no desktop lane run and no diff read substitutes for it, and it
  does not substitute for them either.
- `git diff --name-only main...HEAD` lists no path under
  `.internal/docs/design/`, and the substantive read of `git diff main...HEAD`
  shows none of the sibling behaviours goal 10 names — an activity fade, a
  frame-row form, a bar behaviour, a preview block or a frame counter —
  introduced by this cut. Wrapping a surface a sibling landed is not such a
  behaviour. Substitute the run's actual base branch if it is not `main`.
- `git status --short` prints nothing, and the closing diff was read from the
  tree that lands.

## Bounded refinement

Run, in order: the discovered desktop lane command required by goal 12, the
root-resolution check, `just test`, then `just test-full` — the landing gate, run
last of the commands because it is the most expensive and the earlier ones
localise a failure faster — then the closing diff read.
Permit at most one targeted repair-and-rerun round: repair one named defect, then
rerun the failed command and every command after it in that order. If a second
round would be needed, stop and report the exact failing command — or the
unresolved visual contract — with its evidence rather than iterating. That is the
stop condition, not a judgement call.
"""

