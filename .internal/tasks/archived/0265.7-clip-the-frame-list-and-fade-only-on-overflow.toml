actually observe.

**The desktop lane, executed.** Clipping, measurement, conditional visibility,
overlay geometry and re-measurement on change are runtime outcomes; they are
decided by focused coverage run in the desktop build-and-test lane that `0256.1`
lands, whose exact documented non-interactive command is discovered at execution
time and must exit 0 (goal 12). No goal names that command and no check declares
it: it does not exist at the HEAD this plan was written against, and a board
check must already exist and run repo-root-relative in a clean detached worktree.
The obligation is unconditional even though the command is unnameable — an absent
lane at execution time is an unmet dependency that prevents this task from
passing, not permission to accept those outcomes on a diff read.

