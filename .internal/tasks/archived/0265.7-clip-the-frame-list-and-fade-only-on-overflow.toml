This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

Grammar rule 9 governs what happens when a list is longer than its pane, and the
Sessions frame list `0265.5` landed is the first list in the application that can
be. The container clips. When — and only when — content overflows, a
full-pane-width gradient overlay sits above the bar: canvas colour, alpha 0 at
the top rising to opaque at 80% and 100%, height 100, with `scroll to end`
centred near its bottom in mono 10.5 `text-faint`. Content that fits gets no fade
(`grammar.md:86-91`; `screens/sessions.md:19` tags the frame list as its first
consumer; `gpui-desktop-face-design.md:59-61` restates the decisive condition).

The rule's teeth are in its last clause: **no fade when content fits.** That
makes this a measuring primitive rather than a decorating one. It has to know
whether the content actually exceeds its container before it paints anything, and
an always-painted fade is the failure mode the rule names by name. Building it
here, against a real list with a real overflow case, is what lets the four later
screens compose it without each re-deciding when the gradient appears
(`0265:70-78`; `0269.1:38` and `0269.2:46` already restate the rule for Merges).

## Six corrections to the draft this plan replaces

**Correction 1 — the overlay is a child of the pane, not of the thing it covers.**
The draft says the gradient "sits above the bottom bar" and leaves its parenting
open. The export fixes it: `Main Pane` is `position: relative`
(`reference/sessions.html:251-254`), `Frames Section` is the clipped viewport at
`overflow: hidden`, `flex: 1 1 0`, z-index 1 (`:289-295`), `Frame Rows` is the
measured content at `flex-shrink: 0`, `height: fit-content` (`:293-296`), and
`Bottom Fade` is an *absolute* box at `left: 0`, z-index 3, in the pane's
positioning context — a sibling of the clipped section, not a descendant of it
(`:620-630`). This is not cosmetic. An overlay parented inside the clipped
viewport is itself clipped, and one parented inside the scrolled content scrolls
away with it — in both cases the fade disappears exactly when the rule says it
must appear. Ruling: the overlay lives outside the clipped subtree, in the pane's
own positioning context, painting over the clipped content rather than within it.

**Correction 2 — `full-pane-width` is the pane including its padding, and 800 is a
measurement, not a constant.** At the export's 1440 width the pane is 800 wide
after the 260 rail and the 380 preview column (`:93`, `:251-254`, `:634`), while
its 40 horizontal padding leaves the list content only 720 wide. The fade is
`left: 0`, `width: 800px` — it spans the whole pane, deliberately wider than the
list it covers, which is why rule 9 says *full-pane-width* rather than
full-list-width. Ruling: the overlay derives the pane's current width; 800 is
what the reference pane measured at one window size and is never a literal.

**Correction 3 — the overlay's bottom edge is the clipped viewport's bottom, not
the bar's top and not `top: 675`.** The export's fade is `top: 675px`,
`height: 100px`, so its bottom edge is 775. The window is 900 with a 36 title bar
(`:26`, `:29`), leaving 864 of body; the pane is `height: 100%` with bottom
padding 20, so the pane's content box ends at 844; the `Run Bar` is a
non-shrinking sibling with padding `[10,14]` and a 1px border around 11px mono
(`:575-577`), and the pane's gap is 28 — which puts the clipped section's bottom
edge within a few px of 775 and the bar's top edge roughly 30 lower down the
stack. The fade's bottom therefore tracks the *clipped viewport's* bottom edge,
not the bar's top; it covers the last 100 of clipped content and leaves the 28
gap and the bar untouched. (The bar's exact height depends on the resolved
line-height of `line-height: normal`, so treat the arithmetic as corroborating
the anchor, not as a target to reproduce.) Ruling: anchor the overlay's bottom to
the clipped viewport's own resolved bottom edge. Anchoring it to the bar would
paint across the gap, and would break on `0266`-`0269`, whose bars differ and
which are the documented consumers of this vocabulary. Rule 9's "above the bar"
is a statement about not covering the bar — the export's z-index 3 over the bar's
2 only matters against the clipped content at z-index 1, since the two boxes do
not overlap.

**Correction 4 — a row count cannot decide overflow, because the rows are not a
fixed height.** The frame list is heterogeneous by specification: ordinary done
rows, loop-narration lines, a taller current row whose description is 430 wide at
line-height 16 and therefore wraps to a variable number of lines, an activity
block of up to eight lines at gap 3, and pending rows
(`screens/sessions.md:19-31`, `0265:108-110`). The same eight rows can fit or
overflow depending on one description's wrap and on how many activity lines have
arrived. Ruling: the comparison is between the clipped viewport's resolved height
and its content's resolved height, taken from the layout pass. Content height
*equal* to viewport height is the fit case and paints nothing; only strictly
greater is overflow. Before a valid measurement exists the primitive paints no
fade — an optimistic or default-on overlay is the exact violation rule 9 names,
and defaulting the other way is the safe direction because a briefly-missing fade
is a hint, while a wrongly-present one is a lie about the content.

**Correction 5 — "measurement does not block the UI thread" is the absence of
added blocking work, not a claim about which thread gpui lays out on.** The draft
states the constraint as if measurement could simply be moved off-thread. It
cannot be grounded from this tree whether the locked gpui revision runs its
layout callbacks on or off the main thread, and a layout pass is by construction
part of producing a frame — a plan that ordered measurement onto another thread
would be prescribing an architecture it cannot see. The parent's robustness
inheritance is about *stalls* (`0265:66`). Ruling: the binding, observable
property is that this cut adds no blocking wait, sleep or join, no filesystem,
socket, ledger or sidecar read, no timer, animation clock or poll loop, and no
second layout model maintained beside gpui's own on the render path. Whatever
measurement mechanism the landed desktop code already established is the one to
reuse; inventing a parallel one is the defect this replaces the draft's phrasing
to prevent.

**Correction 6 — rule 9 and rule 11 are two different fades that coexist, and
`scroll to end` is a label rather than an affordance.** Rule 11's activity fade is
a per-line positional opacity ramp from 1.0 to about 0.45 over up to eight lines
(`grammar.md:104-108`), owned by `0265.6`; rule 9's is a canvas-coloured gradient
overlay outside the content. With a live current row and an overflowing list both
are on screen at once, and neither substitutes for the other. Ruling: no shared
"fade" abstraction spans the two, and this cut does not touch the activity ramp.
Separately, this task ships the `scroll to end` text without shipping scroll
input: rule 9 specifies the label, the target excludes scroll handling beyond
what clipping requires, so the label is plain centred text with no click target,
no hover state, no cursor change, no scrollbar, arrow or icon, and no corner
radius — rule 3 closes the glyph set and forbids radius inside the canvas
(`grammar.md:31-37`). The existing TUI's `ViewportScroll`
(`modules/cli/src/app/tui_kit.rs:206-274`) is not this primitive: it tracks a
row-count length and an offset, measures no pixels, owns input behaviour that is
out of scope here, and is CLI-private, which the parent forbids the desktop from
importing.

