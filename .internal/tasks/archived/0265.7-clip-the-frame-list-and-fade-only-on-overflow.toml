- `just test` — the per-round workspace gate (`cargo test --workspace --lib` plus
  the format/lint/SDK/TS steps, `Justfile:111-146`), green and unchanged in cost.
- `just test-full` — the repository's landing gate (`Justfile:148-180`): the
