schema-version = "0.2"
key = "0051.1"
title = "The startup pane must not render trait-authored text before trust succeeds"
status = "done"
raised = "2026-08-03"
content = """


Carried from blocker `startup-pane-renders-untrusted-trait-text` (0/4 — none of this landed).
**Do this one first: it is a trust-boundary defect, and it is live on main today.**

## The defect

Query-driven startup can expose trait-authored identifiers and decode warnings from
UNAUTHORIZED candidates on the startup surface, before the trust gate has approved anything.
Refusal output can also write directly into the active inline viewport. The whole point of the
lifecycle/trust gate is that unreviewed trait content does not get to influence what an owner
sees; a startup pane that paints an unapproved trait's own strings breaks that.

## Remaining

- Map pre-authorization trait-loading and trust observer failures to FIXED generic startup
  details containing no trait-authored values.
- Prevent decode warnings captured from an unauthorized trait document from being appended to
  startup-pane scrollback before trust succeeds.
- Observer and PTY regression coverage using a trait-authored sentinel string, proving the
  sentinel never reaches the startup surface before authorization.
- Route interactive query selection through the startup-aware authorization path so candidate
  summaries and detailed selection errors are not printed while the pane is active.

"""
validation = """
## Done when

A trait document carrying a sentinel in its id, summary and decode warnings is dispatched and
refused by the trust gate, and the sentinel appears nowhere on the startup surface or in its
scrollback; the refusal itself is a fixed generic message; and the PTY regression proving it is
part of the suite.
"""
