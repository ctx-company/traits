## Goals and approach are separate

Everything in this section, including the `## Done when` list at its end, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, and which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the `facts` and `checks` fact blocks, the `landing` consequence block and the provenance footer of the Tasks preview column, plus the widening of `0266.4`'s landed selected-detail answer with the stored document metadata, the raw declared relations, the declared `Check` records, the effective close-policy outcome and the closure fact those blocks render — reachable and actually consumed by an existing non-GUI face.

- **The parent's corrections bind.** `0266`'s content corrections govern this leaf; Corrections 9, 11 and 12 are the ones it touches directly, and where this file restates one it does not narrow it.

- **This leaf resolves nothing.** No task-TOML parse, `task_files` call, `task_board_cache` read, `.internal/tasks` walk, board resolution, `git` invocation, cwd inference, config read or clock read happens on the desktop side, and no second auto-close resolution, config-layer stack, run-to-task join, claim choice or board digest is created anywhere. The board answer is `0266.1`'s, the claim is the one `0266.1` chose and `0266.4` served, the instant and the board name are `0266.2`'s, the policy resolution is `0265.15`'s.

- **The claim's identity is not in the `landing` line; its served state sets the line's tense.** `details.claimed` already carries the one centrally chosen claim (`0266.4` goal 5). A task key on a run does not record that the run came through the close-executing queue (`task_queue.rs:71-108`), and the join yields a vector rather than a run (`dashboard.rs:5953-6002`), so no sentence here may name a run as the executor of a close or pick one from a joined set. But a terminal claim makes a future close sentence false, so the claim state `0266.4` serves — active, pending, terminal, or no single chosen claim — selects between goal 4's future and non-future forms, and is consumed as served rather than derived here. Content Corrections 6 and 7.

- **`facts` is document metadata, `details` is derived state.** The two blocks answer different questions and must not converge: `facts.status` is `TaskDocument.status` as stored, `details.id` is the centrally derived state word. Rendering either one in the other's block is the export's mistake, not a shortcut.

- **Detail is a companion to the compact listing, not a widening of it.** Wire lines are bounded at 1 MiB (`center.rs:48-53`) and this repository's board is already several hundred documents. Declared checks, raw relations and prose ride the selection-triggered answer only; adding any of them to every board row fails this regardless of whether a given line happens to fit.

- **Compose the landed vocabulary, do not duplicate it.** `0265.12`'s fact-block composition is the shape of `facts` and `checks`; `0265.10`'s named-block form and key/value row underneath it are what that composition is made of; `0265.15`'s `→` consequence line and its shared auto-close resolution are the `landing` block; `0265.10`'s preview-footer primitive is the footer; `0265.1`'s token entry point and registered IBM Plex faces carry every dimension, size and tone. A Tasks-private copy of any of them is a defect even when it renders correctly.

- **Every leaf here is `data:`.** The `placeholders` module has no call site in this column, and no design example string is reproduced.

- Out of scope: the column frame, the lede, the `details` block and the selection/detail transaction (`0266.4`); the header, bottom bar, aggregate digest and the capture of the resolution instant (`0266.2`); the sections, rows, canonical `draft`, run-to-task join, board freshness and key-based selection (`0266.1`); the row's state-over-meta stack (`0266.6`); draft creation and the bar action (`0266.3`, `0266.8`); the TUI migration (`0266.7`); the light theme; pencil work of any kind; and every shared primitive `0265` already built.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0266.4` — the 380-wide preview column frame with its ordered body sequence, its lede and `details` blocks, its one selection-triggered detail answer with the centrally chosen claim, its atomic staged-candidate transaction and its non-GUI consumer. `0266.2` — the one center-captured resolution instant and the served board provenance name and typed sync outcomes the footer cites, so bar and footer cannot disagree. `0265.15` — the `→` consequence-line primitive settled at sans 12, and the one shared root-taking auto-close resolution keeping effective policy, resolved absence and resolution failure distinct; it depends on `0265.12`, which is the reusable fact-block composition, so the single edge reaches both.

Neither `0266.2` nor `0265.15` is reachable through `0266.4`'s closure, and a charter's `depends-on` is not inherited by its children (`graph.rs:115-177`), which is why both are named here. Bind to the desktop project, components, capability names and non-interactive command those tasks actually landed, not to a path or protocol name guessed in this file.

## Done when

1. **The three blocks and the footer append into the landed body sequence, in rule 13's order, at the specified geometry.** After `0266.4`'s `details` block the column renders `facts`, then `checks`, then `landing`, then the flex spacer, then the footer — composed by extending the frame's ordered body parameter and its footer slot, never by rebuilding the frame, re-deriving the selection or editing a region `0266.4` owns. Each of the three is a named block with a lowercase heading in mono 11 `text-muted` (`facts`, `checks`, `landing`), internal gap 8 and bottom padding 20, full width, inside the column's width 380 and padding `[18,22]`; the footer is full-width, right-aligned, mono 10 `text-faint` after the spacer. Geometry matches `reference/tasks.html:744-746,828-975` and `tokens.md:79-82`; where the export conflicts with `grammar.md` or `screens/tasks.md` on content or type, the specification governs and content Corrections 2, 3, 6 and 8 are the resolutions. No repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented; it is decided by rendered evidence in the lane `0256.1` establishes together with the bounded review in `validation`, and by `just test` for the shared code these leaves render through.
   Excluded: a Tasks-private block, heading, key/value row, consequence line or footer form beside the landed primitives; a `facts` block with no heading, per content Correction 2; a second column frame or body sequence; any colour, size, spacing, family or weight literal at a call site; a status dot anywhere in this column — rule 4 restricts dots to stateful lists and this column is prose, key/value and consequence lines; a pill, badge, chip, icon, fill, border or corner radius; any glyph outside `→` and `·`; a light-column value; an edit under `.internal/docs/design/**` or to any pencil artifact.

2. **`facts` renders four named rows from the document's own stored metadata, and every absence has a visible data-derived form.** Heading `facts`, then rows `status`, `raised`, `parent`, `depends on` in that order, each full-width and `space-between`, key sans 11.5 `text-secondary`, value mono 10.5 `text` per rule 7 and `0265.12`'s landed row. The sources are exactly `TaskDocument.status`, `raised`, `relations.parent` and `relations.depends_on` as stored (`task/mod.rs:119-180`), served by the detail answer:
   - `status` — the stored status word, including the canonical `draft` `0266.1` adds. Where the value is a state word, its tone is whatever the landed shared state-word presentation the rows and bar already use resolves; where that presentation is not reachable, the value stays in the neutral `text` tone. This cut invents no tone map.
   - `raised` — the stored string verbatim, never reformatted, re-parsed or compared against a clock.
   - `parent` — the declared parent key alone.
   - `depends on` — every declared key, in declaration order, joined by `·`; the key label carries a space because `screens/tasks.md:33`'s hyphen names the document field `relations.depends-on` rather than a rendered label, and the export agrees.
   Absent values render these four fixed words rather than a blank, a dropped row or a `placeholders` call: no stored status → `not stored`; no `raised` → `not recorded`; no parent → `none`; empty `depends_on` → `none`.
   Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch boards spanning stored `ready`, `draft`, `done` and `cancelled`, stored status absent, `raised` present and absent, parent present and absent, and zero, one and several dependencies with order preserved; by `CARGO_TARGET_DIR=target just test` for the shared projection; and by rendered evidence and the bounded review for the rows themselves.
   Excluded: substituting the derived state, the section membership, `DerivedStatus`, the claim or `details.id`'s state word for stored `status` (content Correction 3); enriching `parent` or `depends on` with titles or statuses through `graph::resolved_relations` (content Correction 3); dropping, reordering, sorting, deduplicating or eliding any dependency in the value the answer carries, or replacing the tail with a count — narrowing for width is layout's business and never removes a dependency from the served value; a blank, an em dash, a `-`, a `placeholders` call or an invented default for any absence; the export's `12px` keys, its sans values, its `claimed by run-ab12ef`, `2026-08-24`, `0243 — the center` and `0243.3 · done`.

3. **`checks` names every declared check, in declaration order, and executes nothing.** Heading `checks`, then one sans 11.5 `text-secondary` line per element of `TaskDocument.checks`, each line the element's `name` verbatim, in document declaration order. A task with no declared checks renders the named block with its heading and zero lines — the honest form, because unlike a `facts` row a check line is not a leaf the artifact enumerates, so there is nothing to say `none` about. Nothing in this column runs, schedules, spawns or shells out a check command, and no check outcome, exit code, duration or verdict is rendered here.
   Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch documents with zero, one and several checks, and by the closing diff read for any process spawn, `Command`, worktree creation or `task_checks` call reachable from this column.
   Excluded: executing or scheduling a check; rendering `command`, `timeout_ms`, `expect`, a `CheckRecord` outcome or a pass/fail tone here; an invented line, a `no checks` line or a `placeholders` call for the empty case; reordering or deduplicating the declared list; the export's three example check sentences; widening any compact board row with checks.

4. **`landing` is one `→` consequence line stating the configured close consequence for the selected task, and both a resolved task and an ended run supersede its future tense.** The line is `→`-prefixed sans 12 `text-secondary` through `0265.15`'s landed consequence-line primitive (content Correction 8). Its subject is the selected task; it never names a run id, trait or revision, never predicts that a particular run will close anything, and never picks a claim out of a joined set — so no claim, one claim and an ambiguous join all render the same subject (content Correction 6). The complete matrix has three inputs — the document's resolved-closure fact, the served claim state `0266.4` carries, and the effective-policy outcome `0265.15`'s shared root-taking resolution returns — and assigns one fixed rendered form to every cell; no cell is left to the run's wording, and the three inputs are read in this precedence:
   **First, the resolved outcome, which supersedes every other form.** Stored status `Done` or `Cancelled`, or a recorded `TaskDocument.closure`, is evaluated before the claim and the policy and replaces their forms whatever they were (content Correction 7). Its four fixed forms, `Cancelled` taking the cancelled wording and every other terminal case the closed wording, and the commit variant used exactly when `Closure.commit` is `Some`:
   - `→ Task <key> is closed`
   - `→ Task <key> closed in <commit>`
   - `→ Task <key> is cancelled`
   - `→ Task <key> cancelled in <commit>`
   Nothing else about the closure — its `mode`, its `CheckRecord`s, their outcomes or details — is rendered here.
   **Second, policy resolution failure**, which is honest in either tense and is therefore reached whatever the claim state is: an unusable repository path, a config read or parse error, or a provider error → `→ Task <key> close policy unresolved` in the `danger` tone, distinct from resolved absence and never collapsed with it.
   **Third, the served claim state, which decides tense and only tense.** The claim outcome is taken as `0266.4` serves it and is never derived, re-joined or chosen here. An **active or pending** claim, and equally a task with no claim or an ambiguous join yielding no single chosen claim, leave the policy forms below exactly as written — a close that has not been attempted is legitimately future. A claim the served outcome reports **terminal** — already landed, merged, failed or otherwise ended — while the task is still open makes every future form false, because the queue closes nothing for a missing revision, a `Proposal` disposition, a read failure or a write failure and leaves the document untouched (`task_queue.rs:71-108`). That cell takes a fixed non-future form, one per effective-policy outcome, each asserting only that the task is still open and never that it closed:
   - Effective `Confirm` → `→ Task <key> is open after its run ended, and closes only on owner confirmation`.
   - Effective `Checked` **with at least one declared check** → `→ Task <key> is open after its run ended, and closes only when its declared checks pass`.
   - Effective `Checked` **with no declared check** → `→ Task <key> is open after its run ended, and declares no checks to close it`.
   - Effective `Merge` → `→ Task <key> is open after its run ended and was not closed`.
   - Resolved successfully to no policy → `→ Task <key> is open after its run ended, and has no auto-close policy`.
   A terminal claim is evidence about the run only. It never rewrites the `facts.status` row, never marks the task closed anywhere in this column, and never reaches the closed forms above, which stored status and `closure` alone decide.
   **Fourth, with no resolved closure and an active, pending, absent or ambiguous claim, the effective-policy outcome decides in `0265.15`'s landed forms.** Four of these five cells are already fixed by `0265.15` goal 4 in task-anchored wording, and are reused verbatim rather than re-authored:
   - Effective `Confirm` → `→ Task <key> closes only on owner confirmation`.
   - Effective `Checked` **with at least one declared check** → `→ Task <key> closes when its declared checks pass`.
   - Effective `Merge` → `→ Task <key> closes when a run lands, checks or not`.
   - Resolved successfully to no policy → `→ Task <key> has no auto-close policy`; this is not a failure and is not collapsed with one.
   **The fifth cell is this task's own and is bound here.** Effective `Checked` **with no declared checks** → `→ Task <key> declares no checks, so nothing closes it automatically` — because `close_disposition` returns `Proposal` before looking at any result in that cell (`task_proposals.rs:449-455`), and the empty `checks` block sits directly above this line (content Correction 5). `0265.15` does not distinguish that cell, so this and the five terminal-claim forms are added forms, not divergences from landed ones; where `0265.15`'s landed wording for any of the four differs from what is written above, its landed text wins, the terminal-claim forms are re-derived from it by the same tense substitution, and the difference is named in the work summary.
