Close the Tasks screen's 380-wide preview column: the `facts` and `checks` fact blocks, the `landing` consequence block, and the provenance footer, appended into the ordered body `0266.4` opened and composed from the primitives `0265.12` and `0265.15` landed. `screens/tasks.md:27-36` orders the column lede → `details` → `facts` → `checks` → `landing` → footer and rule 13 orders it identity → state → facts → consequence → spacer → provenance (`grammar.md:117-124`); `0266.4` owns the frame, the lede and `details`, and this cut owns everything after them.

Every leaf here is tagged `data:`. The shared `placeholders` module has no call site in this column, and no string from `reference/tasks.html:828-975` — `claimed by run-ab12ef`, `2026-08-24`, `0243 — the center`, `0243.3 · done`, the three check sentences, `Closes automatically when run-ab12ef lands`, `14:52` — is data. The export is geometry authority and nothing more; on this stretch of the column it is also, unusually, wrong about type and wrong about content, and eight corrections follow.

**Correction 1 — two of the three things this column composes are unreachable from its declared prerequisite.** The draft declared only `0266.4`, whose closure is `0266.1`, `0265.10` and `0265.14`. The footer's instant is `0266.2`'s: that task captures exactly one resolution instant on the center side and names this file by key as its second consumer, ruling that formatting it is presentation and that reading a second clock is a second reader wearing a different hat (`0266.2` content Correction 9, goal 6). `0266.2` is a sibling and is in nobody's closure here. The fact-block composition — a heading over a served list of key/value rows — is `0265.12`'s, which names `0266.5` by key among the later screens that take it; and the `→` consequence-line primitive plus the one shared root-taking auto-close resolution are `0265.15`'s. `0265.15` depends on `0265.12`, so one edge reaches both: an open leaf derives `Blocked` while any `depends-on` target is not `Done` (`modules/core/src/task/graph.rs:115-177`), which is the same reachability argument `0265.15` itself used for `0265.2`. A charter's `depends-on` is not inherited by its children, so parent `0266`'s edges gate nothing here. The prerequisite set is `0266.4`, `0266.2`, `0265.15`.

**Correction 2 — the export's `facts` block is not the block the specification describes.** It has **no heading** at all (`reference/tasks.html:828-920` goes straight from the block div to `Row status`), its keys are **sans 12** and its values are **sans 11.5 `#eceef2`**. Rule 5 makes every block heading lowercase mono 11 `text-muted` (`grammar.md:49-56`); rule 7 makes kv keys sans 11.5 `text-secondary` and values mono 10.5 `text` `#d7dae0` (`grammar.md:68-72`); `tokens.md:62` puts kv keys at 11.5, not 12; and `0265.12` landed exactly that shape as the reusable fact block. `screens/tasks.md:33` calls it "`facts` block (kv)" — a named block. `0267.3` resolved this identical export conflict toward a visible `facts` heading for the Traits column. Resolved the same way here: heading `facts`, rule 7 typography, `0265.12`'s composition. The export's own `details` block two divs earlier already renders a mono 11 `#585d68` heading and sans 11.5 / mono 10.5 rows, so the export contradicts itself, not just the rules.

**Correction 3 — the export's fact values are three different fabrications, and two of them are the derivation this task forbids.** `status` renders `claimed by run-ab12ef`, which is not a stored status at all: it is the claim, already rendered one block above by `0266.4`'s `details.claimed` row, restated as document metadata. `parent` renders `0243 — the center`, a key joined to the parent document's *title*; `depends on` renders `0243.3 · done`, a key joined to a *derived* status. Both are what `graph::resolved_relations` produces when it enriches edges (`modules/core/src/task/graph.rs:188-221`), and the target's own watch line rules that `parent` and `depends-on` render as the document states them. `TaskDocument` stores `status: Option<TaskStatus>`, `raised: Option<String>`, `relations.parent: Option<String>` and `relations.depends_on: Vec<String>` (`task/mod.rs:119-180`); those four fields, raw, are this block's only sources. The section a task sits in and the state word `details.id` carries are derived facts owned elsewhere and are not re-rendered here.

**Correction 4 — all four fact leaves can be absent, and the draft bound no form for any of them.** `status` is `Option` because the split-index parents store none (`task/mod.rs:135-140`); `raised` is `Option` and legacy or authored documents legitimately omit it, which `0266.3` hardens only for *newly created* drafts (`0266` Correction 7); `parent` is `Option`; `depends_on` is a `Vec` that is routinely empty and routinely holds several keys. A named row the artifact enumerates may not be dropped, may not render blank, and may not resolve through `placeholders`. Goal 2 binds one fixed data-derived word per absence and binds `·` — the only separator in rule 3's closed set — as the multi-dependency join, with declaration order preserved and no dependency dropped, sorted or enriched.

**Correction 5 — `checked` with no declared checks does not close, and this column renders the check list two blocks above the sentence that would claim it does.** `close_disposition` returns `Proposal` for `AutoClosePolicy::Checked` whenever `checks.is_empty()`, before it looks at any result (`task_proposals.rs:449-455`); the same is true of `Confirm`. So a flat "closes when its declared checks pass" printed under an empty `checks` block is a contradiction the screen itself displays. Goal 4 binds that cell a sixth form of its own, beside the five `0265.15` already fixed. This is also why the served detail carries the declared checks rather than a rendered line list: the same answer decides both blocks.

**Correction 6 — `Closes automatically when run-ab12ef lands` is unsupported three separate ways.** `AutoClosePolicy` is the closed set `Confirm | Checked | Merge`, not a boolean (`task/mod.rs:64-79`), and the three behave differently — `confirm` never closes without the owner's key press, `checked` needs at least one declared check and every one passing, `merge` closes regardless of check outcomes; a successfully resolved `None` is a fourth, distinct state and a failed resolution is a fifth (`task_proposals.rs:425-496`). Automatic closing is invoked from exactly one place, the `ctx traits run --task` queue after a landed revision, and it returns `false` for a missing revision, no effective policy, a `Proposal` disposition, a read failure or a write failure (`task_queue.rs:71-108`); nothing on a run records that it came through that queue. And "which run claims the task" is not a run: `task_session_join` returns `task_key -> Vec<usize>` and `task_group` decides a precedence class (`dashboard.rs:5953-6002`), which is why `0266.4` requires the *center* to choose the claim and forbids the renderer to. **Ruling: the claim's identity leaves this line; only its served state governs tense.** `details.claimed` already renders the one centrally chosen claim, so restating that identity inside a consequence sentence would both duplicate it and convert it into a promise no code backs. The `landing` line states the configured close consequence *for the selected task*, in the "a run" wording `0265.15` already settled. No run id, trait or revision appears in it, and no claim is picked from a joined set: the no-claim, unique-claim and ambiguous-claim cases all render the same subject. What the claim's *state* — served by `0266.4`, never derived here — does change is tense, per Correction 7. `0265.15`'s shared root-taking resolution — effective policy, resolved absence and resolution failure kept apart, document override winning over `[tasks] auto-close` in either direction — is consumed as landed. HEAD's two CLI-private copies are the defect it removes: `resolve_task_close_policy` collapses every config error to `None` through `.ok()` (`task_proposals.rs:483-496`) and `tasks.rs:296-305` repeats the whole thing anchored at the process cwd. A third copy here is what parent Correction 12 forbids.

**Correction 7 — neither a closed task nor an ended run has a future consequence, and these are two different states.** `TaskStatus::Done` and `Cancelled` are stored, and `TaskDocument.closure: Option<Closure>` records `mode`, an optional `commit` and the check records of how the task actually closed (`task/mod.rs:106-116,183-186`). Printing "closes when a run lands" over a task that closed last week asserts a future that already resolved, so goal 4 gives the resolved outcome supersession over the policy form, exactly as `0265.15`'s terminal merge frame supersedes its merge intent. That supersession alone is not enough: a task stays open while the run claiming it is already landed or otherwise terminal — the queue returns `false` for a missing revision, a `Proposal` disposition, a read or a write failure and leaves the document untouched (`task_queue.rs:71-108`) — and `RunSummary` carries exactly that terminal fact (`run_summary.rs:54-72,169-194`), served through `0266.4`'s one chosen claim. "Closes when a run lands" printed beside a run that has already landed is the same false future in a second dress. So goal 4's matrix is total over the served claim state as well: a terminal claim takes a fixed non-future form, and that form asserts only that the task is still open — never that the task closed, which remains what stored status and `closure` alone decide. Active and pending claims are the ordinary case and leave the policy form untouched; an ambiguous join that yields no single chosen claim is not terminal, because the renderer may not pick one.

**Correction 8 — the draft's two checks proved nothing about this cut, and the landing line's size and prefix were left contested.** `just test` and the metadata/lockfile command show the workspace stayed green and gpui-free; neither observes a served fact, a check name, a policy outcome or a footer instant. `proof_center` is the existing process-boundary suite and is the declared home for the wire observations; the CLI `tasks` filter holds the non-GUI consumer green by name; both carry an `expect` guard so a filter that matches nothing cannot pass. Separately, rule 13 requires consequence lines to be `→`-prefixed **sans 12** while `tokens.md:62` and `reference/tasks.html:950-965` say 11.5 with no prefix — the same conflict `0265.15` settled at sans 12 with the `→`, raising the 11.5 appearances as an owner correction against the artifacts and never editing them. Settled the same way here, by reusing that primitive rather than re-deciding it.

## Grounded at HEAD 25930e781

Nothing this cut renders exists yet. `0266.1`-`0266.4`, `0266.2`, `0265.12`, `0265.15` and `0256.1` are all `ready`, not `Done`. Root `Cargo.toml:1-12` lists seven workspace members and excludes only `packages/cdk`; no manifest or lockfile names gpui; there is no desktop directory, no desktop recipe in `Justfile`, no desktop CI lane; `TaskStatus` cannot yet parse `draft` (`task/mod.rs:22-31,208-220`); and the center carries no task, board or detail arm (`center.rs:90-212,268-284`). Every desktop path, module, component, symbol, signature and protocol name below is therefore a guess to be replaced by discovery against what the prerequisites actually landed. The first act of this cell is to locate the desktop lane's documented non-interactive command and record it verbatim; if it is absent, the prerequisite chain has not landed — stop and report an unmet prerequisite rather than substituting `just test` for rendered-behaviour proof. It is deliberately not a `[[checks]]` entry, because a check must exist in the repository when the plan is written and this one does not.
