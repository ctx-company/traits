schema-version = "0.2"
key = "0107"
title = "defineTrait, use*, and the derived manifest"
status = "done"
raised = "2026-08-05"
content = """


Full-file functional traits: `export default function (ctx)` with `defineTrait` inside — one
shape for behavioral and procedural traits alike, the object-layer shell no longer required.

"""
scope = """
## Decisions

- **`defineTrait(slug, {…})`.** Exactly once per trait function, plain literal data only —
  name, version, summary, metadata, procedure description. Missing, duplicate, or computed
  identity is a build error; literalness is what keeps identity liftable by a trivial sandboxed
  evaluation for the supply-chain scan.
- **The `use*` gates.** Spread composition per 0102: the builder validates outcomes only —
  final-object shape, require/avoid contradictions, undefined/unknown list entries, overlapping
  keys across same-scope calls. Union never subtracts.
- **The derived manifest.** Resources, signals, and ports collected from actual use; a
  declared-but-never-referenced handle is a build error; provenance recorded package-level via
  the import graph and lockfile. Hand-written manifest lists cease to exist in functional
  traits.
- **Fragments are plain typed objects** (`Behavior`, `Intent` types exported from the CDK),
  module-level or inlined; no fragment constructors.

## Scope

The trait-function entry point; `defineTrait` and the three `use*` gates; manifest derivation
and its build errors; `ctx.input.*` resolution against declared input ports (unknowns error);
the return-statement-to-output-port mapping; lock pipeline recording the package-level
dependency edges.

"""
validation = """
## Watch

- A behavioral trait — a function registering no steps — must produce a valid, lockable
  canonical: it is the engineering-standards shape the launch depends on.
- The derived manifest must be verifiable against ground truth: diff it against one existing
  variant's hand-written `resource:`/`signal:`/`port:` lists before trusting derivation.

## Done when

A behavioral trait and a procedural trait both author as single default-export functions, build
and lock; their derived manifests exactly match what the hand-written lists would have said,
verified by the diff above; every gate rule fails loudly with an actionable message.
"""

[relations]
depends-on = ["0106"]
