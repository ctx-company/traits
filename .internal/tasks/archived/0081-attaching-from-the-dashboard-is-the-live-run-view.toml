schema-version = "0.1"
key = "0081"
title = "Attaching from the dashboard gives you the live run view, not a preview of it"
status = "done"
raised = "2026-08-04"
content = """


Enter on a live SESSIONS row should attach the terminal to that run and look
exactly like having started it with `--progress tui`. It does not. It shows a
verbose "current activity" rendering inside the dashboard's own layout, with
different hints, and with the clock and token counters standing still.

## Why it differs today

`attach_selected` (`dashboard.rs:3816`) sets `attached_session_id`, focuses
`PANE_SESSIONS_PROGRESS`, and follows a *session preview*. That preview is a
dashboard pane. It is not `run_view::RunPanel`, which is what
`--progress tui` builds, and which owns the pane tree, the key hints, the
elapsed clock and the token rows. Two renderers, so of course two views.

The reverse handoff already exists and is the shape to mirror: `d` in the live
run view hands presentation to the dashboard through `DashboardHandoff`
(`run_view.rs`). Enter is the same journey in the other direction.

## Decisions

- **Attach hands over to `RunPanel`.** Not a preview that approximates it, and
  not a second renderer kept in sync by hand — the same one, which is what
  P552's one-renderer contract already asks for. Anything that renders
  differently is a bug in this task rather than a difference to preserve.
- **The hints are the live view's hints**, because they are the live view.
  Ask, scroll, pane cycling: the same keys doing the same things.
- **The clock and token counters advance while attached.** This is the part
  that is not free — see below — and it is the difference between attaching to
  a run and looking at a snapshot of one.
- **Detaching returns to the dashboard and never touches the run.** Attaching
  is a presentation act. The run is driven by another process and neither
  attach nor detach may disturb it.

## Scope

`attach_selected`, the SESSIONS Enter path, and whatever surface currently
renders the attached preview; `RunPanel` construction from an
already-running session the attaching process does not drive; the return path
to the dashboard.

## Watch

- **This is the hard part: the attaching process is an OBSERVER.** In a
  `--progress tui` run the panel is fed by the drive loop in the same process.
  An attached dashboard has no drive loop, which is exactly why time does not
  progress and tokens read empty today. The panel has to be driven from the
  session ledger and the activity sidecar on the dashboard's own poll, and the
  elapsed clock has to tick from the session's start epoch rather than from a
  local timer that never started.
- **Two panes, two processes, one terminal state.** The driving process may
  itself be rendering a live pane. Attaching from a second process must not
  fight it for the terminal, and killing one must not restore the other's
  terminal modes.
- **Decide what an observer may DO, not just see.** The ask pane dispatches a
  guide seat and writes to the ledger. Two processes both accepting asks for
  one run is a conflict, not a feature. Either the observer's ask is refused
  with a reason, or it is routed through the driver — pick one deliberately
  rather than discovering it.
- A session that ends while attached must say so and fall back to the
  dashboard, not freeze on its last frame.

## Done when

Enter on a live row renders the same view as `ctx traits run --progress tui`,
with the same panes and the same hints; elapsed time and token counts advance
while attached; asking behaves in one deliberately chosen way rather than
silently doing nothing; detaching returns to SESSIONS with the run untouched;
and a run that finishes while attached is reported rather than frozen.
"""
