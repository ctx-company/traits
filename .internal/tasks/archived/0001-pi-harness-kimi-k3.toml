title = "Run Pi as a ctx harness, driving kimi-k3 (opencode-go / OpenRouter)"
status = "done"
content = """


## What is already true (verified in the tree, not assumed)

`pi` **is** a built-in harness. `modules/io/src/harness_config.rs` registers it as `kind: "pi"`, `bin: "pi"`, with:

| field | value | consequence |
| --- | --- | --- |
| `model_flag` | `--model` | model is selectable per seat |
| `reasoning_effort_flag` | `--thinking` | `reasoning-effort` maps to `--thinking`, not to a numeric tier |
| `system_prompt_flag` | `--append-system-prompt` | the role's standing instructions land as an append, not a replace |
| `session_flag` | `--session` | `session-mode = "persistent"` and correction-retry resume both work |
| `prompt_via` | `arg` | the frame prompt is a positional argument |
| `json_schema_flag` | **None** | **no schema enforcement** — see risk 1 |
| `dir_flag` | **None** | **no working-directory flag** — see risk 2 |

`pi` is **not installed on this machine** (`which pi` → not found). Nothing below has been executed.

## The three real risks, in order of how much they will hurt

**1. No `json_schema_flag`, so a resumed correction retry ships no schema.** `harness_argv` only emits the schema when the harness declares a flag (`drive.rs:3454`). On `pi` it is silently dropped, exactly as on `opencode`. The consequence is documented in `P540`: a resumed retry delivers *one correction sentence* into a session whose only copy of the output contract is conversation history. This is what killed run-7619031a on opencode (reviewer degraded from a complete verdict → truncated → missing fields → a scalar). **Assume it will happen on `pi` too.** Either land P540 first, or run `pi` with `session-mode = "per-frame"` so every frame is a cold start carrying the full contract.

**2. No `dir_flag`, so the worktree is not selectable by flag.** claude-code takes `--dir`; `pi` does not appear to. Every `--worktree` run depends on the spawn executing inside the generated worktree. Establish how `pi` chooses its working directory — process cwd is the likely answer, in which case confirm the spawner sets it — **before** the first worktree run, or the agent will silently edit the main checkout.

**3. Confinement does not exist for `pi`.** `modules/io/src/confinement.rs` ships renderers for claude-code, opencode and codex only. There is no `render_pi_payload`. So a `pi` seat runs with **no write confinement at all** — no deny list, no additional-directories carve-out. This is a known, recorded gap (`P480` charters the OS-level sandbox that would cover it). Until then, treat a `pi` seat as unconfined and do not give it the worker role on a run you care about.

## The model question — and this is where the ask has a wrong assumption

`kimi-k3` is available under three provider prefixes in the opencode catalog: `opencode/kimi-k3`, `opencode-go/kimi-k3`, `openrouter/moonshotai/kimi-k3`. **Those prefixes are opencode's provider namespace, not a universal model addressing scheme.** `pi` is a different binary with its own provider configuration; it will not understand `opencode-go/kimi-k3` unless `pi` itself is configured with an equivalent provider.

So the first question is not "which flag" but: **can `pi` reach kimi-k3 at all, and through whose credentials?**

- **OpenRouter is the likely yes.** It is a standard OpenAI-compatible endpoint (`https://openrouter.ai/api/v1`) with a plain API key, and most agent CLIs support a base-URL + key override. If `pi` does, `moonshotai/kimi-k3` via OpenRouter is the low-friction path.
- **The opencode-go subscription is the likely no.** That is opencode's own gateway, authenticated through opencode's login. Another binary cannot borrow it unless opencode exposes a proxy endpoint or an exportable token. **Check this before planning around it** — it is the difference between "test pi cheaply on the subscription you are already draining" and "pay OpenRouter per token."

## Steps

1. `npm i -g @pi-sh/pi` (or whatever the real install is — confirm from Pi's own docs, not from here). Verify `pi --help` and capture the actual flag surface; **compare it against the registry table above and fix `harness_config.rs` if it has drifted** — that table was written from our source, not from Pi's.
2. Establish provider config: does `pi` accept an OpenAI-compatible base URL + key? If yes, wire OpenRouter and confirm `pi --model moonshotai/kimi-k3` responds. Separately, ask whether opencode-go's gateway is reachable from outside opencode; if not, record that and move on.
3. Confirm working-directory behavior (risk 2) with a throwaway run in a scratch dir.
4. Add a seat: `[agent.role.<name>] harness = "pi"`, `model = <resolved id>`, `reasoning-effort` — note this becomes `--thinking`, so the valid values are Pi's, not `low|high|max`. `session-mode = "per-frame"` for the reason in risk 1.
5. Run one small phase end to end. Watch the debug trace at `~/.config/ctx/debug/<repo>/<run-id>/` for `stdout-truncated`, and check the frame actually produced typed slot output rather than prose.

## Explicitly not in scope

Making `pi` the default worker; write confinement for `pi` (that is P480); fixing the schema-on-resume gap (that is P540).
"""
