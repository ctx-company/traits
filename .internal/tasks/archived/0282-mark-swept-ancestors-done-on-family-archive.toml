title = "Mark swept ancestors done on family archive"
status = "done"
raised = "2026-09-07"
closed = "2026-09-07"
content = """
When the last child of a task family closes, `FilesTaskBoard::update` (modules/io/src/task_files.rs:541-720) invokes `sweep_closed_ancestors` (:743-780), which walks up the parent chain and archives every finished ancestor via `archive_in_place` (:786-811). `archive_in_place` re-reads the live file, parses it with `ctx_traits_core::task::parse`, and writes it into `archived/` without mutating any parsed field — so archived ancestors keep their stale stored `status` (`ready`, or unset) and never receive a `closed` date, while the direct-close path in `update()` (:665-672) stamps both. The gap is visible in the raw archived TOML and in every surface that renders stored status (`stored_status_text`, modules/cli/src/app/tasks.rs:576-583).

This task stamps `status = "done"` and `closed = today_date_utc()` onto every ancestor document the sweep archives, at the provider layer, so every write path (CLI, dashboard, auto-close) is corrected at once with no surface changes.

This plan separates GOALS from APPROACH. The goals are the "## Done when" items in validation — each states an observable outcome with explicit exclusions and carries a verbatim Source quote from the raising draft; they are binding. Everything under "## Approach" is the architect's suggested route — expected symbols, edit order, proof shape, and commands — and the run may deviate from any of it whenever a goal requires, reporting the deviation in its work summary rather than treating it as a violation.
"""
scope = """
## Decisions
- The fix lives at the provider layer, in the sweep's own write path in modules/io/src/task_files.rs; no CLI, dashboard, toolkit, or desktop change (desktop/ is a separate cargo workspace consuming summaries only).
- The stamp applies to EVERY ancestor archived in one sweep — the immediate parent and any grandparents the upward walk finishes in the same pass.
- The persisted ancestor status is always `done`, never `cancelled`, even when the all-closed family contains cancelled children: `graph::derived_status` (modules/core/src/task/graph.rs:171-180) already folds mixed done/cancelled descendants to `Done`. Changing derivation semantics is expressly out of scope.
- The sweep does NOT synthesize a `Closure` record — it has no check or merge provenance — and leaves an existing `closure` and every other field unchanged; the only mutated fields are `status` and `closed`.
- Out of scope: a reopen cascade for ancestors (reopening today clears `closed`/`closure` on the one document only); any change to `EffectKind` or the observable effect-record shapes; the create-closed-task path (task_files.rs:504-535), which initializes `closed = None` and is a separate concern.
- The rustdoc on `sweep_closed_ancestors` (:723-742) and `archive_in_place` (:783-785) states the old "content untouched" contract and misdescribes the error posture; both must be updated to match the new deliberate stamp and the preserved record-and-continue failure handling.

## Approach
Suggested route, not a boundary:
- Seam: inside `archive_in_place` (task_files.rs:786-811), after the existing `parse` of the live ancestor and before the existing `write_document` call, set `status = Some(TaskStatus::Done)` and `closed = Some(today_date_utc())` on the parsed document. Reuse `ctx_traits_core::task::parse`, `write_document`, and the crate-private `today_date_utc()` at modules/io/src/audit_journal.rs:139-150 (already used by direct close). Preserve the already-archived early `Ok(None)` no-op and the destination-write-then-source-remove order.
- Do NOT implement the stamp by recursively calling `update`: the direct archive operation intentionally avoids recursive effects, digest requirements, board-config re-evaluation, and additional sweeps.
- A private IO-local helper shared with the eligible direct-close branch is optional; if factored, keep the existing nuance that direct close of an already-archived document changes status without replacing a pre-existing or absent `closed` date, while a newly archived ancestor always gets today's date. No core API change — moving clock-dependent behavior into core has no evidenced caller.
- Proof: extend the family coverage next to `closing_the_last_child_archives_the_parent_too` (task_files.rs:1947-2001) with one tempdir fixture holding a grandparent, parent, and at least two children. Close one child as cancelled, then the last as done, so one `sweep_closed_ancestors` call archives both ancestors. Give the ancestors distinct initial states (e.g. parent `ready`, grandparent unset) so both stale forms provably become `done`; seed one ancestor with a valid non-empty `[closure]` and compare before/after so closure preservation is substantive. Read the archived documents back and assert placement, `status == Some(TaskStatus::Done)`, a `closed` date equal to `crate::audit_journal::today_date_utc()` (never a hard-coded calendar date), and other fields unchanged. Scratch fixtures only — no committed-board fixtures, no goldens.
- Update the two rustdoc blocks named in Decisions in the same change.
- Suggested commands: `CARGO_TARGET_DIR=target cargo test -p ctx-traits-io --lib` for the module, `just test-full` for the landing gate. If a gate flakes in this shared-cache worktree, isolate with `CARGO_TARGET_DIR=target` before trusting the failure.
"""
validation = """
## Watch
- `[effects] archive-on-close = false` must keep suppressing the whole ancestor sweep — movement and stamping alike; `a_parent_is_not_archived_while_archive_on_close_is_false` (task_files.rs:2003-2036) pins this and must stay green.
- Leaf semantics are separate and must remain intact: a leaf with stored `Done`/`Cancelled` returns it unconditionally before dependency blocking (graph.rs:181-199); `stored_closed_status_wins_over_open_dependency` and `one_open_task_does_not_cascade_through_a_closed_chain` protect the 2026-08-24 regression.
- Preserve the sweep's error posture exactly: per-ancestor failures become `ArchivePlacement`/`Failed` effect records carrying the parent key and error text, never a rollback of the already-applied child write; only the initial post-write reload failure propagates; the walk uses one snapshot and cycle-guards with a seen-set.
- Keep the effect vocabulary and observable record shapes stable: `EffectKind` stays the closed `ArchivePlacement`/`ReleaseDependents` pair, applied archive records keep carrying target paths, and consumers (tasks.rs:576-583, dashboard.rs:7929-7955) render the vector verbatim.
- `TaskDocument` serde is `deny_unknown_fields`; keep writing through `write_document` / `ctx_traits_core::task::serialize`. The preservation contract is parsed-field equality, not byte-for-byte source equality.

