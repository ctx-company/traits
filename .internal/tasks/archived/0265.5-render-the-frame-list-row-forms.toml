non-interactive command is discovered at execution time and must exit 0 (goal
12). No goal names that command, and no check declares it: it does not exist at
the HEAD this plan was written against (`0256.1:15`), and a board check must
already exist and run repo-root-relative in a clean detached worktree, so
writing one now would fabricate it. The obligation is unconditional even though
the command is unnameable — an absent lane at execution time is an unmet
dependency that prevents this task from passing, not a permission to accept
those outcomes on a diff read.

