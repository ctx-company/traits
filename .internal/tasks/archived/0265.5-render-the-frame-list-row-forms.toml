### Edit order

1. The shared frame-span derivation and its omission semantics, near the
   sidecar/detail boundary, with the CLI consumer moved onto it.
2. The compact-unit duration formatting, shared where a second consumer exists.
3. The row-state presentation: the state-to-(dot role, title tone, right-side
