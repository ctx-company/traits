## Watch

- **A missing elapsed time is the correct render.** The sidecar is derived
  evidence, not authority — writes are swallowed on failure and truncated
  trailing lines are tolerated (`activity_sidecar.rs:13-15`, `177-198`).
  Inferring a duration from `ledger.elapsed_seconds`, from row order, or from a
  render-time clock fabricates timing the system never observed.
- **A shared frame id is ambiguous evidence, not a longer span.** Loop and
  repeated executions share one durable activity id; first-to-last across them
  would include the gap between executions and lie. That guard already exists in
  `beat_duration` and must survive extraction.
- **The span is observed activity, not wall time.** `finish_frame` appends no
  terminal record (`drive.rs:595-611`). Render the evidence; do not claim more
  for it.
- **Failed must not collapse.** Painting a failed frame `ok` green is the exact
  lie rule 1 exists to prevent; hiding it as pending is worse.
- **Bright follows selection, not state.** A row that is bright because it is
  `Done` breaks rule 4 the moment two rows are done.
- **No literal values at a call site.** Every colour, size, weight, spacing and
  family comes from `0265.1`'s token entry point; a hex inside a primitive is
  the same defect as a hex inside a screen.
- **The glyph set is closed** — `↰ ↳ → · ∷` only. An icon, an emoji, or a
  checkmark standing in for a done state violates rules 2 and 3 at once. No
  corner radius inside the canvas; rule 4's 5px ellipse is the state marker, not
  row chrome.
- **Dots belong to stateful lists only.** The frame list qualifies; prose does
  not, and no later screen may inherit a dot into a prose region because this
  primitive made one easy.
- **No design example string is hardcoded.** `round 2` and `smart` illustrate
  one run. `verdict_rounds: None` is missing coverage, not round zero; an absent
  current role renders no trailing segment.
- **Compact rows must not each trigger a read.** The frame list belongs to the
  selected run's single reconstruction; per-row ledger, store or sidecar reads
  break the ledger-is-authoritative posture.
- **No poll loop**, and no blocking receive on gpui's UI thread. Row state
  changes arrive as center deltas.
- **Snapshot-then-delta ordering is the contract**: a rejected projection must
  leave no half-updated row and no orphaned current row.
- **No inline placeholder literal** for the current row's description.
- **Fail-loud, no direct-reader fallback**; stale rows are never presented as
  current, and a failed detail read is stated rather than filled from the
  filesystem.
- **The export is measurement, the rules are the specification.** Copy geometry
  from `reference/sessions.html:293-347`, `413-459`, `513-572`; take content and
  colour semantics from `grammar.md` and `screens/sessions.md`. Content
  Correction 1 is this cut's fifth conflict and is reported, not smoothed over.
- **Workspace gate cost must not move**: gpui must not enter root resolution,
