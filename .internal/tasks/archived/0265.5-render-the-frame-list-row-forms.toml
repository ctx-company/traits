desktop path, module name, symbol and signature named below is therefore a guess
to be replaced by reading what `0256.1`, `0265.1`, `0265.3` and `0257` actually
landed.

**No command in this repository executes a gpui render, so none is declared as a
board check.** There is no desktop lane at this HEAD — `0256.1:15` records the
same — and a check runs under `sh -c` in a clean detached worktree of the merged
sha, so a command written here on the expectation that a dependency creates it
later would read as evidence while being unrunnable. The four declared checks
are therefore the four commands that exist in this tree today.

**The desktop lane the dependency chain lands is nonetheless the binding gate
for rendered behaviour.** This task depends on `0265.3` → `0265.1`
(`0265.3:415`) → `0256.1`-`0256.5` (`0265.1:293`), and `0256.1` does not close
until "its documented independent build and test commands pass from a clean
checkout" (`0256.1` Done when), so by execution time that lane and its
documented non-interactive build-and-test command exist. Read the command out of
the landed lane's own documentation — manifest, README, justfile or CI lane —
extend that harness with this cut's cases, run it, and name it verbatim with its
outcome. Goal 12 and the Done-when clauses bind it: the rendered row forms, the
list-level brightness, the right-side composition, the atomic candidate commit
and the reopened-settled render are decided by focused coverage executed in that
lane. That this file cannot name the command without fabricating it, and cannot
declare it as a board check, is a naming limit — not a licence to accept runtime
outcomes unexecuted. If the lane is absent at execution time, the prerequisite
chain was not honoured: report an unmet dependency and do not pass the task. Do
not stand up a lane of the run's own, and do not read its absence as licence to
skip the closing read.

**Static review decides the structural half, and cannot decide the runtime
half.** The closing reads of `git diff main...HEAD`,
`git diff --name-only main...HEAD` and `git status --short` establish what a
running harness cannot see cheaply — duplicated projection or span logic,
