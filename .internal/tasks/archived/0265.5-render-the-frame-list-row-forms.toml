This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

`screens/sessions.md:19-31` specifies the frame list of the Sessions screen:
rows at gap 4, a **done** row (`ok` dot, step name sans 12.5 `text`, optional
right-side elapsed time mono 10.5 `text-muted` — `4s`, `3m 12s`), a **current**
row (`surface-raised` fill, `accent` dot, name `text-bright`, a second
description line sans `text-secondary` at width 430 / line height 16, and
`live · round R · <role>` mono 10.5 `accent` on the right), and **pending** rows
(`dot-idle` dot, name `text-muted`, no right side). The export agrees on the
geometry: frame-row padding `[6,12]` and current-row padding `[8,12]`, left gap
10, dot 5px, dot-wrap top offset 6, title/description gap 3, right column top
offset 2, list gap 4 (`reference/sessions.html:293-347`, `413-459`, `513-572`).

This is the cut where grammar rules 1, 2, 4 and 5 become code with a real
consumer: colour chosen from a named state rather than at the call site
(`grammar.md:6-22`), states rendered as words and never as pills, badges or
checkmarks (`grammar.md:24-29`), the 5px dot present because a frame list is one
of the four stateful lists rule 4 admits, the bright-title selection rule held at
the list level, and sans for the content half of every row against mono for the
machinery half (`grammar.md:39-56`). The closed glyph set `↰ ↳ → · ∷` and the
no-corner-radius-inside-the-canvas rule bind here too (`grammar.md:31-37`); the
5px ellipse is rule 4's state marker, not row chrome.

## Five corrections to the draft this plan replaces

**Correction 1 — the description size is a fifth artifact conflict, and it is
reported rather than smoothed over.** `screens/sessions.md:26-27` and
`reference/sessions.html:439-445` both fix the current row's description at sans
11.5; `tokens.md:67` says "Row descriptions inside list rows: sans 11
secondary". The parent recorded four conflicts and not this one. Ruling, under
parent Correction 1: `grammar.md` and `screens/sessions.md` are the
specification, so **11.5 governs** — and the type scale already names 11.5 for
"sub-descriptions" (`tokens.md:63`), so the value is taken from that step of
`0265.1`'s scale, not written as a literal. `tokens.md:67` reads as the generic
default for ordinary list-row descriptions; this leaf is the current frame's
intent line, which the screen sizes explicitly. The conflict is reported in the
work summary as an owner correction against the design artifacts. It is not
resolved by editing `tokens.md`.

**Correction 2 — a failed frame is a fourth row form, and the draft has no place
for it.** The shared reconstruction carries a real failure state:
`step_state` returns `Failed` for a `Rejected` sequence status and for the
exactly-current item when the run stopped without completing
(`modules/cli/src/app/run_view/planned.rs:708-741`), and `0257.2` binds that
"running, completed, failed, waiting, and nested frame states must remain
distinguishable" (`0257.2:13-17`). `screens/sessions.md` names only three forms.
Collapsing failed into done paints a failure `ok` green and breaks rule 1
outright; collapsing it into pending erases it. Ruling: this cut renders the
failed frame in the done row's geometry with rule 1's `danger` role and rule 2's
word, never a badge or a glyph, and never as one of the other three. That is the
smallest form the two authorities jointly force, and it too is reported as an
owner correction against `screens/sessions.md`.

**Correction 3 — "exactly one bright title" is not the invariant that holds.**
Rule 4 makes bright a property of *selection* — "selected row gets
`surface-raised` fill + `text-bright` title; unselected row titles are `text`;
only one bright title per list" (`grammar.md:45-47`) — while the specified done,
pending and failed forms are all unbright, and a settled reconstruction has no
current frame at all. The draft's "exactly one row carries a bright title" is
therefore unprovable for a finished run without changing one of the stated row
forms. Ruling: the binding invariant is **never more than one bright title in
the list, and exactly one whenever the list has a selection**; the live current
frame is the default selection while a run is live, and a settled or failed run
whose selection `0257` does not supply renders no bright title rather than
promoting an arbitrary row. The invariant is held at the list level, not by each
row's caller.

**Correction 4 — the elapsed span is an observed-activity span, and its
omission conditions are wider than "no records".** The draft says the sidecar
"stamps `at_epoch_ms` beside a `frame_id`". Only `ActivityRecord::Activity`
carries a frame id (inside its event) and `Narration` its own; `StepSummary`
carries a `key` and `SessionTitle` carries no frame identity at all
(`modules/io/src/activity_sidecar.rs:22-56`). The span is first-to-last
`Activity` timestamp for one *unambiguous* frame id. That guard is not optional:
durable activity ids are `frame.item_id` or, absent that, `frame.title`
(`modules/cli/src/app/drive.rs:3184-3196`, `3923-3967`), while a reconstructed
step key carries run index, structural path, iteration and role
(`planned.rs:244-283`, `576-597`), so repeated loop executions share one activity
id and a first-to-last span across them would silently include the time
*between* executions. The repository already has these exact semantics in
CLI-private `story::beat_duration`, which returns `None` when a second beat
shares the frame key and when `last > first` does not hold
(`modules/cli/src/app/story.rs:535-554`), proven by
`shared_frame_duration_is_omitted_but_unique_frame_duration_is_recorded`
(`story.rs:1213-1229`). Note also what the span is *not*: `ActivityRecorder`
emits `Dispatching` before harness execution but `finish_frame` appends no
terminal record (`drive.rs:595-611`), so this is a span of observed activity, not
guaranteed wall time from dispatch to acceptance. Render it; do not describe it
as more than it is.

**Correction 5 — `smart` is a role, not a seat name.** `Session.current_agent`
is an `AgentRole` whose `structural_seat` ordinal is explicitly `#[serde(skip)]`
(`modules/core/src/procedure/runtime/frames.rs:175-204`), and persisted
`Provenance.agent_assignments` carries `role`, `harness`, `transport`, `model`,
`seat_index` and `list_length` but no seat *name*
(`modules/core/src/procedure/session.rs:159-186`). A reconstructed session has
lost the ordinal the shared selector needs (`session.rs:205-230`), so picking an
assignment for a list-backed role would be a guess presented as evidence. Parent
Correction 2 requires one durable mapping to be chosen and named. Ruling: the
right-side trailing segment renders `Session.current_agent.role`, the same field
CLI `active_label` safely exposes (`run_view/session_text.rs:115-138`).

