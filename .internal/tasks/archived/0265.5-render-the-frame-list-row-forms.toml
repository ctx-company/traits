### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like a shared `frame_span(frame_key, records) -> Option<Duration>`
carrying the duplicate-key and non-increasing guards, living in IO beside
`activity_sidecar` or in core beside the story types; a compact
`human_elapsed_text`-shaped formatter lifted to shared code if and only if a
second consumer exists; a `frame_row(state, title, right, selected)` desktop
component and a `frame_list(rows, selection)` that owns the invariant of goal 3.
Names, module paths and signatures follow whatever conventions `0256`, `0257`
and `0265.1` established. Whether the center answers compact spans or bounded
raw records is the run's call — note only that the wire cap is 1 MiB
(`center.rs:48-52`) and sidecars are append-only and unbounded, so a compact
center-side projection of just the selected detail's spans is the safer shape.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- Each of the four forms renders its own dot role, title tone and right side.
- A rejected-status frame and a stopped-at-current frame both render failed, and
  neither reads as done or pending.
- Bright-title count is 1 for a live run with a selection, and never exceeds 1
  for a completed or failed run.
- A unique frame with a positive span renders a compact time; absent sidecar, no
  matching records, one record, equal timestamps, and a frame id shared across
  loop iterations each render no time, with the frame tree otherwise intact.
- A truncated trailing sidecar line does not discard the valid records before it.
- `Some(R)` renders the round segment, `None` renders none, and neither leaves a
  dangling `·`.
- The trailing segment renders the session's current role.
- The description resolves through the `placeholders` module entry.
- A settled run reconstructed twice renders identical rows and spans.
- A rejected projection leaves the previously accepted list intact with no
  orphaned current row; the `0256.2`-`0256.5` and `0257.3` tests pass unmodified.

### Reuse points

`story::beat_duration`'s first/last-with-duplicate-key-guard semantics
(`story.rs:535-554`) as the span derivation to extract, not to copy;
`ctx_traits_io::activity_sidecar::{read_activity, ActivityRecord}` for the
