semantics to match, not code to import: stage the whole snapshot, project the
complete candidate, commit only on success, clone accepted rows before applying a
delta, and retain the previous accepted map on rejection
(`modules/cli/src/app/dashboard/worker.rs:254-415`). Where the desktop needs
CLI-private semantics, extract into shared core/IO and land the CLI as the second
consumer; goal 1 is where the exclusion of CLI-private imports is stated.

### Reporting mechanics — suggestions

What must be reported is fixed by GOALS and Done when; this subsection only
suggests how. Quoting each executed command in a fenced block with its exit
status beside it reads better than prose. Naming the discovered desktop path
next to that lane's command helps the next cut declare it as a board check.
Stating the two owner corrections under their own heading — the 11.5-vs-11
description size, and the missing failed row form — keeps them from being read
as commentary. Deviations from this approach are reported in the work summary as
deviations; that is a report, not a violation and not an escalation.

### If something is red

Isolate with `CARGO_TARGET_DIR=target` before trusting a phantom "cannot find X";
a shared cross-worktree target dir flakes gates. Rust is pinned to 1.97.1 by
`rust-toolchain.toml` and the desktop directory inherits that pin unless
`0256.1` gave it its own toolchain file. Keep any repair scoped to the one red
command and preserve every invariant named under Excluded.

