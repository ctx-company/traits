## Dependency gate
Before any implementation edit, require the joined landed state of `0255.4`, `0255.6`, and `0255.7`, including every transitive dependency. The clean grounding baseline is HEAD `874c70f4`, where those plans are not implemented: `Agent` has intent but no behavior in `modules/core/src/trait/agent.rs:92-124`; `SequenceItem` has neither intent nor behavior in `modules/core/src/trait/procedure/model.rs:914-948`; `frame_guidance` is root-only and infallible in `modules/core/src/model_view/compile.rs:511-544`; `resolved_frame_prompt` resolves only root guidance in `modules/cli/src/app/frame_prompt.rs:463-489`; `resolve_declared_item` remains private to `modules/cli/src/app/preview.rs:216-262`; and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist. No files were edited and no checks were run during grounding.

Inspect the joined implementation before touching any allowlisted file. Confirm at minimum: `Agent.behavior`; `SequenceItem.intent` and `SequenceItem.behavior`; prompt-scoped behavior validation and static rendering; private `layered_additive_guidance`, `effective_behavior_axes`, and `format_behavior_axes`; fallible `frame_guidance(trait_ref, assigned_agent, ready_prompt)`; exact canonical `assigned_agent`; relocated `resolve_declared_item`; fallible `top_level_ready_prompt`; fields `ResolvedFramePrompt::{assigned_agent_behavior_participated,ready_prompt_intent_participated}`; shared `intent_block` and `behavior_block`; and the existing `modules/cli/tests/proof_agent_intent_dispatch.rs` containing exactly one test, `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Stop before implementation edits and report the first missing or materially different contract. Do not recreate a missing dependency inside this task.

## Outcome
Compose ordinary ready-frame behavior from root `Trait.behavior`, the exact assigned `Agent.behavior`, and only the exact canonical top-level ready prompt's `SequenceItem.behavior`, least to most specific. Static ready preview, session preview, ordinary live CLI dispatch, and live MCP dispatch must consume one effective `ResolvedFramePrompt.behavior_items` string from the common resolver. Advancing from one top-level prompt to the next must rebuild that string without stale, neighboring, unassigned-agent, or other-prompt guidance. Preserve all joined intent bytes and errors, absent/empty behavior compatibility, root-only MCP omission, and the separate `Agent.system` transport channels.

The additive axes are exactly `tone`, `method`, and `format`. Within each axis compare already-canonical `GuidanceItem.id` values directly. Remove root occurrences shadowed by either agent or prompt, remove agent occurrences shadowed by prompt, preserve source order among survivors, and render surviving root items followed by surviving agent items followed by every prompt item. Replacement identity is axis plus canonical ID, so the same ID on another axis is unrelated. Never normalize an ID again.

The scalar axes are exactly `verbosity`, `directness`, `scope-control`, `initiative`, and `uncertainty`. Select prompt over agent over root independently on each axis. Differing scalar values express precedence and are not contradictions. A prompt may supply behavior without root or agent behavior, and every omitted prompt axis retains the selected broader value.

Only the canonical item returned by dependency-owned `top_level_ready_prompt` may provide prompt intent or behavior. That selector accepts only an empty-path `SequenceFrameKind::Step`, resolves the structural declaration from `frame.sequence_index`, requires `SequenceKind::Prompt`, and returns that exact `SequenceItem`; it returns no prompt for asks, non-step frames, or any non-empty-path named/nested leaf. Resolve it once and reuse the same reference for intent and behavior. Do not add a behavior lookup, scan declarations, globally match optional item IDs, infer from prompt evidence or text, inspect neighboring items, or broaden selection to named/nested prompts.

A ready prompt participates in behavior exactly when its behavior has at least one item in `tone`, `method`, or `format`, or a present value in `verbosity`, `directness`, `scope_control`, `initiative`, or `uncertainty`. No selected prompt, `behavior: None`, and `behavior: Some(Behavior::default())` are non-participating. They must preserve the complete joined pre-`0255.8` behavior output byte-for-byte, including root-only behavior, effective root-agent behavior, MCP participation rules, and frames with no behavior.

## Touched files
The complete implementation allowlist is:

- `modules/core/src/model_view/compile.rs`
- `modules/cli/src/app/frame_prompt.rs`
- `modules/cli/tests/proof_agent_intent_dispatch.rs`

Create, remove, rename, generate, or edit no implementation file outside those paths. The task-file rewrite itself changes only `.internal/tasks/0255.8-dispatch-top-level-prompt-behavior.toml`; implementation must not edit another task.

## Symbol contract
In `modules/core/src/model_view/compile.rs`, change dependency-owned private helper to exact signature `fn effective_behavior_axes<'a>(root: Option<&'a crate::r#trait::Behavior>, assigned: Option<&'a crate::r#trait::Behavior>, ready_prompt: Option<&'a crate::r#trait::Behavior>) -> [(&'static str, Vec<&'a GuidanceItem>, bool); 8]`. It remains the sole effective behavior authority. Reuse the additive overlay operation already used by joined three-layer `effective_intent_groups`; do not add a prompt-specific resolver or renderer. For the three additive axes, apply root-agent-prompt shadowing by canonical ID and retain the required layer/source order. For the five scalar axes, use `ready_prompt.or(assigned).or(root)` independently. Return axes in unchanged `behavior_axes` order.

Keep dependency-owned private `layered_additive_guidance` and private `format_behavior_axes` as the one shared additive operation and one behavior renderer; neither is renamed, removed, duplicated, or made public. Reuse canonical IDs, unchanged `behavior_axes`, `format_guidance_group`, `format_guidance_item_element`, directive lookup, `behavior_builtin`, `sanitize_model_text`, and `leaf_element`. Rendering effective runtime behavior continues through `format_behavior_axes` with `GuidanceTag::GroupNamed`, field prefix `"behavior"`, and source `None`.

Edit the body, but not the joined exact signature, of `pub fn frame_guidance(trait_ref: &Trait, assigned_agent: Option<&crate::r#trait::Agent>, ready_prompt: Option<&crate::r#trait::procedure::SequenceItem>) -> crate::Result<Option<FrameGuidance>>`. Obtain prompt behavior only from `ready_prompt.and_then(|item| item.behavior.as_ref())`. When prompt behavior is populated, pass root, selected-agent, and ready-prompt behavior references to `effective_behavior_axes` once and render once through `format_behavior_axes`. When prompt behavior is absent or empty, preserve the dependency-owned root/agent behavior branch and its output exactly. Preserve joined intent resolution, source tracking, contradiction behavior, warning/normalization/finding handling, errors, and rendered bytes unchanged.

Add exactly these five new core test symbols in the existing `modules/core/src/model_view/compile.rs` test module: `fn frame_guidance_ready_prompt_behavior_merges_additive_axes_in_layer_order()`, `fn frame_guidance_ready_prompt_behavior_replaces_broader_items_at_prompt_layer()`, `fn frame_guidance_ready_prompt_behavior_applies_scalar_precedence_and_preserves_omitted_axes()`, `fn frame_guidance_ready_prompt_behavior_supports_prompt_only_behavior()`, and `fn frame_guidance_ready_prompt_behavior_is_byte_identical_when_prompt_is_absent_or_empty()`. Together they are the complete focused `frame_guidance_ready_prompt_behavior` surface; add no production helper for fixtures or assertions unless one already exists and can be reused.

In `modules/cli/src/app/frame_prompt.rs`, edit dependency-owned `pub(crate) struct ResolvedFramePrompt` only by adding exact field `pub(crate) ready_prompt_behavior_participated: bool`. Edit the body, but not the exact signature, of `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>`. Resolve `assigned_agent(loaded, frame)?` once and `top_level_ready_prompt(loaded, frame)?` once. Reuse those exact references for identity, joined intent flags, the two behavior participation flags, and one call to `ctx_traits_core::model_view::frame_guidance`. Derive `ready_prompt_behavior_participated` inline from the eight-axis populated rule; add no participation helper or second prompt selection.

Keep `pub(crate) fn frame_prompt(context: &ResolvedFramePrompt, schema: &Value, correction: Option<&str>) -> String` unchanged: it must continue inserting dependency-owned `behavior_block(&context.behavior_items)` whenever the one effective behavior string is non-empty. Edit the body, but not the exact signature, of `pub(crate) fn mcp_frame_prompt(session: &str, session_store: Option<&str>, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, context: &ResolvedFramePrompt, role: &str, harness_id: &str) -> String`. Insert that same `behavior_block` after any categorized `intent_block` and before `Resolved prompt instructions:` exactly when `context.behavior_items` is non-empty and either `context.assigned_agent_behavior_participated` or `context.ready_prompt_behavior_participated` is true. Root-only MCP behavior remains omitted. Preserve composer signatures, callers, and all other bytes.

In existing `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only exact test `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Add no second test, helper API, or capture framework. Reuse the dependency-owned scratch root, custom CLI and MCP capture harnesses, block extraction, system-channel checks, two-position top-level prompt fixture, and frozen compatibility oracles.

No symbol is removed. The only new production symbol is field `ResolvedFramePrompt::ready_prompt_behavior_participated`; the only new test symbols are the five exact `frame_guidance_ready_prompt_behavior_*` functions above. The edited symbols are private `effective_behavior_axes` with the exact generalized signature above, unchanged-signature `frame_guidance`, `resolved_frame_prompt`, and `mcp_frame_prompt`, and unchanged-signature integration test `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. Every other named symbol is reused unchanged.
