## Ordered work
1. Run the dependency gate first, before any implementation edit. Inspect the joined landed contracts from `0255.4`, `0255.6`, and `0255.7`, including transitive dependencies, in the exact minimum order listed in `content`. Confirm the proof file exists and contains one integration test. Stop at the first missing or materially different contract and report it; do not edit around the blocker.
2. Edit `modules/core/src/model_view/compile.rs` first. Generalize only `effective_behavior_axes` to optional root/agent/prompt layers, reuse the joined additive operation and renderer, extend only the behavior branch of unchanged-signature `frame_guidance`, and add exactly the five named `frame_guidance_ready_prompt_behavior_*` tests.
3. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_ready_prompt_behavior`. Require exit 0 and exactly five matching passing tests before proceeding.
4. Edit `modules/cli/src/app/frame_prompt.rs` second. Add only `ResolvedFramePrompt::ready_prompt_behavior_participated`; derive it from the already-selected prompt; pass the one selected agent and prompt to core once; preserve one `behavior_items`; and extend only the MCP behavior condition. Do not edit `frame_prompt`, selector logic, composer signatures, or callers.
5. Edit `modules/cli/tests/proof_agent_intent_dispatch.rs` third. Extend only `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` with ready-prompt behavior cases while reusing all joined fixture and capture machinery.
6. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`. Require exit 0 with exactly one integration test.
7. Run `CARGO_TARGET_DIR=target just test-full`. It performs frozen pnpm installation, generated SDK and builtin drift checks, TypeScript formatting/typechecking/tests, Rust formatting and Clippy, workspace binary builds, and all workspace tests (`Justfile:152-180`).
8. Run `git diff -- modules/core/src/model_view/compile.rs modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs` and perform a substantive review against every semantic, reuse, compatibility, ordering, participation, stale-state, system-channel, and exclusion requirement. Also inspect the worktree file list and stop if implementation changed anything outside the three-file allowlist.
9. A focused failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only allowlisted files and preserve core-before-CLI-before-proof edit order when dependencies require it. After each repair, rerun the affected focused command and every later command in the sequence. Complete only when both focused commands and the landing gate exit 0 and final review is clean; otherwise stop with the concrete dependency, test, or review blocker.

## Core proof
The five `modules/core/src/model_view/compile.rs::frame_guidance_ready_prompt_behavior_*` tests must respectively cover: all three additive axes in deterministic root-agent-prompt order; root and agent replacement by prompt at the prompt layer with exactly one occurrence and prompt-local rendered directive text; all five scalar axes with prompt-over-agent-over-root precedence and broader fallback for omitted prompt axes; prompt-only behavior with no root or assigned-agent behavior; and exact output equality with joined pre-`0255.8` behavior for no ready prompt, prompt `behavior: None`, and prompt `behavior: Some(Behavior::default())`. Use non-empty broader behavior in compatibility cases so drift is observable. Assert joined intent output remains byte-identical in every relevant comparison.

## Dispatch proof
Within the sole `modules/cli/tests/proof_agent_intent_dispatch.rs::assigned_agent_intent_dispatch_is_shared_and_legacy_compatible` test, use both successively ready top-level prompts. At each position capture static `internal preview --json`, real CLI dispatch, and real MCP dispatch; extract the complete behavior block and assert byte equality across all three paths. Assert root-agent-current-prompt additive order, prompt replacement count and prompt-local text, scalar precedence, omitted-axis broader retention, absence of unassigned-agent, neighboring-prompt, other-prompt, and stale-prior-prompt markers, and a changed effective block after advancement.

Add a prompt-only behavior case proving MCP receives categorized behavior when assigned-agent behavior does not participate. Preserve and extend the joined frozen absent-prompt and present-empty-prompt behavior oracles for ordinary and MCP output. Prove unique `Agent.system` text is absent from every behavior block and remains on the established CLI `harness_argv`/system-prompt channel and MCP `mcp_harness_argv` channel. Preserve every joined intent assertion and oracle.

## Reuse
`modules/core/src/model_view/compile.rs` remains the sole effective behavior and rendering authority. Reuse joined three-layer `effective_intent_groups` only as the established additive-overlay pattern; do not change intent. Reuse `layered_additive_guidance`, canonical `GuidanceItem.id`, `behavior_axes`, `format_behavior_axes`, `format_guidance_group`, `format_guidance_item_element`, directive lookup, `behavior_builtin`, `sanitize_model_text`, and `leaf_element`. Do not duplicate overlay, canonicalization, directive, sanitization, or rendering logic.

`modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` remains the common resolver already consumed by static preview, session preview, ordinary CLI dispatch, refreshed ordinary frames, and MCP dispatch. Reuse dependency-owned `assigned_agent` and `top_level_ready_prompt` once each, one core `frame_guidance` call, one `ResolvedFramePrompt.behavior_items`, shared `intent_block`, and shared `behavior_block`. Ordinary advancement already rebuilds `ResolvedFramePrompt`; add no readiness, frame, cache, transport, or persisted state.

Reuse only the existing proof test and its scratch root, custom harnesses, captures, block extraction, marker assertions, top-level sequence fixture, frozen byte oracles, and system-channel assertions. Do not create another integration test or support abstraction.

## Exclusions
Do not edit trait, schema, validation, CDK, generated authoring, or static declaration work owned by `0255.7`. Do not edit `modules/core/src/model_view/compile_sections.rs`, runtime readiness or transitions, `SequenceFrame`, `AgentRole`, `modules/cli/src/app/preview.rs`, `modules/cli/src/app/drive.rs`, transport selection, retry handling, persistent-session handling, shared-session refresh, harness argument construction, or any task sibling. Static declaration rendering and `Report::behavior_text` remain unchanged.

Do not add behavior fields to runtime frames or persisted wire data. Do not add a behavior-specific ready-item lookup, scan declarations, globally match optional IDs, use evidence/text, consult neighboring items, select asks or non-step frames, or include any non-empty-path named/nested leaf. Named sequences, branches, loops, for-each, parallel siblings, retries, and persistent/shared-session refresh belong to `0255.9` through `0255.15`.

Do not normalize canonical IDs again, compare prose, shadow across axes, reorder layers or items, treat scalar precedence as contradiction, discard broader scalar values when prompt axes are omitted, duplicate additive or rendering authorities, produce separate behavior strings per transport, change intent bytes or errors, emit root-only MCP behavior, or place `Agent.system` text in categorized behavior.
"""
