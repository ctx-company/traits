2. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch` exits 0 with exactly one `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` in `modules/cli/tests/proof_agent_intent_dispatch.rs`. It proves complete behavior-block byte equality among static preview, real CLI, and real MCP at both top-level positions; correct order/replacement/scalar fallback; stale-free advancement; unassigned, neighboring, and other-prompt exclusion; prompt-only MCP participation; frozen absent/empty compatibility; and `Agent.system` separation on both established channels.
3. `CARGO_TARGET_DIR=target just test-full` exits 0 after implementation changes only to `modules/core/src/model_view/compile.rs`, `modules/cli/src/app/frame_prompt.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`.
4. Substantive review of `git diff -- modules/core/src/model_view/compile.rs modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs` confirms the complete implementation diff stays within that three-file allowlist; all eight axes use direct canonical-ID comparison and one shared additive authority/renderer; there is one ready-prompt lookup, one core resolution, and one effective behavior string; prompt participation gates MCP after intent and before resolved instructions; top-level advancement is stale-free; absent/empty outputs are byte-compatible; unassigned and neighboring declarations are excluded; joined intent is unchanged; and `Agent.system` remains separate. This judgment criterion intentionally has no `[[checks]]` entry because the diff command presents evidence but cannot encode the substantive verdict in its exit status.

Run verification strictly in the four-step order above. Permit at most two targeted repair-and-rerun rounds; after each repair rerun the affected focused command and every later command. Mark complete only when both focused commands and `just test-full` pass and final review has no finding. Otherwise stop and report the concrete blocker.
