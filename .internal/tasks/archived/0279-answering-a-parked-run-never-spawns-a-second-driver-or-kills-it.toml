schema-version = "0.2"
key = "0279"
title = "Answering a parked run never spawns a second driver or kills it"
status = "ready"
raised = "2026-09-03"
content = """
Charter. This file carries the shared intent, the family-wide rulings, and
the umbrella stop condition. It lands no code of its own: every execution
plan lives in the children, each of which separates binding goals from
suggested approach in its own text. An implementation cut written against
this file instead of a child is the failure mode to avoid.

## The problem (owner-reported, Claude-verified 2026-09-03, run 7635b756)

The run parked at a summons Ask; the owner answered from the live run view;
the answer never reached the run. Observed chain: the queue driver stayed
alive holding the driver lock; the observer surface asked the center to
RESUME; the center spawned a second `internal drive` that was refused
`driver-lock-busy` with zero frames; the refused resume left the session
`interrupted`, which classifies a parked Ask terminal — permanently
unresumable, three rounds of work stranded. Separately observed, same
lifecycle: a park closes the live run view and the queue renders it as
"Failure". Note for the record: static HEAD `72a42faa3` does not reproduce
that exact chain (grounding shows no production observer-answer path and a
lock normally released at an Ask); the family's proofs pin the intended
contract forward instead of claiming a HEAD reproduction. Summons remain
switched off in the implement trait (commit `5a11b125e`) until this family
lands.

## Owner contract (binding)

A session has exactly one driver, running in the background, and it is the
only process that ever holds the lock or advances frames. Every surface —
dashboard, live run view, CLI `answer`, the driver's own TUI — is a
presentation and sender layer: it delivers a ruling to that driver and never
spawns a competing one. A park is that one driver waiting; an answer from
any surface wakes it. Cancelling an ask returns the session to resumable,
never terminal. A parked run stays live in the run view with the ask
surfaced, and is reported as parked, not failed.

## The children

1. `0279.1` — answer submission semantics move below the CLI: the
   CLI-private `AnswerSubmission`/`AnswerSubmissionOutcome` validation
   transaction relocates to a shared io boundary, behavior-preserving, so
   driver, routing, and surfaces consume one implementation.
2. `0279.2` — the parked driver keeps the lock and waits: at an Ask the
   driver durably records `AwaitingOwner`, publishes a live waiting row,
   retains the lock, and blocks on an answer mailbox fed by a new typed
   Answer command on the authenticated control socket; waiting burns no
   budget; interrupt yields today's durable unheld park.
3. `0279.3` — every surface delivers answers to the one driver: one
   io-level routing decision (held → verified socket relay; provably unheld
   parked → maintenance apply plus at most one replacement driver; held but
   unverifiable → fail closed), wired into CLI `answer` and the dashboard;
   `--no-resume` reconciled; the incident regression proof.
4. `0279.4` — a cancelled ask stays resumable and re-askable: the shared
   derivation stops classifying an unheld interrupted parked Ask terminal
   (pinned test inverted), rejected answers cannot strip the Ask's durable
   evidence, resume re-fires the ask. Independently landable.
5. `0279.5` — a park presents as parked everywhere: the driver TUI answers
   in place, an observer stays open and can answer, the queue and
   single-run output report a typed Ask-park instead of Failure, the
   dashboard shows awaiting-owner without hiding liveness.

Positional order is the suggested execution order; `0279.4` carries no
dependency on the others and may land at any point.

## Family-wide rulings (grounded)

- **One driver, end to end — this replaces `0253.4`'s "never idles" rule.**
  Parking no longer ends the drive process: the driver records durable
  `AwaitingOwner` evidence first, then waits while holding the lock. The
  durable unheld park remains the contract for process death, interrupt,
  and pause — the waiting driver is added on top of durable parking, never
  instead of it. An unanswered summons still survives `kill -9`.
- **Answer routing is an authority decision, decided by the lock.** Held:
  relay the state-digest-bound answer to that exact verified holder; no
  maintenance ownership, no external ledger write, no `start_session`.
  Provably unheld with a durable parked Ask: maintenance apply persists
  only the current Ask's answer and executes no following frame, then at
  most one replacement driver via the existing resume path — a first
  driver, never a second — performs all continuation under the driver
  lock. Held but unverifiable: fail closed. No answer
  path may ever produce `driver-lock-busy`; that status stays valid only
  for an explicit competing drive, which still performs zero frames and no
  ledger write.
- **Single writer.** No listener/background thread performs whole-ledger
  writes; answer application happens on the drive thread via the
  established handoff pattern (`PendingSessionTitle` precedent).
- **Owner wait is free.** Waiting for a human charges no frame or wall
  budget (completed `0253.7`; `attach_wait_paused` accounting principle).
- **Failure leaves the question standing.** Rejected submissions, stale
  digests, transport failures, Esc, and modal close all leave the Ask live
  with `is_live_summons` intact; cancellation or interruption of a parked
  Ask derives resumable, never terminal. Accepted answers are ordinary slot
  evidence with human caller provenance and no agent/harness attribution.
- **`--no-resume` is reconciled, not ignored.** Unheld applies the answer
  without starting a driver and leaves following frames unadvanced; held
  fails closed with a typed refusal, because an answer delivered to a live
  driver necessarily lets it advance.
- **Ask park is not merge park.** `TaskQueueOutcome::Parked` (merge) stays
  fail-toned; disk-full is the typed non-failure park precedent the Ask
  park follows; presentation keeps liveness honest — a held row never
  presents as unheld.
- **The center stays a disposable relay.** Correctness lives in the held
  driver and the ledger; center deltas corroborate, never decide. No center
  wire-protocol Answer request in this family — the `0259` family builds
  its center-served submission path on the io boundary `0279.1`/`0279.3`
  create — and no native or desktop notification UI. Any touch of a type
  shared with the desktop requires running `just desktop-test` and
  `just desktop-lint` in-run, since no workspace gate covers desktop.
- **Out of the whole family.** Trait authoring surfaces, the Ask schema,
  signal interpolation, choice-schema expansion, and the annotate gate's
  stdin path (already in-driver and correct).

## Umbrella stop condition

The family is done when all five children are done and the contract holds
together on one build: a queue-driven session parks with its driver alive
and holding the lock; an answer from an observer surface reaches that same
driver, which consumes it and continues — exactly one driver ever exists;
cancelling or interrupting the parked Ask leaves the session resumable and
the ask re-fires on resume; the live view stays open through the park with
the ask answerable; queue, single-run output, and dashboard all say
parked/awaiting-owner, never failure; and the full landing gate
(`just test-full`) is green. The closing review after the last child
verifies the cross-child seams — the socket mailbox versus surface routing,
the derivation inversion versus presentation, `--no-resume` semantics
across surfaces, and the re-enabling decision for the implement trait's
summons switch (an owner call, not a child deliverable) — rather than
re-reviewing each child.

## Acceptance shape

Behavioral proofs at the state/suite level plus detached-process proofs on
scratch fixtures — no frozen-inventory or behavior-freezing tests. Each
child carries its own checks; the charter's checks verify the family's
joined suites and gates.
"""
