condition.

Out of scope for the whole family: the annotate gate's stdin path, trait
authoring surfaces and the ask schema, a center wire-protocol Answer
request, and native/desktop notification UI (the `0259` family's arc).
"""
validation = """
## Done when

1. All five children are status done.
2. The incident shape passes as a regression: parked queue-driven session
   with its lock held + answer from an observer surface → one driver, the
   answer consumed by that driver as ordinary slot evidence, the run
   continues (`0279.3`'s proof).
3. A cancelled or interrupted parked ask stays resumable and re-fires on
   resume (`0279.4`'s proofs).
4. A park keeps the live view open with the ask answerable, and queue,
   single-run, and dashboard report parked/awaiting-owner, not failure
   (`0279.2`/`0279.5`'s proofs).
5. `just test-full` is green on the family's final state, and desktop
   commands were run and reported wherever shared types were touched.
"""

