This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

Grammar rule 10 gives every v1 screen a 260-wide rail on its left, and Sessions
is where it lands because Sessions is the first screen: padding [18,0]; a
`Spaces` heading in mono 11 `text-muted` at pad [0,18,12,18]; repository rows
(5px dot + name sans 13, active row taking a raised fill with a bright dot and
name) in a container at pad [0,10] gap 3, each row pad [8,10]; a flex spacer;
then the two-line footer at pad [14,18,0,18] gap 6 — the owner's handle in mono
10.5 `text-secondary` over `<repo> · local` in mono 10.5 `text-session` /
`text-faint` / `text-faint`. Nothing else in v1. Rule 10 permits centred 32×1
`border-strong` dividers to separate future rail sections and to precede the
footer; this cut takes the footer one and only that one, matching the export
(`.internal/docs/design/grammar.md:93-102`, `tokens.md:71-85`, export geometry
at `reference/sessions.html:91-249`, footer divider at `:207-215`).

Repository identity comes from the center row, never from the desktop process's
cwd. `repo_key` is `<basename-slug>-<first-8-sha256-of-canonical-path>`
(`modules/io/src/state.rs:149-160`) and `current_repo_key()` prefixes an ad-hoc
directory with `adhoc-` (`state.rs:304-317`), so recomputing identity from the
desktop's own directory — or by calling `repo_key(repo_path)` on a row — can
name a repository the center does not know by that name. `CenterPublicRow`
already carries every fact this rail is allowed to use: `summary`, `repo_key`,
`repo_path`, `ledger_path`, `live`, `modified_epoch_secs`
(`modules/io/src/center.rs:3778-3788`). No center protocol addition is needed
to identify repositories, and none is sanctioned here.

The footer's owner handle — `Oskar Cieslik`, the value rule 10 itself sets
(`grammar.md:98`) — is not something the center serves today, so it
renders from the one shared `placeholders` module under the placeholder
doctrine rather than as an inline literal or an invented read. The parent
charter assigns that module's creation to `0265.3` and names the owner handle
as one of the entries a later cut adds when it consumes it (`0265:74-80`).

## Five corrections to the draft this plan replaces

**Correction 1 — the rail's reuse points did not exist through its own edge.**
The draft said the rail composes "the token constants and the row vocabulary
the frame list established" and places the owner handle in "the one shared
module", while declaring `depends-on = ["0265.1"]` alone. The `placeholders`
module is created by `0265.3` (`0265.3` goal 6; `0265:74-80`), and the frame
list's dot/selection vocabulary belongs to `0265.5` (`0265.5:267-284`). A
charter's `depends-on` is not inherited by its children and `derived_status`
evaluates `depends-on` only for open leaves
(`modules/core/src/task/graph.rs:129-172`), so neither reuse point reaches this
task through `0265` or through `0265.1`. The `0265.3` edge is added — see the
relations correction. The `0265.5` edge is *not*: `0265.5` depends on `0265.3`
and `0257`, and the parent's item sequence places this cut before it
(`0265:74-80`), so adding that edge would invert the sequence. Correction 2 is
how the row vocabulary is resolved instead.

**Correction 2 — the dot and selection primitive has exactly one owner,
whichever cut runs first.** This cut and `0265.5` are unordered relative to each
other: both depend on `0265.3`, neither depends on the other. The resolution
that duplicates nothing, in either order: if `0265.5`'s list primitive and its
5px dot have already landed, the rail composes them; if they have not, this cut
establishes exactly the 5px ellipse and the one-bright-per-list selection
treatment the rail's own list renders, placed beside `0265.3`'s state
presentation where `0265.5` extends it with the frame-list state colouring, row
voices and elapsed-time forms rather than creating a second dot or a second
selection rule. Either way exactly one dot primitive and one selection
invariant exist in the tree when both have landed. Which case was found is
reported in the work summary.

**Correction 3 — the export's rail rows drift from rules 4 and 10, and the
rules win.** Parent Correction 1 already resolves the export's per-repository
`Count` against rule 10's "Nothing else in v1" (`0265:23-30`;
`reference/sessions.html:129-160`). Two further measured conflicts in the same
region resolve the same way. Rule 4 fixes unselected row titles as `text`
(`grammar.md:44-47`), while the export paints every unselected repository name
`text-secondary #8b909c` (`reference/sessions.html:151-160,178-186,196-200`) —
`text` governs. Rule 4 also fixes the dot palette by state (`ok`, `accent`,
`dot-idle`, `dot-dim`, `warn`), and `text-bright` is not in it, yet the export
gives its *second*, non-active row a `#eceef2` dot
(`reference/sessions.html:145-150`) that no rule explains. Both are reported in
the work summary as owner corrections against the source design, never edited
into `.internal/docs/design/**`.

**Correction 4 — the row-dot rule is stated, not reverse-engineered from the
example.** The draft named the dot without saying what colours it. Neither rule
10 nor `screens/sessions.md` defines an aggregate repository status, so the
rule is decided here from the rules plus the only status evidence the row
carries, and named: the active row's dot is `text-bright` because rule 10 says
so for the rail specifically; a non-active repository with at least one live
accepted row takes `accent`, because rule 1 assigns accent to what is happening
right now and rule 4 assigns it to current/live, and `CenterPublicRow.live` is
the authoritative liveness the row already carries; every other row takes
`dot-idle`, rule 4's pending/ready tone. That is one boolean fold over rows
already grouped for deduplication — not a count, not a status rollup, and not
an inference from the export's colours. The absence of a normative aggregate
repository status is reported as an owner correction.

**Correction 5 — an empty `repo_path` is a real case with a stated fallback.**
Direct unindexed-store discovery produces a valid row with a directory key and
an *empty* path (`modules/io/src/center.rs:6326-6341`); indexed rows take the
path from the checkout index and retain the previously verified path when
metadata is unavailable (`center.rs:2111-2134`, tests `7277-7321`). No shared
helper produces the design's `owner/repo` display identity from those fields
today, and a basename-only projection cannot produce that form. The friendly
name is therefore a pure, total projection of `repo_key`/`repo_path` alone with
an explicit boundary for empty and shallow paths — never a filesystem probe,
never the cwd, and never the example string `ctx-company/traits` typed in as
data.

