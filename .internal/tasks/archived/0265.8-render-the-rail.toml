  temptation, not a v1 element, and the export's per-repository count is export
  drift the parent already resolved. Rule 10 permits dividers *between
  sections*; goal 1 takes only the footer one, because there is no second
  section to separate.
- **The export is measurement, the rules are the specification.** Copy geometry
  from `reference/sessions.html:91-249`; take content and colour semantics from
  `grammar.md` and `screens/sessions.md`. Unselected names take `text`, not the
  export's `text-secondary`, and the export's bright dot on a non-active row
  explains nothing — both are reported, not implemented.
- **The dot rule is stated evidence, not an inference from the picture.** Rule
  10 fixes the active row bright; `CenterPublicRow.live` is the only status
  evidence the row carries, so live is accent and everything else is
  `dot-idle`. A richer rollup would be invented structure.
- **An empty `repo_path` is a real row, not an error.** It renders the declared
  key fallback and must never trigger a reader, a probe or a cwd fallback.
- **No poll loop.** The rail refreshes from the accepted deltas, never from a
  timer, and a rejected projection must not leave a partially committed rail.
- **Fail-loud, no direct-reader fallback.** A GUI that silently re-reads the
  filesystem when a center request fails breaks the family's posture;
  center-absent is spawn-on-need or a visibly stale view, never a hard error,
  and stale data is never presented as current.
- **The footer cannot disagree with the rail.** Both read one active identity
  and one name projection; two projections is how they drift.
- **No inline literal for the owner handle** — `Oskar Cieslik` is one new entry
  in the one shared `placeholders` module, not a string in the rail's code, and
  not a new center capability.
- **No corner radius inside the canvas**; the active row is a raised fill, not
  a rounded pill or a border. Radius 10 exists only on the window frame.
- **No second dot or selection primitive.** Correction 2 fixes the boundary
  with `0265.5` from this side; `0265.5:267-284` fixes it from the other.
- **Hash-map order is not an ordering contract.** The TUI reducer's
  `rows.values()` projection (`worker.rs:569-589`) is insertion-dependent; the
  rail needs its own deterministic total order over center data.
- **Workspace gate cost must not move**: gpui must not enter root resolution,
  the root `Cargo.lock`, `just test`, `just test-full`, or the existing CI
  lanes. Isolate builds with `CARGO_TARGET_DIR=target` if a failure looks like
  a phantom "cannot find X".
- **The declared checks are workspace-side invariants, not proof of this task's
  desktop behaviour.** They show the workspace stayed gpui-free and green; the
  rendered rail and its delta-driven refresh are verified in the desktop lane
  `0256.1` establishes, whose exact non-interactive command becomes declarable
  as a check on this task once `0256.1` lands.

