edit that caused it. Then run the criterion commands 1, 2, 3, 4, 5, 6, 7 in
that order. Permit at most two targeted repair-and-rerun rounds in total;
after each repair, rerun the failing command and every later one. Complete
only when all seven criterion commands exit 0.
