origin = "run run-67b855d315d81e2a7c2a587ab7303656f6533e0885066544924190d4a9405755 merged as e7881711763b99df7ac0198e969a69bdc56999bf"
content = """
Ctrl-C during a live run still leaves garbage on screen. Observed on a real
run (2026-08-26): the "run killed; terminal restored" note glued onto the
end of the live view's title row, and the queue-runner's blocked panel then
printed over the stale frame without clearing it, producing interleaved
remnants like `Failureribe→opencode` (the panel's short bottom-border line
over a longer stale seat-mapping row) and `task queue:/6`.

Why 0252.2 did not cover this: in raw mode Ctrl-C never becomes a SIGINT —
it is a keystroke handled by `poll_detach` (`tui_ratatui.rs:906-913`), which
kills the child, calls `leave()`, and prints the note. `restore_terminal`'s
`PaneScreen::Inline` arm (`tui_ratatui.rs:216-220`) only ends decode capture
and shows the cursor; it never clears the inline viewport or moves the cursor
to a fresh line, so every subsequent cooked print lands on top of the last
drawn frame. The 0252.2 rescue panel (which begins with a full home+clear
escape) lives on the signal path and is additionally gated to
`PaneScreen::Inline` via `rescue_generation()` (`tui_ratatui.rs:882-884`) and
`signal_safe_inline_generation()` (`tui_ratatui.rs:71-77`), so it never fires
here.

## Owner ruling (2026-08-26)

The live-run view does not need to be inline. Scrollback of the live view
after the run is not required. Move the live-run pane to the alternate
screen, where `LeaveAlternateScreen` restores the shell exactly by
construction and this entire class of teardown-hygiene bugs disappears.
"""
scope = '''
## Decisions

1. **One run/live constructor, always Alt.** `RatatuiPane::new_inline()` is
   replaced by `new_run_pane()`, which is
   `new_with_options(PaneScreen::Alt, CtrlCPolicy::RequestStop)` — same
   ctrl-c policy, no screen negotiation. Its three production callers
   (`run_view::RunPanel::new`, `run_startup_view::StartupView::new`,
   `dashboard::run_attached_observer`) are exactly the run presentation
   surfaces, so live runs, the startup-to-live handoff, and attached
   observers move together through one seam rather than three copies of a
   mode choice. Startup comes along mechanically, which the task's Out of
   scope explicitly permits: `create_run_panel` (`drive.rs:4854-4861`) hands
   the SAME pane into `RunPanel::new_with_pane` with no terminal
   reconstruction, so an Inline startup could not become an Alt run without
   inventing a teardown/rebuild transition.
2. **Teardown reuses the existing Alt restore, unchanged.** `close_pane_locked`
   (`run_view.rs:1031-1038`) keeps calling `commit_inline_scrollback` then
   `quit`; both inline operations are already no-ops for an Alt pane
   (`tui_ratatui.rs:1096-1099`, `:1058-1061`), so the shared close path
   becomes "discard the frame, leave the alternate screen" with no second
   teardown implementation and no change to `q`, `d`, completion, or early
   error ordering.
3. **P551 key semantics stay exactly as they are.** Raw Ctrl-C is still an
   instant `request_kill` + detach + note in `poll_detach`; `q` still opens
   the confirm modal; `d` still closes the pane before publishing the
   dashboard handoff. Only the screen changes. This task does NOT absorb
   0252.4's proposed three-choice failure modal; that sibling re-grounds
   after this lands.
4. **The signal rescue panel loses its screen gate, keeps its generation
   gate.** Stale-panel safety is generation equality (`leave` returns
   `ACTIVE_GENERATION` to 0; a rebuilt pane gets a fresh generation), not
   screen mode, so `rescue_generation()` becomes "not detached" and
   `signal_safe_inline_generation()` becomes `signal_safe_rescue_generation()`
   returning the active generation regardless of screen.
   `signal_safe_pane_active()` — the headless guard that keeps escapes off a
   piped stderr — is NOT touched and NOT widened.
5. **The armed rescue bytes drop their clear prefix.** `CLEAR_VIEWPORT_ESCAPE`
   (`ESC[H ESC[2J`) erased the inline live frame; emitted after
   `FULL_RESTORE_ESCAPE` has already left the alternate screen it would erase
   the user's restored shell, which is the opposite of this task's ruling. The
   panel serialization (`render_lines_ansi` + CR/LF conversion), the 4096-byte
   cap, the writer lock, and the async-signal-safe read path all stay
   byte-identical.
6. **Alt panes consume resize events.** `apply_resize` returns early for Alt
   today (`tui_ratatui.rs:798-800`), and `StartupView::service_input`
   (`run_startup_view.rs:170`) redraws only when it returns `true`. An Alt arm
   that consumes `pump.resize_size` and reports a changed size keeps
   `startup_pty_redraws_after_resize_while_configuration_is_delayed` honest;
   no terminal reconstruction is needed, because ratatui's own `autoresize`
   re-anchors and clears a fullscreen buffer on the next draw. The inline
   throttle/reconstruct branch is untouched.
7. **Decode-warning capture becomes a pane-lifetime property, drained after
   restore.** Capture is armed today only for Inline
   (`tui_ratatui.rs:616-620`) and drained by `commit_inline_scrollback`. On
   Alt, raw stderr writes disturb the ratatui screen just as badly — the
   dashboard already proves the invariant with its own
   `DecodeWarningCapture` (`dashboard.rs:2766-2781`). So: arm for every
   screen at construction, and drain-and-print at the points that already own
   teardown (`close_pane_locked` for a live run, `StartupView`'s interrupt and
   failure paths), always AFTER the terminal is restored. The print loop is
   extracted once into `decode_diagnostics::flush_capture` and reused by the
   dashboard guard instead of being written a third time.
8. **Observer teardown no longer disarms the dashboard's capture.** With Alt
   restore never ending capture and `close_pane_locked` skipping the flush for
   an observer panel, the dashboard's lifetime capture stays continuously
   armed across an attach, so its re-arm workaround (`dashboard.rs:2815-2817`)
   is deleted rather than kept as a comment that no longer describes reality.
9. **The panic hook keeps its existing mode-correct behavior** (restore Alt
   without clearing; restore Inline with a clear) and gains one defensive
   `end_capture()` discard so a panic mid-run can never leave capture armed
   for the rest of the process — the Alt equivalent of the guard
   `restore_terminal`'s Inline arm already has.

