validation = '''
## Done when

1. Live-run teardown is clean on every exit path the pane owns: SIGTERM and
   the third SIGINT leave exactly the four-line interrupted panel on a
   restored, uncleared shell; a panic restores the alternate screen and leaves
   no frame row; a dashboard attach/`q` leaves no run frame; a clean
   completion discards the live frame and prints the ordinary success panel
   after restore; and raw Ctrl-C prints `run killed; terminal restored` as its
   own line after the alternate screen is left, with no live-frame fragment
   after it — the reported defect, now covered.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown`
2. The startup pane comes up on the alternate screen with no cursor query at
   all, still redraws on resize while configuration is delayed, still refuses
   to project untrusted trait details, still narrates in line mode when the
   environment is ineligible, hands off into the live run, and on
   failure/Ctrl-C restores the terminal and reports cooked with no surviving
   startup row.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_startup_progress`
3. A task queue still brings up one live pane per member — counted by
   enter-alternate-screen escapes now that no construction issues `ESC[6n` —
   with no status-progress fallback, both members reported after the final
   restore, and a cooked terminal at exit.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_task_queue_pane_handoff`
4. Pane state, the restore/rescue constants' lockstep invariant, the pump
   handoff guards, and the rescue-panel arming rules (no clear prefix, panel
   bytes verbatim, generation published, oversized refused) all hold.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib`
5. Queue refusal teardown and headless/piped output are unchanged: an
   ineligible or piped run still emits no terminal escapes and the cooked
   outcome reporting is byte-identical.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_task_queue_refusal_teardown --test proof_output_style`
6. The landing gate is green.
   `CARGO_TARGET_DIR=target just test-full`
7. The diff touches only the files Step 1-8 name. The verdict is in the exit
   code, not in the eye:
   `test -z "$(git status --short | cut -c4- | rg -v '^(\.internal/tasks/0252\.7-live-run-moves-to-the-alternate-screen\.toml|modules/io/src/decode_diagnostics\.rs|modules/cli/src/app/(tui_ratatui|interrupt|run_view|run_startup_view|dashboard)\.rs|modules/cli/tests/support/src/lib\.rs|modules/cli/tests/proof_(run_view_exit_teardown|run_startup_progress|task_queue_pane_handoff|task_queue_refusal_teardown)\.rs)$')"`

Criteria 1-4 and 6 each carry a `[[checks]]` entry. Criterion 5 does not: its
two suites also run inside `just test-full`, and a sixth entry would spend a
check slot on a subset of criterion 6. Criterion 7 deliberately carries no
entry either — checks execute in a clean detached worktree of the merged sha,
where `git status --short` is empty by construction, so the entry could never
fail; it stays an implementer-run command in the working tree, where it can.

## How to run this

Run Step 0's reread, then Steps 1-8 in order, running each step's declared
build command (`cargo build -p ctx-traits-io` after Step 1,
`cargo build -p ctx-traits-cli` after Steps 2, 3, and 4) rather than building
