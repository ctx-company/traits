schema-version = "0.2"
key = "0002"
title = "Add Codex as a real ctx harness, at parity with claude-code/opencode"
status = "done"
content = """


## The finding that reframes this task

**Codex is not a harness in this product.** `rg '"codex"' modules/io/src/harness_config.rs` returns **nothing** — the built-in registry contains exactly three: `claude-code`, `opencode`, `pi`. You cannot write `harness = "codex"` in a seat today and have it resolve to a built-in.

But **half the work already exists**, which is why this looks landed and is not:

- `modules/io/src/confinement.rs` ships `render_codex_payload` (`:535`), and its own module doc says *"Three renderers (claude-code, opencode, codex)."*
- `modules/cli/src/app/agent_dispatch.rs:307` builds a codex confinement payload: `{"sandbox": "workspace-write", "add-directory": ["/tmp/worktree"]}`.
- `P501` ("codex hook + pi extension") landed — but that is the **context-injection hook** (Group 120's activation delivery), not a harness definition. Different mechanism, same word.

So: the sandbox dialect is written, the spawn definition is missing. That is the whole task, and it is smaller than it first appears.

`codex` is **not installed on this machine** (`which codex` → not found). Nothing below has been run.

## Two routes, and route B is probably right for a first test

**A. Built-in.** Add a `HarnessDefinition` to `built_in_harness_definitions()` alongside the other three. Ships to every user, gets the confinement renderer wired properly, is the real answer.

**B. User-defined, first.** `HarnessDefinition` deserializes with `kind` defaulting to custom (`harness_config.rs:41-43`) and the config layer chain already reads `.ctx/harness.toml` (`:2535-2537`). So codex can be declared **in config, with no Rust change**, and tested before committing a built-in row. Do this first; promote to built-in once the flags are proven.

## What has to be established from Codex's own `--help`, not guessed

Fill this table by running the binary. Every field maps to a real consequence:

| registry field | why it matters | consequence if absent |
| --- | --- | --- |
| `bin`, base `argv` | non-interactive/exec invocation | — |
| `prompt_via` (`arg` or `stdin`) | how the frame prompt is delivered | wrong choice = empty prompt |
| `model_flag` | per-seat model | seat's `model` silently ignored |
| `reasoning_effort_flag` | maps `reasoning-effort` | value passed to a flag that does not exist = spawn error |
| `system_prompt_flag` | role standing instructions | falls back to prepending into the prompt body |
| `session_flag` / `resume_flag` | `session-mode`, correction-retry resume | **no resume ⇒ every retry is a visible cold start** (that is the honest fallback, not a bug) |
| `json_schema_flag` | typed output enforcement | dropped silently on resumed retries — same class as opencode/pi; see P540 |
| `dir_flag` | worktree targeting | **must** be established before any `--worktree` run |
| output format | stream parsing | ctx needs NDJSON/stream-json-shaped events; a bare-text CLI needs the generic decoder path |

## The two parity requirements the owner named

**No subagents.** claude-code gets `--disallowedTools Agent` in its base argv — that is how ctx prevents a frame from spawning its own sub-agents and escaping the run's accounting and confinement. **Find codex's equivalent.** If it has none, that is a genuine capability gap and must be reported as `CapabilityReport::unsupported`, not quietly accepted — a harness that can fork uncounted work underneath a frame breaks the receipts thesis.

**Sandbox.** Codex's `sandbox_mode` is OS-enforced, which makes it *stronger* than claude-code's deny-list approach (which is enforced by the agent honoring its own settings). `render_codex_payload` already exists to emit `{"sandbox": "workspace-write", "add-directory": [...]}`. Confirm the current codex CLI still takes that shape — it is the thing most likely to have drifted since that renderer was written — and confirm the carve-out list covers the worktree **and** the shared build-cache dir (`[worktree.env] CARGO_TARGET_DIR` points outside the worktree; a workspace-only sandbox will break every cargo gate).

## Subscription auth

The ask is "openai subscription (CLI)". Codex authenticates through its own login, and that is exactly the point: it uses the ChatGPT/codex subscription rather than an API key. Note the related fact from `tasks/0003`: **credentials are ambient per binary**, so all codex seats share one account until per-seat routing exists. Also note that `openai/gpt-5.6-*` seats **through opencode** may already be billing that same subscription — worth confirming, or you will be double-counting one quota across two harnesses.

## Steps

1. Install codex; capture `codex --help` and any exec/non-interactive subcommand's help verbatim.
2. Fill the table above from that output. Write it as `.ctx/harness.toml` (route B).
3. Add one cheap seat — `clerk` or `scribe`, not `worker` — and run a small phase non-worktree first.
4. Verify: typed slot output accepted; no subagent capability (or an explicit unsupported report); the debug trace shows the expected event shape.
5. Then a `--worktree` run, and check the sandbox payload actually applied — write outside the worktree should be **refused by the OS**, not merely undeclared. Confirm cargo gates still pass with the external build-cache dir.
6. Promote to a built-in `HarnessDefinition` and wire `render_codex_payload` to it (route A).

## Explicitly not in scope

Per-account routing (see `tasks/0003`); making codex any seat's default; the P501 hook, which is a different mechanism that already landed.
"""
validation = """
## Done when

A codex seat runs a real frame with typed output; subagent spawning is prevented or explicitly reported unsupported; an out-of-worktree write is refused by the sandbox while the declared carve-outs still work; and the registry entry reflects the binary's actual flags.

"""
