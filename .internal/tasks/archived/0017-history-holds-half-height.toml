schema-version = "0.2"
key = "0017"
title = "History keeps up to half the height and scrolls; activity never pushes it out"
status = "done"
raised = "2026-07-28"
content = """


## What is wrong

History is sized to its CONTENT, not to a share of the column:

```rust
// run_view.rs:947-952
let history_cap = area.height.saturating_sub(CURRENT_MIN_OUTER_ROWS) / 2;
let history_height = u16::try_from(history_rows)
    .unwrap_or(u16::MAX)
    .saturating_add(2)
    .min(history_cap);
…
(Constraint::Max(history_height), history_leaf)
(Constraint::Min(CURRENT_MIN_OUTER_ROWS), current_leaf)   // CURRENT_MIN_OUTER_ROWS = 8
```

Two consequences:

- **A half-height cap already exists but only as a ceiling on content.** A short history gets a short pane; it never *holds* half the column.
- **`Max` versus `Min` decides the fight, and history loses.** Current activity carries a `Min` floor and history only a `Max`, so as activity grows the layout satisfies activity's floor first and history is squeezed — the "activity pushes history out" behaviour. Nothing bounds activity from above.

## What to build

History **reserves** up to half the column and **scrolls within it** rather than resizing to fit:

- height = `min(content + borders, half the column)` — unchanged as a formula, but when content exceeds the half it stays at the half and scrolls, instead of the pane growing or being clipped by whatever activity leaves over.
- activity takes **the remainder**, with its own floor, and stops being able to claim rows history is holding.

The scroll machinery already exists — `PaneScrolls`, per-pane offsets, and (from task 0006) key handling. This is a layout-constraint change, not new scrolling.

A short history should still yield its unused rows to activity: reserving half when there are three lines of history would waste the column. Reserve **what it needs, capped at half** — the cap is what activity may not take, not a fixed allocation.

"""
validation = """
## Watch

- Both panes need a floor, or a tall history starves activity on a short terminal. Today only activity has one (`CURRENT_MIN_OUTER_ROWS = 8`); history needs an equivalent, and the sum of the two floors must fit the smallest supported height — an inline viewport is already one row short of the terminal, and P552's header and fourth pane take more.
- The narrow-terminal branch (`area.width < 109`) drops history entirely and only splits progress/current. Decide whether that stays: with P552's 2x2 grid the narrow case needs its own answer, and silently having no history at all on a narrow terminal is a surprise worth stating.
- Do not fix this by giving activity a `Max`. Capping the newest content is the wrong direction — history is what should be bounded, because it is the part the reader can scroll back to.

## Done when

History holds up to half its column and scrolls inside it; a long activity stream can no longer shrink history below that; a short history still yields spare rows to activity; both panes have floors that fit the smallest supported terminal.
"""
