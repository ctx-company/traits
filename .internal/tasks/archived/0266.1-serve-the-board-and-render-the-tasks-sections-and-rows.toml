This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it wherever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

This is the load-bearing first cut of the Tasks charter, and it is one cut on
purpose: the capability is what makes the rendering honest, and the rendering is
what proves the capability is reachable. It owns eight things — the canonical
`draft` state the board cannot store today, one center-served board listing
resolved in a single filesystem pass, the center-side run-to-task join,
centrally derived row and section state, event-driven board freshness, the title
bar's `Tasks` entry and switch, the three `In progress` / `Ready` / `Draft`
sections, and the task row's dot, title, short description and selection model.

Everything else on this screen belongs to a sibling and is not built here: the
row's right-hand state-over-meta stack (`0266.6`), the header and the provenance
bar with its sha and sync time (`0266.2`), draft creation (`0266.3`, `0266.8`),
the preview column (`0266.4`, `0266.5`), and the migration of the TUI's
`Screen::Tasks` onto this answer (`0266.7`). `0266.6` in particular requires
every state and join fact it renders to be present in this cut's answer, so the
answer is designed for it; the rendering of that stack is not. The same holds for
`0266.7`: this answer must make that migration a re-pointing rather than a second
projection rewrite, and must not perform it.

Thirteen corrections follow. Each is a place where the draft this plan replaces
stated something the code at HEAD does not support, and several of them, executed
as written, would have shipped a screen that reads as evidence while being wrong.

## Thirteen corrections to the draft this plan replaces

**Correction 1 — `0265.2` has not landed, so nothing is being "widened".** The
draft states that the center already answers the single task a run claims. It does
not. `Request` carries register/notification, subscribe, start/control and run
queries only (`modules/io/src/center.rs:89-153`), and `ResponseResult` has no task
or board arm at all (`center.rs:198-209`). This cut therefore may be adding the
center's *first* task-side capability rather than extending one. The binding rule
survives either outcome: **one task protocol, not two.** If a claimed-task answer
has landed by execution time, this board capability extends that same request
family and result family; if it has not, this cut establishes the family that
`0265.2` and the later siblings then extend. A second, parallel, GUI-only task
protocol is the defect the charter names, in both worlds.

**Correction 2 — `draft` is a word this board cannot store, and this cut owns
making it storable.** `TaskStatus` is the closed stored set `ready|done|cancelled`
(`modules/core/src/task/mod.rs:22-31`) and `task::parse` deserializes with
`deny_unknown_fields`, rejecting anything else (`mod.rs:208-220`); `Board::load`
records a parse failure and skips the document (`modules/io/src/task_files.rs:186-250`).
This is not abstract: this task file and all eight `0266.*` children currently
store `status = "draft"` and are therefore invisible to the repository's own
board. The `Draft` section is unrenderable until the word parses.

The switch sites a draft can newly reach are enumerable at HEAD, and each needs a
stated, covered outcome rather than a silent fall-through:
`graph::derived_status` (`graph.rs:156-172`), `markdown::classify_status`
(`markdown.rs:225-235`), the archive decisions in `task_files.rs:356` and `:402`,
`dispatch_preflight::status_word` and `closed_status_refusal_message`
(`dispatch_preflight.rs:205-235`), queue expansion's closed test
(`modules/cli/src/app/task_queue.rs:143`), the CLI's `status_text` and
`status_tone` (`modules/cli/src/app/tasks.rs:29-44`), the `TaskUpdateStatus`
surface enum and its mapping (`surface/cli.rs:278`, `tasks.rs:493-495`), and task
proposal's closed/target-status logic (`task_proposals.rs:94,301`). Three
consequences bind: a draft must derive **distinguishably from `ready`**, so no
face has to re-read a stored field to know which section it is in; parent
aggregation is still decided by child closure, not by a parent's own stored
`draft`; and per archived `0250`'s owner ruling, **no new dispatch-side refusal is
added for `draft`** — a covered outcome is not a gate.

**Correction 3 — the three sections are not a partition of the document-derived
status model.** `graph::derived_status` yields only `Ready|Blocked|Done|Cancelled`
(`graph.rs:115-177`); there is no in-progress, claimed or awaiting-owner state
anywhere in a task document. `In progress` is a **run** fact, produced by joining
board keys against center run rows carrying `RunSummary.task_key`
(`modules/io/src/run_summary.rs:61-68,187-192`; `center.rs:3778-3788`), and
`awaiting owner` is a run fact too. The draft's own scope says section membership
is "derived from the task documents", which is wrong for one of its three
sections. The parent's resolution binds: closed and archived tasks are outside
this pane; a claimed task with a live or pending/awaiting-owner run is `In
progress` and outranks its board state; an unclaimed open draft is `Draft`; every
other open task, **including a blocked one**, is `Ready`, with blocking carried as
row detail rather than promoted to a fourth section. No open task may be silently
dropped and none may appear twice.

**Correction 4 — there is no task description field.** The draft's row renders a
"description"; `TaskDocument` has none (`mod.rs:135-185`) and `TaskSummary`
carries only key, title, stored status, derived status and archived
(`provider.rs:25-36`). The only prose is `TaskDocument.content`. One shared pure
projection covers both faces of it — the full form for the selected detail
`0266.4`/`0266.5` later renders, and a short form for this row, with the first
paragraph as the suggested rule. A newly stored description field, or a second
per-face derivation, is a defect; truncating for width is layout, never a value
invented in the answer.

**Correction 5 — the listing must stay compact, and the draft's wording invites
the opposite.** Wire lines are bounded at 1 MiB and serialization fails loudly
past it (`center.rs:48-52,635-644`). This repository's board is already several
hundred documents; a listing carrying every task's `content`, `scope`,
`validation` and check commands would exceed the bound outright and take the whole
screen down with it. The listing carries what a section and a row need. Full
prose, facts, checks and landing are the selection-triggered detail of `0266.4`
and `0266.5`.

**Correction 6 — one board resolution is one filesystem pass, and the current
verbs defeat that.** `Board::load` already performs the whole useful pass in one
walk — sorted live paths before sorted archived paths, parse each document,
first-path-wins on duplicate keys, every key's locations collected, archived keys
tracked, parse failures collected, and `Digest::source(&text)` computed per
first-wins document (`task_files.rs:186-250`). But `list`, every `get` and `sync`
each call `load` independently (`task_files.rs:269-313`), and the TUI's
`read_board_snapshot` performs exactly the N+3 shape: `list(true)`, a `get` per
summary, `sync`, then a fingerprint sweep (`dashboard.rs:6140-6163`). Copying that
into the center and again into gpui would triple it. One resolution, one walk;
rows, resolved relations, sync findings and the per-document digests all fold out
of that same walk.

**Correction 7 — an absent board is currently indistinguishable from an empty
one.** `Board::load` swallows every `read_dir` error for both the board directory
and `archived/` with a bare `let Ok(entries) = ... else { continue }`
(`task_files.rs:197-200`). A center that answers "0 tasks" for a board that does
not exist, or one it cannot read, is stating a fact it did not establish. The
served answer distinguishes absent, unreadable and legitimately empty. Parse
failures, duplicate keys and dangling edges already have typed `SyncReport`
representations (`task_files.rs:269-313`) and stay visible rather than being
flattened into the row list.

**Correction 8 — where the board work runs inside the center is a correctness
constraint, not a performance note.** The sole model/SQLite owner drains
`ModelCommand::Request` and calls `handle_request` (`center.rs:2915-2970`); a
directory walk there stalls every other client on every board read. `Start` and
`Control` already demonstrate the alternative — a short resolution through
`ModelCommand::ResolveRow`, then blocking work in the connection worker
(`center.rs:3278-3429`). Freshness rides the center's existing two-second periodic
scan (`SCAN_INTERVAL`, `center.rs:65,3026-3038`) with the stat-only
`board_fingerprint` sweep as the change detector (`task_files.rs:124-167`), and
reaches clients inside the established
`SnapshotStart`/`SnapshotRow`/`SnapshotEnd`/`Delta` transaction with its buffering
and bounded queues (`center.rs:1005-1088,1506-1524,2336-2397`). No client timer,
no filesystem watcher, no new heavyweight dependency in `ctx-traits-io`.

**Correction 9 — the board directory is a CLI-private convention and must not be
re-derived from a cwd.** `.internal/tasks` is defined privately in
`modules/cli/src/app/tasks.rs:20-26`. A center answering about repository B that
resolves the board from its own working directory answers about the wrong board —
the same class of defect `0265.15` records for the config layer stack. The board
path is derived from the center-scoped repository row's identity and path, and the
convention itself is shared rather than copied.

**Correction 10 — the run join must be repository-scoped and centralized.** The
existing TUI join already guards on repository (`task_session_join`,
`dashboard.rs:5983-6002`) precisely because a sibling repository's session can
carry the same task key for a different board. The precedence rules are
`task_group`'s: live outranks everything, then pending, then not-merged, then the
board's own derived status (`dashboard.rs:5953-5980`), with
`AwaitingInput`/`WaitingOnHuman` mapping to pending (`dashboard.rs:1946-1972`).
Those are CLI-private beside ratatui rendering. The pure semantics move to the
shared side and both faces consume them; a second copy inside gpui is a defect
even when it compiles.

**Correction 11 — the answer is shaped for two consumers, but this cut renders
one.** The desktop's three sections are a projection; the TUI's seven groups
(`Syncing`, `InFlight`, `AwaitingMerge`, `Parked`, `Blocked`, `Ready`, `Done`,
`dashboard.rs:582-625`) are a different projection of the same served facts, and
`0266.7` must be able to preserve its rows, ordering, filtering and error text
without a second board answer being invented for it. Likewise `0266.2` needs the
board digest and sync time, and `0266.6` needs every state and join fact for the
row's right stack: this cut's one-pass resolution keeps the per-document digests
and the join facts available so neither sibling is forced into a second read. It
does not render any of them.

**Correction 12 — selection is by key, never by index.** The TUI's visible rows
store `Task(String)` and rebuild preserves the selected key across refresh and
reordering (`dashboard.rs:6004-6105`). The desktop's sections resection on every
board change and on every run delta, so an index-based selection would silently
move to a different task. Selection identity is the task key.

**Correction 13 — `board_fingerprint` and `task_board_cache` are not evidence.**
The fingerprint is a stat sweep of `(archived, name, mtime-seconds, len)`
(`task_files.rs:124-167`) — a change detector, not a content sha and not
provenance. `task_board_cache::BoardSnapshotRecord` is explicitly discardable:
`read_snapshot` returns `None` for missing, unreadable, corrupt, wrong-schema or
wrong-board records (`task_board_cache.rs:64-109`). It may accelerate a face; it
may never establish a current answer, stand in for a failed one, or back a
`synced` claim. And a failed or rejected board answer never silently keeps stale
rows as current, never falls back to a direct read, never reinterprets an absent
board as empty, and never derives `ready` as a default.

## Grounded at HEAD 9150f2837

