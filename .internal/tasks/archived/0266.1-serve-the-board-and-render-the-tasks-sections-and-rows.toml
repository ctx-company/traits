moment the plan is written and this one does not.

**Rendered evidence**, the phrase the goals use, means two things taken together:
the landed lane's documented command, run as it exists and exiting 0; and, for
every outcome that command does not itself decide, the run's own observation of
the running frame and the composed element tree, by whatever means that harness
already supports. Which of the two decided which outcome, and the mechanics used,
are named in the work summary.

What *is* readable today is the whole data side, and the goals lean on it:
