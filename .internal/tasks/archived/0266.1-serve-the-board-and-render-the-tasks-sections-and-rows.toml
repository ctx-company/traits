whose own chains reach back through `0265.3` → `0265.1` → `0256.1`. **The first
act of this cell is to locate the desktop lane's documented non-interactive
command and record it verbatim in the work summary.** If no such command exists,
the prerequisite chain has not landed: stop and report that, rather than
substituting a workspace command for rendered-behaviour proof. It is deliberately
