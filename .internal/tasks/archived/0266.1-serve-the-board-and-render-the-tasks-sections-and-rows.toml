## GOALS — binding

1. **`draft` is a canonical board state end to end.** One representation that
   parses, serializes, round-trips through the existing document round trip, and
   derives to a state distinguishable from `ready` without any face
   re-interpreting a stored field (content Correction 2). Whether that is a new
   stored `TaskStatus` variant, a new `DerivedStatus` variant, or both, is the
   run's call; what binds is that exactly one canonical representation exists,
   that it renders as the word `draft` in every face that shows task status, and
   that every switch a draft can now reach has a stated, covered outcome —
   `graph::derived_status`, `markdown::classify_status`, the two archive
   decisions in `task_files.rs`, `dispatch_preflight`'s status word and closed
   refusal, queue expansion's closed test, the CLI's `status_text`/`status_tone`,
   the `TaskUpdateStatus` surface enum and its mapping, and task proposal's
   closed and target-status logic. Parent aggregation stays decided by child
   closure, not by a parent's own stored `draft`.
   Decided by the declared core, io and CLI checks over scratch documents:
   parse and serialize round trip, a draft leaf deriving distinctly from a
   `ready` leaf, a parent with draft children aggregating on closure, and each
   enumerated switch exercised with a draft reaching it.
   Excluded: a new dispatch-side refusal or selection gate for `draft`, per
   `0250`'s owner ruling; a status beyond `draft`; a board-schema redesign; a
   migration of any existing document's stored status; any face deriving `draft`
   from a field that does not say so; any test asserting on this repository's own
   `.internal/tasks`, including the documents this goal makes newly loadable.

2. **One board resolution is one filesystem pass, and it distinguishes absent
   from empty.** A single public board resolution yields, from one walk, the
   row-shaped summaries, the resolved relations, the sync findings and the
   per-document source digests (content Correction 6). An absent board
   directory, an unreadable board directory and a legitimately empty board are
   three distinguishable outcomes rather than one empty list (content Correction
   7). Parse failures, duplicate keys and dangling edges remain individually
   visible in the answer, not flattened away. `FilesTaskBoard` stays the sole
   board authority and `task_board_cache` stays discardable derived evidence.
   Decided by the declared io check over scratch boards: a resolution whose
   walk count is one rather than N+3, a missing directory, an unreadable
   directory, an empty directory, a document that fails to parse, a duplicate key
   across live and archived, and a dangling relation edge — each arriving as its
   own typed outcome; plus the declared `just test` check for the existing
   `list`/`get`/`sync` consumers staying observably unchanged.
