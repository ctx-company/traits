`derived_status` and `resolved_relations` (`graph.rs:16-31,115-177,188-221`),
`TaskSummary`/`ResolvedTask` and `summarize`/`resolve_task`
(`provider.rs:25-57,276-317`), `Board::load` and the public verbs above it
(`task_files.rs:124-167,186-250,269-313`), `task_board_cache.rs:64-109`,
`RunSummary.task_key` (`run_summary.rs:61-68,187-192`), `CenterPublicRow`
(`center.rs:3778-3788`), the center's request path, subscription stream, periodic
scan and connection-worker shape (`center.rs:89-209,1005-1088,2915-2970,3026-3038,3278-3429`),
and the TUI's join, grouping, snapshot reader, poll tick, selection rebuild and
