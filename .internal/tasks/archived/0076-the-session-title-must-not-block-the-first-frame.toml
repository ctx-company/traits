schema-version = "0.2"
key = "0076"
title = "The session title must not block the first frame, and must not cost 20 seconds to fail"
status = "done"
raised = "2026-08-03"
content = """


## What landed

The dispatch runs on a detached thread and `drive_loop` starts immediately;
the worker never writes the ledger, parking its result in
`PendingSessionTitle` for the drive thread to persist at a frame boundary. A
dimmed `generating title…` row shows from dispatch until it resolves. The
invocation that took 29s now takes 9s.

**One decision below was reversed on the owner's call: "Never retry the
title" is wrong.** A blank title row for the life of a run is a worse outcome
than a second and third cheap flash-model call, so the worker retries three
times with linear backoff. It stays bounded for the reason that decision was
reaching for — decoration must never become unbounded background spend.

Still open, and the reason 0030 matters: the same narrator seat is called
**per frame** inside the loop, and that cost is untouched by this.

Every driven run pays for one narrator model call before its first frame, and
on this machine that call fails its bound three times out of four. The run is
not doing anything during it. The screen shows nothing during it.

## What was measured

Across the 58 traced runs in `~/.config/ctx/debug/<repo>/*/001-session-title-narrator@opencode.jsonl`:

- **44 timed out at exactly ~20.02s** — `timed-out: true`, `exit-code: null`
- 14 returned normally, between 8.6s and 19.3s

So the *typical* outcome is the maximum bound, and the best case is still most
of it. The bound itself is `agent.role.narrator.budget.frame-seconds: 20`
(`[built-in] [default]`, confirmed via `doctor --config`).

`drive()` calls `maybe_dispatch_session_title` at `drive.rs:1083`, immediately
before `drive_loop` at `:1091`. A stack sample of a run in this state shows the
main thread parked in it:

```
drive → maybe_dispatch_session_title → dispatch_narration
  → ctx_traits_io::harness::run → thread::sleep     (1645/1657 samples)
```

"""
scope = """
## Decisions

- **The title never blocks the first frame.** It is a cosmetic label. Nothing
  in the procedure reads it, and no output depends on it. A run must reach
  `drive_loop` without waiting on a model.
- **The race that made it synchronous is real, and is not solved by blocking.**
  The doc comment at `drive.rs:3695-3707` is explicit: it dispatches inline so
  `record_session_title`'s write cannot race a frame's whole-ledger write from
  `drive_loop`. Fix that with write ordering — serialize the title write behind
  the same lock frames already take, or fold it into the next frame's write —
  not by holding the whole run still until the model answers.
- **A title that never arrives is a blank title.** Never a stalled run, never a
  placeholder, never a retry. The missing-narrator path already degrades to a
  permanently blank title row; an unanswered call takes exactly that path.
- **20 seconds is the wrong bound for one line of text.** A status line under
  80 characters does not need twenty seconds. Cut it hard — single digits — and
  treat exceeding it as the seat being wrong rather than the budget being tight.
- **A bound hit 3 times in 4 is a broken seat, not a tight budget.** Raising the
  number is not the fix and must not be the fix here. 0030 identifies why:
  an opencode narrator tick measured ~0.1s of model time against ~14s of
  spawn/server/snapshot overhead. This task makes that cost invisible; 0030
  removes it.
- **Never retry the title.** One attempt, one outcome. `dispatch_narration`'s
  warm-then-cold fallback means a failure can already cost two attempts and
  two bounds — the title path must opt out of the second.

## Scope

`maybe_dispatch_session_title` moves off the critical path; the ledger write it
performs is serialized against frame writes by ordering rather than by
blocking; the title seat gets its own short bound, independent of
`frame-seconds`; and the warm/cold fallback is skipped for this one call.

"""
validation = """
## Watch

- **Confirm which bound actually applies before tuning anything.** `runtime.toml`
  records that per-seat budgets resolve in `doctor --config` but never reach the
  frame timeout for worker seats, leaving `[run] frame-seconds` as the only
  number that bounds a frame. The narrator's 20s *is* being honored — the traces
  land on 20.02s, not 3600s — so this seat is not affected, but any change here
  must verify that rather than assume it.
- The same narrator seat is called **per frame** inside `drive_loop`, not only
  for the title. Fixing the title leaves that cost in place. The live view has a
  2s soft timeout (`NARRATION_SOFT_TIMEOUT`) that reveals raw output when a tick
  is slow, so the loop degrades where the title does not — which is exactly why
  the title is the one that shows up as a hang.
- Do not make it fire-and-forget onto a detached thread without deciding what
  happens when the run ends first. A title arriving after the terminal frame
  must not reopen or repaint a finished session — the same ordering problem
  0070's monotonic sequence exists to prevent.
- A title write that lands mid-run must not break `validate_output_port_contract`
  the way 0050's project-written port did. Whatever write path it takes, it must
  leave the ledger recomputable.

## Done when

A driven run reaches its first frame without waiting on any model call; a
narrator that never answers leaves the session title blank and the run
otherwise untouched; the title call is bounded in single-digit seconds and is
attempted exactly once; the title write cannot race a frame's ledger write; and
the traced title duration is no longer the dominant cost before frame one.
"""

[relations]
depends-on = ["0030"]
