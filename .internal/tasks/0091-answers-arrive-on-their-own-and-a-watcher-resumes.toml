schema-version = "0.2"
key = "0091"
title = "Answers arrive on their own, and a watcher resumes the run"
status = "ready"
raised = "2026-08-04"
content = """


The reactive half. 0088 parks a run with an open question and a person answers through `ctx`; this
makes the answer arrive from wherever it was asked — a Slack button, a webhook, a ticket transition —
and resumes the run without anyone at a terminal.

Filed early and deliberately unscheduled, because the useful fact is that **it requires no change to
0087 or 0088**. Park-with-an-open-question is already the resumable state and the answer path is
already one function; the watcher is a caller of it. That is what makes deferring safe.

"""
scope = """
## Decisions

- **Ingress is the hard half, not the watcher.** A loop that notices an answer and resumes is small.
  A surface that accepts an answer from outside the machine needs a listener, a public endpoint or a
  poller, and an authorization story. The watcher is filed with it because a watcher with nothing to
  watch is a poller of our own CLI.
- **Identity is the blocking question.** A Slack user id is not an owner, and "the person who clicked"
  must map to someone entitled to make that decision — which the current model has no notion of,
  because answering has so far meant having the machine (0088). Deciding that is the bulk of the work.
- **It resumes; it never dispatches.** The watcher advances sessions that are parked on a question.
  Starting runs is dispatch's job and stays there — otherwise this becomes a second scheduler with a
  different idea of what is running.
- **One resume path.** The same function `ctx traits answer` and the dashboard call (0088). Three
  callers of one function, never a background variant that behaves subtly differently at 3am.
- **It holds no state beyond a cursor.** The open questions live in the sessions; the answers live in
  the delivery log. A watcher with its own queue is a fourth place run state lives.
- **Polling is an acceptable first implementation.** A listener is a deployment; a poll over the
  answer log and the session store is a loop. Ship the cheap one if this is ever scheduled, and let a
  real listener earn its way in.

## Scope

An ingress surface accepting an answer from outside the machine with an identity check; a watcher
resuming sessions parked on an answered question through 0088's path; idempotent handling of a
repeated or late answer; visibility of both in the dashboard.

"""
validation = """
## Watch

- **A long-lived process is a new operational surface** — start, stop, crash, restart, and a story for
  what happens to a run whose answer arrived while it was down. 0077's lock discipline applies: a
  watcher must not resume a session a driver is already holding.
- The same answer arriving twice, or arriving after a human already answered, must be a no-op rather
  than a second value (0088 already refuses this at the write; the watcher must not route around it).
- Slack interactivity means a public endpoint, request signing and a secret. That is a materially
  larger security surface than anything in the arc, and it is why the arc ships without it.
- Do not let the watcher become the thing that also updates handoff surfaces. 0070 already owns that
  clock; a second poller of the same store is the failure 0063 and 0070 both flag.

## Done when

An answer submitted from outside the machine is authenticated, attributed to someone entitled to give
it, and recorded; a watcher resumes the parked session through the same path a human would use; a
repeated or late answer is a no-op; a session held by a live driver is left alone; and the whole thing
is observable from the dashboard rather than being a silent process.
"""

[relations]
depends-on = [
    "0087",
    "0088",
]
