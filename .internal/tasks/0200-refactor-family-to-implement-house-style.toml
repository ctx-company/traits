schema-version = "0.2"
key = "0200"
title = "Bring the refactor family to the implement house style"
status = "ready"
raised = "2026-08-18"
content = """
The house style, defined by the implement trait (source/ as of 6d1a448f, the canonical example):
namespace imports only (import * as cdk/agents/shared, every call qualified); shared/index.ts is
the barrel and declares the family-wide BEHAVIOR and INTENT consts; data.ts ends in
`export const port = {...}` / `export const slot = {...}` aggregates; useIntent/useBehavior/
useResource once at trait level, never in variants; `include:` eliminated — optional prior-round
attachments interpolate inline as ${slot.x.optional()} in the prompt text; output ports written
directly by steps (no echo slots); one step file per concern via cdk.step; prompts are tagged
templates, one clause per line, 4-space indent, no line past ~120 chars, outputs via
cdk.output.prompt naming the destination; variants are a uniform skeleton — defineVariant
(one-line description, tag), steps by title, loop bounds inside the loop body, git tail under
flow.when("Maybe Commit"), one return of ports.

Closest family already: hook-based cdk.step throughout. Remaining distance: named-import lists
to namespace imports; per-variant intent fragments fold into one trait-level INTENT/BEHAVIOR in
shared/index.ts; data.ts gains the port/slot aggregates; include: sites become inline
.optional() interpolations; long prompt paragraphs split one clause per line; per-variant
step/git.ts copies reconcile against the shared-tail shape implement uses.
"""
validation = """
## Watch
- The guarded variant carries the ctx-gate approval flow (0098) — restyle it, do not remove it.
- Behavior must not change except where the style contract demands it (include-elimination,
  trait-level intent); prompts may be tightened but every load-bearing instruction survives.
- Rebuild via `just ts-build` (if packages changed) then `ctx traits build <family>` and
  `ctx traits export <family> --update-skill-lock`; `ctx traits check <family>` must pass.

## Done when
The family builds, exports, and checks clean; no `include:` fields remain; no per-variant
intent/behavior declarations remain; every prompt line holds the one-clause-per-line and width
rules; imports are namespace-form throughout; data.ts ends in port/slot aggregates.
"""
