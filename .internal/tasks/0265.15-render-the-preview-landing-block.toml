content = '''
This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it wherever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

This cut closes the Sessions preview column with grammar rule 13's consequence
block: the `landing` block, last in `0265.10`'s ordered body, after `0265.12`'s
`slots` fact block and before the spacer and provenance footer
(`grammar.md:117-124`). It is the fifth and final implementation stage of
`0265`; the parent-level artifact review that follows it is the parent's work,
not this task's.

`screens/sessions.md:36-49` fixes the position and tags the whole block `data:
run config` — worktree, merge and task close are three data leaves, not
placeholders, and they do not share one source. Two of the three are the
selected run's own durable provenance. The third is not: **the task-close policy
is configuration, not session provenance.** A `Session` records the claimed
task's key and digest and nothing about what happens to that task
(`session.rs:302-311`); the policy is `TaskDocument.auto_close`
(`modules/core/src/task/mod.rs:135-184`) over the `[tasks] auto-close` config
leaf (`modules/io/src/harness_config.rs:1195-1210,1588-1593`), the override
winning in either direction. So that line renders from a served resolution of
current configuration, and the block's determinism claim has to be stated
accordingly rather than asserted flat.

Nine corrections follow. Each is a place where the draft this plan replaces
stated something the code does not support, and each one, implemented as
written, would have put a plausible lie about a run on screen.

## Nine corrections to the draft this plan replaces

**Correction 1 — the line size is contested, and a plan carrying both sizes is
not executable.** Grammar rule 13 requires `landing` consequence lines to be
`→`-prefixed **sans 12** (`grammar.md:117-124`). Three other artifacts say
11.5: `screens/sessions.md:47`, the type scale row "11.5 | kv keys,
sub-descriptions, check/landing lines" (`tokens.md:62`), and the export's three
`Landing Line` divs at `font-size: 11.5px` (`reference/sessions.html:846-866`).
The draft repeated 11.5 while inheriting rule 13. This plan settles it at **sans
12**, on the parent's own resolution: Correction 1 of `0265` quotes rule 13's
requirement verbatim and rules "Rule 13 governs (`0265.15`)" (`0265:23-30`), and
that bullet is addressed at this task by name. `tokens.md` is an extraction from
the pen file, the same source the export measures, so its scale row and the
export are one piece of evidence, not two. The three 11.5 appearances are raised
as one owner correction against the design artifacts and are never edited here.
If the owner rules for 11.5, that is one constant at `0265.1`'s token entry
point, not a re-plan. The colour is not contested: `text-secondary` `#8b909c` in
all four artifacts.

**Correction 2 — `Provenance.worktree: None` does not prove the run was started
without `--worktree`.** The field's own documentation says `None` covers a run
started without one *and* every legacy ledger (`session.rs:255-261`), which is
why `ctx traits merge` is required to report it as unresolvable rather than
guess. The draft's "a run started without one — a fact to state" would render a
historical flag choice the ledger does not record. Goal 2 states the absence of
recorded provenance instead. `WorktreeProvenance` carries `id`, `branch`,
`seed_snapshots` and an optional `path` (`session.rs:552-576`); goal 2 projects
the served `id` and never the path, the branch, or current Git state.

**Correction 3 — merge intent and merge frames are independent facts, and the
draft decided nothing between them.** `Provenance.merge_intent:
Option<MergeRung>` is the automatic post-drive landing intent, resolved once and
persisted before driving precisely so later `[merge]` config changes cannot
alter a resumed run (`session.rs:268-275`, `523-534`); `None` covers no
effective merge request, every legacy ledger, and an intent a resumed `drive
--no-merge` explicitly cleared (`modules/io/src/run_session.rs:601-614`).
`Provenance.merge_frames` is the ordered record of merge attempts that actually
happened (`session.rs:262-267`). A manual `ctx traits merge` appends frames to a
run with no intent; an intended merge can have no frame yet. The draft
simultaneously required a future-consequence block, required frames to affect
it, and forbade the finished block becoming a report of what happened — three
statements that do not decide any observable case. Goal 3 decides the whole
matrix and gives the rule: **intent is the line's subject until a terminal frame
exists; a terminal frame supersedes it; a nonterminal frame never does.**
`LockAcquired`, `GatesPassed` and `Reconciled` are nonterminal mid-attempt
stages; `Merged`, `Parked`, `PostMergeCleanupFailure` and `RecoveryFailure` are
terminal (`session.rs:617-670`). After a terminal outcome, rendering a pending
consequence would assert a future that already resolved — that is why the
supersession is not a report-of-what-happened, it is the consequence's own
resolution.

**Correction 4 — the merge line cannot name a target branch.** `MergeRung` is
`Standard | Deep` and carries no branch (`session.rs:523-534`); `ctx traits
merge` resolves its default branch at merge time
(`modules/cli/src/app/merge.rs:719-791,1099-1121`), and only free-form frame
evidence may incidentally mention one. The export's `Merges deep into main on
approval` is therefore two fabrications in one line: `main` is not served, and
`on approval` describes no code path — the intent is automatic post-drive
landing, not an approval gate. Goal 3's forms carry neither. Terminal success
evidence is principally `landed=<sha>` on the frame
(`merge.rs:2022-2029,2363-2378`), which `landing_state` already strips
(`session.rs:705-760`); goal 3 renders that revision and nothing else.

**Correction 5 — `AutoClosePolicy` is not "closes when landed".** It is the
closed set `confirm | checked | merge` (`task/mod.rs:64-79`) and the three
behave differently: `confirm` never closes without the owner's key press;
`checked` closes only when at least one check is declared and every one runs and
passes, and otherwise stays a proposal naming why; `merge` closes a hardened
candidate regardless of check outcomes, recording `unchecked` for an empty set
(`task_proposals.rs:405-470`). A successful resolution yielding `None` is a
fifth, distinct state — no policy configured, the historical confirm-only flow —
and it is not the same as a resolution that failed. Goal 4 gives all five their
own fixed form.

**Correction 6 — a task key plus an effective policy cannot support "this task
will close".** Automatic closing today is invoked from exactly one place: the
`ctx traits run --task ...` queue, after `landing_state` is `Landed` with a
revision, and it still returns `false` for no policy, a `Proposal` disposition,
a missing revision, a provider or read failure, or a failed write
(`modules/cli/src/app/run.rs:874-946`; `task_queue.rs:71-108`). Nothing in a
session records that it came through that queue — `--task-dispatch` binds a task
outside it (`modules/io/src/run.rs:223-241`) and `CallerProvenance` carries only
surface, caller, agent and harness (`session.rs:122-157`). The export's `Closes
task 0243.4 when landed` is therefore unsupported for any run. Goal 4's forms
state the **configured close policy for the claimed task** and never that this
run will execute it. Adding a durable queue or close-intent fact to provenance
would make the stronger claim true and is deliberately not done here: the
target's own ruling is that this block states configured consequence, not
accomplishment, and policy is configuration rather than provenance.

**Correction 7 — the existing resolution erases exactly the failure this block
must render, and there are already two copies.** `resolve_auto_close_policy` is
the pure override-then-default combinator (`task_proposals.rs:473-481`);
`resolve_task_close_policy` wraps it with a config read that converts every
resolution error to `None` through `.ok()` (`:483-496`); and `tasks.rs:290-317`
repeats the whole thing inline, anchoring its config read at
`Utf8Path::new(".")` — the process cwd, which is the wrong locus even for the
CLI and unusable for a center answering about another repository's run. Reusing
the `.ok()` wrapper as-is would make an unresolvable policy indistinguishable
from a successfully-resolved absence, which is precisely the fail-loud rule the
draft asserted and its own approach would have broken. Goals 5 and 6 extract one
shared root-taking resolution with three distinguishable outcomes and retain
both existing consumers through it. A third copy, or a second TOML parser
anywhere, is the defect the parent named (`0265:44-47`).

**Correction 8 — `resolve_runtime_config` is not root-safe for a center
answering about another repository.** It is the central layered parser
(`harness_config.rs:3896-3904`), but `runtime_config_layers` absolutizes
`start_dir` and then bounds its ancestor walk with
`repository::discover_repo_root()` (`harness_config.rs:5079-5156`), which runs
`git rev-parse --show-toplevel` **at the process working directory**
(`modules/io/src/repository.rs:12-32`). Handing the selected row's `repo_path`
to the existing function is therefore not sufficient: the ancestor bound still
comes from wherever the center process happens to be running, so the repo layer
stack can be truncated or over-extended for the repository actually being
answered about. Goal 6 makes the repository root an explicit parameter and keeps
everything else — the global tiers, the `runtime.ts`/`generated/runtime.toml`
resolution, layer precedence, the retired-source error, `CTX_CONFIG` — exactly
as it is.

**Correction 9 — the draft's declared `proof_doctor` check proves nothing about
this task.** `modules/cli/tests/proof_doctor.rs` covers the compact
source-inspection panel and asserts only that `--config` and `--verbose`
conflict (`:1-25,255-273`); it contains no `tasks.auto-close` case, and neither
does `proof_config.rs`. Calling it "doctor's config-reporting proof" was a false
claim, and it would have gone green having asserted nothing. It is dropped. The
checks this plan declares are the per-round gate, the real-socket `proof_center`
lane, the retained CLI consumer's lane, the focused `harness_config` lane with
an `expect` guard, and the root gpui-free invariant.

**And a boundary the draft overstated.** "A finished run's block must be
identical after closing and reopening the window" is true for the worktree and
merge lines, which reconstruct from ledger provenance alone. It cannot be true
unconditionally for the close line: that line renders current configuration —
the task document's `auto_close` and the `[tasks]` leaf — and both are mutable
between two views. Persisting the resolved policy into the ledger to force
identity would contradict this task's own ruling that policy is configuration,
not provenance. Goal 9 states the correct boundary rather than an unsupported
claim.

## Grounded at HEAD 240f3b53d

Nothing this task renders exists yet. `0256`, `0256.1`-`0256.5`, `0257`,
`0257.1`-`0257.3` and every `0265` sibling are `ready`, not `Done`. Root
`Cargo.toml:1-12` lists only the existing workspace crates and excludes only
`packages/cdk`; no manifest or lockfile names gpui; there is no desktop
directory, no desktop recipe in `Justfile`, no desktop CI lane, and no
claimed-task or close-policy request on the center (`center.rs:84-225`).

Every desktop path, module name, component name, symbol, signature, gpui API and
command named below is therefore a guess to be replaced by discovery against
what `0256.1`, `0265.1`, `0257`, `0265.2`, `0265.10`, `0265.11` and `0265.12`
actually landed. Binding them here would be fabrication. The desktop lane is
nonetheless guaranteed to exist when this cell runs, and the guarantee is a code
fact: an open leaf derives `Blocked` while any `depends-on` target is not `Done`
(`modules/core/src/task/graph.rs:115-177`), and this task depends on `0265.12` →
`0265.10` → `0265.2` → `0265.1` → `0256.1`. That chain is also why `0265.2`'s
claimed-task answer is reachable without a fourth `depends-on` edge here. The
first act of this cell is to locate the desktop lane's documented non-interactive
command and record it verbatim in the work summary. If no such command exists,
the prerequisite chain has not landed: stop and report that, rather than
substituting a workspace command for rendered-behaviour proof. It is deliberately
not a `[[checks]]` entry, because a check must exist in the repository at the
moment the plan is written and this one does not.

**Rendered-preview evidence**, the phrase the goals use, means two things taken
together: the landed lane's documented command, run as it exists and exiting 0;
and, for every outcome that command does not itself decide, the run's own
observation of the running frame and the composed element tree, by whatever
means that harness already supports. Which of the two decided which outcome, and
the mechanics used, are named in the work summary.

What *is* readable today is the whole data side, and the goals lean on it:
`Provenance.worktree`, `merge_intent` and `merge_frames` (`session.rs:244-275`),
`MergeStatus::is_terminal` (`:617-670`), `landing_state`'s existing `landed=`
strip (`:705-760`), `TaskDocument.auto_close` (`task/mod.rs:135-184`),
`EffectiveConfig::effective_auto_close` (`harness_config.rs:1588-1593`), the two
duplicated resolutions (`task_proposals.rs:473-496`; `tasks.rs:290-317`), the
layer stack (`harness_config.rs:5079-5156`), and the center's short-resolve-then-
blocking-work-in-the-connection-worker shape (`center.rs:3278-3315,3380-3429`)
which `Get`'s model-owner-blocking shape (`:3649-3669`) must not be inherited
from.
