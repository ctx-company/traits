scope = '''
## GOALS — binding

1. **The block is exactly three `→` consequence lines under a `landing`
   heading, and no line is ever omitted.** Worktree, merge and task close, in
   that order (`screens/sessions.md:47`), each line prefixed with `→` per rule
   13 and rule 3's closed glyph set (`grammar.md:31-37,117-124`) — including
   the absence forms goals 2, 3 and 4 bind, which are line forms rather than
   dropped children. The heading is the lowercase word `landing`, mono 11
   `text-muted` (rule 5). Every rendered string is either fixed text this plan
   binds or a value the center served for the selected run; nothing here
   resolves through the `placeholders` module, because
   `screens/sessions.md:47` tags the whole block `data: run config`.
   Decided by rendered-preview evidence: three lines present for a run with
   full evidence, three lines present for a run with none of it, the `→` on
   each, and the heading word and tone; plus the closing diff read showing no
   `placeholders` entry added and no conditional that can drop a line.
   Excluded: omitting, collapsing or merging a line; a fourth line; a count, a
   status dot, a pill, a badge, an icon, a border, a fill or a corner radius
   inside this block (rules 3 and 4); any glyph outside `→`; the export's
   strings `Runs in worktree wt-ab12ef`, `Merges deep into main on approval`,
   `Closes task 0243.4 when landed`, its ids `wt-ab12ef` and `0243.4`, the word
   `main` and the phrase `on approval`.

2. **The worktree line renders recorded provenance, never an inferred flag
   choice.** With `Provenance.worktree` present, the line is `→ Runs in
   worktree <id>` where `<id>` is `WorktreeProvenance.id` verbatim. With it
   absent, the line is `→ No worktree recorded for this run` — the truthful
   form, because `None` covers a run started without `--worktree` *and* every
   legacy ledger (`session.rs:255-261`, content Correction 2).
   Decided by direct tests over the shared line projection for a session with
   worktree provenance and one without, proven by the declared `just test`
   check; plus rendered-preview evidence of both forms.
   Excluded: rendering `WorktreeProvenance.path`, `branch` or `seed_snapshots`;
   inferring presence from a path, from current Git state, or from a `git
   worktree list` shell-out; the wording "started without a worktree" or any
   other claim about the flag the run was started with; the design example id.

3. **The merge line renders the configured intent until a terminal frame
   supersedes it, and never names a branch.** The complete matrix, all of it
   fixed text plus at most one served value:
   - `merge_intent = Standard`, no terminal frame → `→ Merges automatically
     when this run lands`.
   - `merge_intent = Deep`, no terminal frame → `→ Merges deep automatically
     when this run lands`.
   - `merge_intent = None`, no terminal frame → `→ No automatic merge intent
     recorded`.
   - A terminal frame present — the last one in `merge_frames` order whose
     `MergeStatus::is_terminal` holds — supersedes the intent entirely,
     whatever the intent was, including `None`: `Merged` with a `landed=<sha>`
     evidence entry → `→ Merged at <sha>` in the `ok` tone; `Merged` without
     one → `→ Merged`, same tone; `Parked` → `→ Merge parked` in the `warn`
     tone; `PostMergeCleanupFailure` or `RecoveryFailure` → `→ Merge failed` in
     the `danger` tone (rule 1: `ok` is landed, `warn` needs the owner,
     `danger` is failure, `grammar.md:7-18`).
   - `LockAcquired`, `GatesPassed` and `Reconciled` frames are nonterminal and
     change nothing: a run mid-attempt still renders its intent form.
   The supersession is the rule this plan decides (content Correction 3); it is
   not a general landing report, and no other block on this screen changes
   because of it.
   Decided by direct tests over the shared line projection covering every cell
   of that matrix — the three intent values crossed with no frame, a
   nonterminal frame, each terminal status, and a terminal frame on a run with
   no intent — proven by the declared `just test` check; plus rendered-preview
   evidence of an intent form, a superseded form and the three non-neutral
   tones.
   Excluded: naming a target branch, inferring one from config, Git or frame
   evidence, or rendering `main` (content Correction 4); the phrase `on
   approval`; substituting `session::landing_state` for this projection, whose
   `NotMerged` and `None` arms are derived from drive outcome and commit
   receipt and mean something else (`session.rs:705-760`); rendering a
   nonterminal frame; rendering merge-frame evidence strings, stage names,
   durations or holder pids; adding `merge_intent` to `RunSummary` or to any
   compact list row against the compact-row invariant.

4. **The task-close line states the configured policy for the claimed task,
   never a prediction that it will close.** Five fixed forms, over the served
   claimed task and the effective policy goal 5 resolves:
   - No `task_key` on the run → `→ No task claimed by this run`.
   - Effective `Confirm` → `→ Task <key> closes only on owner confirmation`.
   - Effective `Checked` → `→ Task <key> closes when its declared checks
     pass`.
   - Effective `Merge` → `→ Task <key> closes when a run lands, checks or
     not`.
   - Resolved successfully to no policy → `→ Task <key> has no auto-close
     policy`.
   And one failure form, which is not one of the five: any unresolved
   response — an unusable repository path, a config read or parse error, a
   provider error, a claimed key the board does not yield (including a
   document the loader skipped as a parse failure,
   `modules/io/src/task_files.rs:186-249`) → `→ Task <key> close policy
   unresolved` in the `danger` tone, or `→ Claimed task close policy
   unresolved` where no key is available. The wording is deliberately about the
   policy and about "a run", not about this run: a run's task key does not
   record that it came through the close-executing queue (content Correction
   6). The three policy sentences preserve the three behaviours' actual
   differences (content Correction 5); none of them predicts a check result or
   a successful later write.
   Decided by direct tests over the shared line projection for each of the six
   outcomes, proven by the declared `just test` check; by the declared
   `proof_center` check for the unresolved forms arriving from real
   center-side failures rather than being synthesized locally; plus
   rendered-preview evidence of a policy form, the no-policy form and the
   unresolved form in danger tone.
   Excluded: `→ Closes task <key> when landed` or any wording that asserts
   this run will close the task; defaulting an unresolved response to
   `confirm`, to no-policy, or to any plausible value; deriving the policy from
   the task's stored status, from its declared checks, or from board-derived
   `blocked`; rendering the task title, description or status here, which is
   `0265.10`/`0265.13`'s `run` block; widening the served answer with the
   document's `checks` to sharpen the `checked` wording; adding a queue or
   close-intent fact to `Provenance` to make a stronger claim true.

5. **One shared root-taking auto-close resolution, three distinguishable
   outcomes, both existing consumers retained.** A single shared resolution —
   in `ctx-traits-io` or `ctx-traits-core`, reachable by the center without
   importing CLI-private code — takes an explicit repository root and a task
   document's own `auto_close`, and returns a result that keeps effective
   policy `Some(..)`, successfully-resolved absence `None`, and resolution
   failure apart. `resolve_auto_close_policy`'s override-then-default
   precedence (`task_proposals.rs:473-481`) and
   `EffectiveConfig::effective_auto_close` (`harness_config.rs:1588-1593`) are
   consumed, not reimplemented. Both existing copies are routed through it:
   `task_proposals::resolve_task_close_policy` (and therefore
   `evaluate_task_close`, `task_proposals.rs:578-584`) and the inline repeat in
   `tasks.rs:290-317`. Existing CLI behaviour stays observably unchanged, which
   means the `.ok()` error-to-`None` collapse survives as an explicit mapping
   at those two call sites rather than inside the shared resolution; any
   deliberate change to the `tasks.rs` cwd anchor is named in the work summary
   as its own correction rather than absorbed silently.
   Decided by the declared `harness_config` and `just test` checks over the
   shared resolution — document override winning over each config value in
   either direction, config-only, neither configured, and a malformed config
   surfacing as failure rather than `None` — and by the declared CLI `tasks`
   check keeping the retained consumer green.
   Excluded: a third copy of the resolution anywhere, including in the desktop
   or the center; a second TOML parser or a desktop-side `runtime.toml` read; a
   resolution that returns `Option` only and so cannot distinguish failure from
   absence; changing `AutoClosePolicy`, `close_disposition`,
   `evaluate_task_close`'s disposition semantics, or the queue's close path
   (`task_queue.rs:71-108`); making the CLI's existing failure text or exit
   behaviour differ without saying so.

6. **The layered config read takes the repository root explicitly instead of
   discovering it at the process cwd.** The shared resolution's config half
   reads through `harness_config`'s existing layer stack with the repository
   root supplied by the caller, so a center answering about repository B never
   bounds its ancestor walk with the root of wherever the center process is
   running (`harness_config.rs:5079-5156`; `repository.rs:12-32`, content
   Correction 8). Layer precedence, the global tiers, the
   `runtime.ts`/`generated/runtime.toml` resolution, the retired-source error
   and `CTX_CONFIG` behave exactly as they do today, and existing callers of
   `resolve_runtime_config`/`resolve_config_report` are observably unchanged.
   Read and parse errors are returned, never swallowed.
   Decided by the declared `harness_config` check with its `expect` guard, over
   scratch repositories: an explicit root resolving its own repo layer while
   the process cwd is elsewhere, `tasks.auto-close` merging from a repo layer
   as it does today (`harness_config.rs:8579-8613`), a malformed document
   erroring, and the existing config winners and doctor provenance unchanged;
   plus the declared `just test` check for every other caller.
   Excluded: changing what any existing caller resolves; a second layer stack,
   a second parser, or a bypass that reads one file directly; making
   `discover_repo_root` itself take a directory, which would change
   `worktree.rs` and the `root = "repo"` resolver — out of scope here; running
   Git from the center's request path.

7. **The three facts arrive through the one center-served selected-detail
   path, resolved off the model owner and anchored at the row's repository.**
   Worktree and merge provenance come from the selected-detail model `0257`
   and `0265.10`-`0265.12` landed. The effective close policy is served by
   widening `0265.2`'s landed claimed-task answer and its connection-worker
   path with goal 5's resolution, keeping that answer's existing non-GUI
   consumer (`ctx tasks show --session <id>`) as the second consumer of the
   widened field per the charter's parity rule; if the landed shape differs
   from that plan, the widening follows what actually landed. Board and config
   reads are anchored at the selected row's `repo_path` — never the center's
   cwd, never the desktop's — and an empty, relative, unusable or mismatched
   path is a typed refusal or error, which goal 4 renders as unresolved. The
   board authority is `FilesTaskBoard::open_read(..)` behind `TaskProvider`,
   called with the run's canonical key (`task_files.rs:269-289,787-856`);
   `task_board_cache` is not authority. All of it runs in the connection
   worker, the shape `Start` and `Control` already use
   (`center.rs:3278-3315,3380-3429`), never inside the sole model owner's
   request handling and never on gpui's UI thread.
   Decided by the declared `proof_center` check over the real socket — the
   effective policy answering from a scratch repository, a scratch board
   document and a scratch runtime document; the document override beating the
   config value; config-only; neither configured; a malformed config; a run
   claiming no task; a claimed key absent or skipped by the loader; an empty
   and a relative repository path — and by the declared `just test` check where
   the existing model-owner isolation coverage lives; plus the closing diff
   read for any read on the model owner, any UI-thread block, and any direct
   ledger, board, config, sidecar, cwd or cache read in the desktop process.
   Excluded: a second task or close-policy request; a second selected-detail
   protocol; an independent doctor-only parser; adding the policy to
   `CenterPublicRow`, `RunSummary` or any list answer; reading anything from
   the filesystem in the desktop process; a cwd fallback in any failure case;
   changing subscription semantics, the delta reducer or run controls.

8. **The block renders in the artifacts' shape, composed from the landed
   preview primitives.** A full-width block with internal gap 8 and bottom
   padding 20 (`tokens.md:71-84`; `reference/sessions.html:839-845`), heading
   first, then the three lines in `text-secondary` `#8b909c` at **sans 12** per
   rule 13 and `0265`'s Correction 1 — with the 11.5 appearances at
   `screens/sessions.md:47`, `tokens.md:62` and `reference/sessions.html:846-866`
   raised as one owner correction and never edited (content Correction 1).
   Goal 3's and goal 4's tinted forms are the only exceptions to the secondary
   tone. It is the last block in `0265.10`'s ordered body, after `0265.12`'s
   `slots` block and before the spacer and provenance footer, per rule 13. The
   named-block heading form comes from `0265.10`; a consequence line is the one
   new primitive, and it stops there.
   Decided by rendered-preview evidence for the position, gap, padding,
   family, size and tones, plus the closing diff read against
   `grammar.md:31-56,117-124`, `tokens.md:3-4,26-84`,
   `screens/sessions.md:36-49` and `reference/sessions.html:839-867`.
   Excluded: a second named-block or heading form beside `0265.10`'s; a
   key/value row here, which this block is not; any colour, size, spacing,
   family or weight literal at a call site; a corner radius, dot, pill, badge,
