scope = """
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the Traits screen's 380-wide preview column frame and its rule 13 block order; the `trait` block (identity row with its trust state, plus the lede); the `facts` block (`version`, `trust`, `digest`, `agents`); and the selection-triggered detail extension of `0267.1`'s landed typed capability that carries the facts a compact list row cannot, reachable by a non-GUI face.

- **The parent's corrections bind.** `0267`'s content corrections govern this leaf; Corrections 2, 5, 6, 8, 9, 10 and 12 are the ones it touches directly, and where this file restates one it does not narrow it.

- **This leaf resolves nothing about the library.** No manifest, family table, trust store, lockfile, `git`, cwd or clock read happens on the desktop side; no second inventory assembly, family aggregate, trust mapping, digest computation or subscription is created anywhere. The inventory, the trust document, the family aggregate and the typed trust presentation are `0267.1`'s and are consumed as landed.

- **Detail is a companion to the compact list, not a widening of it.** One selection produces one detail answer addressed by stable identity. Adding descriptions, agents or per-variant data to every list row, or rescanning the inventory to answer one selection, each fail this regardless of whether the wire line happens to fit.

- **Compose the landed vocabulary, do not duplicate it.** `0265.10`'s preview column frame and key/value row primitive and `0265.12`'s fact-block form are the shapes this column takes; `0265.1`'s token entry point and registered IBM Plex faces carry every dimension, size and colour. A Traits-private copy of any of them is a defect even when it renders correctly.

- **Every leaf here is `data:`.** The `placeholders` module has no call site in this column, and no literal from `reference/traits.html` — names, descriptions, `0.2.4`, `approved on this machine`, the truncated digest, `worker · smart ×2 · scribe` — is reproduced. The export is geometry authority only.

- Out of scope: the `variants` and `ports` blocks and the provenance footer (`0267.4`); the header and lockfile bar (`0267.2`); the section, rows, menu entry, repository scope, trust document loading, family aggregation and provenance resolution (`0267.1`); moving the TUI's Traits and Trust screens onto the served answer and deleting their two-second poll (`0267.5`); trait authoring; any new trust mutation on any face; the light theme; pencil work of any kind; and every shared primitive `0265` already built.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0267.1` — the repository-scoped library answer, its typed trust presentation, its family aggregate, its retained per-member records, its freshness event, its stable selection identity and the selection model this column follows. `0265.12` — the fact block the `facts` block takes, which carries `0265.10`'s 380-wide preview column frame, its key/value row primitive and its column order transitively (`0265.12` depends on `0265.10`). Neither `0265.10` nor `0265.12` is reachable through `0267.1`'s closure and a charter's `depends-on` is not inherited by its children (`modules/core/src/task/graph.rs:115-177`), which is why `0265.12` is named here. Bind to the desktop project, components and non-interactive command those tasks actually landed, not to a path guessed here.

## Done when

1. **The preview column opens with the two blocks in rule 13's order.** Selecting a trait renders a 380-wide column, padding `[18,22]`, whose first block is `trait` and whose second is `facts`, each a named block with a lowercase Mono 11 `text-muted` heading, 8px internal gap and 20px bottom padding. Identity precedes facts. The column frame, the key/value row and the block shape come from `0265.10`/`0265.12`'s landed primitives rather than from a Traits-private reimplementation. Geometry matches `reference/traits.html:613-744` and `tokens.md:80`; where the export conflicts with `grammar.md` on content, grammar governs. No repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented; it is decided by the bounded review in `validation`, walking `screens/traits.md:24-27` and `grammar.md:96-105` leaf by leaf, together with `just test` proving the shared code those leaves render through.

2. **The `trait` block renders the served identity, its trust state and the served lede.** One key/value row keyed `name`, `space-between` and vertically centred, whose value is the selected row's served aggregate display identity joined by the `·` separator to the trust word — the same identity `0267.1` renders in the list, not a nearby field this renderer picks for itself from id, package name or member `Trait.name`. Semantic colour applies to the trust word only: the identity and the separator are not state-coloured, per grammar rule 7. Beneath it the lede renders at full block width in Sans 11.5 `text-secondary` and is the declared default member's `Trait::effective_summary()` (`modules/core/src/trait/mod.rs:485-493`) as the served answer carries it — never raw `description` derived at the call site, never prose inferred from procedure topology, never the export's sentence. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served source, `just test` for the shared projection, and the bounded review for the rendering.

3. **The `facts` block renders its heading and its four rows in `screens/traits.md`'s order.** The `facts` heading renders even though `reference/traits.html:653-744` omits it — `screens/traits.md:27`, the parent and grammar's block-heading vocabulary govern that conflict (`0267` Correction 9). Rows are `version`, `trust`, `digest`, `agents`, each `space-between` with the key in Sans 11.5 `text-secondary` and the value in Mono 10.5 `text`; the export's 12px keys and its Sans values at `665-744` are the same class of conflict and are not copied. Only the `trust` row's value is state-coloured. `agents` is the declared `Agent.id` values in declaration order joined by `·`, taken from the served answer — never procedure-assignment counts, never `×`, never sorted or deduplicated — and a trait declaring none renders the row with the single data-derived value `none` rather than dropping the row or the block. Decided by `just test`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served agent projection, and the bounded review.

4. **Singular family facts come from the declared default member; trust comes from the aggregate.** For a multi-member family the `version`, the `digest`, the lede and the `agents` list are the family table's declared default member's, and a standalone package is its own representative (`0267` Correction 5). The `trust` word is `0267.1`'s conservative family aggregate under its precedence — blocked, then unreadable, then all verified, then partial, then moved, then unreviewed — never the default member's own verdict. This renderer selects no representative and computes no aggregate of its own: both arrive typed in the answer, so two faces cannot disagree and two variants cannot yield different agent lists for the same selection. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch standalone and multi-variant packages, `just test`, and the diff read for a renderer-side representative choice or aggregate.

5. **Every reachable trust state renders through the one shared presentation.** `trusted`, `blocked`, `partial`, `unreviewed`, `moved`, `unreadable` and `source-only` each render as a word with the semantic role `0267.1`'s typed presentation supplies — never a pill, badge, icon, dot, fill or corner radius, and never with the settled-good role applied to a state that is not settled-good. `trusted` is the only word this face renders differently from the TUI, and it comes from the same mapping site. No desktop-side `match` over verdict strings, no `TrustVerdict::display_name` call, and no revival of `read_store().unwrap_or_default()` semantics (`dashboard.rs:3737-3750`), which converts a trust-store failure into a document that reads as unreviewed. Decided by `just test`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch trust documents spanning the states, and the diff read for a second mapping.

6. **The digest row renders the full served canonical value, unchanged.** The canonical digest is a validated 71-character `sha256:<64 hex>` string (`modules/core/src/digest.rs:103-166`), and that entire string — the `sha256:` prefix and all 64 hex characters — is the `digest` row's value, rendered exactly as the served answer carries it. No shortening, truncation, ellipsis, re-casing or prefix stripping is applied, on this face or any other, and no new shared digest presentation is landed — the exclusions below forbid a second shortener. What fails this goal: copying CLI-private `short_digest` (`dashboard.rs:5531-5539`), which drops the `sha256:` prefix and keeps 12 hex characters for modal display only and is not reachable from gpui; reproducing the export's ellipsis-truncated `sha256:d778…cd53b`, whose `…` is outside grammar rule 3's closed glyph set; recomputing or fabricating a hash on the desktop side; and rendering the row blank. Decided by `just test` and the bounded review's leaf walk and diff read for a shortener or a desktop-side hash construction.

7. **Detail is selection-triggered, addressed by stable identity, and never rescans.** One typed detail request, response and refusal extend `0267.1`'s landed capability at the existing client boundary — not fields bolted onto `CenterPublicRow`, and not a `ModelCommand::Request` that puts blocking work on the sole model/SQLite owner's request path. The request carries the stable identity `0267.1` established — trait id plus canonical digest, plus member/default identity for a family — and never a list index. Answering one selection performs no whole-inventory rescan and retains the accepted repository scope rather than rediscovering from the center's or the desktop's cwd (`modules/io/src/inventory.rs:61-81` is the cwd-bound constructor this must not reach for). Nothing is fetched eagerly per row. Blocking work stays off gpui's UI thread; the response stays inside the 1 MiB wire bound (`center.rs:48-52`) or returns a typed failure, and never silently truncates a description or an agent list into a plausible complete answer. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for a rescan, an owner-path read or a UI-thread read.

8. **Every selectable row previews honestly, including the rows that have no facts.** A source-only selection renders from the only evidence that exists — its typed state and its authored source path (`modules/io/src/discovery.rs:63-68`) — with no invented version, digest, agents or prose, and with both blocks still present rather than silently absent. An unreadable selection renders its id, path and error as a failure without fabricating facts and without aborting the rest of the screen. A detail response that is typed missing, stale or refused renders as such and never silently attaches another member's facts. A detail failure or a center outage renders fail-loud: no blank success, no direct manifest or trust fallback, no last-accepted content presented as current, and no partial commit in which `trait` updates while `facts` does not. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch source-only, unreadable and refused cases, `just test`, and the bounded review.

9. **Freshness is event-driven and selection-scoped, and no stale response wins.** One transition, and only this one: an accepted `0267.1` library event marks the currently selected detail non-current, which issues one detail request scoped to that held selection's stable identity, and the column may present detail as current again only after a response whose stable identity matches that selection has been accepted. Nothing is presented as current between the event and that accepted response, and no detail is requested for any unselected row. This holds when a trust change alters what this column shows without moving the canonical digest — so the cache gate cannot be `(id, digest)` alone. No timer exists on any client and no filesystem-watcher dependency enters `ctx-traits-io`, which still depends only on `ctx-traits-core` and its existing third-party set (`modules/io/Cargo.toml:12-29`). A response whose stable identity no longer matches the current selection is discarded rather than committed, so a slow answer for selection A never replaces selection B's preview — the posture `apply_preview_results` already demonstrates (`dashboard.rs:1485-1501`). Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for a client timer or an ungated commit.

10. **The workspace is unmoved.** Root Cargo resolution, the root `Cargo.lock` and the existing gates stay gpui-free, the desktop project stays outside the workspace, and the TUI's existing dashboard projections stay green. Decided by `just test`, the declared dashboard projection check, and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no second manifest parse, inventory scan, family aggregate, trust mapping, provenance resolution or digest shortener is created; no CLI-private type is imported by the desktop; no desktop-side filesystem, `git`, cwd or clock read is added; no client timer or filesystem watcher is added; no `placeholders` call site enters this column; no export literal is hardcoded; the `variants` block, the `ports` block and the provenance footer are neither rendered nor half-rendered here; the TUI's direct preview reader at `dashboard.rs:3704-4019` and its two-second poll are `0267.5`'s to remove and are neither migrated nor preserved as a fallback here; no light-theme value is touched; no pencil artifact is edited; no trait authoring or trust mutation is opened; and no work belonging to `0267.1`, `0267.2`, `0267.4`, `0267.5`, `0266`, `0268`, `0269` or `0261` is done.
