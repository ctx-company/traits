validation = """
## Approach

Suggested route, not a boundary. No standalone desktop project, gpui source, desktop lockfile or desktop validation command exists at this HEAD — root `Cargo.toml` names no gpui member and `0256.1` is still `ready` — so no desktop path, module, component or command is named below. Discover each of them from what `0256`, `0265` and `0267.1` actually landed, and say in the work summary where the landed shape differed from what is described here.

**Reuse points, named by what lands them.** `0267.1`'s served library answer is the sole source of the aggregate display identity, the typed trust state and its presentation, the family aggregate with its precedence, the retained per-member records, the repository scope, the freshness event and the stable selection identity — consume all of it, derive none of it. `run::load_trait` is the decode/digest chokepoint returning the typed `Trait`, package root, source digest and canonical digest (`modules/io/src/run.rs:3744-3816`), reached only through the shared assembly `0267.1` extracted; no second manifest parse. `Trait::effective_summary` (`modules/core/src/trait/mod.rs:485-493`) is the one prose projection. Declared agent ids come from `trait_ref.agents.iter().map(|agent| agent.id.clone())` at that shared assembly boundary, preserving declaration order (`modules/core/src/trait/mod.rs:417-419`; `modules/core/src/trait/agent.rs:88-95`). `family_manifest::FamilyTable.default` is the representative authority (`modules/io/src/family_manifest.rs:23-35`) — never `variant_names()`, which injects the synthetic `default` selector for diagnostics (`family_manifest.rs:59-71`). `Digest` and its `sha256:<hex>` invariant (`modules/core/src/digest.rs:103-166`) is the digest authority; `short_digest` (`dashboard.rs:5531-5539`) is CLI-private and modal-only and is not it. `0265.10`'s preview column frame, key/value row and preview-footer primitives and `0265.12`'s fact-block form are the shapes; `0265.1`'s token entry point and IBM Plex faces carry every dimension and colour, so the export's hex values and its `[18,22]` padding appear as token roles at the call site rather than as literals. Center precedents: the typed client wrappers and the `Start`/`Control` shape — short owner-side resolution, blocking work in the connection worker (`center.rs:3278-3333`) — and the action timeout rather than the 2s stream timeout for a request that walks directories (`center.rs:48-53`). Client precedents: `apply_preview_results`' identity-matched commit (`dashboard.rs:1485-1501`) for the stale-response rule, and the TUI reducer's transaction boundary — stage, project the complete candidate, commit only on success, retain last-accepted behind an explicit stale marker, reconnect after a rejected candidate (`modules/cli/src/app/dashboard/worker.rs:254-415`) — which the preview inherits by being projected inside the same accepted model as the rows rather than by acquiring a second accepted model of its own.

**Edit order.**

1. **Read what `0267.1` landed** before writing anything: the shape of the served list row, whether it already carries the aggregate display identity and the effective summary, the typed trust presentation and its semantic roles, the stable selection identity, the freshness event, and how much of the detail boundary the prerequisite already put in place. Every step below depends on that reading, not on a guess. If the prerequisite already answers detail, this cut extends rather than introduces it.
2. **The typed detail request/response/refusal** in `modules/io/src/center.rs`, beside `0267.1`'s library capability: an arm carrying the stable identity, typed resolved, source-only, unreadable, missing/stale and refusal outcomes, an early-return dispatch branch so it never becomes a `ModelCommand::Request`, and the public client wrapper on the action timeout. The blocking half reuses the retained per-member records `0267.1` kept rather than resolving the inventory again.
3. **Retain what the detail needs at the shared assembly boundary** — `Trait.name` as the served identity requires, `effective_summary()`, and the declared agent ids in declaration order — only as wide as this cut and `0267.4` demonstrate a consumer for, per the parent's extraction rule.
4. **The desktop detail model** — request on selection change and on accepted freshness, keyed by stable identity, committed only when the identity still matches, cleared to a typed outage on failure, and projected inside the same accepted model as the rows.
5. **The two blocks** — the column frame and `trait` first, then `facts`, each composing the landed primitives, with the typed source-only, unreadable and failure renderings written alongside the resolved rendering rather than after it.

**What must be proven** (observations, not mechanics): over scratch manifests, family tables, trust documents, lockfiles and repositories only — a standalone package previewing its own identity, effective summary, version, digest, aggregate-equals-member trust and declaration-ordered agents; a multi-member family previewing the declared default member's version, digest, lede and agents beside the conservative aggregate trust, with the stable key distinguishing members that share an id; a trait declaring no agents rendering `none`; each reachable trust state rendering its word and role; a source-only selection rendering only from its typed state and source path; an unreadable selection rendering its error without fabricating facts or aborting the screen; a detail response that is missing, stale or refused; a trust change while a selection is held, altering the preview without moving the canonical digest; two rapid selection changes with the first response arriving last; a detail failure and a center outage; and a response at or beyond the wire bound. `modules/cli/tests/proof_center.rs` is the existing process-boundary suite and already exercises typed socket behaviour, snapshots, backpressure, reconnect and repository scope, which is why it is the declared home for the wire observations rather than a new binary. No test may assert on this repository's own trait set, `trait.lock` files or board.

**Desktop lane.** No repo-root command inspects a rendered gpui screen at this HEAD, so none is declared. Once `0256.1` has landed its documented non-interactive command, run it as additional proof and — if it is repo-root-relative, non-interactive and carries its whole verdict in its exit code — add it here verbatim rather than guessing at its name now.

## Watch

- **`grammar.md` and `screens/traits.md` are the specification; `reference/traits.html` is measurement.** Copy its width 380, `[18,22]` padding, 8px block gap and 20px bottom padding; do not copy its missing `facts` heading, its 12px fact keys, its Sans fact values, its ellipsis truncation or its `×`.
- **No design example is data.** `implement`, the example description, `0.2.4`, `approved on this machine`, the example digest and `worker · smart ×2 · scribe` are illustrations. A leaf rendering one of them is worse than an omitted leaf because it reads as evidence — and `approved on this machine` is not even the parent's trust word.
- **The trust word is coloured; the identity is not.** Rule 7 colours a value only when the value is a state. Painting `implement · trusted` entirely `ok`, or giving every state the settled-good role, both fail.
- **Seven states, one mapping site.** An implementation that renders only the all-good example is unfinished, and a desktop-side mapping is the capability-in-one-face defect even when it agrees with the shared one today.
- **`agents` is declarations, not assignments**, in declaration order, joined by `·`, with `none` when empty. Two different facts must not be blended into a string that looks like both.
- **The lede is `effective_summary()`, not `description`** — the same projection the list row uses, so the two cannot disagree.
- **Detail is selection-scoped.** No eager per-row fetch, no whole-inventory rescan for one selection, no blocking work on gpui's UI thread or on the center's model-owner request path, and no rediscovery from cwd.
- **No timer anywhere, and no watcher dependency.** Freshness rides `0267.1`'s accepted events; `(id, digest)` alone cannot gate it, because a trust change moves neither.
- **A late response for a previous selection is discarded, not committed.** The identity-matched commit at `dashboard.rs:1485-1501` is the precedent.
- **Fail loud, no silent staleness, no direct-reader fallback, no partial commit.** A blank digest, an invented short hash, an empty `facts` block presented as complete, or `trait` updating while `facts` lags each make the column lie. `read_store().unwrap_or_default()` semantics must not return.
- **No status dots, pills, badges, icons or corner radius in this column** — it is prose and key/value; radius 10 exists only on the window frame.
- **Sans is content, mono is machinery**: the lede is Sans 11.5 `text-secondary`; block headings, version, trust word, digest and agent handles take the mono treatment `tokens.md` names.
- **Fonts**: consume whatever `0265.1` resolved for IBM Plex Sans and Mono; a silent system-face fallback violates the tokens file. Dark tokens only.
- **No test may depend on committed repo content** — not this repository's trait set, its `trait.lock` files or its board. Scratch fixtures only; path/word/file-existence inventories are banned workspace-wide.
- **Workspace gate cost must not move**: gpui must not enter root resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing CI lanes. Do not declare a check forbidding the string `gpui` in `Justfile` or `.github/workflows/` — a separate desktop lane there is sanctioned. Rust is pinned to 1.97.1; isolate with `CARGO_TARGET_DIR=target` when a failure looks like a phantom "cannot find X".
- **The declared checks are workspace-side.** They prove the served detail capability and the shared code are green, the TUI projections did not regress, and the workspace stayed gpui-free; the rendered column is decided by the bounded review below and, once it exists, `0256.1`'s desktop command.

