content = """
Open the Traits screen's 380-wide preview column and render the two blocks that start it — `trait` and `facts` — over the repository-scoped library answer `0267.1` taught the center to serve, plus the selection-triggered detail answer that carries what a compact list row cannot. `screens/traits.md:24-31` orders the column `trait` → `facts` → `variants` → `ports` → footer, and grammar rule 13 puts identity before facts; this cut owns the column frame and the first two blocks, and `0267.4` owns the rest.

Every leaf in this column is `data:`. The shared `placeholders` module has no call site here, and a static export value is not data — the only placeholder leaves on the finished screen are the header's summary phrasing and `author trait`, both `0267.2`'s (`0267` content, Correction 9; `0267` validation).

Six grounded corrections the draft this file replaces did not carry.

**"Widens the served answer to carry the digest and the agents" is wrong about the digest and wrong about the shape.** `DashboardTraitRow` already carries `version`, `trust` and `canonical_digest` (`modules/cli/src/app/lifecycle_reporting.rs:1680-1739`), and `ResolvedTraitEntry` beneath it carries the same (`1509-1539`); what HEAD's assembly does not retain is `Trait.name`, the effective summary and the declared agents. More importantly the widening is not "add fields to every row". Parent Correction 10 binds the listing/detail split: wire lines are capped at 1 MiB (`modules/io/src/center.rs:48-52`), and full descriptions, agents, ports and per-variant detail belong to a selection-triggered detail answer that must not rescan the inventory. So this cut extends `0267.1`'s landed typed capability with a **detail** answer addressed by stable identity — not eager per-row fields, and not a second inventory scan.

**The lede is not `Trait.description`.** Parent Correction 5 fixes it as the declared default member's `Trait::effective_summary()`, which returns the authored `summary` and falls back to `description` only when none was authored (`modules/core/src/trait/mod.rs:355-360,485-493`). Rendering `description` directly silently discards every authored summary, and the same projection feeds the list row, so the row and the preview would disagree about the same trait.

**"The trait name with its ok-coloured trust word" implements one state out of seven and paints the wrong span.** Parent Correction 6's table is the complete reachable set for this screen — `trusted`, `blocked`, `partial`, `unreviewed`, `moved`, `unreadable`, `source-only` (`orphaned` is Trust-screen-only) — with `trusted` the only word that differs by face. Only the all-verified state is settled-good; `blocked`, `partial`, `moved`, `unreadable` and `source-only` carry other semantic roles. And grammar rule 7 colours a value only when the value *is* a state, so in `implement · trusted` the identity and the `·` are not state-coloured — the trust word is. The mapping is `0267.1`'s single shared typed presentation, consumed here; a desktop-side `match` over `TrustVerdict::display_name` (`modules/core/src/trait/mod.rs:289-299`) is the capability-in-one-face defect even when it renders correctly. For a family the word is the conservative aggregate under `0267.1`'s precedence — blocked, then unreadable, then all-verified, then partial, then moved, then unreviewed — never one member's verdict.

**Some selectable rows have no facts at all, and the draft assumed every one has all four.** A source-only authored package is exactly `{trait_id, source_path}` (`modules/io/src/discovery.rs:63-68`): there is no decoded `Trait`, so no version, no canonical digest, no agents and no prose exist for it. An unreadable row carries only id, path and error (`lifecycle_reporting.rs:1541-1551`). Both are ordinary list rows the parent requires to stay selectable (Corrections 2 and 12), so the detail API and this renderer need typed outcomes for them. Inventing a value for a fact that does not exist is worse than an omitted leaf because it reads as evidence; silently dropping the block makes "this package has no manifest" indistinguishable from "this block is unimplemented".

**`(id, digest)` cannot be the freshness signal, and the export's `agents` string is two defects at once.** The existing TUI cache gates on trait id plus canonical digest (`modules/cli/src/app/dashboard.rs:3704-3750`), but a trust approval or block changes what this column must show without moving any canonical digest, and a family's members all share an id, so the stable key needs member/default identity too. Freshness therefore arrives as `0267.1`'s accepted library event, selection-scoped, with no timer on any client. Separately, the export's `worker · smart ×2 · scribe` (`reference/traits.html:735-740`) counts procedure assignments rather than declarations and uses `×`, which is outside grammar rule 3's closed glyph set. Parent Correction 8 fixes `facts.agents` as the declared `Agent.id` values in declaration order joined by `·`; `Trait.agents` is a `Vec<Agent>` and `Agent.id` is its identifier (`modules/core/src/trait/mod.rs:417-419`; `modules/core/src/trait/agent.rs:88-95`), so the order is available directly and no sort or dedup is applied.

**The preview primitives this column composes are not reachable from this leaf's declared prerequisites.** `0265.10` owns "the 380-wide preview column's frame and order, the `run` key/value block, the provenance footer, and the key/value row and preview-footer primitives the later blocks and screens compose" (`0265.10` scope), and `0265.12` states its block "is the fact-block shape the four later screens compose (`facts`, `checks`, `variants`, `ports` all take it)" (`0265.12` content). `0267.3` declared only `0267.1`, whose closure runs `0265.5` → `0265.3` → `0265.1` and `0265.9` → `0265.8` and never reaches either; a charter's `depends-on` is not inherited by its children, since `derived_status` evaluates dependencies only for open leaves (`modules/core/src/task/graph.rs:115-177`). `0265.12` is added, which reaches `0265.10` transitively.
