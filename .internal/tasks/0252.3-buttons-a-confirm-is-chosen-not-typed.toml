   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib button_row`
3. Nothing that used typed confirmation regressed, including archive's
   release-dependents capability and the ModalHost exactly-once gate.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib`
4. Enter still quits both the run view and the dashboard — the initial-focus
   decision is load-bearing for this.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown`
5. The landing gate is green.
   `CARGO_TARGET_DIR=target just test-full`
6. The diff touches only `modules/cli/src/app/tui_kit.rs`,
   `tui_panes.rs`, `dashboard.rs`, `run_view.rs`, and `tui_demo.rs`.
   `git status --short` names nothing else.

Criteria 1-5 each carry a runnable command and a `[[checks]]` entry.
Criterion 6 is the one read-and-compare verdict — `git status --short`
carries its answer in output, not in an exit code — so it deliberately
carries no `[[checks]]` entry.

Run the steps in order; run the incremental build command declared at the
end of Step 1 and again at the end of Step 3 rather than building only at
the end, so a layering or exhaustiveness error surfaces next to the edit
that caused it. Then run the criterion commands 1, 2, 3, 4, 5 in that
order. Permit at most two targeted repair-and-rerun rounds in total; after
each repair rerun the failing command and every later one. Complete only
when all five criterion commands exit 0 and the diff stays inside the
allowlist.
"""

