schema-version = "0.2"
key = "0274.2"
title = "Wire the capped reviewer-light loop into implement-quick"
status = "draft"
raised = "2026-09-01"
content = """
Turn implement-quick into the Stage 0 experiment vehicle. Today the quick variant
(.ctx/traits/authored/implement/source/variant/quick/index.ts) is draft → implement →
commit, with no review loop and no diff baseline/capture steps at all. Extend it with:

1. The diff baseline and capture steps it currently lacks — the reviewer contract reads
   changedFiles against diffBase, so the light reviewer cannot run without them.
2. A capped loop — iterations: 3 — of implement → capture diff → one reviewerLight round
   per iteration, using the 0274.1 light-review step. Only light-review approval is success
   and exits the loop immediately. If the final permitted review still returns revise with
   blocking work, the run reports unresolved cap exhaustion: the cap never converts an
   unapproved result into approval, and no synthetic approved verdict is ever produced.
   Express this through the loop's iterations/onExhausted semantics
   (packages/cdk/src/sequence.ts; functional API loop.maxIterations in
   packages/cdk/src/functional/registrars.ts) — exhaustion is an honest unresolved exit,
   not a fabricated verdict.

Bump the trait version in trait.toml [package] and in source/index.ts
(cdk.defineTrait("Implement", { version })) together — the two must stay in sync — and
regenerate the committed generated/*/index.toml canonicals and trait.lock via
ctx traits build implement.

This is trait authoring only: no Rust runtime changes, no dispatch_preflight changes.
Dispatching the experiment itself — just implement-with implement:quick "<tasks>" — is an
owner step after landing.
"""
scope = """
## Decisions
- Only the quick variant's flow changes; basic and complex stay verbatim — the no-ceiling
  loop and its comment in basic are a standing ruling.
- The cap is 3 iterations, per the diminishing-returns grounding; the cap itself is never
  an approval and never a success signal.
- Quick's budget overrides in trait.toml ([variant.quick.budget]) are the outer stop and
  are not this task's to retune.
- Stage 1 (size triage and light/standard routing in basic) is a separate slice and out of
  scope here; this task only produces the evidence vehicle.
- Exact step symbols, slot names, and edit sequencing are the architect's call.
"""
validation = """
## Watch
- Registrar ordering constraint inside loop bodies: only container kinds that cannot carry
  the derived not(until) guard — flow.match and flow.parallel — are rejected when
  registered after loop.until in a loop scope (forbidPositionalUntil,
  packages/cdk/src/functional/registrars.ts); other containers get the guard composed
  automatically. Order the loop body so no match/parallel routing follows loop.until.
- Never hand-edit generated/ or trait.lock; both come from ctx traits build implement.
- Version stated in trait.toml [package] and source/index.ts must move together.
- No tests asserting on committed trait canonical content; the existing gates are the proof
  for a trait-package edit.
- Depends on 0274.1's reviewerLight role and light-review step — do not redeclare either.
- In a run worktree, isolate the build cache (CARGO_TARGET_DIR=target cargo …) before
  trusting a gate failure.

## Done when
implement-quick's flow is draft → diff baseline → capped (implement → capture diff →
light review) × ≤3 → commit tail, where light-review approval exits immediately and cap
exhaustion with unresolved blocking work is reported unresolved rather than approved; the
trait version is bumped in sync in trait.toml and source/index.ts; canonicals and
trait.lock are regenerated by ctx traits build implement; and the landing recipe
(just ts-build → ctx traits build implement) plus just test run green.
"""
[relations]
parent = "0274"
depends-on = ["0274.1"]

[[checks]]
name = "TS workspace builds"
command = "just ts-build"
timeout-ms = 900000

[[checks]]
name = "implement canonicals regenerate from source with no tracked drift"
command = "CARGO_TARGET_DIR=target cargo run -p ctx-traits-cli -- traits build implement && git diff --exit-code -- .ctx/traits/authored/implement"
timeout-ms = 1800000

