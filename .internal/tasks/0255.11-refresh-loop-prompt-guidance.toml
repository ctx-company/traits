content = """
## Dependency gate
Before any implementation edit, require the complete joined landed state of `0255.10` and every transitive dependency. Grounding was read-only at clean HEAD `fe94de9c`; no validation command ran and no file was edited. That baseline is not implementation-ready: `SequenceItem` has no prompt-scoped `intent` or `behavior`; `modules/core/src/model_view/compile.rs::frame_guidance` is root-only and infallible; `modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` supplies only root guidance; `resolve_declared_item` remains private in `modules/cli/src/app/preview.rs`; and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist. Stop before edits and report the first absent or materially different joined contract. Missing dependency work is a blocker, not permission to recreate it in this task.

Inspect the joined implementation and require exactly this exhaustive `0255.10` contract: canonical prompt fields and prompt-only validation/static rendering; fallible root-agent-ready-prompt `frame_guidance`; `IntentItemSource::ReadyPrompt`; shared additive replacement, scalar precedence, scoped require/avoid refusal, and rendering; canonical assigned-agent lookup; `resolve_declared_item` in `modules/cli/src/app/frame_prompt.rs`; private `ready_prompt`; all four `ResolvedFramePrompt` participation fields `assigned_agent_intent_participated`, `assigned_agent_behavior_participated`, `ready_prompt_intent_participated`, and `ready_prompt_behavior_participated`; shared `intent_block` and `behavior_block`; deterministic selector errors; and exactly one existing integration test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Any absence or mismatch stops implementation.

## Outcome
Resolve every admitted loop-bearing ready frame to the exact prompt declaration selected by the current runtime cursor. Effective guidance remains trait, assigned agent, then actual ready prompt. Additive identity remains group-or-axis plus canonical guidance ID; a more-specific occurrence replaces a broader occurrence at the specific layer's position; scalar behavior selects prompt over agent over root per axis; and a scoped require/avoid conflict introduced by agent or prompt scope is refused. `Agent.system` remains a separate transport channel.

The loop container contributes no guidance. Joined prompt-only validation already rejects `intent` and `behavior` on `loop` and every other non-prompt item. Runtime readiness already revisits the current declaration on each iteration and advances among loop-body declarations; this task only makes that exact declaration available to the shared composer. Do not add runtime expansion, transition, frame, ledger, persisted-state, or loop-cache behavior.

Broaden only path admission inside dependency-owned private `ready_prompt` in `modules/cli/src/app/frame_prompt.rs`. Preserve every empty, plain named-sequence, and branch-bearing form joined from `0255.9` and `0255.10`, and additionally admit:

- Live or historical paths: a non-empty `position_path` whose first segment is `kind = "procedure"`, whose last segment is `kind = "item"`, whose non-empty middle contains only `kind = "sequence"`, `kind = "branch"`, or `kind = "loop"`, and whose middle contains at least one `kind = "loop"`.
- No-session static-preview paths: a non-empty `position_path` containing only `kind = "sequence"`, `kind = "branch"`, or `kind = "loop"` and at least one `kind = "loop"`.

Return `Ok(None)` for non-`SequenceFrameKind::Step` frames and every malformed or excluded non-empty path, including every path containing `for-each` or `parallel`. For an admitted path, retain the joined source-index requirement, call unchanged `resolve_declared_item` exactly once, require `effective_kind() == SequenceKind::Prompt`, and return that exact declaration reference. The resolver's rightmost non-`item` owner rule already uses the owning named-sequence ID and local index while ignoring iteration metadata, so it resolves repeated direct leaves and leaves recursively nested below loop, sequence, and branch controls. Do not inspect prompt text, prompt evidence, `run_index`, loop guards, neighboring declarations, or globally match `item_id`.

The complete implementation allowlist is exactly `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`. Create, remove, rename, generate, or edit no implementation file outside those paths. The task rewrite changes only `.internal/tasks/0255.11-refresh-loop-prompt-guidance.toml`; implementation must not edit it or another task file.

## Symbol contract
In `modules/cli/src/app/frame_prompt.rs`, edit only the body of exact dependency-owned private symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve its exact signature, all prior path forms, source-index/error contract, single call to unchanged `resolve_declared_item`, and prompt-kind requirement; broaden only its structural admission predicate to the two loop-bearing forms above.

In `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only the body of exact existing symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Extend its schema-`0.6` fixture and assertions in place. Add no test symbol, helper API, support harness, capture framework, production hook, selector helper, or cache field.

No symbol is added, removed, renamed, or given a changed signature. The only edited symbols are unchanged-signature private `ready_prompt` and unchanged-signature test `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. Keep `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>` and `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged and reuse them. `resolved_frame_prompt` remains the common composition point for no-session preview, active and historical session preview, ordinary and refreshed CLI dispatch, speculative consumers, and MCP dispatch.
"""
scope = """
## Ordered work
1. Before touching `modules/cli/src/app/frame_prompt.rs` or `modules/cli/tests/proof_agent_intent_dispatch.rs`, run the dependency preflight in `content` against the complete joined landed state of `0255.10` and all transitive dependencies. Verify in order: canonical prompt fields and prompt-only validation/static rendering; core composition, precedence, conflict, rendering, and source contracts; CLI selector/composer and participation contracts; then the sole integration proof. Stop at the first absence or material mismatch. Do not recreate, rename, repair, or partially substitute dependency-owned work.
2. Edit `modules/cli/src/app/frame_prompt.rs` first. Change only the body of exact symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve joined empty, plain named-sequence, and branch-bearing admission. Add only loop-bearing live/historical `[procedure, (sequence|branch|loop)+, item]` paths and no-session `(sequence|branch|loop)+` paths, each with at least one `loop`; reject malformed, `for-each`, and `parallel` paths before the retained source-index requirement and one unchanged `resolve_declared_item` call.
3. Edit `modules/cli/tests/proof_agent_intent_dispatch.rs` second. Extend only the body of exact symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` using its joined scratch root, CLI and MCP harnesses, capture addressing, categorized-block extraction, marker checks, compatibility oracles, and system-channel assertions.
4. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`. Require exit 0 with exactly one passing integration test before proceeding.
5. Run `CARGO_TARGET_DIR=target just test-full`. Existing `Justfile:152-180` performs frozen pnpm installation, SDK and builtin drift checks, TypeScript formatting/typechecking/tests, Rust formatting and Clippy, workspace binary builds, and all workspace tests.
6. Run `git status --short` to inspect the complete worktree file list, then inspect `git diff -- modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs`. Substantively review the exact two-file implementation allowlist, retained prior paths, loop-only path admission, one structural lookup, repeated/current-leaf behavior, no accumulation, absent/empty guidance compatibility, static/ready source boundary, MCP participation, and `Agent.system` separation.
7. A dependency-gate failure, focused-test failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`, preserving that edit order when both need repair. After each repair, rerun the affected command and every later verification step in order. Complete only when both commands exit 0, the implementation diff remains inside the exact allowlist, and substantive review has no finding; otherwise stop and report the concrete dependency, test, scope, or review blocker.

## Focused proof
Within the sole test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, extend the joined schema-`0.6` fixture with a bounded loop whose body has distinguishable prompt leaves, including one direct loop-body prompt and one recursively nested prompt reached through loop plus sequence/branch structure. Arrange local indices and neighboring declarations so an incorrect top-level, loop-container, previous-leaf, later-leaf, or sibling lookup selects a marker that assertions reject. Item IDs may address captures, but prove declaration selection from structural positions and marker exclusion rather than global item-ID uniqueness.

Drive at least two real iterations with body leaf A followed by body leaf B. Require B to produce the typed verdict consumed by `until`: B0 returns the non-exit verdict in the first iteration, and B1 returns the exit verdict in the second iteration. Capture A0, B0, A1, B1, and the prompt after loop exit. Assert byte-identical categorized blocks for repeated captures of one declaration. Assert that every transition changes to the new leaf and excludes prior, sibling, container, and later markers, and that every effective marker occurs exactly once so guidance cannot accumulate.

For every applicable leaf, compare complete categorized intent and behavior blocks across no-session preview, active/session preview, real CLI dispatch, and real MCP dispatch. Static preview exposes each declaration once with structural loop segments and no synthetic iteration. Live and session captures expose only the current activation. Preserve and exercise root-agent-current-leaf order; prompt-local canonical-ID replacement; prompt-over-agent-over-root scalar precedence with broader fallback; pre-harness scoped-conflict refusal; prompt-only MCP participation; and ready-output source omission.

Include loop-nested absent-guidance and present-but-empty-guidance prompts and prove their joined bytes and all participation flags remain unchanged. Preserve and exercise joined top-level, named-sequence, branch, root-only collision, legacy compatibility, malformed-path, and later-control boundary assertions. Keep unique `Agent.system` text absent from categorized intent and behavior blocks and present only through established CLI `harness_argv`/system-prompt and MCP `mcp_harness_argv` channels.

Static attribution remains declaration-only. Loop-body prompt sources are `sequence:<body-id>/<item-id-or-step-N>` with one-based fallback numbering, no active/readiness claim, and no repeated source per runtime iteration. `preview_sequence_frames` already walks a loop body once in declaration order and never emits the loop container as a dispatch frame; do not change preview or static rendering.

## Reuse
`modules/cli/src/app/frame_prompt.rs::resolve_declared_item` remains the only structural declaration resolver. Its rightmost non-`item` owner rule already selects the owning named-sequence ID and local index and ignores loop iteration metadata. Exact reused signature: `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>`.

Keep exact reused signature `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged. Reuse its canonical assigned-agent lookup, `ready_prompt` reference, one core `frame_guidance` call, all four participation flags, one effective `intent_items`/`behavior_items` pair, and shared `intent_block` and `behavior_block`. Preserve model-visible ordering: categorized intent and behavior precede volatile frame input. Do not fork composition by preview/live state, iteration, or CLI/MCP transport.

Reuse `runtime_readiness::current_ready_item`, `path_for_nested_item`, `build_sequence_frame`, `complete_or_repeat_current_control`, `build_session`, and `next_sequence_frame` unchanged. The current cursor already selects `trait_ref.sequences[control_stack.last().sequence_id].sequence[control_stack.last().next_index]`. A live path already records leading `procedure`, one segment per active control frame, and trailing `item`; each loop segment carries the loop body's named-sequence ID, current local index, and `iteration_index`, while the trailing item repeats the local index and nearest loop iteration. Loop completion already increments `iteration_index` and resets `next_index`, and every accepted leaf causes `session.next_frame` to be rebuilt. Reuse the drive loop's frame-boundary `status`, session-pinned `load_trait_for_session` with source/canonical identity verification, `resolved_frame_prompt`, `drive_mcp_frame`, and `mcp_frame_prompt` flow unchanged. Active preview already uses `session.next_frame`; historical preview reconstructs the selected activation before calling the same composer. Refresh means current runtime assignment and current ready declaration, not hot-reloading edited trait guidance during a session.

No symbol is added or removed. The only edited exact signatures are `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>` in `modules/cli/src/app/frame_prompt.rs` and `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` in `modules/cli/tests/proof_agent_intent_dispatch.rs`; both signatures remain unchanged.

## Exclusions
Do not edit `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/preview.rs`, `modules/cli/src/app/drive.rs`, runtime readiness or transitions, control expansion/completion, frame builders, `SequenceFrame`, ledger or persisted session/state/wire models, trait/schema/validation files, static renderers, transport composers, CDK files, generated SDK files, harness argument construction, cache identity, or any task sibling.

Do not add or invalidate a loop cache. `pending_wave_cache`, wave manifests, and position digests apply only to `parallel` and authored concurrent `for-each`; `attempt_concurrent_wave` already bypasses them for `ControlKind::Loop`. Do not admit paths containing `for-each` or `parallel`; those controls belong to `0255.12` and `0255.13`. Do not implement retry or persistent/shared-session work owned by `0255.14` and `0255.15`.

Do not add a declaration resolver, selector helper, composer, renderer, participation helper, effective-string variant, path-normalization helper, cache field, compatibility shim, test helper, or test symbol. Do not inspect prompt text/evidence, `run_index`, loop guards, adjacent declarations, or globally unique `item_id`; expand loops in the selector; infer current leaves from declaration order; cache guidance at loop entry; accumulate guidance across iterations; replay loop execution in static preview; duplicate static sources per iteration; copy guidance onto a loop/sequence/branch container; or change static source grammar, ready-frame source omission, joined deterministic errors, categorized envelope ordering, root-only MCP omission, assigned-agent selection, or `Agent.system` transport.
"""
