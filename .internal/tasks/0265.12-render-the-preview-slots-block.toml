## GOALS — binding

1. **Rows are one per slot the selected run's committed evidence carries, in the
   ledger's own order.** The rendered row set is the slot refs present in the
   served selected run's committed `accepted_slot_values`, in the order that
   vector serves them — first-appearance order by construction
   (`frame_builders.rs:1063-1072`), durable in the ledger, identical after a
   restart. Each row's key is that ref's slot id, the served ref text with its
   `slot:` scheme stripped, rendered verbatim. A slot the run has never held a
   value for is not a row: its declaration is a trait fact the served detail does
   not carry and the desktop may not read. The evidence is the committed
   top-level mirror only; values and revisions staged in an active or held
   `parallel` branch buffer are runtime-isolated until the barrier
   (`runtime/state.rs:317-345`) and never render (content Correction 6).
   Decided by direct core tests over the shared row projection — no slot
   evidence, one slot, many slots, a slot written more than once appearing
   exactly once, arbitrary non-alphabetical ref ordering preserved, and a
   session whose control stack holds unmerged branch values whose refs must not
   appear — proven by the declared core and `just test` checks; plus
   rendered-preview evidence that the rows appear in the served order.
   Excluded: reading the trait, plan, board, worktree or any file from the
   desktop process to discover declared slots; rendering a declared-but-unwritten
   slot, which would require a center widening no goal here asks for; sorting
   alphabetically, by digest, by recency or by any desktop-local rule; a
   hardcoded slot id, an id allow-list or deny-list, or any filter reverse-
   engineered from the artifacts' three-row subset (content Correction 3); a
   top-N cap, "important slots" heuristic, or truncation — overflow is `0265.7`'s.

2. **No evidence renders no block.** A selected run whose committed evidence
   carries no accepted slot value renders no `slots` block at all — not a
   heading with no rows, not a placeholder line, not a zero count — matching the
   family convention `0265.5:316-330` and `0265.11`'s verdict block. When the
   selection changes, no previous run's rows survive into the new one.
   Decided by rendered-preview evidence for a run with no slot evidence
   rendering no heading and no rows, and for a selection change from a run with
   rows to one without.
   Excluded: an empty block, an "no slots" sentence, a `placeholders` entry —
   goal 7 keeps every leaf here `data:` — or a retained previous selection's
   rows.

3. **Each value is one fixed composition of served evidence, and the count means
   writes.** A row's value is mono 10.5 in the neutral value tone, composed of
   the lowercase word `filled` — the run holds an accepted current value for that
   slot — and, when the run's committed evidence carries at least one revision
   for that ref, a `·` separator per rule 2 and the segment `r<N>`, where `N` is
   the one-based count of that slot's committed revisions. A slot holding an
   accepted value with no committed revision — a seeded default
   (`transitions.rs:67-100`) or a pre-revisions legacy ledger
   (`story.rs:586-625`) — renders `filled` alone, with no separator and no `r`
   segment, because no write evidence exists to count (content Correction 5). `N`
   counts writes, not review rounds and not versions: revisions may be `replace`,
   `append`, `merge`, `set-field` or `increment`
   (`trait/procedure/model.rs:252-268`), and that meaning is stated where the
   projection is defined. `filled` is not one of rule 1's states, so the whole
   value takes the neutral `text` tone per rule 7; only goal 4's failure form is
   tinted.
   Decided by direct core tests over the shared value composition — no revision,
   one revision, several revisions, and a slot whose several revisions carry
   mixed write operations — proven by the declared core and `just test` checks;
   plus rendered-preview evidence of `filled`, of `filled · r<N>`, and of the
   neutral tone on both.
   Excluded: rendering `acceptance_order` as `rN`, which is a run-global stamp
   (content Correction 2); a desktop-local count (goal 5); the literal `r1` or
   any design example value; labelling a revision-less value `unfilled`, `r0`,
   `default` or blank; an `unfilled`/`empty` word for any row, since goal 1
   renders no row without a value; state-colouring `filled`; a dangling `·`; a
   dot, pill, badge or icon (rule 4, `grammar.md:39-47`).

4. **Broken slot evidence renders a fixed fail-loud row, not a silent one.** When
   a slot's latest committed revision has no accepted current value with the same
   ref and digest — the condition committed ledger validation reports as a
   contract violation (`ledger_contract.rs:1103-1147`) — that slot renders one
   row through `0265.10`'s key/value primitive: the key as in goal 1, and the
   value the lowercase literal `unreadable` in the danger tone, rule 1's failure
   sense. It is never dropped from the set and never rendered as `filled`. An
   unreadable selection, a failed detail response or a lost center render through
   `0265.10`'s inherited explicit stale and failure model, which this cut extends
   rather than duplicating.
   Decided by direct core tests over a session whose latest revision digest
   disagrees with its accepted value, and one whose revision has no accepted value
   at all, each producing the fixed `unreadable` row while the run's other rows
   render normally; plus rendered-preview evidence of that row in danger tone and
   of the inherited stale posture after center loss.
   Excluded: a second error, stale or failure presentation beside `0265.10`'s;
   dropping the row; falling back to the revision's `submitted_payload` or
   `prior_value` to reconstruct a current value; reading the ledger file, the
   worktree or a cache from the desktop process to repair the disagreement;
   silently rendering `filled` over mismatched evidence.

5. **Per-slot revision counting is one shared primitive, and the verdict helper
   consumes it.** The count goal 3 renders is produced by a single shared
   per-slot-ref revision counting primitive in
   `modules/core/src/procedure/stats.rs`, with
   `verdict_slot_rounds` retained as a consumer of it — keeping its suffix
   recognition, whatever `0265.11` corrected there, its per-slot-maximum
   aggregation and its `None` for absent coverage
   (`stats.rs:109-122`). If a prerequisite already extracted such a primitive,
   it is consumed rather than duplicated; the extraction is only as wide as these
   two consumers need.
   Decided by the declared `procedure::stats` check with its `expect` guard, and
   by the declared `just test` check keeping `RunSummary::from_session` and every
   other consumer of the helper green.
   Excluded: a counting implementation in the desktop or in a preview module; a
   second helper beside `verdict_slot_rounds`; changing its suffix recognition,
   its per-slot-maximum aggregation or its `None`-for-absent contract while
   extracting; changing `RunSummary`'s field shape or the center wire; a generic
   ledger-statistics layer built for consumers that do not exist.

6. **The block renders in the artifacts' shape, composed from `0265.10`'s
   primitives.** A full-width block with internal gap 8 and bottom padding 20,
   whose first child is the lowercase heading `slots` in mono 11 `text-muted`,
   followed by one full-width `space-between`, vertically centred row per slot:
   key sans 11.5 `text-secondary`, value mono 10.5, no corner radius. It sits in
   `0265.10`'s ordered body sequence after `0265.11`'s state blocks and before
   the position `0265.15` takes, per rule 13. The named-block form and the
   key/value row come from `0265.10`; what is new here is the fact-block
   composition — a block heading over a served list of key/value rows — and it is
   shaped for the later `facts`, `checks`, `variants` and `ports` blocks that
   name it (`0267.3`, `0268.3`) rather than for this screen alone.
   Decided by rendered-preview evidence for the position in the body sequence,
   the gaps, paddings, families, sizes and tones, plus the closing diff read
   against `grammar.md:49-72,117-124`, `tokens.md:26-84` and
   `reference/sessions.html:778-838`.
   Excluded: a second named-block, heading or key/value form beside
   `0265.10`'s; any colour, size, spacing, family or weight literal at a call
   site; a corner radius, dot, pill, badge, icon or fill inside the block; a
   component registry, design-system layer or generic screen framework — the
   extraction stops at the fact-block composition its two named consumers need;
   scrolling, clipping or fading this column.

7. **Every leaf is data, and no payload summary is invented.** Nothing in this
   block resolves through the `placeholders` module: `screens/sessions.md:45-46`
   tags the whole block `data: slot ledger`, and every rendered string is either
   a served id or one of the fixed words goals 3 and 4 bind. No row renders a
   summary of a slot's payload — no file count, no line count, no truncated
   value, no type name — because no served metadata says which slots would get
   one and the payload in question is untyped text (content Correction 4). The
   artifacts' `12 files` row, and their three-row subset and its order, are
   reported as owner corrections against `screens/sessions.md` and
   `reference/sessions.html`.
   Decided by the closing diff read showing no `placeholders` entry added, no
   payload parsing, no slot-id or schema-ref branch in the value composition, and
   no design example string; plus the work summary naming the owner corrections
   raised.
   Excluded: parsing `git diff --name-status` text or any other slot payload;
   branching presentation on slot id, title or schema ref; a value formatter
   registry; a `placeholders` entry for any leaf here; rendering `Slot.title`,
   which is a trait fact the served detail does not carry.

8. **The block commits atomically from center-served evidence, reads nothing, and
   polls nothing.** The rows join the selected compact row and the served
   selected detail under `0265.10`'s stable selection identity and staged-
   candidate transaction: a complete candidate is staged and committed only on
   success, the prior accepted model is retained only behind the inherited
   explicit stale marker, and a fresh complete snapshot is requested after
   rejection (`modules/cli/src/app/dashboard/worker.rs:254-415`). Heading and
   rows never commit separately, and a rapid A-then-B selection whose A responses
   arrive last leaves B's rows intact — no update ever combines one run's rows
   with another's. A slot written while its run is already selected becomes
   visible through the same served detail reconciliation `0265.11` landed, with
   no second request, no second protocol and no timer; if that landed path
   reconciles a verdict slot but not an arbitrary one, the gap is closed by the
   smallest widening of that same path, and its existing coverage is then updated
   to assert the widened contract, since a reconciliation the proof does not
   observe is not proven. A same-path widening is a sanctioned consequence of
   this goal, not a violation; it is named in the work summary. All reads fire
   from an explicit selection only, off gpui's UI thread through the landed
   desktop bridge. No rendered fact lives only in GUI memory: a finished run's
   block reproduces identically from ledger evidence after the application closes
   and reopens.
   Decided by rendered-preview evidence over out-of-order A/B selection, a
   rejected candidate, a detail failure arriving against a newer selection, a
   slot written while its run is already selected, the stale posture after center
   loss, no read fired for an unselected row or a hover, and a finished run
   identical after a restart; by the declared `proof_center` check observing that
   a slot written against an already-selected run reconciles through the one
