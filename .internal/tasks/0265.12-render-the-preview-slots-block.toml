  `review-verdict-1 · filled · r1`, `work-summary · filled` and `changed-files ·
  12 files` are one run's rows. A leaf that renders one of them for a run that
  does not carry it is worse than an omitted leaf, because it reads as evidence.
- **The ledger does not say which slots exist or whether they are filled.**
  `SlotRevision` has no declaration field, no filled flag and no per-slot ordinal
  (`runtime/state.rs:702-755`); declarations live in the trait
  (`trait/mod.rs:389-395`), current values in `accepted_slot_values`
  (`session.rs:1424-1460`). Three facts, three sources (content Correction 1).
- **`acceptance_order` is run-global and is never `rN`**
  (`transitions.rs:788-812`), and a revision count is a *write* count, because
  writes may be `replace`, `append`, `merge`, `set-field` or `increment`
  (`trait/procedure/model.rs:252-268`). Say what the number means where it is
  computed (content Correction 2).
- **A current value with no revision is normal, not a defect.** Defaults are
  seeded with no revision (`transitions.rs:67-100`), legacy ledgers carry none
  (`story.rs:586-625`), and committed validation deliberately does not require
  one (`ledger_contract.rs:721-727`). `filled` alone is its honest form; `r1`
  would be a fabrication and `unfilled` would be a lie (content Correction 5).
- **Unmerged parallel-branch values are persisted but withheld by contract**
  (`runtime/state.rs:317-345`; `ledger_contract.rs:3645-3665`). Walking every
  revision the file contains leaks a branch's writes past the barrier (content
  Correction 6).
- **Three example rows are not a selection rule.** The family they illustrate
