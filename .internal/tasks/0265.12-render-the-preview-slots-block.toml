content = '''
This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it wherever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

This cut inserts the Sessions preview column's `slots` fact block into the body
sequence `0265.10` parameterised, after `0265.11`'s state blocks and before
`0265.15`'s `landing` consequence block. Nothing about the preview frame, the
named-block form or the key/value row is rebuilt here: this is the first fact
block, and the composition it lands is what `0267.3` and `0268.3` take for
`facts`, `checks`, `variants` and `ports`.

`screens/sessions.md:36-49` fixes the position and tags the whole block `data:
slot ledger` — no leaf here is a placeholder. Rule 13 puts fact blocks after the
state blocks in a 380-wide column (`grammar.md:117-124`); rule 5 makes the
heading lowercase mono 11 `text-muted` (`grammar.md:49-56`); rule 7 makes keys
sans 11.5 `text-secondary` and values mono 10.5 `text`, "state-colored only when
the value IS a state" (`grammar.md:68-72`); rule 3 closes the glyph set and this
block needs only `·` (`grammar.md:31-37`); rule 4 keeps dots out of a key/value
column (`grammar.md:39-47`). The export measures exactly that: a full-width
column, gap 8, bottom padding 20, heading `slots` mono 11 `#585d68`, then
full-width `space-between` rows with sans 11.5 `#8b909c` keys and mono 10.5
`#d7dae0` values (`reference/sessions.html:778-838`).

Everything else in the artifacts is illustration. `review-verdict-1 · filled ·
r1`, `work-summary · filled`, `changed-files · 12 files` are one run's rows, not
a contract (`0265:117-122`). Seven corrections follow. Each is a place where the
draft this plan replaces stated something the ledger does not contain, and each
one, copied into the desktop, would have shipped a plausible lie about run
evidence.

## Seven corrections to the draft this plan replaces

**Correction 1 — `slot_revisions` does not record which slots exist or whether
they are filled.** The draft's central claim was that `Session.slot_revisions`
"records which slots exist, whether each is filled and at which revision, which
is exactly what the three example rows show". `SlotRevision` carries `slot_ref`,
`value_digest`, a run-global `acceptance_order`, optional operation, submitted
payload, prior value, source and command evidence, a position path and loop /
for-each coordinates (`modules/core/src/procedure/runtime/state.rs:702-755`).
There is no declaration field, no `filled` boolean and no per-slot ordinal.
Existence is a *trait* fact — `Trait.slots: Vec<Slot>`
(`modules/core/src/trait/mod.rs:389-395`) — and current value is a *session*
fact, `Session.accepted_slot_values: Vec<Value>` (`session.rs:1424-1460`;
`runtime/state.rs:180-244`), projected from authoritative `State`
(`session.rs:2620-2647`). Revisions are append-only write evidence beside them.
Goals 1 and 3 read each of the three from the source that actually holds it.

**Correction 2 — `r1` is not stored, and a revision count is a write count.**
`acceptance_order` is stamped once per accepted output across the whole run and
offset per output within one activation (`runtime/transitions.rs:788-812`), so
it is a run-global sequence number and never a per-slot `rN`. The only honest
`rN` is a one-based count of that slot's committed revisions — and what it counts
is *writes*, because a revision may be `replace`, `append`, `merge`,
`set-field` or `increment` (`modules/core/src/trait/procedure/model.rs:252-268`).
It is not a review round, not a semantic version and not a retry count. Goal 3
renders it with that meaning stated, and goal 5 puts the count in one shared
place rather than a second one in gpui.

**Correction 3 — "list each slot" has no served answer, and the three example
rows are not a selection rule.** The draft's Done-when said the block lists
"each slot". Declared slots live only in the trait, and the desktop may not read
the filesystem (`0265:53-66`); `Plan.slots` carries `Required |
PlannedProduced | Missing` with no current value
(`procedure/run/model.rs:194-216,343-369`); and neither `Slot`
(`trait/slot.rs:17-56`) nor `SlotRevision` carries a preview-visibility,
priority or presentation flag. Meanwhile the artifacts show three rows for a
trait family that declares nine — `changed-files`, `commit-message`,
`diff-base`, `draft`, `git-status`, `review-verdict-1`, `review-verdict-2`,
`stage-output`, `work-summary`
(`.ctx/traits/authored/implement/generated/basic/index.toml:63-110`) — in an
order that is neither declaration order nor its reverse, at a point in the run
where `diff-base` and `draft` also hold values. So the illustration cannot be a
rule, and no served metadata supplies one. Goal 1 binds the one rule the served
evidence can actually decide: a row per slot the run's own committed evidence
carries, in the order the ledger lists it. The unexplainable three-row subset is
reported as an owner correction, not reverse-engineered into a filter.

**Correction 4 — `12 files` is not in the ledger and has no served selector.**
`changed-files` is `schema:text`, described as raw `git diff --name-status`
names and change kinds (`generated/basic/index.toml:63-67`), not a typed file
list; no helper in the repository turns it into a count. Rendering `12 files`
would require both a new text-parsing presentation (empty text, trailing
newline, rename and copy records, malformed lines, singular at one) and, worse,
a rule saying *which* slots get a payload summary instead of the evidence value
— metadata that does not exist. Hardcoding the slot id or sniffing the schema
would fail for every other trait and would violate the no-example-literals rule.
Goal 7 excludes payload summaries from this cut entirely and reports the row as
an owner correction against the design. That leaves the draft's own Done-when
intact: it asked for filled state and revision, never for a file count.

**Correction 5 — a current value with no revision is real, and `filled · r1`
would lie about it.** Slot defaults are pushed straight into
`accepted_slot_values` with source `TraitConfig`, `acceptance_order = None` and
no revision at all (`runtime/transitions.rs:67-100`), and ledgers written before
revisions existed deserialize with an empty revision vector — which is why the
shared story builder keeps an explicit legacy accepted-value fallback instead of
fabricating history (`procedure/story.rs:586-625`). Committed ledger validation
deliberately runs with `require_revision_for_value = false`
(`ledger_contract.rs:721-727,1103-1147`): every latest revision must match an
accepted value, but not every accepted value has a revision. Goal 3 gives that
case its own honest form — the value word with no `r` segment — rather than
calling it unfilled or inventing `r1`.

**Correction 6 — a naive revision traversal leaks values runtime deliberately
withholds.** Effects accepted inside an active `parallel` branch are staged in
`EffectBuffer`, documented as "never part of the committed ledger … until
merge", and round-tripped through the ledger only so a multi-call run can resume
mid-branch (`runtime/state.rs:317-345`). They are persisted, so walking every
revision the ledger file contains would put one branch's writes on screen while
its sibling is forbidden to see them, and runtime keeps recorded and
currently-visible traversals apart for exactly this reason
(`ledger_contract.rs:3645-3665`). The draft said nothing about it. Goal 1 binds
committed top-level evidence only.

**Correction 7 — a selection-time read cannot keep this block current, and the
draft named no mechanism.** Its prerequisite list stopped at `0265.10`'s
"selection-triggered reconstruction", but center deltas are `Appeared`,
`RowChanged`, `Ended` and `ActivityLine`, each carrying only a
`CenterPublicRow` of compact summary, repository, ledger, liveness and mtime
facts with no slot values or revisions (`center.rs:265-281,3778-3788`). A run
selected before a slot is written would sit stale forever. `0265.11` already
owns that reconciliation for the verdict block, through the one served detail
path with no second request and no timer (`0265.11:461-505,832-842`) — and it
also owns the numbered-verdict-ref correction to the shared revision counting
this block's `rN` consumes. Both are why this task now depends on `0265.11` as
well as `0265.10`: without the edge, `derived_status` would let the two cells run
concurrently against the same body sequence and the same counting surface
(`modules/core/src/task/graph.rs:115-177`). Goal 8 consumes that landed
reconciliation rather than adding a mechanism beside it.

## Grounded at HEAD 9f77cd3c7

Nothing this task renders exists yet. Root `Cargo.toml:1-12` lists only the
existing workspace crates and excludes only `packages/cdk`; no manifest or
lockfile names gpui; there is no desktop directory, no desktop recipe in
`Justfile` and no desktop lane in CI. The prerequisites `0265.10` and `0265.11`
are `ready`, not landed.

Every desktop path, module name, component name, symbol, signature, gpui API and
command named below is therefore a guess to be replaced by discovery against
what `0256.1`, `0265.1`, `0257`, `0265.10` and `0265.11` actually landed.
Binding them here would be fabrication. The desktop lane is nonetheless
guaranteed to exist when this cell runs, and the guarantee is a code fact: an
open leaf derives `Blocked` while any `depends-on` target is not `Done`
(`graph.rs:115-177`), and this task depends on `0265.10` → `0265.3` → `0265.1` →
`0256.1`. The first act of this cell is to locate that lane's documented
non-interactive command and record it verbatim in the work summary. If no such
command is found, the prerequisite chain has not in fact landed: stop and report
that, rather than substituting a workspace command for rendered-behaviour proof.
It is deliberately not declared as a `[[checks]]` entry, because a check must
exist in the repository at the moment the plan is written and this one does not.

**Rendered-preview evidence**, the phrase the goals use, means two things taken
together: the landed lane's documented command, run as it exists and exiting 0;
and, for every outcome that command does not itself decide, the run's own
observation of the running frame and the composed element tree, by whatever
means that harness already supports. Which of the two decided which outcome, and
the mechanics used, are named in the work summary. Adding coverage inside the
landed harness is right where a goal needs it; standing up a second validation
lane beside it is not.

What *is* readable today is the data side, and the goals lean on it. A full
`Session` carries `accepted_slot_values` — value, digest, optional schema ref,
source, acceptance and producer evidence (`session.rs:1424-1460`;
`runtime/state.rs:180-244`) — beside append-only `slot_revisions`
(`runtime/state.rs:702-755`). `upsert_runtime_value` replaces a slot's current
value in place and pushes only a ref it has not seen
(`runtime/frame_builders.rs:1063-1072`, called from
`control_flow.rs:1948-1960`), so `accepted_slot_values` is in first-appearance
order — defaults seeded at run start (`transitions.rs:67-100`), then each slot at
its first write — and that order is what the ledger durably stores. It is the
only ordering evidence this block needs, and goal 1 uses it rather than inventing
a sort. `procedure::stats::verdict_slot_rounds` is the existing per-ref counting
and per-slot-maximum aggregation (`stats.rs:109-122`); goal 5 extracts the count
underneath it rather than growing a second one.

Two protocol notes for discovery rather than for binding. `center::get` today
returns the full `Session` with typed Missing/Session/Ambiguous results
(`center.rs:916-935`) but reads the selected ledger synchronously inside the sole
model owner (`center.rs:3649-3669`); `0257` and `0265.10` are expected to
establish the sanctioned off-UI selected-detail path, and this cut consumes it
rather than inheriting the blocking shape. And the center wire is bounded to
1 MiB per line, with full sessions returned only by `get`
(`center.rs:48-53`) — so this block projects compact rows from the already-served
selected detail and never asks for slot payloads in a list answer.
