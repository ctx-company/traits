## APPROACH — suggested route, not a boundary

### Discover before editing

None of the desktop side exists at the HEAD this plan was written against. Read
what `0256.1`, `0265.1`, `0257`, `0265.10` and `0265.11` landed; do not carry a
guess from this file into an edit.

- Find the desktop project from root `Cargo.toml`'s exclude list and the
  top-level listing, then its manifest, README, justfile or CI lane, for the
  documented non-interactive build-and-test command. Record it verbatim before
  any edit. If no such lane exists, the prerequisite chain has not landed:
  report that rather than substituting workspace commands.
- Read `0265.10`'s landed preview frame: how the ordered body sequence takes
  additional blocks, the named-block form, the key/value row's tone-carrying
  value segments, the selection transaction, and the stale and failure
  presentation to extend for goal 4.
- Read `0265.11`'s landed selected-detail reconciliation and whether it carries
  arbitrary slot evidence or only the verdict's; widen that one path minimally if
  goal 8 requires it, and update its coverage in the same move.
- Read `procedure::stats` for whatever `0265.11` left there — the suffix
  recognition it corrected, and whether it already extracted a per-slot count.
  Consume what exists; extract only what does not.
