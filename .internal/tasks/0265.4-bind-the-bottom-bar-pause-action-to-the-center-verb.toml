validation = """
## Watch

- **Through the center's verb, never driver-direct.** A desktop process that
  signals a run itself is the capability-in-one-face defect and bypasses every
  other subscriber. Nothing here touches `run_control`, holder metadata, a pid
  or a second transport.
- **Never optimistic.** The bar does not flip its state word on click, and not
  on `Acknowledged` either — an acknowledgement is the lock holder accepting a
  control byte, not the pause. A face that shows `paused` before the center has
  published it is presenting invented state as current.
- **Fail-loud over all six outcomes.** `Missing`, `Ambiguous`, `NotLive`,
  `Unverifiable`, `Refused` and client `Err` each terminate visibly. Three of
  the six is the draft's gap, and a swallowed result is indistinguishable from
  a successful one.
- **Results are scoped.** An async result that lands on whichever row happens
  to be selected is a lie about a different run.
- **No poll loop, no retry, no timer, no blocking work on gpui's UI thread.**
  `control` carries a 600-second timeout.
- **Stale is never current.** A control result must not make a stale accepted
  row look fresh; `0256.5` owns stale presentation.
- **Ghost text only**, closed glyph set, no corner radius inside the canvas, no
  fill, border, icon or spinner introduced to show a request or a failure.
- **No CLI-private import.** The TUI's control renderer is `pub(crate)` beside
  ratatui and says `stop`; match its semantics, do not copy it.
- **Workspace gate cost must not move**: gpui must not enter root resolution,
  the root `Cargo.lock`, `just test`, `just test-full`, or the existing CI
  lanes. Isolate builds with `CARGO_TARGET_DIR=target` if a failure looks like
  a phantom "cannot find X".
- **The declared checks are workspace-side invariants, not proof of this
  task's desktop behaviour.** They decide goal 8 and nothing else: the workspace
  stayed gpui-free and green. The bound action is decided by the desktop lane
  `0256.1` establishes, whose documented non-interactive command is resolved
  verbatim at dispatch and becomes declarable as a check on this task once
  `0256.1` has landed one. A green `just test` is never evidence that the
  `pause` binding works.

## Done when

- The desktop lane's documented non-interactive build-and-test command — the one
  `0256.1` landed, resolved verbatim by the mechanical rule in the plan text and
  named in the work summary — exits 0 with the `pause` action bound, and
  `0256.2`-`0256.5` and `0258.3`'s tests pass unmodified. If that command is
  absent from the repository at dispatch, this task is not done and is not
  attempted: the run stops and reports the owner correction against `0256.1`.
- That command's coverage shows: one press on a selected live row issuing
  exactly one background pause request carrying the canonical `session_id` and
  the center-supplied `repo_key`; the rendered state word identical before the
  press, after the press and after `Acknowledged`, changing only once the
  settled paused row is accepted by the existing reducer; each of `Missing`,
  `Ambiguous`, `NotLive`, `Unverifiable`, `Refused` and a client `Err`
  terminating visibly and distinguishably; a selection change between press and
  result attributing the result to the originating run; and the accepted delta
  observed both by the desktop reducer and by a
  second independent center subscriber.
- The closing diff read shows: no `run_control`, driver, pid or filesystem
  access from the desktop; no UI-thread `center::control`; no local mutation of
  the accepted model on click or acknowledgement; no second reducer, dispatch,
  result channel, paused-state mapping or notification framework beside
  `0258.3`'s and `0265.3`'s; no catch-all arm over `ControlResult`; no poll,
  retry or timer; no stale row shown as current; no unscoped async result; no
  change to the bar's geometry, tones, action order or separator; no
  `ControlAction::Resume` or center protocol change; no CLI-private import; and
  no frame-counter derivation.
- The declared root-resolution check exits 0.
- `just test` exits 0.
- The task commit touches no file under `.internal/docs/design/`, no
  sibling-owned screen region, and no center, core or IO semantics.
- `git status --short` is empty, the work is in one task-scoped commit, and the
  work summary names the desktop path, the exact desktop command, the `0258.3`
  dispatch and result surfaces reused, any owner correction raised against the
  design artifacts, and any deviation from the approach.

## Bounded refinement

Run the desktop command, then the root-resolution check, then `just test`. If
this task's cross-subscriber coverage extends the focused center proofs, run
`CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`
directly after the desktop command. Permit at most one targeted
repair-and-rerun round: repair one named defect, then rerun the failed command
and every command after it in that order. If a second round would be needed,
stop and report the exact failing command or the unmet observable boundary with
its evidence rather than iterating. That is the stop condition, not a judgement
call.
"""

