   with no colour, size, spacing, weight or family literal at a call site. No
   file under `.internal/docs/design/` is modified; an artifact that looks
   wrong is reported as an owner correction.
   Decided by the closing diff read against `screens/sessions.md:32-34` and
   grammar rules 1, 3 and 8, plus the task commit's own file list.
   Excluded: reshaping the bar, adding a fourth action, changing action order
   or separator; the `frame N of M` detail slot, which `0265.14` fills from the
   selected-run reconstruction
   (`.internal/tasks/0265.14-derive-and-render-the-frame-counter.toml:7-25`);
   any other region of the Sessions screen.

8. **The workspace does not learn about gpui.** Root Cargo resolution and the
   root `Cargo.lock` stay gpui-free, the desktop project is not a workspace
   member, and the per-round workspace gate stays green and unchanged in cost.
   Decided by the two declared checks.
   Excluded: adding the desktop project to root workspace members; adding gpui
   cost to the existing macOS and Linux CI lanes
   (`.github/workflows/ci.yml:12-60`) — a *separate* desktop lane there is
   sanctioned; declaring a board check that executes the desktop lane before
