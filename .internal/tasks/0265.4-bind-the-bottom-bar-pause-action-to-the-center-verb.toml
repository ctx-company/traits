## APPROACH — suggested route, not a boundary

### Discover before editing

Nothing on the desktop side exists at the HEAD this plan was written against.
Read what actually landed; do not carry a guess from this file into an edit.

- `0256.1`: the desktop project location, manifest, lockfile and documented
  non-interactive build-and-test command. Use that command verbatim, per the
  resolution rule above; reusing its harness is suggested over standing up a
  parallel lane. If the landed project documents no such command, stop and
  report the owner correction instead of editing.
- `0256.4` and `0256.5`: the accepted snapshot/delta model, its transaction
  boundary and the stale-state presentation this bar must not bypass.
- `0258.3`: the background control dispatch, the action-result channel and its
  identity correlation, the failure presentation, and the paused/resume
  affordance. These are the reuse points for goals 1, 3, 4 and 6. If `0258.3`
  landed no reusable dispatch, the invariant that still holds is one background
  request with a UI-thread handoff of the typed result; extend `0258.3`'s
  surface rather than opening a second one, and report that in the work
  summary.
- `0265.1`: the token entry point. `0265.3`: the bar component's actual
  signature, its action shape and tone vocabulary, its `placeholders` module,
  and its live-aware state derivation.

### Edit order

1. Capture the press: the bar's action callback carries the selected row's
   canonical `session_id` and center `repo_key` into `0258.3`'s dispatch.
2. Consume the typed result on the UI thread through `0258.3`'s action-result
   channel, exhaustively over all six `ControlResult` variants plus `Err`,
   correlated to the captured identity.
3. Render feedback and failures through the presentation `0258.3` and `0265.3`
   already landed, with the accepted model untouched.
4. The focused proofs, including the second-subscriber observation.
5. The desktop command, then the two declared root checks.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like an action handler on the Sessions mount that receives the
bar's `pause` press, a request value carrying `(session_id, repo_key,
ControlAction::Pause)`, and a result variant on `0258.3`'s action-result type
carrying the originating session id beside the `ControlResult`. Names, module
paths and signatures follow whatever `0256`, `0258.3` and `0265.3` established.
Whether the identity is carried on the request/result pair or held in a
per-request registry is the run's call; either shape can satisfy goal 4.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- One press on a selected live row produces exactly one pause request carrying
  the canonical session id and the center-supplied repo key.
- The rendered state word is identical before the press, after the press and
  after `Acknowledged`, and changes only once the settled paused row is
  accepted by the existing reducer.
- Each of `Missing`, `Ambiguous`, `NotLive`, `Unverifiable`, `Refused` and a
  client `Err` ends visibly and distinguishably.
- A selection change between press and result attributes the result to the
  originating run, not the newly selected one.
- The accepted delta produced by a real pause is observed both by the desktop
  reducer and by a second independent center subscriber.
- `0256.2`-`0256.5` and `0258.3`'s own tests still pass unmodified.

### Reuse points

`ctx_traits_io::center::control` and `ControlAction::Pause` for the verb;
`ControlResult`'s six variants for the outcome vocabulary; `CenterPublicRow`'s
`summary.session_id` and `repo_key` for identity (`center.rs:3778-3788`);
`0258.3`'s background dispatch, action-result channel, failure presentation and
paused/resume affordance; `0265.3`'s bar component, action shape and state
derivation; `0256`'s accepted model, subscription and test harness. The TUI's
worker thread and exhaustive `control_message` are the *semantics* to match,
never code to import — they are CLI-private and their wording says `stop`.

### If something is red

Isolate with `CARGO_TARGET_DIR=target` before trusting a phantom "cannot find
X"; a shared cross-worktree target dir flakes gates. Rust is pinned to 1.97.1
(`Cargo.toml:14-20`). Keep any repair scoped to the one red command and
preserve every invariant named under Excluded.

