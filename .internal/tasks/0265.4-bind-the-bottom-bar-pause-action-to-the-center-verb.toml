content = """
This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

`screens/sessions.md:32-34` tags the bottom bar's right side `data: state +
verbs`, rendering `watch raw · pause`. `0265.3` lands that bar as
grammar-conformant ghost text with `watch raw` served from the `placeholders`
module and `pause` deliberately wired to nothing. This cut makes `pause` real:
pressing it sends the center's pause verb for the selected run through the
control surface `0258.3` lands, and the bar's state word changes only when the
center's own delta says the run is paused.

**The boundary with 0258.** `0258.3` owns the desktop pause/resume capability:
the shared center use, the durable frame-boundary pause, the restart-safe
resume, the failure presentation and the cross-subscriber center proofs
(`.internal/tasks/0258.3-pause-and-resume-durably.toml:6-21`). This cut owns
one connection: the Sessions bottom bar's `pause` action to that capability.
Standing up a second desktop control client, a second action-result channel, a
second paused-state presentation or a second resume interaction is duplication
of `0258.3`, not completion of this task.

## Four corrections to the draft this plan replaces

**Correction 1 — fail-loud covers six outcomes, not three.** The draft named
"refused, ambiguous or not-live". `ControlResult` is exhaustive over
`Acknowledged`, `Missing`, `Ambiguous(Vec<String>)`, `NotLive`, `Unverifiable`
and `Refused` (`modules/io/src/center.rs:826-834`), and transport or protocol
failure surfaces as the outer `Err` (`center.rs:878-902`). All five
non-acknowledged variants plus client error must terminate visibly. The center
already produces every one of them: exact ids beat prefixes, and zero, one or
many matches give missing, one or ambiguous (`center.rs:3887-3912`); a non-live
row is rejected before a driver is contacted, and a holderless or mismatched
live row is unverifiable (`center.rs:3397-3427`), with unit coverage over all
four (`center.rs:4487-4563`).

**Correction 2 — an acknowledgement is not the pause.** The draft's "the bar
reflects the resulting state as it arrives back over the subscription" is
correct but underspecified about `Acknowledged`, which proves only that the
live lock holder accepted the control byte. The real-process proof fails
outright if a `paused` delta appears inside the acknowledgement window, then
releases the current frame, waits for the ledger outcome, and only then
observes a `CenterDelta::RowChanged` whose `summary.last_drive_outcome ==
Some("paused")` (`modules/cli/tests/proof_center.rs:2781-2846`). So the bar may
render request feedback on acknowledgement, but its state word and its accepted
model must be unchanged until that later row is accepted by the reducer `0256`
landed.

**Correction 3 — resume is not a `ControlAction`.** `ControlAction` has exactly
two variants, `Interrupt` and `Pause` (`center.rs:240-245`); resume today is
`center::start_session(session_id, repo_key)` (`center.rs:857-876`), which is
how the pause proof resumes (`proof_center.rs:2849-2859`). The draft's "renders
whatever that surface exposes" therefore has a concrete floor: this cut
consumes whatever durable resume affordance `0258.3` lands and must not invent
a `ControlAction::Resume`, a second control byte or a center protocol change.

**Correction 4 — the TUI is not a free parity proof.** The draft called the TUI
dashboard "the parity reference". The TUI does demonstrate the correct
nonblocking pattern — a short-lived thread around `center::control` that sends
an action result back (`modules/cli/src/app/dashboard/worker.rs:140-160`) — and
its `control_message` distinguishes all six results
(`modules/cli/src/app/dashboard.rs:4971-4992,8670-8685`). But it is
CLI-private, its wording says `stop`, and no literal TUI-process pause proof
exists at this HEAD. Cross-subscriber observation must be demonstrated by
coverage this cut drives, not asserted from the existing center-side proof,
which exercises a plain client call rather than the Sessions bar.

## Grounded at HEAD 0cbd9326c

No desktop project exists yet: no standalone desktop or gpui manifest,
lockfile, source tree or command anywhere; root `Cargo.toml` excludes only
`packages/cdk` (`Cargo.toml:1-12`), and no manifest or lockfile mentions
`gpui`. `0256.1`, `0258.3`, `0265.1` and `0265.3` are all `ready` rather than
done. Every desktop path, module, symbol, signature and command named below is
therefore a guess to be replaced by discovery against what those tasks actually
landed; binding them here would be fabrication. What is checkable today, and
the only board coverage this task can honestly declare, is that the workspace
stayed gpui-free and its per-round gate stayed green.

That deferral is structural, not an omission, and the ordering that closes it
is code-proven. A parent derives `Done` only when every child is closed
(`modules/core/src/task/graph.rs:146-153`), and an open leaf is `Blocked`
while any `depends-on` target is not `Done` (`graph.rs:161-169`). This task
depends on `0258`, whose child `0258.3` depends on `0256`
(`.internal/tasks/0258.3-pause-and-resume-durably.toml:24-26`), and `0256` is
`Done` only once `0256.1` — the cut that lands the desktop project and its
documented non-interactive build-and-test command — is closed. So this task
cannot be dispatched before that command exists in the repository.

**Resolving that command is mechanical, not a judgement call.** It is not
chosen, invented or shaped by the run: it is the non-interactive build-and-test
command the landed desktop project itself documents, which `0256.1` closes on
("its documented independent build and test commands pass from a clean
checkout",
`.internal/tasks/0256.1-establish-the-standalone-desktop-shell.toml:15,17`).
Resolve it at dispatch by reading the landed desktop project's manifest and the
documentation `0256.1` landed beside it, and take it verbatim. If that project
documents no non-interactive test command, stop before editing and report it as
an owner correction against `0256.1`: authoring a parallel desktop lane is not
this cut's work, and reporting a desktop proof without having run that command
is a false report. The run names the resolved command verbatim in the work
summary, and it becomes declarable as a `[[checks]]` entry here the moment
`0256.1` has landed one. Declaring it before then would be a check that passes
while observing nothing.

**Which command decides what.** Every desktop behavioural clause in this plan —
goals 1 through 6 — is decided by that one resolved command and by nothing else;
the two declared `[[checks]]` decide goal 8 only, and goals 7 and 9 are decided
by the closing diff read. No clause below is decided by a command that this
plan leaves to the run's discretion.
"""
scope = """
## GOALS — binding

1. **The `pause` action issues exactly one center pause request for the
   selected run, off the UI thread.** A press on the bright ghost `pause`
   action, with a current live row selected, results in exactly one
   `center::control(session_id, Some(repo_key), ControlAction::Pause)` request
   (`center.rs:878-902`), dispatched through the background control surface
   `0258.3` landed. The identity comes from the selected `CenterPublicRow`: the
   canonical `summary.session_id` and the center-supplied `repo_key`
   (`center.rs:3778-3788`) — never a display prefix, never a key derived from
   the desktop process's cwd. Repeated presses while a request is outstanding
   do not multiply requests.
   Decided by the desktop lane's own non-interactive build-and-test command —
   the one `0256.1` landed, resolved by the mechanical rule above and named
   verbatim in the work summary — exiting 0 with coverage that a press on a
   selected live
   row produces that one call with those arguments; plus the closing diff read
   showing no UI-thread `center::control` and no direct transport.
   Excluded: any call into `modules/io/src/run_control.rs`, any driver,
   process-signal, lock-holder or ledger access from the desktop
   (`run_control.rs:564-636` already owns token-derived socket addressing,
   bounded IO and exact acknowledgement); a second transport or a second
   desktop control client; a blocking call on gpui's UI thread — `control` uses
   the 600-second action timeout (`center.rs:52-54`), so a UI-thread call is
   categorically unsafe; a new `ControlAction` variant or any center protocol
   change; spawn, interrupt and `watch raw`, which are not this cut's actions.

2. **Nothing optimistic: the state word changes only by accepted delta.** The
   accepted Sessions model and the bar's rendered state word are unchanged by
   the click and unchanged by `ControlResult::Acknowledged`. The paused
   presentation appears only after the normal subscription delta carrying the
   settled outcome is accepted by the reducer `0256` landed
   (`center.rs:1005-1088,265-281`).
   Decided by the desktop command, whose coverage must show the rendered state
   identical before the press, after the press and after an acknowledgement,
   and changed only once a `RowChanged` row carrying the settled paused outcome
   has been accepted.
   Excluded: a synthetic row, side channel or local mutation feeding the
   accepted model; inventing a `SessionState::Paused` — no such variant exists,
   and a paused row is status `awaiting-agent-output` with outcome `paused`
   (`center.rs:4566-4576`), with `DriveOutcomeKind::Paused` and
   `is_settled_pause` owning the settled-pause semantics
   (`modules/core/src/procedure/session.rs:1093-1232`); assuming the paused
   display word rather than consuming `0258.3`'s presentation and `0265.3`'s
   live-aware derivation; using `RunSummary.session_state`, which is projected
   with `live = false` (`modules/io/src/run_summary.rs:120-143`); a second
   reducer, subscription or accepted-row model.

3. **Every non-acknowledged outcome terminates visibly.** `Missing`,
   `Ambiguous`, `NotLive`, `Unverifiable`, `Refused` and a client `Err` each
   end the interaction with a visible failure, distinguished from one another
   at the type level with no catch-all arm. None leaves the bar looking
   unchanged, and none leaves it indefinitely pending.
   Decided by the desktop command's coverage over each non-acknowledged typed
   result and over a client error, plus the closing diff read showing an
   exhaustive match and no swallowed result.
   Excluded: a second notification or status framework beside the failure
   presentation `0258.3` and `0265.3` landed; any breach of rule 8's ghost-text
   grammar to show a failure — no fill, border, icon or spinner
   (`.internal/docs/design/grammar.md:74-84`); a retry, poll or timer loop; a
   copied or imported CLI-private result renderer.

4. **A result is scoped to the run it was issued for.** A selection change
   while a request is in flight must not attach run A's result to run B's bar;
   the result is correlated to the identity captured at press time using the
   action-result mechanism `0258.3` landed.
   Decided by the desktop command's coverage exercising a selection change
   between press and result, showing the result attributed to the originating
   run and not to the newly selected one.
   Excluded: a global "last action result" slot with no identity; a per-bar
   mutable flag that survives selection changes; making a stale accepted row
   look current in order to carry a result — visible stale state and
   fresh-snapshot recovery belong to `0256.5`, and subscriber queues are
   bounded at 64 with lagging consumers disconnected
   (`center.rs:65-70,1506-1515`).

5. **The effect is observable through a second independent center subscriber.**
   Coverage in the desktop lane drives the landed bar handler and shows the
   same accepted delta observed both by the desktop reducer and by a
   second independent center subscriber — one center subscription distinct
   from the desktop's own, not any other face of the system.
   Decided by that coverage, named verbatim in the work summary.
   Excluded: citing the existing `proof_center` pause proof as evidence that
   the bar is bound — it exercises a plain client call, not this handler;
