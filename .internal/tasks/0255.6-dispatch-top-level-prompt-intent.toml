content = """
## Outcome
Compose effective intent for an ordinary top-level prompt frame from root `Trait.intent`, the one canonical assigned `Agent.intent`, and only the canonical `SequenceItem.intent` represented by the current ready `SequenceFrame`, in that order. For each of `require`, `focus`, `avoid`, and `block`, preserve source order within each layer; when a more-specific layer repeats the same canonical `GuidanceItem.id` in that group, remove the broader occurrence and render the more-specific occurrence once at its own layer position with its own text and directive resolution.

After replacement, reject an effective canonical ID present in both `require` and `avoid` only when at least one surviving occurrence is assigned-agent- or ready-prompt-sourced. If a survivor is ready-prompt-sourced, report the deterministic ready-prompt scoped-intent error naming that ID; otherwise retain the dependency-owned assigned-agent error wording. Continue accepting a collision whose two effective survivors remain root-sourced, even when unrelated agent or prompt guidance participates. Compare canonical IDs only; prose, `focus`, and `block` do not enter contradiction detection.

Static ready preview, session preview, live CLI dispatch, and live MCP dispatch must consume one `ResolvedFramePrompt.intent_items`. Only an empty-path `SequenceFrameKind::Step` whose exact structural declaration is a prompt can contribute prompt intent. Earlier or later prompts, asks, commands, checks, project/control/terminal items, and every named or nested leaf are inert in this slice. Advancing between two top-level prompt frames must replace the prompt layer without stale entries. Ordinary categorized intent bytes remain dependency-owned; MCP receives the same categorized intent block when effective intent is non-empty and either assigned-agent or ready-prompt intent participates. Root-only MCP output and `Agent.system` delivery remain unchanged.

## Touched files
The complete implementation allowlist is `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs` only for dependency-owned `frame_guidance` test call sites, `modules/cli/src/app/frame_prompt.rs`, `modules/cli/src/app/preview.rs` only to import and consume the relocated declaration resolver, and existing dependency-owned `modules/cli/tests/proof_agent_intent_dispatch.rs`. Create, rename, remove, generate, or edit no other file.

## Dependency gate
Grounding was performed at clean HEAD `006693f2`; no files were edited and no checks were run because required implementation dependencies are absent. At that HEAD, `SequenceItem` has no `intent` field (`modules/core/src/trait/procedure/model.rs:914-948`), `frame_guidance` is root-only and infallible (`modules/core/src/model_view/compile.rs:511-544`), `resolved_frame_prompt` calls it without an assigned agent or prompt (`modules/cli/src/app/frame_prompt.rs:463-489`), and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist.

Before any implementation edit, require the joined landed state of ready dependencies `0255.2` and `0255.5`. Confirm `SequenceItem.intent`, prompt placement validation and static rendering, `IntentItemSource`, `effective_intent_groups`, fallible `frame_guidance(trait_ref, assigned_agent)`, exact canonical `assigned_agent` lookup, `ResolvedFramePrompt::assigned_agent_intent_participated`, shared `intent_block`, and `modules/cli/tests/proof_agent_intent_dispatch.rs` all exist. If any contract is absent, stop before edits and report that exact dependency blocker. If `0255.3` or `0255.4` has also landed, preserve its behavior model, participation flags, rendering, block order, tests, and proof composition unchanged.

## Symbol contract
In `modules/core/src/model_view/compile.rs`, extend dependency-owned private `enum IntentItemSource` with exact variant `ReadyPrompt`; retain its existing derives and `Root` and `AssignedAgent` variants. Change dependency-owned helper to exact signature `fn effective_intent_groups<'a>(root: Option<&'a crate::r#trait::Intent>, assigned: Option<&'a crate::r#trait::Intent>, ready_prompt: Option<&'a crate::r#trait::Intent>) -> crate::Result<[(&'static str, Vec<(IntentItemSource, &'a GuidanceItem)>); 4]>`. It remains the sole effective-intent authority. Overlay root, assigned, then ready prompt for all four groups, filtering broader same-group canonical IDs before appending each scoped list and retaining every survivor's source. If dependency `0255.4` supplied exact helper `fn layered_additive_guidance<'a, S: Copy>(root: &'a [GuidanceItem], scoped: &'a [GuidanceItem], root_source: S, scoped_source: S) -> Vec<(S, &'a GuidanceItem)>`, reuse it for each overlay. Otherwise use one local closure inside `effective_intent_groups`; add no second production helper symbol and do not copy filter/append logic between layers.

Keep the existing assigned-agent-only contradiction text exactly. When either conflicting effective survivor has source `ReadyPrompt`, return `crate::r#trait::Error::invalid_field("intent", format!("effective guidance id {id:?} cannot appear in both require and avoid when ready-prompt intent participates"))` converted to `crate::Error`. Otherwise apply the dependency-owned assigned-agent rule. Accept the collision when both survivors are `Root`, regardless of unrelated scoped items.

Change dependency-owned entry point to exact signature `pub fn frame_guidance(trait_ref: &Trait, assigned_agent: Option<&crate::r#trait::Agent>, ready_prompt: Option<&crate::r#trait::procedure::SequenceItem>) -> crate::Result<Option<FrameGuidance>>`. Read prompt intent only from `ready_prompt.and_then(|item| item.intent.as_ref())`. Treat no ready prompt, `intent: None`, and `intent: Some(Intent::default())` as non-participating. When neither selected agent nor selected prompt contributes any item across the four groups, execute the dependency-owned legacy root intent path unchanged. Otherwise call `effective_intent_groups` once and render its references through existing `format_guidance_group`, `format_guidance_item_element`, `resolve_guidance_directive`, `intent_builtin`, `sanitize_model_text`, and `leaf_element`. Preserve group order, canonical-ID comparison, source tracking, warning/normalization/finding handling, and all dependency-owned behavior resolution byte-for-byte.

Add exactly these five tests to the existing `modules/core/src/model_view/compile.rs` test module: `fn frame_guidance_ready_prompt_intent_merges_three_layers_in_group_order()`, `fn frame_guidance_ready_prompt_intent_replaces_broader_items_at_prompt_layer()`, `fn frame_guidance_ready_prompt_intent_rejects_scoped_require_avoid_collisions()`, `fn frame_guidance_ready_prompt_intent_accepts_root_only_collision_with_unrelated_prompt_scope()`, and `fn frame_guidance_ready_prompt_intent_is_byte_identical_when_prompt_is_absent_or_empty()`. The first covers all four groups plus no-root and no-agent cases. The second covers both root and agent replacement, one surviving occurrence at the prompt position, and prompt-local directive text. The third covers root-prompt and agent-prompt conflicts and exact conflicting-ID errors. The fourth keeps both conflicting survivors root-sourced while unrelated prompt guidance participates. The fifth uses non-empty root and assigned-agent guidance and compares exact post-`0255.2` output for no ready prompt, prompt `intent: None`, and prompt `intent: Some(Intent::default())`.

In `modules/core/src/model_view/compile_sections.rs`, edit no production symbol. In dependency-owned tests `fn agent_intent_is_static_agents_only_and_keeps_system_separate()` and `fn prompt_intent_is_static_declaration_only_with_sequence_sources()`, and only any other compilation-proven test call to `frame_guidance`, pass `None` as the new ready-prompt argument and unwrap the existing `crate::Result<Option<FrameGuidance>>` shape. Preserve every static declaration, source, sanitization, system-separation, and root-only assertion.

In `modules/cli/src/app/frame_prompt.rs`, relocate the existing resolver from preview with exact signature `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>`. Move its full structural-position contract comment with it. Keep its indexing unchanged: empty `position_path` uses `frame.sequence_index` in `procedure.sequence`; a nested path uses the rightmost non-`"item"` owner segment's named-sequence ID and local index. Never globally match optional item IDs.

Add exact private selector `fn top_level_ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Return `Ok(None)` for every non-`Step` frame and every non-empty `position_path`. For an empty-path `Step`, require `frame.sequence_index`, call `resolve_declared_item` exactly once, require `item.effective_kind() == ctx_traits_core::r#trait::procedure::SequenceKind::Prompt`, and return that reference. A missing source index, absent procedure, out-of-range index, or structurally resolved non-prompt is `crate::Error::Command` with a deterministic message identifying the frame/index failure. Do not scan declarations, use neighboring guidance, fall back to the first prompt, or match by `item_id`.

Edit dependency-owned `pub(crate) struct ResolvedFramePrompt` by adding exact field `pub(crate) ready_prompt_intent_participated: bool`. Keep exact resolver signature `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>`. Resolve dependency-owned `assigned_agent(loaded, frame)?` once and `top_level_ready_prompt(loaded, frame)?` once. Pass those same references to changed `ctx_traits_core::model_view::frame_guidance`, derive identity and `assigned_agent_intent_participated` from the same assigned declaration, and derive `ready_prompt_intent_participated` from the same prompt item. The new flag is true exactly when prompt intent has at least one item across `require`, `focus`, `avoid`, or `block`; no item, absent intent, and present empty intent set it false.

Keep exact signatures `pub(crate) fn frame_prompt(context: &ResolvedFramePrompt, schema: &Value, correction: Option<&str>) -> String` and `pub(crate) fn mcp_frame_prompt(session: &str, session_store: Option<&str>, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, context: &ResolvedFramePrompt, role: &str, harness_id: &str) -> String`. Keep ordinary `frame_prompt` placement and bytes unchanged and continue using dependency-owned `fn intent_block(intent_items: &str) -> String`. In `mcp_frame_prompt`, insert that same block immediately before `Resolved prompt instructions:` only when `context.intent_items` is non-empty and either `context.assigned_agent_intent_participated` or `context.ready_prompt_intent_participated` is true. Preserve agent-only MCP bytes established by `0255.2`, root-only MCP bytes, optional behavior blocks from `0255.4`, and intent-before-behavior ordering.

In `modules/cli/src/app/preview.rs`, import `resolve_declared_item` from `crate::app::frame_prompt`, remove its local private definition and contract comment, and leave `fn pending_inputs_for(loaded: &ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Vec<PendingInput>` calling the relocated helper unchanged. Add no resolver or prompt-selection logic.

In existing `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only exact test `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Reuse its one `ScratchRoot`, custom CLI and MCP capture harnesses, intent-block extraction, system-channel assertions, and frozen fixtures; add no second test, capture framework, or support API. Add a schema-`0.6` ordinary top-level sequence with two successively ready guided prompts and distinguishable root, selected-agent, first-prompt, second-prompt, unassigned-agent, and neighboring-item markers. Capture both static preview frames and both real CLI and MCP dispatches. At each position assert byte-identical complete intent blocks across preview/CLI/MCP, root-agent-current-prompt order, prompt-layer replacement count and text, absence of the other prompt and every unassigned/neighbor marker, and a stale-free first-to-second transition. Add a prompt-only scoped case proving MCP receives categorized intent without assigned-agent intent, and prove a prompt-scoped contradiction fails before its harness marker is created. Preserve the dependency's root-only collision, absent/empty assigned intent, and `Agent.system` assertions, and add prompt-free and present-empty-prompt frozen oracles for ordinary and MCP bytes.

The only removed symbol is local `modules/cli/src/app/preview.rs::resolve_declared_item`; it is reintroduced with `pub(crate)` visibility and the exact signature above in `modules/cli/src/app/frame_prompt.rs`. New symbols are `IntentItemSource::ReadyPrompt`, the five exact core tests, `top_level_ready_prompt`, and `ResolvedFramePrompt::ready_prompt_intent_participated`. All other named symbols are edited or reused as specified; no unnamed production helper is permitted.
"""
scope = """
## Ordered work
1. Run the dependency preflight before any implementation edit. Verify the joined `0255.2`/`0255.5` contracts named above, including the existing proof file and both dependencies' overlapping core/model-view changes. Record whether `0255.3` or `0255.4` is also present so its behavior composition remains untouched. Stop immediately if any required contract is absent.
2. Edit `modules/core/src/model_view/compile.rs` first. Add `IntentItemSource::ReadyPrompt`, generalize `effective_intent_groups` to three optional layers using dependency-owned `layered_additive_guidance` when present or one local closure otherwise, change `frame_guidance` to accept the canonical ready prompt, preserve the legacy no-scoped-intent path and behavior branch, and add exactly the five `frame_guidance_ready_prompt_intent_*` tests.
3. Edit `modules/core/src/model_view/compile_sections.rs` second. Change only compilation-affected test calls to pass `None` for ready prompt and unwrap the existing result; make no production change.
4. Edit `modules/cli/src/app/frame_prompt.rs` third. Move in `resolve_declared_item` with its contract, add `top_level_ready_prompt`, add `ready_prompt_intent_participated`, resolve one canonical agent and one canonical prompt in `resolved_frame_prompt`, pass both to core once, and extend only the dependency-owned MCP intent-block condition. Preserve any landed behavior composition. Then edit `modules/cli/src/app/preview.rs` fourth only to import the moved helper and remove its local copy.
5. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_ready_prompt_intent`. Do not proceed unless exactly five matching tests pass.
6. Edit existing `modules/cli/tests/proof_agent_intent_dispatch.rs` fifth, extending only `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible` with the two-position prompt fixtures, prompt-only MCP case, pre-dispatch contradiction, and prompt absent/empty byte oracles while reusing all dependency-owned capture machinery.
7. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`, then `CARGO_TARGET_DIR=target just test-full`, in that order. Finally inspect the complete diff against the five-file allowlist and every lookup, ordering, replacement, contradiction, compatibility, reuse, stale-state, and system-channel requirement.
8. A focused failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only allowlisted files and preserve their dependency order. After each repair, rerun the affected focused command and every later command in the strict sequence. Stop successfully only when both focused commands, the landing gate, and final substantive review pass; otherwise stop with the concrete dependency, test, or review blocker.

## Reuse
`modules/core/src/model_view/compile.rs::effective_intent_groups` remains the one effective-intent authority. Reuse dependency-owned `IntentItemSource` and exact `layered_additive_guidance` when `0255.4` has landed; otherwise keep the overlay operation as one local closure inside `effective_intent_groups`. Reuse canonical `GuidanceItem.id`, unchanged `intent_groups`, the dependency-owned legacy `format_intent` path, `format_guidance_group`, `format_guidance_item_element`, `resolve_guidance_directive`, `intent_builtin`, `sanitize_model_text`, and `leaf_element`. Do not copy validation, canonicalization, directive lookup, rendering, or contradiction logic.

`modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` remains the common resolver for no-session preview, session preview, live CLI, and live MCP. Reuse dependency-owned `assigned_agent` once for identity and agent intent, one relocated structural `resolve_declared_item`, one `ResolvedFramePrompt.intent_items`, and one dependency-owned `intent_block`. `runtime_readiness` and `build_sequence_frame` already carry the exact ready declaration's top-level `sequence_index`, empty `position_path`, prompt evidence, and assigned agent; static preview already uses that same frame builder. No runtime or wire field is needed.

Reuse only the existing `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible` proof, its `ScratchRoot`, custom CLI/MCP harnesses, block extraction, marker files, system-channel assertions, and frozen compatibility fixtures. The complete touched-file set remains `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/frame_prompt.rs`, `modules/cli/src/app/preview.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`.

## Exclusions
Do not edit runtime readiness, transitions, frame builders, `SequenceFrame`, persisted wire data, procedure/schema/validation/CDK/generated files, `modules/cli/src/app/drive.rs`, transport code, harness argv construction, `Agent.system`, `AgentRole`, `composed_system_prompt`, task files other than this one, or any file outside the five-file implementation allowlist. Do not create a file; the proof file must come from dependency `0255.2`.

Do not derive prompt intent from frame text, prompt evidence, `run_index`, global optional-ID search, neighboring declarations, first-prompt fallback, asks, commands, checks, project/control/terminal items, named sequences, or nested leaves. Do not add prompt intent to frames or persisted state. Prompt behavior belongs to `0255.7`/`0255.8`; named and nested dispatch belongs to `0255.9` onward; retries, branch/parallel siblings, loops, for-each, and persistent refresh belong to `0255.10`-`0255.15`.

Do not reorder root-agent-prompt layers, compare prose, involve `focus` or `block` in contradiction detection, reject collisions whose effective require and avoid survivors are both root-sourced, change the assigned-agent-only error text, normalize IDs again, clone renderers per layer or transport, or recreate categorized envelope bytes. Do not change ordinary frame bytes for absent/present-empty prompt intent, root-only MCP bytes, agent-only MCP bytes, optional behavior composition, or any CLI/MCP `Agent.system` channel.
"""
validation = """
## Done when
1. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_ready_prompt_intent` exits 0 with exactly five matching tests from `modules/core/src/model_view/compile.rs`. They prove three-layer order across all four groups including no-root and no-agent cases; root and agent replacement at the prompt position with one prompt-local directive; deterministic root-prompt and agent-prompt require/avoid refusal naming the canonical ID; accepted root-only collision while unrelated prompt scope participates; and exact equality with post-`0255.2` output for no prompt, absent prompt intent, and present-but-empty prompt intent using non-empty root and selected-agent guidance. Dependency-owned call-site adjustments in `modules/core/src/model_view/compile_sections.rs` remain covered by the landing gate.
2. `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch` exits 0 with the single extended `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible` test in `modules/cli/tests/proof_agent_intent_dispatch.rs`. It proves both projected top-level frames and both real CLI/MCP dispatch positions use byte-identical complete intent blocks; root-agent-current-prompt order and prompt replacement are exact; unassigned, neighboring, other-prompt, and stale markers are absent; prompt-only scope enables MCP intent; scoped contradiction fails before dispatch; prompt-free and present-empty-prompt ordinary/MCP bytes stay frozen; root-only collision remains accepted; and `Agent.system` remains on its established channel and outside intent.
3. `CARGO_TARGET_DIR=target just test-full` exits 0 after changes only to `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/frame_prompt.rs`, `modules/cli/src/app/preview.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs`. This landing gate performs frozen install, SDK and builtin drift checks, TypeScript formatting/typecheck/tests, Rust formatting and Clippy, workspace binary build, and all workspace tests.
4. Substantive diff review confirms only the needed subset of the five-file allowlist changed; `resolve_declared_item` moved without indexing drift; one fallible top-level selector gates exact empty-path `Step` declarations; one core authority overlays root-agent-prompt; contradiction source handling and legacy bytes are exact; preview/CLI/MCP reuse one resolved item string and envelope; no stale or unassigned guidance leaks; optional landed behavior stays unchanged; and every exclusion above holds. This judgment criterion intentionally has no `[[checks]]` entry.

Run verification strictly as `CARGO_TARGET_DIR=target cargo test -p ctx-traits-core frame_guidance_ready_prompt_intent`, then `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`, then `CARGO_TARGET_DIR=target just test-full`, followed by the substantive diff review. Permit at most two targeted repair-and-rerun rounds; after a repair rerun the affected command and every later command. Completion requires both focused commands, the landing gate, and review to pass; otherwise report the concrete remaining blocker instead of completing the task.
"""
