  create, name or format a task file, and reads no task file, board cache or
  `git`; it asks the center, exactly as it asks for everything else on this
  screen.
- **The title is the owner's.** No default, generated or placeholder title is
  ever sent. Client-side prevention of an empty title is welcome but does not
  replace exercising and rendering the provider's typed refusal.
