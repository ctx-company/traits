## GOALS — binding

1. **Activating `new task` collects an owner-supplied title in the bar and
   submits exactly one center-served creation, off the UI thread.** Activating
   the bright ghost action puts the bar into an in-bar title entry — ghost text,
   no modal, no chrome — and submitting a non-empty title issues exactly one
   creation request through `0266.3`'s public client helper, carrying that
   title, the active repository identity `0266.3` selects the board from, and
   `0266.1`'s canonical `draft` status, dispatched on the background action
   surface `0258`/`0266.3` landed. Activation is cancellable and returns the bar
   to the inert action.
   Decided by the closing diff read showing a single submit path that carries
   the owner's typed title and the active repository identity, with no
   UI-thread create call and no second transport; and by the landed desktop
   project's documented command exiting 0 with coverage that one submit produces
   exactly one such request.
   Excluded: sending a default, generated or placeholder title, or any title the
   owner did not supply; a desktop call into `TaskProviderMut::create`,
   `Board::create`, `FilesTaskBoard::open_read_write`, a task file, the board
   cache or `git`; a second center client, socket or protocol family; a blocking
   call on gpui's UI thread — the action timeout is 600 seconds
   (`center.rs:48-65`), so a UI-thread call is categorically unsafe; a modal,
   dialog, popover or overlay; any task mutation other than create; a new CLI
   command.

2. **One outstanding submit at a time, with no automatic retry.** Repeated
   activation or repeated submission while a request is outstanding issues no
   additional creation. After every terminal outcome — success, typed refusal or
   client error — the pending guard clears and the owner has a visible way to
   act again; the binding never acts for them.
   Decided by the closing diff read showing a guard that admits one outstanding
   request and clears on every terminal arm, with no retry, backoff, timer,
   interval or queue anywhere on the path; and by the desktop command's coverage
   showing repeated submits while one request is in flight producing exactly one
   request, and the pending guard observably cleared after a success, after a
   typed refusal and after a client error.
   Excluded: a retry, backoff, timer, interval or poll anywhere on this path; a
   queue of pending creations; a pending state with no exit; a permanently
   disabled action after a failure.

3. **Nothing optimistic: the draft appears only through the changed board
   answer.** The accepted board model is unchanged by the submit and unchanged
   by the success response. The new row appears in `Draft` only once the changed
   board answer `0266.3` broadcasts has been accepted by the reducer `0266.1`
   landed, and a refused creation produces no board update at all.
   Decided by the closing diff read showing the success arm writing nothing into
   the accepted board model and no row synthesised or `synced` claim made off the
   response; by the declared `proof_center` check, which holds `0266.3`'s
   broadcast-on-success and no-update-on-refusal unmoved; and by the desktop
   command, whose coverage must show the accepted model and rendered sections
   identical before the submit and immediately after the success response,
   changed only once the broadcast answer is accepted, and unchanged across a
   refusal.
   Excluded: inserting, synthesising or marking a row from the response; marking
   the board `synced`/current off the response; a second board request issued to
   observe the result; a poll, timer or re-request; re-deriving `draft` on the
   client from anything other than what the answer carries.

4. **Every typed refusal and every client error terminates visibly.** Each
   variant of `0266.3`'s landed creation result — invalid title, occupied board,
   unknown or ambiguous parent, and `0266.1`'s board-presence outcomes — plus an
   outer client `Err` for transport or protocol failure, ends the interaction
   with a visible failure in the bar, distinguished at the type level with no
   catch-all arm and no message-string parsing. The provider's empty-title
   refusal is exercised and rendered, not merely prevented client-side.
   Decided by the desktop command's coverage over each landed typed result
   variant and over a client error, each rendering a visible failure and
   clearing pending; plus the closing diff read showing an exhaustive match and
   no swallowed result.
   Excluded: client-side title validation standing in for the rendered provider
   refusal; a catch-all `_` arm over the landed result type; parsing a refusal
   out of a message string; a second notification or failure framework beside
   the one `0266.2`/`0258` landed; a fill, border, icon or spinner introduced to
   show pending or failure (`grammar.md:74-84`), or a glyph outside the closed
   set (`grammar.md:31-37`).

5. **Results are scoped to the board they were issued for, and the binding
   assumes no ordering between reply and broadcast.** A repository switch
   between submit and result must not attach the old board's success or failure
   to the new board's bar; correlation uses the repository identity captured at
   submit time and, on success, the created key. The pending affordance
   terminates whether the reply or the accepted board update arrives first, and
   also terminates if the request fails, the subscription goes stale, or the
   originating board is no longer the active one.
   Decided by the closing diff read showing the repository identity captured at
   submit time and compared before the result is applied, and a termination path
   that does not depend on which of reply or accepted update arrives first; and
   by the desktop command's coverage exercising a repository switch between
   submit and result, showing the result attributed to the originating board and
   not the newly active one, plus coverage of both arrival orders — reply first
   and accepted board update first — each leaving no residual pending state.
   Excluded: a global "last create result" slot with no identity; a bar-local
   flag that survives a repository switch; a path that only terminates on one of
   the two arrivals; leaning on the center's periodic scan as the success
   mechanism; making a stale accepted board look current in order to carry a
   result.

6. **The effect is observable through a second independent center subscriber.**
   Coverage in the desktop lane drives the landed bar handler and shows the same
   changed board answer observed both by the desktop reducer and by a second
   independent center subscription, so the creation is a center capability and
   not a per-face one.
   Decided by the declared `proof_center` check for the center half — that one
   creation still reaches every independent subscriber as a changed answer — and
   by the desktop command's coverage for the half `proof_center` cannot reach:
   that the answer arriving at the second subscriber was produced by the landed
   bar handler rather than by a plain client call.
   Excluded: citing `0266.3`'s own `proof_center` coverage as evidence that the
   bar is bound — it exercises a plain client call, not this handler; migrating
   the TUI listing or preview onto the served board, which is `0266.7`'s;
   introducing a third subscriber architecture; importing CLI-private dashboard
   code to obtain parity.

7. **The bar's grammar and geometry are untouched, and the entry affordance
   stays inside them.** No geometry, tone or glyph on the bar `0266.2` landed
   changes: 1px `border-soft`, padding [10,14], `space-between`, mono 11, the
   action bright ghost text with no fill, border or icon (`grammar.md:74-84`),
   the closed glyph set and no corner radius inside the canvas
   (`grammar.md:31-37`), semantic colour reserved per rules 1-2 with danger for
   failure only. The title entry, pending and failure presentations obey the
   same rules and introduce no Tasks-private palette. Every value comes from
   `0265.1`'s token entry point with no colour, size, spacing, weight or family
   literal at a call site. No file under `.internal/docs/design/` is modified;
   an artifact that looks wrong is reported as an owner correction.
   Decided by the closing diff read against `screens/tasks.md:24-25` and grammar
   rules 1, 2, 3 and 8, plus the task commit's own file list.
   Excluded: reshaping the bar, adding a second action, changing the separator
   or the left-hand provenance side; touching the light column of `tokens.md`;
   any other region of the Tasks screen — sections and rows (`0266.1`,
   `0266.6`), header (`0266.2`), preview (`0266.4`, `0266.5`).

8. **The workspace does not learn about gpui.** Root Cargo resolution and the
   root `Cargo.lock` stay gpui-free, the desktop project is not a workspace
   member, and the per-round workspace gate stays green and unchanged in cost.
   Decided by the declared root-resolution check and the declared per-round
   workspace gate check.
   Excluded: adding the desktop project to root workspace members; adding gpui
   cost to the existing macOS and Linux CI lanes — a *separate* desktop lane is
   sanctioned; declaring a board check that executes the desktop lane before
   `0256.1` has landed one.

9. **The pass is reviewed once and bounded.** The completed diff is read once
   against `screens/tasks.md:24-25`, grammar rules 1, 2, 3 and 8, the landed
   `0266.2` bar action API, the landed `0266.3` create helper, result type and
   board event, and the accepted board reducer `0266.1` landed, looking
   explicitly for: a desktop-side write, task-file, cache or `git` read; a
   UI-thread create call; a placeholder or defaulted title; a row or `synced`
   claim rendered off the response; a catch-all arm or parsed refusal string; a
   poll, retry or timer; an unscoped or ordering-dependent result; a pending
   state with no exit; altered bar geometry; and gpui entering root resolution.
   Exactly one targeted repair cycle is allowed, per the Bounded refinement
   section. The work summary names the discovered desktop path and command, the
   title affordance actually built (the parent leaves this to the run,
   `0266:66-70`), the `0266.2`/`0266.3`/`0258` surfaces reused, and every
   deviation from this approach.

## APPROACH — suggested route, not a boundary

### Discover before editing

Nothing this cut binds exists at the HEAD this plan was written against. Read
what actually landed; do not carry a guess from this file into an edit. If any
of these is absent, stop as an unmet prerequisite and report it rather than
implementing it locally — building the bar, the creation, the reducer or the
lane here is another cut's work.

- `0256.1`: the desktop project location, manifest, lockfile and documented
  non-interactive build-and-test command. Use that command verbatim, per the
  resolution rule above; reusing its harness is suggested over standing up a
  parallel lane.
- `0266.2`: the bar component's real signature, its action shape and callback,
  its tone vocabulary and the desktop failure idiom it renders through.
- `0266.3`: the creation payload, the public client helper, the typed
  success/refusal result, the repository-scope input, and the board event
  emitted on success. Names in that plan are provisional by its own statement
  (`0266.3:340-400`).
- `0266.1`: the accepted board model, its reducer and transaction boundary, and
  the canonical `draft` representation the request carries.
- `0258`/`0266.3`: the desktop background-action dispatch and its typed
  action-result surface with identity correlation, plus whatever typed text
  input primitive the desktop already has. These are the reuse points for goals
  1, 2, 4 and 5. If no reusable dispatch landed, the invariant that still holds
  is one background request with a UI-thread handoff of the typed result;
  extend the existing surface rather than opening a second one, and report that
  in the work summary.

### Edit order

1. The activation: the bar's action callback opens in-bar title entry, with
   cancel returning to the inert action.
2. The submit: capture the typed title and the active repository identity, guard
   against a second outstanding request, and dispatch through the background
   action surface with canonical `draft` status.
3. The result: consume the typed result on the UI thread, exhaustively, matched
   against the captured identity; render failure through the landed idiom and
   clear the guard on every terminal outcome.
4. The row: nothing — confirm the created draft appears solely through the
   accepted board answer, including when that answer arrives before the reply.
5. The focused proofs, including the second-subscriber observation and both
   arrival orders.
6. The desktop command, then the three declared checks in their declared order.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like an action handler on the Tasks mount receiving the bar's
`new task` activation, a bar-local entry state holding the in-progress title and
an outstanding-request marker, a request value carrying `(title, repository
scope, draft status)`, and a result variant on the action-result type carrying
the originating repository scope beside the landed create result. Names, module
paths and signatures follow whatever `0256`, `0266.1`, `0266.2` and `0266.3`
established. Whether identity rides on the request/result pair or in a
per-request registry is the run's call; either shape can satisfy goal 5.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- One submit of an owner-typed title produces exactly one creation request
  carrying that title, the active repository identity and canonical draft
  status; repeated submits while outstanding produce no second request.
- The accepted model and rendered sections are identical before the submit and
  after the success response, and change only once the broadcast board answer is
  accepted.
- Each landed typed refusal — including the provider's empty-title refusal — and
  a client error render visibly, distinguishably, and clear the pending guard.
- A repository switch between submit and result attributes the result to the
  originating board.
- Reply-before-broadcast and broadcast-before-reply both leave no residual
  pending state.
- The changed answer produced by a real creation is observed both by the desktop
  reducer and by a second independent center subscriber.
- `0266.3`'s center coverage passes unmodified under `proof_center`, and
  `0266.1`'s and `0266.2`'s desktop coverage passes unmodified under the
  resolved desktop command.

All coverage uses scratch repositories and boards with arbitrary keys; nothing
reads or writes this repository's committed `.internal/tasks`.

### Reuse points

`0266.3`'s public create helper, creation payload, typed result vocabulary and
board broadcast; `0266.2`'s bar component, action shape and failure idiom;
`0266.1`'s accepted board model, reducer and canonical `draft`; `0258`'s
background dispatch and action-result correlation; `0265.1`'s token entry point;
`0256`'s desktop test harness. The io-side primitives —
`TaskProviderMut::create`, `Board::create`, key allocation and slugification,
`WriteError::InvalidField`, `audit_journal::today_date_utc`,
`file_lock::try_lock_exclusive` — are `0266.3`'s to own and this cut's never to
call directly. The TUI worker's background-action shape
(`modules/cli/src/app/dashboard/worker.rs:119-160`) is the *semantics* to match,
never code to import: it is CLI-private and sits beside ratatui.

### If something is red

Isolate with `CARGO_TARGET_DIR=target` before trusting a phantom "cannot find
X"; a shared cross-worktree target dir flakes gates. Rust is pinned to 1.97.1
(`Cargo.toml:14-20`). Keep any repair scoped to the one red command and preserve
every invariant named under Excluded.

## Excluded — not cells here

- The creation capability itself: the protocol family, the hardened provider
  write, per-board serialization, the typed refusal vocabulary, the broadcast,
  and the TUI Split migration (`0266.3`).
- The bar's rendering, the header, provenance, digest and resolution instant
  (`0266.2`); canonical `draft`, the one-pass board answer, sections,
  navigation, selection and the accepted-model transaction (`0266.1`); the
  preview column (`0266.4`, `0266.5`); the row state stack (`0266.6`); the TUI
  move onto the served board (`0266.7`).
- Any edit under `.internal/docs/design/**`, and the light column of
  `tokens.md`.
- Center, core or IO semantic changes; any task mutation beyond create; a new
  CLI command; a second board subscription, reducer or client; a GUI poll loop;
  a blocking receive or create call on gpui's UI thread.
- A board check that executes the desktop lane. No such command exists in the
  repository today, so declaring one now would be a fabrication; the run
  executes the discovered command and reports its output in the work summary.
- Anything discovered beyond these goals: that is board material, not a cell
  here.
