content = '''
This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome and what decides it, plus what it excludes. The
APPROACH section is the architect's suggested route — discovery order, file and
symbol guesses, edit order, proof mechanics. Deviate from any of it whenever a
goal requires it, and report the deviation in the work summary; a deviation is
not a violation and needs no escalation.

`screens/tasks.md:24-25` renders the board bar as `synced ·
.internal/tasks @ <sha> | new task`, tagging `new task` as data that creates a
draft. `0266.2` lands that action as inert bright ghost text with no handler,
no modal and no write path (`0266.2:272-283`). `0266.3` lands the center-served
creation: one task protocol family over the board's own socket, hardened
`TaskProviderMut::create`, per-board serialization with a typed occupied
refusal, and an immediate board refresh/broadcast on success
(`0266.3:179-283`). This cut is the one connection between them, and the
failure and ordering behaviour that connection needs.

**The boundary with 0266.2 and 0266.3.** The bar's rendering, geometry and tone
vocabulary are `0266.2`'s; every write semantic — key assignment, title
validation, raised date, serialization, refusal vocabulary, the broadcast — is
`0266.3`'s, and that cut edits no desktop code (`0266.3:19-25,460-471`).
Standing up a second center client, a second board subscription, a second
reducer, a second refusal vocabulary or a desktop-side write is duplication of
those cuts, not completion of this one. The row form the created draft lands in
is `0266.1`'s and `0266.6`'s.

## Five corrections to the draft this plan replaces

**Correction 1 — the action has no payload, and collecting one is this cut's
work.** The draft says "press `new task`" as though the press were the whole
interaction. It is not: `0266.3` refuses an empty or whitespace-only title with
`WriteError::InvalidField` before writing, and no default or placeholder title
(`untitled`, `New task`) may ever be persisted (`0266.3:200-221`; parent
Correction 7). A press that sends no title therefore creates nothing. The
parent already ruled where the title comes from: an owner-supplied title
collected by "the smallest thing the screen's grammar already allows — ghost
text in the bar, no modal chrome, no corner radius inside the canvas", with the
cut that builds it naming what it built in its work summary, because the spec
does not decide it (`0266:66-70`). `screens/tasks.md:24-25` fixes no keyboard
gesture, focus API, pending form or failure wording, and
`reference/tasks.html:715-742` measures only the static bar. This is the one
rendering decision this charter leaves to the run; it is not a licence to
invent chrome.

**Correction 2 — a create response is not a rendered row.** The draft's "no
optimistic insertion" is right and incomplete. The stricter invariant: the
successful response itself changes nothing visible about the board. `0266.3`
invokes the single refresh/broadcast route on success, and the row arrives
because the accepted board answer changed (`0266.3:260-283`). Rendering a row,
or marking the board current, off the response is the same defect as an
optimistic insertion with an extra round trip in front of it.

**Correction 3 — response and board event have no guaranteed order.** Nothing
in `0266.3` orders the create reply against the broadcast it triggers; a
subscriber may accept the changed answer before its own reply returns. A
binding written as "reply, then wait for the event" is a latent hang. Request
result and accepted board update are independently ordered evidence: the
pending affordance must terminate on either arriving, and must also terminate
if the request fails, the subscription goes stale, or the originating board is
no longer the active one. The center's two-second scan is recovery, not the
success mechanism (`0266.3:142-154`), and must never be leaned on as one.

**Correction 4 — one refusal is really a typed set plus a client error.** The
draft says "a refused creation renders as a visible failure", singular.
`0266.3` lands invalid title, occupied board, unknown or ambiguous parent, and
`0266.1`'s absent/unreadable-board outcomes as distinct typed values in the
action-specific result arm, while a generic `ResponseResult::Error` means
transport or protocol failure only and surfaces as the outer `Err`
(`0266.3:244-258`; the existing split at `center.rs:794-905`). A top-level
desktop creation supplies no parent, but the landed result type is still
matched exhaustively rather than through a catch-all or a parsed message
string. All of them, plus the outer error, terminate visibly and clear the
pending guard.

**Correction 5 — correlation is per repository, not just per press.** The
create round trip runs against a board selected by repository identity
(`0266.3:179-198`), and the desktop can switch repositories while a request is
outstanding. A result attributed to whichever board happens to be active is a
lie about a different board. The identity captured at submit time — repository
scope, and the created key returned on success — is what the result is
correlated against, on the action-result surface `0258`/`0266.3` landed.

## Grounded at HEAD 9f3ceeb9e

No desktop project exists yet. Root `Cargo.toml` lists the existing workspace
crates and excludes only `packages/cdk` (`Cargo.toml:1-12`); `cargo metadata
--format-version 1 --no-deps` resolves no gpui package and the root
`Cargo.lock` has no `gpui` entry. `0256.1`, `0266.1`, `0266.2` and `0266.3` are
all `ready` rather than done: the center protocol is still run-only (`Request`,
`ResponseResult`, `CenterDelta` at `center.rs:90-212,268-284`), `TaskStatus`
has no `Draft` (`modules/core/src/task/mod.rs:22-31`), `NewTask` carries no
serde derive (`modules/core/src/task/provider.rs:85-103`), and `Board::create`
still writes without validating the title, without a raised date and without a
serialization lock (`modules/io/src/task_files.rs:331-389`). Every desktop and
center-task path, module, symbol, signature and command named below is
therefore a guess to be replaced by discovery against what those tasks actually
landed; binding them here would be fabrication. What is checkable today, and so
all this task declares, is `0266.3`'s center-side creation coverage under
`proof_center`, the per-round workspace gate, and a gpui-free root resolution
and lockfile. Two of the three are hardened past exit status with the `expect`
form sibling cuts already declare against the same commands — `test result:
ok\. [1-9]` on the `proof_center` binary, and a positive line from the
resolution check — so neither can pass while matching nothing (`0266.1`,
`0266.2`, `[[checks]]`). The workspace gate keeps exit status alone, because
`just test` has no single output line this repository has established as proof
mechanics.

That deferral is structural, not an omission, and the ordering that closes it
is code-proven. An open leaf is `Blocked` while any `depends-on` target is not
`Done` (`modules/core/src/task/graph.rs:161-169`), so this task cannot be
dispatched until `0266.2` and `0266.3` are closed. The board's own edges put the
desktop lane upstream of both: `0266.8` → `0266.2` → `0265.13` →
`0265.3`/`0265.2` → `0265.1` → `0256.1`, the task that establishes the
standalone desktop project and closes on "its documented independent build and
test commands pass from a clean checkout" (`0266.2:616`; `0265.13:565`;
`0265.3:415`; `0265.1:293`;
`.internal/tasks/0256.1-establish-the-standalone-desktop-shell.toml:15,17`).
By the time this cut is dispatched, the desktop project, its documented command,
the bar and the create helper all exist; at the HEAD this plan is written
against, not one of them does. Naming `0256.1` in this task's `depends-on` would
be redundant against that chain, so the relations are unchanged.

**What decides each goal.** Every behavioural goal below is decided by the
closing diff read against the surfaces `0266.1`, `0266.2`, `0266.3` and `0258`
actually landed — that read decides the properties visible in the code itself:
the captured identity, the exhaustive match, the absence of a UI-thread create
call, of an optimistic insert, of a defaulted title, of a poll or timer, of a
pending state with no exit — and, for the behaviour those structures produce
when run, by the landed desktop project's own documented non-interactive
build-and-test command. Goal 3's center half, goal 6's center half and the
"`0266.3`'s center coverage is unmoved" clause are decided by the declared
`proof_center` check and nothing else: it drives a plain client call, so it
never reaches the desktop lane. Goal 8 is decided by the declared workspace gate
and root-resolution checks; goals 7 and 9 by the closing diff read alone.

**The desktop lane has no declarable command yet, and this is the board-level
escalation.** No such command exists anywhere in the repository to name:
`rg -i 'desktop|gpui'` over the root `Justfile` matches nothing, `cargo metadata
--format-version 1 --no-deps` resolves no gpui package, the root `Cargo.lock`
has no `gpui` entry, and no sibling holds one — `0265.13`, `0266.1` and `0266.2`
declare workspace-side checks only, and `0256.1`, the task that *establishes*
the lane, states the condition outright: "no pre-existing exact desktop command
exists to use as a board check" (`0256.1:15`). A `[[checks]]` entry written here
now would either name a command that does not exist, failing on every dispatch,
or name a stand-in that exits 0 while observing nothing — worse than declaring
none. The run instead reads the landed desktop project's manifest and the
documentation beside it, takes the command it documents verbatim, runs it, and
names it in the work summary; reporting a desktop proof without having run it is
a false report, and authoring a parallel lane is not this cut's work. If that
project documents no non-interactive test command, the run stops before editing
and reports an owner correction against `0256.1`. When `0256.1` lands that
command (`0256.1:17`) it is added here verbatim as a fourth check, hardened with
an `expect` on the line that lane prints — a board edit in the pass that closes
`0256.1`, and the only thing about this plan that waits.
