content = '''
The visual charter (`.internal/docs/gpui-desktop-face-design.md`, 2026-08-28) adds four v1 screens after the plan document's item 3, and Merges is the last of them. It has no board representation: `0256`-`0260` are a one-to-one image of the plan document's items 1-5 and none of them renders a merge queue. This charter is that screen — the `Landing` / `Awaiting approval` / `Landed` sections, the landing bottom bar, and the selected-merge preview with its `merge`, `gates`, `sign-offs` and `landing` blocks and queue footer — built per `.internal/docs/design/screens/merges.md` on the vocabulary `0265` extracted while rendering Sessions.

This is the most placeholder-heavy screen of v1, and its whole difficulty is a boundary rather than a mechanism: which leaves are honestly derivable today, which are not, and where the design artifact grants an option. `screens/merges.md:5-10` opens with the governing note and then tags every leaf — the header summary, all three row forms, the bottom bar, the preview's `merge`, `sign-offs` and `landing` blocks and the queue footer are `placeholder:`; the `gates` block is `data:` with wiring "optional in v1, else `placeholder:`"; landed rows are `placeholder:` with wiring from the default branch's history that the note explicitly calls optional rather than required.

**This charter exercises both of those options in the artifact's placeholder direction, and that election binds.** The `gates` block and the landed rows are placeholder-served in v1. The artifact permits either resolution, so a charter that left both open would have two mutually alternative completion states and would authorise parser extraction, center work and presentation complexity that the screen does not need. Electing the placeholder form once, here, gives every child a single observable outcome. Wiring either region is later work, recorded below only as nonbinding guidance for whoever takes it.

The stop condition none of the children owns alone is that boundary drawn once and identically across both panes: everything the spec tags `placeholder:` served from the one shared module and structured for later wiring, both elected regions placeholder-served alongside them, and nothing rendered as data that the served evidence does not actually prove.

## How to read this plan

Goals and approach are separated, and only goals bind. `validation`'s Done-when list, together with the binding constraints and exclusions at the top of `scope`, is the contract; the corrections below bind only through the outcome invariant each one states.

The separation is plan-wide, not confined to the section titled "Suggested approach". Everywhere in this file — inside the corrections, the expected surfaces, the named reuse points, the item order, the closing review route — a named file, symbol, signature, call site, mechanism, command or proof mechanic is the architect's best guidance from the grounding at HEAD `6ddee0561`, never a boundary. Where the grounding names a route precisely, it is stated precisely so a child does not have to rediscover it; stating it precisely does not make it binding. A child that reaches a binding outcome by different files, different symbols, a different edit order, different commands or different proof mechanics is correct, and reports the deviation in its work summary. That report is neither a violation nor an owner escalation.

Proof mechanics are named only where the grounding shows them already occurring. What must be proven is stated; which fixture, matcher or literal output observes it is the run's call.

This charter lands no code of its own. Its work is the three children and the parent-level review that follows the last of them. A fourth implementation cut written against this file, instead of against the child that owns the leaf, is the failure mode to avoid.

## Grounded against HEAD 6ddee0561

The corrections below are the places where reading the design artifacts or the existing code naively produces a wrong screen, a dishonest leaf, or a child that over- or under-builds. Each one has two layers, and only the first binds:

- **The outcome invariant** — what must be true of the finished screen or the landed code. Every child inherits these. A child that silently guesses through an invariant has failed even where its own Done-when reads green.
- **The route** — the files, symbols, call sites and cheapest-known implementations named alongside it. These are guidance carried where the evidence for them sits, so a child inherits the reading rather than repeating it. They do not bind.

A note before them, matching what `0265`, `0266`, `0267` and `0268` record for their own families: all three children (`0269.1`, `0269.2`, `0269.4`) store `status = "draft"`, and `TaskStatus` is the closed stored set `ready|done|cancelled` (`modules/core/src/task/mod.rs:22-31`) whose `parse` rejects anything else (`mod.rs:208-220`), so `FilesTaskBoard::load` records the rejection and skips those documents (`modules/io/src/task_files.rs:186-250`). `0266` owns making `draft` representable; **this charter does not depend on `0266` and must not assume that support has landed.** Activating the children — whether by `0266` landing first or by each document being set to a storable status when it is dispatched — is board bookkeeping outside this charter's code scope. The missing numeric key `0269.3` has no semantic effect. No test may assert on this repository's own board, its own trait set or its own runtime document.

### Correction 1 — the umbrella claim is too broad: the merge queue is absent, the merge surface is not

The file this replaces asserts that "no merge-queue surface exists in the backend today" and then reasons from a wider claim than that sentence supports. The narrow claim is true: `modules/io/src/center.rs:89-153,198-208,267-281` carries no merge-queue request, response or delta type, and there is no queue-order, awaiting-approval, sign-off or queue-count store anywhere. The wider reading — that merges are unrepresented — is false and would make a child either rebuild what exists or dismiss reusable evidence. `ctx traits merge <run-id>` is a mature landing implementation (`modules/cli/src/app/merge.rs:1-16`), the dashboard already has a `Screen::Merges` (`modules/cli/src/app/dashboard.rs:167-195`) with merge, deep-merge, print-path and drop actions (`dashboard/keymap.rs:90-111`; `dashboard.rs:969-985`), and merge frames are durable ledger evidence.

The invariants:

- **The absent thing is named precisely: no merge-queue order, no awaiting-approval state, no sign-off record, no queue counts.** Every statement this screen's code or comments make about the gap says that, not "no merge surface".
- **What exists is reused rather than re-derived or contradicted.** Core `MergeFrame` and `MergeStatus::is_terminal` (`modules/core/src/session.rs:617-670`), `run::disposition_for_merge_status`, the terminal landed-revision extraction `task_proposals` already performs, and the center subscription reducer are the substrate. The existing TUI merge, deep-merge, print-path and drop behaviour stays first-class and unchanged.
- **The existing TUI Merges list is not this screen's queue and is not the model to copy.** `merges_from_center_rows` sorts by ledger modification time and stable ledger path, skips unreadable and non-terminal rows, and classifies the rest as `Mergeable`, `Parked`, `Failed` or `Landed` (`dashboard.rs:2505-2609`). Recency is not queue order, and none of those four classes means `landing now` or `awaiting approval`.

### Correction 2 — an active landing is not derivable, and the near-miss sources are named so nobody rediscovers them as a shortcut

The draft states the conclusion but cites only `RunSummary.landing`. Three other sources look like they carry liveness and do not, and a child that finds one of them without this correction will reasonably think the draft simply missed it.

- `RunSummary.landing` is durable **terminal** evidence — `landed|not-merged|parked|merge-failed`, and `None` for a mid-run, non-worktree or clean-tree completed run (`modules/io/src/run_summary.rs:48-60,169-186`; `session.rs:705-760`).
- `RunSummary` also carries `has_merge_frames`, `last_merge_status` and `last_terminal_merge_frame` (`run_summary.rs:48-69`). Non-terminal statuses such as `LockAcquired`, `GatesPassed` and `Reconciled` are durable **checkpoints**, not proof that a process is still landing — `MergeStatus::is_terminal` excludes them by construction (`session.rs:617-670`) — and a last non-terminal frame stays exactly as it was after a crash. Reading one as "landing now" produces a row that is permanently wrong.
- Live merge progress does exist, but only as a CLI-local `MergeLive` presentation sink over `ActivityEvent` (`merge.rs:44-96`; `merge_story.rs:24-161`), and the dashboard's own merge action explicitly supplies no live sink (`merge.rs:44-47`). It is a presentation channel for one in-process invocation, not a center-served queue lifecycle, and repurposing it as durable queue state is new backend semantics this charter excludes.
- **Merge frames carry no timestamps by contract** (`session.rs:1040-1066`). `CenterPublicRow.modified_epoch_secs` is ledger mtime (`center.rs:3778-3788`), not a typed landing time.

The invariant: **no leaf on this screen infers a queue position, a queue order, an active landing, an awaiting-approval state, a landing chronology or a landed-this-week count from center rows, run summaries or frame history.** The `Landing` section's membership, the bar's landing state word and its run-to-target detail, the awaiting-approval classification, the section counts stated by the header summary and the footer's `N pending · N landed this week` are all placeholder-served for that reason, and each is structured so a real queue capability can replace it later.

### Correction 3 — the `gates` block is placeholder-served in v1, and `0269.4`'s wire-wherever-reachable rule is dropped

`screens/merges.md:37-39` tags `gates` `data:` and then says, in the same sentence, "wiring optional in v1, else `placeholder:`". `0269.4`'s draft converts that into "wire it wherever the detail reaches a result, and take the optional exit only for what is unreachable". That is a narrower rule than the artifact states, and the backend does not support the shape it assumes.

- `[merge] gate` is an ordered list of arbitrary literal argv commands, **empty by default** (`modules/io/src/harness_config.rs:1280-1314,1484-1511`). The design's four rows — `cargo test`, `drift · embed`, `ts-format`, `worktree` — are an illustration from one repository's configuration, not a backend schema, and no tracked runtime document at this HEAD declares that exact set.
- Gate labels are **generated generically from argv** (`merge.rs:2428-2450`), and the runner records entries shaped `gate=<label> argv=<...> exit=<...> timed-out=<...>` with an optional `gate-output=<path>` (`merge.rs:2536-2736`). A run with an empty effective gate records an advisory and performs only the tracked-worktree cleanliness check (`merge.rs:2552-2556,2692-2733`).
- Results are not all-green. The existing evidence distinguishes passed, failed, timed out and signal termination (`merge_story.rs:878-894`).
- A landed run's compact `last_terminal_merge_frame` is normally the final `Merged` cleanup frame, while gate command evidence lives on an earlier `GatesPassed` frame. Reading only the compact terminal frame — which is what the current TUI preview does (`dashboard.rs:4277-4367`) — silently loses the green gate evidence it is trying to show.

The invariant:

- **The whole `gates` block is placeholder-served in v1, from the one shared module, structured for later wiring.** The artifact's optional clause is the authority for the election and this charter makes it once: no child reads, translates or renders gate evidence on this screen, and none extracts `merge_story::gate_rows` for it. The block's fixed heading and its row shape are ordinary interface structure (Correction 5); its content comes from the shared module. A child that reaches for gate evidence has widened its leaf, not satisfied it — the four design rows `cargo test`, `drift · embed`, `ts-format` and `worktree` are the illustration this placeholder renders, never a schema anything is matched against.

*Suggested, nonbinding guidance for whoever wires this block later, recorded here because the reading is expensive to repeat and binds nothing in this charter:* wiring is honest only if it inspects the ordered `provenance.merge_frames` history rather than the compact terminal frame alone; renders the gate entries the evidence actually carries, with their generated labels, in recorded order; renders passed, failed, timed-out and signal-terminated results each as themselves under grammar rule 1's semantic colour rather than a uniform `pass`; maps no argv label onto a design-named row; and renders a run with no declared gate as a defined empty or clean-tree-only form rather than four invented rows. It should also extract `merge_story::gate_rows`' pure parser and typed presentation (`modules/cli/src/app/merge_story.rs:405-411,811-895`) into shared core/IO and move the CLI report/story and TUI preview onto the extraction, since a second parser inside gpui would be the capability-in-one-face defect.

### Correction 4 — the title is data, the summary is the placeholder, and the example repository is never hardcoded

`screens/merges.md:19-20` tags the italic summary `placeholder:` and does **not** tag the title `merges — ctx-company/traits`. The draft's blanket treatment of the header as placeholder loses that distinction, and `0269.2`'s draft states the title as a placeholder-served string.

The invariants:

- **The title's repository component is data, rendered from the selected repository scope the center already serves** — `CenterPublicRow.repo_key`/`repo_path` (`center.rs:3778-3788`) — never from the desktop process's cwd, because ad-hoc repositories carry identities that `repo_key(root)` alone cannot reproduce.
- **The summary is placeholder in full**, phrasing and counts alike, because the counts it states are counts of the queue Correction 2 shows does not exist. Exactly one italic narrated summary line, per grammar rule 6.
- **`ctx-company/traits`, `run-1a2b3c`, `0257`, `wt-1a2b3c`, `7e90ad11`, `+27 −1`, `architect@1.4`, `security@0.9`, `@oskar`, `15:12` and `3 pending · 2 landed this week` are illustrations.** Where a leaf is placeholder-served, the illustration is rendered literally through the one shared module because these regions are intentionally design-faithful static content. Where a leaf is data — the title's repository, and any gate or landed evidence a taken option wires — an illustration must never stand in for the served value.

### Correction 5 — "no inline placeholder literals" governs placeholder facts, not every fixed interface label

The draft's rule reads as though every string on the screen must come from the shared module. Read literally it would route the section headings `Landing` / `Awaiting approval` / `Landed`, the block headings `merge` / `gates` / `sign-offs` / `landing`, and the bar's action words through the placeholders module — turning fixed interface chrome into fake placeholder facts and poisoning the very grep the rule exists to enable.

The invariant: **the shared `placeholders` module carries exactly the content a `placeholder:` tag authorises — the summary sentence, the example row content, the bar's state word and detail, the preview's `merge`, `sign-offs` and `landing` content, and the footer sentence — and nothing else.** Fixed labels required by `grammar.md` and `screens/merges.md` are ordinary interface text: block headings are mono 11 `text-muted` lowercase per rule 5, section headings are the design's own words, and `watch` / `hold` are action labels whose *behaviour* is the tracked no-op of Correction 8. Each placeholder entry is traceable to the tagged line in `screens/merges.md` that authorises it, so wiring a region later is a grep rather than an archaeology dig.

### Correction 6 — the export conflicts with the normative artifacts on three leaves, and each resolves toward the spec

`reference/merges.html` is the geometry authority and worth copying from for exactly that: the 1440×900 window, title bar 36, rail 260, main padding `[18,40,20,40]` gap 28, selected row padding `[8,12]` with row gap 4, bottom bar padding `[10,14]`, preview width 380 with padding `[18,22]`, block gap 8 and block bottom padding 20 (`reference/merges.html:24-30,93-99,261-264,298-365,615-663,665-815`; `tokens.md:71-85`).

Its content conflicts with the specification, and the specification wins in each case:

- **`landed` renders in `ok`, not neutral.** Grammar rule 1 assigns `ok` to settled good and names `landed` in its own list (`grammar.md:11-14`); the export renders the landed state word in `#8b909c` (`reference/merges.html:539-552`). Accordingly `landing` is `accent`, `awaiting approval` is `warn`, `landed` is `ok`.
- **The `landing` consequence lines are `→`-prefixed sans 12.** Grammar rule 13 states it (`grammar.md:117-124`); both `screens/merges.md:43-44` and `reference/merges.html:875-890` omit the glyph and the export uses 11.5px. This is the same conflict `0265` already resolved for Sessions, and it resolves the same way. `→` belongs to consequence lines and to the run-to-target description form; grammar rule 3 admits no arrow on an action label.
- **Every sign-off identity renders at its identity colour and 0.8 opacity**, including the owner's handle. `screens/merges.md:40-42` requires it and grammar rule 1 states the 0.8 rule for small mono handles; the export omits opacity on `@oskar` (`reference/merges.html:857-872`). The review agent renders in `review` purple by the same rule.

Two inherited export defects are already excluded and must not be reintroduced here: the rail's per-repository counts violate grammar rule 10, and the `ctx-logo-white.png` the export references is not tracked. `0265` owns both resolutions and Merges consumes them. `tokens.md:6-12` names IBM Plex Sans and Mono and the repository ships no font faces; `0265.1` owns that resolution and this screen must not silently fall back to a system face. `tokens.md`'s dark column is normative and the light column stays untouched. A further conflict found during implementation resolves the same way and is reported.

### Correction 7 — landed rows stay placeholder-served, because a landed frame proves less than the row draws

`screens/merges.md:8-10,28` permits landed rows to be derived from the default branch's history and calls it optional. The evidence that exists is narrower than the row the design draws: the terminal merged frame carries `landed=<revision>` (`merge.rs:2021-2029,2363-2383`) and `RunSummary.last_terminal_merge_frame` exposes it, which is enough for a real landed identity and revision. It is not enough for the row's relative landing time, its task-close claim, or the footer's weekly count — frames carry no timestamps (Correction 2).

The invariants:

- **Landed rows are placeholder-served in v1, exactly like the other two row forms.** The reachability of a revision does not convert the artifact's option into a requirement, and this charter elects the placeholder form so the three sections share one row implementation rather than two.
- **No new center capability is added for this screen.** A default-branch history capability is not built here, and neither is a diffstat one; the screen artifact requires neither and this charter's scope carries neither.

*Suggested, nonbinding guidance for whoever wires landed rows later:* the wired row can render only what the evidence proves — a defined partial form whose unproven leaves are absent or explicitly placeholder-tagged, never a plausible-looking landing time or task-close claim — and it must arrive through a center-served answer a non-GUI face can also reach, never a desktop-side `git` call.

### Correction 8 — the remaining placeholder regions, and why each stays one

Named so no child promotes one by finding an adjacent fact:

- **`merge` block.** A full session carries `merge_intent: Option<MergeRung>` for automatic standard/deep intent (`session.rs:268-275,523-534`), merge evidence records target revisions (`merge.rs:1098-1123`), and rows carry run, task and worktree identity. Those facts do not jointly prove an active landing, the current target mode of every manual merge, or the block's prose. It stays placeholder-tagged, as the artifact says.
- **Diffstats.** `+N −1` has no source: neither `RunSummary` nor `CenterPublicRow` carries additions and deletions, and the TUI computes changed paths and commit counts through Git rather than diffstats (`dashboard.rs:4370-4407`). Placeholder, and not a reason to add a served diffstat capability.
- **`sign-offs`.** No sign-off type or store exists anywhere under `modules/**`; the matches for "approval" are unrelated trust, procedure-loop and owner-input concepts. Every entry is shared-module placeholder content at Correction 6's colours and opacity, and sign-off rows carry no dots (grammar rule 4 excludes them explicitly).
- **`landing` consequence.** Merge really does fast-forward and remove the worktree and branch on success (`merge.rs:1-16`), but the sentence is tagged `placeholder:` and no single served fact proves every clause for the selected visual row. It is not promoted to data.
- **`watch` and `hold`.** Neither has a backing center verb. Both are tracked placeholder actions represented through the placeholders contract rather than left as untracked dead controls, and **pressing either must not appear to have changed anything.** Building hold semantics, a queue mutation, or any write path is scope expansion; this screen is read-only, and the TUI's existing merge, deep-merge and drop mutations are neither exposed here nor changed.

### Correction 9 — no selected-detail read is needed for v1, and today's `Get` path is not the sanctioned one anyway

With `gates` and the landed rows elected placeholder-served, the only data leaf on this screen is the title's repository component, which the compact subscription already carries (`center.rs:3778-3788`). **v1 therefore needs no full-session read at all.** The reading is recorded because a child may reach for one anyway: `center::get(session_id, repo_key)` returns the full core `Session` including all ordered `provenance.merge_frames` (`center.rs:916-935`; `session.rs:257-275`), but at this HEAD `Get` resolves the row and reads its ledger **synchronously inside `handle_request`** (`center.rs:3595-3605,3607-3669`), which is exactly the shape the plan document's posture forbids. The current TUI Merges preview does not use `center::get` at all: it derives gate rows from the compact row's last terminal frame and performs direct Git and worktree reads on selection (`dashboard.rs:4277-4367,4370-4407`), which is CLI-private and unsuitable for the desktop.

The invariants:

- **No child describes today's `Get` path as already satisfying the off-the-owner-path posture, and none consumes it as though it did.** `0257` and `0265` are expected to establish the sanctioned selected-detail path; if a child finds it genuinely needs selected detail despite the election above, it consumes what has actually landed by then and reports the deviation in its work summary.
- **Compact list rendering triggers no full-session, ledger, Git, store or sidecar read.** Reconstruction happens on selection only, off gpui's UI thread, and never while rendering rows.
- **Client refresh is event-driven with no timer on any client.** The center already owns a two-second reconciliation scan (`center.rs:65`); no GUI timer reads ledgers, Git, worktrees or gate output files.
- **Snapshot-then-delta transactionality is inherited from the landed TUI reducer** — stage the complete candidate, commit only accepted projections, clone accepted state before applying deltas, retain last-accepted only behind explicit stale text, reconnect after a rejected candidate (`modules/cli/src/app/dashboard/worker.rs:254-415,418-457`). No lost, duplicated or partially committed visible state.
- **Failure stays explicit.** A missing, ambiguous, unreadable, rejected or disconnected center answer is stated in place rather than replaced by a desktop-side filesystem or Git read, and stale content is never presented as current. The screen's data leaf reconstructs identically after the window is closed and reopened, because the ledger is authoritative.
