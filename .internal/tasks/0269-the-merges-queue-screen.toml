## Done when — binding goals, and what decides each

1. **Every child is completed on its own terms.** All three (`0269.1`, `0269.2`, `0269.4`) are `done` — the only accepted child state — each having run its own declared checks and, once `0256.1` had landed one, the desktop lane command. Cancellation does not satisfy this goal: parent aggregation treats `done` and `cancelled` alike as closed (`modules/core/src/task/graph.rs:27-32`), so a cancelled child would close this charter over unrendered leaves, and it stays open instead. No board check at this level: child closure is the board's bookkeeping, and this parent's derived status is not evidence of it while the children are still unloadable drafts (see the note in `content`).
