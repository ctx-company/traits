scope = '''
## Binding constraints and exclusions

These bound the outcome regardless of the route taken.

- **In scope**: the Merges screen as `screens/merges.md` specifies it — the title-bar menu entry between Tasks and Config with the switch that reaches it, the header, the three sections with their merge-row forms, the landing bottom bar, and the 380-wide preview column with its `merge`, `gates`, `sign-offs` and `landing` blocks and queue footer — with each region's data/placeholder status taken from the spec's own tags rather than re-decided, and with the spec's two optional regions resolved in the placeholder direction as this charter elects.
- **The screen artifact is normative and read-only.** `.internal/docs/design/**` is implementation input; changing a leaf's tag is an owner change to the design artifact, not a worker ruling made in a task file. `grammar.md` and `screens/merges.md` are the specification and `reference/merges.html` is measurement; the known content conflicts and their resolutions are Correction 6.
- **The gap is the queue, not the merge.** No merge-queue order, awaiting-approval state, sign-off record or queue count exists (Correction 1). The merge command, the TUI Merges screen, durable merge frames and the existing gate translation do exist, are reused rather than re-derived, and are not contradicted.
- **The `gates` block and the landed rows are placeholder-served in v1.** They are the artifact's two optional regions and this charter elects the placeholder resolution for both (Corrections 3 and 7), so no child wires gate evidence or landed-row evidence on this screen. The only data leaf is the title's repository component (Correction 4). No other leaf renders as data on the argument that something adjacent is derivable.
- **Nothing on this screen infers an active landing, a queue position, a queue order or a landing chronology** (Correction 2).
- **Read-only on every face.** Nothing here writes, acquires a lock, mutates a queue or opens a new merge action; `watch` and `hold` are tracked no-ops; the TUI's existing merge, deep-merge, print-path and drop behaviour stays first-class and unchanged.
- **The parity mechanism is the plan document's, not a variant of it.** A feature is something the center serves plus per-face rendering. The desktop reads no ledger, no worktree, no gate output file and no `git`; anything wired arrives through a center-served answer a non-GUI face can also reach.
- **The desktop imports no CLI-private type.** Where a needed derivation lives inside `ctx-traits-cli` beside ratatui rendering, the pure parser and typed presentation are extracted into shared core/IO and the existing consumers move onto the extraction rather than being copied. Copying such a derivation into gpui is a defect even when it compiles.
- **Extraction stops at demonstrated consumers.** Each shared piece is extracted by the first cut that renders through it and is only as wide as that cut needs. Because v1 wires no gate evidence, `merge_story::gate_rows` is neither extracted nor touched here; nothing is extracted speculatively.
- **Reuse the vocabulary `0265` extracted.** No Merges-local colours, row layouts, status dots, headers, bars, key/value rows, preview footers, overflow components or second placeholder module.
- **`0256`/`0257`/`0258`/`0265`'s robustness contracts are inherited, not renegotiated** (Correction 9): no poll loop anywhere in the GUI; snapshot-then-delta transactionality preserved; blocking work off gpui's UI thread and off the center's model-owner request path; compact rows triggering no reads; center failure visible and fail-loud, with last-accepted state shown only behind an explicit stale marker and never as current.
- **The crate lives outside the cargo workspace.** `0256.1` establishes its location, manifest, lockfile and non-interactive lane; every child of this charter lands into it. gpui must never enter root `Cargo.toml` resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing macOS/Linux CI lanes.
- **`ctx-traits-io` depends only on `ctx-traits-core` and its existing third-party set.** No CLI-level type and no new heavyweight dependency — in particular no filesystem watcher — enters the io crate, because the desktop lane inherits everything it drags in.
- **Dark theme only.** `tokens.md` records light values for later; v1 implements the dark column without drifting the light one.
- **Nothing here is deferred to `0261`**, whose own scope admits no production behaviour beyond its named bullets; a capability assigned to it would be assigned to nothing.
- **Out of scope**: building a merge queue, an approval flow, a sign-off mechanism or any queue mutation; a center default-branch-history or diffstat capability; the other three new screens (`0266`, `0267`, `0268`, each its own work item); the light theme; pencil work of any kind; and every shared primitive `0265` already built.
- **This charter's `depends-on` gates nothing on its own.** `derived_status` derives a parent's status from its children and evaluates `depends-on` only for open leaves (`modules/core/src/task/graph.rs:115-176`), so the external prerequisites are named on the earliest child that consumes them — `0269.1` carries `0265.5`, `0265.9` and `0258` — and reach the rest through child-to-child edges. The order below documents the sequence; it is not the gate.

## Covered work item

`merges-screen` — the v1 Merges (Queue) screen: landing / awaiting / landed sections, gates, sign-offs, read-only, placeholder-marked, dark theme only. The charter's named v1 placeholders (merge-queue contents, sign-off entries) are served design-faithfully from the shared `placeholders` module rather than inline literals.

## Suggested approach — guidance, not a boundary

### Item order, and what each cut owns

The edges are already encoded on the children; this is what they mean in sequence.

1. `0269.1` (after `0265.5`, `0265.9`, `0258`) — the `Merges` menu entry between Tasks and Config with the switch that reaches it, the three sections with their headings, and the three merge-row forms with their dots, titles, run-to-target descriptions and end-aligned state stacks, all placeholder-served, landed rows included (Correction 7), so one row implementation covers all three sections.
2. `0269.2` (after `0269.1`) — the chrome and the placeholder preview blocks: the header with its data title and placeholder summary (Correction 4), the bottom bar's state word, detail and `watch`/`hold` ghost actions, and the preview column's rule 13 frame with its `merge` block, `→`-prefixed `landing` consequence block and right-aligned queue footer.
3. `0269.4` (after `0269.2`) — the `gates` block placeholder-served in full (Correction 3), and the `sign-offs` block served entirely from the shared module at Correction 6's identity colours and 0.8 opacity.

### Expected surfaces

- The desktop project `0256.1` establishes — its path, manifest, lockfile and non-interactive command are that task's to name, and children bind to what actually landed rather than to a guess made here. Likewise the vocabulary `0265` extracted: rows, headers, bars, rail, title menu, key/value blocks, preview footers, overflow, and the one `placeholders` module.
- Shared core/IO — **untouched by this charter**: with gates placeholder-served, `merge_story::gate_rows` stays where it is and no extraction happens here. The declared `merge_story` check exists to observe that its landed wording did not move.
- `modules/io/src/center.rs` — consumed, not extended. The compact subscription already carries the screen's only data leaf (`center.rs:3778-3788`), so no new served shape is expected; were one to prove necessary, it would stay a compact typed shape under the 1 MiB line bound (`center.rs:51`) with blocking work in the connection worker rather than in `handle_request`.
- Nothing in `modules/cli/src/app/merge.rs` or the dashboard's merge actions changes behaviour.

### Named reuse points

Prefer these over new derivations.

