## Watch

- **Do not fabricate merge state.** `RunSummary.landing` is terminal evidence and `None` mid-run by contract; a last non-terminal frame is a checkpoint, not liveness; `MergeLive` is a CLI-local presentation sink; frames carry no timestamps. Deriving an actively-landing run, an awaiting-approval state, a queue order or a landing time from any of them invents state the projection does not carry (Correction 2).
- **Do not wire the two elected regions.** `gates` and the landed rows are optional in the artifact and placeholder-served by this charter's election (Corrections 3 and 7). Reaching for gate evidence or landed-revision evidence because it is reachable is widening the leaf, not completing it — and a renderer that turns every reachable command into `pass`, maps arbitrary argv labels onto the design's four named rows, or reads only the compact terminal frame would be worse than the placeholder form it replaced.
- **Do not overclaim the gap.** The merge command, the TUI Merges screen and durable merge frames exist; the missing things are the queue order, the approval state, the sign-off record and the queue counts. Saying "no merge surface exists" in code, comment or commit message is the wrong claim.
- **No inline placeholder literal, and no fixed label misfiled as a placeholder.** The shared module carries exactly what a `placeholder:` tag authorises; section and block headings and action labels are ordinary interface text (Correction 5).
- **No design example string is ever rendered as data.** `ctx-company/traits`, `run-1a2b3c`, `0257`, `wt-1a2b3c`, `7e90ad11`, `+27 −1`, `cargo test`/`drift · embed`/`ts-format`/`worktree`, `architect@1.4`, `security@0.9`, `@oskar`, `15:12` and `3 pending · 2 landed this week` are illustrations. A data leaf rendering one of them reads as evidence and is worse than an omitted leaf.
- **Repository identity comes from the center row**, not the desktop process's cwd; ad-hoc directories carry an `adhoc-` key that `repo_key(root)` alone cannot reproduce.
- **Nothing is served to the GUI that the TUI and CLI cannot also reach.** A desktop-private merge reader, gate reader, ledger read or classification is the capability-in-one-face defect; a second copy of `merge_story::gate_rows` inside gpui is the same defect even when it compiles.
- **No poll loop anywhere in the GUI**, no blocking read on gpui's UI thread, and no compact-row ledger, store, Git or sidecar read. v1 needs no selected-detail read at all (Correction 9); if one is nonetheless introduced it is selection-triggered and off the UI thread.
- **Snapshot-then-delta ordering is the contract** for the subscription this screen renders through: no lost, duplicated or partially committed visible state, and a fresh snapshot after a rejected candidate.
- **Fail-loud, no silent staleness, no direct-reader fallback.** A missing, ambiguous, unreadable, rejected or disconnected center answer states the failure rather than re-reading the filesystem or presenting stale merge state as current. The ledger is authoritative: the screen's data leaf reconstructs identically after the window is closed and reopened.
- **Read-only means read-only.** No write path, no lock acquisition, no queue mutation, no new merge action; `watch` and `hold` are tracked no-ops and must not appear to have changed anything; the TUI's existing merge, deep-merge, print-path and drop behaviour is untouched.
- **Grammar rules are normative**: semantic colour with `landing` accent, `awaiting approval` warn and `landed` ok; states as words, never pills or icons; the closed glyph set `↰ ↳ → · ∷` with `→` on consequence lines and the run-to-target form and never on an action label; no corner radius inside the canvas; 5px status dots only in stateful lists — merge rows are one of rule 4's four, sign-offs and preview prose are not; one bright title per list with `surface-raised` plus `text-bright` selection and no border, pill or accent bar; sans for content and mono for machinery; a title plus exactly one italic narrated summary and no breadcrumbs; ghost-text bottom bars; overflow clipping with a bottom fade and centred `scroll to end` only when content actually overflows; and provenance in right-aligned mono 10 `text-faint` footers.
- **A section with no rows says so in the design's own voice** rather than being hidden.
- **`grammar.md` and `screens/merges.md` are the specification; the export is measurement.** The three known content conflicts and their resolutions are Correction 6; a further one found during implementation resolves the same way and is reported. The export's rail counts and its untracked `ctx-logo-white.png` are `0265`'s resolved exclusions and are not reintroduced.
- **Fonts**: `tokens.md` names IBM Plex Sans and Mono and the repository ships no font faces; `0265.1` owns that resolution and this screen must not silently fall back to a system face.
- **No test may depend on committed repo content.** Prove behaviour with scratch repositories and scratch ledgers — never against this repository's own board, its own trait set or its own `.ctx/traits/runtime.toml`. Path/word/file-existence inventories are banned workspace-wide.
- **Workspace gate cost must not move.** gpui must never enter root `Cargo.toml` resolution, the root `Cargo.lock`, `just test`, `just test-full`, or the existing macOS/Linux CI lanes. Equally, do not declare a check that forbids the string `gpui` in `Justfile`/`.github/workflows/`: a separate desktop lane there is sanctioned, and a check that reds on the sanctioned outcome is a wrong check.
- **No desktop board check exists yet**: `0256.1` is still `ready` and no standalone desktop validation command exists in the repository, so none is declared here or invented. Once it lands, the exact non-interactive desktop command becomes declarable.
