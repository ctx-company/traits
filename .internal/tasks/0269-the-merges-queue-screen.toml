Exclusions, restated so they are checkable by reading the diff: no gate evidence and no landed-row evidence is wired, and `merge_story::gate_rows` is neither extracted nor copied for this screen; no merge queue, approval flow, sign-off mechanism or queue mutation is built; no default-branch-history or diffstat center capability is added; no light-theme value is touched; no pencil artifact is edited; no filesystem-watcher dependency enters `ctx-traits-io`; no second placeholder module or Merges-local visual primitive is created; no new merge action is opened on any face; and no work belonging to `0266`, `0267`, `0268` or `0261` is done here.

## Order and bounded refinement

Children run in the three stages listed in `scope`; the encoded edges are the only ordering that binds. When the last child lands, the suggested closing route is: leaf-by-leaf review against `screens/merges.md`, then the literal geometry comparison against `reference/merges.html`, then the boundary exercises, then the diff read for the placeholder-boundary, no-second-reader and no-timer properties, then the cheap declared checks, then `just test-full`, with the desktop lane command added once `0256.1` has landed one. The reason for that shape is cheap evidence first, so a rendering or boundary defect surfaces next to the leaf that owns it rather than inside a long gate. The sequence is guidance, not a boundary: a pass that reorders it, folds steps together, or reaches the same evidence another way is legitimate and reports the deviation in its work summary.

The stop condition binds. Permit at most one targeted repair-and-rerun round at this level: a round repairs one named defect in the child that owns it, then reruns whatever closing evidence is needed to show the repair holds and broke nothing already proven. If a second round would be needed, stop and report the failing command or the failing leaf with its evidence rather than iterating; that is the stop condition, not a judgement call.
