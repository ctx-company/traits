validation = '''
## Approach

Suggested route, not a boundary. No standalone desktop project, gpui source, desktop lockfile or desktop validation command exists at this HEAD — root `Cargo.toml` names seven workspace members and no gpui package, and `0256.1`, `0257`, `0265.5`, `0265.9`, `0265.10`, `0265.14`, `0258` and `0266.1` are all still `ready` — so no desktop path, module, component or command is named below, and the center's task request, result and delta names will differ from anything at HEAD (`modules/io/src/center.rs:84-209,265-281` has no task arm today). Discover each of them from what those tasks actually landed, and say in the work summary where the landed shape differed from what is described here. If a dependency reports complete but the desktop project, the preview primitives, the selected-detail contract, the typed progress result or the desktop lane is absent, that is an unmet prerequisite to report — not permission to build a parallel implementation of it here.

**Reuse points, named by what lands them.** `0266.1`'s served board answer is the sole source of the task key, the served state word, the section membership, the run-to-task join, the claim that join names, the awaiting-owner mapping, the repository scope, the board freshness event, the shared `content` projection and the key-identified selection — consume all of it, derive none of it. `0265.10`'s preview column frame with its ordered body slots, its named-block form, its mixed-tone key/value row and its selection-atomicity contract are the shapes and the state model. `0265.14`'s typed progress result and its formatter are the counter; its own goal 2 already keeps the three absence reasons distinct at the derivation boundary for this cut. `0265.2`'s `ctx tasks show --session` is the existing non-GUI consumer to extend, and its compatibility contract for the task-addressed form is binding. `0265.1`'s token entry point and IBM Plex faces carry every dimension, size and colour, so `380`, `[18,22]`, gap 5, gap 8, bottom padding 20 and every hex value appear as token roles at the call site rather than as literals. Center precedents: `Start`/`Control`'s shape — short owner-side resolution, blocking work in the connection worker (`center.rs:3278-3429`) — and the action timeout rather than the 2s stream timeout for a request that reconstructs; `center::get`'s ledger read inside `handle_request` (`center.rs:2900-2970`) is the shape to avoid, not to copy. Client precedent: the TUI reducer's transaction boundary — stage, project the complete candidate, commit only on success, retain last-accepted behind an explicit stale marker, request a fresh snapshot after rejection (`modules/cli/src/app/dashboard/worker.rs:254-415`) — which this preview inherits by being projected inside the same accepted model as the rows rather than by acquiring one of its own. The TUI's own Tasks preview (`dashboard.rs:6364-6555`) is behavioural precedent to read and not code to import.

**Edit order.**

1. **Read what the prerequisites landed** before writing anything: `0266.1`'s served row and board answer, whether it already carries the claim identity and the served state word this block needs, its stable selection identity and freshness event, and how much of a detail boundary it already put in place; `0265.10`'s frame, slot sequence, block form, mixed-tone row and selection transaction; `0265.14`'s progress type and formatter; `0265.2`'s claimed-task answer and CLI mode. Every step below depends on that reading, not on a guess. If a prerequisite already answers task detail, this cut extends it rather than introducing a second one.
2. **The typed task-detail request/response/refusal** beside `0266.1`'s landed board capability: an arm carrying the task key and the accepted repository scope, and typed resolved, no-claim, ambiguous-claim, unreadable, missing and refusal outcomes, with `0265.14`'s progress result carried whole rather than flattened to an option. Dispatch it on an early-return branch so it never becomes a generic model-owner request, and give it the public client wrapper on the action timeout. The blocking half reuses the board resolution and join `0266.1` landed rather than walking the board again.
3. **Widen the shared assembly only as far as this cut and `0266.5` demonstrate a consumer for**, per the parent's extraction rule — the full `content` projection, the claim's `trait_id`, and the progress result — with no field added to the compact listing.
4. **Extend the non-GUI face** so the same typed detail is really consumed, with the task-addressed CLI path untouched.
5. **The desktop detail model** — one request when the selection changes, keyed by task key, staged and committed only when the key still matches, cleared to a typed outage on failure, projected inside the same accepted model as the rows. For freshness under a held selection, the shape suggested by `0257`/`0265.14`'s selected-run detail mechanism is a center-pushed detail candidate for the selection the client already registered, so no client-side refetch is needed; whichever delivery the landed mechanism actually offers, goal 8's no-client-request outcome decides it.
6. **The two regions** — the column frame and the lede first, then `details`, each composing the landed primitives, with the no-claim, ambiguous-claim, progress-absent, stale and failure renderings written alongside the resolved rendering rather than after it.

**What must be proven** (observations, not mechanics): over scratch repositories, boards, ledgers, plans and arbitrary ids only — a selected task's detail carrying its title, the full form of the shared prose projection and the centrally served state word; the same detail carrying the centrally chosen claim's run id, trait id and typed progress, agreeing with the row's own claim; a `Ready` and a `Draft` selection with no claiming run; a task joined by several runs; a claim that is pending, awaiting owner, terminal, not-merged and unreadable; each of the three progress absences arriving distinguishable; a task that is missing or unparseable and a run that is unreadable; repository A's answer isolated from a same-key document in repository B while the center's cwd is elsewhere; one selection reconstructing one claim rather than every row's; a live progress change reaching a held selection with no client request; board and detail work proceeding while the model owner answers other requests; a rapid A-then-B selection whose A answer arrives last; a claim that changes and one that disappears under a held selection; and a detail failure and a center outage. `modules/cli/tests/proof_center.rs` is the existing process-boundary suite — it already exercises typed socket behaviour, snapshots, backpressure, reconnect and repository scope — which is why it is the declared home for the wire observations rather than a new binary. No test may assert against or write this repository's committed `.internal/tasks`.

**Desktop lane.** No repo-root command inspects a rendered gpui screen at this HEAD, so none is declared. Discover the non-interactive command `0256.1` documented, run it as a baseline before implementing and again afterwards, and extend that same harness for the rendered evidence rather than standing up a parallel desktop lane or substituting `just test` for it. If it is repo-root-relative, non-interactive and carries its whole verdict in its exit code, add it to `[[checks]]` verbatim rather than guessing at its name now.

## Watch

- **`grammar.md` and `screens/tasks.md` are the specification; `reference/tasks.html` is measurement.** Copy its width 380, `[18,22]` padding, lede gap 5, block gap 8, bottom padding 20 and its `space-between` centred rows; copy none of its content.
- **No design example is data.** `0243.4`, the export's title and prose, `in review`, `run-ab12ef`, `implement` and `frame 5 of 9` are illustrations, and none of them is fixture authority either. A leaf rendering one of them for a task that does not carry it is worse than an omitted leaf, because it reads as evidence.
- **`in review` is not a task state.** Stored status is the closed enum; `draft` is `0266.1`'s addition and `blocked` is derived for open leaves only. Render the served word.
- **Only the state segment is coloured.** Rule 7 colours a value only when the value *is* a state, and rule 1 makes accent mean happening right now. Painting `0243.4 · draft` or `run-<id> · <trait>` entirely, or accenting a state that is not current activity, both fail.
- **Three rows, but not always three claims.** A `Ready` or `Draft` selection with no claiming run is ordinary. Inventing `ready`, an old claim, a plausible default or an empty value there is the failure; so is silently dropping a row the artifact names.
- **The claim is chosen once, centrally.** `task_session_join` returns a vector and `task_group` decides a precedence class, not a run (`dashboard.rs:5953-6002`). A renderer that picks one lets the row and its own preview name different runs.
- **Progress is four outcomes.** `frame 0 of 0`, `frame 0 of M`, a completed-count ratio, `current_run_index` and a ledger frame count are each a wrong number that every gate would pass. An absence renders no counter segment, and the three absence reasons stay distinguishable.
- **The lede is the full form of the one shared projection**, the same one whose short form the row renders — so the two cannot disagree — and truncation is layout, never a value invented in the answer.
- **Detail is selection-scoped.** No eager or per-row fetch, no hover fetch, no whole-board reconstruction for one selection, no blocking work on gpui's UI thread or on the center's model-owner request path, and no rediscovery from cwd.
- **No timer anywhere, and no watcher dependency.** Freshness rides the accepted event; compact row deltas alone cannot carry structural progress, so listening only to them is a silently stale counter.
- **A late answer for a previous selection is discarded, not committed**, and no single row of the block commits alone.
- **Fail loud, no silent staleness, no direct-reader fallback, no partial commit.** A blank `claimed`, a stale counter after the claim disappeared, or a lede that updates while `details` lags each make the column lie.
- **No status dots, pills, badges, icons or corner radius in this column** — rule 4 restricts dots to stateful lists and this column is prose and key/value; radius 10 exists only on the window frame.
- **Sans is content, mono is machinery**: the lede title and prose and the row keys are Sans; the `details` heading and every value are Mono. Consume whatever `0265.1` resolved for IBM Plex Sans and Mono; a silent system-face fallback violates the tokens file. Dark tokens only.
- **`.internal/docs/design/**` and the Pencil artifacts are normative input, not files this task edits.**
- **No test may depend on committed repo content** — not this repository's `.internal/tasks`, not its board digests. Scratch fixtures only; path/word/file-existence inventories are banned workspace-wide, and no test writes into this repository's board.
- **Workspace gate cost must not move**: gpui must not enter root resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing CI lanes. Do not declare a check forbidding the string `gpui` in `Justfile` or `.github/workflows/` — a separate desktop lane there is sanctioned. Rust is pinned to 1.97.1; isolate with `CARGO_TARGET_DIR=target` when a failure looks like a phantom "cannot find X", since a shared cross-worktree target dir flakes gates.
- **The declared checks are workspace-side.** They prove the served detail capability, the shared progress derivation and the non-GUI consumer are green and the workspace stayed gpui-free; the rendered column is decided by the bounded review below and by `0256.1`'s desktop command once it exists.

## Bounded review

One review pass over the completed diff before calling this done: walk `screens/tasks.md:27-32` leaf by leaf against the rendered column, naming for each of the lede title, the lede prose, `id`, `claimed` and `state` the served source it renders from and confirming no `placeholders` call site exists here; confirm the `details` heading renders and that every absence and failure form — no claim, ambiguous claim, each of the three progress absences, missing, unreadable, refused, stale, outage — renders honestly and non-placeholder; confirm `0266.5` can append its blocks into the frame's body sequence without rebuilding anything this cut owns; compare the literal geometry against `reference/tasks.html:744-827` and `tokens.md:79,82`, resolving each content conflict toward `grammar.md:6-72,117-124` and the screen artifact rather than the export; exercise the scratch boundaries listed above; then read the diff for the properties no fixture shows directly — no duplicate join, claim choice, state derivation, prose projection or progress derivation; no eager, per-row or hover read; no client timer or watcher; no gpui filesystem, cache, `git` or cwd read; no CLI-private import; no model-owner blocking; no ungated or partial commit; no example literal; no placeholder call; and no work belonging to a sibling. Then run the discovered desktop lane command and the declared checks.

Permit at most one targeted repair-and-rerun round: repair one named defect, then rerun the failed command and every command after it in that order. If a second round would be needed, stop and report the exact failing command with its evidence, or the unresolved data or render contract, rather than iterating. That bound is the stop condition, not a judgement call.
'''
