scope = '''
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, and which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the Tasks preview column's use of the shared 380-wide frame and its rule 13 order; the headerless task lede; the `details` key/value block with its `id`, `claimed` and `state` rows; and the selection-triggered detail extension of `0266.1`'s landed board capability that carries the full prose, the centrally chosen claim's identity and trait, and the shared typed frame progress — reachable by an existing non-GUI face.

- **The parent's corrections bind.** `0266`'s content corrections govern this leaf; Corrections 2, 3, 9, 11 and 12 are the ones it touches directly, and where this file restates one it does not narrow it.

- **The join happens on the center side.** One selection produces one task-detail answer already carrying the board fact, the claim and the progress. A desktop that fetches a task, then fetches or reconstructs a run, then joins them locally has invented a client-side capability no other face has and put two round-trips on a selection.

- **This leaf resolves nothing about the board or the run.** No task-TOML parse, `task_files` call, `task_board_cache` read, `.internal/tasks` walk, ledger read, plan resolution, `git` invocation, cwd inference or clock read happens on the desktop side; no second run-to-task join, claim precedence, state derivation, content projection or progress derivation is created anywhere. Those are `0266.1`'s and `0265.14`'s and are consumed as landed.

- **Detail is a companion to the compact listing, not a widening of it.** Wire lines are bounded at 1 MiB and serialization fails loudly past it (`modules/io/src/center.rs:48-52`); this repository's board is already several hundred documents. Full prose and run reconstruction ride the selection-triggered answer. Adding them to every board row, or reconstructing every row's run to answer one selection, each fail this regardless of whether a given line happens to fit.

- **Compose the landed vocabulary, do not duplicate it.** `0265.10`'s preview column frame with its ordered body slots, its named-block form and its mixed-tone key/value row are the shapes this column takes; `0265.14`'s typed progress result and its formatter are the counter; `0265.1`'s token entry point and registered IBM Plex faces carry every dimension, size and colour. A Tasks-private copy of any of them is a defect even when it renders correctly.

- **The column stays extensible downward.** `0266.5` inserts `facts`, `checks` and `landing` between this cut's `details` block and the frame's spacer, and adds the footer, without editing the frame or re-deriving the selection. Hardcoding two children where the landed frame takes an ordered body sequence fails this.

- **Every leaf here is `data:`.** The `placeholders` module has no call site in this column, and no design example string is reproduced.

- Out of scope: the `facts`, `checks` and `landing` blocks and the provenance footer (`0266.5`); the header and provenance bar (`0266.2`); the sections, rows, short-form row description, section state, run-to-task join, `draft` representation, board freshness and key-based selection model (`0266.1`); the row's state-over-meta stack (`0266.6`); draft creation and the bar action (`0266.3`, `0266.8`); the migration of the TUI's `Screen::Tasks` (`0266.7`); the light theme; pencil work of any kind; and every shared primitive `0265` already built.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0266.1` — the center-served board answer, its canonical `draft` state, its centrally derived row and section state, its run-to-task join and the claim that join names, its one shared `content` projection, its board freshness events and its key-identified selection model. `0265.10` — the 380-wide preview column frame with its ordered body slots, its named-block form, its mixed-tone key/value row primitive and the selection atomicity contract this column extends; it also reaches `0265.2`, whose `ctx tasks show --session` is the existing non-GUI consumer of the same center-served claimed-task answer. `0265.14` — the shared structural frame-progress derivation and its typed present/absent result.

Neither `0265.10` nor `0265.14` is reachable through `0266.1`'s closure, and a charter's `depends-on` is not inherited by its children (`modules/core/src/task/graph.rs:115-177`), which is why both are named here. Bind to the desktop project, components, capability names and non-interactive command those tasks actually landed, not to a path or a protocol name guessed in this file.

## Done when

1. **The column opens as the shared frame, in rule 13's order, at the specified geometry.** Selecting a task renders a full-height 380-wide column at padding `[18,22]` whose first body block is the headerless lede and whose second is `details`, composed through `0265.10`'s landed frame, named-block form and key/value row rather than a Tasks-private reimplementation, and whose body sequence remains an ordered parameter so `0266.5` inserts its blocks without editing the frame. The lede column has gap 5 and bottom padding 20; the `details` block has gap 8 and bottom padding 20; its rows are full-width, `space-between`, vertically centred. Geometry matches `reference/tasks.html:744-827` and `tokens.md:79,82`; where the export conflicts with `grammar.md` or `screens/tasks.md` on content, the specification governs. No repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented; it is decided by the bounded review in `validation`, walking `screens/tasks.md:27-32` leaf by leaf, together with `just test` proving the shared code those leaves render through.

2. **The lede renders the served title over the full form of the one shared prose projection.** The selected document's title in Sans 13 `text-bright`, and beneath it the whole of `TaskDocument.content` through `0266.1`'s single shared projection in Sans 11.5 `text-secondary` at line height 1.45 — the same projection whose short form the board row renders, so the two cannot disagree. Never a newly stored description field, never a preview-private paragraph derivation, never prose truncated inside the answer rather than by layout, and never the export's title or sentence. A task whose `content` is empty renders the lede title with no invented prose. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served full form, `just test` for the shared projection, and the bounded review for the rendering.

3. **The `details` block renders its heading and its three rows in the artifact's order.** A lowercase `details` heading in Mono 11 `text-muted`, then `id`, `claimed`, `state`, each with the key in Sans 11.5 `text-secondary` and the value in Mono 10.5 `text`. Values are compound segment sequences through `0265.10`'s mixed-tone row: the task key, the run id, the trait id and every `·` separator carry the neutral value tone, and only a segment that *is* a state carries a semantic role, per grammar rule 7. No status dot appears anywhere in this column — rule 4 restricts dots to stateful lists and this column is prose and key/value — and no pill, badge, chip, icon, fill, border or corner radius is introduced; the only glyph this cut needs is `·`. Decided by `just test`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served segments, and the bounded review against `grammar.md:24-72` and `reference/tasks.html:766-827`.

4. **`id` renders the selected key joined to the state the center actually served.** The value is the task key and, joined by `·`, the state word `0266.1`'s answer carries for that task — the same centrally derived word the row shows, taken from the same fact rather than re-derived here from stored status, derived status or a section membership this renderer infers. `in review` is unrepresentable and is never rendered (`0266` Correction 12); nor is any state word invented for a task whose served state is one this column has not seen before. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch boards spanning the reachable states including `draft`, `just test`, and the diff read for a second state derivation.

5. **`claimed` and `state` render the one claim the center chose, or an honest absence.** When the served detail names a claim, `claimed` is that run's id joined by `·` to its `trait_id`, both neutral, and `state` is that claim's state word with the accent role when it denotes current activity, joined by `·` to the progress segment when progress is present. The claim is the one `0266.1`'s served row state named — never a run this renderer selects from a joined set, so `claimed` and the row's `live · run-<id>` can only ever name the same run. When no run claims the selected task — an ordinary `Ready` or `Draft` selection — both rows stay present and render a visible, nonempty, data-derived form of that typed no-claim outcome, distinguishable from a resolved claim; this file fixes the outcome that must be legible, not its wording. Not a dropped row, not an empty value, not a placeholder call, and not a fabricated run, trait or state. When the served claim is ambiguous or the join yields no single run, that is rendered as the typed outcome it is rather than resolved by picking one. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch repositories with no claim, one claim and several runs carrying the same key, `just test`, and the diff read for a renderer-side claim choice.

6. **`frame N of M` is `0265.14`'s result, and every one of its outcomes renders.** The counter segment is formatted from the landed shared typed progress carried on the served detail — never derived here, never from `current_run_index`, a ledger frame count, a row field or a completed-count ratio, and never with a loop or for-each body multiplied by its iterations. Present renders `frame N of M` with `1 <= N <= M`, including `N == M` on a completed run and the failed frame's own ordinal on a stopped one. Each of the three typed absences — plan unresolved, no counted steps, no counted step reached — renders the `state` row with its state word and *no counter segment at all*, and the three stay distinguishable to the renderer rather than collapsing into one silent `None`. `frame 0 of 0` and `frame 0 of M` are never rendered. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib run_view` for the derivation staying green, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the result reaching the detail with each absence intact, `just test`, and the bounded review.

7. **Detail is selection-triggered, addressed by the task key, and joined once on the center side.** One typed detail request, response and refusal extend `0266.1`'s landed board capability at the existing client boundary — not fields bolted onto the compact board answer or onto `CenterPublicRow`/`RunSummary`, and not a `ModelCommand::Request` that puts board, ledger, trait or plan work on the sole model/SQLite owner's request path (`0266` Correction 9). The request carries the task key and the accepted repository scope, never a list index and never a path derived from the center's or the desktop's cwd. One selection produces one answer already carrying board fact, claim and progress; answering it reconstructs the selected task's claim only and never every row's. Nothing is fetched for an unselected row, on hover, or eagerly per row; a selection that leaves the open set clears rather than retargets, per `0266.1`. Blocking work stays off gpui's UI thread; the response stays inside the 1 MiB bound or returns a typed failure and never silently truncates prose into a plausible complete answer. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for an eager fetch, an owner-path read, a per-row reconstruction or a UI-thread read.

8. **Freshness is event-driven, and no stale or late answer is presented as current.** While a selection is held, a live progress change reaches that selection's rendered `state` row through the same event-driven selected-detail mechanism `0257`/`0265.14` established, and the client issues no detail request to obtain it — not on an accepted event, not on a timer or interval, not as a periodic detail query, not as a per-frame ledger reread, and not through a filesystem watcher; no filesystem-watcher dependency enters `ctx-traits-io`, which still depends only on `ctx-traits-core` and its existing third-party set (`modules/io/Cargo.toml:12-29`). Compact row deltas alone are insufficient, since `RowChanged` carries no structural progress, so a column fed only by them is a silently stale counter. Only data carrying the task key of the current selection is ever committed; anything whose key no longer matches is discarded rather than committed, so a slow answer for selection A never replaces selection B's preview. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for a live progress change reaching a held selection without a client request, `just test`, and the diff read for a timer, a watcher or an ungated commit.

9. **The candidate commits atomically, and failure is visible.** Lede, task state, claim identity, trait and progress commit as one candidate under one stable selection identity, extending `0265.10`'s landed transaction rather than acquiring a second one: a complete candidate is staged and committed only on success; no single row commits alone; no update ever combines one task's prose with another task's claim or another run's progress; last-accepted content is shown only behind an explicit stale marker and never as current; and a rejected candidate forces a fresh answer rather than a partial merge. A failed, missing or refused detail, an unreadable claim, and a center outage each render as such — never a blank success, never a fallback to desktop filesystem reads, `task_board_cache`, cwd inference, a direct ledger read or a row-derived counter, and never a stale claim or counter presented as current after the claim changed or disappeared. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch missing, unreadable and refused cases and over a claim that changes and is removed under a held selection, `just test`, and the bounded review.

10. **An existing non-GUI face consumes the same typed detail, and its existing behaviour is unchanged.** The claim identity, the claim's trait, the served task state and the typed progress result — including its absences and its failures — are reachable and actually consumed by a production non-GUI face, not merely exported as a public helper. `ctx tasks show --session <id>`, landed by `0265.2`, is the grounded face; a different existing non-GUI consumer is acceptable only if it demonstrably consumes the same typed detail with no behaviour regression, and the run then says so in its work summary. `ctx tasks show <task>` keeps its direct provider path, its accepted identifiers, its `--board`, its `--json` and human output and its failure text, and still works with no center running. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib tasks` and `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`.

11. **The workspace is unmoved.** Root Cargo resolution, the root `Cargo.lock` and the existing gates stay gpui-free, the desktop project stays outside the workspace, and the CLI and TUI stay green. Decided by `just test`, the declared `run_view` and `tasks` checks, and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no second task parser, board resolution, run-to-task join, claim precedence, state derivation, content projection, progress derivation or selection/detail state machine is created; no CLI-private type — in particular nothing from `run_view` — is imported by the desktop; no desktop-side filesystem, cache, `git`, cwd or clock read is added; no client timer, interval or filesystem watcher is added; no `placeholders` call site enters this column; no design example literal is hardcoded; no status dot, pill, badge, icon, border, fill or corner radius enters this column; the `facts`, `checks` and `landing` blocks and the footer are neither rendered nor half-rendered here; the TUI's existing in-process Tasks preview at `dashboard.rs:6364-6555` is `0266.7`'s to move and is neither migrated nor preserved as a desktop fallback; no task mutation is opened; no light-theme value is touched; no pencil artifact is edited; and no work belonging to `0266.1`, `0266.2`, `0266.3`, `0266.5`, `0266.6`, `0266.7`, `0266.8`, `0267`, `0268`, `0269` or `0261` is done.
