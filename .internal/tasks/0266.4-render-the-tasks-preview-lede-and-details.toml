content = '''
Open the Tasks screen's 380-wide preview column with grammar rule 13's identity region — the headerless task lede and the `details` key/value block — over the repository-scoped board answer `0266.1` taught the center to serve, plus the selection-triggered detail answer that carries what a compact board row cannot. `screens/tasks.md:27-36` orders the column lede → `details` → `facts` → `checks` → `landing` → footer; this cut owns the column's use of the shared frame and the first two regions, and `0266.5` owns everything below them.

Every leaf in this column is tagged `data:`. The shared `placeholders` module has no call site here, and no literal from `reference/tasks.html` — `0243.4 — everyone asks the center`, its prose, `0243.4 · in review`, `run-ab12ef · implement`, `live · frame 5 of 9` — is data. The export is geometry authority only.

Seven grounded corrections the draft this file replaces did not carry.

**The primitives this column composes are not reachable from its declared prerequisite.** `0265.10` owns "the 380-wide preview column's frame and order, the `run` key/value block, the provenance footer, and the key/value row and preview-footer primitives the later blocks and screens compose", and its goal 3 already binds the mixed-tone value form this block needs — a compound value whose identity and `·` segments stay neutral while only the state segment carries a semantic role (`0265.10` scope; goals 1-3). `0265.14` owns the structural progress derivation. This file declared only `0266.1`, whose closure is `0265.5`, `0265.9` and `0258` and reaches neither; a charter's `depends-on` is not inherited by its children, because `derived_status` evaluates dependency edges only for open leaves and a document with children derives from its child closure instead (`modules/core/src/task/graph.rs:115-177`). The sibling Traits and Config preview cuts add exactly such an edge for exactly this reason (`0267.3` relations; `0268.3` relations). `0265.10` and `0265.14` are added, and `0265.10` transitively reaches `0265.2` — the `ctx tasks show --session` face this cut extends.

**`0243.4 · in review` is not a renderable value.** Stored `TaskStatus` is the closed set `Ready|Done|Cancelled` (`modules/core/src/task/mod.rs:22-31`), `draft` is what `0266.1` adds, and `blocked` is derived for open leaves only; `in review` exists nowhere in the derivation and the parent forbids it outright (`0266` Correction 12). The `id` row renders the selected task key joined by `·` to the state word `0266.1`'s answer actually serves — the same word the row shows, from the same centrally derived fact, so a row and its own preview can never disagree.

**There is no task description field, and the lede is not a second projection.** `TaskDocument` carries `title`, `content`, `scope` and `validation` and nothing else prose-shaped (`modules/core/src/task/mod.rs:135-180`); `TaskSummary` carries key, title, stored status, derived status and archived (`modules/core/src/task/provider.rs:25-36`). Parent Correction 3 fixes one shared projection of `content` with two faces — the row's short form and this lede's full form. This cut renders the full form of that one landed projection. A newly stored description field, a preview-private paragraph rule, or truncating in the answer rather than in layout each fail it.

**Two of the three rows are not always present, and the draft assumed they always are.** `Ready` and `Draft` rows with no claiming run are ordinary selectable rows the parent requires to stay selectable, and the draft simultaneously required a `claimed` leaf, a `state` leaf, and "no leaf may be omitted or placeholder-served" — a contradiction with no stated resolution. Worse, a task can join several runs: `task_session_join` returns `task_key -> Vec<usize>` (`modules/cli/src/app/dashboard.rs:5983-6002`) and `task_group` decides only a precedence *class* — any live row, then any pending row, then not-merged, then board status (`dashboard.rs:5953-5980`) — never a unique run. So "the claiming run" is not defined by any code at HEAD. This renderer must not pick one: the claim is whichever run `0266.1`'s served row state named, so the row's `live · run-<id>` and this block's `claimed` are the same run by construction, and a genuinely ambiguous or absent claim is a typed outcome rendered honestly rather than a run chosen here.

**`frame N of M` has four outcomes, not one.** `0265.14` binds progress as a typed result: M is the number of counted structural steps; N is the one-based reached ordinal, including the current failed or stopped frame and completion, with `N <= M`; present requires `1 <= N <= M`; and three absences stay distinguishable — plan unresolved, no counted steps, no counted step reached — with every absence rendering no counter segment at all (`0265.14` goals 1-2). That task states outright that the absence reasons stay distinct "because `0266.4` needs to tell them apart". The draft specified only the live-present example. `RunSummary` carries no ordinal or total (`modules/io/src/run_summary.rs:23-40`), and `counts_progress`, `active_position_path` and the structural path matching that produce them are CLI-private presentation code in `run_view` (`planned.rs:600-606`, `285-299`, `317-419`). Consume the landed shared result; deriving progress from `current_run_index`, a ledger frame count or a row count is the parent's named defect.

**"Fail loud" is a posture, not an update contract.** A task detail can fail; a claim can disappear or change while a selection is held; and selection A's answer can arrive after B is selected. `0265.10` already landed the contract for exactly this: the compact row, the reconstructed detail and the claimed-task answer are staged under one stable selection identity and committed as a whole, a late A after selecting B leaves B intact, a rejected candidate never partially updates, last-accepted content is presented only behind an explicit stale marker, and reads fire from explicit selection only, off gpui's UI thread (`0265.10` goal 9, over `modules/cli/src/app/dashboard/worker.rs:254-415`). This cut extends that one model. A second selection or detail state machine for Tasks is a defect even when it behaves correctly.

**The declared checks were workspace invariants standing in for proof.** `just test` and the metadata/lockfile command prove the workspace stayed green and gpui-free; neither observes a served task detail. `proof_center` is the existing process-boundary suite, so it is extended to prove the wire behaviour this cut adds rather than merely rerun unchanged, and the `run_view` and `tasks` filters are declared so the shared progress derivation and the non-GUI consumer are held green by name.
