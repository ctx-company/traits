schema-version = "0.2"
key = "0088"
title = "The person peer: a run parks with an open question and resumes on the answer"
status = "ready"
raised = "2026-08-04"
content = """


Second slice of the peer arc, and the one with the most value per line of code. This is the
call-for-help path 0062 promised — *"a call-for-help path may soften this later, once there is an
elegant interface for it"* — and it turns out to be park plus a typed hole.

"""
scope = """
## Decisions

- **A person peer is `wait-ms = 0`, `deferred = true`.** It parks immediately rather than holding a
  frame open against a human. There is no waiting state, no long timeout, no worktree held for four
  hours — the mechanism is the one every other peer uses with a degenerate wait.
- **Parking with a question is not parking with a blocker.** A blocker says something is wrong and
  needs fixing; an open question says the run did its job and reached a decision it is not entitled to
  make. They render differently, they are answered differently, and only one of them is answerable at
  all. A timed-out search cannot be "answered" — you fix the tool.
- **The park report headlines the question**, with its evidence and its choices. A parked run whose
  reason is buried is a run nobody unblocks. This composes with 0047's escalation flag rather than
  competing with it: `needs-owner` is the state, the open question is the specific thing wanted.
- **The branch stays mergeable.** 0062 already makes a parked run leave clean commits per step, so
  parking on a question inherits that: the work done so far is landable whether or not the question is
  ever answered.
- **`ctx traits answer` and the dashboard are two callers of one function.** Same rule 0069 set for
  manual and automatic delivery — the thing you can debug must be the thing that runs at 3am. The
  dashboard is the better surface because a typed question renders as a keypress; the CLI is the
  automatable one.
- **The reply is validated against the declared schema at ingress, and a malformed reply is refused**
  the way a model response that fails its schema is refused. This is the only place untrusted input
  crosses into typed run state, so the check lives there and nowhere else.
- **A typed question renders as a choice, not a conversation.** Enumerated options are keys to press.
  This is deliberately not a chat — 0054 owns chat, in the other direction, and a free-text reply
  would put a model back in the parsing path and the nondeterminism back in the run.
- **The person peer has no transport of its own.** The question goes out through whatever `[handoff]`
  channels are routed — a Slack card, a PR comment, the local view — carrying the exact command to
  answer it. Answers come back through `ctx`, never up a channel, so 0069's no-read-back contract is
  untouched.
- **Resuming fills the slot and continues; it does not re-ask.** The answer is the accepted value
  for that execution. Re-asking on resume would make every park a fresh question and make a
  long-running decision impossible to conclude.

## Scope

The `human` peer variant; open-question park state distinct from blocker park; the park report and
brief rendering the question, its evidence and its choices; `ctx traits answer <session> <id>=<value>`
with schema validation and a clear refusal on mismatch; the dashboard answer surface over the same
call; resume wiring the accepted value into the parked execution and advancing.

"""
validation = """
## Watch

- **Resume must land in the same execution**, not re-enter the step. This is the first thing to test,
  and it is the same class of failure 0070 flags for delivery references.
- **Answering twice, or answering an already-resumed run**, must be refused rather than silently
  producing a second value. `upsert_runtime_value` keys on ref-text (0050) — verify what an answer
  after resume actually does before assuming it is rejected.
- The failure mode is not wrong answers, it is **volume**: ten runs parked on one person's attention.
  0086's ladder is the pattern that prevents it — a run should earn the right to ask — but the
  interface should also make the count visible on the TASKS screen (0063) rather than leaving it to be
  discovered.
- A question that is never answered is a normal outcome, not a leak. It has no expiry and no default;
  the run stays parked and its branch stays mergeable. Do not add an "assume approved after N hours".
- Who may answer is currently "whoever has the machine", because the answer arrives through `ctx`.
  That is honest for now and it is the reason answering from Slack is deferred — it is the only piece
  with a real authorization question.

## Done when

An ask against a person peer parks the run immediately with an open question rather than a
blocker; the park report and the routed handoff surfaces show the question, its evidence and its
choices; `ctx traits answer` and the dashboard both resolve it through one code path; a reply that
does not match the declared schema is refused with a readable reason; resume fills the slot and
continues the same execution without re-asking; a second answer is refused; and the parked branch is
mergeable whether or not the question is ever answered.
"""

[relations]
depends-on = [
    "0087",
    "0069",
]
