This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it whenever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

`screens/merges.md:33-45` orders the Merges preview column `merge`, `gates`,
`sign-offs`, `landing`, spacer, footer. `0269.2` renders the frame, the `merge`
block, the `landing` consequence, the spacer and the footer, and leaves the two
middle positions as ordered insertion points with nothing of either visible —
not a heading, not an empty block, not a gap (`0269.2:376-397`). This cut fills
exactly those two positions and touches nothing else on the screen.

Both blocks are placeholder-served in full. `sign-offs` was always placeholder —
`screens/merges.md:40-42` tags it `placeholder: until sign-offs exist` and no
sign-off type or store exists anywhere under `modules/**`. `gates` is
placeholder by parent election: `screens/merges.md:37-39` tags it `data:` and
then says, in the same sentence, "wiring optional in v1, else `placeholder:`",
and parent Correction 3 exercises that option once for the whole family and
states that the election binds (`0269:55-68`). So this cut reads no evidence at
all. It renders two static design illustrations through vocabulary that already
landed, from the one shared `placeholders` module.

The export fixes the geometry: both blocks are full-width columns at internal
gap 8 and bottom padding 20 inside the 380-wide preview padded `[18,22]`, with
lowercase mono 11 `text-muted` headings (`reference/merges.html:661-667`,
`734-812`, `813-874`; `tokens.md:80-82`). `gates` is four rule-7 key/value rows —
sans 11.5 `text-secondary` keys, mono 10.5 values, `ok` on the value because the
value IS a state (`grammar.md:68-72`; `tokens.md:43`, `62-65`). `sign-offs` is
not key/value at all: three space-between rows with a mono 10.5 identity on the
left at its identity colour and 0.8 opacity, and mono 10 `text-faint` role and
time on the right (`grammar.md:6-22`; `tokens.md:29`, `40`, `47`, `64-65`).

## Five corrections to the draft this plan replaces

**Correction 1 — the gates block is placeholder-served, and this file's
wire-wherever-reachable rule is dropped.** The draft this replaces calls `gates`
"the one region on this screen that has real evidence behind it" and instructs
the run to "wire it wherever the selected run's center-served detail actually
reaches those results", placeholder-tagging only the unreachable rows. That
direction is stale: it originated in `34092799e` and parent `0269` was
substantively rewritten afterwards in `833f1edea`, electing the entire block into
placeholder form (`0269:11`, `0269:55-68`, `0269:136-145`, `0269:198-205`,
`0269:218-228`). Sibling `0269.2` records the same, calls this file's text stale,
and reserves the slot without rendering it (`0269.2:99-111`, `0269.2:795-800`).

The election is also what the backend supports. `[merge] gate` is an optional
ordered list of arbitrary literal argv arrays, replaced wholesale across config
layers and empty by default (`modules/io/src/harness_config.rs:1280-1314`), so
`EffectiveMergePolicy.gate` is `Vec<Vec<String>>` and is empty when undeclared
(`harness_config.rs:1484-1502`). Gate labels are generated generically from argv
— leading dashes stripped, parts joined, path-safe characters retained,
truncated to 40, falling back to `gate-{index}` (`modules/cli/src/app/merge.rs:2428-2450`)
— so no backend code knows `cargo test`, `drift · embed`, `ts-format` or
`worktree` as fixed identities. The runner records
`gate=<label> argv=<...> exit=<...> timed-out=<...>` with an optional
`gate-output=<path>` (`merge.rs:2606-2689`), and an empty declared gate records
an advisory before every run performs the tracked-worktree cleanliness check
(`merge.rs:2552-2556`, `2692-2719`). Outcomes are not uniformly green: the
existing translation distinguishes passed, failed with an exit code, timed out
and killed by signal (`modules/cli/src/app/merge_story.rs:67-80`, `811-895`).
Successful evidence lands on a nonterminal `GatesPassed` frame
(`merge.rs:2720-2735`), and terminal statuses are `Merged`, `Parked`,
`PostMergeCleanupFailure` and `RecoveryFailure`
(`modules/core/src/procedure/session.rs:617-670`), so a landed run's compact
`last_terminal_merge_frame` normally does not carry it. `RunSummary` exposes
`has_merge_frames`, `last_merge_status`, terminal `landing` and only that compact
frame (`modules/io/src/run_summary.rs:48-68`, `169-193`) — no ordered gate
history at all.

Ruling: **the whole `gates` block, all four labels and all four values, is
placeholder content from the one shared module.** Only the heading is fixed
interface text. The draft's rule would have produced a renderer that maps
arbitrary argv labels onto four design-named rows and prints every reachable
result as `pass` — a screen that reads as evidence and is wrong. Later real
wiring is out of this task and, per parent guidance, would extract
`merge_story::gate_rows`' pure parser and typed presentation into shared core/IO
and inspect the ordered `provenance.merge_frames` history rather than the compact
terminal frame (`0269:64-68`). Neither happens here.

**Correction 2 — sign-offs are placeholder because nothing exists to derive them
from, and the gap is named precisely.** A focused search under `modules/**` finds
no `signoff`, `sign-off` or `sign-offs` type or store; the `approval` matches are
unrelated trust, procedure-input and owner-input concepts. The center protocol's
requests cover register/frame/activity/end, subscribe, start/control,
list/get/resolve, run lookup, stats and the standing wall, and its deltas cover
appeared/changed/ended rows and activity — no merge-queue order, no
awaiting-approval state, no sign-off response, no queue count
(`modules/io/src/center.rs:84-281`). Ruling: **every identity, role and time in
this block is placeholder content.** Deriving entries from merge frames, trust
approvals, task ownership or run evidence would fabricate state that does not
exist. And the gap is stated narrowly wherever this cut's code, comments or
commit message state it — no merge-queue order, no awaiting-approval state, no
sign-off record, no queue counts — never "no merge surface exists", because
`ctx traits merge <run-id>`, the TUI Merges screen and durable merge frames all
exist (`0269:34-42`).

**Correction 3 — "no inline placeholder literals" governs placeholder facts, not
the two block headings.** The draft's Watch says "no inline placeholder literals"
without the distinction parent Correction 5 draws (`0269:80-84`). Read literally
it routes the fixed lowercase headings `gates` and `sign-offs` through the
placeholders module, turning interface chrome into fake placeholder facts and
poisoning the grep the rule exists to enable. Ruling: the shared module carries
**exactly what the `placeholder:` tags authorise** — the four gate labels and
their four values, and the three sign-off identities with their roles and times —
one small replaceable entry per rendered region, each traceable to
`screens/merges.md:37-39` and `40-42`. The two headings are ordinary interface
text at mono 11 `text-muted` per rule 5 (`grammar.md:49-56`). No registry, trait,
macro layer or second placeholders module.

**Correction 4 — the export omits opacity on `@oskar` and the specification wins.**
`reference/merges.html:858-874` renders the owner's handle at `text-session`
`#a7abb5` with no `opacity` property, while the two agent identities above it
carry `opacity: 0.8` (`824-857`). `screens/merges.md:40-42` states
"rows agent mono 10.5 identity-color 0.8 left" for the whole block, and grammar
rule 1 states the 0.8 rule for small mono handles generally
(`grammar.md:16-19`); parent Correction 6 resolves the conflict toward the
specification (`0269:86-96`). Ruling: **all three identities render at 0.8
opacity**, `@oskar` included. The export is measurement; the rules are the
specification. The conflict is reported as an owner correction against the design
source, never edited into `.internal/docs/design/**`. A further conflict found
during implementation resolves the same way and is reported.

**Correction 5 — no selected-detail read is needed, and today's `Get` path is not
the one to reach for anyway.** The draft requires reads through "the same
selection-triggered reconstruction the Sessions preview reads through", off the
UI thread, reconstructing identically after the window is closed and reopened.
With both blocks placeholder-served that requirement has no subject: **this cut
performs no read of any kind.** The reading is recorded only so nobody reaches
for one. `center::get(session_id, repo_key)` does return the complete shared
`Session` (`center.rs:916-935`), but at this HEAD `Request::Get` resolves the row
and calls `read_session` **synchronously inside `handle_request`**
(`center.rs:3595-3669`), which parent Correction 9 states is not the sanctioned
off-owner-path posture (`0269:119-129`). The current TUI merge preview is not a
model either: it rebuilds on selection but derives gate rows from the compact
last terminal frame and performs direct repository and worktree Git reads
(`modules/cli/src/app/dashboard.rs:4277-4407`), and it is `ctx-traits-cli`-private
beside ratatui rendering. `CenterPublicRow` carries compact summary, `repo_key`,
`repo_path`, ledger path, live flag and ledger mtime (`center.rs:3778-3788`), and
the center's own two-second reconciliation scan (`center.rs:65`) is not
permission for a GUI timer. The robustness posture still binds even though
nothing here exercises it: no compact-row read, no poll loop, no desktop ledger,
store, sidecar, worktree, gate-output-file or Git read, no GUI-only durable
state, and no blocking work on gpui's UI thread.

## Why the declared edge is already sufficient

The draft depends only on `0269.2` and that edge is correct, so `depends-on` is
unchanged. Dependencies are not inherited from a parent — `derived_status`
evaluates `depends-on` for the open leaf itself
(`modules/core/src/task/graph.rs:115-176`) — so the closure was checked rather
than assumed. It is `0269.4 → 0269.2 → {0269.1, 0265.13, 0265.15}`, with
`0265.15 → 0265.12 → 0265.10 → {0265.2, 0265.3, 0257}`, `0265.13 → {0265.2,
0265.3}`, `0265.3 → 0265.1 → 0256.1`, and `0269.1 → {0265.5, 0265.7, 0265.9,
0258}`. Every component this cut consumes is inside it: the one `placeholders`
module and the token/font entry point (`0265.3`, `0265.1`), the preview frame,
block shell, key/value row, spacer and footer (`0265.10`, `0265.12`, `0265.15`),
the clip-and-fade component (`0265.7`), the assembled Merges preview with its two
reserved positions and its single selection (`0269.2`, `0269.1`), and the desktop
project and its lane (`0256.1`). No edge is added, because none is missing.

## Grounded against HEAD 11c7badbf

Nothing this task edits exists yet. Root `Cargo.toml` names only the seven
existing Rust workspace members and excludes only `packages/cdk`; root
`Cargo.lock` contains no `gpui` package; there is no desktop manifest, no desktop
lockfile, no gpui source tree, no `placeholders.rs`, no desktop recipe in
`Justfile` and no desktop CI lane anywhere in the repository. Every desktop path,
module name, symbol, signature and gpui API named below is therefore a guess to
be replaced by reading what `0256.1`, `0265.1`, `0265.3`, `0265.7`, `0265.10`,
`0265.12`, `0265.15`, `0269.1` and `0269.2` actually landed.

Every prerequisite is still open at this HEAD: `0256.1`, `0265.1`, `0265.3`,
`0265.7`, `0265.10`, `0269.1` and `0269.2` are `ready`, and `0265.12` and
`0265.15` are `draft`. Note that `draft` is not a storable status — `TaskStatus`
is the closed set `ready|done|cancelled` (`modules/core/src/task/mod.rs:22-31`),
so `FilesTaskBoard::load` records the parse rejection and skips the document
(`modules/io/src/task_files.rs:186-250`). Activating a sibling or prerequisite
draft is board bookkeeping outside this cut's code scope, and no test may assert
on this repository's own board.

**The desktop lane exists by the time this task is dispatchable, and that is a
dependency fact rather than a hope.** The chain above reaches `0256.1`, which
establishes the standalone desktop project and does not close until "its
documented independent build and test commands pass from a clean checkout"
(`0256.1:17`). The lane and its non-interactive command are therefore a dispatch
precondition, not a discovery gamble. The command cannot be written into this
file because it does not exist at the HEAD this plan was authored against, and a
named command that does not exist is a fabrication a board check would execute as
if it were evidence. Goal 0 resolves that by making the command's resolution and
a baseline run of it the run's **first** action, ahead of every edit: if the
chain has not in fact landed, the run stops there, writes no code, and reports an
unmet dependency on `0256.1`.

**Static review decides the structural half and cannot decide the runtime half.**
The closing reads of `git diff main...HEAD`, `git diff --name-only main...HEAD`
and `git status --short` establish what a running harness does not show cheaply —
a second placeholders module, inline placeholder facts, headings misfiled as
placeholder data, copied block, key/value or sign-off layout logic, token or
geometry literals at call sites, a gate parser or read, a `merge_story`
extraction or copy, a CLI-private or ratatui import, a filesystem or Git read, a
timer, a write path, a queue inference, a light-column value, an edit under
`.internal/docs/design/**`, and sibling-owned work. They do not establish that
four gate rows rendered in `ok` or that three identities rendered at 0.8; the
desktop lane decides those.

The root-isolation command this file already declared was executed at this HEAD
and exited 0 with no output, so it is a live command rather than a guess. It
proves workspace isolation only, never rendered desktop behaviour.
