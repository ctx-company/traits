## Bounded refinement

Run, in order: goal 0's baseline — the resolved desktop lane command, unchanged,
on the untouched tree, before any edit — then, after the edits, that same command
over this cut's cases as goal 11 requires, then the root-resolution check, then
`just test`, then the closing diff read. The reason for that shape is cheap
evidence first, so a rendering, content or ordering defect surfaces next to the
block that owns it rather than inside a long gate, and so an inherited red is
separated from one this cut caused before any code is written.

Goal 0's stop is not part of the refinement budget. If the lane or its command is
absent, the run ends there with an unmet-dependency report; it does not spend a
repair round standing one up.

Permit at most one targeted repair-and-rerun round: repair one named defect, then
rerun the failed command and every command after it in that order. If a second
round would be needed, stop and report the exact failing command — or the
unresolved visual or data contract — with its evidence rather than iterating. That
