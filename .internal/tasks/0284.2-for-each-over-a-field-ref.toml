schema-version = "0.2"
key = "0284.2"
title = "For-each over a field ref, so a seat can emit one typed object and the loop walks its list field"
status = "draft"
raised = "2026-09-07"
content = """
DRAFT — to be run through architect. Follow-on to the step-walk (0283); drafted
as 0283.2 while 0283 was open, re-homed under 0284 now that 0283 is done.

Today `.forEach`/`.ln` resolves a top-level list SLOT and materializes item
handles from it; there is no way to walk a nested list FIELD of another slot.
That forced a modeling choice in 0283: the reviewer writes the open steps as
their own `steps` slot rather than as one cohesive `verdict { status, steps,
advisory }` object, because the for-each could not walk `verdict.steps`. It
works, but the data model is shaped by a plumbing constraint instead of the
domain.

This lets for-each's `over` accept a field ref (a RefHandle into a slot's list
field), so a seat can emit one typed verdict object and the loop walks
`verdict.steps` — status, notify digest, gate surface, and apply then all read
from the one object, type-driven, no artificial slot split.

## GOALS, binding

1. **`over` accepts a field ref.** `object-slot.list-field.forEach(...)` (or a
   `sequence.forEach({ over: <ref> })` form) walks that nested list, binding one
   item at a time, exactly as it does for a top-level list slot.
   Excluded: changing the semantics of the top-level-slot for-each that exists.

2. **Item materialization and replay work over the nested list.** The bound
   item handle is materialized from the field path; the for-each frame's cursor
   over the nested list is recorded in the ledger and replays deterministically.

3. **Adopt it in implement, collapse `steps` into the verdict.** implement's
   reviewer emits one `verdict` object and the walk runs over `verdict.steps`;
   the standalone `steps` slot is removed.
"""
scope = """
## Decisions

- Design the field-ref resolution once in core/cdk, generically; adopt in
  implement, do not spread until proven here.
- Touches: the for-each `over` resolution and item-handle materialization, the
  cdk surface (`.forEach` on a ref or a `sequence.forEach` fields form), and the
  for-each frame's ledger recording / replay over a nested list.
"""
validation = """
## Done when

- A trait can walk a nested list field with for-each, binding items and
  replaying deterministically.
- implement's reviewer emits one verdict object, the walk runs over its steps
  field, the standalone `steps` slot is gone, and the trait builds and checks.
"""

[relations]
parent = "0284"
depends-on = ["0283"]
