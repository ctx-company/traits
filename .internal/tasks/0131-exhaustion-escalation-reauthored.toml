content = """


The original P277 wanted (a) an escalation branch when a refinement loop exhausts
(instead of a silent Blocked halt) and (b) dropping the `.git/CTX_COMMITMSG`
file-hop. Both premises have moved:

- The file-hop clause is already satisfied (3df765f: argv slot injection in
  `implement`; verified 2026-07-21 — though note the plannotate/guarded-change
  packages still use the file-hop pattern by choice for `-F` composability).
- The exhaustion premise predates v0.15 (exhaustion continues with verdicts
  attached) and the leftovers machinery (P408–P410 landed: approved-with-leftovers
  is a first-class outcome), and partially overlaps 0141 (blocked-is-an-error).

What remains genuinely open is the owner call the board recorded under "DESIGN
DECISION PENDING": what should a run DO when it exhausts — today it blocks and
commits nothing, which may be the whole answer. If an escalation shape is wanted
(a report step, an owner ask via the peer interface (0087/0088), or a typed park
with routed leftovers), it must be authored against: v0.15 exhaustion semantics,
the leftovers contract, task 0093 (unbounded loops exist now), and 0141's
blocked-is-error classification.

## Done when

An owner design session either (a) ratifies "exhaustion blocks and commits
nothing" as the permanent answer and this task closes with that recorded, or
(b) produces a re-authored contract for the escalation shape, filed as its own
implementable task.

Full original contract: `archived/board/execution-plan.md` (Group 70, P277).
"""
