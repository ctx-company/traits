title = "Exhaustion escalation: the owner design decision, against current semantics"
status = "ready"
raised = "2026-08-05"
content = """


Re-authored 2026-08-10 after every premise of the migrated text moved. This is
an OWNER DESIGN DECISION task, not implementation.

**Current semantics (verified):** loop `on-exhausted` is `continue` (default;
declared signals emitted, run proceeds past the loop) or `abort`
(`Status::Blocked`, stop-reason `max-iterations-exhausted`) — there is no
`block` policy name anymore; `--strict-loops` forces every exhaustion to the
abort behavior (`modules/core/src/procedure/runtime/control_flow.rs:1783-1817`).
The typed park report is trait-authored evidence: implement-family loops
project the verdict into `slot:park-report` every round
(`deriveParkReportStep`), and the run parks ON those entries when it exhausts
unapproved — the runtime attaches nothing itself. Task 0140
(truly-blocked-is-an-error: zero commits, typed park, distinct exit code,
standing-wall sibling refusal) is DONE and archived — the prior text of this
task mis-cited it as "0141". The `.git/CTX_COMMITMSG` file-hop clause is fully
satisfied: no package uses it (plannotate dropped it at 0.2.0); commit tails
use argv slot injection everywhere.

**The genuinely open question, with a fresh cost exhibit:** what should a run
DO when the loop cannot reach approval? Today it grinds the full budget. Run
`run-5d96bf56…` (task 0116, 2026-08-09) burned ~10 identical review rounds
AFTER the reviewer had already set `escalation = needs-owner` with a specific
clearing action — the worker correctly changed nothing and the reviewer
re-verified the same clean state round after round, ~107k work tokens. The
concrete design question: should a `needs-owner` escalation (or a repeated
identical verdict) end the loop early with the park, instead of re-grinding?

If an escalation shape is wanted beyond early exit — a report step, an owner
ask via the peer interface — note 0087/0088 (peer ask machinery) are still
`ready`, unbuilt; `sequence.ask` exists as an ordinary authored step kind with
no exhaustion binding.

"""
