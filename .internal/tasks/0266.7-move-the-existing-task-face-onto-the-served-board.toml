  fail with no center running — a regression, not parity.
- **Five readers, not one.** Startup cache and live read, the two-second fingerprint
  tick, manual `S`, the post-write display resync, and the preview. Repointing only
  the list leaves four live board answers behind (content Correction 3).
- **Do not rebuild N+3 out of served calls.** `read_board_snapshot` is `list(true)`
  plus a `get` per summary plus `sync` plus a fingerprint sweep
  (`dashboard.rs:6140-6163`); reproducing that shape over the socket keeps the cost
  and adds a round trip per key. One answer for the list, one selection-scoped detail
  for the preview.
- **Do not fatten the listing to carry the preview.** Wire lines cap at 1 MiB
  (`center.rs:48-52,638-647`) and this board is already several hundred documents;
  full prose in every row takes the screen down at exactly the moment it matters.
- **`0266.4`/`0266.5` are siblings, not prerequisites.** Do not assume a landed
  detail boundary; extend minimally where it is absent, and consume it where it is
  present (content Correction 4).
- **Absent is not empty.** `read_dir` errors are swallowed today
  (`task_files.rs:197-200`) and the fingerprint treats a missing directory as empty
  (`:136-166`). Preserving that as "unchanged behaviour" preserves a lie; render
  `0266.1`'s typed outcome honestly instead (content Correction 5).
- **`task_board_cache` is discardable derived evidence** (`task_board_cache.rs:1-10,25-41,72-91`).
