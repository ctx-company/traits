## Approach

Suggested route, not a boundary. Every symbol is named because the grounding
supports it at this HEAD; take a different one wherever a goal requires it and say
so in the work summary.

**Reuse points, named.** `0266.1`'s served board answer, typed board-presence
outcomes, shared repository-scoped join and group facts, freshness event and detail
boundary are the one board source — no second board wire type or join in CLI code.
The dashboard's existing background IO owner (`modules/cli/src/app/dashboard/worker.rs`)
is the migration route: it already owns the persistent `center::subscribe(None)`
stream, receives blocking events off the event loop, stages rows between
`SnapshotStart` and `SnapshotEnd`, projects a complete candidate before replacing
accepted state, clones accepted state before applying a delta, reconnects for a
fresh snapshot after a rejected candidate (`worker.rs:254-415`), and reconnects
after a bounded 500 ms delay while still servicing queued commands
(`worker.rs:470-500`). Its outage strings already distinguish no-accepted-snapshot
from retained-with-timestamp (`worker.rs:443-457`), and `State::apply_refresh_results`
already commits a complete snapshot or retains state and records the error
(`dashboard.rs:1449-1530`) with the footer's `stale: <error>` (`dashboard.rs:8602-8611`).
`center::subscribe` already calls `ensure_connected` (`modules/io/src/center.rs:786-817,1041-1091`),
so spawn-on-need and reconnection are inherited rather than re-policied. Render-only
structures stay: `TaskGroup::order`/`label` (`dashboard.rs:582-625`),
`TaskVisibleRow`, `rebuild_visible_tasks`' key-preserving selection restore
(`dashboard.rs:6004-6105`), `task_row_label` (`dashboard.rs:8507-8551`),
`build_task_preview` and `push_task_relation_lines` (`dashboard.rs:6364-6555`),
`tasks_list_title` (`dashboard.rs:7804-7817`), the collapse set, the pane layout,
the keymap (`dashboard/keymap.rs:136-173`) and every action modal. `task_group`,
`task_session_join` and `session_group` (`dashboard.rs:1938-1972,5953-6002`) are the
semantics `0266.1` extracts — consume the landed shared form and delete the CLI
copy rather than keeping both. `CenterPublicRow.repo_key`/`repo_path`
(`center.rs:3805-3815`), `RunSummary.task_key` (`modules/io/src/run_summary.rs:61-72,187-193`)
and the machine checkout index (`modules/io/src/state.rs:477-557`) are the existing
repository-scope inputs; the board is never derived from the center process's cwd.
`modules/cli/tests/proof_center.rs` is the existing real-socket harness with its
private center tuples and scratch repositories (`proof_center.rs:297-367`).
Analogous migration task `0267.5` is the closest structural precedent for the whole
