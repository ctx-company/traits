content = '''
Close the Traits preview column with the two blocks `0267.3` left after `trait` and `facts` — `variants` and `ports` — and with the provenance footer that ends it. `screens/traits.md:24-31` orders the column `trait` → `facts` → `variants` → `ports` → footer, and grammar rule 13 puts fact blocks before a flex spacer and a provenance footer (`grammar.md:117-124`); this cut owns everything after `facts`.

Every leaf here is `data:`. The `placeholders` module has no call site in this column — the screen's only two placeholder leaves are the header summary's phrasing and `author trait`, both `0267.2`'s (`0267` content, Correction 9). A static export value is not data.

Six grounded corrections the draft this file replaces did not carry.

**"`ports` is key/value: task and duration" turns the spec's example into a schema invariant, and the example itself refutes it.** `Port` is an arbitrary authored declaration — author-chosen `id`, `direction`, `schema`, `optional`, required `description`, optional `title`/`hint`/`value`/`default` (`modules/core/src/trait/port.rs:69-109`) — and `Trait.ports` is a plain `Vec<Port>` (`modules/core/src/trait/mod.rs:389-391`). Validation requires unique slug-shaped ids and a nonempty description and nothing else (`port.rs:117-149`); no rule mentions `task` or `duration`. The screen's own selected example proves the point: each `implement` variant declares `commit-report` and `task` and no `duration` (`.ctx/traits/authored/implement/generated/basic/index.toml:50-62`), while `duration` occurs elsewhere. Parent Correction 7 is the invariant: the named `ports` block always renders, carries the trait's actually declared ports, and renders exactly one data-derived `none` leaf when there are none. Rendering a fixed `task`/`duration` pair, inventing a value for an undeclared port, or dropping the block when the data is empty are the worse failures, because they read as evidence.

**"One row per authored variant (`basic`, `quick`, `complex`)" is fabricated, and the row's value is not the variant name list.** Parent Correction 5 binds one row per *actual* family-table member, keyed by that member's actual variant name, with the value that member's own `Trait::effective_summary()` — the authored `summary`, falling back to `description` (`modules/core/src/trait/mod.rs:485-493`). `FamilyTable` carries `default: String` and `variants: BTreeMap<String, FamilyVariant>` (`modules/io/src/family_manifest.rs:23-35`), validated by `read_family_table` (`family_manifest.rs:73-171`); the actual map keys are the row keys. `variant_names()` is diagnostic-only and fabricates the selector string `default` ahead of the real names (`family_manifest.rs:59-70`), so it must never feed display. A one-member family renders exactly one row. `basic`/`quick`/`complex` is what this repository's `implement` table happens to declare today (`.ctx/traits/authored/implement/trait.toml:7-22`) and is an illustration; so is the export's `implement · review · commit` (`reference/traits.html:773`), which is prose, not a variant list. HEAD's assembly cannot supply the keys yet — it expands a family by iterating `table.variants.values()`, discarding the map key and leaning on the decoded `Trait.variant`, and swallows a malformed family table through `.ok().flatten()` (`modules/cli/src/app/lifecycle_reporting.rs:1580-1617`); retaining the real member records and failing loudly on a malformed family contract is `0267.1`'s, consumed here.

**"The trait row's own right stack already lists the variants, so this block renders the same list" is the wrong source and the wrong shape.** The right stack's `· N variants` leaf is a count carrying the aggregate trust counts (`0267` Correction 6), not a per-member summary table; and parent Correction 10 keeps the listing compact under the 1 MiB wire bound (`modules/io/src/center.rs:48-52`), with per-variant detail belonging to the selection-triggered detail answer. `0267.3` states exactly that — descriptions, agents, ports and per-variant detail travel in the detail answer rather than in eager list rows. So this cut extends the shape `0267.3` landed with two more served fields; it adds no second request, no second subscription, no second cache and no inventory rescan, and it widens no compact row.

**"The center reads ports while building the inventory, so this cut widens the served answer to carry them" understates what exists and misplaces the projection.** What is needed is two fields off each `Port` — `id` and `description` — which is the pairing the export itself demonstrates (`reference/traits.html:823-876`). `run_info::summarize_run_info` already projects port descriptions from decoded `Port`s (`modules/core/src/run_info.rs:197-241`), but that is the run-info projection with its own consumers and shape, and importing it here to avoid a two-field map would be reuse of the wrong thing. Ports are stored in a `Vec` and iterating preserves declaration order; no shared display projection sorts or deduplicates port ids for this screen, so the served order is the declaration order and the desktop renders it unchanged.

**The footer's sha and count are neither this cut's to resolve nor this cut's to format.** Parent Correction 4 puts the whole resolution in `0267.1` — one ordered evidence set over current resolved authored members joined to their package-local `trait.lock` entries (`modules/io/src/layout/mod.rs:380-383`; `modules/io/src/lockfile.rs:22-64`; `modules/core/src/lockfile.rs:31-55,109-129,182-193`), with `N digests` its cardinality and a raw lock-entry count explicitly not it. `0267.2` then lands the single shared presentation that assembles the rendered provenance text and places it where a later screen leaf calls it (`0267.2` Done-when 4). This footer is that call site: it renders the same immutable served value the bar renders, through the same presentation, and reads no lock, computes no digest, shortens nothing and reassembles nothing. That presentation is not reachable from this task's declared closure, which is why `0267.2` is added to `depends-on` — see the relations note below.

**"A leaf the served answer cannot supply is unfinished work" is right for a built trait and wrong for the two row kinds that have no manifest.** A source-only authored package is `{trait_id, source_path}` (`modules/io/src/discovery.rs:63-118`) and an unreadable row is id, path and error (`lifecycle_reporting.rs:1541-1551`). Neither proves an empty variant set or an empty port set, so neither may render `none`, which is a data-derived claim about a decoded trait. Both stay selectable ordinary rows (`0267` Corrections 2 and 12), so both blocks render the typed unavailable/failure form `0267.3` established for those outcomes — visibly implemented, claiming nothing. The standalone case is the mirror: a standalone package has no family variant key at all, and Correction 5 forbids fabricating a `default` one, so its `variants` block renders the same one-leaf `none` empty state Correction 7 defines for ports.

**Relations note.** `depends-on` gains `0267.2`. This leaf's declared closure is `0267.3` → `0267.1`/`0265.12` → `0265.10`, which never reaches `0267.2`, and a charter's `depends-on` is not inherited by its children — `derived_status` evaluates `depends-on` only for the open leaf itself (`modules/core/src/task/graph.rs:115-177`). The footer's only non-duplicating source for the rendered provenance text is `0267.2`'s presentation, so without the edge this leaf is build-dependent on an unlanded sibling and the only alternatives are a second formatter (the two-readers-can-disagree defect Correction 4 exists to prevent) or a blocked run. The parent's own staging already orders `0267.2` before `0267.4`; this makes the encoded graph say what the staging says.
