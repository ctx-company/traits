## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the preview column's `variants` block, its `ports` block, and its provenance footer; plus the minimal extension of the selection-triggered detail answer `0267.3` landed so it carries per-member variant summaries and the representative member's declared ports, reachable by a non-GUI face.

- **The parent's corrections bind.** `0267`'s content corrections govern this leaf; Corrections 4, 5, 7, 9, 10 and 12 are the ones it touches directly, and where this file restates one it does not narrow it.

- **This leaf resolves nothing.** No manifest, family-table, trust-store, lockfile, `git`, cwd or clock read happens on the desktop side; no inventory scan, family aggregate, provenance resolution, digest computation or provenance string assembly is created anywhere. The inventory and its retained per-member records are `0267.1`'s, the detail request/response/refusal is `0267.3`'s, the provenance value is `0267.1`'s and its rendered text is `0267.2`'s presentation — all consumed as landed.

- **Two more served fields, not a second answer.** The variant summaries and the ports ride the existing selected-detail response. No second detail request, subscription, model, cache or timer enters, no whole-inventory rescan answers one selection, and no compact list row is widened.

- **One representative, already chosen.** For a family, `0267.3` established the declared default member as the representative for singular preview facts and put default/member identity in the stable selection key. The single `ports` block reads that same representative; unioning or merging ports across variants would invent an aggregation rule neither the parent nor the model has. Per-variant facts live in the `variants` rows.

- **Empty is a fact; absent evidence is not.** A decoded trait with no ports, and a standalone package with no family variant key, each render exactly one data-derived `none` leaf under their block heading. A source-only or unreadable selection renders `0267.3`'s typed unavailable/failure form instead, because `none` would be a claim its evidence does not support.

- **Compose the landed vocabulary, do not duplicate it.** `0265.12`'s fact-block form is the shape both blocks take; `0265.10`'s preview column frame, key/value row and preview-footer primitives carry the column and the footer; `0265.1`'s token entry point and IBM Plex faces carry every dimension, size and colour; `0267.2`'s provenance presentation produces the footer's text. A Traits-private copy of any of them is a defect even when it renders correctly.

- **Every leaf here is `data:`** and no literal from `reference/traits.html` — `basic`/`quick`/`complex`, `implement · review · commit`, `single pass, no review loop`, `task`, `duration`, `one board task, by key or name`, `81e5a39`, `5 digests` — is reproduced. The export is geometry authority only.

- Out of scope: the `trait` and `facts` blocks, the column frame itself and the detail request/response/refusal shape (`0267.3`); the header, the bottom bar and the provenance presentation (`0267.2`); the inventory, trust, family aggregate, provenance resolution, rows, section and menu entry (`0267.1`); moving the TUI's Traits and Trust screens onto the served answer and deleting their two-second poll (`0267.5`); trait authoring; any new trust mutation on any face; the light theme; pencil work of any kind; and every shared primitive `0265` already built.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0267.3` — the 380-wide preview column and its rule 13 order, the `trait` and `facts` blocks, the stable selection identity, the freshness gating, and the typed selection-triggered detail request, response and refusal these two blocks extend; it carries `0267.1`'s served answer and `0265.12`/`0265.10`'s block, key/value row and preview-footer primitives transitively. `0267.2` — the single shared provenance presentation the footer calls, which is not reachable through `0267.3`'s closure and which this leaf must not duplicate (see the relations note in `content`). Bind to the desktop project, components and non-interactive command those tasks actually landed, not to a path guessed here.

## Done when

1. **The `variants` block renders one row per actual family member, from the served answer.** For a family selection the block renders one key/value row per member the family table declares, keyed by that member's actual variant name as the shared assembly retained it, with the value equal to that member's own `Trait::effective_summary()` (`modules/core/src/trait/mod.rs:485-493`). A one-member family renders exactly one row and a three-member family exactly three, in the served order. What fails this: any use of `variant_names()`'s synthetic `default` selector (`modules/io/src/family_manifest.rs:59-70`), a fabricated `basic`/`quick`/`complex` set, a row keyed by anything other than the member's own variant name, a value taken from the row's `· N variants` count, the export's prose, or a renderer-side re-read of the family table. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch one-member and multi-member families whose members carry distinct effective summaries, `just test` for the shared projection, and the bounded review for the rendering.

2. **A standalone package's `variants` block renders one `none` leaf, not a fabricated default.** A standalone package has no family variant key, so the block renders with its heading and exactly one data-derived leaf whose value is `none` — no invented `default` row (`0267` Correction 5 forbids it), no dropped block, no dropped heading. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over a scratch standalone package, `just test`, and the bounded review.

3. **The `ports` block renders the representative member's actually declared ports, in declaration order.** One key/value row per declared port, keyed by that port's authored `Port.id` and valued by its `Port.description` (`modules/core/src/trait/port.rs:69-109`), in the order the served answer carries — which is the `Vec<Port>` declaration order (`modules/core/src/trait/mod.rs:389-391`), neither sorted nor deduplicated by this renderer or by a new shared projection. The representative is the one `0267.3` already established: the family table's declared default member, or the standalone package itself. A trait declaring no ports renders the block with its heading and exactly one data-derived `none` leaf (`0267` Correction 7). What fails this: a fixed `task`/`duration` pair, a port invented for a trait that does not declare it, a value taken from `title`, `hint`, `schema` or the export's prose, a union of ports across variants, and a dropped block or heading. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch traits with arbitrary port ids in a known declaration order and with no ports at all, `just test`, and the bounded review.

4. **The rows with no manifest render honestly rather than as `none`.** A source-only selection (`{trait_id, source_path}`, `modules/io/src/discovery.rs:63-118`) and an unreadable selection (id, path, error, `lifecycle_reporting.rs:1541-1551`) each render both blocks in `0267.3`'s typed unavailable/failure form for that outcome — headings present, no invented variant row, no invented port row, and no `none` leaf, because `none` asserts a decoded empty set neither has. Neither aborts the rest of the column or the screen. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch source-only and unreadable packages, `just test`, and the bounded review.

5. **Both blocks commit with the same accepted detail as `trait` and `facts`.** All four blocks are projected from one accepted detail response for one stable selection identity: an accepted freshness event marks all four non-current until a response matching the held selection is accepted, a response whose identity no longer matches the current selection is discarded rather than committed, and no state exists in which `variants` or `ports` shows one selection's data while `trait` or `facts` shows another's or a previous one's. A detail failure or a center outage renders fail-loud in both blocks — no blank success, no last-accepted content presented as current, no direct manifest or trust fallback, and no revival of the TUI's direct preview reader or its `read_store().unwrap_or_default()` semantics (`modules/cli/src/app/dashboard.rs:3704-3895`). Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over a rapid A→B selection with A's response arriving last and over an accepted freshness event while a selection is held, `just test`, and the diff read for an ungated or partial commit.

6. **The two served fields arrive without a second read of anything.** The variant summaries and the representative's ports travel in `0267.3`'s existing selected-detail response, projected from the per-member records `0267.1` already retained — no second detail request, subscription, cache, timer or model; no whole-inventory rescan for one selection; no desktop-side filesystem, `git`, cwd or clock read; no read per compact row, on hover, or on a freshness event for an unselected row; no CLI-private type crossing into the desktop; and no new dependency in `ctx-traits-io`, which still depends only on `ctx-traits-core` and its existing third-party set (`modules/io/Cargo.toml:12-29`). Blocking work stays in the connection worker rather than on the sole model/SQLite owner's request path (`modules/io/src/center.rs:3278-3333`) and off gpui's UI thread, and the extension stays public at the IO boundary so a non-GUI consumer can reach the same answer. A response carrying long summaries or many ports stays inside the 1 MiB wire bound (`center.rs:48-52`) or returns the typed refusal — never a silently truncated summary or port list that reads as a complete answer, which matters because a summary over 240 characters is only an advisory hygiene finding, not a rejection (`modules/core/src/launch/hygiene.rs:169-174`). Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` including an oversized-detail case, `just test`, and the diff read.

7. **The footer renders the bar's provenance value through the bar's presentation, and never softens a failure.** After a flex spacer, the column ends in a full-width, right-aligned Mono 10 `text-faint` line composing `0265.10`'s preview-footer primitive (`grammar.md:110-115`; `reference/traits.html:877-886`). On success its text is produced by calling `0267.2`'s single shared provenance presentation over the same immutable served value the bottom bar renders, and is byte-identical to the bar's provenance detail; the literal label `skill-lock` stays because the visual specification requires it, over the package-local `trait.lock` evidence `0267.1` resolved. This call site reads no lock, computes no digest, and does not shorten, parse, re-case, split or reassemble any part of the text; adding the footer is a render call, not a second provenance read. When the served value is a typed provenance failure, the footer renders that failure — no `pinned` claim, no blank or placeholder sha, no partial or raw lock-entry count presented as `N digests`, no stale success shown as current, and no omitted footer that reads as unfinished UI. If the presentation `0267.2` landed cannot be called from here, that is a prerequisite defect to report, not a second formatter to write. Decided by `just test`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served provenance success and each typed failure, and the bounded review's diff read for a second assembly site.

8. **Both blocks take the landed fact-block geometry, and every leaf is data.** Each block is a full-width column block with a lowercase Mono 11 `text-muted` heading, 8px internal gap and 20px bottom padding, whose rows are `space-between` and vertically centred with keys in Sans 11.5 `text-secondary` and values in Mono 10.5 `text` (`grammar.md:49-72`; `tokens.md:53-68,80-83`), composed from `0265.12`/`0265.10`'s primitives rather than a Traits-private reimplementation, inside the unchanged 380-wide column with `[18,22]` padding. The export at `reference/traits.html:745-876` is measurement for the width, gap and bottom padding only; its 12px keys and Sans 11.5 values conflict with grammar rule 7 and are not copied (`0267` Correction 9). No `placeholders` call site enters this column, no dot, pill, badge, icon, fill or corner radius appears in it, only the closed glyph set `↰ ↳ → · ∷` is used (`grammar.md:31-47`), and no light token or literal export colour is introduced. Decided by `just test` for the shared code these leaves render through, plus the bounded review walking `screens/traits.md:24-31` leaf by leaf; no repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented.

