## Approach

Suggested route, not a boundary. No standalone desktop project, gpui source, desktop lockfile or desktop validation command exists at this HEAD — no `Cargo.toml` in this repository names `gpui`, the root `Cargo.lock` has no `gpui` package, and `0256.1` is still `ready` — so no desktop path, module, component or command is named below. Discover each of them from what `0256`, `0265`, `0267.1`, `0267.2` and `0267.3` actually landed, and say in the work summary where the landed shape differed from what is described here.

**Reuse points, named by what lands them.** `0267.3`'s selected-detail request, response and refusal — extend the existing response with the two new fields; do not add a message. `0267.3`'s stable selection identity, freshness gating and identity-matched commit — inherit them by projecting inside the same accepted detail, not by acquiring a second gate. `0267.1`'s retained per-member records and its repository scope — the source of both new fields; `0267.1`'s immutable provenance value — the footer's input. `0267.2`'s shared provenance presentation — the footer's only text source. `Trait::effective_summary` (`modules/core/src/trait/mod.rs:485-493`) is the one prose projection, the same one the lede and the list row already use. `FamilyTable.variants`' map keys and `FamilyTable.default` (`modules/io/src/family_manifest.rs:23-35`) are the member identity and representative authority — never `variant_names()` (`family_manifest.rs:59-70`). `Port.id` and `Port.description` off `Trait.ports` in `Vec` order (`modules/core/src/trait/port.rs:69-109`; `modules/core/src/trait/mod.rs:389-391`) are the ports projection; `run_info::summarize_run_info` (`modules/core/src/run_info.rs:197-241`) already does a larger port projection for a different consumer and is not imported here to save a two-field map. `0265.12`'s fact block and `0265.10`'s key/value row, preview column frame and preview-footer primitive are the shapes; `0265.1`'s token entry point and IBM Plex faces carry every dimension and colour, so the export's hex values and paddings appear as token roles at the call site rather than as literals. Center precedents: the typed public client wrappers (`modules/io/src/center.rs:800-1079`) and the `Start`/`Control` shape — short owner-side resolution, blocking work in the connection worker (`center.rs:3278-3333`) — not the generic `Get` path that still blocks on the model owner (`center.rs:3607-3663`).

**Edit order.**

1. **Read what `0267.1`, `0267.2` and `0267.3` actually landed** before writing anything: whether the retained per-member records already carry effective summaries and ports or only the fields `0267.3` needed; the exact detail response shape and its typed source-only, unreadable, missing, stale and refusal outcomes; the signature and placement of the shared provenance presentation; and the freshness and commit gate. Everything below depends on that reading, not on a guess. If a prerequisite already carries one of these fields, consume it rather than adding a parallel one.
2. **Retain and project the two fields at the shared assembly boundary** — each family member's actual variant key with its own `effective_summary()`, and the representative member's declared ports as id/description pairs in declaration order — only as wide as this cut demonstrates a consumer for, per the parent's extraction rule, and without touching the compact row.
3. **Extend the detail response** in `modules/io/src/center.rs` beside `0267.3`'s arm, with the same typed outcomes for source-only, unreadable, missing, stale and refused, and with the wire bound honoured as a typed refusal rather than a truncation.
4. **The two blocks**, in `screens/traits.md`'s order after `facts`, each composing the landed fact block, with the `none` empty state and the typed unavailable/failure renderings written alongside the resolved rendering rather than after it.
5. **The footer** last: flex spacer, then the preview-footer primitive fed by `0267.2`'s presentation over the served provenance value, with the typed failure path written at the same time as the success path.

**What must be proven** (observations, not mechanics): over scratch repositories, manifests, family tables, lockfiles and trust documents only — a one-member family rendering exactly one variant row keyed by its real member name; a multi-member family rendering one row per member with each member's own distinct effective summary; a standalone package rendering the `variants` `none` leaf and no fabricated default; a trait with several arbitrarily-named ports rendering id/description pairs in declaration order; a trait with no ports rendering the `ports` `none` leaf; source-only and unreadable selections rendering both blocks in their typed form with no `none` and no invented facts; an oversized detail answer refused rather than truncated; a rapid A→B selection whose A response arrives last leaving B's four blocks intact; an accepted freshness event marking all four blocks non-current until the matching response is accepted; provenance success producing footer text byte-identical to the bar's detail; and each typed provenance failure rendering as a failure in the footer. `modules/cli/tests/proof_center.rs` is the existing process-boundary suite `0267.1` and `0267.3` already extend, which is why it is the declared home for the wire observations rather than a new binary; `modules/cli/tests/proof_trust_family_report.rs` is the existing scratch-only regression evidence that per-member family records survive. No test may assert on this repository's own trait packages, `trait.lock` files or board, and no `implement`, `basic`/`quick`/`complex`, `task`/`duration`, export prose, count or sha is valid proof data.

**Desktop lane.** No repo-root command inspects a rendered gpui screen at this HEAD, so none is declared. Once `0256.1` has landed its documented non-interactive command, run it as additional proof and — if it is repo-root-relative, non-interactive and carries its whole verdict in its exit code — add it here verbatim rather than guessing at its name now.

## Watch

- **The spec's `task / duration` is an example, not a contract** (`0267` Correction 7). The block renders what the trait declares, or one `none` leaf.
- **`none` is a claim about decoded data.** A source-only or unreadable selection has no decoded trait, so it renders the typed unavailable form instead; using `none` there makes "no manifest" indistinguishable from "no ports".
- **A block never disappears with its data.** Dropping the heading when the set is empty makes an empty fact indistinguishable from unimplemented UI.
- **Variant rows are members and their own summaries.** Not `variant_names()`, not the row's variant count, not the export's prose, not the default member's summary repeated across rows.
- **The representative is already chosen.** `0267.3` fixed the declared default member for singular facts; re-deriving one here, or unioning ports across variants, invents a rule the parent does not have.
- **Declaration order is the order.** No sort, no dedup, no reshuffle between the served projection and the rendered row.
- **One provenance value, one formatter, two call sites.** The footer takes `0267.2`'s presentation; a string built here that agrees with the bar today drifts tomorrow, and a failure rendered as a blank sha or a partial count makes both lines lie.
- **Detail is selection-scoped and already gated.** No second request, no rescan, no eager per-row fetch, no client timer, no blocking work on gpui's UI thread or on the center's model-owner request path, and no read from the desktop's filesystem, `git` or cwd.
- **All four blocks commit together.** `variants` or `ports` updating while `trait` or `facts` lags is the partial commit Correction 10 forbids.
- **Refuse rather than truncate.** Long summaries and long port lists are legal data; a silently clipped response reads as a complete one.
- **`grammar.md` and `screens/traits.md` are the specification; `reference/traits.html` is measurement.** Copy the width, gap 8 and bottom padding 20; do not copy its 12px keys, its Sans values, its names, prose, counts or sha.
