Footer consequence (decision 3, `FOOTER_LIMIT = 5`): SESSIONS renders
`[?] guide · [.] menu · [Enter] attach/expand · [a] answer · [n] spawn`, and
each other screen the same two LEAD entries plus its own first three.

### The predicates

Every predicate is `fn <name>(state: &State) -> bool`, defined in this module,
reading already-loaded `State` through `super::` seams — no I/O, no lock probe,
no center read (decision 4). Exact bodies:

- `always` — `true`. `never` — `false`; `never` is used by exactly the two
  `LEAD` rows, which keep their footer and guide presence (neither surface
  filters by applicability) and are dropped only by the menu, which fires what
  it lists.
- `can_attach_or_expand` — `state.sessions_visible.get(state.list_sessions.selected()).is_some()`
  (a header expands, a row attaches; `SessionClass::can_attach`
  `dashboard.rs:216-218` still gates the attach half at execution time).
