   `D=modules/cli/src/app; ! rg -q "render_hint_line" "$D" && ! rg -q "↑↓/jk list" "$D/dashboard.rs" && ! rg -q "keymap::hint_line|keymap::global_tail_hint" "$D/dashboard.rs" && ! rg -q "Binding" "$D/dashboard/keymap.rs" && ! rg -q "GLOBAL_TAIL|fn hint_line\\(|fn global_tail_hint\\(" "$D/dashboard/keymap.rs" && ! rg -q "KeyCode::(Char\\('.'\\)|Enter) if state\\.screen" "$D/dashboard.rs" && [ "$(rg -c "Modal::confirm\\(.exit." "$D/dashboard.rs")" = 1 ] && rg -q "fn open_exit_modal\\(" "$D/dashboard.rs" && rg -q "pub\\(crate\\) struct ActionRow" "$D/tui_kit.rs" && rg -q "fn action_rows\\(screen: Screen\\)" "$D/dashboard/keymap.rs" && rg -q "fn run_command\\(" "$D/dashboard.rs" && rg -q "fn handle_command_key\\(" "$D/dashboard.rs"`
   It exits 0 only when the old renderer, the navigation literal, both keymap
   render helpers, every `Binding` in `keymap.rs` — the type a parallel hint
   table would need, so its absence is the mechanical form of decision 5 — the
   `Binding` tables' accessors, and every screen-guarded key-dispatch arm are
   gone; when exactly one site constructs the exit confirm, behind
   `open_exit_modal`; AND when the registry type, the row tables, the
   executor, and the key dispatcher exist. The dispatch-arm pattern is
   deliberately narrow — `KeyCode::<key> if state.screen ...`, all 30 of whose
   current matches sit inside `handle_key`'s final match and
   `handle_focus_key`, both rewritten here. A bare `if state.screen ==`
   pattern would be wrong: 35 lines match it today and several
   (`queue_sessions_pane_key`, `handle_navigation_key`, `draw_screen`,
   `handle_focus_key`'s `Esc` arm) legitimately survive this task. It fails on
   the pre-implementation tree — `render_hint_line` and `↑↓/jk list` both
   exist at HEAD — so a green run is real evidence, not a vacuous match.
2. The scratch-screen proof passes: one registered row drives dispatch, the
   footer, the `?` guide, and the command menu, and deleting that row removes
   all four at once; `footer_hints` over `?`/`guide` and `d`/`dash` rows
   renders exactly `[?] guide · [d] dash`, the parent's spelling, derived;
   the overlay scrolls, fires only menu entries, and closes; the key matcher
   allows SHIFT and rejects CONTROL/ALT; no screen binds a key twice; every
   `DashCmd` variant has at least one row (`RepoScope` deliberately has two,
   SESSIONS and MERGES) and every row carries a nonempty single-line label and
   explanation; a menu whose row a snapshot replaced fires nothing and says
   `selection changed; reopen actions`; the SESSIONS menu lists exactly the
   applicable actions, never offers `Guide` or `Menu`, and Enter fires the
   selected one through the same seam the key uses; every screen's footer begins
   `[?] guide · [.] menu` and every guide entry comes from an `ActionRow`; the
   relocated state text is on the status row.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib action_registry_`
3. Nothing that routed keys before this task regressed — the modal focus trap,
   SESSIONS autorepeat and paging, stable selection across reloads, the
   authoritative action rechecks, and the loading/stale/message footer rows.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib`
4. The landing gate is green.
   `CARGO_TARGET_DIR=target just test-full`
5. The diff touches only the three implementation files, plus this task file
   if the board updates it. The verdict is in the exit code, not in the eye:
   `test -z "$(git status --short | cut -c4- | rg -v '^(\\.internal/tasks/0252\\.6-one-action-registry\\.toml|modules/cli/src/app/tui_kit\\.rs|modules/cli/src/app/dashboard/keymap\\.rs|modules/cli/src/app/dashboard\\.rs)$')"`
   Any other path — a stray `tui_demo.rs`, `tui_panes.rs`, `run_view*`, a new
   test file under `modules/cli/tests/`, a `Cargo.toml` — survives the `rg -v`
   and makes the string non-empty, so the command exits 1. The task file is
   allowed because the board rewrites it in place; it is not implementation
   scope, and no step above edits it.

Criteria 1-4 each carry a runnable command and a `[[checks]]` entry.
Criterion 5 carries a runnable command but deliberately NO `[[checks]]` entry:
checks execute in a clean detached worktree of the merged sha, where
`git status --short` is empty by construction, so the entry would exit 0 for
every possible diff. A check that cannot fail is worse than no check
(standing doctrine), so criterion 5 stays an implementer-run command,
executed in the working tree where it can actually fail.

Run Step 0's reread first, then the steps in order, running the incremental
build command declared at the end of Steps 1, 2, and 4 rather than building
only at the end, so a generics/exhaustiveness/borrow error surfaces next to the
edit that caused it. Then run the criterion commands 1, 2, 3, 4, 5 in that
order. Permit at most two targeted repair-and-rerun rounds in total; after each
repair rerun the failing command and every later one. Complete only when all
five criterion commands exit 0.
