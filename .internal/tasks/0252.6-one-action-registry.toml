schema-version = "0.2"
key = "0252.6"
title = "One action registry: footer, guide, and menu from the same rows"
status = "ready"
raised = "2026-08-24"
content = """
Footer soup is a symptom: hints are hand-written strings living apart from
the key handlers they describe, so screens accumulate both and neither can
be trusted. `dashboard/keymap.rs` already admits this in its own header —
"`handle_key`'s screen arms remain the actual dispatch" (`keymap.rs:1-8`) —
and `tui_kit::Binding` carries only two display strings (`tui_kit.rs:750-758`),
so it cannot match a `KeyEvent`, hold an explanation, or say whether a verb
applies. Meanwhile `footer_line` (`dashboard.rs:8715-8772`) composes a
hand-written navigation prefix, the map-derived hints, a dynamic scope verb,
a dynamic orphan verb + count, a mark count, and a list position into one
row. Three authorities, one row. The fix is structural.

## Decisions this plan fixes (the task text does not decide them)

1. **What counts as a registered action.** Exactly the keys that today reach
   `handle_key`'s final `match key.code` (`dashboard.rs:2998-3090`) plus the
   two screen-specific `Enter` arms in `handle_focus_key`
   (`dashboard.rs:3105-3115`). Structural key handling — Ctrl-C, Alt-arrows,
   `Tab`/`BackTab`/`1`-`5` screen switching, list movement (`↑↓`/`jk`,
   including the autorepeat coalescer at `dashboard.rs:2847-2861`),
   `PageUp`/`PageDown` paging, `Enter`/`Esc` focus, story-view keys, and the
   overlay's own keys — is deliberately NOT registered. Those keys run before
   the registry and keep their exact current behavior; folding them in would
   mean either faking dispatch through a table that does not actually
   dispatch them, or restructuring the autorepeat fast path for no behavior
   change. They are documented on no surface at all after this task — decision
   5 states that cost plainly rather than smuggling them back in as a
   hand-written trailer.
2. **Menu opener key: `.`** — verified unbound in `handle_key` today, as are
   `?`, `:`, `/`. `/` and `:` both read as "type something" in a TUI; `.`
   types nothing and means "the actions for THIS item". `?` is the guide, per
   the parent.
3. **Footer content: declaration order plus a fixed limit — no priority
   field.** `action_rows(screen)` returns `[? guide, . menu]` ++ the screen's
   own rows ++ `[r reload, q quit]`; the footer renders the first
   `FOOTER_LIMIT = 5`. Each screen table is therefore ordered most-used-first
   and its first three rows are what the footer shows. The footer does NOT
   filter by applicability — which is also why `?` and `.` still appear in it
   although decision 4 makes them inapplicable rows: footer chrome that
   reflowed as the selection moved would be its own kind of noise, and the
   menu already answers "what applies here".

   **The parent's `[?] guide · [d] dash` is the format, and it is derived,
   not typed.** That exact string is the live run view's own footer today:
   `LIVE_VIEW_GUIDE_ENTRY` prepended to `LIVE_VIEW`, whose first verb is `d`
   = back to the dashboard (`tui_kit.rs:780-820`,
   `run_view/render.rs:400-408`). The grammar it fixes is `[<key>] <lowercase
   label>` joined by ` · `, which is exactly what `render_hint_list`
   (`tui_kit.rs:760-768`) already emits and what `footer_hints` reuses. The
   dashboard footer cannot carry the entry `[d] dash` itself: the dashboard
   has no "go to the dashboard" verb, and `d` is already taken three ways
   there — SESSIONS delete, MERGES deep merge, TASKS dispatch. All three keep
   their key; none is renamed or moved to make room for a verb that would do
   nothing. The contract is therefore proved the only way it can be proved
   without lying about the dashboard's verbs: a `footer_hints` test declares
   two `ActionRow`s, `?`/`guide` and `d`/`dash`, and asserts the derived
   string is byte-for-byte `[?] guide · [d] dash`; each dashboard screen's
   footer then asserts the same derivation with its own verbs, beginning
   `[?] guide · [.] menu`. The live view's real footer keeps that spelling
   untouched (decision 8), PTY assertion included
   (`proof_run_view_exit_teardown.rs:218-237`).
4. **Applicability is a cheap "is this meaningful for this row", never a
   probe.** A predicate returns false only when the row projection or screen
   state already proves the verb is meaningless (no selection, wrong row
   kind, class mismatch). Anything that needs a driver-lock probe, a center
   read, a filesystem read, or a dependency evaluation stays `true` and
   refuses at execution time with its existing message — the established
   inline refusals (`open_kill_modal` `:4535-4584`, `open_answer_modal`
   `:4586-4673`, `dispatch_selected_task` `:7740-7789`) must survive this
   task, not be erased into an invisible menu row. Predicates are pure reads
   of already-loaded `State`: no I/O, no locks, no side effects — the menu
   opens on a keypress and must be instant.

   Exactly two rows are declared inapplicable outright — `?` guide and `.`
   menu, both using `fn never(_: &State) -> bool { false }`. They are real
   registry rows: they own their key, they dispatch through the registry, and
   they show in the footer (decision 3) and in the guide (decision 6). But
   they open overlays; they are not verbs over the current item, and
   `handle_command_key` intercepts them before `run_command` is ever called.
   `never` is what keeps the applicable-action menu from listing an entry
   whose Enter would land on `run_command`'s `unreachable!` — the menu shows
   only rows a `run_command` arm can actually execute.
5. **Where the removed footer text goes.** The dynamic state — list position,
   `[ALL]` repo scope, orphan count and shown/hidden, mark count — moves to
   the footer's SECOND row, the status row `keymap_footer` already renders
   (`tui_kit.rs:861-872`), shown whenever no message/loading/stale/explanation
   text claims it. Action labels are therefore static verbs (`repo scope`,
   `orphans`), never state-dependent strings.

   The navigation/focus/screen-switch keys go NOWHERE. They are not registered
   actions (decision 1), so they get no footer entry and no `?` entry. There
   is no `Binding` trailer and no `keymap::NAVIGATION` table: a hand-written
   hint list feeding the guide would be the very second authority this task
   exists to delete, moved one surface over and no less parallel for it. Every
   entry in every derived surface comes from an `ActionRow` or it does not
   exist — that is the invariant, and Step 6 asserts it. The cost is stated
   plainly rather than papered over: after this task `↑↓`/`jk`, `PgUp`/`PgDn`,
   `Enter`/`Esc` focus, `Tab`/`1`-`5`, and `alt+arrows` are undocumented on
   screen, though every one of those keys behaves exactly as it does today.
   Documenting them again means registering them for real — dispatch included,
   autorepeat fast path restructured — which is a parent-level decision about
   what an "action" is, not this task's; it is listed under Out of scope.
6. **The `?` overlay never fires anything.** It is the full reference list for
   the current screen, including rows that do not apply. The menu is the only
   firing surface, which is why an overlay entry carries
   `id: Option<DashCmd>` and Enter fires only `Some`.
7. **The menu binds to the selection it described, and captures no index.**
   Entries are built once at open from the current selection, and the LOGICAL
   identity of that selection is captured beside them
   (`menu_selection(state)`, Step 4). The overlay traps `j`/`k`, so the cursor
   cannot move underneath it — but snapshots keep applying while it is open
   (`run_with_initial_session` never stops draining them), so the row the menu
   described can be removed, reclassified, or replaced under an unchanged
   cursor index, and `restore_visible_selection` (`dashboard.rs:2025-2058`)
   deliberately lands the cursor on the group header — or on another row —
   when the described session is gone. Enter would then aim a destructive verb
   (`d` delete, `x` stop) at a row the menu never described.

   So before firing, the captured identity is compared with the identity the
   live state selects NOW. Equal => fire. Different => close the overlay, say
   `selection changed; reopen actions`, execute nothing. The comparison is by
   logical identity (session id, group, trait id, merge session id, trust
   trait id + digest, task key), never by index, so a snapshot that merely
   redraws the same row still fires. On a match, firing calls the same `open_*`
   seam the key already called, which re-looks-up by its own identity rules and
   re-checks eligibility. No second implementation, no index-addressed side
   effect, and no verb aimed at a row the menu never listed.
8. **Scope stops at the dashboard.** `?` in the live/attached run view
   (`run_view.rs:1368-1389`, `run_view/guide.rs:260-276`) keeps its paid-guide
   meaning and is not touched. `LIVE_VIEW`, `LIVE_VIEW_GUIDE_ENTRY`,
   `GUIDE_MODAL`, and `STORY_VIEW` stay `Binding` tables.

## Files touched (repo-relative, nothing else)

- `modules/cli/src/app/tui_kit.rs`
- `modules/cli/src/app/dashboard/keymap.rs`
- `modules/cli/src/app/dashboard.rs`

`tui_demo.rs` is deliberately NOT touched: the scratch-screen proof lives as a
scratch unit test in `tui_kit.rs` (precedent: the existing scratch
`TestBackend` tests at `tui_kit.rs:1476` and `:1539`), which proves the same
construction without colliding with 0252.3's demo edits. `tui_panes.rs`,
`run_view.rs`, `run_view/render.rs`, `run_view/guide.rs`, `trait_editor.rs`,
`modules/core`, `modules/io`, CLI argument parsing, dependencies, and
`modules/cli/tests/` are all out of scope.

## Step 0 — pre-edit reread (sibling-order independence)

0252.3 and 0252.5 both edit `dashboard.rs`/`tui_kit.rs` and either may land
first. This plan touches neither `Modal` nor any delete implementation, so it
is order-independent, but two anchors must be re-read before editing rather
than assumed:

- Re-locate every line anchor cited below by symbol name (`rg -n "fn <name>"`),
  never by the line number, which is a reading aid only.
- Read the `d` handling on SESSIONS. If a group header already deletes a group
  (0252.5 landed), the SESSIONS `d` row's predicate is "a selected session row
  OR a selected group header"; if not, it is "a selected session row".
  Everything else is unchanged either way.

No edits in this step.

## Step 1 — registry primitives (`tui_kit.rs`)

New symbols, exact signatures:

- `pub(crate) struct KeySpec { pub(crate) display: &'static str, pub(crate) codes: &'static [KeyCode] }`
  — `display` is the one presentation string (`"Enter/m"`, `"space"`, `"A"`);
  `codes` is every physical key that fires the row, so today's aliases
  (MERGES `Enter`/`m`) survive as ONE row rather than two rows sharing an id.
- `impl KeySpec`:
  - `pub(crate) const fn new(display: &'static str, codes: &'static [KeyCode]) -> Self`
  - `pub(crate) fn matches(&self, key: &KeyEvent) -> bool` — true when
    `self.codes.contains(&key.code)` AND
    `!key.modifiers.intersects(KeyModifiers::CONTROL | KeyModifiers::ALT)`.
    SHIFT is deliberately allowed: crossterm reports `A`/`S`/`R` as
    `Char('A')` + SHIFT, and today's arms match those. Rejecting CONTROL/ALT
    is a **deliberate tightening**, not an accident: today `ctrl-d` on
    SESSIONS reaches the delete arm because `match key.code` ignores
    modifiers. Say so in the doc comment.
  - `pub(crate) fn binding(&self, label: &'static str) -> Binding` — the reuse
    seam into the existing `render_hint_list`.
- `pub(crate) struct ActionRow<Cmd: Copy + 'static, Ctx: 'static> { pub(crate) id: Cmd, pub(crate) key: KeySpec, pub(crate) label: &'static str, pub(crate) explain: &'static str, pub(crate) applies: fn(&Ctx) -> bool }`
  — `Cmd` is the consumer's command id, `Ctx` the consumer's state. The kit
  holds metadata and applicability only; the executor stays with the
  consumer, so the kit never learns about `RatatuiPane` or `State`.
- `impl<Cmd: Copy, Ctx> Clone for ActionRow<Cmd, Ctx>` (`fn clone(&self) -> Self { *self }`)
  and `impl<Cmd: Copy, Ctx> Copy for ActionRow<Cmd, Ctx> {}` — written by
  hand, not derived: `#[derive(Copy)]` would emit a `Ctx: Copy` bound and
  `Ctx = State` is not `Copy`, even though `Ctx` appears only behind
  `fn(&Ctx)`.
- `pub(crate) fn action_for_key<Cmd: Copy, Ctx>(rows: &[ActionRow<Cmd, Ctx>], key: &KeyEvent) -> Option<Cmd>`
  — first row whose `key.matches`. An unregistered key returns `None` and
  therefore cannot act.
- `pub(crate) fn applicable_actions<'a, Cmd: Copy, Ctx>(rows: &'a [ActionRow<Cmd, Ctx>], ctx: &Ctx) -> Vec<&'a ActionRow<Cmd, Ctx>>`
- `pub(crate) fn footer_hints<Cmd: Copy, Ctx>(rows: &[ActionRow<Cmd, Ctx>], limit: usize) -> String`
  — `render_hint_list(rows.iter().take(limit).map(|r| r.key.binding(r.label)))`,
  i.e. exactly the parent's `[?] guide · [d] dash` shape, produced by the
  function that already produces it.

Changed/removed:

- **Remove** `pub(crate) fn render_hint_line(...)` (`tui_kit.rs:770-778`). Its
  only non-test caller is `footer_line`'s story-view branch
  (`dashboard.rs:8718`), rewritten in Step 5 to `render_hint_list` so exactly
  one hint format survives in the dashboard. In
  `every_binding_appears_in_live_view_guide_modal_and_story_view_hints`
  (`tui_kit.rs:2008-2016`) switch the story-view block to `render_hint_list`
  and its expected string to `format!("[{}] {}", ..)`.
- Amend the module header (`tui_kit.rs:1-21`) to name the registry among the
  kit's surfaces, keeping the two-tone palette paragraph and the 2026-07-24
  test ruling verbatim.

Build before continuing, with exactly this command:
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

## Step 2 — the overlay widget (`tui_kit.rs`)

One component backs both derived overlays; the only difference is whether an
entry carries a command id.

- `pub(crate) struct OverlayEntry<Cmd> { key: String, label: String, explain: String, id: Option<Cmd> }`
  with read accessors `pub(crate) fn key(&self) -> &str`,
  `pub(crate) fn label(&self) -> &str`, `pub(crate) fn explain(&self) -> &str`,
  and `pub(crate) fn id(&self) -> Option<Cmd>` (requires `Cmd: Copy`).
- `pub(crate) enum OverlayOutcome<Cmd> { Pending, Closed, Fire(Cmd) }`
- `pub(crate) struct ActionOverlay<Cmd> { title: String, entries: Vec<OverlayEntry<Cmd>>, list: ScrollList }`
  — no trailer field and no free-text section: an overlay can only ever show
  what its `entries` hold, and both constructors build `entries` from
  `ActionRow`s alone (decision 5). There is no seam through which a
  hand-written hint could enter either derived overlay.
- `impl<Cmd: Copy> ActionOverlay<Cmd>`:
  - `pub(crate) fn guide<Ctx>(title: impl Into<String>, rows: &[ActionRow<Cmd, Ctx>]) -> Self`
    — every row, applicable or not, `id: None` (decision 6).
  - `pub(crate) fn menu<Ctx>(title: impl Into<String>, rows: &[ActionRow<Cmd, Ctx>], ctx: &Ctx) -> Self`
    — `applicable_actions` only, `id: Some(row.id)`. Rows whose predicate is
    `never` (decision 4: `?` and `.` themselves) therefore cannot reach the
    menu, so the menu can never offer an entry `run_command` refuses.
  - `pub(crate) fn is_empty(&self) -> bool`
  - `pub(crate) fn entries(&self) -> &[OverlayEntry<Cmd>]`
  - `pub(crate) fn selected(&self) -> usize`
  - `pub(crate) fn handle_key(&mut self, key: &KeyEvent) -> OverlayOutcome<Cmd>`
    — `Esc` / `q` / `?` / `.` => `Closed`; `Enter` => `Fire(id)` for the
    selected entry's `Some(id)`, else `Pending`; otherwise `scroll_key(key)`
    applied to `list` => `Pending`; everything else `Pending`. The overlay
    consumes every key it sees: it is a focus trap, exactly like `Modal`.
- `pub(crate) fn render_action_overlay<Cmd>(frame: &mut ratatui::Frame<'_>, area: Rect, overlay: &mut ActionOverlay<Cmd>)`
  — `centered_rect` (`tui_kit.rs:921`) at `min(area.width, 70)` by the row
  budget, `Clear`, a `Block::bordered` titled with `overlay.title` in
  `dim_style()`, then one line per entry: `[key] label` in the default style
  and ` — explain` with `Modifier::DIM`, the selected row `Color::Green` (the
  same selection tone `windowed_list_in_range` already uses). Sizes through
  `ScrollList::set_len`/`window` so a long list scrolls instead of
  overflowing, and degrades inside whatever `Rect` it is given. Named ANSI
  foreground plus `DIM`/`BOLD` only: no background, no reverse video.

Build again before continuing:
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

## Step 3 — the declarations (`dashboard/keymap.rs`)

Rewrite this module. Its header currently states that screen arms remain the
dispatch; after this task that sentence is false and must be replaced by the
opposite contract. The 0148 case-discipline paragraph (`keymap.rs:10-15`)
stays — it still governs which key a verb gets.

**Removed**: `pub(super) const GLOBAL_TAIL`, `const SESSIONS`, `const TRAITS`,
`const MERGES`, `const TRUST`, `const TASKS` (all `&[Binding]`),
`pub(super) fn bindings`, `pub(super) fn hint_line`,
`pub(super) fn global_tail_hint`, and both existing tests
(`no_duplicate_key_within_a_context`, `every_binding_appears_in_its_own_hint_line`).

**Added**:

- `pub(super) type DashRow = ActionRow<DashCmd, State>;`
- `const LEAD: &[DashRow]` — `?` guide, `.` menu, both with the `never`
  predicate (decision 4).

No `Binding` value and no hint-only table is declared in this module after the
rewrite: `use tui_kit::Binding` is dropped from it, so a parallel hint list
cannot be reintroduced here without re-importing the type (decision 5).
Criterion 1 greps this file for the bare word `Binding` and fails on a hit, so
do not name the type in a comment either — say "hint table" if the header
needs to explain what is gone. `Binding` itself stays in `tui_kit.rs`: the
live-view/guide/story tables still use it, and `KeySpec::binding` is the reuse
seam into `render_hint_list`.
- `const TAIL: &[DashRow]`, and `const SESSIONS/TRAITS/MERGES/TRUST/TASKS:
  &[DashRow]`, each ordered most-used-first so its first three rows are the
  footer (decision 3), and each covering exactly the keys `handle_key` binds
  today for that screen — no key gained, none lost. Every field of every row
  is fixed by the declaration matrix below.
- `pub(super) fn action_rows(screen: Screen) -> Vec<DashRow>` —
  `LEAD.iter().chain(screen_rows(screen)).chain(TAIL).copied().collect()`.
  A `Vec` of ~14 `Copy` rows is built once per frame for the footer and once
  per overlay open; that is far below the `format!` traffic `footer_line`
  already does per frame, and it is what lets one flat slice feed all four
  derived surfaces.
- `fn screen_rows(screen: Screen) -> &'static [DashRow]` (private).
### The declaration matrix — every production row, in declaration order

Nothing here is left to the implementer: id, display key, physical codes,
label, one-line explanation, and predicate are all fixed. `codes` drops the
`KeyCode::` prefix for width — `Char('a')` means `&[KeyCode::Char('a')]`.
Labels are static lowercase verbs (decision 5 — never state-dependent);
explanations are exactly one line, no trailing period, and say what the verb
DOES, not when it applies (the menu already answers that).

