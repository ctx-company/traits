schema-version = "0.2"
key = "0252.6"
title = "One action registry: footer, guide, and menu from the same rows"
status = "ready"
raised = "2026-08-24"
content = """
Footer soup is a symptom: hints are hand-written strings living apart from the
key handlers they describe, so screens accumulate both and neither can be
trusted. `dashboard/keymap.rs` says so in its own header — "`handle_key`'s
screen arms remain the actual dispatch" — and `tui_kit::Binding`
(`tui_kit.rs:870-878`) carries only two display strings, so it cannot match a
`KeyEvent`, carry an executor id, hold an explanation, or say whether a verb
applies. Meanwhile `footer_line` (`dashboard.rs:8530-8588`) concatenates three
authorities into one row: a hand-written navigation literal, the keymap-derived
hints, and hand-built dynamic scope/orphan/mark/position text — while the keymap
table itself omits `v` and `o`, which `footer_line` writes by hand. Parent 0252
(lines 43-45) rules that a short footer in `[?] guide · [d] dash` grammar, a `?`
that opens the full list, and a command-menu key that lists what applies to the
current item all derive from one action registry. That is this task.

## Goals and approach are different things in this plan

**Goals are binding.** Every "Done when" criterion below states an observable
outcome and names a runnable command that decides it, and the exclusions at the
end are binding too.

**Everything else is the suggested route.** The file list, symbol names,
signatures, the declaration inventory, predicate expressions, edit order,
intermediate build commands, and proof mechanics are the architect's best
guidance from reading HEAD, not a boundary. Where a goal genuinely requires
deviating — a different symbol shape, an extra supporting file, a different way
to observe a required behavior — deviate, and report the deviation in the work
summary. It is not a violation and does not need escalation.

## Settled decisions (the parent does not decide these; this plan does)

1. **What the registry dispatches, and what it only documents.** A row is
   either *dispatched* — the registry matches the key and calls the executor —
   or *reference-only*: declared in the same registry, shown in the `?` guide,
   never matched by the registry and never shown in the footer or menu.
   Reference rows exist because the parent says `?` opens the full list, and
   because today's footer documents `↑↓/jk`, `PgUp/PgDn`, `Enter focus`,
   `Esc list`, and `Tab/1-5`. Dropping that documentation would be a regression
   this cleanup did not ask for; re-adding it as a hand-written navigation table
   would recreate the second authority this task exists to delete. So structural
   keys — list movement (including the autorepeat coalescer at
   `dashboard.rs:2868-2889`), paging, `Enter`/`Esc` focus, `Tab`/`BackTab`/`1`-`5`,
   alt+arrows, and Ctrl-C — keep their exact current handling **above** the
   registry and are declared as reference rows so the guide can name them. Rows
   internal to the overlay itself are not declared: the overlay is the thing on
   screen, not a screen.

2. **Applicability is a menu concept only, never a gate on the key.** Pressing a
   registered key dispatches its command exactly as today, whether or not the
   row "applies"; the executor's own authoritative checks and refusal messages
   are what refuse, unchanged. Applicability decides only which rows the command
   menu lists. A predicate is a pure read of already-loaded `State`: no center
   call, no lock probe, no filesystem read, no git probe, no dependency
   evaluation, no side effect — the menu opens on a keypress and must be
   instant. Anything needing a probe stays applicable and refuses at execution.

3. **Modifier semantics do not change.** Today the final dispatch matches
   `key.code` and ignores modifiers after the Ctrl-C and alt+arrow special
   cases, so ctrl/alt plus a command character reaches the command arm. This
   task preserves that. Rejecting CONTROL/ALT on command keys would be a real
   behavior tightening that neither the parent nor any code evidence requires;
   it is out of scope, and a lean no-regression migration does not smuggle it
   in. Ctrl-C and alt+arrows keep their precedence above the registry.

4. **The overlay openers are dispatched rows that the menu never lists.** They
   own their key, they dispatch through the registry, and they appear in the
   footer and guide — but they are not verbs over the current row, so their
   applicability is false and the menu cannot offer an entry whose execution has
   no meaning. The menu is the only firing surface; the guide fires nothing.

5. **Where the removed footer text goes.** Scope `[ALL]`, TRUST orphan count and
   shown/hidden, mark count, and list position move to the footer's **second**
   row — the status row `tui_kit::keymap_footer` (`tui_kit.rs:983-992`) already
   renders and `tui_panes::screen_regions` (`tui_panes.rs:30-46`) already
   reserves. Row two's existing precedence — loading/preview-pending, stale
   refresh error, generated-explanation state, then `state.message` — is
   preserved exactly; the relocated text is the new fallback where row two is
   currently empty. Row-one labels are therefore static verbs (`repo scope`,
   `orphans`), never state-dependent strings.

6. **The menu binds to the selection it described, by repository-aware
   identity.** `run_with_initial_session` keeps applying worker snapshots while
   an overlay is open (`dashboard.rs:2773-2892`), and those snapshots replace
   sessions/traits/merges/trust and rebuild projections (`1480-1617`), so the row
   a menu described can be removed, reclassified, or replaced under an unchanged
   cursor. Before firing, the identity captured at open is compared with the
   identity the live state selects now: equal fires, different closes the overlay
   and executes nothing, with a message saying the selection changed. The
   comparison is **logical, never by index**, and for SESSIONS and MERGES it is
   **repository-aware** — `SessionId` is only nonempty text and is not
   machine-wide unique (0252.5, lines 146-152), and in ALL-repositories mode two
   repositories can expose the same session id at once, so a bare session-id
   guard would not actually prove the menu fires on the row it listed.
   `SessionRow` carries `repo_key`, `repo_path`, and an authoritative
   `ledger_path`; `MergeRow` carries `ledger_path` and `repo_path`
   (`dashboard.rs:220-243`, `412-438`). Existing `VisibleSelection` and
   `restore_visible_selection` (`2009-2095`) and the modal action tags
   (`5280-5319`, `5433-5508`) key on session id alone; that pre-existing all-repo
   weakness is not this task's to fix, but the new pre-fire guard must not
   reproduce it.

7. **Scope stops at the dashboard.** `?` in the live/attached run view
   (`run_view.rs:1379`, `run_view/guide.rs:266`) keeps its paid-guide meaning and
   is untouched. `LIVE_VIEW`, `LIVE_VIEW_GUIDE_ENTRY`, `GUIDE_MODAL`, and
   `STORY_VIEW` stay `Binding` tables, and `Binding` stays in `tui_kit.rs` for
   them. The story-view footer branch stays behaviorally separate from the
   dashboard registry.

## Suggested route

Evidenced minimal file set: `modules/cli/src/app/tui_kit.rs`,
`modules/cli/src/app/dashboard/keymap.rs`, `modules/cli/src/app/dashboard.rs`.
That is where every seam named below already lives, so it is the shortest route
— not a fence. Take a supporting file if a goal needs one, and say so.

**Before editing.** 0252.3 landed and 0252.5 may land in either order; re-locate
every line anchor by symbol name (`rg -n "fn <name>"`) rather than by the line
numbers here, which are reading aids. Read the SESSIONS `d` handling: at HEAD
`open_delete_modal` starts from `selected_session`, so delete applicability is "a
selected session row"; if 0252.5 has landed group deletion, widen it to "a
selected session row or a selected group header" and reuse the delete seam it
left. Nothing else changes either way. This plan touches neither `Modal` nor any
delete implementation.

**Registry primitives (`tui_kit.rs`).** A key spec that can carry more than one
physical code behind one display string, so today's MERGES `Enter`/`m` alias
survives as one row rather than two rows sharing an id, and matches a `KeyEvent`
with HEAD's modifier semantics (decision 3). An action row carrying an executor
id, the key spec, a static lowercase label, a one-line explanation, whether it is
dispatched or reference-only, and an applicability predicate; generic over the
consumer's command id and state so the kit never learns about `RatatuiPane` or
`State`. Lookup by key over the dispatched rows, an applicable-rows projection,
and a footer projection built on the existing `render_hint_list`
(`tui_kit.rs:882-890`) — the function that already emits the parent's
`[key] label · [key] label` grammar. A hand-written `Copy`/`Clone` impl is likely
needed: a derive would emit a `Ctx: Copy` bound and `Ctx = State` is not `Copy`.

`render_hint_line` (`tui_kit.rs:892-898`) has only the dashboard keymap's two
production calls, the dashboard story-footer call, and its own tui-kit test.
Moving the story footer to `render_hint_list` leaves it uncalled and it can go,
so the dashboard carries one hint grammar; the live-view tables are unaffected.

**One overlay widget backing both surfaces (`tui_kit.rs`).** Entries built only
from action rows — no trailer field, no free-text section, so there is no seam
through which a hand-written hint could enter either overlay. A guide
constructor takes every row of the screen and fires nothing; a menu constructor
takes the applicable dispatched rows and fires the selected one. It is a focus
trap like `Modal`: it consumes every key it sees, scrolls, and closes on its
close keys. Reuse `scroll_key`/`ScrollList` (`tui_kit.rs:50-204`),
`centered_rect` (`1041-1052`), `dim_style` (`997-999`), `Clear`, a bordered
block, and the green selection tone `windowed_list_in_range` already uses
(`809-842`). Named ANSI plus `DIM`/`BOLD` only. `tui_kit.rs:19-22` permits
targeted behavior/style assertions on scratch `TestBackend` buffers and forbids
frozen rendered inventories.

**The declarations (`dashboard/keymap.rs`).** This module becomes the
declaration authority; its header sentence about `handle_key` being the dispatch
becomes false and must be replaced. The 0148 case-discipline paragraph still
governs which key a verb gets and stays. The display-only tables, `GLOBAL_TAIL`,
`bindings`, `hint_line`, `global_tail_hint`, and the two display tests go; a
per-screen row composition (lead rows, the screen's own rows, the global tail,
plus the screen's reference rows) replaces them. `RepoScope` has identical
metadata and behavior on SESSIONS and MERGES — declare it once and compose it
into both, so the two cannot drift. `keymap` is a descendant of `dashboard`, so
`State`'s private fields, `State::selected`, `VisibleRow`, `TaskVisibleRow`,
`selected_session`, `selected_task`, and `selected_trust` are reachable through
`super::` without widening visibility.

Suggested dispatched inventory — exactly the keys `handle_key` binds today for
that screen, no key gained or lost, ordered most-used-first so the footer prefix
is the useful verbs. Explanations are one line, no trailing period, saying what
the verb does rather than when it applies.

- Lead, every screen: `?` guide ("list every key this screen binds"), and the
  menu opener ("list the actions that apply to the current row"). Both
  inapplicable per decision 4. `.` is the suggested menu key — `.`, `?`, `:`,
  and `/` are all unbound today, and `.` types nothing while `/` and `:` read as
  "type something" — but the key is a product choice, not a parent ruling.
- SESSIONS: `Enter` attach/expand, `a` answer, `n` spawn, `space` expand,
  `s` resume, `S` story, `x` stop, `d` delete, `v` repo scope.
- TRAITS: `a` approve, `b` block, `e` edit source, `x` explain.
- MERGES: `Enter`/`m` merge (one row, two codes), `d` deep-merge, `x` drop,
  `p` print path, `v` repo scope.
- TRUST: `a` approve, `b` block, `space` mark, `A` approve family/marked,
  `o` orphans.
- TASKS: `d` dispatch, `y` mark done, `e` edit, `space` expand, `s` split,
  `S` sync, `R` reconcile, `a` archive.
- Tail, every screen: `r` reload, `q` quit.
- Reference rows per screen (decision 1): list movement, paging, focus, list,
  screen switching, pane movement, and the Ctrl-C quit prompt. `Enter` is
  claimed by the registry on SESSIONS and MERGES and is a focus reference row
  only on the screens where it is not, so no screen declares one key twice.

Suggested predicates, each a pure read of loaded state on an existing seam:
attach/expand is a selected group header or a session row whose
`SessionClass::can_attach()` holds — not "any visible row", since
`can_attach` already rejects unreadable rows (`209-216`) and `attach_selected`
refuses them (`4548-4562`); expand is a selected group header; answer is a
selected row whose already-loaded `status`, `next_frame_kind`, and `interrupted`
say it is parked on an unanswered ask (`240-257`, projected at `2250-2364`),
with `open_answer_modal`'s center read and refusal messages left where they are
(`4594-4680`); resume is `SessionClass::can_resume`; story is a nonempty
`run_id`; **stop is simply the loaded `SessionClass::Live`** — 0243.5 rewrote
`open_kill_modal` (`4565-4592`) to open only for a live row and to report "no
live center driver" otherwise, and `has_running_evidence` no longer exists
anywhere in the tree, so share that one classification with the opener rather
than copy a stale three-case rule; delete is a selected session row, widened per
the pre-edit reread; spawn, repo scope, sync, reconcile, reload, and quit are
always applicable. Trait approve/block need a nonempty canonical digest; trait
edit reuses `dashboard_trait_editable_source`
(`lifecycle_reporting.rs:1784`, already imported by `dashboard.rs`); trait
explain needs a selected trait. Merge and deep-merge use `MergeClass::can_retry`
(`390-395`), drop uses `can_drop` (`397-402`), print path cheaply requires
`worktree.is_some()` while `resolve_merge_worktree_path`'s git-registration probe
stays at execution with its message. Trust approve/block need a selected record
with a trait id and nonempty current digest; mark needs a trait id; `A` means the
marked set when marks exist and the family otherwise, with the readable-member
scan left at execution. Task verbs use `selected_task`, task expand a selected
group header, each keeping its own deeper inline refusals.

**Dispatch and routing (`dashboard.rs`).** A command id enum with one variant per
dispatched row, distinct from the existing `Action` (`746-758`), which is the
modal *continuation* tag and stays untouched — say so in both doc comments so
the two never get conflated. One exhaustive executor `match` whose arms call
only the existing seams (`attach_selected`, `toggle_selected_group`, the `open_*`
functions, `edit_selected_trait_source`, `explain_selected_trait`, merge
retry/drop/print, trust toggles and modals, task actions, `State::reload`, and
the exit modal); the exhaustiveness is the compiler-enforced half of "no row
without an executor". No command behavior changes. `SessionAttach` reproduces
today's header/row branch and `RepoScope` today's `all_repos` toggle plus both
list resets plus reload.

Exit-modal construction is byte-identical at Ctrl-C (`2997-3001`) and `q`
(`3029-3033`); extract one exit-opening seam and route both through it so the
prompt cannot drift.

Routing precedence, preserving today's trap ordering: modal resolve, modal trap,
Ctrl-C (closing any open overlay first, then the shared exit seam — otherwise the
exit modal draws over an overlay that reappears on cancel), then **the new
overlay trap**, then story view, alt+arrows, the SESSIONS paging queue,
navigation, then **registry command dispatch**, then focus handling, then a final
match reduced to `Tab`/`BackTab`/`1`-`5`. Every `if state.screen ==` guard leaves
that match, and so does `q`. `handle_focus_key`'s two screen-guarded `Enter` arms
become registry rows, which is why focus handling must now run *after* the
registry: on SESSIONS/MERGES the registry claims `Enter` first, and elsewhere the
lookup misses and focus handling runs exactly as before.

The overlay trap: `Pending` returns, `Closed` clears the overlay, `Fire` reads
the captured identity, closes the overlay (so no command leaves it behind, and
neither does a refusal), compares against the identity live state selects now,
and only on equality runs the executor. Suggested `State` shape: an overlay field
and a captured-identity field, both cleared by one close seam and both cleared in
`switch_screen` (`1392-1406`) — registry rows are screen-scoped, so a surviving
overlay would list another screen's actions and a surviving capture would be a
foreign screen's identity. Initialize in the centralized constructor
(`1284-1355`). Render in `draw_screen`'s normal branch after the footer and
before the modal (`7653-7744`), so modals still draw last; the story branch does
not render it, since the overlay trap sits above the story trap — a debug
assertion there keeps that invariant from rotting. Add the overlay to the
autorepeat gate (`2868-2889`): without it a held `j` meant for the overlay moves
the list underneath and never reaches `handle_key`.

Because the always-applicable global rows are in every screen's menu, the menu
cannot be empty under this model — do not add an empty-menu branch unless the
final semantics can actually produce one.

**The footer (`dashboard.rs`).** Row one becomes the registry projection over a
bounded prefix of the screen's dispatched rows and nothing else: the navigation
literal, both keymap hint helpers, the `v` scope verb, the `o` orphan verb and
count, `[ALL]`, the mark count, and the appended position all leave
`footer_line`. A cap of 5 entries is the suggested "short"; the parent fixes only
the grammar. Row two keeps its existing precedence and falls through to the
relocated state text (decision 5). The story branch changes only
`render_hint_line` to `render_hint_list`.

**Proofs.** Scratch data only; no test may read committed repository content
(standing ruling). Existing helpers support this without terminal side effects:
`State::new_without_worker`, `row_with_id`, the trait/trust row builders, and
`RatatuiPane::new_detached_for_test` (`tui_ratatui.rs:687`). Give the registry
tests a shared name prefix so one filter runs the set — `action_registry_` is
what the Done-when command below filters on. The central proof is behavioral and
best done on a scratch screen in `tui_kit.rs`: declare a scratch command enum,
context, and row table, and assert that one row reaches dispatch, footer, guide,
and menu, then that deleting that one row removes it from all four at once.
Existing footer tests for loading precedence (`9069-9080`), stale refresh
(`9202-9255`), and screen-switch preservation (`12590-12614`) must keep passing;
replace only the expectations the new footer genuinely obsoletes — the TRUST
orphan footer test (`11995-12007`) and the navigation-prefix footer test
(`12616-12627`).

## Out of scope (binding)

0252.3's `ButtonRow`/`Modal::buttons`; 0252.5's group-delete implementation and
delete extraction; 0252.4's failure modal; migrating `LIVE_VIEW`,
`LIVE_VIEW_GUIDE_ENTRY`, `GUIDE_MODAL`, `STORY_VIEW`, or the live/attached run
view's `?` to the registry; changing what any command does once fired;
duplicating any command's behavior in the registry; adding I/O, locks, or probes
to applicability; tightening or loosening modifier acceptance (decision 3);
registering overlay-internal keys; a `tui_demo.rs` registry consumer; mouse
activation; any new dashboard key beyond the guide and menu openers.
"""
validation = """
## Done when

1. **The replaced authorities are gone — replaced, not paralleled.** No
   hand-written dashboard hint literal, no display-only keymap hint table or its
   render helpers, and no screen-guarded key-dispatch arm survives anywhere under
   `modules/cli/src/app`, and exactly one site opens the exit confirm modal. This
   is a source inspection, deliberately not a Rust test — no test may read
   committed repository content:
   `D=modules/cli/src/app; ! rg -q "↑↓/jk list" "$D" && ! rg -q "const GLOBAL_TAIL|fn hint_line\\(|fn global_tail_hint\\(" "$D" && ! rg -qU "KeyCode::(Char\\([^)]*\\)|Enter)\\s*\\n?\\s*if state\\.screen" "$D" && test $(rg -oU "Action::Exit,\\s*\\n?\\s*Modal::confirm" "$D" | wc -l) -eq 1`
   The dispatch-arm pattern is multiline on purpose: today's `KeyCode::Char('v')`
   arm carries its `if state.screen` guard on the next line, so a line-oriented
   pattern would miss it. It is also narrow on purpose — a bare `if state.screen
   ==` would be wrong, since `queue_sessions_pane_key`, `handle_navigation_key`,
   `draw_screen`, and `handle_focus_key`'s `Esc` arm legitimately survive. The
   command was run at HEAD and exits 1 there (32 guarded arms, the navigation
   literal, and two exit-modal sites all present), so a green run is real
   evidence rather than a vacuous match. The registry's *existence* is not
   asserted by grep — criterion 2 proves it behaviorally, without pinning a name.

2. **One declaration authority drives all four surfaces, and the menu is safe.**
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib action_registry_`
   Behaviors that must be proven (how to observe each is the run's choice):
   - one registered row reaches dispatch, the footer, the `?` guide, and the
     command menu, and removing that one row removes it from all four at once;
   - the footer projection over `?`/`guide` and `d`/`dash` rows renders exactly
     `[?] guide · [d] dash` — the parent's spelling, derived rather than typed —
     and truncating at the cap leaves no trailing separator;
   - the overlay scrolls, consumes keys as a focus trap, closes on its close
     keys; guide entries fire nothing and menu entries fire;
   - within a screen no key is declared twice (a single row owning aliases such
     as MERGES `Enter`/`m` is fine, and is the reason the alias is one row);
   - every dashboard command has at least one declaration and every declaration
     has an executor — `RepoScope` deliberately appears on both SESSIONS and
     MERGES from one shared declaration — and every row carries a nonempty,
     single-line key display, label, and explanation;
   - the menu lists exactly the applicable actions for the selected row, never
     offers the guide or menu openers, and firing an entry runs the same seam the
     key runs, not a duplicate path;
   - pressing a registered key still dispatches regardless of applicability, and
     the executor's existing authoritative refusal still fires with its current
     message (decision 2) — for example stop on a non-live row;
   - the pre-fire guard refuses a replaced row: after a snapshot replaces the
     row the menu described, firing executes nothing, opens no modal, clears the
     capture, and reports that the selection changed; reopening on an unchanged
     selection fires normally; and the guard distinguishes two rows carrying the
     **same session id in different repositories** (decision 6), not merely a
     removal at an unchanged index;
   - every screen's footer row one is the registry projection and contains none
     of the relocated navigation, scope, orphan, mark, or position text, while
     row two carries scope/orphan/mark/position and still yields to
     loading/stale/explanation/message;
   - every `?` guide entry comes from a registry row, counts included, and the
     guide names the structural keys — list movement, paging, focus, list,
     screen switching, pane movement, and the Ctrl-C quit prompt (decision 1).

3. **Nothing that routed keys or rendered the footer before this task
   regressed** — the modal focus trap, Ctrl-C and alt+arrow precedence, SESSIONS
   autorepeat and paging, stable selection across reloads, the authoritative
   action rechecks, and the loading/stale/message footer rows.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib`

4. **The landing gate is green.**
   `CARGO_TARGET_DIR=target just test-full`

Run the criterion commands 1, 2, 3, 4 in that order; building incrementally
(`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`) after the primitives,
the overlay, and the dispatch rewrite is suggested so a generics, exhaustiveness,
or borrow error surfaces next to the edit that caused it. Permit at most two
targeted repair-and-rerun rounds in total; after each repair rerun the failing
command and every later one. Complete when all four criterion commands exit 0.
"""

[relations]
parent = "0252"

[[checks]]
name = "the replaced hint and dispatch authorities are gone"
command = 'D=modules/cli/src/app; ! rg -q "↑↓/jk list" "$D" && ! rg -q "const GLOBAL_TAIL|fn hint_line\(|fn global_tail_hint\(" "$D" && ! rg -qU "KeyCode::(Char\([^)]*\)|Enter)\s*\n?\s*if state\.screen" "$D" && test $(rg -oU "Action::Exit,\s*\n?\s*Modal::confirm" "$D" | wc -l) -eq 1'

[[checks]]
name = "one row drives dispatch, footer, guide, and menu"
command = "CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib action_registry_"
timeout-ms = 1800000
expect = 'test result: ok\. [1-9][0-9]* passed; 0 failed'

[[checks]]
name = "no key-routing or footer regression in the cli library tests"
command = "CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib"
timeout-ms = 1800000
expect = 'test result: ok\. [1-9][0-9]* passed; 0 failed'

[[checks]]
name = "the action registry passes the landing gate"
command = "CARGO_TARGET_DIR=target just test-full"
timeout-ms = 3600000
