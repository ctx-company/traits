content = """
Give the Config screen its chrome — grammar rule 6's header and rule 8/12's provenance bar — over the one repository-scoped answer `0268.1` taught the center to serve. This cut renders; it resolves nothing.

The **header** is a title in the shape `runtime — <repository display identity>` over exactly one italic narrated summary carrying three data counts in placeholder phrasing, with `∷` top-right and no breadcrumbs (`grammar.md:58-66`, `screens/config.md:9-11`). The **bottom bar** is rule 12's provenance instance for this screen: the served verdict, then the cited provenance and the one served instant, then `edit runtime.toml` as the right-hand ghost action (`grammar.md:74-84,110-115`, `screens/config.md:24-27`).

Eight grounded corrections the draft this file replaces did not carry.

**A missing runtime document is absence, not malformation, and the draft's rule was unsatisfiable.** The draft required "a malformed or missing runtime document renders the failure". `resolve_config_report` skips layer paths that do not exist and resolves built-in defaults (`modules/io/src/harness_config.rs:3903-3913`), and `proof_config::doctor_reports_effective_defaults_and_rejects_conflicting_path` creates a scratch Git repository with no runtime file and requires the config answer to succeed (`modules/cli/tests/proof_config.rs:18-40`). A run obeying the draft literally would have had to red a standing public proof. Absence resolves and the chrome names the built-in-default origin, never text claiming a file was loaded at a time. Malformation, refusal, unreadability, stale or never-built generated output, malformed trust data and an unusable repository scope remain the loud failures (`modules/io/src/runtime_source.rs:21-55,80-165`), and they replace the claim rather than joining old rows to a new verdict and instant.

**Provenance is not always `runtime.toml`.** Resolution is layered — global hand TOML or global generated output, each ancestor `.ctx/harness.toml`, the repository `.ctx/traits/runtime.toml` or its generated output, and `$CTX_CONFIG` (`harness_config.rs:5079-5171`) — so the export's `valid · runtime.toml · loaded 13:02` is one reachable string among many, not the form. Parent Correction 1 fixes the citation: the highest-precedence contributing document of the served set, a muted qualifier stating the set's total size whenever more than one document contributed, and the built-in-default origin when the set is empty, with the served instant framed as resolution of defaults rather than a load.

**A retired `model-tier` declaration is a warning at this HEAD, not a failure.** `resolve_config_report` pushes it onto `ConfigReport.tier_warnings` and continues (`harness_config.rs:3907,3914-3916,4104-4109`), and the rewritten `0268.1` deliberately preserves that shipped behaviour and reports the divergence from the parent's broader fail-loud wording. This chrome consumes the warning semantics the prerequisite serves; independently promoting the warning to a failure here would change a shipped CLI answer from a rendering cut.

**The summary's three counts have fixed meanings and none of them is the digest count.** Parent Correction 4: the seat count is the number of rows the Agents section actually renders, expanded physical seats included and fabricated roles excluded; the engine count is the cardinality of the rendered engine set — the distinct harness ids the harness row represents plus the one center identity, with the store row a path and never an engine; the trust count is the cardinality of the approved-member set the Trust row renders, not the distinct-digest count shown as that row's value. The export's `two engines` beside three Runtime rows is exactly the case the parent resolves by changing the phrasing, never the counts.

**`edit runtime.toml` has no single target, and the wrong target teaches the operator to edit a file the next build overwrites.** Parent Correction 11: a cited hand-authored TOML document — global, ancestor `.ctx/harness.toml`, repository, or the file `$CTX_CONFIG` names — is targeted directly; a cited generated document targets the `runtime.ts` that produced it, never the artifact; an empty served set refuses visibly in place because there is no editable source, and creates no plausible file. Source-versus-generated authority already lives in `runtime_source::resolve_runtime_document_path` (`runtime_source.rs:21-55`) at the IO assembly, so the editable target is carried or derived there; the desktop must not inspect file existence or reconstruct authority from path spelling.

**No editor launch mechanism is established, and the one helper that exists is not it.** `ctx_traits_io::process::run_editor_inherited` runs `$EDITOR` synchronously with inherited terminal IO and requires its caller to have suspended raw terminal state (`modules/io/src/process.rs:159-198`; `modules/cli/src/app/tui_kit.rs:1383-1395`). That is a TUI contract, not evidence of a gpui reveal path, and it must not be called on gpui's UI thread. The launch mechanism stays unresolved until the standalone shell exists; what binds is that a failure to launch, and the absence of an editable source, stay visible rather than becoming a silent no-op.

**No repository display identity exists at this HEAD, so the title's data source has to be found rather than assumed.** Shared code has `state::canonical_repo_root` and the deterministic `repo_key` = `<slug>-<first 8 hex>` (`modules/io/src/state.rs:128-160`), and center rows expose key and path, but nothing in that set is an owner/repository pair, so the export's `ctx-company/traits` shape is not something HEAD can produce truthfully. Execution inspects what `0268.1` actually landed: if the served answer already carries a truthful display identity, the title renders it; if not, this cut widens that same typed capability minimally — reachable by a non-GUI face — or renders a clearly defined pure projection of the served scope. What it may not do: read the desktop process's cwd, invoke `git` from the desktop, synthesise an owner segment the system does not hold, or fall back to the reference repository.

**The check this file declared is the wrong evidence, and one prerequisite edge is missing.** `proof_doctor`'s only `--config` test asserts that `--verbose` conflicts with `--config` (`modules/cli/tests/proof_doctor.rs:255-273`); it covers no config semantics, and parent Correction 10 requires correcting it. `proof_config.rs` is the standing config suite, `proof_center.rs` the process-boundary suite for any served-answer widening, and `proof_runtime_ts.rs` the generated-document suite that the editable-source mapping runs through. Separately, dependencies are not inherited through a parent — open leaves evaluate only their own `depends-on` edges (`modules/core/src/task/graph.rs:115-176`) — and `0268.1`'s closure through `0265.5` reaches `0265.3`'s bar and `placeholders` module but never `0265.13`, which owns the reusable rule 6 header this cut composes. The edge is added, exactly as the analogous Traits chrome leaf carries it (`0267.2` relations).
