- **Compose the landed vocabulary, do not duplicate it.** Rule 6's header comes from `0265.13`, rule 8's bar and the single `placeholders` module from `0265.3`, the dark tokens and IBM Plex faces from `0265.1`'s entry point, and the semantic state presentation from `0265.3`/`0265.5`. A Config-private header, bar, token table, placeholder module, provenance formatter, resolver or clock is a defect even when it renders correctly.

