5. **Failure and warning states render honestly, and nothing is invented.** A typed failure — malformation, refusal, unreadability, stale or never-built generated output, malformed trust data, an unusable repository scope — replaces the success claim and renders in semantic failure treatment with no `valid`, no blank or placeholder source, no invented instant, no partial count and no partially updated rows. A retired `model-tier` declaration renders as the warning `0268.1` serves and is neither reclassified as a failure nor hidden. A rejected candidate leaves title, summary, counts, verdict, provenance and instant all at their previous accepted values, and a last accepted answer is visible only behind the inherited explicit stale or outage marker, never as current. Decided by `just test`, the bounded review's exercise of each state over synthetic served values, and — for the served document semantics the states stand on — `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_runtime_ts` and `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config`.

6. **`edit runtime.toml` is the shared module's tracked placeholder over a data-driven target.** It renders as the right-hand ghost action, Mono 11 in the primary bright tone, with no fill, border, icon, pill or corner radius, and its label and placeholder tracking come from the one `placeholders` module with no inline duplicate. Its target is not placeholder fiction: a cited hand-authored TOML document — global, ancestor `.ctx/harness.toml`, repository, or the file `$CTX_CONFIG` names — is the target; a cited generated document targets the `runtime.ts` source that produced it and never the generated artifact; an empty served set with the built-in-default origin refuses visibly in place, stating that there is no editable source rather than opening or creating a plausible path. That selection is carried or derived at the shared IO assembly where source-versus-generated authority already lives, reachable by a non-GUI face; the desktop performs no existence check and reconstructs no authority from path spelling. Activating the action opens no in-app editing surface, creates no file and mutates no configuration or trust state, and a launch failure or an absent editable source stays visible rather than becoming a silent no-op. Together with the summary's phrasing, this label is one of exactly two placeholder-served leaves this cut owns; every other leaf here is data. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_runtime_ts` and `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served editable-source-or-refusal value, `just test`, and the bounded review's diff read for an inline label, a desktop-side existence check or any write path.

