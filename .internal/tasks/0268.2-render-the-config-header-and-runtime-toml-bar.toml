## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the Config screen header — repository-qualified title, one italic narrated summary whose three counts are data and whose phrasing is placeholder-served, `∷` top-right — and the bottom bar — the served verdict as a semantic state word, the one shared provenance presentation of the served document set and instant, and the placeholder-served `edit runtime.toml` action with its data-driven target and refusal — both projected from the answer `0268.1` serves, plus only the minimal widening of that same shared answer needed to make the title identity and the editable target truthful.

- **`0268`'s corrections bind.** The parent's outcome invariants govern this leaf and are not narrowed here; Corrections 1, 4, 10, 11 and 12 are the ones it touches directly.

