- **Read-only.** `edit runtime.toml` at most reveals or opens an already-existing resolved source in an external editor. It opens no in-app editing surface, creates no file, writes no runtime document and mutates no configuration or trust state; `--apply` and `--migrate-config` are untouched.

- Out of scope: the served answer, the three sections and their rows, the menu entry and switch (`0268.1`); the preview column and its footer call site (`0268.3`); the CLI report half (`0268.4`); any configuration-editing surface on any face; the light theme; pencil work of any kind; every shared primitive `0265` already built; and all work belonging to `0266`, `0267`, `0269` or `0261`.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0268.1` — the repository-scoped Config answer carrying the rows, the counted sets, the verdict, the warnings, the physical document set in layer order, the one captured completion instant and the per-value provenance this chrome renders. `0265.13` — grammar rule 6's screen header, extracted while rendering Sessions and composed here rather than re-derived; it is not otherwise reachable from this leaf, because `0268.1` gates on `0265.5`, `0265.9` and `0258`, whose closure reaches `0265.3` and `0265.1` but never `0265.13` (`modules/core/src/task/graph.rs:115-176`), and the parent's rule is that an external prerequisite is named on the earliest child that consumes it. `0265.3`'s bar and `placeholders` module and `0265.1`'s tokens and faces arrive transitively through `0265.5`. None of that chain has landed at the time this file was written, and `0256.1` is still `ready`: bind to the desktop project, components, module names and non-interactive command those tasks actually landed, never to a path, symbol or signature guessed here.

## Done when

1. **The header renders rule 6's form from the accepted answer.** A title in the shape `runtime — <repository display identity>` in Sans 13 `text-heading`, over exactly one italic Sans 12 `text-secondary` summary at fixed width 560, with `∷` in Mono 14 `text-secondary` padded `[2,8]` at the top right of a full-width `space-between` row, title-stack gap 5, inside the existing main pane — and no breadcrumbs anywhere. It composes `0265.13`'s landed header rather than a Config-private duplicate of its typography, glyph, fixed width or breadcrumb rule, and every dimension and colour reaches the call site as a token role from `0265.1`'s entry point rather than as a literal. Geometry matches `reference/config.html:251-286` and `tokens.md:71-85`. No repo-root command inspects a rendered gpui screen at this HEAD, so this goal declares no board check and none may be invented; it is decided by `just test` for the shared code the header renders through, plus the bounded review in `validation` walking `screens/config.md:9-11` and `grammar.md:58-66` leaf by leaf.

