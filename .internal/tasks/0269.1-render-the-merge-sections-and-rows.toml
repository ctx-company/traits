This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it whenever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

`screens/merges.md:12-29` specifies the first half of the Merges screen: the
title bar's menu gains a `Merges` entry between `Tasks` and `Config`, bright
while the screen is current (`reference/merges.html:57-91`), and the main pane
carries exactly three sections — `Landing — 1`, `Awaiting approval — 2`,
`Landed — 2` — whose headings are mono 11 `text-muted` and whose rows are
**shaped exactly like task rows**: a 5px status dot beside a title-over-description
stack on the left, an end-aligned two-line state stack on the right
(`screens/tasks.md:14-23`).

The export fixes the geometry: main pane padding `[18,40,20,40]` gap 28
(`reference/merges.html:261-264`), section container gap 12 with a row list at
gap 4 (`298-310`, `367-379`, `489-501`), merge row padding `[8,12]`
`space-between` top-aligned, left gap 12, dot column top offset 6, dot 5px,
text-stack gap 2, right column end-aligned mono 10.5 gap 2 (`312-364`,
`381-487`, `503-608`). Title sans 12.5, description sans 11 `text-secondary`
(`tokens.md:60-67`).

This is the cut where grammar rules 1, 2, 3 and 4 become code for a second
consumer: colour chosen from a named state rather than at a call site
(`grammar.md:6-22`), states rendered as words and never pills, badges or
checkmarks (`grammar.md:24-29`), only `→` and `·` from the closed glyph set
`↰ ↳ → · ∷` and no corner radius inside the canvas (`grammar.md:31-37`), the
5px dot present because merges are one of rule 4's four qualifying stateful
lists, and the bright-title selection rule held at the list level
(`grammar.md:39-47`).

## Six corrections to the draft this plan replaces

**Correction 1 — the optional landed wiring is closed, not open.** The draft
says landed rows "MAY be derived from the default branch's git log" and treats
taking the option as a legitimate completion. Parent `0269` elects both of the
artifact's optional regions into the placeholder form and states that the
election binds (`0269:11`, `0269:98-107`, `0269:139`). Ruling: **landed rows are
placeholder-served, exactly like the other two forms.** No landed revision, no
landing time, no task-close claim and no landed-this-week count is derived from
frame history, and no center capability — a default-branch history or a diffstat
among them — is added for this screen. The reachability of a terminal
`landed=<revision>` frame does not convert an option into a requirement; keeping
all three sections placeholder-served is precisely what lets one row
implementation cover them.

**Correction 2 — "no inline placeholder literals" governs placeholder facts, not
every string on the screen.** Read literally, the draft's rule routes the fixed
headings `Landing`, `Awaiting approval` and `Landed`, and the menu word `Merges`,
through the shared module — turning interface chrome into fake placeholder facts
and poisoning the grep the rule exists to enable (`0269:80-84`). Ruling: the one
shared `placeholders` module carries **exactly what a `placeholder:` tag
authorises** — the row titles, the run-to-target descriptions, the detail beside
each state word and each meta line of `screens/merges.md:23-29` — and nothing
else. Section headings and the menu entry's label are ordinary interface text.

**Correction 3 — the `placeholders` module is `0265.3`'s, not `0265.2`'s.** The
draft's prerequisite note says the row vocabulary "chains back to the
`placeholders` module `0265.2` created". `0265.2` serves a run's claimed task
through the center and explicitly excludes the module (`0265.2:44`); `0265`
records that **`0265.3` also creates the one `placeholders` module** (`0265:80`),
`0265.3` creates it by seeding a single `watch raw` entry (`0265.3:173`,
`0265.3:245`), and this task's declared dependency `0265.5` is the cut that
depends on `0265.3` (`0265.5:739`). The module therefore arrives through the
existing edge; the wrong number in the draft is a citation error, not a missing
dependency. Discover the module from what `0265.3` actually landed.

**Correction 4 — the export conflicts with the specification on two leaves of
this cut, and each resolves toward the specification.** `reference/merges.html`
is measurement, `grammar.md` and `screens/merges.md` are the specification
(`0269:137`).

- **`landed` renders in `ok`, not neutral.** Grammar rule 1 assigns `ok` to
  settled good and names `landed` in its own list (`grammar.md:11-14`); the
  export paints the landed state word `#8b909c`
  (`reference/merges.html:539-545`, `591-598`). Accordingly `landing` is
  `accent`, `awaiting approval` is `warn`, `landed` is `ok`. The dots already
  agree — `#7fb2ff`, `#d8b46a`, `#7fc79a` at `reference/merges.html:326`, `395`,
  `448`, `517`, `570` — so only the landed state *word* moves.
- **Every row's description is the run-to-target form.** Parent goal 2 binds
  merge rows to "a sans title, the run-to-target description and the end-aligned
  state stack" (`0269:221`). The export's landing and awaiting rows already carry
  it — `run-1a2b3c → main · guarded-change · closes 0257`,
  `run-99ffe1 → main · every command ends in a panel`, `run-77cd10 → main ·
  schema'd emissions` — while its landed rows substitute relative-time prose
  (`reference/merges.html:533-540`, `586-593`). Content specification wins over
  export content, and the substitution is reported as an owner correction against
  the export rather than edited into it.

A further conflict found during implementation resolves the same way and is
reported. `.internal/docs/design/**` is implementation input and is never edited.

**Correction 5 — the empty-section clause has no copy behind it, and no copy is
invented.** The draft requires that "a section with no rows says so in the
design's own voice". Neither `screens/merges.md` nor `reference/merges.html`
supplies that copy, and the v1 placeholder set is statically nonempty at 1/2/2,
so the clause is unexercised by this cut's own content. Ruling: the section list
must not hide an empty section by construction; where an empty section is
actually reachable, it reuses whatever empty-section voice the landed shared
vocabulary already provides; if none exists and the case is reachable, the
missing artifact copy is **reported as an unresolved gap** rather than filled
with invented prose or hidden.

**Correction 6 — the gap is the queue, not the merge.** The draft's framing —
"no merge-queue surface exists in the backend" — is true only in its narrow
reading, and the wide reading would either dismiss reusable evidence or invite a
rebuild (`0269:34-42`). Ruling: what is absent is named precisely in code,
comment and commit message — **no merge-queue order, no awaiting-approval state,
no sign-off record, no queue counts**. What exists stays first-class and
untouched: `ctx traits merge <run-id>` (`modules/cli/src/app/merge.rs:1-16`), the
TUI `Screen::Merges` keymap with merge, deep-merge, print-path and drop
(`modules/cli/src/app/dashboard/keymap.rs:90-111`), and durable merge frames.

## Why every row on this cut is placeholder-served

`screens/merges.md:23-29` tags all three row forms `placeholder:`, and the code
agrees that nothing else is honest:

- The center protocol's `Request`/`ResponseResult` variants cover registration,
  subscription, start/control, list/get/resolve, run lookup, stats and the
  standing wall, and carry **no** merge-queue request, response, queue order,
  approval state, sign-off record or queue count
  (`modules/io/src/center.rs:84-208`). `CenterDelta` carries appeared/changed/
  ended rows and activity lines only (`center.rs:265-281`). No sign-off type and
  no `awaiting approval` state exists anywhere under `modules/**`.
- `CenterPublicRow` carries `RunSummary`, `repo_key`, `repo_path`, `ledger_path`,
  `live` and the ledger's `modified_epoch_secs` (`center.rs:3778-3788`). An mtime
  is recency, not queue order and not landing chronology.
- `RunSummary.landing` is durable **terminal** evidence — `landed`, `not-merged`,
  `parked`, `merge-failed` — and is `None` mid-run, for non-worktree runs and for
  clean-tree completed runs (`modules/io/src/run_summary.rs:48-69`, `169-186`).
- `MergeStatus`'s `LockAcquired`, `GatesPassed` and `Reconciled` are durable
  **checkpoints** that `is_terminal` excludes by construction
  (`modules/core/src/procedure/session.rs:617-670`); a last non-terminal frame
  survives a crash unchanged, so reading one as "landing now" yields a row that
  is permanently wrong.
- `MergeFrame` carries **no timestamps** by contract (`session.rs:1040-1066`), so
  no relative landing time and no landed-this-week count is derivable.
- Live merge progress exists only as CLI-local `MergeLive`, an optional
  `ActivityEvent` presentation sink whose dashboard caller passes `None`
  (`merge.rs:44-96`). It is a presentation channel for one in-process
  invocation, not a center-served queue lifecycle.
- The TUI's `merges_from_center_rows` is **not** this queue and is not the model
  to copy: it sorts by descending ledger mtime with ledger-path tie-breaking,
  skips unreadable and non-terminal rows, and classifies the rest as `Mergeable`,
  `Parked`, `Failed` or `Landed` (`modules/cli/src/app/dashboard.rs:2505-2609`).
  None of those four means "landing now" or "awaiting approval". The TUI
  `MergeRow` and its selection-triggered Git-derived preview
  (`dashboard.rs:372-449`) are `ctx-traits-cli`-private and unsuitable as a
  desktop model.

So this cut has **no data leaf at all**: no center request, no full-session
reconstruction, no ledger read, no store read, no sidecar read, no Git call, no
timer and no new shared protocol.

## Grounded against HEAD 3fd4906a0

Nothing this task edits exists yet. Root `Cargo.toml` names only the existing
Rust modules and fixture-agent and excludes only `packages/cdk`; root
`Cargo.lock` contains no `gpui` package; there is no desktop manifest, no desktop
lockfile, no gpui source tree, no desktop asset directory, no desktop command and
no desktop CI lane anywhere in the repository. Every desktop path, module name,
symbol and signature named below is therefore a guess to be replaced by reading
what `0256.1`, `0265.3`, `0265.5`, `0265.7` and `0265.9` actually landed.

Every prerequisite is still open at this HEAD: `0265.5` is `ready`, `0265.9` is
`draft`, `0258` and all its children are `ready`, and `0256.1` is `ready`. Note
also that `draft` is not a storable status — `TaskStatus` is the closed set
`ready|done|cancelled` (`modules/core/src/task/mod.rs:22-31`) whose `parse`
rejects anything else (`mod.rs:208-220`), so `FilesTaskBoard::load` records the
rejection and skips the document (`modules/io/src/task_files.rs:186-250`).
Activating a sibling or prerequisite draft is board bookkeeping outside this
cut's code scope.

**The overflow component's dependency edge was missing, and is now declared.**
Parent `0269:145` requires reusing the overflow component `0265` extracted rather
than building another, goal 9 binds this cut to it, and `0265.7` owns it. The
draft's `depends-on` named `0265.5`, `0265.9` and `0258` only, and `0265.7` is
reachable from none of them: `0265.7` itself depends on `0265.5`
(`0265.7:707`), so the two are siblings under one parent and the edge is absent
rather than transitive. A binding goal over a component with no edge to it is the
same scheduling defect as a binding goal over a lane with no edge to it, so
`0265.7` joins `depends-on`. If the shared clip-and-fade has nonetheless not
landed at execution time, that is an unmet prerequisite reported as one, **not**
permission to write a Merges-local replacement.

**No command in this repository executes a gpui render, so none is declared as a
board check.** A check runs under `sh -c` in a clean detached worktree of the
merged sha, so a command written here on the expectation that a dependency
creates it later would read as evidence while being unrunnable. The two declared
checks are commands that exist in this tree today. `0256.1` reached the same
conclusion about the same command for the same reason (`0256.1:15`).

**The desktop lane exists by the time this task is dispatchable, and that is a
dependency fact rather than a hope.** This task's declared edge to `0265.5`
chains `0265.5 → 0265.3` (`0265.5:739`), `0265.3 → 0265.1` (`0265.3:415`) and
`0265.1 → 0256.1` (`0265.1:293`); `0256.1` establishes the standalone desktop
project and does not close until "its documented independent build and test
commands pass from a clean checkout" (`0256.1:17`). The lane and its
non-interactive command are therefore a **dispatch precondition** of this task,
not a discovery gamble. The command cannot be written into this file because it
does not exist at the HEAD this plan was authored against, and a named command
that does not exist is a fabrication that a board check would execute as if it
were evidence. Goal 0 resolves that by making the command's resolution and a
baseline run of it the run's **first** action, ahead of every edit: if the chain
has not in fact landed and no such command exists or it fails because the
manifest, lane or command is absent, the run stops there, writes no code, and
reports an unmet dependency on `0256.1`. An unrunnable primary proof is then a
scheduling failure caught in seconds — never a task that limps to a pass on a
diff read.

**Static review decides the structural half and cannot decide the runtime half.**
The closing reads of `git diff main...HEAD`, `git diff --name-only main...HEAD`
and `git status --short` establish what a running harness does not show cheaply —
duplicated row or layout logic, a second placeholders module, inline placeholder
facts, headings misfiled as placeholders, literals at call sites, CLI-private
imports, direct reads, timers, new center capability, queue inference,
sibling-owned work and design-artifact edits. They do not establish that a row
rendered or that a selection held; the desktop lane decides those.
