## GOALS — binding

### What decides these goals

Three mechanisms decide the goals below, and each is used only for what it can
actually observe.

**The desktop lane, executed.** The menu entry and its switch, the rendered
sections and rows, the state roles, the selection invariant, the placeholder
provenance and the fit/overflow behaviour are runtime outcomes; they are decided
by focused coverage run in the desktop build-and-test lane that the dependency
chain `0269.1 → 0265.5 → 0265.3 → 0265.1 → 0256.1` guarantees has landed before
this task is dispatchable. Goal 0 resolves that lane's exact documented
non-interactive command and runs it before any edit; goal 13 runs the same
command again over this cut's added cases and requires exit 0.

No goal writes that command as a literal and no check declares it, because it
does not exist at the HEAD this plan was authored against and a board check must
already exist and run repo-root-relative in a clean detached worktree — writing
one now would fabricate it, exactly as `0256.1:15` concluded for the same
command. Unnameable here is not unrunnable there: goal 0 pins resolution to the
landed project's own documentation, gives that resolution a definite two-way
outcome, and makes the absent-lane case a hard stop before a line is written
rather than a Done-when clause left hanging.

**The two declared checks**, which exist in this repository today:

- `just test` — the per-round workspace gate, showing the workspace stayed green
  and unchanged in cost while this cut landed entirely outside it.
- The root gpui-free resolution and lockfile check.

**The closing static read** of the diff printed by `git diff main...HEAD`,
`git diff --name-only main...HEAD` and `git status --short` — commands that exist
today — against `screens/merges.md:12-31`, `grammar.md:6-91`, `tokens.md:15-84`
and `reference/merges.html:57-91`, `261-264`, `298-365`, `367-610`. Its
inspection list is fixed by goal 14. It decides code shape and forbidden
constructs, never that something rendered; wherever a goal names a runtime
outcome the desktop lane decides it and this read only supplements. It cannot be
a board check, because a check runs in a clean detached worktree of the merged
sha with no base to diff against.

0. **The desktop lane's command is resolved and run green before anything is
   edited.** The run's first action, ahead of every edit, is to locate the
   standalone desktop project the chain through `0256.1` landed and to run its
   documented non-interactive build-and-test command unchanged, from the location
   that documentation gives, on the untouched tree. Resolution is not open-ended:
   the command is read out of that landed project's own documentation — its
   manifest, README, justfile or CI lane — and the outcome is two-way. Either
   exactly one such documented command is found and it runs, or none is.
   Decided by that command running to a result on the unmodified tree and exiting
