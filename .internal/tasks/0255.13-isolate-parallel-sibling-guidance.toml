content = """
## Dependency gate
Before any implementation edit, require the complete joined landed state of ready dependency `0255.12` and every transitive dependency. Grounding was read-only at clean HEAD `a8eda02ec7fb9c4faf4c67d11adeecee526746fe`; `git status --porcelain=v1` was empty, no file was edited, and no validation command ran. That baseline is not implementation-ready: `SequenceItem` has no prompt-scoped `intent` or `behavior` in `modules/core/src/trait/procedure/model.rs:914-1019`; `modules/core/src/model_view/compile.rs::frame_guidance` is root-only and infallible at lines 511-544; `modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` supplies only root guidance at lines 463-489; `resolve_declared_item` remains private in `modules/cli/src/app/preview.rs:216-262`; and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist. Stop before edits and report the first absent or materially different joined contract. Missing dependency work is a blocker, not permission to recreate, rename, repair, or partially substitute dependency-owned work in this task.

Inspect the joined implementation and require exactly this exhaustive `0255.12` contract: canonical prompt-only `SequenceItem.intent` and `SequenceItem.behavior`; schema-`0.6` prompt-only validation and static source rendering; fallible root-agent-ready-prompt `frame_guidance`; `IntentItemSource::ReadyPrompt`; one shared additive overlay; scalar prompt-over-agent-over-root precedence; scoped require/avoid refusal while retaining effective root-only collision compatibility; exact canonical assigned-agent lookup; relocated `modules/cli/src/app/frame_prompt.rs::resolve_declared_item`; private `ready_prompt`; deterministic missing-index, unresolved-position, and resolved-non-prompt errors; all four `ResolvedFramePrompt` participation fields `assigned_agent_intent_participated`, `assigned_agent_behavior_participated`, `ready_prompt_intent_participated`, and `ready_prompt_behavior_participated`; shared `intent_block` and `behavior_block`; and exactly one existing integration test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Also require every empty top-level, plain named-sequence, branch-bearing, loop-bearing, and `for-each`-bearing live/historical and no-session path delivered by `0255.9` through `0255.12`. Any absence or material mismatch stops implementation.

## Outcome
Resolve each admitted parallel-bearing ready frame independently to the exact prompt declaration selected by that sibling's structural runtime cursor. Each sibling composes trait, its own exact canonical assigned agent, then its own exact ready prompt. Additive identity remains group-or-axis plus canonical guidance ID, with a more-specific occurrence replacing a broader occurrence at the specific layer position. Scalar behavior remains prompt over agent over root per axis. A scoped require/avoid contradiction is refused when assigned-agent or ready-prompt scope participates, while an effective root-only collision remains accepted. `Agent.system` remains a separate standing-instruction transport channel.

Add only parallel path admission. Live or historical admission is a non-empty `position_path` shaped `[procedure, (sequence|branch|loop|for-each|parallel)+, item]`, with at least one `parallel`. No-session static-preview admission is one or more `(sequence|branch|loop|for-each|parallel)` segments, with at least one `parallel`. Return `Ok(None)` for non-`SequenceFrameKind::Step` frames and every malformed or excluded non-empty path. For an admitted path, retain the joined source-index requirement and deterministic error contract, call unchanged `resolve_declared_item` exactly once, require `effective_kind() == SequenceKind::Prompt`, and return that exact declaration reference.

The rightmost non-`item` owner rule already resolves direct and recursively nested parallel leaves by branch sequence ID and local index. Runtime readiness emits a leading `procedure`, one segment for each active control including `parallel`, and a trailing `item`; static preview traverses authored parallel branches and emits branch-body leaves with `parallel` segments. Do not inspect branch decisions, branch offsets, iteration or run indices, prompt text or evidence, inputs, neighboring declarations, or globally unique item IDs. Do not use branch-offset, item-ID, prompt-text, evidence, neighboring-item, top-level fallback, or second-resolver heuristics.

Parallel containers cannot declare `agent`, prompt, or executable guidance fields, and joined prompt-only validation rejects scoped guidance on every non-prompt kind. Containers therefore contribute no guidance. Resolve and compose each sibling frame separately; do not precompose all siblings, merge simultaneously ready leaves, inherit a spawning control's scope, copy guidance to a parallel container, or add a parallel-specific composer.

The complete implementation allowlist is exactly `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`. Add, remove, rename, generate, or edit no implementation file outside those paths. The task rewrite changes only `.internal/tasks/0255.13-isolate-parallel-sibling-guidance.toml`; implementation must not edit it or any task sibling.

## Symbol contract
In `modules/cli/src/app/frame_prompt.rs`, edit only the body of exact dependency-owned private symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve its exact signature, all joined earlier path admission, source-index/error contract, single unchanged `resolve_declared_item` call, and prompt-kind requirement. Broaden only its structural admission predicate to the two parallel-bearing forms above.

In `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only the body of exact existing symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Extend its joined schema-`0.6` fixture and assertions in place. Add no test symbol, helper API, support harness, capture framework, production hook, selector helper, renderer, participation field, or cache field.

No production or test symbol is added, removed, renamed, or given a changed signature. The only edited symbols are unchanged-signature private `ready_prompt` and unchanged-signature test `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. Keep exact reused signatures `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>` and `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged.
"""
scope = """
## Ordered work
1. Before touching `modules/cli/src/app/frame_prompt.rs` or `modules/cli/tests/proof_agent_intent_dispatch.rs`, inspect the complete joined landed state of `0255.12` and all transitive dependencies in this strict order: canonical prompt fields, schema validation, and static rendering; core composition and source contracts; CLI resolver, composer, deterministic errors, and four participation fields; every earlier admitted top-level, named-sequence, branch, loop, and `for-each` path; then the sole integration proof. Stop at the first absence or material mismatch and report it. Do not recreate dependency-owned work.
2. Edit `modules/cli/src/app/frame_prompt.rs` first. Change only the body of exact symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve all prior admission and errors. Add only well-formed parallel-bearing live/historical `[procedure, (sequence|branch|loop|for-each|parallel)+, item]` paths and no-session `(sequence|branch|loop|for-each|parallel)+` paths, each with at least one `parallel`; reject malformed paths before the retained source-index requirement and one unchanged `resolve_declared_item` call.
3. Edit `modules/cli/tests/proof_agent_intent_dispatch.rs` second. Extend only the body of exact symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` using its existing scratch root, custom CLI and MCP harnesses, capture addressing, categorized-block extraction, marker checks, frozen compatibility machinery, participation checks, and system-channel assertions.
4. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`. Require exit 0 with exactly one passing integration test before proceeding.
5. Run `CARGO_TARGET_DIR=target just test-full`. Existing `Justfile:152-180` performs frozen pnpm installation, SDK and builtin drift checks, TypeScript formatting/typechecking/tests, Rust formatting and Clippy, workspace binary builds, and all workspace tests.
6. Run `git status --short` to inspect the complete worktree file list, then inspect `git diff -- modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs`. Substantively review the exact two-file allowlist, unchanged signatures, retained prior admission, parallel-only path expansion, one structural declaration lookup, per-sibling agent/prompt isolation, concurrent cached-outcome behavior, no accumulation, malformed-path rejection, static/ready source boundary, MCP behavior, no-guidance compatibility, participation, and `Agent.system` separation.
7. A dependency-gate failure, focused-test failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`, preserving that edit order when both need repair. After each repair, rerun the affected command and every later verification step in order. Complete only when both commands exit 0, the implementation diff remains inside the exact allowlist, and substantive review has no finding; otherwise stop and report the concrete dependency, test, scope, or review blocker.

## Focused proof
Within the sole test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, extend the joined schema-`0.6` fixture with a parallel panel containing distinguishable branch prompt leaves: one direct branch leaf and one recursively nested branch leaf reached through `parallel` and then `for-each`, in that exact order. Arrange local indices and neighboring declarations so an incorrect top-level, parallel-container, previous-leaf, later-leaf, or peer-branch lookup selects a marker that assertions reject. Item IDs may address captures but cannot prove declaration selection.

For no-session preview, assert every projected branch leaf contains only root, its own assigned-agent, and its own prompt guidance. For active/session preview and sequential live CLI and MCP sessions, assert only the current authored branch leaf is composed. Assign the direct branch leaf to fixture agent `parallel-direct-agent` and the recursively nested branch leaf to fixture agent `parallel-nested-agent`. Capture each leaf in its own sequential CLI session as `parallel-direct-cli` and `parallel-nested-cli`, and in its own sequential MCP session as `parallel-direct-mcp` and `parallel-nested-mcp`; assert each of those four captures uses only the named leaf's canonical agent declaration. Compare complete categorized intent and behavior blocks across every applicable preview, CLI, and MCP capture. MCP parallel execution remains sequential because MCP transport returns before the CLI concurrent-wave path; do not add or claim concurrent MCP support.

Exercise a real concurrent CLI wave with exactly `--max-in-flight 2`. Because `attempt_concurrent_wave` requires sibling frames to have the same role, use one assigned role and distinguish sibling prompt guidance there. Capture both cold-dispatch prompts, require one physical harness call per sibling, advance the authoritative cursor in authored order, and prove the later sibling consumes its cached outcome without redispatch. Include a branch with a subsequent leaf so readiness changes while another sibling outcome remains cached. Every newly composed frame must exclude stale and peer guidance.

Prove root-agent-current-prompt order, prompt-local additive replacement, prompt-over-agent-over-root scalar precedence with broader fallback, and exactly one occurrence of every effective marker. Put opposing require/avoid IDs in different sibling leaves and prove they do not conflict because siblings resolve independently. Also include a true conflict within one sibling's effective root/agent/prompt composition and require refusal before any harness marker for that dispatch.

Assert absence of guidance from the parallel container, peer branches, prior and later leaves, enclosing controls, the post-panel prompt, and unassigned agents. Preserve and exercise all joined top-level, named-sequence, branch, loop, `for-each`, malformed-path, root-only collision, absent-guidance, present-empty-guidance, participation, and legacy compatibility assertions.

Static declaration attribution remains `sequence:<branch-sequence-id>/<item-id-or-step-N>` with one-based fallback numbering and no readiness claim. Ready-frame output omits static `source` attributes. Keep unique `Agent.system` text absent from categorized intent and behavior blocks and present only through the established per-frame CLI `harness_argv` and MCP `mcp_harness_argv` system channels. Differing categorized guidance must not resend or reclassify `system`.

## Reuse
Reuse `modules/cli/src/app/frame_prompt.rs::resolve_declared_item` as the only structural declaration resolver. Its rightmost non-`item` owner rule uses that segment's named-sequence ID and local index, so the same logic resolves direct and recursively nested parallel leaves without branch offsets or item heuristics. Exact reused signature: `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>`.

Keep exact reused signature `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged. Reuse its canonical assigned-agent lookup, `ready_prompt` reference, one core `frame_guidance` call, all four participation fields, one effective `intent_items` and `behavior_items` pair, and shared `intent_block` and `behavior_block`. It remains the common composition point for no-session preview, active and historical session preview, ordinary CLI dispatch, speculative concurrent-wave dispatch, and MCP dispatch. Do not fork composition by branch or transport.

Reuse core runtime readiness and frame construction unchanged. `path_for_nested_item` already emits a leading `procedure`, one segment for every active control including `parallel`, and a trailing `item`. Static preview already traverses each authored parallel branch and emits branch-body leaves with `parallel` path segments. The rightmost owner and local index therefore identify the current declaration structurally.

Reuse `peek_parallel_branch_frame`, `attempt_concurrent_wave`, `session_with_bound_state`, and the normal per-frame `resolved_frame_prompt` calls unchanged. `peek_parallel_branch_frame` already clones state, retargets only the top parallel frame to the requested authored branch, resets it to that branch's first step and isolation buffer, and returns the sibling frame with its exact bound state. Concurrent CLI preparation already resolves each sibling's assignment and prompt independently, then attaches its prompt and `Agent.system` to that sibling's own harness run.

Reuse `pending_wave_cache`, session loading, and durable identity unchanged. The wave cache stores harness outcomes keyed by activation and branch/item offset, not prompts or effective guidance; sidecars retain outcome and position/base-state identity rather than guidance composition; and session loading pins and verifies source and canonical digests. Model-visible identity follows each actual per-sibling prompt byte sequence. Prove distinct effective text and one physical dispatch per cached sibling instead of changing cache, manifest, sidecar, activation, position, base-state, or digest structures.

No symbol is added or removed. The only edited exact signatures are `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>` in `modules/cli/src/app/frame_prompt.rs` and `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` in `modules/cli/tests/proof_agent_intent_dispatch.rs`; both signatures remain unchanged.

## Exclusions
Do not edit core readiness, `peek_parallel_branch_frame`, control transitions, `SequenceFrame`, frame builders, `modules/cli/src/app/drive.rs`, `modules/cli/src/app/preview.rs`, core guidance composition or rendering, trait/schema/validation files, CDK or generated files, session/ledger/persisted/wire models, harness argument construction, transport selection, `pending_wave_cache`, sidecars, activation keys, manifests, position/base-state digests, cache identity, or any task sibling. Do not create, remove, rename, generate, or edit an implementation file other than `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`.

Do not add a symbol, helper, resolver, renderer, composer, participation field, cache field, signature change, compatibility shim, test helper, or second test. Do not inspect branch decisions, branch offsets, `iteration_index`, `run_index`, prompt evidence or text, input values, neighboring declarations, or globally unique item IDs to choose guidance. Do not precompose all sibling guidance, merge simultaneously ready leaves, inherit a spawning control's scope, cache effective guidance, copy guidance onto a parallel container, or add a parallel-specific composer.

Do not alter source grammar, ready-frame source omission, joined deterministic selector errors, categorized envelope ordering, root-only collision compatibility, assigned-agent selection, harness argv construction, MCP transport behavior, `Agent.system` transport, pending-wave recovery, or durable digest identity. Retry behavior belongs to `0255.14`; persistent/shared-session refresh belongs to `0255.15`. Do not take either scope.
"""
