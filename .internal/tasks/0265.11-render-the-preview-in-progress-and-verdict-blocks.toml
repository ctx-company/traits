content = '''
This plan separates GOALS from APPROACH. The GOALS section is binding: each one
names an observable outcome, what decides it, and what it excludes. The APPROACH
section is the architect's suggested route — discovery order, file and symbol
guesses, edit order, proof mechanics. Deviate from any of it wherever a goal
requires it, and report the deviation in the work summary; a deviation is not a
violation and needs no escalation.

This cut inserts the Sessions preview column's two state blocks into the body
sequence `0265.10` parameterised: the bordered `in progress` "now" item and the
`verdict` block, between the `run` identity block and the spacer. `0265.12`'s
`slots` block and `0265.15`'s `landing` block follow them; nothing about the
frame, the named-block form or the key/value row is rebuilt here.

Grammar rule 13 fixes both the position and the now-item's shape: state blocks
sit after the identity block, and the bordered item is `row-open` fill,
border-soft 1, pad [8,10], a title in sans 12 with the state word at the right,
and a narrated line in mono 10.5 `text-muted` (`grammar.md:117-124`). Rule 5
makes block headings lowercase mono 11 `text-muted` (`grammar.md:49-56`); rule 7
makes keys sans 11.5 `text-secondary` and values mono 10.5, "state-colored only
when the value IS a state" (`grammar.md:68-72`). The export measures the same
two blocks: full width, gap 8, bottom padding 20, item gap 5, `#101215` fill on
`#23262d` border, title sans 12 `#d7dae0`, marker mono 10.5 `#7fb2ff`, narration
mono 10.5 `#585d68` at 16px line height (`reference/sessions.html:698-736`);
then heading mono 11 `#585d68`, one status key/value row whose value is
`#d8b46a`, and blocker lines mono 10.5 `#8b909c`
(`reference/sessions.html:737-776`). `screens/sessions.md:36-49` tags what is
`data:` and what is `placeholder:`: the title and marker are data, the narrated
line is the placeholder, and the verdict heading, status and blocker lines are
data from typed verdict slots.

Everything else in the export and the screen doc is illustration.
`review — refinement round 2`, `live`, `blocked · 2 findings`, `b1 — ...` and
the narration sentence are examples of runs, not literals valid for any run
(`0265:117-122`). Seven corrections follow, and each one is a place where
copying the illustration would have shipped a plausible lie.

## Seven corrections to the draft this plan replaces

**Correction 1 — `blocked` is not a stored verdict status.** The draft made
`blocked · 2 findings` the contract for the status value. The family's stored
status is the closed pair `approved|revise`
(`packages/toolkit/src/schema.ts:311-330`; generated at
`.ctx/traits/authored/implement/generated/basic/index.toml:224-264`), with
`status = revise` if and only if `blockers` is non-empty. Nothing in the ledger
ever says `blocked`. This is exactly `0265.10`'s Correction 1 in a second place,
and it resolves the same way (`0265:32-38`): render the served status word,
and if the owner wants `blocked` on this screen, that is a schema or design
finding raised against the artifact, never a synonym table typed into the
desktop. Goal 6 binds the served word plus a finding-count segment derived from
the blocker list, and nothing else.

**Correction 2 — warn is not the tone of every revise verdict.** The draft said
"the verdict status is warn because it needs the owner". Rule 1 defines warn
narrowly as *needs the owner* (`grammar.md:6-22`), and the schema carries that
fact separately and explicitly: `escalation = none|needs-owner`, where
`needs-owner` means at least one blocker cannot be cleared by the worker from
inside the run (`packages/toolkit/src/schema.ts:338-348`). An ordinary
worker-fixable revise verdict is the common case and does not need the owner, so
colouring it gold makes rule 1's one gold signal meaningless. Goal 6 binds the
tone to the served evidence: `needs-owner` is warn, `approved` is ok (settled
good, rule 1), and a revise verdict with `escalation = none` takes the neutral
value tone. The export's gold value is measurement of one example run whose
escalation the export does not record; the rule is the authority
(`0265:117-122`).

**Correction 3 — the shared round helper cannot see this repository's own
verdict slots.** `verdict_slot_rounds` counts revisions whose slot ref
`ends_with("-verdict")` and takes the maximum per-slot count
(`modules/core/src/procedure/stats.rs:57,109-122`); `RunSummary::from_session`
projects `verdict_rounds` from it (`modules/io/src/run_summary.rs:243-245`).
The implement family's verdict slots are `review-verdict-1` and
`review-verdict-2`
(`.ctx/traits/authored/implement/generated/basic/index.toml:91-99`), whose refs
end in `-verdict-1`/`-verdict-2` and match nothing; the helper's only test uses
`review-a-verdict` (`stats.rs:671-683`). So at this HEAD an implement run with
real typed reviewer verdicts carries `verdict_rounds = None`, and a heading that
reads the row honestly would render no verdict block for the repository's
principal trait family. This is a shared-data defect, not something the desktop
may route around with a local count. Goal 8 corrects the helper and its
coverage in core. Its existing per-slot-maximum aggregation is *kept*: with two
reviewers each writing once per round, the maximum per-slot revision count is
the round count, which is the right answer once the refs are recognised.

**Correction 4 — the two design round numbers have two different sources, and
the draft conflated them.** The illustration shows `refinement round 2` in the
in-progress title and `round 1` in the verdict heading, so one count cannot feed
both. They are different facts: completed verdict rounds is
`RunSummary.verdict_rounds`, while the round a run is *currently in* is
structural loop evidence. Goal 3 therefore binds the title to
`RunSummary.current_sequence_title` — the served active frame title, which for
implement:basic is authored text like `Implement the task` or `Review the
implementation`, not the design literal `review`
(`modules/core/src/procedure/session.rs:1424-1460,2615-2637`;
`.ctx/traits/authored/implement/generated/basic/index.toml:391-429`) — with a
round segment appended only from the shared one-based loop presentation
`0265.6` lands, and omitted entirely when the selected run is in no loop and
therefore no round is served. No desktop-local `+1` over the zero-based
structural iteration, no inference from flat row order, no hardcoded `2`, and no
reuse of the completed-verdict count as the current round. That presentation is
the reason `0265.6` is a prerequisite here: the only one-based derivation in the
repository today is CLI-private `format_step_title`, which filters
`segment.kind == "loop"`, adds 1 to each recorded zero-based `iteration` and
joins nested rounds with `/` (`modules/cli/src/app/story.rs:32-44`, `pub(crate)`
in the CLI binary), and goal 9 forbids the desktop importing or copying
CLI-private code. Without `0265.6`'s extraction landed, goal 3's with-round
outcome would have no shared projection to consume and could only be met by
taking a sibling's scope. Goal 5 binds the verdict heading to `verdict_rounds`,
with `None`
rendering no block at all — the family convention `0265.5:316-330` already
fixed: missing evidence renders no round segment, never round zero.

**Correction 5 — the em dash is not in the closed glyph set.** The design text
uses `review — refinement round 2`, `verdict — round 1` and `b1 — ...`, but rule
3's allowed set is `↰ ↳ → · ∷ –` and closes with "nothing else"
(`grammar.md:31-37`); rule 2 says compound states join with `·`
(`grammar.md:24-29`). Per `0265:117-122` a newly discovered export/rule conflict
resolves in favour of the grammar and is reported. Every separator this cut
renders is `·`, and the em dash occurrences are raised as an owner correction
against `screens/sessions.md` and `reference/sessions.html`.

**Correction 6 — the blocker line cannot come from the existing gloss, and the
desktop may not grow a second reader for it.**
`ctx_traits_core::procedure::story::value_gloss` is documented as the single
place `status`/`verdict`, `blockers[].id`, `escalation` and advisory conventions
are read (`story.rs:223-324`), and CLI `run_format::print_escalation_blockers`
reuses it (`modules/cli/src/app/run_format.rs:601-621`). It returns
`blockers: Vec<String>` — sorted, deduplicated ids only — so the export's
`<id> <sep> <description>` line is not producible from it today. Re-reading the
JSON conventions in gpui would duplicate the one reader. Goal 7 binds one
minimal extension of that shared reader to carry each blocker's `what` — the
schema field described as "The defect and the concrete failure it causes"
(`packages/toolkit/src/schema.ts:129-133`) — with
`print_escalation_blockers`'s existing sorted, deduplicated, byte-stable id
output unchanged. The same goal forbids inventing a truncation contract: the
shared reader already bounds text at `GLOSS_CHAR_BOUND` and appends `…`
(`story.rs:54,261-269`), a glyph rule 3 does not authorise, and the export marks
blocker lines nowrap at a 380-wide column. Neither is this cut's to solve
locally; both are reported.

**Correction 7 — the draft bound exactly one boundary and left the rest to
prose.** "A run with no verdict round shows no verdict block" was its only
presence rule. Unbound were: whether the `in progress` block exists at all for a
finished run (accent `live` is truthful only when `CenterPublicRow.live` is
true, `center.rs:3778-3788`, and `RunSummary.session_state` is projected with
`live = false` and cannot answer it, `run_summary.rs:131-143`); an absent or
blank current title; a `parse_error` row; approved and no-blocker verdicts;
malformed accepted values; multiple verdict slots, which implement:complex makes
real by writing two reviewer verdicts per round
(`.ctx/traits/authored/implement/source/variant/complex/index.ts:13-25`); a
partially written round; and the atomicity of heading round against body under
rapid selection. Goals 1, 5, 6 and 9 bind all of them.

## Grounded at HEAD cafd932a9

Nothing this task renders exists yet. Root `Cargo.toml` lists only the existing
workspace crates and excludes only `packages/cdk`; no manifest or lockfile names
gpui; there is no desktop directory, no desktop recipe in `Justfile` and no
desktop lane in `.github/workflows/ci.yml`. The prerequisite `0265.10` is
`ready`, and so are its own prerequisites `0265.2`, `0265.3` and `0257`.

Every desktop path, module name, component name, symbol, signature, gpui API and
command named below is therefore a guess to be replaced by discovery against
what `0256.1`, `0265.1`, `0265.3`, `0257` and `0265.10` actually landed. Binding
them here would be fabrication.

The desktop lane is nonetheless guaranteed to exist when this cell runs, and the
guarantee is a code fact: an open leaf derives `Blocked` while any `depends-on`
target is not `Done` (`modules/core/src/task/graph.rs:115-177`), and this task
depends on `0265.10`, which depends on `0265.3` → `0265.1` → `0256.1`. The same
rule is what makes goal 3's round segment unconditional: this task also depends
on `0265.6`, so its shared one-based loop presentation is landed before this
cell dispatches. The first
act of this cell is to locate that lane's documented non-interactive command and
record it verbatim in the work summary. If no such command is found, the
prerequisite chain has not in fact landed: stop and report that, rather than
substituting a workspace command for rendered-behaviour proof. It is
deliberately not declared as a `[[checks]]` entry, because a check must exist in
the repository at the moment the plan is written and this one does not.

**Rendered-preview evidence**, the phrase the goals use, means two things taken
together: the landed lane's documented command, run as it exists and exiting 0;
and, for every outcome that command does not itself decide, the run's own
observation of the running frame and the composed element tree, by whatever
means that harness already supports. Which of the two decided which outcome, and
the mechanics used, are named in the work summary. Adding coverage inside the
landed harness is right where a goal needs it; standing up a second validation
lane beside it is not.

What *is* readable today is the data side, and the goals lean on it.
`RunSummary` already carries `current_sequence_title`, `verdict_rounds` and
`parse_error` (`run_summary.rs:73-118`), and `CenterPublicRow` carries the
authoritative `live` flag beside the summary (`center.rs:3778-3788`). A full
`Session` carries current `accepted_slot_values` — full JSON value, digest,
optional schema ref, source, acceptance and producer evidence
(`session.rs:1447-1460`; `runtime/state.rs:180-244`) — and append-only
`slot_revisions` carrying slot ref, digest, acceptance order, operation, loop id
and iteration (`runtime/state.rs:702-755`). Ledger validation enforces that each
latest revision matches an accepted current value with the same ref and digest
(`runtime/ledger_contract.rs:1103-1147`), while historical payload replay exists
only where operation/submitted evidence does (`ledger_contract.rs:1179-1279`).
So the verdict body is read from the accepted typed `Value`, and revisions are
chronological/round evidence — never a reason to reconstruct current JSON from
prompt text or from a file.

Two protocol notes for discovery rather than for binding. `center::get` today
returns the full `Session` with typed Missing/Session/Ambiguous results
(`center.rs:916-935`) but reads the selected ledger synchronously inside the
sole model owner (`center.rs:3649-3669`); `0257` is expected to establish the
sanctioned selected-detail path and the off-thread desktop bridge, and this cut
consumes that rather than inheriting the blocking shape or adding a second
request. And today's deltas are `Appeared`, `RowChanged`, `Ended` and
`ActivityLine`, the last carrying a compact row plus an activity-sidecar record
and no slot JSON (`center.rs:265-281`; `activity_sidecar.rs:24-56`) — so a view
selected *before* a verdict is written cannot stay current from that delta
alone. Inspect what `0257.3` landed: if its contract does not carry or reconcile
changed selected detail, that is a data-contract gap to close through the same
center-served detail path, and never with a timer, a desktop filesystem read or
a second detail protocol.
