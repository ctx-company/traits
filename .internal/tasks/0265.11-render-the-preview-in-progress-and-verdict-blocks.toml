scope = '''
## GOALS — binding

1. **The `in progress` block exists only while the selected run is happening
   now.** It renders when the selected row's `CenterPublicRow.live` is true, and
   not otherwise: a finished, ended or non-live selection renders no now item
   and no `live` marker at all, rather than a bordered item with the marker
   dropped. A row carrying `parse_error` renders no now item either — its empty
   identity and absent title are not evidence about a real run
   (`run_summary.rs:255-295`). When the selection changes, no previous run's now
   item survives into the new one.
   Decided by rendered-preview evidence for a live selection, a non-live
   selection, an unreadable selection, and a live-to-finished transition on the
   same run; plus the closing diff read showing the presence condition reads the
   row's `live` flag and not `RunSummary.session_state`, which is projected
   `live = false` by construction (`run_summary.rs:131-143`).
   Excluded: deriving liveness from elapsed, mtime, terminal epoch, a render
   clock or the absence of a stop reason; a persistent block that merely hides
   its marker; leaving the block visible while the selection is stale or the
   center is lost, which goal 9 governs.

2. **The now item renders in the artifacts' shape.** A full-width block with
   internal gap 8 and bottom padding 20, whose first child is the lowercase
   heading `in progress` in mono 11 `text-muted`, followed by one bordered item:
   `row-open` fill, 1px `border-soft`, padding [8,10], internal gap 5, no corner
   radius; inside it a full-width `space-between` row with the title in sans 12
   and the state word at the right in mono 10.5 accent, then the narrated line
   in mono 10.5 `text-muted` at 16px line height across the full width. The
   named-block form and the heading come from `0265.10`'s primitives; only the
   bordered item is new here, and it is reusable by the later previews that name
   a now item rather than built for one screen.
   Decided by rendered-preview evidence for the fill, border, paddings, gaps,
   families, sizes and tones, plus the closing diff read against
   `grammar.md:117-124`, `tokens.md:71-84` and
   `reference/sessions.html:698-736`.
   Excluded: a pill, badge, chip, icon or dot — rule 4 restricts dots to
   stateful lists (`grammar.md:39-47`); any corner radius inside the canvas; a
   second named-block or heading form beside `0265.10`'s; any colour, size,
   spacing, family or weight literal at a call site; rule 5's italic narrator
   voice here — rule 13 is the specific rule for this item and it is non-italic
   mono 10.5 `text-muted`.

3. **The now item's title is served data with no locally computed round.** The
   title renders `RunSummary.current_sequence_title` verbatim. A round segment is
   appended, joined with `·` per rule 2, from the shared one-based loop
   presentation prerequisite `0265.6` lands, for every selected run whose served
   structural evidence carries a loop round; a run in no loop serves none and its
   title renders alone with no round segment and no dangling separator. That
   projection is consumed, never re-derived: the repository's only one-based
   derivation today is CLI-private (`modules/cli/src/app/story.rs:32-44`) and
   goal 9 forbids importing or copying it. The `live` marker is the served state
   word in accent per
   rule 1. A live run whose served title is absent or blank renders one fixed
   form: the lowercase literal `no current frame`, in the title's sans 12 but in
   `text-muted` rather than the title tone, with no round segment and no
   separator. That literal is this cut's absence form for missing served
   evidence, not a `placeholders` entry — goal 4 keeps that module to the
   narration — and it is never an empty line, a guessed default phrase or the
   previous selection's title.
   Decided by rendered-preview evidence for a served title whose run carries a
   loop round, a served title for a run in no loop, and a live run with no served
   title rendering exactly `no current frame` in `text-muted` with no separator;
   plus the closing diff
   read for any `+1` over structural zero-based iteration, any inference from
   row order or list position, any literal `review`, `refinement round 2` or
   `round`-prefixed constant, and any reuse of `verdict_rounds` as the current
   round (content Correction 4).
   Excluded: re-deriving the current frame in the desktop rather than consuming
   `current_sequence_title`; substituting `RunSummary.title`, the task title or
   the trait id for a missing title; rendering `round 0`; a preview-private
   loop-round computation; any design example string typed as a literal.

4. **The narrated line is the `placeholders` module's own entry, and the only
   placeholder in this cut.** The sentence resolves through the one module
   `0265.3` created, with exactly one entry added here — the in-progress
   narration — and no inline literal at the call site, traceable to the
   `placeholder:` tag at `screens/sessions.md:38-39` that authorises it. Every
   other leaf in both blocks is data.
   Decided by the closing diff read showing exactly one entry added to that one
   module and resolved at the call site, with no inline sentence, no duplicate
   literal and no second `placeholders` module; plus rendered-preview evidence
   that the line renders from the module entry.
   Excluded: a registry, lookup framework, trait or macro layer; entries no cut
   renders yet (loop phrasing, header phrasing, owner handle — each arrives with
   its consumer); a second `placeholders` module; a placeholder standing in for
   the title, marker, heading, status, count or blocker lines, which would mark
   wired data as unwired.

5. **The verdict block exists only on recognised verdict evidence, and its
   heading round and body come from one accepted snapshot.** The block renders
   when the selected run's served evidence carries at least one recognised
   verdict round; `RunSummary.verdict_rounds = None` renders no block at all —
   not an empty block, not one labelled round 1, not `round 0` — matching
   `0265.5:316-330`. The heading is lowercase mono 11 `text-muted` reading
   `verdict` with ` · round <R>` from `verdict_rounds`, and `R` and the rendered
   body are taken from the same accepted evidence snapshot: a row version's
   round is never combined with another version's slot JSON. An accepted value
   that is malformed, schema-mismatched or carries none of the recognised
   conventional fields renders one fixed failure form: the heading exactly as
   above, and a body of exactly one key/value row through `0265.10`'s primitive —
   key `status`, value the lowercase literal `unreadable` in the danger tone,
   rule 1's failure sense, because the served evidence could not be read — with
   no findings segment and no blocker lines. A value whose status word falls
   outside the closed `approved|revise` pair is exactly such a schema mismatch
   and renders that same `unreadable` row, never the word it carries. No
   previously accepted verdict block survives a newer selection or a failed
   refresh as current.
   Decided by rendered-preview evidence for no round, one round, a later round,
   a malformed accepted value and a value whose status is outside the closed pair
   each rendering exactly the `status` / `unreadable` danger row with no findings
   segment and no blocker lines, and a refresh failure against a previously
   rendered verdict; plus the closing diff read showing heading and body read one
   snapshot.
   Excluded: `round 0` or a defaulted round; the design literal `round 1`;
   re-deriving the round inside the desktop rather than consuming the projected
   row field (content Correction 3 fixes the projection instead); reconstructing
   verdict JSON from prompt text, historical revision payloads or a file when
   the accepted value is unreadable; the em dash separator (content
   Correction 5).

6. **The status row renders the served status word, an evidence-derived finding
   count, and a tone that means what rule 1 says it means.** One key/value row
   through `0265.10`'s primitive: key `status` in sans 11.5 `text-secondary`;
   value in mono 10.5 composed of the served status word and, when the rendered
   blocker set is non-empty, a `·` separator and the count segment `<N> findings`
   — singular `1 finding` at `N = 1` — where `N` is the size of that rendered
   deduplicated set; an empty set renders no separator and no segment. So a
   revise verdict carrying two distinct blocker ids renders `revise · 2
   findings`. Only the status word is a state and carries a
   tone; the separator and the count are neutral, per rule 7. The tone follows
   the served evidence: `escalation = needs-owner` is warn, `approved` is ok,
   and a revise verdict with `escalation = none` takes the neutral value tone
   (content Correction 2). A status word outside the closed `approved|revise`
   pair is not a status: it is a schema-mismatched accepted value and renders
   goal 5's fixed `status` / `unreadable` danger row, never a verbatim render and
   never a mapping onto a known word.

   Multiple verdict slots aggregate by one deterministic shared rule, stated
   here in full and testable outside the GUI, over evidence that is entirely
   derivable from `slot_revisions` and `accepted_slot_values` with no plan or
   trait read:
   - **Displayed round.** `R` is the maximum per-slot count of recognised
     verdict revisions — `verdict_slot_rounds`'s existing aggregation, goal 8's
     correction applied — and is the round the heading shows.
   - **Participating slots.** A verdict slot participates when it carries at
     least one recognised verdict revision. A declared-but-unwritten slot is not
     yet a reviewer and contributes nothing.
   - **Round membership.** A participating slot's current accepted value belongs
     to round `R` if and only if that slot's own recognised verdict revision
     count equals `R`. A participating slot whose count is less than `R` has not
     reported in round `R`: its current accepted value is an earlier round's and
     is excluded from the rendered body entirely, so no round mixes two rounds'
     JSON.
   - **Complete round.** Every participating slot's count equals `R`. The status
     is `revise` if any member value is `revise`, and `approved` only when every
     member value is `approved`.
   - **Partial round.** At least one participating slot's count is less than
     `R`. The status never renders a settled word: `approved` is unreachable for
     a partial round however many members approved. It takes exactly one of two
     forms, both fixed here. Member `revise` still outranks: a partial round with
     any member `revise` renders `revise` with the same count segment as a
     complete one. A partial round with no member `revise` renders the lowercase
     word `pending` in the neutral value tone, with no findings segment. There is
     no third form.
   - **Blockers.** The rendered blocker set is the union of the member values'
     blockers only, deduplicated by id in the shared reader's existing sorted
     order; a non-member slot's blockers never appear. The finding count is
     derived from that same rendered set.
   Decided by direct core tests over the shared aggregation and tone inputs —
   approved, revise with `escalation = none`, revise with `needs-owner`, one
   reviewer, two reviewers agreeing at `R`, two reviewers disagreeing at `R`, a
   partial round where the lagging slot's accepted value is approved, a partial
   round where a member is revise, and a status outside the closed pair — each
   asserted against the word, count segment and tone fixed above, proven by the
   declared core and `just test` checks; and by rendered-preview evidence that
   the row renders those same fixed forms: `approved` with no segment in ok,
   `revise · <N> findings` with the neutral segment and the escalation-implied
   tone, `pending` with no segment in the neutral tone, and `unreadable` in
   danger for a status outside the closed pair.
   Excluded: the literal `blocked` or any synonym table mapping `revise` to
   another word (content Correction 1); an unconditional warn for every revise
   verdict; colouring the whole compound value, which would make the count read
   as a state; a count derived from anything but the rendered blocker set; a
   desktop-local status, tone or round-membership rule rather than the shared
   one; treating a status outside the closed pair as renderable data; combining
   a non-member slot's accepted value, blockers or count into round `R`;
   reading the plan or trait to decide which slots participate; inventing an
   "approved" line the schema does not carry — an approved verdict with no
   blockers renders the status row alone with no findings segment and no blocker
   lines.

7. **Blocker lines come from the one shared conventional reader, extended once.**
   Each rendered line is mono 10.5 `text-secondary`, full width, composing the
   blocker's `id` and, when the served value carries one, a `·` separator and
   its `what` text; a blocker with no `what` renders its id alone with no
   dangling separator. The convention is read in exactly one place —
   `procedure::story::value_gloss` extended minimally to carry `what` beside the
   existing id — and `run_format::print_escalation_blockers` remains a consumer
   with its sorted, deduplicated, byte-stable id output unchanged. The desktop
   adds no truncation, ellipsis or wrapping policy of its own: whatever bounding
   the shared reader already applies is what renders, and the two unresolved
   visual boundaries — the `…` the shared bound emits, which rule 3's closed
   glyph set does not authorise, and the export's nowrap blocker lines in a
   380-wide column — are reported as owner corrections rather than solved with a
   local formatter.
   Decided by direct core tests over the extended reader — blockers with and
   without `what`, duplicate ids, a value carrying none of the conventional
   fields, and a non-object value — plus the CLI consumer's existing behaviour
   still green under the declared checks, and rendered-preview evidence of the
   composed lines and of a blocker with no `what`.
   Excluded: a second JSON-convention reader in the desktop or anywhere else;
   reading `where`, `root-cause`, `required-fix`, `steps` or `done-when` into
   this line; changing `print_escalation_blockers`'s output; a desktop-side
   truncation, ellipsis, character budget or wrap policy; the em dash separator;
   the design's example blocker text as a literal or as fixture authority.

8. **The shared round helper recognises the repository's own verdict slots.**
   `verdict_slot_rounds` counts revisions for numbered verdict slots such as
   `review-verdict-1` and `review-verdict-2` as verdict rounds, not only refs
   ending exactly in `-verdict`, keeping its per-slot-maximum aggregation — which
   is the correct round count when two reviewers each write once per round — and
   keeping `None` for genuinely absent coverage. Its coverage in
   `procedure::stats` is extended to the numbered form. If a prerequisite
