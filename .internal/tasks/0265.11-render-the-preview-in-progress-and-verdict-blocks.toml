  documented non-interactive build-and-test command. Record it verbatim before
  any edit. If no such lane exists, the prerequisite chain has not landed:
  report that rather than substituting workspace commands.
- Read `0265.10`'s landed preview frame: how the ordered body sequence takes
  additional blocks, the named-block form, the key/value row's tone-carrying
  value segments, and the selection transaction and stale marker to reuse.
- Read `0257`'s landed selected-detail contract — what it serves for accepted
  slot values and revisions, and whether a verdict written after selection is
  reconciled. Extend that one contract where goal 9 requires it; a second
  detail request or a timer is a defect.
- Read the prerequisite `0265.6`'s landed shared one-based loop presentation —
  the extraction of `format_step_title`'s loop-only, plus-one, nested-preserving
  semantics (`modules/cli/src/app/story.rs:32-44`) — and consume it for the
  title's round segment. Read also whether any prerequisite already corrected
  `verdict_slot_rounds`; consume what exists, correct only what does not.
- Read `0265.3`'s landed `placeholders` module for the entry convention, and
  `0265.1`'s token and font entry point for every value.

### Edit order

1. The shared core corrections first, so the render side has honest evidence to
   consume: `verdict_slot_rounds`'s numbered-ref recognition with its
   `procedure::stats` coverage, then `value_gloss`'s minimal `what` extension
   with `print_escalation_blockers` unchanged and direct tests beside the
   reader.
2. The shared verdict presentation: status word, finding count, tone from
   `escalation`/`approved`, and the multi-slot aggregation of goal 6 — placed
   in core beside the reader it consumes, with core tests, not in gpui.
3. The bordered now-item primitive, composed from `0265.10`'s named block.
4. The two blocks' projection off the selected model: presence conditions,
   heading round and body from one snapshot, absences.
5. Insertion into `0265.10`'s body sequence at the position rule 13 fixes.
6. The desktop lane's proofs, then the focused core proofs, then the declared
   checks.

### Expected surfaces and signatures — guesses to be replaced by discovery

Something shaped like a `now_item(title_segments, state_word, narration)`
primitive beside `0265.10`'s block form; a shared verdict presentation in
`modules/core/src/procedure/` returning a status word, its semantic role, a
finding count and the blocker lines, built on the extended `value_gloss`; and a
selected-preview projection extension carrying the two blocks' optional content.
`ValueGloss.blockers` becoming a small typed pair rather than `Vec<String>` is
the likely shape of Correction 6's extension. Names, module paths and signatures
follow whatever conventions `0256.1`, `0265.1`, `0265.3`, `0257` and `0265.10`
established. The behaviours goals 1-9 fix are not suggestions; where they live
and what they are called are.

### What the focused proof is expected to establish

These restate the goals' observable outcomes as coverage suggestions; how to
observe each one inside the existing harness is the run's call.

- A live selection rendering the now item; a non-live one, an unreadable one and
  a live-to-finished transition rendering none.
- The now item's fill, border, paddings, gaps, families, sizes and tones, with
  the title left and the accent state word right, and the narrated line
  non-italic mono 10.5 `text-muted` at 16px line height.
- A served title for a run carrying a loop round and one for a run in no loop,
  with no dangling `·`; a live run with no served title rendering exactly
  `no current frame` in `text-muted`.
- The narration resolving through the one `placeholders` entry.
- No verdict round rendering no block; one round and a later round rendering the
  heading round from the projected field.
- Approved with no blockers; revise with `escalation = none`; revise with
  `needs-owner`; two reviewers agreeing at the displayed round; two reviewers
  disagreeing at it; a partial round whose lagging slot holds an approved
  earlier-round value rendering `pending` with no segment; a partial round with a
  member revise rendering `revise · <N> findings` — each with the word, count
  segment and tone goal 6 fixes, none mapped to `blocked`, and no non-member
  value's blockers in the rendered set. The count's singular form at one finding
  and its absence at zero are covered too.
- Blocker lines with and without `what`, with duplicate ids deduplicated; a
  malformed accepted value and one whose status is outside the closed
  `approved|revise` pair each rendering exactly the `status` / `unreadable`
  danger row with no findings segment and no blocker lines.
- An implement-shaped run with `review-verdict-1`/`-2` revisions producing a
  round count, and a run with no verdict revisions producing none.
- Out-of-order A/B selection, a rejected candidate and a detail failure all
  leaving the accepted blocks whole; a verdict written while its run is selected
  becoming visible without a timer; center loss leaving the preview visibly
  stale.
- No read fired for an unselected row or a hover.
- A finished run's two blocks identical after the application closes and
  reopens.
- The `0256.2`-`0256.5` proofs still passing unmodified, and `0257.3`'s
  selected-detail proof passing — extended, not weakened, if goal 9's
  same-path reconciliation widening was needed.

Tests use scratch sessions, ledgers and slot values with arbitrary titles, slot
refs, statuses and blocker ids and text. No test may depend on this
repository's committed content, and no design example string is fixture
authority.

### Reuse points

`0265.10`'s preview frame, named-block form, key/value row with tone-carrying
value segments, stable selection identity and staged-candidate transaction;
