## Outcome
Every abnormal exit from the full-height inline run viewport must remove the
painted frame, and every hard-kill signal must leave the same failure panel
the ordinary run-end path renders — built from the same `Panel` grammar and
the same title/trait fallback, never a second rendering.

Signal path. `interrupt::rescue_terminal_signal_safe` gains one additional
gated `libc::write` of already-formatted bytes. Those bytes are composed
outside every handler, at run-panel construction and on every title refresh,
and published into a fixed-capacity process-global buffer. The handler
performs only atomic loads and one `write`; no formatting, allocation, lock,
`eprintln!`, crossterm, or ratatui call is added to any handler. The buffer
begins with a clear-screen escape that homes the cursor and erases the
display (CSI H then CSI 2 J) and deliberately omits the erase-scrollback
operation (CSI 3 J), because the inline viewport already occupies every
terminal row (`inline_viewport_height(rows) == rows`) while the scrollback
above it must survive. Panel line terminators in the buffer are CR/LF,
because `rescue_terminal_signal_safe` writes before its `tcsetattr` and the
terminal may still be in raw mode.

The escalation ladder is NOT changed. Attaching the panel write to
`rescue_terminal_signal_safe` covers every path that actually performs a hard
rescue today: SIGTERM and SIGHUP on the first signal, SIGINT on the second
and third. Sibling `0252.4` owns any change making the second Ctrl-C the hard
hatch; this task must not pre-empt it. Because the buffer starts with the
clear escape, a repeated rescue overwrites rather than stacks, so the final
visible screen carries exactly one panel.

Ownership gating. The rescue bytes are armed against the exact pane
generation that owns the terminal and are written only when that generation
still owns an inline pane. A stale run panel must never be written over an
active alternate-screen dashboard, demo, story view, or editor; for those
panes the existing behavior is preserved exactly — leave the alternate screen
and reveal the untouched primary screen, with no clear and no panel. Pane
generations are monotonic and never reused, and `leave()` returns the active
generation to 0, so generation equality is the whole disarm mechanism; no
separate disarm entry point is added.

Panic path. The process panic hook clears the inline viewport after
restoring modes, and does nothing new for an alternate-screen pane. It does
NOT write the interrupted panel: a panic is an internal fault, not a kill, so
labelling it `interrupted (signal)` would be false, and the chained previous
hook then prints the real panic message on a clean screen. This also covers
the case where the panic poisoned `RunPanelState`'s mutex and a later
`RunPanel::close` therefore skips its body.

Quit, handoff, and commit failure. Confirmed `q` and the `d` dashboard
handoff currently call `state.repaint.quit()` before any commit, so the later
`RunPanel::close` finds a detached pane and `commit_inline_scrollback` is a
no-op — the painted frame survives. Both paths, and `RunPanel::close` itself,
must route through one shared teardown that commits the last rendered tree
and, only when that commit fails, explicitly clears the viewport instead. A
successful commit must not be followed by any additional clear, so a clean
run's teardown bytes are unchanged. This one ordering fix is also the
dashboard attach/exit fix: the attached observer is the same `RunPanel`, so
its `q`/`d` exit no longer leaves a frame for the rebuilt alternate-screen
dashboard to reveal on exit.

Ordinary error propagation already reaches `close()`: `RunPanelGuard::drop`
and `MergeSpanGuard::drop` both call `panel.close()` and cover every early
return, so the draft's "an error that propagates before close() runs" is not
a live defect in this revision. The remaining defect on that path is the
ignored commit result, which the shared teardown resolves. No new guard is
introduced. Likewise, the draft's "the attach/detach rebuild ignores
terminal.clear() failures" does not hold: inline construction propagates that
failure. The real attach remnant is the quit-before-close ordering above.

The implementation allowlist is exactly:
`modules/cli/src/app/tui.rs`, `modules/cli/src/app/tui_ratatui.rs`,
`modules/cli/src/app/interrupt.rs`, `modules/cli/src/app/run.rs`,
`modules/cli/src/app/run_view.rs`, `modules/cli/src/app/run_view/render.rs`,
`modules/io/src/env_reference.rs`, `modules/cli/tests/support/src/lib.rs`,
and new file `modules/cli/tests/proof_run_view_exit_teardown.rs`.
