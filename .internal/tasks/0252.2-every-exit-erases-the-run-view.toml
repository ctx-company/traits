## Focused proof
`modules/cli/tests/proof_run_view_exit_teardown.rs` carries exactly the closed
symbol surface declared in step 9. Every fixture is built from scratch data
through these existing `support` symbols, which are the only ones this file
imports and none of which it modifies:
`pub fn ScratchRoot::new(label: &str) -> ScratchRoot` and
`pub fn ScratchRoot::home(&self) -> PathBuf` for the isolated scratch root and
HOME; `pub fn git_init(dir: &Path)` for the scratch repository;
`pub fn require_success(description: &str, args: &[&str], cwd: &Path, home: &Path) -> String`
for the `ctx traits trust --approved` and `ctx traits state --active --file`
calls that clear the fixture's gates; `pub fn ctx_bin() -> PathBuf` for the
binary under test;
`pub fn spawn_ctx(args: &[&str], cwd: &Path, home: &Path) -> std::process::Child`
for test 4's background live run;
`pub fn run_pty_with_cursor_reply(binary: &Path, args: &str, cwd: &Path, home: &Path, marker: &str, termios_file: &str) -> (i32, String)`;
`pub fn text_after_terminal_restore(raw: &str) -> String`; and
`pub fn strip_escapes(raw: &str) -> String`. The two step-8 drivers,
`run_pty_signal_after_marker` and `run_pty_keys_after_markers`, are the only
other PTY recipes this file drives with.

`command_trait_fixture` creates the scratch root and HOME, `git_init`s
`<home>/repo`, writes `.gitignore`, `.ctx/traits/demo/trait.toml`, and
`TRAIT_PATH` with `std::fs::write` — a schema-0.2 manifest with one
`kind = "command"` sequence step declared as `id = STEP_ID` whose `cmd` is the
caller's string — commits with `git`, then clears the draft and unreviewed
gates through `require_success`. `STEP_ID` is the step label the run tree
renders, so it is the anchor tests locate in the painted frame and again in
the committed scrollback. Tests 1 through 4 pass `"sleep 30"` so the run pane
is reliably painted and the run is still in flight when the test acts; test 5
builds two fixtures — `"true"` for the clean run it measures, and `"sleep 30"`
for the killed capture that serves as its differential baseline.
`ledger_session_id` parses the ledger with `serde_json` and returns
`session-id`, so the expected session row value is observed rather than
hardcoded. `surviving_screen_text` slices at the last occurrence of
`CLEAR_VIEWPORT` and returns `strip_escapes` of the remainder.
`assert_only_interrupted_panel` asserts that
`surviving_screen_text(raw)` is exactly four panel lines: a `┌── ` top border
carrying `trait_id`, a `session:` row whose value is `session_id`, an
`error:` row whose value is `RESCUE_ERROR_TEXT`, and a closing
`└── Failure` — with no journey, history, current-stream, or footer row from
the live frame. No test may read committed repository content, a golden file,
or a path inventory.

1. `fn sigterm_leaves_only_the_interrupted_failure_panel()` — drive the run
   through `run_pty_signal_after_marker` with one SIGTERM after the pane is
   painted. Assert the child exit code is 143. Assert the captured bytes
   contain `FULL_RESTORE_ESCAPE`'s leave-alternate-screen and show-cursor
   sequences (modes restored). Then call
   `assert_only_interrupted_panel(&raw, TRAIT_ID, &ledger_session_id(&fixture.repo))`.
2. `fn repeated_sigint_leaves_only_the_interrupted_failure_panel()` — same
   helper, `repeat` set to three SIGINTs, matching the ladder that actually
   exists at HEAD (first graceful, second rescue, third hard exit). Assert
   exit code 130, then the identical `assert_only_interrupted_panel` call,
   proving the repeated clear-then-write overwrites rather than stacks. Do
   not send raw
   Ctrl-C bytes for this case and do not assert a two-press hard exit: in raw
   mode Ctrl-C is a key handled by `poll_detach`/`request_kill` and never
   reaches `handle_sigint`, and the two-press hard hatch belongs to `0252.4`.
3. `fn panic_mid_run_leaves_no_frame_rows()` — run under
   `run_pty_with_cursor_reply` with
   `CTX_INTERNAL_TESTHOOK_PANIC_AFTER_RUN_VIEW_RENDER` set, so the first
   fully painted frame is followed by a panic. That helper clears the
   environment and exposes no extra-env parameter, and step 8 forbids
   modifying it, so the hook is delivered by passing `/usr/bin/env` as
   `binary` and
   `"CTX_INTERNAL_TESTHOOK_PANIC_AFTER_RUN_VIEW_RENDER=1 <ctx_bin()> traits run --file <TRAIT_PATH>"`
   as `args`: `env` execs `ctx`, so the reported `[wait]` code is still the
   child's own. Assert the captured bytes contain `CLEAR_VIEWPORT` at an
   offset after the first `STEP_ID` frame row (the hook fires only after a
   fully painted frame), that the text after the final terminal restore
   carries the panic message and no `STEP_ID` row, and that
   `RESCUE_ERROR_TEXT` appears nowhere in the stream (a panic is not a kill).
4. `fn dashboard_attach_then_exit_leaves_no_run_frame()` — hold a live run
   through `spawn_background_run`, then drive `ctx traits dashboard` with
   `run_pty_keys_after_markers`: press Enter on the sessions row to attach
   (`attach_selected`), assert observer frame rows appear, press `q` and
   confirm to detach back to the dashboard, then press `q` and confirm the
   Exit modal. Assert the text after the final terminal restore
   (`text_after_terminal_restore`) contains no live run-frame row, proving
   the rebuilt alternate screen no longer reveals a stale primary-screen
   frame on exit.
5. `fn clean_run_teardown_commits_scrollback_without_an_extra_clear()` — run
   the `"true"` fixture to normal completion under
   `run_pty_with_cursor_reply` and assert the child exit code is 0.

   A clean capture legitimately contains erase escapes that this task does not
   introduce and must not forbid: `RatatuiPane::new_with_options` clears the
   freshly built inline terminal (`tui_ratatui.rs:581`), and ratatui's
   `insert_before_no_scrolling_regions` — the body of
   `commit_inline_scrollback` — clears the viewport itself once the inserted
   lines are drawn. Both spell that clear as a cursor-position set plus
   `\\x1b[J` (`ClearType::AfterCursor`), never as `CLEAR_VIEWPORT`. The proof
   therefore discriminates by exact byte sequence and by offset rather than by
   erase-presence, and asserts, in this order:

   a. Construction clear is located and excused, not counted as teardown:
      `raw.find("\\x1b[J")` is `Some` and is less than
      `raw.find(STEP_ID).expect("painted frame")` — the first erase in the
      stream precedes the first painted frame, which is exactly the
      construction clear at `tui_ratatui.rs:581`.
   b. The teardown slice is named exactly:
      `let commit_start = raw.rfind(STEP_ID).expect("committed tree row");`
      — the last write of the step row in the whole stream, which is the copy
      `commit_inline_scrollback` pushed into scrollback, since nothing after
      it re-renders the tree — and `let teardown = &raw[commit_start..];`.
      Every remaining byte assertion is made over that slice or over `raw`
      explicitly.
   c. The commit still happened: `strip_escapes(teardown)` contains a
      `STEP_ID` row, and `text_after_terminal_restore(&raw)` still shows it —
      the tree landed in scrollback instead of being erased.
   d. No byte this task can add appears in the teardown slice:
      `assert!(!teardown.contains(CLEAR_VIEWPORT))` and
      `assert!(!teardown.contains(RESCUE_ERROR_TEXT))`. Whole-stream counts
      are asserted 0 for both as well:
      `assert_eq!(raw.matches(CLEAR_VIEWPORT).count(), 0)`.
   e. Differential baseline, so (d) cannot pass vacuously: within this same
      test, drive `command_trait_fixture("clean-teardown-killed", "sleep 30")`
      through `run_pty_signal_after_marker` with one SIGTERM and assert
      `killed.matches(CLEAR_VIEWPORT).count() >= 1`. The killed capture is the
      named baseline: same fixture builder, same PTY recipe, same construction
      path, differing only in how the run exits. Its nonzero count against the
      clean capture's zero count is the byte-level comparison that proves the
      clean teardown emits none of the bytes this task introduces — a spelling
      or capture artifact would zero both sides and fail this assertion.
   f. The ordinary run-end panel is intact:
      `text_after_terminal_restore(&raw)` contains a `┌── ` top border, a
      `session:` row whose value is `ledger_session_id(&fixture.repo)`, and a
      closing `└── Success`.

   Reconciliation with the golden exclusion: a literal byte-for-byte diff
   against a pre-change capture would require committing today's bytes as a
   golden, which the exclusions forbid as a frozen-inventory proof, and every
   clean teardown at HEAD already routes through the function this task edits,
   so no in-tree control path can produce a pre-change baseline. Assertions
   (b) through (e) are the decomposition of that obligation for this change:
   (b) names the slice, (c) proves the unchanged producer still wrote it, and
   (d)/(e) pin the only bytes this task can add — `CLEAR_VIEWPORT_ESCAPE` and
   the armed rescue panel — to zero in that slice while proving the same
   capture pipeline does observe them on an abnormal exit. No other edit in
   the allowlist can write a byte on the clean teardown path.

## Reuse
`modules/cli/src/app/presentation.rs`'s `Panel`/`PanelRow`/`PanelStatus` is
the sole grammar authority; the rescue path reaches it only through
`crate::app::run::failure_panel`, which is also what the ordinary run-end
failure output uses after step 4b. The title/trait fallback has one
implementation, `crate::app::run::run_header_from_title`. ANSI serialization
has one implementation, `crate::app::tui::render_lines_ansi`, shared by
`emit_lines` and the rescue arming path. The clear-screen escape has one
definition, `tui_ratatui::CLEAR_VIEWPORT_ESCAPE`, shared by the panic hook
and the armed buffer prefix. Inline pane teardown has one implementation,
`run_view::close_pane_locked`, shared by `RunPanel::close`, confirmed `q`,
and the `d` handoff. Signal rescue keeps one entry point,
`interrupt::rescue_terminal_signal_safe`. The PTY driver recipe is shared
through `modules/cli/tests/support/src/lib.rs`; both new drivers,
`run_pty_signal_after_marker` and `run_pty_keys_after_markers`, sit beside
`run_pty_with_cursor_reply` rather than being copied into the proof file. The
surviving-panel assertion has one implementation,
`assert_only_interrupted_panel`, shared by the SIGTERM and repeated-SIGINT
tests, and the fixture builder has one implementation,
`command_trait_fixture`, parameterized by the step command.

