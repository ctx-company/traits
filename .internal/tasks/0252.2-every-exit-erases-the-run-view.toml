scope = """
## Ordered work
Edit strictly in this order; each step compiles before the next begins.

1. `modules/cli/src/app/tui.rs`. Add
   `pub(crate) fn render_lines_ansi(lines: &[Line]) -> String`: for each line,
   concatenate `paint(segment.tone, &segment.text)` over its segments, then
   push one newline. Rewrite only the body of existing
   `pub(crate) fn emit_lines(lines: &[Line]) -> crate::Result<()>` to write
   `render_lines_ansi(lines)` to the locked stdout handle and flush,
   preserving its signature and its byte output exactly (every line followed
   by one newline). Add no color/capability gate here: `emit_lines` has none
   today and its callers own that decision.

2. `modules/cli/src/app/tui_ratatui.rs`.
   a. Add `pub(crate) const CLEAR_VIEWPORT_ESCAPE: &[u8] = b"\\x1b[H\\x1b[2J";`
      — cursor-home followed by erase-entire-display, and nothing else.
      Document that erase-scrollback (`\\x1b[3J`) is deliberately absent, and
      that this exact spelling is what makes a task-introduced clear
      distinguishable in a captured PTY stream from the erases the terminal
      stack already emits on every clean run: ratatui's `Terminal::clear()`
      for an inline viewport emits a cursor-position set plus
      `ClearType::AfterCursor` (`\\x1b[J`), both at construction
      (`new_with_options`, `tui_ratatui.rs:581`) and again at the end of
      `insert_before_no_scrolling_regions`, which `commit_inline_scrollback`
      relies on. Neither is a substring of `\\x1b[H\\x1b[2J`, and crossterm
      spells cursor moves as `\\x1b[1;1H`, so this constant never collides with
      them.
   b. Add `pub(crate) fn signal_safe_inline_generation() -> u64`: two atomic
      loads; returns `ACTIVE_GENERATION` when `ACTIVE_SCREEN` equals
      `PaneScreen::Inline as u8`, otherwise 0. Async-signal-safe; no lock, no
      allocation.
   c. In `fn new_with_options`, store `ACTIVE_SCREEN` BEFORE
      `ACTIVE_GENERATION`, closing the window in which a handler observes a
      live generation paired with the previous pane's screen mode.
   d. In `fn install_panic_hook`, inside the existing `active != 0` arm and
      after `restore_terminal(...)`, write `CLEAR_VIEWPORT_ESCAPE` to stderr
      only when the resolved screen is `PaneScreen::Inline`. Do not write it
      for `PaneScreen::Alt`. Do not write the rescue panel here.
   e. Add `pub(crate) fn rescue_generation(&self) -> Option<u64>` on
      `impl RatatuiPane`, returning `Some(self.generation)` only when the pane
      is `PaneScreen::Inline` and not `detached()`.
   f. Add `pub(crate) fn clear_viewport(&mut self) -> std::io::Result<()>` on
      `impl RatatuiPane`: `Ok(())` for a non-inline, detached, or
      terminal-less pane; otherwise `terminal.clear()`.
   g. In the file's existing `mod tests`, add
      `fn clear_viewport_escape_erases_the_screen_but_never_the_scrollback()`
      asserting `CLEAR_VIEWPORT_ESCAPE` is exactly cursor-home plus
      erase-display and contains no erase-scrollback subsequence.

3. `modules/cli/src/app/interrupt.rs`.
   a. Add `const RESCUE_PANEL_CAPACITY: usize = 4096;`,
      `static mut RESCUE_PANEL: [u8; RESCUE_PANEL_CAPACITY]`,
      `static RESCUE_PANEL_LEN: AtomicUsize`,
      `static RESCUE_PANEL_GENERATION: AtomicU64`, and
      `static RESCUE_PANEL_WRITE: std::sync::Mutex<()>`.
   b. Add `pub(crate) fn arm_rescue_panel(generation: u64, panel: &crate::app::presentation::Panel)`.
      Outside any handler: build the byte string as `CLEAR_VIEWPORT_ESCAPE`
      followed by `crate::app::tui::render_lines_ansi(&panel.styled_lines())`
      with every newline expanded to CR/LF. Take `RESCUE_PANEL_WRITE`; a
      poisoned lock is recovered with `into_inner` rather than propagated.
      Store `RESCUE_PANEL_LEN` 0, copy the bytes, store
      `RESCUE_PANEL_GENERATION`, then store `RESCUE_PANEL_LEN` — that order is
      what makes a concurrent handler read either nothing or a complete
      buffer, never a torn one. Bytes exceeding `RESCUE_PANEL_CAPACITY` leave
      the length at 0 (nothing is armed; the rescue degrades to today's
      mode-only behavior). All stores and loads use `Ordering::SeqCst`,
      matching this module's existing discipline. This lock is a leaf: it is
      taken while `RunPanelState`'s mutex is held and must never itself take
      another lock.
   c. Add `fn write_rescue_panel_signal_safe()`: load the length; return when
      0; load the armed generation; return unless it is nonzero and equal to
      `super::tui_ratatui::signal_safe_inline_generation()`; then perform one
      `libc::write` of exactly that many bytes to `STDERR_FILENO`. Atomic
      loads plus one `write` only.
   d. In `fn rescue_terminal_signal_safe`, call
      `write_rescue_panel_signal_safe()` immediately after the existing
      `FULL_RESTORE_ESCAPE` write and before the `tcsetattr` call. Change
      nothing else in that function.
   e. Do not change `handle_sigint`, `handle_sigterm`, `install`,
      `SIGINT_COUNT`, `request_kill`, `request_stop`, or `reset`.
   f. Add a `#[cfg(test)] mod tests` with a single test symbol
      `fn arming_publishes_the_panel_bytes_under_generation_and_capacity_rules()`
      plus a test-only reader
      `#[cfg(test)] fn armed_rescue_panel_snapshot() -> Vec<u8>`. The test
      must, from scratch data: arm a small panel and assert the snapshot
      begins with `CLEAR_VIEWPORT_ESCAPE`, that stripping that prefix and
      collapsing CR/LF back to newlines yields exactly
      `crate::app::tui::render_lines_ansi(&panel.styled_lines())`, that the
      recorded generation is the armed one, and that arming a panel whose
      bytes exceed `RESCUE_PANEL_CAPACITY` leaves the length at 0.

4. `modules/cli/src/app/run.rs`.
   a. Add `pub(crate) fn failure_panel(product: &str, headline: &str, session_id: &str, error: &str) -> crate::app::presentation::Panel`,
      returning `Panel::new(product, headline, PanelStatus::Blocked("Failure".to_string()))`
      with a `RowTone::Default` `session` row then a `RowTone::Fail` `error`
      row, in that order and with no other row.
   b. In `fn print_final_output`, apply exactly this statement-level
