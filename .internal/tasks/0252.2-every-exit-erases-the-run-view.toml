   `pub(crate) fn PanelRow::toned(label: impl Into<String>, value: impl Into<String>, tone: RowTone) -> Self`,
   and `PanelStatus::Blocked`. This file is NOT edited by this task; it is the
   sole grammar authority the rescue path reuses. Sibling `0252.1` owns any
