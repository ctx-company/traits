2. Edit `modules/cli/src/app/frame_prompt.rs` first. Rename `top_level_ready_prompt` to exact private `ready_prompt`, preserve its empty-path behavior, add only the two accepted plain named-sequence path forms, retain the source-index check and one unchanged `resolve_declared_item` call, require a prompt declaration, and update the single call in unchanged-signature `resolved_frame_prompt`.
3. Edit `modules/cli/tests/proof_agent_intent_dispatch.rs` second. Extend only `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` using its existing fixtures, harnesses, capture paths, extraction, marker, compatibility, and system-channel machinery.
4. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`. Require exit 0 with exactly one passing integration test before proceeding.
5. Run `CARGO_TARGET_DIR=target just test-full`. This existing `Justfile:152-180` gate performs frozen pnpm installation, SDK and builtin drift checks, TypeScript formatting/typechecking/tests, Rust formatting and Clippy, workspace binary builds, and all workspace tests.
6. Run `git status --short` to inspect the complete worktree file list, then inspect `git diff -- modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs`. Perform substantive review against the exact two-file allowlist, structural path gate, one declaration lookup, shared composition, current-leaf and stale-state assertions, no-guidance compatibility, sibling/control boundaries, scoped-conflict pre-dispatch failure, static source boundary, and `Agent.system` channel separation.
7. A focused failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only the two allowlisted files. After each repair, rerun the affected command and every later verification step in order. Complete only when both commands exit 0, the complete implementation diff is restricted to the two-file allowlist, and substantive review is clean; otherwise stop and report the concrete remaining dependency, test, scope, or review blocker.

## Focused proof
Within the sole test, build a schema-`0.6` fixture whose top-level `procedure.sequence` has the plain outer `kind = "sequence"` reference at local index 0 and the later top-level prompt at local index 1. Put the direct named prompt leaf at local index 0 of the outer named sequence, followed by the recursively nested plain named-sequence reference at local index 1; an incorrect `procedure.sequence[0]` lookup for that direct leaf must therefore select the top-level outer-sequence reference. Put an absent-guidance prompt leaf at local index 0 of the inner named sequence and the guidance-bearing recursively nested prompt leaf at local index 1; an incorrect `procedure.sequence[1]` lookup for that recursively nested leaf must therefore select the later top-level prompt. Give every executable prompt distinct intent and behavior markers. Unique item IDs may simplify capture addressing, but every selection assertion must be proved by structural position and marker exclusion rather than global ID uniqueness.

For the direct named leaf, recursively nested leaf, and top-level frame after sequence exit, capture no-session preview plus real CLI and real MCP dispatch. At each applicable surface extract the complete categorized intent block and behavior block and assert byte equality across preview, CLI, and MCP. Assert deterministic root-agent-current-leaf order; current-leaf same-axis replacement with leaf-local directive text; prompt scalar precedence with broader fallback on omitted axes; and absence of sibling, enclosing container, nested container, later top-level, previous-leaf, unassigned-agent, and stale markers. Assert effective blocks change as execution enters the outer sequence, moves from the direct leaf into the nested sequence, exits the inner sequence, and exits the outer sequence to the later top-level prompt.

Include a named prompt-only scoped case proving MCP categorized participation comes from the resolved leaf when no assigned-agent scoped guidance participates. Include a named prompt scoped require/avoid conflict and prove resolution fails before the existing harness marker is created. Include both absent named-leaf guidance and present-but-empty named-leaf guidance; prove each preserves the dependency-owned no-prompt-participation bytes and flags. Preserve every joined top-level, root-only collision, absent/empty, intent, behavior, and compatibility assertion.

Prove `Agent.system` text never appears in either categorized block and remains only on the existing CLI `harness_argv`/system-prompt channel and MCP `mcp_harness_argv` channel. Ready-frame output contains only effective guidance and no static `source` attributes. Do not alter the dependency-owned static attribution assertions: named declarations remain `sequence:<named-id>/<item-id-or-step-N>` with one-based fallback numbering.

## Reuse
`modules/cli/src/app/frame_prompt.rs::resolve_declared_item` remains the only structural declaration resolver. Its rightmost non-`item` owner-segment rule already serves live/historical and static-preview named paths, while its empty-path rule serves ordinary top-level steps. `ready_prompt` supplies only frame-kind/path admission, the joined source-index/error contract, and the prompt-kind requirement.

`modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` remains the common composition point for no-session preview, session preview, ordinary live CLI dispatch, refreshed dispatch, speculative sibling dispatch, and MCP dispatch. Reuse one canonical assigned-agent reference, one canonical ready-prompt reference, one joined `frame_guidance` call, all four joined participation flags, one effective `intent_items`, one effective `behavior_items`, shared `intent_block`, and shared `behavior_block`. Do not fork by preview/live or CLI/MCP transport.

Reuse joined `modules/core/src/model_view/compile.rs::frame_guidance` unchanged as the sole root-agent-ready-prompt composer and renderer. It owns canonical-ID additive replacement, behavior scalar precedence, scoped require/avoid refusal, directive lookup, sanitization, and categorized rendering. Reuse runtime `SequenceFrame.position_path`, readiness, named-sequence cursor advancement, control completion, and frame building unchanged; do not copy declaration guidance onto a sequence reference or control frame.

Reuse only the existing integration test's scratch root, custom CLI/MCP harnesses, block extraction, marker files, frozen byte oracles, and system-channel assertions. Extend its fixture and assertions in place rather than introducing another proof path.

## Exclusions
Do not edit `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `modules/cli/src/app/preview.rs`, `modules/cli/src/app/drive.rs`, runtime readiness, transitions, frame builders, `SequenceFrame`, persisted session/state or wire models, trait/schema/validation files, CDK files, generated SDK files, static declaration rendering, transport selection, harness argument construction, cache identity, or any task sibling.

Do not admit paths containing `branch`, `loop`, `for-each`, or `parallel`; these belong to `0255.10` through `0255.13`. Do not implement retry, parallel-sibling refresh, or persistent/shared-session refresh behavior owned by `0255.13` through `0255.15`. Do not alter runtime expansion, add guidance to non-prompt containers, copy leaf guidance onto a top-level sequence reference, invent container inheritance, or flatten declaration order into execution order.

Do not add a second declaration lookup, composer, renderer, participation calculation, effective string, prompt cache key, global item-ID search, prompt evidence/text heuristic, `run_index` lookup, top-level fallback for nested frames, or compatibility shim. Do not change static source grammar, ready-frame source omission, root-only MCP omission, assigned-agent selection, `Agent.system`, joined error text, categorized envelope bytes, or absent/present-empty behavior outside the newly accepted named paths.
