content = """
## Dependency gate
Before any implementation edit, require the joined landed state of `0255.8` and every transitive dependency. Grounding was read-only at clean HEAD `48080c2e`; no checks were run and no files were edited. That baseline is not implementation-ready: `SequenceItem` has neither prompt `intent` nor `behavior`, `frame_guidance` is root-only, `resolved_frame_prompt` has no ready-prompt selection, `resolve_declared_item` is still private in `modules/cli/src/app/preview.rs`, and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist. Stop before edits and report the first missing or materially different joined contract. A missing dependency is a blocker, not permission to recreate it here.

Inspect the joined implementation and confirm at minimum: canonical `SequenceItem.intent` and `SequenceItem.behavior`; prompt-only validation and static named-sequence rendering from `0255.5` and `0255.7`; fallible three-layer root-agent-ready-prompt composition in `frame_guidance`; `IntentItemSource::ReadyPrompt`; shared additive replacement and behavior rendering; canonical assigned-agent resolution; `modules/cli/src/app/frame_prompt.rs::resolve_declared_item`; private `top_level_ready_prompt`; all four joined participation fields on `ResolvedFramePrompt`; shared `intent_block` and `behavior_block`; and existing `modules/cli/tests/proof_agent_intent_dispatch.rs` containing exactly one integration test, `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. The four required fields are `assigned_agent_intent_participated`, `assigned_agent_behavior_participated`, `ready_prompt_intent_participated`, and `ready_prompt_behavior_participated`.

## Outcome
Select the canonical ready prompt reached through a plain named sequence and supply that exact declaration to the joined shared frame composer. No-session preview, session preview, ordinary live CLI dispatch, refreshed ordinary dispatch, speculative sibling dispatch, and MCP dispatch already converge on `resolved_frame_prompt`; preserve that convergence and its one effective `intent_items` and `behavior_items` strings. For an accepted named-sequence leaf, root-agent-current-leaf ordering, same-axis canonical-ID replacement, prompt-over-agent-over-root scalar precedence, scoped require/avoid refusal, participation flags, categorized block rendering, root-only MCP omission, and `Agent.system` separation must remain the dependency-owned behavior.

No core runtime, frame, wire, cache-key, transition, or static rendering change is required. With an active control frame, `runtime_readiness::current_ready_item` already reads the executable leaf from `trait_ref.sequences[frame.sequence_id].sequence[frame.next_index]`; `build_sequence_frame` already carries its local index, item ID, prompt evidence, assigned agent, and structural `SequenceFrame.position_path`. `advance_after_current_leaf` advances the active named-sequence cursor, while `complete_or_repeat_current_control` pops a completed plain sequence and resumes the parent or top-level cursor. Each drive-loop iteration therefore receives new provenance and calls the shared resolver afresh.

For a live or historical leaf reached through plain named sequences, accept only a non-empty path whose first segment has `kind = "procedure"`, whose last segment has `kind = "item"`, and whose non-empty middle consists entirely of `kind = "sequence"` segments. For no-session static preview, accept only a non-empty path consisting entirely of one or more `kind = "sequence"` segments. Each sequence segment identifies its owning named-sequence ID and the relevant local item/control index. Continue to accept the joined empty-path top-level shape. Every other non-empty path returns `Ok(None)`, including any path containing `branch`, `loop`, `for-each`, or `parallel` and every malformed mixture of procedure, sequence, or item segments.

For an accepted empty-path or plain-named-sequence `SequenceFrameKind::Step`, retain the joined source-index requirement, call unchanged `resolve_declared_item` exactly once, require the structurally resolved declaration's `effective_kind()` to equal `SequenceKind::Prompt`, and return that exact reference. Preserve joined deterministic missing-index, unresolved-position, and resolved-non-prompt `crate::Error::Command` failures. `resolve_declared_item` already handles both accepted path families by taking the rightmost non-`item` segment's sequence ID and local index; for an empty path it indexes `procedure.sequence` by `frame.sequence_index`. Do not alter that contract or globally search by optional item ID.

## Touched files
The complete implementation allowlist is exactly:

- `modules/cli/src/app/frame_prompt.rs`
- `modules/cli/tests/proof_agent_intent_dispatch.rs`

Create, remove, rename, generate, or edit no implementation file outside those paths. The task rewrite changes only `.internal/tasks/0255.9-dispatch-named-sequence-prompt-guidance.toml`; implementation must not edit this or another task file.

## Symbol contract
In `modules/cli/src/app/frame_prompt.rs`, remove dependency-owned private symbol `fn top_level_ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>` and replace it with exact private symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve the joined top-level behavior exactly and broaden only its structural path gate to the two plain named-sequence shapes above. Return `Ok(None)` for every non-`SequenceFrameKind::Step` before declaration resolution and for every non-empty path outside those shapes.

Edit the body, but not the exact signature, of `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>`. Replace its single call to `top_level_ready_prompt` with one call to `ready_prompt`; reuse that exact selected reference for both joined prompt participation calculations and the single joined call to `ctx_traits_core::model_view::frame_guidance`. Preserve its one canonical `assigned_agent` resolution, all four participation fields, identity, prompt evidence and instructions, pending-input handling, effective strings, errors, and output bytes outside the newly accepted structural paths.

Keep exact joined signature `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>` unchanged. Call it once from `ready_prompt`. Do not add another declaration resolver, selector helper, composer, participation helper, renderer, path-normalization helper, or cache field. Do not inspect prompt text or evidence, use `run_index`, index top-level `procedure.sequence` for a nested frame, scan neighboring declarations, fall back to a first prompt, or globally match `item_id`.

In `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only the body of exact existing symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Add no test symbol, test helper, support API, harness, capture framework, or production hook. Reuse its `ScratchRoot`, custom CLI and MCP harnesses, capture addressing, categorized block extraction, marker checks, frozen compatibility machinery, and CLI/MCP system-channel assertions.

No field, public symbol, core symbol, runtime symbol, or test symbol is added. The only removed symbol is private `top_level_ready_prompt` with the exact signature above; its exact replacement is private `ready_prompt`. The only other edited symbols are unchanged-signature `resolved_frame_prompt` and unchanged-signature test `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. `resolve_declared_item`, `frame_guidance`, `frame_prompt`, `mcp_frame_prompt`, `intent_block`, `behavior_block`, runtime readiness/transition/frame-builder functions, and every joined participation field are reused unchanged.
"""
