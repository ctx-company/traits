## Dependency gate
Before any implementation edit, require the complete joined landed state of ready dependency `0255.11` and every transitive dependency. Grounding was read-only at clean HEAD `3f95d0cad33ec7af603af88555261a398bd3a8bb`; `git status --porcelain=v1` was empty, no file was edited, and no validation command ran. That baseline is not implementation-ready: `SequenceItem` has no prompt-scoped `intent` or `behavior` in `modules/core/src/trait/procedure/model.rs:914-1019`; `modules/core/src/model_view/compile.rs::frame_guidance` is root-only and infallible at lines 511-544; `modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` supplies only root guidance at lines 463-489; `resolve_declared_item` remains private in `modules/cli/src/app/preview.rs:216-262`; and `modules/cli/tests/proof_agent_intent_dispatch.rs` does not exist. Stop before edits and report the first absent or materially different joined contract. Missing dependency work is a blocker, not permission to recreate, rename, repair, or partially substitute dependency-owned work in this task.

Inspect the joined implementation and require exactly this exhaustive `0255.11` contract: canonical prompt-only `SequenceItem.intent` and `SequenceItem.behavior`; prompt-only validation and static declaration rendering; fallible root-agent-ready-prompt `frame_guidance`; `IntentItemSource::ReadyPrompt`; one shared additive replacement operation; scalar prompt-over-agent-over-root precedence; scoped require/avoid refusal while retaining effective root-only collision compatibility; canonical assigned-agent lookup; `modules/cli/src/app/frame_prompt.rs::resolve_declared_item`; private `ready_prompt`; all four `ResolvedFramePrompt` participation fields `assigned_agent_intent_participated`, `assigned_agent_behavior_participated`, `ready_prompt_intent_participated`, and `ready_prompt_behavior_participated`; shared `intent_block` and `behavior_block`; deterministic missing-index, unresolved-position, and resolved-non-prompt errors; and exactly one existing integration test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Also require every top-level, plain named-sequence, branch-bearing, and loop-bearing path form delivered by `0255.9` through `0255.11`. Any absence or mismatch stops implementation.

## Outcome
Resolve every admitted `for-each`-bearing ready frame to the exact prompt declaration selected by the current structural runtime cursor. Effective guidance remains trait, assigned agent, then exact ready prompt. Additive identity remains group-or-axis plus canonical guidance ID; a more-specific occurrence replaces a broader occurrence at the specific layer position. Scalar behavior selects prompt over agent over root per axis. A scoped require/avoid contradiction is refused when assigned-agent or ready-prompt scope participates, while an effective root-only collision remains accepted. `Agent.system` remains a separate standing-instruction transport channel.

Only prompt items may declare step guidance. The `for-each` container and collection slot contribute no categorized guidance. Joined prompt-only validation already enforces that boundary. Recompute composition for each ready leaf and each element frame; do not store or freeze guidance on a control frame, `SequenceFrame`, ledger, item binding, session, wave outcome, or cache. Different element values, collection contents, `ForEachContext`, `item_index`, `run_index`, prompt evidence, runtime provenance, and optional item IDs do not change declaration guidance identity.

Sibling `0255.11` owns loop admission and deliberately excludes `for-each` and `parallel`; this task adds only `for-each` admission while retaining the joined loop forms. Sibling `0255.13` owns parallel-sibling isolation, `0255.14` owns retries, and `0255.15` owns persistent/shared-session refresh. Prove ordinary and authored-concurrent `for-each` behavior without taking any of those scopes.

Broaden only path admission inside dependency-owned private `ready_prompt` in `modules/cli/src/app/frame_prompt.rs`. Preserve every joined top-level, plain named-sequence, branch-bearing, and loop-bearing form, and additionally admit:

- Live or historical paths: a non-empty `position_path` whose first segment has `kind = "procedure"`, whose last segment has `kind = "item"`, whose non-empty middle contains only `kind = "sequence"`, `kind = "branch"`, `kind = "loop"`, or `kind = "for-each"`, and whose middle contains at least one `kind = "for-each"`.
- No-session static-preview paths: a non-empty `position_path` containing only one or more segments with `kind = "sequence"`, `kind = "branch"`, `kind = "loop"`, or `kind = "for-each"`, with at least one `kind = "for-each"`.

Return `Ok(None)` for non-`SequenceFrameKind::Step` frames and every malformed or excluded non-empty path, including every path containing `parallel`. For an admitted path, retain the joined source-index requirement and deterministic error contract, call unchanged `resolve_declared_item` exactly once, require `effective_kind() == SequenceKind::Prompt`, and return that exact declaration reference. Do not add an item-ID search, prompt-text or evidence heuristic, top-level fallback, neighboring-item scan, or second resolver.

The complete implementation allowlist is exactly `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`. Add, remove, rename, generate, or edit no implementation file outside those paths. The task rewrite touches only `.internal/tasks/0255.12-refresh-for-each-prompt-guidance.toml`; implementation must not edit it or any task sibling.

## Symbol contract
In `modules/cli/src/app/frame_prompt.rs`, edit only the body of exact dependency-owned private symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve its exact signature, every joined earlier path form, source-index/error contract, one unchanged call to `resolve_declared_item`, and prompt-kind requirement. Broaden only its structural admission predicate to the two `for-each`-bearing forms above.

In `modules/cli/tests/proof_agent_intent_dispatch.rs`, edit only the body of exact existing symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()`. Extend its schema-`0.6` fixture and assertions in place. Add no test symbol, helper API, support harness, capture framework, production hook, selector helper, or cache field.

No production or test symbol is added, removed, renamed, or given a changed signature. The only edited symbols are unchanged-signature private `ready_prompt` and unchanged-signature test `assigned_agent_intent_dispatch_is_shared_and_legacy_compatible`. Keep exact reused signatures `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>` and `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged.
"""
