## Ordered work
1. Before touching `modules/cli/src/app/frame_prompt.rs` or `modules/cli/tests/proof_agent_intent_dispatch.rs`, run the dependency preflight in `content` against the complete joined landed state of `0255.11` and all transitive dependencies. Verify in order: canonical prompt fields and prompt-only validation/static rendering; core composition, replacement, precedence, conflict, source, and rendering contracts; CLI structural resolver, composer, errors, and four participation fields; all earlier top-level/named-sequence/branch/loop forms; then the sole integration proof. Stop at the first absence or material mismatch. Do not recreate dependency-owned work.
2. Edit `modules/cli/src/app/frame_prompt.rs` first. Change only the body of exact symbol `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>`. Preserve joined admission and errors. Add only well-formed `for-each`-bearing live/historical `[procedure, (sequence|branch|loop|for-each)+, item]` paths and no-session `(sequence|branch|loop|for-each)+` paths, each with at least one `for-each`; reject malformed and `parallel` paths before the retained source-index requirement and one unchanged `resolve_declared_item` call.
3. Edit `modules/cli/tests/proof_agent_intent_dispatch.rs` second. Extend only the body of exact symbol `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` using its joined scratch root, CLI and MCP harnesses, capture addressing, categorized-block extraction, marker assertions, compatibility oracles, participation checks, and system-channel checks.
4. Run `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_agent_intent_dispatch`. Require exit 0 with exactly one passing integration test before proceeding.
5. Run `CARGO_TARGET_DIR=target just test-full`. Existing `Justfile:152-180` performs frozen pnpm installation, SDK and builtin drift checks, TypeScript formatting/typechecking/tests, Rust formatting and Clippy, workspace binary builds, and all workspace tests.
6. Run `git status --short` to inspect the complete worktree file list, then inspect `git diff -- modules/cli/src/app/frame_prompt.rs modules/cli/tests/proof_agent_intent_dispatch.rs`. Substantively review the exact implementation allowlist, retained prior paths, `for-each`-only admission, one structural declaration lookup, repeated-element stability, changed-leaf isolation, concurrent bound-state composition, no accumulation, absent/empty compatibility, static/ready source boundary, MCP participation, and `Agent.system` separation.
7. A dependency-gate failure, focused-test failure, landing-gate failure, or substantive review finding permits at most two targeted repair-and-rerun rounds. Repair only `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`, preserving that edit order when both need repair. After each repair, rerun the affected command and every later verification step in order. Complete only when both commands exit 0, the implementation diff remains inside the exact allowlist, and substantive review has no finding; otherwise stop and report the concrete dependency, test, scope, or review blocker.

## Focused proof
Within the sole test in `modules/cli/tests/proof_agent_intent_dispatch.rs`, extend the joined schema-`0.6` fixture with a bounded two-element `for-each`. Its body must contain distinguishable prompt leaves: at least one direct body prompt and one recursively nested prompt reached through a mixture of `for-each` plus earlier admitted sequence, branch, and loop structure. Arrange top-level, body, nested, previous, later, and sibling declarations so an incorrect top-level, container, previous-leaf, later-leaf, or neighboring-sequence lookup selects a marker that assertions reject. IDs may address captures but cannot be the proof of declaration selection.

Drive two real elements and capture direct leaf A and nested leaf B for each element as A0, B0, A1, and B1, plus the prompt after `for-each` exit. Assert the complete categorized intent and behavior blocks for repeated activations of one declaration are byte-identical despite different bound element values and runtime provenance: A0 equals A1 and B0 equals B1. Assert A-to-B and post-exit transitions select the new leaf, exclude stale, container, sibling, previous, later, and neighbor markers, and render every effective marker exactly once. These assertions prove per-frame recomputation, no accumulation, and element-independent guidance identity.

For each applicable leaf, compare complete categorized blocks across no-session preview, active/session preview, real CLI dispatch, and real MCP dispatch. Static/no-session projection shows each body declaration once, with no synthetic element activation. Live/session output contains only the current activation's effective guidance and omits static `source` attributes. Static declaration attribution remains `sequence:<body-id>/<item-id-or-step-N>` with one-based fallback numbering and no repeated source per element.

Exercise the existing authored-concurrent `for-each` CLI path with at least two elements and `--max-in-flight` greater than one. Require every captured cold-dispatch prompt to contain its own bound element input and exactly one copy of the current declaration's effective guidance. This covers `peek_for_each_item_frame`, `session_with_bound_state`, per-unit `resolved_frame_prompt` composition, and wave outcome-cache use without changing cache implementation. MCP coverage uses ordinary sequential `for-each` execution because the observed wave implementation does not support MCP concurrency.

Retain and exercise joined root-agent-current-leaf order; prompt-local canonical-ID replacement; prompt-over-agent-over-root scalar precedence with broader fallback; prompt-only MCP participation; and pre-harness scoped require/avoid refusal. Include `for-each`-body prompts with absent guidance and present-but-empty guidance and prove unchanged participation flags and compatibility bytes. Preserve joined top-level, named-sequence, branch, loop, malformed-path, root-only collision, and legacy assertions. Keep unique `Agent.system` text out of categorized intent/behavior blocks and present only in established CLI `harness_argv`/system-prompt and MCP `mcp_harness_argv` channels.

## Reuse
Reuse `modules/cli/src/app/frame_prompt.rs::resolve_declared_item` as the only structural declaration resolver. Its rightmost non-`item` owner rule uses that segment's named-sequence ID and local index and deliberately ignores iteration and item metadata. The same authored prompt therefore resolves across multiple elements while a transition to another body leaf resolves that leaf. Exact unchanged signature: `pub(crate) fn resolve_declared_item<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>`.

Keep exact reused signature `pub(crate) fn resolved_frame_prompt(loaded: &ctx_traits_io::run::LoadedTrait, session: &ctx_traits_core::procedure::session::Session, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, pending_inputs: &[PendingInput]) -> crate::Result<ResolvedFramePrompt>` unchanged. It remains the common composition point for no-session preview, active and historical session preview, ordinary CLI dispatch, refreshed ordinary dispatch, speculative concurrent-wave dispatch, and MCP dispatch. Reuse its canonical assigned-agent lookup, `ready_prompt` reference, one core `frame_guidance` call, all four participation fields, one effective `intent_items`/`behavior_items` pair, and shared `intent_block` and `behavior_block`. Do not fork composition by preview/live state, element, or transport.

Reuse the drive loop's existing order unchanged: load the session-pinned canonical trait, verify its source/canonical identity, call `resolved_frame_prompt`, and only then select CLI or MCP dispatch. Guidance refresh means recomposition for the current ready frame from that pinned trait, not hot-loading edited trait guidance during a session.

Reuse `modules/core/src/procedure/runtime/readiness.rs::current_ready_item` and `path_for_nested_item` unchanged. `current_ready_item` already selects `trait_ref.sequences[control_stack.last().sequence_id].sequence[control_stack.last().next_index]`, recomputes `for_each_context`, and builds a path for each ready leaf. A live path already starts with `procedure`, carries one segment per active control frame, and ends with `item`; a `for-each` segment carries body sequence ID, local body index, and `item_index`, while the trailing item repeats the local index and nearest `for-each` item index. Guidance is not encoded in the path.

Reuse `modules/core/src/procedure/runtime/control_flow.rs::complete_or_repeat_current_control` and `bind_current_for_each_item` unchanged. Completion already increments `item_index`, resets `next_index`, binds the next selected collection value through the shared accepted-slot/revision path, or pops the control and advances its parent. Every accepted leaf rebuilds readiness and the next `SequenceFrame`; no guidance result belongs on runtime state.

Reuse `modules/core/src/procedure/runtime/transitions.rs::build_sequence_frame` unchanged; it already carries structural `position_path`, current `ForEachContext`, current assigned agent, prompt evidence, and element-dependent inputs. Reuse `modules/core/src/procedure/runtime/frame_builders.rs::preview_sequence_frames` and `preview_historical_frame` unchanged. Static preview already walks a `for-each` body once in declaration order, emits executable leaves rather than the container, and uses structural paths without synthetic `item_index`; historical preview reconstructs context and the pre-activation value snapshot before using the same frame builder.

Reuse `attempt_concurrent_wave`, `peek_for_each_item_frame`, `session_with_bound_state`, the normal binder, and per-frame `resolved_frame_prompt` calls unchanged. Each speculative unit is composed against its own bound state before cold dispatch. `pending_wave_cache` stores harness outcomes rather than guidance; its activation key already includes run/control provenance, and each durable unit identity digests its `SequenceFrame` and exact bound state. No cache field, key, manifest, position digest, or base-state digest change is justified.

No symbol is added or removed. The only edited exact signatures are `fn ready_prompt<'a>(loaded: &'a ctx_traits_io::run::LoadedTrait, frame: &ctx_traits_core::procedure::runtime::SequenceFrame) -> crate::Result<Option<&'a ctx_traits_core::r#trait::procedure::SequenceItem>>` in `modules/cli/src/app/frame_prompt.rs` and `fn assigned_agent_intent_dispatch_is_shared_and_legacy_compatible()` in `modules/cli/tests/proof_agent_intent_dispatch.rs`; both signatures remain unchanged.

## Exclusions
Do not edit `modules/core/src/model_view/compile.rs`, core composition or rendering, static renderers, `modules/cli/src/app/preview.rs`, `modules/cli/src/app/drive.rs`, runtime readiness/transitions/control flow/frame builders, `SequenceFrame`, session/ledger/persisted/wire models, trait/schema/validation files, CDK files, generated SDK files, transport or harness argument construction, `pending_wave_cache`, wave manifests, activation keys, position/base-state digests, or any task sibling. Do not create, remove, rename, generate, or edit an implementation file other than `modules/cli/src/app/frame_prompt.rs` and `modules/cli/tests/proof_agent_intent_dispatch.rs`.

Do not add guidance to the collection or `for-each` container; expand a `for-each` in the selector; precompose body declarations at collection entry; cache effective guidance; accumulate guidance across elements; replay elements in static preview; duplicate static sources per element; admit `parallel`; add parallel-container guidance; implement retry policy or persistent/shared-session refresh; or alter sibling-owned behavior from `0255.13`, `0255.14`, or `0255.15`.

Do not add a declaration resolver, selector helper, composer, renderer, participation helper, path-normalization helper, compatibility shim, cache field, test helper, or second test. Do not search by item ID; inspect prompt text/evidence, bound input values, `ForEachContext`, `run_index`, collection contents, or neighboring declarations to identify guidance; fall back to a top-level or adjacent item; change static source grammar, joined deterministic errors, ready-frame source omission, categorized envelope ordering, root-only collision compatibility, assigned-agent selection, MCP transport support, or `Agent.system` transport.
"""
