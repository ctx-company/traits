schema-version = "0.2"
key = "0227"
title = "builtins moves out of core into its own module"
status = "done"
raised = "2026-08-19"
content = """
`modules/core/builtins/` holds three unrelated things that core happens to
host: the embedded trait packages, the scaffold templates, and the
vocabulary catalog. Core's build script carries all three, and core's
Cargo feature gates two of them.

Move the tree to `modules/builtin`.

Three buckets now, not two: `traits/` (five runnable meta-traits),
`templates/` (three scaffolds), and `shared/` (spec — embedded and
published like a trait so a dependent's `../spec` resolves, but carrying
no procedure and kept out of the runnable catalog). The move must
preserve that distinction rather than flattening it back.

The split that must survive the move is the feature separation, and it is
not symmetric:

- The vocabulary catalog is built unconditionally. Core's renderer resolves
  guidance through it, and wasm-core needs it.
- The trait packages and templates are behind the
  `builtin-trait-packages` feature, enabled by io and cli and deliberately
  NOT by wasm-core or wasm-plugin, because embedding them would bloat the
  wasm artifacts.

So the new module carries both, with the same gate: vocabulary always,
packages and templates only under the feature. If that separation
collapses, wasm builds grow by the size of the embedded packages, which is
the reason the gate exists.

Runs after 0218, 0219, and 0220, so only the surviving set gets moved and
the move happens once.
"""
validation = """
## Watch

- The build script computes SHA-256 digests per embedded file and guards
  against leaking absolute home paths into generated output. Both behaviors
  move with it.
- Path-shape predicates in `modules/io/src/layout/` recognize built-in
  package and template roots by directory shape; they encode the old
  location.
- There is no drift gate over this tree today: a `source/index.ts` edited
  without rebuilding its `generated/index.toml` ships silently. The move is
  a natural moment to add one, and it should be a scratch-fixture
  behavioral check, not a file inventory.

## Already landed

The drift gate this task called for exists (a4dec39f): `just
builtins-build` and `just builtins-check`, the latter wired into `test`
and `test-full`. It still uses a scratch authored root, so it compares
only the canonical and the lock — 0230 removes that and lets it cover
source maps too. What remains here is the crate move itself.

## Done when

`modules/builtin` owns the tree, core depends on it, wasm-core still builds
without the packages, every built-in and template resolves as before, and
the embedded-bytes self-consistency test still passes from the new home.

## Outcome (9b30d5ad, edd77db3)

`ctx-traits-builtin` owns the three buckets, its own `build.rs`, and the
generated tables. Core depends on it and re-exports `crate::builtins` and
`crate::builtin_trait_packages` at their old paths, so no call site moved.

The seam fell where the cycle would be: the new crate depends on nothing in
the workspace, so `builtin_templates`'s `instantiate` — which decodes and
re-encodes a `PackageManifest` — stayed in core while its data moved. The
embedded-bytes digest test moved with the data and hashes with sha2 rather
than core's `Digest`.

Feature separation verified, not assumed: `cargo tree -e features` reports
zero `trait-packages` occurrences for both wasm crates and non-zero for io
and cli. Vocabulary stays unconditional.

Also repointed: io's layout path-shape predicate, the drift gate script,
wasm-core's parity test, and comments in `cdk_build.rs`/`export.rs`.

Surfaced while running the full suite (which `just test` does not cover):
`ctx traits trust approve spec` had been impossible since 724461a5, because
trust resolution went through the `runnable` filter. Fixed in edd77db3.
"""

[relations]
depends-on = ["0218", "0219", "0220"]
