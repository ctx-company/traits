## Outcome
Every actual CLI retry and every actual MCP retry that remains at the same logical frame position must discard the failed attempt's effective categorized result, reread authoritative session state, and call `modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt` again against session-pinned trait bytes, the freshly selected same-position frame, its exact canonical assigned agent, and its exact ready prompt. The ledger pin remains authoritative through exact `modules/io/src/run.rs` declaration `pub fn load_trait_for_session(trait_file: Option<&str>, trait_id: Option<&str>, session: &ctx_traits_core::procedure::session::Session, field_prefix: &str) -> crate::Result<LoadedTrait>`. That function must keep preferring the embedded document and verifying trait ID, source digest, and canonical digest. Never hot-load edited source for a retry.

For CLI retries in `modules/cli/src/app/drive.rs`, refresh before each branch that will dispatch another attempt and currently retains at least one member of `frame`, `prompt_context`, `requested`, `schema`, `argv`, and `prompt`. This requirement covers process timeout, idle timeout, nonzero exit, output truncation, missing slot, unparseable output, persisted content rejection, stale-identity rejection, same-frame runtime redispatch, and model-fixable correction. Use exact declaration `fn refresh_frame_for_retry(input: &DriveInputs<'_>, elapsed_seconds: Option<u64>) -> crate::Result<Option<(ctx_traits_core::procedure::session::Session, Box<ctx_traits_core::procedure::runtime::SequenceFrame>)>>` for the authoritative reread. Use exact declaration `fn same_frame_position(a: &ctx_traits_core::procedure::runtime::SequenceFrame, b: &ctx_traits_core::procedure::runtime::SequenceFrame) -> bool` to compare `run_index`, `sequence_index`, `item_id`, and `position_path`. A changed position abandons the in-loop retry and returns control to the outer drive state machine. A non-retryable refreshed session also abandons the in-loop retry and returns control to the outer drive state machine. A same-position retry replaces all mutable frame-derived state and calls exact joined `resolved_frame_prompt`.

Render a complete CLI retry frame through exact `modules/cli/src/app/frame_prompt.rs` declaration `pub(crate) fn frame_prompt(context: &ResolvedFramePrompt, schema: &Value, correction: Option<&str>) -> String`. Deliver correction retries through exact `modules/cli/src/app/drive.rs` declaration `fn prepare_correction_retry(ctx: CorrectionRetryContext<'_>, correction: &str, correction_ordinal: u64) -> Result<CorrectionRetryPreparation, ctx_traits_core::response::CapabilityReport>`. Preserve the correction ladder exactly. A first resumed correction remains a compact reshape containing only correction text and the output contract. It must not resend the frame, categorized blocks, nor standing system instructions. Cold starts and complete-frame escalation render the complete refreshed frame. Preserve the role and `Agent.system` assignment copied before the retry loop when a rejection replaces the frame object at the same logical position.

For MCP retries in `modules/cli/src/app/drive.rs`, retain the initial onboarding composition and make the onboarding prompt mutable. After the authoritative state-digest check, provider classification, kill handling, retry accounting, and retry-limit decision permit another digest-unchanged attempt with no state advance, authoritatively refresh the session and frame, enforce the same logical position, call exact `modules/io/src/run.rs::load_trait_for_session`, call exact joined `modules/cli/src/app/frame_prompt.rs::resolved_frame_prompt`, and rebuild bytes through exact `modules/cli/src/app/frame_prompt.rs` declaration `pub(crate) fn mcp_frame_prompt(session: &str, session_store: Option<&str>, frame: &ctx_traits_core::procedure::runtime::SequenceFrame, context: &ResolvedFramePrompt, role: &str, harness_id: &str) -> String`. A state-digest advance remains accepted immediately. A changed frame position exits the old onboarding retry loop. Keep `modules/cli/src/app/drive.rs::mcp_harness_argv` unchanged. Categorized refresh must not trigger a second system-instruction delivery.

Provider and budget policy is invariant. CLI invalid-model, credits-exhausted, rate-limited, and generic provider classifications do not enter ordinary correction retries. MCP credits and rate-limit classifications pause before retry accounting; its remaining failure/no-state-advance policy continues to use `max_retries`. Kills are never retried. Preserve CLI `retry_count`, `correction_ordinal`, `dispatch_attempt`, `frames_attempted`, total-time, max-frame, and max-retry behavior, plus MCP attempt counting and terminal status selection.

