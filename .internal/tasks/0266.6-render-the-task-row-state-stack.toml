content = """
`0266.1` renders the task row's left half — dot, title, short description — from
the center-served board answer. This cut renders its right half: the end-aligned
mono 10.5 stack of state over meta where the row's whole semantic load sits, and
where a wrong word is indistinguishable from a right one to every gate in this
repository.

## This plan separates goals from approach

The `scope` section is GOALS: binding, observable, and — where a command in this
repository decides one — decided by that command. The `## Approach` half of
`validation` is APPROACH: expected surfaces, symbols, edit order, commands and
proof mechanics, stated as precisely as the grounding supports so the run does
not rediscover them, and never a boundary. Deviate from any of it wherever a goal
requires it and record the deviation in the work summary; a deviation is not a
violation and needs no escalation. Where proof mechanics are named, only the
observation binds — which fixture or harness shows it is the run's call.

## Grounded at HEAD b3205ceb7

The worktree was clean. Nothing this cut renders exists yet: there is no desktop
project, no desktop manifest or lockfile, no desktop command, and `cargo
metadata` resolves no gpui package. `0256.1`, `0265.3`, `0265.5`, `0265.9`,
`0258` and `0266.1` are all `ready`, not `done`. The center has no task or board
request, response or delta arm at all (`modules/io/src/center.rs:90-212,268-284`),
and stored `TaskStatus` is still the closed set `ready|done|cancelled`
(`modules/core/src/task/mod.rs:22-31,208-220`), so this very file — which stores
`status = "draft"` — is not a loadable board document until `0266.1` lands the
canonical representation.

Every desktop path, component, protocol type, served field name and command named
below is therefore a guess to be replaced by reading what the prerequisites
actually landed. Binding them here would be fabrication. The lane is nonetheless
guaranteed: an open leaf derives `Blocked` while any `depends-on` target is not
`Done` (`modules/core/src/task/graph.rs:115-177`), and this task depends on
`0266.1`, whose closure reaches `0265.5` → `0265.3` → `0265.1` → `0256.1`.
**The first act of this cell is to locate the desktop lane's documented
non-interactive command and record it verbatim in the work summary.** If none
exists, the prerequisite chain has not landed: stop and report that rather than
substituting a workspace command for rendered-behaviour proof. It is deliberately
not a `[[checks]]` entry, because a check must exist in the repository at the
moment the plan is written and this one does not.

What *is* readable today is the data side these goals lean on: `DerivedStatus`
and `derived_status` (`graph.rs:16-25,115-177`), `resolved_relations` and
`dangling_edges` (`graph.rs:188-240`), `Relations.depends_on` as an ordered
`Vec<String>` (`task/mod.rs:119-127`), `TaskSummary`/`ResolvedTask`
(`provider.rs:25-57`), `NewTask`'s empty-by-default `depends_on`
(`provider.rs:85-103`), `RunSummary`'s canonical `run_id`/`task_key`
(`run_summary.rs:23-72`), run-id generation already carrying the `run-` prefix
(`procedure/session.rs:88-92`), `CenterPublicRow`'s repository scope and
authoritative `live` (`center.rs:3805-3815`), and the CLI-private join and
grouping this cut must never copy (`dashboard.rs:1946-1972,5953-6002`;
`procedure/activity.rs:23-43`).

## Seven corrections the draft this plan replaces did not carry

**Correction 1 — four forms are not total over the board `0266.1` will serve.**
The draft binds `blocked by <id>` to `draft` alone. But the parent requires a
blocked, non-draft open task to stay in the `Ready` section carrying exactly that
detail (`0266` Correction 2; `0266.1` goal 5), and `derived_status` blocks any
open leaf with an unmet dependency (`graph.rs:115-177`). So a legal, ordinary row
— open, undrafted, unclaimed, blocked — has no form in the draft's list, and the
two candidate repairs are both defects: printing `ready` over `blocked by <id>`
puts a false word above its own contradiction, and promoting it to a fourth
section is the partition the parent forbids. The stack is therefore specified as
a total presentation over the served state rather than as four hardcoded rows.

**Correction 2 — `draft` does not imply a blocker.** `depends_on` defaults empty
(`provider.rs:85-103`) and `0266.3`'s created draft is not required to declare
one (`0266.3`), so `draft` / `blocked by <id>` is literally unrenderable for the
first draft this screen's own `new task` action creates. The export's alternative
bottom line for that row, `2 open questions` (`reference/tasks.html:695-706`), is
authorized by no served field and no line of `screens/tasks.md`. A draft with no
unmet dependency renders its state word and no meta line at all — the same
omission-over-invention rule the reusable bar and row cuts already established
(`0265.3:47-55,153-171`; `0265.5:316-330`).

**Correction 3 — a blocker is neither singular nor always resolvable.**
`screens/tasks.md:23` writes a singular `<id>`; the data underneath is a set. A
task may declare several unmet dependencies, and a dependency naming a key that
does not exist still blocks — `derived_status` treats a missing key defensively
(`graph.rs:115-176`) while `resolved_relations` **silently omits** that edge and
only `dangling_edges` reports it (`graph.rs:188-240`). A blocker line built from
resolved relations alone therefore renders nothing for precisely the task whose
dependency is broken. Zero, one, several and dangling each need a stated
served-and-displayed outcome, and the served set reaches the line whole rather
than as an arbitrary representative of itself.

**Correction 4 — claim precedence does not choose a run.** `live · run-<id>`
needs one id, and nothing at HEAD produces one: `task_session_join` maps a key to
a `Vec` of run indices (`dashboard.rs:5983-6002`) and `task_group` only asks
whether *any* joined row falls in a precedence class (`dashboard.rs:5953-5980`).
Picking the first joined run in this renderer would name a different run than the
preview does, and `0266.4` binds the opposite: its `claimed` row is the same run
the row's stack names, chosen once and centrally (`0266.4` content; goal 5). This
cut consumes the claim `0266.1` selected, or renders the typed ambiguous/absent
outcome honestly. It never selects, never fabricates, and never re-prefixes an
id that already carries `run-`.

**Correction 5 — the export's extra lines are measurement artifacts, not
content.** `reference/tasks.html` is geometry authority and content illustration
only. Its live row carries a second line `implement · 42m`
(`tasks.html:345-356`) which the parent excludes outright (`0266:154-156`) and
which no served fact supports — an elapsed duration would additionally require a
clock this process must not read. Its waiting row carries `claimed · run-77cd10`
*above* `awaiting owner` (`tasks.html:398-409`), while `screens/tasks.md:21-23`
names one line for that form. Both forms resolve toward the screen.

**Correction 6 — "plain" and "dim" are not roles.** The draft names tones the
token file does not define. The export measures the neutral top word at
`text-secondary` and every bottom meta line at `text-muted`
(`tasks.html:341-356,395-409,463-478,638-653`; `tokens.md:15-48`). Role
selection belongs to the one shared state presentation `0265.3` established and
`0265.5` extended to rows (`0265.3:65-74`; `0265.5:221-281,477-505`) — never a
hex literal, never a caller-chosen tone, and never a second Tasks-private colour
table.

**Correction 7 — "fail loud" must respect the landed transaction.** `0266.1`
requires candidate-level transactionality: stage a complete candidate, commit
only on success, request a fresh snapshot after rejection, and show last-accepted
state only behind an explicit stale marker (`0266.1:364-386`). A per-row
"unresolved" label is therefore not automatically renderable — with typed wire
enums an unknown variant rejects the whole answer before any row exists. What
binds is the prohibition, not the label: no fallback to `ready`, no fabricated
run id, no blocker line invented from an incoherent fact, and no path by which
the dot and the words commit separately.
