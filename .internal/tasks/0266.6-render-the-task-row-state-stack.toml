scope = """
## Done when — binding goals, and what decides each

1. **The stack renders as one total presentation over the served state, with no
   false word and no missing form.** Every task row `0266.1` renders carries an
   end-aligned mono 10.5 stack whose top line is the state word the board answer
   actually serves and whose bottom line is that state's qualifying detail. The
   presentation is exhaustive over the served state at the type level rather than
   by a catch-all arm, so a state the answer can carry has a form here or the
   code does not compile: claimed-and-live renders `live · run-<id>`;
   claimed-and-awaiting-owner renders `awaiting owner`; an unclaimed open task
   whose dependencies are met renders `ready` over `deps met`, including a task
   that declares none, which is vacuously met and takes the same form; an
   unclaimed open task with an unmet dependency renders the state word the answer
   serves for it over `blocked by <id>` and never the word `ready`, while
   remaining in the `Ready` section per `0266.1` goal 5 (content Correction 1);
   an unclaimed draft renders `draft` over `blocked by <id>` when it has an unmet
   dependency and `draft` with no meta line at all when it does not (content
   Correction 2). No form invents a word the answer does not carry, and no state
   word is re-derived here from stored status, derived status or section
   membership.
   Decided by rendered evidence in the desktop lane over a scratch board
   spanning those outcomes; by `just test` for the shared presentation the
   forms resolve through; and by the closing review for the exhaustiveness
   being structural rather than a default arm.
   Excluded: a fourth section or any resectioning; a form keyed off section
   membership; the word `in review`, which is representable nowhere (`0266`
   Correction 12); a state word rendered for a task whose served state is one
   this renderer has not seen before.

2. **A second line exists only where the screen names one.** The live form and
   the awaiting-owner form are single-line stacks. Neither carries the export's
   `implement · 42m` nor its `claimed · run-<id>`, and no elapsed time, trait id,
   frame count, question count or age is rendered anywhere in this stack (content
   Correction 5). Where a form has no meta, the stack renders one line — not an
   empty text node, not a dangling `·`, and not a blank reserved row.
   Decided by rendered evidence for the live and awaiting-owner rows carrying
   exactly one line each and for a no-meta draft carrying one line with no
   residue, and by the closing review against `screens/tasks.md:20-23` and
   `reference/tasks.html:293-709` for any second line the screen does not name.
   Excluded: any duration, which would require a clock read this process must
   not perform; any `placeholders` call site in this stack; any leaf closing as
   an unrendered gap.

3. **The blocker line is honest for zero, one, several and dangling
   dependencies.** The blocker detail is a served fact carrying every unmet
   dependency key for the row — including a key that names no document, which
   `resolved_relations` omits and only `dangling_edges` reports
   (`graph.rs:188-240`) — in a deterministic order derived from the document's
   declared `depends_on` order. The one accepted presentation is that the meta
   line names every unmet key the answer carries for that row, in that declared
   order: one blocker renders `blocked by <id>`, and several render the same
   `blocked by` line continuing with every remaining key in declared order, so
   the rendered line always contains the whole served set and never a subset,
   count, ellipsis or `and N more` summary (content Correction 3). A dangling key
   renders as the key the document declares. An incoherent fact — a blocked state
   with an empty blocker set — renders no blocker line rather than a fabricated
   one, and takes goal 6's failure route.
   Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test
   proof_center` for the blocker set arriving over the socket for a task with
   one unmet dependency, several, and a dangling one; by `just test` for the
   shared derivation; and by rendered evidence for the one-blocker line, for the
   several-blocker line containing every served key in declared order, and for
   the dangling-blocker line.
   Excluded: any client-side board, relation or blocker derivation; reading
   `task_files`, `task_board_cache`, `.internal/tasks`, cwd or `git` from the
   desktop process; a blocker line built from resolved relations alone, which
   goes silent exactly when a dependency is broken; dropping, truncating or
   summarizing keys anywhere — in the answer or in the line; sorting that
   discards the declared order.

4. **The named run is the claim the center chose, or a typed absence.** `live ·
   run-<id>` renders the id of the run `0266.1`'s answer named for that row, so
   this stack and `0266.4`'s `claimed` row can only ever name the same run
   (content Correction 4). The id is rendered exactly as served — run ids already
   carry the `run-` prefix (`procedure/session.rs:88-92`), so no prefix is added.
   When the served claim is a typed ambiguous or absent outcome, the row renders
   that outcome honestly and falls to its board-state form rather than naming a
   run.
   Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test
   proof_center` over scratch repositories with no claim, one claim, several runs
   carrying the same key, and a same-key run in another repository; by rendered
   evidence for the live row naming the served id with no doubled prefix; and by
   the closing review for any renderer-side run selection.
   Excluded: choosing a run from a joined set here; any second join, precedence
   or awaiting-owner mapping in the desktop, which `0266.1` centralized
   (`dashboard.rs:1946-1972,5953-6002`; `procedure/activity.rs:23-43`);
   importing any CLI-private or ratatui type; a run id assembled, truncated or
   re-prefixed at the call site.

5. **Colour is a role selected by the state, and the dot cannot contradict the
   words.** The top word takes `accent` only when it denotes activity happening
   now, `warn` only when it denotes owner-needed state, and the neutral
   secondary role otherwise; the meta line takes the muted meta role
   (`grammar.md:6-29`; `tokens.md:15-48`, measured at
   `reference/tasks.html:341-356,395-409,463-478,638-653`). Every role resolves
   through the one shared state presentation `0265.3`/`0265.5` landed and that
   `0266.1` already uses for the row's 5px dot (`0266.1:402-428`), so the dot
   role, the state word and the meta line are projected from a single served
   state value rather than from independent inputs — a caller cannot render a
   `warn` dot beside a `ready` word because there is no input with which to do
   it (content Correction 6).
   Decided by rendered evidence for the accent live row, the warn awaiting-owner
   row and its warn dot, and the neutral ready/blocked/draft rows; by `just
   test` for the shared presentation; and by the closing review for the
   structural half — one state input feeding dot and stack, no colour, size,
   spacing or family literal at a call site.
   Excluded: a Tasks-private colour table or a second state-word mapping; a
   caller-supplied dot tone or text tone; a second dot anywhere in the row, the
   dot itself being `0266.1`'s; accent used to draw the eye rather than to mean
   now; any light-column token value; a pill, badge, chip, icon, checkmark,
   border, fill or corner radius; any glyph outside `↰ ↳ → · ∷ –`, this stack
   needing only `·`.

6. **Failure and staleness go through the landed transaction, never through an
   invented per-row default.** A malformed, unknown or incoherent state fact
   never falls back to `ready`, never fabricates a run id or blocker key, and
   never lets the dot and the words commit separately; the answer is rejected as
   a candidate under `0266.1`'s landed transactionality with the previous
   complete model retained only behind its explicit stale marker and a fresh
   snapshot requested (`0266.1:364-386`), or — if `0266.1` landed a typed
   row-level failure — that landed idiom is used rather than a second one
   invented here (content Correction 7).
   Decided by rendered evidence for a rejected candidate leaving the prior
   complete model visible behind the stale marker rather than showing a
   defaulted row, and for center loss stating failure rather than presenting
   rows as current; and by the closing review for any `unwrap_or`, default arm
   or partial commit on this path.
   Excluded: presenting last-accepted state as current; a per-row silent skip; a
   fallback to a direct board read or to `task_board_cache`; a default state,
   default tone or default id anywhere in this stack.

7. **Form changes arrive as accepted center events, with no timer and no client
   request.** A row whose task becomes claimed and live switches to the live
   form; a live claim that begins awaiting the owner switches to the warn form; a
   claim that disappears or terminates returns the row to its current board-state
   form; a dependency landing or breaking changes the blocker line. Each
   transition updates the dot and both lines together from an accepted board or
   run event, with no optimistic local change, no refetch on an accepted event,
   no interval, tick or spawned timer, and no filesystem watcher (content
   Correction 7; `0266.1:364-386`).
   Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test
   proof_center` for a claim appearing, changing state and disappearing reaching
   a subscriber as events without the client asking; by rendered evidence for
   each transition changing dot and stack together; and by the closing review
   for any timer, interval, tick or watcher on the client side.
   Excluded: any client poll loop; a per-screen or per-row refresh; a
   filesystem-watcher dependency in `ctx-traits-io`; a second reducer,
   subscription or board request added by this cut.

8. **No new capability is created, and the workspace is unmoved.** Every leaf
   here is served by the one board capability `0266.1` landed, which that task
   was explicitly required to shape for this stack (`0266.1:465-478`). If a fact
   this cut needs is absent from the served answer, it is added at the one place
   `0266.1` put the board resolution, join and state derivation — centrally,
   shared, off the model owner's request path, and proven over the socket — never
   as a second capability, a GUI-only protocol or a client-side derivation; and
   if it cannot be added without redesigning that answer, the prerequisite is
   unmet and this task stops and reports it. Root Cargo resolution and the root
   `Cargo.lock` stay gpui-free, the desktop project stays outside the workspace,
   and `just test`, `just test-full` and the existing CI lanes gain no gpui cost.
   Decided by the declared metadata and lockfile check, by `just test`, by
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`
   for any wire fact this cut caused to be served, and by the closing review for
   a second protocol, a second projection or a desktop-side read.
   Excluded: adding the desktop project to root workspace members; a check
   forbidding the string `gpui` in `Justfile` or `.github/workflows/`, since a
   separate desktop lane there is sanctioned and such a check would red on the
   sanctioned outcome; a new dependency in `ctx-traits-io`; widening the compact
