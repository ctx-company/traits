validation = """
## Approach — suggested route, not a boundary

No desktop project, gpui source, desktop lockfile or desktop command exists at
this HEAD, and the center has no task arm at all
(`modules/io/src/center.rs:90-212,268-284`), so no desktop path, module,
component, served field name or protocol type is named below: discover each from
what `0266.1` and its closure actually landed, and say in the work summary where
the landed shape differed. If a dependency reports complete but the desktop
project, the row composition, the served state/claim/blocker facts or the desktop
lane is absent, that is an unmet prerequisite to report — not permission to build
a parallel implementation of it here.

**Reuse points, named by what lands them.** `0266.1`'s board answer is the sole
source of the state word, the section membership, the repository-scoped run join,
the centrally chosen claim, the awaiting-owner mapping, the blocker detail, the
board freshness event and the accepted-model transaction — consume all of it,
derive none of it. `0266.1`'s own row composition owns the 5px dot and the left
half, so this stack is added to that landed row rather than to a new one, and the
dot's state input is the one this stack projects from. `0265.3`'s exhaustive
state-word-to-semantic-role presentation, extended by `0265.5` to row dot roles,
title tones and right-side forms with list-owned selection and no call-site colour
literals (`0265.3:65-74`; `0265.5:221-281,477-505`), is the vocabulary to extend
— minimally, at the landed composition, without redesigning the row or the
selection model. `0265.1`'s token entry point carries mono 10.5, gap 2, the
end alignment and every tone as roles rather than literals. On the shared side,
`graph::dangling_edges` (`graph.rs:225-240`) is why a blocker set must be built
from the document's declared `depends_on` rather than from `resolved_relations`
(`graph.rs:188-221`), and `RunSummary.run_id` (`run_summary.rs:23-72`) is the id
to render verbatim.

**Edit order.**

1. **Read what landed before writing anything.** Locate and record the desktop
   lane's documented non-interactive command verbatim, and run it as a baseline.
   Then read `0266.1`'s served answer and desktop model: the exact state fact,
   the chosen-claim fact and its ambiguous/absent outcomes, the blocker detail if
   any, the row composition and its dot call site, the shared state presentation,
   and the accepted-model transaction and its stale marker. Every step below
   depends on that reading.
2. **Close the served gaps, if any, where `0266.1` put them** — most likely the
   unmet-blocker set in the compact row projection, built from declared
   `depends_on` so a dangling key survives, ordered deterministically, with the
   center-side coverage extended in `modules/cli/tests/proof_center.rs` beside
   the board assertions `0266.1` added. Add no field the stack does not render.
3. **Extend the landed row presentation** so one served state value projects the
   dot role, the state word with its role, and the meta line with its role,
   exhaustively over the served state and with the no-meta case expressed as an
   absent line rather than an empty string.
4. **Compose the stack into the landed row's right slot** — flex column,
   `align-items: flex-end`, gap 2, fit-content, mono 10.5, opposite the left half
   under the row's existing `space-between` (`reference/tasks.html:341-356`) —
   writing the ambiguous-claim, no-blocker, several-blocker, dangling-blocker,
   stale and failure renderings alongside the resolved ones rather than after
   them.
5. **Prove the transitions** — board-only to claimed live, live to awaiting
   owner, claim disappearing, blocker changing — over accepted events in the
   desktop lane, then run the declared checks.

**What must be proven** (observations, not mechanics), over scratch boards,
repositories, ledgers and arbitrary ids only: a live-claimed row rendering the
served run id in accent on one line; an awaiting-owner row rendering one warn
line with a warn dot; an unclaimed dependency-met row rendering `ready` over
`deps met`, including one that declares no dependencies; an unclaimed blocked
non-draft row staying in `Ready` while rendering its served state word over
`blocked by <id>` and never `ready`; a draft with an unmet dependency and a draft
with none, the latter rendering one line with no residue; a task with several
unmet dependencies, whose line carries every one of them in declared order, and
one whose dependency names no document; a task joined by
several runs arriving as the typed outcome `0266.1` serves; a rejected candidate
leaving the previous model behind the stale marker; center loss; and each of the
four transitions arriving as an accepted event with no client request. No test
may assert against or write this repository's committed `.internal/tasks`.

**Desktop lane.** No repo-root command inspects a rendered gpui screen at this
HEAD, so none is declared. Run the discovered command as baseline and as final
rendered proof, and extend that same harness rather than standing up a parallel
lane or substituting `just test` for rendered behaviour. If it is repo-root
relative, non-interactive and carries its whole verdict in its exit code, adding
it to `[[checks]]` verbatim is right; guessing its name now is not.

## Watch

- **`screens/tasks.md` and `grammar.md` are the specification; the export is
  measurement.** Take `align-items: flex-end`, gap 2, fit-content and mono 10.5
  from `reference/tasks.html:341-356,395-409,463-478,638-653`; take content from
  `screens/tasks.md:20-23` with this plan's corrections applied.
- **The export's extra lines are the trap.** `implement · 42m`, `claimed ·
  run-77cd10` and `2 open questions` are illustrations the parent excludes
  (`0266:154-156`), and a line rendering one of them for a task that does not
  carry it is worse than an omitted line, because it reads as evidence.
- **Four forms are not total.** A blocked, undrafted, unclaimed open task is
  ordinary and has no form in the artifact's list; printing `ready` above
  `blocked by <id>` is the failure this plan exists to prevent.
- **A draft need not be blocked** — `depends_on` defaults empty
  (`provider.rs:85-103`) — and the first draft this screen's own action creates
  is exactly that case. Omit the line; never invent meta.
- **A blocker set is not a blocker.** `resolved_relations` silently omits a
  dangling edge (`graph.rs:188-240`), so a line built from it goes quiet for the
  broken dependency it most needs to name; and naming one of several hides data
  the row implied it was showing, which is why the line carries the whole set.
- **No run is chosen here.** `task_session_join` returns a vector and
  `task_group` decides a precedence class, not a run
  (`dashboard.rs:5953-6002`). A renderer that picks one lets this row and its own
  preview name different runs (`0266.4` goal 5).
- **Run ids already carry `run-`** (`procedure/session.rs:88-92`). Render the
  served id; a second prefix is a fabricated identifier.
- **Colour is semantic, never decorative** (`grammar.md:6-22`): accent because it
  is happening now, warn because it needs the owner. The dot and the words come
  from one state input, so they cannot disagree by construction.
- **States are words** (`grammar.md:24-29`): never a pill, badge, chip, icon or
  checkmark; compound segments join with `·`; no corner radius inside the canvas;
  no glyph outside `↰ ↳ → · ∷ –`.
- **Mono is machinery** (`grammar.md:49-56`): this whole stack is mono 10.5 at
  the token step, resolved through `0265.1`'s entry point rather than as literals.
  Dark tokens only; the light column stays unimplemented (`tokens.md:1-4`).
- **No timer, no watcher, no optimistic update.** Freshness rides `0266.1`'s
  accepted events; a per-screen tick is exactly where a poll loop gets smuggled
  in, and the TUI's existing two-second board tick is the thing not to reproduce.
- **Fail loud, no silent staleness, no per-row default.** No fallback to `ready`,
  no fabricated id or key, no partial commit that leaves the dot ahead of the
  words, and no last-accepted row presented as current.
- **The desktop reads nothing.** No `task_files`, no `task_board_cache`, no
  `.internal/tasks` walk, no cwd inference, no `git`, no clock — every fact
