Exclusions, restated so they are checkable by reading the diff: the sections, the
row's dot, left stack and selection model (`0266.1`); the header and provenance
bar (`0266.2`); draft creation and the `new task` action (`0266.3`, `0266.8`);
the preview column (`0266.4`, `0266.5`); the TUI migration (`0266.7`); every
