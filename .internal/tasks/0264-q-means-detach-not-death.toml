title = "q means detach, not death"
status = "ready"
raised = "2026-08-28"
content = """
Quitting the live view with `q` prints "live view closed; run continues —
reattach with ctx traits dashboard" (modules/cli/src/app/run_view.rs:1428)
and the run then dies. Proven live on 2026-08-28 with architect session
c73eeda4d699 (an 0262 planning run parked on its plannotator approval
gate): the owner pressed `q`, saw the message, and the session's last
activity and ledger writes land at 13:32:50-57 — the q moment — with
nothing after. Kernel evidence: no process held the session's driver-lock
flock across four checks over the following six minutes (the same
`run_control::probe` authority the product trusts), and no process on the
machine referenced the session id. The ~30s driver-lock mtime bumps
observed afterward are the center's periodic probe sweep touching every
lock on disk, dead sessions included — they are not liveness and misled
the first diagnosis.

The message promises detached continuation; the implementation delivers
death. Either outcome may be a defensible product choice — silently
delivering the opposite of the printed promise is not.

## Owner contract

`q` closes the VIEW only. The drive survives it: frames keep executing,
the ledger keeps advancing, gates and waits (including an architect run
parked on its plan-approval gate) keep running, and the session is
reattachable from the dashboard. The printed message becomes true.

## How to read this plan

Goals and approach are separated, and only goals bind. `validation`'s
Done-when list, together with the binding constraints and exclusions at
the top of `scope` and the two-round stop condition, is the contract:
each Done-when states an observable outcome and the existing command
that decides it.

Everything else in this task is a suggested route, wherever it appears —
in the corrections below, under "Suggested approach", in "Order and
bounded refinement", or in "Watch". That covers the expected files, the
symbol names and signatures, the fixture shape, the blocking-step
mechanism, the synchronization point, poll intervals and deadlines, the
read/edit/check sequence, the order the commands are run in, and every
other proof mechanic. All of it is the architect's best route from the
grounding, not a boundary. Deviate from any of it whenever a goal
requires it and report the deviation in the work summary; that is not a
violation and not an owner escalation.

## Grounded against HEAD 70662f259

### Correction 1 — no q-to-death edge exists in the current source

The draft assumes the mechanism is findable by reading. It is not. The
whole confirmed-`q` path is:

- `live_view_key_action` maps `q` (bare or modified) to `ConfirmQuit`
  (`run_view.rs:1380-1393`); `poll_and_apply_keys` opens the confirm
  modal (`:1519-1527`).
- `ModalOutcome::Confirmed` clears the modal, calls `close_pane_locked`,
  and prints the continuation notice for a non-observer
  (`apply_open_modal_key`, `:1419-1432`).
- `close_pane_locked` (`:1109-1119`) commits inline scrollback (a no-op
  for an alternate-screen pane, which every production run pane is since
  0252.7), calls `RatatuiPane::quit`, flushes decode diagnostics, and
  marks the cadence inactive.
- `RatatuiPane::quit` marks the pane detached and calls `leave`
  (`tui_ratatui.rs:1002-1009`); `leave` stops the input pump, restores
  terminal modes, clears the active pane generation and drops the
  terminal handle (`:1179-1195`).

That path sets no interrupt flag, signals no child, drops no driver lock
and never exits the process: `interrupt::request_kill`, `request_stop`,
`request_pause`, `process::exit` and `_exit` are all absent from it.
Later `draw` calls return immediately once detached
(`tui_ratatui.rs:904-910`) and `tick_locked` disables its timer
(`run_view.rs:1273-1279`), so subsequent `RunPanel::close` calls are
idempotent.

So static reading and the recorded incident contradict each other. That
contradiction is the plan's starting fact, not a detail: the run
establishes a failing end-to-end reproduction FIRST and repairs the seam
that reproduction exposes. Inventing a production change from an
unobserved mechanism is forbidden by goal 1.

### Correction 2 — a released flock is the proof that the process died

`drive::drive` acquires `ctx_traits_io::run_control::DriverLockGuard`
before `drive_loop` and keeps it as a local across the whole loop and the
terminal outcome write (`drive.rs:1053-1097`, `:1160-1227`), dropping it
only after `record_drive_outcome`, `notifier.ended` and final state
derivation (`:1542-1578`). `DriverLockGuard::Drop` stops the control
listener, removes the liveness-index row, clears metadata and only then
releases the flock (`run_control.rs:113-182`).

Therefore a post-q `DriverProbe::Unheld` on a run that has not genuinely
ended proves the driving PROCESS unwound or exited. Pane detachment alone
cannot release that lock. `run_control::probe` opens the sibling
`.driver-lock` inode and tries a non-blocking exclusive flock: contention
is `Held` regardless of metadata, acquisition is `Unheld` and any
metadata is stale (`:514-562`). This is the one authority the proof may
use. Lock-file existence, metadata PID, mtimes, liveness-index rows and
the printed notice are display evidence, not liveness.

### Correction 3 — a blocked command already survives view teardown structurally

The architect owner gate is an ordinary command step wrapping
`plannotator annotate ... --gate --json --require-approval`
(`.ctx/traits/authored/architect/generated/default/index.toml:497-518`).
Command frames already accept view input while blocked: `drive_loop`
paints the step, then calls `advance_commands` passing
`RunPanel::tick_observer` (`drive.rs:2344-2360`), and `command::run_raw`
polls the child every 10ms, invoking that observer each pass
(`command.rs:533-565`). Command children get null stdin, piped
stdout/stderr and their own session/process group via the setsid shim
(`:367-465`); only timeout or an explicit kill signals that group.

Bounds matter for the proof's fixture: a command step that declares
neither `timeout-ms` nor `idle-timeout-ms`, in a repo with no
`command-seconds`/`command-idle-seconds` policy, inherits `run_raw`'s
defaults — 600s idle, 4h wall (`command.rs:29-35`,
`run.rs:4430-4468`). A silent gate held for a few seconds is therefore
safe with no bound tuning at all.

### Correction 4 — no dashboard change is indicated by reading

Center rows carry `row.live`; `sessions_from_center_rows` feeds it to
`classify_session`, which delegates to `SessionState::derive`, where a
held lock overrides every persisted status and yields `Running`
(`dashboard.rs:2233-2303`, `:1789-1811`,
`core/procedure/activity.rs:23-48`). `session_driver_live` uses the same
`run_control::probe` and is true only for `Held` (`dashboard.rs:3419-3431`).
`attach_selected` records the row's ledger path and
`run_attached_observer` rebuilds a `RunPanel::new_observer` from it
(`:4526-4545`, `:2880-2945`).

So if `q` leaves the driver and its flock alive, today's rows already
classify the session live and today's observer path already reattaches.
A dashboard edit is justified only if the end-to-end proof exposes a
separate defect there. A second liveness classifier is forbidden.

### Correction 5 — the center's detached-start machinery is not the route

`center::start_trait`/`start_session` and `process::spawn_detached` start
a NEW `ctx` process with null stdin and redirected logs. They cannot
transfer an already-running drive, its in-memory harness state, or an
in-flight command child from this process. The owner contract says `q`
closes the view; it does not ask for the invoking shell back while a
replacement daemon adopts the run.

### Correction 6 — the existing PTY helper cannot observe the post-q window

`run_pty_keys_after_markers` returns only after the child exits
(`support/src/lib.rs:1174-1196` via `child_lifetime_wait`), so a test
calling it directly cannot probe the flock while the run is still
blocked — which is exactly the window this task's evidence lives in. Two
existing constants bound whatever route is chosen: one 30s readiness
deadline covers ALL marker waits from spawn (`pty_prelude`, `:1009-1021`),
and `CHILD_EXIT_GRACE_SECS` gives 60s from the last key to child exit
(`:1005`, `:1037-1057`). The mid-flight assertions must fit inside that
60s.
