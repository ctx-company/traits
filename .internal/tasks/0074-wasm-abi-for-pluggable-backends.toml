schema-version = "0.1"
key = "0074"
title = "A WASM ABI for pluggable backends: task providers and handoff channels"
status = "ready"
raised = "2026-08-03"
content = """


Both pluggable interfaces — the task provider's `resolve · get · list · create · update · sync` and
the handoff channel's `resolve · capabilities · deliver` — are JSON in, JSON out, over a small fixed
verb set. That is one ABI serving two guest interfaces, and it is the same shape `wasm-core` already
exports. This task is about whether to build the host side of it.

## What exists, and why it is not this

`modules/wasm-core/src/abi.rs` exports pure functions to a JavaScript host — `compose_json(&str) ->
String` and its neighbours. That is the OUTWARD direction: our logic, someone else's runtime. A
backend plugin is the inward direction: the binary hosts a wasm runtime and calls into a guest
module it did not write. Different dependency, different threat model, essentially none of the
existing code reusable beyond the JSON-string calling convention.

## Decisions

- **This is not scheduled until `command` (0073) proves insufficient**, and "insufficient" means one
  of exactly two things, both of which are real but neither of which is urgent:
  - **Portability.** A script is a path on one machine. A wasm module is one artifact that runs
    wherever the binary runs, which is what a *distributed* backend needs.
  - **Trust.** A command channel runs arbitrary code with the user's full privileges (0073 says so
    out loud). A wasm guest has no ambient authority at all, so a third-party backend becomes
    something you can run without auditing every line of it first.
- **If it is built, it is one loader and two guest interfaces**, not two plugin systems. The verb
  dispatch, the JSON envelope, the module loading, the capability grant and the error mapping are
  shared; only the verb set and the payload schemas differ. Building the channel side alone and
  "generalising later" produces two half-systems.
- **The capability grant IS the design work.** A wasm guest has no network, no clock, no filesystem
  and no environment unless the host hands it one. A task provider needs HTTP and a token; a channel
  needs HTTP and a token. So the host must expose explicit, narrow host functions — an HTTP call
  against a config-declared allowlist, a secret fetched by config-declared name (never enumerable),
  a clock, a log sink — and nothing else. That constraint is not the cost of this approach; it is the
  entire reason to prefer it over a subprocess.
- **Distribution reuses the trait machinery, or it is not worth doing.** A backend plugin pinned by
  digest, declared in a manifest, locked and verified before it loads is the same claim the trait
  system already makes about traits. A plugin format with no lockfile and no provenance would
  undercut the thesis the rest of the product rests on.
- **Guest failures are ordinary failures.** A trap, a timeout or a malformed response is a recorded
  backend error with the module's digest in the message — never a host panic, and for a channel,
  never a failed run.

## Watch

- Hosting a wasm runtime is a real dependency with a real binary-size and build-time cost, on a
  binary that is currently self-contained. Price it before choosing it, and price it against 0073
  already working.
- The two interfaces have different failure contracts — a refused task write is an error the caller
  must handle, a failed delivery is recorded and ignored — and a shared ABI must not flatten them
  into one generic "plugin error" that loses the distinction.
- If this is deferred indefinitely, that is a legitimate outcome: `command` covers user-authored
  backends today, and first-party Rust covers the ones needing real SDK behaviour. The gap is
  specifically third-party distribution, which does not exist yet.
- Do not let the ABI's existence pull backend *policy* into guests. Routing, ordering, debouncing,
  dedupe and the delivery log stay host-side; a guest implements verbs and nothing more.

## Done when

Not scheduled. When taken up: one loader serving both verb sets, capability-granted guests with no
ambient authority, digest-pinned and lockfile-verified modules, guest failures mapped to the
existing per-interface failure contracts, and a third-party backend installable without the user
reading its source.
"""

[relations]
depends-on = [
