schema-version = "0.2"
key = "0255.1"
title = "Author and inspect agent intent"
status = "ready"
raised = "2026-08-24"
content = """
## Outcome
Let authors attach `require`, `focus`, `avoid`, and `block` intent to direct agents, all five built-in agent templates, `seats(...)` results, and agents reached transitively through the functional `.prompt(...)` API. Lower authored scalar, built-in, custom, and rich guidance through the existing CDK normalizer into canonical `Agent.intent`, infer schema-version `0.6` only when an otherwise unversioned merged agent declaration contains intent, validate the new field in Rust, and show every declared agent's intent in static model-view inspection with `source="agent:<id>"`. Agent intent is authoring data in this task: it is not assigned-agent selection and is not live frame composition.

Schema `0.6` is additive. A version-only `0.5 -> 0.6` migration must preserve root intent behavior, including the intentionally accepted case where the same canonical ID occurs in root `intent.require` and root `intent.avoid`. Agent-scoped validation adds only a require/avoid intersection check after reusing ordinary group validation. Absent agent intent remains omitted from canonical JSON and digest input; intent-free ordinary and native CDK output remains on the `0.5` baseline and byte-identical to existing fixtures.

## Touched files
The complete allowed implementation set is `modules/core/src/trait/intent.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/encoding.rs`, `modules/core/src/trait/mod.rs`, `modules/core/src/migrate.rs`, `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/src/variant.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`. No other file is part of the change.

## Symbol contract
In `modules/core/src/trait/intent.rs`, keep `pub fn validate_taxonomy(&self) -> crate::Result<()>` root-compatible by making it call a new private `fn validate_groups(&self, field_prefix: &str) -> crate::Result<()>`; add `pub(crate) fn validate_scoped(&self, field_prefix: &str) -> crate::Result<()>`, which first calls `validate_groups` and then rejects only canonical-ID intersections between `require` and `avoid`. Use the conflicting item's indexed `.id` path. Do not compare prose and do not include `focus` or `block` in the intersection rule.

In `modules/core/src/trait/agent.rs`, extend `pub struct Agent` with `#[serde(default, skip_serializing_if = "Option::is_none")] pub intent: Option<Intent>`. Keep the exact signature `pub fn instantiate_agent_template(template: &AgentTemplate, id: impl Into<String>, description: Option<String>, summary: Option<String>) -> Agent` and initialize `intent: None`. Change `pub fn validate_agents(agents: &[Agent]) -> crate::Result<()>` to `pub fn validate_agents(agents: &[Agent], schema_version: &str) -> crate::Result<()>`; retain all existing ID/description/summary/system checks, reject present `agent[i].intent` unless `schema_version_at_least(schema_version, "0.6")`, then call `Intent::validate_scoped` with `agent[i].intent`. Keep the existing test helper `fn agent(system: Option<&str>) -> Agent` and initialize its new field to `None`; update existing tests `fn system_instructions_are_accepted()`, `fn blank_system_instructions_are_rejected()`, and `fn absent_system_leaves_canonical_bytes_unchanged()` for the new validator argument and omission invariant. Add tests with exact signatures `fn schema_0_6_decodes_all_agent_intent_forms()`, `fn schema_versions_before_0_6_reject_agent_intent()`, `fn invalid_agent_intent_reports_agent_paths()`, `fn scoped_agent_collision_only_applies_to_require_and_avoid()`, and `fn populated_intent_has_deterministic_canonical_bytes()`.

In `modules/core/src/encoding.rs`, keep the exact signature `pub fn decode_trait_with_warnings(encoding: Encoding, text: &str) -> crate::Result<(Trait, Vec<String>)>` and pass `t.schema_version.as_str()` to the changed `validate_agents`; serde remains shape decoding rather than the version gate. In `modules/core/src/trait/mod.rs`, edit `pub const SUPPORTED_SCHEMA_VERSIONS: &[&str]` to append `"0.6"` after `"0.5"`; do not change `pub fn schema_version_at_least(schema_version: &str, floor: &str) -> bool`.

In `modules/core/src/migrate.rs`, append a `MigrationStep` entry to `pub const MIGRATION_STEPS: &[MigrationStep]` and add `fn bump_0_5_to_0_6(doc: &mut DocumentMut) -> Result<StepOutcome, Error>` that changes only `schema-version`. Add `const V05: &str` for the release gate and `const V05_ROOT_INTENT_COLLISION: &str` for compatibility coverage; keep `fn minimal_fixture(version: &str) -> &'static str` and add its `0.5` arm. Add tests with exact signatures `fn migration_0_5_to_0_6_touches_only_schema_version_line()` and `fn root_intent_collision_survives_0_6_migration_with_identical_static_guidance()`. The latter must decode the `0.5` source, migrate and decode at `0.6`, and compare the rendered root intent guidance rather than a report-wide digest that necessarily includes the changed schema version.

In `modules/core/src/model_view/compile.rs`, change `fn format_intent(intent: &crate::r#trait::Intent, trait_id: &str, tag: GuidanceTag, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String` to `fn format_intent(intent: &crate::r#trait::Intent, trait_id: &str, tag: GuidanceTag, field_prefix: &str, source: Option<&str>, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String`. Root callers in `pub fn compile_model_view_with_evidence(trait_ref: &Trait, profile: ExtendedRenderProfile, source_digest: Option<&str>, resource_plan: &Plan) -> Report` and `pub fn frame_guidance(trait_ref: &Trait) -> Option<FrameGuidance>` pass `"intent"` and `None`. Change `fn format_guidance_group<'a>(style: GuidanceTag, tag: &str, attr_name: &str, attr_value: &str, field: &str, items: impl Iterator<Item = &'a GuidanceItem>, builtin: Option<BuiltinGuidanceLookup>, trait_id: &str, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>, elements: &mut Vec<String>)` to `fn format_guidance_group<'a>(style: GuidanceTag, tag: &str, attr_name: &str, attr_value: &str, field: &str, source: Option<&str>, items: impl Iterator<Item = &'a GuidanceItem>, builtin: Option<BuiltinGuidanceLookup>, trait_id: &str, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>, elements: &mut Vec<String>)`. Change `fn format_guidance_item_element(style: GuidanceTag, tag: &str, attr_name: &str, attr_value: &str, item: &GuidanceItem, field: &str, builtin: Option<BuiltinGuidanceLookup>, trait_id: &str, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String` to `fn format_guidance_item_element(style: GuidanceTag, tag: &str, attr_name: &str, attr_value: &str, item: &GuidanceItem, field: &str, source: Option<&str>, builtin: Option<BuiltinGuidanceLookup>, trait_id: &str, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String`. When `source` is present, add a `source` attribute to each namespaced intent declaration; when absent, produce byte-identical attributes, field paths, warnings, normalizations, findings, and text. Update `fn format_behavior(behavior: &crate::r#trait::Behavior, trait_id: &str, tag: GuidanceTag, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String` only to pass `None` through the generalized helper. Continue using `resolve_guidance_directive`, `sanitize_model_text`, and `leaf_element` unchanged.

In `modules/core/src/model_view/compile_sections.rs`, keep the exact signature `fn format_agents(trait_ref: &Trait, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String` and append the shared `format_intent` output after each ordinary agent element when `agent.intent` is present, passing field prefix `agent[{index}].intent` and source `agent:<id>`. Render intent for every declared agent, assigned or not. Keep `fn format_agent_element(trait_ref: &Trait, index: usize, agent: &crate::r#trait::agent::Agent, warnings: &mut Vec<String>, normalizations: &mut Vec<Normalization>, findings: &mut Vec<Finding>) -> String` and its existing `System:` line semantically unchanged; do not send `system` through guidance resolution. In `modules/core/src/model_view/compile.rs`, add `fn agent_intent_is_sanitized_and_source_attributed_only_in_static_output()` to prove built-in and local directives use the shared sanitization path, the source attribute is present, an unassigned declaration renders without an active-agent claim, and agent intent is absent from `Report::behavior_text` and `frame_guidance`.

In `packages/cdk/src/agent.ts`, add `readonly intent?: Intent` to both `export interface AgentFields` and `export interface AgentTemplateFields`, importing the existing authoring type from `packages/cdk/src/trait.ts`. Keep `function agentOf(fields: AgentFields, extraMeta: Parameters<typeof withDeclaration>[4] = {}): AgentHandle` as the only lowering path and add `intent: normalizeIntent(fields.intent)` using the existing `packages/cdk/src/normalize.ts` export unchanged. Keep `function agentTemplateOf(template: AgentTemplateDefinition, id: string, fields: AgentTemplateFields, extraMeta: Parameters<typeof withDeclaration>[4] = {}): AgentHandle` and forward the optional intent with exact-optional-property semantics. Do not change `export interface AgentFunction`, `export type AgentTemplateFunction`, `AgentHandle`, `seats(...)`, or functional registration/emission paths.

In `packages/cdk/src/trait.ts`, change `export type SchemaVersion = "0.2" | "0.3" | "0.4" | "0.5"` to include `"0.6"`. Change `export function assembleSingleTraitDraft(fields: TraitFields): { readonly draft: CanonicalTraitDraft; readonly merged: ReturnType<typeof mergeDeclarationSets>; readonly diagnostics: readonly CdkDiagnostic[]; readonly sourceMap: SourceMap; }` to `export function assembleSingleTraitDraft(fields: TraitFields, baselineSchemaVersion: SchemaVersion = "0.5"): { readonly draft: CanonicalTraitDraft; readonly merged: ReturnType<typeof mergeDeclarationSets>; readonly diagnostics: readonly CdkDiagnostic[]; readonly sourceMap: SourceMap; }`. After declarations are merged, select `fields["schema-version"]` when explicitly supplied; otherwise select `"0.6"` iff a merged canonical agent declaration has a present `intent` property, and otherwise select `baselineSchemaVersion`. Do not globally change the baseline and do not suppress explicit older versions.

In `packages/cdk/src/variant.ts`, keep `export const NATIVE_VARIANT_SCHEMA_VERSION = "0.5" as const` and `export async function resolveTraitFamily(handle: TraitFamilyHandle): Promise<FamilyEnvelope>`. Change only the native-leaf assembly call: stop injecting `"schema-version"` as an explicit field and pass `NATIVE_VARIANT_SCHEMA_VERSION` as `assembleSingleTraitDraft`'s second argument, allowing a transitively merged guided agent to infer `0.6` while intent-free leaves remain `0.5`.

In `packages/cdk/test/cdk.test.ts`, add exact test registrations `it("direct, template, and seated agents normalize all four intent groups without weakening handles", () => ...)` and `it("agent intent infers 0.6 while explicit versions and intent-free fixture bytes remain unchanged", () => ...)`. Cover direct `agent(...)`, all five `agent.*` templates, `seats(...)`, scalar-to-array and string-to-`{id}` normalization, built-in/custom/rich items, and passing the resulting `AgentHandle` into a prompt builder. In `packages/cdk/test/functional.test.ts`, add exact test registrations `it("a guided agent reached through .prompt is collected with normalized intent at schema 0.6", () => ...)` and `it("native variants infer 0.6 only for transitively collected guided agents", async () => ...)`; pair guided and otherwise equivalent intent-free ordinary/native cases and assert the latter remain `0.5`.

In generator-owned `packages/cdk/src/generated.ts`, `just sdk-generate` must update `export type CanonicalAgent` to contain `readonly "intent"?: CanonicalIntent | undefined`; no hand edit is permitted. There are no removed symbols in this task.
"""
scope = """
## Ordered work
1. Edit `modules/core/src/trait/intent.rs` first: introduce path-aware group validation and agent-only require/avoid collision validation while preserving `Intent::validate_taxonomy()`. Then edit `modules/core/src/trait/agent.rs`, `modules/core/src/encoding.rs`, and `modules/core/src/trait/mod.rs` in that order to add `Agent.intent`, initialize every direct `Agent` fixture/template construction to `None`, gate present intent at `0.6`, and register `0.6`. Add the named validation, version, omission, and determinism tests in `modules/core/src/trait/agent.rs` before moving on.
2. Edit `modules/core/src/migrate.rs`: add the adjacent version-only migration, `V05`, `V05_ROOT_INTENT_COLLISION`, the release-gate fixture arm, and the two named migration tests. Prove the root collision remains valid and root rendered guidance is unchanged; do not respond to a failing test by broadening root validation.
3. Edit `modules/core/src/model_view/compile.rs`, then `modules/core/src/model_view/compile_sections.rs`: generalize the existing renderer with a canonical field prefix and optional source, preserve root calls with `None`, and append source-attributed agent declarations only in the static `Agents` section. Add the named static sanitization/source/non-runtime test in `modules/core/src/model_view/compile.rs`.
4. Edit `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, and `packages/cdk/src/variant.ts` in that order. Reuse `normalizeIntent` and the existing declaration collection graph; infer the schema version only after `merged.agent` is available; pass the native `0.5` value as a baseline rather than an authored field.
5. Edit only tests next: `packages/cdk/test/cdk.test.ts`, then `packages/cdk/test/functional.test.ts`, adding the four exact `it(...)` registrations named in content. Use existing `packages/cdk/test/fixtures/stable-draft.json` read-only as the byte-compatibility oracle.
6. Run `just sdk-generate` exactly once after Rust schema changes and accept only the generated `CanonicalAgent.intent` change in `packages/cdk/src/generated.ts`. Inspect the diff before tests; if `packages/config/src/generated.ts` or any unlisted file changes, treat it as a concrete blocker rather than expanding scope.
7. Run `pnpm --dir packages/cdk run test`, then `CARGO_TARGET_DIR=target just test`, in that exact order. Review the complete diff against the file allowlist and exclusions. If a declared check fails or the review finds an invariant violation, permit at most two targeted repair-and-rerun rounds; stop successfully only when both commands pass and review is clean, otherwise stop and report the remaining concrete blocker.

## Reuse
`modules/core/src/trait/guidance.rs` remains unchanged and is the sole item-level authority through `validate_guidance_list`: scalar/rich decoding, kebab-case canonical IDs, within-list duplicate detection, blank local text rejection, and imperative second-personless checks must not be copied into agent code. `modules/core/src/model_view/compile.rs` remains the sole directive-resolution and sanitization path through `resolve_guidance_directive`, `sanitize_model_text`, and `leaf_element`. `packages/cdk/src/normalize.ts` remains unchanged and supplies `normalizeIntent`. `packages/cdk/src/functional/registrars.ts` and `packages/cdk/src/sequence.ts` remain unchanged because their existing handle delegation and transitive declaration collection already route through `agentOf`.

## Exclusions
Do not implement assigned-agent selection, preview/CLI/MCP dispatch, cross-layer precedence, or live frame composition; those belong to `0255.2`. Do not add agent behavior; that belongs to `0255.3`. Do not add prompt-scope intent; that belongs to `0255.5`. Keep agent `system` separate from categorized intent and on its existing static `System:` line. Do not put agent intent into the Description/Intent/Behavior/Resources behavior envelope, `frame_guidance`, runtime frames, or prompts. Do not infer active-agent status from declarations or sequence assignment. Do not reject root require/avoid collisions, collisions involving focus/block, or prose that merely appears contradictory. Do not add agent-specific guidance-item parsing or validation, a functional-only emitter, a blanket `0.6` default, compatibility shims, new files, or manual edits to generated definitions.

The complete touched-file allowlist remains `modules/core/src/trait/intent.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/encoding.rs`, `modules/core/src/trait/mod.rs`, `modules/core/src/migrate.rs`, `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/src/variant.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and `packages/cdk/src/generated.ts`.
"""
validation = """
## Done when
1. `CARGO_TARGET_DIR=target just test` exits 0 and its Rust unit coverage proves: schema `0.6` decodes agent `require`, `focus`, `avoid`, and `block` containing built-in, custom, and rich items; schema `0.2` through `0.5` reject present agent intent; duplicate IDs within one group, malformed IDs, blank/second-person text, and agent-local require/avoid collisions fail at canonical paths such as `agent[0].intent.require[0].id`; focus/block overlap is not rejected; absent intent is omitted from canonical JSON/digest input; populated canonical output is deterministic; the `0.5 -> 0.6` migration changes only the version line; and a migrated root require/avoid collision still decodes and has identical static root guidance.
2. `CARGO_TARGET_DIR=target just test` exits 0 and the model-view coverage proves every declared agent intent item is rendered through shared directive resolution and sanitization with `source="agent:<id>"`, including unassigned agents, while root rendering with no source stays unchanged, agent `system` stays a separate `System:` line, `Report::behavior_text` excludes agent intent, and `frame_guidance` remains root-only.
3. `pnpm --dir packages/cdk run test` exits 0 and the object/functional tests prove direct agents, every built-in template, `seats(...)`, and a guided agent used only through `.prompt(...)` retain normalized all-group intent and typed-handle usability; unversioned guided ordinary/native drafts infer `0.6`; explicit schema versions remain explicit; and otherwise equivalent intent-free ordinary/native drafts remain `0.5`. Existing `packages/cdk/test/fixtures/stable-draft.json` bytes must still match.
4. `CARGO_TARGET_DIR=target just test` exits 0 after `just sdk-generate`, including its existing `just sdk-check`, TypeScript typecheck, formatting, lint, and Rust library tests; the only generator-owned semantic diff is optional `CanonicalAgent.intent` in `packages/cdk/src/generated.ts`.
5. Judgment review finds changes only in `modules/core/src/trait/intent.rs`, `modules/core/src/trait/agent.rs`, `modules/core/src/encoding.rs`, `modules/core/src/trait/mod.rs`, `modules/core/src/migrate.rs`, `modules/core/src/model_view/compile.rs`, `modules/core/src/model_view/compile_sections.rs`, `packages/cdk/src/agent.ts`, `packages/cdk/src/trait.ts`, `packages/cdk/src/variant.ts`, `packages/cdk/test/cdk.test.ts`, `packages/cdk/test/functional.test.ts`, and generator-owned `packages/cdk/src/generated.ts`; no root collision rejection, live agent-intent composition, categorized `system`, hand-edited generated source, duplicated normalization/validation, functional-only emitter, or intent-free `0.5` churn is present. This criterion has no fabricated automated check; it is the bounded final diff review.

Run generation and verification exactly as `just sdk-generate`, `pnpm --dir packages/cdk run test`, and `CARGO_TARGET_DIR=target just test`. Perform no more than two targeted repair-and-rerun rounds. Success requires both declared check commands to pass and the judgment review to be clean; otherwise stop with the concrete remaining failure.
"""

