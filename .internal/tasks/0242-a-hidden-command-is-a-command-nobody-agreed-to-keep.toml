schema-version = "0.2"
key = "0242"
title = "Delete the hidden commands instead of hiding them"
status = "ready"
raised = "2026-08-20"
content = """
OWNER RULING 2026-08-21: not gone, unreachable from the CLI. That is the
"separate the two meanings" option below — internals stop being top-level
verbs, and keep working for the runtime that spawns them.

Blocked on one classification the filing cannot make for itself. The 50
hidden commands are three different things, and moving all of them would bury
commands that look like they were meant to be visible:

- PLUMBING, machine-to-machine, never typed by a person (11): mcp, drive,
  next, set, call, run-status, run-frame, session, hook, context status,
  subagent. `mcp` is spawned by `drive.rs` as a subprocess, so whatever
  namespace it moves to has to stay invocable.
- REPO TOOLING, this project's own workflow, not a user's (20):
  sdk-generate, tui-demo, synth, generate-round, refine-round, import-round,
  import-refresh, schema, help, stats, story, running, claim-gate, hygiene,
  cost, prepare-public, context-contracts, policy, evidence, compatibility.
- LOOKS LIKE A USER COMMAND (19): state, config, task, preview, export, host,
  explain, inspect, eval, search, resolve, pack, context, migrate, edit,
  manifest, run-info, prompt, review.

The third group is the question. `state` alone has 32 call sites. `config` and
`task` carry a comment saying they are "off the release help screen since the
2026-08-18 regroup" — a decision already taken, which moving them into an
internals namespace would quietly overturn.

## Correction to this task's own earlier claim

`review` is NOT a second spelling of `trust`, and this file said it was. It
reaches `handle_trust_named_update`; `trust --approved` reaches
`handle_trust_approve`, which does package resolution and runs the approval
guard. Removing `review` and pointing its callers at `trust --file … --approved`
broke three tests on paths where the two resolve differently. Reverted.

That makes `review` more interesting, not less: a hidden command that writes a
trust verdict while bypassing the guard the visible one runs. Worth a decision
of its own, and not a deletion anyone should do casually.

---

PARTLY DONE 2026-08-20, and the rest needs a decision the original filing did
not know it needed.

DONE: `vendor` and its `sync` alias are gone. `vendor` was a pure forward to
`dependency install` — the handler literally rebuilt the `Install` variant and
called the same function — kept "for one release" alongside five sibling
legacy verbs that had already been removed. Nothing in the repository invoked
either spelling; two tests did, and now use the surviving one.

NOT DONE, because it would break the product: the other ~50. Applying "not
visible ⇒ delete" literally would remove `mcp`, which the binary SELF-INVOKES
(`drive.rs`, spawning `["traits", "mcp"]`), the `next`/`set`/`call`/
`run-status`/`run-frame` verbs that are the MCP frame protocol, `hook`, and
`preview`, `session`, `task`, `config`, `state`.

The help text already says what is going on, at the bottom:

    Run `ctx traits <command> --help` for a command's full options, and
    `ctx traits <hidden-command> --help` for internals not listed above.

So `hide = true` is doing two unrelated jobs — "deprecated, do not use" and
"plumbing, not for humans" — and nothing distinguishes them. That is the
actual defect. `vendor` was the first kind; almost everything else is the
second, and the second is legitimate: a frame protocol should not be in the
help a person reads.

## The decision this now needs

Three ways, and the filing assumed the first without checking:

- DELETE the rest. Not viable without also deleting the runtime's own
  dispatch path.
- SEPARATE the two meanings. Internals become a visible namespace
  (`ctx traits internal <verb>`, one line in help) or gain a distinct
  attribute, so "hidden" means only "deprecated" and a deprecated command can
  then be deleted on sight. Larger, and it moves a surface the MCP transport
  and the drive loop both spell out.
- KEEP, and make the existing convention explicit — the help line already
  documents it; the gap is that nothing enforces which kind a new
  `hide = true` is.

---

Owner ruling 2026-08-20: whatever is not visible in `--help` should not exist.
Commands only — hidden FLAGS are a separate question and are not in scope.

`modules/cli/src/app/surface/cli.rs` carries 54 `#[command(hide = true)]`
attributes. Among them:

    #[command(alias = "sync", hide = true)]
    Vendor { ... }

so `ctx traits vendor` and `ctx traits sync` both work, neither appears in
help, and `sync` is an alias to a command that is itself hidden — a second
name for something that has no first name. `resolve_trait_target` documents
six more of the same shape: `vendor`, `install`, `remove`, `update`,
`outdated`, `info`, all replaced by `ctx traits dependency <verb>` and all
kept as invisible legacy spellings.

A hidden command is the worst of both: it is still surface — parsed, routed,
maintained, and able to break — while being invisible to the person who would
notice it broke, and to review. Nobody decided to keep these; they were
carried because deleting them felt riskier than not.

## Scope

Every hidden command variant, its dispatch arm, its handler if nothing else
reaches it, and any alias pointing at it. The visible surface does not change:
if a hidden command is the only way to do something a visible one cannot, that
is the finding, and it gets promoted rather than deleted.

## Watch

- Some hidden verbs may be reached by the traits themselves, by the dogfood
  loop's scripts, or by `justfile` recipes rather than by a person. Grep the
  repository, `.internal/scripts/`, and every authored trait's command steps
  before removing any one of them — a command step's argv is exactly where an
  invisible dependency on a legacy spelling would hide.
- `presentation.rs` already notes that hidden commands are never looked up for
  suggestions, so removing them cannot regress "did you mean".
- Check whether the six dependency legacy verbs are named in published docs or
  the website; a removed command should not be a command the docs still teach.

## Done when

`--help` and the parsed command set are the same set: no `hide = true` remains
on a subcommand, nothing in the repository invokes a removed spelling, and the
visible surface is unchanged except for anything deliberately promoted.
"""
validation = """
## Done when

`grep -c 'hide = true' modules/cli/src/app/surface/cli.rs` counts only
non-subcommand uses, `cargo test --workspace` and `just builtins-check` pass,
and every authored trait still runs.
"""

