title = "Render the Config preview column"
status = "ready"
raised = "2026-08-29"
content = """
Render the Config screen's 380-wide preview column over the one repository-scoped answer `0268.1` taught the center to serve. `screens/config.md:29-34` is precise about what this column is — **"Preview column (selected seat)"** — a `seat` block, a `facts` block of `model` / `effort` / `used by` / `source`, and a provenance footer. That is the whole of its normative content, and the selected seat is the whole of its subject. This cut projects; it resolves nothing.

Exactly one leaf here is `placeholder:` — the seat's prose description, the third and last of the screen's three placeholder leaves (`0268` Correction 4). Every other leaf is `data:`, and the export's `smart · strong seat`, `claude-opus-5`, `high`, `implement · plan · architect`, `runtime.toml · trait-scoped` and `13:02` are illustrations rather than values (`reference/config.html:633-738`).

Seven grounded corrections the draft this file replaces did not carry.

**The footer is not `runtime.toml · valid · HH:MM`, and "matching the bottom bar exactly" is the wrong requirement.** Resolution is layered — global hand TOML or global generated output, each ancestor `.ctx/harness.toml`, the repository document or its generated output, and `$CTX_CONFIG` (`harness_config.rs:5079-5171`) — so the export's string is one reachable outcome among many, and parent Correction 1 fixes the citation as the highest-precedence contributing physical document, with a muted qualifier stating the served set's size when more than one contributed and the built-in-default origin when the set is empty. Separately, the two normative orderings differ: `screens/config.md:33` gives the footer `<citation> · <verdict> · <time>` while `:24` gives the bar `<verdict> · <citation/load detail>`. Byte-identical text is therefore not the goal and demanding it would put this cut in conflict with the spec; what must be identical is the underlying served verdict, cited document and captured instant, because both come from one answer. `0268.2` owns and places the single shared, source-agnostic provenance presentation exactly so this footer calls it (`0268.2` scope, Done-when 4); a second formatter here is the defect, not the fix.

**`source` is not "the layer the value won on", and the parent's own wording overreaches on one boundary.** Correction 5 binds one labelled entry per rendered value, in the fixed order model then effort, each naming the value it belongs to and carrying that value's winning layer, reason and source document, entries kept separate even when the winners agree, with a built-in winner carrying no document path. But Correction 5 also says the `source` row "carries an entry for the model value always", and the code does not support that as an unconditional rule: `record_assignment_winners` records a winner only for a field the document actually set (`harness_config.rs:6171-6211`), `ProfileAssignment.model` and `reasoning_effort` are both optional (`:1969,1973`), and `finalize_assignment` accepts a harness-only assignment as a usable physical seat (`:6657-6667`) — which is not hypothetical, because the standing public proof configures five seats of exactly that shape and requires the config answer to report them (`modules/cli/tests/proof_config.rs:818-859`). A seat with no configured model therefore exists, has no `.model` winner to cite, and needs an honest typed absence rather than an invented selector or a catalog probe. This file states that form and reports the divergence from the parent's wording rather than fabricating a value to satisfy it.

**`used by` is a join across three sources, and one seat is not one universal assignment.** It is not a `RuntimeConfig` field: it is the repository-scoped visible trait inventory joined to each decoded trait's declared `Trait.agents: Vec<Agent>` (`modules/core/src/trait/mod.rs:419`), whose role id is `Agent.id` (`modules/core/src/trait/agent.rs:94`), joined again to the effective assignment. Name equality is the wrong join: `assignment_for_role` uses an exact `[agent.role.<role>]` table when one exists and otherwise lets ordinary trait roles inherit the whole `default` seat, while standing seats inherit nothing (`harness_config.rs:2466`), so a trait declaring `implement` is a user of the `default` seat even though no name matches. And assignment is trait- and variant-scoped: `resolve_trait_runtime_assignments` applies those qualifiers and records the selected one in `ResolvedRuntimeAssignments.qualifier_by_role` (`:2420,2926-2932`), so one seat can hold different model, effort and winner values for different visible traits — Correction 6's second invariant. Calling that function once per trait is also not an available route: it re-enters `resolve_config_report(Utf8Path::new("."))` on every call (`:2934-2939`), which is both a second resolution per answer and the cwd dependency Correction 2 exists to remove.

**"Reads fire on selection" is not established for this screen.** The Traits plan established a selection-triggered detail answer because a compact list row could not carry descriptions, agents and per-variant data under the 1 MiB line bound (`0267` Correction 10; `center.rs:48-52`). `0268` establishes no such protocol: it describes one compact repository-scoped Config answer carrying rows, seat identities, per-value winners, the inventory and trust joins, the document set, the verdict, the warnings and one captured instant together (`0268` Correction 1; Done-when 3). Selection of a seat is therefore a projection of an answer already held, and the draft's rule licensed a private selection-time reader that this screen does not need. Where a leaf this column renders is genuinely absent from the landed answer, the widening belongs to that same retained assembly, reachable by a non-GUI face — never a resolver, inventory scan, trust read or harness probe running on selection.

**`smart · strong seat` has no data source, and the seat's prose has no runtime source at all.** Runtime roles are arbitrary map keys, the standing seats are `default`, `narrator`, `guide`, `merger` and `merger-deep` (`harness_config.rs:1883`), and nothing in `ProfileAssignment` or `SeatInfo` carries a `strong`/`small`/`large` adjective — `SeatInfo` is a 1-based index and a list length (`:1935-1940`), and the assignment carries harness, model, effort and related fields (`:1958-1977`). So the `name` value is the served physical seat identity — the role, plus the list-seat identity where the seat is one entry of a list-backed role — and a qualifier appears only if `0268.1`'s landed answer has a truthful source for one. The prose beneath it is the placeholder leaf and stays one: `Agent.description` is authored per trait, so the same role id carries different prose in different traits (`modules/core/src/trait/agent.rs:94-97`; parent Correction 4), and borrowing one trait's sentence would present authored trait text as a runtime fact.

**The preview primitives this column composes are not reachable from this leaf's declared prerequisites.** `0265.10` owns the 380-wide preview column frame, its order, the key/value row and the preview-footer primitive (`0265.10:16-26`), and `0265.12` owns the fact-block shape the four later screens compose (`0265.12:7-24,40-42`), depending on `0265.10`. This leaf declared only `0268.2`, whose closure runs `0268.1` → `0265.5`/`0265.9`/`0258` and `0265.13`, and reaches neither; a charter's `depends-on` is not inherited by its children, because `derived_status` evaluates dependency edges only for open leaves (`modules/core/src/task/graph.rs:115-177`). `0265.12` is added, exactly as the analogous Traits preview leaf carries it (`0267.3` relations).

**The declared `proof_doctor` check was the wrong evidence.** Its only `--config` test asserts that `--verbose` conflicts with `--config` (`modules/cli/tests/proof_doctor.rs:255-273`) — it observes no resolution, no seat, no winner, no provenance and no transport. Parent Correction 10 requires correcting it: `proof_config.rs` is the standing config-semantics suite, already covering built-in defaults over a document-free scratch repository (`:18-40`), exact per-leaf provenance (`:95-414`), independently-won model and effort (`:417-553`) and uniform seat listing over harness-only seats (`:818-859`); `proof_center.rs` is the process-boundary suite for any served-answer widening.
"""
scope = """
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the Config screen's 380-wide preview column frame; the `seat` block with its served name and its one placeholder-served prose leaf; the `facts` block's `model`, `effort`, `used by` and `source` rows; the provenance footer rendered through `0268.2`'s landed presentation; and only the minimal widening of `0268.1`'s same retained assembly and typed capability needed to make the seat identity, the `used by` join and the per-value winner mapping truthful without a second resolution.

- **`0268`'s corrections bind.** The parent's outcome invariants govern this leaf and are not narrowed here; Corrections 1, 3, 4, 5, 6, 9 and 12 are the ones it touches directly. Where the evidence contradicts one — Correction 5's claim that a model source entry always exists, against a reachable harness-only seat with no configured model — the honest form is rendered, the divergence is reported in the work summary, and no value is fabricated to preserve the wording.

- **The selected seat is the boundary.** `screens/config.md:29-34` specifies the preview for a selected seat and defines no block, leaf or tag for a `Runtime` or `Trust` row. This cut renders the seat case and invents no mapping for the rest; extending the column to those rows requires the design artifact to say what they contain first — an owner change to `.internal/docs/design/**`, not a worker ruling made here.

- **This leaf resolves nothing.** No desktop-side runtime-document parse, layer resolution, inventory scan, trust read, `git` call, cwd read, filesystem existence check, harness or model-catalog probe, or clock read; no second resolver, inventory assembly, winner mapping, provenance formatter, request, subscription, model or timer for this column. It receives one accepted repository-scoped answer and projects it.

- **Selection is a projection, not a read.** One accepted Config answer carries the seat facts; selecting a seat chooses among them. Where a leaf is genuinely absent from the landed answer, the widening goes into that same retained assembly and typed capability, reachable by a non-GUI face — never a private selection-time resolver, scan, read or probe.

- **One accepted answer, one commit.** The rows `0268.1` renders, `0268.2`'s chrome and this column are projected from the same accepted model. A rejected candidate commits none of the seat name, the facts, the winners or the footer, and a last accepted answer stays visible only behind the inherited explicit stale or outage marker.

- **Compose the landed vocabulary, do not duplicate it.** `0265.10`'s preview column frame, key/value row and preview-footer primitives and `0265.12`'s fact-block shape are the forms this column takes; `0265.1`'s token entry point and registered IBM Plex faces carry every dimension, size and colour; `0265.3`'s single `placeholders` module carries the one placeholder leaf; `0268.2`'s single provenance presentation produces the footer's text. A Config-private copy of any of them is a defect even when it renders correctly.

- **Exactly one placeholder leaf.** The seat's prose description is added as one entry to the shared module and is the screen's third and final placeholder (`0268` Correction 4). No inline sentence, no second module, no fourth placeholder added to cover a leaf whose served source was not found, and no export literal reproduced as data.

- **Read-only.** Selecting a seat writes no runtime document, edits no assignment, mutates no trust, acquires no lock, rewrites no stamp and opens no editing affordance; `--apply` and `--migrate-config` are untouched.

- Out of scope: the served answer, the three sections, the seat enumeration, the runtime rows, the trust join, the repository scope and the typed capability (`0268.1`); the header, the bottom bar and the shared provenance presentation itself (`0268.2`); the CLI parity half (`0268.4`); any configuration-editing surface on any face; the light theme; pencil work of any kind; every shared primitive `0265` already built; and all work belonging to `0266`, `0267`, `0269` or `0261`.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0268.2` — the chrome whose selection this column follows and, decisively, the single shared source-agnostic provenance presentation this footer calls rather than re-assembling; it carries `0268.1`'s served answer, the seat identities, the per-value winners, the document set, the verdict, the warnings and the one captured instant transitively. `0265.12` — the fact block the `facts` block takes, which carries `0265.10`'s 380-wide preview column frame, its key/value row and its preview-footer primitive transitively (`0265.12` depends on `0265.10`). Neither `0265.10` nor `0265.12` is reachable through `0268.2`'s closure and a charter's `depends-on` is not inherited by its children (`modules/core/src/task/graph.rs:115-177`), which is why `0265.12` is named here. None of that chain has landed at the time this file was written and `0256.1` is still `ready`: bind to the desktop project, components, module names and non-interactive command those tasks actually landed, never to a path, symbol or signature guessed here. An absent preview primitive, provenance presentation or desktop lane is an unmet dependency to report, not permission to build a parallel one.

## Done when

1. **The column opens as the selected seat's column, in rule 13's order, from the landed primitives.** Selecting a seat renders a 380-wide column, padding `[18,22]`, whose first block is `seat`, whose second is `facts`, then a flex spacer, then the provenance footer; each block is a full-width column with an 8px internal gap and 20px bottom padding under a lowercase Mono 11 `text-muted` heading, identity before facts. The `facts` heading renders even though `reference/config.html:658-729` omits it, because `screens/config.md:32` and grammar's block-heading vocabulary govern content where the export conflicts (`0268` Correction 12). The frame, the key/value row, the block shape and the footer primitive come from `0265.10`/`0265.12` as landed rather than from a Config-private reimplementation, and every dimension and colour reaches the call site as a token role from `0265.1`'s entry point rather than as a literal. Selection is `0268.1`'s accepted seat selection with the shared list vocabulary's styling — `surface-raised` plus `text-bright`, one bright title per list, no border, accent bar, dot, radius, icon or decorative state colour — and this column creates no second selection model. Selecting a `Runtime` or `Trust` row renders no invented preview content, and no prior seat's preview is left looking current once the selection no longer identifies that seat. Geometry matches `reference/config.html:618-739` and `tokens.md:71-85`. No repo-root command inspects a rendered gpui screen at this HEAD, so this goal declares no board check and none may be invented; it is decided by the bounded review in `validation`, walking `screens/config.md:29-34` and `grammar.md:96-124` leaf by leaf, together with `just test` proving the shared code these leaves render through.

2. **The `seat` block renders the served seat identity over the one placeholder leaf.** One key/value row keyed `name`, `space-between` and vertically centred, whose value is the served physical seat identity — the role together with the list-seat identity where the seat is one entry of a list-backed role — as `0268.1`'s answer carries it, and never a `strong`/`small`/`large` adjective or any other qualifier the served model has no truthful source for. Beneath it the prose renders at full block width in Sans 11.5 `text-secondary` and comes from exactly one new entry in `0265.3`'s shared `placeholders` module: not an inline literal, not a second module, not `Agent.description` borrowed from some trait and presented as a runtime fact (`modules/core/src/trait/agent.rs:94-97`), and not the export's sentence. This is the third and last placeholder leaf on the screen; the row's value and every leaf in the block below is data. Where the served answer lacks a truthful seat identity, the widening is made in `0268.1`'s same shared capability and proved at the center boundary rather than synthesised in gpui, and the route taken is reported in the work summary. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for any widening, `just test`, and the bounded review's diff read for an inline literal, a second placeholder module, a borrowed trait description or an invented qualifier.

3. **The `facts` block renders its four rows in `screens/config.md`'s order with grammar's typography.** Rows are `model`, `effort`, `used by`, `source`, each `space-between` and vertically centred, with the key in Sans 11.5 `text-secondary` and the value in Mono 10.5 `text`; the export's Sans values and 12px keys at `reference/config.html:661-727` are the content conflict `0268:130-134` resolves toward grammar rule 7 and are not copied. The model value is the configured model selector the served answer carries for that physical seat — the enumeration that deliberately excludes catalog resolution (`harness_config.rs:2629-2664`), never a dispatch-resolved or catalog-expanded model, never `resolved_seats_for_role`'s output — and no model-catalog or harness-version probe runs on the config answer path, the center's model-owner request path, gpui's UI thread or the selection hot path. Values are state-coloured only where the value is itself a state, so model, effort, identity, source entries and separators stay neutral. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config` and `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served selector, `just test`, and the bounded review's leaf walk and diff read for a probe on any of those paths.

4. **An absent effort and an absent model each render an honest typed absence.** `reasoning_effort` is optional (`harness_config.rs:1973`), so a seat that configures none renders no effort value and no effort entry in `source`; defaulting it to a plausible word is fabrication and so is a source entry for a value that is not rendered. `model` is equally optional (`:1969`) and a harness-only seat is a usable physical seat that `finalize_assignment` accepts (`:6657-6667`) and that the standing proof configures five of (`modules/cli/tests/proof_config.rs:818-859`), so that case is reachable and gets the same treatment: the served typed absence renders in place of a value, its `source` entry is omitted with it, and no selector is invented, no catalog probe run and no blank leaf presented as a value. This is the divergence from `0268` Correction 5's "an entry for the model value always" wording; the honest form is rendered and the divergence reported in the work summary rather than resolved by fabricating a model. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config` and `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch runtime layers carrying a harness-only seat and a seat with no configured effort, `just test`, and the bounded review.

5. **`source` renders one labelled entry per rendered value, model then effort, each carrying layer, reason and document.** Each entry names the value it belongs to and that value's winning `ConfigLayer`, `ConfigReason` and optional source document as the served winner records them (`harness_config.rs:1378-1424`). The two entries render separately when the winners agree exactly as when they differ — a merged entry cannot be told apart from a claim about one value only — and a built-in-default winner names the built-in origin and carries no document path, so a built-in default and a document-stated value stay distinguishable. The winner a rendered physical seat maps to is `agent.role.<role>.<field>` for a single-table role and `agent.role.<role>.<1-based seat>.<field>` for a list entry, with a count-expanded seat inheriting the single table's winner (`:6171-6211`, `:6368-6397`); that mapping is consumed from `0268.1`'s served answer rather than re-derived here, and rendering `expand_role_seats`' alias map directly, which double-counts physical seats, fails this goal. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config` — whose standing case already constructs a model won at the global layer beside a reasoning effort won at the repo layer and asserts the distinct winners (`:417-553`) — together with `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the bounded review's diff read for one broad role source standing for both values.

6. **`used by` is the shared inventory/declaration/effective-assignment join, and every displayed value states the scope it holds for.** The value is derived from the repository-scoped visible trait inventory joined to each decoded trait's declared `Trait.agents` role ids (`modules/core/src/trait/mod.rs:419`; `modules/core/src/trait/agent.rs:94`) joined to the effective assignment, through the one shared assembly `0268.1` retained — widened here with declared agent ids only if it does not already carry them — preserving visible member identity including the family variant and the inventory's deterministic order. Inference from the seat's name fails this goal, because `assignment_for_role` lets an ordinary trait role inherit the whole `default` seat while standing seats inherit nothing (`harness_config.rs:2466`), so a declaring trait can be a user of a seat whose name it does not share. Where a seat resolves differently under trait or variant qualifiers (`ResolvedRuntimeAssignments.qualifier_by_role`, `:2420,2926-2932`), that divergence is represented rather than one assignment presented as universal, and each rendered model, effort and source value states the scope it holds for; the visual encoding of that is the run's call because the design does not specify it, but a single unqualified value standing for divergent scopes fails. A seat no visible trait declares renders the data-derived empty form rather than a fabricated list. No second inventory scan, no per-trait `resolve_trait_runtime_assignments` call — which re-resolves config from `.` on every invocation (`:2934-2939`) and would break both explicit scope and one-resolution-per-answer — no `InventoryContext::discover` reach from the desktop (`modules/io/src/inventory.rs:72-81` is the cwd-bound constructor), and no CLI-private import of `ResolvedTraitEntry`, `TraitInventoryRow` or `resolve_trait_inventory` (`modules/cli/src/app/lifecycle_reporting.rs:1509-1677`). If `0267`'s center-served inventory has landed by execution it is the preferred reuse point. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` over scratch inventories and trait packages including several traits declaring one seat, a default-inheriting role, family variants and differing trait/variant qualifiers, `just test`, and the bounded review's diff read for a name comparison, a rescan or a per-trait resolution.

7. **The footer renders the served provenance through `0268.2`'s one presentation.** A full-width, right-aligned Mono 10 `text-faint` line after the flex spacer (`grammar.md:110-124`), ordered `<citation> · <verdict> · <time>` as `screens/config.md:33` gives it. Its text reaches this call site only by calling the single shared, source-agnostic provenance presentation `0268.2` landed and placed for exactly this purpose; this diff assembles, parses, shortens, re-derives or reformats no part of it, and if that presentation or its served value is not reachable, that is a prerequisite defect to report rather than grounds for a second formatter. The bar's normative ordering differs, so byte-identical strings are not required and must not be forced against the spec; what is required is that both render the same served verdict, the same cited document and the same one captured instant from the same accepted answer, so the two cannot disagree. The citation is the highest-precedence contributing physical document with the muted set-size qualifier when more than one contributed, and the built-in-default origin framed as resolution of defaults when the set is empty — never a fixed `runtime.toml`, never a file mtime, never a render-time clock read, never one time per document. Semantic colour reaches only the verdict word, the all-good instance being `valid` in `ok`; a warning state renders the warning `0268.1` serves without promotion to failure, and a typed failure — malformation, refusal, unreadability, stale or never-built generated output, malformed trust data, an unusable repository scope — replaces the claim with no `valid`, no blank or placeholder citation and no invented instant. Decided by `just test`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` for the served values behind these states, and the bounded review against `grammar.md:110-124`, `screens/config.md:24-34` and `reference/config.html:730-739` over no contributing document, one, several and a generated source.

8. **Selection is a read-free projection, freshness is event-driven, and a rejected candidate commits nothing.** Choosing a seat performs no resolution, inventory scan, trust read, harness or catalog probe, filesystem or cwd read, `git` call or clock read on any face, and issues no request that does one; where a leaf is genuinely absent from the landed answer the widening lives in `0268.1`'s same retained assembly, reachable by a non-GUI face, and is reported. Freshness arrives as `0268.1`'s accepted center events with no timer on any client and no filesystem-watcher dependency in `ctx-traits-io`, which still depends only on `ctx-traits-core` and its existing third-party set (`modules/io/Cargo.toml:12-29`). The complete candidate is staged and committed whole or rejected whole with the prior accepted content retained, as the TUI reducer already demonstrates (`modules/cli/src/app/dashboard/worker.rs:254-415`): a rejected refresh never combines this column's old seat facts with a new verdict and instant, a last accepted answer is visible only behind the inherited explicit stale or outage marker and never as current, and there is no desktop-side direct-reader fallback. Blocking work stays off gpui's UI thread and off the center's model-owner request path. If any asynchronous projection remains, a result whose seat identity no longer matches the held selection is discarded rather than committed, so rapid selection changes cannot leave one seat's facts under another seat's name. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the bounded review's diff read — which is what shows a second reader, a client timer, an ungated commit or a partial commit directly.

9. **The workspace is unmoved.** Root Cargo resolution, the root `Cargo.lock` and the existing gates stay gpui-free and the desktop project stays outside the workspace. Decided by `just test` and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no config resolution, layer walk, document-set assembly, verdict derivation, instant capture, inventory scan, trust read, winner mapping or provenance formatter is written or copied here; no `resolve_runtime_assignments`, `resolve_trait_runtime_assignments`, `resolved_seats_for_role`, `InventoryContext::discover` or `read_store_with_sequences` call is added on this path; no CLI-private type is imported by the desktop; no desktop-side filesystem, `git`, cwd or clock read is added; no client timer or filesystem watcher is added; no Config-private copy of the preview frame, key/value row, fact block, footer primitive, token entry point or `placeholders` module is created; no second placeholder leaf, inline placeholder literal or export literal — `smart · strong seat`, `claude-opus-5`, `high`, `implement · plan · architect`, `runtime.toml · trait-scoped`, `13:02`, the hex colours or the paddings as raw numbers — enters this call site; no preview content is invented for a `Runtime` or `Trust` row; no status dot, pill, badge, icon, checkmark or corner radius appears in this column and no glyph outside `·` is used here; no light-theme value is touched; no pencil artifact is edited; no configuration write, trust mutation, lock acquisition, editor affordance, `--apply` or `--migrate-config` change is made; and no work belonging to `0268.1`, `0268.2`, `0268.4`, `0266`, `0267`, `0269` or `0261` is done.
