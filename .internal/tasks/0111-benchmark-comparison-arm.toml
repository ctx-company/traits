schema-version = "0.1"
key = "0111"
title = "Comparison arm + secondary benchmarks: the gap is the result"
status = "ready"
raised = "2026-08-05"
content = """


The audit number only lands next to a baseline that catches ≈0 of the hidden
content — the gap *is* the result. Secondary throughput / bundle-size /
native==wasm numbers pre-empt the "is it fast / is the wasm real" follow-ups.

- Comparison arm: run a markdown linter + a native coding-agent review over the same
  corpus as 0110 (expected ≈0 hidden-content catches); record per-file what each arm
  flags vs what `ctx` flags — the gap table.
- Activation precision/recall on a labeled activation set.
- Drift % from the `check` drift sections (`report_handlers.rs` `drift_summary`,
  `modules/core/src/eval_run.rs` GoldenRender).
- Perf: parse/check throughput via `encoding::decode_trait` + `scan_hidden_content`
  over the corpus — wall-clock, no criterion rig.
- WASM bundle size + native-vs-wasm digest parity via `modules/wasm-core/src/abi.rs`
  (`audit_json`, `normalize_json`).

## Watch

- Keep perf "cheap" (throughput, not a micro-benchmark harness).
- Byte-stable `--json` so the gap table is diffable.
- native==wasm parity is a **correctness** claim — any mismatch is a bug, not a
  footnote.

## Done when

The gap table shows baseline≈0 vs ctx's catch; activation P/R + drift % + throughput
+ wasm size + native==wasm parity are all reported and reproducible from the
committed corpus.

Full original contract: `archived/board/execution-plan.md` (Group 54, P237).
"""

[relations]
depends-on = ["0110"]
