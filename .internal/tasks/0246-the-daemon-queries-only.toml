schema-version = "0.2"
key = "0246"
title = "The daemon: queries only"
status = "ready"
raised = "2026-08-24"
content = """
First code slice of the live half. The daemon comes up, owns its sqlite
index, answers queries, and can do nothing else — no start, no interrupt, no
subscribe yet. Nothing converts to it in this task (that is 0247), so it
lands with zero behavior change for every existing surface.

## What it is

Sole owner and writer of one sqlite file (`<runs-root>/index.sqlite3`, one DB
for all repos, `repo_key` a column). A query server over it. Nothing more in
this slice.

Schema: RunSummary's existing sixteen fields (run_summary.rs:29) plus the
five the inventory needs plus `ledger_path`, `ledger_mtime`, `ledger_size`
for freshness. Indexes on (repo_key, updated_at), run_id, and
(repo_key, session_state). `find_by_run_id` becomes an index hit instead of
parse-every-ledger-until-match; `resolve(prefix)` becomes
`WHERE session_id GLOB 'x*' LIMIT 2` — two rows means ambiguous, preserving
exact-wins-over-prefix.

Queries return rows, never sessions: the row type carries no `Arc<Session>`.
`RunInventoryRow` holding the whole parsed session is what forces today's
full parse; the daemon's list shape must make that impossible, not optional.

## Lifecycle

- Socket at `/tmp/ctx-daemon-<uid>-<version>.sock`; version in the path, so
  skew cannot occur. Socket root and uid-scoping reasoning inherited from
  `run_control::runtime_root()`.
- Spawn arbitrated by `flock(daemon.lock, LOCK_EX | LOCK_NB)`: winner spawns
  detached (setsid), loser proceeds without blocking. A connection closed
  during handshake means retry once, spawning if needed.
- Exits when idle (timeout per 0245's ratification) — safe because it holds
  nothing.
- On start: reconcile, never restore. Stat-scan the ledger directories,
  index terminal sessions, and rebuild rows whose (mtime, size) disagree.
  Rebuilding the index IS the recovery mechanism; `rm index.sqlite3` is a
  supported repair.

## The ordering rule (drivers, for 0248 — stated here so the DB design
honors it)

A driver writes its ledger FIRST, durable and unconditional; telling the
daemon is best-effort, non-blocking, droppable. The daemon may cache liveness
but is never authoritative for it — `run_control`'s flock remains the answer,
or a stale daemon lies about live runs.
"""
validation = """
## Watch

- The daemon must hold nothing it cannot rebuild from the ledgers. Any state
  that survives only in daemon memory or only in the DB is a bug by
  definition, not a judgment call.
- rusqlite bundled: one new dependency. Set busy_timeout explicitly; the
  default fails immediately with SQLITE_BUSY.
- InventoryCache's doc comment ("no disk, no invalidation protocol, no second
  store") records the position this deliberately crosses. The justification
  is that the memo dies with the process and every cold CLI command re-pays
  the full parse; say so at the crossing point rather than deleting the
  comment.

## Done when

A daemon spawns on first query, answers list/get/resolve/find-by-run-id/stats
over a scratch store, exits on idle, and a second spawn attempt during the
window joins rather than double-spawns. `rm index.sqlite3` followed by a
query yields identical results via reconcile. A ledger modified behind the
daemon's back is picked up by the next reconcile. Two CLIs of different
versions run two daemons side by side without contention. All proven with
scratch stores and a per-test socket path; no existing surface changes
behavior.
"""

[relations]
depends-on = ["0245"]
