## Binding constraints and exclusions

These bound the outcome regardless of the route taken.

- The three named strings have no producer left anywhere in
  `modules/cli/src`: `run killed; terminal restored`, `run startup
  interrupted; terminal restored`, and `halted — pass
  --continue-on-failure to run the remaining queue anyway`. Nothing loose
  replaces them.
- The ctrl-c and startup-interrupt paths keep every behaviour around the
  deleted lines: immediate process-group kill, terminal restore before any
  further output, discarded startup warning capture, exit 130 for the
  startup interrupt, and the run-view exit path 0252.4 landed.
- The startup interrupt's acceptance is a restored cooked shell with no
  surviving startup frame, no loose prose and exit 130. No panel is
  required or added on that path (content fact 2).
- The final `--task` queue report is emitted as ONE shared-kit panel for
  every non-JSON mode (content fact 5), with this grammar:
  - header product `task queue`, empty headline;
  - one row per ATTEMPTED member, in queue order, label = the task key,
    value = `TaskQueueOutcome::label()` verbatim, tone `Fail` when
    `halts()` and `Pass` otherwise — no second classification;
  - closing state `PanelStatus::Passed("Success")` when no outcome halts,
    `PanelStatus::Blocked("Failure")` when any does — the same vocabulary
    the single-run panel already closes with;
  - when AND ONLY WHEN the queue halted early with at least one member
    never attempted: a `remaining` row carrying that exact count
    (`queue.len() - outcomes.len()`) and a `next` row whose value names
    `--continue-on-failure`. Zero remaining means neither row (parent
    ruling 3);
  - an empty expanded queue still reports: header, no rows, `Success`.
- Every existing per-task outcome text survives the migration verbatim,
  and the pane is still dropped before any report output.
- `--json` output is byte-identical, and the queue's exit mapping is
  unchanged: `AlreadyReported` with `EXIT_RUN_FAILED` (7) whenever any
  outcome halts, exit 0 otherwise. A rendering failure must not silently
  convert a halted queue into a success.
- The task-0198 per-member refusal line (`run.rs:839`) and the run-view
  `q` detach notice (`run_view.rs:1336`) stay exactly as they are
  (content fact 7).
- The three `run tui unavailable; falling back to status progress`
  diagnostics (`command_handlers.rs:522`, `drive.rs:1082`,
  `drive.rs:4867`) keep their count and wording.
- No new renderer: run failure output continues to go through
  `run::failure_panel` / `run_header_from_title` (`run.rs:1812-1833`) and
  the queue panel through `presentation.rs`'s kit. REUSE POINT for both.

## Suggested approach — guidance, not a boundary

### Expected files

- `modules/cli/src/app/tui_ratatui.rs`
- `modules/cli/src/app/run_startup_view.rs`
- `modules/cli/src/app/run.rs`
- `modules/cli/src/app/surface/cli.rs` — the `--continue-on-failure` help
  at `:2367-2369` says outcomes are reported "in a table at the end"; a
  narrow wording fix, nothing else.
- `modules/cli/tests/proof_run_view_exit_teardown.rs`
- `modules/cli/tests/proof_run_startup_progress.rs`
- `modules/cli/tests/proof_task_queue_refusal_teardown.rs`
- `modules/cli/tests/proof_task_queue_pane_handoff.rs`

Touching files beyond this list is legitimate whenever a binding goal
requires it. Do it and report it in the work summary.

### Step 0 — re-read the landed baseline before editing

0252.4 and 0252.8 land first and both move this task's ground. Read
`modules/cli/tests/support/src/lib.rs` (the three helpers, the bounded
readiness wait, the escape-tolerant matcher authority, any fixture 0252.8
added), then `proof_run_view_exit_teardown.rs` end to end, then
`poll_detach` and the run view's first-ctrl-c path as 0252.4 left them.
None of the proof guidance below survives contact if they landed
differently; the goals do.

### Step 1 — delete the two notes

`tui_ratatui.rs`: remove the `eprintln!` in `poll_detach` and correct the
method's doc comment, which currently promises the note. `run_startup_view.rs`:
remove the `eprintln!` at `:193` only — the row marking, `pane.quit()`,
`end_capture()` and `exit(130)` around it all stay. Do not quote either
deleted literal in a replacement comment: Done-when 6's grep scans source
text and a comment reintroduces the string.

### Step 2 — the queue report becomes a panel

`run.rs`. The smallest reuse-oriented shape is to split construction from
emission: a pure builder taking `(&[(String, TaskQueueOutcome)], halted,
queue_len)` and returning a `Panel` built only from `halts()` and
`label()`, plus a caller that emits it with
`emit_human(false, &panel, HumanOutputMode::Compact, || Ok(()))?` from
where `print_task_queue_report` is called today — after the pane drop,
before the `AlreadyReported` return. `.next(PanelRow::toned("next", …,
RowTone::Default))` is the kit's structurally distinct action row and the
existing convention (`lifecycle_handlers.rs:330`). Suggested wording, not
pinned: remaining value `"{n} not attempted"` at `RowTone::Warn`, next
value naming the `--continue-on-failure` rerun.

Splitting the builder out is what makes the tone map, the closing state
and the zero-remaining hint policy provable as `--lib` units next to the
existing `task_queue_drive_tests`, without a PTY. Update the `run.rs`
comments that call the report "plain-text rows" and the `cli.rs` help
that calls it a table.

Build after Steps 1-2:
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

### Step 3 — units beside the code they cover

Tone `Fail` for each halting variant and `Pass` for each non-halting one;
`Failure` close under `--continue-on-failure` with `halted == false` and
a halting outcome present; `Success` close and no rows for an empty
queue; remaining row and next row present for a halt with work left and
ABSENT for a halt with zero remaining; per-task values equal to
`label()`.

### Step 4 — the four PTY proofs

What each must prove is in `validation`; how to observe it is the run's
choice within 0252.8's landed rules (child-produced bounded readiness,
escape-tolerant matching for painted text, helper status out of band, no
filtering of product bytes). Guidance from the grounding:

- `proof_run_startup_progress.rs:500-569` is a bespoke Expect script, not
  a shared helper, and 0252.8 leaves it alone. Keep its exit-130, no
  surviving startup pane, no live `Run Panel`, visible-cursor and cooked
  termios assertions; replace the two note assertions with the absence of
  that string. Do not demand a panel production does not emit.
- `proof_run_view_exit_teardown.rs` hosts the ctrl-c class and, after
  0252.4, already hosts that task's Abort proof (its criterion 5: leave
  the alternate screen first, then exactly one compact failure panel).
  The cheapest route is to extend that landed assertion with the kill
  note's absence rather than to add a second exit test; Done-when 1 names
  the outcome, the run picks the observation.
- `proof_task_queue_refusal_teardown.rs` is the zero-remaining boundary
  for free: its refusal test already drives a SINGLE-member queue
  (`--task 0003`), so a halt there leaves nothing to continue. Its
  `halted — pass …` assertion becomes: the panel closes `Failure`, the
  `0003` row still carries its `failed:` outcome, the task-0198 refusal
  line still precedes it, and no next/continue row appears. Its
  empty-charter test keeps its shape against the empty panel. Note that
  this file's refusal case is not a candidate for a strict "panel output
  only" assertion — 0198's diagnostic legitimately precedes the panel.
- `proof_task_queue_pane_handoff.rs` already owns
  `failing_two_member_queue_fixture` (tasks 0002 and 0003, `cmd = "false"`,
  so both fail). REUSE POINT: drive that same fixture WITHOUT
  `--continue-on-failure` for the remaining-work case — 0002 halts, 0003
  is never attempted, remaining is exactly 1. Do not build a third queue
  fixture. The existing `--continue-on-failure` test keeps proving two
  alternate-screen entries and both member rows.
- Both queue files currently assert `task queue:` and call the report a
  table in comments; update assertions and comments together.

No golden capture and no frozen full-frame inventory. Assert restore
ordering, panel structure and semantic rows, absence of the three old
strings, exit code and cooked termios, from scratch fixtures only.

## Out of scope

- `presentation.rs`, `interrupt.rs`, the signal ladder and rescue path,
  status-progress rendering, JSON serialization, and the three
  `run tui unavailable` fallback diagnostics.
- `modules/cli/tests/support/src/lib.rs`: owned by 0252.8 and consumed
