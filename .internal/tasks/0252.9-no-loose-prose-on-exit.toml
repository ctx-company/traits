## Done when — binding goals, each with the existing command that decides it

1. On the live-pane ctrl-c path 0252.4 landed — the first ctrl-c opens
   the failure modal, `Abort` closes the pane — the alternate screen is
   left BEFORE any output and exactly one compact shared failure panel
   follows the restore, in the existing `run::failure_panel` /
   `run_header_from_title` grammar (session row, error row, `Failure`
   close). The kill note appears nowhere in the captured output, and the
   suite's existing exit-code and no-frame-remnant assertions still hold:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown`
2. A startup interrupt leaves a restored cooked shell with a visible
   cursor, no surviving startup frame, no live run frame, exit 130, and
   no loose prose after the restore — the removed string is asserted
   absent and no panel is required:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_startup_progress`
3. A queue that halts with work remaining reports one shared-kit panel
   carrying every attempted member's outcome, the exact count of
   never-attempted tasks, a next row naming `--continue-on-failure`, a
   `Failure` close and exit 7 — with the old halt sentence and the old
   `task queue:` heading gone. The `--continue-on-failure` run still shows
   two alternate-screen constructions and both member rows:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_task_queue_pane_handoff`
4. A halt with ZERO tasks remaining shows no next/continue row while still
   closing `Failure` with its member outcome, the task-0198 per-member
   refusal line still survives teardown ahead of the panel, and an empty
   expanded queue still reports a panel with no rows and exits 0:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_task_queue_refusal_teardown`
5. The panel's construction rules hold as units — tone `Fail` exactly for
   halting outcomes, closing state driven by the real failure predicate
   rather than `halted` (so `--continue-on-failure` with a failure still
   closes `Failure`), remaining and next rows present only for a halt with
   work left, per-task values equal to `TaskQueueOutcome::label()` — and
   ordinary non-queue run output is unchanged:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib --test proof_output_style`
6. The three prose producers are gone from the product tree and the three
   fallback diagnostics are intact:
   `! rg -n 'terminal restored' modules/cli/src && ! rg -n 'to run the remaining queue anyway' modules/cli/src && test "$(rg -o 'run tui unavailable; falling back to status progress' modules/cli/src | wc -l | tr -d ' ')" = 3 && echo exit-prose-clean`
7. The landing gate is green:
   `CARGO_TARGET_DIR=target just test-full`

Criteria 3 and 4 share one `[[checks]]` entry (one cargo invocation over
both queue targets); the rest carry one each. No check is derived for
"`--json` output is byte-identical" — checks run in a clean detached
worktree of the merged sha with no baseline to diff against, and a source
grep would pass on any rewrite that kept the branch. That one is a
reviewer instruction below.

## Order and bounded refinement

Two things bind. The landing gate runs ONCE, at the end, after the other
criterion commands have passed. And refinement is finitely bounded: at
most two targeted repair-and-rerun rounds in total. A round repairs one
named failure, then reruns the failed command AND every later criterion
command the repair could invalidate. If a third round would be needed,
STOP and report the failing command with its output rather than
continuing. That is the stop condition, not a judgement call.

Everything else about sequencing is suggested. A route the grounding
supports: Step 0's re-read, then Steps 1-4, running
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli` after Step 2 so a
type or borrow error surfaces next to the edit that caused it; then
criterion commands 5, 6, 3, 4, 1, 2, 7 — units and the grep first because
they cost seconds rather than minutes, the gate last. Intermediate
commands (incremental builds, `--lib` name filters, single-test
invocations) are conveniences: run, skip, reorder or substitute them
freely. Report any deviation in the work summary rather than escalating
it.

Before calling the work done, inspect `git status --short` and `git diff`
substantively: only justified files changed; no second outcome
classification or second panel renderer introduced; the pane still
dropped before report output; the 0198 refusal line and the `q` detach
notice untouched; `--json` still returning before the reporter; and no
deleted literal reintroduced inside a comment.

## Watch

The diagnoses below are first hypotheses, not the only permitted ones.
Where a bullet restates a binding goal or exclusion, that part binds; the
causal guess and the suggested repair never do.

- If Done-when 6's grep fails while the code is clean, a comment quoting a
  deleted literal is the likely cause — it scans source text, not
  behaviour. Rewrite the comment; do not weaken the check.
- If a queue proof reports the panel but the wrong closing state, suspect
  the predicate: BINDING is that the close follows
  `outcomes.iter().any(halts)` and the remaining/next rows follow a real
  early halt with work left. `halted` alone answers neither question
  (content fact 6).
- If the refusal proof loses the `ctx run --task 0003:` line, that is a
  task-0198 regression, not a panel cleanup. Restore it; the panel is
  allowed to be preceded by that diagnostic.
- If a proof hangs waiting for painted text, readiness is the cheaper
  suspect than this task's edits: 0252.8's rules bind — child-produced
  bounded readiness, escape tolerance through the landed shared
  authority, never a sleep, never `/dev/tty`.
- On the paths that emit no panel at all — the startup interrupt, and any
  pane that never opted into 0252.4's modal — deleting the note leaves an
  empty restored region. That is the expected shape there: assert absence
  plus restore/termios/exit rather than inventing output. It is NOT an
  alternative outcome for Done-when 1, whose Abort path must show the
  compact failure panel.
- A red `proof_output_style` most likely means the shared failure grammar
  moved. BINDING: that suite is a regression gate for this task, not a
  target.
- If the landed 0252.4 modal makes the first ctrl-c never reach
  `poll_detach`, the note is still deleted — the surviving non-opted-in
  panes are the reason the producer must go, not just the live pane.
