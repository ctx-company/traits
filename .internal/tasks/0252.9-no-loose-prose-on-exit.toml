content = '''
With the live view on the alternate screen (0252.7), an exit already
restores a clean shell. The bare prose one-liners that used to explain a
torn screen are now noise between the prompt and whatever the command
actually reports — the owner does not want them:

- `run killed; terminal restored` (`modules/cli/src/app/tui_ratatui.rs:849`,
  the P551 ctrl-c kill note)
- `run startup interrupted; terminal restored`
  (`modules/cli/src/app/run_startup_view.rs:193`)
- `halted — pass --continue-on-failure to run the remaining queue anyway`
  (`modules/cli/src/app/run.rs:1000`)

## Owner ruling (2026-08-27)

Post-run user-facing output on run-view exit paths is house-grammar
panels or nothing. A loose prose line is never printed around them.

## How to read this plan

Goals and approach are separated, and only goals bind. What binds is
exactly four things: `validation`'s Done-when list with the existing
command that decides each one; the binding constraints and exclusions at
the top of `scope` (including the queue panel's grammar, which is product
output, not a proof mechanic); every REUSE POINT named below (an existing
authority that must not be duplicated — a second copy of the same
classification or grammar is a defect regardless of route); and the finite
repair cap with its single final landing-gate run.

Everything else is the architect's best route from the grounding, not a
boundary: expected files, symbol names and signatures, edit order, which
proof hosts which behaviour, fixture and matcher choices, exact hint
wording, and every diagnostic hypothesis under `Watch`. Deviate from any
of it whenever a goal requires it, and report the deviation in the work
summary — that is not a plan violation, not a finding, and not an owner
escalation.

## Grounded against HEAD 501ad6c0 (0252.4 and 0252.8 not landed here)

Seven facts about the code decide the shape of this work. Several correct
the draft this plan replaces.

### 1. Board order: this task must run after 0252.4, not beside it

0252.4's validation criterion 6 and its third `[[checks]]` entry both run
`rg -q 'run killed; terminal restored' modules/cli/src && echo
kill-note-retained` — the note's PRESENCE is a mandatory gate there, and
its content fact 3 explicitly assigns the deletion to this task. If
0252.9 lands first, 0252.4's check can never pass. `depends-on` therefore
gains `0252.4`; the board order is `0252.8 -> 0252.4 -> 0252.9`.

This is not only a check conflict. 0252.4 rewrites `poll_detach`'s second
stage, the run view and `proof_run_view_exit_teardown.rs`, so every line
anchor and proof name below is stated as it reads at HEAD and must be
RE-READ after 0252.4 and 0252.8 land, before the first edit.

### 2. Removing the startup note leaves NOTHING, and that is the goal

`run_startup_view.rs:174-195` marks the running row `Failed`/`interrupted`,
restores through `pane.quit()`, ends decode-diagnostics capture, prints
the note on stderr, then `std::process::exit(130)`. There is no outcome
panel on this path and this task does not add one: the acceptance is a
restored cooked shell with no surviving startup frame and no loose line,
exit 130 — "panels or nothing" resolving to nothing. The draft's sketch
implying panel output after a startup interrupt was wrong.

Everything else on that path is load-bearing and stays: process-group
kill, exit code, `pane.quit()` restore, the discarded warning capture
(secrecy), and the startup-to-live handoff. Only the `eprintln!` goes.
The unrelated `"run startup interrupted"` ERROR message
(`command_handlers.rs:541`, `drive.rs:1005`) is a different string on a
different path and is untouched.

### 3. The kill note's path is 0252.4's to gate and this task's to delete

The crossterm pump calls `interrupt::request_kill()` immediately on raw
ctrl-c before forwarding the key (`tui_ratatui.rs:642-661`); that stays.
The note lives in the SECOND stage, `poll_detach` (`:823-855`), which
re-requests the kill, marks the pane detached, leaves the alternate
screen and prints. 0252.4 gates that stage for an opted-in live pane;
what survives it — attached observers and any pane that did not opt in —
still reaches the `eprintln!`. This task removes the producer outright, so
those paths restore and say nothing. `poll_detach`'s doc comment
currently promises the note and goes stale with it.

### 4. The queue report is not a panel today — this is a migration

`run.rs:994-1002` is a direct `println!` table: a `task queue:` heading,
one `  {key}: {label}` line per outcome, and the halt sentence. Moving the
sentence "into the queue outcome panel" therefore means building a real
panel through the shared kit, not relocating one string.

The kit is the authority and needs no edit: `Panel::new` / `Panel::row` /
`Panel::next` / `PanelRow::toned` / `PanelStatus` / `emit_human`
(`presentation.rs:171-220`, `631-653`). `PanelRow::toned` sanitizes and
lowercases labels (`:89-99`); `RowTone` is the closed set
`Default|Pass|Fail|Warn` (`:42-63`); `header_text` omits the `·`
separator for an empty headline (`:459-465`), so a product-only header
renders `┌── task queue`. `presentation_for("run")` already declares
`CommandPresentation::Panel` (`:693-738`) — the direct table is the
exception, not a registry gap. REUSE POINT: `presentation.rs` is consumed,
never modified, and no custom ANSI or new tone is justified.

### 5. One reporter serves every non-JSON mode — decided, not left open

`print_task_queue_report` is called once, from `handle_task_queue_run`
(`run.rs:854`), under `if !input.json`. `DriveProgress`
(`surface/cli.rs:2487-2494`) is retained on `TaskQueueInputs` but never
consulted for the final report, so `none`, `status`, `stream` and `tui`
all get the same bytes today.

DECISION: the panel replaces that one reporter for every non-JSON mode.
The draft's exclusion of `--progress status` output covers that mode's
PROGRESS NARRATION — its running interface — not the final queue outcome,
which is post-run output and squarely inside the owner ruling. Branching
the report by progress mode would mean two renderers for one outcome and
would leave the loose sentence alive on the modes the ruling covers.
`--json` is untouched: it never reaches the reporter.

### 6. Halt, failure and "remaining" are three different predicates

`drive_task_queue` (`run.rs:877-894`) pushes exactly one outcome per
ATTEMPTED key and breaks after the first halting outcome unless
`continue_on_failure`. So the exact count of never-attempted tasks is
`input.queue.len() - outcomes.len()`; no second scan and no persisted
state is needed. Three consequences the draft did not settle:

- `halted == true` with ZERO remaining is ordinary — the last or only
  member failed. Parent ruling 3 ("a `next:` row appears only when a real
  action exists") means the continue hint must NOT appear there. Today's
  code prints it unconditionally on any halt; that is the bug this task
  fixes rather than reproduces.
- `halted == false` while halting outcomes exist is ordinary under
  `--continue-on-failure`, and still exits 7 as "task queue completed with
  failures". The panel's CLOSING state must follow the real failure
  predicate `outcomes.iter().any(TaskQueueOutcome::halts)`, not `halted`.
- `TaskQueueOutcome::halts()` and `::label()` (`run.rs:673-703`) are the
  single authorities for classification and per-task wording. REUSE POINT:
  the panel derives both row text and row tone from them; a second match
  on outcome variants is a defect.

`handle_task_queue_run` (`run.rs:773-869`) drops the startup pane BEFORE
any report output, and returns `Error::AlreadyReported` with
`EXIT_RUN_FAILED` (7) so the dispatcher prints no second generic line.
Both invariants stay exactly as they are.

### 7. Two neighbouring loose lines are deliberately NOT in scope

- `run_view.rs:1336` prints `live view closed; run continues - reattach
  with ctx traits dashboard` after a confirmed `q`. That is a detach
  notice while the run keeps going, not post-run outcome output.
- `run.rs:839` prints `ctx run --task {key}: {error}` for a propagated
  queue-member error. Task 0198 deliberately preserves it as diagnosable
  per-member refusal detail, and `proof_task_queue_refusal_teardown.rs:190`
  gates it.

Neither is one of this task's three named removals. Removing either
without a new owner ruling is scope creep, and the second would regress a
landed task.
