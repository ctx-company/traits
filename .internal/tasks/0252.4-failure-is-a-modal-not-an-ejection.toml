schema-version = "0.2"
key = "0252.4"
title = "Failure is a modal, not an ejection"
status = "ready"
raised = "2026-08-24"
content = """
Runs are resumable and re-drivable; the surface must show that instead of
ejecting on every failure. Parent ruling 5.

## The contract, stated once

Every in-scope failure and the first raw-mode ctrl-c in the run view keep
the pane, dim it, show ONE short line, and offer exactly three actions,
always, in this order:

1. `Resume/Retry` — re-drive the SAME session through the existing
   `--session` path.
2. `Restart` — start a FRESH session with the same trait and arguments.
3. `Abort` — close the pane and print `0252.1`'s compact failure panel.

There is no condition under which one of the three is withheld, greyed
out, or replaced. A boundary that makes an action awkward (a terminally
`Failed` session, an explicit `--out`, a named `--worktree`) is resolved by
specifying exactly what that action does — never by removing it. Those
three resolutions are Steps 6a, 6b, and 6c below.

## Scope, resolved against the code

The parent says "ALL fail-or-exit events". The code has three distinct
exit families and they do NOT all mean failure. This task covers exactly
one of them:

- **In scope — terminal non-completion of a driven `ctx traits run` with a
  live inline pane.** Both failure shapes: a non-completed `Ok(DriveReport)`
  (`driver-lock-busy`, `failed`, `command-step-failed`, `harness-failed`,
  `mcp-harness-failed`, timeouts, blocked/invalid harness output, bounds,
  `interrupted`, `killed`, `awaiting-input` after a cancelled prompt) AND a
  propagated `crate::Result::Err` out of `drive` (session read, trait load,
  prompt/schema build, harness spawn, ledger write). Plus the FIRST raw-mode
  ctrl-c in the run view, which opens the modal immediately rather than
  waiting for the drive to drain.
- **Out of scope — deliberate user exits that are not failures.** Confirmed
  `q` (`run_view.rs:1409` confirm → `close_pane_locked`, run continues in
  background) and bare `d` (dashboard handoff) keep today's behavior
  exactly. The task's sentence "No path exits the TUI without either a
  chosen Abort or the double-ctrl-c hatch" is scoped to the failure modal
  itself: once the failure modal is open, Esc and every unrelated key are
  inert and only Resume/Retry, Restart, Abort, or a second ctrl-c can leave
  it.
- **Out of scope — resumable pauses that already print their own guidance.**
  `drive.credits_pause` and `drive.budget_pause` are excluded, which is
  exactly the exclusion `CompletionOutcome::with_human_terminal_failure`
  (`run.rs:1285-1296`) already encodes; this task reuses that predicate
  rather than inventing a second failure classifier.

Every other caller of `drive` — `ctx traits internal drive --session`
(`command_handlers.rs:1339`), `generate.rs:568`, dashboard-spawned
`--progress none` drives — is byte-unchanged, because the whole feature is
gated behind one new opt-in field that only `run::drive_session` sets. This
matters for correctness, not tidiness: a caller that shows the modal but
never reads the choice would hang the pane forever.

## Dependencies actually consumed

- `0252.3` (declared): `Modal::buttons(title, body, Vec<Button>)`,
  `Button::new`, `.destructive()`, `ModalOutcome::Chosen(String)`. NOT
  present at HEAD — **Step 0 re-reads the landed shape before any code is
  written.** `tui_kit.rs` itself is not edited by this task; 0252.3 states
  that failure-modal backdrop dimming belongs here, so the dim call goes at
  the run-view render site, not inside `render_modal`.
- `0252.1` (declared): `run::failure_panel`, `run::run_header_from_title`,
  `presentation::Panel`, `presentation::emit_human`. Abort prints through
  those helpers only — no new panel grammar.
- `0252.2` (NOT added to relations): its implementation is already at HEAD
  (`b4671454`) even though the board row still says `ready`, so this task
  reuses `interrupt::arm_rescue_panel`, `rescue_terminal_signal_safe`, the
  generation gate, and `proof_run_view_exit_teardown.rs` with no board
  dependency to add. The SIGINT ladder in `handle_sigint` is deliberately
  left unchanged, so 0252.2's three-signal proof stays valid.
- `0243.5` pause: not depended on. Resume/Retry rides today's
  `interrupt::reset` + existing-session `drive` path.

## Architecture: where the choice is made and where it is honored

Two seams, because the ctrl-c requirement and the re-drive requirement live
at different levels:

1. **The pane decides.** The run pane owns the modal and records the chosen
   `FailureChoice` in a leaf-locked slot the moment the user presses a
   button — possibly while the drive thread is still draining a killed
   harness. This is what makes the first ctrl-c instant.
2. **`run::drive_session` honors it**, after `drive()` has fully returned.
   By then `record_drive_outcome` has persisted the outcome and
   `drop(driver_lock)` has released the driver lock and control socket
   (`drive.rs:1485-1529`), so a same-session Resume/Retry cannot race the
   invocation that just owned the ledger and come back `driver-lock-busy`.
   On the propagated-`Err` shape `drive` returns before
   `record_drive_outcome`, but `driver_lock` is a plain local acquired at
   `drive.rs:1205` and released by its own drop on that early return, so
   the same no-race guarantee holds there too.

The pane therefore has to survive `drive()`'s return. Today
`RunPanelGuard::drop` closes it on every non-`Completed` exit
(`drive.rs:1915-1922`, `2294-2315`) — that is the ejection seam. The guard
gains an optional release handoff instead of a second exit path.

**Lock order, stated once and obeyed everywhere.** The panel state mutex is
the OUTER lock; the failure-choice slot mutex is a LEAF. The key handler
holds the state lock and takes the leaf lock to publish a choice. The
drive-side waiter takes the leaf lock only inside
`FailureChoiceSlot::take_timeout`, which returns an owned value with its
guard already dropped, and only THEN takes the state lock via
`RunPanel::active`. No path ever holds the leaf lock while taking the state
lock.

## Files touched (repo-relative, nothing else)

- `modules/cli/src/app/interrupt.rs`
- `modules/cli/src/app/tui_ratatui.rs`
- `modules/cli/src/app/run_view.rs`
- `modules/cli/src/app/run_view/render.rs`
- `modules/cli/src/app/drive.rs`
- `modules/cli/src/app/run.rs`
- `modules/cli/src/app/command_handlers.rs`
- `modules/cli/src/app/generate.rs`
- `modules/cli/tests/proof_run_view_exit_teardown.rs`

`tui_kit.rs` is deliberately NOT touched (0252.3 owns it; `dim_backdrop`
already exists at `tui_kit.rs:886` and is called from the run view).
`dashboard.rs`, `trait_editor.rs`, `tui_demo.rs` are NOT touched — their
panes use `CtrlCPolicy::ForwardKey` and never arm escalation.

## Step 0 — re-read the landed dependency (no edits)

Read `tui_kit.rs`'s `Button`, `ButtonRow`, `Modal::buttons`, and
`ModalOutcome::Chosen` as 0252.3 actually landed them, plus
`apply_open_modal_key` (`run_view.rs:1320-1352`), which 0252.3 already
extended with a `ModalOutcome::Chosen(_) => {}` arm. This task replaces
that arm's comment and body. Do not code against the pre-0252.3 shape
quoted anywhere in this plan.

## Step 1 — one hard-escape body (`interrupt.rs`)

New symbol:

- `pub(crate) fn hard_escape() -> !` — `rescue_terminal_signal_safe();`
  then `unsafe { libc::_exit(130) }`. Nothing else: no formatting, no
  allocation, no lock, no crossterm, no ratatui. It is called both from the
  `SIGINT` handler and from the input-pump thread, so it must stay
  async-signal-safe even though the pump is an ordinary thread — the pump
  must be able to escape while the run-panel mutex is held by a wedged
  render thread.

Changed symbol:

- `extern "C" fn handle_sigint(_signal: i32)` (`interrupt.rs:183-193`): the
  `count >= 3` arm calls `hard_escape()` instead of inlining
  `rescue_terminal_signal_safe()` + `_exit(130)`. Behavior byte-identical —
  the ladder (1 = graceful, 2 = rescue, 3 = rescue + 130) is NOT changed,
  which is why `repeated_sigint_leaves_only_the_interrupted_failure_panel`
  keeps passing untouched. Do NOT add `kill_active_process_group()` here;
  that belongs only to `handle_sigterm`.

`arm_rescue_panel`, the generation gate, `CLEAR_VIEWPORT_ESCAPE`,
`FULL_RESTORE_ESCAPE`, and the 4096-byte buffer are reused as-is and not
modified.

## Step 2 — per-pane ctrl-c escalation (`tui_ratatui.rs`)

The escalation is opt-in per pane, not a policy rewrite. `CtrlCPolicy`
keeps both existing variants and their meanings; startup, dashboard, demo,
and editor panes are untouched because they never arm.

New symbols:

- `#[derive(Default)] struct CtrlCEscalation { armed: AtomicBool, count: AtomicUsize }`
  with a doc comment naming 0252.4: `armed` is set only by the run panel;
  `count` is per-pane ctrl-c presses since the last reset.
- `PumpControl` (`tui_ratatui.rs:245`) gains one field:
  `ctrl_c: CtrlCEscalation`. Every existing `PumpControl { .. }` literal
  adds exactly one line `ctrl_c: CtrlCEscalation::default(),` — at
  `tui_ratatui.rs:637`, `:763`, and the five test literals at `:1401`,
  `:1431`, `:1470`, `:1523`, `:1572`. `Default` is deliberately correct
  (unarmed, zero) for all seven.
- `impl RatatuiPane`:
  - `pub(crate) fn arm_ctrl_c_escalation(&self)` — stores `armed = true`
    and `count = 0`.
  - `pub(crate) fn reset_ctrl_c_count(&self)` — stores `count = 0`; called
    whenever a new attempt begins on a reused pane, so a Resume/Retry never
    inherits a spent press budget.
  - `#[cfg(test)] pub(crate) fn ctrl_c_count(&self) -> usize`.

Changed symbols:

- The pump thread's `Event::Key` ctrl-c branch (`tui_ratatui.rs:714-729`).
  Order, all inside the existing `ctrl_c` condition:
  1. if `pump.ctrl_c.armed` and
     `pump.ctrl_c.count.fetch_add(1, SeqCst) + 1 >= 2` →
     `crate::app::interrupt::hard_escape()` (diverges; never returns, never
     forwards). This is the ONLY escalation site, and it lives on the pump
     thread precisely because it is the one reader that keeps running when
     the render thread or the panel mutex is stuck.
  2. the existing `ctrl_c_policy == CtrlCPolicy::RequestStop` →
     `interrupt::request_kill()` call, unchanged. The FIRST ctrl-c still
     SIGKILLs the active harness/setup process group: Resume/Retry,
     Restart, and Abort all require the current drive to stop, and a
     cooperative `request_stop` would leave the modal floating over a run
     that keeps burning through a ten-minute harness call.
  3. forward the key as today.
- `pub(crate) fn poll_detach(&mut self) -> Vec<KeyEvent>`
  (`tui_ratatui.rs:900-918`): signature unchanged. Its ctrl-c arm becomes
  conditional — when `self.pump.ctrl_c.armed` is set, push the key into
  `unhandled` and `continue` (the run view opens its modal); when it is
  NOT set, the existing `request_kill` + `self.detached = true` +
  `self.leave()` + `eprintln!("run killed; terminal restored")` + early
  return is preserved verbatim. That literal string must still exist in
  `tui_ratatui.rs` after this task — it is the proof the unarmed path was
  gated, not deleted. Update the method's doc comment (`:885-899`) to state
  both paths.

Build before continuing, with exactly this command:
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

## Step 3 — the failure modal on the run pane (`run_view.rs`)

New symbols:

- `#[derive(Clone, Copy, Debug, PartialEq, Eq)] pub(crate) enum FailureChoice { Resume, Restart, Abort }`
- `const FAILURE_RESUME_ID: &str = "resume";`,
  `const FAILURE_RESTART_ID: &str = "restart";`,
  `const FAILURE_ABORT_ID: &str = "abort";`
- `const FAILURE_MODAL_TITLE: &str = "Run stopped";`
- `const FAILURE_INTERRUPT_REASON: &str = "interrupted";` — the one-line
  body used when ctrl-c opens the modal before any drive outcome exists.
- `const FAILURE_CHOICE_POLL: std::time::Duration = std::time::Duration::from_millis(250);`
- `fn failure_choice_from_id(value: &str) -> Option<FailureChoice>` — pure,
  the exact mirror of 0252.3's `archive_choice` precedent, so a relabelled
  button can never silently become an unknown choice.
- `fn failure_modal_widget(reason: &str) -> tui_kit::Modal` —
  `tui_kit::Modal::buttons(FAILURE_MODAL_TITLE, reason.to_string(), vec![...])`
  with EXACTLY three buttons, unconditionally, in this order:
  `Button::new("Resume/Retry", FAILURE_RESUME_ID)`,
  `Button::new("Restart", FAILURE_RESTART_ID)`,
  `Button::new("Abort", FAILURE_ABORT_ID).destructive()`. Focus therefore
  starts on the least destructive action. There is no offer type, no
  conditional button, and no session or option is consulted here — the
  three-action contract is a constant of this widget. `reason` is one line;
  the caller normalizes it (Step 6).
- `#[derive(Default)] struct FailureChoiceSlot { chosen: Mutex<Option<FailureChoice>>, ready: Condvar }`
  with exactly four methods, all leaf-locking and none taking any other
  lock:
  - `fn record(&self, choice: FailureChoice)` — locks, stores, drops the
    guard, `ready.notify_all()`.
  - `fn peek(&self) -> Option<FailureChoice>` — locks, copies, drops.
  - `fn clear(&self)` — locks, sets `None`, drops.
  - `fn take_timeout(&self, wait: std::time::Duration) -> Option<FailureChoice>`
    — locks, `Condvar::wait_timeout_while(guard, wait, |slot| slot.is_none())`,
    `slot.take()`, then RETURNS the owned value, dropping the guard at
    return. A poisoned leaf mutex returns `Some(FailureChoice::Abort)` so
    the waiter can never spin on a dead pane.
- `RunPanel` gains one field: `failure: Arc<FailureChoiceSlot>`, built in
  `new` (`run_view.rs:392`), `new_with_pane` (`:407`), and `new_observer`
  (`:537`), and cloned with the rest (`RunPanel` is already `Clone` over
  `Arc`s).
- `RunPanelState` gains three fields:
  - `failure: Arc<FailureChoiceSlot>` — **the same `Arc` the owning
    `RunPanel` holds**, cloned into the state at construction. This is what
    lets `apply_open_modal_key`, which only ever sees `&mut RunPanelState`,
    publish into the exact slot `RunPanel::wait_failure_choice` awaits. No
    signature change to `apply_open_modal_key` is needed or permitted.
  - `failure_modal: bool` — `true` exactly while `state.modal` holds the
    failure modal. One discriminator, same slot, the same shape
    `pending_input_reply` already uses to distinguish the text prompt from
    the `q` confirm.
  - `failure_modal_enabled: bool` — set by `enable_failure_modal`; while
    false, ctrl-c never opens a modal and the pane behaves as today.
- `fn open_failure_modal_locked(state: &mut RunPanelState, reason: &str)` —
  the single definition both entry points share, in this order:
  1. return immediately when `!state.failure_modal_enabled`;
  2. return immediately when `state.failure_modal` is already `true` — the
     modal's body and button focus are written ONCE, when it opens. A later
     call (the drive returning its real reason after a ctrl-c already
     opened the modal on `FAILURE_INTERRUPT_REASON`) must not rewrite text
     or reset focus under the user's fingers mid-choice;
  3. return immediately when `state.failure.peek().is_some()` — a choice is
     already recorded and the modal must not reappear over it;
  4. `if let Some(reply) = state.pending_input_reply.take() { let _ = reply.send(None); }`
     — a missing-input prompt being replaced must release the drive thread
     blocked on `recv`, or the failure continuation is never reached;
  5. `state.modal = Some(failure_modal_widget(reason));`
     `state.failure_modal = true;` `render_locked(state);`
- `impl RunPanel`:
  - `pub(crate) fn enable_failure_modal(&self)` — locks state, sets
    `failure_modal_enabled = true`, calls
    `state.repaint.arm_ctrl_c_escalation()`. Called only by
    `drive::create_run_panel` when the caller opted in (Step 5). This is
    the explicit startup→run-view handoff transition: the startup pane is
    never armed, so `poll_startup_interrupt` (`run_startup_view.rs:162-196`)
    is byte-unchanged.
  - `pub(crate) fn open_failure_modal(&self, reason: &str)` — locks state,
    delegates to `open_failure_modal_locked`.
  - `pub(crate) fn failure_modal_open(&self) -> bool`
  - `pub(crate) fn clear_failure_modal(&self)` — locks state, clears
    `state.modal` and `state.failure_modal`, calls `state.failure.clear()`
    and `state.repaint.reset_ctrl_c_count()`, renders. Used before a
    Resume/Retry re-drive and when a drive completed despite an open modal.
  - `pub(crate) fn wait_failure_choice(&self) -> FailureChoice` — uses
    `self.failure` directly (never the state lock) to await a choice:
    ```
    loop {
        if let Some(choice) = self.failure.take_timeout(FAILURE_CHOICE_POLL) {
            return choice;
        }
        if !self.active() {
            return FailureChoice::Abort;
        }
    }
    ```
    **Bounded**: `take_timeout` returns its owned value with the leaf guard
    already dropped, so `active()` (which takes the state lock) can never
    invert the order; a pane that went detached (terminal hung up, panic
    hook tore it down) yields `Abort` rather than blocking forever. This is
    the loop's stop condition when there is no human left to answer.
  - `pub(crate) fn active(&self) -> bool` — `!state.repaint.detached()`,
    `false` when the state lock is poisoned.

Changed symbols:

- `fn apply_open_modal_key(state: &mut RunPanelState, key: &KeyEvent) -> bool`
  (`run_view.rs:1320-1352`). Signature unchanged. A new branch goes FIRST,
  before the existing `match modal.handle_key(key)`:

  ```
  if state.failure_modal {
      if let tui_kit::ModalOutcome::Chosen(id) = modal.handle_key(key)
          && let Some(choice) = failure_choice_from_id(&id)
      {
          state.modal = None;
          state.failure_modal = false;
          state.repaint.reset_ctrl_c_count();
          state.failure.record(choice);
      }
      return true;
  }
  ```

  `state.failure.record` is the ONLY publication site and it runs while the
  state lock is held — the outer-then-leaf order the architecture section
  fixes. Everything else — `Cancelled` from Esc, `Pending`, `q`, arrow keys
  that only move focus — leaves the modal open and consumes the key. Esc
  must NOT reach the existing `Cancelled` arm: that arm clears the modal,
  which would be a hidden exit from the failure state. The existing
  `Confirmed` / `Cancelled` / `Submitted` / `Chosen(_)` arms below are
  unchanged and now handle only the `q` confirm and the text prompt.
- `fn poll_and_apply_keys(state: &mut RunPanelState) -> bool`
  (`run_view.rs:1353-1418`). Immediately after
  `let keys = state.repaint.poll_detach();`, inside the `for key in keys`
  loop and **before** `apply_open_modal_key`, intercept ctrl-c:

  ```
  if key.code == KeyCode::Char('c') && key.modifiers.contains(KeyModifiers::CONTROL) {
      open_failure_modal_locked(state, FAILURE_INTERRUPT_REASON);
      changed = true;
      continue;
  }
  ```

  It must precede the modal router, the guide router, and
  `live_view_key_action`, so a ctrl-c struck while the `q` confirm, the
  missing-input prompt, or the guide is open still opens the failure modal
  instead of being eaten as `Pending` or as guide text.
- `fn close_pane_locked` is NOT changed. `RunPanel::close` idempotence,
  the scrollback commit, `RatatuiPane::draw`'s detached guard, and
  `arm_rescue_panel_locked` are all untouched.
- Update the stale doc comment at `run_view.rs:1289-1297`, which currently
  says ctrl-c is "already handled inside `poll_detach` as an instant kill".

## Step 4 — dim the backdrop, only for this modal (`run_view/render.rs`)

- `struct LiveFrame<'_>` gains `dim_backdrop: bool`.
- `render_locked` (`render.rs:34-114`) reads `state.failure_modal`
  alongside `state.modal` and passes `dim_backdrop: state.failure_modal`.
  It caches teardown tree lines only, exactly as today — modal pixels are
  still not cached, so a hard kill shows 0252.2's rescue panel, not a
  half-drawn modal.
- `render_live_panes` (`render.rs:421-480`): in the existing
  `if let Some(modal) = modal` arm, call
  `tui_kit::dim_backdrop(frame, full_area);` before
  `tui_kit::render_modal(frame, full_area, modal);` when the new flag is
  set. This is the ordering `render_conversation_modal`
  (`tui_kit.rs:1113-1118`) already documents: dim the whole area first,
  then `Clear`+draw the modal at full brightness. `dim_backdrop`
  (`tui_kit.rs:886-893`) strips BOLD and paints no background, so the
  palette doctrine holds and the generic `render_modal` stays undimmed for
  every other caller.

