- `fn print_error_failure_panel(session: &ctx_traits_core::procedure::session::Session, ledger_path: &camino::Utf8Path, reason: &str, verbose: bool) -> crate::Result<()>`
  — `let (product, headline) = run_header(session, ledger_path);` then
  `crate::app::presentation::emit_human(false, &failure_panel(&product, &headline, session.session_id.as_str(), reason), mode, || Ok(()))`
  with `mode` = `Verbose` under `--verbose`, else `Compact`. This is
  0252.1's panel and nothing else — the same `failure_panel`
  (`run.rs:1818`) and the same `run_header` (`:1802`) that
  `print_final_output` uses for the `Ok(DriveReport)` shape. `Compact` never
  invokes the detail closure (`presentation.rs:635-652`), which is why the
  closure is `|| Ok(())`: there is no `DriveReport` to detail.
- `#[derive(Clone, Copy, Debug, PartialEq, Eq)] struct FreshRunOverrides<'a> { out: Option<&'a str>, worktree: Option<Option<&'a str>> }`
- `fn restart_overrides<'a>(out: Option<&'a str>, worktree: Option<Option<&'a str>>) -> FreshRunOverrides<'a>`
  — the collision-safe transformation (Step 6b). Pure, takes the two
  fields rather than the whole struct, directly unit-testable.
- `fn restart_notices(out: Option<&str>, worktree: Option<Option<&str>>) -> Vec<String>`
  — one line per transformation actually applied; empty when neither
  applies. Pure.
- `struct ResumeHandoff { session_arg: String, session_path: camino::Utf8PathBuf, last_session: ctx_traits_core::procedure::session::Session, panel: crate::app::run_view::RunPanel }`
- `enum AttemptOutcome { Finished(Box<CompletionOutcome>), Resume(ResumeHandoff), Restart }`
- `fn drive_session_attempt(input: &SessionStartInputs<'_>, json: bool, assignment_overrides: &[String], startup: Option<crate::app::run_startup_view::StartupView>, resume: Option<ResumeHandoff>, restart: bool) -> crate::Result<AttemptOutcome>`

Changed symbol:

- `fn drive_session(input: SessionStartInputs<'_>) -> crate::Result<CompletionOutcome>`
  (`run.rs:453-647`). Type signature unchanged (the binding becomes
  `mut input`). Keeps its preflight (`guard_runtime_acceptance`, the
  `--master` rejection, `split_trailing_json_flag`, `assignment_overrides`)
  executed **once**, then:

  ```
  let mut startup = input.startup.take();   // consumed by attempt 1 only
  let mut resume: Option<ResumeHandoff> = None;
  let mut restart = false;
  loop {
      match drive_session_attempt(&input, json, &assignment_overrides, startup.take(), resume.take(), restart)? {
          AttemptOutcome::Finished(outcome) => return Ok(*outcome),
          AttemptOutcome::Resume(handoff) => resume = Some(handoff),
          AttemptOutcome::Restart => restart = true,
      }
  }
  ```

  `restart` latches: once a fresh session has superseded the original
  `--out`/named-worktree intent, every later attempt keeps the same
  collision-safe overrides. Termination: every iteration past the first
  requires an explicit human button press, and `wait_failure_choice`
  returns `Abort` on a dead pane. `Finished` covers completion, Abort, and
  every non-TUI path. The loop is entirely inside `drive_session`, so
  `--task` queue members (`run.rs:773-845`, which build
  `SessionStartInputs` in a per-task closure) still see exactly one
  `CompletionOutcome` per queued task and the queue cursor cannot
  double-advance.

`drive_session_attempt` is today's `drive_session` body from
`start_run_session` down, with the changes below.

### 6a — Resume/Retry, including a terminally `Failed` session

Resume/Retry ALWAYS re-drives the same session id through the existing
resume primitive: skip `start_run_session`, reuse the carried
`session_arg`/`session_path`, and pass `execution_dir: None` so `drive`'s
`resolve_resume_worktree` (`drive.rs:1739-1793`) restores and verifies the
recorded worktree provenance itself. No id is minted, no worktree is
re-resolved, no core transition is copied.

A persisted `Session::status == Failed` is NOT a reason to withhold the
button. It is re-driven exactly like any other status; `drive_loop`'s
`Status::Failed` arm (`drive.rs:2311-2315`) returns a `failed` report
promptly, `drive_session_attempt` classifies it as failing again, and the
modal reopens on the SAME one-line reason. That is the honest outcome — a
re-drive that reports the same terminal state — and it costs one drive
round-trip, not a lie in the button row. The loop stays bounded because
each reopening requires another human press.

### 6b — Restart, collision-safe by construction

Restart ALWAYS starts a fresh session through `start_run_session` /
`io::run::start` (`modules/io/src/run.rs:947-980`), which mints the new
session and run ids. Two invocation options would make literal reuse
destructive, so `restart_overrides` transforms exactly those two and
nothing else:

- `out`: always `None` for a restart attempt. An explicit `--out` names the
  file `write_output_path` (`modules/io/src/run.rs:4165-4171`) writes the
  session document to; reusing it would overwrite the previous session's
  ledger, destroying the very run the user just chose not to abort. The
  fresh session therefore writes to its own default session-store path
  (`session_store_path(session_store, session_id)`), and the previous
  ledger at `--out` is left intact.
- `worktree`: `None` stays `None`; `Some(None)` stays `Some(None)`;
  `Some(Some(name))` becomes `Some(None)`. `prepare_worktree`
  (`modules/io/src/worktree.rs:246-255`) hard-errors with "a new run cannot
  reuse an existing worktree" when the id is already registered, so reusing
  an explicit name would abort the restart outright. Degrading to the bare
  flag preserves the "run in a worktree" intent and lets
  `derive_worktree_id(session_id)` derive a distinct id from the NEW
  session id — collision-free by construction, using existing code and no
  invented naming scheme.

Every other field of `RunInputs` is passed through unchanged, so the trait,
file, inputs, sets, assignments, resource root, trait args, and merge rung
are byte-identical to attempt 1. Neither transformation is silent:
`restart_notices` emits one `eprintln!` line per applied transformation
before `start_run_session` runs, naming the ignored flag and where the
previous run's ledger/worktree still is.

### 6c — Abort, one panel, both failure shapes

Abort closes the pane first (committing the last frame to scrollback and
restoring the terminal), then prints 0252.1's compact failure panel exactly
once:

- `Ok(DriveReport)` shape: fall through to today's untouched path with
  `merge_live_for_completion(None, ..)`; `print_final_output`
  (`run.rs:1659-1699`) sees `!run_completed` and emits `failure_panel`
  once, exactly as it does today for a non-TUI failure. `proof_output_style`
  therefore keeps passing untouched.
- `crate::Result::Err` shape: call `print_error_failure_panel(&final_session,
  &merge_session_path, &error_modal_reason(&error), input.verbose)?` and
  return
  `Err(crate::Error::AlreadyReported { message: error.to_string(), exit_code: 1 })`.
  `AlreadyReported` is the existing suppression mechanism — the dispatcher
  maps it straight to `ExitCode::from(exit_code)` without printing
  (`command_handlers.rs:179-183`) — so the generic `render_error` line is
  suppressed and the panel is the only output. `exit_code: 1` is
  deliberately `ExitCode::FAILURE`'s value: this path must keep today's
  propagated-error exit status, not adopt one of the 3/4/5/7 run/merge
  codes.

Every non-Abort path prints nothing: Resume/Retry and Restart return before
`loaded_trait`, `merge_live_for_completion`, `complete_after_drive`, and
every print, so no intermediate failure panel is ever emitted. A failing
attempt with NO live panel (status / `--no-tui` / `--json` / degraded TUI)
takes today's path byte-identically, including the propagated `Err`, which
still reaches the generic renderer.

### 6d — the attempt body, in strict order

1. **Ledger path first.** Move the existing
   `merge_session_path = outcome.session_path.clone().ok_or_else(..)?`
   derivation (`run.rs:565-573`) to immediately after `start_run_session`,
   BEFORE `drive` is called. It reads only pre-drive state, it is
   unreachable for a driven non-ephemeral session, and hoisting it removes
   the last fallible post-drive operation that would otherwise run before
   the panel is guarded — and gives the `Err` branch a ledger path for its
   panel header. On a resume attempt it comes from
   `ResumeHandoff::session_path` instead.
2. **Start or resume.** When `resume` is `None`, call `start_run_session`
   exactly as today (with `out`/`worktree` from `restart_overrides` when
   `restart` is set, after emitting `restart_notices`) and derive
   `session_arg`/`session_path`/`execution_dir` from its `StartOutcome`.
   When `resume` is `Some`, skip `start_run_session` entirely per 6a. A
   resume attempt is unreachable under `--json` (no TUI pane exists there),
   so the JSON envelope's `resource_supported` still comes from a
   `StartOutcome`; assert that with `debug_assert!(!json)` on the resume
   branch and pass `false` there.
3. **Opt in.** The `DriveInputs` literal (`run.rs:517-537`) sets
   `failure_modal: input.progress == cli::DriveProgress::Tui && !json,` and
   `live_panel: resume_panel,` (the panel moved out of the handoff before
   this statement). `drive` is bound through `let drive_result = ...;` —
   NOT `?` — so a propagated `Err` can still be offered the modal.
4. **Guard the pane, first statement after `drive` returns.**
   `let mut panel_guard = crate::app::drive::RunPanelGuard::new(panel_handoff.take(), None);`
   No fallible operation may appear between `drive`'s return and this
   statement. `release: None` means the guard closes on drop, which is the
   deterministic-close guarantee for every `?` below.
5. **Re-read the final session** exactly as today
   (`ctx_traits_io::run::status(..).map(..).unwrap_or(fallback)`), where
   `fallback` is `outcome.session` on a start attempt and
   `ResumeHandoff::last_session` on a resume attempt. Infallible by
   construction.
6. **Classify and explain, split by shape:**
   ```
   let failing = match &drive_result {
       Ok(report) => human_terminal_failure(&final_session, report),
       Err(_) => true,
   };
   let reason = match &drive_result {
       Ok(report) => failure_modal_reason(&final_session, report),
       Err(error) => error_modal_reason(error),
   };
   ```
7. **The choice point.** Scoped so the immutable borrow of `panel_guard`
   ends before any `take()`:
   ```
   let choice = if failing {
       match panel_guard.panel() {
           Some(panel) if panel.active() => {
               panel.open_failure_modal(&reason);
               Some(panel.wait_failure_choice())
           }
           _ => None,
       }
   } else {
       if let Some(panel) = panel_guard.panel() {
           panel.clear_failure_modal();
       }
       None
   };
   ```
   The `!failing` arm covers the ctrl-c-then-completed race: a recorded
   choice and a stale modal are both cleared before today's path resumes.
8. **Act on the choice:**
   - `Some(FailureChoice::Resume)` → take the panel out of the guard,
     `panel.clear_failure_modal()`, then
     `return Ok(AttemptOutcome::Resume(ResumeHandoff { session_arg, session_path: merge_session_path, last_session: final_session, panel }));`
   - `Some(FailureChoice::Restart)` → take the panel out of the guard,
     `panel.close()`, `return Ok(AttemptOutcome::Restart);`
   - `Some(FailureChoice::Abort)` → take the panel out of the guard and
     `panel.close()` NOW, so the terminal is restored before any print.
   - `None` → when `failing`, take and `close()` any panel the guard still
     holds (an inactive pane, or no pane at all); when `!failing`, LEAVE the
     panel in the guard.
9. **Unwrap the drive result:**
   ```
   let drive = match drive_result {
       Ok(report) => report,
       Err(error) => {
           if matches!(choice, Some(FailureChoice::Abort)) {
               print_error_failure_panel(&final_session, &merge_session_path, &reason, input.verbose)?;
               return Err(crate::Error::AlreadyReported { message: error.to_string(), exit_code: 1 });
           }
           return Err(error);
       }
   };
   ```
10. **Today's tail, unchanged**, except that the panel now comes from the
    guard: `merge_live_for_completion(panel_guard.take(), ..)` replaces
    `merge_live_for_completion(panel_handoff.take(), ..)` at
    `run.rs:574-579`. Keeping the panel inside the guard until this exact
    call is what preserves deterministic close across the `loaded_trait?`
    and `complete_after_drive?` sites between it and step 8. Everything
    from `loaded_trait` through `print_final_output`, the merge report, and
    the story hook is byte-identical; the function returns
    `Ok(AttemptOutcome::Finished(Box::new(completion)))`.

**Accepted, named consequences.** A Restart attempt has no `StartupView`
(it was consumed by attempt 1), so `run::start` narrates its init phases to
stderr above the new pane — the same output a `--progress tui` run without
a startup pane already produces. A Resume/Restart leaves the previous
attempt's committed scrollback above the new frame; that is honest evidence
of the attempt, not wreckage. `drive` records `last_drive_outcome` per
invocation, so the ledger keeps only the most recent conductor outcome —
continuation evidence is the retained session id plus the advanced frame
cursor, which is what the proof asserts.

