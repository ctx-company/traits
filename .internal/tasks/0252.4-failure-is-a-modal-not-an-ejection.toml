schema-version = "0.2"
key = "0252.4"
title = "Failure is a modal, not an ejection"
status = "draft"
raised = "2026-08-24"
content = """
Runs are resumable and re-drivable; the surface must show that instead of
ejecting on every failure. Parent ruling 5.

## The contract, stated once

Every in-scope failure and the first raw-mode ctrl-c in the run view keep
the pane, dim it, show ONE short line, and offer exactly three actions,
always, in this order:

1. `Resume/Retry` — re-drive the SAME session through the existing
   `--session` path.
2. `Restart` — start a FRESH session with the same trait and arguments.
3. `Abort` — close the pane and print the compact failure panel.

## Rewritten after the 2026-08-27 post-mortem (session 28f2ba9f22)

The previous ready plan burned a 12-hour budget at 53 review rounds
without landing. Every permanent blocker traced to things outside the
task: a shared PTY-helper baseline the plan forbade touching (now owned
by 0252.8), a stale-baseline clippy failure (already fixed on current
main), an infeasible `/dev/tty` readiness step, and a contract conflict
with 0252.2 that waited on an owner ruling nothing surfaced. All are
settled below so this run can land unattended. This task runs after
0252.8 (truthful PTY helper) and 0252.7 (live view on the alternate
screen) in the same queue; the plan builds on both being landed.

## Owner rulings, settled 2026-08-27 — decisions, not open questions;
the run must not re-litigate or escalate them

1. Base architecture: the live view renders on the alternate screen
   (0252.7). The failure modal renders inside that alternate-screen
   pane. Abort leaves the alternate screen and prints the compact
   failure panel on the restored normal screen.
2. Rescue-last means last PRODUCT output. 0252.2's lock-free
   signal-path hard-escape stays exactly as landed and is out of scope
   to modify. Proofs assert product bytes only; test-helper metadata is
   out-of-band per 0252.8 and is never a finding.
3. Readiness in proofs is the post-spawn run-view marker via 0252.8's
   bounded helper wait. The `/dev/tty` readiness-token design is dead.
4. Expected-file lists in the plan are guidance, not a boundary: when a
   named Done-when requires touching a file beyond the list, do it and
   report it in the work summary.
"""
scope = """
## Scope

- The failure modal itself: in-scope failure classes and the first
  raw-mode ctrl-c keep the pane, dim it, one short line, three actions
  in the fixed order, keyboard selection per the 0252.3 button grammar.
- Resume/Retry wiring through the existing `--session` re-drive path;
  Restart wiring through a fresh session with identical trait and
  arguments; Abort teardown to the compact failure panel on the normal
  screen.
- Representative proofs only — one per behavior class: an in-scope
  failure shows the modal; first ctrl-c shows the modal; Resume
  re-drives the same session; Restart starts a fresh session; Abort
  restores the shell and prints the panel. No permutation battery
  across failure kinds, timings, or interleavings — the contract
  ceiling is the five named classes.

## Explicitly excluded (owner ceiling — findings here are advisory
board material, never blocker cells)

- Second-ctrl-c and signal-path behavior: owned and landed by 0252.2;
  its hard-escape contract is untouchable here.
- PTY-helper behavior: owned by 0252.8; this task consumes it.
- Every-panic and exotic-exit coverage: parent ruling stands ("I don't
  care about every single panic for now").
- Dashboard-side actions (delete/archive/action registry): 0252.5 and
  0252.6.

## Landing discipline

- The full landing gate runs once at the end (`CARGO_TARGET_DIR=target
  just test-full`). A baseline failure that predates this task's own
  diff is reported with evidence and does not block merging this task's
  green work.
"""
validation = """
## Watch

- The excluded list is an owner ceiling. A finding in an excluded area
  is advisory, never a blocker cell.
- The reviewer verifies the five representative proofs and the modal
  contract; "take as many rounds as it needs" applies to closing the
  named contract, not widening it.
- The settled rulings in content are final for this run; escalation is
  not a path for re-opening them.

## Done when (sketch — architect refines against post-0252.7 main)

- The five representative PTY proofs pass using 0252.8's helper
  (marker readiness, out-of-band exit status, Center-tuple
  observation).
- The modal renders per the 0252.3 button grammar on the alternate
  screen; Abort restores the shell and prints the compact panel from
  column 0 with no interleaved live-frame remnants.
- Full suite green per the landing discipline above.
"""

[relations]
parent = "0252"
depends-on = ["0252.8", "0252.7", "0252.3", "0252.2"]
