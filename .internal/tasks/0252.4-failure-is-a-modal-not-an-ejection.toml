content = """
Runs are resumable and re-drivable; the surface must show that instead of
ejecting on every failure. Parent ruling 5.

## The contract, stated once

Every in-scope failure and the first raw-mode ctrl-c in the run view keep
the pane, dim it, show ONE short line, and offer exactly three actions,
always, in this order:

1. `Resume/Retry` — re-drive the SAME session through the existing
   `--session` path.
2. `Restart` — start a FRESH session with the same trait and arguments.
3. `Abort` — close the pane and print the compact failure panel.

## Rewritten after the 2026-08-27 post-mortem (session 28f2ba9f22)

The previous ready plan burned a 12-hour budget at 53 review rounds
without landing. Every permanent blocker traced to things outside the
task: a shared PTY-helper baseline the plan forbade touching (now owned
by 0252.8), a stale-baseline clippy failure (already fixed on current
main), an infeasible `/dev/tty` readiness step, and a contract conflict
with 0252.2 that waited on an owner ruling nothing surfaced. All are
settled below so this run can land unattended. This task runs after
0252.8 (truthful PTY helper) and 0252.7 (live view on the alternate
screen) in the same queue; the plan builds on both being landed.

## How to read this plan

Goals and approach are separated, and only goals bind. What binds is
exactly four things: `validation`'s Done-when list with the existing
command that decides each one, the binding constraints and exclusions in
`scope`, every REUSE POINT (an existing authority that must not be
duplicated — a second copy of the same grammar is a defect regardless of
route), and the finite repair cap with its single final landing-gate run
in "Order and bounded refinement".

Everything else is the architect's best route from the grounding, not a
boundary: expected files, symbol names and signatures, edit and step
order, seam shape, intermediate commands and the order they run in,
fixture and matcher choices, which assertion proves which behaviour, and
every diagnostic hypothesis and suggested repair under `Watch`. Deviate
from any of it whenever a goal requires it. Report the deviation in the
work summary — it is not a plan violation, not a finding, and not an
owner escalation.

## Owner rulings, settled 2026-08-27 — decisions, not open questions;
the run must not re-litigate or escalate them

1. Base architecture: the live view renders on the alternate screen
   (0252.7). The failure modal renders inside that alternate-screen
   pane. Abort leaves the alternate screen and prints the compact
   failure panel on the restored normal screen.
2. Rescue-last means last PRODUCT output. 0252.2's lock-free
   signal-path hard-escape stays exactly as landed and is out of scope
   to modify. Proofs assert product bytes only; test-helper metadata is
   out-of-band per 0252.8 and is never a finding.
3. Readiness in proofs is the post-spawn run-view marker via 0252.8's
   bounded helper wait. The `/dev/tty` readiness-token design is dead.
4. Expected-file lists in the plan are guidance, not a boundary: when a
   named Done-when requires touching a file beyond the list, do it and
   report it in the work summary.

## Grounded against HEAD 546a0553 (0252.7 landed at e7881711; 0252.8 not landed here)

Nine facts about the code as it stands decide the shape of this work.
They are corrections against the obvious route, not implementation
orders.

### 1. Raw ctrl-c is not SIGINT, and its kill has already fired

The crossterm pump detects the key and calls `interrupt::request_kill()`
IMMEDIATELY, before forwarding it (`tui_ratatui.rs:642-661`). That call
is load-bearing: a silent harness may never cause another render. The
ejection is a SECOND stage — `poll_detach` drains the forwarded key,
calls `request_kill()` again, marks the pane detached, leaves the
alternate screen and prints a note (`tui_ratatui.rs:823-855`). Only that
second stage may be gated, and only for a live pane that has opted in.
The kill keeps firing on the first ctrl-c: this modal offers
Resume/Restart/Abort for a killed attempt; it does not make ctrl-c
cooperative and does not defer the kill.

### 2. The opt-in cannot be global

Production run, startup and attached-observer panes all come from the
same `RatatuiPane::new_run_pane()` (`tui_ratatui.rs:455-459`), and
startup hands its own pane forward without rebuilding the terminal
(`run_startup_view.rs:209-211`, `drive.rs:4872-4908`). Startup consumes
ctrl-c through `poll_startup_interrupt` and exits 130
(`run_startup_view.rs:162-207`). Rewriting `CtrlCPolicy::RequestStop`
would change startup and observers, which are excluded. The opt-in
belongs to the live `RunPanel` once it exists, not to the pane
constructor.

### 3. The loose kill note is 0252.9's to delete

`run killed; terminal restored` (`tui_ratatui.rs:849`) belongs to
sibling 0252.9. An opted-in live pane no longer reaches that branch on
the first ctrl-c, which is this task's change; the prose itself stays in
the tree for the paths that still eject.

### 4. Every non-completed drive currently closes the pane

`drive_loop` wraps the panel in a `RunPanelGuard` whose `Drop` always
calls `panel.close()` (`drive.rs:1942-1949`, `2110-2120`), and
`drive::drive` has an outer guard over every early return
(`drive.rs:1020-1085`). The ONE existing release path is normal
`Session::Completed`, which moves the panel into
`DriveInputs::panel_handoff` instead of closing it
(`drive.rs:2321-2337`) for `run::drive_session` to take
(`run.rs:516-594`). `PanelHandoff` is already a cloneable
`Arc<Mutex<Option<RunPanel>>>` with `new`/`give`/`take`
(`drive.rs:203-231`). REUSE POINT: retaining a failed pane extends that
handoff; a second panel transport would duplicate lifecycle logic.

### 5. The failure class is an existing predicate, not a new one

`run_completed` requires both persisted `Session::status == Completed`
and `drive.final_session_status == Some(Completed)` (`run.rs:1152-1167`),
and `print_final_output` already selects the compact failure panel on
`!run_completed` (`run.rs:1659-1723`). The nearest in-scope human
predicate is `CompletionOutcome::with_human_terminal_failure` — human
output, no credits pause, no budget pause, not completed
(`run.rs:1285-1297`). REUSE POINT: the modal trigger and the existing
exit mapping must be decided by the same predicate, or they drift. Two
neighbours are deliberately NOT re-drivable failures: credits and budget
pauses have their own resumable guidance and are early-returned
(`run.rs:1671-1682`), and a completed drive with a parked or failed
merge still renders as Success (`run.rs:1040-1057`, `1690-1723`).

### 6. The one line has an authority, and it is not short today

`run::failure_reason` is the explanation authority — session stop
message, stop reason, fired bound, first drive warning, drive status, in
that precedence (`run.rs:1114-1150`). REUSE POINT: modal text derives
from it. But its sources can be long or multiline: `PanelRow::toned`
sanitizes terminal controls without enforcing one line
(`presentation.rs:89-99`) and `render_modal` wraps. One short line is
therefore an explicit normalization this task adds once and uses for
both the report-failure and the propagated-error case, with a stable
fallback when the reason is empty.

### 7. Esc is structurally `Cancelled`, and `Chosen` is currently dropped

The button grammar is landed and needs no edit: `Modal::buttons`,
`Button::new`, `.destructive()`, `ModalOutcome::Chosen(String)`, focus
starting at index 0, Left/Right and Tab/Shift-Tab wrapping, Enter
resolving, unrelated keys `Pending` (`tui_kit.rs:362-588`, `457-515`,
`1113-1148`). Two consequences. Esc always returns `Cancelled`, and
`apply_open_modal_key` clears any cancelled modal and answers a pending
input receiver with `None` (`run_view.rs:1323-1357`) — so a failure
modal, whose only exits are its three buttons, needs its own
discriminator and an earlier branch, not a tweak to the shared arm. And
`ModalOutcome::Chosen(_)` is an explicitly-ignored arm in that same
function: that is the seam for the three choices.

### 8. A blocked missing-input drive must be released, or nothing can be honoured

A drive awaiting input blocks synchronously on
`panel.request_input(...).recv()` (`drive.rs:2343-2363`), and
`state.modal` is shared with that prompt and with the quit confirmation
(`run_view.rs:211-351`). If ctrl-c replaces an open input prompt, the
displaced `pending_input_reply` must receive `None`; otherwise the drive
thread never returns and no choice can be acted on.

### 9. Resume is `internal drive --session`; Restart collides on two arguments

The real same-session continuation primitive is
`ctx traits internal drive --session <id-or-path>` and its in-process
equivalent `drive::drive(DriveInputs { session, .. })`
(`surface/cli.rs:1474-1539`, `command_handlers.rs:1293-1402`), which
resolves the ledger (`run_session::resolve_session_path`), reloads the
pinned trait (`io/run.rs:3806-3888`), restores recorded worktree
provenance (`drive.rs:1766-1788`) and advances the existing cursor. The
visible `ctx traits --session … run …` spelling is NOT a resume
primitive — the outer session value is unused in the `Run` branch
(`command_handlers.rs:287-304`, `487-744`) — so a Resume implementation
must not recurse through it. A terminally `Failed` session is still
accepted by the drive entry and returns a failed report promptly
(`drive.rs:2230-2342`), so a failed Resume can honestly reopen the same
modal with no copied core transition.

Restart's fresh identity is already implemented: every `io::run::start`
mints new session and run IDs (`io/run.rs:947-980`), reached from
`run::start_run_session` with the live `SessionStartInputs`
(`run.rs:51-94`, `334-439`). The ledger does not persist the original
raw trait-argument spellings (`core/session.rs:244-317`;
`io/run.rs:1458-1547`), which is why the in-process values are the
honest source. Exactly two of those values collide with a fresh start:
an explicit `--out` sends the new session to the same file and
overwrites the prior ledger (`io/run.rs:4165-4171`), and a named
worktree makes `prepare_worktree` refuse, because a new run cannot reuse
a registered worktree (`io/worktree.rs:232-255`). A bare worktree
already derives its ID from the fresh session ID (`io/run.rs:995-1005`).

## Correction — 0252.8's helper is the baseline, and it is not in this worktree

At HEAD the shared helpers still hand-build environments, push
`__CHILD_EXIT__…` into asserted PTY stdout, and use timer-resetting
`exp_continue` (`support/src/lib.rs:613-763`), and the teardown proof
still filters that metadata (`proof_run_view_exit_teardown.rs:135-153`).
0252.8 fixes all of it and keeps the three public helper names,
parameter order and return types stable — but its implementation, its
fixture additions and any new matcher symbol names must be RE-READ after
it lands, before this task's first proof edit. Two inherited rules bind
here regardless of what those symbols end up being called: readiness for
key delivery is text only the spawned child could have produced (a
painted step label or `in-progress role@harness` is painted pre-spawn),
and any wait on or assertion about ratatui-painted text goes through
0252.8's escape-tolerant authority, because the cell diff may insert
escapes between adjacent characters.
