## Step 5 — the guard releases instead of closing (`drive.rs`)

Changed symbols:

- `pub struct DriveInputs<'a>` gains exactly two fields, both with doc
  comments naming 0252.4 and the byte-identical default:
  - `pub failure_modal: bool` — `false` (today's behavior) for every caller
    but `run::drive_session`. A `bool` and not a policy struct: the modal's
    three actions are unconditional, so there is nothing to configure.
  - `pub live_panel: Option<run_view::RunPanel>` — a pane handed back in
    for a Resume/Retry re-drive, so the same pane keeps painting across the
    attempt boundary instead of being torn down and rebuilt. `None`
    everywhere else.
- `struct RunPanelGuard` (`drive.rs:1915-1922`) becomes
  ```
  pub(crate) struct RunPanelGuard {
      panel: Option<run_view::RunPanel>,
      release: Option<PanelHandoff>,
  }
  ```
  with exactly this API — the three methods `run.rs` needs, no more:
  - `pub(crate) fn new(panel: Option<run_view::RunPanel>, release: Option<PanelHandoff>) -> Self`
  - `pub(crate) fn panel(&self) -> Option<&run_view::RunPanel>`
  - `pub(crate) fn take(&mut self) -> Option<run_view::RunPanel>`
  `Drop` takes the panel and, when `release` is `Some`, calls
  `handoff.give(panel)`; otherwise `panel.close()` exactly as today. The
  panel is thus never owned by anything but a guard at any hop — the
  receiving side re-guards it (Step 6). Both fields stay private;
  `drive.rs`'s own code sets `run_panel.panel` directly (same module), and
  `PanelHandoff::give` stays private to this module. Both existing guard
  sites are updated:
  - `drive` (`drive.rs:1071`): `RunPanelGuard::new(input.live_panel.take(), release)`
    where `release = input.panel_handoff.clone().filter(|_| input.failure_modal)`.
    Construct a panel via `create_run_panel` only when
    `run_panel.panel.is_none()` and `input.progress == cli::DriveProgress::Tui`;
    the existing fallback-to-status error arm is unchanged and unreachable
    for a handed-in pane. A handed-in pane keeps the ledger path, the armed
    escalation, and the plan it already had — a Resume/Retry drives the
    same session, so its plan and trait are the same bytes. The
    `run_panel.0` field accesses at `:1075`, `:1354`, and `drive_loop`'s
    `:2273-2311` become `run_panel.panel`.
  - `drive_loop` (`drive.rs:2093`): same
    `RunPanelGuard::new(initial_run_panel, release)`. The `Status::Completed`
    arm (`drive.rs:2294-2307`) is unchanged — it still hands off explicitly.
    With a release installed, every other return and every propagated `?`
    now releases through `Drop` instead of closing, which is the whole
    ejection fix.
- `fn create_run_panel(input: &mut DriveInputs<'_>, session: &Session) -> crate::Result<run_view::RunPanel>`
  (`drive.rs:4845-4881`): signature unchanged; after `set_live_ledger_path`,
  add `if input.failure_modal { panel.enable_failure_modal(); }`.

Ordering that must not move: `record_drive_outcome` (`drive.rs:1496`) and
`drop(driver_lock)` (`drive.rs:1528`) still run after `drive_loop` returns
and before `drive` returns. The guard released the panel earlier, but no
choice is ACTED on until `drive` has fully returned, so a Resume/Retry
never races the invocation that still holds the lock. `interrupt::reset`
(`drive.rs:990-1009`) at the top of every `drive` clears the interrupt and
kill flags a Resume/Retry must not inherit — already correct, do not touch.

Accepted and pre-existing: between `drive_loop`'s return and `drive`'s
return the pane is owned by the handoff rather than a guard. That window
already exists today for the `Status::Completed` handoff (P549); this task
widens which outcomes reach it, not the window itself.

## Step 6 — the attempt loop (`run.rs`)

New symbols:

- `pub(crate) fn human_terminal_failure(session: &ctx_traits_core::procedure::session::Session, drive: &crate::app::drive::DriveReport) -> bool`
  — extracted verbatim from the body of
  `CompletionOutcome::with_human_terminal_failure` (`run.rs:1285-1296`):
  `drive.credits_pause.is_none() && drive.budget_pause.is_none() && !run_completed(session, drive)`.
  `with_human_terminal_failure` is rewritten to
  `self.human_terminal_failure = human_output && human_terminal_failure(&self.session, drive);`
  so the exit mapping and the modal trigger can never drift apart. This is
  the one failure classifier; do not add a second.
- `fn one_line_reason(text: &str) -> String` — first non-empty line,
  whitespace-normalized, truncated on a char boundary to 120 chars, falling
  back to `"run failed"` when the result is empty. The single normalizer
  for BOTH failure shapes.
- `fn failure_modal_reason(session: &ctx_traits_core::procedure::session::Session, drive: &crate::app::drive::DriveReport) -> String`
  — `one_line_reason(&failure_reason(session, drive).unwrap_or_default())`.
  Reuses the existing precedence selector (`run.rs:1114-1150`); does not
  introduce a second explanation source.
- `fn error_modal_reason(error: &crate::Error) -> String` —
  `one_line_reason(&error.to_string())`. The propagated-`Err` shape's
