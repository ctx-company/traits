scope = """
## Binding constraints and exclusions

These bound the outcome regardless of the route taken.

- The three actions are always present, always in the order
  `Resume/Retry`, `Restart`, `Abort`, with focus starting on
  `Resume/Retry`. There is no fourth action, no conditional action, and
  no state in which the modal is open with fewer than three.
- The failure modal is not dismissible except through its three
  buttons: Esc, `q` and unrelated keys leave it open and leave its
  focused button where the user put it. Opening is idempotent — a later
  final drive reason must not replace an already-open modal or move its
  focus, and a recorded choice must not be overwritten by a later
  reopen.
- The first raw-mode ctrl-c still kills the process group immediately
  (content fact 1). The modal changes what the surface does next.
- Ctrl-c opens the modal even over an open quit confirmation, missing
  input prompt or guide, and a displaced missing-input wait is released
  so the drive thread can finish (content fact 8).
- The modal body is ONE short single line derived from
  `run::failure_reason` (content fact 6), normalized once and reused for
  both the report-failure and propagated-error cases, never a second
  reason source.
- Only the live `RunPanel` opts into modal ctrl-c handling. Startup
  panes, attached observers, standalone `internal drive --session` and
  generated meta-traits keep today's behaviour — a caller that cannot
  consume a choice must never display the modal.
- Resume and Restart act only AFTER the failed `drive()` has returned
  and released the driver lock and its persisted outcome
  (`drive.rs:1493-1541`). A key handler records intent; it does not
  start a re-drive.
- Resume re-drives the SAME session through the existing `--session`
  drive entry (content fact 9), never through the visible
  `ctx traits --session … run` spelling and never by reimplementing
  cursor advance. Restart starts a FRESH session through the existing
  start path with the same trait and arguments, preserving the previous
  run's ledger.
- Abort leaves the alternate screen FIRST and then prints exactly one
  compact failure panel on the restored normal screen, built through the
  existing `run::failure_panel` / `run_header_from_title` grammar
  (`run.rs:1812-1833`). No second renderer, no duplicated glyphs,
  labels, title fallback or ANSI serialization — 0252.2's rescue path
  already reuses the same constructors (`run_view.rs:1000-1029`).
- Waiting for a choice cannot hang the run: a detached, closed or
  poisoned pane resolves to Abort within a finite bound rather than
  blocking forever after terminal loss.
- Proofs assert product bytes only, at the five representative
  behaviour classes named in `validation` — one per class. No
  permutation battery across failure kinds, timings or interleavings.

## Suggested approach — guidance, not a boundary

### Expected files

- `modules/cli/src/app/tui_ratatui.rs`
- `modules/cli/src/app/run_view.rs`
- `modules/cli/src/app/run_view/render.rs`
- `modules/cli/src/app/drive.rs`
- `modules/cli/src/app/run.rs`
- `modules/cli/tests/proof_run_view_exit_teardown.rs`
- `modules/cli/src/app/command_handlers.rs` and
  `modules/cli/src/app/generate.rs` — default literals only, if
  `DriveInputs` grows a field.

Touching files beyond this list is legitimate whenever a binding goal
requires it. Do it and report it in the work summary (ruling 4).

### Step 0 — re-read the post-0252.8 baseline before editing

`modules/cli/tests/support/src/lib.rs` (the three helpers, the readiness
wait, the escape-tolerant matcher authority, any fixture 0252.8 added)
and `proof_run_view_exit_teardown.rs` end to end, then observe that
suite's own passing count. None of this plan's proof guidance survives
contact if 0252.8 landed differently; the goals do.

### Step 1 — failure-choice state in the run view

`run_view.rs`. `RunPanelState` already owns the session, trait, plan,
pane, the single `modal`, the pending input reply and cached tree lines
(`run_view.rs:211-351`), and `RunPanel` is cheap to clone over `Arc`s.
The suggested shape:

- a discriminator distinguishing the failure modal from the quit
  confirm and the input prompt, so an earlier branch in
  `apply_open_modal_key` traps `Cancelled` and unrelated keys instead of
  clearing (content fact 7);
- an idempotent open that builds `Modal::buttons` with the three fixed
  `Button::new(..., ModalOutcome::Chosen(...))` values in order,
  displacing an input prompt by answering its reply with `None`
  (content fact 8), and returning early if a failure modal is already
  open;
- a choice slot that is a LEAF lock plus a wake, published from the key
  handler while the state mutex is held and read after releasing it —
  polling the state mutex from the orchestration thread would deadlock
  rendering — with a bounded wait that resolves to Abort when the pane
  is detached or the lock is poisoned;
- a clear that returns the panel to ordinary live rendering for Resume.

The `ModalOutcome::Chosen(_)` arm at `run_view.rs:1353` is where the
three choices map. Ctrl-c interception belongs before the modal, guide,
`d`, `q` and scroll routers in `poll_and_apply_keys`
(`run_view.rs:1359-1431`).

### Step 2 — dim the backdrop, only for this modal

`run_view/render.rs`. `render_live_panes` (`:421-480`) renders a normal
modal without dimming. REUSE POINT: `tui_kit::dim_backdrop`
(`tui_kit.rs:994-1013`) adds `DIM`, removes `BOLD` and paints no
background, and `render_conversation_modal` (`tui_kit.rs:1269-1281`)
establishes the order — dim the full area, then `Clear`, then render the
modal at full brightness. Generic `render_modal` deliberately does not
dim, so the failure-only dim goes at this call site, not into the kit.
`tui_kit.rs` should not need an edit.

### Step 3 — the ctrl-c opt-in

`tui_ratatui.rs`. Gate only the second stage of `poll_detach`
(`:823-855`) for a pane that has opted in, leaving the pump's immediate
`request_kill` (`:642-661`) and the unarmed startup/observer path
untouched, and forwarding the key so the run view can open the modal.
The opt-in should be set once a live `RunPanel` exists (content fact 2)
and should be off by default.

### Step 4 — retain the failed pane

`drive.rs`. Extend the existing `panel_handoff` release
(`drive.rs:203-231`, `2321-2337`) so a retained-on-failure run releases
its live panel to `run::drive_session` instead of closing it through
`RunPanelGuard::drop`, and so a same-session re-drive can accept an
already-live panel. Any new `DriveInputs` field defaults to off/empty at
the `command_handlers.rs` and `generate.rs` construction sites.
`drive()` already resets interrupt and run-kill state at the top of
every invocation (`drive.rs:990-1009`) — REUSE POINT for Resume rather
than a second reset.

### Step 5 — the attempt loop in `run.rs`

Keeping the loop inside `drive_session` (`run.rs:453`) is what lets
Restart reuse the live `SessionStartInputs` values semantically, with no
shell quoting and no reliance on provenance the ledger does not hold
(content fact 9); it also means one task-queue member (`run.rs:763-845`)
does not advance until its decision reaches a final `CompletionOutcome`
or error. Suggested pieces:

- one shared in-scope predicate and one short-line normalizer (content
  facts 5 and 6);
- Resume: clear the modal, re-drive the same session through the
  existing `--session` drive entry with the retained panel;
- Restart: close the retained pane, then call the existing start path
  with the same values, using the default session path instead of an
  explicit `--out` and degrading a named worktree to the bare derived
  form (content fact 9) — every other argument preserved;
- Abort: close first, then print. For an `Ok(DriveReport)` failure,
  falling back into the existing `print_final_output` path avoids a
  second renderer; a propagated `drive()` error needs a narrow sibling
  using the same `run_header`/`failure_panel` and then
  `Error::AlreadyReported` with exit code 1 (`error.rs:28-33`,
  `command_handlers.rs:164-183`) so the generic CLI renderer does not
  print a second line. Propagated errors keep exit code 1; do not remap
  them onto run or merge codes.

Build after Steps 1-5:
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

### Step 6 — units beside the code they cover

Fixed button order and focus, Esc and unrelated keys trapped, choice
mapping, idempotent open, displaced input released with `None`,
short-line normalization of a long multiline reason and of an empty one,
and the two Restart boundary transformations. These are cheap, they need
no PTY, and they are what makes a red end-to-end proof diagnosable.

### Step 7 — the five representative proofs

`proof_run_view_exit_teardown.rs`, consuming 0252.8's helpers. What each
must prove is in `validation`; how to observe it is the run's choice
within 0252.8's rules (post-spawn marker readiness, escape-tolerant
matching for painted text, out-of-band child status). Guidance from the
grounding, not a pin: the Resume proof is convincing when it observes
ONE retained ledger and session id and a completion after the choice;
the Restart proof when it observes TWO ledgers with distinct session ids
and the first still present; the Abort proof when it inspects bytes
after the final alternate-screen restore. The existing raw-ctrl-c test
(`:265-290`) is the natural host for the ctrl-c class and changes only
as the new first-ctrl-c behaviour requires. Do NOT filter helper
metadata out of asserted bytes — after 0252.8 there is none, and a
filter would hide a regression in it.

## Explicitly excluded (owner ceiling — findings here are advisory
board material, never blocker cells)

- Second-ctrl-c and signal-path behavior: owned and landed by 0252.2;
  its hard-escape contract is untouchable here. `interrupt.rs`'s signal
  ladder, rescue buffer, generation gate and handler calls are not
  edited (`interrupt.rs:42-89`, `139-192`).
- PTY-helper behavior: owned by 0252.8; this task consumes it.
- Deleting the loose `run killed; terminal restored` note: 0252.9
  (content fact 3).
- Every-panic and exotic-exit coverage: parent ruling stands ("I don't
  care about every single panic for now").
- Dashboard-side actions (delete/archive/action registry): 0252.5 and
  0252.6.
- The 0252.3 button grammar itself (`tui_kit.rs`), startup-pane
  behaviour, and the ordinary non-interactive failure output pinned by
  `proof_output_style::run_failed_default_output_is_exact`
  (`proof_output_style.rs:795-836`) — all consumed, none rewritten.
- Merge dispositions and credits/budget pauses as re-drivable failures
  (content fact 5).

## Landing discipline

- The full landing gate runs once at the end (`CARGO_TARGET_DIR=target
  just test-full`). A baseline failure that predates this task's own
  diff is reported with evidence and does not block merging this task's
  green work.
"""
validation = """
## Done when — binding goals, each with the existing command that decides it

1. An in-scope run failure keeps the pane instead of ejecting: after a
   drive that ends non-completed for a human run, the alternate screen
   is still held, the live content behind the modal is dimmed, the modal
   states the failure in one short line derived from
   `run::failure_reason`, and offers exactly `Resume/Retry`, `Restart`,
   `Abort` in that order with focus on the first.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown`
2. The FIRST raw-mode ctrl-c during a live run opens that same modal
   instead of detaching and printing a note, while the process group is
   still killed immediately. Same command as 1.
3. `Resume/Retry` re-drives the SAME session: after the choice the run
   continues on the session id observed before the failure — one ledger,
   one session id, reaching completion. Same command as 1.
4. `Restart` starts a FRESH session with the same trait and arguments:
   two ledgers exist afterwards with distinct session ids, and the first
   run's ledger is preserved rather than overwritten. Same command as 1.
5. `Abort` restores the shell and prints exactly one compact failure
   panel: the alternate screen is left BEFORE any of that output, the
   panel carries the observed session id in the existing
   `run::failure_panel` grammar, and no live-frame remnant appears after
   the restore. Same command as 1.
   (Criteria 1-5 are the five representative classes — one proof each.
   They share one command because they share one suite; the assertions
   live in those tests.)
6. Excluded surfaces are provably unchanged. The ordinary
   non-interactive failure output still matches its pinned shape and
   headless/piped runs stay byte-identical:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_output_style`
   and the loose exit note stays in the tree for the paths 0252.9 owns:
   `rg -q 'run killed; terminal restored' modules/cli/src && echo kill-note-retained`
7. The modal's own invariants hold as units, so a red end-to-end proof
   is diagnosable: fixed three-button order and initial focus, Esc and
   unrelated keys leaving the failure modal open with its focus unmoved,
   each choice mapping to its action, a second open being a no-op over
   an open modal or a recorded choice, a displaced missing-input wait
   answered with `None`, a long multiline and an empty failure reason
   both normalizing to one short line, and the two Restart boundary
   transformations (default session path instead of an explicit `--out`;
   a named worktree degraded to the bare derived form). Existing pane,
   rescue-arming and restore-constant invariants still pass alongside
   them:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib`
8. The landing gate is green:
   `CARGO_TARGET_DIR=target just test-full`

Criteria 1-5 carry one shared `[[checks]]` entry; criteria 6, 7 and 8
carry one each. No entry is derived for "the signal path is untouched":
checks run in a clean detached worktree of the merged sha where there is
no diff to inspect, and a source grep asserting the shape of
`interrupt.rs` would pass on any rewrite that kept its words. That one
stays a reviewer instruction below.

## Order and bounded refinement

Two things here bind. The landing gate
(`CARGO_TARGET_DIR=target just test-full`) runs ONCE, at the end, after
the other criterion commands have passed. And refinement is finitely
bounded: at most two targeted repair-and-rerun rounds in total. A round
repairs one named failure, then reruns the failed command and every
other criterion command the repair could invalidate. If a third round
would be needed, STOP and report the failing command with its output and
the remaining evidence rather than continuing. That is the stop
condition, not a judgement call.

Everything else about sequencing is suggested. A route the grounding
supports: Step 0's re-read, then Steps 1-7, running
`CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli` before writing
the units so a borrow, lock-order or exhaustiveness error surfaces next
to the edit that caused it; then criterion commands 7, 1, 6, 8 — units
first because they cost seconds rather than minutes, the gate last.
Intermediate commands are conveniences, not obligations: incremental
builds, a `--lib` filter such as `failure_modal`, single-test
invocations. Run, skip, reorder or substitute them freely. Any deviation
from a suggested step order, intermediate command, diagnostic route or
proof mechanic in service of a Done-when is reported in the work summary
and is not an owner escalation.

## Watch

The diagnoses and repairs below are the architect's first hypotheses
from the grounding, not the only permitted ones. Where a bullet also
restates a binding goal, exclusion or ruling, that part is marked and
binds; the causal guess and the suggested fix never do. Reaching a
Done-when by a different diagnosis or repair is reported in the work
summary, not escalated.

- The excluded list is an owner ceiling. A finding in an excluded area
  is advisory, never a blocker cell.
- The settled rulings in content are final for this run; escalation is
  not a path for re-opening them.
- The reviewer verifies the five representative classes and the modal
  contract; "take as many rounds as it needs" applies to closing the
  named contract, not widening it.
- Final substantive review inspects `git status --short` and
  `git diff`: only justified files changed; the three actions always
  present and ordered; no signal-path or second-ctrl-c code touched; no
  helper metadata filtered out of asserted bytes; Abort closing before
  printing and through the shared panel constructors; Resume and Restart
  acting only after the prior `drive()` released its lock.
- If a proof hangs waiting for the modal, readiness is the cheaper
  suspect than the modal: a painted step label is pre-spawn, and painted
  text needs 0252.8's escape tolerance. A better post-spawn marker or
  wider escape tolerance is the suggested repair; another cause is
  possible and another fix is fine. BINDING regardless of route:
  readiness is post-spawn evidence only, the `/dev/tty` design is dead
  (ruling 3), and no repair may make a pre-spawn frame satisfy the wait
  or substitute a sleep for evidence.
- If the ctrl-c proof shows no alternate screen at all, check the helper
  environment seam first (0252.8, `NO_COLOR` at the PTY seam) before
  this task's opt-in — that is where the grounding puts it. BINDING:
  `stderr_supports_live` is not a repair target.
- If Restart overwrites the first ledger or a worktree registration
  refuses the fresh run, that is content fact 9's known collision rather
  than a core bug; the suggested fix is in this task's restart path.
  BINDING is only the goal — the first run's ledger survives and the
  fresh session is distinct. `io/run.rs` and `io/worktree.rs` are shared
  core: if a Done-when genuinely requires editing them, do it and report
  it prominently in the work summary.
- A red `proof_output_style` most likely means the compact failure
  grammar moved. BINDING: that suite is a regression gate for this task,
  not a target.
"""

[relations]
depends-on = [
    "0252.8",
    "0252.7",
    "0252.3",
    "0252.2",
]
parent = "0252"

[[checks]]
