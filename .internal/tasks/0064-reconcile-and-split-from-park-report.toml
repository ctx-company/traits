schema-version = "0.1"
key = "0064"
title = "Reconcile the board against reality, and split an oversized task from its park report"
status = "ready"
raised = "2026-08-03"
content = """


Last slice of the task-interface arc. Everything before it makes the board *readable and operable*;
this one makes it *true*. Two mechanics that share one rule: they gather evidence and propose, and
the owner decides.

## Decisions

- **Reconcile is not sync.** Sync re-reads the backend and is mechanical: whatever the backend says
  is the answer. Reconcile asks whether what the backend says is *still true of the repository* —
  did that dependency actually land, is that "ready" task already implemented in main, does that
  unchecked step have a commit behind it. Two different questions; they never merge into one verb.
- **Reconcile proposes and never applies.** It emits a proposal set — task key, current value,
  proposed value, and the evidence — and writes nothing until the owner confirms. A tool that
  silently rewrites the board on a heuristic is worse than a stale board, because a stale board
  looks stale and a wrong one looks authoritative.
- **Every proposal cites checkable evidence** — a commit sha, a merged branch, a park report path,
  a ledger entry. "Probably done" is not a proposal. The owner must be able to verify any single
  line without re-deriving the whole run.
- **It composes above the provider**, over `list`/`get`/`update`. No backend implements reconcile;
  a backend that could answer these questions natively would still be answering a different
  question — its own bookkeeping, not this repository's state.
- **Splitting from a park report is the fine-grained split.** A run that parks oversized or blocked
  has already produced the decomposition: the feasibility verdict's reasoning, the reviewer's open
  blockers and their steps. Split reads that structure and proposes children; it does not ask a
  model to re-derive what the run already wrote down.
- **Children are created through the provider**, with provider-assigned keys (`0010.1`) and
  `relations.parent` set. The parent's status stays derived from its children — nothing marks the
  parent "split", because that was never a status (0059).
- **The owner confirms each child before it is written.** Bulk-accepting a model's decomposition
  into the board is how a task list rots into noise.
- **Runs never trigger either mechanic.** Both are owner-driven, from the dashboard or the CLI,
  against the read-write provider capability that runs do not hold (0060).

## Scope

A reconcile pass over the board producing a typed proposal set; its evidence sources are the git
history, the merge state of run branches, the run ledger (task key plus materialised digest, 0061)
and park reports. A split path that turns one park report into proposed child tasks. A dashboard
surface for reviewing, accepting and rejecting proposals individually. `ctx tasks reconcile` for
the same pass without a TUI.

## Watch

- **Reconcile's failure mode is confidence, not coverage.** Missing a stale row costs a manual
  check; asserting a task is done when it is not corrupts the board and every dependency decision
  downstream of it. When the evidence is ambiguous, say ambiguous — do not guess.
- Step-level flips (checking a step's box because its commit exists) only make sense once steps are
  structural, which is 0062. Before that, reconcile works at task granularity and the owner checks
  boxes by hand.
- The park report is the input to split, so its schema becomes load-bearing here in a way it is not
  today — changes to the blocker/step shape turn into breaking changes for this mechanic.
- Archived documents are still reachable through `get()` (0060), and reconcile must consider them:
  otherwise a dependency satisfied by an archived task reads as unmet forever.
- Do not let the proposal set become a queue with its own state. It is derived, recomputed each
  pass, and discarded on exit — otherwise there is a third place where task state lives.

## Done when

A reconcile pass reports stale statuses and satisfied-but-unmet dependencies with checkable
evidence per proposal and writes nothing unconfirmed; accepting a proposal updates the board
through the provider; a parked oversized run can be split into child tasks whose keys and `parent`
edges the provider assigns, one confirmation at a time; the parent's status follows its children
with no stored marker; and neither mechanic is reachable from inside a run.
"""

[relations]
depends-on = [
    "0060",
    "0061",
    "0063",
    "0062",
]
