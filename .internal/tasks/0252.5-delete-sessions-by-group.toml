`modules/cli/src/app/session_delete.rs`, new `mod tests`:

- `failed_selection_is_exact_status_failed` — write five ledgers into a
  scratch store using the JSON-literal fixture shape already proven in
  `modules/cli/tests/proof_center.rs:134-197` (`serde_json::from_value` →
  `write_run_session`), with statuses `failed`, `failed`, `completed`,
  `awaiting-agent-output`, `rejected`, plus one file that is not valid
  JSON. Call `delete_failed_sessions_in(&store)`; assert `deleted == 2`,
  `skipped_live == 0`, `refusals.is_empty()`, exactly the two `failed`
  ledgers are gone, and the corrupt file and the other three ledgers
  survive. This pins decisions 1 and 2 together: `rejected` is inside the
  dashboard's failed GROUP and must not be selected, and an unreadable
  ledger must not be selected.

`modules/cli/src/app/dashboard.rs`, in the existing `mod tests`, reusing
`scratch_ledger_path`, `unresolvable_trait_session_fixture`, `row_with_id`,
`State::new_without_worker`, and `RatatuiPane::new_detached_for_test` — no
committed repo content is read by any of them:

- `group_delete_selects_only_the_captured_group` — populate
  `state.sessions` with rows in at least two groups, select the `failed`
  header, call `open_delete_modal`, and assert the opened tag is a single
  `SessionAction::DeleteGroup` whose targets are exactly the failed rows'
  session ids. (`probe` returns `Unheld` when no lock file exists, so this
  test needs no lock fixtures; rows carry no worktree provenance, so
  `plan_delete_for_ledger` does no git work.)
- `group_delete_refuses_an_empty_group` — select a header whose group has
  no rows; assert no modal opened and `state.message` names the group.
- `group_delete_eligibility_refuses_a_row_that_left_its_group` — write a
  `Status::Failed` ledger, capture
  `DeleteEligibility::SessionGroup(SessionGroup::Failed)`, rewrite the
  ledger with `Status::AwaitingInput`, then call
  `session_delete::execute_confirmed_delete` with that eligibility; assert
  `ConfirmedDeleteOutcome::EligibilityChanged` and that the ledger
  survives. This is exactly the case today's `SessionClass`-only recheck
  misses (both statuses are `SessionClass::Resumable`).
- `group_delete_applies_every_target_behind_one_confirm` — two `failed`
  ledgers, one `DeleteGroup` tag, one `apply_session_action` call; assert
  both ledgers are gone and the message reads `failed: deleted 2 of 2`.

`modules/cli/tests/proof_sessions_delete.rs` (NEW) — real process, built on
`ScratchRoot`, `controlled_command`/`run_ctx`, `git_init`, and
`active_repo_key`; ledgers written with the `proof_center.rs` JSON-literal
shape through `ctx_traits_io::run_session::write_run_session`:

- `sessions_delete_failed_removes_only_failed_sessions` — store holds two
  `failed`, one `completed`, one `awaiting-agent-output`, and one corrupt
  file. Run `["traits", "sessions", "delete", "--failed"]`; assert exit 0,
  stdout contains a `deleted: 2` row and NO `skipped:` row, the two failed
  ledgers are gone, and the other three files remain.
- `sessions_delete_failed_skips_a_live_driver` — two `failed` ledgers. The
  test process holds the real kernel lock on one of them:
  `ctx_traits_io::file_lock::open_lock_file_no_follow(&ctx_traits_io::run_control::driver_lock_path(&ledger))`
  then `ctx_traits_io::file_lock::try_lock_exclusive(&file)`, keeping the
  `File` alive across the child invocation. No sleep, no timing
  assumption, and no liveness-index row is written (unlike
  `run_control::try_acquire`, which would upsert into the TEST process's
  real runtime root rather than the scratch home). Assert exit 0, stdout
  has `deleted: 1` and `skipped: 1 live`, the held ledger still exists,
  and the other is gone.
- `sessions_delete_requires_a_selector` — `["traits", "sessions",
  "delete"]` exits non-zero and its stderr names `--failed`.

`modules/cli/tests/proof_output_style.rs` — one added test,
`sessions_delete_default_output_matches_the_panel_registry_shape`, reusing
the file's own `scratch_repo`, `require_success`, and
`assert_matches_registry_claim("sessions", "ctx", "sessions delete",
&stdout)`. Against an empty store the command prints the `deleted: 0`
panel and exits 0. Added HERE rather than in the new proof so the panel
parse and the registry binding are not duplicated: that helper compares
real stdout against `presentation_for`'s own answer, which is what makes
the Step 4 registry row a claim rather than a decoration.

## Out of scope

`--interrupted` and every other selector; `--json`, `--verbose`,
`--session-store`, and dry-run for this command; machine-wide (`[ALL]`)
CLI scope; any new confirm/button widget (0252.3 owns `tui_kit.rs`); the
action registry and footer (0252.6); center-side deletion or synchronous
row removal; moving `SessionClass`/`SessionGroup`/`classify_session` out of
`dashboard.rs`; changing the `git branch -d` non-forcing behavior, the
retained lock inode, or the foreign-repository worktree safeguard.
"""
validation = """
## Done when

1. Selection, liveness, and the panel hold end to end against a scratch
   store with mixed outcomes: `--failed` deletes exactly the
   `Status::Failed` sessions and leaves completed, resumable, rejected, and
   unreadable ledgers alone; a session whose real driver lock is held by the
   test process is untouched and reported `skipped: 1 live`; the panel names
   `deleted: <n>`; and a bare `sessions delete` is refused.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_sessions_delete`
2. The new command's real output matches the shape its presentation-registry
   entry claims, and no existing command's output grammar moved.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_output_style`
3. The crate's unit suite is green: the extracted destructive path still
   satisfies every landed refusal invariant (replacement session,
   eligibility change, plan drift, readable-to-unreadable, unchanged
   readable and unreadable deletion, worktree/branch preservation on
   refusal), the new group verb selects only its captured group, refuses an
   empty group, refuses a row that left the group, and applies every target
   behind one confirm, the bulk selector takes exact `Status::Failed` only,
   and the visible-command registry gate accepts `sessions` in both
   directions.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib`
4. There is still exactly ONE destructive implementation: `dashboard.rs`
   defines no planner or executor of its own, the shared module owns them,
   the bulk selector and the handler exist, and both surface registries name
   `sessions`. A source inspection, deliberately not a Rust test — no test
   may read committed repo content. It fails on the pre-implementation tree,
   so a green run is real evidence rather than a vacuous match.
   `S=modules/cli/src/app; ! grep -qE 'fn (execute_delete|execute_confirmed_delete|plan_delete)\\(' "$S/dashboard.rs" && grep -qE 'fn execute_confirmed_delete<' "$S/session_delete.rs" && grep -qE 'fn delete_failed_sessions_in\\(' "$S/session_delete.rs" && grep -qE 'fn handle_sessions_delete\\(' "$S/session_delete.rs" && [ "$(grep -cE '"sessions"' "$S/presentation.rs")" -ge 2 ] && grep -qE '"sessions"' "$S/help_surface.rs"`
5. The landing gate is green.
   `CARGO_TARGET_DIR=target just test-full`
6. The diff touches only `modules/cli/src/app.rs`,
   `modules/cli/src/app/session_delete.rs`,
   `modules/cli/src/app/dashboard.rs`,
   `modules/cli/src/app/surface/cli.rs`,
   `modules/cli/src/app/command_handlers.rs`,
   `modules/cli/src/app/help_surface.rs`,
   `modules/cli/src/app/presentation.rs`,
   `modules/cli/tests/support/src/lib.rs`,
   `modules/cli/tests/proof_repo_qualifier.rs`,
   `modules/cli/tests/proof_output_style.rs`, and
   `modules/cli/tests/proof_sessions_delete.rs`.
   `git status --short` names nothing else.

Criteria 1-5 each carry a runnable command and a `[[checks]]` entry.
Criterion 6 is the one read-and-compare verdict — `git status --short`
carries its answer in output, not in an exit code — so it deliberately
carries no `[[checks]]` entry.

Run the steps in order, starting with Step 0's read. Run the incremental
build command declared at the end of Step 1 and again at the end of Step 3
rather than building only at the end, so an extraction or borrow error
surfaces next to the edit that caused it. Then run the criterion commands
1, 2, 3, 4, 5 in that order. Permit at most two targeted repair-and-rerun
rounds in total; after each repair, rerun the failing command and every
later one. Complete only when all five criterion commands exit 0 and the
diff stays inside the Criterion 6 allowlist.

Stop rather than complete if any of these is true: `--failed` selects
anything other than exact `Status::Failed`; a session whose driver lock is
held is deleted; `deleted` counts a ledger that still exists; a second copy
of the plan/execute path exists; the panel grows a third row; the group
confirm opens more than once per group action; or the diff leaves the
Criterion 6 allowlist.
"""

[relations]
parent = "0252"

[[checks]]
