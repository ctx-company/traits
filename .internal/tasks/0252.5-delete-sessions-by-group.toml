content = """
Parent ruling 7: `ctx traits sessions delete --failed`. Plus the dashboard
counterpart — deleting a group header deletes that group behind ONE confirm
naming the count.

There is one robust artifact-deletion path in this codebase and it is
private inside `dashboard.rs`. This task adds a second and a third CONSUMER
of it, never a second implementation.

## How to read this plan

Goals and approach are separated, and only goals bind. What binds is
exactly four things: `validation`'s Done-when list with the existing
command that decides each one, the binding decisions and exclusions in
`scope`, every REUSE POINT (an existing authority that must not be
duplicated — a second copy of the same destructive logic is a defect
regardless of route), and the finite repair cap in "Order and bounded
refinement".

Everything else is the architect's best route from the grounding, not a
boundary: expected files, symbol names and signatures, edit and step
order, seam shape, intermediate commands and the order they run in,
fixture and matcher choices, and which assertion proves which behaviour.
Deviate from any of it whenever a goal requires it. Report the deviation
in the work summary — it is not a plan violation, not a finding, and not
an owner escalation.

## Grounded against HEAD 9e0bbb94

Ten facts about the code as it stands decide the shape of this work. They
are corrections against the obvious route, not implementation orders.

### 1. The coarse ledger status is the only selector that does not under-select

`Status` is the closed enum at `modules/core/src/procedure/session.rs:95-108`,
and exact `Status::Failed` is distinguishable from `Rejected`, `Blocked`,
both blocked-agent/permission statuses, `Completed`, and every resumable
status. `DriveOutcomeKind` is a separate and much wider enum
(`session.rs:1088-1222`) carrying `CommandStepFailed`, `HarnessFailed`,
`Interrupted`, `Killed` and other conductor outcomes, and
`record_drive_outcome` only updates `last_drive_outcome`
(`modules/io/src/run_session.rs:617-650`) — it does not replace the coarse
`status`. Selecting on outcome kinds would therefore UNDER-select ordinary
failed runs. The coarse status is the one ledger fact that already groups
every terminal failure reason.

### 2. Every store, symlink and lock primitive this task needs is already public

`default_session_store()` delegates to `state::current_global_runs_root()`
(`run_session.rs:18-23`), which resolves
`$XDG_CONFIG_HOME/ctx/traits/runs/<current-repo-key>`
(`state.rs:304-355,435-438`). `session_store_paths(Some(store))` lists only
regular direct-child `*.json` files, excludes non-files and symlinks through
`DirEntry::file_type`, sorts, and returns empty for a missing directory
(`run_session.rs:215-273`). `read_run_session` rejects symlink ancestors and
a symlink leaf before parsing (`run_session.rs:157-169`). `run_control::probe`
is read-only and authoritative, and a missing lock file is unheld
(`run_control.rs:316-342,514-562`). `try_acquire_maintenance` creates or opens
the stable lock inode, takes an exclusive flock, returns `None` when a driver
won the race, and otherwise holds exclusion through deletion
(`run_control.rs:480-512`); `MaintenanceLockGuard::clear_stale_metadata`
clears metadata without unlinking that inode (`run_control.rs:145-164`).
REUSE POINT: the probe-then-maintenance TOCTOU closure is built from these,
and `modules/io` needs no edit.

### 3. The one destructive path is private in `dashboard.rs`

`DeletePlan` and `artifact_lines` at `dashboard.rs:978-1016`;
`plan_delete_for_ledger`, the pure `plan_delete`, `execute_delete` and
`execute_confirmed_delete` at `:4769-4970`; `DeleteEligibility` at
`:4972-5012`. There is no other definition or call site of `execute_delete`.
The planner derives the driver-lock and branch-sidecar paths, verifies
same-repository worktree registration, and records a `worktree_note` when
provenance belongs to another repository or registration cannot be verified.
The executor removes a verified worktree, then deletes the branch
non-forcingly, then removes the ledger and branch sidecars, best-effort
removes the activity sidecar, and deliberately RETAINS the lock inode
(`:4867-4911`; `activity_sidecar.rs:222-223`; `worktree.rs:1309-1341`).
`execute_confirmed_delete` already does maintenance-first acquisition,
authoritative reread, identity check, eligibility recheck, plan rebuild under
the lock, suppression of a lock file maintenance itself created, artifact-list
drift refusal, and stale-metadata clearing. REUSE POINT: all of it. Two new
consumers, one implementation.

### 4. `execute_delete` cannot answer "was the ledger removed?"

It returns one joined `String` and can report successful sidecar or worktree
work in the same sentence as a failed ledger removal, so no honest count can
be parsed out of it. A typed result with an explicit removed-ledger bit is a
precondition for a correct `deleted` count, not a refactor for taste.

### 5. Plan-time residue exists that `execute_delete` never mentions

`plan_delete` sets `worktree_note` ("… belongs to a different repository;
left behind" / "… is not registered; left behind") and leaves
`plan.worktree` as `None`, so the executor — which only speaks about
`plan.worktree` — says nothing about it. A batch consumer that copies only
execution-failure strings would delete a ledger, leave a provenance-named
worktree behind, print nothing, and close `passed`. Decision 5 in `scope`
fixes the policy this needs.

### 6. Dashboard classification is not the CLI selector, and `Live` is unreachable without liveness

`SessionClass` is `Live | Resumable | Terminal | Unreadable`
(`dashboard.rs:196-217`) and `classify_session(false, …)` collapses every
nonterminal state to the same coarse `Resumable` (`:1820-1843`).
`SessionGroup` is `Live, Resumable, Pending, Failed, Completed` (`:1919-1953`)
and `session_group` makes held rows live, unreadable rows failed,
cancelled/interrupted parked rows failed, `AwaitingAgentOutput` resumable,
`AwaitingInput`/`WaitingOnHuman` pending, `Completed` completed, and
blocked/rejected/failed statuses failed (`:1955-1989`). Two consequences bind
the design. Group `Failed` is deliberately BROADER than exact
`Status::Failed`, so group eligibility must be group-valued and not
`SessionClass`-valued (`AwaitingAgentOutput` and `AwaitingInput` are both
`SessionClass::Resumable` yet sit in different groups). And `session_group`
returns `Live` only when `class == SessionClass::Live`, which
`classify_session(false, …)` can never produce — so an expected eligibility
of `SessionGroup::Live`, rechecked under maintenance where `live = false` is
a fact, is UNSATISFIABLE by construction. Decision 6 resolves that.

### 7. Session rows are subscription-owned, and headers are deliberately verbless

`sessions_from_center_rows` is the one center-row projection and preserves
typed status/outcome, ledger path, repository identity and worktree
provenance; a parse failure becomes `SessionClass::Unreadable` with no typed
status (`:2250-2354`). `rebuild_visible_sessions` buckets from
`state.sessions` through `session_group`, emits all five headers including
empty ones, and stores session indices only in the visible projection
(`:2016-2039`). `selected_session` returns `None` on a header by design
(`:2126-2138`) so `x`/`s`/`S`/`a`/Enter stay header-safe; today's
`open_delete_modal` starts there (`:4714-4767`), which is why `d` on a header
is currently a no-op and why the minimal seam is a branch in
`open_delete_modal` with the existing row body left intact. `State::reload`
does not mutate rows locally — it asks the worker to refresh (`:1434-1443`);
the worker removes a row on `CenterDelta::Ended` from its ledger-path-keyed
map (`dashboard/worker.rs:418-440`), and center discovery emits `Ended` when
a ledger vanishes (`center.rs:1569-1637,1813-1907,1973-1995`). The default
scan interval is two seconds (`center.rs:65`) but it is configurable, and a
failed scan retains last-good rows.

### 8. A session id is not a machine-wide identity

`SessionId::new` enforces only non-empty text (`session.rs:33-47`), while the
center keys rows by LEDGER PATH (`center.rs:1366`). Two repositories can
expose the same session id, and the dashboard's ALL mode shows both. Any
captured target that is re-resolved by session id alone can select the wrong
row or process one row twice.

### 9. The public surface has two registries and a hand-authored help body

`TraitsCommand` has visible `Run`, `Merge`, `Check`, `Diff`, `Cache`, `State`
then hidden `Internal`, and no `Sessions` variant (`surface/cli.rs:750-999`).
The existing singular `ctx traits internal session …` is a different, hidden
namespace (`:1467-1471,2181+`) and is untouched. `traits_help_text` is
hand-authored with no sessions row (`:35-67`). `command_handlers::handle`
matches every variant exhaustively (`command_handlers.rs:287-879`).
`help_surface::classify` refuses an unclassified TOP-LEVEL name
(`help_surface.rs:44-97,114-132`), and `presentation.rs` maintains both
`REGISTERED_COMMAND_NAMES` and `presentation_for` behind a bidirectional unit
gate that walks the real visible Clap tree (`presentation.rs:681-747,1209-1264`).
A visible `sessions` command needs all four.

### 10. The output grammar and the already-reported exit are landed

`Panel::new` plus `.row` is the shared builder (`presentation.rs:175-220`);
`emit_human(false, panel, HumanOutputMode::Compact, …)` picks styled output
only where supported and otherwise emits the same plain panel (`:600-653`);
`PanelStatus::Passed`/`Blocked` already carry the closing tone.
`Error::AlreadyReported` exists for a nonzero result whose output was already
emitted, and the dispatcher maps it to its exit code without printing a
second line (`error.rs:28-33`; `command_handlers.rs:171-183`). REUSE POINT:
stderr detail, then exactly one compact panel, then exit 1 — no second
renderer.

### 11. The proofs this needs are already demonstrated in-tree

Dashboard unit helpers `State::new_without_worker`, `row_with_id`,
`scratch_ledger_path`, `unresolvable_trait_session_fixture` and detached
`RatatuiPane` exist, and the landed delete tests at `dashboard.rs:10240-10920`
already cover replacement-session refusal, unchanged readable and unreadable
deletion, eligibility change, readable-to-unreadable refusal, plan drift,
modal eligibility capture, and worktree/branch/Git preservation on refusal.
`proof_center.rs:134-197` shows a minimal JSON-literal `Session` written via
`write_run_session`; `proof_center.rs:1190-1223` shows a real driver flock
held with `open_lock_file_no_follow` plus an exclusive lock. Integration
support already provides `ScratchRoot`, controlled isolated commands,
`run_ctx`, `require_success` and `git_init` (`tests/support/src/lib.rs:254-510`).
`proof_repo_qualifier.rs:152-174` holds the only `active_repo_key`
implementation, used twice. `proof_output_style.rs:39-61,148-162` holds
`scratch_repo` and `assert_matches_registry_claim`.

## Board position

Parent `0252` is archived and not dispatched; ruling 7 fixes the public
spelling. `0252.1` (panel grammar) and `0252.3` (button-driven
`Modal::confirm`/`Modal::buttons`, destructive tone, exactly-once
`ModalHost` resolution) are landed and consumed as they are. `0252.6` owns
the action registry and treats this task as order-independent, so no
`dashboard/keymap.rs` edit belongs here. `0252.4` excludes dashboard delete
work. `0252.8` is PTY test infrastructure and is unrelated to these
non-PTY proofs.
"""
scope = """
## Binding decisions — the code does not decide these today

These bound the outcome regardless of the route taken. They are settled;
the run does not re-litigate or escalate them.

1. **`--failed` means exact coarse `Status::Failed`** on the persisted
   ledger (content fact 1) — not the dashboard's broader `SessionGroup::Failed`,
   and not any `DriveOutcomeKind`. The target names `--interrupted` as the
   next sibling selector, and folding interrupted runs into `--failed` now
   would leave that flag nothing to select.
2. **An unreadable ledger is never selected by `--failed`.** A parse failure
   is not evidence of `Status::Failed`. Unreadable rows stay visible in the
   dashboard's failed group and stay deletable there — row by row and through
   the group verb — on the existing known-artifacts-only branch.
3. **The live skip counts `--failed` candidates only**: a candidate whose
   driver lock is held at probe time, plus one whose maintenance acquisition
   loses the race (the TOCTOU close). Live sessions that are not `--failed`
   candidates are never counted; the panel must not report a number about
   sessions the command never proposed to touch. A probe ERROR is neither
   deleted nor live-skipped — it fails closed as a per-item refusal.
4. **`deleted` counts ledgers that are actually gone** (content fact 4). A
   count that includes a ledger still on disk is a stop condition, not a
   rounding error.
5. **Residue has two tiers, and neither is silent.**
   - EXECUTION residue — something the delete attempted and could not
     complete: a worktree or branch left in place after a failed removal, a
     ledger left in place, sidecars left in place. It is a failure: reported
     per session, and it closes `blocked` with exit 1.
   - PLAN-TIME residue — the `worktree_note` case, where provenance names a
     worktree that is foreign or unregistered and was therefore never this
     command's to remove (content fact 5). It is reported per session as a
     note and does NOT by itself flip the closing state, because
     `plan_delete_for_ledger` emits that note for every session whose
     worktree is already gone; treating it as failure would make `blocked`
     the ordinary outcome and drown the real ones.
   - Binding either way: no ledger is removed while a known worktree or
     branch residue goes unreported, on either surface.
   - The retained driver-lock inode is deliberate anti-race behaviour
     (`dashboard.rs:4888-4891`) and is never residue and never a failure.
6. **Group membership is rechecked as a group, and never against a value a
   dead session cannot hold.**
   - No group is special-cased at SELECTION. The group verb probes every row
     of the selected group and skips the held ones. For `live` that normally
     means every row is skipped and no modal opens; a live-header row whose
     driver has since died is unheld and is a legitimate target. The refusal
     is derived from probe evidence, never from a hardcoded group identity.
   - The eligibility rechecked under maintenance is evaluated WITHOUT
     liveness — maintenance ownership makes that a fact, not an assumption —
     so the expected value must be one such an evaluation can produce.
     Expecting `SessionGroup::Live` is unsatisfiable and is forbidden
     (content fact 6): it would refuse every live-header target
     unconditionally while the plan claimed they were deletable.
   - What the recheck must catch is a target that CHANGED state between
     confirm and execution — the case a `SessionClass`-valued recheck misses,
     because `AwaitingAgentOutput` and `AwaitingInput` share one class and
     sit in different groups.
7. **Group targets are identified by something stable.** Re-resolution by
   session id alone is forbidden (content fact 8); the ledger path — what the
   center itself keys on — or a repository-qualified identity is the stable
   handle. Re-resolution by index remains forbidden by standing doctrine.
8. **Counts count sessions.** A session that leaves two artifacts behind is
   one refused session, not two. Any number the surface prints is labelled
   for the thing it counts.
9. **Every refusal, skip and note names its session** — the session id, and
   the ledger path where the id could not be read. A multi-session sweep whose
   diagnostics do not say WHICH item failed is not diagnosable.
10. **Deleted rows disappear on a later successful center discovery**,
    normally the next default two-second scan, not synchronously (content
    fact 7). This task adds no local row surgery — that would violate
    subscription ownership — and no test asserts an unconditional wall-clock
    bound.
11. **The panel keeps exactly the two rows the target fixes**: the deleted
    count, and the live skip only when it is nonzero. No ledger, lock,
    worktree, selector or `next:` row on any path. Detail goes to stderr.
12. **The moved destructive entry points keep their current names**
    (`plan_delete`, `plan_delete_for_ledger`, `execute_delete`,
    `execute_confirmed_delete`). Nothing about the goals requires renaming
    them, and a declared check reads those names to decide that exactly one
    implementation exists.
13. **The end-to-end proof target is `modules/cli/tests/proof_sessions_delete.rs`.**
    File names are otherwise guidance, but a declared check invokes
    `--test proof_sessions_delete`, so this one name is worth honouring.

## Explicitly excluded (owner ceiling — findings here are advisory board
material, never blocker cells)

- `modules/io/*`: every primitive is already public (content fact 2).
- `modules/cli/src/app/dashboard/keymap.rs`: SESSIONS already advertises
  `d delete`; `0252.6` owns that registry.
- `tui_kit.rs`: `0252.3` owns it; this task consumes `Modal::confirm` /
  `Modal::buttons` as they are.
- `run.rs`, `drive.rs`, `run_view.rs` and every run-side surface.
- `--interrupted` and every other selector; `--json`, `--verbose`,
  `--session-store` and dry-run for this command; machine-wide (`[ALL]`)
  scope for the CLI.
- Center-side deletion, synchronous row removal, and moving
  `SessionClass`/`SessionGroup`/`classify_session` out of `dashboard.rs`.
- Changing the non-forcing `git branch -d` behaviour, the retained lock
  inode, or the foreign-repository worktree safeguard.

## Suggested approach — guidance, not a boundary

### Expected files

- `modules/cli/src/app.rs`
- `modules/cli/src/app/session_delete.rs` (NEW)
- `modules/cli/src/app/dashboard.rs`
- `modules/cli/src/app/surface/cli.rs`
- `modules/cli/src/app/command_handlers.rs`
- `modules/cli/src/app/help_surface.rs`
- `modules/cli/src/app/presentation.rs`
- `modules/cli/tests/support/src/lib.rs`
- `modules/cli/tests/proof_repo_qualifier.rs`
- `modules/cli/tests/proof_output_style.rs`
- `modules/cli/tests/proof_sessions_delete.rs` (NEW)

Touching a file beyond this list is legitimate whenever a binding goal
requires it. Do it and report it in the work summary.

### Step 0 — read before editing

`dashboard.rs:978-1016`, `:4769-4970`, `:4972-5012` and the delete tests at
`:10240-10920`. Everything the extraction moves should move verbatim; only
return types need to change.

### Step 1 — extract the one destructive path

Add a sibling module (`modules/cli/src/app/session_delete.rs`, declared in
the alphabetical block of `app.rs` between `search` and `stats` at `:61-62`)
and move `DeletePlan` with its fields and `artifact_lines`,
`plan_delete_for_ledger`, `plan_delete`, `execute_delete` and
`execute_confirmed_delete` into it, `pub(crate)`, bodies unchanged except
where a decision below requires otherwise. `dashboard.rs` re-imports them so
existing call sites — including all of `mod tests` — keep compiling.

Two shape changes carry decisions 4, 5 and 9:

- `execute_delete` returns a typed report instead of a joined string: the
  same messages in the same order, plus an explicit removed-ledger bit set
  only on a successful ledger removal, plus a residue list. Suggested split:
  execution-residue entries (the `worktree … left in place`,
  `branch … left in place`, `ledger left in place`, `sidecars left in place`
  lines it already builds) and the plan's `worktree_note`, kept distinct so
  the caller can apply decision 5's two tiers. `driver lock retained (stable
  lock inode)` is neither.
- `execute_confirmed_delete` returns a typed outcome
  (`DriverHeld | SessionChanged | EligibilityChanged | PlanChanged |
  Executed(report)`) whose rendering yields EXACTLY today's strings —
  `"delete refused: driver lock is now held"`, `"delete refused: session
  changed; reopen it"`, `"delete refused: session eligibility changed;
  reopen it"`, `"delete plan changed; review the refreshed artifact list"` —
  so the dashboard footer text is unchanged and the landed
  `apply_session_action` tests keep asserting the same strings.

`DeleteEligibility` reads `SessionClass`/`MergeClass`/`classify_session`/
`classify_merge`, all dashboard-private. Suggested route: keep the eligibility
type in `dashboard.rs` and make the shared executor generic over an
eligibility PREDICATE plus an allows-unreadable flag, rather than paying the
blast radius of moving the classifier family. Preserved exactly either way:
maintenance-first acquisition, authoritative reread, identity check,
eligibility check, plan rebuilt under the lock, suppression of the lock file
maintenance may itself have created, artifact-list drift refusal,
stale-metadata clearing.

Call sites that change are mechanical: the two dashboard appliers
(`dashboard.rs:5311`, `:5500`) and the direct assertions in `mod tests`
(`:10257`, `:10288`, `:10333`, `:10426`, `:10457`, `:10665`) render the typed
outcome and pass the predicate. Their assertions should not change — that is
the point: the extraction is proved by the SAME landed refusal tests still
passing through the shared implementation.

Build here: `CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

### Step 2 — bulk selection and the CLI handler

In the same module, a scan parameterized by store path (so the selection
rules are unit-testable against a scratch directory) plus a zero-argument
production entry point that supplies `default_session_store()`. No
`--session-store` flag is added. Suggested scan:

1. `session_store_paths(Some(store))` — sorted regular `*.json` children of
   that one store, empty for a missing store, symlinks already excluded
   (content fact 2).
2. `read_run_session`; an unreadable ledger is skipped, not selected
   (decision 2). That call is also the symlink-boundary authority — do not
   re-implement it with a raw read.
3. Keep only exact `Status::Failed` (decision 1).
4. `run_control::probe`: held → live skip; error → per-item refusal naming
   the session (decisions 3 and 9); unheld → continue.
5. `plan_delete_for_ledger(&path, None, …)`. `repo_path: None` is correct
   rather than a shortcut: this store IS the current repository's store, and
   the planner reads `None` as same-repository.
6. `execute_confirmed_delete` with an eligibility predicate of exact
   `Status::Failed` and unreadable-ledger deletion disallowed. The recheck
   under maintenance ownership is what closes the window in which a stale
   `Failed` ledger is being re-driven — liveness overrides persisted state,
   so classification alone is never sufficient.
7. Fold: a lost maintenance race is a live skip; an executed report
   contributes its removed-ledger bit to `deleted` and its residue to the
   two tiers of decision 5; any other outcome or error is one refused
   SESSION (decision 8) carrying its identity (decision 9). One unreadable
   or unprobeable ledger never aborts the sweep.

The handler prints stderr detail first, then builds one panel through the
landed grammar (`Panel::new` + `.row`, `emit_human(false, …, Compact, …)`),
`passed` when nothing failed and `blocked` otherwise, with the two rows of
decision 11 — `passed` matches the surrounding command convention (`state`,
`doctor`); only run-end uses a capitalized closing word. A failing sweep
returns `Error::AlreadyReported` with exit code 1 so the dispatcher does not
print a second line (content fact 10), and its message labels what its number
counts (decision 8). A bare invocation with no selector is refused; the Clap
group in Step 4 makes that unreachable in practice, but the handler guard
keeps it honest when a later selector changes the parser shape.

### Step 3 — the dashboard group verb

`open_delete_modal` becomes a two-way seam on
`state.sessions_visible[selected]`: a group header opens the group modal, a
session row enters today's body moved verbatim into a row-only helper.
`selected_session` itself must NOT change — it keeps returning `None` on a
header for the other verbs (content fact 7).

The group modal walks `state.sessions` with the same `session_group` that
`rebuild_visible_sessions` buckets with — the header's cached `count` is
display state and is not the selection source — probes each row, and captures
one target per unheld row with its plan, its stable identity (decision 7) and
its expected eligibility. Suggested eligibility: for an unreadable row, the
landed known-artifacts-only branch (the only branch that can delete a row
whose ledger cannot prove anything); otherwise a group-valued expectation
computed WITHOUT liveness at capture time, which is the value the recheck can
actually reproduce under maintenance and satisfies decision 6 for every group
including `live`.

With no targets, set one footer message naming the group and its skip counts
and open no modal — the ordinary outcome of `d` on the `live` header and on an
empty header. Otherwise open exactly ONE confirm whose body names the count
("Delete N session(s) in the <label> group?"), plus a skipped-live line and
an unprobeable line when nonzero. A group modal does not enumerate every
artifact the way single-row delete does; the target requires only that the
confirm name the count. `ModalHost` already yields one `(tag, outcome)` and
closes in the same call (`tui_kit.rs:702-749`), and `apply_action` already
filters ordinary cancellation (`dashboard.rs:5060-5099`) — nothing here opens
or chains a per-child confirmation.

ALL mode needs no override: a foreign-repository row's plan already records
its worktree and branch as left behind, because git operations are
repository-anchored.

The applier re-resolves each target by its stable identity, calls the shared
confirmed executor, and must not abort the remaining targets with `?` on one
failure. Its single footer message is bounded — deleted-of-total, then the
first refusal or residue line and a `(+N more)` tail — and must surface
residue as well as refusals (decision 5), because a partial cleanup that
prints only "deleted N of N" is exactly the silent case this plan forbids.
Then `state.reload()`, as the single-row arm already does (decision 10).

Build again: `CARGO_TARGET_DIR=target cargo build -p ctx-traits-cli`

### Step 4 — the public command surface

`surface/cli.rs`: a VISIBLE `Sessions` variant with a `Delete` subcommand and
a doc comment (Clap's `about` for the generated tree and
`internal help --json`), distinct from the untouched hidden singular
`internal session …`. A required Clap arg group holding `--failed` is what
makes a bare `sessions delete` fail rather than silently selecting
everything; declaring it multiple-capable is what lets `--interrupted` join
later as one added field. `traits_help_text` (`:35-67`) gains one line in the
`Manage:` block matching the variant's doc comment — the help body is
hand-authored, so a visible command without it would make the parser and the
displayed release surface disagree; the screen stays under its 40-row
ceiling.

`command_handlers.rs`: one arm in the exhaustive match, with the manage
commands, delegating to the Step 2 handler.

`help_surface.rs`: add the top-level name to the `manage` arm of `classify`
(`:44-97`), or `internal help --json` fails outright. Nested `delete` needs
no classification.

`presentation.rs`: add it to BOTH `REGISTERED_COMMAND_NAMES` and
`presentation_for`'s panel arm — the bidirectional gate (`:1209-1264`) walks
the real Clap tree and fails for either a missing or a stale registration.

### Step 5 — proofs

What each must prove is in `validation`; how to observe it is the run's
choice. Guidance from the grounding, not a pin:

- Move `active_repo_key` from `proof_repo_qualifier.rs:152-174` into shared
  support rather than making a second copy — the new proof needs the same
  answer to locate the scratch store. REUSE POINT.
- The bulk selector's exactness is cheapest as a unit against a scratch store
  written with the JSON-literal fixture shape already proven in
  `proof_center.rs:134-197`: mixed statuses plus one corrupt file, asserting
  that exactly the exact-`Status::Failed` ledgers are gone and that a
  `Rejected` ledger (inside the dashboard's failed GROUP) and the corrupt
  file both survive — decisions 1 and 2 in one test.
- The dashboard group units belong beside the code, reusing
  `State::new_without_worker`, `row_with_id`, `scratch_ledger_path`,
