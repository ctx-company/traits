## Step 4 — the public command surface

`modules/cli/src/app/surface/cli.rs`:

- `TraitsCommand` gains, with a doc comment (Clap's `about` for the
  generated tree and `internal help --json`):
  ```
  /// Bulk run-session maintenance for this repository's run-session store.
  Sessions {
      #[command(subcommand)]
      subcommand: SessionsCommand,
  },
  ```
  Visible — no `#[command(hide = true)]`. Distinct from the existing
  hidden singular `ctx traits internal session …` (`:1467`, `:2179-2191`),
  which is untouched.
- ```
  /// `ctx traits sessions ...` subcommands.
  #[derive(Subcommand, Debug)]
  pub enum SessionsCommand {
      /// Delete run sessions selected by outcome.
      Delete(SessionsDeleteArgs),
  }

  #[derive(Args, Debug)]
  #[command(group(clap::ArgGroup::new("selector").required(true).multiple(true)))]
  pub struct SessionsDeleteArgs {
      /// Delete every failed session in this repository's run-session store.
      #[arg(long, group = "selector")]
      pub failed: bool,
  }
  ```
  The required group is what makes a bare `ctx traits sessions delete`
  fail instead of silently selecting everything, and `multiple(true)` is
  what lets `--interrupted` join the family later as one added field. Only
  `--failed` is implemented now; no `--json`, `--verbose`,
  `--session-store`, or dry-run flag is added.
- `traits_help_text()` (`:35-67`) gains one line in the `Manage:` block,
  after `diff`, matching the variant's doc comment:
  `  sessions    Bulk run-session maintenance: delete --failed`.
  The help body is hand-authored, so a visible command without this line
  would make the parser and the displayed release surface disagree. The
  screen stays under its 40-row ceiling.

`modules/cli/src/app/command_handlers.rs`: one arm in the exhaustive
