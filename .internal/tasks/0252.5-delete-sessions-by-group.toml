advertises `d delete`; 0252.6 owns that registry), `tui_kit.rs` (0252.3 owns
it; this task uses `Modal::confirm` as it exists today), `run.rs`,
`drive.rs`, `run_view.rs`.

## Step 0 — read before editing (no edits)

Re-read `dashboard.rs:965-1003` (`DeletePlan`/`artifact_lines`),
`:4758-4958` (`plan_delete_for_ledger`, `plan_delete`, `execute_delete`,
`execute_confirmed_delete`), `:4961-4999` (`DeleteEligibility`), and the
delete tests at `:10244-10923`. Everything moved in Step 1 moves VERBATIM;
only the return types change.

## Step 1 — extract the one destructive path (`session_delete.rs`, `app.rs`)

Add `mod session_delete;` to `modules/cli/src/app.rs`, in the existing
alphabetical block (between `search` and `stats`).

MOVED out of `dashboard.rs` into `modules/cli/src/app/session_delete.rs`,
bodies unchanged unless stated, every item `pub(crate)` and every
`DeletePlan` field `pub(crate)` (dashboard tests build the literal):

- `pub(crate) struct DeletePlan { ledger_path, driver_lock_path,
  sidecars_root, worktree, worktree_note }` and
  `pub(crate) fn artifact_lines(&self) -> Vec<String>` — byte-identical.
- `pub(crate) fn plan_delete_for_ledger(ledger_path: &camino::Utf8Path,
  repo_path: Option<&str>, worktree:
  Option<&ctx_traits_core::procedure::session::WorktreeProvenance>) ->
  DeletePlan` — byte-identical.
- `pub(crate) fn plan_delete(ledger_path: &camino::Utf8Path,
  driver_lock_path: Option<camino::Utf8PathBuf>, sidecars_root:
  Option<camino::Utf8PathBuf>, worktree_provenance: Option<(&str, &str)>,
  same_repo: bool, verified: Option<(camino::Utf8PathBuf,
  camino::Utf8PathBuf)>) -> DeletePlan` — byte-identical.

NEW typed results, so a batch can count without parsing prose:

- `pub(crate) struct DeleteReport { pub(crate) ledger_removed: bool,
  pub(crate) left_behind: Vec<String>, messages: Vec<String> }` with
  `pub(crate) fn message(&self) -> String` returning
  `self.messages.join("; ")`.
- `pub(crate) enum ConfirmedDeleteOutcome { DriverHeld, SessionChanged,
  EligibilityChanged, PlanChanged, Executed(DeleteReport) }` with
  `pub(crate) fn message(&self) -> String` returning EXACTLY today's
  strings: `"delete refused: driver lock is now held"`, `"delete refused:
  session changed; reopen it"`, `"delete refused: session eligibility
  changed; reopen it"`, `"delete plan changed; review the refreshed
  artifact list"`, and `report.message()` for `Executed`. The dashboard's
  footer text is therefore unchanged, which is why the existing
  `apply_session_action` tests keep asserting the same strings.

CHANGED signatures:

- `pub(crate) fn execute_delete(plan: &DeletePlan) -> DeleteReport` — same
  body and same pushed strings, in the same order; additionally sets
  `ledger_removed = true` only on `Ok(())` from
  `std::fs::remove_file(plan.ledger_path…)`, and pushes into `left_behind`
  exactly the lines it already builds for a failure: `worktree … left in
  place: …`, `branch … left in place…`, `ledger left in place: …`,
  `sidecars left in place: …`. `driver lock retained (stable lock inode)`
  is NOT a failure and does not enter `left_behind` — the retained inode is
  the deliberate anti-race behavior at `dashboard.rs:4888-4891`.
- `pub(crate) fn execute_confirmed_delete<F>(ledger_path:
  &camino::Utf8Path, repo_path: Option<&str>, session_id: &str,
  allows_unreadable_ledger: bool, eligible: F, confirmed: &DeletePlan) ->
  crate::Result<ConfirmedDeleteOutcome> where F:
  Fn(&ctx_traits_core::procedure::session::Session) -> bool` — the body is
  today's, with `expected_eligibility.allows_unreadable_ledger()` replaced
  by the `allows_unreadable_ledger` parameter and
  `expected_eligibility.matches(&current)` by `eligible(&current)`.
  Generic over the predicate rather than over a moved eligibility type:
  `DeleteEligibility` reads `SessionClass`/`MergeClass`/`classify_session`/
  `classify_merge`, all dashboard-private, and moving that classifier
  family is a blast radius this task has no reason to pay for.
  Preserved exactly: `try_acquire_maintenance` first, authoritative reread,
  identity check, eligibility check, plan rebuilt under the lock, the
  `confirmed.driver_lock_path.is_none()` suppression of the lock file
  maintenance may itself have created, `artifact_lines()` drift refusal,
  `clear_stale_metadata()` before execution.

REMOVED from `dashboard.rs`: `struct DeletePlan`, `impl DeletePlan`,
`fn plan_delete_for_ledger`, `fn plan_delete`, `fn execute_delete`,
`fn execute_confirmed_delete`. `dashboard.rs` gains
`use crate::app::session_delete::{ConfirmedDeleteOutcome, DeletePlan,
execute_confirmed_delete, plan_delete, plan_delete_for_ledger};` so every
existing call site — including all of `mod tests` — compiles unchanged.

Call sites that DO change, all mechanical:

- `dashboard.rs:5419` (SESSIONS delete) and `:5601` (MERGES drop):
  `state.message = Some(execute_confirmed_delete(…,
  eligibility.allows_unreadable_ledger(), |session|
  eligibility.matches(session), &plan)?.message());`
- the direct `execute_confirmed_delete` assertions in `mod tests`
  (`:10260`, `:10291`, `:10336`, `:10429`, `:10668`): append `.message()`
  and pass the two new arguments the same way. Their assertions do not
  change — that is the point: the extraction is proved by the SAME
  replacement-session, eligibility-change, plan-drift,
  readable-to-unreadable, unchanged-readable, unchanged-unreadable, and
  worktree/branch-preservation tests still passing, routed through the
  shared implementation.

