content = """
Parent ruling 7: `ctx traits sessions delete --failed`. Plus the dashboard
counterpart — deleting a group header deletes that group behind ONE confirm
naming the count.

There is one robust artifact-deletion path in this codebase and it is
private inside `dashboard.rs`. This task adds a second and a third CONSUMER
of it, never a second implementation.

## Decisions this plan fixes (the code does not decide them today)

1. **`--failed` means exact coarse `Status::Failed`** on the persisted
   ledger (`modules/core/src/procedure/session.rs:95-108`) — nothing else.
   NOT the dashboard's `SessionGroup::Failed`, which also folds `Rejected`,
   `Blocked`, `BlockedCommandPermissionRequired`, `BlockedAgentUnassigned`,
   unreadable, interrupted, and killed (`dashboard.rs:1884-1955`). The
   target names `--interrupted` as the next sibling selector; folding
   interrupted into `--failed` now would leave that flag nothing to select.
   `DriveOutcomeKind` is deliberately NOT consulted: `drive.rs:1492-1525`
   persists `command-step-failed` / `harness-failed` / … as the outcome for
   sessions whose coarse status is `Failed`, so matching on the outcome kind
   would UNDER-select ordinary failed runs. The coarse status is the one
   ledger fact that already groups every terminal failure reason.
2. **An unreadable ledger is never selected by `--failed`.** A parse failure
   is not evidence of `Status::Failed`. Unreadable rows stay visible in the
   dashboard's failed group and stay deletable there, row by row and through
   the group verb, on the existing known-artifacts-only branch.
3. **`skipped: <n> live` counts `--failed` candidates only** — a candidate
   whose driver lock is `DriverProbe::Held` at probe time, plus one whose
   `try_acquire_maintenance` returns `None` (the TOCTOU close). Live rows
   that are not `--failed` candidates are never counted; the panel would
   otherwise report a number about sessions the command never proposed to
   touch. A probe ERROR is neither deleted nor live-skipped: it fails closed
   as a per-item refusal.
4. **`deleted` counts actually-removed ledgers.** `execute_delete` today
   returns a joined string and may remove sidecars even when the ledger
   removal failed, so a count cannot be parsed out of it — hence the typed
   `DeleteReport` in Step 1. A residual artifact (worktree or branch left in
   place, sidecar removal failure) does not change `deleted`; it is printed
   to STDERR, one line per item, and flips the panel's closing state to
   `blocked` with exit 1. Panel ROWS stay exactly the two the target fixes.
5. **The dashboard's live header is not special-cased.** Group delete probes
   every row of the selected group and skips held ones. For `live` that
   normally means every row is skipped and no modal opens. A live-group row
   whose driver has since died is unheld, and deleting it is correct — one
   code path, and the refusal is derived from probe evidence rather than
   from a hardcoded group identity.
6. **Deleted rows disappear on the center's next discovery scan (≤2s), not
   synchronously.** `state.reload()` reprojects the worker's cached center
   rows (`dashboard.rs:1425-1433`, `dashboard/worker.rs:398-449`); the
   center's scan emits `CenterDelta::Ended` for a vanished ledger
   (`center.rs:1564-1633`). This task does NOT add local row surgery — that
   would violate subscription ownership. No test asserts immediate removal.
7. **Group eligibility is rechecked as a GROUP.**
   `DeleteEligibility::Session(SessionClass)` is not sufficient:
   `AwaitingAgentOutput` (group `resumable`) and `AwaitingInput` (group
   `pending`) are both `SessionClass::Resumable`, so a row can leave its
   group between confirm and execution while passing today's recheck. Step 3
   adds a group-valued eligibility rechecked under maintenance ownership.

