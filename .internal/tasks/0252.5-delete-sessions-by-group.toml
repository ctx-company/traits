## Step 2 — bulk selection and the CLI handler (`session_delete.rs`)

NEW symbols in the same module:

- `#[derive(Default)] pub(crate) struct BulkDeleteOutcome { pub(crate)
  deleted: usize, pub(crate) skipped_live: usize, pub(crate) refusals:
  Vec<String> }`
- `pub(crate) fn delete_failed_sessions_in(store: &camino::Utf8Path) ->
  crate::Result<BulkDeleteOutcome>` — the whole scan, testable against a
  scratch directory:
  1. `ctx_traits_io::run_session::session_store_paths(Some(store.as_str()))?`
     — regular `*.json` files directly under that ONE store, sorted,
     empty for a missing store. `read_dir`'s `file_type()` does not follow
     symlinks, so a symlinked entry is already excluded.
  2. `read_run_session(&path)`; `Err(_) => continue` (decision 2). That
     call also rejects symlink ancestors and a symlink leaf before
     parsing, so the fail-closed boundary is preserved rather than
     re-implemented with a raw read.
  3. `if session.status != Status::Failed { continue }` (decision 1).
  4. `run_control::probe(&path)`: `Held(_)` → `skipped_live += 1`,
     continue; `Err(error)` → push `format!("{session_id}: could not probe
     the driver lock: {error}")` into `refusals`, continue (decision 3);
     `Unheld { .. }` → fall through.
  5. `plan_delete_for_ledger(&path, None,
     session.provenance.worktree.as_ref())`. `repo_path: None` is correct
     and not a shortcut: this store IS the current repository's store, and
     `plan_delete_for_ledger` reads `repo_path.is_none()` as
     same-repository.
  6. `execute_confirmed_delete(&path, None, session.session_id.as_str(),
     false, |current| current.status == Status::Failed, &plan)`. The
     recheck under maintenance ownership is what closes the window in
     which a stale `Failed` ledger is re-driven — liveness overrides
     persisted state, so classification alone is never sufficient.
     `allows_unreadable_ledger: false` per decision 2.
  7. Fold the result: `DriverHeld` → `skipped_live += 1` (decision 3);
     `Executed(report)` → `deleted += report.ledger_removed as usize` and
     one `refusals` line per `report.left_behind` entry; any other
     `Ok(refused)` → one `refusals` line carrying `refused.message()`;
     `Err(error)` → one `refusals` line. A single unreadable or
     unprobeable ledger never aborts the sweep.
- `pub(crate) fn delete_failed_sessions() -> crate::Result<BulkDeleteOutcome>`
  — `delete_failed_sessions_in(&ctx_traits_io::run_session::default_session_store()?)`.
  The ONLY production entry point, and the only place the
  current-repository scope is chosen. No `--session-store` flag is added;
  the parameterized form exists so the selection rules are unit testable
  against a scratch store.
- `pub(crate) fn handle_sessions_delete(failed: bool) ->
  crate::Result<ctx_traits_core::response::CommandOutput<()>>`:
  - `if !failed { return Err(crate::Error::Command { message: "sessions
    delete: choose what to delete, e.g. `--failed`".to_string() }); }` —
    the Clap group in Step 4 already guarantees this; the guard keeps the
    handler honest if a later selector changes the parser shape.
  - run `delete_failed_sessions()?`;
  - print each `refusals` line to STDERR with `eprintln!`, before the panel;
  - build the panel through the landed grammar and nothing else:
    `Panel::new("ctx", "sessions delete", status)` with
    `status = PanelStatus::Passed("passed".to_string())` when `refusals` is
    empty, else `PanelStatus::Blocked("blocked".to_string())`;
    `.row(PanelRow::toned("deleted", outcome.deleted.to_string(),
    RowTone::Default))`; and, only when `outcome.skipped_live > 0`,
    `.row(PanelRow::toned("skipped", format!("{} live",
    outcome.skipped_live), RowTone::Default))`. No third row exists on any
    path — no ledger, lock, worktree, selector, or `next:` row. `passed`
    matches the surrounding command convention (`state`, `doctor`); only
    run-end uses a capitalized closing word.
  - `emit_human(false, &panel, HumanOutputMode::Compact, || Ok(()))?` —
    `--json`/`--verbose` are out of scope, so the compact human branch is
    the only branch.
  - when `refusals` is non-empty, return
    `Err(crate::Error::AlreadyReported { message: format!("sessions
    delete: {} session(s) refused", outcome.refusals.len()), exit_code: 1 })`
    so the dispatcher exits 1 without printing a second error line
    (`command_handlers.rs:179-183`); otherwise `Ok(CommandOutput::new(()))`.

## Step 3 — the dashboard group verb (`dashboard.rs`)

NEW symbols:

- `#[derive(Clone)] struct GroupDeleteTarget { session_id: String, plan:
  DeletePlan, eligibility: DeleteEligibility }`
- `SessionAction` gains `DeleteGroup { group: SessionGroup, targets:
  Vec<GroupDeleteTarget> }`. ONE tag, one modal, applied once — the
  existing `ModalHost` focus trap dispatches a resolved modal exactly once
  through `apply_action` (`:2952-2965`, `:5087-5126`), and nothing here
  opens or chains a per-child confirmation.
- `DeleteEligibility` gains `SessionGroup(SessionGroup)`:
  - `allows_unreadable_ledger()` → `false` for the new variant (unchanged
    for the existing two).
  - `matches()` → recompute the group from the authoritative ledger while
    maintenance ownership is held, which means the session is definitively
    not being driven, so `live = false` is a fact and not an assumption:
    `let outcome = session.last_drive_outcome.as_ref().map(|o|
    &o.outcome); session_group(classify_session(false, &session.status,
    outcome), Some(&session.status), outcome) == expected`.
    Consequence, stated deliberately: for `SessionGroup::Live` this can
    never match, so the rare row that is confirmed unheld and then
    re-driven refuses with today's eligibility message instead of being
    deleted under a stale premise.
- `fn open_group_delete_modal(state: &mut State, group: SessionGroup)`:
  1. Walk `state.sessions`, keeping rows whose `session_group(row.class,
     row.status.as_ref(), row.outcome.as_ref())` equals `group` — the same
     function `rebuild_visible_sessions` buckets with. The header's cached
     `count` is display state and is NOT the selection source.
  2. Per kept row: `run_control::probe(&row.ledger_path)`. `Held(_)` →
     `skipped_live += 1`; `Err(_)` → `unprobeable += 1`; `Unheld { .. }` →
     build `plan_delete_for_ledger(&row.ledger_path,
     row.repo_path.as_deref(), row.worktree.as_ref())` and push a target
     with `eligibility =
     DeleteEligibility::Session(SessionClass::Unreadable)` when
     `row.class == SessionClass::Unreadable` (reusing the landed
     known-artifacts-only branch, which is the only branch that can delete
     a row whose ledger cannot prove anything), else
     `DeleteEligibility::SessionGroup(group)`.
  3. Empty targets → `state.message = Some(format!("delete refused:
     nothing deletable in the {} group ({skipped_live} live,
     {unprobeable} unprobeable)", group.label()));` and return with no
     modal. This is the ordinary outcome of pressing `d` on the `live`
     header (decision 5) and on an empty header.
  4. Otherwise open exactly one `Modal::confirm("delete group", body)`
     where `body` NAMES THE COUNT: `"Delete {n} session(s) in the {label}
     group?"`, plus a `"{skipped_live} live session(s) are skipped."` line
     when nonzero and a matching unprobeable line when nonzero. The target
     requires only that the confirm name the count; a group modal does not
     enumerate every artifact the way single-row delete does.
  5. ALL-mode (`state.all_repos`) is unchanged: a foreign-repository row's
     plan already records its worktree/branch as left behind
     (`plan_delete`'s `same_repo` arm), because git operations are
     repository-anchored. This task adds no override.

CHANGED symbols:

- `fn open_delete_modal(state: &mut State)` becomes the two-way seam and
  nothing else:
  ```
  match state.sessions_visible.get(state.list_sessions.selected()) {
      Some(VisibleRow::GroupHeader { group, .. }) => {
          let group = *group;
          open_group_delete_modal(state, group)
      }
      Some(VisibleRow::Session(_)) => open_session_delete_modal(state),
      None => {}
  }
  ```
  Today's entire body moves verbatim into
  `fn open_session_delete_modal(state: &mut State)`, still entered through
  `selected_session(state)`, so the per-row probe/refusal/warning/artifact
  modal is unchanged. `selected_session` itself is NOT changed — it must
  keep returning `None` on a header for `x`/`s`/`S`/`a`/Enter.
- `fn apply_session_action(...)` gains the `SessionAction::DeleteGroup`
  arm. For each target, re-resolve the row BY SESSION ID from
  `state.sessions` (never by index — the standing doctrine the single-row
  arm already follows), then call
  `execute_confirmed_delete(&row.ledger_path, row.repo_path.as_deref(),
  &target.session_id, target.eligibility.allows_unreadable_ledger(), |s|
  target.eligibility.matches(s), &target.plan)`. Count `Executed(report)`
  with `report.ledger_removed` as deleted; collect every other outcome, and
  every `Err`, as a refusal string — a group delete must NOT abort the
  remaining targets with `?` on one unprobeable ledger. Then:
  ```
  let mut message = format!("{}: deleted {deleted} of {total}", group.label());
  if let Some(first) = refused.first() {
      message.push_str(&format!("; {first}"));
      if refused.len() > 1 {
          message.push_str(&format!(" (+{} more)", refused.len() - 1));
      }
  }
  state.message = Some(message);
  state.reload();
  ```
  Bounded footer text, and `state.reload()` exactly as the single-row arm
  does (decision 6).

