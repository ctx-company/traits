   the `notified` slot, and one `[[procedure.sequence]]` step with
   `id`/`title = "{STEP_ID}"`, `agent = "agent:worker"`,
   `prompt = "Stream."`, `output = ["slot:notified"]`.

### 2c — the key-driven call site

- Two new file-local constants:
  `const LIVE_AGENT_TICK: &str = r"live tick [0-9]";` — the ONLY readiness
  pattern for key delivery, and post-spawn by construction: only the stub
  harness's own stdout produces that text.
  No `LIVE_AGENT_LABEL` constant is added: the label is ratatui-painted
  (content Correction 1 proves it is painted pre-spawn, and the owner
  ruling below removes raw-stream assertions on painted text), so the
  matched `LIVE_AGENT_TICK` wait itself is the agent-frame evidence.
- `ctrl_c_during_a_live_run_restores_the_screen_before_the_kill_note`
  (`:264-290`) switches its fixture to `agent_trait_fixture("ctrl-c")` and
  keeps ONE step, now `(LIVE_AGENT_TICK, "\\x03")` — the raw string, not
  `\\u{3}`. ETX is sent only after the agent's own output is on screen,
  under the Step 1 deadline. Its existing assertions (non-zero code, alt
  screen entered and left, the `run killed; terminal restored` line, no
  `STEP_ID` after restore, `│   ` prefixes, no `CLEAR_VIEWPORT`) are
  unchanged, plus two additions under the owner ruling (2026-08-27,
  terminal-diff-aware markers: ratatui's diff renderer may split painted
  text across cell updates, so no proof may demand byte-contiguity of
  UI-painted text in the raw stream):
  the agent-frame evidence is the `LIVE_AGENT_TICK` wait itself having
  matched — child passthrough bytes are contiguous by construction, and
  only the stub agent produces that text; no assertion on the
  ratatui-painted `LIVE_AGENT_LABEL` is made against the raw stream.
  And `assert!(raw.find("live tick").unwrap() < raw.rfind(LEAVE_ALT).unwrap());`
  — the key landed after real agent output (passthrough, contiguous) and
  before teardown.
- `dashboard_attach_then_exit_leaves_no_run_frame` (`:217-239`) drops
  `thread::sleep(Duration::from_secs(1))` at `:221` and changes its FIRST
  step pattern from `"session-"` to the escape-tolerant form of
  `live (1)`, so a bounded marker wait replaces the sleep outright.
  Owner ruling (2026-08-27, terminal-diff-aware markers): `live (1)` is
  ratatui-painted and may be split across cell updates, so both the wait
  pattern and the post-hoc assertion match the marker text while
  permitting ANSI escape runs between its characters — the support crate
  gains one small escape-tolerant matcher used by both; the marker text
  itself is unchanged and no terminal-state reconstruction is
  introduced. `kkkkkkkkj\\r` stays: it still clamps
  to the top live-group header, moves to the first session and attaches.
  The count and the row come from the same `rebuild_visible_sessions` pass
  (`dashboard.rs:1919-2045`, rendered at `:8255-8274`), so a frame
  containing `live (1)` is a frame whose session row exists. Then assert
  the same escape-tolerant match of `live (1)` over the captured raw
  stream. Do NOT assert the
  absence of `live (0)`: the dashboard's first paint legitimately precedes
  Center's discovery of the run, and forbidding it would be flaky. This is
  a sleep-for-marker swap, not evidence about the Center tuple — both
  sides of this test already went through `controlled_command` at HEAD.
- Out-of-band status assertions, one line each, covering all three
  helpers through their existing tests — no new fixture, no new run:
  `assert!(!raw.contains(support::PTY_CHILD_EXIT_SENTINEL))` in
  `sigterm_leaves_only_the_interrupted_failure_panel` (signal helper, code
  143), `clean_run_teardown_discards_the_live_frame_and_prints_the_final_panel`
  (cursor-reply helper, code 0), and
  `ctrl_c_during_a_live_run_restores_the_screen_before_the_kill_note`
  (key helper, non-zero code). Using the constant, not a literal, is what
  keeps the proof file free of the sentinel text.
- One new test for the causal diagnostic:
  `#[should_panic(expected = "PTY child exited before __NEVER_PAINTED__ ever appeared")]`
  `fn a_marker_that_never_appears_names_itself_in_the_panic()` — a
  `command_trait_fixture("diagnostic", "true")` run driven with one step
  whose pattern is `"__NEVER_PAINTED__"`. The child exits first, so this
  exercises the `__PTY_EOF_BEFORE__` branch in bounded time (~1s) rather
  than burning the full 30-second deadline, and the full expected fragment
  (not a bare `"exited before"`) is what actually proves the missing
  marker is NAMED and that `pty_record` did not truncate a payload that
  itself contains `__`.
- Do not delete the `thread` / `Duration` imports: `ledger_session_id`
  still uses both for its bounded 100ms ledger poll.

## Out of scope

- Any product-code change: `interrupt.rs`, `tui_ratatui.rs`, the run
  view, the dashboard, signal escalation, alternate-screen behaviour, and
  the 0252.1 panel grammar are all untouched. If a proof only passes by
  changing product code, that is a finding for 0252.4, not a licence. In
  particular, do NOT make a refresh stop painting the active label
  pre-spawn to rescue the old marker; the fixture supplies post-spawn text
  instead.
- 0252.4's modal contract and its five representative proofs — they
  consume this baseline.
- The seven bespoke `Command::new("expect")` scripts in
  `proof_run_startup_progress.rs`. They do not use the shared key/marker
  helper; converting them is scope creep. They must still compile and
  pass.
- Widening the workspace to make `modules/cli/tests/support` a member.
  It is a path dev-dependency, so its own unit tests would not run in the
  normal gate — which is exactly why every helper-level proof above lives
  in the `ctx-traits-cli` integration test that already exercises it.
- Reading `/dev/tty` for readiness in any form. It is dead and stays
  absent.
"""
