scope = """
## Decisions

- One PTY key/marker helper stays the route for all key-driven PTY
  proofs: `support::run_pty_keys_after_markers`, with its existing public
  signature and ETX passed as one byte 0x03 spelled in Rust source exactly
  as the existing `"\\u{3}"` — that is the sole ETX representation in this
  plan, never a raw string of the four characters backslash-x-0-3, and no
  other spelling is introduced. `PtyKey` and
  `run_pty_raw_keys_after_markers` are forbidden names; neither exists at
  HEAD, so neither is deleted.
- All three helpers converge on ONE private execution seam that launches
  Expect through `controlled_command`, then removes `NO_COLOR` from that
  builder (content Correction 4). `controlled_command` remains the sole
  declaration of the Center tuple, locale and TMPDIR; the tuple is never
  re-declared in a second place, and no product eligibility predicate is
  touched.
- Child status and every driver diagnostic travel on Expect stderr. The
  returned `String` is built from stdout only and carries no
  Expect-driver status or diagnostic metadata. (Not "product bytes
  exclusively": the caller-supplied shell completion marker of
  `run_pty_with_cursor_reply` is printed inside the PTY by the wrapped
  shell and legitimately stays in the returned stream.)
- Readiness is a marker wait under ONE 30-second deadline shared by every
  marker wait, enforced by `remaining` AND `exp_continue -continue_timer`,
  with a causal panic naming the marker that never appeared. No fixed
  sleeps, no `/dev/tty`, no filesystem readiness protocol, no new helper
  parameter.
- Keys are delivered only after a marker whose text only the spawned child
  can have produced (content Correction 1). For the Ctrl-C proof that is
  the stub agent's `live tick <n>`. No fallback to a pre-spawn label.
- Markers over ratatui-painted text go through the single escape-tolerant
  matcher pair (content Correction 5); markers over child passthrough text
  do not need it.
- The bounded wait for the child's own exit after the last key/signal is
  NOT readiness and carries its own diagnostic and its own budget.
- The compact failure-panel grammar (0252.1) and every product surface
  are untouched.

## Expected files — guidance, not a boundary

- `modules/cli/tests/support/src/lib.rs`
- `modules/cli/tests/proof_run_view_exit_teardown.rs`

Touching files beyond this list is legitimate whenever a named Done-when
requires it (a caller that stops compiling, an import that goes unused, a
sibling proof that the shared-environment convergence perturbs). Do it,
and report it in the work summary — it is not a violation and it is not
an owner escalation. The three other callers of
`run_pty_with_cursor_reply` — `proof_run_startup_progress.rs:308`,
`proof_task_queue_pane_handoff.rs:100`,
`proof_task_queue_refusal_teardown.rs:156` — are expected collateral,
because the seam changes the environment their children run under.
`modules/cli/tests/support/Cargo.toml` is deliberately NOT expected: the
matcher below adds no dependency.

## Step 0 — read before editing

`modules/cli/tests/support/src/lib.rs:29-69` (`strip_escapes`), `:324-367`
(`controlled_command`) and `:613-763` (the three helpers), then
`modules/cli/tests/proof_run_view_exit_teardown.rs` end to end. The three
helper bodies are near-identical; the seam below is the deduplication.

## Step 1 — one execution/status/diagnostic seam in support

`modules/cli/tests/support/src/lib.rs`. New symbols, exact signatures:

```
pub const PTY_CHILD_EXIT_SENTINEL: &str = "__CHILD_EXIT__";

pub fn escape_tolerant_pattern(literal: &str) -> String
pub fn contains_escape_tolerant(raw: &str, literal: &str) -> bool

const PTY_DEADLINE_SECS: u64 = 30;
const PTY_EOF_GRACE_SECS: u64 = 30;
const PTY_TIMEOUT_RECORD: &str = "__PTY_TIMEOUT__";
const PTY_EOF_BEFORE_RECORD: &str = "__PTY_EOF_BEFORE__";
const PTY_HANG_RECORD: &str = "__PTY_HANG__";
const PTY_ANSI_RUN: &str = r"(?:\\x1b\\[[0-9;]*[a-zA-Z])*";
const PTY_CURSOR_BRANCH: &str =
    r#"-re {\\x1b\\[6n} { send -- "\\033\\[40;120R"; exp_continue -continue_timer }"#;

fn run_pty_script(script: &str, startup_bin: &Path, cwd: &Path, home: &Path) -> (i32, String)
fn pty_record(stderr: &str, prefix: &str) -> Option<String>
fn pty_script_prelude() -> String
fn pty_marker_wait(pattern: &str, on_match: &str) -> String
fn pty_final_wait(what: &str, extra_arms: &str) -> String
```

### 1a — the execution seam

`run_pty_script` builds
`controlled_command(Path::new("expect"), &["-c", script], cwd, home)`,
then `.env_remove("NO_COLOR")` (content Correction 4 — the seam's ONE
deliberate subtraction, commented as such),
`.env("TERM", "xterm-256color")`, `.env("CTX_STARTUP_BIN", startup_bin)`,
takes `output()`, decodes `String::from_utf8_lossy(&output.stderr)`, and
then, IN THIS ORDER:

1. `pty_record(&err, PTY_EOF_BEFORE_RECORD)` → `panic!("PTY child exited
   before {what} ever appeared")`
2. `pty_record(&err, PTY_TIMEOUT_RECORD)` → `panic!("PTY marker never
   appeared within {PTY_DEADLINE_SECS}s: {what}")`
3. `pty_record(&err, PTY_HANG_RECORD)` → `panic!("PTY child never exited
   within {PTY_EOF_GRACE_SECS}s while waiting for child exit ({what})")`
   — the wording claims only what the block actually waited on (content
   Correction 6); it never says "after {marker}".
4. `assert!(output.status.success(), "PTY driver failed: {output:?}")`
5. `pty_record(&err, PTY_CHILD_EXIT_SENTINEL)` parsed as `i32`, panicking
   with the stderr text when absent
6. returns `(code, String::from_utf8_lossy(&output.stdout).into_owned())`

The three diagnostic branches MUST run before the success assertion: those
Tcl arms `exit 2`, so asserting success first destroys the causal message.
The three timeout/EOF/hang records are distinct because they mean different
things — a readiness marker that never painted, a child that died first,
and a child that would not exit — and only the first two are readiness.

`pty_record` parses LINE-WISE: find the first trimmed stderr line starting
with `prefix`, strip that prefix, strip exactly one trailing `"__"`, return
the whole remaining payload. Splitting on the next `__` is wrong — a marker
may itself contain `__` (`__NEVER_PAINTED__` renders as
`__PTY_EOF_BEFORE____NEVER_PAINTED____` and must parse back to
`__NEVER_PAINTED__`).

### 1b — the escape-tolerant matcher pair

One literal is the authority; two mechanisms read it.

`escape_tolerant_pattern(literal)` walks `literal` char by char, pushing a
`\\` before any ERE metacharacter (`\\ ^ $ . [ ] | ( ) * + ? { }`) and then
the char itself, and inserting `PTY_ANSI_RUN` BETWEEN adjacent characters
(not before the first, not after the last). `"live (1)"` compiles to
`live<RUN> <RUN>\\(<RUN>1<RUN>\\)` with `<RUN>` = `(?:\\x1b\\[[0-9;]*[a-zA-Z])*`,
a form verified accepted by the local Expect 5.45. `PTY_ANSI_RUN` contains
no brace, so a pattern stays brace-balanced inside `-re {…}`; escaped
braces from a literal are safe too (Tcl does not count a backslashed brace
for nesting). Doc-comment the function with its intended input: a plain
painted literal, not a regex.

`contains_escape_tolerant(raw, literal)` is
`strip_escapes(raw).contains(literal)` — the same tolerance realised
post-hoc by the existing stripper (`:29-69`), which is why support needs no
regex dependency and `support/Cargo.toml` stays dependency-free.

### 1c — the script builders

`pty_script_prelude` emits, once per script, IMMEDIATELY AFTER the helper's
`spawn` line (spawn first, then prelude — a deadline that starts before the
child exists would charge process startup to readiness):

```
set child_status {}
set deadline [expr {[clock seconds] + <PTY_DEADLINE_SECS>}]
proc remaining {what} {
    global deadline
    set left [expr {$deadline - [clock seconds]}]
    if {$left <= 0} {
        puts stderr "__PTY_TIMEOUT__${what}__"
        exit 2
    }
    return $left
}
```

`${what}` braces are mandatory — bare `$what__` parses as a variable named
`what__` and the record comes out empty.

`pty_marker_wait(pattern, on_match)` emits one budgeted readiness block —
the shared shape for BOTH the key helper's steps and the signal helper's
readiness phase:

```
set timeout [remaining {<pattern>}]
expect {
    <PTY_CURSOR_BRANCH>
    -re {<pattern>} { <on_match> }
    timeout { puts stderr "__PTY_TIMEOUT__<pattern>__"; exit 2 }
    eof { puts stderr "__PTY_EOF_BEFORE__<pattern>__"; exit 2 }
}
```

`pty_final_wait(what, extra_arms)` emits the child-lifetime block and the
out-of-band status record:

```
set timeout <PTY_EOF_GRACE_SECS>
expect {
    <PTY_CURSOR_BRANCH>
    <extra_arms>
    timeout { puts stderr "__PTY_HANG__<what>__"; exit 2 }
    eof { set child_status [wait] }
}
puts stderr "__CHILD_EXIT__[lindex $child_status 3]__"
```

Every `puts` in every script becomes `puts stderr` — status record and all
three diagnostic records. `run_pty_with_cursor_reply`'s caller-supplied
completion marker is NOT touched: it is printed by the wrapped shell
(`printf '{marker}\\n'`) inside the PTY, it is a separate established
contract, and `proof_task_queue_pane_handoff`,
`proof_task_queue_refusal_teardown` and `proof_run_startup_progress`
locate it to delimit committed output.

Removed by this step: the three hand-rolled `Command::new("expect")`
builder chains (`:622-655`, `:668-704`, `:743-754`) and the three copies
of the stdout sentinel-parse tail (`:656-663`, `:705-712`, `:755-762`).
No public symbol is removed. These three public signatures keep their exact
names, parameter order and return types:

```
pub fn run_pty_with_cursor_reply(
    binary: &Path,
    args: &str,
    cwd: &Path,
    home: &Path,
    marker: &str,
    termios_file: &str,
) -> (i32, String)

pub fn run_pty_signal_after_marker(
    binary: &Path,
    args: &str,
    cwd: &Path,
    home: &Path,
    ready_pattern: &str,
    signal: &str,
    repeat: usize,
) -> (i32, String)

pub fn run_pty_keys_after_markers(
    binary: &Path,
    args: &str,
    cwd: &Path,
    home: &Path,
    steps: &[(&str, &str)],
) -> (i32, String)
```

Per-helper script assembly after the extraction — spawn line first,
prelude second, waits third, in every helper:

- `run_pty_with_cursor_reply`: its existing `spawn -noecho /bin/sh -c
  "stty …; $env(CTX_STARTUP_BIN) {args}; …"` line verbatim, prelude, then
  `pty_final_wait("the wrapped command", "")`. It has no readiness marker,
  so it charges nothing to the deadline; it gains a `timeout` arm it never
  had, so a hung child now reports `__PTY_HANG__the wrapped command__`
  instead of falling through to an empty status parse. The hang text names
  the wait, not the marker, because this block never matches the marker.
- `run_pty_signal_after_marker`: its existing direct
  `spawn … exec $env(CTX_STARTUP_BIN) {args}`, prelude, then
  `pty_marker_wait(ready_pattern, "<kill loop>")` where the kill loop is the
  current `for {set i 0} {$i < {repeat}} {incr i} { exec kill -{signal}
  [exp_pid] }` body WITHOUT `exp_continue` (the block ends on match), then
  `pty_final_wait("the signalled child", extra_arms)` where `extra_arms` is
  `-re {{ready_pattern}} { <same kill loop>; exp_continue -continue_timer }`.
  That two-phase split is what makes EOF-before-marker causal while a normal
  signalled EOF still records status; keeping the re-signal arm in phase two
  preserves today's behaviour of re-signalling on a later repaint, which the
  repeated-SIGINT proof relies on.
- `run_pty_keys_after_markers`: existing spawn, prelude, one
  `pty_marker_wait(pattern, "send -- {{key}}")` per step, then
  `pty_final_wait("the last key", "")`.
- All three end by calling `run_pty_script(&script, binary, cwd, home)` and
  returning its pair unchanged.

The literal `set timeout 30` disappears from the file — both budgets are
interpolated from the two consts. Every occurrence of the token
`exp_continue` anywhere in this file — code, doc comment or prose comment —
must be written `exp_continue -continue_timer`, because validation criterion
5 proves the timer discipline by counting occurrences of both forms in the
whole source.

Build after this step:
`CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown --no-run`

## Step 2 — the proofs consume product bytes only

`modules/cli/tests/proof_run_view_exit_teardown.rs`. Every change here is
test-side; `ExitFixture`'s fields, the trait id/path constants, and the
trust/activate calls stay as they are, and no filesystem readiness signal
or argv rewrite is introduced.

- `assert_only_interrupted_panel` (`:135-153`) loses
  `&& !line.contains("CHILD_EXIT__")` from its filter. Nothing replaces
  it: with the sentinel out of band the four product lines stand alone.

### 2a — one fixture scaffold, two fixtures

Split the body of `command_trait_fixture` (`:29-79`) so the agent fixture
is not a second scaffold:

`fn scaffold_fixture(scratch: ScratchRoot, index_toml: &str, runtime: Option<&str>) -> ExitFixture`

It takes the COMPLETE trait source as a string (the two fixtures need
different `schema-version` headers, so splicing a shared header is wrong)
and does exactly what `command_trait_fixture` does today: create
`.ctx/traits/demo/generated`, `git_init`, write the same `.gitignore`,
write `index_toml` to `.ctx/traits/demo/generated/index.toml`, write
`trait.toml`, write `runtime` to `.ctx/traits/runtime.toml` when `Some`,
`git add -A` and commit, then `traits trust --approved TRAIT_PATH` and
`traits state --active --file TRAIT_PATH`, and return `ExitFixture`.

`fn command_trait_fixture(label: &str, command: &str) -> ExitFixture`
keeps its exact signature and all five current call sites (`sigterm`,
`sigint`, `panic`, `dashboard`, `clean`); it now builds its existing
`schema-version = "0.2"` source string verbatim and delegates with
`ScratchRoot::new("p252-run-view-exit")` and `runtime = None`.

### 2b — the test-only agent fixture the Ctrl-C proof drives

`fn agent_trait_fixture(label: &str) -> ExitFixture`

1. `let scratch = ScratchRoot::new("p252-run-view-exit");` then
   `let harness = scratch.home().join("stub-agent.sh");` — outside the
   repo, so it is never committed.
2. `fn write_stub_agent_harness(path: &Path)` writes this exact script and
   sets mode `0o755` (`std::os::unix::fs::PermissionsExt`, same as
   `proof_center.rs:483-488`):

   ```
   #!/bin/sh
   if [ "$1" = "--fixture-probe" ]; then printf 'stub-1.0\\n'; exit 0; fi
   cat >/dev/null
   i=0
   while [ "$i" -lt 60 ]; do
     i=$((i+1))
     printf 'live tick %s\\n' "$i"
     sleep 1
   done
   ```

   Three properties are load-bearing. Distinct text per line: `LiveLine`
   keeps the `(initialization)` fallback until `NARRATION_SOFT_TIMEOUT`
   (2s — `tui.rs:189-207`, `:247`) and `RunPanel::push_bytes` only calls
   `update_live_display` when the display changed (`run_view.rs:736-761`),
   so a single chunk could stall behind the placeholder while a ticking
   one cannot. Plain non-JSON lines are legitimate text deltas
   (`harness_stream.rs:1258-1291`), so no stream-JSON envelope is needed.
   And the loop is BOUNDED at 60 iterations: a proof that dies before
   sending ETX must not leave an infinite `while :` orphan spinning on the
   machine (same guard idiom as `proof_center.rs:456`).
3. `runtime` is `.ctx/traits/runtime.toml` in the shape already proven at
   `proof_center.rs:403-430`: `schema-version = "0.4"`, `[harness.stub]`
   with `kind = "custom"`, `bin = <harness path>`,
   `transports = ["cli"]`, `version-probe = ["--fixture-probe"]`;
   `[harness.stub.cli]` with `argv = []`, `prompt-via = "stdin"`,
   `output = "claude-stream-json"`; and `[agent.role.worker]` with
   `harness = "stub"`, `transport = "cli"`. No narrator role is declared —
   that is what keeps RAW passthrough on the panel rather than narrator
   text (`drive.rs:909-925`, `drive.rs:9203-9216`).
4. `index_toml` mirrors `proof_center.rs:328-352`, NOT the command
   fixture's 0.2 header: `schema-version = "0.4"` (agent steps are a 0.4+
   shape — every `agent = "agent:…"` fixture in `modules/cli/tests` uses
   0.4 or later), `name = "{label}"`, the `[[agent]] id = "worker"` table
   with its `description`/`summary`, the `notified` slot, a `[procedure]`
   description, and one `[[procedure.sequence]]` step with
   `id`/`title = "{STEP_ID}"`, `agent = "agent:worker"`,
   `prompt = "Stream."`, `output = ["slot:notified"]`.

### 2c — the key-driven call sites

- Two new file-local constants:
  `const LIVE_AGENT_TICK: &str = r"live tick [0-9]";` — the ONLY readiness
  pattern for key delivery, post-spawn by construction (only the stub
  harness's own stdout produces that text) and contiguous by construction
  (harness passthrough, not painted UI), so it needs no escape tolerance.
  `const LIVE_DASHBOARD_MARKER: &str = "live (1)";` — the single literal
  authority for the dashboard's wait AND its post-hoc assertion.
  No label constant is added and no assertion is made on the
  ratatui-painted `in-progress worker@stub` label: content Correction 1
  proves it is painted pre-spawn, so it is not evidence, and the owner
  ruling forbids raw-stream assertions on painted text.
- `ctrl_c_during_a_live_run_restores_the_screen_before_the_kill_note`
  (`:264-290`) switches its fixture to `agent_trait_fixture("ctrl-c")` and
  keeps ONE step, now `(LIVE_AGENT_TICK, "\\u{3}")` — one byte 0x03. ETX is
  sent only after the agent's own output is on screen, under the Step 1
  deadline. Its existing assertions (non-zero code, alt screen entered and
  left, the `run killed; terminal restored` line, no `STEP_ID` after
  restore, `│   ` prefixes, no `CLEAR_VIEWPORT`) are unchanged, plus one
  addition:
  `assert!(raw.find("live tick").unwrap() < raw.rfind(LEAVE_ALT).unwrap());`
  — the key landed after real agent output and before teardown. The
  agent-frame evidence is the `LIVE_AGENT_TICK` wait itself having matched;
  there is no second, painted-text assertion.
- `dashboard_attach_then_exit_leaves_no_run_frame` (`:217-239`) drops
  `thread::sleep(Duration::from_secs(1))` at `:221` and changes its FIRST
  step pattern from `"session-"` to the escape-tolerant compilation of the
  same marker, so a bounded marker wait replaces the sleep outright:

  ```
  let live_one = support::escape_tolerant_pattern(LIVE_DASHBOARD_MARKER);
  … &[(live_one.as_str(), "kkkkkkkkj\\r"), …]
  ```

  then, after `drop(background)`:

  ```
  assert!(
      support::contains_escape_tolerant(&raw, LIVE_DASHBOARD_MARKER),
      "dashboard never showed {LIVE_DASHBOARD_MARKER}: {raw:?}"
  );
  ```

  `kkkkkkkkj\\r` stays: it still clamps to the top live-group header, moves
  to the first session and attaches. The count and the row come from the
  same `rebuild_visible_sessions` pass (`dashboard.rs:2016-2045`, rendered
  at `:8255-8274`), so a frame containing `live (1)` is a frame whose
  session row exists. Do NOT assert the absence of `live (0)`: the
  dashboard's first paint legitimately precedes Center's discovery of the
  run, and forbidding it would be flaky. This is a sleep-for-marker swap,
  not evidence about the Center tuple — both sides of this test already
  went through `controlled_command` at HEAD.
- Out-of-band status assertions, one line each, covering all three
  helpers through their existing tests — no new fixture, no new run:
  `assert!(!raw.contains(support::PTY_CHILD_EXIT_SENTINEL))` in
  `sigterm_leaves_only_the_interrupted_failure_panel` (signal helper, code
  143), `clean_run_teardown_discards_the_live_frame_and_prints_the_final_panel`
  (cursor-reply helper, code 0), and
  `ctrl_c_during_a_live_run_restores_the_screen_before_the_kill_note`
  (key helper, non-zero code). Using the constant, not a literal, is what
  keeps the proof file free of the sentinel text.
- One new test for the causal diagnostic:
  `#[should_panic(expected = "PTY child exited before __NEVER_PAINTED__ ever appeared")]`
  `fn a_marker_that_never_appears_names_itself_in_the_panic()` — a
  `command_trait_fixture("diagnostic", "true")` run driven with one step
  whose pattern is `"__NEVER_PAINTED__"`. The child exits first, so this
  exercises the `__PTY_EOF_BEFORE__` branch in bounded time (~1s) rather
  than burning the full 30-second deadline, and the full expected fragment
  (not a bare `"exited before"`) is what actually proves the missing
  marker is NAMED and that `pty_record` did not truncate a payload that
  itself contains `__`.
- Do not delete the `thread` / `Duration` imports: `ledger_session_id`
  still uses both for its bounded 100ms ledger poll.

## Out of scope

- Any product-code change: `interrupt.rs`, `tui_ratatui.rs`, the run
  view, the dashboard, signal escalation, alternate-screen behaviour, and
  the 0252.1 panel grammar are all untouched. If a proof only passes by
  changing product code, that is a finding for 0252.4, not a licence. In
  particular, do NOT make a refresh stop painting the active label
  pre-spawn to rescue the old marker, and do NOT relax
  `stderr_supports_live` to survive `NO_COLOR`; the fixture supplies
  post-spawn text and the seam subtracts the variable instead.
- 0252.4's modal contract and its five representative proofs — they
  consume this baseline.
- The seven bespoke `Command::new("expect")` scripts in
  `proof_run_startup_progress.rs` (`:130`, `:267`, `:365`, `:415`, `:456`,
  `:497`, `:581`). They do not use the shared key/marker helper;
  converting them is scope creep. They must still compile and pass.
- Widening the workspace to make `modules/cli/tests/support` a member.
  It is a path dev-dependency, so its own unit tests would not run in the
  normal gate — which is exactly why every helper-level proof above lives
  in the `ctx-traits-cli` integration test that already exercises it.
- Adding a regex dependency to `modules/cli/tests/support/Cargo.toml`.
  Step 1b's pair needs none.
- Reading `/dev/tty` for readiness in any form. It is dead and stays
  absent.
"""
validation = """
## Done when — each criterion with the command that decides it

1. The teardown suite passes with the truthful helper: seven tests
   (the six at HEAD plus the diagnostic one), including the sleep-free
   escape-tolerant `live (1)` dashboard wait, the Ctrl-C proof driven off
   the stub agent's own `live tick` output with its ordering assertion
   (`live tick` before the last `LEAVE_ALT`), and the unfiltered four-line
   failure panel. No assertion on ratatui-painted label text.
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown`
2. Exit status is out of band and stdout is clean: the same run reports
   143 / 130 / 0 / non-zero exactly as before while
   `PTY_CHILD_EXIT_SENTINEL` appears in no returned stream. Same command
   as 1 — the assertions live in those tests.
3. A marker that never appears panics causally, naming it in full. Same
   command as 1 — `a_marker_that_never_appears_names_itself_in_the_panic`
   with `expected = "PTY child exited before __NEVER_PAINTED__ ever appeared"`.
4. The other shared-helper callers stay green under the converged
   environment (`controlled_command` adds `LC_ALL`/`LANG=C`, `TMPDIR`,
   `env_clear` and the Center tuple to two helpers that previously had
   none — that, not colour, is the change most likely to move unrelated
   output; `NO_COLOR` is removed by the seam and those two children never
   had it):
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_startup_progress --test proof_task_queue_pane_handoff --test proof_task_queue_refusal_teardown`
5. No forbidden artifact, no stdout status transport, and a deadline that
   is actually enforced — `remaining` present, no literal per-block
   `set timeout 30`, and EVERY `exp_continue` carrying `-continue_timer`
   (the count equality is the substantive part: on expect 5.45 a bare
   `exp_continue` restarts the timer, measured 3.07s bounded vs still
   running at 12s):
   `! rg -n 'PtyKey|run_pty_raw_keys_after_markers' modules && ! rg -n '\\"__CHILD_EXIT__|CHILD_EXIT__\\"' modules/cli/tests/proof_run_view_exit_teardown.rs && ! rg -n 'puts \\"' modules/cli/tests/support/src/lib.rs && rg -q 'puts stderr' modules/cli/tests/support/src/lib.rs && rg -q 'set timeout \\[remaining' modules/cli/tests/support/src/lib.rs && ! rg -n 'set timeout 30' modules/cli/tests/support/src/lib.rs && [ "$(rg -o 'exp_continue' modules/cli/tests/support/src/lib.rs | wc -l | tr -d ' ')" = "$(rg -o 'exp_continue -continue_timer' modules/cli/tests/support/src/lib.rs | wc -l | tr -d ' ')" ] && ! rg -n 'sleep\\(Duration::from_secs' modules/cli/tests/proof_run_view_exit_teardown.rs`
   The sentinel predicate is deliberately narrow: it rejects the raw
   literal `"__CHILD_EXIT__` and the old
   `line.contains("CHILD_EXIT__")` filter workaround (both end or begin
   at a quote) while permitting the planned
   `support::PTY_CHILD_EXIT_SENTINEL` assertions, which name no literal.
   Proving the returned stdout is actually clean is criterion 2's job,
   not this grep's. The count equality searches the WHOLE support source,
   so a comment containing a bare `exp_continue` fails it even when the
   generated Tcl is correct — Step 1 requires every occurrence, prose
   included, to carry `-continue_timer`. The last grep targets the
   whole-second sleep only; `ledger_session_id`'s bounded
   `from_millis(100)` poll is a ledger wait, not key readiness, and
   legitimately survives.
6. The landing gate is green:
   `CARGO_TARGET_DIR=target just test-full`
   (`Justfile:152-180` exports its own gate target directory, so the
   prefix here is a caller convenience, not the final authority.)

## Order and bounded refinement

Run Step 0's read, then Step 1, then Step 2, running Step 1's `--no-run`
build before starting Step 2 so a seam or borrow error surfaces next to the
edit that caused it. Then run commands 1, 4, 5, 6 in that order.

Permit at most two targeted repair-and-rerun rounds. A round repairs one
named failure, then reruns the failed command AND every later command in
the list. If a third round would be needed, stop and report the failing
command with its output rather than continuing — that is the stop
condition, not a judgement call.

## Watch

- `run_pty_with_cursor_reply`'s caller marker is not the child-status
  sentinel. Removing it breaks three other proofs; only the
  `__CHILD_EXIT__` transport moves.
- A red result in command 4 is this task's own collateral (the converged
  environment), not a pre-existing failure — fix it here rather than
  reporting it as a baseline break. The Center tuple, `LC_ALL`/`LANG=C`,
  `TMPDIR` and `env_clear` reaching two children that never had them is
  the likeliest mover.
- If the Ctrl-C proof reports no alternate screen at all, the seam's
  `NO_COLOR` removal is missing or was re-added: `stderr_supports_live`
  (`tui.rs:226-236`) degrades `--progress tui` to status for ANY set
  `NO_COLOR`, and Expect propagates its own environment to the child.
  Fix the seam; never the predicate.
- If `live tick [0-9]` or the compiled `live (1)` pattern never matches,
  the panic already names the pattern. Read the raw stream it captured
  before changing anything: for the stub, check that the role assignment
  resolved, that `--fixture-probe` was answered, and that ticks are still
  arriving; for the dashboard, check whether the run reached live state at
  all. The one permitted repair is to widen escape tolerance through
  `escape_tolerant_pattern` — never a sleep, never a pattern a pre-spawn
  frame can satisfy, never `/dev/tty`.
- The Ctrl-C proof's fixture kind changes; its rescue assertions do not.
  If the restored screen differs for an agent frame, report that
  observation — do not weaken the assertion and do not edit product code
  to satisfy it.
- Test-helper metadata is out of band for every later PTY proof. A
  finding about helper bytes in an asserted stream is a defect in this
  task, not an acceptable filter in the caller.
"""

