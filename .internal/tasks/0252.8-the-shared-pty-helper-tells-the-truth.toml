title = "The shared PTY helper tells the truth"
status = "ready"
raised = "2026-08-27"
content = """
0252.4's 12-hour run died with four mandatory proofs permanently red, and
all four traced to the shared PTY test helper rather than product code —
the run's reviewer wrote the exact defect list (session 28f2ba9f22, final
verdict), which this task adopts as its contract:

1. Two of the three PTY helpers spawn their child without the isolated
   Center tuple, so anything they launch talks to the production,
   UID-scoped endpoint instead of the fixture's.
2. The helper sends keys (Ctrl-C) without a bounded, diagnosable wait on a
   post-spawn readiness marker; Resume/Restart proofs time out with no
   causal message. Owner ruling 2026-08-27: readiness is a marker waited
   on under a bounded deadline, never a fixed sleep and never a
   `/dev/tty` token.
3. The helper writes a `__CHILD_EXIT__<code>__` sentinel into PTY stdout
   after the child dies, so any rescue-output-is-last assertion sees
   helper metadata after the rescue panel. Owner ruling 2026-08-27: child
   exit status travels out-of-band (Expect stderr), never through the PTY
   byte stream a proof asserts on.

This is test infrastructure with no product-behaviour change; it exists so
0252.4 and every later PTY proof assert against product bytes only.

## How to read this plan

Goals and approach are separated, and only goals bind. `validation`'s
Done-when list, together with the binding constraints and exclusions at
the top of `scope`, is the contract: each states an observable outcome and
the existing command that decides it. Everything under "Suggested
approach" — expected files, symbol names and signatures, edit order, Tcl
shape, fixture scripts, marker literals, matcher construction — is the
architect's best route from the grounding, not a boundary. Deviate from
any of it whenever a goal requires it and report the deviation in the work
summary; that is not a violation and not an owner escalation.

## Grounded against HEAD 3dd9f570 (implementation code as of e7881711)

Defects 1 and 3 are confirmed verbatim in the code:

- `modules/cli/tests/support/src/lib.rs:622-664` (`run_pty_with_cursor_reply`)
  and `:668-713` (`run_pty_signal_after_marker`) build `Command::new("expect")`
  by hand and set only HOME/XDG/PATH/TERM/CTX_STARTUP_BIN. Neither exports
  `CTX_CENTER_SOCKET` / `CTX_CENTER_SPAWN_LOCK` / `CTX_CENTER_RUNS_ROOT` /
  `CTX_CENTER_INDEX`, nor `LC_ALL`/`LANG`/`TMPDIR`.
  `controlled_command` (`:324-367`) is the single existing authority for
  all of that; `modules/io/src/center.rs:550-569` proves the tuple is
  all-or-nothing (`incomplete private center configuration`), which is why
  it is never re-declared in a second place.
- Scope correction to defect 1 as originally written: the third helper,
  `run_pty_keys_after_markers` (`:716-763`), ALREADY goes through
  `controlled_command` (since 0243.5, `da5ec12e`), and `spawn_background_run`
  already goes through `spawn_ctx`/`controlled_command`. So the dashboard
  proof is not tuple-less at HEAD, and this convergence is not what turns a
  `live (0)` dashboard into `live (1)`. Convergence is still required —
  two helpers running children against the production endpoint is the
  defect — but no Done-when may claim it as the cause of a dashboard
  observation change.
- All three helpers end their Tcl with `puts "__CHILD_EXIT__[lindex
  $child_status 3]__"`. Plain Tcl `puts` is Expect's stdout, and the Rust
  side then searches that same stdout for the sentinel and returns it
  inside the asserted stream (`:656-663`, `:705-712`, `:755-762` — the
  same tail copied three times). The workaround is visible at
  `modules/cli/tests/proof_run_view_exit_teardown.rs:140`, where
  `assert_only_interrupted_panel` filters every restored line containing
  `CHILD_EXIT__` before asserting the four-line failure panel.
- `PtyKey` and `run_pty_raw_keys_after_markers` do not exist anywhere in
  Rust at HEAD; they are artifacts of the failed run's prose. Nothing is
  deleted for them — they stay forbidden. The current key API is already
  `steps: &[(&str, &str)]`, and
  `ctrl_c_during_a_live_run_restores_the_screen_before_the_kill_note`
  already transmits ETX through it (`"\\u{3}"`, one byte 0x03), so no
  raw-key variant is needed.

## Correction 1 — `in-progress {role}@{harness}` is NOT a post-spawn marker

An earlier draft asserted that the run view's narration label cannot be
painted before the agent child streams. That is false at HEAD, and the
readiness constraint is built on the refutation:

- `RunPanel::refresh` calls `narration_for` directly on every frame refresh
  (`modules/cli/src/app/run_view.rs:693-727`), and `narration_for`
  (`run_view/render.rs:1086-1096`) unconditionally attaches `active_label`.
- `LiveLine::current_display` (`tui.rs:189-207`) returns the
  `(initialization)` placeholder when nothing has streamed, and
  `display_narration` (`run_view/projection.rs:1036-1045`) paints the live
  narration row anyway while the run is live.
- More decisively, `drive.rs:2520-2533` pushes
  `starting session · dispatching {role}@{harness}…` BEFORE any probe or
  harness execution; the harness process is only launched later via
  `ctx_traits_io::harness::run` (`drive.rs:8317-8326`).

So no pattern anchored on `in-progress <role>@` is post-spawn, with a
command fixture or an agent fixture. Waiting on it and then sending ETX can
still deliver the key before the agent child exists — exactly the failure
this task removes. The inherited rule: **a readiness marker for key
delivery must contain text that only the spawned child could have
produced.** Text a harness child emits reaches the panel through
`RunPanel::push_bytes`, fed only by bytes the spawned harness already wrote
(`drive.rs:909-925` narrator-free passthrough; plain non-JSON lines become
text deltas at `harness_stream.rs:1258-1291`; rows and redraw at
`run_view.rs:736-761`).

## Correction 2 — a shared deadline needs `exp_continue -continue_timer`

Local Expect is 5.45, where plain `exp_continue` RESTARTS the current
timeout timer; only `exp_continue -continue_timer` preserves it. Every
cursor-reply branch at HEAD uses plain `exp_continue`, so a child that
repeatedly issues `ESC[6n` extends any nominal deadline without bound.
Measured on this machine (a child printing a line per second that never
emits the awaited pattern): with `-continue_timer` and a 3-second deadline
the driver exited after 3.07s; with plain `exp_continue` it was still
running when killed externally at 12s. Sizing each block from a shared
deadline is therefore not sufficient on its own — continuation arms must
preserve the timer too.

## Correction 3 — readiness and child-exit are different waits

`run_pty_signal_after_marker` uses ONE `expect` block for both the
readiness wait and the post-signal exit wait, and its `eof` arm always
records child status. Turning that single `eof` arm into a causal
"EOF before marker" record would misclassify every successful signalled
exit as a failure. Readiness and child-lifetime need behaviourally
distinct handling (separate blocks, or an equivalent state-aware form).
`run_pty_with_cursor_reply` never matches its caller completion marker at
all — it waits for EOF only — so its hang diagnostic may name the wait's
context, never a marker it did not observe.

## Correction 4 — convergence must SUBTRACT `NO_COLOR`, not deliver it

An earlier draft credited `controlled_command` with delivering `NO_COLOR=1`
to the PTY children. That is backwards, and taking it literally would make
this task's own proofs unsatisfiable:

- `controlled_command` sets `NO_COLOR=1` (`support/src/lib.rs:346`), and
  Expect propagates its environment to the child it spawns (verified
  locally).
- `stderr_supports_live` returns false for ANY set `NO_COLOR`
  (`modules/cli/src/app/tui.rs:226-237`). `drive.rs:1976-1984` then degrades
  even an explicit `--progress tui` to Status, and
  `command_handlers.rs:509-516` refuses the startup pane on the same
  predicate. With `NO_COLOR` set there is no run pane, no alternate screen,
  and no painted readiness text for a marker wait to find.
- The dashboard is unaffected because `dashboard::interactive_available`
  (`dashboard.rs:147-163`) checks TTY/CI/TERM but not `NO_COLOR` — which is
  why the key helper's dashboard proof survives the combination today while
  a run-pane proof driven through the same helper could not.

So the environment goal is: keep `controlled_command` as the SINGLE
environment and Center authority and subtract exactly the one
test-incompatible variable, `NO_COLOR`, at the PTY seam. Duplicating the
Center tuple, or relaxing a product eligibility predicate, would both be
wrong. Consequence for the collateral callers: the two hand-built helpers
never had `NO_COLOR` at all, so their children's colour behaviour is
unchanged; what actually changes for them is the Center tuple,
`LC_ALL`/`LANG=C`, `TMPDIR` and `env_clear` — that is the likely mover if
the collateral command goes red.

## Correction 5 — painted text is escape-split

Owner ruling 2026-08-27 (terminal-diff-aware markers): ratatui's cell diff
may emit cursor/style escapes between adjacent characters of painted text,
so no proof may demand byte-contiguity of UI-painted text in the raw
stream. `support::strip_escapes` (`:29-69`) already documents this and
already serves post-hoc assertions, but it cannot make an in-flight Expect
`-re` wait tolerant; nothing in the tree does that today. Text a harness
child emits needs no such tolerance — passthrough bytes reach the PTY
contiguously. Only ratatui-painted text does.

Dashboard specifics: group counts and session rows come from the same
`rebuild_visible_sessions` pass (`dashboard.rs:2016-2045`), rendered as
`<label> (<count>)` (`dashboard.rs:8255-8274`), so observing a painted live
group of one is evidence that a live session row exists. An initial
`live (0)` paint is legitimate — it precedes Center's discovery of the run
— and must never be asserted against.
"""
scope = """
## Binding constraints and exclusions

These bound the outcome regardless of the route taken.

- The returned `String` is built from Expect stdout only and carries no
  Expect-driver status or diagnostic metadata; child status and driver
  diagnostics travel out of band (Expect stderr). This is not "product
  bytes exclusively": `run_pty_with_cursor_reply`'s caller-supplied shell
  completion marker is printed inside the PTY by the wrapped shell and
  legitimately stays in the returned stream — three collateral proofs
  locate it to delimit committed output.
- Every PTY helper's child runs under the isolated environment authority
  `controlled_command` — the Center tuple, `LC_ALL`/`LANG=C`, `TMPDIR`,
  `env_clear`, PATH/toolchain passthrough — with `NO_COLOR` subtracted at
  the PTY seam (content Correction 4). The Center tuple is never
  re-declared in a second place.
- Readiness for key or signal delivery is a marker wait under a bounded
  deadline that is genuinely enforced while cursor queries keep arriving
  (content Correction 2), and a marker that never appears fails with a
  causal message naming the full marker payload — markers may themselves
  contain `__`, so a diagnostic parser must not truncate. No fixed sleep,
  no `/dev/tty`, no filesystem readiness protocol, no new helper parameter.
- Keys are delivered only after a marker whose text only the spawned child
  can have produced (content Correction 1). No fallback to a pre-spawn
  label, and no assertion on the ratatui-painted `in-progress <role>@`
  label.
- The bounded wait for the child's own exit after the last key/signal is
  NOT readiness; it carries its own diagnostic and its own budget, and its
  wording claims only what that wait actually observed (content
  Correction 3).
- A proof that waits on or asserts ratatui-painted text tolerates escapes
  between adjacent characters (content Correction 5), in-flight and
  post-hoc, from one shared authority so the marker text is declared once.
- `PtyKey` and `run_pty_raw_keys_after_markers` stay absent; ETX stays one
  byte 0x03 spelled in Rust as `"\\u{3}"`, never a four-character raw
  string.
- The three public helper signatures keep their names, parameter order and
  return types — they have consumers outside this task. No public symbol
  is removed.

## Suggested approach — guidance, not a boundary

### Expected files

- `modules/cli/tests/support/src/lib.rs`
- `modules/cli/tests/proof_run_view_exit_teardown.rs`

Touching files beyond this list is legitimate whenever a binding goal
requires it (a caller that stops compiling, an unused import, a sibling
proof the environment convergence perturbs). Do it and report it. The
three other callers of `run_pty_with_cursor_reply` —
`proof_run_startup_progress.rs:308`, `proof_task_queue_pane_handoff.rs:100`,
`proof_task_queue_refusal_teardown.rs:156` — are expected collateral,
because the seam changes the environment their children run under.
`modules/cli/tests/support/Cargo.toml` is deliberately not expected: it has
no dependencies today and `strip_escapes` means post-hoc matching needs no
regex crate.

### Step 0 — read before editing

`support/src/lib.rs:29-69` (`strip_escapes`), `:324-367`
(`controlled_command`) and `:613-763` (the three helpers), then
`proof_run_view_exit_teardown.rs` end to end. The three helper bodies are
near-identical — assembling closely related Tcl, answering cursor queries,
recovering status from `[wait]`, returning `(code, stdout)` — and that
duplication is the reuse point.

### Step 1 — one execution/status/diagnostic seam in support

The smallest reuse-oriented shape is a single private seam that all three
public helpers call: launch Expect through `controlled_command` with
`.env_remove("NO_COLOR")` (the seam's one deliberate subtraction, worth a
comment), plus `TERM` and `CTX_STARTUP_BIN`; take `output()`; read the
diagnostics and the status record from stderr; return
`(code, stdout_string)`.

Suggested decomposition — names, constants and exact Tcl are guidance:

- shared consts for the readiness deadline, the child-exit grace, and the
  distinct stderr record prefixes for "marker never appeared", "child died
  before the marker", "child never exited", and the child-status sentinel;
- a line-wise stderr record parser (strip the prefix, strip exactly one
  trailing `__`, keep the whole remaining payload — splitting on the next
  `__` truncates markers that contain it);
- script builders for a prelude (deadline + a `remaining` proc that fails
  causally when the budget is gone), a budgeted marker wait, and the final
  child-lifetime wait that records status.

Order matters in the Rust tail: check the three diagnostic records BEFORE
asserting Expect's own exit success, because the causal Tcl arms exit
non-zero — asserting success first destroys the message. Emit the prelude
immediately AFTER the `spawn` line, so process startup is not charged to
the readiness budget. In the Tcl, `${what}` needs braces: bare `$what__`
parses as a variable named `what__` and the record comes out empty. And
every continuation arm — cursor replies included — carries
`-continue_timer`, per content Correction 2.

Per-helper assembly after the extraction:

- `run_pty_with_cursor_reply`: existing `spawn -noecho /bin/sh -c "stty …"`
  line, prelude, then the final child-lifetime wait. It has no readiness
  marker, so it charges nothing to the deadline; it gains a timeout arm it
  never had, so a hung child reports a hang instead of falling through to
  an empty status parse.
- `run_pty_signal_after_marker`: existing spawn, prelude, a readiness wait
  on `ready_pattern` whose match runs today's kill loop, then a separate
  child-lifetime wait that keeps a re-signal arm on the same pattern —
  today's re-signal-on-repaint behaviour is what the repeated-SIGINT proof
  relies on. The split is what makes EOF-before-marker causal while an
  ordinary signalled EOF still records status.
- `run_pty_keys_after_markers`: existing spawn, prelude, one budgeted
  readiness wait per step, then the child-lifetime wait.

The escape tolerance of content Correction 5 is best expressed as a
literal-first pair in support: one function compiling a plain painted
literal into an Expect pattern that admits an escape run between adjacent
characters (escaping ERE metacharacters, inserting the run between
characters only, keeping braces balanced for `-re {…}`), and one Rust-side
predicate answering the same question post-hoc by reusing `strip_escapes`.
Both read the same `&str` constant.

Build after this step:
`CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown --no-run`

### Step 2 — the proofs consume product bytes only

`proof_run_view_exit_teardown.rs`. All test-side; the trait id/path
constants, `ExitFixture`'s fields and the trust/activate calls stay.

- `assert_only_interrupted_panel` (`:135-153`) loses its
  `CHILD_EXIT__` filter. Nothing replaces it: with the sentinel out of
  band the four product lines stand alone.
- The Ctrl-C proof (`:264-290`) needs a readiness marker only a spawned
  agent child could have produced, which HEAD cannot supply — its command
  fixture paints `STEP_ID` without any nested child. The suggested route is
  a file-local, test-only agent fixture in the shape already proven at
  `proof_center.rs:328-488`: a schema-0.4 index with one `agent:` step, a
  `runtime.toml` declaring a `custom` CLI harness with a `--fixture-probe`
  version probe, `prompt-via = "stdin"` and no narrator role (narrator-free
  is what keeps RAW passthrough on the panel), and an executable shell
  script written under the scratch HOME (mode 0o755, never inside the
  repo). Three properties are load-bearing rather than cosmetic: the
  fixture emits DISTINCT successive lines (`LiveLine` holds the
  `(initialization)` placeholder until `NARRATION_SOFT_TIMEOUT`, and
  `push_bytes` only redraws on a changed display, so one static chunk can
  stall behind the placeholder); plain non-JSON lines are legitimate text
  deltas, so no stream-JSON envelope is needed; and the emission loop is
  BOUNDED, so a proof that dies before sending ETX leaves no spinning
  orphan (`proof_center.rs:456` is the idiom). The shared
  `ctx-fixture-agent` binary is not a fit — its worker emits one result and
  exits — and extending it would widen scope.
- `command_trait_fixture` (`:29-79`) has five callers and already owns the
  repository/trust/activation scaffold. If an agent fixture is added,
  extract that scaffold and let both fixtures share it rather than copying
  it; the two fixtures need different `schema-version` headers, so the
  shared piece is the repo/commit/trust/activate work, not a spliced
  header.
- The Ctrl-C proof then keeps ONE step, waiting on the fixture's own
  streamed text before the ETX byte, and keeps every existing assertion
  (non-zero code, alt screen entered and left, `run killed; terminal
  restored`, no `STEP_ID` after restore, `│   ` gutter prefixes, no
  `CLEAR_VIEWPORT`). Worth adding: an ordering assertion that the streamed
  agent text precedes the last alt-screen leave, i.e. the key landed after
  real agent output and before teardown.
- `dashboard_attach_then_exit_leaves_no_run_frame` (`:217-239`) drops the
  whole-second `thread::sleep` at `:221` and replaces it outright with a
  bounded marker wait. The suggested marker is the painted live group with
  one row, compiled through the escape-tolerant pattern function, plus the
  matching post-hoc assertion through the tolerant predicate — one literal
  constant feeding both. Keep `kkkkkkkkj\\r`: it still clamps to the top
  live-group header, moves to the first session and attaches. Do NOT
  assert the absence of `live (0)` (content Correction 5), and do not
  present this swap as evidence about the Center tuple — both sides of this
  test already went through `controlled_command` at HEAD.
- Keep `thread` / `Duration` imported: `ledger_session_id`'s bounded 100ms
  ledger poll still uses both, and it is a ledger wait, not key readiness.
- Assert clean stdout where the tests already run: one line per helper in
  existing tests (the signal helper in the SIGTERM proof, the cursor-reply
  helper in the clean-run proof, the key helper in the Ctrl-C proof) is
  enough to cover all three without a new fixture or a new run.
- A causal-diagnostic test is the cheapest way to prove the missing-marker
  message names its marker in full. A command fixture that exits promptly,
  driven with a step whose pattern can never appear and which itself
  contains `__`, exercises the EOF-before-marker branch in about a second
  instead of burning the whole readiness deadline, and proves the record
  parser did not truncate the payload.

## Out of scope

- Any product-code change: `interrupt.rs`, `tui_ratatui.rs`, the run view,
  the dashboard, signal escalation, alternate-screen behaviour, Center
  tuple semantics and the 0252.1 panel grammar are untouched. If a proof
  only passes by changing product code, that is a finding for 0252.4, not
  a licence. In particular, do NOT stop a refresh painting the active
  label pre-spawn to rescue the old marker, and do NOT relax
  `stderr_supports_live` to survive `NO_COLOR`.
- 0252.4's modal contract and its five representative proofs, and 0252.9's
  removal of the loose kill note — they consume this baseline; this task
  does not absorb their product changes.
- The seven bespoke `Command::new("expect")` scripts in
  `proof_run_startup_progress.rs`. They do not use the shared key/marker
  helper; converting them is scope creep. They must still compile and pass.
- Widening the workspace to make `modules/cli/tests/support` a member. It
  is a path dev-dependency, so its own unit tests would not run in the
  normal gate — which is why every helper-level proof lives in the
  `ctx-traits-cli` integration test that already exercises it.
- Adding a dependency to `modules/cli/tests/support/Cargo.toml`.
- Reading `/dev/tty` for readiness in any form. It is dead and stays absent.
"""
validation = """
## Owner note (2026-08-28, verified against session ab3b64e4's worktree)

A run of this task observed `proof_output_style` failing its sequential
JSON comparison and classified it as an unchanged baseline test outside
the task surface. That classification is wrong: clean main passes the
whole suite (29/29), and the failure is caused by this task's own diff —
`.env_remove("NO_COLOR")` added to the SHARED controlled environment,
which un-controls every non-PTY proof that spawns through it. The fix is
in-scope: scope the NO_COLOR removal to the PTY child spawn that needs
it, never to the shared `controlled_command` seam. A red
`proof_output_style` under this task is this task's fallout, not a
baseline defect and not an owner item.

## Done when — binding goals, each with the existing command that decides it

1. The teardown suite passes with the truthful helper — no test lost from
   the six at HEAD, the dashboard readiness sleep replaced by a bounded
   escape-tolerant marker wait, the Ctrl-C key delivered only after text
   the spawned agent child itself produced, and the four-line failure panel
   asserted without any helper-metadata filter:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_view_exit_teardown`
2. Child status is out of band and the returned stream is clean: that same
   run preserves today's observable child codes (143 SIGTERM, 130 repeated
   SIGINT, 0 dashboard, 0 clean run, non-zero panic and Ctrl-C) while no
   returned stream from any of the three helpers contains the child-status
   sentinel. Same command as 1 — the assertions live in those tests.
3. A readiness marker that never appears fails causally and names the full
   marker payload, including one containing `__`, within its bounded
   deadline rather than hanging. Same command as 1.
4. The other shared-helper callers stay green under the converged
   environment — `controlled_command` brings the Center tuple,
   `LC_ALL`/`LANG=C`, `TMPDIR` and `env_clear` to two helpers that had
   none, which is the change most likely to move unrelated output:
   `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_run_startup_progress --test proof_task_queue_pane_handoff --test proof_task_queue_refusal_teardown`
5. The forbidden artifacts stay absent and readiness is not a fixed sleep:
   `! rg -n 'PtyKey|run_pty_raw_keys_after_markers' modules && ! rg -n '/dev/tty' modules/cli/tests && ! rg -n 'sleep\\(Duration::from_secs' modules/cli/tests/proof_run_view_exit_teardown.rs`
   (The last predicate targets the whole-second readiness sleep;
   `ledger_session_id`'s bounded `from_millis(100)` ledger poll survives.
   Whether the deadline is genuinely enforced is criteria 1 and 3's job —
   a source grep for timer discipline would pin Tcl shape and could pass on
   a wait that still runs forever.)
6. The landing gate is green:
   `CARGO_TARGET_DIR=target just test-full`
   (`Justfile:152-180` exports its own gate target directory, so the prefix
   here is a caller convenience, not the final authority.)

## Order and bounded refinement

Read (Step 0), then Step 1, then Step 2, running Step 1's `--no-run` build
before starting Step 2 so a seam or borrow error surfaces next to the edit
that caused it. Then run commands 1, 4, 5, 6 in that order.

Permit at most two targeted repair-and-rerun rounds. A round repairs one
named failure, then reruns the failed command AND every later command in
the list. If a third round would be needed, stop and report the failing
command with its output rather than continuing — that is the stop
condition, not a judgement call.

## Watch

- `run_pty_with_cursor_reply`'s caller completion marker is not the
  child-status sentinel. Removing it breaks three other proofs; only the
  status/diagnostic transport moves.
- A red result in command 4 is this task's own collateral (the converged
  environment), not a pre-existing failure — fix it here rather than
  reporting it as a baseline break.
- If the Ctrl-C proof reports no alternate screen at all, the seam's
  `NO_COLOR` subtraction is missing or was re-added: `stderr_supports_live`
  (`tui.rs:226-237`) degrades `--progress tui` to Status for ANY set
  `NO_COLOR`, and Expect propagates its own environment to the child. Fix
  the seam; never the predicate.
- If a readiness marker never matches, the failure already names it. Read
  the raw stream it captured before changing anything: for an agent
  fixture, check that the role resolved, that the version probe was
  answered, and that output is still arriving; for the dashboard, check
  whether the run reached live state at all. Permitted repairs are wider
  escape tolerance or a better post-spawn marker — never a sleep, never a
  pattern a pre-spawn frame can satisfy, never `/dev/tty`.
- If the Ctrl-C proof's fixture kind changes and the restored screen
  differs for an agent frame, report that observation — do not weaken the
  assertion and do not edit product code to satisfy it.
- Test-helper metadata is out of band for every later PTY proof. A finding
  about helper bytes in an asserted stream is a defect in this task, not an
  acceptable filter in the caller.
"""

[relations]
parent = "0252"

