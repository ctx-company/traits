content = """
0252.4's 12-hour run died with four mandatory proofs permanently red, and
all four traced to the shared PTY test helper rather than product code —
the run's reviewer wrote the exact defect list (session 28f2ba9f22, final
verdict), which this task adopts as its contract:

1. Two of the three PTY helpers spawn their child without the isolated
   Center tuple, so anything they launch talks to the production,
   UID-scoped endpoint instead of the fixture's.
2. The helper sends keys (Ctrl-C) without a bounded, diagnosable wait on a
   post-spawn readiness marker; Resume/Restart proofs time out with no
   causal message. Owner ruling 2026-08-27: readiness is a marker waited
   on under a bounded deadline, never a fixed sleep and never a
   `/dev/tty` token.
3. The helper writes a `__CHILD_EXIT__<code>__` sentinel (sometimes
   indented) into PTY stdout after the child dies, so any
   rescue-output-is-last assertion sees helper metadata after the rescue
   panel. Owner ruling 2026-08-27: child exit status travels out-of-band
   (Expect stderr), never through the PTY byte stream a proof asserts on.

This is test infrastructure with no product-behaviour change; it exists so
0252.4 and every later PTY proof assert against product bytes only.

## Grounded against HEAD 21d87c6f (implementation code as of e7881711)

Defects 1 and 3 are confirmed verbatim in the code:

- `modules/cli/tests/support/src/lib.rs:622-664` (`run_pty_with_cursor_reply`)
  and `:668-713` (`run_pty_signal_after_marker`) build `Command::new("expect")`
  by hand and set only HOME/XDG/PATH/TERM/CTX_STARTUP_BIN. Neither exports
  `CTX_CENTER_SOCKET` / `CTX_CENTER_SPAWN_LOCK` / `CTX_CENTER_RUNS_ROOT` /
  `CTX_CENTER_INDEX`, nor `LC_ALL`/`LANG`/`TMPDIR`.
  `controlled_command` (`:324-367`) is the single existing authority for
  all of that; `modules/io/src/center.rs:550-569` proves the tuple is
  all-or-nothing (`incomplete private center configuration`), which is why
  it is never re-declared in a second place.
- Scope correction to defect 1 as originally written: the third helper,
  `run_pty_keys_after_markers` (`:716-763`), ALREADY goes through
  `controlled_command` (since 0243.5, `da5ec12e`), and `spawn_background_run`
  already goes through `spawn_ctx`/`controlled_command`. So the dashboard
  proof is not tuple-less at HEAD, and this convergence is not what turns a
  `live (0)` dashboard into `live (1)`. Convergence is still required —
  two helpers running children against the production endpoint is the
  defect — but no Done-when may claim it as the cause of a dashboard
  observation change.
- All three helpers end their Tcl with `puts "__CHILD_EXIT__[lindex
  $child_status 3]__"`. Plain Tcl `puts` is Expect's stdout, and the Rust
  side then searches that same stdout for the sentinel and returns it
  inside the asserted stream (`:656-663`, `:705-712`, `:755-762` — the
  same eight lines copied three times). The workaround is visible at
  `modules/cli/tests/proof_run_view_exit_teardown.rs:140`, where
  `assert_only_interrupted_panel` filters every restored line containing
  `CHILD_EXIT__` before asserting the four-line failure panel.
- `PtyKey` and `run_pty_raw_keys_after_markers` do not exist anywhere in
  Rust at HEAD; they are artifacts of the failed run's prose. Nothing is
  deleted for them — they stay forbidden. The current key API is already
  `steps: &[(&str, &str)]`, and
  `ctrl_c_during_a_live_run_restores_the_screen_before_the_kill_note`
  already transmits ETX through it (`"\\u{3}"`, one byte 0x03), so no
  raw-key variant is needed.

## Correction 1 — `in-progress {role}@{harness}` is NOT a post-spawn marker

The earlier draft of this task asserted that the run view's narration
label cannot be painted before the agent child streams. That is false at
HEAD, and the whole readiness rule below is built on the refutation:

- `narration_for` has a SECOND call route besides `update_live_display`:
  `RunPanel::refresh` calls it directly at
  `modules/cli/src/app/run_view.rs:693-727` on every frame refresh, and
  `narration_for` (`render.rs:1086-1096`) unconditionally returns
  `Some(RunNarration { label: active_label(session), .. })`.
- `LiveLine::current_display` (`tui.rs:189-207`) returns the
  `(initialization)` placeholder when nothing has streamed, and
  `display_narration` (`run_view/projection.rs:1036-1045`) paints the live
  narration row anyway while the run is live. So a pre-spawn refresh paints
  `in-progress {role}@{harness}: (initialization)`.
- More decisively, `drive.rs:2520-2533` calls
  `panel.push_summary("starting session · dispatching {role}@{harness}…")`
  BEFORE any probe or harness execution; the harness process is only
  launched later via `ctx_traits_io::harness::run` (`drive.rs:8317-8326`).
  `push_summary` updates the live display and renders with `active_label`.

Therefore no pattern anchored on `in-progress <role>@` is post-spawn, with
a command fixture or an agent fixture. Waiting on it and then sending ETX
can still deliver the key before the agent child exists — exactly the
failure this task exists to remove.

The readiness rule that follows, and that every later PTY proof inherits:
**a readiness marker for key delivery must contain text that only the
spawned child could have produced.** Here that is the stub agent's own
stdout, `live tick <n>`, painted into the run view either as a model-text
stream row (`run_view.rs:736-761`) or as the dimmed passthrough live line
after the two-second `NARRATION_SOFT_TIMEOUT` (`tui.rs:150-160`, `:189-207`,
`:247`). Both routes require `RunPanel::push_bytes`, which is fed only by
bytes the spawned harness already emitted (`drive.rs:909-925`, narrator-free
passthrough; plain non-JSON lines become text deltas at
`harness_stream.rs:1258-1291`). The `in-progress worker@stub` label is NOT
asserted at all — see Correction 5.

## Correction 2 — a shared deadline needs `exp_continue -continue_timer`

Local Expect is 5.45, where plain `exp_continue` RESTARTS the current
timeout timer; only `exp_continue -continue_timer` preserves it. Every
cursor-reply branch at HEAD uses plain `exp_continue`, so a child that
repeatedly issues `ESC[6n` extends any nominal deadline without bound.
Setting `set timeout [remaining {pattern}]` once before an `expect` block
does not fix that on its own — the source-level presence of `remaining`
would pass a naive grep while the wait ran forever.

Measured on this machine (expect 5.45, a child printing a line every second
that never emits the awaited pattern):

- `exp_continue -continue_timer` with a 3-second deadline → exits 2 with
  `__PTY_TIMEOUT____NEVER____` after 3.07s.
- the same script with plain `exp_continue` → still running when killed
  externally at 12s.

So the deadline is enforced by TWO things together: `remaining` sizing each
block, and `-continue_timer` on every continuation. Both are required, and
the static sweep in validation proves the second by counting.

## Correction 3 — the signal helper needs two phases

`run_pty_signal_after_marker` uses ONE `expect` block for both the
readiness wait and the post-signal exit wait, and its `eof` arm always
records child status. Turning that single `eof` arm into a causal
`__PTY_EOF_BEFORE__` record would misclassify every successful signalled
exit as a failure. The readiness wait and the exit wait must be separate
blocks, with only the first treating EOF as causal.

## Correction 4 — convergence must SUBTRACT `NO_COLOR`, not deliver it

The earlier draft credited `controlled_command` with delivering `NO_COLOR=1`
to the PTY children. That is exactly backwards, and taking it literally
would make this task's own proofs unsatisfiable:

- `controlled_command` (`:324-367`) sets `NO_COLOR=1`. Expect propagates its
  environment to the child it spawns (verified locally: Expect launched with
  `NO_COLOR=1`, child printed `NO_COLOR=1`).
- `stderr_supports_live` returns false for ANY set `NO_COLOR`
  (`modules/cli/src/app/tui.rs:226-236`). `drive.rs:1976-1984` then degrades
  even an explicit `--progress tui` to Status, and
  `command_handlers.rs:509-516` refuses the startup pane on the same
  predicate. With `NO_COLOR` set there is no run pane, no alternate screen,
  and no painted readiness text for a marker wait to find.
- The dashboard is unaffected because `dashboard::interactive_available`
  (`dashboard.rs:147-163`) checks TTY/CI/TERM but not `NO_COLOR` — which is
  why the key helper's dashboard proof survives the combination today while
  a run-pane proof driven through the same helper could not.

So the shared seam keeps `controlled_command` as the SINGLE environment and
Center authority — the tuple, `LC_ALL`/`LANG=C`, `TMPDIR`, `env_clear`,
PATH/toolchain passthrough — and then removes exactly one variable,
`NO_COLOR`, because a PTY proof's whole subject is the coloured, painted
surface. `.env_remove("NO_COLOR")` on the returned builder is the one-line
seam-local exception. Duplicating the Center tuple, or relaxing the product
eligibility predicate, would both be wrong.

Consequence for the collateral callers: the two hand-built helpers never had
`NO_COLOR` at all, so `env_remove` leaves their children's colour behaviour
byte-identical. What actually changes for them is the Center tuple,
`LC_ALL`/`LANG=C`, `TMPDIR` and `env_clear` — that, not `NO_COLOR`, is the
likely mover if command 4 goes red.

## Correction 5 — painted text is escape-split; the matcher is shared

Owner ruling 2026-08-27 (terminal-diff-aware markers): ratatui's cell diff
may emit cursor/style escapes between adjacent characters of painted text,
so no proof may demand byte-contiguity of UI-painted text in the raw
stream. `support::strip_escapes` (`:29-69`) already documents this for
post-hoc assertions, but it cannot make an in-flight Expect `-re` wait
tolerant.

Two call sites need the same tolerance from ONE authority — the dashboard's
live wait for `live (1)` (inside Expect) and its post-hoc assertion (in
Rust). The resolution is a literal-first pair in support, no regex crate and
therefore no change to `modules/cli/tests/support/Cargo.toml`:
`escape_tolerant_pattern(literal)` compiles the literal into the Expect
pattern, `contains_escape_tolerant(raw, literal)` answers the same question
in Rust by reusing `strip_escapes`. Both take the same `&str` literal
constant, so the marker text is declared once.

The child-produced readiness marker (`live tick <n>`) needs no tolerance:
harness passthrough bytes reach the PTY contiguously. Only ratatui-painted
text does.

## Correction 6 — the child-exit diagnostic must not claim what it saw

`run_pty_with_cursor_reply`'s final block waits for EOF only; it never
matches the completion marker. A hang diagnostic phrased "after {marker}"
would assert an observation that did not happen. The hang record names the
wait's context ("the wrapped command"), never a marker the block did not
match.
