## Approach

Suggested route, not a boundary. The desktop project does not exist at this HEAD — no Cargo manifest in this repository names `gpui`, and `0256.1` is still `ready` — so no desktop path, module, symbol or command is named below. Discover every one of them from what `0256`, `0265` and `0267.1` actually landed, and say in the work summary where the landed shape differed from what is described here.

**Reuse points, named by the task that lands them.** `0265.13`'s rule 6 screen header — supply a title string and one already-composed summary string; do not restate its typography, `∷`, 560 width or breadcrumb rule. `0265.3`'s bottom bar — supply a semantic state, one already-composed detail string and the action set; the component stays source-agnostic and performs no reads. `0265.3`'s `placeholders` module — extend it with exactly the two entries this cut consumes (the summary phrasing, the `author trait` action) and nothing more. `0265.1`'s token/typography entry point and registered IBM Plex faces — every dimension, size and colour on this screen comes through it, so `#7fc79a`, `#8b909c`, `#eceef2` and the `[10,14]`/`[2,8]` paddings appear as token roles at this call site rather than as literals. `0265.3`/`0265.5`'s semantic state-to-colour presentation — the pin state and its failure counterpart map through it. `0267.1`'s served library answer and its immutable provenance value — the only source of counts, identity and provenance here. The TUI reducer's transaction posture (`modules/cli/src/app/dashboard/worker.rs:254-415`) — stage, project the complete candidate, commit only on success, retain last-accepted behind an explicit stale marker — is the client precedent the chrome inherits by being projected inside the same accepted model as the rows, not by acquiring its own staging.

**Edit order.**

1. **Read what `0267.1` landed** before writing anything: the served answer's shape, whether it carries a repository display identity, the typed provenance success and failure variants, and the reducer that accepts it. Done-when 2 and the shape of everything below depend on that reading, not on a guess.
2. **The shared provenance presentation** — one function or value taking the served typed provenance and producing the rendered text. Placing it next to `0265`'s provenance vocabulary rather than inside the Traits bar's own module is what leaves it reachable from a later preview call site, so `0267.4` can call it instead of re-assembling the string. Landing and calling it from the bar is this cut's work; calling it from the footer is not.
3. **Satisfy Done-when 2 by whichever of these routes step 1's reading makes true** — the goal is the truthful served identity, and none of these three is binding. If the served answer already carries a display identity, render it and skip the rest of this step. If it does not, widening `0267.1`'s typed capability minimally with that identity — same request/response, reachable by a non-GUI face — is the expected route. Where a widening is not warranted, a clearly defined pure projection of the served `repo_key`/`repo_path` that invents no segment also satisfies the goal. Report which route was taken.
4. **The header call site** — compose `0265.13`'s header with the repository-derived title and the summary built from the served count, the served pin result and the module's phrasing.
5. **The bar call site** — compose `0265.3`'s bar with the semantic state, the shared provenance presentation and the module-served action.

**What must be proven** (observations, not mechanics): with synthetic served answers and, where a resolution is genuinely exercised, scratch repositories, packages and locks only — a successful provenance rendering the full detail; each typed failure rendering as a failure with no `pinned`, no blank sha and no partial count; an authored count that changes with the served rows and stays distinct from the digest count when a multi-variant family or a source-only package is present; a source-only or unreadable package that leaves `pinned` intact for the rest; a rejected projection leaving title, summary, count and provenance all at their previous accepted values; a stale last-accepted answer visible only behind the explicit marker; an unusable repository scope rendering the typed refusal rather than a title; the title deriving from served data across two different repositories; the summary phrasing and `author trait` resolving through the `placeholders` module; the bar's action tone and ordering; and `author trait` leaving no trait, package, lock or trust byte changed.

**Desktop lane.** No repo-root command inspects a rendered gpui screen at this HEAD, so none is declared. Once `0256.1` has landed its documented non-interactive command, run it as additional proof and — if it is repo-root-relative, non-interactive and carries its whole verdict in its exit code — add it here verbatim rather than guessing at its name now.

## Watch

- **The provenance resolution is `0267.1`'s** (parent Correction 4). A lock read, a digest computation or a center-side resolution written here is the defect, not the fix; if the served value is missing, that is a prerequisite defect to report.
- **No design example is data.** `ctx-company/traits`, `Five traits, all digest-pinned — implement carries the dogfood loop.`, `implement`, `5` and `81e5a39` are illustrations from `reference/traits.html`. The export is geometry authority only.
