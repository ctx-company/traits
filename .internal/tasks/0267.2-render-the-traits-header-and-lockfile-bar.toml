content = """
Give the Traits screen its chrome — grammar rule 6's header and rule 8/12's provenance bar — over the one repository-scoped answer `0267.1` taught the center to serve. This cut renders; it resolves nothing.

The **header** is a title in the shape `traits — authored in <repository display identity>` over exactly one italic narrated summary, with `∷` top-right and no breadcrumbs (`grammar.md:58-66`, `screens/traits.md:11-13`). The **bottom bar** is rule 12's provenance instance for this screen: a semantic state word, then the provenance detail, then `author trait` as the right-hand ghost action (`grammar.md:74-84,110-115`, `screens/traits.md:21-22`).

Four grounded corrections the draft this file replaces did not carry.

**The provenance resolution is not this cut's, despite the draft's sentence that "the center's capability grows the lockfile resolution here".** Parent Correction 4 (`0267` content) and `0267.1` (`scope`, Done-when 4) assign the whole resolution — the current-member/lock join, the ordered evidence set, its digest and its cardinality — to `0267.1`, which serves one immutable success-or-failure value. `0267.2`'s bar and `0267.4`'s footer each render that same value. So this leaf adds no lock reader, no digest computation, no center-side resolution and no `0267.2` → `0267.4` edge; a second computation here is the two-readers-can-disagree defect that parent correction exists to prevent, and it would also re-open the graph gap the correction closed. If a run finds the resolution genuinely absent from what `0267.1` landed, that is a defect in the prerequisite reported as such, not a thing to grow here.

**Every concrete string in the draft is an export illustration, not a value.** `ctx-company/traits`, `Five traits, all digest-pinned — implement carries the dogfood loop.`, `implement`, the count `5` and the sha `81e5a39` are what `reference/traits.html` happened to render (`262-271`, `596-604`). Parent Correction 9 and the parent's `validation` forbid hardcoding any of them. The export is geometry authority only; `grammar.md` and `screens/traits.md` are the specification. A leaf rendering an export literal is worse than an omitted leaf because it reads as evidence.

**No repository display identity exists at this HEAD, so the title's data source has to be found rather than assumed.** `CenterPublicRow` carries only `repo_key` and `repo_path` (`modules/io/src/center.rs:3778-3788`); `RepoIndexEntry` carries key, path and last-seen time (`modules/io/src/state.rs:477-488`); and `repo_key` is `<basename>-<first 8 hex of the path's sha256>` (`state.rs:149-160`). Nothing in that set is an owner/repository pair, so the export's `ctx-company/traits` shape is not something HEAD can produce truthfully. The execution inspects what `0267.1` actually landed. If its served answer already carries a truthful display identity, the title renders it. If it does not, this cut widens that same typed capability minimally — the widened field reachable by a non-GUI face like every other served leaf — or renders a clearly defined pure projection of the served key/path, and says which in the work summary. What it may not do: read the desktop process's cwd, invoke `git` from the desktop, synthesise an owner segment the system does not hold, or fall back to the reference repository.

**The header's count and the bar's count are two different numbers.** The summary's authored count is the number of rendered `Authored — N` rows — one per family, per standalone package, per source-only package (`0267` Correction 2; `0267.1` Done-when 4-5). `N digests` is the cardinality of the joined current-member evidence set, which counts every member of a multi-variant family and counts a source-only package not at all. Rendering one where the other belongs makes the header and the bar contradict each other on the one screen whose subject is what this repository authored. Relatedly, the all-pinned phrasing of the example sentence cannot be emitted when provenance failed: the phrasing is `placeholder:`, but the pin claim inside it is `data:`.
"""
scope = """
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected components, symbols, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or observation shows it is the run's call.

## Decisions

- **In scope**: the Traits screen header — repository-qualified title, one italic narrated summary whose counts are data and whose phrasing is placeholder-served, `∷` top-right — and the bottom bar — the semantic pin state, the one shared provenance presentation of the served value, and the placeholder-served `author trait` ghost action — both rendered from the answer `0267.1` serves.

- **The parent's corrections bind.** `0267`'s content corrections govern this leaf; Corrections 4, 9, 10 and 12 are the ones it touches directly, and where this file restates one it does not narrow it.

- **This leaf resolves nothing.** It performs no manifest, family-table, trust-store, lockfile, `git`, cwd or clock read on the desktop side, computes no digest, and adds no center-side resolution. It receives one immutable typed provenance value and one repository-scoped library answer, and renders them.

- **One accepted answer, one commit.** Header, the rows `0267.1` renders, and the bar are projected from the same accepted model. No second request, subscription, model or timer enters for the chrome; a rejected projection leaves title, summary, count and provenance all at their previous accepted values rather than updating some of them.

- **Compose the landed vocabulary, do not duplicate it.** Rule 6's header and rule 8's bar exist once as reusable components from `0265.13` and `0265.3`; the tokens and IBM Plex faces come from `0265.1`'s entry point; the semantic state presentation comes from `0265.3`/`0265.5`; the summary phrasing and `author trait` come from the one `placeholders` module `0265.3` seeded. A Traits-private copy of any of these is a defect even when it renders correctly.

- **One provenance presentation, owned here, consumed later.** This cut lands the single shared presentation — one function or value taking `0267.1`'s served typed provenance and producing the rendered provenance text — and the bar is its only call site in this cut. It takes the served value and knows nothing about how locks are resolved, and it is placed and reachable where a later screen leaf can render the same text by calling it rather than re-assembling the string. Whether `0267.4`'s preview footer in fact renders byte-identical text is `0267.4`'s goal and its call site, done and checked there; nothing here implements, renders or verifies that footer, and no `0267.2` → `0267.4` edge is added.

- **`author trait` is read-only and deliberately inert.** Its label and its tracked no-op come from the shared module. This cut opens no authoring surface and writes no trait, package, lock or trust data.

- Out of scope: the provenance resolution and the served answer itself, the `Authored — N` section and its rows, the menu entry and switch (`0267.1`); the preview column (`0267.3`, `0267.4`); the TUI migration and its poll removal (`0267.5`); trait authoring and any new trust mutation; and every shared primitive `0265` already built.

- Dark tokens only; `tokens.md`'s light column stays unimplemented.

## Prerequisites

`0267.1` — the repository-scoped library answer, its rows, and the immutable provenance value this chrome renders. `0265.13` — grammar rule 6's screen header, extracted while rendering Sessions and consumed here rather than re-derived. `0265.13` is not otherwise reachable from this leaf: `0267.1` gates on `0265.5`, `0265.9` and `0258`, whose closure reaches `0265.3` and `0265.1` but never `0265.13`, and the parent's own rule is that an external prerequisite is named on the earliest child that consumes it. `0265.3`'s bar and `placeholders` module and `0265.1`'s tokens and faces arrive transitively through `0265.5`. Bind to the desktop project, components and non-interactive command those tasks actually landed, not to a path guessed here.

## Done when

1. **The header renders rule 6's form from the accepted answer.** A title in the shape `traits — authored in <repository display identity>` in Sans 13 `text-heading`, over exactly one italic Sans 12 `text-secondary` summary at width 560, with `∷` in Mono 14 `text-secondary` padded `[2,8]` at the top right of a full-width `space-between` row, title-stack gap 5, inside the existing main pane — and no breadcrumbs anywhere. It composes `0265.13`'s landed header rather than a Traits-private duplicate of its typography, glyph, fixed width or breadcrumb rule. Geometry matches `reference/traits.html:250-285` and `tokens.md:71-84`. Decided by `just test` for the shared code the header renders through, plus the bounded review in `validation` walking `screens/traits.md:11-13` and `grammar.md:58-66` leaf by leaf; no repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented.

2. **The repository identity in the title is served data with a truthful source.** The identity the title renders names the repository the accepted answer is scoped to, and it reaches the desktop only through `0267.1`'s typed capability, whose non-GUI face can produce the same value. Desktop cwd, a desktop-side `git` call, an invented owner segment, a CLI-private import and the literal `ctx-company/traits` all fail this. An unknown, empty, relative or otherwise unusable repository scope renders the prerequisite's typed refusal instead of a title claiming a repository. How the identity is obtained is the run's call; the route taken is reported in the work summary. Decided by `just test` and the bounded review's diff read for a desktop-side reader or a hardcoded identity.

3. **The summary is data counts in placeholder phrasing, and it never overclaims.** Its authored count equals the number of rows in the rendered `Authored — N` section — families, standalone packages and source-only packages alike — and is not the digest count. Its phrasing comes from the one `placeholders` module, with no inline literal at the call site and no verbatim reproduction of the reference sentence. The pin claim carried inside the sentence is data: when provenance failed, the sentence cannot assert that the library is pinned. Exactly one summary line renders in every state. Decided by `just test` and the bounded review.

4. **The bar renders the served provenance exactly, through the one shared presentation this cut lands.** On success it shows the semantic `ok` state word `pinned` followed by the detail `· skill-lock @ <sha> · N digests`, in a full-width `space-between` row with a 1px `border-soft`, padding `[10,14]`, 8px gap in the left half, all text Mono 11 — composed from `0265.3`'s landed bar, not a second geometry. The `<sha>` and `N` reach the bar only through one shared provenance presentation over the served typed value: that presentation is the sole site in this diff that assembles the provenance text, it takes the served value rather than knowing how locks are resolved, and it sits where a later screen leaf can call it instead of re-assembling — the bar being its only call site here. The bar itself does not derive, parse, shorten, sample or reassemble any part of the text. The literal label `skill-lock` stays as the visual specification requires, with its aggregated package-local `trait.lock` source stated where the presentation lands. The preview footer that will later cite the same text is `0267.4`'s call site and `0267.4`'s goal; it is neither rendered nor verified here. Decided by `just test` and the bounded review, comparing against `reference/traits.html:580-611` for geometry and `screens/traits.md:21-22` plus `grammar.md:74-84,110-115` for content.

5. **Provenance failure renders as failure, never as a degraded success.** When the served value is a typed failure — missing lock, malformed lock, no entry for a current member, digest mismatch, failed repository scope, failed whole resolution — the bar renders that typed failure in place of the claim, in semantic failure treatment, and renders no `pinned`, no blank or placeholder sha, no partial digest count and nothing that reads as current success. A last accepted answer stays visible only behind the inherited explicit stale or outage marker. The renderer consumes the prerequisite's typed distinction between a per-package condition and a whole-answer failure rather than reclassifying strings: a source-only or unreadable package is an ordinary row and does not withhold `pinned` from the rest. Decided by `just test` and the bounded review's exercise of each typed failure over synthetic served values.

6. **`author trait` is the shared module's tracked placeholder and does nothing.** It renders as the right-hand ghost action, Mono 11 in the primary bright tone, with no fill, border, icon, pill or corner radius, and its label and no-op behaviour come from the one `placeholders` module with no inline duplicate. Activating it opens no authoring surface and writes no trait, package, lock or trust data. It is one of exactly two placeholder-served leaves on this screen — the other being the summary's phrasing — and every other leaf here is data. Decided by `just test` and the bounded review's diff read for an inline label or any write path.

7. **Nothing is added that reads, resolves or polls.** No desktop-side manifest, family-table, trust-store, lockfile, `git`, cwd or clock read; no second lock reader, digest computation or center-side resolution; no client timer or poll loop; no second model, request or subscription for the chrome. Blocking work stays off gpui's UI thread and library work stays off the center's model-owner request path, as `0267.1` left it. Header, rows and bar commit together from one accepted answer, and a rejected projection updates none of title, summary, count or provenance. Decided by `just test` and the bounded review's diff read, which is what shows these directly.

8. **The workspace is unmoved.** Root Cargo resolution, the root `Cargo.lock` and the existing gates stay gpui-free and the desktop project stays outside the workspace. Decided by `just test` and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no lockfile, digest or provenance resolution logic is written or copied here; no `0267.2` → `0267.4` dependency is added; no Traits-private copy of the header, bar, token entry point, state presentation or `placeholders` module is created; no export literal — `ctx-company/traits`, `implement`, the summary sentence, the counts, `trusted`, the hex colours or any sha — is hardcoded at this call site; no light-theme value is touched; no pencil artifact is edited; no row, section, menu, preview or TUI work is done; no trait authoring or trust mutation is opened; and no work belonging to `0267.1`, `0267.3`, `0267.4`, `0267.5`, `0266`, `0268`, `0269` or `0261` is done.
