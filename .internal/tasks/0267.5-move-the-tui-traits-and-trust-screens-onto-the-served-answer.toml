key = "0267.5"
title = "Move the TUI Traits and Trust screens onto the served answer"
status = "ready"
raised = "2026-08-29"
content = """
`0267.1` teaches the center to answer one repository's trait library with its trust classification. This cut is the parity half and the charter's honesty half: the TUI's `Screen::Traits` and `Screen::Trust` stop reading the filesystem and read that same answer, so the library becomes a capability the center serves and every face renders rather than a desktop-only reader with a second in-process implementation living beside it.

The move is larger than the draft this file replaces described, and its premise was wrong. Four grounded corrections, verified at this HEAD.

**The "one scan, one trust read" property is not what HEAD does, so it cannot be preserved.** The doc comment at `modules/cli/src/app/dashboard.rs:2418-2422` claims "no second inventory scan, no second trust-store read", and it is true only of the projection layer directly beneath it. `load_traits_and_trust` (`dashboard.rs:2423-2445`) calls `dashboard_trait_inventory` once, but every resolved member inside that scan reaches `lifecycle::resolve_named` (`modules/cli/src/app/lifecycle_reporting.rs:1625-1677`), which calls `resolve_trust_verdict_for_trait`, which calls `trust::read_store` (`modules/io/src/lifecycle.rs:85-116`) — one store read per member. `build_trust_rows` then reads the store again (`dashboard.rs:2621-2624`), and `refresh_trait_preview_impl` reads it a third time through `read_store().unwrap_or_default()` (`dashboard.rs:3748-3750`), which silently turns a read failure into an empty document so malformed trust data renders as unreviewed instead of failing. HEAD is N+1 reads for list assembly plus a defaulting selection read. The single-load property is an **improvement `0267.1` supplies**, consumed here; a run that sets out to preserve the comment's claim preserves N+1 reads and the silent default.

**Three things move, not one.** The draft scoped this to list projection. Parent Correction 11 names all three: (a) the two-second direct poll — `RELOAD_INTERVAL` is 2s (`dashboard.rs:77`), the event-loop timeout calls `state.reload_non_session()` (`dashboard.rs:2840`), which sends `Command::Refresh` (`dashboard/worker.rs:168-169`), which runs `reload_non_session_state` and emits another snapshot (`worker.rs:529,548`); (b) both list projections; (c) both selected details, because Traits' preview is a live manifest/trust/source reader (`dashboard.rs:3736-3750`, `3773-3850`) and moving only rows leaves a second live answer on the same screen. There is a fourth, quieter reader the draft missed entirely: `reload_from_center_rows` calls `reload_non_session_state()` before committing session rows (`dashboard.rs:1629`), so today **every accepted center snapshot and delta rescans the trait inventory**. Deleting the timer while leaving that call in place moves the poll rather than removing it.

**The TUI's selected detail is wider than the desktop preview, and this leaf cannot wait for the sibling that would supply it.** Parent stages `0267.2`, `0267.3` and `0267.5` independently after `0267.1`, so `0267.3`'s `trait`/`facts` detail boundary may not exist when this runs. TUI parity additionally needs status, procedure shape, the drift string and its authored-source-not-rechecked qualifier, source path and bounded excerpt, trust reason and stale-record evidence (`dashboard.rs:3773-3850`, rendered at `3902-4025`) — none of which `0267.3`'s facts list guarantees. So this leaf owns the minimal TUI-facing detail capability on top of `0267.1`, extending the landed boundary where fields are absent and consuming an equivalent where a sibling has already landed one. It reuses the resolution `0267.1` retains; rescanning the inventory to answer one selection is the failure to avoid.

**Two identity defects become load-bearing once detail is served, and one label set must not be flattened.** `decide_member_apply` matches the first trust row by trait id alone (`dashboard.rs:4053-4069`), and `reposition_trait_selection` does the same after an edit (`dashboard.rs:4032-4034`); native family members share an id and differ by variant and digest, so both collapse a family to its first member — harmless while everything is rebuilt in-process every two seconds, wrong once a response has to be matched to the selection that asked for it. Separately, the TUI's list labels are six strings, not four: `trust_story::TrustClass::label` renders `moved (approval stale)` and `moved (block stale)` (`modules/cli/src/app/trust_story.rs:52-61`). Parent Correction 6's shared table lists one `moved` word; that table is the desktop's rendering of a typed state, and the TUI's two strings are another rendering of the same states. Byte-for-byte parity means the TUI keeps both.
"""
scope = """
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected files, symbols, signatures, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or matcher observes it is the run's call.

## Decisions

- **In scope**: re-pointing `Screen::Traits` and `Screen::Trust` — both list projections and both selected details — at the center-served, repository-scoped library answer; removing the two-second direct refresh and every other automatic direct read on those paths, including the one inside the accepted-center-rows path; keeping the existing trust and edit mutations working and observed through the served answer; and, only where the landed boundary lacks it, the minimal extension that lets the served detail carry what the TUI already renders.

- **The parent's corrections bind.** `0267`'s Corrections 1, 2, 3, 5, 6, 10, 11 and 12 govern this leaf; where this file restates one it does not narrow it. Parent Done-when 5 is this leaf's outcome statement.

- **Behaviour is observably unchanged.** Same rows, same field values, same `id:variant` rendering, same built-in-origin difference between the two projections, same ordering, same error text, same list labels including both moved variants, same actions on the same keys. A green build with different output is a regression.

- **One accepted answer feeds both projections.** A single pure projection takes one complete served answer and yields both `Vec<TraitRow>` and `Vec<TrustRow>`, committed together. Two requests, one per screen, or a per-screen re-derivation, fails this.

- **No second live reader survives on the moved paths.** After this cut, the Traits and Trust list and automatic selected-detail paths call no inventory scan, no trust-store read, no manifest load, no drift check and no source read of their own. Plumbing that no longer has a consumer is removed rather than left inert, because an inert route is how direct scanning comes back.

- **Out of scope**: the served answer's own shape, scope contract and freshness mechanism (`0267.1`); the desktop header, provenance bar and preview blocks (`0267.2`, `0267.3`, `0267.4`); the Tasks board stat sweep and the terminal tick, which are not library readers and stay; the user-triggered explain action (`dashboard/worker.rs:607+`), which is separate evidence work and is not redesigned here; trait authoring; any new trust mutation, key or screen; and every shared primitive `0265` already built.

## Prerequisites

`0267.1` — the center-served, repository-scoped inventory-and-trust answer, its stable member identity, its typed failures and its freshness event. This leaf's external prerequisites (`0265.5`, `0265.9`, `0258`) reach it through that edge; a charter's `depends-on` is not inherited by its children (`derived_status` evaluates dependencies only for open leaves, `modules/core/src/task/graph.rs:115-177`). Bind to the request, answer, identity and event `0267.1` actually landed, not to names guessed here — none of them exists at this HEAD.

## Done when

1. **Both lists render from one accepted served answer, with output unchanged.** One pure projection over one complete answer yields both row vectors and they are committed together. Traits keeps its non-built-in rule, so repo-authored, vendored and user-global winners stay listed and built-ins do not; Trust stays unfiltered across every tier with its orphan records appended. Every `TraitRow` field and `trait_row_label`'s rendering survive, including `id:variant` for family members and unreadable rows carrying `trust = "unreadable"` with the original error in `status`. Trust ordering stays actionable-before-orphan, then trait id, then recorded digest, orphan hide/show stays a projection over the complete backing set, and `trust_row_label` keeps its normal and orphan forms and all six class labels — `moved (approval stale)` and `moved (block stale)` included, not flattened to `moved`. Trust classification is consumed from the served typed state, never reconstructed from a display string. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_trust_family_report` and `just test`, over synthetic served answers spanning authored, vendored, user-global and built-in rows, a same-id multi-variant family, an unreadable row and an orphan record.

2. **Both selected details render from the served boundary, matched by stable identity.** The Traits preview renders its existing pane — the unreadable error, id/version/status, procedure rows, canonical digest, trust state/reason/stale warning, drift with its authored-source qualifier, source path and bounded excerpt — from served evidence, with no manifest load, trust-store read, drift check or source read on that path. Where the landed answer does not carry a field the pane already shows, this leaf extends that served boundary minimally rather than reading it locally, and answering one selection does not rescan the inventory. The Trust preview keeps its full contents and is rebuilt only from the accepted answer plus the already center-served run sightings. A response whose identity no longer matches the current selection is discarded rather than rendered, and identity is the served stable member identity — trait id plus canonical digest plus family member/default — so a same-id family member is never matched by id alone, on either a detail response or a post-edit selection restore. A trust change that leaves the canonical digest unmoved still refreshes the shown detail. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` and `just test`, plus the diff read for a surviving local read on the moved paths.

3. **The direct library poll is gone, and nothing revives it.** No timer on any client refreshes Traits or Trust: freshness arrives as the center's event and is the only thing that produces a new accepted library model. The accepted-center-rows path no longer scans the library on every session snapshot or delta. Refresh plumbing left without a consumer is removed rather than left dormant. The Tasks board stat sweep and the terminal tick are untouched. The library request is made against an explicit repository scope, resolves for a repository with no session row, and does not fall back to the center's or the TUI process's cwd; blocking library work stays off the render and event loops and off the center's sole model/SQLite owner request path. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for a surviving timer, refresh route or scope fallback.

4. **Existing mutations still work and are observed only through the served answer.** Approve, block, edit source and explain on Traits, and approve, block, orphan toggle, marking and family/marked approval on Trust, keep their keys, modals, refusals and wording. Writes still converge on the single locked trust primitive and still recheck captured digests, and that recheck resolves the stable member identity rather than the first row sharing a trait id, so a same-id family set is checked member by member. After a successful write — single, family or marked — the new state becomes visible through a served update, not through a reinstated scanner or a local re-read; while the update is outstanding, previously accepted content is not presented as current. The post-edit detail refresh likewise comes from the served boundary. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard` and `just test`, over scratch trust stores and a same-id multi-variant family.

5. **Center absence has exactly three defined states, and none of them lies.** Spawn-on-need is attempted first through the existing connect path. With no accepted library answer the screen shows a typed outage. With a previously accepted answer, that answer stays visible only behind an explicit stale or error marker, and the marker clears only when a complete answer is accepted again. In no case does the TUI hard-fail, silently show an empty list as a valid library, or fall back to a filesystem read presented as current; a rejected candidate projection leaves the last accepted model intact and asks for a fresh complete answer rather than committing partially. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib dashboard` and `just test`.

6. **The workspace is unmoved.** Root Cargo resolution and the root `Cargo.lock` stay gpui-free, the desktop project stays outside the workspace, and this cut adds no dependency to `ctx-traits-io` beyond what it already carries. Decided by `just test` and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no inventory wire type, trust classification, family aggregation or trust word mapping is defined or copied in CLI code that the shared answer already carries; no shared inventory/trust/lockfile semantics are redefined; no filesystem watcher or CLI-level type enters `ctx-traits-io`; no action, key, modal or screen is added, removed or renamed; no test asserts on this repository's committed traits, lockfiles or board; no work belonging to `0267.2`, `0267.3`, `0267.4`, `0266`, `0268`, `0269` or `0261` is done; and no gpui or root-workspace file is touched.
"""
validation = """
## Approach

Suggested route, not a boundary. Every symbol is named because the grounding supports it at HEAD; take a different one wherever a goal requires it and say so in the work summary.

**Reuse points, named.** The public answer, stable identity, typed failures and freshness event `0267.1` lands are the one library source — no second inventory/trust wire type in CLI code. `load_traits_and_trust` (`dashboard.rs:2423-2445`) is the shape to keep and the site to replace: one complete input, both vectors, one commit. `build_trust_rows_from` (`dashboard.rs:2628-2698`) is the existing pure document-taking join and `sort_trust_rows` (`dashboard.rs:2700-2723`) the ordering authority; keep them, or replace them with `0267.1`'s shared projection where that makes the CLI-private copy redundant — never both. Render-only structures stay: `TraitRow` (`dashboard.rs:291-308`), `TrustRow` (`483-509`), `trait_row_label` (`8332-8346`), `trust_row_label` (`8414-8447`), `rebuild_visible_trust` (`2082-2101`), `trait_preview_lines`, `trust_preview_lines`, `build_two_pane_tree`, `render_lines_preview_pane`, the pane ids, scroll state, empty messages, selection and mark handling, keymaps (`dashboard/keymap.rs:71-88,117-134`) and the mutation modals. `trust_story::TrustClass::label` (`trust_story.rs:52-61`) is where the six TUI strings live; render them from the served typed state rather than re-deriving them. The worker is the client precedent throughout: staging between `SnapshotStart`/`SnapshotEnd`, projecting the complete candidate, committing only on success, reconnecting after a rejected candidate (`dashboard/worker.rs:254-415`), the outage text that distinguishes no-accepted-snapshot from retained-with-timestamp (`worker.rs:443-457`), and `State::apply_refresh_results`' retain-and-mark posture with the footer's `stale: <error>` (`dashboard.rs:1504-1530`, `8602-8611`). `State::apply_preview_results` (`dashboard.rs:1485-1501`) already demonstrates discarding a late response whose identity no longer matches the selection — the rule trait detail needs. `center::subscribe` already calls `ensure_connected` (`modules/io/src/center.rs:783-817`), so spawn-on-need and reconnection are inherited rather than re-policied. For scope evidence: `CenterPublicRow.repo_key`/`repo_path` (`center.rs:3778-3788`), `state::read_repo_index` (`state.rs:470-557`) and `state::canonical_repo_root`/`current_repo_key` (`state.rs:128-160`).

**Edit order.**

1. **Read what `0267.1` actually landed** — its request with its explicit repository scope, its answer's per-member records (tier/origin, family, variant key, typed trust state, source-only and unreadable arms), its stable member identity, its typed failures, its detail boundary if it has one, and its freshness event. Every name below is provisional until this step; none of it exists at this HEAD.
2. **The pure projection** — one function taking one complete served answer and returning `(Vec<TraitRow>, Vec<TrustRow>)`, replacing `load_traits_and_trust`. This is the unit-test seam for rows, field values, the non-built-in filter, unreadable mapping, orphan ordering and every label string.
3. **The worker's library path** — request on the landed client wrapper off the render/event loop, stage the candidate, project, commit both vectors only on success, retain the last accepted model behind an explicit marker on failure or outage, and subscribe to the freshness event as the only trigger for a new answer.
4. **Detail** — request selection-triggered detail by stable identity, discard a response whose identity no longer matches, and render the existing Traits pane from it. Where the landed answer lacks a field the pane shows (status, procedure shape, drift and its qualifier, source path and excerpt, trust reason, stale-record evidence), extend the served boundary minimally at `modules/io/src/center.rs` and the shared resolution rather than reading it in the dashboard. Keep the Trust preview's stronger freshness rule — a trust write changes class without moving the digest — driven by the served revision or event instead of the tick.
5. **Removal** — delete the library half of the 2s path: the `reload_non_session` call at `dashboard.rs:2840`, the `reload_non_session_state()` call inside `reload_from_center_rows` (`dashboard.rs:1629`), and `Command::Refresh`/`Handle::refresh_non_session`/`State::reload_non_session` (`dashboard.rs:1414-1417`; `worker.rs:168-169,529,548`) if no prerequisite has given them another consumer. Leave the Tasks board sweep and terminal tick alone.
6. **Mutations** — repoint the post-write and post-edit refresh at the served boundary, and widen `decide_member_apply` (`dashboard.rs:4053-4069`) and `reposition_trait_selection` (`dashboard.rs:4032-4034`) from trait-id matching to the served stable member identity, without changing any visible output.

**What must be proven** (observations, not mechanics): over synthetic served answers and scratch repositories, trust stores and packages only — authored, vendored, user-global and built-in rows through both projections; a same-id multi-variant family; an unreadable row keeping its exact error text; an orphan record ordered after actionable rows; both moved labels; detail for resolved, unreadable, missing/refused and stale responses, with procedure shape, drift and qualifier, source excerpt, trust reason and staleness; the Trust family roster; rapid A-then-B selection where A's response arrives last; a trust-only change with the canonical digest unmoved; one freshness event updating list and selected detail with no timer; a successful single, family and marked write becoming visible only after a served update, with previously accepted content explicitly marked while outstanding; and spawn-on-need, no-accepted-answer outage, retained-answer-plus-marker, marker cleared only on a complete accepted answer, and no filesystem fallback. The one-answer, one-detail-request and no-surviving-reader properties are diff-read or call-path observations, not fixtures: no call from the moved paths to `dashboard_trait_inventory`, `trust::read_store`, `run::load_trait`, `dashboard_trait_drift` or `read_source_excerpt`, and no periodic refresh route left for Traits or Trust. `modules/cli/tests/proof_center.rs` is the existing process-boundary suite for spawn, snapshots, deltas, reconnect, backpressure and repository scope; `modules/cli/tests/proof_trust_family_report.rs` already proves per-variant preservation and the conservative family aggregate over scratch fixtures; the dashboard unit module already covers projection, rendering, mutation and outage behaviour.

## Watch

- **Do not claim the single-read property as preserved.** HEAD is N+1 trust reads plus a defaulting selection read (content, Correction 1). Consume `0267.1`'s single-load resolution; do not carry `read_store().unwrap_or_default()` forward in any form, because it renders a broken trust store as unreviewed.
- **The Traits filter is not authored-only.** It is `origin != Some("built-in")`, so vendored and user-global winners stay listed; the desktop's genuinely-authored projection is a different projection over the same answer. `traits_filter_excludes_built_ins_leaving_them_for_trust` (`dashboard.rs:13455-13470`) states the contract.
- **Do not flatten the six TUI class labels to four.** `moved (approval stale)` and `moved (block stale)` are distinct list rows today.
- **Do not leave two readers behind, and do not leave an inert refresh route.** Removing the timer while `reload_from_center_rows` still scans, or keeping `Command::Refresh` alive with no consumer, both leave direct scanning one line from returning.
- **Detail is not a rescan.** Answering one selection by walking the inventory again is the cost this move exists to remove.
- **Identity, not index or bare id.** Family members share an id; a late response for selection A must never render over B, and a post-edit restore must land on the same member.
- **Fail loud, no silent staleness, no direct-reader fallback.** An absent answer is a typed outage, never an empty list that reads as a library with nothing in it.
- **Blocking work stays off the TUI event loop** and off the center's model-owner request path; no second connection or retry policy beside the existing one.
- **No test may depend on committed repo content** — not this repository's trait set, its `trait.lock` files or its board. Scratch and synthetic fixtures only; path/word/file-existence inventories are banned workspace-wide.
- **Workspace gate cost must not move**: gpui must not enter root resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing CI lanes, and no dependency is added to `ctx-traits-io` (`modules/io/Cargo.toml:12-29`). Rust is pinned to 1.97.1; isolate with `CARGO_TARGET_DIR=target` when a failure looks like a phantom "cannot find X".

## Bounded review

One substantive review pass over the completed diff before calling this done: compare both lists and both selected details against the legacy output for rows, field values, filtering, ordering, label strings and error text; confirm one accepted answer feeds both vectors and one detail request feeds the selected preview; read the moved paths for any surviving call to `dashboard_trait_inventory`, `trust::read_store`, `run::load_trait`, `dashboard_trait_drift` or `read_source_excerpt`, and for any surviving periodic refresh route or client timer; exercise a write of each kind and confirm it becomes visible only through a served update; and walk all three center-absence states. Then run the declared checks.

At most one targeted repair-and-rerun round: repair one named defect and rerun whatever evidence shows the repair holds and broke nothing already proven. If a second round would be needed, stop and report the failing command with its output, or the violated behaviour with its evidence, rather than iterating.
