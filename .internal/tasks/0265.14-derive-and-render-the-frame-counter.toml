validation = """
## Watch

- **`done/total` is not `frame N of M`.** The existing ratio is a completed
  count and is off by one on every live run, and names the wrong frame on a
  failed one. Relabelling it is the single most likely way this task ships a
  wrong number that every gate passes.
- **`current_run_index` is not an ordinal**, and ledger frames are not the plan.
  Either substitution lies inside every loop and every for-each — the two shapes
  the dogfood loop uses constantly.
- **A current position inside a parallel branch has no ordinal until the
  enumeration is completed.** `flatten_step` walks `children` and
  `otherwise_children` only; `parallel_branches` is by construction never merged
  into `children`. Completing it changes the TUI's parallel-plan numbers — update
  those expectations to the corrected values rather than skipping the correction
  or special-casing the desktop.
- **Container progress is a separate fact.** `iteration k/max` and `item k/total`
  belong where the projection already reports them; folding them into N or M, or
  multiplying body steps by iterations or list items, breaks both.
- **One derivation, two renders.** Two calls that independently walk a plan are
  two answers, and they disagree the moment a candidate is rejected or the
  selection changes.
- **`frame 0 of 0` and `frame 0 of M` are not outcomes.** Absent is absent, and
  the three absence reasons stay distinguishable at the derivation boundary
  because `0266.4` needs to tell them apart.
- **Compact list rows must never trigger the reconstruction.** The counter
  belongs to the selected run; a per-row reconstruction breaks the family's read
  posture and the ledger-is-authoritative rule.
- **A run whose plan cannot be resolved renders no counter, not a partial one.**
  Fail-loud beats a plausible number, and no fallback is assembled from the row.
- **No poll loop, and no new read path.** The counter advances by the mechanism
  `0257` landed for the frame tree. No timer, interval, spawned tick, periodic
  query, per-frame ledger reread or widened `center::get`; reconstruction work
  stays off gpui's UI thread. If the landed contract cannot carry the current
  structural position, stop and report the unmet prerequisite.
- **Snapshot-then-delta transactionality is the contract**: a rejected candidate
  must not leave the bar and the header disagreeing about N, and last-accepted
  progress is visible only behind the explicit stale marker.
- **Late A must not overwrite B.** Detail for a superseded selection is discarded
  against the stable selection identity, never rendered.
- **No design example is a literal.** `frame 5 of 9`, `review round 2` and the
  exported summary sentence illustrate one run; they are shapes, not data to
  ship. Prose phrasing resolves through the shared `placeholders` module.
- **No dangling separator, and exactly one summary element.** Every combination
  of present and absent state, counter, round and description must compose
  cleanly at both sites without touching the shared bar or header.
- **Do not import CLI-private types.** `run_view`'s modules and types are
  `pub(super)`/`pub(crate)` presentation code sitting next to ratatui rendering;
  extract the pure semantics and move the CLI onto it, and never copy it into
  gpui — copying is a defect even when it compiles.
- **Extraction stops at demonstrated consumers.** This cut and the CLI are the
  consumers; `0266` is a named future one and is not a licence to widen.
- **Workspace gate cost must not move**: gpui must not enter root resolution,
  the root `Cargo.lock`, `just test`, `just test-full` or the existing CI lanes.
  Isolate with `CARGO_TARGET_DIR=target` if a failure looks like a phantom
  "cannot find X".
- **The declared checks are workspace-side invariants, not proof of this task's
  desktop behaviour.** They show the workspace stayed gpui-free, the per-round
  gate stayed green and the CLI's projection survived the extraction; the
  rendered outcome is verified in the desktop lane `0256.1` establishes, whose
  exact non-interactive command becomes declarable as a check on this task once
  `0256.1` lands it.

## Done when

Every clause below is a completed observable outcome. None of them is satisfied
by stopping, reporting, or choosing an alternative; that case is the separate
section after this one, and it is not completion.

- One shared counted-frame enumeration exists in core/IO code both faces consume,
  complete over the resolved plan including `parallel_branches` children, with
  the CLI's `RunHeader.done`/`total` reduced to projections of it, and its
  focused tests establish: the `Prompt`/`Command`-only classification against all
  other kinds; N for first-active, middle-active, completed, stopped/failed, and
  current-non-counting runs; the typed absence for an unresolvable plan, for a
  resolved plan with zero counted steps, and for none-reached-yet; selected and
  unselected branch arms and an undecided branch; loop rollover, bounded and
  unbounded loops, for-each with and without a resolved `item_total`, nested
  paths, and a current position inside a parallel branch child; and container
  `iteration k/max` / `item k/total` still reported separately from N and M.
- The counter is carried on one field of the accepted selected-run model and
  rendered at both sites, and the desktop project's own test lane — extended
  with this cut's coverage and passing — shows: the bar's detail reading `<state> · frame N of M · review round R` with
  the same N and M the header's single summary element carries; every
  present/absent combination of state, counter, round and description composing
  with no blank, doubled or dangling `·` and exactly one summary element; the
  counter advancing as frames land through the landed detail mechanism with no
  timer; an accepted update moving both sites together and a rejected candidate
  leaving both unchanged; center loss not leaving the counter looking current; a
  late A response discarded after selection B; a resolution failure rendering no
  counter at either site with no row-derived fallback; a compact list rendering
  with no per-row reconstruction; and a finished run reopened deriving the same
  final N and M. The `0256.2`-`0256.5` and `0257` proofs pass unmodified.
- The closing diff read shows: no second plan walk on either render path; no
  CLI-private import or copied projection in the desktop; no `current_run_index`,
  ledger-frame-count, row-field or list-position derivation; no `frame 0 of 0` or
  `frame 0 of M`; no collapsed absence reasons; no container progress folded into
  N or M; no design-example or inline prose literal; no change to the shared bar
  or header component; no timer, interval or spawned tick; no blocking receive on
  the UI thread; no desktop-side filesystem, ledger, store, sidecar, board,
  task-file or cwd read; no widened center request or second detail model; no
  light-column value; and no gpui in root resolution.
- The three declared checks exit 0, with `run_view`'s existing tests retained
  under their filter and updated only where Correction 2 corrects their expected
  counts.
- No file under `.internal/docs/design/`, no sibling-owned screen region and no
  center protocol is modified.
- The work summary names the discovered desktop path and its exact invocation,
  where the shared enumeration landed, whether `0257` had already provided it,
  any owner correction raised against the design artifacts, and any deviation
  from the approach. (A clean worktree and one task-scoped commit are the
  suggested workflow, not a completion criterion.)

## If a prerequisite is unmet

This is not a completion path and satisfies no Done-when clause; it is what to
do when the work cannot be started as specified. If the dependency chain reports
closed and the desktop project nonetheless carries no non-interactive test lane,
or the landed `0257` detail contract carries no structural evidence sufficient
to re-derive the current position, stop and report that unmet prerequisite with
its evidence. Do not substitute `just test` for desktop proof, stand up a
parallel lane, invent a command, or add a poll, timer or per-frame ledger read
to route around a missing contract. A prerequisite reported honestly leaves this
task unfinished, and that is the correct outcome in that case.

## Bounded refinement

The bound is the binding part; the order is a suggestion. Suggested order: the
desktop project's test lane, then the `run_view` projection check, then
`just test`, then the root-resolution check. At most one targeted
repair-and-rerun round: repair one named defect, then rerun the failed command
and every command after it. If a second round would be needed, stop and report
the exact failing command with its evidence, or the exact unresolved contract,
rather than iterating. That bound is the stop condition, not a judgement call.
"""
[relations]
parent = "0265"
depends-on = ["0265.3", "0265.13", "0257"]

[[checks]]
name = "per-round workspace gate remains green"
command = "just test"
timeout-ms = 1800000

[[checks]]
name = "the run-view projection survives the extraction"
command = "CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --lib run_view"
timeout-ms = 1200000
expect = "test result: ok\\. [1-9]"

[[checks]]
