content = """
`frame 5 of 9` appears twice on the Sessions screen — inside the bottom bar's
detail (`running · frame 5 of 9 · review round 2`, rule 8,
`.internal/docs/design/grammar.md:74-84`, `screens/sessions.md:32-34`) and
inside the header's single narrated summary element (rule 6,
`grammar.md:58-66`, `screens/sessions.md:14-18`). Both are tagged `data:`; only
the surrounding prose is `placeholder:`. This cut derives that one value once
and fills it into the two composition slots `0265.3` and `0265.13` already
reserved for it.

Where it comes from is the whole of the task. `Session.current_run_index` is not
the ordinal — it indexes the current sequence, and a session inside a loop or a
for-each moves along `active_path`, `next_frame.position_path` and
`control_stack` without that index describing progress
(`modules/cli/src/app/run_view/planned.rs:285-299`, `608-629`;
`modules/core/src/procedure/session.rs:1424-1514`). Nor is it a ledger frame
count. It is a fact about the *resolved structural plan* joined to the run's
current position, which is why it lands after the bar, the header and the
selected-run reconstruction exist rather than being guessed by any of them.

## Five corrections to the draft this plan replaces

**Correction 1 — `done/total` is not `frame N of M`, and the draft conflated
them.** The draft said the derivation "already exists" and pointed at
`RunHeader.done`/`total`. It does not exist. `done` counts flattened steps where
`counts_progress && state == StepState::Done`; `total` counts where
`counts_progress` (`projection.rs:156-168`), and the TUI renders that as
`progress {done}/{total}` (`modules/cli/src/app/render.rs:1397-1404`). A run
executing its fifth counted step has `done == 4`, so relabelling the ratio
`frame 5 of 9` is off by one on every live run. `StepState::Done` also excludes
a `Rejected` or stopped current step and any running step
(`planned.rs:29-54`, `708-741`), so a failed run's ratio names the frame *before*
the one that failed. Downstream `0266.4` asks for "the claiming run's frame
ordinal and total" (`0266.4:11`). N is therefore bound below as a reached
ordinal, not a completed count, and both values are projections of one
enumeration so the TUI's existing ratio is not disturbed.

**Correction 2 — the enumeration is incomplete for parallel plans, and N is
underivable without fixing it.** `PlannedSequenceItem.parallel_branches` keeps a
parallel item's branch children separate and, by its own doc comment, "never
merged into `children`" (`modules/core/src/procedure/run/model.rs:139-150`); the
planner fills it (`planner.rs:312-356`, `550-577`). `flatten_step` walks
`children` and `otherwise_children` only (`planned.rs:34-84`), so `run_view`'s
step list omits every parallel branch child. `done`/`total` therefore already
understate parallel plans, and worse for this cut: when the run's current
position is inside a parallel branch, that step is not in the enumeration at all
and a reached ordinal cannot be computed. Completing the enumeration is
load-bearing here, not an opportunistic fix, and it moves the TUI's own
`progress` numbers for parallel plans — that consequence is accepted and its
tests are updated to the corrected counts rather than the correction being
skipped.

**Correction 3 — "the counter advances as frames land, from deltas" is not
supported by the wire contract as it stands.** `CenterDelta::RowChanged` carries
only a compact `CenterPublicRow`, and `ActivityLine` adds one `ActivityRecord`
(`modules/io/src/center.rs:265-281`). `RunSummary` carries no `active_path`, no
`control_stack`, no `current_run_index`, no plan and no progress field
(`modules/io/src/run_summary.rs:23-118`) — verified field by field. `FrameDone`
refreshes the ledger and can emit `RowChanged` (`center.rs:1996-2053`,
`3624-3627`), but that delta alone cannot recompute structural progress, and
`center::get` is a one-shot full-`Session` request served by a `read_session`
inside the sole model owner's `handle_request` (`center.rs:916-935`,
`3649-3669`) — not a structural detail stream. The counter therefore advances by
*exactly the mechanism that advances `0257`'s native frame tree*, whatever that
landed as, and adds no read path of its own. If the landed detail model cannot
express the current structural position, that is an unmet prerequisite — handled
by `validation`'s unmet-prerequisite section, which is not a completion path —
never a licence to add a poll, a timer or a per-frame ledger read.

**Correction 4 — the zero-counted-frame and not-yet-started cases were
undecided.** The draft specified omission only when the plan cannot be resolved.
But a successfully resolved plan can legitimately contain zero Prompt/Command
items, and a run can be sitting on an `Ask`, a `Check` or a container header
before any counted frame is reached. `frame 0 of 0`, `frame 0 of 9`, an omitted
segment and an error are four observably different outcomes. Goal 2 binds all of
them under one typed result.

**Correction 5 — the draft had no closing review and no stop condition.** Its
`## Watch` and `## Done when` described the outcome but never required the diff
to be read or bounded the repair. Siblings `0265.3`, `0265.5`, `0265.6` and
`0265.13` all carry one targeted repair-and-rerun cycle and then stop. This plan
carries the same, in `validation`.

## Grounded at HEAD 1fd7702a5

Nothing this task edits exists yet. There is no tracked desktop project,
manifest, lockfile, gpui source tree, desktop recipe in `Justfile` or desktop CI
lane; root `Cargo.toml:1-12` lists seven workspace members and excludes only
`packages/cdk`; the root `Cargo.lock` has no `gpui` package. `0256` and its five
children, `0257` and its three children, `0265.3` and `0265.13` are all `ready`
rather than done, so no shared structural projection, selected-run detail model,
reducer, bar detail slot, header component or `placeholders` module exists in
production Rust. Every desktop path, module name, type, signature and command
named under `## APPROACH` is a guess to be replaced by discovery against what
those tasks actually landed; binding them here would be fabrication. What is
checkable from the repository root today — and the only board coverage this task
can honestly declare — is that the workspace stayed gpui-free, that the
per-round gate stayed green, and that the CLI's own run-view projection stayed
green through the extraction.

## What proves the desktop side, and what this file will not pretend

Nothing in this repository can execute a desktop render today. So no command
stands in for that proof here: the desktop goals below are stated as observable
rendered outcomes, no symbolic "deciding command" is named as their gate, and no
`[[checks]]` entry is declared that would execute a lane which does not exist.
The three declared checks are workspace-side invariants that run today and are
labelled as such.

Where those outcomes get observed is approach, not boundary. The standalone
desktop project carries its own non-interactive build-and-test lane by the time
this leaf dispatches — establishing and documenting one is `0256.1`'s own
Done-when clause (`0256.1:7-17`), and the chain `0265.14` → `0265.3` → `0265.1`
→ `0256.1` is hard: an open leaf derives `Blocked` while any `depends-on` target
is not `Done` (`modules/core/src/task/graph.rs:115-177`). No further edge is
added here.

Finding that lane is mechanical — root `Cargo.toml`'s exclude list and the
top-level listing give the desktop project; its manifest, README, justfile or CI
lane gives the command `0256.1` documented. Extending it with this cut's
coverage rather than standing up a parallel one, and recording its
repo-root-relative path and exact invocation in the work summary, is the
suggested route; deviate where a goal requires it and say so. What is not a
deviation but a fabrication: inventing a command and writing it into this file,
declaring a board check that executes a lane that does not exist, or
substituting `just test` for desktop proof. Once `0256.1` has landed a command,
it becomes declarable as a `[[checks]]` entry on this task.
