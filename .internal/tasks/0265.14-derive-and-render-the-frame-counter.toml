5. **The counter advances by the landed detail mechanism, and nothing else.**
   It updates as frames land through exactly the contract `0257` landed for
   keeping the native frame tree current — no timer, interval, spawned tick,
   poll loop, periodic center query, per-frame ledger reread, second center
   protocol or widened `center::get`. Trait, plan and ledger work stays off
   gpui's UI thread.
   Observed over a live run whose counter advances as frames land, with
   `0256.2`-`0256.5` and `0257`'s own proofs passing unmodified, and by the
   closing diff read finding no timer, interval, spawned tick, blocking receive
