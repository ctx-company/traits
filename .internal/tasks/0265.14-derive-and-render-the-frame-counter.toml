## Goals and approach are separate

Everything under `## GOALS` is binding: each names an observable outcome, how it
is observed, and what it excludes. Everything under `## APPROACH` — the
discovery order, expected files, symbols, signatures, edit order, which commands
to run and in what order, when to baseline them, the proof mechanics and the
commit topology — is the architect's suggested route from the grounding and
never a boundary. Deviate from any of it wherever a goal requires it and record
the deviation in the work summary; a deviation is not a violation, needs no
escalation, and nothing elsewhere in this file overrides that. The only binding
mechanism in the whole file is the refinement bound in `validation`.

## GOALS — binding

1. **One structural enumeration, in shared code, complete over the resolved
   plan.** The counted-frame enumeration lives once in shared core/IO code that
   both faces consume — not imported from `ctx-traits-cli` (its `run_view`
   modules and types are `pub(super)`/`pub(crate)` presentation code,
   `modules/cli/src/app/run_view.rs:1-5`, `25-56`), and not copied into gpui.
   Over the plan **as it resolved**, it enumerates in structural order every
   progress-counting step — `Prompt` and `Command` only; `Ask`, `Check`,
   `Project`, `Sequence`, `Branch`, `Loop`, `ForEach`, `Parallel` and `Terminal`
   do not count, matching `counts_progress` (`planned.rs:600-606`) — including
   the children of `parallel_branches`, which today's `flatten_step` omits
   (Correction 2). Only a decided branch's selected arm is enumerated; before a
   decision neither arm is (`planned.rs:55-83`, `179-199`). A loop or for-each
   body is enumerated once and never multiplied by iterations or list items.
   The CLI's existing `RunHeader.done`/`total` become projections of this one
   enumeration rather than a second walk, so the two faces cannot disagree; the
   TUI's rendered `progress {done}/{total}` keeps its completed-count meaning
   and changes only where Correction 2 corrects it for parallel plans.
   Decided by the extraction's own focused tests under the workspace gate, plus
   the declared `run_view` check staying green with its parallel-plan
   expectations updated to the corrected counts.
   Excluded: a desktop copy of `planned.rs`/`projection.rs` semantics; importing
   any CLI-private type into the desktop; a second walk of the plan for the
   header or for `0266`; extracting anything beyond what this cut and the CLI
   demonstrably consume — no generic progress framework, trait layer or
   projection registry; changing what counts as progress-counting anywhere
   without changing it everywhere; multiplying body steps by iterations.

2. **N and M are bound, and every state has exactly one answer.** From that
   enumeration plus the run's current structural position — the position
   `active_position_path` resolves, preferring `session.next_frame.position_path`
   over `session.active_path` and matching iteration- and item-stamped structural
   paths, not `current_run_index` (`planned.rs:285-299`, `317-419`, `608-629`) —
   the derivation yields **one typed result**:
   - **M** is the number of counted steps in the enumeration.
   - **N** is the one-based ordinal, in enumeration order, of the counted step
     the run has *reached*: the current step's own ordinal when the current item
     is a counted step; the number of counted steps preceding it when the current
     item is non-counting; M when the run has completed; and, when the run
     stopped or its current counted step failed, that step's own ordinal — the
     frame it died on, never one less. N never exceeds M.
   - The result is **present** only when `1 <= N <= M`. Otherwise it is one
     typed absence naming its reason: the plan could not be resolved; the
     resolved plan has no counted steps; or no counted step has been reached
     yet. Every absence renders no counter segment at all.
   Decided by the extraction's focused tests over first-active, middle-active,
   completed, stopped/failed-current, current-non-counting, and zero-counted-step
   runs, under the workspace gate.
   Excluded: rendering `frame 0 of 0` or `frame 0 of M`; deriving N from
   `current_run_index`, from a ledger frame count, from a row field, from list
   position or from a completed-count ratio; flattening a container's
   `iteration k/max` or `item k/total` into N or M — those stay the separate
   structural fact `container_progress_text` already reports
   (`planned.rs:632-661`, off `ControlFrame`'s `iteration_index`,
   `max_iterations`, `item_index`, `item_total`, `runtime/state.rs:349-389`);
   collapsing the distinct absence reasons into one silent `None` at the
   derivation boundary, which `0266.4` needs to tell apart.

3. **One value, two renders, one field.** The result of goal 2 is carried as a
   single authoritative optional progress field on the accepted selected-run
   model `0257`/`0256` landed. The bar's caller-supplied detail slot and the
   header's single summary element both format or consume that exact field.
   Neither render site walks a plan, resolves a trait, reads a ledger or derives
   the value itself.
   Observed by both sites carrying the same N and M from one accepted model, and
   by the closing diff read finding no second derivation call on either path. No
   command in this repository decides this today; it is observed in the desktop
   project's own test lane, and no board check is declared for it.
   Excluded: a header-private or bar-private derivation, request, subscription,
