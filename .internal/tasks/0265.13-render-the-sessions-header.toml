## Goals and approach are separate

Everything under `## GOALS` is binding: each one names an observable outcome,
what decides it, and what it excludes. Everything under `## APPROACH` — the
discovery order, the expected files, symbols and signatures, the edit order and
the proof mechanics — is the architect's suggested route from the grounding and
never a boundary. Deviate from any of it wherever a goal requires it, and record
the deviation in the work summary; a deviation is not a violation and needs no
escalation.

## GOALS — binding

1. **Rule 6's header exists once, as a reusable source-agnostic component.**
   One desktop component renders the title block: a full-width `space-between`
   row; a left-aligned title stack at gap 5 holding a title in IBM Plex Sans 13
   `text-heading` at normal weight over exactly one italic IBM Plex Sans 12
   `text-secondary` summary at fixed width 560; `∷` in IBM Plex Mono 14
   `text-secondary` in a `[2,8]` wrapper at the top right; and no breadcrumb,
   back link or subtitle anywhere. It takes an already-presented title string
   and one already-composed summary string and renders them — it performs no
   center, board, ledger, store, sidecar, filesystem, cwd, cache or selection
   read, and knows nothing about `CenterPublicRow`, `RunSummary` or a
   claimed-task answer. Every colour, size, spacing, weight and family comes
   through `0265.1`'s token and typography entry point; no such literal appears
   at any call site in this cut. It is placed and reachable so that `0267.2`,
   `0268.2` and `0269.2` compose it rather than re-deriving it.
   No repo-root command inspects a rendered gpui screen at this HEAD, so this
   goal declares no board check and none may be invented. Decided by **the
   deciding desktop command** — the single invocation `content` resolves by
   definite rule from `0256.1`'s documented lane, baselined unedited before any
   edit and named verbatim in the work summary — exiting 0, plus the bounded
   review reading the closing diff against
   `grammar.md:58-66`, `screens/sessions.md:14-18`, the dark column of
   `tokens.md` and `reference/sessions.html:251-288`.
   Excluded: a Sessions-private header, title stack or glyph placement; a second
   summary element, or zero; a breadcrumb, back link or subtitle; a generic
   screen framework, component registry, theme abstraction or header variants
   for screens that do not exist yet; the other screens' headers (`0266`-`0269`
   consume this component); any light-column value.

2. **The title composes from one accepted claimed-task answer.** Both halves —
   the canonical task key and the task title — come from a single accepted
   `0265.2` answer for the currently selected run; neither is taken from
   `RunSummary.task_key`, `RunSummary.title`, the session title, a board
   document read desktop-side, `task_board_cache` or the previous selection. The
   selected row supplies only the stable run and repository identity used to
   request and validate that answer.
   Decided by that same desktop command, whose coverage must include a title
   rendered from one answer and a rapid A-then-B selection whose A answer
   arrives last leaving B's header intact; plus the bounded review's diff read
   for any pairing of a row-sourced key with an answer-sourced title.
   Excluded: a header-private claimed-task request, subscription, reducer,
   cache, model or poll; a second claimed-task protocol or center change; any
   desktop-side board, task-file, ledger, store, sidecar, cwd or cache read;
   deriving board status or rendering any status word in the header, which is
   `0265.10`'s row and which `0265.2` deliberately does not derive.

3. **Every non-success claimed-task outcome is visible.** `0265.2`'s typed
   outcomes are consumed as outcomes, not flattened into an `Option`. A run that
   claims no task renders that absence visibly, and every failed or refused
   lookup — missing or ambiguous session, unusable repository scope, provider
   failure, absent or unparseable claimed document — renders a visible
   non-success state.
   Decided by the desktop command's coverage over the no-claimed-task case and
   at least one failed-answer case; plus the bounded review's diff read.
   Excluded: a blank title; an invented or placeholder task title; substituting
   the session title, `RunSummary.task_key` alone, a cached board value or the
   prior selection's title; a `match` arm that collapses distinct typed outcomes
   into one silent absence; covering a request failure with any local read.

4. **The summary is exactly one element, and its description is the run's
   session title.** The header renders one narrated summary and never two or
   zero. Its description leaf is the accepted selected row's `RunSummary.title`
   — the narrator-resolved session title, projected through
   `SessionTitleState::resolved_title()`
   (`modules/io/src/run_summary.rs:204-209`,
   `modules/core/src/procedure/session.rs:378-417`) — and nothing else. That
   field is legitimately absent for `InFlight`, `Retryable` and `Terminal`
   titles and for `Provenance.session_title = None`, which means unattempted and
   covers every ledger written before the field existed
   (`session.rs:295-301`); when it is absent the summary still renders as one
   element in module-owned placeholder phrasing, carrying no description.
   Decided by the desktop command's coverage over a present and an absent
   session title, both rendering exactly one summary element; plus the bounded
   review's diff read.
   Excluded: rendering the claimed task's `description` (`0265.2`'s wire name
   for `TaskDocument.content`) as the run description — the substitution this
   cut exists to prevent; substituting the task's `scope` or `validation` prose,
   the session phase, `current_sequence_title`, the run id or an empty string
