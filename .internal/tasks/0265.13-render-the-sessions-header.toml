validation = """
## Watch

- **Do not substitute the task description for the run description**, and do not
  substitute the session title for the task title. Two different leaves, two
  different sources, both tagged `data:` — a plausible-looking swap misreports
  the screen in a way no build gate catches. `0265.2` names its projection of
  `TaskDocument.content` `description`, and that is not this screen's run
  description.
- **One answer, both title halves.** Pairing the selected row's `task_key` with
  a title from a different or stale response renders a title that never existed.
- **An absent session title is a real state, not an error and not a gap to
  fill.** `session_title` is `None` on every ledger written before it existed
  and on every run whose title has not been requested, and `InFlight`,
  `Retryable` and `Terminal` all project no title. The summary stays one element
  and carries no description; it never invents one.
- **Exactly one narrated summary, and no breadcrumbs anywhere**: two elements or
  none breaks rule 6.
- **No inline placeholder literal.** The phrasing comes from the shared module;
  a literal at the call site is the defect the doctrine exists to prevent.
- **No design example string is hardcoded.** `0243.4 — everyone asks the
  center`, the exported summary sentence, `Review round 2` and `frame 5 of 9`
  illustrate one run; they are shapes, not data to ship.
- **Do not invent the counter.** The summary leaves a composable position;
  `0265.14` derives and fills it from the reconstruction.
- **The task answer is a response, not a delta.** The description updates from
  `RowChanged`; the claimed task arrives as the request's answer. No timer, no
  interval, no repeated request, and no blocking read on gpui's UI thread. A
  rejected projection leaves no partially committed header.
- **Late A must not overwrite B.** Selection identity is stable, the candidate
  is staged and committed whole, and a response for a superseded selection is
  discarded rather than rendered.
- **Center loss cannot leave the header looking current.** It inherits
  `0256.5`'s explicit stale and outage posture; there is no header-private
  subscription, reducer, cache or poll loop.
- **Fail-loud.** A run whose claimed task cannot be read reports the failure; it
  never renders a blank or invented title, and never covers the failure with a
  local read.
- **The reusable component reads nothing.** If it needs to know about a row, an
  answer or a selection to render, the composition boundary three later screens
  depend on has been broken.
- **The export is measurement, the rules are the specification.** Take geometry
  from `reference/sessions.html:251-288`; take content and colour semantics from
  `grammar.md:58-66` and `screens/sessions.md:14-18`. Report any conflict rather
  than resolving it silently.
- **Workspace gate cost must not move**: gpui must not enter root resolution,
  the root `Cargo.lock`, `just test`, `just test-full`, or the existing CI lanes.
  Isolate builds with `CARGO_TARGET_DIR=target` if a failure looks like a
  phantom "cannot find X".
- **The declared checks are workspace-side invariants, not proof of this task's
  desktop behaviour.** They show the workspace stayed gpui-free and green and
  that the inherited center contract still holds; the rendered outcome is
  verified in the desktop lane `0256.1` establishes, whose exact non-interactive
  command becomes declarable as a check on this task once `0256.1` lands.

## Done when

- The deciding desktop command is resolved before any edit by the definite rule
  in `content` — root `Cargo.toml`'s exclude list and the top-level listing to
  the standalone desktop project, that project's manifest, README, justfile or CI
  lane to the command `0256.1` documented — its unedited baseline is run, and its
  repo-root-relative path and exact invocation are recorded verbatim in the work
  summary. If the dependency chain reports closed and that lane is nonetheless
  absent, the task stops there and reports the unmet prerequisite rather than
  substituting `just test`, standing up a parallel lane, or inventing a command.
- That resolved command exits 0 with the reusable rule-6 header component, the
  one module-owned Sessions summary phrasing surface in the `placeholders`
  module and the Sessions header call site in the tree, and the
  `0256.2`-`0256.5` tests pass unmodified.
- That command's coverage shows: the component's gap-5 title stack, sans 13
  `text-heading` title, single italic sans 12 `text-secondary` summary at width
  560, and mono 14 `text-secondary` `∷` in a `[2,8]` wrapper on a full-width
  `space-between` row, with no breadcrumb; a title composed from one
  claimed-task answer's key and title together; a present session title
  rendering as the description and an absent one still rendering exactly one
  summary element with no description; a live `SessionTitle` `RowChanged` delta
  updating the description; the no-claimed-task outcome and at least one
  failed-answer outcome rendering visible non-success; a rapid A-then-B
  selection whose late A results are discarded; a rejected projection preserving
  the prior complete header only under stale treatment; the phrasing resolving
  through the shared `placeholders` module; and the summary composing with and
  without an optional trailing counter segment, with no dangling separator and
  no change to the shared component.
- The closing diff read shows: no colour, size, spacing, weight or family
  literal at a call site and no light-column value; no Sessions-private header
  and no duplicated header geometry; no center, board, ledger, store, sidecar,
  filesystem, cwd, cache or selection read inside the reusable component and
  none anywhere in this cut's desktop code; no second claimed-task request,
  protocol, model, reducer, subscription or cache; no `Option`-flattening of the
  typed outcomes; no row-sourced key paired with an answer-sourced title; no
  task prose, session phase or `current_sequence_title` standing in for the run
  description; no inline placeholder or design-example literal; no counter
  derivation; no timer, interval or spawned tick; no blocking receive on the UI
  thread; and no gpui in root resolution.
- The three declared checks exit 0.
- The task commit touches no file under `.internal/docs/design/`, no
  sibling-owned screen region, and no center, core or IO semantics.
- `git status --short` is empty, the work is in one task-scoped commit, and the
  work summary names the discovered desktop path, the exact desktop command,
  which side of the `0265.10` ownership fork was taken, any owner correction
  raised against the design artifacts, and any deviation from the approach.

## Bounded refinement

Run the desktop command, then the root-resolution check, then `just test`, then
the center wire proof. Permit at most one targeted repair-and-rerun round:
repair one named defect, then rerun the failed command and every command after
it in that order. If a second round would be needed, stop and report the exact
failing command with its evidence, or the exact unresolved leaf, rather than
iterating. That is the stop condition, not a judgement call.
"""
