   ledger or sidecar read to recover it.

5. **A session title that resolves mid-run reaches the header on a delta, and
   nothing commits partially.** A `CenterDelta::RowChanged` carrying a newly
   resolved title — the path `broadcast_activity` emits after writing
   `row.summary.title` from an `ActivityRecord::SessionTitle`
   (`center.rs:2423-2445`) — updates the description without a refresh, a timer,
   an interval, a spawned tick or a repeated claimed-task request. It reaches
   the header only through the complete accepted selected model: a candidate is
   staged, projected and committed whole, a rejected projection leaves the
   previously accepted header intact rather than a partially committed one, and
   last-accepted data stays visible only behind the explicit stale or outage
   marker `0256.5` landed. Synchronous socket receives and claimed-task work
   stay off gpui's UI thread.
   Decided by the desktop command's coverage over a live `SessionTitle` row
   delta updating the description, a rejected projection preserving the prior
   complete header only under stale treatment, and center loss leaving the
   header not looking current, with the `0256.2`-`0256.5` proofs passing
   unmodified; plus the bounded review's diff read for any timer, interval,
   spawned tick, blocking receive on the UI thread, or header-private
   subscription, reducer or cache.
   Excluded: a second reducer, subscription, accepted-row model or claimed-task
   model beside the one landed; any center protocol change; per-row or
   unselected-row work — compact-row projection must not trigger a selection
   detail or board read.

6. **The summary phrasing comes from the shared module, and the counter slot is
   reserved, not filled.** The Sessions summary's prose phrasing resolves
   through the one `placeholders` module `0265.3` created, extended with exactly
   the one module-owned Sessions summary phrasing surface this cut consumes and
   nothing more, traceable to
   the `placeholder:` tag in `screens/sessions.md:14-18` that authorises it. The
   summary is composed so `0265.14` can add its `frame N of M` to the same
   single summary element without changing the shared header component, and so
   that any combination of present and absent description and counter renders
   one element with no blank, doubled or dangling separator.
   Decided by the desktop command's coverage showing the phrasing resolving
   through the module and the summary composing correctly with and without an
   optional trailing counter segment; plus the bounded review's diff read for a
   duplicate literal at the call site.
   Excluded: an inline placeholder literal anywhere; a second `placeholders`
   module; a registry, lookup framework, trait or macro layer; entries no cut
   renders yet; deriving or rendering `frame N of M`, or any counter guessed
   from list position, row count or `current_run_index` (`0265.14` owns it); the
