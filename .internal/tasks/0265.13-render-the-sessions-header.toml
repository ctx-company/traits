content = """
Grammar rule 6 opens every v1 screen with a title block: a title in sans 13
`text-heading` over exactly one italic narrated summary in sans 12
`text-secondary` at fixed width 560, with `∷` in mono 14 `text-secondary`
padded `[2,8]` at the top right of a full-width `space-between` row, and no
breadcrumbs anywhere (`.internal/docs/design/grammar.md:58-66`). The export
fixes the remaining geometry: title-stack gap 5, title weight normal, summary
width 560, action wrapper `[2,8]` (`reference/sessions.html:251-288`).
`screens/sessions.md:14-18` names the Sessions instance: the title is the
claimed task's id and title, both tagged `data:`; the summary carries the run
description and — later — the frame counter, in prose phrasing tagged
`placeholder:`.

This cut renders that header on Sessions **and extracts it once**, because it
is the first screen to need it and three later screens already depend on this
leaf for it. It composes; it resolves nothing. The claimed-task answer is
`0265.2`'s, the `placeholders` module is `0265.3`'s, the tokens and IBM Plex
faces are `0265.1`'s, and the frame counter is `0265.14`'s.

## Four corrections to the draft this plan replaces

**Correction 1 — the header is a reusable component, and the draft never said
so.** The parent charter assigns shared screen-header extraction to this cut,
and `0267.2`, `0268.2` and `0269.2` each carry an explicit `0265.13`
`depends-on` edge for exactly it, each describing the same contract: a
component taking a title string and one already-composed summary string, owning
the typography, the fixed width, the title-stack gap, the `∷` and the
breadcrumb prohibition. The draft planned a Sessions header only; its Done-when
was satisfiable by a Sessions-private layout that three later leaves then
cannot consume, which is the duplication those three files call a defect even
when it renders correctly. The component is therefore source-agnostic: it
renders presented strings and performs no center, board, ledger, sidecar,
filesystem or selection read. Every data decision belongs to the Sessions call
site.

**Correction 2 — both title halves come from one accepted answer, not from the
row plus the answer.** The draft read "`RunSummary.task_key` names the task and
the served answer carries its title". Those are two values with two arrival
paths: the key is on the selected compact row, the answer arrives
asynchronously against a selection identity, and a late answer for selection A
paired with B's row key renders a task title that never existed. `0265.2`'s
answer carries the canonical key *and* the title together, so the header
composes both halves from that one accepted value. The row still supplies the
stable run and repository identity used to request and validate the answer — it
just does not supply the rendered key.

**Correction 3 — the claimed task does not arrive on a delta.** The draft's
watch item said "the title and description update from center deltas as the
claimed task and the session title resolve". Half of that is unsupported.
`0265.2` serves an on-demand, run-addressed request and defines no task-answer
delta stream; board freshness events are `0266`'s work. The description half is
correct and its mechanism is concrete: on an `ActivityRecord::SessionTitle`,
`broadcast_activity` writes the resolved title onto `row.summary.title` and
emits `CenterDelta::RowChanged` without reopening the ledger
(`modules/io/src/center.rs:2423-2445`), while the drive path appends the
resolved title to the durable activity sidecar at resolution and the
authoritative ledger write waits for a safe frame boundary
(`modules/cli/src/app/drive.rs:5502-5531`), and the center's refresh prefers the
ledger title and falls back to the sidecar when the ledger has not caught up
(`center.rs:2140-2147`, `modules/io/src/activity_sidecar.rs:206-217`). So the
title is a response, the description is a delta, and neither is a timer or a
repeated request.

**Correction 4 — the example string is a shape, and the failure state is
binding.** `0243.4 — everyone asks the center` and the exported summary sentence
illustrate one run; the parent explicitly forbids hardcoding design examples,
and the draft carried the example inline through its content, scope and
Done-when. Separately, the draft's fail-loud clause lived only in `## Watch`
while its Done-when described the success rendering alone. Typed non-success is
now a bound goal: `0265.2`'s typed outcomes are consumed as outcomes rather
than flattened into an `Option`, and a run that claims no task, together with
every failed or refused lookup, renders a visible non-success state.

## Claimed-task ownership, between this cut and 0265.10

`0265.10`'s goal 9 owns a selected model that joins the compact row, the
authoritative detail and the claimed-task answer under one stable selection
identity, with no second claimed-task request or model and with late A
responses unable to overwrite selection B. This leaf needs the same answer for
its title, and there is no ordering edge between the two — both depend on
`0265.2` and `0265.3` and either may land first. The resolution that duplicates
nothing, and the reason no edge is added here: **there is exactly one
selection-scoped claimed-task request and one accepted selected model, and
whichever of the two leaves lands first establishes it while the other extends
it.** If `0265.10` has landed, this header reads the answer already joined into
that model and adds no request. If it has not, this cut establishes the single
selection-scoped request and join in the shape goal 9 describes — staged,
projected, committed whole — and `0265.10` then adds the detail and variant to
that same model rather than forking a second one. A header-private request,
subscription, reducer, cache or model fails this either way. The run reads what
has landed before editing and reports which side of that fork it took.

## Grounded at HEAD 5e33882d6

Nothing this task edits exists yet, and the draft's sentence that the capability
"exists" is false at this HEAD. There is no tracked desktop manifest, lockfile,
gpui source tree, `placeholders` module, desktop recipe in `Justfile` or desktop
CI lane; root `Cargo.toml` excludes only `packages/cdk` and the root lockfile
has no gpui package; `0256.1` is `ready` rather than done; and no `ClaimedTask`
type or claimed-task center request exists in production Rust code, because
`0265.2` is still a plan. Every desktop path, module name, symbol, signature and
command named below is therefore a guess to be replaced by discovery against
what `0256`, `0265.1`, `0265.2` and `0265.3` actually landed — binding them here
would be fabrication. The dependency chain does guarantee those surfaces by
dispatch time: `0265.13` → `0265.3` → `0265.1` → `0256.1` for the desktop
project, tokens, bar and `placeholders` module, and the direct `0265.2` edge for
the task answer. What is checkable from the repository root today, and the only
board coverage this task can honestly declare, is that the workspace stayed
gpui-free, that its per-round gate stayed green, and that `0265.2`'s center-side
claimed-task contract stayed green.

## The command that decides the desktop goals

Every desktop-behaviour goal below is decided by one command, and which command
that is is not a judgement call left to the run. It is **the deciding desktop
command**: the standalone desktop project's documented non-interactive
build-and-test command — the one whose passing from a clean checkout is
`0256.1`'s own Done-when clause, and which `0256.1` obliges itself to document.

That command is present when this leaf dispatches, guaranteed through direct
`depends-on` edges rather than an inherited hope: `0265.13` depends on `0265.3`,
`0265.3` depends on `0265.1`, and `0265.1` depends on `0256.1` directly, while an
open leaf derives `Blocked` whenever any `depends-on` target is not `Done` and a
parent derives `Done` only when every child is closed
(`modules/core/src/task/graph.rs:115-177`). This leaf cannot be dispatched until
`0256.1` is closed; when it is dispatched, the lane is in the tree. No further
edge is added here because that chain is already hard.

Resolving the invocation is mechanical, single-valued and done before any edit:
read root `Cargo.toml`'s exclude list and the top-level directory listing for the
standalone desktop project, then that project's manifest, README, justfile or CI
lane for the command `0256.1` documented; run it unedited to establish a
baseline; record its repo-root-relative path and exact invocation verbatim in the
work summary. Every "Decided by the desktop command" clause below names that one
resolved invocation and decides on its exit code plus the coverage that goal
requires. If the dependency chain reports closed and no such command is present,
that is an unmet prerequisite and this task stops there — it does not substitute
`just test`, stand up a parallel lane, or invent a command.

Writing that invocation's literal text into this file now would be fabrication:
no desktop project, lane or command exists at the HEAD this plan was grounded
against, and `0256.1` itself records that "no pre-existing exact desktop command
exists to use as a board check". It therefore stays a definite reference here, and
becomes a literal — and a declarable `[[checks]]` entry on this task — the moment
`0256.1` lands one.
