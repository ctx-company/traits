7. **The workspace does not learn about gpui, and the inherited contracts stay
   green.** Root Cargo resolution and the root `Cargo.lock` stay gpui-free, the
   desktop project is not a workspace member, the per-round workspace gate stays
   green and unchanged in cost, and `0265.2`'s center-side claimed-task and
   title-delta contract stays green.
   Decided by the three declared checks.
   Excluded: adding the desktop project to root workspace members; adding gpui
   cost to the existing macOS and Linux CI lanes; a grep forbidding the word
