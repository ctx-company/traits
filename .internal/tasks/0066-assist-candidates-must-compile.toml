schema-version = "0.2"
key = "0066"
title = "An assist candidate must compile: produce → build → check, in a bounded loop"
status = "ready"
raised = "2026-08-03"
content = """


Second slice of the authoring-assist arc, now the umbrella for 0066.1–0066.4 (split
2026-08-06 — the behavior is failing live and the scope was too large for one landing).

Every LLM-assisted authoring command is a single unguarded model call today: `handle_generate`
makes one `run_builtin_trait` call, and any decode or build failure short-circuits to
`blocked_assist_candidate` — verdict `blocked`, operator re-runs the whole command by hand.
Observed live 2026-08-06. This is the exact shape the product argues against — the guarded
produce/review loop is our own primitive, and our own authoring commands do not use it.

0065 landed (assist writes CDK source; only `build` writes canonical), so the loop's artifact
is right: rounds iterate on source, not canonical TOML.

## The split

- 0066.1 — the guarded loop for `generate`: rounds, rung ladder, scratch candidate,
  write-once, preserve-on-failure, the non-degenerate exit criterion.
- 0066.2 — round evidence in the candidate envelope and per-round CLI progress.
- 0066.3 — `refine --apply` and `import --llm-assisted` join the same loop.
- 0066.4 — assist inherits the run bounds, proven: a hung round dies with its bound named.

"""
scope = """
## Decisions (the shared contract; children cite these, they do not re-decide them)

- **A failed build is a ROUND, not a verdict.** Failure is reported only once the bound is
  spent.
- **The loop is declared in the meta-trait, not in Rust.** These are traits; they get a
  guarded produce/review loop like any other. No bespoke retry logic in `generate.rs`.
- **Feedback is typed, never scraped.** `cdk_build`'s structured authoring diagnostics
  (`severity`/`code`/`fieldPath`/`message`) are the next round's input. Nobody re-reads
  stderr.
- **The rung ladder is build → synth/normalize → `check` → audit,** and a round's evidence
  names which rung failed. "It failed" is not a diagnosis; "it failed at check, section X" is.
- **`critique` is NOT in the loop.** Advisory, unbounded in taste; the loop's exit criterion
  is mechanical: it builds, it normalizes, it checks clean.
- **Convergence is not degeneracy.** A source file that compiles because the model deleted
  the procedure must fail; `refine` preserves trait identity.
- **Nothing mutates the package until the loop converges.** Rounds run against a scratch
  candidate; a converged candidate is written once, through the safe writer, then locked.
- **A non-converged run writes no package but does not throw the work away** — it names the
  last failing rung and preserves the last candidate source at a stated path.
- **`--check` means converge and write nothing. `--candidate <file>` stays single-shot** —
  zero model calls, one round evaluated, gate tests stay cheap.

"""
validation = """
## Watch

- **This is the dogfood argument.** The guarded-change loop the launch material sells should
  be visibly the same mechanism running inside `ctx traits generate`. If implementing it
  needs a concept the loop primitive cannot express, that is a finding about the primitive —
  write it down, do not work around it in Rust.
- Umbrella-level ordering: 0066.1 first; 0066.2–0066.4 each stand on it and land
  independently.

## Done when

All four children are done: `generate`, `import --llm-assisted` and `refine --apply` retry
on their own typed diagnostics within a declared bound; a non-converging run writes no
package, names the failing rung and preserves its last candidate source; a degenerate
candidate fails; `--candidate` still evaluates exactly one round with no provider call;
round evidence is visible in the candidate envelope with per-round progress in the CLI; and
a hung round is killed by the command bound with the bound named.
"""

[relations]
depends-on = ["0065"]
