schema-version = "0.2"
key = "0244"
title = "The ALL-repos scan evicts its own cache"
status = "ready"
raised = "2026-08-24"
content = """
`run_inventory_from_paths` (modules/io/src/run_session.rs) opens with

    cache.entries.retain(|path, _| present.contains(path));

which keeps only the paths in THIS call. Correct for a single-store scan.
The machine-wide scan calls it once per repo with a SHARED cache, so each
repo's pass evicts every other repo's entries, and the current-repo rescan
that follows re-parses everything. Net effect in ALL-repos dashboard mode:
the full ledger set re-parsed every 2-second tick, cache hit rate ~0%.
Single-repo mode is unaffected.

Scope the eviction to the roots actually scanned — retain entries whose path
is outside the scanned root set, evict only within it. Near one line plus a
parameter.

Independent of 0243 (which removes the preview's dependence on this scan but
not the scan itself) and worth doing even if 0246's daemon later owns the
index, because the dashboard ticks against this cache until the readers move
(0247).
"""
validation = """
## Done when

A machine-wide inventory pass over multiple repo stores, ticked twice with a
shared cache, parses each unchanged ledger at most once across both ticks —
proven with scratch stores for two fake repos and a counting reader, not by
timing. The single-store path behaves exactly as before: entries for ledgers
deleted from the scanned root are still evicted.
"""

