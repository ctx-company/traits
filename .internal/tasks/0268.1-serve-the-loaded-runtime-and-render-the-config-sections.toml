content = '''
Teach the center to answer one repository's loaded runtime as this screen's leaf set, and render the Config screen's three sections from that answer. One cut, because the rendering is what proves the capability and the capability is what makes the rendering honest.

The gap is narrower than "nothing reaches this". `handle_doctor_config` (`modules/cli/src/app/doctor.rs:114-151`) already reports effective runtime configuration with each knob's winning layer and reason over `harness_config::resolve_config_report` (`modules/io/src/harness_config.rs:3903`), and `modules/io/src/trust.rs` already holds the trust-store read. What no face reaches is this screen's shape as one answer: the configured seats with their model selector and effort side by side, the harness/center/store runtime rows, and the approved-traits row with its distinct-digest count — repository-scoped, with the documents actually read, one verdict and one captured instant carried alongside. `ConfigDoctorValue` is CLI-private (`doctor.rs:108`), so a desktop-side document parse, layer walk or trust read would be the capability-in-one-face defect even over identical bytes. This cut extracts a compact shared view at the IO boundary, gives resolution an explicit repository scope, extends the center protocol with a typed config capability, and renders the `Agents` / `Runtime` / `Trust` sections from the served answer. Moving `ctx doctor --config` onto the same resolution is `0268.4`, inside this same charter.

`0268`'s outcome invariants bind this leaf and are not narrowed here. Seven grounded corrections the draft this file replaces did not carry.

**A missing runtime document is absence, not failure, and the draft's fail-loud-on-missing rule was unsatisfiable.** `resolve_config_report` skips layer paths that do not exist and resolves built-in defaults (`harness_config.rs:3903-3913`), and `proof_config::doctor_reports_effective_defaults_and_rejects_conflicting_path` creates a scratch Git repository with no runtime file and requires `ctx traits doctor --config` to succeed (`modules/cli/tests/proof_config.rs:18-40`). A run obeying the draft literally would have had to red a standing public proof to close. Absence resolves, is stated as the built-in-default origin, and never renders text claiming a file was loaded. Malformation, refusal, staleness and never-built generated output are the loud failures: TOML decode failure (`harness_config.rs:5011-5021`), a `[repo.*]` or `[preferences]` block outside the global tier (`:3917-3931`), `runtime.ts` beside hand TOML at one tier, and stale or never-built generated output (`modules/io/src/runtime_source.rs:21-55`; proven at `proof_runtime_ts.rs:81-128`).

**A retired `model-tier` declaration is a warning at this HEAD, not a typed error, and this leaf does not silently change that.** `resolve_config_report` pushes `retired model-tier declaration in {path}` onto `ConfigReport.tier_warnings` and resolution continues (`harness_config.rs:3907,3915,4107`; field at `:1437`). The parent's Correction 1 lists a retired tier declaration among the fail-loud cases while its Done-when 5 requires every landed `ctx doctor --config` answer to stay unchanged; those two are not simultaneously established by current code. This cut carries the warning through the served view as a warning, so the screen can show it without inventing a failure, and states the divergence in the work summary. Promoting it to a typed error is a change to a shipped CLI answer and belongs to an owner decision, not to this leaf.

**Passing an absolute `start_dir` does not make resolution repository-scoped.** `runtime_config_layers` makes `start_dir` absolute but bounds the ancestor walk with `repository::discover_repo_root()`, which runs Git at the process cwd (`harness_config.rs:5079-5111`; `modules/io/src/repository.rs:17`), and personal `[repo."<key>"]` qualification independently goes through `resolve_run_repo_key`, which reads `std::env::current_dir()` (`harness_config.rs:3168-3183`). A center serving from its own cwd therefore answers about the wrong repository while the face believes it asked about a selected one. Worse, `resolve_runtime_assignments` calls `resolve_config_report(Utf8Path::new("."))` internally (`harness_config.rs:2912-2945`), so naively composing the two public entry points both re-resolves and re-reaches for cwd. The explicit-scope entry point is additive: `handle_doctor_config` keeps passing `.` and its answers do not move.

**`smart / worker / scribe` is not the seat schema, and the expansion helper cannot be counted directly.** Those are trait role ids authored in this repository; `screens/config.md:20` lists them as illustration. `RuntimeConfig.agent.role` is an arbitrary role map, the standing seats are `default`, `narrator`, `guide`, `merger` and `merger-deep` (`harness_config.rs:1842-1885`), and `configured_seats_for_role` (`:2629-2664`) is the enumeration that stays clear of the model-catalog resolution its sibling `resolved_seats_for_role` performs (`:2727-2743`). `expand_role_seats` retains the base role alongside the expanded `<role>-1..N` aliases (`:6368-6397`), so counting its output double-counts; and winners for list entries are keyed `agent.role.<role>.<1-based-seat>.<field>` while count-expanded seats inherit the single table's winner (`record_assignment_winners`, `:6171-6211`). The seat-to-winner mapping is a deliberate decision of this cut, not a by-product.

**The approved-traits row is an inventory/trust join and the inventory half is CLI-private, while `0267` has not landed.** `ResolvedTraitEntry`, `TraitInventoryRow` and `resolve_trait_inventory` live in `modules/cli/src/app/lifecycle_reporting.rs:1515-1740` over the `run::load_trait` decode/digest chokepoint (`modules/io/src/run.rs:3754-3816`), and `InventoryContext` has only the cwd-derived `discover()` constructor (`modules/io/src/inventory.rs:72-81`). There is no served trait/trust answer to reuse at this HEAD, so this cut extracts the minimum shared derivation it renders through — visible member identity and current digest, scoped explicitly — and nothing wider. It also does not inherit HEAD's read count: `lifecycle::resolve_named` reads the trust store per member (`modules/io/src/lifecycle.rs:108`) and `build_trust_rows` reads it again (`modules/cli/src/app/dashboard.rs:2621-2624`), which is N+1 reads; one `trust::Document` per answer is an improvement, not a preserved property. `read_store` is the right primitive (`trust.rs:501-524`); `read_store_with_sequences` may write legacy sequence evidence back (`:529-535`) and is forbidden on a read-only capability.

**Family variants do not have their own ids at this HEAD, so member identity must be carried explicitly.** The parent's Correction 8 says each variant is its own visible member with its own id; current core stores one base `Trait.id` with a separate `variant` (`modules/core/src/trait/mod.rs:365`) and `export_name` exists precisely because variants share the base id, and the CLI inventory keeps `id` and `variant` apart the same way. The binding outcome — variants never collapse into one member — is reachable only by keying visible identity on member identity including the variant, not on `trait_id` alone. Likewise `Document::record_for_current` alone cannot decide membership: it falls through to `exact_record` (`trust.rs:78-129`), which admits raw digest-only evidence the parent excludes, so the join is decided against `classify_records`' current/stale/orphaned/superseded classification with `runtime-example:` records filtered (`trust.rs:227-307`).

**The check this file declared is the wrong evidence.** `proof_doctor`'s only `--config` test asserts a flag conflict (`modules/cli/tests/proof_doctor.rs:255-273`); it covers no config semantics. `modules/cli/tests/proof_config.rs` is the standing suite for layering, provenance, seat expansion and defaults, `proof_runtime_ts.rs` for the generated-document path, and `proof_center.rs` for the process boundary. The declared checks below are corrected accordingly.
'''
scope = '''
## Goals and approach are separate

Everything in this section, including the `## Done when` list at the end of it, is a GOAL: binding, observable, and — where a command in this repository can decide it — decided by that command. Everything under `## Approach` in the validation section is APPROACH: expected files, symbols, signatures, edit order, commands and proof mechanics, stated precisely because the grounding supports them, and never a boundary. Deviate from any of it wherever a goal requires it and record the deviation in the work summary; a deviation is not a violation and needs no escalation. Proof mechanics are named only where the grounding shows them already occurring — what must be proven is stated, which fixture or matcher observes it is the run's call.

## Decisions

- **In scope**: one shared, repository-scoped config view assembled at the IO boundary from the existing resolution — the configured seats with their model selector and optional effort, the harness/center/store runtime rows, the approved-traits join, the physical document set in layer order, the verdict, one captured instant and per-value winners; the explicit-scope entry point that resolution needs; the typed center protocol extension serving it with event-driven freshness; the desktop's `Config` menu entry and switch; and the `Agents` / `Runtime` / `Trust` sections of dotless config rows rendered from the served answer.

- **`0268`'s corrections bind.** Correction 1 (absence versus malformation, the served document set, the one captured instant), 2 (explicit scope), 3 (seats), 4 (row descriptions are derived facts), 5 (model and effort are separate winners, the configured selector, no catalog probe), 7 (the three runtime-row definitions and probe placement), 8 (the approved join), 9 (the typed protocol and where the work runs) and 10 (one resolution, no second parser) govern this leaf; where this file restates one it does not narrow it.

- **This leaf serves more than it renders.** `0268.2`'s bar, `0268.3`'s `source` leaf and `0268.4`'s CLI half consume the document set, the verdict, the single instant and the per-value winners from this same answer. They are carried here even though nothing this cut renders shows them; recomputing them later is the defect this ordering exists to prevent.

- **The desktop parses no runtime document, resolves no layers, reads no trust store or inventory and runs no `git`.** It asks the center over the socket the window already holds, and it imports no CLI-private type. Where the semantics it needs live in `ctx-traits-cli`, they are extracted and shared; a copy in gpui is a defect even when it compiles.

- **Existing faces do not move.** `ctx doctor --config`'s text and JSON answers, its cwd-relative call and its warning behaviour are unchanged by this cut; the explicit-scope path is additive beside them.

- **Read-only.** Nothing writes a runtime document, mutates trust, acquires a lock or rewrites a stamp; `--migrate-config` and `--apply` are untouched.

- **No leaf in these three sections is a placeholder.** The screen's only three placeholder leaves — header phrasing, the `edit runtime.toml` action, the preview seat prose — all belong to siblings.

- **Out of scope**: the header and provenance bottom bar (`0268.2`), the selected-seat preview and its `used by`/`source` blocks (`0268.3`), the CLI half answering from this resolution (`0268.4`), any configuration-editing surface, the light theme, pencil work of any kind, and every shared primitive `0265` already built.

## Prerequisites

`0265.5` — the row and list vocabulary these rows compose, which chains back through `0265.3` to `0265.1` and the whole of item `0256`. `0265.9` — the title bar whose menu this screen's entry joins. `0258` — the source places the four new screens after its work item. A charter's `depends-on` is not inherited by its children (`derived_status` evaluates dependencies only for open leaves, `modules/core/src/task/graph.rs:115-177`), so all three are named on this leaf and reach the rest of the family through child-to-child edges. None of that chain has landed at the time this file was written: bind to the desktop project, the row vocabulary and the non-interactive command those tasks actually landed, never to a path, component name or signature guessed here.

## Done when

1. **One repository-scoped resolution produces one answer.** The request carries exactly one scope input — a required absolute filesystem path naming the selected checkout — and carries no second scope field: no key, no key-and-path pair, no optional field a caller may omit, so two scope inputs can never disagree. The answering side turns that input into exactly one canonical repository root before any resolution begins: the Git toplevel containing the given path, canonicalized, and that root alone is threaded onward. Every downstream step consumes that one root — the layer walk's ancestor bound, the inventory root, the trust join and the rendered repository identity — and the personal `[repo."<key>"]` qualifier key is derived from it by the same main-checkout derivation the existing qualifier path uses, never accepted from the wire and never recomputed from a cwd. An input that is relative, empty, non-existent, not valid UTF-8, or not inside a Git worktree is a typed, renderable refusal rather than a fall back to the center's or the desktop's cwd and rather than a degrade to built-in defaults, so no cwd read remains on the answer path; and the answer resolves for a repository that has no run row. One assembly per answer produces the rows, the physical document set in layer order, the verdict, the tier warnings and exactly one captured completion instant together, loading the trust document exactly once — a stated improvement over HEAD's N+1 trust reads, not a preserved property — and per-value winners keep their layer, source and reason with model and effort independent. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config` and `just test`, plus the diff read for a second resolution, a second document or trust reader, or a residual cwd read.

2. **The Agents section renders the seats the resolution carries.** One row per physical configured seat with its seat identity visible, in a deterministic order, including every seat of a list- or count-backed role and never a hardcoded three; a repository with no configured role renders the section's data-derived empty form rather than a fabricated row. The value beside a seat is the configured model selector, never a catalog- or dispatch-resolved model, and no model-catalog probe runs on any answer path; a missing reasoning effort renders as absent rather than as a plausible word; each rendered value carries its own winner, so a built-in default and a document-stated value stay distinguishable. Where a seat resolves differently under a trait or variant qualifier, the row does not present one resolution as universal. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config` and `just test` over scratch runtime layers covering an absent role, a single-table role, a list-backed role, a count-backed role, an absent effort and layers where model and effort win differently.

3. **The Runtime section's three rows have the definitions the parent fixes.** `harness` is the distinct harness ids selected by the effective assignments of exactly the seats the Agents section renders, in those seats' rendered order, each reported once, with the qualifier carrying the assignment scope for one id or how many rendered seats stand behind each when they differ, and the section's data-derived empty form when no seat is rendered; no harness that no rendered seat selects appears. `center` is the package version of the process that produced the answer — that process's own `CARGO_PKG_VERSION`, not a version the desktop was built against — reported over exactly the socket path that same process bound its listener to: the `socket` field of the live `CenterPaths` tuple it is serving on (`center.rs:546-586`), which is `production_paths`' version-scoped `/tmp/ctx-<uid>-<version>.sock` in production and the configured `CTX_CENTER_SOCKET` value when the process was started with a complete private tuple. The row reports that bound path verbatim in both cases; it is never recomputed by calling `production_paths` at answer time, because under a private tuple that would name a socket no client is connected to. Both leaves are produced by the answering process rather than guessed desktop-side. `store` is the path `state::global_trait_root()` returns, verbatim, with the qualifier naming that authority. No harness version probe — which executes a binary — runs inside the center's request handling, on gpui's UI thread or on the selection hot path; a row that cannot cheaply obtain a version reports the configured engine identity and says that is what it is rather than blocking or omitting the leaf. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for a probe or subprocess on the request, UI or selection path.

4. **The Trust row is the defined join, not a vector length.** A trait is approved when it is a visible member of the repository-scoped inventory and the one loaded trust document holds identity-bound verified evidence for exactly that member's current digest; blocked evidence for the current pair excludes it, and stale, superseded, orphaned, raw digest-only and `runtime-example:` records confer no membership. Membership is keyed on visible member identity including the variant, so family variants never collapse into one member, and duplicate approvals of one pair count once. The row's description is those members' names in the inventory's deterministic order, and its value is the number of distinct current digest values carried by the approved members — never the count of approval events and never `Document.digests.len()`. A missing trust store is an empty document and therefore the row's data-derived empty form with zero digests and no failure; a malformed store or invalid sequence evidence fails the answer loudly. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` and `just test` over scratch inventories and scratch trust stores covering verified, blocked, stale, superseded, orphaned, raw, duplicate, runtime-example, family-variant, missing-store and malformed-store cases.

5. **Absence, malformation and refusal are three outcomes and each renders honestly.** A repository with no physical document at any layer resolves to built-in defaults, and the served answer names that origin rather than claiming a file was loaded. A hand document that fails to decode, a `[repo.*]` or `[preferences]` block outside the global tier, `runtime.ts` beside hand TOML at one tier, never-built or stale generated output, an unusable repository scope, and a malformed trust store each fail the whole answer loudly with a typed failure, never as an empty-but-valid-looking result and never as a partial answer combining old rows with a new verdict and instant. A retired `model-tier` declaration keeps HEAD's warning semantics and is carried as a warning rather than newly promoted to a failure, with the divergence from the parent's Correction 1 wording reported in the work summary. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_runtime_ts`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_config`, `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center` and `just test` over scratch documents only.

6. **The wire capability is compact, typed, event-driven and off the model owner.** The config request, its result and its freshness event are typed protocol additions at the existing client boundary carrying compact IO-owned values — not `RuntimeConfig`, not `ConfigReport`, not a CLI-private doctor type, and not fields bolted onto a run row — and lines stay inside the 1 MiB bound. Blocking work — document resolution, Git discovery, inventory, trust reads — runs in the connection worker after bounded owner-side scope resolution, never inside the sole model/SQLite owner's request handling and never on the periodic scan's own work. Freshness reaches clients as stream events with no timer on any client and no filesystem-watcher dependency; because trust is machine-global while runtime resolution is repository-scoped, one trust change can invalidate several subscribed repositories, so invalidation is not attached to a single run row. Snapshot transactionality is inherited: a candidate answer is staged and committed whole or rejected whole, a rejected refresh never combines old rows with a new verdict and instant, and a last accepted answer stays visible only behind an explicit stale or outage marker with no desktop-side fallback reader. `ctx-traits-io` still depends only on `ctx-traits-core` and its existing third-party set. Decided by `CARGO_TARGET_DIR=target cargo test -p ctx-traits-cli --test proof_center`, `just test`, and the diff read for a client timer, a new io dependency or an owner-path read.

7. **The `Config` pane renders the menu entry and the three sections from the served answer.** The title-bar menu gains a `Config` entry — text-only sans 12.5 with the current entry bright, no chip or icon — and its switch reaches a pane that is not empty. The pane renders the `Agents` / `Runtime` / `Trust` sections with mono 11 `text-muted` headings, section gap 12, rows gap 4, row padding `[8,12]`, internal stacks gap 2, inside main-pane padding `[18,40,20,40]` gap 28. Every row is dotless — grammar rule 4 admits 5px dots for frames, tasks, merges and rail repositories only — with a left stack of the name in sans 12.5 over its description in sans 11 `text-secondary`, and an end-aligned right stack in mono 10.5 carrying the value in `text-secondary` over its qualifier in `text-muted`. Selection is `surface-raised` fill with a `text-bright` title and nothing else — no border, radius, accent bar, pill, icon or dot — and exactly one title is bright per list. Fonts are the IBM Plex faces `0265.1` resolved, with no silent system fallback. Every leaf is served and every row description is a fact the answer carries about that row's own subject: no export literal — `smart`, `worker`, `scribe`, `opencode 0.4.2`, `ctx-company/traits`, `~/.config/ctx/traits`, `nightly · local`, `5 digests`, `13:02`, the example descriptions — is hardcoded, and no prose is borrowed from a trait's `Agent.description` and presented as a runtime fact. No repo-root command inspects a rendered gpui screen today, so this goal declares no board check and none may be invented; it is decided by the bounded review in `validation`, run against `screens/config.md`, `grammar.md` and the dark column of `tokens.md` leaf by leaf and naming for each leaf the served source it renders from, together with `just test` proving the shared code those leaves render through. Once `0256.1`'s non-interactive desktop command exists, run it as additional proof and, if it is repo-root-relative and carries its verdict in its exit code, declare it here.

8. **The workspace is unmoved.** Root Cargo resolution, the root `Cargo.lock` and the existing gates stay gpui-free and the desktop project stays outside the workspace. Decided by `just test` and the declared metadata/lockfile check.

Exclusions, restated so they are checkable by reading the diff: no second `runtime.toml` parser, layer resolution, inventory scan or trust reader is created; no copy of the doctor assembly enters the center and no CLI-private type is imported by the desktop; `ctx doctor --config`'s existing answers are unchanged; no write path, `--apply`, `--migrate-config` change, trust mutation, lock acquisition or `read_store_with_sequences` call appears; no light-theme value is touched; no pencil artifact is edited; no placeholder leaf is introduced in these three sections; and no work belonging to `0268.2`, `0268.3`, `0268.4`, `0266`, `0267`, `0269` or `0261` is done here.
