validation = '''
## Approach

Suggested route, not a boundary. Every symbol is named because the grounding supports it; take a different one wherever a goal requires it and say so in the work summary.

**Reuse points, named.** `resolve_config_report` (`harness_config.rs:3903-4109`) is the one resolver — it gathers documents once, merges project and machine portions, applies repo qualifiers and environment overrides, validates, merges built-in harness definitions at one choke point and records built-in winners — and `ConfigLayer`/`ConfigReason`/`ConfigContributor`/`ConfigWinner` (`:1378-1412`) are the provenance model; `ConfigReport` (`:1434-1442`) carries no document list, verdict or timestamp and is not a wire type. `runtime_config_layers` (`:5079-5171`) is the layer order and the place the physical document set is captured, since documents vanish from the report after resolution. `repository::discover_repo_root_at` (`repository.rs:102`), `discover_main_repo_root` (`:132`), `state::canonical_repo_root`/`repo_key` (`state.rs:130,153`) and `state::read_repo_index` (`state.rs:555`) are the existing scope primitives, against the two cwd reaches at `harness_config.rs:5102-5111` and `:3168-3183`; `CenterPublicRow.repo_key`/`repo_path` (`center.rs:3778-3788`) is authoritative for repositories that do have a run row. `configured_seats_for_role` (`:2629-2664`) is seat enumeration without catalog resolution — not `resolved_seats_for_role` (`:2727-2743`) — with `expand_role_seats` (`:6368-6397`) as evidence of alias shape rather than a count, and `record_assignment_winners` (`:6171-6211`) as the winner-key mapping. `resolve_runtime_assignments`/`resolve_trait_runtime_assignments` and `ResolvedRuntimeAssignments.qualifier_by_role` (`:2406-2420,2912-2945`) supply effective assignment and qualifier scope, but note `resolve_runtime_assignments` re-resolves from `.` internally, so the shared assembly should derive assignments from the report it already holds rather than calling it after one. `detect_builtin_harnesses` (`:8062`) and `probe_harness_version` (`:7682`) execute binaries and are the calls to keep off every hot path. `state::global_trait_root` (`state.rs:334`) is the store row's only authority. `trust::read_store` (`trust.rs:501-524`) and `classify_records` (`:227-307`) are the trust authority — never `read_store_with_sequences` (`:529-535`), and never `record_for_current` alone, whose `exact_record` fallthrough (`:78-129`) admits the raw evidence the join excludes. `InventoryContext`'s `Tier` order, `candidate_ids` and `resolve_tiers` (`inventory.rs:34-207`) are the one discovery authority and `run::load_trait` (`run.rs:3754-3816`) the decode/digest chokepoint beneath the CLI-private assembly at `lifecycle_reporting.rs:1515-1740`. On the center side: `MAX_LINE_BYTES`, `STREAM_TIMEOUT` and `ACTION_TIMEOUT` (`center.rs:51-53`), the typed client wrappers (`:904-1003`), the `Start`/`Control` dispatch shape that recognizes a request in the connection worker before it becomes a `ModelCommand::Request` (`:3116-3348`) against `handle_request` (`:3607`), the bounded snapshot/delta stream with lagging-subscriber eviction (`:2336-2485`) and the existing two-second periodic scan (`:65,2822-3038`). The TUI reducer's transaction boundary — stage, project the complete candidate, commit only on success, drop and reconnect on rejection, keep last-accepted behind an explicit stale marker (`modules/cli/src/app/dashboard/worker.rs:254-415`) — is the client precedent the desktop reducer follows.

**Edit order.**

1. **Explicit repository scope in `harness_config`** — an entry point beside `resolve_config_report` taking a resolved repository root, threading that one value through the ancestor bound at `:5102-5111` and the repo-qualifier key at `:3168-3183` so neither reads cwd, with a typed refusal for an unknown, empty, relative or unusable scope. The existing cwd-relative call and its answers stay exactly as they are.
2. **The compact shared config view at the IO boundary** — assembled from one report: the physical document set in layer order, the verdict, the tier warnings, one instant captured on the serving side, the seat rows with independent model and effort winners, the three runtime rows, and the approved join. Consumed by the center now and by `0268.4`'s CLI half later; extracted at the IO boundary rather than copied into either, and no `ConfigDoctorValue` import.
3. **The minimal shared inventory/trust join** — an explicit-root path into `InventoryContext` beside `discover()`, enough member identity (id plus variant) and current digest for the approved set, and one `trust::Document` threaded through it. Only as wide as this cut renders through; if `0267`'s served answer has landed by then, that is the reuse point instead and the extraction shrinks accordingly.
4. **`modules/io/src/center.rs`** — the typed `Request` arm carrying the explicit scope, the `ResponseResult` arm carrying the compact answer, the freshness event with its repository/global fan-out, the early-return dispatch branch beside `Start`/`Control`, a cheap config/trust fingerprint riding the existing scan cadence, and the public client wrapper on the action timeout rather than the 2s stream timeout, since this walks directories and reads Git.
5. **The desktop pane** — the `Config` menu entry and switch in the landed title bar, a reducer over the served answer with the TUI reducer's transaction posture, and the three sections composed from whatever row vocabulary `0265.5` actually landed, in the tokens `screens/config.md:14-24` and `tokens.md:71-85` name.

**What must be proven** (observations, not mechanics): over scratch repositories, scratch runtime layers, isolated `HOME`/config roots and scratch trust stores only — no runtime document at any layer; a malformed hand document; a non-global `[repo.*]` block; stale and never-built generated output; source beside hand TOML; several layers where model and effort win differently; an absent role, a single-table role, a list-backed role and a count-backed role; an absent reasoning effort; a seat resolving differently under a trait or variant qualifier; rendered seats selecting one harness and several; a harness whose version cannot be cheaply obtained; a missing and a malformed trust store; blocked, stale, superseded, orphaned, raw, duplicate and family-variant trust records; an unknown, empty, relative and unusable repository scope; a repository with no run row; a config change and a global trust change each arriving as freshness events; a rejected projection leaving the last accepted answer behind an explicit marker; and center outage and recovery. `proof_config.rs` is the standing config-semantics suite (`:18-40,95-414,417-554,818-859`), `proof_runtime_ts.rs` the generated-document suite (`:50-153`), and `proof_center.rs` the process-boundary suite that already covers bounded streams, multiple subscribers, snapshot ordering, eviction, periodic repair and restart.

## Watch

- **Absence is not malformation.** A repository with no document resolves and says so; the standing proof at `proof_config.rs:18-40` reds if that is turned into a failure.
- **Do not assert the retired-tier case already fails.** It is a `tier_warnings` entry today (`harness_config.rs:3915`); carry it as a warning and report the divergence rather than silently changing a shipped answer.
- **An absolute `start_dir` is not a scope.** Two independent cwd reaches remain (`harness_config.rs:5102-5111`, `:3168-3183`), and `resolve_runtime_assignments` re-resolves from `.`; composing the public entry points naively both duplicates resolution and keeps the cwd dependency.
