schema-version = "0.2"
key = "0284.1"
title = "Notify and commit become typed runtime effects, not ctx-notify / git shell steps"
status = "draft"
raised = "2026-09-07"
content = """
DRAFT — to be run through architect. Follow-on to the step-walk (0283); drafted
as 0283.1 while 0283 was open, re-homed under 0284 now that 0283 is done.

The step-walk removed the worst of the procedure's shell — the proof `sh -c`,
the brief and proof-command projections, the changed-files capture. What
remains are the notify chain (`ctx-notify begin/update/log/finish`) and the git
commit steps (progress commit + task branch). Both are still the trait
stitching shell commands, which is the thing that makes traits look like shell
scripting around the API.

This lifts them into first-class typed runtime EFFECTS: the trait declares
intent ("notify the owner of this state", "commit this progress") and core
executes it, reading the verdict/step-list/stage state directly — no argv, no
ctx-notify, no `git` step in the procedure.

## GOALS, binding

1. **Notification is a typed effect.** The trait declares a notification intent
   bound to the run's state; core emits it. No `ctx-notify` argv steps, no
   scribe digest projected into text slots for a command line.
   Excluded: any `ctx-notify` invocation in the generated canonical.

2. **Commit is a typed effect.** The trait declares that progress commits (and
   the task branch moves); core performs it. No `git add`/`git commit`/`git
   status` steps in the procedure.
   Excluded: any `git` argv step in the generated canonical's mechanics.

3. **The procedure carries no shell in its own mechanics.** After this, the
   only shell anywhere near a run is a seat running a genuine external tool
   inside its own judgment (e.g. the reviewer running a build to validate) —
   never a step the procedure emits.
"""
scope = """
## Decisions

- Design the effect mechanism once in core/cdk, generically; adopt in
  implement, do not spread until proven here.
- Open question for the design pass: whether an "effect" is a new sequence item
  kind the runtime executes, or a capability the runtime resolves from a
  declared intent on a slot. Settle before building.
- Restores per-stage-semantic commit (the step-walk's v1 commits progress
  whenever the tree is dirty); the commit effect can be stage-aware.
"""
validation = """
## Done when

- The implement generated canonicals carry no `ctx-notify` and no `git` argv;
  notify and commit are declared as typed effects and executed by core.
- A live run still notifies the owner and commits progress as before, with the
  procedure itself free of shell.
"""

[relations]
parent = "0284"
depends-on = ["0283"]
