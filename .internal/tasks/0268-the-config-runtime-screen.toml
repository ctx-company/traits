- The desktop project `0256.1` establishes — its path, manifest, lockfile and non-interactive command are that task's to name, and children bind to what actually landed rather than to a guess made here. Likewise the vocabulary `0265` extracted: rows, headers, bars, rail, title menu, key/value rows, preview footers, overflow, and the one `placeholders` module.

### Named reuse points

Prefer these over new derivations; where one is CLI-private, extract rather than copy.

- `harness_config::resolve_config_report` and its `ConfigReport`/`ConfigWinner`/`ConfigLayer`/`ConfigReason` provenance (`harness_config.rs:1378-1412`, `3902`) — the one resolver.
