After the last child lands, and before this charter is called done, one review pass against the artifacts rather than against memory:

- Walk `screens/config.md` leaf by leaf — menu entry and switch, the repository-qualified title, the one italic summary with its derived counts, each section's rows with their name/description/value/qualifier stacks, the bar's verdict, cited provenance and action, and the preview's `seat` and `facts` blocks with the footer — naming for each `data:` leaf the center-served source it renders from, and confirming that the header phrasing, the `edit runtime.toml` action and the seat prose are the only three leaves coming from the shared `placeholders` module.
