title = "The Config (Runtime) screen"
status = "ready"
raised = "2026-08-29"
content = '''
The visual charter (`.internal/docs/gpui-desktop-face-design.md`, 2026-08-28) adds four v1 screens after the plan document's item 3, and Config is one of them. It has no board representation: `0256`-`0260` are a one-to-one image of the plan document's items 1-5 and none of them renders runtime configuration. This charter is that screen — the `Agents` / `Runtime` / `Trust` sections, the `runtime.toml` provenance bar, and the selected-seat preview — built per `.internal/docs/design/screens/config.md` on the vocabulary `0265` extracted while rendering Sessions.

The screen is small and its forms are fully specified. The main pane is a header titled after the repository with a counts-from-data italic summary in placeholder phrasing, three sections of **dotless config rows** (config is settings, not state, so grammar rule 4's dots do not apply at all), and a bottom bar whose left half is an earned verdict plus provenance and whose right half is an `edit runtime.toml` action the spec tags a v1 placeholder. The 380-wide preview is a `seat` block, a `facts` key/value block and a footer citing the same provenance the bar cites. The committed reference export carries literal pixel values, hex colours and font declarations, so no pencil access is needed.

This is the sharpest parity case of the four, and the honest statement is narrower than "no face reaches this". The dashboard has no Config screen — its fifth screen is `Screen::Trust` — and `handle_doctor_config` (`modules/cli/src/app/doctor.rs:113-151`) already reports effective runtime configuration with each knob's winning layer and reason over `ctx_traits_io::harness_config::resolve_config_report`, while `modules/io/src/trust.rs` already holds the trust-store read. What no face reaches is this screen's leaf set as one shape: configured seats with model and effort side by side, the harness/center/store runtime rows, the approved-traits row with its digest count, and a definite verdict and load time about the documents actually loaded. The stop condition none of the children owns alone is that the center serves that shape, repository-scoped, and the existing read-only CLI surface answers from the same resolution — so nothing here ships GUI-first.

## How to read this plan

Goals and approach are separated, and only goals bind. `validation`'s Done-when list, together with the binding constraints and exclusions at the top of `scope`, is the contract; the corrections below bind only through the outcome invariant each one states.

The separation is plan-wide, not confined to the section titled "Suggested approach". Everywhere in this file — inside the corrections, the expected surfaces, the named reuse points, the item order, the closing review route — a named file, symbol, signature, call site, mechanism, command or proof mechanic is the architect's best guidance from the grounding at HEAD `1f38b11d3`, never a boundary. Where the grounding names a route precisely, it is stated precisely so a child does not have to rediscover it; stating it precisely does not make it binding. A child that reaches a binding outcome by different files, different symbols, a different edit order, different commands or different proof mechanics is correct, and reports the deviation in its work summary. That report is neither a violation nor an owner escalation.

Proof mechanics are named only where the grounding shows them already occurring. What must be proven is stated; which fixture, matcher or literal output observes it is the run's call.

This charter lands no code of its own. Its work is the four children and the parent-level review that follows the last of them. A fifth implementation cut written against this file, instead of against the child that owns the leaf, is the failure mode to avoid.

## Grounded against HEAD 1f38b11d3

The corrections below are the places where reading the design artifacts or the existing code naively produces a wrong screen, a dishonest leaf, or an unbuildable child. Each one has two layers, and only the first binds:

- **The outcome invariant** — what must be true of the finished screen or the landed code. Every child inherits these. A child that silently guesses through an invariant has failed even where its own Done-when reads green.
- **The route** — the files, symbols, call sites and cheapest-known implementations named alongside it. These are guidance carried where the evidence for them sits, so a child inherits the reading rather than repeating it. They do not bind.

A note before them, matching what `0265`, `0266` and `0267` record for their own families: all four children still store `status = "draft"`, and `TaskStatus` is the closed stored set `ready|done|cancelled` (`modules/core/src/task/mod.rs:27-31`), so none of those four documents loads on the board at this HEAD. `0266` owns making `draft` representable; **this charter does not depend on `0266` and must not assume that support has landed.** Activating the children — whether by `0266` landing first or by each document being set to a storable status when it is dispatched — is board bookkeeping outside this charter's code scope, and no test may assert on this repository's own board, its own trait set or its own `.ctx/traits/runtime.toml`.

### Correction 1 — a missing runtime document is absence, not malformation, and the draft's fail-loud rule was unsatisfiable

The file this replaces required a **missing** runtime document to fail loudly on every face, while `0268.4` simultaneously required every landed `ctx doctor --config` answer to stay unchanged. Both cannot hold. `resolve_config_report` skips layer paths that do not exist (`modules/io/src/harness_config.rs:3902-3913`), zero-config resolution to built-in defaults is intentional, and the public proof `doctor_reports_effective_defaults_and_rejects_conflicting_path` creates a scratch Git repository with no runtime file and requires `ctx traits doctor --config` to succeed reporting built-in defaults (`modules/cli/tests/proof_config.rs:18-40`). A child obeying the draft literally would have had to red that proof to close.

The invariants, which separate the two failures the draft conflated:

- **Absence resolves, and is stated rather than dressed as a loaded file.** When no physical document exists at any layer, the resolution succeeds with built-in defaults and the screen says so: the bar's provenance names what the answer actually came from, and a screen with no document behind it never renders text claiming one was loaded at a time. `valid · runtime.toml · loaded HH:MM` is the all-good example from `screens/config.md:24-26`, not the only reachable string; the verdict word, the cited source and the time are three data leaves whose values follow the resolution.
- **Malformation, refusal and unreadability fail loudly, on every face.** A hand document that fails to decode, a `[repo.*]` block outside the global tier, a retired tier declaration, `runtime.ts` beside hand TOML at the same tier, and stale or never-built generated output are already typed errors (`harness_config.rs:3914-3960`; `modules/io/src/runtime_source.rs`). Each is surfaced as a failure in place of the verdict, never as an empty-but-valid-looking screen and never as a partial screen combining old rows with a new verdict.
- **The served document set is recorded during resolution, and the citation rule over it is fixed.** Resolution is layered rather than one physical file (`harness_config.rs:5080-5160`), so the assembly records, while it resolves, the physical documents it actually read, in layer order — global hand TOML or global generated output, each ancestor `.ctx/harness.toml`, the repository `.ctx/traits/runtime.toml` or repository generated output, and any `$CTX_CONFIG` document. **The bar and the preview footer cite exactly one member of that set: the highest-precedence document in it — the last layer in resolution order that contributed a document — with the citation's muted qualifier stating the total size of the set whenever it holds more than one.** When the set is empty the citation is the built-in-default origin, named as that origin and never as a file name. Per-knob winners keep their own layer, source and reason for the rows and the preview `source` leaf (Correction 5); the single cited document is the chrome's provenance leaf, not a claim that every value came from it, and its qualifier is what makes the difference visible.
- **The verdict, the cited document and the load time are one served fact set, produced by the assembly that produced the rows.** `ConfigReport` carries no document list, verdict or timestamp today, so this evidence is captured during resolution rather than reconstructed afterwards. **The time leaf is the single instant the serving assembly finished producing the answer, captured once on the serving side** — not a per-file mtime, not one instant per document, and never a render-time clock read — so an answer over zero documents and an answer over several carry exactly one time, and the bar and the preview footer render the same verdict, the same citation and the same time byte-for-byte. With a non-empty set the chrome frames that instant as the load of the cited document; with an empty set it frames it as the resolution of built-in defaults.
- **`ctx doctor --config`'s existing answers do not move.** Whatever `0268.4` lands is additive to that surface or a sibling read-only surface; `proof_config.rs` is the standing regression evidence and is declared as a check on this charter.

### Correction 2 — the answer is repository-scoped, and resolution is anchored on the calling process's cwd

The header is titled after a repository and the trust/inventory joins are repository-relative, but the center is machine-wide and today's resolution reaches for the process cwd twice: `runtime_config_layers` walks ancestors from `start_dir` while bounding the walk with `repository::discover_repo_root()`, which discovers from the current directory (`harness_config.rs:5080-5107`; `modules/io/src/repository.rs:17`), and personal `[repo."<key>"]` qualifier selection goes through `resolve_run_repo_key()`, which reads `std::env::current_dir()` and derives the main checkout from it (`harness_config.rs:3167-3175`). A center process calling this unchanged answers about its own cwd while the face believes it asked about a selected repository.

The invariant: **the config capability takes an explicit repository scope, and one scope value feeds the layer walk, the repo-qualifier key, the inventory and trust joins, and the rendered title.** An unknown, empty, relative or unusable scope is refused as a typed, rendered failure — never resolved against the center's or the desktop's cwd, and never silently degraded to built-in defaults, because that would read as a legitimately zero-config repository. The CLI's existing cwd-relative behaviour is preserved: `handle_doctor_config` passes `Utf8Path::new(".")` today (`doctor.rs:114`), and an explicit-scope entry point beside the existing one is the change, not a redefinition of the current call. Route: `repository::discover_repo_root_at` (`repository.rs:102`), `repository::discover_main_repo_root` (`repository.rs:132`) and `state::repo_key` (`modules/io/src/state.rs:153`) are the existing primitives; center rows already carry authoritative `repo_key`/`repo_path`, and the machine checkout index maps keys to paths.

### Correction 3 — `smart / worker / scribe` is not the seat schema

`screens/config.md:20` lists `smart / worker / scribe` as the Agents rows. Those are **trait** role ids authored in this repository, not runtime seats. `RuntimeConfig.agent.role` is a map of arbitrary role ids, the standing seats are `default`, `narrator`, `guide`, `merger` and `merger-deep` (`harness_config.rs:1817`, `1841-1868`), and a role may be absent, a single table, or a `[[agent.role.<role>]]` list whose entries expand into indexed seats (`configured_seats_for_role`, `harness_config.rs:2629-2665`). A hardcoded three-row section would render three lies in a repository configured any other way.

The invariants:

- **The Agents section renders the seats the resolution actually carries, one row per configured seat identity, in a deterministic order.** A role backed by a list yields one row per seat with its seat identity visible, because a role row and a physical seat are different identities and collapsing them hides configuration. A repository with no configured role renders the section's data-derived empty state rather than a fabricated row.
- **No design example string is reproduced as data.** `smart`, `worker`, `scribe`, `opencode 0.4.2`, `ctx-company/traits`, `5 digests` and `13:02` are illustrations. A leaf rendering one of them for a repository that does not carry it is worse than an omitted leaf, because it reads as evidence.

### Correction 4 — the row description and the summary counts are data leaves with no source yet named, and there are exactly three placeholder leaves

`screens/config.md:14-18` gives every config row a left-stack description and tags nothing in the main pane `placeholder:` except the header's phrasing. The export fills those descriptions with sentences, and the obvious source — a trait's agent description — is not a runtime-config fact: `Agent.description` is authored per trait (`modules/core/src/trait/agent.rs:92-98`), so the same role id carries different prose in different traits and none of it belongs to a runtime seat. The header's summary has the mirror problem: "Three seats, two engines, one trust list" is tagged counts-`data:`/phrasing-`placeholder:` (`screens/config.md:9-11`), and `two engines` does not match the Runtime section's three rows.

The invariants:

- **Every row description is a fact the served answer carries about that row's own subject** — for a seat, its configured identity facts; for a runtime row, what identifies that engine or path; for the trust row, the trait names `screens/config.md:22` names. Where no such fact exists, the row renders the data-derived empty form. Prose invented for a row, or borrowed from a trait's agent declaration and presented as runtime configuration, is a fabricated leaf.
- **Each summary count is the cardinality of a set the screen itself renders, and this plan names all three.** The seat count is the number of rows the Agents section renders (Correction 3). **The engine count is the cardinality of the engine set: the distinct harness ids the harness row renders, together with the one center identity the center row renders** — the store row names a path rather than a running engine and is never counted (Correction 7). The trust count is the cardinality of the approved set the trust row renders (Correction 8). A count that no rendered set produces is not a data leaf; if the phrasing's shape and the rendered sets cannot be reconciled — the export's `two engines` against three Runtime rows being exactly that case — the phrasing changes, never the counts.
- **Exactly three leaves on this screen come from the shared `placeholders` module: the header's phrasing, the `edit runtime.toml` action, and the preview seat's prose description.** No fourth placeholder is introduced to cover an ungrounded leaf, and no placeholder string appears inline.

### Correction 5 — model and effort are separate winners, and `source` cannot silently stand for both

The row's right stack is one value over one qualifier and the preview's `facts` block has one `source` row, but `agent.role.<role>[.<seat>].model` and `.reasoning-effort` are recorded as independent winners and can be won by different layers with different reasons (`ConfigWinner`, `harness_config.rs:1406-1412`; `ConfigLayer`/`ConfigReason`, `:1378-1397`). A single `source` leaf presented for both is a claim the resolution does not support.

The invariants:

- **`source` renders one labelled entry per rendered value, in the fixed order model then effort, and one entry never stands for two values.** The `facts` block's `source` row carries an entry for the model value always, and an entry for the effort value only when an effort value is rendered. Each entry names the value it belongs to and that value's winning layer, reason and source document, read from the winner recorded for `agent.role.<role>[.<seat>].model` and for `.reasoning-effort` respectively (`harness_config.rs:1406-1412`). The two entries are rendered separately when the winners agree exactly as when they differ: a merged entry cannot be told apart from a claim about one value only, and a single entry beside two independently-won values is the misreport this correction exists to prevent.
- **Built-in default and document-stated are distinguishable everywhere the value appears.** The resolution already carries layer and reason per knob; flattening either into "loaded" misreports configuration and is the leaf the CLI half reports from. A built-in-default winner's `source` entry names the built-in origin and carries no document path.
- **A missing reasoning effort renders as absent, and its `source` entry is omitted with it.** `ProfileAssignment.reasoning_effort` is optional; defaulting it to a plausible word is fabrication, and so is a source entry for a value that is not rendered.
- **The rendered model is the configured selector, on every face, and no model-catalog probe runs on any answer path.** `configured_seats_for_role` deliberately excludes the tier/catalog resolution its sibling performs (`harness_config.rs:2617-2628`), and that exclusion is the rendered meaning: the value beside a seat is the model selector the configuration carries for it, never a dispatch-resolved or catalog-expanded model. No child substitutes a resolved model for the selector, and no catalog probe runs inside the center's request path, the CLI's answer path or gpui's UI thread.

### Correction 6 — `used by` needs the trait inventory, and one role is not one universal assignment

`facts.used by` cannot come from `RuntimeConfig`: which traits use a seat is a fact about the visible trait inventory and each trait's declared agents. Worse, assignment is scope-dependent — `resolve_runtime_assignments` has no trait context while `resolve_trait_runtime_assignments` applies trait and variant qualifiers and records the selected qualifier per role (`harness_config.rs:2407-2420`, `2912`, `2926`). One role can therefore resolve to different model and effort values for different traits, so "one row, one model, used by four traits" is not automatically true.

The invariants:

- **`used by` is derived from the trait inventory joined to declared agents, through one shared assembly, never inferred from a seat's name and never by a second inventory scan.** If `0267`'s center-served inventory answer has landed, it is the reuse point; if it has not, the shared derivation is extracted rather than copied, and the desktop performs no scan of its own.
- **A row states the scope its values hold for, and divergence is represented rather than hidden.** Where a seat resolves differently under trait or variant qualifiers, the screen must not present one resolution as universal.

### Correction 7 — the Runtime section's three rows each need a definition, and one of them executes a binary

`harness / center / store` are named but not defined, and each has a trap:

- **`harness`**: configuration can declare several custom and built-in harnesses and different seats can use different ones, so the row's subject is defined by the seats already on screen. **The harness row renders the distinct harness ids selected by the effective assignments of exactly the seats the Agents section renders, in those seats' rendered order**: one id when every rendered seat selects the same harness, every distinct id when they differ, and the section's data-derived empty form when the Agents section renders no seat at all. The muted qualifier carries what the value alone cannot: for one id, the assignment scope it holds for; for several, how many rendered seats stand behind each. No harness is reported that no rendered seat selects. Route: `resolve_runtime_assignments` supplies the per-seat selection and `detect_builtin_harnesses` (`harness_config.rs:8062`) enumerates the built-in candidates.
- **Version is a subprocess.** `probe_harness_version` (`harness_config.rs:7682`) executes the harness binary under a timeout, and `doctor --config` invokes detection on every call. The invariant: **no probe runs inside the center's request handling, on gpui's UI thread, or on the selection hot path.** A row that cannot cheaply obtain a version reports the configured engine identity and says that is what it is, rather than blocking or silently omitting the leaf.
- **`center`**: **the value is the package version of the process that produced the answer** (`env!(CARGO_PKG_VERSION)`), **and the qualifier is the version-scoped socket path that process serves or would serve** (`center.rs:595-610`) — from the answering process itself, never a desktop-side guess and never the export's illustrative `nightly · local`. When the CLI half answers in-process rather than through a running center, the same two leaves describe the answering binary, which is what makes the two faces' rows comparable.
- **`store`**: **the represented path is the one `state::global_trait_root()` returns (`state.rs:334`), rendered verbatim as that authority returns it**, with the qualifier naming that authority. `state::global_ctx_root()` (`state.rs:78`) and `state::global_runs_root()` (`state.rs:354`) are neighbouring authorities, not this row's subject. Never a hardcoded `~/.config/ctx/traits` and never a hand-rolled tilde expansion.

### Correction 8 — `approved traits` and `N digests` are joins that must be defined, not `digests.len()`

`Document.digests` is append-only event history: verified and blocked records, records with and without trait ids, superseded records, and `runtime-example:` acceptance records that `classify_records` explicitly filters out (`modules/io/src/trust.rs:68`, `227`, `267`). A raw count of that vector is not an approved-traits answer, and the trust store alone cannot supply trait **names** — those need the inventory.

The invariants:

- **The approved set is this join, and no other.** A trait is approved when it is a member of the repository-scoped visible trait inventory **and** the one loaded trust document holds a verified record for exactly that member's current `(trait_id, digest)` pair — the join the existing code already models (`record_for_current`, `trust.rs:126`; `classify_records`, `:227`). The rendered names are those members' inventory ids, in the inventory's deterministic order. Every grounded record category resolves against that rule: a **blocked** record for the current pair excludes the member; a verified record for the identity at a **different digest** (stale) does not approve, because only exact current-digest evidence does; a **superseded** record is excluded by the same rule; an **orphaned** record whose trait id is not a visible inventory member confers no membership and contributes no name; a **raw digest-only** record with no trait id confers no membership; a `runtime-example:` record is filtered out as `classify_records` already filters it; **duplicate** approvals of one pair count once, because membership is keyed by trait id; and **family variants** are each their own visible member with their own id and their own evidence, never collapsed into one member. A **missing** trust store is an empty document and therefore an empty set — zero names, zero digests, the row's data-derived empty form — and not a failure.
- **`N digests` is the number of distinct current digest values carried by the approved members** — the same set the names come from, counted by digest rather than by member, so two approved members sharing one digest count once. No other vector, and never `digests.len()` over the event history.
- **One trust document load per answer, and it is the read-only one.** `read_store` is lock-free (`trust.rs:501-524`); `read_store_with_sequences` may mutate legacy sequence evidence (`:527-535`) and is therefore forbidden here. A missing store is an empty document, not a failure; a malformed store or invalid sequence evidence fails loudly per Correction 1.
- **Reuse `0267`'s served trust answer when it exists** rather than opening a second trust reader for this screen.

### Correction 9 — this is a typed protocol extension, and the center's request path is not where the work runs

There is no config request, response or delta in the protocol today: `Request` is run-shaped (`modules/io/src/center.rs:89-150`), `ResponseResult` carries no config result (`:198-208`), and `CenterDelta` represents only run-row and activity changes (`:267-282`). Invariants:

- **The config answer is a compact typed wire shape under the 1 MiB line bound** (`center.rs:51`). `RuntimeConfig` and `ConfigReport` are not wire types and `ConfigDoctorValue` is CLI-private; serializing either wholesale is the wrong extension.
- **Config resolution, inventory and trust reads, Git discovery and process probes never run inside `handle_request`** (`center.rs:3607`). `Start` and `Control` demonstrate the safer shape: short owner-side resolution, blocking work in the connection worker.
- **Freshness reaches clients as stream events with no timer on any client**, and **no new heavyweight dependency — in particular no filesystem watcher — enters `ctx-traits-io`**, which today depends only on core plus its existing third-party set. The center's existing two-second periodic scan (`center.rs:65`) is a detection cadence that already exists and a cheap fingerprint can ride it; that is a route, and any center-owned detection meeting the invariants replaces it. Trust is machine-global while runtime resolution is repository-scoped, so one trust change can invalidate several subscribed repositories and invalidation cannot be attached to a single run row.
- **Snapshot transactionality is inherited.** The TUI reducer is the precedent: stage the complete candidate, commit only on success, retain the last accepted model only behind explicit stale text, reconnect after a rejected candidate (`modules/cli/src/app/dashboard/worker.rs:254-415`). A failed refresh must never combine old rows with a new verdict and time.

### Correction 10 — the parity half, and the proof suite the children currently name is the wrong one

All four children declare `proof_doctor` as "doctor's config-reporting proof". That suite is doctor-panel-shaped and its only `--config` test asserts a flag conflict (`modules/cli/tests/proof_doctor.rs:256-275`); it does not cover config report semantics at all. The standing evidence for this charter's parity claim is `modules/cli/tests/proof_config.rs`, whose text/JSON, layering, seat-expansion, provenance, default and malformed cases are exactly what must not move, and the wire extension belongs in `modules/cli/tests/proof_center.rs`.

The invariants: **one resolution answers both faces; the compact shared view is extracted at the IO boundary and consumed by the center and the CLI alike; the landed `ctx doctor --config` answers are unchanged; and no second `runtime.toml` parser, no copy of the doctor assembly inside the center, and no CLI-private type imported by the desktop appears anywhere.** A child that keeps the `proof_doctor` check as its only config evidence has not observed its own outcome; correcting that check is expected and is reported as a deviation, not escalated.

### Correction 11 — `edit runtime.toml` has no single target, and the wrong target is misleading

`screens/config.md:25-27` says the action opens the file and tags reveal-in-editor as acceptable for v1. But resolution may have read global TOML, an ancestor `.ctx/harness.toml`, a repository `.ctx/traits/runtime.toml`, generated output compiled from `runtime.ts`, or a `$CTX_CONFIG` document (`harness_config.rs:5080-5160`). Correction 1 already makes the citation single — the highest-precedence document in the served set — so the action inherits a single subject, and this correction fixes what it does with it.

The invariant: **the action targets the editable source behind the one document the served provenance cites, by this rule, and refuses visibly when the rule yields none.** The cited document is hand-authored TOML — global, ancestor `.ctx/harness.toml`, repository, or the file `$CTX_CONFIG` names — and the action targets that file. The cited document is generated output, and the action targets the `runtime.ts` that produced it, never the generated artifact: revealing generated output as if authoritative teaches the operator to edit a file the next build overwrites. The served set is empty, so the citation is the built-in-default origin and the action refuses in place, stating that there is no editable source rather than opening a plausible path that does not exist or creating one. The action creates no file, opens no in-app editing surface, and stays a `placeholders`-served leaf.

### Correction 12 — the export is measurement; `grammar.md` and `screens/config.md` are the specification

`reference/config.html` is the geometry authority and worth copying from for exactly that: the 1440×900 frame with its only radius 10 (`:26`), rail 260 (`:93`), preview 380 with padding `[18,22]` (`:620`), and the bottom bar's `#23262d` 1px border with padding `[10,14]` (`:591`), against `tokens.md:71-85`'s title bar 36, main padding `[18,40,20,40]` gap 28, section gap 12 and row gaps.

It conflicts with the normative artifacts on content, and each conflict resolves toward the spec: the export renders preview model/effort/used-by values in sans where grammar rule 7 requires mono 10.5 values; it carries rail counts and a `ctx-logo-white.png` that `0265` has already ruled out; and every string in it is illustration. `tokens.md`'s dark column is normative and the light column stays untouched. `tokens.md` names IBM Plex Sans and Mono and the repository ships no font faces — `0265.1` owns that resolution and this screen must not silently fall back to a system face. A further conflict found during implementation resolves the same way and is reported.
'''
scope = '''
## Binding constraints and exclusions

These bound the outcome regardless of the route taken.

- **In scope**: the Config screen as `screens/config.md` specifies it — header, the `Agents` / `Runtime` / `Trust` sections, the dotless config row form, the `runtime.toml` provenance bottom bar, and the selected-seat preview column — plus the center-side runtime-and-trust capability each child needs, the explicit repository scoping that capability requires (Correction 2), and the read-only CLI surface answering from the same resolution inside this slice (`0268.4`).
- **The parity mechanism is the plan document's, not a variant of it.** A feature is something the center serves plus per-face rendering. The desktop parses no runtime document, resolves no layers, reads no trust store and runs no `git`; it asks the center, and a non-GUI face answers from the same resolution before this charter closes — as its own child rather than a rider on a rendering cut, so its regression surface is gated honestly.
- **Reuse, do not re-derive.** `harness_config`'s resolution, layering and per-knob winners, the io-level trust read, and the existing inventory authority are the substrate. A second `runtime.toml` parser, a private trust parse, a duplicated layer resolution, a second inventory scan, or a copy of the doctor assembly inside the center is a defect, and the existing doctor report is neither duplicated nor contradicted.
- **One resolution per answer, honestly claimed.** One repository-scoped assembly produces the rows, the verdict, the cited provenance and the load time together; one trust document load serves the trust row; the bottom bar and the preview footer cite that one answer, so they cannot disagree.
- **Absence, malformation and refusal are three different outcomes** (Correction 1). Absence resolves and is stated; malformation, refusal, stale or never-built generated output, and an unusable repository scope fail loudly on every face; nothing renders an empty result as a loaded document.
- **Read-only, everywhere in the slice, with three spec-tagged placeholders.** Nothing writes a runtime document, mutates trust, acquires a lock, rewrites a stamp or edits a seat; `--migrate-config` and `--apply` are untouched. Only the header's phrasing, the `edit runtime.toml` action and the preview seat's prose come from the shared `placeholders` module.
- **The preview column's scope is the selected seat.** `screens/config.md:29-34` specifies the preview for a selected seat and defines no blocks, leaves or tags for a `Runtime` or `Trust` row. Extending the column to those rows requires the design artifact to say what they contain first — an owner change to `.internal/docs/design/**`, not a worker ruling.
- **The crate lives outside the cargo workspace.** `0256.1` establishes its location, manifest, lockfile and non-interactive lane; every child of this charter lands into it. gpui must never enter root `Cargo.toml` resolution, the root `Cargo.lock`, `just test`, `just test-full` or the existing macOS/Linux CI lanes.
- **The desktop imports no CLI-private type.** Where a needed derivation lives inside `ctx-traits-cli` beside ratatui rendering, it is extracted into shared core/IO code and both faces consume it; copying it into gpui is a defect even when it compiles.
- **`ctx-traits-io` depends only on `ctx-traits-core` and its existing third-party set.** No CLI-level type and no new heavyweight dependency — in particular no filesystem watcher — enters the io crate, because the desktop lane inherits everything it drags in.
- **Extraction stops at demonstrated consumers.** Each shared piece is extracted by the first cut that renders through it and is only as wide as that cut needs. No design-system phase, and nothing built here for `0269` before it exists.
- **`0256`/`0257`/`0258`/`0265`'s robustness contracts are inherited, not renegotiated.** No poll loop anywhere in the GUI; snapshot-then-delta transactionality preserved; document resolution, trust reads and harness probes stay off gpui's UI thread and off the center's model-owner request path; center failure stays visible and fail-loud, with last-accepted state shown only behind an explicit stale marker and never as current.
- **Nothing here is deferred to `0261`**, whose own scope admits no production behaviour beyond its four named bullets; a capability assigned to it would be assigned to nothing.
- **Out of scope**: the other three new screens (`0266`, `0267`, `0269`, each its own work item), any runtime-configuration editing surface on any face, any change to `ctx doctor --migrate-config` or `--apply`, the light theme, pencil work of any kind, and every shared primitive `0265` already built.
- **This charter's `depends-on` gates nothing on its own.** `derived_status` derives a parent's status from its children and evaluates `depends-on` only for open leaves (`modules/core/src/task/graph.rs:131-177`), so the external prerequisites are named on the earliest child that consumes them — `0268.1` carries `0265.5`, `0265.9` and `0258` — and reach the rest through child-to-child edges. The order below documents the sequence; it is not the gate.

## Covered work item

`config-screen` — the v1 Config (Runtime) screen: configured seats, runtime rows, trust row, the runtime provenance bar, read-only, placeholder-marked, dark theme only, chrome citing its source per grammar rule 12.

## Suggested approach — guidance, not a boundary

### Item order, and what each cut owns

The edges are already encoded on the children; this is what they mean in sequence.

1. `0268.1` (after `0265.5`, `0265.9`, `0258`) — the load-bearing cut: the explicit-scope resolution (Correction 2), the compact served view carrying rows, per-knob winners, verdict, cited provenance and load time (Correction 1), the seat enumeration (Correction 3), the runtime-row definitions with probing kept off the hot paths (Correction 7), the trust join (Correction 8), the typed center protocol extension with its freshness path (Correction 9), the `Config` menu entry and switch, and the three sections of dotless rows.
2. `0268.2` and `0268.4` (each after `0268.1`) — the header with its derived counts and placeholder phrasing plus the bottom bar's earned verdict, cited provenance and placeholder-served action (Corrections 1, 4, 11); and the read-only CLI half answering from the same resolution with the landed doctor answers unchanged (Correction 10).
