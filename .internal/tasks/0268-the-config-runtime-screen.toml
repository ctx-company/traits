## Watch

- **`grammar.md` and `screens/config.md` are the specification; the export is measurement.** Copying a value out of `reference/config.html` is right for geometry and wrong for content; the known conflicts are in Correction 12 and a further one found during implementation is resolved the same way and reported.
- **No design example string is ever hardcoded.** `smart`/`worker`/`scribe`, `ctx-company/traits`, `opencode 0.4.2`, `~/.config/ctx/traits`, `nightly · local`, `5 digests`, `13:02` and the summary sentence are illustrations. A leaf that renders one of them for a repository that does not carry it is worse than an omitted leaf, because it reads as evidence.
- **Nothing is served to the GUI that a non-GUI face cannot also reach.** Config is where a one-face capability is easiest to ship by accident, because there is no dashboard Config screen to move; a desktop-side document parse, layer resolution or trust read is the capability-in-one-face defect even over identical bytes.
- **Do not overclaim the gap, and do not contradict the landed report.** `ctx doctor --config` already reports effective configuration with winning layers and expanded seats; a second command re-resolving independently, or the same command answering differently than before, is a regression against a shipped surface.
- **Where a value is a built-in default rather than something a document states, keep that distinguishable.** Flattening layer and reason into "loaded" misreports configuration and breaks the preview's `source` leaf.
- **Absence is not malformation.** A repository with no runtime document resolves to built-in defaults and says so; a malformed, refused, stale or never-built document fails loudly. Neither ever renders as an empty-but-valid-looking screen.
- **Harness version probes execute a binary.** Keep them cheap, cached or off the answer path — never on gpui's UI thread, never inside the center's request handling, never on the selection hot path. A row that cannot get a version reports configured identity and says so rather than omitting the leaf.
- **Read-only means read-only** on every face: no write path, no `--apply`, no `--migrate-config` change, no trust mutation, no `read_store_with_sequences`, no lock acquisition or stamp rewrite dressed up as a read.
- **No poll loop anywhere in the GUI**, no timer re-reading the load time, and no blocking read on gpui's UI thread.
- **Fail-loud, no silent staleness, no direct-reader fallback**, and no partial commit: a failed refresh never combines old rows with a new verdict and time, and last-accepted state appears only behind an explicit stale marker.
- **No dots anywhere on this screen** — `screens/config.md:13` states it outright, and adding one because "it is a list" is a spec violation. **States are words**, never pills or icons.
- **The TUI stays first-class and must not regress** — its `Screen::Trust` and every existing config-reporting behaviour keep working.
- **`ctx-traits-io` depends only on `ctx-traits-core` and its existing third-party set**, and no filesystem watcher enters it.
- **No test may depend on committed repo content.** Prove behaviour with scratch repositories, scratch runtime documents and scratch trust stores — never against this repository's own `.ctx/traits/runtime.toml`, its own trait set or its own board. Path/word/file-existence inventories are banned workspace-wide.
- **Grammar rules are normative**: semantic colour with `valid` in ok, states as words, the closed glyph set `↰ ↳ → · ∷`, no corner radius inside the canvas, one bright title per list with `surface-raised` selection, sans for content and mono for machinery, a title plus exactly one italic narrated summary and no breadcrumbs, a ghost-text bottom bar on every screen, overflow clipping only when content actually overflows, and provenance cited in bars and footers.
- **Placeholder doctrine**: exactly three leaves come from the shared module — the summary's phrasing, the `edit runtime.toml` action and the preview seat's prose. Every other leaf is `data:`, none may close as an unrendered gap, and no fourth placeholder is added to cover a leaf whose source was not found.
- **Fonts**: `tokens.md` names IBM Plex Sans and Mono and the repository ships no font faces; `0265.1` owns that resolution and this screen must not silently fall back to a system face.
- **Workspace gate cost must not move.** gpui must never enter root `Cargo.toml` resolution, the root `Cargo.lock`, `just test`, `just test-full`, or the existing macOS/Linux CI lanes. Equally, do not declare a check that forbids the string `gpui` in `Justfile`/`.github/workflows/`: a separate desktop lane there is sanctioned, and a check that reds on the sanctioned outcome is a wrong check.
- **The children's `proof_doctor` check is the wrong evidence** (Correction 10): that suite covers the doctor panel and one flag conflict, not config report semantics. `proof_config.rs` is the standing config suite and `proof_center.rs` the process-boundary center suite; correcting a child's check to the suite that actually observes its outcome is expected and reported as a deviation.
- **No desktop board check exists yet**: `0256.1` is still `ready` and no standalone desktop validation command exists in the repository, so none is declared here or invented. Once it lands, the exact desktop command becomes declarable.
- Rust is pinned to 1.97.1 by `rust-toolchain.toml`. Isolate builds with `CARGO_TARGET_DIR=target` when a gate failure looks like a phantom "cannot find X"; a shared cross-worktree target dir flakes gates.

## Done when — binding goals, and what decides each

1. **Every child is completed on its own terms.** All four (`0268.1`-`0268.4`) are `done` — the only accepted child state — each having run its own declared checks and, once `0256.1` had landed one, the desktop lane command. Cancellation does not satisfy this goal: a cancelled child leaves its leaves unrendered and its capability unbuilt, so this charter stays open. No board check at this level: child closure is the board's bookkeeping, and this parent's derived status is not evidence of it while the children are still unloadable drafts (see the note in `content`).
2. **Config matches `screens/config.md` leaf for leaf** — menu entry and switch, the repository-qualified header with its one italic summary, the `Agents` / `Runtime` / `Trust` sections of dotless config rows with their sans name/description stacks and end-aligned mono value/qualifier stacks, the bottom bar with its earned verdict, cited provenance and placeholder-served `edit runtime.toml`, and the preview's `seat` and `facts` blocks with its footer — with every `data:` leaf rendering from a center-served source a non-GUI face also consumes, exactly three `placeholder:` leaves served from the shared module, and no leaf closing as an unrendered gap. The specific leaf values are the ones the corrections fix, not implementation choices, and each is one definite result: seats are the resolution's configured seat identities rather than a fixed three (Correction 3); the harness row is the distinct harness ids of the rendered seats' effective assignments, the center row is the answering process's package version over its version-scoped socket path, and the store row is `state::global_trait_root()`'s path verbatim (Correction 7); the summary's seat count is the Agents rows, its engine count is the distinct rendered harness ids plus the one center identity, and its trust count is the approved set, with row descriptions derived facts and never invented prose (Correction 4); the trust row's names are the visible inventory members holding verified evidence for their current `(trait_id, digest)` and its `N digests` is the distinct current digests of that same set, with blocked, stale, superseded, orphaned, raw, duplicate, family-variant and missing-store cases resolving as Correction 8 states; `used by` comes from the inventory join (Correction 6); the model value is the configured selector and `source` carries one labelled entry per rendered value, model then effort, with a missing effort and its entry both absent (Correction 5); the bar and footer cite the highest-precedence document of the served set, qualified by that set's size, or the built-in-default origin when it is empty, at the one instant the assembly captured (Correction 1); and no export literal is reproduced (Correction 12). Decided by two things that exist today: the substantive leaf-by-leaf closing review in `scope`, run against the artifacts rather than from memory and naming for each leaf the served source it renders from, and `just test-full` — declared in `[[checks]]` and runnable now — which proves the shared io/center/CLI code those leaves render through is green. Once `0256.1` has landed a desktop lane command, that command is additional proof of the rendered screen; its name is that task's to establish and is not guessed here. No board check is declared for the rendered screen itself, and none may be invented, because no repo-root command inspects a rendered gpui screen today.
3. **The screen is one center-served, repository-scoped answer.** The capability takes an explicit repository scope and refuses an unknown, empty, relative or unusable one rather than falling back to the center's or the desktop's cwd; one scope feeds the layer walk, the repo-qualifier key, the inventory and trust joins and the title; one assembly per answer produces the rows, the verdict, the served document set and the one captured instant together, loading the trust document once; the bar and the preview footer render that answer's verdict, its single cited document — the highest-precedence member of the served set, or the built-in-default origin when the set is empty — and that one instant, so they cannot disagree and no second time is read at render; the answer is a compact typed wire shape under the 1 MiB bound; resolution, inventory, trust reads and harness probes run off the center's model-owner request path and off gpui's UI thread; freshness arrives as stream events with no timer on any client; and the desktop process performs no runtime-document, trust, inventory or `git` read. Decided by the center wire proof and the io/CLI tests inside the landing gate, by the desktop lane command once it exists, and by reading the diff for any timer, second resolution or desktop-side read.
4. **Absence, failure and every boundary render honestly, and nothing is invented.** A repository with no runtime document at any layer resolves to built-in defaults and renders a screen that says so rather than one claiming a loaded file; a malformed, refused, stale or never-built document, and an unusable repository scope, each render a loud failure in place of the verdict, with no partial commit of old rows beside a new verdict; a role with no configured assignment, an absent reasoning effort with its `source` entry absent too, a list-backed role's individual seats, a seat resolving differently under a trait or variant qualifier, rendered seats selecting several harnesses, a harness whose version cannot be cheaply probed, and a repository with no editable source behind the citation each render their defined form rather than a fabricated one; a missing trust store renders the empty approved set with zero digests and no failure, while blocked, stale, superseded, orphaned, raw digest-only, duplicate and family-variant records affect membership and the digest count exactly as Correction 8 defines and never through `digests.len()`; and no model, effort, description, count, path or digest is shown that the resolution did not produce. Decided by the children's own scratch-fixture coverage of these cases, run inside the landing gate, plus the closing review's boundary exercises.
5. **A read-only non-GUI surface answers from the same resolution, and the landed report is unchanged.** The CLI half reports this screen's shape — configured seats with their configured model selector and effort, the runtime rows as Correction 7 defines them, the trust row with the approved set and its distinct-digest count, and the same cited document, verdict and captured instant the chrome shows — from the same resolution the center serves, with each knob's winning layer and reason preserved, no second `runtime.toml` parser, no copy of the doctor assembly inside the center, and no CLI-private type imported by the desktop; every answer `ctx doctor --config` already gave is unchanged; and a malformed or refused document is reported in the CLI's own idiom with the same verdict the screen shows. Decided by `proof_config.rs`, declared in `[[checks]]` and passing today, plus the landing gate.
6. **The workspace is unmoved.** Root Cargo resolution and the root lockfile contain no gpui, the desktop project is not a workspace member, and the full landing gate passes without building it: `just test-full`, plus the root-resolution command declared in `[[checks]]` below.

Exclusions, restated so they are checkable by reading the diff: no light-theme value is touched, no pencil artifact is edited, no configuration-editing surface is opened on any face, `--migrate-config` and `--apply` are untouched, no trust mutation or lock acquisition occurs, no filesystem-watcher dependency enters `ctx-traits-io`, no preview content is invented for a `Runtime` or `Trust` row, no fourth placeholder leaf is added, and no work belonging to `0266`, `0267`, `0269` or `0261` is done here.

## Order and bounded refinement

Children run in the three stages listed in `scope`; within a stage, the encoded edges are the only ordering that binds. When the last child lands, the suggested closing route is: leaf-by-leaf review against `screens/config.md`, then the literal geometry comparison against `reference/config.html`, then the boundary exercises, then the diff read for the single-resolution and no-second-reader properties, then the focused config, center and runtime-TypeScript proofs, then `just test-full` and the root-resolution check, with the desktop lane command added once `0256.1` has landed one. The reason for that shape is cheap evidence first, so a rendering or provenance defect surfaces next to the leaf that owns it rather than inside a long gate. The sequence is guidance, not a boundary: a pass that reorders it, folds steps together, or reaches the same evidence another way is legitimate and reports the deviation in its work summary.

The stop condition binds. Permit at most one targeted repair-and-rerun round at this level: a round repairs one named defect in the child that owns it, then reruns whatever closing evidence is needed to show the repair holds and broke nothing already proven. If a second round would be needed, stop and report the failing command or the failing leaf with its evidence rather than iterating; that is the stop condition, not a judgement call.
