name: CI

"on":
  push:
    # Branches only: a tag push runs the Release workflow, whose build
    # matrix is the real release gate — a bare `push:` also fired CI for
    # every tag, doubling the work for no extra signal.
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A healthy verify finishes in ~5 minutes; without a bound, a hung runner
    # burns the default 6 hours (observed: a 45-minute lost-communication
    # macOS run). Generous 6x headroom, still a real ceiling.
    timeout-minutes: 30
    steps:
      # Install tools & packages
      - uses: actions/checkout@v5
      # No version pinned here on purpose: rust-toolchain.toml is the single
      # source of truth, and `rustup show` installs exactly the channel and
      # components it names. Naming a version here too is how CI came to run
      # 1.85.0 against a workspace that needs let-chains.
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install remote dependencies
      - name: Install command-line gates (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes just jq ripgrep expect
      - name: Install command-line gates (macOS)
        if: runner.os == 'macOS'
        run: brew install just jq ripgrep

      # Install local dependencies
      - run: pnpm install --frozen-lockfile
      - run: just ts-build

      # `just test-full`, NOT `just test`: since 0056 `just test` is the cheap
      # per-round gate the implement trait pays every build round, and it
      # deliberately skips the integration proof suites. CI is the place those
      # must run, so it takes the landing gate — sdk-check, ts-format-check,
      # `just lint` (fmt + clippy + doc) and the whole cargo suite.
      - run: just test-full
      - run: just ts-typecheck
      - run: just ts-lint
      - run: just ts-test

      # Everything above compares this tree to itself, and every one of those
      # checks passed for the six days `@ctx-traits/cdk@0.2.4` was published
      # while the CDK's API moved underneath the same number. The only thing
      # that disagreed was npm. These two ask npm, and walk a user's path.
      #
      # Linux only: both hit the network and neither is platform-sensitive,
      # so running them twice buys nothing.
      - name: Published packages match their version numbers
        if: runner.os == 'Linux'
        run: just published-drift
      - name: Cold start — a user's path in an empty folder
        if: runner.os == 'Linux'
        run: just e2e
