name: Release

"on":
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Archive naming contract, shared with modules/cli/Cargo.toml's
# [package.metadata.binstall] and Formula/ctx.rb: ctx-v{version}-{target}.tar.gz,
# containing the `ctx` binary at the archive root.
#
# The binstall metadata is inert until `ctx-traits-cli` is published to a
# registry (the workspace sets publish = false); it is kept because it pins
# the same naming contract this workflow and the formula depend on. Publishing
# for `cargo binstall` waits for the ctx-company/cli consolidation.
env:
  ARCHIVE_PREFIX: ctx

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was GitHub's last plain Intel image and was retired in
          # late 2025 — a job requesting it queues forever (observed
          # 2026-08-13 on the first v0.1.0 tag). macos-15-intel is the
          # continuing Intel runner.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Release builds are heavier than CI's verify but still finish well under
    # an hour; without a bound, a hung build burned a full 24 hours before
    # GitHub's own cancellation (observed 2026-08-05).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Same single source of truth as ci.yml: the channel comes from
      # rust-toolchain.toml, and only the per-matrix target is added here.
      - name: Install Rust (from rust-toolchain.toml)
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            version=$(cargo metadata --no-deps --format-version 1 --manifest-path modules/cli/Cargo.toml | jq -r '.packages[] | select(.name == "ctx-traits-cli") | .version')
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path modules/cli/Cargo.toml --bin ctx
      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          archive="${ARCHIVE_PREFIX}-v${version}-${target}.tar.gz"
          stage=$(mktemp -d)
          cp "target/${target}/release/ctx" "${stage}/ctx"
          chmod +x "${stage}/ctx"
          tar -czf "${archive}" -C "${stage}" ctx
          shasum -a 256 "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Inspect archive
        run: |
          tar -tzf "${{ steps.package.outputs.archive }}"
          tar -tzf "${{ steps.package.outputs.archive }}" | grep -qx 'ctx'
          cat "${{ steps.package.outputs.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  formula:
    name: render Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Render formula
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          # Derived, never hardcoded: a literal here drifted from the real
          # repository and every rendered download URL would have 404'd.
          repo="${GITHUB_REPOSITORY}"
          render() {
            local target="$1" placeholder="$2"
            local sha
            sha=$(cut -d ' ' -f 1 "dist/${ARCHIVE_PREFIX}-v${version}-${target}.tar.gz.sha256")
            sed -i "s|__${placeholder}__|${sha}|g" Formula/ctx.rb
          }
          sed -i "s|__VERSION__|${version}|g; s|__REPO__|${repo}|g" Formula/ctx.rb
          render x86_64-apple-darwin SHA256_X86_64_APPLE_DARWIN
          render aarch64-apple-darwin SHA256_AARCH64_APPLE_DARWIN
          render x86_64-unknown-linux-gnu SHA256_X86_64_UNKNOWN_LINUX_GNU
          render aarch64-unknown-linux-gnu SHA256_AARCH64_UNKNOWN_LINUX_GNU
          if grep -q '__' Formula/ctx.rb; then
            echo "::error::Formula/ctx.rb still has unresolved placeholders"
            grep -n '__' Formula/ctx.rb
            exit 1
          fi
      - name: Syntax-check formula
        run: ruby -c Formula/ctx.rb
      # Moved from ci.yml (P569), where it ran against a path that does not
      # exist in a checkout: Formula/ctx.rb is rendered here, not committed.
      - name: Check rendered formula parses
        run: ruby -c Formula/ctx.rb
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: Formula/ctx.rb
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, formula]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${tag}" \
            --generate-notes

  # The formula only becomes `brew install` once it lives in a tap. Kept as a
  # separate job from `publish` so a tap failure can never leave the release
  # itself unpublished — the archives are the product, the tap is a pointer.
  tap:
    name: push formula to the Homebrew tap
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: dist
      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.GH_HOMEBREW_PAT_TOKEN }}
          TAP_REPO: ctx-company/homebrew-tap
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Skipping is deliberate rather than failing: the tap repository and
          # its token are owner-provisioned, and a release whose binaries are
          # already published must not be reported as failed because a
          # follow-on pointer could not be written.
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::warning::GH_HOMEBREW_PAT_TOKEN is not set — skipping the tap push."
            echo "::warning::Install this release directly with: brew install --formula https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/ctx.rb"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/ctx.rb tap/Formula/ctx.rb
          cd tap
          git config user.name "ctx release"
          git config user.email "release@ctx.company"
          git add Formula/ctx.rb
          if git diff --cached --quiet; then
            echo "tap already carries this formula — nothing to push"
            exit 0
          fi
          git commit -m "ctx ${tag}"
          git push

  # @ctx-traits/cdk is what `ctx traits init` scaffolds a dependency on, so an
  # unpublished CDK means a new user's first `pnpm install` fails. Its version
  # is the package's own, NOT the tag: the binary and the authoring SDK are
  # separately versioned artifacts that happen to release together.
  npm:
    name: publish npm packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Only the four published packages — pnpm orders the filtered set
      # topologically, and the private bindings/harness packages must not be
      # built (or published) here.
      - run: >-
          pnpm --filter @ctx-traits/config --filter @ctx-traits/cdk
          --filter @ctx-traits/toolkit --filter @ctx-traits/agents run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::warning::NPM_TOKEN is not set — skipping the npm publishes."
            exit 0
          fi
          # Dependency order: config -> cdk -> toolkit -> agents. `pnpm
          # publish` (never bare `npm publish`) so workspace:^ ranges are
          # rewritten to real versions in the published manifests.
          for package in config cdk toolkit agents; do
            name="@ctx-traits/${package}"
            version=$(node -p "require('./packages/${package}/package.json').version")
            # Republishing an existing version is an npm error, and a
            # retagged release must stay idempotent.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published — nothing to do"
              continue
            fi
            pnpm --filter "${name}" publish --access public --no-git-checks
          done
