name: Release

"on":
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Archive naming contract, shared with modules/cli/Cargo.toml's
# [package.metadata.binstall] and Formula/ctx.rb: ctx-v{version}-{target}.tar.gz,
# containing the `ctx` binary at the archive root.
#
# The binstall metadata is inert until `ctx-traits-cli` is published to a
# registry (the workspace sets publish = false); it is kept because it pins
# the same naming contract this workflow and the formula depend on. Publishing
# for `cargo binstall` waits for the ctx-company/cli consolidation.
env:
  ARCHIVE_PREFIX: ctx

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was GitHub's last plain Intel image and was retired in
          # late 2025 — a job requesting it queues forever (observed
          # 2026-08-13 on the first v0.1.0 tag). macos-15-intel is the
          # continuing Intel runner.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Release builds are heavier than CI's verify but still finish well under
    # an hour; without a bound, a hung build burned a full 24 hours before
    # GitHub's own cancellation (observed 2026-08-05).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Same single source of truth as ci.yml: the channel comes from
      # rust-toolchain.toml, and only the per-matrix target is added here.
      - name: Install Rust (from rust-toolchain.toml)
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            # A tag whose TREE disagrees with it must refuse, not ship: the
            # v0.2.0 cut pointed at a pre-bump tree whose package manifests
            # still said 0.1.1, so the npm job silently skipped every
            # publish. Every version-bearing file must equal the tag.
            cargo_version=$(cargo metadata --no-deps --format-version 1 --manifest-path modules/cli/Cargo.toml | jq -r '.packages[] | select(.name == "ctx-traits-cli") | .version')
            if [[ "${cargo_version}" != "${version}" ]]; then
              echo "::error::tag v${version} but the workspace Cargo version is ${cargo_version} — retag on a tree whose versions match"
              exit 1
            fi
            for package in config cdk toolkit agents; do
              npm_version=$(jq -r .version "packages/${package}/package.json")
              if [[ "${npm_version}" != "${version}" ]]; then
                echo "::error::tag v${version} but @ctx-traits/${package} is ${npm_version} — retag on a tree whose versions match"
                exit 1
              fi
            done
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            version=$(cargo metadata --no-deps --format-version 1 --manifest-path modules/cli/Cargo.toml | jq -r '.packages[] | select(.name == "ctx-traits-cli") | .version')
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path modules/cli/Cargo.toml --bin ctx
      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          archive="${ARCHIVE_PREFIX}-v${version}-${target}.tar.gz"
          stage=$(mktemp -d)
          cp "target/${target}/release/ctx" "${stage}/ctx"
          chmod +x "${stage}/ctx"
          tar -czf "${archive}" -C "${stage}" ctx
          shasum -a 256 "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Inspect archive
        run: |
          tar -tzf "${{ steps.package.outputs.archive }}"
          tar -tzf "${{ steps.package.outputs.archive }}" | grep -qx 'ctx'
          cat "${{ steps.package.outputs.archive }}.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  formula:
    name: render Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Render formula
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          # Derived, never hardcoded: a literal here drifted from the real
          # repository and every rendered download URL would have 404'd.
          repo="${GITHUB_REPOSITORY}"
          render() {
            local target="$1" placeholder="$2"
            local sha
            sha=$(cut -d ' ' -f 1 "dist/${ARCHIVE_PREFIX}-v${version}-${target}.tar.gz.sha256")
            sed -i "s|__${placeholder}__|${sha}|g" Formula/ctx.rb
          }
          sed -i "s|__VERSION__|${version}|g; s|__REPO__|${repo}|g" Formula/ctx.rb
          render x86_64-apple-darwin SHA256_X86_64_APPLE_DARWIN
          render aarch64-apple-darwin SHA256_AARCH64_APPLE_DARWIN
          render x86_64-unknown-linux-gnu SHA256_X86_64_UNKNOWN_LINUX_GNU
          render aarch64-unknown-linux-gnu SHA256_AARCH64_UNKNOWN_LINUX_GNU
          if grep -q '__' Formula/ctx.rb; then
            echo "::error::Formula/ctx.rb still has unresolved placeholders"
            grep -n '__' Formula/ctx.rb
            exit 1
          fi
      - name: Syntax-check formula
        run: ruby -c Formula/ctx.rb
      # Moved from ci.yml (P569), where it ran against a path that does not
      # exist in a checkout: Formula/ctx.rb is rendered here, not committed.
      - name: Check rendered formula parses
        run: ruby -c Formula/ctx.rb
      - uses: actions/upload-artifact@v5
        with:
          name: formula
          path: Formula/ctx.rb
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, formula]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: formula
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Idempotent across re-tags: a partially failed run (tap or npm)
          # leaves the release existing with assets — re-create fails, so
          # view-then-upload with --clobber replaces assets in place.
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            # Deleting a tag (the re-cut dance) demotes its published
            # release to a DRAFT, and uploading assets does not restore it —
            # finish the job: publish and mark latest.
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false --latest
          else
            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --generate-notes
          fi

  # The formula only becomes `brew install` once it lives in a tap. Kept as a
  # separate job from `publish` so a tap failure can never leave the release
  # itself unpublished — the archives are the product, the tap is a pointer.
  tap:
    name: push formula to the Homebrew tap
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: formula
          path: dist
      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.GH_HOMEBREW_PAT_TOKEN }}
          TAP_REPO: ctx-company/homebrew-tap
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Skipping is deliberate rather than failing: the tap repository and
          # its token are owner-provisioned, and a release whose binaries are
          # already published must not be reported as failed because a
          # follow-on pointer could not be written.
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::warning::GH_HOMEBREW_PAT_TOKEN is not set — skipping the tap push."
            echo "::warning::Install this release directly with: brew install --formula https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/ctx.rb"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/ctx.rb tap/Formula/ctx.rb
          cd tap
          git config user.name "ctx release"
          git config user.email "release@ctx.company"
          git add Formula/ctx.rb
          if git diff --cached --quiet; then
            echo "tap already carries this formula — nothing to push"
            exit 0
          fi
          git commit -m "ctx ${tag}"
          git push

  # @ctx-traits/cdk is what `ctx traits init` scaffolds a dependency on, so an
  # unpublished CDK means a new user's first `pnpm install` fails. Its version
  # is the package's own, NOT the tag: the binary and the authoring SDK are
  # separately versioned artifacts that happen to release together.
  npm:
    name: publish npm packages
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # OIDC trusted publishing (npm deprecated granular-token 2FA bypass,
    # 2026-07): each @ctx-traits package lists this repo+workflow as its
    # trusted publisher on npmjs.com, and `npm publish` exchanges the
    # Actions OIDC token for publish rights — no NPM_TOKEN secret at all.
    # First-time publishes cannot use this path: a package's trusted
    # publisher is configured on an EXISTING package, so version 0.1.0 of
    # each package is published once from a maintainer machine (interactive
    # 2FA), after which this job takes over.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Only the four authoring packages — the private bindings/harness
      # packages and binary wrapper must not be built here.
      - run: >-
          pnpm --filter @ctx-traits/config --filter @ctx-traits/cdk
          --filter @ctx-traits/toolkit --filter @ctx-traits/agents run build
      - name: Publish
        run: |
          set -euo pipefail
          # Dependency order: config -> cdk -> toolkit -> agents. Two tools
          # on purpose: `pnpm pack` rewrites workspace:^ ranges into real
          # versions in the packed manifest, and `npm publish <tarball>`
          # performs the OIDC trusted-publishing exchange (pnpm's own
          # publish does not).
          stage=$(mktemp -d)
          for package in config cdk toolkit agents; do
            name="@ctx-traits/${package}"
            version=$(node -p "require('./packages/${package}/package.json').version")
            # Republishing an existing version is an npm error, and a
            # retagged release must stay idempotent.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published — nothing to do"
              continue
            fi
            # --dir, not --filter: --filter switches pnpm into recursive mode,
            # which `pack` does not support ("Unknown option: 'recursive'",
            # observed v0.1.1). --dir packs the one package and still
            # rewrites workspace:^ ranges to real versions.
            pnpm --dir "packages/${package}" pack --pack-destination "${stage}"
            npm publish "${stage}/ctx-traits-${package}-${version}.tgz" --access public
          done
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          release_version="${{ needs.build.outputs.version }}"
          if [[ "${cli_version}" != "${release_version}" ]]; then
            echo "::error::@ctx-traits/cli version ${cli_version} does not match release version ${release_version}"
            exit 1
          fi
          name="@ctx-traits/cli"
          if npm view "${name}@${cli_version}" version >/dev/null 2>&1; then
            echo "${name}@${cli_version} is already published — nothing to do"
            exit 0
          fi
          pnpm --dir packages/cli pack --pack-destination "${stage}"
          npm publish "${stage}/ctx-traits-cli-${cli_version}.tgz" --access public
