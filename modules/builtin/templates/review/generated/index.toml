id = "review"
schema-version = "0.5"
version = "0.1.0"
name = "Review"
description = "Reviews whatever it is pointed at and returns a written review, without touching the tree."

[metadata]
tag = [
    "template",
    "review",
]

[[intent.focus]]
id = "correctness"

[[intent.avoid]]
id = "rubber-stamp-review"

[[behavior.tone]]
id = "plain"

[[behavior.tone]]
id = "direct"

[[behavior.method]]
id = "evidence-first"

[[behavior.method]]
id = "steelman"

[[behavior.method]]
id = "push-back"

[[port]]
id = "target"
direction = "input"
schema = "schema:text"
description = 'What to review, in your own words — e.g. "the auth module", "src/parser.rs", "main...HEAD".'

[[port]]
id = "verdict-report"
direction = "output"
schema = "schema:text"
description = "The review."
title = "Review"
value = "slot:verdict"

[[slot]]
id = "verdict"
schema = "schema:text"
description = "The reviewer's assessment: what blocks a merge, what is advisory, and what was checked."

[[agent]]
id = "reviewer"
description = "Reviews what it is pointed at and reports what would block a merge."
summary = "Review role."

[prompt.review-the-target]
text = """

      Review {port:target}.
      Find it and read it with your own tools first — never review something from its name alone.
      Report what would block a merge, then what is advisory, then what you checked and found sound.
      Say plainly when it is fine; do not invent findings to fill the report.
    """
input = ["port:target"]
output = ["slot:verdict"]

[procedure]
description = "Reviews whatever it is pointed at and returns a written review, without touching the tree."
input = ["port:target"]
output = ["port:verdict-report"]

[[procedure.sequence]]
id = "review-the-target"
title = "Review the target"
agent = "agent:reviewer"
prompt = "prompt:review-the-target"
input = ["port:target"]
output = ["slot:verdict"]
