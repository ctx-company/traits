id = "refine"
schema-version = "0.5"
version = "0.1.0"
name = "Refine Trait"
description = "Drives a bounded produce/evaluate loop that refines a trait candidate against the deterministic rung ladder (with an identity rung refinement must never cross), revising on its own typed diagnostics."

[[dependency]]
alias = "spec"
id = "spec"
version = "0.1.0"

[dependency.source]
path = "../../shared/spec"

[metadata]
tag = [
    "first-party",
    "meta-trait",
    "refinement",
]

[[port]]
id = "change-request"
direction = "input"
schema = "schema:text"
description = "Requested refinement."

[[port]]
id = "result"
direction = "output"
schema = "schema:refine-envelope"
description = "Terminal round-evidence envelope: convergence, rounds spent, failing rung, diagnostics, and the last candidate scaffold."
value = "slot:envelope"

[[port]]
id = "single-shot"
direction = "input"
schema = "schema:boolean"
description = "Stop after exactly one produce/evaluate round regardless of convergence."

[[port]]
id = "source"
direction = "input"
schema = "schema:text"
description = "Canonical source trait text."

[[port]]
id = "source-digest"
direction = "input"
schema = "schema:text"
description = "sha256 digest of the source trait."

[[port]]
id = "source-path"
direction = "input"
schema = "schema:text"
description = "Filesystem path whose lines anchors must reference; also the round evaluator's re-read source."

[[slot]]
id = "candidate"
schema = "schema:text"
description = "Current-round refine scaffold JSON text: {source-trait-id, source-digest, proposed-trait, patches}."

[[slot]]
id = "envelope"
schema = "schema:refine-envelope"
description = "Terminal round-evidence envelope."

[[slot]]
id = "round-report"
schema = "schema:round-report"
description = "Latest round's rung-ladder evaluation."

[[slot]]
id = "rounds-spent"
schema = "schema:number"
description = "Rounds evaluated so far, including the pre-loop first draft's evaluation."

[[slot]]
id = "single-shot-flag"
schema = "schema:boolean"
description = "Local copy of the single-shot input port for the loop guard."

[[schema]]
id = "refine-envelope"
description = "Terminal report the CLI handler drives its write-once/non-convergence decision from."

[schema.fields.candidate]
schema = "schema:text"
required = true
description = "The last candidate scaffold JSON text produced."

[schema.fields.converged]
schema = "schema:boolean"
required = true
description = "Whether the loop exited because a candidate converged."

[schema.fields.diagnostics]
schema = "schema:any"
description = "The last round's diagnostics; empty when converged."

[schema.fields.failing-rung]
schema = "schema:text"
description = "The rung the last round failed at; absent when converged."

[schema.fields.rounds-bound]
schema = "schema:integer"
required = true
description = "The declared round bound the loop is guarded against."

[schema.fields.rounds-spent]
schema = "schema:integer"
required = true
description = "Rounds evaluated, including the first draft's evaluation."

[[schema]]
id = "round-report"
description = "One round's rung-ladder evaluation, emitted by `ctx traits refine-round`."

[schema.fields.converged]
schema = "schema:boolean"
required = true
description = "Whether the candidate cleared every rung."

[schema.fields.diagnostics]
schema = "schema:any"
description = "Typed diagnostics from the failing rung; empty once converged."

[schema.fields.rung]
schema = "schema:text"
required = true
description = "The last rung evaluated: the failing rung, or the ladder's final rung once converged."

[[agent]]
id = "refiner"
description = "Produces source-anchored trait refinement scaffolds, then revises them against typed round diagnostics."
summary = "Trait refinement agent."

[prompt.produce-first]
text = """
Refine {port:source} at {port:source-path} for {port:change-request}. Preserve source identity, use {port:source-digest} as source evidence, and anchor every patch to real one-based inclusive lines in {port:source-path}.
Follow {resource:spec/design-rubric}: keep the derived kind honest, model dataflow only with declared ports and slots, and give every identifier a name that carries its meaning alone. Return exactly one complete refine scaffold JSON text with fields source-trait-id, source-digest, proposed-trait, and patches — nothing else."""
input = [
    "port:source",
    "port:source-path",
    "port:change-request",
    "port:source-digest",
    "resource:spec/design-rubric",
]
output = ["slot:candidate"]

[prompt.revise]
text = """
Round evaluation of the refinement for {port:change-request} failed at rung {slot:round-report}. Current candidate scaffold: {slot:candidate}.
Fix exactly what the diagnostics in {slot:round-report} name; never change the trait's identity or drop its procedure — refinement edits a trait, it does not swap or gut it. Keep everything else. Return the complete corrected refine scaffold JSON text only, nothing else."""
input = [
    "port:change-request",
    "slot:round-report",
    "slot:candidate",
]
output = ["slot:candidate"]

[[sequence.ctx-branch-arm-s-5-round-23-revise-if-not-converged-then.sequence]]
id = "revise"
title = "Revise the candidate against its round diagnostics (refiner)"
agent = "agent:refiner"
prompt = "prompt:revise"
input = [
    "port:change-request",
    "slot:round-report",
    "slot:candidate",
]
output = ["slot:candidate"]

[[sequence.round.sequence]]
id = "evaluate-round"
title = "Evaluate the candidate through the rung ladder"
input = [
    "port:source-path",
    "slot:candidate",
]
output = ["slot:round-report"]

[sequence.round.sequence.command]
argv = [
    "ctx",
    "traits",
    "refine-round",
    "{port:source-path}",
    "{slot:candidate}",
]
timeout-ms = 180000

[[sequence.round.sequence]]
id = "count-round"
title = "Advance the rounds-spent counter"
kind = "project"

[[sequence.round.sequence.projection]]
destination = "slot:rounds-spent"
operation = "increment"

[sequence.round.sequence.projection.source]
literal = 1

[[sequence.round.sequence.output]]
slot = "slot:rounds-spent"
operation = "increment"

[[sequence.round.sequence]]
id = "revise-if-not-converged"
title = "Revise If Not Converged"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-5-round-23-revise-if-not-converged-then"

[[sequence.round.sequence.when.not.any]]
slot = "slot:round-report"
field = "converged"
equals = true

[[sequence.round.sequence.when.not.any]]
slot = "slot:single-shot-flag"
equals = true

[procedure]
description = "Produce a refinement scaffold, evaluate it through the deterministic rung ladder, and revise within a declared round bound; the handler writes only a converged result. `single-shot` stops after exactly one round for the non-`--apply` preview path."
input = [
    "port:change-request",
    "port:single-shot",
    "port:source",
    "port:source-digest",
    "port:source-path",
]
output = ["port:result"]

[[procedure.sequence]]
id = "produce-first"
title = "Draft the refinement scaffold (refiner)"
agent = "agent:refiner"
prompt = "prompt:produce-first"
input = [
    "port:source",
    "port:source-path",
    "port:change-request",
    "port:source-digest",
    "resource:spec/design-rubric",
]
output = ["slot:candidate"]

[[procedure.sequence]]
id = "init-rounds-spent"
title = "Seed the rounds-spent counter"
kind = "project"
output = ["slot:rounds-spent"]

[[procedure.sequence.projection]]
destination = "slot:rounds-spent"

[procedure.sequence.projection.source]
literal = 0

[[procedure.sequence]]
id = "capture-single-shot"
title = "Capture the single-shot flag into a local slot"
input = ["port:single-shot"]
output = ["slot:single-shot-flag"]

[procedure.sequence.command]
argv = [
    "node",
    "--eval",
    "process.stdout.write(String(process.argv[1]))",
    "{port:single-shot}",
]

[[procedure.sequence]]
id = "guarded-loop"
title = "Guarded refine loop"
kind = "loop"
sequence = "sequence:round"
max-iterations = 3
on-exhausted = "continue"

[[procedure.sequence.until.any]]
slot = "slot:round-report"
field = "converged"
equals = true

[[procedure.sequence.until.any]]
slot = "slot:single-shot-flag"
equals = true

[[procedure.sequence]]
id = "derive-envelope"
title = "Assemble the terminal round-evidence envelope"
input = [
    "slot:round-report",
    "slot:candidate",
    "slot:rounds-spent",
]
output = ["slot:envelope"]

[procedure.sequence.command]
argv = [
    "node",
    "--input-type=module",
    "--eval",
    """
const [roundReportText, candidateText, roundsSpentText, roundsBoundText] = process.argv.slice(1);
const report = JSON.parse(roundReportText);
process.stdout.write(JSON.stringify({
    converged: report.converged,
    "rounds-spent": Number(roundsSpentText),
    "rounds-bound": Number(roundsBoundText),
    "failing-rung": report.converged ? undefined : report.rung,
    diagnostics: report.diagnostics ?? [],
    candidate: candidateText,
}));""",
    "{slot:round-report}",
    "{slot:candidate}",
    "{slot:rounds-spent}",
    "3",
]
