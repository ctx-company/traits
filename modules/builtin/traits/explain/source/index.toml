id = "explain-trait"
schema-version = "0.5"
version = "0.1.0"
name = "Explain Trait"
description = "Narrates a plain-language advisory explanation strictly grounded in a deterministic receipt-anchored scaffold."

[[dependency]]
alias = "spec"
id = "spec"
version = "0.1.0"

[dependency.source]
path = "../spec"

[metadata]
tag = [
    "first-party",
    "meta-trait",
    "explain",
]

[[port]]
id = "explanation"
direction = "output"
schema = "schema:explain-scaffold"
description = "Generated advisory explanation, echoing its grounding scaffold verbatim."
value = "slot:explain-trait"

[[port]]
id = "receipt-digest"
direction = "input"
schema = "schema:text"
description = "Digest of the check receipt the scaffold is grounded in."

[[port]]
id = "scaffold"
direction = "input"
schema = "schema:text"
description = "Deterministic explain-scaffold JSON text — the sole grounding evidence."

[[port]]
id = "source-trait-id"
direction = "input"
schema = "schema:text"
description = "Explained trait identity."

[[slot]]
id = "explain-trait"
schema = "schema:explain-scaffold"
description = "Runtime slot explain-trait."

[[schema]]
id = "explain-scaffold"

[schema.fields.explanation]
schema = "schema:text"
required = true

[schema.fields.receipt-digest]
schema = "schema:text"
required = true

[schema.fields.sections]
schema = "[schema:explain-section]"
required = true

[schema.fields.trait-id]
schema = "schema:text"
required = true

[schema.fields.warnings]
schema = "[schema:text]"
description = "Absent when the input scaffold carried none — never invented."

[[schema]]
id = "explain-section"
description = "One receipt-grounded explanation section, copied verbatim from the input scaffold."

[schema.fields.anchor]
schema = "schema:source-anchor"
required = true

[schema.fields.construct-ref]
schema = "schema:text"
required = true

[schema.fields.receipt-fact]
schema = "schema:text"
required = true

[schema.fields.receipt-section]
schema = "schema:text"
required = true

[schema.fields.title]
schema = "schema:text"
required = true

[[schema]]
id = "source-anchor"
description = "An exact one-based inclusive source-map location."

[schema.fields.end]
schema = "schema:number"
required = true

[schema.fields.file]
schema = "schema:text"
required = true

[schema.fields.start]
schema = "schema:number"
required = true

[[agent]]
id = "generator"
description = "Narrates a plain-language advisory explanation strictly grounded in a deterministic receipt-anchored scaffold."
summary = "Trait explanation narrator."

[prompt.explain-trait]
text = """
Narrate an explanation of trait {port:source-trait-id} at receipt {port:receipt-digest}. Use only the scaffold below, verbatim.
<<<SCAFFOLD>>>
{port:scaffold}
<<<END SCAFFOLD>>>

Return exactly one explain-scaffold object. Copy trait-id, receipt-digest, sections, and warnings from {port:scaffold} verbatim and unmodified — never alter, drop, or add a fact, anchor, or section. Add a non-empty explanation that narrates in plain language only what {port:scaffold}'s sections establish, using the vocabulary of {resource:spec/design-rubric} — derived kind, speech act, dataflow — so the narration names what the trait is. This is generated advisory text, not authority, a check receipt, or a substitute for the canonical trait. Do not claim runtime behavior or validation that the scaffold does not establish.

Return JSON matching schema:explain-scaffold, with no surrounding commentary."""
input = [
    "port:source-trait-id",
    "port:receipt-digest",
    "port:scaffold",
    "resource:spec/design-rubric",
]
output = ["slot:explain-trait"]

[procedure]
description = "Generate one untrusted plain-language narration strictly grounded in the supplied deterministic explain scaffold."
input = [
    "port:receipt-digest",
    "port:scaffold",
    "port:source-trait-id",
]
output = ["port:explanation"]

[[procedure.sequence]]
id = "explain-trait"
title = "Explain trait"
agent = "agent:generator"
prompt = "prompt:explain-trait"
input = [
    "port:source-trait-id",
    "port:receipt-digest",
    "port:scaffold",
    "resource:spec/design-rubric",
]
output = ["slot:explain-trait"]
