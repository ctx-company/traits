[package]
name = "ctx-traits-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "ctx.traits CLI: command parsing, output formatting, exit codes, and thin orchestration of core and IO."

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror.workspace = true
miette = { workspace = true, features = ["derive"] }
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
libc = "0.2"
base64.workspace = true
crossterm = "0.29"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
ctx-traits-core = { workspace = true, features = ["builtin-trait-packages"] }
ctx-traits-io.workspace = true
regex-lite.workspace = true

# Test/dev-only (P461): the Cargo-test replacement for the standalone
# `scripts/byte_compare.rs` proof harness. Never used by the `ctx` binary
# itself.
[dev-dependencies]
serial_test.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
# P477: `tests/support` is its own crate (not a `mod support;` included
# inline by each integration-test binary) specifically so a helper used by
# one proof suite but not another is not flagged as per-binary dead code —
# see `tests/support/Cargo.toml`'s description.
support = { path = "tests/support" }

[[bin]]
name = "ctx"
path = "src/app/bin/ctx.rs"

# Archive naming contract shared with .github/workflows/release.yml and
# Formula/ctx.rb: ctx-v{version}-{target}.tar.gz, containing the `ctx`
# binary at the archive root. `{ repo }` expands from workspace.package's
# `repository` (see Cargo.toml). This package is `publish = false`
# (unpublished path deps), so `cargo binstall` cannot resolve
# `ctx-traits-cli` from crates.io; this metadata only benefits a direct
# `cargo binstall --manifest-path modules/cli/Cargo.toml` invocation, or a
# future publish that carries this metadata forward.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ctx-v{ version }-{ target }.tar.gz"
bin-dir = "ctx"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]
