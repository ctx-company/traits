id = "generate-trait"
schema-version = "0.5"
version = "0.1.0"
name = "Generate Trait"
description = "Drives a bounded produce/evaluate loop that generates a trait candidate against the deterministic rung ladder, revising on its own typed diagnostics."

[[dependency]]
alias = "spec"
id = "spec"
version = "0.1.0"

[dependency.source]
path = "../spec"

[metadata]
tag = [
    "first-party",
    "meta-trait",
    "generation",
]

[[port]]
id = "brief"
direction = "input"
schema = "schema:text"
description = "Goal and constraints for the new trait."

[[port]]
id = "name"
direction = "input"
schema = "schema:text"
description = "Human-readable trait name."

[[port]]
id = "result"
direction = "output"
schema = "schema:generate-envelope"
description = "Terminal round-evidence envelope: convergence, rounds spent, failing rung, diagnostics, and the last candidate source."
value = "slot:envelope"

[[port]]
id = "trait-id"
direction = "input"
schema = "schema:text"
description = """Slugified trait ID the candidate must declare (`trait("<trait-id>", ...)`); also keys the round evaluator's scratch package."""

[[slot]]
id = "candidate-source"
schema = "schema:text"
description = "Current-round authoring source (TypeScript, @ctx-traits/cdk) for the trait under construction."

[[slot]]
id = "envelope"
schema = "schema:generate-envelope"
description = "Terminal round-evidence envelope."

[[slot]]
id = "round-report"
schema = "schema:round-report"
description = "Latest round's rung-ladder evaluation."

[[slot]]
id = "rounds-spent"
schema = "schema:number"
description = "Rounds evaluated so far, including the pre-loop first draft's evaluation."

[[schema]]
id = "generate-envelope"
description = "Terminal report the CLI handler drives its write-once/non-convergence decision from."

[schema.fields.candidate-source]
schema = "schema:text"
required = true
description = "The last candidate produced."

[schema.fields.converged]
schema = "schema:boolean"
required = true
description = "Whether the loop exited because a candidate converged."

[schema.fields.diagnostics]
schema = "schema:any"
description = "The last round's diagnostics; empty when converged."

[schema.fields.failing-rung]
schema = "schema:text"
description = "The rung the last round failed at; absent when converged."

[schema.fields.rounds-bound]
schema = "schema:integer"
required = true
description = "The declared round bound the loop is guarded against."

[schema.fields.rounds-spent]
schema = "schema:integer"
required = true
description = "Rounds evaluated, including the first draft's evaluation."

[[schema]]
id = "round-report"
description = "One round's rung-ladder evaluation, emitted by `ctx traits generate-round`."

[schema.fields.converged]
schema = "schema:boolean"
required = true
description = "Whether the candidate cleared every rung."

[schema.fields.diagnostics]
schema = "schema:any"
description = "Typed diagnostics from the failing rung; empty once converged."

[schema.fields.rung]
schema = "schema:text"
required = true
description = "The last rung evaluated: the failing rung, or the ladder's final rung once converged."

[[agent]]
id = "generator"
description = "Produces one complete trait draft from a concise authoring goal, then revises it against typed round diagnostics."
summary = "Trait draft generator."

[prompt.produce-first]
text = """

        Create exactly one complete trait authoring source in TypeScript, using the @ctx-traits/cdk builder, for {port:name} from {port:brief}. It must declare trait("{port:trait-id}", ...) with a non-empty procedure sequence — a candidate that compiles but declares no procedure never converges.
        Follow {resource:spec/design-rubric}: classify the material by what it says before choosing a shape, model dataflow only with declared ports and slots, and give every identifier a name that carries its meaning alone. Return the complete TypeScript source text only, nothing else."""
input = [
    "port:name",
    "port:brief",
    "port:trait-id",
    "resource:spec/design-rubric",
]
output = ["slot:candidate-source"]

[prompt.revise]
text = """

        Round evaluation of trait {port:trait-id} for {port:brief} failed at rung {slot:round-report}. Current candidate source: {slot:candidate-source}.
        Fix exactly what the diagnostics in {slot:round-report} name; keep everything else. Return the complete corrected TypeScript source text only, nothing else."""
input = [
    "port:trait-id",
    "port:brief",
    "slot:round-report",
    "slot:candidate-source",
]
output = ["slot:candidate-source"]

[[sequence.ctx-branch-arm-s-5-round-23-revise-if-not-converged-then.sequence]]
id = "revise"
title = "Revise the candidate against its round diagnostics (generator)"
agent = "agent:generator"
prompt = "prompt:revise"
input = [
    "port:trait-id",
    "port:brief",
    "slot:round-report",
    "slot:candidate-source",
]
output = ["slot:candidate-source"]

[[sequence.round.sequence]]
id = "evaluate-round"
title = "Evaluate the candidate through the rung ladder"
input = [
    "port:trait-id",
    "slot:candidate-source",
]
output = ["slot:round-report"]

[sequence.round.sequence.command]
argv = [
    "ctx",
    "traits",
    "generate-round",
    "{port:trait-id}",
    "{slot:candidate-source}",
]
timeout-ms = 180000

[[sequence.round.sequence]]
id = "count-round"
title = "Advance the rounds-spent counter"
kind = "project"

[[sequence.round.sequence.projection]]
destination = "slot:rounds-spent"
operation = "increment"

[sequence.round.sequence.projection.source]
literal = 1

[[sequence.round.sequence.output]]
slot = "slot:rounds-spent"
operation = "increment"

[[sequence.round.sequence]]
id = "revise-if-not-converged"
title = "Revise If Not Converged"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-5-round-23-revise-if-not-converged-then"

[sequence.round.sequence.when.not]
slot = "slot:round-report"
field = "converged"
equals = true

[procedure]
description = "Produce a trait candidate, evaluate it through the deterministic rung ladder, and revise within a declared round bound; the handler writes only a converged result."
input = [
    "port:brief",
    "port:name",
    "port:trait-id",
]
output = ["port:result"]

[[procedure.sequence]]
id = "produce-first"
title = "Draft the trait candidate (generator)"
agent = "agent:generator"
prompt = "prompt:produce-first"
input = [
    "port:name",
    "port:brief",
    "port:trait-id",
    "resource:spec/design-rubric",
]
output = ["slot:candidate-source"]

[[procedure.sequence]]
id = "init-rounds-spent"
title = "Seed the rounds-spent counter"
kind = "project"
output = ["slot:rounds-spent"]

[[procedure.sequence.projection]]
destination = "slot:rounds-spent"

[procedure.sequence.projection.source]
literal = 0

[[procedure.sequence]]
id = "guarded-loop"
title = "Guarded generate loop"
kind = "loop"
sequence = "sequence:round"
max-iterations = 3
on-exhausted = "continue"

[procedure.sequence.until]
slot = "slot:round-report"
field = "converged"
equals = true

[[procedure.sequence]]
id = "derive-envelope"
title = "Assemble the terminal round-evidence envelope"
input = [
    "slot:round-report",
    "slot:candidate-source",
    "slot:rounds-spent",
]
output = ["slot:envelope"]

[procedure.sequence.command]
argv = [
    "node",
    "--input-type=module",
    "--eval",
    """
const [roundReportText, candidateSourceText, roundsSpentText, roundsBoundText] = process.argv.slice(1);
const report = JSON.parse(roundReportText);
process.stdout.write(JSON.stringify({
    converged: report.converged,
    "rounds-spent": Number(roundsSpentText),
    "rounds-bound": Number(roundsBoundText),
    "failing-rung": report.converged ? undefined : report.rung,
    diagnostics: report.diagnostics ?? [],
    "candidate-source": candidateSourceText,
}));""",
    "{slot:round-report}",
    "{slot:candidate-source}",
    "{slot:rounds-spent}",
    "3",
]
