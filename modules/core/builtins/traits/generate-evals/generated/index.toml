id = "generate-evals"
schema-version = "0.4"
version = "0.1.0"
name = "Generate Evals"
description = "Proposes source-grounded scenarios and deferred behavioral/runtime eval declarations."

[[dependency]]
alias = "trait-spec"
id = "trait-spec"
version = "0.1.0"

[dependency.source]
path = "../trait-spec"

[metadata]
tag = ["first-party", "meta-trait", "eval-generation"]

[[port]]
id = "source"
direction = "input"
schema = "schema:text"
description = "Canonical source trait text."

[[port]]
id = "source-trait-id"
direction = "input"
schema = "schema:text"
description = "Source trait identity."

[[port]]
id = "source-digest"
direction = "input"
schema = "schema:text"
description = "Source trait digest."

[[port]]
id = "io-contract"
direction = "input"
schema = "schema:text"
description = "Serialized source trait I/O contract."

[[port]]
id = "eval-synthesis"
direction = "output"
schema = "schema:eval-synthesis-scaffold"
description = "Eval synthesis scaffold."
value = "slot:generate-evals"

[[slot]]
id = "generate-evals"
schema = "schema:eval-synthesis-scaffold"
description = "Runtime slot generate-evals."

[[schema]]
id = "scenario"

[schema.fields.id]
schema = "schema:text"
required = true

[schema.fields.input]
schema = "schema:text"
required = true

[schema.fields.output]
schema = "schema:text"
required = true

[schema.fields.variant]
schema = "schema:text"
required = true

[[schema]]
id = "eval-proposal"

[schema.fields.id]
schema = "schema:text"
required = true

[schema.fields.input]
schema = "schema:text"
required = true

[schema.fields.output]
schema = "schema:text"
required = true

[schema.fields.scenario]
schema = "schema:any"
required = true

[schema.fields.variant]
schema = "schema:text"
required = true

[[schema]]
id = "eval-synthesis-scaffold"

[schema.fields.evals]
schema = "[schema:eval-proposal]"
required = true

[schema.fields.scenarios]
schema = "[schema:scenario]"
required = true

[schema.fields.source-digest]
schema = "schema:text"
required = true

[schema.fields.source-trait-id]
schema = "schema:text"
required = true

[[agent]]
id = "generator"
description = "Proposes deferred eval declarations."
summary = "Eval synthesis author."

[prompt.generate-evals]
text = """
Read {port:source} and its I/O contract {port:io-contract}.

Return exactly one eval-synthesis scaffold for {port:source-trait-id} using {port:source-digest}. Propose positive, negative, and edge scenarios where justified. Scenarios are specifications, not evidence. Every eval must use only behavioral or runtime, link scenarios through canonical singular scenario (a scalar or array), and use only render:, fixture:, trait:, or report: input/output refs. Behavioral and runtime executors are deferred; do not claim they ran. Ground proposals in {resource:trait-spec/agent-traits-schema} and {resource:trait-spec/design-rubric}.

Return JSON matching schema:eval-synthesis-scaffold, with no surrounding commentary."""
input = [
  "port:source",
  "port:io-contract",
  "port:source-trait-id",
  "port:source-digest",
  "resource:trait-spec/agent-traits-schema",
  "resource:trait-spec/design-rubric",
]
output = ["slot:generate-evals"]

[procedure]
description = "Generate untrusted declarations; the CLI merges and checks the complete candidate trait."
input = ["port:source", "port:source-trait-id", "port:source-digest", "port:io-contract"]
output = ["port:eval-synthesis"]

[[procedure.sequence]]
id = "generate-evals"
title = "Generate eval declarations"
agent = "agent:generator"
prompt = "prompt:generate-evals"
input = [
  "port:source",
  "port:io-contract",
  "port:source-trait-id",
  "port:source-digest",
  "resource:trait-spec/agent-traits-schema",
  "resource:trait-spec/design-rubric",
]
output = ["slot:generate-evals"]
