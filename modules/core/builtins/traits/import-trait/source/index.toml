id = "import-trait"
schema-version = "0.5"
version = "0.1.0"
name = "Import Trait"
description = "Drives a bounded produce/evaluate loop that enriches a deterministic import scaffold with source-grounded trait content, converging toward the imported contract: builds and checks clean while remaining recognizably the scaffold baseline."

[[dependency]]
alias = "spec"
id = "spec"
version = "0.1.0"

[dependency.source]
path = "../spec"

[metadata]
tag = [
    "first-party",
    "meta-trait",
    "import",
]

[[port]]
id = "result"
direction = "output"
schema = "schema:import-envelope"
description = "Terminal round-evidence envelope: convergence, rounds spent, failing rung, diagnostics, and the last candidate trait draft."
value = "slot:envelope"

[[port]]
id = "scaffold"
direction = "input"
schema = "schema:text"
description = "Deterministic import scaffold (trait.toml text) to use as the authoritative baseline."

[[port]]
id = "source"
direction = "input"
schema = "schema:text"
description = "Raw source text (e.g. SKILL.md) to ground enrichment in."

[[port]]
id = "source-profile"
direction = "input"
schema = "schema:text"
description = "Profile describing the source format and its known fields."

[[port]]
id = "target-schema"
direction = "input"
schema = "schema:text"
description = "Target canonical schema (agent-traits/canonical-trait) the draft must conform to."

[[port]]
id = "trait-id"
direction = "input"
schema = "schema:text"
description = "Trait id the imported package must keep; also keys the round evaluator's scratch package and the persisted baseline it converges against."

[[slot]]
id = "candidate"
schema = "schema:text"
description = "Current-round trait draft JSON text: {trait: <canonical-trait-draft>}."

[[slot]]
id = "envelope"
schema = "schema:import-envelope"
description = "Terminal round-evidence envelope."

[[slot]]
id = "round-report"
schema = "schema:round-report"
description = "Latest round's rung-ladder evaluation."

[[slot]]
id = "rounds-spent"
schema = "schema:number"
description = "Rounds evaluated so far, including the pre-loop first draft's evaluation."

[[schema]]
id = "import-envelope"
description = "Terminal report the CLI handler drives its write-once/non-convergence decision from."

[schema.fields.candidate]
schema = "schema:text"
required = true
description = "The last candidate trait draft JSON text produced."

[schema.fields.converged]
schema = "schema:boolean"
required = true
description = "Whether the loop exited because a candidate converged."

[schema.fields.diagnostics]
schema = "schema:any"
description = "The last round's diagnostics; empty when converged."

[schema.fields.failing-rung]
schema = "schema:text"
description = "The rung the last round failed at; absent when converged."

[schema.fields.rounds-bound]
schema = "schema:integer"
required = true
description = "The declared round bound the loop is guarded against."

[schema.fields.rounds-spent]
schema = "schema:integer"
required = true
description = "Rounds evaluated, including the first draft's evaluation."

[[schema]]
id = "round-report"
description = "One round's rung-ladder evaluation, emitted by `ctx traits import-round`."

[schema.fields.converged]
schema = "schema:boolean"
required = true
description = "Whether the candidate cleared every rung."

[schema.fields.diagnostics]
schema = "schema:any"
description = "Typed diagnostics from the failing rung; empty once converged."

[schema.fields.rung]
schema = "schema:text"
required = true
description = "The last rung evaluated: the failing rung, or the ladder's final rung once converged."

[[agent]]
id = "generator"
description = "Enriches a deterministic import scaffold with source-grounded trait content, then revises it against typed round diagnostics."
summary = "Trait import enrichment agent."

[prompt.produce-first]
text = """

        Treat {port:scaffold} as the authoritative baseline for trait {port:trait-id}, imported from a {port:source-profile} source. Preserve trait identity and import provenance exactly as given in {port:scaffold}. Enrich only intent, behavior, metadata, and descriptions that {port:source} actually supports; never invent claims the source does not make.
        Conform to {port:target-schema}, following {resource:spec/design-rubric} — classify the imported material by what it says rather than inventing runtime behavior for it, and name every identifier so it reads alone. Return exactly one complete trait draft JSON text — a single trait field holding the canonical trait draft — nothing else."""
input = [
    "port:scaffold",
    "port:trait-id",
    "port:source-profile",
    "port:source",
    "port:target-schema",
    "resource:spec/design-rubric",
]
output = ["slot:candidate"]

[prompt.revise]
text = """

        Round evaluation of the import for trait {port:trait-id} failed at rung {slot:round-report}. Current candidate draft: {slot:candidate}.
        Fix exactly what the diagnostics in {slot:round-report} name; never invent claims {port:source} does not make, and never drop a declaration the {port:scaffold} baseline established — enrichment adds, it never deletes. Keep everything else. Return the complete corrected trait draft JSON text only, nothing else."""
input = [
    "port:trait-id",
    "slot:round-report",
    "slot:candidate",
    "port:source",
    "port:scaffold",
]
output = ["slot:candidate"]

[[sequence.ctx-branch-arm-s-5-round-23-revise-if-not-converged-then.sequence]]
id = "revise"
title = "Revise the candidate against its round diagnostics (generator)"
agent = "agent:generator"
prompt = "prompt:revise"
input = [
    "port:trait-id",
    "slot:round-report",
    "slot:candidate",
    "port:source",
    "port:scaffold",
]
output = ["slot:candidate"]

[[sequence.round.sequence]]
id = "evaluate-round"
title = "Evaluate the candidate through the rung ladder"
input = [
    "port:trait-id",
    "slot:candidate",
]
output = ["slot:round-report"]

[sequence.round.sequence.command]
argv = [
    "ctx",
    "traits",
    "import-round",
    "{port:trait-id}",
    "{slot:candidate}",
]
timeout-ms = 180000

[[sequence.round.sequence]]
id = "count-round"
title = "Advance the rounds-spent counter"
kind = "project"

[[sequence.round.sequence.projection]]
destination = "slot:rounds-spent"
operation = "increment"

[sequence.round.sequence.projection.source]
literal = 1

[[sequence.round.sequence.output]]
slot = "slot:rounds-spent"
operation = "increment"

[[sequence.round.sequence]]
id = "revise-if-not-converged"
title = "Revise If Not Converged"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-5-round-23-revise-if-not-converged-then"

[sequence.round.sequence.when.not]
slot = "slot:round-report"
field = "converged"
equals = true

[procedure]
description = "Produce a trait draft grounded in the deterministic scaffold and raw source, evaluate it through the deterministic rung ladder (with a baseline-retention rung the draft must never cross), and revise within a declared round bound; the handler writes only a converged result."
input = [
    "port:scaffold",
    "port:source",
    "port:source-profile",
    "port:target-schema",
    "port:trait-id",
]
output = ["port:result"]

[[procedure.sequence]]
id = "produce-first"
title = "Draft the trait candidate (generator)"
agent = "agent:generator"
prompt = "prompt:produce-first"
input = [
    "port:scaffold",
    "port:trait-id",
    "port:source-profile",
    "port:source",
    "port:target-schema",
    "resource:spec/design-rubric",
]
output = ["slot:candidate"]

[[procedure.sequence]]
id = "init-rounds-spent"
title = "Seed the rounds-spent counter"
kind = "project"
output = ["slot:rounds-spent"]

[[procedure.sequence.projection]]
destination = "slot:rounds-spent"

[procedure.sequence.projection.source]
literal = 0

[[procedure.sequence]]
id = "guarded-loop"
title = "Guarded import loop"
kind = "loop"
sequence = "sequence:round"
max-iterations = 3
on-exhausted = "continue"

[procedure.sequence.until]
slot = "slot:round-report"
field = "converged"
equals = true

[[procedure.sequence]]
id = "derive-envelope"
title = "Assemble the terminal round-evidence envelope"
input = [
    "slot:round-report",
    "slot:candidate",
    "slot:rounds-spent",
]
output = ["slot:envelope"]

[procedure.sequence.command]
argv = [
    "node",
    "--input-type=module",
    "--eval",
    """
const [roundReportText, candidateText, roundsSpentText, roundsBoundText] = process.argv.slice(1);
const report = JSON.parse(roundReportText);
process.stdout.write(JSON.stringify({
    converged: report.converged,
    "rounds-spent": Number(roundsSpentText),
    "rounds-bound": Number(roundsBoundText),
    "failing-rung": report.converged ? undefined : report.rung,
    diagnostics: report.diagnostics ?? [],
    candidate: candidateText,
}));""",
    "{slot:round-report}",
    "{slot:candidate}",
    "{slot:rounds-spent}",
    "3",
]
