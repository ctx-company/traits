id = "test-writer"
schema-version = "0.2"
version = "0.1.0"
name = "Test Writer"
summary = "Proposes a structured test plan for a piece of code against stated requirements."

[metadata]
tag = [
    "template",
    "testing",
]

[[port]]
id = "target-code"
direction = "input"
schema = "schema:text"
description = "The code to write a test plan for."

[[port]]
id = "requirements"
direction = "input"
schema = "schema:text"
description = "The behavior the code must satisfy, e.g. acceptance criteria or a spec excerpt."

[[port]]
id = "plan"
direction = "output"
schema = "schema:test-plan"
description = "Structured proposed test plan."
value = "slot:plan"

[[slot]]
id = "plan"
schema = "schema:test-plan"
description = "The proposed test plan for the target code."

[[schema]]
id = "proposed-test-case"
description = "One proposed test case: what it sets up and what it asserts."

[schema.fields.assertion]
schema = "schema:text"
required = true

[schema.fields.name]
schema = "schema:text"
required = true

[schema.fields.setup]
schema = "schema:text"
required = true

[[schema]]
id = "test-plan"
description = "A structured test plan: proposed cases plus any requirements the plan can't cover."

[schema.fields.cases]
schema = "[schema:proposed-test-case]"
required = true

[schema.fields.coverage-gaps]
schema = "[schema:text]"
required = true

[[agent]]
id = "test-writer"
description = "Proposes a structured test plan for a piece of code against stated requirements."
summary = "Test plan writer."

[prompt.write-plan]
text = "Propose a test plan for {port:target-code} against the requirements {port:requirements}. Return exactly one structured plan: one case per behavior worth testing (name, setup, and the assertion it makes), plus a list of any requirements the proposed cases don't cover. Do not write the actual test code — describe the cases."
input = [
    "port:target-code",
    "port:requirements",
]
output = ["slot:plan"]

[procedure]
description = "Propose a test plan for the target code against the stated requirements."
input = [
    "port:target-code",
    "port:requirements",
]
output = ["port:plan"]

[[procedure.sequence]]
id = "write-plan"
title = "Write the test plan"
agent = "agent:test-writer"
prompt = "prompt:write-plan"
input = [
    "port:target-code",
    "port:requirements",
]
output = ["slot:plan"]
