id = "research-summarize"
schema-version = "0.4"
version = "0.1.0"
name = "Research Summarize"
description = "Summarizes a research question against supplied source material into key findings, open questions, and citations."

[metadata]
tag = ["template", "research"]

[[port]]
id = "question"
direction = "input"
schema = "schema:text"
description = "The research question to answer."

[[port]]
id = "sources"
direction = "input"
schema = "schema:text"
description = "The source material to summarize, e.g. pasted excerpts or search results."

[[port]]
id = "summary"
direction = "output"
schema = "schema:research-summary"
description = "Structured research summary."
value = "slot:summarize"

[[slot]]
id = "summarize"
schema = "schema:research-summary"
description = "Runtime slot summarize."

[[schema]]
id = "research-summary"
description = "A structured research summary: what was found, what remains open, and what it's sourced from."

[schema.fields.citations]
schema = "[schema:text]"
required = true

[schema.fields.key-findings]
schema = "[schema:text]"
required = true

[schema.fields.open-questions]
schema = "[schema:text]"
required = true

[[agent]]
id = "researcher"
description = "Summarizes source material against a research question, citing exactly what it read."
summary = "Research summarizer."

[prompt.summarize]
text = """
Answer {port:question} using only {port:sources}.

Return exactly one structured summary: a list of key findings, a list of open questions the sources leave unanswered, and a list of citations identifying which part of the source material backs each finding. Do not use outside knowledge the sources don't support.

Return JSON matching schema:research-summary, with no surrounding commentary."""
input = ["port:question", "port:sources"]
output = ["slot:summarize"]

[procedure]
description = "Answer a research question from supplied source material with a structured, cited summary."
input = ["port:question", "port:sources"]
output = ["port:summary"]

[[procedure.sequence]]
id = "summarize"
title = "Summarize the sources"
agent = "agent:researcher"
prompt = "prompt:summarize"
input = ["port:question", "port:sources"]
output = ["slot:summarize"]
