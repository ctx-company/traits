id = "pr-description"
schema-version = "0.4"
version = "0.1.0"
name = "PR Description"
description = "Writes a structured pull-request description — title, summary, testing notes, and risk — from a diff and its context."

[metadata]
tag = ["template", "pull-request"]

[[port]]
id = "diff"
direction = "input"
schema = "schema:text"
description = "The diff the pull request contains."

[[port]]
id = "context"
direction = "input"
schema = "schema:text"
description = "Why the change is being made, e.g. the linked issue or task."

[[port]]
id = "description"
direction = "output"
schema = "schema:pr-description"
description = "Structured pull-request description."
value = "slot:write-description"

[[slot]]
id = "write-description"
schema = "schema:pr-description"
description = "Runtime slot write-description."

[[schema]]
id = "pr-risk"
schema = "schema:text"
allowed = ["low", "medium", "high"]

[[schema]]
id = "pr-description"
description = "A structured pull-request description: title, summary, testing notes, and risk level."

[schema.fields.risk]
schema = "schema:pr-risk"
required = true

[schema.fields.summary]
schema = "schema:text"
required = true

[schema.fields.testing-notes]
schema = "schema:text"
required = true

[schema.fields.title]
schema = "schema:text"
required = true

[[agent]]
id = "writer"
description = "Writes a pull-request description from a diff and its context."
summary = "PR description writer."

[prompt.write-description]
text = """
Write a pull-request description for {port:diff}, given the context {port:context}.

Return exactly one structured description: a short title, a summary of what changed and why, testing notes describing how the change was or should be validated, and a risk level of low, medium, or high.

Return JSON matching schema:pr-description, with no surrounding commentary."""
input = ["port:diff", "port:context"]
output = ["slot:write-description"]

[procedure]
description = "Write a structured pull-request description from a diff and its context."
input = ["port:diff", "port:context"]
output = ["port:description"]

[[procedure.sequence]]
id = "write-description"
title = "Write the description"
agent = "agent:writer"
prompt = "prompt:write-description"
input = ["port:diff", "port:context"]
output = ["slot:write-description"]
