[workspace]
resolver = "3"
members = ["."]

[package]
name = "ctx-traits-desktop"
# This crate can't inherit the root workspace's version (it's excluded from
# it), so bumping the root version does not bump this one automatically. It
# has no effect on which center this connects to — that socket is scoped by
# ctx-traits-io's own CARGO_PKG_VERSION — but keep it in step by hand so it
# doesn't silently drift into a misleading label.
version = "0.4.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Oskar Cieslik"]
license = "Apache-2.0"
repository = "https://github.com/ctx-company/traits"
publish = false

[[bin]]
name = "ctx-desktop"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
ctx-traits-core = { path = "../modules/core" }
ctx-traits-io = { path = "../modules/io" }
async-channel = "2"
camino = "1"

[dev-dependencies]
serde_json = "1"
# gpui's own #[gpui::test]/TestAppContext harness lives behind this feature.
# It is dev-only — the shipped `ctx-desktop` binary still links plain gpui —
# and is the one way to prove the spawn form's keyboard focus survives a real
# gpui key-dispatch + rerender cycle rather than only a plain-Rust model of it.
gpui = { version = "0.2.2", features = ["test-support"] }
