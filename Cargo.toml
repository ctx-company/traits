[workspace]
resolver = "3"
members = [
  "modules/core",
  "modules/io",
  "modules/cli",
  "modules/wasm-core",
  "modules/wasm-plugin",
  "modules/cli/tests/fixture-agent",
]
exclude = ["packages/cdk"]

[workspace.package]
version = "0.2.4"
edition = "2024"
# Matches the rust-toolchain.toml pin: the only compiler this workspace is
# actually built and gated on. The previous 1.85.0 was a claim nothing checked
# and nothing could satisfy — let-chains alone need 1.88.
rust-version = "1.97.1"
authors = ["Oskar Cieslik"]
license = "Apache-2.0"
repository = "https://github.com/ctx-company/traits"
publish = false

[workspace.dependencies]
base64 = "0.23"
camino = "1"
derive_more = { version = "2", features = ["display", "from", "into"] }
flate2 = "1"
globset = "0.4"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
miette = "7"
regex-lite = "0.1"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serial_test = "3"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"
ureq = "3"
zip = { version = "7.2.0", default-features = false }

ctx-traits-core = { path = "modules/core" }
ctx-traits-io = { path = "modules/io" }
ctx-traits-cli = { path = "modules/cli" }
ctx-traits-wasm-core = { path = "modules/wasm-core" }
ctx-traits-wasm-plugin = { path = "modules/wasm-plugin" }
