[package]
id = "plan"
version = "0.4.0"
name = "Plan"
status = "ready"

[family]
default = "default"

[family.variant]

[family.variant.default]
path = "generated/default/index.toml"
aliases = ["plan-default"]

[family.variant.direct]
path = "generated/direct/index.toml"
aliases = ["plan-direct"]

[family.variant.quick]
path = "generated/quick/index.toml"
aliases = ["plan-quick"]

[family.variant.complex]
path = "generated/complex/index.toml"
aliases = ["plan-complex"]

[publish]
name = "@ctx-traits/plan"
access = "public"

[budget]
max-frames = 20
frame-seconds = 1200
total-seconds = 3600
max-retries = 3
idle-seconds = 1200
