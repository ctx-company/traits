id = "plan"
schema-version = "0.4"
version = "0.4.0"
name = "Plan"
description = "Turn a described task into codebase-grounded, house-format task files in .internal/tasks/ — the board the implement family runs from in any repo."
summary = "Turn a described task into codebase-grounded, house-format task files in .internal/tasks/ — the board the implement family runs from in any repo."
variant = "default"

[metadata]
tag = [
    "task",
    "plan",
    "bootstrap",
    "planning",
]

[[intent.focus]]
id = "specific"

[[intent.focus]]
id = "correctness"

[[intent.avoid]]
id = "speculative-claim"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = "The task you describe, in your own words — rough is fine."

[[port]]
id = "written-files"
direction = "output"
schema = "schema:text"
description = "Paths of the task files written under .internal/tasks/."
value = "slot:result"

[[slot]]
id = "grounding"
schema = "schema:text"
description = "Codebase grounding for the described work: the concrete files and modules it touches, the repo's validation gates (exact commands), and the invariants, rules, and constraints the task files must honor."
hint = "Grounded in the codebase: what the project is, its build/test/lint gates (exact invocations), architectural invariants, dependency rules, and constraints an implementer and reviewer must honor. Context the tasks carry, not the step-by-step plan."

[[slot]]
id = "result"
schema = "schema:text"
description = "Confirmation of the task files written (paths)."

[[slot]]
id = "task-files"
schema = "schema:text"
description = "The house-format task file(s) to add to .internal/tasks/ — one or more standalone, dependency-ordered markdown tasks."
hint = "Each task: '# NNNN — <title>' placeholder heading, a Status/Raised line, a grounded body, optional '## Watch' hazards, and a verifiable '## Done when'."

[[agent]]
id = "scribe"
description = "Writes the task files to .internal/tasks/."
summary = "Bootstrap-writer role."

[[agent]]
id = "smart-1"
description = "Strong model: refines the task, grounds it in the codebase, and splits it into task files."
summary = "Refinement + grounding role."

[prompt.refine-task]
text = """

            Task is described as: {port:task}, ground it in the codebase & refine it.
            Read the relevant parts of the repository with your tools:
                - identify the concrete files, modules, and patterns the task touches
                - the build/test/lint commands (the repo's validation gates, with exact invocations)
                - architectural invariants and requirements
                - dependencies or rules that need to be respected
            Produce the grounding notes:
                - short project/context overview,
                - rules and invariants an implementer and reviewer must honor,
                - validation gates (exact commands)
                - constraints specific to this task.
            This is the context the task files carry, not the step-by-step plan.
            Do not implement anything."""
input = ["port:task"]
output = ["slot:grounding"]

[prompt.split]
text = """
Task format doctrine: Format each task as one standalone Markdown file for .internal/tasks/: a "# NNNN — <short title>"
    heading (leave NNNN as a placeholder; the write step assigns the real number), then a "**Status:**
    ready to implement · **Raised:** <date>" line, then a body grounding the task in concrete detail, then an
    optional "## Watch" section naming hazards and constraints an implementer must not trip, and a closing
    "## Done when" section stating the observable, verifiable condition proving the task is complete. Size every
    task to roughly 10-15 minutes of focused agent work — small enough to finish in one short pass; if a task
    would be larger, split it into several files. Order tasks so each depends only on earlier ones, and name any
    prerequisite task explicitly in the body.
            The work, as described: {port:task}
            Grounding notes: {slot:grounding}
            Break the refined work into small, ordered task files.
            Fold the grounding each task needs — its files, gates, invariants, constraints — into that task's own body and Watch section, so every file stands alone.
            Do not implement anything."""
input = [
    "port:task",
    "slot:grounding",
]
output = ["slot:task-files"]

[prompt.write]
text = """

                    Write each task below to .internal/tasks/ at the repo root, one file per task.
                    Tasks: {slot:task-files}
                    Create the directory if missing. List the directory first and continue its numbering: name each new file NNNN-<kebab-slug>.md, where NNNN is the next free zero-padded number after the highest one already present (count archived/ too), and stamp that number into the task's own heading in place of its placeholder. Fill the Raised date from today's date.
                    Never overwrite or renumber an existing file. Keep each task's content faithful — do not add or drop material.
                    Return one line per file naming the path you wrote."""
input = ["slot:task-files"]
output = ["slot:result"]

[procedure]
description = "Refine the described task against the codebase, split it into small task files, and write them to .internal/tasks/ so the implement family can run."
input = ["port:task"]
output = ["port:written-files"]

[[procedure.sequence]]
id = "refine-task"
title = "Ground & refine the task in the codebase"
agent = "agent:smart-1"
prompt = "prompt:refine-task"
input = ["port:task"]
output = ["slot:grounding"]

[[procedure.sequence]]
id = "split"
title = "Split the work into task files"
agent = "agent:smart-1"
prompt = "prompt:split"
input = [
    "port:task",
    "slot:grounding",
]
output = ["slot:task-files"]

[[procedure.sequence]]
id = "write"
title = "Write the task files (scribe)"
agent = "agent:scribe"
prompt = "prompt:write"
input = ["slot:task-files"]
output = ["slot:result"]
