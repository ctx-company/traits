[package]
id = "plan"
version = "0.3.0"
name = "Plan"
status = "ready"

[family]
default = "default"

[family.leaf]

[family.leaf.default]
path = "generated/default/index.toml"
aliases = ["plan-default"]
run-config = "run-config/default.toml"

[family.leaf.direct]
path = "generated/direct/index.toml"
aliases = ["plan-direct"]

[family.leaf.quick]
path = "generated/quick/index.toml"
aliases = ["plan-quick"]

[family.leaf.complex]
path = "generated/complex/index.toml"
aliases = ["plan-complex"]

[publish]
name = "@ctx-traits/plan"
access = "public"
