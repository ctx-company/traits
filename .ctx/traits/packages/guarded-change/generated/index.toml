id = "guarded-change"
schema-version = "0.2"
version = "0.1.0"
name = "Guarded Change"
summary = "Implement a requested change across two model families, gated by the project's own tests and a typed two-reviewer approval, then commit — with a receipt."

[[dependency]]
alias = "engineering-standards"
id = "engineering-standards"
version = "0.1.0"

[dependency.source]
path = "../engineering-standards"

[metadata]
tag = [
    "first-party",
    "implementation",
    "review",
    "multi-agent",
]

[[intent.require]]
id = "review-before-final"

[[intent.require]]
id = "gates-green-before-commit"

[[intent.require]]
id = "bounded-refinement"

[[intent.require]]
id = "role-attributed-output"

[[intent.avoid]]
id = "unbounded-loop"

[[intent.avoid]]
id = "rubber-stamp-review"

[[intent.avoid]]
id = "weaken-tests-to-pass"

[[intent.avoid]]
id = "taste-only-blocking"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "change-request"
direction = "input"
schema = "schema:text"
description = "The change to make, in plain language — a bug to fix, a feature to add, a refactor to perform."

[[port]]
id = "target"
direction = "input"
schema = "schema:text"
description = "Where the change applies — the repository path, module, or area the request concerns."

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
description = "Final commit evidence from the git commit command step."
value = "slot:commit-output"

[[slot]]
id = "scope-brief"
schema = "schema:text"
description = "The request and target distilled into concrete scope + acceptance criteria; later steps work from this instead of re-reading the raw inputs."
hint = "What the change must accomplish, how we will know it is done, and the files/areas it touches."

[[slot]]
id = "draft"
schema = "schema:text"
description = "smart-1's implementation draft for the change."
hint = "Scope, files to touch, approach, validation plan (including the test that must fail first), risks. A plan, not an implementation."

[[slot]]
id = "reviewed-draft"
schema = "schema:text"
description = "smart-2's full replacement draft — the contract the worker implements."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's report of the implemented state and gate results; revised in place after each refinement pass."
hint = "What changed (files), the exact gate commands run and their result, and open concerns."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Scribe's commit message for the approved change; also saved to .git/CTX_COMMITMSG for the commit command step."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git staging command step."

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "smart-1's refinement verdict for the current work state."

[[slot]]
id = "review-verdict-2"
schema = "schema:review-verdict"
description = "smart-2's refinement verdict for the current work state."

[[resource]]
id = "review-rubric"
path = "resources/review-rubric.md"
hint = "The rubric reviewers score every change against; agents read this file with their own tools."
trigger = "on-activation"

[[resource]]
id = "done-checklist"
path = "resources/done-checklist.md"
hint = "The definition of done the commit message is grounded in; agents read this file with their own tools."
trigger = "on-activation"

[[schema]]
id = "decision"
schema = "schema:text"
allowed = [
    "approved",
    "revise",
]

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks only on blockers, so taste and cosmetics do not cause churn; status is revise if and only if a blocking defect remains."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: naming, structure, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "schema:text"
description = "The blocking defects that must be fixed before merge: a correctness bug, a failing gate, a standards violation, or work the request did not ask for. Present when status is revise; empty or absent when approved."

[schema.fields.status]
schema = "schema:decision"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise when at least one blocking defect remains. Set to approved if and only if blockers is empty."

[[agent]]
id = "clerk"
description = "Fast extraction model: distils the change request and target into a scope brief, so no later step re-reads the raw inputs."
summary = "Context-extraction role."

[[agent]]
id = "smart-1"
description = "Strong drafting model: turns the scope brief into an implementation draft, and reviews the work in the refinement loop."
summary = "Drafting and first reviewer role."

[[agent]]
id = "smart-2"
description = "Strong review model: rewrites the draft to a higher standard, and reviews the work in the refinement loop."
summary = "Draft-rewriting and second reviewer role."

[[agent]]
id = "worker"
description = "Implements the reviewed draft, runs the project's own gates, and applies reviewer fixes."
summary = "Implementation role."

[[agent]]
id = "scribe"
description = "Writes the commit message for the approved change; git staging and committing run as command steps."
summary = "Commit-message role."

[prompt.apply-fixes]
text = """

                            Apply the reviewer findings for the change in {slot:scope-brief}: {slot:review-verdict-1} and {slot:review-verdict-2}.
                            Fix every BLOCKER named in either verdict — those are mandatory to merge. Address advisory notes only when the fix is cheap and safe; leaving advisory items for later is acceptable and never a blocker.
                            Where the two reviews conflict, prefer correctness and the standards {resource:engineering-standards/coding-standards}.
                            Re-run the project's gates. Then return the full updated work summary replacing {slot:work-summary}: what changed (files), the gate commands and their result, open concerns."""
input = [
    "slot:scope-brief",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
    "slot:work-summary",
    "resource:engineering-standards/coding-standards",
]
output = ["slot:work-summary"]

[prompt.commit-message]
text = """

                    The refinement loop for the change in {slot:scope-brief} has ended and the change is being committed. The final reviewer verdicts are {slot:review-verdict-1} and {slot:review-verdict-2} — read their status fields FIRST. The loop exits early once both approve, so a verdict still set to revise means the rounds ran out with that reviewer unsatisfied: say so plainly rather than implying a clean approval.
                    Write a concise commit message grounded in the done-checklist {resource:done-checklist} and those verdicts: a short subject line naming the change, then a one-paragraph summary of what the verdicts certify changed and how it was validated.
                    If either verdict status is revise, end the message with an "Unresolved reviewer blockers:" section listing each open blocker in one line — the honest record that the budget ran out before the reviewers were satisfied. Never write that section when there are none.
                    Save exactly that message to the file .git/CTX_COMMITMSG at the repo root (create or overwrite it), and return the same message as your output.
                    Do not run any git commands; staging and committing happen in later runtime steps."""
input = [
    "slot:scope-brief",
    "resource:done-checklist",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
]
output = ["slot:commit-message"]

[prompt.draft]
text = """

                    Create an implementation draft for the change described in {slot:scope-brief}.
                    Hold it to the shared standards {resource:engineering-standards/coding-standards} and the review rubric {resource:review-rubric}.
                    The draft must cover: scope (exactly what the request asks, nothing more), files to touch, approach, the validation plan (which of the project's own tests/build/lint prove it — including a test that fails before the change and passes after), and risks.
                    Reference files by path; do not inline documents. Do not implement anything yet."""
input = [
    "slot:scope-brief",
    "resource:engineering-standards/coding-standards",
    "resource:review-rubric",
]
output = ["slot:draft"]

[prompt.implement]
text = """

                    Implement the change in {slot:scope-brief} following the agreed draft {slot:reviewed-draft}.
                    Hold to the shared standards {resource:engineering-standards/coding-standards}: never weaken or delete a test to pass, add no unjustified dependency, keep the diff scoped to the request.
                    Run the project's own gates — its tests, build, and linter — with your tools before reporting; include a test that fails before your change and passes after it.
                    Return a work summary: what changed (files), the exact gate commands you ran and their result, and any open concern."""
input = [
    "slot:scope-brief",
    "slot:reviewed-draft",
    "resource:engineering-standards/coding-standards",
]
output = ["slot:work-summary"]

[prompt.review-1]
text = """

                            Review the implemented work for the change in {slot:scope-brief} against the agreed draft {slot:reviewed-draft}. Current work summary: {slot:work-summary}.
                            Consult the standards {resource:engineering-standards/coding-standards} and the review guidance {resource:engineering-standards/review-guidance}, score against the rubric {resource:review-rubric}, and inspect the actual working tree with your tools — never review the summary alone; re-run the project's gates if the summary does not prove they pass.
                            Classify every finding by severity per {resource:engineering-standards/review-guidance}: a BLOCKER makes the change genuinely unmergeable (a correctness bug, a failing gate, a standards violation, or work the request did not ask for); everything else — naming, structure, taste, optional improvements, follow-up — is ADVISORY.
                            Put blocking defects in the blockers field and non-blocking notes in advisory. Set status to revise only when blockers is non-empty; otherwise approved — advisory never blocks. Do not promote taste to a blocker to earn another round. Return the typed verdict."""
input = [
    "slot:scope-brief",
    "slot:reviewed-draft",
    "slot:work-summary",
    "resource:engineering-standards/coding-standards",
    "resource:engineering-standards/review-guidance",
    "resource:review-rubric",
]
output = ["slot:review-verdict-1"]

[prompt.review-2]
text = """

                            Independently review the implemented work for the change in {slot:scope-brief} against the agreed draft {slot:reviewed-draft}. Current work summary: {slot:work-summary}.
                            Consult the standards {resource:engineering-standards/coding-standards} and the review guidance {resource:engineering-standards/review-guidance}, score against the rubric {resource:review-rubric}, and inspect the actual working tree with your tools — never review the summary alone.
                            Classify every finding by severity per {resource:engineering-standards/review-guidance}: a BLOCKER makes the change genuinely unmergeable (a correctness bug, a failing gate, a standards violation, or work the request did not ask for); everything else is ADVISORY.
                            Put blocking defects in the blockers field and non-blocking notes in advisory. Set status to revise only when blockers is non-empty; otherwise approved — advisory never blocks. Do not promote taste to a blocker to earn another round. Return the typed verdict."""
input = [
    "slot:scope-brief",
    "slot:reviewed-draft",
    "slot:work-summary",
    "resource:engineering-standards/coding-standards",
    "resource:engineering-standards/review-guidance",
    "resource:review-rubric",
]
output = ["slot:review-verdict-2"]

[prompt.review-draft]
text = """

                    Review the draft {slot:draft} for the change in {slot:scope-brief} against the standards {resource:engineering-standards/coding-standards} and the review rubric {resource:review-rubric}.
                    Return a complete NEW draft of strictly higher quality — the improved draft itself, not review notes.
                    Tighten scope to the request, correct anything that violates the standards, and make the validation plan explicit: name the test that will fail before the change and pass after it."""
input = [
    "slot:scope-brief",
    "slot:draft",
    "resource:engineering-standards/coding-standards",
    "resource:review-rubric",
]
output = ["slot:reviewed-draft"]

[prompt.understand]
text = """

                    Distil the request "{port:change-request}" for {port:target} into a scope brief.
                    State, concretely: what the change must accomplish, its acceptance criteria (how we will know it is done), and the specific files or areas in {port:target} it touches. Inspect {port:target} with your tools to ground this — do not guess.
                    Every later step works from this brief instead of the raw request, so anything you leave out is lost. Return only the brief."""
input = [
    "port:change-request",
    "port:target",
]
output = ["slot:scope-brief"]

[[sequence.refine-work.sequence]]
id = "review-1"
title = "Review work (smart-1)"
agent = "agent:smart-1"
prompt = "prompt:review-1"
input = [
    "slot:scope-brief",
    "slot:reviewed-draft",
    "slot:work-summary",
    "resource:engineering-standards/coding-standards",
    "resource:engineering-standards/review-guidance",
    "resource:review-rubric",
]
output = ["slot:review-verdict-1"]

[[sequence.refine-work.sequence]]
id = "review-2"
title = "Review work (smart-2)"
agent = "agent:smart-2"
prompt = "prompt:review-2"
input = [
    "slot:scope-brief",
    "slot:reviewed-draft",
    "slot:work-summary",
    "resource:engineering-standards/coding-standards",
    "resource:engineering-standards/review-guidance",
    "resource:review-rubric",
]
output = ["slot:review-verdict-2"]

[[sequence.refine-work.sequence]]
id = "apply-fixes"
title = "Apply reviewer fixes (worker)"
agent = "agent:worker"
prompt = "prompt:apply-fixes"
input = [
    "slot:scope-brief",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
    "slot:work-summary",
    "resource:engineering-standards/coding-standards",
]
output = ["slot:work-summary"]

[procedure]
description = "Implement a requested change end to end with cross-model drafting, review, project-gate enforcement, bounded refinement, and a committed summary."
input = [
    "port:change-request",
    "port:target",
]
output = ["port:commit-report"]

[[procedure.sequence]]
id = "understand"
title = "Distil the request (clerk)"
agent = "agent:clerk"
prompt = "prompt:understand"
input = [
    "port:change-request",
    "port:target",
]
output = ["slot:scope-brief"]

[[procedure.sequence]]
id = "draft"
title = "Draft the change (smart-1)"
agent = "agent:smart-1"
prompt = "prompt:draft"
input = [
    "slot:scope-brief",
    "resource:engineering-standards/coding-standards",
    "resource:review-rubric",
]
output = ["slot:draft"]

[[procedure.sequence]]
id = "review-draft"
title = "Rewrite the draft (smart-2)"
agent = "agent:smart-2"
prompt = "prompt:review-draft"
input = [
    "slot:scope-brief",
    "slot:draft",
    "resource:engineering-standards/coding-standards",
    "resource:review-rubric",
]
output = ["slot:reviewed-draft"]

[[procedure.sequence]]
id = "implement"
title = "Implement (worker)"
agent = "agent:worker"
prompt = "prompt:implement"
input = [
    "slot:scope-brief",
    "slot:reviewed-draft",
    "resource:engineering-standards/coding-standards",
]
output = ["slot:work-summary"]

[[procedure.sequence]]
id = "refinement-loop"
title = "Doubly-reviewed refinement"
kind = "loop"
sequence = "sequence:refine-work"
max-iterations = 6

[[procedure.sequence.until.all]]
slot = "slot:review-verdict-1"
field = "status"
equals = "approved"

[[procedure.sequence.until.all]]
slot = "slot:review-verdict-2"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "commit-message"
title = "Write the commit message (scribe)"
agent = "agent:scribe"
prompt = "prompt:commit-message"
input = [
    "slot:scope-brief",
    "resource:done-checklist",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
]
output = ["slot:commit-message"]

[[procedure.sequence]]
id = "git-stage"
title = "Stage all changes except runtime state"
output = ["slot:stage-output"]

[procedure.sequence.command]
argv = [
    "git",
    "add",
    "-A",
    "--",
    ":(exclude).agents/runs",
]

[[procedure.sequence]]
id = "git-commit"
title = "Commit the change"
input = ["slot:commit-message"]
output = ["slot:commit-output"]

[procedure.sequence.command]
argv = [
    "git",
    "commit",
    "-F",
    ".git/CTX_COMMITMSG",
]
