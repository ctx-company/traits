id = "refactor"
schema-version = "0.3"
version = "0.8.0"
name = "Refactor (Smart)"
summary = "Research-informed surveyed refactoring procedure: research prior art, survey the target, frame the problem, design the boundary, implement it, refine against two independent reviewers who may amend the design, and commit."
variant = "smart"

[metadata]
tag = [
    "first-party",
    "refactoring",
    "review",
    "multi-agent",
]

[[intent.require]]
id = "review-before-final"

[[intent.require]]
id = "bounded-refinement"

[[intent.require]]
id = "behavior-preserving-default"

[[intent.avoid]]
id = "unbounded-loop"

[[intent.avoid]]
id = "rubber-stamp-review"

[[intent.avoid]]
id = "interface-widening"

[[intent.avoid]]
id = "taste-only-blocking"

[[port]]
id = "target"
direction = "input"
schema = "schema:text"
description = 'Module, file path, or entity to refactor; append an optional emphasis after a dash (e.g. "modules/cli/src/app/run_view.rs", "crate::lockfile — typed errors only").'

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Final commit evidence from the git commit command step. Absent when the clean-tree gate (P397) skipped the commit tail entirely — a clean working tree at gate time means nothing to commit."
value = "slot:commit-output"

[[slot]]
id = "survey"
schema = "schema:text"
description = "Numbered refactoring candidates for the target: cluster, why coupled, smell ids, test impact. No interface proposals."
hint = "The friction encountered while reading IS the signal. Deferred candidates stay listed here."

[[slot]]
id = "refactor-frame"
schema = "schema:text"
description = "The selected candidate set plus problem framing: constraints any new boundary must satisfy, dependencies, an illustrative (non-binding) sketch."

[[slot]]
id = "agreed-design"
schema = "schema:text"
description = "The design, complete enough to implement from: boundaries, types, migration steps, validation plan."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's report of the refactored state; revised in place after each refinement pass."
hint = "What changed (files), how behavior was preserved, gate results, open concerns."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Refactor commit message; injected directly into the git commit command step."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git staging command step."

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "git-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."
hint = "Empty exactly when the tree is clean; the commit tail is skipped entirely in that case, so no commit is attempted and the scribe never runs."

[[slot]]
id = "research-notes"
schema = "schema:text"
description = "Prior art and precedent gathered before the survey: how comparable codebases or the house's own history handled this boundary, and any external guidance worth grounding the design in."
hint = "Better inputs, not more rounds — this step runs once, before the survey, and is never repeated."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict-smart"
description = "smart-1's refinement verdict for the current refactored state."

[[slot]]
id = "review-verdict-2"
schema = "schema:review-verdict-smart"
description = "smart-2's refinement verdict for the current refactored state."

[[resource]]
id = "architecture-dialect"
path = "resources/architecture-dialect.md"
hint = "The house architecture dialect: Interface/Service boundaries, typed Event/Command flow, entity containment — deep modules throughout."
trigger = "on-activation"

[[resource]]
id = "smell-catalog"
path = "resources/smell-catalog.md"
hint = "Eight detectable refactoring smells with detection patterns, before/after shapes, and when-not-to-apply guards."
trigger = "on-activation"

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open" or "done". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "plan-amendment"
description = "One typed amendment under smart authority: the plan change, the contradiction it resolves, its rationale, and its provenance. Becomes the binding contract once recorded."

[schema.fields.change]
schema = "schema:text"
required = true
description = "The change being made to the plan."

[schema.fields.contradiction-resolved]
schema = "schema:text"
required = true
description = "The contradiction between the plan and the observed work that this amendment resolves."

[schema.fields.provenance]
schema = "schema:text"
required = true
description = "Who or what authorized this amendment and how it was recorded."

[schema.fields.rationale]
schema = "schema:text"
required = true
description = "Why this change is the right resolution."

[[schema]]
id = "review-verdict-smart"
description = "Typed review verdict. The loop blocks only on blockers; an incomplete migration of the broader ideal is advisory-deferred, not a blocker, so a correct framed refactor converges."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: residual pre-existing smells outside the framed change, code the agreed design did not cover, further refactoring the survey deferred, taste. Never affects status; belongs on the deferred-candidates list, not this run."

[schema.fields.amendments]
schema = "[schema:plan-amendment]"
description = "Typed amendments to the agreed design under smart authority, present when the plan and the observed work genuinely contradicted. Each becomes the binding contract going forward; an unrecorded departure is still a plan-fidelity gap, not an amendment."

[schema.fields.blockers]
schema = "[schema:blocker]"
description = "The blocking defects that must be fixed before merge: a behavior or byte-stability break, a NEW S1-S10 smell introduced by this change (including S9 — code this change supersedes surviving beside its replacement), or an interface widened to make a caller compile. Fidelity to the agreed design is judged solely under this variant's authority rule, not as a separate categorical item here. Present when status is revise; empty or absent when approved."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when the framed change is correct, behavior-preserving, and introduces no new smell — even if the broader ideal is not fully reached; revise only when a blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[[agent]]
id = "worker"
description = "Implements the agreed refactor design and applies reviewer fixes."
summary = "Implementation role."

[[agent]]
id = "scribe"
description = "Writes the refactor commit message from the agreed design and survey record; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "smart-1"
description = "Strong analysis model with research tools: researches prior art before surveying, designs the boundary, and reviews in the refinement loop."
summary = "Survey, design, reviewer."

[[agent]]
id = "smart-2"
description = "Strong review model: independently reviews the refactored state in the refinement loop."
summary = "Independent reviewer."

[prompt.apply-fixes]
text = """

                            Apply the reviewer findings for {port:target}: {slot:review-verdict-1} and {slot:review-verdict-2}.
                            Fix every BLOCKER named in either verdict — those are mandatory to merge. When a verdict carries amendments, those become the new binding contract: rewrite the agreed design to incorporate them exactly, then implement to the amended design. If verdict1 and verdict2 propose amendments that genuinely conflict with each other, do NOT adjudicate between them yourself: leave the agreed design unamended on the conflicting point, implement neither side of the conflict, and report the conflict verbatim (both proposed amendments and why they contradict) as an open item in the work summary — the conflict must remain unresolved and blocking until the reviewers reconcile it in a later round, never silently decided here. Advisory / deferred items go on the deferred-candidates list, not this round, unless the fix is cheap and safe. Prefer the dialect ({resource:architecture-dialect}). Re-run the repo validation gates.
                            Return exactly two outputs: agreed-design (the complete design text, amended by every non-conflicting amendment, unchanged on any conflicting point) and work-summary (what changed, files, net line delta, how behavior was preserved, gate results, open concerns — including any unresolved amendment conflict, named explicitly so the next review round blocks on it)."""
input = [
    "port:target",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
    "resource:architecture-dialect",
]
output = [
    "slot:agreed-design",
    "slot:work-summary",
]

[prompt.design]
text = """

            Design the refactor for the framed problem {slot:refactor-frame} on {port:target}.
            Optimize for both faces of the standard at once: the deepest practical module — few entry points hiding the full implementation — expressed in the house dialect in {resource:architecture-dialect} (Interface/Service pairing per responsibility, surface-agnostic layers over typed Request/Response, typed Event/Command enums normalized once at the edge, entity containment, Context carriage where values re-thread, typed module-owned errors, Response enums instead of display strings). Where depth and dialect pull apart, be opinionated about the trade and say why; weigh how much the design DELETES — replacement that consumes its predecessor beats addition beside it (S9).
            Return the complete agreed design ready to implement from: final boundaries and types, the interface signatures with one usage example per caller class, what complexity gets hidden, file-by-file migration steps, what stays byte-stable, the expected net line delta with what any growth buys, and the validation plan (the repo's standard gates). Close with an explicit "MUST" and "MUST-NOT" list — the concrete, checkable requirements a reviewer enforcing plan fidelity applies verbatim; do not leave fidelity to be inferred from prose elsewhere in the design. Stay within the framing's constraints."""
input = [
    "slot:refactor-frame",
    "port:target",
    "resource:architecture-dialect",
]
output = ["slot:agreed-design"]

[prompt.frame]
text = """

            From the survey {slot:survey} of {port:target}, select the highest-value candidate set that honestly fits one refactoring run; name the deferred candidates explicitly so they are not lost.
            Verify the selection against the actual code with your tools, then write the problem framing: the constraints any new boundary must satisfy (callers, serialized shapes that must stay byte-stable, gates), the dependencies involved, and a short illustrative sketch that grounds the space without prescribing the answer.
            Judge with {resource:architecture-dialect} and {resource:smell-catalog}; behavior-preserving is the default contract."""
input = [
    "slot:survey",
    "port:target",
    "resource:architecture-dialect",
    "resource:smell-catalog",
]
output = ["slot:refactor-frame"]

[prompt.implement]
text = """

            Implement the agreed design {slot:agreed-design} for {port:target}.
            Behavior-preserving is the contract unless the design explicitly says otherwise: serialized shapes, digests, and CLI output stay byte-stable. Respect the dialect ({resource:architecture-dialect}); do not widen any interface to make a caller compile — fix the caller.
            Prefer deletion: code your change supersedes is removed in the same change, never left beside its replacement (S9). Run the repo validation gates before reporting. Return a work summary: what changed (files), the net line delta and what any growth buys, how behavior was preserved, gate results, open concerns."""
input = [
    "slot:agreed-design",
    "port:target",
    "resource:architecture-dialect",
]
output = ["slot:work-summary"]

[prompt.research]
text = """

                    Before surveying {port:target}, research prior art: how comparable modules in this codebase solved a similar boundary problem, and any external precedent worth grounding the design in. Use web-capable tools if available.
                    Keep this to one pass — the loop budget is unchanged from the default flow; smart means a better-informed survey and design, not more rounds.
                    Return your research notes: what you found, its relevance, and anything that should constrain the coming design."""
input = ["port:target"]
output = ["slot:research-notes"]

[prompt.review-1]
text = """
Review the refactored state of {port:target} against the agreed design {slot:agreed-design}. Current work summary: {slot:work-summary}.
            A BLOCKER always includes a behavior or byte-stability break, a NEW S1-S10 smell introduced by this change (including S9 — code this change supersedes surviving beside its replacement), or an interface widened to make a caller compile; cite the smell id or the deep-module violation. Fidelity to the agreed design is judged SOLELY by the authority rule below — apply it directly, with no separate categorical "any design violation is a blocker" rule layered on top. Residual pre-existing smells outside the framed change, code the agreed design did not cover, and further refactoring the survey deferred are ADVISORY.
            Review the AGREED framed change, not the whole surface: approve when the framed change is correct, behavior-preserving, and adds no new smell — even if the broader ideal remains — and record everything else as advisory for the deferred list. Do not block because the surface is not yet fully ideal.
            PLAN-FIDELITY AUTHORITY: this fragment's rule below is authoritative over REVIEW_VERDICT_DOCTRINE's own default completion-criteria paragraph for how strictly the plan and Definition of Done must be matched — apply this fragment's rule directly, with no separate generic checklist formula layered on top. This never touches genuine-defect, house-rule, required-gate, or duplication blocking, which stay unconditional BLOCKERs exactly as REVIEW_VERDICT_DOCTRINE requires. Smart authority: when the plan and the observed work genuinely contradict, resolve the contradiction ONLY by producing a typed amendment record — the change, the contradiction it resolves, the rationale, and its provenance — which then becomes the binding contract going forward; an unrecorded departure is still a plan-fidelity gap, not an amendment. Amending fidelity never amends correctness: a genuine defect remains a BLOCKER under REVIEW_VERDICT_DOCTRINE no matter how the plan was amended.
            Treat a work summary that reports an unresolved cross-reviewer amendment conflict as a BLOCKER in your verdict: the conflict stays open until both reviewers reconcile it in a later round, and status must not be approved while it remains.
            Wherever the authority rule above names REVIEW_VERDICT_DOCTRINE, it means the composed baseline stated immediately below — this family splices the leaner, family-compatible INTEGRITY_DOCTRINE in its place, not the implement-phase doctrine.
            Your own verdict from the previous round is attached as input when one exists — it is your review so far, and this round's verdict EXTENDS it rather than re-deriving it. For every carried blocker: keep its id and its steps verbatim (same order, same text); verify each open step's state directly with your tools and flip its status to done only on evidence you confirmed; append genuinely new findings as new steps at the end, or as new blockers; set recurrence-of on every carried blocker. DROP a blocker entirely once every step is done — name it in the advisory so the clearing is on record. The attached work summary is the worker's cumulative account and its claims of done are input to your verification, never a substitute for it.
                    Consult the phase contract {slot:agreed-design} and house rules {resource:architecture-dialect}, and inspect the actual working tree with your tools — never review the summary alone; run the gates named in the phase's own Definition of Done if the summary does not prove they ran.
                    Before citing any house rule in a blocker, verify it against the phase's declared rule-authority: open that resource yourself with your tools, confirm the rule's source path/section and quoted line(s) in {resource:architecture-dialect} match the authority exactly, and drop the blocker rather than raise it if you cannot verify both — an unsourced or misquoted rule is not a rule. When a blocker does cite a house rule, set its rule-source and rule-quote fields to the verified citation; leave both unset for blockers that are not rule-based (correctness bugs, duplication, and the like).
                    A BLOCKER makes the work genuinely unmergeable: a correctness bug, a house-rule violation, a gate the phase's own Definition of Done requires that is failing, clear over-build (accretion, defensive validation for impossible states, scope creep), OR un-abstracted duplication — logic re-implemented or copied where existing code should have been reused or a shared abstraction extracted. Everything else — subjective style, naming, taste, optional improvements, follow-up — is ADVISORY.
                    Report each blocker as a typed entry: a stable kebab-case id (reused verbatim if it returns), where (paths), what (the defect and its failure), root-cause (the missing invariant, not just where it shows), required-fix (the invariant an acceptable fix must establish and what to replace or delete — never just the cited call sites), and done-when (the falsifiable check you will apply next round). A blocker with recurrence-of set is proof the prior fix treated a symptom: state in root-cause why it was symptomatic, prescribe the structural fix in required-fix, and make clear that another point-patch at the cited sites will not clear it — for recurring duplication that means consolidate into one shared path and delete the copy, and do not approve until the duplicate is gone rather than the named case merely fixed. On a recurrence, two further duties. FIRST, enumerate the COMPLETE remaining divergence now — every responsibility the shared path must still absorb — not merely the symptom that exposed it this round: a worker who satisfies a partial list meets a longer list next round and learns that complying does not clear the blocker. SECOND, the required-fix must now name symbols: the exact functions/types to create, the exact functions that must no longer exist, and the call sites to route; and done-when must include at least one command the worker can run to see the structural state red or green for itself.
                    Put blocking defects in the blockers field and non-blocking notes in advisory. Set status to revise only when blockers is non-empty; otherwise approved — advisory never blocks. Do not promote taste to a blocker to earn another round. Return the typed verdict."""
input = [
    "port:target",
    "slot:agreed-design",
    "slot:work-summary",
    "resource:architecture-dialect",
]
output = ["slot:review-verdict-1"]

