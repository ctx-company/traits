                    Report each blocker as a typed entry: a stable kebab-case id (reused verbatim if it returns), where (paths), what (the defect and its failure), root-cause (the missing invariant, not just where it shows), required-fix (the invariant an acceptable fix must establish and what to replace or delete — never just the cited call sites), and done-when (the falsifiable check you will apply next round). A blocker with recurrence-of set is proof the prior fix treated a symptom: state in root-cause why it was symptomatic, prescribe the structural fix in required-fix, and make clear that another point-patch at the cited sites will not clear it — for recurring duplication that means consolidate into one shared path and delete the copy, and do not approve until the duplicate is gone rather than the named case merely fixed. On a recurrence, two further duties. FIRST, enumerate the COMPLETE remaining divergence now — every responsibility the shared path must still absorb — not merely the symptom that exposed it this round: a worker who satisfies a partial list meets a longer list next round and learns that complying does not clear the blocker. SECOND, the required-fix must now name symbols: the exact functions/types to create, the exact functions that must no longer exist, and the call sites to route; and done-when must include at least one command the worker can run to see the structural state red or green for itself.
                    Put blocking defects in the blockers field and non-blocking notes in advisory. Set status to revise only when blockers is non-empty; otherwise approved — advisory never blocks. Do not promote taste to a blocker to earn another round. Return the typed verdict."""
input = [
    "port:target",
    "slot:agreed-design",
    "slot:work-summary",
    "resource:architecture-dialect",
]
output = ["slot:review-verdict-2"]

[prompt.summarization]
text = """

            The refinement loop for the refactor of {port:target} has ended and the work is being committed. The final reviewer verdicts are {slot:review-verdict-1} and {slot:review-verdict-2} — read their status fields FIRST. The loop exits early once both approve, so a status still set to revise means the rounds ran out with that reviewer unsatisfied: say so plainly rather than implying a clean approval.
            Write the commit message from the agreed design {slot:agreed-design}, the survey {slot:survey}, and those verdicts: subject line "refactor({port:target}): <boundary in a few words>", then one paragraph summarizing the new boundary and behavior preservation, then a short "Deferred candidates:" list copied from the survey (omit the list if none were deferred).
            If either verdict status is revise, end the message with an "Unresolved reviewer blockers:" section listing each open blocker in one line — the honest record that the budget ran out before every reviewer was satisfied. Never write that section when there are none.
            Return exactly that message as your output; the runtime injects it into the git commit step.
            Do not run any git commands and do not write any files for the message; staging and committing happen in later runtime steps."""
input = [
    "port:target",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
    "slot:agreed-design",
    "slot:survey",
]
output = ["slot:commit-message"]

[prompt.survey]
text = """

                    Survey {port:target} for refactoring opportunities, informed by your research {slot:research-notes}.
                    Read the target and its callers/callees with your tools — explore organically; the friction you encounter while reading IS the signal. Ground every observation in the architecture dialect ({resource:architecture-dialect}) and the smell catalog ({resource:smell-catalog}); cite smell ids (S1-S10) or a named deep-module violation for each.
                    Sweep is mandatory and complete: (a) walk ALL ten smells S1-S10 in catalog order and for each report findings or explicitly "S<n>: none found"; (b) then assess the three dialect pillars — boundaries, data flow, entity containment.
                    Return a numbered candidate list — for each: the cluster of code involved (paths), why it is coupled, which smell ids or dialect pillar it violates, and how the boundary would change what tests can prove.
                    Do NOT propose interfaces or fixes yet. List every real candidate even if it cannot fit one run."""
input = [
    "port:target",
    "slot:research-notes",
    "resource:architecture-dialect",
    "resource:smell-catalog",
]
output = ["slot:survey"]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "summarization"
title = "Write the commit message (scribe)"
agent = "agent:scribe"
prompt = "prompt:summarization"
input = [
    "port:target",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
    "slot:agreed-design",
    "slot:survey",
]
output = ["slot:commit-message"]

