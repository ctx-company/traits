[package]
id = "refactor"
version = "0.9.0"
name = "Refactor"
status = "ready"

[family]
default = "default"

[family.variant]

[family.variant.direct]
path = "generated/direct/index.toml"
aliases = ["refactor-direct"]

[family.variant.default]
path = "generated/default/index.toml"
aliases = ["refactor-default"]

[family.variant.quick]
path = "generated/quick/index.toml"
aliases = ["refactor-quick"]

[family.variant.smart]
path = "generated/smart/index.toml"
aliases = ["refactor-smart"]

[family.variant.strict]
path = "generated/strict/index.toml"
aliases = ["refactor-strict"]

[publish]
name = "@ctx-traits/refactor"
access = "public"
