[package]
id = "refactor"
version = "0.11.0"
name = "Refactor"
status = "ready"

[family]
default = "quick"

[family.variant]

[family.variant.quick]
path = "generated/quick/index.toml"
aliases = ["refactor-quick"]

[family.variant.guided]
path = "generated/guided/index.toml"
aliases = ["refactor-guided"]

[family.variant.complex]
path = "generated/complex/index.toml"
aliases = ["refactor-complex"]

[publish]
name = "@ctx-traits/refactor"
access = "public"

[budget]
max-frames = 1000
frame-seconds = 1200
total-seconds = 10800
max-retries = 3
idle-seconds = 1200

[variant.guided.budget]
max-frames = 100
frame-seconds = 3600
total-seconds = 10800
max-retries = 3
idle-seconds = 900
