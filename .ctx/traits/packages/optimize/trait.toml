[package]
id = "optimize"
version = "0.1.0"
name = "Optimize"
status = "ready"

[family]
default = "experiment"

[family.variant]

[family.variant.experiment]
path = "generated/experiment/index.toml"
aliases = ["optimize-experiment"]

[family.variant.benchmark]
path = "generated/benchmark/index.toml"
aliases = ["optimize-benchmark"]

[publish]
name = "@ctx-traits/optimize"
access = "public"

[budget]
max-frames = 200
frame-seconds = 1800
total-seconds = 21600
max-retries = 2
idle-seconds = 600
max-tokens = 4000000
max-cost-usd = 40.0
command-seconds = 600
command-idle-seconds = 300

[defaults.port]
benchmark-runs = "3"

[variant.benchmark.budget]
max-frames = 200
frame-seconds = 1800
total-seconds = 43200
max-retries = 2
idle-seconds = 600
max-tokens = 6000000
max-cost-usd = 60.0
command-seconds = 900
command-idle-seconds = 300
