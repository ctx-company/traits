[package]
id = "implement"
version = "0.24.0"
name = "Implement"
status = "ready"

[family]
default = "default"

[family.variant]

[family.variant.quick]
path = "generated/quick/index.toml"
aliases = ["implement-quick"]

[family.variant.default]
path = "generated/default/index.toml"
aliases = ["implement-default"]

[family.variant.smart]
path = "generated/smart/index.toml"
aliases = ["implement-smart"]

[family.variant.strict]
path = "generated/strict/index.toml"
aliases = ["implement-strict"]

[family.variant.phase]
path = "generated/phase/index.toml"
aliases = ["implement-phase"]

[family.variant.gated]
path = "generated/gated/index.toml"
aliases = ["implement-gated"]

[family.variant.guarded]
path = "generated/guarded/index.toml"
aliases = ["implement-guarded"]

[publish]
name = "@ctx-traits/implement"
access = "public"

[budget]
max-frames = 1000
frame-seconds = 1200
total-seconds = 10800
max-retries = 3
idle-seconds = 1200

[variant.quick.budget]
frame-seconds = 1800
total-seconds = 21600
idle-seconds = 600

# gated waits on a human at up to eleven points (plan annotation, one gated
# briefing per approved round, the final brief display) — each plannotator
# step carries its own 4h idle ceiling, and the run's total budget must
# survive the owner being away, so it gets a day.
[variant.gated.budget]
frame-seconds = 1800
total-seconds = 86400
idle-seconds = 600
