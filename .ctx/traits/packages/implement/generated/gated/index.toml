id = "implement"
schema-version = "0.3"
version = "0.22.0"
name = "Implement (Gated)"
summary = "Quick's implementation loop with the owner inside it: draft the approach, have the owner annotate the plan in plannotator, then grind a single reviewer loop where every gate-green approved round summons the owner to a gated briefing — on double approval, record a tracked brief and commit."
variant = "gated"

[metadata]
tag = [
    "dogfood",
    "implementation",
    "review",
    "lean",
    "human-in-the-loop",
    "plannotator",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "review-before-final"

[[intent.require]]
id = "role-attributed-output"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "scope-creep"

[[intent.avoid]]
id = "rubber-stamp-review"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "brief-report"
direction = "output"
schema = "schema:text"
optional = true
description = "The tracked brief written to .internal/briefs/<slug>.md. Absent when the clean-tree gate skipped the commit tail."
title = "Brief"
format = ["text"]
value = "slot:brief-markdown"

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Final commit evidence from the git commit command step. Absent when the clean-tree gate skipped the commit tail entirely — a clean working tree at gate time means nothing to commit."
value = "slot:commit-output"

[[port]]
id = "park-report"
direction = "output"
schema = "[schema:review-verdict]"
optional = true
description = "Typed park record for an unapproved run (P414): the wall citation (if any), the exact blockers, and escalation state. Present in the run's persisted output-port evidence only when the refinement loop exhausted without approval — the run parks and no commit is created. A run that exhausts on owner denials alone (reviewer approved every round) parks with this empty; slot:owner-decision is the evidence in that case."
title = "Park Report"
format = [
    "structured",
    "table",
]
value = "slot:park-report"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = 'Task to implement, named by its file in .internal/tasks/ — the number ("0044"), the full name ("0044-live-view-pane-polish"), or the filename.'

[[slot]]
id = "brief"
schema = "schema:brief"
description = "The final record: slug, brief markdown, and commit message, before the file-writing and commit command steps run."

[[slot]]
id = "brief-display-output"
schema = "schema:text"
description = "Output evidence from the command step that displays the brief to the owner (no --gate; no decision attached)."

[[slot]]
id = "brief-markdown"
schema = "schema:text"
description = "brief.markdown, lifted flat for the file-writing and display command steps."

[[slot]]
id = "brief-slug"
schema = "schema:text"
description = "brief.slug, lifted flat for the file-writing and display command steps."

[[slot]]
id = "brief-write-output"
schema = "schema:text"
description = "Output evidence from the command step that writes the brief file."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "brief.commit-message, lifted flat for the git commit command step's argv."

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "draft"
schema = "schema:text"
description = "smart-1's implementation draft for the task, before the owner has annotated it."
hint = "Scope (restated from the task file), files to touch, approach, reuse/abstraction opportunities, validation plan, risks. A plan, not an implementation."

[[slot]]
id = "owner-briefing"
schema = "schema:text"
description = "The round briefing for the owner, written after a gate-green reviewer approval from the work summary, the verdict, and the working tree; fed to the plannotator gate step."

[[slot]]
id = "owner-decision"
schema = "schema:owner-decision"
description = "plannotator's gate verdict on the round briefing, only once a review has approved with the repository gate green and the owner has been summoned. Absent (Missing) every round the owner is not summoned, and on round 1."

[[slot]]
id = "park-report"
schema = "[schema:review-verdict]"
description = "This round's typed park record (P414): empty when the round's verdict is approved, exactly one entry — the round's own verdict, copied unchanged — when it is revise. Written each round by a deterministic project step (deriveParkReportStep), never model-authored, so it can never disagree with the verdict it comes from."

[[slot]]
id = "plan"
schema = "schema:text"
description = "The refined plan: the draft with every plan-mode annotation visibly addressed. The contract the build loop implements."
hint = "Every deny/annotation from plan-decision must be provably reflected here, not just acknowledged."

[[slot]]
id = "plan-decision"
schema = "schema:plan-decision"
description = "plannotator's plan-mode verdict on the draft: approve, or deny with annotation text."

[[slot]]
id = "preflight-output"
schema = "schema:text"
description = "Output evidence that plannotator is on PATH, from the preflight command step."

[[slot]]
id = "repo-gates-passed"
schema = "schema:repo-gates-result"
description = "This round's repository gate result: whether the repository gate chain passed, and the exact command that decided it."

[[slot]]
id = "review-diff"
schema = "schema:text"
description = "Inventory of every file changed this round with its insertion/deletion counts — an index of where the work landed, never the work itself. The reviewer opens whatever it needs with its own tools."
hint = "git diff --stat output, excluding runtime state. No patch bodies: a deleted generated artifact would otherwise contribute its entire content."

[[slot]]
id = "review-verdict"
schema = "schema:review-verdict"
description = "smart-1's refinement verdict for the current work state."

[[slot]]
id = "shipping-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."
hint = "Empty exactly when the tree is clean; the commit tail is skipped entirely in that case, so no commit is attempted and no brief is written."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git staging command step."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's report of the implemented state; revised in place after each refinement pass."
hint = "What changed (files), how it was validated, and open concerns. Revised after every apply-fixes pass."

[[resource]]
id = "task-board"
path = ".internal/tasks"
root = "repo"
hint = "Repo-root directory for the task board: one markdown file per task, named NNNN-kebab-slug.md; agents read task files with their own tools and never inline them."
trigger = "on-demand"

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open" or "done". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "brief"
description = "The run's final record: a tracked markdown brief, the filename stem to save it under, and the commit message."

[schema.fields.commit-message]
schema = "schema:text"
required = true
description = "Commit message for the approved work: a short subject line naming the change, then a one-paragraph summary of what was implemented and how it was validated."

[schema.fields.markdown]
schema = "schema:text"
required = true
description = "The brief itself: what was built, why, how it was validated, and what the review found — for the tracked record."

[schema.fields.slug]
schema = "schema:text"
required = true
description = "A short kebab-case filename stem for the tracked brief, e.g. the task's own slug."

[[schema]]
id = "owner-decision"
description = "plannotator's `annotate --gate --json` verdict on one round's briefing."

[schema.fields.decision]
schema = "schema:text"
required = true
description = """"approved" or "annotated" — plannotator's gate verdict on the round briefing. Only "approved" advances the build loop; "annotated" (the owner submitted feedback without approving) leaves it unsatisfied and the loop continues. A "dismissed" verdict (the owner closed the briefing via Exit without deciding) never reaches this slot: the summon step turns it into a failing exit and the run halts."""

[[schema]]
id = "plan-decision"
description = "plannotator's plan-mode hook JSON. Only declares an optional marker field so the object-shape check rejects non-JSON/non-object stdout loudly; the undeclared `hookSpecificOutput.decision.behavior`/`.message` path is read directly from the raw JSON text by `plan-refine`'s prompt."

[schema.fields.session-id]
schema = "schema:text"
description = "plannotator's session identifier for the plan-mode hook exchange, when present in the payload."

[[schema]]
id = "repo-gates-result"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv the gate ran. This is the command that decides done-ness — re-run THIS, not a command named anywhere else."

[schema.fields.exit-code]
schema = "schema:number"
description = "The gate command's exit status. Absent when the command never produced one, which itself means it could not be executed."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True when the gate command exited successfully."

[schema.fields.tail]
schema = "schema:text"
description = "The end of the failed gate's output — stderr when it said anything, otherwise stdout. Present ONLY when ok is false. This is the reason the gate failed: read it before attributing the failure to anything else, and never infer a cause the tail does not state."

[schema.fields.timed-out]
schema = "schema:boolean"
description = "Present and true only when the gate was killed by its own timeout rather than exiting. A timed-out gate proves nothing about the work."

[[schema]]
id = "review-verdict"
description = "Typed single-pass review verdict. The loop blocks only on blockers; forgivable plan-fidelity gaps are recorded, not silently dropped."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), un-abstracted duplication, OR owner feedback from an annotated round briefing that the work does not yet visibly address. Draft-fidelity is judged solely under the quick authority rule — a left-undone step is forgivable there with a recorded reason and is never listed here as a categorical blocker on its own. Non-empty when status is revise; an empty list (never omitted — always return the key) when approved. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if the run as a whole cannot reach an approvable state — never merely because one blocker is outside this round's reach. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the run cannot reach an approvable state and the one owner action that would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.forgiveness-reason]
schema = "schema:text"
description = "Present ONLY when this verdict forgives a plan-fidelity gap — a missing or altered draft step that changed nothing an observer could break. One line naming the gap and why it was reasonable to diverge. Never present for a genuine defect, which is always a blocker regardless of reason."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when the draft is correct and introduces no new smell — even if a forgivable plan-fidelity gap remains; revise only when a blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[signal]]
id = "gate-timed-out"
description = "The repository gate exceeded its declared ceiling — a repo condition no worker round can fix."

[[agent]]
id = "smart-1"
description = "Strong model: drafts the implementation plan, refines it against the owner's plan-mode annotations, is the sole reviewer in the refinement loop, writes the owner's round briefings, and writes the brief and commit message for the approved work."
summary = "Drafting, reviewer, briefing, and brief role."

[[agent]]
id = "worker"
description = "Implements the plan and applies reviewer and owner fixes."
summary = "Implementation role."

[prompt.building-produce]
text = """

    Implement {port:task} following the plan {slot:plan}.
    No reviewer verdict attached means this is round 1: implement the plan in full. On every later round a verdict IS attached, and it redefines your task: execute its blockers' open steps, in order, largest first. The verdict was written against the exact working tree you are in — nothing has changed since — so if it says something is missing, it is missing NOW; re-auditing the tree against the plan re-does, worse, the review that produced the verdict, and spends your round on nothing. Your own work summary from the previous round is also attached: it is your memory of what prior rounds did — trust it plus the verdict's step statuses instead of re-verifying the tree. Before claiming any step was already satisfied, run the check its blocker's done-when names and cite its passing output as evidence; extend the summary with per-step progress as you go.
    A repository gate result may be attached. When its ok field is false, re-run its argv verbatim — that exact command is what decides done-ness, whatever any document or reviewer calls the gate — and repair what it reports. Its tail is the gate's own output and states the actual reason — start there rather than guessing. A tail showing the gate could not run at all (missing recipe, command not found) is a repository misconfiguration you cannot fix from inside the run: report it in the work summary instead of attempting a code change. A gate result whose timed-out field is true is a repo condition — the ceiling is fixed in the trait — never your blocker to fix; report it and stop, do not spend the round chasing it.
    An owner decision may be attached: it is the owner's gate verdict on a previous round's briefing — always "annotated" (an approved verdict would already have ended the loop, and a dismissal halts the run before another round starts) — and its feedback text is the owner's exact words on what must change. The reviewer records an unsatisfied annotation as a typed blocker; read the feedback itself as the authoritative statement of what the owner wants.
    Run this task's own Done-when gates before reporting.
    Return the full work summary: what changed (files), how you validated it, open concerns."""
input = [
    "port:task",
    "slot:plan",
]
output = ["slot:work-summary"]

[prompt.building-review]
text = """

    Review the work for {port:task} against the plan {slot:plan}. Work summary: {slot:work-summary}.
    {slot:review-diff} lists every file changed this round with its insertion/deletion counts — an index, not the change. Open whatever it points at with your own tools; it omits untracked files. {slot:repo-gates-passed} is this round's gate verdict; false is grounds for a blocker on its own — UNLESS its timed-out field is true, which is a repo condition (the bound is the repository's own config), never the worker's blocker, and never grounds for a blocker on its own. This gate is the repository's PER-ROUND gate and proves only what it runs — a repo may reserve heavier proof (full integration suites) for its landing gate, which runs once at merge. Never withhold approval for a check this round's gate does not run: judge the work against the task's own Done-when and this verdict, not against a suite that runs later.
    If an owner decision is attached to this frame, it is the owner's "annotated" verdict on a previous round's briefing (an approved one would already have ended the loop; a dismissal halts the run): treat any feedback it carries as an unsatisfied BLOCKER, never advisory, until the work visibly addresses it — record it as a typed blocker like any other, and carry it forward under the same verbatim rules.
    A BLOCKER is a correctness bug, a failing gate this task's Done-when requires, clear over-build, un-abstracted duplication, or an unaddressed owner annotation. Everything else is advisory and never blocks.
    Your own verdict from last round is attached when one exists: this round's verdict EXTENDS it. Carry every open blocker's id and steps forward VERBATIM — same order, same wording; verify each open step with your own tools and flip its status to done only on evidence you confirmed, recording that evidence on the step. Append genuinely new findings as new steps at the end or as new blockers; set recurrence-of on every carried blocker; drop a blocker only when every step is done, and name the drop in the advisory. Never renumber, reword, or re-derive a carried step — a vanished or rewritten step erases the worker's progress and moves the target, which is how loops stall.
    Set status to revise while any blocker remains, approved when none do. Say "not yet" as many rounds as it takes; do not approve to end the loop, and do not invent a blocker to extend it. Approving does not end the loop by itself: it summons the owner, whose gate is the final word.
    Escalation: set escalation to needs-owner if and only if the run as a whole cannot reach an approvable state (the task file is a placeholder, lacks a falsifiable Done-when, names a prerequisite task not landed in this tree, or is marked superseded/cancelled) — never merely because one blocker is outside this round's reach. Record the one owner action that would clear it in escalation-reason; otherwise set escalation to none and leave escalation-reason empty."""
input = [
    "port:task",
    "slot:plan",
    "slot:work-summary",
    "slot:review-diff",
    "slot:repo-gates-passed",
]
output = ["slot:review-verdict"]

[prompt.draft-writing]
text = """

        Create an implementation draft for {port:task} from its file on the task board {resource:task-board}. Task files are named NNNN-kebab-slug.md; the requested task names its file by number, full name, or filename — read that file with your tools. It is the sole binding authority for this run.
        Cover: scope, files to touch, approach, validation plan, risks.
        Reference files by path. Do not implement anything. The owner will annotate this draft next — write it to be read cold."""
input = [
    "port:task",
    "resource:task-board",
]
output = ["slot:draft"]

[prompt.plan-refine]
text = """

        Refine the draft {slot:draft} into the final plan, using plannotator's plan-mode verdict {slot:plan-decision}.
        If hookSpecificOutput.decision.behavior is "approve", the refined plan may be the draft unchanged.
        If it is "deny", hookSpecificOutput.decision.message is the owner's annotation — every point it raises must be visibly and provably addressed in the refined plan (not merely acknowledged): change the affected section, or state explicitly why the draft already covers it.
        Reference files by path; do not inline documents. Do not implement anything yet."""
input = [
    "slot:draft",
    "slot:plan-decision",
]
output = ["slot:plan"]

[prompt.round-briefing]
text = """

    The reviewer has approved this round's work for {port:task} with the repository gate green, and the owner is about to be summoned to confirm it ships. Plan: {slot:plan}. Work summary: {slot:work-summary}. Reviewer verdict: {slot:review-verdict}.
    Inspect the working tree with your tools (git diff, git status, the changed files) so the briefing reflects what actually changed, not just what the summary claims.
    Write a short markdown briefing for the owner, to be read cold — the owner has not seen the working tree: what changed and why, what the review checked and found (including advisory notes worth the owner's attention), and what the owner is being asked to confirm.
    Return only the briefing markdown."""
input = [
    "port:task",
    "slot:plan",
    "slot:work-summary",
    "slot:review-verdict",
]
output = ["slot:owner-briefing"]

[prompt.summary-brief]
text = """

    The build loop for {port:task} has ended in a double approval (reviewer and owner) and the work is being recorded and committed. Plan: {slot:plan}. Work summary: {slot:work-summary}. Final reviewer verdict: {slot:review-verdict}.
    Inspect the working tree with your tools (git diff, git status) so the record reflects the actual change, not just the summary's claims.
    Write: a short kebab-case slug for this task; the brief in markdown — what was built, why, how it was validated, and what the review found; and the commit message — a short subject line naming the change, then a one-paragraph summary of what was implemented and how it was validated.
    Return the slug, the markdown, and the commit message as the typed output. Do not write any file and do not run git commands; later runtime steps save and commit."""
input = [
    "port:task",
    "slot:plan",
    "slot:work-summary",
    "slot:review-verdict",
]
output = ["slot:brief"]

[[sequence.building-body.sequence]]
id = "building-produce"
title = "Building Produce"
agent = "agent:worker"
prompt = "prompt:building-produce"
input = [
    "port:task",
    "slot:plan",
    { slot = "slot:review-verdict", optional = true },
    { slot = "slot:work-summary", optional = true },
    { slot = "slot:repo-gates-passed", optional = true },
    { slot = "slot:owner-decision", optional = true },
]
output = ["slot:work-summary"]

[[sequence.building-body.sequence]]
id = "repo-gates"
title = "Run the repository gate chain"
kind = "check"
output = ["slot:repo-gates-passed"]

[sequence.building-body.sequence.command]
argv = [
    "just",
    "test",
]

[[sequence.building-body.sequence]]
id = "capture-diff"
title = "Capture the changed-file inventory"
output = ["slot:review-diff"]

[sequence.building-body.sequence.command]
argv = [
    "git",
    "diff",
    "--stat",
    "--",
    ".",
    ":(exclude).agents/runs",
]

[[sequence.building-body.sequence]]
id = "building-review"
title = "Building Review"
agent = "agent:smart-1"
prompt = "prompt:building-review"
input = [
    "port:task",
    "slot:plan",
    "slot:work-summary",
    "slot:review-diff",
    "slot:repo-gates-passed",
    { slot = "slot:review-verdict", optional = true },
    { slot = "slot:owner-decision", optional = true },
]
output = ["slot:review-verdict"]

[[sequence.building-body.sequence]]
id = "park-report-clear"
title = "Park Report Clear"
kind = "project"
output = ["slot:park-report"]

[[sequence.building-body.sequence.projection]]
destination = "slot:park-report"

[sequence.building-body.sequence.projection.source]
literal = []

[[sequence.building-body.sequence]]
id = "park-report-record"
title = "Park Report Record"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-13-building-body-18-park-report-record-then"

[sequence.building-body.sequence.when]
slot = "slot:review-verdict"
field = "status"
equals = "revise"

[[sequence.building-body.sequence]]
id = "owner-gate"
title = "Owner Gate"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-13-building-body-10-owner-gate-then"

[[sequence.building-body.sequence.when.all]]
slot = "slot:review-verdict"
field = "status"
equals = "approved"

[[sequence.building-body.sequence.when.all]]
slot = "slot:repo-gates-passed"
field = "ok"
equals = true

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "summary-brief"
title = "Write the brief and commit message"
agent = "agent:smart-1"
prompt = "prompt:summary-brief"
input = [
    "port:task",
    "slot:plan",
    "slot:work-summary",
    "slot:review-verdict",
]
output = ["slot:brief"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "lift-brief"
title = "Lift Brief"
kind = "project"
input = ["slot:brief"]
output = [
    "slot:brief-slug",
    "slot:brief-markdown",
    "slot:commit-message",
]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.projection]]
source = "slot:brief"
field = "slug"
destination = "slot:brief-slug"

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.projection]]
source = "slot:brief"
field = "markdown"
destination = "slot:brief-markdown"

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.projection]]
source = "slot:brief"
field = "commit-message"
destination = "slot:commit-message"

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "write-brief"
title = "Save the brief to .internal/briefs/"
input = [
    "slot:brief-markdown",
    "slot:brief-slug",
]
output = ["slot:brief-write-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "sh",
    "-c",
    'mkdir -p .internal/briefs && printf %s "$1" > ".internal/briefs/$2.md"',
    "sh",
    "{slot:brief-markdown}",
    "{slot:brief-slug}",
]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "display-brief"
title = "Show the brief to the owner (plannotator, display only)"
input = [
    "slot:brief-slug",
    "slot:brief-write-output",
]
output = ["slot:brief-display-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "sh",
    "-c",
    'PLANNOTATOR_PORT="${PLANNOTATOR_PORT:-7411-7460}" plannotator annotate "$1"',
    "sh",
    ".internal/briefs/{slot:brief-slug}.md",
]
idle-timeout-ms = 14400000

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "git-stage"
title = "Stage all changes except runtime state"
output = ["slot:stage-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
    "--",
    ":(exclude).agents/runs",
]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "git-commit"
title = "Commit the work"
input = ["slot:commit-message"]
output = ["slot:commit-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "commit",
    "-m",
    "{slot:commit-message}",
]

[[sequence.ctx-branch-arm-s-13-building-body-10-owner-gate-then.sequence]]
id = "round-briefing"
title = "Write the round briefing"
agent = "agent:smart-1"
prompt = "prompt:round-briefing"
input = [
    "port:task",
    "slot:plan",
    "slot:work-summary",
    "slot:review-verdict",
]
output = ["slot:owner-briefing"]

[[sequence.ctx-branch-arm-s-13-building-body-10-owner-gate-then.sequence]]
id = "owner-review"
title = "Summon the owner (plannotator, gated)"
input = ["slot:owner-briefing"]
output = ["slot:owner-decision"]

[sequence.ctx-branch-arm-s-13-building-body-10-owner-gate-then.sequence.command]
argv = [
    "sh",
    "-c",
    """d=$(mktemp -d) && printf %s "$1" > "$d/briefing.md" && PLANNOTATOR_PORT="${PLANNOTATOR_PORT:-7411-7460}" plannotator annotate "$d/briefing.md" --gate --json > "$d/decision.json"; s=$?; [ -s "$d/decision.json" ] && cat "$d/decision.json"; if [ $s -eq 0 ] && grep -q '"decision":"dismissed"' "$d/decision.json"; then echo "owner closed the briefing without a decision — halting the run" >&2; s=65; fi; rm -rf "$d"; exit $s""",
    "sh",
    "{slot:owner-briefing}",
]
idle-timeout-ms = 14400000

[[sequence.ctx-branch-arm-s-13-building-body-18-park-report-record-then.sequence]]
id = "park-report-append"
title = "Park Report Append"
kind = "project"
input = ["slot:review-verdict"]

[[sequence.ctx-branch-arm-s-13-building-body-18-park-report-record-then.sequence.projection]]
source = "slot:review-verdict"
destination = "slot:park-report"
operation = "append"

[[sequence.ctx-branch-arm-s-13-building-body-18-park-report-record-then.sequence.output]]
slot = "slot:park-report"
operation = "append"

[procedure]
description = "Implement one task from the task board with the owner in the loop: confirm plannotator is installed, draft the work and put the owner inside plannotator to annotate the draft, refine it into the plan, then repeat worker-then-review — summoning the owner on every gate-green approved round — until the reviewer and the owner both approve; then record a tracked brief and commit."
input = ["port:task"]
output = [
    "port:brief-report",
    "port:commit-report",
    "port:park-report",
]

[[procedure.sequence]]
id = "preflight-binary"
title = "Confirm plannotator is installed"
output = ["slot:preflight-output"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "command -v plannotator",
]

[[procedure.sequence]]
id = "draft-writing"
title = "Draft the work"
agent = "agent:smart-1"
prompt = "prompt:draft-writing"
input = [
    "port:task",
    "resource:task-board",
]
output = ["slot:draft"]

[[procedure.sequence]]
id = "plan-owner-review"
title = "Annotate the plan (plannotator, plan mode)"
input = ["slot:draft"]
output = ["slot:plan-decision"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    """printf %s "$1" | jq -n --arg plan "$(cat)" '{hook_event_name: "PreToolUse", tool_name: "ExitPlanMode", tool_input: {plan: $plan}}' | PLANNOTATOR_ORIGIN=implement-gated PLANNOTATOR_PORT="${PLANNOTATOR_PORT:-7411-7460}" plannotator""",
    "sh",
    "{slot:draft}",
]
idle-timeout-ms = 14400000

[[procedure.sequence]]
id = "plan-refine"
title = "Refine the plan against the owner's annotations"
agent = "agent:smart-1"
prompt = "prompt:plan-refine"
input = [
    "slot:draft",
    "slot:plan-decision",
]
output = ["slot:plan"]

[[procedure.sequence]]
id = "building"
title = "Building"
kind = "loop"
sequence = "sequence:building-body"
max-iterations = 10
on-exhausted = "abort"
on-abort = "signal:gate-timed-out"

[[procedure.sequence.until.all]]
slot = "slot:review-verdict"
field = "status"
equals = "approved"

[[procedure.sequence.until.all]]
slot = "slot:repo-gates-passed"
field = "ok"
equals = true

[[procedure.sequence.until.all]]
slot = "slot:owner-decision"
field = "decision"
equals = "approved"

[procedure.sequence.abort-if]
slot = "slot:repo-gates-passed"
field = "timed-out"
equals = true

[[procedure.sequence]]
id = "shipping-status"
title = "Check working tree status"
output = ["slot:shipping-status"]

[procedure.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[procedure.sequence]]
id = "shipping-maybe-commit"
title = "Shipping Maybe Commit"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-shipping-maybe-commit-then"

[procedure.sequence.when.not]
slot = "slot:shipping-status"
equals = ""
