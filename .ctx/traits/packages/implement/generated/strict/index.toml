            Using the phase contract {slot:phase-brief}, extract every standing rule the implementer and reviewers of this phase need (house rules such as core purity, dependency policy, #[allow] policy, byte-stability; the repo validation gates; any product sections the phase touches). For each rule, record its exact repo-relative path + section/heading in "source" and its exact authoritative line(s) verbatim in "quote". A claim you cannot cite with both a source and an exact quote is not a rule — omit it rather than invent an authority.
            Put any phase-relevant explanatory material that is not itself a sourced rule (background, rationale) in the separate non-normative "context" field. Later steps read ONLY your structured output, never the file — anything missing here is invisible downstream."""
