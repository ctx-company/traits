[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-message"
title = "Write the commit message (scribe)"
agent = "agent:scribe"
prompt = "prompt:shipping-message"
input = [
    "port:phase",
    "slot:review-verdict-1",
    "slot:review-verdict-2",
    "slot:phase-brief",
]
output = ["slot:shipping-message"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-stage"
title = "Stage all changes except runtime state"
output = ["slot:shipping-stage-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
    "--",
    ":!.agents/runs",
]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-commit"
title = "Commit the work"
input = ["slot:shipping-message"]
output = ["slot:commit-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "commit",
    "-m",
    "{slot:shipping-message}",
]

[[sequence.ctx-branch-arm-s-13-building-body-20-park-report-record-1-then.sequence]]
id = "park-report-append-1"
title = "Park Report Append 1"
kind = "project"
input = ["slot:review-verdict-1"]

[[sequence.ctx-branch-arm-s-13-building-body-20-park-report-record-1-then.sequence.projection]]
source = "slot:review-verdict-1"
destination = "slot:park-report"
operation = "append"

[[sequence.ctx-branch-arm-s-13-building-body-20-park-report-record-1-then.sequence.output]]
slot = "slot:park-report"
operation = "append"

[[sequence.ctx-branch-arm-s-13-building-body-20-park-report-record-2-then.sequence]]
id = "park-report-append-2"
title = "Park Report Append 2"
kind = "project"
input = ["slot:review-verdict-2"]

[[sequence.ctx-branch-arm-s-13-building-body-20-park-report-record-2-then.sequence.projection]]
source = "slot:review-verdict-2"
destination = "slot:park-report"
operation = "append"

[[sequence.ctx-branch-arm-s-13-building-body-20-park-report-record-2-then.sequence.output]]
slot = "slot:park-report"
operation = "append"

[[sequence.planning-body.sequence]]
id = "planning-produce"
title = "Planning Produce"
agent = "agent:smart-1"
prompt = "prompt:planning-produce"
input = [
    "port:phase",
    "slot:phase-brief",
    "slot:product-brief",
    { slot = "slot:planning-verdict", optional = true },
]
output = ["slot:draft"]

[[sequence.planning-body.sequence]]
id = "planning-review"
title = "Planning Review"
agent = "agent:smart-2"
prompt = "prompt:planning-review"
input = [
    "slot:draft",
    "port:phase",
    "slot:phase-brief",
    "slot:product-brief",
]
output = ["slot:planning-verdict"]

[procedure]
description = "Implement one execution-plan phase end to end with verbatim draft execution: extract context, draft the approach, implement it exactly as written with a typed deviation record, refine against two independent reviewers, commit — blocking rather than adapting when the draft is unsatisfiable."
input = ["port:phase"]
output = [
    "port:commit-report",
    "port:leftovers",
    "port:park-report",
]

[[procedure.sequence]]
id = "phase-extraction"
title = "Copy the phase contract (clerk)"
agent = "agent:clerk"
prompt = "prompt:phase-extraction"
input = [
    "port:phase",
    "resource:execution-plan",
]
output = ["slot:phase-brief"]

[[procedure.sequence]]
id = "product-extraction"
title = "Distill the product rules (clerk)"
agent = "agent:clerk"
prompt = "prompt:product-extraction"
input = [
    "port:phase",
    "resource:rule-authority",
    "slot:phase-brief",
]
output = ["slot:product-brief"]

[[procedure.sequence]]
id = "planning"
title = "Planning"
kind = "loop"
sequence = "sequence:planning-body"
max-iterations = 2
on-exhausted = "continue"

[procedure.sequence.until]
slot = "slot:planning-verdict"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "building"
title = "Building"
kind = "loop"
sequence = "sequence:building-body"
max-iterations = 5
on-exhausted = "block"

[[procedure.sequence.until.all]]

[[procedure.sequence.until.all.all]]
slot = "slot:review-verdict-1"
field = "status"
equals = "approved"

[[procedure.sequence.until.all.all]]
slot = "slot:review-verdict-2"
field = "status"
equals = "approved"

[[procedure.sequence.until.all]]
slot = "slot:repo-gates-passed"
field = "ok"
equals = true

[[procedure.sequence.until.all]]
slot = "slot:building-sealed"
equals = true

[[procedure.sequence.until.all]]
field = "needs"
equals = 0
count = "slot:leftovers"
field-equals = []

[[procedure.sequence.until.all]]

[[procedure.sequence.until.all.any]]
equals = 0
count = "slot:leftovers"

[[procedure.sequence.until.all.any]]
iteration-at-least = 2

[[procedure.sequence]]
id = "shipping-status"
title = "Check working tree status"
output = ["slot:shipping-status"]

[procedure.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[procedure.sequence]]
id = "shipping-maybe-commit"
title = "Shipping Maybe Commit"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-shipping-maybe-commit-then"

[procedure.sequence.when.not]
slot = "slot:shipping-status"
equals = ""
