id = "implement"
schema-version = "0.3"
version = "0.19.0"
name = "Implement (Strict)"
summary = "Verbatim dogfood implementation procedure: extract the phase and product context, draft the approach, implement the draft exactly as written, refine against two independent reviewers with a typed deviation record, and commit only once both approve."
variant = "strict"

[metadata]
tag = [
    "dogfood",
    "implementation",
    "review",
    "multi-agent",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"
summary = "Prefer changes that remain correct under ordinary failure and boundary conditions."

[[intent.require]]
id = "pragmatism"
summary = "Choose the smallest practical change that satisfies the phase contract."

[[intent.require]]
id = "elegance"
summary = "Favor clear, cohesive designs over clever or incidental complexity."

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "review-before-final"

[[intent.require]]
id = "bounded-refinement"

[[intent.require]]
id = "verbatim-draft-execution"
summary = "Execute the agreed draft exactly as written; record every departure instead of silently adapting."

[[intent.avoid]]
id = "accretion"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "gold-plating"

[[intent.avoid]]
id = "duplication"

[[intent.avoid]]
id = "scope-creep"

[[intent.avoid]]
id = "unbounded-loop"

[[intent.avoid]]
id = "rubber-stamp-review"

[[intent.avoid]]
id = "silent-plan-deviation"
summary = "Never adapt around an unsatisfiable or contradicted draft without recording and disposing of the deviation."

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "phase"
direction = "input"
schema = "schema:text"
description = 'Phase or group to implement, exactly as named in .plans/EXECUTION_PLAN.md (e.g. "P196-fix" or "Group 43").'

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Final commit evidence from the git commit command step. Absent when the clean-tree gate (P397) skipped the commit tail entirely — a clean working tree at gate time means nothing to commit."
value = "slot:commit-output"

[[port]]
id = "leftovers"
direction = "output"
schema = "[schema:leftover]"
optional = true
description = "Adjudicated leftovers: legitimate follow-on work the shipped result does not require, surviving the reviewer's two-question test. Omitted from the run's structured final outputs when empty; slot:leftovers always carries the signed evidence either way."
title = "Leftovers"
format = [
    "structured",
    "table",
]
value = "slot:leftovers"

[[port]]
id = "park-report"
direction = "output"
schema = "[schema:review-verdict]"
optional = true
description = "Typed park record for an unapproved run (P414): one entry per reviewed verdict that was still revise in the final round, each with the wall citation (if any), the exact blockers, and escalation state. Present in the run's persisted output-port evidence only when the build loop exhausted without approval — the run parks and no commit is created. A dispatch-time preflight refuses a sibling phase that explicitly cites the same wall-id while this stands unforced."
title = "Park Report"
format = [
    "structured",
    "table",
]
value = "slot:park-report"

[[slot]]
id = "phase-brief"
schema = "schema:text"
description = "The phase's execution-plan section, copied exactly as written — the scope contract every later step works from instead of the plan file."
hint = "Verbatim copy: group heading + preamble + the phase bullet(s) with Why/Where/Approach/Watch/Done-when/Deps. No paraphrasing."

[[slot]]
id = "product-brief"
schema = "schema:product-brief"
description = "Distilled product-contract rules relevant to this phase, each with an exact source citation and quote from PRODUCT.md; later steps read this instead of the file."

[[slot]]
id = "draft"
schema = "schema:text"
description = "The implementation draft for the phase — the contract the produce-first build loop implements."
hint = "Scope, files to touch, approach, reuse/abstraction opportunities, validation plan, risks. A plan, not an implementation."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's report of the implemented state; replaced in full each produce round."
hint = "What changed (files), how it was validated, and open concerns. Revised after every produce round; once a verdict has been attached, ends with a Blocker dispositions section — one entry per blocker id: the done-when quoted verbatim, what changed, where, and how that done-when was verified (or the out-of-scope justification)."

[[slot]]
id = "leftovers"
schema = "[schema:leftover]"
description = "Adjudicated leftovers: legitimate follow-on work the shipped result does not require, surviving the reviewer's two-question test. Replaced by each review step; an empty list is a valid, signed claim that none exist."

[[slot]]
id = "park-report"
schema = "[schema:review-verdict]"
description = "This round's typed park record (P414): empty when every verdict reviewed this round is approved; one entry per reviewed verdict that is revise, each copied unchanged. Written each round by deterministic project steps (deriveParkReportStep), never model-authored, so it can never disagree with the verdict(s) it comes from. The run parks on these entries when the build loop exhausts unapproved — no commit is ever created while any reviewed verdict this round is still revise."

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "review-diff"
schema = "schema:text"
description = "Inventory of every file changed this round with its insertion/deletion counts — an index of where the work landed, never the work itself. The reviewer opens whatever it needs with its own tools."
hint = "git diff --stat output, excluding runtime state. No patch bodies: a deleted generated artifact would otherwise contribute its entire content."

[[slot]]
id = "repo-gates-passed"
schema = "schema:repo-gates-result"
description = "This round's repository gate result: whether the phase-mandated gate chain passed, and the exact command that decided it."

[[slot]]
id = "deviation-report"
schema = "[schema:deviation-report]"
description = "Every proposed departure from the verbatim draft — including a rejected improvement the worker considered but did not make — recorded instead of silently adapted. Empty when the draft was followed exactly."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "smart-1's refinement verdict for the current work state."

[[slot]]
id = "review-verdict-2"
schema = "schema:review-verdict"
description = "smart-2's refinement verdict for the current work state."

[[slot]]
id = "planning-verdict"
schema = "schema:reviewer-verdict"
description = 'Reviewer verdict for the "planning" produce-review round.'

[[slot]]
id = "building-sealed"
schema = "schema:boolean"
description = "Runtime slot building-sealed."

[[slot]]
id = "shipping-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."
hint = "Empty exactly when the tree is clean; the commit tail is skipped entirely in that case, so no commit is attempted and the scribe never runs."

[[slot]]
id = "shipping-message"
schema = "schema:text"
description = "The commit message the scribe writes for the completed work."

[[slot]]
id = "shipping-stage-output"
schema = "schema:text"
description = "Verbatim output of the git-add staging command."

[[resource]]
id = "execution-plan"
path = ".plans/EXECUTION_PLAN.md"
root = "repo"
hint = "Repo-root path for the execution plan; agents read that file with their own tools and never inline it."
trigger = "on-demand"

[[resource]]
id = "rule-authority"
path = ".docs/PRODUCT.md"
root = "repo"
hint = "Repo-root path for the product contract: ADVISORY context, and the only document standing rules may be cited from — no other .docs file (archive/, research/, BLOG_*, LAUNCH_*, or any other) may create a rule. The phase contract outranks it wherever they conflict. Agents read this file with their own tools and never inline it."
trigger = "on-demand"

[[schema]]
id = "decision"
schema = "schema:text"
allowed = [
    "approved",
    "revise",
]

[[schema]]
id = "reviewer-verdict"
description = "Minimal produce-review verdict: decision status plus the blockers that justify a revise."

[schema.fields.blockers]
schema = "[schema:text]"
required = true
description = "The blocking defects that justify a revise verdict; empty when status is approved."

[schema.fields.status]
schema = "schema:decision"
required = true
description = "approved when no blocker remains; revise when at least one blocker remains."

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "The shape of an acceptable fix: the invariant it must establish and what to replace or delete — never just the cited call sites."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "deviation-report"
description = "One proposed departure from a verbatim plan under strict authority: what was planned, what actually happened, why, and its disposition."

[schema.fields.actual]
schema = "schema:text"
required = true
description = "What actually happened instead."

[schema.fields.disposition]
schema = "schema:text"
required = true
description = "How the departure was resolved or is being handled."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this deviation, reused verbatim if it recurs."

[schema.fields.planned]
schema = "schema:text"
required = true
description = "What the plan specified, verbatim or tightly paraphrased."

[schema.fields.rationale]
schema = "schema:text"
required = true
description = "Why the departure occurred."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "leftover"
description = "One adjudicated leftover: real follow-on work that the shipped result does not require, with its reason class, prerequisites, standalone-evidence, and completion check."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "The falsifiable check that will confirm this item is complete once someone takes it up."

[schema.fields.evidence]
schema = "schema:text"
required = true
description = "Why the shipped result stands alone without this item — the second question's verified answer."

[schema.fields.needs]
schema = "[schema:text]"
required = true
description = "What must happen before this item can be done; may be empty."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "Why this follow-on work is outside the run: needs-unlanded (depends on work not yet landed) or needs-human (requires an owner or authority action this run cannot take)."
allowed = [
    "needs-unlanded",
    "needs-human",
]

[schema.fields.what]
schema = "schema:text"
required = true
description = "The follow-on work item, stated concretely in exactly one sentence."

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if a blocking defect remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, house-rule violations (core purity, a new dependency, a new #[allow], required byte-stability broken), failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the phase), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Non-empty when status is revise; an empty list (never omitted — always return the key) when approved. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the phase contract is a placeholder or lacks a falsifiable Done-when; a prerequisite phase named in Deps has not landed in this tree; the group is marked SUPERSEDED or CANCELLED; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the phase's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS phase that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-phase seam citations ONLY: counterpart work the execution plan assigns to a DIFFERENT phase, each citing that phase's id. Never in-phase scope — an unimplemented item of THIS phase's checklist is a blocker, and unimplemented in-phase scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-phase seam exists."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise only when at least one blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the phase contract, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "product-rule"
description = "One standing product rule, sourced from PRODUCT.md and carrying its exact citation."

[schema.fields.quote]
schema = "schema:text"
required = true
description = "The exact authoritative line(s) from the source, verbatim — not paraphrased."

[schema.fields.rule]
schema = "schema:text"
required = true
description = "The standing rule's substance, in the implementer's terms."

[schema.fields.source]
schema = "schema:text"
required = true
description = 'Repo-relative path and section/heading/line for this rule in PRODUCT.md (e.g. ".docs/PRODUCT.md — ## Validation Gates").'

[[schema]]
id = "product-brief"
description = "Distilled, source-verified product contract for this phase."

[schema.fields.context]
schema = "schema:text"
description = "Non-normative explanatory context worth keeping in mind (e.g. background, rationale). Never binding and never a substitute for a sourced rule."

[schema.fields.rules]
schema = "[schema:product-rule]"
required = true
description = "Every standing house rule relevant to this phase, each with a source path/section and exact quote. A claim without both is not a rule and must be omitted, not invented."

[[schema]]
id = "repo-gates-result"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv the gate ran. This is the command that decides done-ness — re-run THIS, not a command named anywhere else."

[schema.fields.exit-code]
schema = "schema:number"
description = "The gate command's exit status. Absent when the command never produced one, which itself means it could not be executed."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True when the gate command exited successfully."

[schema.fields.tail]
schema = "schema:text"
description = "The end of the failed gate's output — stderr when it said anything, otherwise stdout. Present ONLY when ok is false. This is the reason the gate failed: read it before attributing the failure to anything else, and never infer a cause the tail does not state."

[schema.fields.timed-out]
schema = "schema:boolean"
description = "Present and true only when the gate was killed by its own timeout rather than exiting. A timed-out gate proves nothing about the work."

[[agent]]
id = "worker"
description = "Implements the draft and applies reviewer fixes."
summary = "Implementation role."

[[agent]]
id = "scribe"
description = "Writes the commit message for the completed phase from the execution plan; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "clerk"
description = "Fast extraction model: copies the phase section out of the execution plan verbatim and distills the product contract, so no later step re-reads those files."
summary = "Context-extraction role."

[[agent]]
id = "smart-1"
description = "Strong model: drafts the implementation plan, and reviews the work, including every recorded deviation, in the refinement loop."
summary = "Drafting and first-reviewer role."

[[agent]]
id = "smart-2"
description = "Independent strong review model: reviews the implemented work and every recorded deviation each refinement pass, separately from smart-1."
summary = "Second-reviewer role."

[prompt.building-produce]
text = """
Implement {port:phase} following the draft {slot:draft} VERBATIM: execute exactly as specified, with no improvisation and no ACTUAL departure from what is written, however minor.
    If no reviewer verdict is attached to this frame, this is round 1. If one IS attached, this is a fix round: fix every BLOCKER it names that falls within this phase's stated scope and Definition of Done while staying strictly verbatim to the draft — never introduce a new ACTUAL departure to satisfy a finding. If a blocker can only be fixed by actually departing from the draft, do not deviate: STOP and say so plainly in the work summary so the loop can exhaust and block rather than silently adapting.
    If the draft is unsatisfiable as written — it contradicts the actual code, omits a step you need, or cannot be executed against reality — STOP and say so plainly in your work summary rather than adapting around it; do not implement a modified version.
    If you notice a place the draft could be improved, do NOT take it: record it as a typed deviation report entry instead — what was planned, what you actually did (which must match the draft verbatim), the rationale for the proposed improvement, and disposition "rejected — implemented verbatim". A deviation report entry never records something you actually did differently from the draft; an actual departure means the draft was unsatisfiable, and that means STOP, not a recorded deviation. Any deviation report entries from a prior round, if attached as context, must be carried forward verbatim alongside any new ones this round.
    Respect the phase contract {slot:phase-brief} and the house rules in {slot:product-brief} (core purity, no new deps, no new #[allow], byte-stability where the plan demands it); do not widen any interface to make a caller compile — fix the caller.
    A leftovers list from this round's most recent review, if any, is attached as context: carry every still-valid entry into your revised "Leftovers proposed" section verbatim — never re-copy from memory. Any new leftover your fixes surfaced is proposed separately, in the same section, for the next review round to adjudicate.
    A repository gate result from this round's most recent evidence, if any, is attached as context. When its ok field is false, re-run its argv verbatim — that exact command is what decides done-ness, whatever any document or reviewer calls the gate — and use what it reports Its tail is the gate's own output and states the actual reason — start there rather than guessing. A tail showing the gate could not run at all (missing recipe, command not found) is a repository misconfiguration you cannot fix from inside the run: report it in the work summary instead of attempting a code change.
    Never edit files under .plans/ except this run's own phase entry, and even there touch only its checklist mark, its dispositions, and its board line — never another phase's text, a group preamble, or the plan tail.
    Run the gates named in this phase's own Definition of Done before reporting.
    Propose leftovers explicitly: end the work summary with a "Leftovers proposed" section listing any legitimate follow-on work (what — one sentence —, reason — needs-unlanded or needs-human —, needs, evidence it does not block this result standing alone, done-when), or state explicitly that none exist. Reviewers adjudicate these, not you.
    Return exactly two outputs: work-summary (what changed, files, how it was validated, open concerns, the leftovers-proposed section, and — once a verdict has ever been attached — a "Blocker dispositions" section listing every blocker id with its done-when quoted verbatim, what changed, where, and how it was verified) and deviation-report (every rejected-but-considered improvement recorded above, including any carried forward; an empty list when none arose).
    End this turn with the structured output and nothing else — no prose status line after the payload."""
input = [
    "port:phase",
    "slot:draft",
    "slot:phase-brief",
    "slot:product-brief",
]
output = [
    "slot:work-summary",
    "slot:deviation-report",
]

[prompt.building-review-1]
text = """
Review the produced work for {port:phase} against the draft {slot:draft}. Current work summary: {slot:work-summary}.
            {slot:review-diff} lists every file changed this round with its insertion/deletion counts — an index of where the work landed, never the work itself. Open whatever it points at with your own tools; it omits untracked files. {slot:repo-gates-passed} is this round's repository gate verdict (build, clippy, fmt, CDK typecheck); a false verdict is grounds for a blocker even if the diff otherwise looks correct. When it failed it carries a tail of the gate's own output: that tail IS the reason — cite it, and never attribute the failure to a cause it does not state. If the tail shows the gate could not run at all (a missing recipe, a command not found), that is a misconfigured repository, not a defect in the work, and it is not the worker's blocker to clear: the argv is fixed in the trait and no amount of implementation changes it.
            Verify any house-rule citation directly against {resource:rule-authority} — the only document a rule may be cited from. AUTHORITY ORDER: the phase contract outranks it; a product-doc statement that conflicts with this phase's contract is NEVER a blocker (the phase exists to change the doc) — require only that the work summary names the sections now stale. Rules marked superseded-by-phase in the brief are context, not grounds. Recorded deviations: {slot:deviation-report}. Verify every recorded deviation is a genuinely rejected-but-considered proposal — the actual implementation still matches the draft verbatim on that point — not a departure that was actually taken; silent adaptation not recorded here is itself a BLOCKER.
            PLAN-FIDELITY AUTHORITY: this fragment's rule below is authoritative over REVIEW_VERDICT_DOCTRINE's own default completion-criteria paragraph for how strictly the plan and Definition of Done must be matched — apply this fragment's rule directly, with no separate generic checklist formula layered on top. This never touches genuine-defect, house-rule, required-gate, or duplication blocking, which stay unconditional BLOCKERs exactly as REVIEW_VERDICT_DOCTRINE requires. Strict authority: require verbatim execution of the plan. Record every proposed departure as a typed deviation report — the id, what was planned, what actually happened, the rationale, and its disposition — rather than silently accepting it, and ABORT when the plan itself is unsatisfiable as written rather than improvising around it. Verbatim execution governs fidelity only; a genuine correctness defect is still a BLOCKER under REVIEW_VERDICT_DOCTRINE even in a plan executed exactly as written.
            A BLOCKER also includes an unrecorded deviation from the draft, or any recorded deviation that reflects an actual departure rather than a rejected proposal. Approve ONLY verbatim work where every recorded deviation is a rejected proposal — never a proposal that was taken.
            If the work summary ends with a Blocker dispositions section, those ids are the blockers raised last pass: verify each disposition's quoted done-when directly with your tools FIRST; a blocker whose done-when still fails returns with recurrence-of set to its id — never silently rewritten as a new blocker.
                    Consult the phase contract {slot:phase-brief} and house rules {slot:product-brief}, and inspect the actual working tree with your tools — never review the summary alone; run the gates named in the phase's own Definition of Done if the summary does not prove they ran.
                    Before citing any house rule in a blocker, verify it against the phase's declared rule-authority: open that resource yourself with your tools, confirm the rule's source path/section and quoted line(s) in {slot:product-brief} match the authority exactly, and drop the blocker rather than raise it if you cannot verify both — an unsourced or misquoted rule is not a rule. When a blocker does cite a house rule, set its rule-source and rule-quote fields to the verified citation; leave both unset for blockers that are not rule-based (correctness bugs, duplication, and the like).
                    Judge the work SOLELY against this phase's stated scope and Definition of Done. A phase is complete when its own DoD holds — even if the overall project does not yet build or pass whole-project gates, which belong to later phases. Do not invent acceptance criteria the phase does not state, and do not fail the work for deliverables or gates scoped to a different phase.
                    Hold the work to correctness, robustness, pragmatism, elegance, leanness, and reuse. A BLOCKER makes the work genuinely unmergeable: a correctness bug, a house-rule violation, a gate the phase's own Definition of Done requires that is failing, clear over-build (accretion, defensive validation for impossible states, scope creep), OR un-abstracted duplication — logic re-implemented or copied where existing code should have been reused or a shared abstraction extracted. Everything else — subjective style, naming, taste, optional improvements, follow-up, or gates that belong to later phases — is ADVISORY.
