[[procedure.sequence]]
id = "write-plan"
title = "Write the research plan"
agent = "agent:probe"
prompt = "prompt:write-plan"
input = [
    "port:topic",
    "slot:topic-slug",
    "resource:research-brief-template",
    "slot:streams",
    "slot:deliverables-manifest",
    "resource:evidence-table-template",
]
output = ["slot:plan-receipt"]

[[procedure.sequence]]
id = "research-streams"
title = "Research streams serially"
kind = "for-each"
output = ["slot:findings"]
sequence = "sequence:research-one-stream"
over = "slot:streams"
item = "slot:current-stream"
max-items = 6

[[procedure.sequence]]
id = "triangulate"
title = "Triangulate sources and contradictions"
agent = "agent:synthesis"
prompt = "prompt:triangulate"
input = [
    "slot:findings",
    "port:topic",
    "resource:research-standards",
    "resource:quality-rubric",
    "resource:source-quality-guide",
    "slot:topic-slug",
]
output = ["slot:triangulation"]

[[procedure.sequence]]
id = "quality-gate"
title = "Assess and gate evidence quality"
kind = "loop"
sequence = "sequence:assess-evidence-quality"
max-iterations = 1
on-exhausted = "block"

[[procedure.sequence.until.any]]

[[procedure.sequence.until.any.all]]
slot = "slot:deliverables-manifest"
field = "quality-target"
equals = "basic"

[[procedure.sequence.until.any.all]]
slot = "slot:quality-score"
at-least = 7

[[procedure.sequence.until.any]]

[[procedure.sequence.until.any.all]]
slot = "slot:deliverables-manifest"
