[[procedure.sequence]]
id = "synthesize"
title = "Synthesize the research deliverables"
agent = "agent:synthesis"
prompt = "prompt:synthesize"
input = [
    "slot:findings",
    "slot:triangulation",
    "slot:quality-verdict",
    "port:topic",
    "resource:research-standards",
    "resource:citation-style",
    "resource:research-readme-template",
    "slot:deliverables-manifest",
    "slot:topic-slug",
]
output = ["slot:synthesis-draft"]

[[procedure.sequence]]
id = "verification-loop"
title = "Bounded Chain-of-Verification"
kind = "loop"
sequence = "sequence:verify-and-revise"
max-iterations = 3
on-exhausted = "block"

[procedure.sequence.until]
slot = "slot:verification-verdict"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "final-review-gate"
title = "Gate packaging on final review"
kind = "loop"
sequence = "sequence:review-and-revise-final"
max-iterations = 3
on-exhausted = "block"

[procedure.sequence.until]
slot = "slot:final-review-verdict"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "deliver"
title = "Report the research delivery"
agent = "agent:synthesis"
prompt = "prompt:deliver"
input = [
    "port:topic",
    "slot:synthesis-draft",
    "slot:quality-verdict",
    "slot:final-review-verdict",
]
output = ["slot:delivery-report"]
