id = "auto-research"
schema-version = "0.3"
version = "0.1.0"
name = "Auto Research"
summary = "Runs bounded experiments whose keep/discard decision is a deterministic guard over typed command output, with optional wall-time, token, cost, and delta-line caps."

[metadata]
tag = [
    "auto-research",
    "experiments",
    "optimization",
    "provenance",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "gates-green-before-commit"

[[behavior.method]]
id = "evidence-first"

[[port]]
id = "experiment-command"
direction = "input"
schema = "[schema:text]"
description = "No-shell argv executed for baseline and candidate measurements."

[[port]]
id = "max-cost-microusd"
direction = "input"
schema = "schema:integer"
optional = true
description = "Optional maximum accepted experiment-command provider cost; the cap is skipped when omitted, and discards a candidate that supplies no cost-microusd measurement."

[[port]]
id = "max-delta-lines"
direction = "input"
schema = "schema:integer"
optional = true
description = "Optional maximum accepted changed lines relative to the current best Git ref; the cap is skipped when omitted, and discards a candidate that supplies no delta-lines measurement."

[[port]]
id = "max-experiments"
direction = "input"
schema = "schema:integer"
description = "Positive runtime-resolved bound on candidate experiments."

[[port]]
id = "max-token-estimate"
direction = "input"
schema = "schema:integer"
optional = true
description = "Optional maximum accepted static non-billing context estimate for the candidate; the cap is skipped when omitted, and discards a candidate that supplies no token-estimate measurement."

[[port]]
id = "max-wall-time-ms"
direction = "input"
schema = "schema:integer"
optional = true
description = "Optional maximum accepted experiment-command wall time per candidate; the cap is skipped when omitted, and discards a candidate that supplies no wall-time-ms measurement."

[[port]]
id = "metric-field"
direction = "input"
schema = "schema:text"
description = "Human-readable meaning and unit normalized into experiment-result.metric."

[[port]]
id = "objective"
direction = "input"
schema = "schema:text"
description = "The bounded optimization objective for this experiment run."

[[port]]
id = "summary"
direction = "output"
schema = "schema:auto-research-summary"
description = "Typed baseline, experiment measurements, kept count, and final best metric."
title = "Auto-research Summary"
format = ["json"]
value = "slot:summary"

[[slot]]
id = "apply-receipt"
schema = "schema:text"
description = "Worker receipt for the bounded candidate mutation."

[[slot]]
id = "baseline-result"
schema = "schema:auto-research-result"
description = "Trusted command measurement that seeds best state."

[[slot]]
id = "best-metric"
schema = "schema:number"
description = "Loop-carried lower-is-better metric projected only from trusted command output."

[[slot]]
id = "best-ref"
schema = "schema:text"
description = "Immutable current-best commit SHA, advanced only after a kept commit succeeds."

[[slot]]
id = "candidate-result"
schema = "schema:auto-research-result"
description = "Current trusted candidate measurement read by the declared keep guard."

[[slot]]
id = "captured-ref"
schema = "schema:auto-research-git-ref"
description = "Latest immutable commit SHA captured by a trusted Git command."

[[slot]]
id = "command-receipt"
schema = "schema:text"
description = "Latest deterministic Git command's raw stdout."

[[slot]]
id = "decisions"
schema = "[schema:auto-research-decision-status]"
description = "Baseline marker and runtime-owned keep/discard dispositions in execution order."

[[slot]]
id = "experiment-count"
schema = "schema:integer"
description = "Candidate experiments recorded by keep/discard arms."

[[slot]]
id = "history"
schema = "[schema:auto-research-result]"
description = "Baseline and candidate command measurements in deterministic ledger order."

[[slot]]
id = "kept-count"
schema = "schema:integer"
description = "Candidate experiments selected by the declared keep guard."

[[slot]]
id = "proposal"
schema = "schema:auto-research-proposal"
description = "Current fresh experiment proposal."

[[slot]]
id = "readiness"
schema = "schema:auto-research-readiness"
description = "Latest typed worktree readiness result."

[[slot]]
id = "summary"
schema = "schema:auto-research-summary"
description = "Terminal typed experiment report."

[[resource]]
id = "auto-research-summary-replay"
path = "resources/derive-summary.mjs"
digest = "sha256:007749f093bf5cbc5d2dcca8eab4dd123bdd729f7de36243c9f424842ba5df56"
hint = "Digest-pinned replay validator that recomputes and re-asserts the terminal summary from runtime-owned counters and ledgers."
trigger = "on-demand"

[[schema]]
id = "auto-research-decision-status"
schema = "schema:text"
allowed = [
    "baseline",
    "kept",
    "discarded",
]
description = "Deterministic disposition of one measured row."

[[schema]]
id = "auto-research-git-ref"
description = "Typed immutable Git ref captured from the isolated worktree."

[schema.fields.sha]
schema = "schema:text"
required = true
description = "Immutable Git commit SHA captured by the trusted local runtime."

[[schema]]
id = "auto-research-proposal"
description = "One fresh, bounded experiment proposal."

[schema.fields.change]
schema = "schema:text"
required = true
description = "Exact bounded change for the worker to apply."

[schema.fields.hypothesis]
schema = "schema:text"
required = true
description = "Falsifiable reason this small change may improve the declared metric."

[schema.fields.title]
schema = "schema:text"
required = true
description = "Short experiment label."

[[schema]]
id = "auto-research-readiness"
description = "Typed preflight result that gates every mutation."

[schema.fields.detail]
schema = "schema:text"
required = true
description = "Concise readiness or abort reason."

[schema.fields.status]
schema = "schema:auto-research-readiness-status"
required = true
description = "Ready only for a clean, isolated Git worktree."

[[schema]]
id = "auto-research-readiness-status"
schema = "schema:text"
allowed = [
    "ready",
    "abort",
]
description = "Whether the isolated workbench is safe to mutate."

[[schema]]
id = "auto-research-result"
description = "Typed measurement emitted directly by the trusted experiment command."

[schema.fields.artifacts]
schema = "[schema:text]"
required = true
description = "Paths, digests, or other evidence emitted by the experiment command."

[schema.fields.canonical-digest]
schema = "schema:text"
description = "Optional canonical digest of the evaluated candidate."

[schema.fields.cost-microusd]
schema = "schema:integer"
description = "Optional provider cost of the experiment command, checked against max-cost-microusd when both are present."

[schema.fields.delta-lines]
schema = "schema:integer"
description = "Optional changed line count relative to the current best worktree commit."

[schema.fields.iteration]
schema = "schema:integer"
description = "Optional monotonic experiment-command invocation index, with baseline at zero."

[schema.fields.measurement-scope]
schema = "schema:text"
description = "Optional explicit boundary of the dimensions measured by the experiment command."

[schema.fields.metric]
schema = "schema:number"
required = true
description = "Primary lower-is-better experiment metric."

[schema.fields.score]
schema = "schema:number"
description = "Optional supplementary passing count reported by the experiment command."

[schema.fields.status]
schema = "schema:auto-research-result-status"
required = true
description = "Whether the experiment command produced a usable measurement."

[schema.fields.token-estimate]
schema = "schema:integer"
description = "Optional static non-billing context estimate reported by the experiment command."

[schema.fields.wall-time-ms]
schema = "schema:integer"
description = "Optional wall time spent by the experiment command."

[[schema]]
id = "auto-research-result-status"
schema = "schema:text"
allowed = [
    "ok",
    "error",
]
description = "Whether the trusted experiment command produced a usable measurement."

[[schema]]
id = "auto-research-summary"
description = "Typed terminal summary backed by command measurements and runtime guard evidence."

[schema.fields.best]
schema = "schema:number"
description = "Final lower-is-better best metric when a baseline was available."

[schema.fields.detail]
schema = "schema:text"
required = true
description = "Concise terminal explanation, including any abort reason or measurement limitations."

[schema.fields.experiments]
schema = "schema:integer"
required = true
description = "Candidate experiments recorded after the baseline measurement."

[schema.fields.kept]
schema = "schema:integer"
required = true
description = "Candidates selected by the declared status-and-metric guard."

[schema.fields.rows]
schema = "[schema:auto-research-summary-row]"
required = true
description = "Baseline followed by every unchanged trusted measurement and deterministic disposition."

[schema.fields.status]
schema = "schema:auto-research-summary-status"
required = true
description = "Completed after the declared experiment budget, or aborted by preflight/baseline gating."

[[schema]]
id = "auto-research-summary-row"
description = "One measured experiment and its deterministic disposition."

[schema.fields.decision]
schema = "schema:auto-research-decision-status"
required = true
description = "Baseline marker or keep/discard decision replayed from the declared guards."

[schema.fields.measurement]
schema = "schema:auto-research-result"
required = true
description = "The exact trusted command measurement."

[[schema]]
id = "auto-research-summary-status"
schema = "schema:text"
allowed = [
    "completed",
    "aborted",
]
description = "Terminal experiment outcome."

[[agent]]
id = "proposer"
description = "Proposes one small experiment from the objective, current best metric, and typed measurement history in a fresh per-frame session."
summary = "Fresh bounded-experiment proposal role."
system = "Propose one falsifiable, minimal change. Do not claim a metric result, a keep decision, or access to prior conversational context."

[[agent]]
id = "summarizer"
description = "Reports a typed abort when preflight or baseline gating prevents deterministic experiment execution."
summary = "Typed abort-reporting role."
system = "Copy the supplied failure evidence exactly. Never invent measurements, decisions, or a successful outcome."

[[agent]]
id = "worker"
description = "Prepares the isolated workbench and applies one bounded experiment proposal without deciding whether its result is kept."
summary = "Workbench preparation and candidate-application role."
system = "Work only inside the prepared run worktree. Never report or choose the metric, best value, keep decision, or reset target; those are runtime-owned."

[prompt.abort-summary]
text = """

            Report an aborted auto-research run for {port:objective} from {slot:readiness}.
            Return status aborted, experiments 0, kept 0, no best, empty rows, and the exact readiness reason."""
input = [
    "port:objective",
    "slot:readiness",
]
output = ["slot:summary"]

[prompt.apply]
text = """

            Apply exactly the bounded change in {slot:proposal} for {port:objective} inside the isolated worktree.
            Inspect the current files first, preserve unrelated work, and do not run or report the experiment metric. The runtime executes the trusted measurement command next.
            Return a concise receipt naming the files changed."""
input = [
    "slot:proposal",
    "port:objective",
]
output = ["slot:apply-receipt"]

[prompt.baseline-failure-summary]
text = """

            Report an aborted auto-research run for {port:objective}. The trusted baseline command returned {slot:baseline-result}, whose status was not ok.
            Return status aborted, experiments 0, kept 0, no best, one baseline row containing the unchanged measurement with decision baseline, and the concrete measurement failure."""
input = [
    "port:objective",
    "slot:baseline-result",
]
output = ["slot:summary"]

[prompt.propose]
text = """

            Propose one small, falsifiable experiment for {port:objective}.
            The lower-is-better metric is {port:metric-field}; current best is {slot:best-metric}; trusted prior measurements are {slot:history}.
            Use only this typed handoff. Do not infer hidden conversation, claim a result, or decide keep/discard.
            Return a title, hypothesis, and exact bounded change."""
input = [
    "port:objective",
    "port:metric-field",
    "slot:best-metric",
    "slot:history",
]
output = ["slot:proposal"]

[prompt.setup]
text = """

            Prepare the workbench for {port:objective}. Confirm this execution is inside an isolated Git worktree and inspect the current tracked state.
            Return status ready only when the tracked workbench is clean and destructive reset is confined to that worktree. Otherwise return abort with the concrete reason.
            Do not modify files yet and do not invent metric evidence."""
input = ["port:objective"]
output = ["slot:readiness"]

[[sequence.abort-baseline.sequence]]
id = "baseline-failure-summary"
title = "Report the unusable baseline"
agent = "agent:summarizer"
prompt = "prompt:baseline-failure-summary"
input = [
    "port:objective",
    "slot:baseline-result",
]
output = ["slot:summary"]

[[sequence.abort-preflight.sequence]]
id = "abort-summary"
title = "Report the preflight abort"
agent = "agent:summarizer"
prompt = "prompt:abort-summary"
input = [
    "port:objective",
    "slot:readiness",
]
output = ["slot:summary"]

[[sequence.discard-candidate.sequence]]
id = "reset-candidate"
title = "Discard the non-improving candidate"
input = ["slot:best-ref"]
output = ["slot:command-receipt"]

[sequence.discard-candidate.sequence.command]
argv = [
    "git",
    "reset",
    "--hard",
    "{slot:best-ref}",
]

[[sequence.discard-candidate.sequence]]
id = "clean-candidate"
title = "Remove untracked candidate files"
output = ["slot:command-receipt"]

[sequence.discard-candidate.sequence.command]
argv = [
    "git",
    "clean",
    "-fd",
]

[[sequence.discard-candidate.sequence]]
id = "record-discarded-candidate"
title = "Record the discarded candidate"
kind = "project"
input = ["slot:candidate-result"]

[[sequence.discard-candidate.sequence.projection]]
destination = "slot:experiment-count"
operation = "increment"

[sequence.discard-candidate.sequence.projection.source]
literal = 1

[[sequence.discard-candidate.sequence.projection]]
source = "slot:candidate-result"
destination = "slot:history"
operation = "append"

[[sequence.discard-candidate.sequence.projection]]
destination = "slot:decisions"
operation = "append"

[sequence.discard-candidate.sequence.projection.source]
literal = "discarded"

[[sequence.discard-candidate.sequence.output]]
slot = "slot:experiment-count"
operation = "increment"

[[sequence.discard-candidate.sequence.output]]
slot = "slot:history"
operation = "append"

[[sequence.discard-candidate.sequence.output]]
slot = "slot:decisions"
operation = "append"

[[sequence.experiment-round.sequence]]
id = "propose"
title = "Propose one fresh bounded experiment"
agent = "agent:proposer"
prompt = "prompt:propose"
input = [
    "port:objective",
    "port:metric-field",
    "slot:best-metric",
    "slot:history",
]
output = ["slot:proposal"]

[[sequence.experiment-round.sequence]]
id = "apply"
title = "Apply the proposed candidate"
agent = "agent:worker"
prompt = "prompt:apply"
input = [
    "slot:proposal",
    "port:objective",
]
output = ["slot:apply-receipt"]

[[sequence.experiment-round.sequence]]
id = "measure-candidate"
title = "Measure the candidate"
input = ["port:experiment-command"]
output = ["slot:candidate-result"]

[sequence.experiment-round.sequence.command]
argv-from = "port:experiment-command"

[[sequence.experiment-round.sequence]]
id = "decide-candidate"
title = "Apply the declared keep/discard decision"
kind = "branch"
sequence = "sequence:keep-candidate"
otherwise = "sequence:discard-candidate"

[[sequence.experiment-round.sequence.when.all]]
slot = "slot:candidate-result"
field = "status"
equals = "ok"

[[sequence.experiment-round.sequence.when.all]]
slot = "slot:candidate-result"
field = "metric"

[sequence.experiment-round.sequence.when.all.less-than]
ref = "slot:best-metric"

[[sequence.experiment-round.sequence.when.all]]

[[sequence.experiment-round.sequence.when.all.any]]

[sequence.experiment-round.sequence.when.all.any.not]
present = "port:max-wall-time-ms"

[[sequence.experiment-round.sequence.when.all.any]]

[[sequence.experiment-round.sequence.when.all.any.all]]
present = "port:max-wall-time-ms"

[[sequence.experiment-round.sequence.when.all.any.all]]
field = "wall-time-ms"
present = "slot:candidate-result"

[[sequence.experiment-round.sequence.when.all.any.all]]
slot = "slot:candidate-result"
field = "wall-time-ms"

[sequence.experiment-round.sequence.when.all.any.all.at-most]
ref = "port:max-wall-time-ms"

[[sequence.experiment-round.sequence.when.all]]

[[sequence.experiment-round.sequence.when.all.any]]

[sequence.experiment-round.sequence.when.all.any.not]
present = "port:max-token-estimate"

[[sequence.experiment-round.sequence.when.all.any]]

[[sequence.experiment-round.sequence.when.all.any.all]]
present = "port:max-token-estimate"

[[sequence.experiment-round.sequence.when.all.any.all]]
field = "token-estimate"
present = "slot:candidate-result"

[[sequence.experiment-round.sequence.when.all.any.all]]
slot = "slot:candidate-result"
field = "token-estimate"

[sequence.experiment-round.sequence.when.all.any.all.at-most]
ref = "port:max-token-estimate"

[[sequence.experiment-round.sequence.when.all]]

[[sequence.experiment-round.sequence.when.all.any]]

[sequence.experiment-round.sequence.when.all.any.not]
present = "port:max-cost-microusd"

[[sequence.experiment-round.sequence.when.all.any]]

[[sequence.experiment-round.sequence.when.all.any.all]]
present = "port:max-cost-microusd"

[[sequence.experiment-round.sequence.when.all.any.all]]
field = "cost-microusd"
present = "slot:candidate-result"

[[sequence.experiment-round.sequence.when.all.any.all]]
slot = "slot:candidate-result"
field = "cost-microusd"

[sequence.experiment-round.sequence.when.all.any.all.at-most]
ref = "port:max-cost-microusd"

[[sequence.experiment-round.sequence.when.all]]

[[sequence.experiment-round.sequence.when.all.any]]

[sequence.experiment-round.sequence.when.all.any.not]
present = "port:max-delta-lines"

[[sequence.experiment-round.sequence.when.all.any]]

[[sequence.experiment-round.sequence.when.all.any.all]]
present = "port:max-delta-lines"

[[sequence.experiment-round.sequence.when.all.any.all]]
field = "delta-lines"
present = "slot:candidate-result"

[[sequence.experiment-round.sequence.when.all.any.all]]
slot = "slot:candidate-result"
field = "delta-lines"

[sequence.experiment-round.sequence.when.all.any.all.at-most]
ref = "port:max-delta-lines"

[[sequence.initialize-and-run.sequence]]
id = "capture-initial-ref"
title = "Capture the immutable baseline commit"
output = ["slot:captured-ref"]

[sequence.initialize-and-run.sequence.command]
argv = [
    "node",
    "--input-type=module",
    "--eval",
    """
import { spawnSync } from "node:child_process";
const result = spawnSync("git", ["rev-parse", "--verify", "HEAD^{commit}"], {
    cwd: process.cwd(),
    encoding: "utf8",
});
const sha = (result.stdout ?? "").trim();
if (result.status !== 0 || !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/.test(sha)) {
    process.stderr.write(result.stderr ?? "could not capture HEAD commit");
    process.exit(1);
}
process.stdout.write(JSON.stringify({ sha }));""",
]

[[sequence.initialize-and-run.sequence]]
id = "capture-best-ref"
title = "Capture the fixed reset ref"
kind = "project"
input = ["slot:captured-ref"]
output = ["slot:best-ref"]

[[sequence.initialize-and-run.sequence.projection]]
source = "slot:captured-ref"
field = "sha"
destination = "slot:best-ref"

[[sequence.initialize-and-run.sequence]]
id = "measure-baseline"
title = "Measure the baseline"
input = ["port:experiment-command"]
output = ["slot:baseline-result"]

[sequence.initialize-and-run.sequence.command]
argv-from = "port:experiment-command"

[[sequence.initialize-and-run.sequence]]
id = "baseline-gate"
title = "Require a usable trusted baseline"
kind = "branch"
sequence = "sequence:run-experiments"
otherwise = "sequence:abort-baseline"

[sequence.initialize-and-run.sequence.when]
slot = "slot:baseline-result"
field = "status"
equals = "ok"

[[sequence.keep-candidate.sequence]]
id = "stage-candidate"
title = "Stage the kept candidate"
output = ["slot:command-receipt"]

[sequence.keep-candidate.sequence.command]
argv = [
    "git",
    "add",
    "-A",
]

[[sequence.keep-candidate.sequence]]
id = "commit-candidate"
title = "Commit the kept candidate"
output = ["slot:command-receipt"]

[sequence.keep-candidate.sequence.command]
argv = [
    "git",
    "commit",
    "-m",
    "auto-research: keep improved experiment",
]

[[sequence.keep-candidate.sequence]]
id = "capture-committed-ref"
title = "Capture the kept commit SHA"
output = ["slot:captured-ref"]

[sequence.keep-candidate.sequence.command]
argv = [
    "node",
    "--input-type=module",
    "--eval",
    """
import { spawnSync } from "node:child_process";
const result = spawnSync("git", ["rev-parse", "--verify", "HEAD^{commit}"], {
    cwd: process.cwd(),
    encoding: "utf8",
});
const sha = (result.stdout ?? "").trim();
if (result.status !== 0 || !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/.test(sha)) {
    process.stderr.write(result.stderr ?? "could not capture HEAD commit");
    process.exit(1);
}
process.stdout.write(JSON.stringify({ sha }));""",
]

[[sequence.keep-candidate.sequence]]
id = "advance-best"
title = "Advance trusted best state after commit"
kind = "project"
input = [
    "slot:candidate-result",
    "slot:captured-ref",
]
output = [
    "slot:best-metric",
    "slot:best-ref",
]

[[sequence.keep-candidate.sequence.projection]]
source = "slot:candidate-result"
field = "metric"
destination = "slot:best-metric"

[[sequence.keep-candidate.sequence.projection]]
source = "slot:captured-ref"
field = "sha"
destination = "slot:best-ref"

[[sequence.keep-candidate.sequence]]
id = "record-kept-candidate"
title = "Record the kept candidate"
kind = "project"
input = ["slot:candidate-result"]

[[sequence.keep-candidate.sequence.projection]]
destination = "slot:experiment-count"
operation = "increment"

[sequence.keep-candidate.sequence.projection.source]
literal = 1

[[sequence.keep-candidate.sequence.projection]]
destination = "slot:kept-count"
operation = "increment"

[sequence.keep-candidate.sequence.projection.source]
literal = 1

[[sequence.keep-candidate.sequence.projection]]
source = "slot:candidate-result"
destination = "slot:history"
operation = "append"

[[sequence.keep-candidate.sequence.projection]]
destination = "slot:decisions"
operation = "append"

[sequence.keep-candidate.sequence.projection.source]
literal = "kept"

[[sequence.keep-candidate.sequence.output]]
slot = "slot:experiment-count"
operation = "increment"

[[sequence.keep-candidate.sequence.output]]
slot = "slot:kept-count"
operation = "increment"

[[sequence.keep-candidate.sequence.output]]
slot = "slot:history"
operation = "append"

[[sequence.keep-candidate.sequence.output]]
slot = "slot:decisions"
operation = "append"

[[sequence.run-experiments.sequence]]
id = "seed-best"
title = "Seed trusted best state and history"
kind = "project"
input = ["slot:baseline-result"]
output = [
    "slot:best-metric",
    { slot = "slot:history", operation = "append" },
    "slot:experiment-count",
    "slot:kept-count",
    { slot = "slot:decisions", operation = "append" },
]

[[sequence.run-experiments.sequence.projection]]
source = "slot:baseline-result"
field = "metric"
destination = "slot:best-metric"

[[sequence.run-experiments.sequence.projection]]
source = "slot:baseline-result"
destination = "slot:history"
operation = "append"

[[sequence.run-experiments.sequence.projection]]
destination = "slot:experiment-count"

[sequence.run-experiments.sequence.projection.source]
literal = 0

[[sequence.run-experiments.sequence.projection]]
destination = "slot:kept-count"

[sequence.run-experiments.sequence.projection.source]
literal = 0

[[sequence.run-experiments.sequence.projection]]
destination = "slot:decisions"
operation = "append"

[sequence.run-experiments.sequence.projection.source]
literal = "baseline"

[[sequence.run-experiments.sequence]]
id = "experiments"
title = "Run the declared experiment budget"
kind = "loop"
input = ["port:max-experiments"]
sequence = "sequence:experiment-round"
max-iterations-from = "port:max-experiments"
on-exhausted = "continue"

[[sequence.run-experiments.sequence]]
id = "derive-summary"
title = "Derive the typed experiment summary"
input = [
    "resource:auto-research-summary-replay",
    "slot:experiment-count",
    "slot:kept-count",
    "slot:best-metric",
    "slot:history",
    "slot:decisions",
]
output = ["slot:summary"]

[sequence.run-experiments.sequence.command]
argv = [
    "node",
    "{resource:auto-research-summary-replay}",
    "{slot:experiment-count}",
    "{slot:kept-count}",
    "{slot:best-metric}",
    "{slot:history}",
    "{slot:decisions}",
]

[procedure]
description = "Verify an isolated worktree, seed a trusted baseline, run a dynamically bounded fresh-proposal experiment loop, and deterministically keep only command-measured improvements."
worktree-required = true
input = [
    "port:experiment-command",
    "port:max-cost-microusd",
    "port:max-delta-lines",
    "port:max-experiments",
    "port:max-token-estimate",
    "port:max-wall-time-ms",
    "port:metric-field",
    "port:objective",
]
output = ["port:summary"]

[[procedure.sequence]]
id = "setup"
title = "Prepare and verify the isolated workbench"
agent = "agent:worker"
prompt = "prompt:setup"
input = ["port:objective"]
output = ["slot:readiness"]

[[procedure.sequence]]
id = "readiness-gate"
title = "Gate mutation on isolated-worktree readiness"
kind = "branch"
sequence = "sequence:initialize-and-run"
otherwise = "sequence:abort-preflight"

[procedure.sequence.when]
slot = "slot:readiness"
field = "status"
equals = "ready"
