id = "grill-me"
schema-version = "0.2"
version = "0.1.0"
name = "Grill Me"
summary = "Stress-test a plan with a relentless one-question-at-a-time interview: facts settled from the repository by a scout, genuine decisions sharpened into an owner decision sheet, and a grill report as the only product — nothing is built."

[metadata]
tag = [
    "first-party",
    "planning",
    "interview",
    "multi-agent",
]

[[intent.require]]
id = "state-assumptions"

[[intent.require]]
id = "bounded-refinement"

[[intent.require]]
id = "role-attributed-output"

[[intent.avoid]]
id = "speculative-claim"

[[intent.avoid]]
id = "unbounded-loop"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "curious"

[[behavior.tone]]
id = "critical"

[[behavior.tone]]
id = "direct"

[[behavior.method]]
id = "socratic"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "grill-report"
direction = "output"
schema = "schema:text"
description = "The interview's only product: the sharpened shared understanding, the owner decision sheet, and an honest account of anything not settled."
title = "Grill Report"
format = ["text"]
value = "slot:report"

[[port]]
id = "plan"
direction = "input"
schema = "schema:text"
description = "The plan, design, or decision to grill — inline text, or the repo-relative path of a file (a task file, a draft, a spec) the interview reads first."

[[slot]]
id = "ledger"
schema = "schema:text"
description = "The cumulative interview ledger: every settled round, appended one entry at a time by the scout and reproduced verbatim between rounds. The report's single source of truth."
hint = 'One "### Q<n> — fact|decision" block per round, in interview order: the question, the recommended answer, then the resolution — "Answered:" with evidence (paths, commands, observed values) for a fact, "Owner decision:" with options and tradeoffs for a judgment call. Prior entries are reproduced verbatim; the ledger only grows.'

[[slot]]
id = "probe"
schema = "schema:interview-probe"
description = "The current round's probe: the single question under interrogation, or the typed exhausted signal that ends the interview."

[[slot]]
id = "report"
schema = "schema:text"
description = "The finished grill report: shared understanding, the owner decision sheet, and what was not settled."

[[resource]]
id = "grilling-doctrine"
path = "resources/grilling-doctrine.md"
hint = "The interview doctrine every step holds to; agents read this file with their own tools."
trigger = "on-activation"

[[schema]]
id = "interview-probe"
description = "One interview round: the single most load-bearing unresolved point in dependency order, or the typed signal that the tree is exhausted. The loop exits on status alone."

[schema.fields.kind]
schema = "schema:text"
description = "fact when the repository or environment can settle the question; decision when it is genuinely the owner's call — two or more defensible answers, and picking one is a judgment. Present when status is continue."
allowed = [
    "fact",
    "decision",
]

[schema.fields.question]
schema = "schema:text"
description = "The single question this round: the fork it names, why it matters, and what choosing wrong would cost. Present when status is continue; absent when exhausted."

[schema.fields.recommendation]
schema = "schema:text"
description = "The interrogator's own recommended answer with a one-line rationale — every question arrives as a proposal to react to, never a blank prompt. Present when status is continue."

[schema.fields.status]
schema = "schema:text"
required = true
description = "continue when at least one unresolved point worth asking remains; exhausted only when every branch of the plan's decision tree is either settled in the ledger or already queued for the owner. Never exhausted merely because questioning feels finished — walk the tree."
allowed = [
    "continue",
    "exhausted",
]

[[agent]]
id = "smart-1"
description = "Strong questioning model: walks the plan's decision tree in dependency order and asks the single most load-bearing unresolved question each round, always with its own recommended answer attached."
summary = "Interrogator role."

[[agent]]
id = "smart-2"
description = "Strong synthesis model from a second family: reads the finished interview cold and writes the grill report — the shared understanding, the owner decision sheet, and an honest account of anything the interview never reached."
summary = "Report role."

[[agent]]
id = "worker"
description = "Tool-equipped scout: settles fact questions by exploring the repository and environment, sharpens decision questions into options for the owner without ever deciding them, and keeps the interview ledger."
summary = "Scout and ledger-keeper role."

[prompt.probe]
text = """

                    Grill the plan {port:plan}: a relentless interview that sharpens it until nothing vague enough to build wrong remains. Hold to the doctrine {resource:grilling-doctrine}.
                    If the plan names a repository file, read it with your tools first. If an interview ledger is attached to this frame, every entry in it is settled — never re-ask one; on round 1 no ledger exists yet.
                    Walk the plan's decision tree in dependency order — a parent decision before the choices that hang off it — and pick the SINGLE most load-bearing unresolved point. Ask exactly one question about it: name the fork, why it matters, and what choosing wrong would cost. Attach your recommended answer with a one-line rationale — a question is a proposal to react to, never a blank prompt.
                    Classify it: kind is fact when the repository or environment can settle it, decision when it is genuinely the owner's call.
                    Set status to exhausted — omitting question, kind, and recommendation — only when every branch is settled in the ledger or already queued for the owner. Otherwise status is continue. Return the typed probe."""
input = [
    "port:plan",
    "resource:grilling-doctrine",
]
output = ["slot:probe"]

[prompt.report]
text = """

                    The interview on the plan {port:plan} has ended; the final probe is {slot:probe}. Read its status FIRST: exhausted means the decision tree was walked to the end; continue means the round budget ran out with branches unvisited, and the report must say so plainly rather than implying completeness. Hold to the doctrine {resource:grilling-doctrine}.
                    The settled rounds are in the interview ledger attached to this frame. If no ledger is attached, the very first probe found nothing to ask — write the report from the plan alone and say exactly that.
                    Write the grill report in three parts:
                    1. Shared understanding — the plan restated with every answered fact folded in, precise enough that a build started from it cannot go wrong on any settled point.
                    2. Decisions for the owner — every owner-decision entry from the ledger, one block each: the question, the options with their tradeoffs, and the recommended answer, phrased so the owner can settle it with a single reply.
                    3. Not settled — branches the budget never reached and any fact the scout could not ground. Omit this part only when there is truly nothing in it.
                    The interview changes nothing and builds nothing: this report is the run's entire product, and acting on the plan is the owner's move once the decision sheet is settled. Return only the report."""
input = [
    "port:plan",
    "slot:probe",
    "resource:grilling-doctrine",
]
output = ["slot:report"]

[prompt.settle]
text = """

                    The interview on the plan {port:plan} produced this round's probe: {slot:probe}. Hold to the doctrine {resource:grilling-doctrine}.
                    If its kind is fact, settle it yourself: explore the repository and environment with your tools and answer with concrete evidence — paths, commands, observed values. Never guess. A fact you cannot ground after genuinely looking becomes an owner decision, with a note of where you looked.
                    If its kind is decision, do NOT decide it. Sharpen it for the owner instead: the viable options, the tradeoff each carries, anything the repository already constrains — and keep the interrogator's recommendation attached.
                    Then update the interview ledger. If a ledger is attached to this frame, reproduce every existing entry verbatim and append exactly one entry for this round in the ledger's entry format; on round 1, start the ledger with this round's entry. Return the full updated ledger."""
input = [
    "port:plan",
    "slot:probe",
    "resource:grilling-doctrine",
]
output = ["slot:ledger"]

[[sequence.ctx-branch-arm-s-15-interview-round-11-settle-gate-then.sequence]]
id = "settle"
title = "Settle the question (worker)"
agent = "agent:worker"
prompt = "prompt:settle"
input = [
    "port:plan",
    "slot:probe",
    "resource:grilling-doctrine",
    { slot = "slot:ledger", optional = true },
]
output = ["slot:ledger"]

[[sequence.interview-round.sequence]]
id = "probe"
title = "Ask the next question (smart-1)"
agent = "agent:smart-1"
prompt = "prompt:probe"
input = [
    "port:plan",
    "resource:grilling-doctrine",
    { slot = "slot:ledger", optional = true },
]
output = ["slot:probe"]

[[sequence.interview-round.sequence]]
id = "settle-gate"
title = "Settle Gate"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-15-interview-round-11-settle-gate-then"

[sequence.interview-round.sequence.when]
slot = "slot:probe"
field = "status"
equals = "continue"

[procedure]
description = "Interview the plan one question per round in decision-tree dependency order — the interrogator asks with a recommended answer, the scout settles facts from the repository and queues genuine decisions for the owner, the ledger accumulates every round — then write the grill report: shared understanding, the owner decision sheet, and what was not settled."
input = ["port:plan"]
output = ["port:grill-report"]

[[procedure.sequence]]
id = "interview-loop"
title = "One question per round, until the tree is exhausted"
kind = "loop"
sequence = "sequence:interview-round"
max-iterations = 12

[procedure.sequence.until]
slot = "slot:probe"
field = "status"
equals = "exhausted"

[[procedure.sequence]]
id = "report"
title = "Write the grill report (smart-2)"
agent = "agent:smart-2"
prompt = "prompt:report"
input = [
    "port:plan",
    "slot:probe",
    "resource:grilling-doctrine",
    { slot = "slot:ledger", optional = true },
]
output = ["slot:report"]
