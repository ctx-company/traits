[[sequence.surveying-body.sequence]]
id = "survey-the-topic"
title = "Survey the topic"
agent = "agent:investigator"
prompt = "prompt:survey-the-topic"
input = [
    "port:topic",
    "resource:walkthrough-standards",
    { slot = "slot:file-closure", optional = true },
    { slot = "slot:horizon", optional = true },
    { slot = "slot:skeleton-nodes", optional = true },
]
output = [
    "slot:file-closure",
    "slot:horizon",
    "slot:skeleton-nodes",
]

[procedure]
description = "Explain one codebase topic top-to-bottom, ending at code: a survey fixes the dependency-closure file set and the upper tree; a deterministic script enumerates every fn/struct/enum/trait/mod in those files; per-file frames describe each enumerated symbol (typed nodes, verbatim coverage keys, verified line spans); a coverage loop grinds until the computed uncovered set is empty; a reviewer samples grounding and register; a command step renders the zoomable treemap walkthrough."
input = [
    "port:output-dir",
    "port:topic",
]
output = [
    "port:coverage",
    "port:render-report",
    "port:walkthrough-path",
    "port:walkthrough-summary",
]

[[procedure.sequence]]
id = "topic-slug"
title = "Derive topic slug"
input = ["port:topic"]
output = ["slot:topic-slug"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'printf "%s" "$1" | tr "A-Z" "a-z" | tr -cs "a-z0-9" "-" | sed "s/^-*//;s/-*$//"',
    "_",
    "{port:topic}",
]

[[procedure.sequence]]
id = "walkthrough-path"
title = "Derive walkthrough path"
input = [
    "port:output-dir",
    "slot:topic-slug",
]
output = ["slot:html-path"]

[procedure.sequence.command]
argv = [
    "printf",
    "%s/%s.html",
    "{port:output-dir}",
    "{slot:topic-slug}",
]

[[procedure.sequence]]
id = "surveying"
title = "Surveying"
kind = "loop"
sequence = "sequence:surveying-body"
max-iterations = 3
on-exhausted = "abort"

[[procedure.sequence.until.all]]
count = "slot:file-closure"
at-least = 1

[[procedure.sequence.until.all]]
count = "slot:skeleton-nodes"
at-least = 2

[[procedure.sequence]]
id = "enumerate-symbols"
title = "Enumerate symbols"
input = [
    "resource:symbols-script",
    "slot:file-closure",
]
output = ["slot:symbol-chunks"]

[procedure.sequence.command]
argv = [
    "python3",
    "{resource:symbols-script}",
    "enumerate",
    "{slot:file-closure}",
]

[[procedure.sequence]]
id = "seed-batches"
title = "Seed the batches"
kind = "project"
output = ["slot:node-batches"]

[[procedure.sequence.projection]]
destination = "slot:node-batches"

[procedure.sequence.projection.source]
literal = []

[[procedure.sequence]]
id = "describe-each-chunk"
title = "Describe each chunk"
kind = "for-each"
sequence = "sequence:describe-each-chunk-body"
over = "slot:symbol-chunks"
item = "slot:describe-each-chunk-item"
max-items = 96

[[procedure.sequence]]
id = "covering"
title = "Covering"
kind = "loop"
sequence = "sequence:covering-body"
max-iterations = 8
on-exhausted = "abort"

[procedure.sequence.until]
slot = "slot:coverage-status"
equals = "complete"

[[procedure.sequence]]
id = "reviewing"
title = "Reviewing"
kind = "loop"
sequence = "sequence:reviewing-body"
max-iterations = 3
on-exhausted = "abort"

[procedure.sequence.until]
slot = "slot:review-verdict-1"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "coverage-status-final"
title = "Coverage status final"
input = [
    "resource:symbols-script",
    "slot:symbol-chunks",
    "slot:skeleton-nodes",
    "slot:node-batches",
]
output = ["slot:coverage-status"]

[procedure.sequence.command]
argv = [
    "python3",
    "{resource:symbols-script}",
    "status",
    "{slot:symbol-chunks}",
    "{slot:skeleton-nodes}",
    "{slot:node-batches}",
]

[[procedure.sequence]]
id = "summarize-the-walkthrough"
title = "Summarize the walkthrough"
agent = "agent:investigator"
prompt = "prompt:summarize-the-walkthrough"
input = [
    "port:topic",
    { slot = "slot:horizon", optional = true },
    { slot = "slot:work-summary", optional = true },
]
output = ["slot:work-summary"]

[[procedure.sequence]]
id = "render-walkthrough"
title = "Render walkthrough"
input = [
    "resource:render-script",
    "slot:skeleton-nodes",
    "slot:node-batches",
    "slot:horizon",
    "slot:html-path",
]
output = ["slot:render-log"]

[procedure.sequence.command]
argv = [
    "python3",
    "{resource:render-script}",
    "{slot:skeleton-nodes}",
    "{slot:node-batches}",
    "{slot:horizon}",
    "{slot:html-path}",
]
