id = "walkthrough"
schema-version = "0.5"
version = "0.3.13"
name = "Walkthrough (Default)"
description = "Explain one codebase topic top-to-bottom, ending at code: a survey fixes the dependency-closure file set and the upper tree; a deterministic script enumerates every fn/struct/enum/trait/mod in those files; per-file frames describe each enumerated symbol (typed nodes, verbatim coverage keys, verified line spans); a coverage loop grinds until the computed uncovered set is empty; a reviewer samples grounding and register; a command step renders the zoomable treemap walkthrough."
summary = "Exhaustive codebase walkthrough: survey the topic's file closure, deterministically enumerate every symbol in it, describe every single one in per-file frames under a computed coverage gate, review a sample for quality, then render a self-contained interactive treemap HTML."
variant = "default"

[metadata]
tag = [
    "dogfood",
    "walkthrough",
    "explainer",
    "treemap",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "review-before-final"

[[intent.avoid]]
id = "scope-creep"

[[intent.avoid]]
id = "rubber-stamp-review"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "coverage"
direction = "output"
schema = "schema:text"
optional = true
description = "Deterministic coverage verdict at the end of the run."
title = "Coverage"
value = "slot:coverage-status"

[[port]]
id = "output-dir"
direction = "input"
schema = "schema:text"
optional = true
description = 'Repo-relative directory the walkthrough HTML is written under. Package-defaulted to ".hidden/walkthroughs" via [defaults.port] in trait.toml; consuming repos override it in their own config.'

[[port]]
id = "render-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Render step evidence: the written path and counts."
title = "Render Report"
value = "slot:render-log"

[[port]]
id = "topic"
direction = "input"
schema = "schema:text"
description = 'The codebase topic to walk through: a file, a module, a subsystem, or a question (e.g. "center", "modules/io/src/dispatch_preflight.rs", "how does dispatch refuse a claimed task").'

[[port]]
id = "walkthrough-path"
direction = "output"
schema = "schema:text"
optional = true
description = "Repo-relative path of the generated interactive walkthrough HTML."
title = "Walkthrough Path"
value = "slot:html-path"

[[port]]
id = "walkthrough-summary"
direction = "output"
schema = "schema:text"
optional = true
description = "Final investigator summary: closure, horizon, verification method, open concerns."
title = "Walkthrough Summary"
value = "slot:work-summary"

[[slot]]
id = "coverage-report"
schema = "schema:text"
description = "Deterministic JSON coverage report (from symbols.py coverage): uncovered index entries, duplicate ids, orphaned parents, counts. The repair prompt consumes it verbatim."

[[slot]]
id = "coverage-status"
schema = "schema:text"
description = 'Deterministic coverage verdict (from symbols.py status): exactly "complete" when every index key is described and links are sound, else "incomplete:<n>".'

[[slot]]
id = "describe-each-chunk-item"
schema = "schema:symbol-chunk"
description = "Per-item value for the describe-each-chunk loop."

[[slot]]
id = "file-closure"
schema = "[schema:closure-entry]"
description = "The topic's complete file closure: every file the topic's code lives in plus every same-workspace file it depends on, traversed until the declared horizon. The symbol index — and therefore the coverage gate — is computed from exactly this list."

[[slot]]
id = "horizon"
schema = "schema:text"
description = "Where traversal deliberately stopped and why: std/third-party crates, unrelated subsystems, generated code. Honesty about the boundary is part of the deliverable and is rendered into the walkthrough root."

[[slot]]
id = "html-path"
schema = "schema:text"
description = "Deterministic repo-relative path of the generated walkthrough HTML, derived by a command step."

[[slot]]
id = "node-batches"
schema = "[schema:node-batch]"
description = "Append-only batches of described nodes: one batch per for-each file frame, plus one batch per repair or review-fix round. Consumers flatten the batches' nodes in order and dedupe by id, last occurrence winning."

[[slot]]
id = "render-log"
schema = "schema:text"
description = "Output evidence from the render command step: the written path and node/byte counts."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "Reviewer's verdict for the current walkthrough state."

[[slot]]
id = "skeleton-nodes"
schema = "[schema:walkthrough-node]"
description = 'The upper tree from the survey: the root overview, area nodes, one file node per closure entry (id "f-" + slugified path), and any flow nodes. Never contains type/function nodes — those are produced per-file.'

[[slot]]
id = "symbol-chunks"
schema = "[schema:symbol-chunk]"
description = "Deterministic chunked symbol index over the file closure (from symbols.py enumerate, via typed command output): every fn/struct/enum/trait/mod definition, sliced into bounded chunks the describe loop iterates. Ground truth for the coverage gate — never edited by a model."

[[slot]]
id = "topic-slug"
schema = "schema:text"
description = "Deterministic kebab-case slug for the topic, derived by a command step — never agent prose — so the output path is predictable from the topic alone."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Investigator's cumulative account: what was explored, how the closure and horizon were chosen, how refs were verified, open concerns."

[[resource]]
id = "render-script"
path = "resources/render.py"
digest = "sha256:fc4a8e3c551e246e28d01252c6f0769aeafbfca683692f607bb25defe87ebf3e"
hint = "Deterministic treemap renderer the render command step executes; never read by a model seat."
trigger = "on-demand"

[[resource]]
id = "symbols-script"
path = "resources/symbols.py"
digest = "sha256:eba029c000089f3bced230de6d666312c0fb9da32e800cc28ce7e121031a1a39"
hint = "Deterministic symbol enumerator and coverage checker (enumerate | coverage | status); ground truth for the exhaustiveness gate; never read by a model seat."
trigger = "on-demand"

[[resource]]
id = "walkthrough-standards"
path = "resources/walkthrough-standards.md"
digest = "sha256:9942637d1a4651d55e2f8a07aa5e7fd5295625bf2a13749e272b0dbfb2510ecb"
hint = "Exhaustive-walkthrough doctrine: closure and horizon rules, id/parent conventions, coverage-key discipline, layer registers, last-wins revisions."
trigger = "on-demand"

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open" or "done". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "closure-entry"
description = "One file of the topic's dependency closure, with the reason it belongs."

[schema.fields.path]
schema = "schema:text"
required = true
description = "Repo-relative path of one source file in the topic's dependency closure. Must exist."

[schema.fields.role]
schema = "schema:text"
required = true
description = "One sentence: why this file is in the closure (owns the topic / direct dependency via which import)."

[[schema]]
id = "code-ref"
description = "One code anchor grounding a node: a file and the line span the node's prose actually explains."

[schema.fields.lines]
schema = "schema:text"
required = true
description = 'Line span "start-end" (1-indexed, inclusive) inside path that this node covers. Verified by opening the file — never guessed. The treemap derives tile sizes from these spans, so they must honestly cover the code the node explains.'

[schema.fields.path]
schema = "schema:text"
required = true
description = "Repo-relative file path this node's explanation is grounded in. Must exist in the repository."

[[schema]]
id = "node-batch"
description = "One appended batch of described nodes — a per-file frame's output, or a repair/review-fix round's."

[schema.fields.nodes]
schema = "[schema:walkthrough-node]"
required = true
description = "The described nodes this frame contributes. Empty when the frame has nothing to add."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if a blocking defect remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Non-empty when status is revise; an empty list (never omitted — always return the key) when approved. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the task's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise only when at least one blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "symbol-chunk"
description = "One bounded unit of exhaustive description work: a file slice with its enumerated symbols inline."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Deterministic chunk id: c-<path-slug>-<ordinal>."

[schema.fields.part]
schema = "schema:text"
required = true
description = 'Which slice of the file this chunk is, as "i/n" — a file with many symbols yields several chunks.'

[schema.fields.path]
schema = "schema:text"
required = true
description = "The repo-relative file every symbol in this chunk lives in."

[schema.fields.symbols]
schema = "[schema:symbol-entry]"
required = true
description = "at most ~12 enumerated symbols; the describing frame owes exactly one node per entry."

[[schema]]
id = "symbol-entry"
description = "One deterministically enumerated symbol a chunk frame owes a described node for."

[schema.fields.key]
schema = "schema:text"
required = true
description = "The coverage key path:line:name — copied VERBATIM onto the describing node's symbol field. The name and 1-indexed definition line are read out of this key; they are not repeated as separate fields (the enumeration must fit one command capture)."

[schema.fields.kind]
schema = "schema:text"
required = true
description = "The node kind the describing node must carry, exactly as enumerated."
allowed = [
    "function",
    "type",
]

[[schema]]
id = "walkthrough-node"
description = "One node of the walkthrough tree, flat with a parent link. Least specific at the root, ending at actual code symbols at the leaves."

[schema.fields.explanation]
schema = "schema:text"
required = true
description = "The thorough narration for this node's layer, in the register of its depth: the root explains architecture and intent, areas explain responsibilities and collaborations, files explain what lives there and why, type/function leaves explain the actual mechanics precisely — what it does, what it refuses, the edges it guards. Plain prose paragraphs separated by blank lines; inline `code` backticks allowed."

[schema.fields.id]
schema = "schema:text"
required = true
description = 'Stable kebab-case slug, unique across the whole walkthrough. Conventions: the root is "root"; a file node is "f-" plus the slugified path; a symbol node is "s-" plus the symbol name plus "-" plus its definition line. Re-emitting an existing id REPLACES that node (last-wins revision).'

[schema.fields.kind]
schema = "schema:text"
required = true
description = "overview = the single root; area = a module/subsystem grouping; file = one source file from the closure; type = a struct/enum/trait/interface/class/type-alias; function = a fn/method/macro; flow = a cross-cutting path through the code."
allowed = [
    "overview",
    "area",
    "file",
    "type",
    "function",
    "flow",
]

[schema.fields.parent]
schema = "schema:text"
description = "The id of this node's parent. Absent on exactly one node — the root overview. Every other node names an existing id."

[schema.fields.refs]
schema = "[schema:code-ref]"
required = true
description = "At least one code anchor per node. A symbol node's span covers that symbol's definition; a file node's span covers the file; children's spans live inside the territory their parent's spans cover."

[schema.fields.summary]
schema = "schema:text"
required = true
description = "One or two sentences shown at a glance — what this node is and why it exists."

[schema.fields.symbol]
schema = "schema:text"
description = "REQUIRED on every type/function node, absent elsewhere: the coverage key of the symbol-index entry this node describes, copied VERBATIM (format path:line:name). This is how deterministic coverage joins descriptions to enumerated code."

[schema.fields.title]
schema = "schema:text"
required = true
description = "Short human title rendered on the treemap tile."

[[agent]]
id = "investigator"
description = "Explores the repository with its own tools, fixes the closure, and describes every enumerated symbol."
summary = "Implementation role."

[[agent]]
id = "smart-1"
description = "Sole reviewer: samples refs against the actual files and judges register and horizon honesty — never re-litigates computed coverage."
summary = "Review role."

[prompt.cover-the-gaps]
text = """
The deterministic coverage report for the walkthrough of {port:topic} is {slot:coverage-report}.
If it shows zero uncovered entries, zero unknown symbol keys, and zero orphan parents with exactly one root: contribute an empty batch and nothing else.
Otherwise make progress on what it names, at most 40 nodes this round — the loop runs again for the rest. Priority: first corrected re-emissions for nodes with unknown symbol keys or orphaned parents (keep the content, fix the broken field, never drop a valid symbol key); then a node per uncovered entry, described from the opened file at leaf register per {resource:walkthrough-standards}.
READ-ONLY discipline: never create, edit, or delete any file in this repository — investigation means reading."""
input = [
    "port:topic",
    "slot:coverage-report",
    "resource:walkthrough-standards",
]
output = ["slot:node-batches"]

[prompt.describe-the-chunk]
text = """
Describe exactly one symbol chunk — {slot:describe-each-chunk-item} — for the walkthrough of {port:topic}. The chunk names its file and lists the enumerated symbols you owe; other chunks run in their own frames — touch only this one.
OPEN the chunk's file and describe EVERY listed symbol: exactly one node each, none skipped, merged, or invented — private items and test helpers included. Spans come from the file you opened, definition line to its real end. Explanations sit at leaf register per {resource:walkthrough-standards}: one tight paragraph for small items, up to three for load-bearing ones.
READ-ONLY discipline: never create, edit, or delete any file in this repository — investigation means reading."""
input = [
    "slot:describe-each-chunk-item",
    "port:topic",
    "resource:walkthrough-standards",
]
output = ["slot:node-batches"]

[prompt.fix-reviewed-nodes]
text = """
The reviewer's verdict for the walkthrough of {port:topic} is {slot:review-verdict-1}. For every blocker it names, re-emit the corrected node with the named defect actually fixed against the real file; nodes without blockers are not re-emitted, and a corrected node keeps its symbol key so coverage never regresses.
Also return the horizon note: rewritten when a blocker names the horizon (the current note is {slot:horizon}), unchanged otherwise.
Follow {resource:walkthrough-standards}.
READ-ONLY discipline: never create, edit, or delete any file in this repository — investigation means reading."""
input = [
    "port:topic",
    "slot:review-verdict-1",
    "slot:horizon",
    "resource:walkthrough-standards",
]
output = [
    "slot:node-batches",
    "slot:horizon",
]

[prompt.review-the-walkthrough]
text = """
Review the walkthrough of {port:topic}: skeleton {slot:skeleton-nodes}, horizon {slot:horizon}, and the described batches in {slot:node-batches} (flatten in order; a later node with a seen id replaces the earlier one). Coverage is COMPUTED and already complete — do not re-litigate it.
Verify with your OWN tools on a meaningful sample (at least a dozen symbol nodes across different files, plus every skeleton node): open the ref, confirm the span covers the symbol it claims, confirm the explanation matches the actual code and sits at its layer's register per {resource:walkthrough-standards}, and confirm the horizon note honestly matches where the closure stops.
A BLOCKER is: a span that does not cover its symbol, an explanation contradicting the code or at the wrong register, a skeleton node ungrounded, or a horizon claim the closure contradicts. Everything else is advisory. Name every blocker with the node id.
Your own verdict from last round is attached when one exists: carry every open blocker forward verbatim, verify with your own tools, and flip to done only on confirmed evidence.
A blocker must be FIXABLE BY THIS LOOP: by re-emitting nodes, or by rewriting the horizon note. Never raise a blocker that demands changes to the repository, to the closure itself, or exact command-output inventories over source files. When the same blocker survives two fix rounds textually unchanged, stop repeating it: downgrade it to advisory, set escalation to needs-owner with the reason, and judge the remaining state on its merits.
Set status to revise while any blocker remains, approved when none do."""
input = [
    "port:topic",
    "slot:skeleton-nodes",
    "slot:horizon",
    "slot:node-batches",
    "resource:walkthrough-standards",
]
output = ["slot:review-verdict-1"]

[prompt.summarize-the-walkthrough]
text = "Summarize the delivered walkthrough of {port:topic} in a few plain sentences: the closure size and horizon, how coverage was driven to complete, how refs were verified, and open concerns."
input = ["port:topic"]
output = ["slot:work-summary"]

[prompt.survey-the-topic]
text = """
Survey {port:topic} in THIS repository with your own tools (search, read files). Follow {resource:walkthrough-standards} exactly. Deliver three things.
1. The FILE CLOSURE: every source file the topic's code lives in, plus every same-workspace file it directly or transitively depends on (follow imports/use declarations), stopping only at the horizon. Verify every path exists. This list is the coverage contract — a deterministic script enumerates EVERY symbol in these files and the run cannot finish until every one is described. The run refuses closures beyond roughly a thousand symbols: prefer the topic's owning files plus first-degree collaborators, and push deep transitive dependencies to the horizon — a wide neighbor earns a horizon sentence, not a closure entry.
2. The HORIZON: where traversal deliberately stopped and why, naming every cut. Honesty here is part of the deliverable — the note renders into the walkthrough.
3. The SKELETON: the upper tree only — the single root overview narrating architecture and intent, area nodes for the module groupings, one file node per closure entry, optional flow nodes for cross-cutting paths. No type or function nodes here — those are produced per-file later. Ground every node in refs you verified.
On a later round your previous closure and skeleton are attached — extend and correct them rather than starting over.
READ-ONLY discipline: never create, edit, or delete any file in this repository — investigation means reading."""
input = [
    "port:topic",
    "resource:walkthrough-standards",
]
output = [
    "slot:file-closure",
    "slot:horizon",
    "slot:skeleton-nodes",
]

[[sequence.covering-body.sequence]]
id = "coverage-report-loop"
title = "Coverage report loop"
input = [
    "resource:symbols-script",
    "slot:symbol-chunks",
    "slot:skeleton-nodes",
    "slot:node-batches",
]
output = ["slot:coverage-report"]

[sequence.covering-body.sequence.command]
argv = [
    "python3",
    "{resource:symbols-script}",
    "coverage",
    "{slot:symbol-chunks}",
    "{slot:skeleton-nodes}",
    "{slot:node-batches}",
]

[[sequence.covering-body.sequence]]
id = "cover-the-gaps"
title = "Cover the gaps"
agent = "agent:investigator"
prompt = "prompt:cover-the-gaps"
input = [
    "port:topic",
    "slot:coverage-report",
    "resource:walkthrough-standards",
]

[[sequence.covering-body.sequence.output]]
slot = "slot:node-batches"
operation = "append"

[[sequence.covering-body.sequence]]
id = "coverage-status-loop"
title = "Coverage status loop"
input = [
    "resource:symbols-script",
    "slot:symbol-chunks",
    "slot:skeleton-nodes",
    "slot:node-batches",
]
output = ["slot:coverage-status"]

[sequence.covering-body.sequence.command]
argv = [
