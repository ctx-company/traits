id = "walkthrough"
schema-version = "0.5"
version = "0.1.0"
name = "Walkthrough (Default)"
description = "Explain one codebase topic top-to-bottom: an investigator surveys the repository with its own tools and returns a flat node list (one overview root, at most three levels below, every node carrying verified file:line refs); a reviewer grinds until the tree is honest; a command step renders the interactive treemap walkthrough."
summary = "Investigate a codebase topic into a typed flat node tree (coarse to fine, every node code-anchored), review it until grounded, then render a self-contained interactive treemap HTML."
variant = "default"

[metadata]
tag = [
    "dogfood",
    "walkthrough",
    "explainer",
    "treemap",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "review-before-final"

[[intent.avoid]]
id = "scope-creep"

[[intent.avoid]]
id = "rubber-stamp-review"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "output-dir"
direction = "input"
schema = "schema:text"
optional = true
description = 'Repo-relative directory the walkthrough HTML is written under. Package-defaulted to ".hidden/walkthroughs" via [defaults.port] in trait.toml; consuming repos override it in their own config.'

[[port]]
id = "render-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Render step evidence: the written path and counts."
title = "Render Report"
value = "slot:render-log"

[[port]]
id = "topic"
direction = "input"
schema = "schema:text"
description = 'The codebase topic to walk through: a file, a module, a subsystem, or a question (e.g. "the task provider", "modules/io/src/dispatch_preflight.rs", "how does dispatch refuse a claimed task").'

[[port]]
id = "walkthrough-path"
direction = "output"
schema = "schema:text"
optional = true
description = "Repo-relative path of the generated interactive walkthrough HTML."
title = "Walkthrough Path"
value = "slot:html-path"

[[port]]
id = "walkthrough-summary"
direction = "output"
schema = "schema:text"
optional = true
description = "Final investigator summary: coverage, verification method, open concerns."
title = "Walkthrough Summary"
value = "slot:work-summary"

[[slot]]
id = "html-path"
schema = "schema:text"
description = "Deterministic repo-relative path of the generated walkthrough HTML, derived by a command step."

[[slot]]
id = "render-log"
schema = "schema:text"
description = "Output evidence from the render command step: the written path and node/byte counts."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "Reviewer's verdict for the current walkthrough node list."

[[slot]]
id = "topic-slug"
schema = "schema:text"
description = "Deterministic kebab-case slug for the topic, derived by a command step — never agent prose — so the output path is predictable from the topic alone."

[[slot]]
id = "walkthrough-nodes"
schema = "[schema:walkthrough-node]"
description = "The complete flat node list for the walkthrough: exactly one root (no parent), every other node linked to an existing parent, every node grounded in verified code refs."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Investigator's cumulative account: what was explored, how refs were verified, coverage decisions, open concerns."

[[resource]]
id = "render-script"
path = "resources/render.py"
digest = "sha256:d5556d3d0aa1b9545a4ab4d95e404257a71ca987ae5fa9b6a6fa33ffee23bc2c"
hint = "Deterministic treemap renderer the render command step executes; never read by a model seat."
trigger = "on-demand"

[[resource]]
id = "walkthrough-standards"
path = "resources/walkthrough-standards.md"
digest = "sha256:721b9bde27a6663e81aac47ed8662a65fffc02c295f3aad2df409fe603ad14dd"
hint = "Node-quality doctrine: layer registers, ref discipline, tree shape rules, kind taxonomy, sizing honesty."
trigger = "on-demand"

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open" or "done". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "code-ref"
description = "One code anchor grounding a node: a file and the line span the node's prose actually explains."

[schema.fields.lines]
schema = "schema:text"
required = true
description = 'Line span "start-end" (1-indexed, inclusive) inside path that this node covers. Verified by opening the file — never guessed. The treemap derives tile sizes from these spans, so they must honestly cover the code the node explains.'

[schema.fields.path]
schema = "schema:text"
required = true
description = "Repo-relative file path this node's explanation is grounded in. Must exist in the repository."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if a blocking defect remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Non-empty when status is revise; an empty list (never omitted — always return the key) when approved. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the task's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise only when at least one blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "walkthrough-node"
description = "One node of the walkthrough tree, flat with a parent link. Least specific at the root, most specific at the leaves."

[schema.fields.explanation]
schema = "schema:text"
required = true
description = "The thorough narration for this node's layer, in the register of its depth: the root explains architecture and intent, mid nodes explain responsibilities and collaborations, leaves explain the actual mechanics precisely. Plain prose paragraphs separated by blank lines; inline `code` backticks allowed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug, unique across the whole node list."

[schema.fields.kind]
schema = "schema:text"
required = true
description = "overview = the single root; subsystem = a major area; component = a file or cohesive unit; symbol = a function/type/impl; flow = a cross-cutting path through the code (a request, a lifecycle)."
allowed = [
    "overview",
    "subsystem",
    "component",
    "symbol",
    "flow",
]

[schema.fields.parent]
schema = "schema:text"
description = "The id of this node's parent. Absent on exactly one node — the root overview. Every other node names an existing id; the tree is at most three levels deep below the root."

[schema.fields.refs]
schema = "[schema:code-ref]"
required = true
description = "At least one code anchor per node. Children's spans should live inside the territory their parent's spans cover."

[schema.fields.summary]
schema = "schema:text"
required = true
description = "One or two sentences shown at a glance — what this node is and why it exists."

[schema.fields.title]
schema = "schema:text"
required = true
description = "Short human title rendered on the treemap tile."

[[agent]]
id = "investigator"
description = "Explores the repository with its own tools and produces the walkthrough node tree."
summary = "Implementation role."

[[agent]]
id = "smart-1"
description = "Sole reviewer: verifies every ref against the actual files and the tree's shape and register."
summary = "Review role."

[prompt.investigating-produce]
text = """
Investigate {port:topic} in THIS repository with your own tools (search, read files) and return the complete walkthrough node list. Follow {resource:walkthrough-standards} exactly.
Shape: exactly one root node with no parent (kind "overview") explaining the topic at architecture level; children partition their parent's territory without overlap; at most three levels below the root; every id kebab-case and unique; every parent an existing id.
Grounding: every node carries at least one ref whose path and line span you VERIFIED by opening the file — the treemap derives tile sizes from these spans, so spans must honestly cover the code the node explains. A ref you did not open is a fabrication.
Register: the root narrates intent and architecture; mid nodes narrate responsibilities and collaborations; leaves narrate the actual mechanics precisely. Explanations are plain prose paragraphs; inline backtick code allowed.
No reviewer verdict attached means this is round 1: survey first, then write the tree. On every later round a verdict IS attached — fix every blocker it names and return the corrected COMPLETE list.
Also return nothing else: the node list is the deliverable."""
input = [
    "port:topic",
    "resource:walkthrough-standards",
]
output = ["slot:walkthrough-nodes"]

[prompt.investigating-review]
text = """
Review the walkthrough node list {slot:walkthrough-nodes} delivered for {port:topic} against {resource:walkthrough-standards}. Investigator summary: {slot:work-summary}.
Verify with your OWN tools: open a sample of every node's refs and confirm the path exists and the span covers what the explanation claims; confirm exactly one parentless root, no orphan parents, no cycle, depth at most three below the root; confirm children partition parents and the register matches the layer.
A BLOCKER is: a ref whose file or span does not support the explanation, a missing/duplicated id, an orphaned or cyclic parent link, more than one root, depth beyond three, a layer whose explanation is at the wrong register, or a major area of the topic with no node.
Everything else is advisory. Your own verdict from last round is attached when one exists: carry every open blocker forward verbatim, verify with your own tools, and flip to done only on confirmed evidence.
Set status to revise while any blocker remains, approved when none do."""
input = [
    "slot:walkthrough-nodes",
    "port:topic",
    "resource:walkthrough-standards",
    "slot:work-summary",
]
output = ["slot:review-verdict-1"]

[prompt.investigating-summarize]
text = "Summarize the investigation you just delivered for {port:topic}: what you explored, how you verified refs, coverage decisions you made, and open concerns. A few sentences of plain prose."
input = ["port:topic"]
output = ["slot:work-summary"]

[[sequence.investigating-body.sequence]]
id = "investigating-produce"
title = "Investigating Produce"
agent = "agent:investigator"
prompt = "prompt:investigating-produce"
input = [
    "port:topic",
    "resource:walkthrough-standards",
    { slot = "slot:review-verdict-1", optional = true },
    { slot = "slot:walkthrough-nodes", optional = true },
]
output = ["slot:walkthrough-nodes"]

[[sequence.investigating-body.sequence]]
id = "investigating-summarize"
title = "Investigating Summarize"
agent = "agent:investigator"
prompt = "prompt:investigating-summarize"
input = [
    "port:topic",
    { slot = "slot:walkthrough-nodes", optional = true },
    { slot = "slot:work-summary", optional = true },
]
output = ["slot:work-summary"]

[[sequence.investigating-body.sequence]]
id = "investigating-review"
title = "Investigating Review"
agent = "agent:smart-1"
prompt = "prompt:investigating-review"
input = [
    "slot:walkthrough-nodes",
    "port:topic",
    "resource:walkthrough-standards",
    "slot:work-summary",
    { slot = "slot:review-verdict-1", optional = true },
]
output = ["slot:review-verdict-1"]

[procedure]
description = "Explain one codebase topic top-to-bottom: an investigator surveys the repository with its own tools and returns a flat node list (one overview root, at most three levels below, every node carrying verified file:line refs); a reviewer grinds until the tree is honest; a command step renders the interactive treemap walkthrough."
input = [
    "port:output-dir",
    "port:topic",
]
output = [
    "port:render-report",
    "port:walkthrough-path",
    "port:walkthrough-summary",
]

[[procedure.sequence]]
id = "topic-slug"
title = "Derive topic slug"
input = ["port:topic"]
output = ["slot:topic-slug"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'printf "%s" "$1" | tr "A-Z" "a-z" | tr -cs "a-z0-9" "-" | sed "s/^-*//;s/-*$//"',
    "_",
    "{port:topic}",
]

[[procedure.sequence]]
id = "walkthrough-path"
title = "Derive walkthrough path"
input = [
    "port:output-dir",
    "slot:topic-slug",
]
output = ["slot:html-path"]

[procedure.sequence.command]
argv = [
    "printf",
    "%s/%s.html",
    "{port:output-dir}",
    "{slot:topic-slug}",
]

[[procedure.sequence]]
id = "investigating"
title = "Investigating"
kind = "loop"
sequence = "sequence:investigating-body"
max-iterations = 3
on-exhausted = "abort"

[procedure.sequence.until]
slot = "slot:review-verdict-1"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "render-walkthrough"
title = "Render walkthrough"
input = [
    "resource:render-script",
    "slot:walkthrough-nodes",
    "slot:html-path",
]
output = ["slot:render-log"]

[procedure.sequence.command]
argv = [
    "python3",
    "{resource:render-script}",
    "{slot:walkthrough-nodes}",
    "{slot:html-path}",
]
