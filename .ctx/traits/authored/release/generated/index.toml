id = "release"
schema-version = "0.5"
version = "0.1.0"
name = "Release"
description = "Release Procedure: preflight gates, version bump, changelog, commit & tag, with owner-approved tag push and publish."

[metadata]
tag = [
    "first-party",
    "release",
    "review",
    "gated",
]

[[intent.require]]
id = "review-before-final"

[[intent.require]]
id = "leanness"

[[intent.avoid]]
id = "rubber-stamp-review"

[[intent.avoid]]
id = "scope-creep"

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Commit-and-tag evidence. Absent when preflight parked (dirty tree, red gate) or either review round exhausted unapproved."
value = "slot:commit-output"

[[port]]
id = "publish-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Publish evidence from the gated publish command. Absent whenever the run parked earlier, or the owner denied either gate."
value = "slot:publish-output"

[[port]]
id = "version"
direction = "input"
schema = "schema:text"
optional = true
description = 'Optional explicit version override (e.g. "1.5.0"). Absent, the worker derives the bump from the commit log since the last tag and the reviewer checks the derivation.'

[[slot]]
id = "changelog-entry"
schema = "schema:text"
description = "The drafted changelog entry, grounded solely in the commit log — every line traceable to a listed commit hash."

[[slot]]
id = "changelog-verdict"
schema = "schema:reviewer-verdict"
description = "Reviewer's refute-mode spot-check verdict on the changelog entry."

[[slot]]
id = "changelog-write-output"
schema = "schema:text"
description = "One-line confirmation from the worker of the changelog file path it edited."

[[slot]]
id = "commit-log"
schema = "schema:text"
description = "One-line log of every commit landed since the last tag — the sole grounding source for the changelog entry."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Release commit message; injected directly into the git commit command step."

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "current-branch"
schema = "schema:text"
description = "The branch HEAD is on, captured before any bump work — checked against the manifest's declared release branch."

[[slot]]
id = "gate-passed"
schema = "schema:release-gate-result"
description = 'Whether the repo-declared preflight gate (["just", "test"]) exited successfully, and the exact argv that decided it.'

[[slot]]
id = "git-status"
schema = "schema:text"
description = "Working-tree status captured before any work begins: git status --porcelain output verbatim."
hint = "Non-empty means the tree is dirty; the run parks before any bump when this is non-empty."

[[slot]]
id = "last-tag"
schema = "schema:text"
description = "The most recent annotated tag reachable from HEAD, or the sentinel v0.0.0 when the repo has none yet."

[[slot]]
id = "new-version"
schema = "schema:text"
description = 'The exact new version string the worker derived (or copied from the explicit override port), e.g. "1.4.0" — digits and dots only, no leading "v".'
hint = "Pattern-constrained by convention, not schema: reviewed before it ever reaches the tag command's argv."

[[slot]]
id = "publish-output"
schema = "schema:text"
description = "Output evidence from the ctx-gate-guarded publish command. Absent when the owner denies or the gate times out."

[[slot]]
id = "push-output"
schema = "schema:text"
description = "Output evidence from push."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Verbatim output of the git-add staging command."

[[slot]]
id = "tag-output"
schema = "schema:text"
description = "Output evidence from the local annotated-tag command."

[[slot]]
id = "unstage-output"
schema = "schema:text"
description = "Verbatim output of the runtime-state unstage command (git reset -- .agents/runs); empty when nothing was staged there."

[[slot]]
id = "version-diff"
schema = "schema:text"
description = "Scoped diff of the version-file edits, for the reviewer to open with its own tools."

[[slot]]
id = "version-summary"
schema = "schema:text"
description = "What changed: files bumped, old version to new version, and how the bump was derived."

[[slot]]
id = "version-verdict"
schema = "schema:reviewer-verdict"
description = "Reviewer's verdict on the version bump."

[[resource]]
id = "release-manifest"
path = "resources/release.toml"
hint = "The release contract: the version-file locations to bump, the changelog file path, the release branch name, and the bump rule."
trigger = "on-activation"

[[schema]]
id = "decision"
schema = "schema:text"
allowed = [
    "approved",
    "revise",
]

[[schema]]
id = "release-gate-result"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv the gate ran."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True when the gate command exited successfully."

[[schema]]
id = "reviewer-verdict"
description = "Minimal produce-review verdict: decision status plus the blockers that justify a revise."

[schema.fields.blockers]
schema = "[schema:text]"
required = true
description = "The blocking defects that justify a revise verdict; empty when status is approved."

[schema.fields.status]
schema = "schema:decision"
required = true
description = "approved when no blocker remains; revise when at least one blocker remains."

[[agent]]
id = "reviewer"
description = "Reviews the version bump and spot-checks the changelog."
summary = "Review role."

[[agent]]
id = "scribe"
description = "Drafts the changelog entry and the release commit message.; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "worker"
description = "Bumps the version files the release manifest declares."
summary = "Implementation role."

[prompt.bump-the-declared-version-files]
text = """

    Read the release manifest {resource:release-manifest} with your tools: the version-file locations to bump, the changelog path, and the release branch.
    The current branch is {slot:current-branch}. If it does not match the manifest's declared release branch, edit nothing and say so plainly in your summary.
    If present, the version-file override is {port:version}, otherwise derive the next version from the commit log since the last tag ({slot:commit-log}.
  """
input = [
    "resource:release-manifest",
    "slot:current-branch",
    "port:version",
    "slot:commit-log",
]
output = [
    "slot:new-version",
    "slot:version-summary",
]

[prompt.draft-the-changelog-entry]
text = """

    Draft the changelog entry for version {slot:new-version} from the commit log since the last tag: {slot:commit-log}. Do not consult anything else.
    Every line must trace to a specific commit hash in that log — never invent, embellish, or infer beyond what a commit's own summary states.
    Write the entry in the format the manifest {resource:release-manifest} declares for its changelog file, ready to insert at the top of the changelog section for unreleased entries."""
input = [
    "slot:new-version",
    "slot:commit-log",
    "resource:release-manifest",
]
output = ["slot:changelog-entry"]

[prompt.insert-the-changelog-entry-into-the-changelog-file]
text = """

    The changelog entry {slot:changelog-entry} for version {slot:new-version} has been approved.
    Read the release manifest {resource:release-manifest} with your tools to find the changelog file path.
    Insert the approved entry at the top of that file's unreleased/new-version section."""
input = [
    "slot:changelog-entry",
    "slot:new-version",
    "resource:release-manifest",
]
output = ["slot:changelog-write-output"]

[prompt.review-the-version-bump]
text = """

    Review the release's version bump.
    Information:
      - Current branch: {slot:current-branch}
      - New version: {slot:new-version}
      - Worker's summary: {slot:version-summary}
      - Scoped diff: {slot:version-diff}
    Blocker Guidelines:
      - the run is on a branch other than the manifest's declared release branch
      - a file the manifest does not list was edited
      - the new version does not match the manifest's declared bump rule
      - the new version does not match the explicit override port when one was given
      - the new version does not match any file the manifest lists was missed
  """
input = [
    "slot:current-branch",
    "slot:new-version",
    "slot:version-summary",
    "slot:version-diff",
]
output = ["slot:version-verdict"]

[prompt.spot-check-the-changelog]
text = """

    Spot-check the changelog entry {slot:changelog-entry} against the commit log {slot:commit-log}.
    Open a few of the cited commits with "git show" and try to REFUTE each line (default to blocking on what you cannot verify).
    A blocker is any line not traceable to a listed commit, or any commit in the log with no corresponding line."""
input = [
    "slot:changelog-entry",
    "slot:commit-log",
]
output = ["slot:changelog-verdict"]

[prompt.write-the-release-commit-message]
text = """

    The version-bump and changelog reviews have both approved.
    Write the release commit message: subject line "release: v{slot:new-version}", then the changelog entry {slot:changelog-entry} as the body."""
input = [
    "slot:new-version",
    "slot:changelog-entry",
]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence]]
id = "write-the-release-commit-message"
title = "Write the release commit message"
agent = "agent:scribe"
prompt = "prompt:write-the-release-commit-message"
input = [
    "slot:new-version",
    "slot:changelog-entry",
]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence]]
id = "stage-all-changes"
title = "Stage all changes"
output = ["slot:stage-output"]

[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
]

[[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence]]
id = "unstage-runtime-state"
title = "Unstage runtime state"
output = ["slot:unstage-output"]

[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence.command]
argv = [
    "git",
    "reset",
    "-q",
    "--",
    ".agents/runs",
]

[[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence]]
id = "commit-the-release"
title = "Commit the release"
input = ["slot:commit-message"]
output = ["slot:commit-output"]

[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence.command]
argv = [
    "git",
    "commit",
    "-m",
    "{slot:commit-message}",
]

[[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence]]
id = "tag-the-release-local"
title = "Tag the release (local)"
input = [
    "slot:new-version",
    "slot:commit-message",
]
output = ["slot:tag-output"]

[sequence.ctx-branch-arm-p-18-changelog-approved-then.sequence.command]
argv = [
    "sh",
    "-c",
    'git tag -a "v$1" -m "$2"',
    "_",
    "{slot:new-version}",
    "{slot:commit-message}",
]

[[sequence.ctx-branch-arm-p-20-preflight-clean-tree-then.sequence]]
id = "run-the-repository-gate-chain"
title = "Run the repository gate chain"
kind = "check"
output = ["slot:gate-passed"]

[sequence.ctx-branch-arm-p-20-preflight-clean-tree-then.sequence.command]
argv = [
    "just",
    "test",
]
timeout-ms = 600000

[[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence]]
id = "find-the-last-tag"
title = "Find the last tag"
output = ["slot:last-tag"]

[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence.command]
argv = [
    "sh",
    "-c",
    "git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0",
]

[[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence]]
id = "capture-the-commit-log-since-the-last-tag"
title = "Capture the commit log since the last tag"
input = ["slot:last-tag"]
output = ["slot:commit-log"]

[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence.command]
argv = [
    "sh",
    "-c",
    'git log "$1..HEAD" --oneline 2>/dev/null || git log --oneline',
    "_",
    "{slot:last-tag}",
]

[[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence]]
id = "bump-the-declared-version-files"
title = "Bump the declared version files"
agent = "agent:worker"
prompt = "prompt:bump-the-declared-version-files"
input = [
    "resource:release-manifest",
    "slot:current-branch",
    "port:version",
    "slot:commit-log",
]
output = [
    "slot:new-version",
    "slot:version-summary",
]

[[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence]]
id = "capture-the-version-file-diff"
title = "Capture the version-file diff"
output = ["slot:version-diff"]

[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence.command]
argv = [
    "git",
    "diff",
    "--stat",
]

[[sequence.ctx-branch-arm-p-20-preflight-gate-green-then.sequence]]
id = "review-the-version-bump"
title = "Review the version bump"
agent = "agent:reviewer"
prompt = "prompt:review-the-version-bump"
input = [
    "slot:current-branch",
    "slot:new-version",
    "slot:version-summary",
    "slot:version-diff",
]
output = ["slot:version-verdict"]

[[sequence.ctx-branch-arm-p-21-version-bump-approved-then.sequence]]
id = "draft-the-changelog-entry"
title = "Draft the changelog entry"
agent = "agent:scribe"
prompt = "prompt:draft-the-changelog-entry"
input = [
    "slot:new-version",
    "slot:commit-log",
    "resource:release-manifest",
]
output = ["slot:changelog-entry"]

[[sequence.ctx-branch-arm-p-21-version-bump-approved-then.sequence]]
id = "spot-check-the-changelog"
title = "Spot-check the changelog"
agent = "agent:reviewer"
prompt = "prompt:spot-check-the-changelog"
input = [
    "slot:changelog-entry",
    "slot:commit-log",
]
output = ["slot:changelog-verdict"]

[[sequence.ctx-branch-arm-p-21-version-bump-approved-then.sequence]]
id = "insert-the-changelog-entry-into-the-changelog-file"
title = "Insert the changelog entry into the changelog file"
agent = "agent:worker"
prompt = "prompt:insert-the-changelog-entry-into-the-changelog-file"
input = [
    "slot:changelog-entry",
    "slot:new-version",
    "resource:release-manifest",
]
output = ["slot:changelog-write-output"]

[[sequence.ctx-branch-arm-p-6-tagged-then.sequence]]
id = "push-the-tag-awaiting-ctx-gate-approval"
title = "Push the tag (awaiting ctx-gate approval)"
output = ["slot:push-output"]

[sequence.ctx-branch-arm-p-6-tagged-then.sequence.command]
argv = [
    "ctx-gate",
    "run",
    "--",
    "git",
    "push",
    "--follow-tags",
]
timeout-ms = 28800000

[[sequence.ctx-branch-arm-p-6-tagged-then.sequence]]
id = "publish-the-release-awaiting-ctx-gate-approval"
title = "Publish the release (awaiting ctx-gate approval)"
output = ["slot:publish-output"]

[sequence.ctx-branch-arm-p-6-tagged-then.sequence.command]
argv = [
    "ctx-gate",
    "run",
    "--",
    "just",
    "release-publish",
]
timeout-ms = 28800000

[procedure]
description = "Release Procedure: preflight gates, version bump, changelog, commit & tag, with owner-approved tag push and publish."
input = ["port:version"]
output = [
    "port:commit-report",
    "port:publish-report",
]

[[procedure.sequence]]
id = "check-working-tree-status"
title = "Check working tree status"
output = ["slot:git-status"]

[procedure.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[procedure.sequence]]
id = "capture-the-current-branch"
title = "Capture the current branch"
output = ["slot:current-branch"]

[procedure.sequence.command]
argv = [
    "git",
    "rev-parse",
    "--abbrev-ref",
    "HEAD",
]

[[procedure.sequence]]
id = "preflight-clean-tree"
title = "Preflight Clean Tree"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-20-preflight-clean-tree-then"

[procedure.sequence.when]
empty = "slot:git-status"

[[procedure.sequence]]
id = "preflight-gate-green"
title = "Preflight Gate Green"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-20-preflight-gate-green-then"

[procedure.sequence.when]
slot = "slot:gate-passed"
field = "ok"
equals = true

[[procedure.sequence]]
id = "version-bump-approved"
title = "Version Bump Approved"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-version-bump-approved-then"

[procedure.sequence.when]
slot = "slot:version-verdict"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "changelog-approved"
title = "Changelog Approved"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-18-changelog-approved-then"

[procedure.sequence.when]
slot = "slot:changelog-verdict"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "tagged"
title = "Tagged"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-6-tagged-then"

[procedure.sequence.when.not]
empty = "slot:commit-output"
