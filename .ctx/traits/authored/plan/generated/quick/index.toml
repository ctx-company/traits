id = "plan"
schema-version = "0.5"
version = "0.5.0"
name = "Plan (Quick)"
description = "Distill described work straight into board-ready TaskDocument TOML task files — no separate grounding pass, no review pass."
variant = "quick"

[metadata]
tag = [
    "task",
    "plan",
    "bootstrap",
    "planning",
]

[[intent.focus]]
id = "specific"

[[intent.focus]]
id = "correctness"

[[intent.avoid]]
id = "speculative-claim"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = "The work you describe, in your own words — rough is fine. May reference a source document (a research report, an MVP plan) by repo-relative path."

[[port]]
id = "written-files"
direction = "output"
schema = "[schema:write-receipt]"
description = "Per-slice receipts naming every task file written under .internal/tasks/."
title = "Written Task Files"
format = [
    "structured",
    "table",
]
value = "slot:receipts"

[[slot]]
id = "next-key"
schema = "schema:text"
description = "Deterministic zero-padded next free board key, derived by a command step scanning .internal/tasks/ (archived/ included) — never agent arithmetic against the directory."

[[slot]]
id = "raised-date"
schema = "schema:text"
description = "Today's date (YYYY-MM-DD), derived by a command step — the Raised stamp every written task carries."

[[slot]]
id = "receipts"
schema = "[schema:write-receipt]"
description = "One write receipt appended per slice frame (or produced whole by a single-frame variant)."

[[schema]]
id = "write-receipt"
description = "One slice frame's account of the task files it wrote to the board."

[schema.fields.files]
schema = "[schema:text]"
required = true
description = "Repo-relative paths of every task file this slice's frame wrote."

[schema.fields.slice-key]
schema = "schema:text"
required = true
description = "The slice charter's key."

[[agent]]
id = "smart-1"
description = "Distills the described work directly into board task files, grounded by its own repository reading."
summary = "Distill-and-write role."

[prompt.distill]
text = '''
Turn the described work directly into TaskDocument TOML task files on the board — skip deriving separate grounding notes, but read the relevant parts of the repository with your tools so every task is grounded in this codebase's concrete files, modules, and validation gates.
            The work, as described: {port:task}
            Write each task as one TaskDocument TOML file in .internal/tasks/, named <key>-<kebab-slug-of-title>.toml, in exactly this shape:

    schema-version = "0.2"
    key = "<NNNN or NNNN.X>"
    title = "<short imperative title>"
    status = "ready"
    raised = "<YYYY-MM-DD>"
    content = """
    What this task is and why it exists — grounded, concrete, standalone.
    """
    scope = """
    ## Decisions
    The rulings made; what is in scope and what is explicitly out.
    """
    validation = """
    ## Watch
    Hazards and constraints an implementer must not trip.
    ## Done when
    The observable, verifiable condition proving the task is complete.
    """
    [relations]
    parent = "<NNNN>"
    depends-on = ["<key>", "<key>"]

    [[checks]]
    name = "<what this verifies>"
    command = "<repo-relative shell command>"
    # optional: timeout-ms = <n>, expect = "<regex the combined output must match>"

Rules:
- A parent charter task uses a bare "NNNN" key and holds the slice's goal, the work items it covers, and the slice's stop condition; its Done when is "every child task is closed and the stop condition holds". A charter has no [relations].parent (it may still declare depends-on toward earlier slices' charters).
- Child tasks are keyed "NNNN.1", "NNNN.2", ... in dependency order; every child sets [relations].parent to its charter's key, and names any prerequisite task explicitly in depends-on — a child may depend only on tasks with earlier keys.
- Size every child task to roughly 10-15 minutes of focused agent work — small enough to finish in one short pass; split anything larger into more children.
- Fold the grounding each task needs — its concrete files, validation gates with exact commands, invariants, constraints — into that task's own content/scope/validation, so every file stands alone.
- Omit [relations] entirely when a task has neither parent nor dependencies; never emit empty tables or empty arrays.
- When a child's Done-when is mechanically checkable — a named test invocation, build gate, or grep for an artifact with a definite exit verdict — derive one [[checks]] entry per such criterion. The command must exist in the repo today, be repo-root-relative, and carry its whole verdict in the exit code; harden it with expect when needed — a check must pass on exit 0 AND a matching expect regex, so a test-filter command should declare expect to guard against passing by matching nothing.
- Never fabricate a check: if no existing command verifies the Done-when, or verification is judgment-based, declare no checks — a wrong check that passes is worse than none; check-less tasks fall to the configured [tasks] auto-close policy.
- At most a few checks per task (core hard-caps at 8; exceeding the cap makes the whole set un-runnable); the default timeout is 120s, so declare timeout-ms for any gate that runs slower than that.
- Checks run later via "sh -c" in a clean detached worktree of the merged sha — no absolute paths, no state from this run, no interactive commands.
- Never overwrite or renumber an existing file; keys are assigned once from the derived next-free key and are final.
            Key the first file {slot:next-key} and continue from there ("<key>.1", "<key>.2", ... under one charter when the work needs several tasks; a single bare-key task when it does not). Stamp raised = {slot:raised-date} in every file. Derive each task's [[checks]] from its done criteria per the doctrine, confirming with your tools that any command you name actually exists in the repo before declaring it.
            Do not implement anything. Return the receipts: one entry per charter (or standalone task) naming every file written.'''
input = [
    "port:task",
    "slot:next-key",
    "slot:raised-date",
]
output = ["slot:receipts"]

[procedure]
description = "Derive the next board key and date, then distill the described work — grounded by the frame's own repository reading — straight into TaskDocument TOML files on the board."
input = ["port:task"]
output = ["port:written-files"]

[[procedure.sequence]]
id = "next-key"
title = "Derive next board key"
output = ["slot:next-key"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    """ls .internal/tasks .internal/tasks/archived 2>/dev/null | awk -F'[.-]' '{n=$1+0; if (n>m) m=n} END {printf "%04d", m+1}'""",
]

[[procedure.sequence]]
id = "raised-date"
title = "Derive raised date"
output = ["slot:raised-date"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "date +%Y-%m-%d",
]

[[procedure.sequence]]
id = "distill"
title = "Distill into task files"
agent = "agent:smart-1"
prompt = "prompt:distill"
input = [
    "port:task",
    "slot:next-key",
    "slot:raised-date",
]
output = ["slot:receipts"]
