id = "plan"
schema-version = "0.4"
version = "0.5.0"
name = "Plan"
description = "Turn described work into board-ready TaskDocument TOML task files in .internal/tasks/ — charters plus 10-15-minute children with typed relations, the format the board dispatch machinery actually resolves."
variant = "default"

[metadata]
tag = [
    "task",
    "plan",
    "bootstrap",
    "planning",
]

[[intent.focus]]
id = "specific"

[[intent.focus]]
id = "correctness"

[[intent.avoid]]
id = "speculative-claim"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = "The work you describe, in your own words — rough is fine. May reference a source document (a research report, an MVP plan) by repo-relative path."

[[port]]
id = "written-files"
direction = "output"
schema = "[schema:write-receipt]"
description = "Per-slice receipts naming every task file written under .internal/tasks/."
title = "Written Task Files"
format = [
    "structured",
    "table",
]
value = "slot:receipts"

[[slot]]
id = "board-check"
schema = "schema:board-untouched"
description = "The pre-write board guard's verdict: detection that no earlier step wrote to the board."

[[slot]]
id = "board-snapshot"
schema = "schema:text"
description = "Deterministic checksum of the board listing at run start — the reference the pre-write guard compares against, so a frame that writes task files before the write phase fails the run instead of merging out-of-plan files."

[[slot]]
id = "done-criteria"
schema = "[schema:text]"
description = "The source's explicit definition-of-done items, empty when it states none."

[[slot]]
id = "grounding"
schema = "schema:text"
description = "Codebase grounding for the described work: the concrete files and modules it touches, the repo's validation gates (exact commands), and the invariants, rules, and constraints the task files must honor."
hint = "Grounded in the codebase: what the project is, its build/test/lint gates (exact invocations), architectural invariants, dependency rules, and constraints an implementer and reviewer must honor. Context the tasks carry, not the step-by-step plan."

[[slot]]
id = "next-key"
schema = "schema:text"
description = "Deterministic zero-padded next free board key, derived by a command step scanning .internal/tasks/ (archived/ included) — never agent arithmetic against the directory."

[[slot]]
id = "raised-date"
schema = "schema:text"
description = "Today's date (YYYY-MM-DD), derived by a command step — the Raised stamp every written task carries."

[[slot]]
id = "receipts"
schema = "[schema:write-receipt]"
description = "One write receipt appended per slice frame (or produced whole by a single-frame variant)."

[[slot]]
id = "slice-plan"
schema = "[schema:plan-slice]"
description = "The typed plan: parent charter keys with their child tasks, final keys already assigned from slot:next-key."

[[slot]]
id = "work-items"
schema = "[schema:work-item]"
description = "The source's own units of demanded work — coverage is judged against these, not the slice plan."

[[slot]]
id = "write-each-slice-item"
schema = "schema:plan-slice"
description = "Per-item value for the write-each-slice loop."

[[schema]]
id = "board-untouched"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv that decided it."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True when the board listing still matches the run-start snapshot at the write boundary."

[[schema]]
id = "plan-slice"
description = "One dependency-ordered slice of the plan: a parent charter key plus its child tasks."

[schema.fields.covers]
schema = "[schema:text]"
required = true
description = "work-item ids this slice is responsible for. Every extracted work item must appear in at least one slice's covers."

[schema.fields.key]
schema = "schema:text"
required = true
description = "Final board key of the slice's parent charter task: bare zero-padded NNNN."

[schema.fields.tasks]
schema = "[schema:plan-task]"
required = true
description = """The slice's child tasks in dependency order, keys "NNNN.1", "NNNN.2", ..."""

[schema.fields.title]
schema = "schema:text"
required = true
description = "The slice's goal, as a short title."

[[schema]]
id = "plan-task"
description = "One child task in a slice's plan — the index entry; the full TaskDocument body is composed by the slice's own frame."

[schema.fields.depends-on]
schema = "[schema:text]"
required = true
description = "Keys of earlier tasks this one needs completed first; empty when independent."

[schema.fields.key]
schema = "schema:text"
required = true
description = """Final board key: the parent slice's NNNN plus a child ordinal, e.g. "0150.2"."""

[schema.fields.summary]
schema = "schema:text"
required = true
description = "One-paragraph account of the task's work, sized to roughly 10-15 minutes of focused agent effort."

[schema.fields.title]
schema = "schema:text"
required = true
description = "Short imperative title."

[[schema]]
id = "work-item"
description = "One unit of demanded work, extracted from the source document (or distilled from the described task when no document is referenced). Coverage is judged against these."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this work item, unique within the plan."

[schema.fields.requirement]
schema = "schema:text"
required = true
description = "What the source demands this item deliver or establish."

[schema.fields.title]
schema = "schema:text"
required = true
description = "The work item's short name, in the source's own words where a source document exists."

[[schema]]
id = "write-receipt"
description = "One slice frame's account of the task files it wrote to the board."

[schema.fields.files]
schema = "[schema:text]"
required = true
description = "Repo-relative paths of every task file this slice's frame wrote."

[schema.fields.slice-key]
schema = "schema:text"
required = true
description = "The slice charter's key."

[[agent]]
id = "smart-1"
description = "Strong model: extracts the source contract, grounds the work in the codebase, plans the slices, and writes each slice's task files in its own frame."
summary = "Contract + grounding + planning + composition role."

[prompt.ingest]
text = """

            Read the source of the described work: {port:task}. When it references a document (a research report, an MVP plan, a spec) by path, read that document from the repository; otherwise the description itself is the source.
            Extract two things, faithful to the source's own words — never your preferred framing:
            1. Its work items: every unit of work the source demands (an MVP slice, an enumerated deliverable, a named milestone), each with the source's own requirement for it. When the source does not enumerate, distill 2-8 items from its prose.
            2. Its explicit definition-of-done items (a stop condition, acceptance criteria), empty when it states none.
            Do not implement anything, do not plan yet, and write nothing to disk in this step — not task files, not notes. A later step writes the board from the reviewed plan; any file created here is out-of-plan and will not be adopted."""
input = ["port:task"]
output = [
    "slot:work-items",
    "slot:done-criteria",
]

[prompt.refine-task]
text = """

            Task is described as: {port:task}, ground it in the codebase & refine it.
            Read the relevant parts of the repository with your tools:
                - identify the concrete files, modules, and patterns the task touches
                - the build/test/lint commands (the repo's validation gates, with exact invocations)
                - architectural invariants and requirements
                - dependencies or rules that need to be respected
            Produce the grounding notes:
                - short project/context overview,
                - rules and invariants an implementer and reviewer must honor,
                - validation gates (exact commands)
                - constraints specific to this task.
            This is the context the task files carry, not the step-by-step plan.
            Do not implement anything, and write nothing to disk in this step — not task files, not notes. A later step writes the board from the reviewed plan; any file created here is out-of-plan and will not be adopted."""
input = ["port:task"]
output = ["slot:grounding"]

[prompt.split]
text = """

            Break the described work into dependency-ordered slices with child tasks, as the typed plan.
            The work, as described: {port:task}
            The source's work items: {slot:work-items}
            The source's done criteria: {slot:done-criteria}
            Grounding notes: {slot:grounding}
            Assign final board keys now, starting at {slot:next-key}: the first slice's charter takes that key, the next slice the following number, and so on; children are "<charter-key>.1", "<charter-key>.2", ... in dependency order. Keys are final — no placeholders.
            Plan at most eight slices — consolidate related work items into one slice rather than exceeding the cap. Every work item MUST appear in at least one slice's covers; a slice may own several related items. Size every child task to roughly 10-15 minutes of focused agent work; a slice with more than nine children is too big — split the slice. Order slices and children so each depends only on earlier keys, and record real dependencies explicitly in each task's depends-on.
            Do not implement anything, and write nothing to disk in this step — not task files, not notes; return only the plan. A later step writes the board from it; any file created here is out-of-plan and will not be adopted."""
input = [
    "port:task",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
    "slot:next-key",
]
output = ["slot:slice-plan"]

[prompt.write-the-slice]
text = '''
Write exactly one slice of the plan to the board — {slot:write-each-slice-item} — as TaskDocument TOML files in .internal/tasks/ (create the directory if missing). Do not write any other slice's files; other slices run in their own frames.
            Write each task as one TaskDocument TOML file in .internal/tasks/, named <key>-<kebab-slug-of-title>.toml, in exactly this shape:

    schema-version = "0.2"
    key = "<NNNN or NNNN.X>"
    title = "<short imperative title>"
    status = "ready"
    raised = "<YYYY-MM-DD>"
    content = """
    What this task is and why it exists — grounded, concrete, standalone.
    """
    scope = """
    ## Decisions
    The rulings made; what is in scope and what is explicitly out.
    """
    validation = """
    ## Watch
    Hazards and constraints an implementer must not trip.
    ## Done when
    The observable, verifiable condition proving the task is complete.
    """
    [relations]
    parent = "<NNNN>"
    depends-on = ["<key>", "<key>"]

Rules:
- A parent charter task uses a bare "NNNN" key and holds the slice's goal, the work items it covers, and the slice's stop condition; its Done when is "every child task is closed and the stop condition holds". A charter has no [relations].parent (it may still declare depends-on toward earlier slices' charters).
- Child tasks are keyed "NNNN.1", "NNNN.2", ... in dependency order; every child sets [relations].parent to its charter's key, and names any prerequisite task explicitly in depends-on — a child may depend only on tasks with earlier keys.
- Size every child task to roughly 10-15 minutes of focused agent work — small enough to finish in one short pass; split anything larger into more children.
- Fold the grounding each task needs — its concrete files, validation gates with exact commands, invariants, constraints — into that task's own content/scope/validation, so every file stands alone.
- Omit [relations] entirely when a task has neither parent nor dependencies; never emit empty tables or empty arrays.
- Never overwrite or renumber an existing file; keys are assigned once from the derived next-free key and are final.
            Write the charter task first (the slice's key), then every child task from the slice's own plan, keeping each child's key, title, and depends-on exactly as planned. Stamp raised = {slot:raised-date} in every file. Ground each task's content/scope/validation in the work items {slot:work-items}, the done criteria {slot:done-criteria}, and the grounding notes {slot:grounding} — fold in what that task needs so it stands alone.
            Do not implement anything. Return the receipt: the slice's key and the repo-relative path of every file you wrote.'''
input = [
    "slot:write-each-slice-item",
    "slot:raised-date",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
]
output = ["slot:receipts"]

[[sequence.ctx-branch-arm-p-21-premature-board-write-then.sequence]]
id = "premature-board-write-exit"
title = "Premature board write"
kind = "terminal"
outcome = "error"
message = "an early step wrote to .internal/tasks before the write phase; ingest/refine/split must leave the board untouched, so the run fails rather than adopting out-of-plan files"

[[sequence.planning-body.sequence]]
id = "split"
title = "Split the work into slices"
agent = "agent:smart-1"
prompt = "prompt:split"
input = [
    "port:task",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
    "slot:next-key",
    { slot = "slot:slice-plan", optional = true },
]
output = ["slot:slice-plan"]

[[sequence.write-each-slice-body.sequence]]
id = "write-the-slice"
title = "Write the slice"
agent = "agent:smart-1"
prompt = "prompt:write-the-slice"
input = [
    "slot:write-each-slice-item",
    "slot:raised-date",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
]

[[sequence.write-each-slice-body.sequence.output]]
slot = "slot:receipts"
operation = "append"

[procedure]
description = "Extract the source's work items and done criteria, ground the work in the codebase, split it into a typed slice plan with final keys, write each slice's TaskDocument TOML files in its own frame, and return the receipts."
input = ["port:task"]
output = ["port:written-files"]

[[procedure.sequence]]
id = "board-snapshot"
title = "Snapshot the board"
output = ["slot:board-snapshot"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "ls .internal/tasks .internal/tasks/archived 2>/dev/null | sort | cksum",
]

[[procedure.sequence]]
id = "next-key"
title = "Derive next board key"
output = ["slot:next-key"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    """ls .internal/tasks .internal/tasks/archived 2>/dev/null | awk -F'[.-]' '{n=$1+0; if (n>m) m=n} END {printf "%04d", m+1}'""",
]

[[procedure.sequence]]
id = "raised-date"
title = "Derive raised date"
output = ["slot:raised-date"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "date +%Y-%m-%d",
]

[[procedure.sequence]]
id = "ingest"
title = "Ingest the work source"
agent = "agent:smart-1"
prompt = "prompt:ingest"
input = ["port:task"]
output = [
    "slot:work-items",
    "slot:done-criteria",
]

[[procedure.sequence]]
id = "refine-task"
title = "Ground & refine the task in the codebase"
agent = "agent:smart-1"
prompt = "prompt:refine-task"
input = ["port:task"]
output = ["slot:grounding"]

[[procedure.sequence]]
id = "planning"
title = "Planning"
kind = "loop"
sequence = "sequence:planning-body"
max-iterations = 3
on-exhausted = "abort"

[[procedure.sequence.until.any]]
equals = 1
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 2
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 3
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 4
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 5
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 6
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 7
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 8
count = "slot:slice-plan"

[[procedure.sequence]]
id = "board-untouched"
title = "Board untouched before write"
kind = "check"
input = ["slot:board-snapshot"]
output = ["slot:board-check"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'ls .internal/tasks .internal/tasks/archived 2>/dev/null | sort | cksum | grep -qxF -- "$1"',
    "_",
    "{slot:board-snapshot}",
]

[[procedure.sequence]]
id = "premature-board-write"
title = "Premature board write"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-premature-board-write-then"

[procedure.sequence.when]
slot = "slot:board-check"
field = "ok"
equals = false

[[procedure.sequence]]
id = "seed-receipts"
title = "Seed the receipts"
kind = "project"
output = ["slot:receipts"]

[[procedure.sequence.projection]]
destination = "slot:receipts"

[procedure.sequence.projection.source]
literal = []

[[procedure.sequence]]
id = "write-each-slice"
title = "Write each slice"
kind = "for-each"
sequence = "sequence:write-each-slice-body"
over = "slot:slice-plan"
item = "slot:write-each-slice-item"
max-items = 8
