id = "plan"
schema-version = "0.5"
version = "0.5.0"
name = "Plan"
description = "Turn described work into board-ready TaskDocument TOML task files in .internal/tasks/ — duration-targeted tasks (default 10-15 minutes) shaped as the work demands — bare tasks or charters with children — with typed relations, the format the board dispatch machinery actually resolves."
variant = "default"

[metadata]
tag = [
    "task",
    "plan",
    "bootstrap",
    "planning",
]

[[intent.focus]]
id = "specific"

[[intent.focus]]
id = "correctness"

[[intent.avoid]]
id = "speculative-claim"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "duration"
direction = "input"
schema = "schema:text"
optional = true
description = 'Target duration of one child task, e.g. "10-15 minutes" or "~45m". Slicing and review both judge tasks against this.'
title = "Task Duration Target"

[port.default]
value = "10-15 minutes"

[[port]]
id = "final-keys"
direction = "output"
schema = "schema:text"
description = """The renumber step's "KEY<n> -> NNNN" mapping — the real board keys the written files ended up under."""
title = "Final Board Keys"
value = "slot:key-map"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = "The work you describe, in your own words — rough is fine. May reference a source document (a research report, an MVP plan) by repo-relative path."

[[port]]
id = "written-files"
direction = "output"
schema = "[schema:write-receipt]"
description = "Per-slice receipts naming every task file written under .internal/tasks/ — symbolic paths as written; the key map translates them to final board keys."
title = "Written Task Files"
value = "slot:receipts"

[[slot]]
id = "board-check"
schema = "schema:board-untouched"
description = "The pre-write board guard's verdict: detection that no earlier step wrote to the board."

[[slot]]
id = "board-snapshot"
schema = "schema:text"
description = "Deterministic checksum of the board listing at run start — the reference the pre-write guard compares against, so a frame that writes task files before the write phase fails the run instead of merging out-of-plan files."

[[slot]]
id = "done-criteria"
schema = "[schema:text]"
description = "The source's explicit definition-of-done items, empty when it states none."

[[slot]]
id = "grounding"
schema = "schema:text"
description = "Codebase grounding for the described work: the affected modules or areas, applicable invariants, rules, and constraints, and the repo's existing validation gates (exact commands) the task files must honor."
hint = "Grounded scope-level context: affected modules or areas, existing build/test/lint gates (exact invocations), architectural invariants, dependency rules, and constraints an implementer and reviewer must honor. Context the tasks carry, not a step-by-step plan; defer exact files, symbols, signatures, edits, and edit sequencing to architect."

[[slot]]
id = "key-map"
schema = "schema:text"
description = """The renumber step's mapping, one "KEY<n> -> NNNN" line per assigned key — derived mechanically from the live board at the end of the run, never agent arithmetic."""

[[slot]]
id = "raised-date"
schema = "schema:text"
description = "Today's date (YYYY-MM-DD), derived by a command step — the Raised stamp every written task carries."

[[slot]]
id = "receipts"
schema = "[schema:write-receipt]"
description = "One write receipt appended per slice frame (or produced whole by a single-frame variant)."

[[slot]]
id = "slice-plan"
schema = "[schema:plan-slice]"
description = "The typed plan: symbolic-keyed slices — bare tasks or charters with children; real board numbers are assigned by the final renumber step."

[[slot]]
id = "work-items"
schema = "[schema:work-item]"
description = "The source's own units of demanded work — coverage is judged against these, not the slice plan."

[[slot]]
id = "write-each-slice-item"
schema = "schema:plan-slice"
description = "Per-item value for the write-each-slice loop."

[[schema]]
id = "board-untouched"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv that decided it."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True when the board listing still matches the run-start snapshot at the write boundary."

[[schema]]
id = "plan-slice"
description = "One dependency-ordered slice of the plan: a standalone bare task (empty tasks), or a parent charter key plus its child tasks when a genuine umbrella exists."

[schema.fields.covers]
schema = "[schema:text]"
required = true
description = "work-item ids this slice is responsible for. Every extracted work item must appear in at least one slice's covers."

[schema.fields.key]
schema = "schema:text"
required = true
description = 'Symbolic key of the slice: "KEY1", "KEY2", ... in plan order. The final renumber step assigns the real board number.'

[schema.fields.tasks]
schema = "[schema:plan-task]"
required = true
description = """The slice's child tasks in dependency order, keys "KEY<n>.1", "KEY<n>.2", ... continuing ".10", ".11" beyond nine — EMPTY when the slice is one standalone bare task rather than a charter."""

[schema.fields.title]
schema = "schema:text"
required = true
description = "The slice's goal, as a short title."

[[schema]]
id = "plan-task"
description = "One child task in a slice's plan — the index entry; the full TaskDocument body is composed by the slice's own frame."

[schema.fields.depends-on]
schema = "[schema:text]"
required = true
description = "Keys of earlier tasks this one needs completed first; empty when independent."

[schema.fields.key]
schema = "schema:text"
required = true
description = """Symbolic key: the parent slice's KEY<n> plus a child ordinal, e.g. "KEY2.3" or "KEY2.11" — ordinals continue past 9, never zero-padded. Real board numbers are assigned by the final renumber step, never here."""

[schema.fields.summary]
schema = "schema:text"
required = true
description = "One-paragraph account of the task's work, sized to the run's duration target (default: roughly 10-15 minutes) of focused agent effort."

[schema.fields.title]
schema = "schema:text"
required = true
description = "Short imperative title."

[[schema]]
id = "work-item"
description = "One unit of demanded work, extracted from the source document (or distilled from the described task when no document is referenced). Coverage is judged against these."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this work item, unique within the plan."

[schema.fields.requirement]
schema = "schema:text"
required = true
description = "What the source demands this item deliver or establish."

[schema.fields.title]
schema = "schema:text"
required = true
description = "The work item's short name, in the source's own words where a source document exists."

[[schema]]
id = "write-receipt"
description = "One slice frame's account of the task files it wrote to the board."

[schema.fields.files]
schema = "[schema:text]"
required = true
description = "Repo-relative paths of every task file this slice's frame wrote."

[schema.fields.slice-key]
schema = "schema:text"
required = true
description = "The slice charter's key."

[[agent]]
id = "smart-1"
description = "Strong model: extracts the source contract, grounds the work in the codebase, plans the slices, and writes each slice's task files in its own frame."
summary = "Contract + grounding + planning + composition role."

[prompt.ingest]
text = """
Read the source of the described work: {port:task}. When it references a document (a research report, an MVP plan, a spec) by path, read that document from the repository; otherwise the description itself is the source.
Extract two things, faithful to the source's own words — never your preferred framing:
1. Its work items: every unit of work the source demands (an MVP slice, an enumerated deliverable, a named milestone), each with the source's own requirement for it. When the source does not enumerate, distill 2-8 items from its prose.
2. Its explicit definition-of-done items (a stop condition, acceptance criteria), empty when it states none.
Do not implement anything, do not plan yet, and write nothing to disk in this step — not task files, not notes. A later step writes the board from the reviewed plan; any file created here is out-of-plan and will not be adopted."""
input = ["port:task"]
output = [
    "slot:work-items",
    "slot:done-criteria",
]

[prompt.refine-task]
text = """
Task is described as: {port:task}, ground it in the codebase & refine it.
Read the relevant parts of the repository with your tools:
    - identify the affected modules or areas the task touches
    - the build/test/lint commands (the repo's validation gates, with exact invocations)
    - architectural invariants, requirements, and constraints
    - dependencies or rules that need to be respected
Produce the grounding notes:
    - short project/context overview,
    - rules and invariants an implementer and reviewer must honor,
    - validation gates (exact commands)
    - constraints specific to this task.
This is the scope-level context the task files carry, not the step-by-step plan. Defer execution-level decisions to architect: do not solicit or prescribe exact files, symbols, signatures, edits, or edit sequencing.
Do not implement anything, and write nothing to disk in this step — not task files, not notes. A later step writes the board from the reviewed plan; any file created here is out-of-plan and will not be adopted."""
input = ["port:task"]
output = ["slot:grounding"]

[prompt.split]
text = """
Break the described work into dependency-ordered slices with child tasks, as the typed plan.
The work, as described: {port:task}
The source's work items: {slot:work-items}
The source's done criteria: {slot:done-criteria}
Grounding notes: {slot:grounding}
Describe every slice and child as a dependency-ordered outcome at module/area and validation-gate scope. Include applicable constraints from the grounding notes, but defer exact symbols, signatures, edits, and edit sequencing to architect.
SHAPE FOLLOWS THE WORK — three equal shapes, none preferred: a slice with an EMPTY tasks list is one standalone bare task on the board; several such slices are several independent peer tasks; a slice with children becomes a charter. A charter is legal only when a genuine umbrella exists — a shared stop condition no single child owns. Never split into children as packaging: one coherent piece of work is ONE task.
Keys are symbolic: the first slice is "KEY1", the next "KEY2", and so on; children are "KEY1.1", "KEY1.2", ... in dependency order (ordinals continue ".10", ".11", ... — never zero-padded). Never invent numeric board keys — a final mechanical step assigns real numbers from the live board.
Plan at most eight slices — consolidate related work items into one slice rather than exceeding the cap. Every work item MUST appear in at least one slice's covers; a slice may own several related items. Size every task SYMMETRICALLY to roughly {port:duration} of focused agent work: split anything materially larger, merge anything materially smaller into a sibling, and never plan a task whose whole body is running gates, tests, or checks — gates ride the [[checks]] of the task that changed the code. Before returning, judge the implied total (task count times {port:duration}) against the described work: cover every work item with the FEWEST tasks that stay within the target. Order slices and children so each depends only on earlier keys, and record real dependencies explicitly in each task's depends-on.
Do not implement anything, and write nothing to disk in this step — not task files, not notes; return only the plan. A later step writes the board from it; any file created here is out-of-plan and will not be adopted."""
input = [
    "port:task",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
    "port:duration",
]
output = ["slot:slice-plan"]

[prompt.write-the-slice]
text = '''
Write exactly one slice of the plan to the board — {slot:write-each-slice-item} — as TaskDocument TOML files in .internal/tasks/ (create the directory if missing). Do not write any other slice's files; other slices run in their own frames.
            Write each task as one TaskDocument TOML file in .internal/tasks/, named <key>-<kebab-slug-of-title>.toml, in exactly this shape:

    schema-version = "0.2"
    key = "<KEY1 or KEY1.2 — symbolic, see the key rule below>"
    title = "<short imperative title>"
    status = "draft"
    raised = "<YYYY-MM-DD>"
    content = """
    What this task is and why it exists — grounded, concrete, standalone.
    """
    scope = """
    ## Decisions
    The rulings made; what is in scope and what is explicitly out.
    """
    validation = """
    ## Watch
    Hazards and constraints an implementer must not trip.
    ## Done when
    The observable, verifiable condition proving the task is complete.
    """
    [relations]
    parent = "<NNNN>"
    depends-on = ["<key>", "<key>"]

    [[checks]]
    name = "<what this verifies>"
    command = "<repo-relative shell command>"
    # optional: timeout-ms = <n>, expect = "<regex the combined output must match>"

Rules:
- SHAPE FOLLOWS THE WORK — three equal shapes, none preferred: a single bare task; several independent bare tasks with no parent; a charter with children. A charter is legal only when a genuine umbrella exists — a shared stop condition no single child owns. Never introduce a charter as packaging: grouping alone is a defect, not an umbrella.
- Keys are SYMBOLIC everywhere — file names, key fields, parent, depends-on, and prose alike: parents (or standalone tasks) are "KEY1", "KEY2", ... in plan order; children are "KEY1.1", "KEY1.2", .... Never write a numeric board key anywhere; a final mechanical step assigns real numbers from the live board and rewrites every occurrence, so symbolic files can never collide with existing tasks.
- A parent charter task uses a bare "KEY<n>" key and holds the goal, the work items it covers, and the stop condition; its Done when is "every child task is closed and the stop condition holds". A charter has no [relations].parent (it may still declare depends-on toward earlier charters or bare tasks).
- Child tasks are keyed "KEY<n>.1", "KEY<n>.2", ... in dependency order; every child sets [relations].parent to its charter's key, and names any prerequisite task explicitly in depends-on — a child may depend only on tasks with earlier keys. Ordinals are plain integers with no upper bound — ".10", ".11", ... — never zero-padded; "earlier keys" means numeric ordinal order (.10 is later than .9, KEY1 is earlier than KEY2).
- Size SYMMETRICALLY to the run's requested duration target (default: roughly 10-15 minutes of focused agent work): split anything materially larger into more tasks, and merge anything materially smaller into a sibling. Never write a task whose body is only running gates, tests, or checks — gates belong in the [[checks]] of the task that changed the code, never as sibling tasks.
- Judge the implied total — task count times the duration target — against the described work before writing: a plan whose total is disproportionate to what was asked is wrong even when every task is well-formed. Cover the work with the FEWEST tasks that stay within the duration target.
- Fold the scope-level grounding each task needs — affected modules or areas, applicable invariants and constraints, and existing validation gates with exact commands — into that task's own content/scope/validation, so every file stands alone. Defer execution-level decisions to architect: never prescribe exact symbols, signatures, edits, or edit sequencing.
- Omit [relations] entirely when a task has neither parent nor dependencies; never emit empty tables or empty arrays.
- When a child's Done-when is mechanically checkable — a named test invocation, build gate, or grep for an artifact with a definite exit verdict — derive one [[checks]] entry per such criterion. The command must exist in the repo today, be repo-root-relative, and carry its whole verdict in the exit code; harden it with expect when needed — a check must pass on exit 0 AND a matching expect regex, so a test-filter command should declare expect to guard against passing by matching nothing.
- Never fabricate a check: if no existing command verifies the Done-when, or verification is judgment-based, declare no checks — a wrong check that passes is worse than none; check-less tasks fall to the configured [tasks] auto-close policy.
- At most a few checks per task (core hard-caps at 8; exceeding the cap makes the whole set un-runnable); the default timeout is 120s, so declare timeout-ms for any gate that runs slower than that.
- Checks run later via "sh -c" in a clean detached worktree of the merged sha — no absolute paths, no state from this run, no interactive commands.
- Never modify an existing task file; symbolic keys exist so new files cannot collide with the board, and the renumber step never touches a file without a KEY-prefixed name.
            When the slice's tasks list is EMPTY, write exactly one standalone bare task file under the slice's key — no charter language, no children. Otherwise write the charter task first (the slice's key), then every child task from the slice's own plan, keeping each child's key, title, and depends-on exactly as planned. Keys stay symbolic (KEY-prefixed) in file names and contents alike — the renumber step assigns real numbers at the end of the run. Stamp raised = {slot:raised-date} in every file. Ground each task's content/scope/validation in the work items {slot:work-items}, the done criteria {slot:done-criteria}, and the grounding notes {slot:grounding} — fold in the affected modules or areas, applicable constraints, and existing validation gates that task needs so it stands alone. Defer execution-level decisions to architect; never prescribe exact symbols, signatures, edits, or edit sequencing. Derive each task's [[checks]] from its done criteria per the doctrine, sourcing commands from the grounding notes' validation gates.
            Do not implement anything. Return the receipt: the slice's key and the repo-relative path of every file you wrote.'''
input = [
    "slot:write-each-slice-item",
    "slot:raised-date",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
]
output = ["slot:receipts"]

[[sequence.ctx-branch-arm-p-21-premature-board-write-then.sequence]]
id = "premature-board-write-exit"
title = "Premature board write"
kind = "terminal"
outcome = "error"
message = "an early step wrote to .internal/tasks before the write phase; ingest/refine/split must leave the board untouched, so the run fails rather than adopting out-of-plan files"

[[sequence.planning-body.sequence]]
id = "split"
title = "Split the work into slices"
agent = "agent:smart-1"
prompt = "prompt:split"
input = [
    "port:task",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
    "port:duration",
    { slot = "slot:slice-plan", optional = true },
]
output = ["slot:slice-plan"]

[[sequence.write-each-slice-body.sequence]]
id = "write-the-slice"
title = "Write the slice"
agent = "agent:smart-1"
prompt = "prompt:write-the-slice"
input = [
    "slot:write-each-slice-item",
    "slot:raised-date",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
]

[[sequence.write-each-slice-body.sequence.output]]
slot = "slot:receipts"
operation = "append"

[procedure]
description = "Extract the source's work items and done criteria, ground the work in the codebase, split it into a symbolic-keyed typed slice plan shaped as the work demands, write each slice's TaskDocument TOML files in its own frame, and assign final board keys mechanically from the live board."
input = [
    "port:duration",
    "port:task",
]
output = [
    "port:final-keys",
    "port:written-files",
]

[[procedure.sequence]]
id = "board-snapshot"
title = "Snapshot the board"
output = ["slot:board-snapshot"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "ls .internal/tasks .internal/tasks/archived 2>/dev/null | sort | cksum",
]

[[procedure.sequence]]
id = "raised-date"
title = "Derive raised date"
output = ["slot:raised-date"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "date +%Y-%m-%d",
]

[[procedure.sequence]]
id = "ingest"
title = "Ingest the work source"
agent = "agent:smart-1"
prompt = "prompt:ingest"
input = ["port:task"]
output = [
    "slot:work-items",
    "slot:done-criteria",
]

[[procedure.sequence]]
id = "refine-task"
title = "Ground & refine the task in the codebase"
agent = "agent:smart-1"
prompt = "prompt:refine-task"
input = ["port:task"]
output = ["slot:grounding"]

[[procedure.sequence]]
id = "planning"
title = "Planning"
kind = "loop"
sequence = "sequence:planning-body"
max-iterations = 3
on-exhausted = "abort"

[[procedure.sequence.until.any]]
equals = 1
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 2
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 3
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 4
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 5
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 6
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 7
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 8
count = "slot:slice-plan"

[[procedure.sequence]]
id = "board-untouched"
title = "Board untouched before write"
kind = "check"
input = ["slot:board-snapshot"]
output = ["slot:board-check"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'ls .internal/tasks .internal/tasks/archived 2>/dev/null | sort | cksum | grep -qxF -- "$1"',
    "_",
    "{slot:board-snapshot}",
]

[[procedure.sequence]]
id = "premature-board-write"
title = "Premature board write"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-premature-board-write-then"

[procedure.sequence.when]
slot = "slot:board-check"
field = "ok"
equals = false

[[procedure.sequence]]
id = "seed-receipts"
title = "Seed the receipts"
kind = "project"
output = ["slot:receipts"]

[[procedure.sequence.projection]]
destination = "slot:receipts"

[procedure.sequence.projection.source]
literal = []

[[procedure.sequence]]
id = "write-each-slice"
title = "Write each slice"
kind = "for-each"
sequence = "sequence:write-each-slice-body"
over = "slot:slice-plan"
item = "slot:write-each-slice-item"
max-items = 8

[[procedure.sequence]]
id = "assign-keys"
title = "Assign final board keys"
output = ["slot:key-map"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    '''
set -eu
git worktree list --porcelain 2>/dev/null | awk '/^worktree /{sub(/^worktree /,"");print;exit}' | {
  IFS= read -r main || main=.
  [ -n "$main" ] || main=.
  { ls "$main/.internal/tasks" "$main/.internal/tasks/archived" .internal/tasks .internal/tasks/archived 2>/dev/null; echo __LOCAL__; ls .internal/tasks 2>/dev/null; } | awk -F'[.-]' '
    $0 == "__LOCAL__" { in_local=1; next }
    { n=$1+0; if (n>m) m=n }
    in_local && /^KEY[1-8][.-]/ { seen[substr($0,4,1)]=1 }
    END { k=m; for (i=1;i<=8;i++) if (seen[i]) { k++; printf "%d %04d\n", i, k } }
  ' | {
    map=''
    while read -r i key; do
      map="$map $i:$key"
    done
    [ -n "$map" ] || { echo "no symbolic KEY task files found on the board" >&2; exit 1; }
    for pair in $map; do
      i=${pair%%:*}
      key=${pair#*:}
      for f in .internal/tasks/KEY*.toml; do
        [ -e "$f" ] || continue
        sed "s/KEY$i/$key/g" "$f" > "$f.tmp" && mv "$f.tmp" "$f"
      done
    done
    for pair in $map; do
      i=${pair%%:*}
      key=${pair#*:}
      for f in .internal/tasks/KEY$i-*.toml .internal/tasks/KEY$i.*.toml; do
        [ -e "$f" ] || continue
        rest=${f#.internal/tasks/KEY$i}
        mv "$f" ".internal/tasks/$key$rest"
      done
      echo "KEY$i -> $key"
    done
  }
}''',
]
