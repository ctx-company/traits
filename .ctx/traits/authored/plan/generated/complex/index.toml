id = "plan"
schema-version = "0.4"
version = "0.5.0"
name = "Plan (Complex)"
description = "Turn described work into board-ready TaskDocument TOML task files, then grind an independent-reviewer verdict loop over the written board until approved — coverage, sizing, dependencies, and format all blockable."
variant = "complex"

[metadata]
tag = [
    "task",
    "plan",
    "bootstrap",
    "planning",
    "review",
]

[[intent.focus]]
id = "specific"

[[intent.focus]]
id = "correctness"

[[intent.avoid]]
id = "speculative-claim"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = "The work you describe, in your own words — rough is fine. May reference a source document (a research report, an MVP plan) by repo-relative path."

[[port]]
id = "written-files"
direction = "output"
schema = "[schema:write-receipt]"
description = "Per-slice receipts naming every task file written under .internal/tasks/."
title = "Written Task Files"
format = [
    "structured",
    "table",
]
value = "slot:receipts"

[[slot]]
id = "board-check"
schema = "schema:board-untouched"
description = "The pre-write board guard's verdict: detection that no earlier step wrote to the board."

[[slot]]
id = "board-snapshot"
schema = "schema:text"
description = "Deterministic checksum of the board listing at run start — the reference the pre-write guard compares against, so a frame that writes task files before the write phase fails the run instead of merging out-of-plan files."

[[slot]]
id = "done-criteria"
schema = "[schema:text]"
description = "The source's explicit definition-of-done items, empty when it states none."

[[slot]]
id = "grounding"
schema = "schema:text"
description = "Codebase grounding for the described work: the concrete files and modules it touches, the repo's validation gates (exact commands), and the invariants, rules, and constraints the task files must honor."
hint = "Grounded in the codebase: what the project is, its build/test/lint gates (exact invocations), architectural invariants, dependency rules, and constraints an implementer and reviewer must honor. Context the tasks carry, not the step-by-step plan."

[[slot]]
id = "next-key"
schema = "schema:text"
description = "Deterministic zero-padded next free board key, derived by a command step scanning .internal/tasks/ (archived/ included) — never agent arithmetic against the directory."

[[slot]]
id = "raised-date"
schema = "schema:text"
description = "Today's date (YYYY-MM-DD), derived by a command step — the Raised stamp every written task carries."

[[slot]]
id = "receipts"
schema = "[schema:write-receipt]"
description = "One write receipt appended per slice frame (or produced whole by a single-frame variant)."

[[slot]]
id = "review-verdict"
schema = "schema:review-verdict"
description = "Independent reviewer's verdict on the written board slice(s)."

[[slot]]
id = "revision-log"
schema = "schema:text"
description = "The revise pass's account of the task files it changed or added, one path per line."

[[slot]]
id = "slice-plan"
schema = "[schema:plan-slice]"
description = "The typed plan: parent charter keys with their child tasks, final keys already assigned from slot:next-key."

[[slot]]
id = "work-items"
schema = "[schema:work-item]"
description = "The source's own units of demanded work — coverage is judged against these, not the slice plan."

[[slot]]
id = "write-each-slice-item"
schema = "schema:plan-slice"
description = "Per-item value for the write-each-slice loop."

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open" or "done". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "board-untouched"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv that decided it."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True when the board listing still matches the run-start snapshot at the write boundary."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "plan-slice"
description = "One dependency-ordered slice of the plan: a parent charter key plus its child tasks."

[schema.fields.covers]
schema = "[schema:text]"
required = true
description = "work-item ids this slice is responsible for. Every extracted work item must appear in at least one slice's covers."

[schema.fields.key]
schema = "schema:text"
required = true
description = "Final board key of the slice's parent charter task: bare zero-padded NNNN."

[schema.fields.tasks]
schema = "[schema:plan-task]"
required = true
description = """The slice's child tasks in dependency order, keys "NNNN.1", "NNNN.2", ..."""

[schema.fields.title]
schema = "schema:text"
required = true
description = "The slice's goal, as a short title."

[[schema]]
id = "plan-task"
description = "One child task in a slice's plan — the index entry; the full TaskDocument body is composed by the slice's own frame."

[schema.fields.depends-on]
schema = "[schema:text]"
required = true
description = "Keys of earlier tasks this one needs completed first; empty when independent."

[schema.fields.key]
schema = "schema:text"
required = true
description = """Final board key: the parent slice's NNNN plus a child ordinal, e.g. "0150.2"."""

[schema.fields.summary]
schema = "schema:text"
required = true
description = "One-paragraph account of the task's work, sized to roughly 10-15 minutes of focused agent effort."

[schema.fields.title]
schema = "schema:text"
required = true
description = "Short imperative title."

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if a blocking defect remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Non-empty when status is revise; an empty list (never omitted — always return the key) when approved. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the task's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise only when at least one blocking defect remains. Set to approved if and only if blockers is empty."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "work-item"
description = "One unit of demanded work, extracted from the source document (or distilled from the described task when no document is referenced). Coverage is judged against these."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this work item, unique within the plan."

[schema.fields.requirement]
schema = "schema:text"
required = true
description = "What the source demands this item deliver or establish."

[schema.fields.title]
schema = "schema:text"
required = true
description = "The work item's short name, in the source's own words where a source document exists."

[[schema]]
id = "write-receipt"
description = "One slice frame's account of the task files it wrote to the board."

[schema.fields.files]
schema = "[schema:text]"
required = true
description = "Repo-relative paths of every task file this slice's frame wrote."

[schema.fields.slice-key]
schema = "schema:text"
required = true
description = "The slice charter's key."

[[agent]]
id = "smart-1"
description = "Strong model: extracts the source contract, grounds the work in the codebase, plans the slices, writes each slice's task files, and applies review fixes."
summary = "Contract + grounding + planning + composition + revision role."

[[agent]]
id = "smart-2"
description = "Independent strong model: reviews the written board each round, separately from smart-1."
summary = "Independent review role."

[prompt.ingest]
text = """

            Read the source of the described work: {port:task}. When it references a document (a research report, an MVP plan, a spec) by path, read that document from the repository; otherwise the description itself is the source.
            Extract two things, faithful to the source's own words — never your preferred framing:
            1. Its work items: every unit of work the source demands (an MVP slice, an enumerated deliverable, a named milestone), each with the source's own requirement for it. When the source does not enumerate, distill 2-8 items from its prose.
            2. Its explicit definition-of-done items (a stop condition, acceptance criteria), empty when it states none.
            Do not implement anything, do not plan yet, and write nothing to disk in this step — not task files, not notes. A later step writes the board from the reviewed plan; any file created here is out-of-plan and will not be adopted."""
input = ["port:task"]
output = [
    "slot:work-items",
    "slot:done-criteria",
]

[prompt.refine-task]
text = """

            Task is described as: {port:task}, ground it in the codebase & refine it.
            Read the relevant parts of the repository with your tools:
                - identify the concrete files, modules, and patterns the task touches
                - the build/test/lint commands (the repo's validation gates, with exact invocations)
                - architectural invariants and requirements
                - dependencies or rules that need to be respected
            Produce the grounding notes:
                - short project/context overview,
                - rules and invariants an implementer and reviewer must honor,
                - validation gates (exact commands)
                - constraints specific to this task.
            This is the context the task files carry, not the step-by-step plan.
            Do not implement anything, and write nothing to disk in this step — not task files, not notes. A later step writes the board from the reviewed plan; any file created here is out-of-plan and will not be adopted."""
input = ["port:task"]
output = ["slot:grounding"]

[prompt.review-the-board]
text = '''
Independently review the task files written for {port:task} against the plan {slot:slice-plan} and the receipts {slot:receipts} — read every written file yourself with your tools; do not trust the receipts alone.
            The format contract every file must satisfy: Write each task as one TaskDocument TOML file in .internal/tasks/, named <key>-<kebab-slug-of-title>.toml, in exactly this shape:

    schema-version = "0.2"
    key = "<NNNN or NNNN.X>"
    title = "<short imperative title>"
    status = "ready"
    raised = "<YYYY-MM-DD>"
    content = """
    What this task is and why it exists — grounded, concrete, standalone.
    """
    scope = """
    ## Decisions
    The rulings made; what is in scope and what is explicitly out.
    """
    validation = """
    ## Watch
    Hazards and constraints an implementer must not trip.
    ## Done when
    The observable, verifiable condition proving the task is complete.
    """
    [relations]
    parent = "<NNNN>"
    depends-on = ["<key>", "<key>"]

    [[checks]]
    name = "<what this verifies>"
    command = "<repo-relative shell command>"
    # optional: timeout-ms = <n>, expect = "<regex the combined output must match>"

Rules:
- A parent charter task uses a bare "NNNN" key and holds the slice's goal, the work items it covers, and the slice's stop condition; its Done when is "every child task is closed and the stop condition holds". A charter has no [relations].parent (it may still declare depends-on toward earlier slices' charters).
- Child tasks are keyed "NNNN.1", "NNNN.2", ... in dependency order; every child sets [relations].parent to its charter's key, and names any prerequisite task explicitly in depends-on — a child may depend only on tasks with earlier keys.
- Size every child task to roughly 10-15 minutes of focused agent work — small enough to finish in one short pass; split anything larger into more children.
- Fold the grounding each task needs — its concrete files, validation gates with exact commands, invariants, constraints — into that task's own content/scope/validation, so every file stands alone.
- Omit [relations] entirely when a task has neither parent nor dependencies; never emit empty tables or empty arrays.
- When a child's Done-when is mechanically checkable — a named test invocation, build gate, or grep for an artifact with a definite exit verdict — derive one [[checks]] entry per such criterion. The command must exist in the repo today, be repo-root-relative, and carry its whole verdict in the exit code; harden it with expect when needed — a check must pass on exit 0 AND a matching expect regex, so a test-filter command should declare expect to guard against passing by matching nothing.
- Never fabricate a check: if no existing command verifies the Done-when, or verification is judgment-based, declare no checks — a wrong check that passes is worse than none; check-less tasks fall to the configured [tasks] auto-close policy.
- At most a few checks per task (core hard-caps at 8; exceeding the cap makes the whole set un-runnable); the default timeout is 120s, so declare timeout-ms for any gate that runs slower than that.
- Checks run later via "sh -c" in a clean detached worktree of the merged sha — no absolute paths, no state from this run, no interactive commands.
- Never overwrite or renumber an existing file; keys are assigned once from the derived next-free key and are final.
            A BLOCKER is: a file that fails the format contract (not parseable TaskDocument TOML, wrong key/name shape, missing status/raised); a planned task with no file, or a file outside the plan; a work item in {slot:work-items} no written task covers; an unmet or unrepresented entry of {slot:done-criteria}; a child task materially larger than 10-15 minutes of focused work, or with a vague, unverifiable Done when; a dependency error (depends-on naming a later or missing key, a child without its parent relation); grounding a task needs that its own body omits or contradicts; a mechanically verifiable Done when with no corresponding [[checks]] entry; or a declared check whose command does not exist in the repository or does not actually verify its Done when. Everything else is advisory.
            Your own verdict from last round is attached when one exists: carry every open blocker forward verbatim, verify with your own tools, and flip to done only on confirmed evidence.
            Set status to revise while any blocker remains, approved when none do.'''
input = [
    "port:task",
    "slot:slice-plan",
    "slot:receipts",
    "slot:work-items",
    "slot:done-criteria",
]
output = ["slot:review-verdict"]

[prompt.revise-the-board]
text = '''
Apply the review verdict {slot:review-verdict} to the written task files, in one bounded pass — fix every blocker it names, change nothing it does not name, and keep every key stable (fixing a dependency edge or splitting an oversized child appends new ".N" keys, never renumbers existing ones).
            Format contract: Write each task as one TaskDocument TOML file in .internal/tasks/, named <key>-<kebab-slug-of-title>.toml, in exactly this shape:

    schema-version = "0.2"
    key = "<NNNN or NNNN.X>"
    title = "<short imperative title>"
    status = "ready"
    raised = "<YYYY-MM-DD>"
    content = """
    What this task is and why it exists — grounded, concrete, standalone.
    """
    scope = """
    ## Decisions
    The rulings made; what is in scope and what is explicitly out.
    """
    validation = """
    ## Watch
    Hazards and constraints an implementer must not trip.
    ## Done when
    The observable, verifiable condition proving the task is complete.
    """
    [relations]
    parent = "<NNNN>"
    depends-on = ["<key>", "<key>"]

    [[checks]]
    name = "<what this verifies>"
    command = "<repo-relative shell command>"
    # optional: timeout-ms = <n>, expect = "<regex the combined output must match>"

Rules:
- A parent charter task uses a bare "NNNN" key and holds the slice's goal, the work items it covers, and the slice's stop condition; its Done when is "every child task is closed and the stop condition holds". A charter has no [relations].parent (it may still declare depends-on toward earlier slices' charters).
- Child tasks are keyed "NNNN.1", "NNNN.2", ... in dependency order; every child sets [relations].parent to its charter's key, and names any prerequisite task explicitly in depends-on — a child may depend only on tasks with earlier keys.
- Size every child task to roughly 10-15 minutes of focused agent work — small enough to finish in one short pass; split anything larger into more children.
- Fold the grounding each task needs — its concrete files, validation gates with exact commands, invariants, constraints — into that task's own content/scope/validation, so every file stands alone.
- Omit [relations] entirely when a task has neither parent nor dependencies; never emit empty tables or empty arrays.
- When a child's Done-when is mechanically checkable — a named test invocation, build gate, or grep for an artifact with a definite exit verdict — derive one [[checks]] entry per such criterion. The command must exist in the repo today, be repo-root-relative, and carry its whole verdict in the exit code; harden it with expect when needed — a check must pass on exit 0 AND a matching expect regex, so a test-filter command should declare expect to guard against passing by matching nothing.
- Never fabricate a check: if no existing command verifies the Done-when, or verification is judgment-based, declare no checks — a wrong check that passes is worse than none; check-less tasks fall to the configured [tasks] auto-close policy.
- At most a few checks per task (core hard-caps at 8; exceeding the cap makes the whole set un-runnable); the default timeout is 120s, so declare timeout-ms for any gate that runs slower than that.
- Checks run later via "sh -c" in a clean detached worktree of the merged sha — no absolute paths, no state from this run, no interactive commands.
- Never overwrite or renumber an existing file; keys are assigned once from the derived next-free key and are final.
            Do not implement anything. Return one line per file you changed or added, naming its path.'''
input = ["slot:review-verdict"]
output = ["slot:revision-log"]

[prompt.split]
text = """

            Break the described work into dependency-ordered slices with child tasks, as the typed plan.
            The work, as described: {port:task}
            The source's work items: {slot:work-items}
            The source's done criteria: {slot:done-criteria}
            Grounding notes: {slot:grounding}
            Assign final board keys now, starting at {slot:next-key}: the first slice's charter takes that key, the next slice the following number, and so on; children are "<charter-key>.1", "<charter-key>.2", ... in dependency order. Keys are final — no placeholders.
            Plan at most eight slices — consolidate related work items into one slice rather than exceeding the cap. Every work item MUST appear in at least one slice's covers; a slice may own several related items. Size every child task to roughly 10-15 minutes of focused agent work; a slice with more than nine children is too big — split the slice. Order slices and children so each depends only on earlier keys, and record real dependencies explicitly in each task's depends-on.
            Do not implement anything, and write nothing to disk in this step — not task files, not notes; return only the plan. A later step writes the board from it; any file created here is out-of-plan and will not be adopted."""
input = [
    "port:task",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
    "slot:next-key",
]
output = ["slot:slice-plan"]

[prompt.write-the-slice]
text = '''
Write exactly one slice of the plan to the board — {slot:write-each-slice-item} — as TaskDocument TOML files in .internal/tasks/ (create the directory if missing). Do not write any other slice's files; other slices run in their own frames.
            Write each task as one TaskDocument TOML file in .internal/tasks/, named <key>-<kebab-slug-of-title>.toml, in exactly this shape:

    schema-version = "0.2"
    key = "<NNNN or NNNN.X>"
    title = "<short imperative title>"
    status = "ready"
    raised = "<YYYY-MM-DD>"
    content = """
    What this task is and why it exists — grounded, concrete, standalone.
    """
    scope = """
    ## Decisions
    The rulings made; what is in scope and what is explicitly out.
    """
    validation = """
    ## Watch
    Hazards and constraints an implementer must not trip.
    ## Done when
    The observable, verifiable condition proving the task is complete.
    """
    [relations]
    parent = "<NNNN>"
    depends-on = ["<key>", "<key>"]

    [[checks]]
    name = "<what this verifies>"
    command = "<repo-relative shell command>"
    # optional: timeout-ms = <n>, expect = "<regex the combined output must match>"

Rules:
- A parent charter task uses a bare "NNNN" key and holds the slice's goal, the work items it covers, and the slice's stop condition; its Done when is "every child task is closed and the stop condition holds". A charter has no [relations].parent (it may still declare depends-on toward earlier slices' charters).
- Child tasks are keyed "NNNN.1", "NNNN.2", ... in dependency order; every child sets [relations].parent to its charter's key, and names any prerequisite task explicitly in depends-on — a child may depend only on tasks with earlier keys.
- Size every child task to roughly 10-15 minutes of focused agent work — small enough to finish in one short pass; split anything larger into more children.
- Fold the grounding each task needs — its concrete files, validation gates with exact commands, invariants, constraints — into that task's own content/scope/validation, so every file stands alone.
- Omit [relations] entirely when a task has neither parent nor dependencies; never emit empty tables or empty arrays.
- When a child's Done-when is mechanically checkable — a named test invocation, build gate, or grep for an artifact with a definite exit verdict — derive one [[checks]] entry per such criterion. The command must exist in the repo today, be repo-root-relative, and carry its whole verdict in the exit code; harden it with expect when needed — a check must pass on exit 0 AND a matching expect regex, so a test-filter command should declare expect to guard against passing by matching nothing.
- Never fabricate a check: if no existing command verifies the Done-when, or verification is judgment-based, declare no checks — a wrong check that passes is worse than none; check-less tasks fall to the configured [tasks] auto-close policy.
- At most a few checks per task (core hard-caps at 8; exceeding the cap makes the whole set un-runnable); the default timeout is 120s, so declare timeout-ms for any gate that runs slower than that.
- Checks run later via "sh -c" in a clean detached worktree of the merged sha — no absolute paths, no state from this run, no interactive commands.
- Never overwrite or renumber an existing file; keys are assigned once from the derived next-free key and are final.
            Write the charter task first (the slice's key), then every child task from the slice's own plan, keeping each child's key, title, and depends-on exactly as planned. Stamp raised = {slot:raised-date} in every file. Ground each task's content/scope/validation in the work items {slot:work-items}, the done criteria {slot:done-criteria}, and the grounding notes {slot:grounding} — fold in what that task needs so it stands alone. Derive each child's [[checks]] from its done criteria per the doctrine, sourcing commands from the grounding notes' validation gates.
            Do not implement anything. Return the receipt: the slice's key and the repo-relative path of every file you wrote.'''
input = [
    "slot:write-each-slice-item",
    "slot:raised-date",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
]
output = ["slot:receipts"]

[[sequence.ctx-branch-arm-p-21-premature-board-write-then.sequence]]
id = "premature-board-write-exit"
title = "Premature board write"
kind = "terminal"
outcome = "error"
message = "an early step wrote to .internal/tasks before the write phase; ingest/refine/split must leave the board untouched, so the run fails rather than adopting out-of-plan files"

[[sequence.ctx-branch-arm-s-14-reviewing-body-16-apply-the-review-then.sequence]]
id = "revise-the-board"
title = "Revise the board"
agent = "agent:smart-1"
prompt = "prompt:revise-the-board"
input = ["slot:review-verdict"]
output = ["slot:revision-log"]

[[sequence.planning-body.sequence]]
id = "split"
title = "Split the work into slices"
agent = "agent:smart-1"
prompt = "prompt:split"
input = [
    "port:task",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
    "slot:next-key",
    { slot = "slot:slice-plan", optional = true },
]
output = ["slot:slice-plan"]

[[sequence.reviewing-body.sequence]]
id = "review-the-board"
title = "Review the board"
agent = "agent:smart-2"
prompt = "prompt:review-the-board"
input = [
    "port:task",
    "slot:slice-plan",
    "slot:receipts",
    "slot:work-items",
    "slot:done-criteria",
    { slot = "slot:review-verdict", optional = true },
]
output = ["slot:review-verdict"]

[[sequence.reviewing-body.sequence]]
id = "apply-the-review"
title = "Apply the review"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-14-reviewing-body-16-apply-the-review-then"

[sequence.reviewing-body.sequence.when]
slot = "slot:review-verdict"
field = "status"
equals = "revise"

[[sequence.write-each-slice-body.sequence]]
id = "write-the-slice"
title = "Write the slice"
agent = "agent:smart-1"
prompt = "prompt:write-the-slice"
input = [
    "slot:write-each-slice-item",
    "slot:raised-date",
    "slot:work-items",
    "slot:done-criteria",
    "slot:grounding",
]

[[sequence.write-each-slice-body.sequence.output]]
slot = "slot:receipts"
operation = "append"

[procedure]
description = "Extract the source's work items and done criteria, ground the work in the codebase, split it into a typed slice plan with final keys, write each slice's TaskDocument TOML files in its own frame, then loop an independent typed-verdict review with composer-applied fixes until approved (exhaustion aborts with its stop reason)."
input = ["port:task"]
output = ["port:written-files"]

[[procedure.sequence]]
id = "board-snapshot"
title = "Snapshot the board"
output = ["slot:board-snapshot"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "ls .internal/tasks .internal/tasks/archived 2>/dev/null | sort | cksum",
]

[[procedure.sequence]]
id = "next-key"
title = "Derive next board key"
output = ["slot:next-key"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    """ls .internal/tasks .internal/tasks/archived 2>/dev/null | awk -F'[.-]' '{n=$1+0; if (n>m) m=n} END {printf "%04d", m+1}'""",
]

[[procedure.sequence]]
id = "raised-date"
title = "Derive raised date"
output = ["slot:raised-date"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    "date +%Y-%m-%d",
]

[[procedure.sequence]]
id = "ingest"
title = "Ingest the work source"
agent = "agent:smart-1"
prompt = "prompt:ingest"
input = ["port:task"]
output = [
    "slot:work-items",
    "slot:done-criteria",
]

[[procedure.sequence]]
id = "refine-task"
title = "Ground & refine the task in the codebase"
agent = "agent:smart-1"
prompt = "prompt:refine-task"
input = ["port:task"]
output = ["slot:grounding"]

[[procedure.sequence]]
id = "planning"
title = "Planning"
kind = "loop"
sequence = "sequence:planning-body"
max-iterations = 3
on-exhausted = "abort"

[[procedure.sequence.until.any]]
equals = 1
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 2
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 3
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 4
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 5
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 6
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 7
count = "slot:slice-plan"

[[procedure.sequence.until.any]]
equals = 8
count = "slot:slice-plan"

[[procedure.sequence]]
id = "board-untouched"
title = "Board untouched before write"
kind = "check"
input = ["slot:board-snapshot"]
output = ["slot:board-check"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'ls .internal/tasks .internal/tasks/archived 2>/dev/null | sort | cksum | grep -qxF -- "$1"',
    "_",
    "{slot:board-snapshot}",
]

[[procedure.sequence]]
id = "premature-board-write"
title = "Premature board write"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-premature-board-write-then"

[procedure.sequence.when]
slot = "slot:board-check"
field = "ok"
equals = false

[[procedure.sequence]]
id = "seed-receipts"
title = "Seed the receipts"
kind = "project"
output = ["slot:receipts"]

[[procedure.sequence.projection]]
destination = "slot:receipts"

[procedure.sequence.projection.source]
literal = []

[[procedure.sequence]]
id = "write-each-slice"
title = "Write each slice"
kind = "for-each"
sequence = "sequence:write-each-slice-body"
over = "slot:slice-plan"
item = "slot:write-each-slice-item"
max-items = 8

[[procedure.sequence]]
id = "reviewing"
title = "Reviewing"
kind = "loop"
sequence = "sequence:reviewing-body"
max-iterations = 4
on-exhausted = "abort"

[procedure.sequence.until]
slot = "slot:review-verdict"
field = "status"
equals = "approved"
