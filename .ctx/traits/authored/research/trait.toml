[package]
id = "research"
version = "0.1.0"
name = "Research"
status = "ready"

[family]
default = "default"

[family.variant]

[family.variant.quick]
path = "generated/quick/index.toml"
aliases = ["research-quick"]

[family.variant.default]
path = "generated/default/index.toml"
aliases = ["research-default"]

[family.variant.deep]
path = "generated/deep/index.toml"
aliases = ["research-deep"]

[publish]
name = "@ctx-traits/research"
access = "public"

[budget]
max-frames = 60
frame-seconds = 1800
total-seconds = 14400
max-retries = 3
idle-seconds = 900

[defaults.port]
output-dir = ".internal/research"

[variant.quick.budget]
frame-seconds = 1800
total-seconds = 7200
idle-seconds = 600

[variant.deep.budget]
frame-seconds = 1800
total-seconds = 28800
idle-seconds = 900
