id = "research"
schema-version = "0.4"
version = "0.1.0"
name = "Research (Default)"
description = "Surveyed dogfood research procedure: plan a cardinality-gated set of non-overlapping streams, research each serially, triangulate, then a bounded reviewer loop — then commit."
summary = "Surveyed dogfood research procedure: plan a cardinality-gated set of non-overlapping streams, research each serially, triangulate, then a bounded reviewer loop — then commit."
variant = "default"

[metadata]
tag = ["dogfood", "research", "review", "multi-agent"]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "review-before-final"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "scope-creep"

[[intent.avoid]]
id = "unbounded-loop"

[[intent.avoid]]
id = "rubber-stamp-review"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Final commit evidence from the git commit command step. Absent when the clean-tree gate skipped the commit tail entirely."
value = "slot:commit-output"

[[port]]
id = "output-dir"
direction = "input"
schema = "schema:text"
optional = true
description = 'Repo-relative root directory research output is written under. Package-defaulted to ".internal/research" via [defaults.port] in runtime.toml; consuming repos override it in their own config.'

[[port]]
id = "park-report"
direction = "output"
schema = "[schema:review-verdict]"
optional = true
description = "Typed park record for an unapproved run: one entry per reviewed verdict still revise in the final round. Present only when the build loop exhausted without approval — the run parks and no commit is created."
title = "Park Report"
format = ["structured", "table"]
value = "slot:park-report"

[[port]]
id = "report-path"
direction = "output"
schema = "schema:text"
optional = true
description = "Repo-relative path to this run's primary deliverable, copied from slot:report-path."
title = "Report Path"
value = "slot:report-path"

[[port]]
id = "research-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Final work summary for the completed research: what was written, how citations were verified, open concerns."
title = "Research Report"
format = ["markdown"]
value = "slot:work-summary"

[[port]]
id = "topic"
direction = "input"
schema = "schema:text"
description = "The research topic or question to investigate."

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "findings"
schema = "[schema:stream-finding]"
description = "Cited findings accumulated one entry per completed research stream."

[[slot]]
id = "park-report"
schema = "[schema:review-verdict]"
description = "This round's typed park record: empty when every verdict reviewed this round is approved; one entry per reviewed verdict that is revise, each copied unchanged. Written each round by deriveParkReportStep, never model-authored."

[[slot]]
id = "report-path"
schema = "schema:text"
description = "Deterministic repo-relative path to this variant's primary deliverable, derived by a command step from port:output-dir and topic-slug."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "First reviewer's verdict for the current research state."

[[slot]]
id = "shipping-message"
schema = "schema:text"
description = "The commit message the scribe writes for the completed work."

[[slot]]
id = "shipping-stage-output"
schema = "schema:text"
description = "Verbatim output of the git-add staging command."

[[slot]]
id = "shipping-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."
hint = "Empty exactly when the tree is clean; the commit tail is skipped entirely in that case, so no commit is attempted and the scribe never runs."

[[slot]]
id = "shipping-unstage-output"
schema = "schema:text"
description = "Verbatim output of the runtime-state unstage command (git reset -- .agents/runs); empty when nothing was staged there."

[[slot]]
id = "stream-plan"
schema = "[schema:research-stream]"
description = "The typed list of non-overlapping research streams this run will investigate serially."

[[slot]]
id = "topic-slug"
schema = "schema:text"
description = "Deterministic kebab-case slug for the topic, derived by a command step — never agent prose — so every deliverable path is predictable."

[[slot]]
id = "triangulation"
schema = "schema:text"
description = "Cross-stream triangulation: where independent streams agree, where they conflict, source-quality ratings, and remaining gaps."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's cumulative account of the delivered research state: files written, how citations were verified, open concerns."

[[resource]]
id = "citation-style"
path = "resources/citation-style.md"
hint = "Source-type citation formats and verification rules."
trigger = "on-demand"

[[resource]]
id = "research-standards"
path = "resources/research-standards.md"
hint = "Canonical flat-layout doctrine, source-rating scale, citation policy, and Chain-of-Verification method for this family."
trigger = "on-demand"

[[resource]]
id = "source-quality-guide"
path = "resources/source-quality-guide.md"
hint = "Domain examples and a decision method for applying the canonical A-E source-quality scale."
trigger = "on-demand"

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, and the falsifiable check that clears it."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open" or "done". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = ["gui-or-visual", "paid-or-live-execution", "owner-decision", "contract-conflict"]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "research-stream"
description = "One non-overlapping research stream: what it owns and what kind of evidence it is responsible for."

[schema.fields.focus]
schema = "schema:text"
required = true
description = "The complete, non-overlapping research question this stream owns."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this stream, unique within the plan."

[schema.fields.kind]
schema = "schema:text"
required = true
description = "primary investigates the topic directly; counterevidence deliberately searches for disconfirming evidence and competing conclusions against the other streams' emerging findings."
allowed = ["primary", "counterevidence"]

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if a blocking defect remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Non-empty when status is revise; an empty list (never omitted — always return the key) when approved. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the task's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = ["none", "needs-owner"]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no blocking defect remains (advisory notes may still exist); revise only when at least one blocking defect remains. Set to approved if and only if blockers is empty."
allowed = ["approved", "revise"]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "stream-finding"
description = "One stream's researched, cited findings."

[schema.fields.stream-id]
schema = "schema:text"
required = true
description = "The stream.id this finding set was produced by."

[schema.fields.summary]
schema = "schema:text"
required = true
description = "Cited findings for this stream: claims, sources, and any counterevidence encountered."

[[agent]]
id = "scribe"
description = "Writes the commit message for the completed research from the plan and verdict; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "smart-1"
description = "Plans the research streams and is the sole reviewer of the delivered research."
summary = "Planning and reviewer role."

[[agent]]
id = "worker"
description = "Researches each stream, triangulates, drafts the report, and applies reviewer fixes."
summary = "Implementation role."

[prompt.building-produce]
text = """

                        Produce the research delivery for {port:topic} from the plan {slot:stream-plan}, findings {slot:findings}, and triangulation {slot:triangulation}. Write under {port:output-dir}/{slot:topic-slug}/ (a flat directory — no numbered subfolders, no manifests): report.md, bibliography.md, and evidence.csv (claim, source, rating, url).
                        No reviewer verdict attached means this is round 1: implement the full delivery. On every later round a verdict IS attached — fix every blocker it names.
                        Return a work summary: what was written, how citations were verified, open concerns."""
input = ["port:topic", "slot:stream-plan", "slot:findings", "slot:triangulation", "port:output-dir", "slot:topic-slug"]
output = ["slot:work-summary"]

[prompt.building-review]
text = """

                        Review the research delivered for {port:topic} against the plan {slot:stream-plan} and triangulation {slot:triangulation}. Work summary: {slot:work-summary}.
                        A BLOCKER is an uncited factual claim, a plan stream left uncovered, an unaddressed cross-stream contradiction, a source below C-rating used as sole support for a critical claim, or a file written outside the flat {port:output-dir}/{slot:topic-slug}/ layout. Everything else is advisory.
                        Your own verdict from last round is attached when one exists: carry every open blocker forward verbatim, verify with your own tools, and flip to done only on confirmed evidence.
                        Set status to revise while any blocker remains, approved when none do."""
input = [
  "port:topic",
  "slot:stream-plan",
  "slot:triangulation",
  "slot:work-summary",
  "port:output-dir",
  "slot:topic-slug",
]
output = ["slot:review-verdict-1"]

[prompt.plan-the-streams]
text = """

                        Plan two to four non-overlapping research streams for {port:topic}. Each stream gets a stable id, a complete non-overlapping focus question, and kind "primary".
                        This is the run's one and only executable stream list, consumed directly by serial per-stream research — do not propose more than four."""
input = ["port:topic"]
output = ["slot:stream-plan"]

[prompt.research-the-streams]
text = """

                    Research every stream in the plan {slot:stream-plan} for the topic {port:topic}, one stream at a time and in the order planned — never merge two streams' evidence together.
                    Apply {resource:research-standards}: cite every factual claim, rate sources per the canonical A-E scale ({resource:source-quality-guide}), format citations per {resource:citation-style}, and note any counterevidence encountered.
                    Return exactly one stream-finding per planned stream (same order, same ids): the stream's id and its cited findings summary. Write nothing to disk yet — this is evidence gathering only."""
input = [
  "slot:stream-plan",
  "port:topic",
  "resource:research-standards",
  "resource:source-quality-guide",
  "resource:citation-style",
]
output = ["slot:findings"]

[prompt.shipping-message]
text = """

                        The review for the research on {port:topic} has ended approved and the work is being committed.
                        Write a concise commit message from the work summary {slot:work-summary} and the verdict {slot:review-verdict-1}: a short subject line naming the topic, then one paragraph on what was researched and delivered at {slot:report-path}.
                        Return exactly that message. Do not run git commands and do not write files."""
input = ["port:topic", "slot:work-summary", "slot:review-verdict-1", "slot:report-path"]
output = ["slot:shipping-message"]

[prompt.triangulate-the-findings]
text = """

                    Triangulate the researched findings {slot:findings} for {port:topic}: where independent streams agree, where they conflict, source-quality ratings, and remaining gaps.
                    Return the triangulation."""
input = ["slot:findings", "port:topic"]
output = ["slot:triangulation"]

[[sequence.building-body.sequence]]
id = "building-produce"
title = "Building Produce"
agent = "agent:worker"
prompt = "prompt:building-produce"
input = [
  "port:topic",
  "slot:stream-plan",
  "slot:findings",
  "slot:triangulation",
  "port:output-dir",
  "slot:topic-slug",
  { slot = "slot:review-verdict-1", optional = true },
  { slot = "slot:work-summary", optional = true },
]
output = ["slot:work-summary"]

[[sequence.building-body.sequence]]
id = "building-review"
title = "Building Review"
agent = "agent:smart-1"
prompt = "prompt:building-review"
input = [
  "port:topic",
  "slot:stream-plan",
  "slot:triangulation",
  "slot:work-summary",
  "port:output-dir",
  "slot:topic-slug",
  { slot = "slot:review-verdict-1", optional = true },
]
output = ["slot:review-verdict-1"]

[[sequence.building-body.sequence]]
id = "park-report-clear"
title = "Park Report Clear"
kind = "project"
output = ["slot:park-report"]

[[sequence.building-body.sequence.projection]]
destination = "slot:park-report"

[sequence.building-body.sequence.projection.source]
literal = []

[[sequence.building-body.sequence]]
id = "park-report-record"
title = "Park Report Record"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-13-building-body-18-park-report-record-then"

[sequence.building-body.sequence.when]
slot = "slot:review-verdict-1"
field = "status"
equals = "revise"

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-message"
title = "Write the commit message (scribe)"
agent = "agent:scribe"
prompt = "prompt:shipping-message"
input = ["port:topic", "slot:work-summary", "slot:review-verdict-1", "slot:report-path"]
output = ["slot:shipping-message"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-stage"
title = "Stage all changes"
output = ["slot:shipping-stage-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = ["git", "add", "-A"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-unstage-runtime"
title = "Unstage runtime state"
output = ["slot:shipping-unstage-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = ["git", "reset", "-q", "--", ".agents/runs"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-commit"
title = "Commit the work"
input = ["slot:shipping-message"]
output = ["slot:commit-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = ["git", "commit", "-m", "{slot:shipping-message}"]

[[sequence.ctx-branch-arm-s-13-building-body-18-park-report-record-then.sequence]]
id = "park-report-append"
title = "Park Report Append"
kind = "project"
input = ["slot:review-verdict-1"]

[[sequence.ctx-branch-arm-s-13-building-body-18-park-report-record-then.sequence.projection]]
source = "slot:review-verdict-1"
destination = "slot:park-report"
operation = "append"

[[sequence.ctx-branch-arm-s-13-building-body-18-park-report-record-then.sequence.output]]
slot = "slot:park-report"
operation = "append"

[[sequence.planning-body.sequence]]
id = "plan-the-streams"
title = "Plan the streams"
agent = "agent:smart-1"
prompt = "prompt:plan-the-streams"
input = ["port:topic", { slot = "slot:stream-plan", optional = true }]
output = ["slot:stream-plan"]

[procedure]
description = "Research one topic end to end: plan 2-4 non-overlapping streams, research each serially, triangulate the findings, then a bounded single-reviewer refinement loop, then commit report.md, bibliography.md, and evidence.csv."
input = ["port:output-dir", "port:topic"]
output = ["port:commit-report", "port:park-report", "port:report-path", "port:research-report"]

[[procedure.sequence]]
id = "topic-slug"
title = "Derive topic slug"
input = ["port:topic"]
output = ["slot:topic-slug"]

[procedure.sequence.command]
argv = [
  "sh",
  "-c",
  'printf "%s" "$1" | tr "A-Z" "a-z" | tr -cs "a-z0-9" "-" | sed "s/^-*//;s/-*$//"',
  "_",
  "{port:topic}",
]

[[procedure.sequence]]
id = "report-path"
title = "Derive report.md path"
input = ["port:output-dir", "slot:topic-slug"]
output = ["slot:report-path"]

[procedure.sequence.command]
argv = ["printf", "%s/%s/report.md", "{port:output-dir}", "{slot:topic-slug}"]

[[procedure.sequence]]
id = "planning"
title = "Planning"
kind = "loop"
sequence = "sequence:planning-body"
max-iterations = 3
on-exhausted = "abort"

[[procedure.sequence.until.any]]
equals = 2
count = "slot:stream-plan"

[[procedure.sequence.until.any]]
equals = 3
count = "slot:stream-plan"

[[procedure.sequence.until.any]]
equals = 4
count = "slot:stream-plan"

[[procedure.sequence]]
id = "research-the-streams"
title = "Research the streams"
agent = "agent:worker"
prompt = "prompt:research-the-streams"
input = [
  "slot:stream-plan",
  "port:topic",
  "resource:research-standards",
  "resource:source-quality-guide",
  "resource:citation-style",
]
output = ["slot:findings"]

[[procedure.sequence]]
id = "triangulate-the-findings"
title = "Triangulate the findings"
agent = "agent:worker"
prompt = "prompt:triangulate-the-findings"
input = ["slot:findings", "port:topic"]
output = ["slot:triangulation"]

[[procedure.sequence]]
id = "building"
title = "Building"
kind = "loop"
sequence = "sequence:building-body"
max-iterations = 6
on-exhausted = "abort"

[procedure.sequence.until]
slot = "slot:review-verdict-1"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "shipping-status"
title = "Check working tree status"
output = ["slot:shipping-status"]

[procedure.sequence.command]
argv = ["git", "status", "--porcelain"]

[[procedure.sequence]]
id = "shipping-maybe-commit"
title = "Shipping Maybe Commit"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-shipping-maybe-commit-then"

[procedure.sequence.when.not]
slot = "slot:shipping-status"
equals = ""
