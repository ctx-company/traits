[package]
id = "implement"
version = "0.25.0"
name = "Implement"
status = "ready"

[family]
default = "basic"

[family.variant]

[family.variant.basic]
path = "generated/basic/index.toml"
aliases = ["implement-basic"]

[family.variant.quick]
path = "generated/quick/index.toml"
aliases = ["implement-quick"]

[family.variant.complex]
path = "generated/complex/index.toml"
aliases = ["implement-complex"]

[publish]
name = "@ctx-traits/implement"
access = "public"

# frame-seconds 3600 (0281.2): the worker's objective is a plan stage, and
# a stage needs a whole session — under the old 20-minute ceiling the
# worker stopped after 3 to 11 minutes and chose the cheapest cells.
[budget]
max-frames = 1000
frame-seconds = 3600
total-seconds = 10800
max-retries = 3
idle-seconds = 1200

[variant.quick.budget]
frame-seconds = 1800
total-seconds = 21600
idle-seconds = 600

# Owner order 2026-09-03: summons off until 0279 lands (answering a park
# from any non-driver surface spawns a second driver and kills the run).
# The annotate gate stays on — its stdin path runs inside the driver.
[defaults.port]
owner-ruling = "off"
