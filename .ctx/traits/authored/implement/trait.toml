[package]
id = "implement"
version = "0.25.0"
name = "Implement"
status = "ready"

[family]
default = "implement"

[family.variant]

[family.variant.implement-quick]
path = "generated/implement-quick/index.toml"
aliases = ["implement-implement-quick"]

[family.variant.implement]
path = "generated/implement/index.toml"
aliases = ["implement-implement"]

[family.variant.implement-complex]
path = "generated/implement-complex/index.toml"
aliases = ["implement-implement-complex"]

[publish]
name = "@ctx-traits/implement"
access = "public"

[budget]
max-frames = 1000
frame-seconds = 1200
total-seconds = 10800
max-retries = 3
idle-seconds = 1200

[variant.implement-quick.budget]
frame-seconds = 1800
total-seconds = 21600
idle-seconds = 600
