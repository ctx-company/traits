id = "implement"
schema-version = "0.6"
version = "0.25.0"
name = "Complex"
description = "Reviewed implementation: implement, review, refine & commit."
variant = "complex"

[metadata]
tag = [
    "implementation",
    "review",
    "multi-agent",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"

[[intent.require]]
id = "pragmatism"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "contract-ceiling"

[[intent.require]]
id = "representative-proof"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "duplication"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = 'Task to implement, named by its file in .internal/tasks/ — the key ("0044" or "0044.2"), the full name, or the filename.'

[[slot]]
id = "changed-files"
schema = "schema:text"
description = "Names and change-kinds of every file changed since the session base — an index of where the work landed, never the work itself. The reviewer opens whatever it needs with its own tools."
hint = "git diff --name-status against slot:diff-base; covers committed and uncommitted changes, omits untracked files."

[[slot]]
id = "commit-log"
schema = "schema:text"
description = "Throwaway capture of the commit command's own output — not a run output port, never gates anything."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Commit message for the completed task; injected directly into the git commit command step."

[[slot]]
id = "diff-base"
schema = "schema:text"
description = "Commit the session started from — the fixed base every changed-files capture diffs against."
hint = "git rev-parse HEAD captured before any work; worker commits during the loop never move it."

[[slot]]
id = "draft"
schema = "schema:implementation-draft"
description = "smart-1's implementation plan for the task — the plan the worker implements and the verdict's stage ledger walks."

[[slot]]
id = "git-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."

[[slot]]
id = "owner-decisions"
schema = "[schema:text]"
description = "Every owner ruling made during this run — one formatted entry per summons, one gate answer per annotated verdict — the run's durable decision record, carried into the commit message. Annotations reach the seats through the verdict the reviewer applied them to, not through this record."
hint = "One entry per ruling: a summons entry is the question and the owner's answer in one or two sentences; a gate entry is the ctx-annotate decision JSON verbatim."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "First reviewer's verdict for the current work state."

[[slot]]
id = "review-verdict-2"
schema = "schema:review-verdict"
description = "Second, independent reviewer's verdict for the current work state."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git add command step."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's account of what this round changed."
hint = "What changed, how it was validated, and open concerns."

[[resource]]
id = "task-board"
path = ".internal/tasks"
root = "repo"
hint = "Repo-root directory for the task board."
trigger = "on-demand"

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, the falsifiable check that clears it, and the owner's ruling on it when one exists."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note, verbatim, when one applies to the whole blocker — its order, its scope, its standing. Applied by the reviewer when the annotation was made; carried verbatim while the blocker survives. Blockers are listed in the order the worker executes them, and an owner's ordering ruling is what moves a blocker in that list."

[schema.fields.stage]
schema = "schema:text"
description = "The id of the plan stage this blocker belongs to: the stage whose goal it prevents. A blocker on the first open stage, or a regression of a done stage's goal, is the worker's work now; a blocker on a later stage is filed here and not worked until that stage is the first open one. Absent only when the plan carries no stages."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix, with verified progress state and the owner's ruling on it when one exists."

[schema.fields.evidence]
schema = "schema:text"
description = "Why status is done: file:line, a test name, or a command and its observed result. Required in practice for every done step; absent while open."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note, verbatim, when one applies to this step. The worker executes a ruled step as the ruling says, not as the step text alone says; a ruled step done differently from its ruling is a blocker next round. Carried verbatim while the step survives."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open", "done", "deferred" or "dropped". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone. deferred and dropped are set only when the reviewer applies an owner annotation (recorded in the verdict's dispositions): deferred is the owner's "not now" — kept on record, not executed until the owner or its stage says so; dropped is the owner's "no" — kept on record, never executed. Neither blocks approval, and the reviewer never reopens either on its own."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "disposition"
description = "One owner annotation applied to the verdict by the reviewer: anchor text, note, target, action taken, and a one-sentence account. Annotations are binding edits, never arguments; where the reviewer disagrees it applies the annotation anyway and records the disagreement in the advisory."

[schema.fields.action]
schema = "schema:text"
required = true
description = "What the reviewer did: deferred (the owner said not now — the step keeps status deferred until the owner or its stage brings it back); dropped (the owner said no — the step keeps status dropped, never executed, never reopened); done (the owner accepted it as is — status done with the note as evidence); added (the note asked for something new — a new step or blocker carrying the note as its ruling); ordered (the note changed what comes first — the blocker list is reordered); ruled (the note changes how a step or blocker is done — carried as its ruling and executed as ruled); answered (the note answered or asked something that changes no item — the answer is in note); unclear (the note could not be mapped or understood — note carries a one-sentence question for the owner, and nothing was changed)."
allowed = [
    "deferred",
    "dropped",
    "done",
    "added",
    "ordered",
    "ruled",
    "answered",
    "unclear",
]

[schema.fields.applied-to]
schema = "schema:text"
required = true
description = 'Where the annotation landed: a blocker id, "<blocker-id>/step <n>", "stage <id>", "advisory", or "plan".'

[schema.fields.note]
schema = "schema:text"
required = true
description = "One sentence: what changed in this verdict because of the annotation, or the question back to the owner when action is unclear."

[schema.fields.raw]
schema = "schema:text"
required = true
description = "The annotated surface text, verbatim from the gate answer's raw field. This is the anchor: it is an exact substring of the verdict's own blocker, step, stage or advisory text."

[schema.fields.text]
schema = "schema:text"
required = true
description = "The owner's note, verbatim from the gate answer's text field."

[[schema]]
id = "implementation-draft"
description = "smart-1's implementation plan for the task — what the loop operates on. A plan, not an implementation."

[schema.fields.approach]
schema = "schema:text"
required = true
description = "The suggested route: files to touch, symbols, edit order, reuse opportunities, validation plan. Guidance the worker may deviate from in service of a goal, reporting the deviation in the work summary."

[schema.fields.risks]
schema = "schema:text"
required = true
description = "What could go wrong and how the route mitigates it."

[schema.fields.scope]
schema = "schema:text"
required = true
description = "The task's scope restated from the task file: what is in, what is explicitly out."

[schema.fields.stages]
schema = "[schema:stage]"
required = true
description = "The plan as an ordered list of stages, each an id and a goal. Nothing else is required of a stage while it is open: whatever a later stage's goal covers may be in any state until that stage, and that is neither a defect nor a regression. Restrictions exist only as goals; anything unstated is allowed. A done stage's goal must keep holding, and a standing property (a safety invariant, a contract) is the goal of the stage that establishes it — nothing more is needed to keep it. A cutover is stages, not a cliff: its last stages are the deletion and the green gates. Together the stages must cover every Done-when goal of the task."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if an open step remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly; owner annotations are applied to this verdict by the reviewer and accounted for in dispositions — they are binding edits, never arguments, and a step the owner deferred or dropped is never reopened by the reviewer."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Listed in the order the worker executes them — the plan's order, then the owner's ordering rulings; never sorted by how cheap a fix is. Non-empty when status is revise. When approved the list holds no open step: a blocker whose steps are all done or dropped is removed and named in the advisory, a blocker still holding a deferred step stays listed so the deferral is on record. Always return the key (an empty list, never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.dispositions]
schema = "[schema:disposition]"
description = "One entry per owner annotation applied to this verdict, in the order annotated. Present exactly when the gate answer carried annotations; absent otherwise. Every annotation gets exactly one entry — none dropped, none merged into another, none reworded — and the edit each entry describes is visible in this same verdict (a status, a ruling, an order, a new step). The next surface shows these lines so the owner can check the application and correct it by annotating again. A later round carries earlier rulings in the items they landed on, not here: this list is this application only."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the task's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.stages]
schema = "[schema:stage-status]"
description = "The plan's stage ledger: every stage of the plan's stages list, in plan order, carried verbatim across rounds with only status, evidence and ruling moving. The first open stage is the worker's objective; blockers name the stage they belong to; nothing outside the first open stage's goal and the goals of done stages is required, so a red suite or a failing gate a later stage covers is neither a defect nor a regression and never a blocker. In the first round, also verify that the stages cover every Done-when goal of the task file (read it with your tools) and block any uncovered goal as a blocker on the last stage. Absent only when the plan carries no stages."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no step in any blocker has status open (advisory notes, deferred steps and dropped steps may still exist); revise when at least one step is open. A step the owner deferred or dropped never keeps status at revise."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "stage"
description = "One stage of the plan: an id and the goal that defines it."

[schema.fields.goal]
schema = "schema:text"
required = true
description = "What must be observable when this stage is done, taken from the task's Done-when. A goal is the only requirement of its stage."

[schema.fields.id]
schema = "schema:text"
required = true
description = 'Short kebab-case slug naming the stage, stable for the whole run (e.g. "resolver", "flip-context", "delete-old").'

[[schema]]
id = "stage-status"
description = "One plan stage in the verdict's ledger: id, whether its goal holds, the evidence, and the owner's ruling on it when one exists."

[schema.fields.evidence]
schema = "schema:text"
required = true
description = "Why the status is what it is: what you ran or read. Empty only for a stage nobody has reached yet."

[schema.fields.id]
schema = "schema:text"
required = true
description = "The stage id exactly as the plan's stages list names it."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note on this stage, verbatim, when one exists (an order to start it now, to treat it as done, to change its goal). Applied by the reviewer and carried verbatim."

[schema.fields.status]
schema = "schema:text"
required = true
description = "done only when you verified with your own tools that the stage's goal is observable in the working tree; open otherwise. A done stage whose goal stops holding goes back to open, with the evidence that shows it — that is the only kind of regression there is."
allowed = [
    "open",
    "done",
]

[[agent]]
id = "scribe"
description = "Commit & Summary Writing; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "smart"
description = "Plan Drafting and Review"
summary = "Review role."

[[agent.intent.avoid]]
id = "taste-only-blocking"

[[agent.intent.avoid]]
id = "tail-case-pursuit"

[[agent.intent.avoid]]
id = "rubber-stamp-review"

[[agent.intent.avoid]]
id = "unbounded-loop"

[[agent]]
id = "worker"
description = "Implementation Work"
summary = "Implementation role."

[[agent.intent.require]]
id = "preserve-scope"

[[agent.intent.require]]
id = "review-before-final"

[prompt.cross-review-the-implementation]
text = """
Review the implemented state against the plan {slot:draft} as source of truth; the task file is what the plan must cover, read it with your tools.
Worker's summary: {slot:work-summary}, Changed files {slot:changed-files}.
Verdicts from previous rounds (if available): {slot:review-verdict-1} & {slot:review-verdict-2}
Don't rush the approval, take as many rounds as it needs, while staying pragmatic and task-focused.
There is no reachable owner during this run — never set escalation to needs-owner. Any question you would have escalated is yours to decide: make the best-effort judgement call, ground it in evidence you verified yourself, and record the decision and its reason in the verdict. A decided question is never a blocker.

Return the typed review verdict — status is revise while any blocker remains, approved when none do (slot:review-verdict-2)"""
input = [
    "slot:draft",
    "slot:work-summary",
    "slot:changed-files",
]
output = ["slot:review-verdict-2"]

[prompt.draft-the-implementation-plan]
text = "Draft the implementation plan for {port:task}, read it and the relevant code with your tools."
input = ["port:task"]
output = ["slot:draft"]

[prompt.implement-the-task]
text = """
Implement the plan: {slot:draft}. Your objective this round is the first open stage of the verdict's stage ledger — before any verdict exists, the plan's first stage.
The reviewer's verdict on the current state, with the owner's annotations applied (if any): {slot:review-verdict-1} & {slot:review-verdict-2}
Don't discard your progress if you can't finish the stage to completion.

Return this round's work summary: slot:work-summary"""
input = ["slot:draft"]
output = ["slot:work-summary"]

[prompt.review-the-implementation]
text = """
  Review the implemented state against the plan {slot:draft} as source of truth; the task file is what the plan must cover, read it with your tools.
  Worker's summary: {slot:work-summary}, Changed files {slot:changed-files}.
  Verdicts from previous rounds (if available): {slot:review-verdict-1} & {slot:review-verdict-2}
  Don't rush the approval, take as many rounds as it needs, while staying pragmatic and task-focused.

There is no reachable owner during this run — never set escalation to needs-owner. Any question you would have escalated is yours to decide: make the best-effort judgement call, ground it in evidence you verified yourself, and record the decision and its reason in the verdict. A decided question is never a blocker.

Return the typed review verdict: (slot:review-verdict-1).
Verdict should come with proposed solutions."""
input = [
    "slot:draft",
    "slot:work-summary",
    "slot:changed-files",
]
output = ["slot:review-verdict-1"]

[prompt.write-the-commit-message]
text = """
The work for {port:task} is being committed.
Write a concise commit message from the work summary into {slot:work-summary}.
Owner rulings made during this run (if any): {slot:owner-decisions} — when one shaped the work, cite what the owner decided in the message body.

Return exactly the finished commit message into (slot:commit-message)."""
input = [
    "port:task",
    "slot:work-summary",
]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "write-the-commit-message"
title = "Write the commit message"
agent = "agent:scribe"
prompt = "prompt:write-the-commit-message"
input = [
    "port:task",
    "slot:work-summary",
    { slot = "slot:owner-decisions", optional = true },
]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "stage-all-changes"
title = "Stage all changes"
output = ["slot:stage-output"]

[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "commit-the-work"
title = "Commit the work"
input = ["slot:commit-message"]
output = ["slot:commit-log"]

[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence.command]
argv = [
    "sh",
    "-c",
    'if git diff --quiet && git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "$1" && echo committed; fi',
    "_",
    "{slot:commit-message}",
]

[[sequence.doubly-reviewed-refinement-body.sequence]]
id = "implement-the-task"
title = "Implement the task"
agent = "agent:worker"
prompt = "prompt:implement-the-task"
input = [
    "slot:draft",
    { slot = "slot:review-verdict-1", optional = true },
    { slot = "slot:review-verdict-2", optional = true },
]
output = ["slot:work-summary"]

[[sequence.doubly-reviewed-refinement-body.sequence]]
id = "capture-the-changed-files"
title = "Capture the changed files"
input = ["slot:diff-base"]
output = ["slot:changed-files"]

[sequence.doubly-reviewed-refinement-body.sequence.command]
argv = [
    "git",
    "diff",
    "--name-status",
    "{slot:diff-base}",
]

[[sequence.doubly-reviewed-refinement-body.sequence]]
id = "review-the-implementation"
title = "Review the implementation"
agent = "agent:smart"
prompt = "prompt:review-the-implementation"
input = [
    "slot:draft",
    "slot:work-summary",
    "slot:changed-files",
    { slot = "slot:review-verdict-1", optional = true },
    { slot = "slot:review-verdict-2", optional = true },
]
output = ["slot:review-verdict-1"]

[[sequence.doubly-reviewed-refinement-body.sequence]]
id = "cross-review-the-implementation"
title = "Cross-review the implementation"
agent = "agent:smart"
prompt = "prompt:cross-review-the-implementation"
input = [
    "slot:draft",
    "slot:work-summary",
    "slot:changed-files",
    { slot = "slot:review-verdict-1", optional = true },
    { slot = "slot:review-verdict-2", optional = true },
]
output = ["slot:review-verdict-2"]

[procedure]
description = "Reviewed implementation: implement, review, refine & commit."
input = ["port:task"]

[[procedure.sequence]]
id = "capture-the-session-base"
title = "Capture the session base"
output = ["slot:diff-base"]

[procedure.sequence.command]
argv = [
    "git",
    "rev-parse",
    "HEAD",
]

[[procedure.sequence]]
id = "draft-the-implementation-plan"
title = "Draft the implementation plan"
agent = "agent:smart"
prompt = "prompt:draft-the-implementation-plan"
input = ["port:task"]
output = ["slot:draft"]

[[procedure.sequence]]
id = "doubly-reviewed-refinement"
title = "Doubly-reviewed refinement"
kind = "loop"
sequence = "sequence:doubly-reviewed-refinement-body"
max-iterations = 3
on-exhausted = "continue"

[[procedure.sequence.until.all]]
slot = "slot:review-verdict-1"
field = "status"
equals = "approved"

[[procedure.sequence.until.all]]
slot = "slot:review-verdict-2"
field = "status"
equals = "approved"

[[procedure.sequence]]
id = "check-working-tree-status"
title = "Check working tree status"
output = ["slot:git-status"]

[procedure.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[procedure.sequence]]
id = "maybe-commit"
title = "Maybe Commit"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-12-maybe-commit-then"

[procedure.sequence.when.not]
empty = "slot:git-status"
