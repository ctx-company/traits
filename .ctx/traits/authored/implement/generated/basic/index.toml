id = "implement"
schema-version = "0.6"
version = "0.26.0"
name = "Basic"
description = "Reviewed implementation: plan, then stage by stage — work until claimed, prove, review, commit."
variant = "basic"

[metadata]
tag = [
    "implementation",
    "review",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"

[[intent.require]]
id = "pragmatism"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "contract-ceiling"

[[intent.require]]
id = "representative-proof"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "duplication"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "owner-gate"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner annotation transport for review verdicts: 'annotate' (default) pipes each verdict's surface to ctx-annotate so the owner can accept, overrule, or extend it; 'off' auto-accepts for unattended runs."

[port.default]
value = "annotate"

[[port]]
id = "owner-ruling"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner summons transport: 'on' (default) parks the run on reviewer-raised owner questions; 'off' skips the summons branch entirely for unattended runs — escalations stay recorded in the verdict for morning review, the run proceeds."

[port.default]
value = "on"

[[port]]
id = "plan-gate"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner annotation transport for the drafted plan before round 1: 'annotate' (default) pipes the plan's surface to ctx-annotate so the owner can accept it or correct it, and the plan is redrafted with the corrections until accepted; 'off' auto-accepts for unattended runs."

[port.default]
value = "annotate"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = 'Task to implement, named by its file in .internal/tasks/ — the key ("0044" or "0044.2"), the full name, or the filename.'

[[slot]]
id = "brief"
schema = "schema:brief"
description = "The worker's next unit of work, copied from the reviewer's verdict: the first open stage with its goal, proof and commit flag, and the front step with its frozen done-when. This is the whole of what the verdict asks of the worker right now; the rest of the ledger is the reviewer's."

[[slot]]
id = "changed-files"
schema = "schema:text"
description = "Names and change-kinds of every file changed since the session base — an index of where the work landed, never the work itself. The reviewer opens whatever it needs with its own tools."
hint = "git diff --name-status against slot:diff-base; covers committed and uncommitted changes, omits untracked files."

[[slot]]
id = "closed-stage"
schema = "schema:closed-stage"
description = "The stage the latest verdict flipped to done, copied from the verdict: its id and whether the plan commits on it."

[[slot]]
id = "commit-log"
schema = "schema:text"
description = "Throwaway capture of the commit command's own output — not a run output port, never gates anything."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Commit message for the completed task; injected directly into the git commit command step."

[[slot]]
id = "diff-base"
schema = "schema:text"
description = "Commit the session started from — the fixed base every changed-files capture diffs against."
hint = "git rev-parse HEAD captured before any work; worker commits during the loop never move it."

[[slot]]
id = "draft"
schema = "schema:implementation-draft"
description = "smart-1's implementation plan for the task — the plan the worker implements and the verdict's stage ledger walks."

[[slot]]
id = "gate-answer"
schema = "schema:text"
description = "The owner's verdict-gate outcome: the literal 'accepted' when the owner had no annotations (or the gate is off); otherwise the ctx-annotate decision JSON. Each of its annotations carries `raw` — the exact surface text the owner annotated, an exact substring of the verdict — and `text`, the owner's note. Annotations are binding edits to the verdict: the reviewer applies them and accounts for each in the verdict's dispositions."

[[slot]]
id = "gate-surface"
schema = "schema:text"
description = "The digest's annotation surface, carried as text for the gate command."

[[slot]]
id = "git-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."

[[slot]]
id = "notify-badge"
schema = "schema:text"
description = "The digest's badge field, carried as text for command argv."

[[slot]]
id = "notify-digest"
schema = "schema:notify-digest"
description = "Scribe's per-round digest of the review verdict, fed directly into the notification commands."

[[slot]]
id = "notify-id"
schema = "schema:text"
description = "The owner-notification activity id, exactly as `begin` printed it — every later notification step addresses this."

[[slot]]
id = "notify-journal"
schema = "schema:text"
description = "The digest's journal field, carried as text for command argv."

[[slot]]
id = "notify-log"
schema = "schema:text"
description = "The notifier's own JSON receipt for the most recent notification command."

[[slot]]
id = "notify-summary"
schema = "schema:text"
description = "The digest's summary field, carried as text for command argv."

[[slot]]
id = "owner-decisions"
schema = "[schema:text]"
description = "Every owner ruling made during this run — one formatted entry per summons, one gate answer per annotated verdict — the run's durable decision record, carried into the commit message. Annotations reach the seats through the verdict the reviewer applied them to, not through this record."
hint = "One entry per ruling: a summons entry is the question and the owner's answer in one or two sentences; a gate entry is the ctx-annotate decision JSON verbatim."

[[slot]]
id = "plan-answer"
schema = "schema:text"
description = "The owner's plan-gate outcome: the literal 'accepted' when the owner had no annotations (or the gate is off); otherwise the ctx-annotate decision JSON. Each of its annotations carries `raw` — the exact plan text the owner annotated — and `text`, the owner's note. Annotations are binding corrections: the plan is drafted again with them as input until the owner accepts it."

[[slot]]
id = "plan-digest"
schema = "schema:plan-digest"
description = "Scribe's digest of the drafted plan into the owner's annotation surface."

[[slot]]
id = "plan-surface"
schema = "schema:text"
description = "The plan digest's surface, carried as text for the gate command."

[[slot]]
id = "proof-command"
schema = "schema:text"
description = "The current stage's proof command, copied from the brief for the proof step's argv."

[[slot]]
id = "proof-result"
schema = "schema:text"
description = "What the stage's proof command said about the worker's latest claim: the literal 'pass', or 'fail' with the exit code and the tail of the command's output. Written only when the worker claimed the stage complete; a claim that failed proof comes back to the worker with this text and costs no review."

[[slot]]
id = "review-verdict-1"
schema = "schema:review-verdict"
description = "First reviewer's verdict for the current work state."

[[slot]]
id = "review-verdict-2"
schema = "schema:review-verdict"
description = "Second, independent reviewer's verdict for the current work state."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git add command step."

[[slot]]
id = "summon-the-owner"
schema = "schema:text"
description = "Runtime slot summon-the-owner."

[[slot]]
id = "work-report"
schema = "schema:work-report"
description = "The worker's report on its latest dispatch: what changed and was verified, whether it claims the stage complete, what the next dispatch does first, and what blocks it."

[[resource]]
id = "task-board"
path = ".internal/tasks"
root = "repo"
hint = "Repo-root directory for the task board."
trigger = "on-demand"

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, the falsifiable check that clears it, and the owner's ruling on it when one exists."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply to declare this blocker fixed as a whole — the sum of its steps' done-when clauses, never more. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note, verbatim, when one applies to the whole blocker — its order, its scope, its standing. Applied by the reviewer when the annotation was made; carried verbatim while the blocker survives. Blockers are listed in the order the worker executes them, and an owner's ordering ruling is what moves a blocker in that list."

[schema.fields.stage]
schema = "schema:text"
description = "The id of the plan stage this blocker belongs to: the stage whose goal it prevents. A blocker on the first open stage, or a regression of a done stage's goal, is the worker's work now; a blocker on a later stage is filed here and not worked until that stage is the first open one. Absent only when the plan carries no stages."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation with its own frozen done-when: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text, same done-when — flipping status to done only where you verified done-when with your own tools, and appending genuinely new findings as new steps at the end, prerequisites of the front step first. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end. The runtime enforces the freeze: a verdict that changes a carried step's done-when is rejected."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[schema.frozen]
key = "id"

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix: its frozen text, the frozen check that closes it, its verified status, why the status is what it is, how to satisfy the check while it is open, and the owner's ruling on it when one exists."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "The falsifiable check that closes THIS step, written when the step is created and frozen for the life of the step — the runtime rejects a verdict that changes it. A command the worker can run itself wherever one can say it (a grep that must come back empty, a test that must exist and pass, a call site that must route through X); otherwise one precise observable sentence. The worker's claim is graded against this text as written and against nothing else: what it does not ask for cannot be asked for here. When the acceptance turns out to need more, that more is a NEW step with its own done-when, appended after this one."

[schema.fields.explanation]
schema = "schema:text"
required = true
description = "Why the status is what it is, every round, for every step. Done: the proof that done-when holds — file:line, a test name, or the command and its observed result. Open after the worker attempted it: which clause of done-when you verified fails, and exactly what is missing or wrong in the tree, so the owner reading the surface and the worker reading the brief see the same reason. Open and never attempted: 'not yet attempted'. Never empty, and never a reason that done-when does not contain."

[schema.fields.guidance]
schema = "schema:text"
description = "For an open step: how to satisfy done-when — the concrete change and where, from the smarter model to the worker. Never a new requirement: a demand done-when does not make belongs in a new step, not here. Absent for done, deferred and dropped steps."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note, verbatim, when one applies to this step. The worker executes a ruled step as the ruling says, not as the step text alone says; a ruled step done differently from its ruling is a blocker next round. Carried verbatim while the step survives."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open", "done", "deferred" or "dropped". Flips to done only when the reviewer has verified done-when against the working tree — never on the worker's claim alone, and never for less than done-when as written. deferred and dropped are set only when the reviewer applies an owner annotation (recorded in the verdict's dispositions): deferred is the owner's "not now" — kept on record, not executed until the owner or its stage says so; dropped is the owner's "no" — kept on record, never executed. Neither blocks approval, and the reviewer never reopens either on its own."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds; it is the key the runtime matches this step by from one verdict to the next."

[schema.frozen]
key = "step"
fields = ["done-when"]

[[schema]]
id = "brief"
description = "The worker's next unit of work: the first open stage with its goal, proof and commit flag verbatim from the plan, and the front step with its frozen done-when. The only part of the verdict the worker sees, so it must stand on its own."

[schema.fields.commit]
schema = "schema:boolean"
required = true
description = "That stage's commit flag, verbatim from the plan: whether the tree is committed when the stage is done."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "The front step's done-when, verbatim — the text the claim is graded against. For a stage with no open step, the stage's proof restated."

[schema.fields.goal]
schema = "schema:text"
required = true
description = "That stage's goal, verbatim from the plan. The worker's objective: the stage is the unit of completeness, so the worker keeps working toward this goal until it can claim it — never until one step is closed. Nothing outside this goal and the goals of done stages is required."

[schema.fields.guidance]
schema = "schema:text"
description = "The front step's guidance, verbatim, when present."

[schema.fields.proof]
schema = "schema:text"
required = true
description = "That stage's proof command, verbatim from the plan ('none' when the plan names none). The runtime runs it whenever the worker claims the stage complete; a failing proof sends the worker back with the failure output and costs no review."

[schema.fields.remaining]
schema = "schema:integer"
required = true
description = "How many open steps this stage holds beyond the front one. A count, never their text: the worker sees one step at a time and the stage goal; the rest of the queue is the reviewer's."

[schema.fields.ruling]
schema = "schema:text"
description = "The front step's ruling, verbatim, when present."

[schema.fields.stage]
schema = "schema:text"
required = true
description = "The id of the first open stage in the stage ledger, verbatim from the plan."

[schema.fields.step]
schema = "schema:text"
required = true
description = "The front step: the first open step of the first listed blocker of this stage — where the worker starts. Verbatim from the blocker's step text. When the stage has no open step (nothing attempted, no blocker filed), the stage goal restated as the first operation."

[[schema]]
id = "closed-stage"
description = "The stage this verdict flipped from open to done: its id and its commit flag, both verbatim from the plan."

[schema.fields.commit]
schema = "schema:boolean"
required = true
description = "That stage's commit flag, verbatim from the plan."

[schema.fields.id]
schema = "schema:text"
required = true
description = "The id of the stage this verdict marked done, verbatim from the plan."

[[schema]]
id = "disposition"
description = "One owner annotation applied to the verdict by the reviewer: anchor text, note, target, action taken, and a one-sentence account. Annotations are binding edits, never arguments; where the reviewer disagrees it applies the annotation anyway and records the disagreement in the advisory."

[schema.fields.action]
schema = "schema:text"
required = true
description = "What the reviewer did: deferred (the owner said not now — the step keeps status deferred until the owner or its stage brings it back); dropped (the owner said no — the step keeps status dropped, never executed, never reopened); done (the owner accepted it as is — status done with the note as its explanation); added (the note asked for something new — a new step or blocker carrying the note as its ruling); ordered (the note changed what comes first — the blocker list is reordered); ruled (the note changes how a step or blocker is done — carried as its ruling and executed as ruled); answered (the note answered or asked something that changes no item — the answer is in note); unclear (the note could not be mapped or understood — note carries a one-sentence question for the owner, and nothing was changed)."
allowed = [
    "deferred",
    "dropped",
    "done",
    "added",
    "ordered",
    "ruled",
    "answered",
    "unclear",
]

[schema.fields.applied-to]
schema = "schema:text"
required = true
description = 'Where the annotation landed: a blocker id, "<blocker-id>/step <n>", "stage <id>", "advisory", or "plan".'

[schema.fields.note]
schema = "schema:text"
required = true
description = "One sentence: what changed in this verdict because of the annotation, or the question back to the owner when action is unclear."

[schema.fields.raw]
schema = "schema:text"
required = true
description = "The annotated surface text, verbatim from the gate answer's raw field. This is the anchor: it is an exact substring of the verdict's own blocker, step, stage or advisory text."

[schema.fields.text]
schema = "schema:text"
required = true
description = "The owner's note, verbatim from the gate answer's text field."

[[schema]]
id = "implementation-draft"
description = "smart-1's implementation plan for the task — what the loop operates on. A plan, not an implementation."

[schema.fields.approach]
schema = "schema:text"
required = true
description = "The suggested route: files to touch, symbols, edit order, reuse opportunities, validation plan. Guidance the worker may deviate from in service of a goal, reporting the deviation in the work summary."

[schema.fields.risks]
schema = "schema:text"
required = true
description = "What could go wrong and how the route mitigates it."

[schema.fields.scope]
schema = "schema:text"
required = true
description = "The task's scope restated from the task file: what is in, what is explicitly out."

[schema.fields.stages]
schema = "[schema:stage]"
required = true
description = "The plan as an ordered list of stages, each an id and a goal. Nothing else is required of a stage while it is open: whatever a later stage's goal covers may be in any state until that stage, and that is neither a defect nor a regression. Restrictions exist only as goals; anything unstated is allowed. A done stage's goal must keep holding, and a standing property (a safety invariant, a contract) is the goal of the stage that establishes it — nothing more is needed to keep it. The stage is the unit of completeness: the reviewer grades the stage, never a round, and a round is one attempt at finishing the current stage — the worker attempts the whole stage and, when it cannot finish, reports what is left. A cutover is stages, not a cliff: its last stages are the deletion and the green gates. Together the stages must cover every Done-when goal of the task."

[[schema]]
id = "needs-owner-payload"
description = "Why only the owner can settle this, and the one question that unblocks the run."

[schema.fields.question]
schema = "schema:text"
required = true
description = "The single question to put to the owner, phrased so one short answer unblocks the run. Name the options you see and what you would do absent an answer."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "Why only the owner can settle this: the contradiction, the missing authority, or the trade-off the run has no standing to decide. Grounded in what you verified, not a restatement of the question."

[[schema]]
id = "notify-digest"
description = "The reviewer verdict digested for the owner notification thread."

[schema.fields.badge]
schema = "schema:text"
required = true
description = 'Short status badge for the activity, 64 characters at most, always "review: <verdict status>".'

[schema.fields.journal]
schema = "schema:text"
required = true
description = """Exactly "stage <k>/<n> • claim <c> • <X> open • <Y> closed" and NOTHING else — k is the 1-based position of the first open stage in the verdict's stage ledger (n when every stage is done), n the number of stages; c is "accepted" when the verdict carries a closed-stage, "rejected" when the work report claimed complete and the verdict carries no closed-stage, "blocked" when the work report's blocked field is non-empty, and "none" otherwise (the report was in-progress: the stage's time ran out without a claim); X counts steps with status "open" and Y counts steps with status "done" or "dropped", across every blocker in the verdict. When the verdict carries no stage ledger, exactly "claim <c> • <X> open • <Y> closed". No step texts, no prose, no punctuation beyond the bullets."""

[schema.fields.summary]
schema = "schema:text"
required = true
description = """Multi-line prose block for the owner's phone, 4096 characters at most: the verdict in two to four plain sentences — how many blocker steps are open, what closed this round, and where the run is heading. NEVER the empty string (an empty value aborts the command it feeds): when the verdict is approved, exactly "approved — all points closed"."""

[schema.fields.surface]
schema = "schema:text"
required = true
description = "The owner's annotation surface. The verdict status on the first line, then one line 'CLAIM: <claim>' from the work report, with its blocked text appended after ' — ' when non-empty. Then, when the verdict carries a stage ledger, one line per stage under 'STAGES:' as '<id> (<status>): <evidence>' with its ruling when present, in ledger order. Then every blocker and every step COPIED VERBATIM — never paraphrased, shortened, or reordered — as plain numbered lines, one step per line, blockers separated by a blank line and introduced by 'BLOCKER n (stage, status):'; each step line carries the step text, then 'done-when: ' and its done-when VERBATIM, then its status, then its explanation VERBATIM, then its guidance when present, then its ruling when present, separated by ' — '. After the blockers: the advisory VERBATIM under a line reading 'ADVISORY:', then — when the verdict carries dispositions — one line per disposition under 'RULINGS APPLIED:', each as '<action> — <applied-to> — <note>'. This text is what the owner annotates, and each annotation comes back carrying the exact text it was made on, so fidelity to the verdict is the only requirement."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "plan-digest"
description = "The drafted plan digested for the owner's annotation pass."

[schema.fields.surface]
schema = "schema:text"
required = true
description = "The owner's plan surface: the plan COPIED VERBATIM — never paraphrased, shortened, or reordered — as plain numbered lines: 'SCOPE:' then the scope text; 'STAGES:' then one line per stage as '<id>: <goal>' in plan order; 'APPROACH:' then the approach text; 'RISKS:' then the risks text. This text is what the owner annotates, and each annotation comes back carrying the exact text it was made on, so fidelity to the plan is the only requirement."

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if an open step remains; every step carries a frozen done-when the runtime keeps from moving, and a claim is graded against it as written; the brief is what the worker sees next; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly; owner annotations are applied to this verdict by the reviewer and accounted for in dispositions — they are binding edits, never arguments, and a step the owner deferred or dropped is never reopened by the reviewer."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and steps with frozen done-when checks. Listed in the order the worker executes them — the plan's order, then the owner's ordering rulings; never sorted by how cheap a fix is. This verdict grades a CLAIM or a partial: when the work report claims the stage complete, every open step of that stage is graded against its own done-when as written — met is done, not met is open with the explanation citing the failing clause. A step whose done-when is met is never kept open for anything else: what its done-when did not ask for is a new step (appended, in plan order, prerequisites of the front step first) or an advisory. When the report is in-progress, nothing is regraded against the worker: carry the ledger, record what moved. Non-empty when status is revise. When approved the list holds no open step: a blocker whose steps are all done or dropped is removed and named in the advisory, a blocker still holding a deferred step stays listed so the deferral is on record. Always return the key (an empty list, never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.brief]
schema = "schema:brief"
description = "The worker's next unit of work, derived from this verdict: the first open stage with its goal, proof and commit flag copied verbatim from the plan, and the front step (first open step of the first listed blocker of that stage) with its frozen done-when, guidance and ruling. Present whenever status is revise; absent when approved. It is the only part of the verdict the worker sees, so it must stand on its own."

[schema.fields.closed-stage]
schema = "schema:closed-stage"
description = "Present exactly when this verdict flipped a stage from open to done: that stage's id and commit flag verbatim from the plan. The loop commits the tree on it when commit is true. Absent otherwise."

[schema.fields.dispositions]
schema = "[schema:disposition]"
description = "One entry per owner annotation applied to this verdict, in the order annotated. Present exactly when the gate answer carried annotations; absent otherwise. Every annotation gets exactly one entry — none dropped, none merged into another, none reworded — and the edit each entry describes is visible in this same verdict (a status, a ruling, an order, a new step). The next surface shows these lines so the owner can check the application and correct it by annotating again. A later round carries earlier rulings in the items they landed on, not here: this list is this application only."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; a required gate fails for reasons outside the task's scope (tooling conflict); a step cannot be graded from its frozen done-when plus the tree; the plan is wrong for a step (it cannot be done as planned in this code); or the work report's blocked field names something only the owner can settle. Raised the first time the case appears, never after repeating the same rejection. Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.stages]
schema = "[schema:stage-status]"
description = "The plan's stage ledger: every stage of the plan's stages list, in plan order, carried verbatim across rounds with only status, evidence and ruling moving. The first open stage is the worker's objective; blockers name the stage they belong to; nothing outside the first open stage's goal and the goals of done stages is required, so a red suite or a failing gate a later stage covers is neither a defect nor a regression and never a blocker. The stage is the unit of completeness: this verdict grades the stage, never the dispatch — the worker dispatches again and again until it claims the stage or its time is spent, and only a claim that passed the stage's proof reaches you. A stage flips to done only on such a claim, verified in the tree; then closed-stage names it and the brief moves to the next open stage. In the baseline review (before any work), verify that the stages cover every Done-when goal of the task file (read it with your tools) and block any uncovered goal as a blocker on the last stage. Absent only when the plan carries no stages."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no step in any blocker has status open (advisory notes, deferred steps and dropped steps may still exist); revise when at least one step is open. A step the owner deferred or dropped never keeps status at revise."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "stage"
description = "One stage of the plan: an id, the goal that defines it, its mechanical proof, and whether it commits."

[schema.fields.commit]
schema = "schema:boolean"
required = true
description = "Whether the tree is committed when this stage is done: true where the tree is in a state that may be committed (it compiles and its proof passed), false inside a dark window where old and new cannot coexist yet. The atomic-stage rule of the task: commit only where the whole tree compiles."

[schema.fields.goal]
schema = "schema:text"
required = true
description = "What must be observable when this stage is done, taken from the task's Done-when. A goal is the only requirement of its stage."

[schema.fields.id]
schema = "schema:text"
required = true
description = 'Short kebab-case slug naming the stage, stable for the whole run (e.g. "resolver", "flip-context", "delete-old").'

[schema.fields.proof]
schema = "schema:text"
required = true
description = "The mechanical floor of the stage: one shell command line (sh -c) that exits 0 exactly when the stage's observable requirements that a command can check hold — a compile, named test suites, greps that must come back empty, a gate script — run from the repository root by the runtime whenever the worker claims the stage complete. It is what green means for THIS stage and nothing more: a stage in the middle of a cutover whose tree cannot compile until later stages names only greps; the stage where the tree compiles again names the build. Everything a command cannot check (semantics, design, plan conformance) is the reviewer's, graded against the goal. The literal 'none' when nothing mechanical applies; such a stage's claims go straight to review."

[[schema]]
id = "stage-status"
description = "One plan stage in the verdict's ledger: id, whether its goal holds, the evidence, and the owner's ruling on it when one exists."

[schema.fields.evidence]
schema = "schema:text"
required = true
description = "Why the status is what it is: what you ran or read. Empty only for a stage nobody has reached yet."

[schema.fields.id]
schema = "schema:text"
required = true
description = "The stage id exactly as the plan's stages list names it."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note on this stage, verbatim, when one exists (an order to start it now, to treat it as done, to change its goal). Applied by the reviewer and carried verbatim."

[schema.fields.status]
schema = "schema:text"
required = true
description = "done only when the worker claimed the stage complete, the stage's proof passed, and you verified with your own tools that the stage's goal is observable in the working tree; open otherwise. A done stage whose goal stops holding goes back to open, with the evidence that shows it — that is the only kind of regression there is."
allowed = [
    "open",
    "done",
]

[[schema]]
id = "work-report"
description = "The worker's report on one dispatch: what changed and was verified, whether the stage is claimed complete, what the next dispatch does first, and what blocks the work."

[schema.fields.blocked]
schema = "schema:text"
required = true
description = "The one thing you cannot resolve from inside this run — a contradiction between the plan and the code, a decision only the owner can make, a missing credential — in one or two sentences; the empty string when nothing blocks you. A non-empty value ends the work loop early and goes to the reviewer, who answers it or puts it to the owner. Never difficulty, size, or a red tree: those are the work."

[schema.fields.claim]
schema = "schema:text"
required = true
description = "complete when you verified with your own tools that the stage goal in your brief holds in the working tree: the runtime then runs the stage's proof and, when it passes, the reviewer grades the claim. in-progress when the goal does not yet hold: the next dispatch continues from your report, and nothing is graded. A red tree is not a reason to stop or to claim — the brief's proof says what green means for this stage. Claim only what you verified: a false claim costs a proof run and a review and comes back as the same open step."
allowed = [
    "complete",
    "in-progress",
]

[schema.fields.next]
schema = "schema:text"
required = true
description = "For the next dispatch: what to do first, in one or two sentences — the handoff note that lets a fresh dispatch continue instead of re-deriving. The empty string when the claim is complete."

[schema.fields.summary]
schema = "schema:text"
required = true
description = "What this dispatch changed and what it verified: files and symbols, commands run and their observed results, deviations from the plan's approach and why. The reviewer reads this beside the diff; the next dispatch reads it as its only memory of this one."

[[signal]]
id = "needs-owner"
description = "The run cannot proceed without an owner decision; parks on a summons the owner answers inside the run."
schema = "schema:needs-owner-payload"

[[agent]]
id = "scribe"
description = "Commit & Summary Writing; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "smart"
description = "Plan Drafting and Review"
summary = "Review role."

[[agent.intent.avoid]]
id = "taste-only-blocking"

[[agent.intent.avoid]]
id = "tail-case-pursuit"

[[agent.intent.avoid]]
id = "rubber-stamp-review"

[[agent.intent.avoid]]
id = "unbounded-loop"

[[agent]]
id = "worker"
description = "Implementation Work"
summary = "Implementation role."

[[agent.intent.require]]
id = "preserve-scope"

[[agent.intent.require]]
id = "review-before-final"

[prompt.apply-the-owner-s-annotations]
text = """
The owner annotated your verdict at the gate: {slot:gate-answer}.
Each annotation carries the exact surface text it was made on (raw) and the owner's note (text); the surface was a verbatim copy of the verdict, so raw locates the item.
Apply every annotation to your current verdict (attached as input) against the plan {slot:draft}. Annotations are binding edits, never arguments: where you disagree, apply it and say so in the advisory. The brief follows the applied ledger.

Return the same verdict, edited, with one disposition per annotation: (slot:review-verdict-1)."""
input = [
    "slot:gate-answer",
    "slot:draft",
]
output = ["slot:review-verdict-1"]

[prompt.draft-the-implementation-plan]
text = """
Draft the implementation plan for {port:task}, read it and the relevant code with your tools.
The owner's corrections to the previous draft, when present, are binding: {slot:plan-answer}"""
input = ["port:task"]
output = ["slot:draft"]

[prompt.implement-the-stage]
text = """
Implement the plan: {slot:draft}.
Your work now: {slot:brief}.
Your previous report on this stage, if any: {slot:work-report}.
What the stage's proof said about your last claim, if you made one: {slot:proof-result}.

Return your report on this dispatch: slot:work-report"""
input = [
    "slot:draft",
    "slot:brief",
]
output = ["slot:work-report"]

[prompt.notify-digest-verdict]
text = """
Digest this review verdict for the owner's phone: {slot:review-verdict-1}.
The worker's report the verdict graded: {slot:work-report}.
Follow each output field's own description exactly; the fields feed
notification commands verbatim."""
input = [
    "slot:review-verdict-1",
    "slot:work-report",
]
output = ["slot:notify-digest"]

[prompt.plan-digest]
text = """
Digest this drafted plan for the owner's annotation pass: {slot:draft}.
Follow the output field's own description exactly."""
input = ["slot:draft"]
output = ["slot:plan-digest"]

[prompt.record-the-owner-s-ruling]
text = """
The owner answered a summons raised during this run.
The question put to the owner: {signal:needs-owner.question}
Why it needed the owner: {signal:needs-owner.reason}
The owner's answer: {slot:summon-the-owner}
Write exactly ONE entry recording this ruling — the question and what the owner decided, in one or two sentences, no preamble."""
input = ["slot:summon-the-owner"]
output = ["slot:owner-decisions"]

[prompt.review-the-claim]
text = """
  Review the working tree against the plan {slot:draft} as source of truth; the task file is what the plan must cover, read it with your tools.
  The worker's report on its latest dispatch: {slot:work-report}. What the stage's proof said about its claim, when it made one: {slot:proof-result}. Changed files: {slot:changed-files}.
  Your previous verdict, the ledger you carry forward: {slot:review-verdict-1}. The second reviewer's verdict, if any: {slot:review-verdict-2}.

Owner rulings already made in this run (if any): {slot:owner-decisions} — they are settled; never reopen one. Decide what you can decide yourself and record the decision and its reason in the verdict; a decided question is never a blocker.

    Return the typed review verdict: (slot:review-verdict-1).
  
Separately: for any contradiction or question only the owner can answer, emit {signal:needs-owner}."""
input = [
    "slot:draft",
    "slot:work-report",
    "slot:changed-files",
]
output = ["slot:review-verdict-1"]

[prompt.review-the-tree-before-any-work]
text = """
Before any work: review the working tree against the plan {slot:draft} as source of truth; the task file is what the plan must cover, read it with your tools.
Produce the opening verdict: the stage ledger with every stage open unless its goal already holds in the tree, the blockers and steps that stand between the tree and the first open stage's goal (each step with its frozen done-when), and the brief.
Owner rulings already made in this run (if any): {slot:owner-decisions} — they are settled; never reopen one.

Return the typed review verdict: (slot:review-verdict-1)."""
input = ["slot:draft"]
output = ["slot:review-verdict-1"]

[prompt.summon-the-owner]
text = """
This run cannot settle a question on its own and is parked until you answer.
Why only you can settle it: {signal:needs-owner.reason}
The question: {signal:needs-owner.question}
Answer in one or two sentences — the run resumes with your answer as evidence."""
output = ["slot:summon-the-owner"]

[prompt.write-the-commit-message]
text = """
The work for {port:task} is being committed.
Write a concise commit message from the worker's latest report, when there is one: {slot:work-report}.
Owner rulings made during this run (if any): {slot:owner-decisions} — when one shaped the work, cite what the owner decided in the message body.

Return exactly the finished commit message into (slot:commit-message)."""
input = ["port:task"]
output = ["slot:commit-message"]

[prompt.write-the-stage-commit-message]
text = """
A stage of the plan is done and its tree is being committed: {slot:closed-stage}.
Write a concise commit message for this stage from the worker's report {slot:work-report}: first line "<stage id>: <what the stage established>", then the body.

Return exactly the finished commit message into (slot:commit-message)."""
input = [
    "slot:closed-stage",
    "slot:work-report",
]
output = ["slot:commit-message"]

