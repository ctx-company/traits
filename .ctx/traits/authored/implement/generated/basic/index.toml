[sequence.ctx-branch-arm-s-19-work-the-stage-body-7-claimed-then.sequence.command]
argv = [
    "sh",
    "-c",
    '''
case "$1" in
  none|"") printf pass; exit 0 ;;
esac
out=$(sh -c "$1" 2>&1)
code=$?
if [ "$code" -eq 0 ]; then
  printf pass
else
  printf 'fail (exit %s)\n%s' "$code" "$(printf '%s' "$out" | tail -c 6000)"
fi''',
    "_",
    "{slot:proof-command}",
]
timeout-ms = 2700000
idle-timeout-ms = 2700000

