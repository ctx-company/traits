id = "implement"
schema-version = "0.6"
version = "0.26.0"
name = "Basic"
description = "Reviewed implementation: plan, then walk the steps — work each until done or blocked, review, repeat until the list is empty."
variant = "basic"

[metadata]
tag = [
    "implementation",
    "review",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"

[[intent.require]]
id = "pragmatism"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "contract-ceiling"

[[intent.require]]
id = "representative-proof"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "duplication"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "owner-gate"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner annotation transport for the step list: 'annotate' (default) pipes each pass's surface to ctx-annotate; 'off' auto-accepts for unattended runs."

[port.default]
value = "annotate"

[[port]]
id = "owner-ruling"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner summons transport: 'on' (default) parks the run on reviewer-raised owner questions; 'off' skips the summons branch for unattended runs — escalations stay in the step's resolution for morning review."

[port.default]
value = "on"

[[port]]
id = "plan-gate"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner annotation transport for the drafted plan before any work: 'annotate' (default) pipes the plan surface to ctx-annotate and redrafts with corrections until accepted; 'off' auto-accepts for unattended runs."

[port.default]
value = "annotate"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = 'Task to implement, named by its file in .internal/tasks/ — the key ("0044" or "0044.2"), the full name, or the filename.'

[[slot]]
id = "commit-log"
schema = "schema:text"
description = "Throwaway capture of the commit command's own output — never gates anything."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Commit message for the current progress commit; injected directly into the git commit command step."

[[slot]]
id = "diff-base"
schema = "schema:text"
description = "Commit the session started from — a fixed anchor the reviewer can diff against with its own tools."
hint = "git rev-parse HEAD captured before any work; commits during the loop never move it."

[[slot]]
id = "gate-answer"
schema = "schema:text"
description = "The owner's verdict-gate outcome: the literal 'accepted' when the owner had no annotations (or the gate is off); otherwise the ctx-annotate decision JSON. Each annotation carries `raw` (the exact surface text annotated) and `text` (the note). Annotations are binding edits to the step list: the reviewer applies them on the next pass."

[[slot]]
id = "gate-surface"
schema = "schema:text"
description = "The digest's annotation surface, carried as text for the gate command."

[[slot]]
id = "git-status"
schema = "schema:text"
description = "Working-tree status captured before the commit tail: git status --porcelain output verbatim."

[[slot]]
id = "notify-badge"
schema = "schema:text"
description = "The digest's badge field, carried as text for command argv."

[[slot]]
id = "notify-digest"
schema = "schema:notify-digest"
description = "Scribe's per-pass digest of the step list, fed directly into the notification commands."

[[slot]]
id = "notify-id"
schema = "schema:text"
description = "The owner-notification activity id, exactly as `begin` printed it — every later notification step addresses this."

[[slot]]
id = "notify-journal"
schema = "schema:text"
description = "The digest's journal field, carried as text for command argv."

[[slot]]
id = "notify-log"
schema = "schema:text"
description = "The notifier's own JSON receipt for the most recent notification command."

[[slot]]
id = "notify-summary"
schema = "schema:text"
description = "The digest's summary field, carried as text for command argv."

[[slot]]
id = "owner-decisions"
schema = "[schema:text]"
description = "Every owner ruling made during this run — one entry per summons — the run's durable decision record, carried into the commit message."
hint = "One entry per ruling: the question put to the owner and the owner's answer in one or two sentences."

[[slot]]
id = "plan"
schema = "schema:implementation-plan"
description = "The implementation plan the reviewer turns into open steps and the worker implements."

[[slot]]
id = "plan-answer"
schema = "schema:text"
description = "The owner's plan-gate outcome: the literal 'accepted' when the owner had no annotations (or the gate is off); otherwise the ctx-annotate decision JSON. Annotations are binding corrections: the plan is drafted again with them until accepted."

[[slot]]
id = "plan-digest"
schema = "schema:plan-digest"
description = "Scribe's digest of the drafted plan into the owner's annotation surface."

[[slot]]
id = "plan-surface"
schema = "schema:text"
description = "The plan digest's surface, carried as text for the gate command."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git add command step."

[[slot]]
id = "steps"
schema = "[schema:step]"
description = "The open steps the worker still has to do, in order, written by the reviewer. The for-each walks it; an empty list means the reviewer found nothing open — the task is done."

[[slot]]
id = "summon-the-owner"
schema = "schema:text"
description = "Runtime slot summon-the-owner."

[[slot]]
id = "work-report"
schema = "schema:step-return"
description = "The worker's return on its latest dispatch: the step's status and what the dispatch did."

[[slot]]
id = "work-the-steps-item"
schema = "schema:step"
description = "Per-item value for the work-the-steps loop."

[[resource]]
id = "task-board"
path = ".internal/tasks"
root = "repo"
hint = "Repo-root directory for the task board."
trigger = "on-demand"

[[schema]]
id = "blocker-resolution"
description = "A blocked step's resolution: the blocker, the reviewer's decision, and the executable approach that follows from it."

[schema.fields.approach]
schema = "schema:text"
required = true
description = "The concrete method that follows from the decision: the specific move the next dispatch makes — files, call sites, the shape of the change. Never a bare 'proceed'."

[schema.fields.blocker]
schema = "schema:text"
required = true
description = "What the worker could not get past, in one sentence — restated from its blocked return."

[schema.fields.decision]
schema = "schema:text"
required = true
description = "The reviewer's ruling that unblocks it: what holds, what to stop trying, which way to go — a decision, not a restatement of the problem."

[[schema]]
id = "implementation-plan"
description = "smart's implementation plan for the task — an actionable plan, not an implementation."

[schema.fields.approach]
schema = "schema:text"
required = true
description = "The suggested route: files to touch, symbols, edit order, reuse opportunities. Guidance the worker may deviate from in service of a goal, reporting the deviation."

[schema.fields.risks]
schema = "schema:text"
required = true
description = "What could go wrong and how the route mitigates it."

[schema.fields.scope]
schema = "schema:text"
required = true
description = "The task's scope restated from the task file: what is in, what is explicitly out."

[schema.fields.stages]
schema = "[schema:stage]"
required = true
description = "The plan as an ordered list of stages, each an id and a goal. Nothing else is required of a stage while it is open: whatever a later stage's goal covers may be in any state until that stage, and that is neither a defect nor a regression. The plan must be ACTIONABLE for this run — a stage that cannot be done as written is a plan error, surfaced as blocked steps and revised, never ground against. When the task declares itself an atomic cutover that only compiles as one unit, honor that: do not carve it into stages that each demand a green intermediate. Together the stages must cover every Done-when goal of the task."

[[schema]]
id = "needs-owner-payload"
description = "Why only the owner can settle this, and the one question that unblocks the run."

[schema.fields.question]
schema = "schema:text"
required = true
description = "The single question to put to the owner, phrased so one short answer unblocks the run. Name the options you see and what you would do absent an answer."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "Why only the owner can settle this: the contradiction, the missing authority, or the trade-off the run has no standing to decide. Grounded in what you verified, not a restatement of the question."

[[schema]]
id = "notify-digest"
description = "The step list digested for the owner notification thread."

[schema.fields.badge]
schema = "schema:text"
required = true
description = 'Short status badge, 64 characters at most: "review: <N> open" while steps remain, or "review: done" when the step list is empty.'

[schema.fields.journal]
schema = "schema:text"
required = true
description = 'Exactly "steps: <O> open • <B> blocked" and NOTHING else — O counts open steps in the list, B counts steps carrying a resolution (previously blocked). No prose, no step text.'

[schema.fields.summary]
schema = "schema:text"
required = true
description = """Two to four plain sentences for the owner's phone: how many steps are open, what closed this pass, whether any step is blocked, and where the run is heading. NEVER the empty string — when the list is empty, exactly "done — no steps open"."""

[schema.fields.surface]
schema = "schema:text"
required = true
description = "The owner's annotation surface: one line 'STEPS: <O> open' then every open step COPIED VERBATIM as numbered plain lines — 'n. [<stage>] <operation> — done-when: <done-when>', with ' — resolution: <decision>' appended when the step carries one. Fidelity to the step list is the only requirement; each annotation returns carrying the exact text it was made on."

[[schema]]
id = "plan-digest"
description = "The drafted plan digested for the owner's annotation pass."

[schema.fields.surface]
schema = "schema:text"
required = true
description = "The owner's plan surface: the plan COPIED VERBATIM as plain numbered lines: 'SCOPE:' then the scope; 'STAGES:' then one line per stage as '<id>: <goal>' in order; 'APPROACH:' then the approach; 'RISKS:' then the risks."

[[schema]]
id = "stage"
description = "One stage of the plan: an id and the goal that defines it."

[schema.fields.goal]
schema = "schema:text"
required = true
description = "What must be observable when this stage is done, taken from the task's Done-when. A goal is the only requirement of its stage."

[schema.fields.id]
schema = "schema:text"
required = true
description = 'Short kebab-case slug naming the stage, stable for the whole run (e.g. "resolver", "flip-context", "delete-old").'

[[schema]]
id = "step"
description = "One open step: its stage, the operation, the acceptance it is graded against, and the reviewer's resolution when it was previously blocked."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "The falsifiable acceptance for THIS step: a check the worker can run itself (a grep that must come back empty, a test that must pass, a call site that must route through X) or one precise observable sentence. What it does not ask for is not asked here; more is a NEW step."

[schema.fields.operation]
schema = "schema:text"
required = true
description = "One imperative, concrete operation — what to create and what it owns, what to route, what must cease to exist. A destination is not a step; the operation that reaches it is."

[schema.fields.resolution]
schema = "schema:blocker-resolution"
description = "Present only when a prior pass returned this step blocked and the reviewer resolved it: the decision + approach the next dispatch works from. Absent for a fresh step."

[schema.fields.stage]
schema = "schema:text"
required = true
description = "The plan stage this step belongs to (its id), so the list keeps the plan's order and grouping."

[[schema]]
id = "step-return"
description = "The worker's report on one dispatch of one step: its status and what it did."

[schema.fields.status]
schema = "schema:text"
required = true
description = "done when you verified this step's done-when holds in the tree with your own tools; blocked when you cannot proceed on it from inside this run (a real contradiction, a decision only the owner can make) — never difficulty or a red tree; not-done when you made progress but it does not yet hold, and the next dispatch should continue the SAME step. Claim only what you verified: a false 'done' comes back as the same open step."
allowed = [
    "done",
    "blocked",
    "not-done",
]

[schema.fields.summary]
schema = "schema:text"
required = true
description = "What this dispatch changed and verified — files and symbols, commands run and their observed results. When status is blocked, state precisely what blocks it and why. The next dispatch reads this as its only memory of this one."

[[signal]]
id = "needs-owner"
description = "The run cannot proceed without an owner decision; parks on a summons the owner answers inside the run."
schema = "schema:needs-owner-payload"

[[agent]]
id = "scribe"
description = "Commit & Summary Writing; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "smart"
description = "Plan Drafting and Review"
summary = "Review role."

[[agent.intent.avoid]]
id = "taste-only-blocking"

[[agent.intent.avoid]]
id = "tail-case-pursuit"

[[agent.intent.avoid]]
id = "rubber-stamp-review"

[[agent.intent.avoid]]
id = "unbounded-loop"

[[agent]]
id = "worker"
description = "Implementation Work"
summary = "Implementation role."

[[agent.intent.require]]
id = "preserve-scope"

[[agent.intent.require]]
id = "review-before-final"

[prompt.apply-the-owner-s-annotations]
text = """
The owner annotated the step list at the gate: {slot:gate-answer}. Each annotation carries the exact surface text it was made on (raw) and the owner's note (text); the surface was a verbatim copy of the step list, so raw locates the step.
Apply every annotation to the open step list attached as input — binding edits, never arguments: reorder, rewrite, add, or drop steps as the notes direct; where you disagree, apply it anyway.

Return the edited open step list: (slot:steps)."""
input = ["slot:gate-answer"]
output = ["slot:steps"]

[prompt.draft-the-implementation-plan]
text = """
Draft the implementation plan for {port:task}; read it and the relevant code with your tools.
The owner's corrections to the previous draft, when present, are binding: {slot:plan-answer}"""
input = ["port:task"]
output = ["slot:plan"]

[prompt.implement-the-step]
text = """
Implement the plan: {slot:plan}.
Your current step — do exactly this and nothing beyond it: {slot:work-the-steps-item}.
Your previous return on this step, if any: {slot:work-report}.
Return your status for THIS step: done only when you verified the step's done-when holds in the working tree with your own tools; blocked only for something you genuinely cannot resolve from inside this run — a contradiction between the plan and the code, a decision only the owner can make — never difficulty, size, or a red tree; not-done when you made real progress but the done-when does not yet hold, so the next dispatch continues the SAME step. When the step carries a resolution, that is the reviewer's decision and the approach to take — follow it. A red tree is the work, not a reason to stop or to claim done."""
input = [
    "slot:plan",
    "slot:work-the-steps-item",
]
output = ["slot:work-report"]

[prompt.notify-digest-verdict]
text = """
Digest the open step list for the owner's phone: {slot:steps}.
Follow each output field's own description exactly; the fields feed
notification commands verbatim."""
input = ["slot:steps"]
output = ["slot:notify-digest"]

[prompt.open-the-step-list]
text = """
Before any work: read the plan {slot:plan}, and with your own tools the task file it covers and the current working tree.
Open the step list: an ordered list of concrete, actionable steps that, done, satisfy the plan's stages in order. Each step names its stage, ONE operation, and a falsifiable done-when. Front-load the first stage; do not enumerate steps that depend on work not yet done — you extend the list as the work reveals it. A step whose done-when already holds in the tree is not listed. If the plan is not actionable as written — a stage cannot be done as specified — make the earliest step the operation that surfaces or resolves that, so the first pass hits it rather than grinding.

Return the open step list: (slot:steps)."""
input = ["slot:plan"]
output = ["slot:steps"]

[prompt.plan-digest]
text = """
Digest this drafted plan for the owner's annotation pass: {slot:plan}.
Follow the output field's own description exactly."""
input = ["slot:plan"]
output = ["slot:plan-digest"]

[prompt.record-the-owner-s-ruling]
text = """
The owner answered a summons raised during this run.
The question put to the owner: {signal:needs-owner.question}
Why it needed the owner: {signal:needs-owner.reason}
The owner's answer: {slot:summon-the-owner}
Write exactly ONE entry recording this ruling — the question and what the owner decided, in one or two sentences, no preamble."""
input = ["slot:summon-the-owner"]
output = ["slot:owner-decisions"]

[prompt.review-the-stage]
text = """
A for-each pass just walked the open steps (attached as input). Validate the working tree YOURSELF with your own tools against the plan {slot:plan} — there is no proof, and the worker's word is not evidence. The worker's last return: {slot:work-report}. Owner rulings already made this run: {slot:owner-decisions} — settled, never reopened.
Rewrite the open step list for the next pass:
- DROP every step whose done-when you verified holds in the tree. Carry none forward; a re-added acceptance is a NEW step.
- KEEP a step whose done-when does not yet hold.
- For a step the worker could not get past, attach a resolution — the blocker, your decision, and the concrete approach the next dispatch takes — never a bare "proceed". Only when the blocker is something ONLY the owner can settle, leave the step open and raise it to the owner instead of resolving it yourself.
- APPEND genuinely new steps the work revealed, in order, prerequisites first; ADVANCE to the next stage's steps once the current stage's goal holds.
Leave the list EMPTY only when every stage's goal holds in the tree — an empty list is your confirmation that the task is done.

    Return the revised open step list: (slot:steps).
  
Separately: for a blocker only the owner can settle, emit {signal:needs-owner}."""
input = ["slot:plan"]
output = ["slot:steps"]

[prompt.summon-the-owner]
text = """
This run cannot settle a question on its own and is parked until you answer.
Why only you can settle it: {signal:needs-owner.reason}
The question: {signal:needs-owner.question}
Answer in one or two sentences — the run resumes with your answer as evidence."""
output = ["slot:summon-the-owner"]

[prompt.write-the-commit-message]
text = """
The work for {port:task} is being committed.
Write a concise commit message from the worker's latest report, when there is one: {slot:work-report}.
Owner rulings made during this run (if any): {slot:owner-decisions} — when one shaped the work, cite what the owner decided in the message body.

Return exactly the finished commit message into (slot:commit-message)."""
input = ["port:task"]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-12-work-remains-then.sequence]]
id = "review-loop"
title = "Review loop"
kind = "loop"
sequence = "sequence:review-loop-body"

[[sequence.ctx-branch-arm-p-12-work-remains-then.sequence.until.all]]

[sequence.ctx-branch-arm-p-12-work-remains-then.sequence.until.all.not.not]
empty = "slot:steps"

[[sequence.ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then.sequence]]
id = "owner-reachable"
title = "Owner reachable"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-57-ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then-15-owner-reachable-then"

[sequence.ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then.sequence.when.not]
slot = "port:owner-ruling"
equals = "off"

[[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence]]
id = "notify-committed"
title = "Notify: committed"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "Commit the progress",
]

[[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence]]
id = "write-the-commit-message"
title = "Write the commit message"
agent = "agent:scribe"
prompt = "prompt:write-the-commit-message"
input = [
    "port:task",
    { slot = "slot:work-report", optional = true },
    { slot = "slot:owner-decisions", optional = true },
]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence]]
id = "stage-all-changes"
title = "Stage all changes"
output = ["slot:stage-output"]

[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
]

[[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence]]
id = "commit-the-progress"
title = "Commit the progress"
input = ["slot:commit-message"]
output = ["slot:commit-log"]

[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence.command]
argv = [
    "sh",
    "-c",
    'if git diff --quiet && git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "$1" && echo committed; fi',
    "_",
    "{slot:commit-message}",
]

[[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence]]
id = "move-the-task-branch"
title = "Move the task branch"
input = ["port:task"]
output = ["slot:commit-log"]

[sequence.ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then.sequence.command]
argv = [
    "sh",
    "-c",
    'git branch -f "ctx/task/$1" HEAD && echo "ctx/task/$1 -> $(git rev-parse --short HEAD)"',
    "_",
    "{port:task}",
]

[[sequence.ctx-branch-arm-s-16-review-loop-body-15-owner-annotated-then.sequence]]
id = "apply-the-owner-s-annotations"
title = "Apply the owner's annotations"
agent = "agent:smart"
prompt = "prompt:apply-the-owner-s-annotations"
input = [
    "slot:gate-answer",
    { slot = "slot:steps", optional = true },
]
output = ["slot:steps"]

[[sequence.ctx-branch-arm-s-16-review-loop-body-23-record-the-owner-ruling-then.sequence]]
id = "gate-append-ruling"
title = "Record the owner ruling: append"
kind = "project"
input = ["slot:gate-answer"]

[[sequence.ctx-branch-arm-s-16-review-loop-body-23-record-the-owner-ruling-then.sequence.projection]]
source = "slot:gate-answer"
destination = "slot:owner-decisions"
operation = "append"

[[sequence.ctx-branch-arm-s-16-review-loop-body-23-record-the-owner-ruling-then.sequence.output]]
slot = "slot:owner-decisions"
operation = "append"

[[sequence.ctx-branch-arm-s-18-plan-approval-body-34-record-the-owner-s-plan-correction-then.sequence]]
id = "plan-append-ruling"
title = "Record the owner's plan correction: append"
kind = "project"
input = ["slot:plan-answer"]

[[sequence.ctx-branch-arm-s-18-plan-approval-body-34-record-the-owner-s-plan-correction-then.sequence.projection]]
source = "slot:plan-answer"
destination = "slot:owner-decisions"
operation = "append"

[[sequence.ctx-branch-arm-s-18-plan-approval-body-34-record-the-owner-s-plan-correction-then.sequence.output]]
slot = "slot:owner-decisions"
operation = "append"

[[sequence.ctx-branch-arm-s-57-ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then-15-owner-reachable-then.sequence]]
id = "summon-the-owner"
title = "Summon the owner"
kind = "ask"
prompt = "prompt:summon-the-owner"
output = ["slot:summon-the-owner"]
when = "signal:needs-owner"

[[sequence.ctx-branch-arm-s-57-ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then-15-owner-reachable-then.sequence]]
id = "record-the-owner-s-ruling"
title = "Record the owner's ruling"
agent = "agent:scribe"
prompt = "prompt:record-the-owner-s-ruling"
input = ["slot:summon-the-owner"]

[[sequence.ctx-branch-arm-s-57-ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then-15-owner-reachable-then.sequence.output]]
slot = "slot:owner-decisions"
operation = "append"

[[sequence.plan-approval-body.sequence]]
id = "draft-the-implementation-plan"
title = "Draft the implementation plan"
agent = "agent:smart"
prompt = "prompt:draft-the-implementation-plan"
input = [
    "port:task",
    { slot = "slot:plan-answer", optional = true },
]
output = ["slot:plan"]

[[sequence.plan-approval-body.sequence]]
id = "plan-digest"
title = "Digest the plan for annotation"
agent = "agent:scribe"
prompt = "prompt:plan-digest"
input = ["slot:plan"]
output = ["slot:plan-digest"]

[[sequence.plan-approval-body.sequence]]
id = "plan-carry-surface"
title = "Carry the plan surface"
kind = "project"
input = ["slot:plan-digest"]
output = ["slot:plan-surface"]

[[sequence.plan-approval-body.sequence.projection]]
source = "slot:plan-digest"
field = "surface"
destination = "slot:plan-surface"

[[sequence.plan-approval-body.sequence]]
id = "owner-plan-gate"
title = "Annotate the plan"
input = [
    "slot:plan-surface",
    "port:plan-gate",
]
output = ["slot:plan-answer"]

[sequence.plan-approval-body.sequence.command]
argv = [
    "sh",
    "-c",
    """
if [ "$2" = "off" ]; then
  printf accepted
  exit 0
fi
out=$(printf '%s' "$1" | ctx-annotate --stdin --raw)
case "$out" in
  *'"annotations":[]'*) printf accepted ;;
  "") printf 'annotation gate returned no decision; not accepted' ;;
  *) printf '%s' "$out" ;;
esac""",
    "_",
    "{slot:plan-surface}",
    "{port:plan-gate}",
]
timeout-ms = 14400000
idle-timeout-ms = 14400000
terminal = true

[[sequence.plan-approval-body.sequence]]
id = "record-the-owner-s-plan-correction"
title = "Record the owner's plan correction"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-18-plan-approval-body-34-record-the-owner-s-plan-correction-then"

[sequence.plan-approval-body.sequence.when.not]
slot = "slot:plan-answer"
equals = "accepted"

[[sequence.review-loop-body.sequence]]
id = "notify-working-the-steps"
title = "Notify: working the steps"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[sequence.review-loop-body.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "Working the steps",
]

[[sequence.review-loop-body.sequence]]
id = "work-the-steps"
title = "Work the steps"
kind = "for-each"
sequence = "sequence:work-the-steps-body"
over = "slot:steps"
item = "slot:work-the-steps-item"

[[sequence.review-loop-body.sequence]]
id = "review-the-stage"
title = "Review the stage"
agent = "agent:smart"
prompt = "prompt:review-the-stage"
input = [
    "slot:plan",
    { slot = "slot:work-report", optional = true },
    { slot = "slot:owner-decisions", optional = true },
    { slot = "slot:steps", optional = true },
]
output = ["slot:steps"]
on-complete = ["signal:needs-owner"]

[[sequence.review-loop-body.sequence]]
id = "notify-digest-verdict"
title = "Notify: review verdict: digest the verdict"
agent = "agent:scribe"
prompt = "prompt:notify-digest-verdict"
input = ["slot:steps"]
output = ["slot:notify-digest"]

[[sequence.review-loop-body.sequence]]
id = "notify-carry-digest"
title = "Notify: review verdict: carry the digest"
kind = "project"
input = ["slot:notify-digest"]
output = [
    "slot:notify-badge",
    "slot:notify-summary",
    "slot:notify-journal",
]

[[sequence.review-loop-body.sequence.projection]]
source = "slot:notify-digest"
field = "badge"
destination = "slot:notify-badge"

[[sequence.review-loop-body.sequence.projection]]
source = "slot:notify-digest"
field = "summary"
destination = "slot:notify-summary"

[[sequence.review-loop-body.sequence.projection]]
source = "slot:notify-digest"
field = "journal"
destination = "slot:notify-journal"

[[sequence.review-loop-body.sequence]]
id = "notify-review-update"
title = "Notify: review verdict"
input = [
    "slot:notify-id",
    "slot:notify-badge",
    "slot:notify-summary",
]
output = ["slot:notify-log"]

[sequence.review-loop-body.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "{slot:notify-badge}",
    "--summary",
    "{slot:notify-summary}",
]

[[sequence.review-loop-body.sequence]]
id = "notify-review-journal"
title = "Notify: review verdict: journal"
input = [
    "slot:notify-id",
    "slot:notify-journal",
]
output = ["slot:notify-log"]

[sequence.review-loop-body.sequence.command]
argv = [
    "ctx-notify",
    "log",
    "{slot:notify-id}",
    "{slot:notify-journal}",
]

[[sequence.review-loop-body.sequence]]
id = "notify-awaiting-annotations"
title = "Notify: awaiting annotations"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[sequence.review-loop-body.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "awaiting owner annotations",
]

[[sequence.review-loop-body.sequence]]
id = "gate-carry-surface"
title = "Carry the annotation surface"
kind = "project"
input = ["slot:notify-digest"]
output = ["slot:gate-surface"]

[[sequence.review-loop-body.sequence.projection]]
source = "slot:notify-digest"
field = "surface"
destination = "slot:gate-surface"

[[sequence.review-loop-body.sequence]]
id = "owner-verdict-gate"
title = "Annotate the verdict"
input = [
    "slot:gate-surface",
    "port:owner-gate",
]
output = ["slot:gate-answer"]

[sequence.review-loop-body.sequence.command]
argv = [
    "sh",
    "-c",
    """
if [ "$2" = "off" ]; then
  printf accepted
  exit 0
fi
out=$(printf '%s' "$1" | ctx-annotate --stdin --raw)
case "$out" in
  *'"annotations":[]'*) printf accepted ;;
  "") printf 'annotation gate returned no decision; not accepted' ;;
  *) printf '%s' "$out" ;;
esac""",
    "_",
    "{slot:gate-surface}",
    "{port:owner-gate}",
]
timeout-ms = 14400000
idle-timeout-ms = 14400000
terminal = true

[[sequence.review-loop-body.sequence]]
id = "record-the-owner-ruling"
title = "Record the owner ruling"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-16-review-loop-body-23-record-the-owner-ruling-then"

[sequence.review-loop-body.sequence.when.not]
slot = "slot:gate-answer"
equals = "accepted"

[[sequence.review-loop-body.sequence]]
id = "notify-gate-result"
title = "Notify: owner ruling"
input = [
    "slot:notify-id",
    "slot:gate-answer",
]
output = ["slot:notify-log"]

[sequence.review-loop-body.sequence.command]
argv = [
    "ctx-notify",
    "log",
    "{slot:notify-id}",
    "{slot:gate-answer}",
]

[[sequence.review-loop-body.sequence]]
id = "owner-annotated"
title = "Owner annotated"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-16-review-loop-body-15-owner-annotated-then"

[sequence.review-loop-body.sequence.when.not]
slot = "slot:gate-answer"
equals = "accepted"

[[sequence.review-loop-body.sequence]]
id = "owner-ruling"
title = "Owner ruling"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-16-review-loop-body-12-owner-ruling-then"

[sequence.review-loop-body.sequence.when]
signal = "signal:needs-owner"

[[sequence.review-loop-body.sequence]]
id = "check-working-tree-status"
title = "Check working tree status"
output = ["slot:git-status"]

[sequence.review-loop-body.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[sequence.review-loop-body.sequence]]
id = "commit-progress"
title = "Commit progress"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-16-review-loop-body-15-commit-progress-then"

[sequence.review-loop-body.sequence.when.not]
empty = "slot:git-status"

[[sequence.work-the-step-body.sequence]]
id = "implement-the-step"
title = "Implement the step"
agent = "agent:worker"
prompt = "prompt:implement-the-step"
input = [
    "slot:plan",
    "slot:work-the-steps-item",
    { slot = "slot:work-report", optional = true },
]
output = ["slot:work-report"]

[[sequence.work-the-steps-body.sequence]]
id = "work-the-step"
title = "Work the step"
kind = "loop"
sequence = "sequence:work-the-step-body"

[[sequence.work-the-steps-body.sequence.until.all]]

[sequence.work-the-steps-body.sequence.until.all.not]
slot = "slot:work-report"
field = "status"
equals = "not-done"

[procedure]
description = "Reviewed implementation: plan, then walk the steps — work each until done or blocked, review, repeat until the list is empty."
input = [
    "port:owner-gate",
    "port:owner-ruling",
    "port:plan-gate",
    "port:task",
]

[[procedure.sequence]]
id = "notify-begin"
title = "Open the owner notification"
input = ["port:task"]
output = ["slot:notify-id"]

[procedure.sequence.command]
argv = [
    "ctx-notify",
    "begin",
    "{port:task}",
]

[[procedure.sequence]]
id = "notify-session-base"
title = "Notify: session base"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[procedure.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "Capture the session base",
]

[[procedure.sequence]]
id = "capture-the-session-base"
title = "Capture the session base"
output = ["slot:diff-base"]

[procedure.sequence.command]
argv = [
    "git",
    "rev-parse",
    "HEAD",
]

[[procedure.sequence]]
id = "notify-plan-drafted"
title = "Notify: plan drafted"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[procedure.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "Draft the implementation plan",
]

[[procedure.sequence]]
id = "plan-approval"
title = "Plan approval"
kind = "loop"
sequence = "sequence:plan-approval-body"

[[procedure.sequence.until.all]]
slot = "slot:plan-answer"
equals = "accepted"

[[procedure.sequence]]
id = "notify-baseline-review"
title = "Notify: baseline review"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[procedure.sequence.command]
argv = [
    "ctx-notify",
    "update",
    "{slot:notify-id}",
    "--status",
    "Open the step list",
]

[[procedure.sequence]]
id = "open-the-step-list"
title = "Open the step list"
agent = "agent:smart"
prompt = "prompt:open-the-step-list"
input = ["slot:plan"]
output = ["slot:steps"]

[[procedure.sequence]]
id = "work-remains"
title = "Work remains"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-12-work-remains-then"

[procedure.sequence.when.not]
empty = "slot:steps"

[[procedure.sequence]]
id = "notify-finish"
title = "Close the owner notification"
input = ["slot:notify-id"]
output = ["slot:notify-log"]

[procedure.sequence.command]
argv = [
    "ctx-notify",
    "finish",
    "--ok",
    "{slot:notify-id}",
]
