id = "implement"
schema-version = "0.4"
version = "0.25.0"
name = "Implement (Quick)"
description = "Single-pass implementation: the worker implements the board task in full — honoring its Watch and Done when — and the result is committed. No review loop."
variant = "quick"

[metadata]
tag = [
    "dogfood",
    "implementation",
    "review",
    "lean",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "scope-creep"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "commit-report"
direction = "output"
schema = "schema:text"
optional = true
description = "Final commit evidence from the git commit command step. Absent when the clean-tree gate (P397) skipped the commit tail entirely — a clean working tree at gate time means nothing to commit."
value = "slot:commit-output"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = 'Task to implement, named by its file in .internal/tasks/ — the key ("0044" or "0044.2"), the full name, or the filename.'

[[slot]]
id = "commit-output"
schema = "schema:text"
description = "Output evidence from the git commit command step: committed hash and subject."

[[slot]]
id = "shipping-message"
schema = "schema:text"
description = "The commit message the scribe writes for the completed work."

[[slot]]
id = "shipping-stage-output"
schema = "schema:text"
description = "Verbatim output of the git-add staging command."

[[slot]]
id = "shipping-status"
schema = "schema:text"
description = "Working-tree status captured immediately before the commit tail: git status --porcelain output verbatim."
hint = "Empty exactly when the tree is clean; the commit tail is skipped entirely in that case, so no commit is attempted and the scribe never runs."

[[slot]]
id = "shipping-unstage-output"
schema = "schema:text"
description = "Verbatim output of the runtime-state unstage command (git reset -- .agents/runs); empty when nothing was staged there."

[[slot]]
id = "work-summary"
schema = "schema:text"
description = "Worker's cumulative account of the implemented state, extended each round — the worker's cross-round memory."
hint = "Cumulative across rounds: your own summary from the previous round arrives as input — extend it, never restart it. Per round: what changed (files), how it was validated, open concerns, and per-blocker progress against the attached verdict."

[[agent]]
id = "scribe"
description = "Writes the commit message for the completed task from the work summary; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "worker"
description = "Implements the task and applies reviewer fixes."
summary = "Implementation role."

[prompt.implement-the-task]
text = """
Implement {port:task}.
    The task's file lives in .internal/tasks/ (matched by key, name, or filename) — read it with your tools; its content, scope, and validation sections are the contract. Honor Watch, and treat Done when as the definition of done: run the checks it names before reporting.
    No reviewer verdict attached means this is round 1: implement the task in full. On every later round a verdict IS attached and redefines your work: fix its blockers, largest first. Your own work summary from the previous round is your memory of what prior rounds did — extend it, never restart it.
    Never edit files under .internal/tasks/ — the task board is owner-maintained; a run records its progress in the work summary and the commit message, never in a task file.
    Return the cumulative work summary: what changed (files), how it was validated, open concerns."""
input = ["port:task"]
output = ["slot:work-summary"]

[prompt.shipping-message]
text = """
The work for {port:task} is being committed.
    Write a concise commit message from the work summary {slot:work-summary}: a short subject line naming the change, then one paragraph on what was implemented and how it was validated.
    Return exactly that message. Do not run git commands and do not write files."""
input = [
    "port:task",
    "slot:work-summary",
]
output = ["slot:shipping-message"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-message"
title = "Write the commit message (scribe)"
agent = "agent:scribe"
prompt = "prompt:shipping-message"
input = [
    "port:task",
    "slot:work-summary",
]
output = ["slot:shipping-message"]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-stage"
title = "Stage all changes"
output = ["slot:shipping-stage-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-unstage-runtime"
title = "Unstage runtime state"
output = ["slot:shipping-unstage-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "reset",
    "-q",
    "--",
    ".agents/runs",
]

[[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence]]
id = "shipping-commit"
title = "Commit the work"
input = ["slot:shipping-message"]
output = ["slot:commit-output"]

[sequence.ctx-branch-arm-p-21-shipping-maybe-commit-then.sequence.command]
argv = [
    "git",
    "commit",
    "-m",
    "{slot:shipping-message}",
]

[procedure]
description = "Single-pass implementation: the worker implements the board task in full — honoring its Watch and Done when — and the result is committed. No review loop."
input = ["port:task"]
output = ["port:commit-report"]

[[procedure.sequence]]
id = "implement-the-task"
title = "Implement the task"
agent = "agent:worker"
prompt = "prompt:implement-the-task"
input = ["port:task"]
output = ["slot:work-summary"]

[[procedure.sequence]]
id = "shipping-status"
title = "Check working tree status"
output = ["slot:shipping-status"]

[procedure.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[procedure.sequence]]
id = "shipping-maybe-commit"
title = "Shipping Maybe Commit"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-21-shipping-maybe-commit-then"

[procedure.sequence.when.not]
slot = "slot:shipping-status"
equals = ""
