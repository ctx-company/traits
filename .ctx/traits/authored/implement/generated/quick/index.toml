id = "implement"
schema-version = "0.6"
version = "0.26.0"
name = "Quick"
description = "Unreviewed implementation: plan, implement to done, commit."
variant = "quick"

[metadata]
tag = [
    "implementation",
    "review",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"

[[intent.require]]
id = "pragmatism"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "contract-ceiling"

[[intent.require]]
id = "representative-proof"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "duplication"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = 'Task to implement, named by its file in .internal/tasks/ — the key ("0044" or "0044.2"), the full name, or the filename.'

[[slot]]
id = "commit-log"
schema = "schema:text"
description = "Throwaway capture of the commit command's own output — never gates anything."

[[slot]]
id = "commit-message"
schema = "schema:text"
description = "Commit message for the current progress commit; injected directly into the git commit command step."

[[slot]]
id = "git-status"
schema = "schema:text"
description = "Working-tree status captured before the commit tail: git status --porcelain output verbatim."

[[slot]]
id = "owner-decisions"
schema = "[schema:text]"
description = "Every owner ruling made during this run — one entry per summons — the run's durable decision record, carried into the commit message."
hint = "One entry per ruling: the question put to the owner and the owner's answer in one or two sentences."

[[slot]]
id = "plan"
schema = "schema:implementation-plan"
description = "The implementation plan the reviewer turns into open steps and the worker implements."

[[slot]]
id = "plan-answer"
schema = "schema:text"
description = "The owner's plan-gate outcome: the literal 'accepted' when the owner had no annotations (or the gate is off); otherwise the ctx-annotate decision JSON. Annotations are binding corrections: the plan is drafted again with them until accepted."

[[slot]]
id = "stage-output"
schema = "schema:text"
description = "Output evidence from the git add command step."

[[slot]]
id = "work-report"
schema = "schema:step-return"
description = "The worker's return on its latest dispatch: the step's status and what the dispatch did."

[[resource]]
id = "task-board"
path = ".internal/tasks"
root = "repo"
hint = "Repo-root directory for the task board."
trigger = "on-demand"

[[schema]]
id = "implementation-plan"
description = "smart's implementation plan for the task — an actionable plan, not an implementation."

[schema.fields.approach]
schema = "schema:text"
required = true
description = "The suggested route: files to touch, symbols, edit order, reuse opportunities. Guidance the worker may deviate from in service of a goal, reporting the deviation."

[schema.fields.risks]
schema = "schema:text"
required = true
description = "What could go wrong and how the route mitigates it."

[schema.fields.scope]
schema = "schema:text"
required = true
description = "The task's scope restated from the task file: what is in, what is explicitly out."

[schema.fields.stages]
schema = "[schema:stage]"
required = true
description = "The plan as an ordered list of stages, each an id and a goal. Nothing else is required of a stage while it is open: whatever a later stage's goal covers may be in any state until that stage, and that is neither a defect nor a regression. The plan must be ACTIONABLE for this run — a stage that cannot be done as written is a plan error, surfaced as blocked steps and revised, never ground against. When the task declares itself an atomic cutover that only compiles as one unit, honor that: do not carve it into stages that each demand a green intermediate. Together the stages must cover every Done-when goal of the task."

[[schema]]
id = "stage"
description = "One stage of the plan: an id and the goal that defines it."

[schema.fields.goal]
schema = "schema:text"
required = true
description = "What must be observable when this stage is done, taken from the task's Done-when. A goal is the only requirement of its stage."

[schema.fields.id]
schema = "schema:text"
required = true
description = 'Short kebab-case slug naming the stage, stable for the whole run (e.g. "resolver", "flip-context", "delete-old").'

[[schema]]
id = "step-return"
description = "The worker's report on one dispatch of one step: its status and what it did."

[schema.fields.status]
schema = "schema:text"
required = true
description = "done when you verified this step's done-when holds in the tree with your own tools; blocked when you cannot proceed on it from inside this run (a real contradiction, a decision only the owner can make) — never difficulty or a red tree; not-done when you made progress but it does not yet hold, and the next dispatch should continue the SAME step. Claim only what you verified: a false 'done' comes back as the same open step."
allowed = [
    "done",
    "blocked",
    "not-done",
]

[schema.fields.summary]
schema = "schema:text"
required = true
description = "What this dispatch changed and verified — files and symbols, commands run and their observed results. When status is blocked, state precisely what blocks it and why. The next dispatch reads this as its only memory of this one."

[[agent]]
id = "scribe"
description = "Commit & Summary Writing; git staging and committing run as command steps."
summary = "Commit-message role."

[[agent]]
id = "smart"
description = "Plan Drafting and Review"
summary = "Review role."

[[agent.intent.avoid]]
id = "taste-only-blocking"

[[agent.intent.avoid]]
id = "tail-case-pursuit"

[[agent.intent.avoid]]
id = "rubber-stamp-review"

[[agent.intent.avoid]]
id = "unbounded-loop"

[[agent]]
id = "worker"
description = "Implementation Work"
summary = "Implementation role."

[[agent.intent.require]]
id = "preserve-scope"

[[agent.intent.require]]
id = "review-before-final"

[prompt.draft-the-implementation-plan]
text = """
Draft the implementation plan for {port:task}; read it and the relevant code with your tools.
The owner's corrections to the previous draft, when present, are binding: {slot:plan-answer}"""
input = ["port:task"]
output = ["slot:plan"]

[prompt.implement-the-plan]
text = """
Implement the plan: {slot:plan}, stage by stage in plan order; each stage's goal is its only requirement. There is no reviewer — carry your own progress through your report and keep going until the plan's goals hold.
Your previous return, if any: {slot:work-report}.
Return your status: done when every stage's goal holds in the tree, verified with your own tools; blocked for something only the owner can settle; not-done when more remains and the next dispatch should continue."""
input = ["slot:plan"]
output = ["slot:work-report"]

[prompt.write-the-commit-message]
text = """
The work for {port:task} is being committed.
Write a concise commit message from the worker's latest report, when there is one: {slot:work-report}.
Owner rulings made during this run (if any): {slot:owner-decisions} — when one shaped the work, cite what the owner decided in the message body.

Return exactly the finished commit message into (slot:commit-message)."""
input = ["port:task"]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "write-the-commit-message"
title = "Write the commit message"
agent = "agent:scribe"
prompt = "prompt:write-the-commit-message"
input = [
    "port:task",
    { slot = "slot:work-report", optional = true },
    { slot = "slot:owner-decisions", optional = true },
]
output = ["slot:commit-message"]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "stage-all-changes"
title = "Stage all changes"
output = ["slot:stage-output"]

[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence.command]
argv = [
    "git",
    "add",
    "-A",
]

[[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence]]
id = "commit-the-work"
title = "Commit the work"
input = ["slot:commit-message"]
output = ["slot:commit-log"]

[sequence.ctx-branch-arm-p-12-maybe-commit-then.sequence.command]
argv = [
    "sh",
    "-c",
    'if git diff --quiet && git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "$1" && echo committed; fi',
    "_",
    "{slot:commit-message}",
]

[[sequence.implement-the-plan-body.sequence]]
id = "implement-the-plan"
title = "Implement the plan"
agent = "agent:worker"
prompt = "prompt:implement-the-plan"
input = [
    "slot:plan",
    { slot = "slot:work-report", optional = true },
]
output = ["slot:work-report"]

[procedure]
description = "Unreviewed implementation: plan, implement to done, commit."
input = ["port:task"]

[[procedure.sequence]]
id = "draft-the-implementation-plan"
title = "Draft the implementation plan"
agent = "agent:smart"
prompt = "prompt:draft-the-implementation-plan"
input = [
    "port:task",
    { slot = "slot:plan-answer", optional = true },
]
output = ["slot:plan"]

[[procedure.sequence]]
id = "implement-the-plan"
title = "Implement the plan"
kind = "loop"
sequence = "sequence:implement-the-plan-body"

[[procedure.sequence.until.all]]

[procedure.sequence.until.all.not]
slot = "slot:work-report"
field = "status"
equals = "not-done"

[[procedure.sequence]]
id = "check-working-tree-status"
title = "Check working tree status"
output = ["slot:git-status"]

[procedure.sequence.command]
argv = [
    "git",
    "status",
    "--porcelain",
]

[[procedure.sequence]]
id = "maybe-commit"
title = "Maybe Commit"
kind = "branch"
sequence = "sequence:ctx-branch-arm-p-12-maybe-commit-then"

[procedure.sequence.when.not]
empty = "slot:git-status"
