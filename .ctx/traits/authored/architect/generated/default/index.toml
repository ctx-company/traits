[procedure]
description = "Ground one draft parent, judge its scope, split it into positional children or rewrite it in place as a ready execution plan, and reject open-endedness."
input = [
    "port:owner-gate",
    "port:task",
]
output = ["port:receipts"]

[[procedure.sequence]]
id = "resolve-the-task"
title = "Resolve the task"
agent = "agent:smart"
prompt = "prompt:resolve-the-task"
input = ["port:task"]
output = ["slot:target"]

[[procedure.sequence]]
id = "extract-target-file"
title = "Extract target file"
kind = "project"
input = ["slot:target"]
output = ["slot:target-file"]

[[procedure.sequence.projection]]
source = "slot:target"
field = "file"
destination = "slot:target-file"

[[procedure.sequence]]
id = "snapshot-resolved-task"
title = "Snapshot resolved task"
input = ["slot:target-file"]
output = ["slot:task-snapshot"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'test -f "$1" && cksum < "$1"',
    "_",
    "{slot:target-file}",
]

[[procedure.sequence]]
id = "ground-the-task"
title = "Ground the task"
agent = "agent:smart"
prompt = "prompt:ground-the-task"
input = ["slot:target"]
output = ["slot:grounding"]

[[procedure.sequence]]
id = "architect-refinement"
title = "Architect refinement"
kind = "loop"
sequence = "sequence:architect-refinement-body"
max-iterations = 500
on-exhausted = "abort"

[[procedure.sequence.until.all]]
slot = "slot:critic-verdict"
field = "status"
equals = "approved"

[[procedure.sequence.until.all]]
slot = "slot:owner-answer"
equals = "approved"

[[procedure.sequence]]
id = "commit-task"
title = "Commit the rewritten task"
input = ["slot:target-file"]
output = ["slot:commit-log"]

[procedure.sequence.command]
argv = [
    "sh",
    "-c",
    'git add .internal/tasks && if git diff --quiet --cached -- .internal/tasks; then echo "no changes to commit for $1"; else git commit -m "architect: execution plan" -m "$1" -- .internal/tasks; fi',
    "_",
    "{slot:target-file}",
]
