id = "architect"
schema-version = "0.5"
version = "0.1.0"
name = "Default"
description = "Ground one draft parent, judge its scope, split it into positional children or rewrite it in place as a ready execution plan, and reject open-endedness."
variant = "default"

[metadata]
tag = [
    "task",
    "architecture",
    "review",
]

[[intent.require]]
id = "correctness"

[[intent.require]]
id = "robustness"

[[intent.require]]
id = "leanness"

[[intent.require]]
id = "reuse-over-reimplement"

[[intent.require]]
id = "review-before-final"

[[intent.require]]
id = "bounded-refinement"

[[intent.avoid]]
id = "over-engineering"

[[intent.avoid]]
id = "duplication"

[[intent.avoid]]
id = "scope-creep"

[[intent.avoid]]
id = "unbounded-loop"

[[intent.avoid]]
id = "rubber-stamp-review"

[[behavior.tone]]
id = "direct"

[[behavior.tone]]
id = "technical"

[[behavior.method]]
id = "evidence-first"

[behavior.verbosity]
id = "brief"

[[port]]
id = "owner-gate"
direction = "input"
schema = "schema:text"
optional = true
description = "Owner plan-approval transport: 'annotate' (default) pipes each critic-approved plan to the owner's ctx-annotate; 'off' auto-approves so unattended batches exit the loop on the critic's verdict alone."

[port.default]
value = "annotate"

[[port]]
id = "receipts"
direction = "output"
schema = "schema:architect-receipt"
description = "The resolved task's in-place rewrite receipt."
value = "slot:receipt"

[[port]]
id = "task"
direction = "input"
schema = "schema:text"
description = "One task to architect, named by its key, name, or filename in .internal/tasks/."

[[slot]]
id = "commit-log"
schema = "schema:text"
description = "The commit tail's account: git's own output for the pathspec commit of the rewritten task file (or the no-changes notice), so a worktree run has a commit for merge to adopt."

[[slot]]
id = "critic-verdict"
schema = "schema:review-verdict"
description = "Open-endedness-only critic verdict for the rewritten task."

[[slot]]
id = "grounding"
schema = "schema:text"
description = "Read-only evidence about the target, its board context, relevant code, invariants, reuse points, and existing commands."

[[slot]]
id = "owner-answer"
schema = "schema:text"
description = "The owner's verdict on the critic-approved plan, verbatim from the approval gate: the literal string 'approved' accepts the plan and ends the refinement loop; any other content is the owner's binding corrections for the next rewrite iteration."

[[slot]]
id = "receipt"
schema = "schema:architect-receipt"
description = "Receipt for architect's one in-place rewrite."

[[slot]]
id = "target"
schema = "schema:architect-target"
description = "The one unambiguously resolved board task."

[[slot]]
id = "target-file"
schema = "schema:text"
description = "The resolved target.file duplicated as a text slot for command argv interpolation."

[[slot]]
id = "task-check"
schema = "schema:task-unchanged"
description = "Result of a target content checksum guard."

[[slot]]
id = "task-snapshot"
schema = "schema:text"
description = "Content-only cksum captured immediately after resolution and refreshed only after architect rewrites the target."

[[resource]]
id = "task-board"
path = ".internal/tasks"
root = "repo"
hint = "Repo-root directory for the task board."
trigger = "on-demand"

[[schema]]
id = "architect-child"

[schema.fields.file]
schema = "schema:text"
required = true
description = "Repo-relative path of the child task file architect wrote."

[schema.fields.key]
schema = "schema:text"
required = true
description = """The child task's board key: the parent key plus a positional ordinal ("<parent>.1", "<parent>.2", ...)."""

[[schema]]
id = "architect-receipt"

[schema.fields.children]
schema = "[schema:architect-child]"
description = "Child tasks created by the split, in dependency order, present exactly when architect judged the parent too large for one swift run and split it. Absent for a split of one."

[schema.fields.file]
schema = "schema:text"
required = true
description = "Repo-relative path to the rewritten task file."

[schema.fields.key]
schema = "schema:text"
required = true
description = "The rewritten task's immutable board key."

[schema.fields.relations-correction]
schema = "schema:text"
description = "Code-proven dependency correction, when architect changed relations."

[schema.fields.status-after]
schema = "schema:text"
required = true
description = "The task status after architect rewrote it."

[schema.fields.status-before]
schema = "schema:text"
required = true
description = "The task status before architect rewrote it."

[[schema]]
id = "architect-target"

[schema.fields.file]
schema = "schema:text"
required = true
description = "Repo-relative path to the one resolved task TOML file."

[schema.fields.key]
schema = "schema:text"
required = true
description = "The resolved task's immutable board key."

[[schema]]
id = "blocker"
description = "One blocking defect: stable identity, location, root cause, the invariant an acceptable fix must establish, the falsifiable check that clears it, and the owner's ruling on it when one exists."

[schema.fields.done-when]
schema = "schema:text"
required = true
description = "A falsifiable check the reviewer will apply next round to declare this blocker fixed. Wherever the check can be a COMMAND, state it as one the worker can run itself (a grep proving a function has exactly one caller, a test invocation) — the worker iterates against build-and-test signals, and a structural requirement stated only as prose is invisible to that loop: the worker stops where its own instruments read green, honestly believing the blocker addressed."

[schema.fields.id]
schema = "schema:text"
required = true
description = "Stable kebab-case slug for this defect, chosen on first report and reused verbatim in every later round it survives (e.g. unrelated-change-guard-baseline)."

[schema.fields.recurrence-of]
schema = "schema:text"
description = "id of the prior-round blocker this restates; present when the prior fix did not clear its done-when."

[schema.fields.required-fix]
schema = "schema:text"
required = true
description = "One or two sentences of intent: the invariant an acceptable fix establishes and why. The operational content — what to do, in what order — lives in `steps`, which is the field the worker executes and the field you maintain across rounds."

[schema.fields.root-cause]
schema = "schema:text"
required = true
description = "Why the code is wrong — the missing or broken invariant, not just where it shows — and how deep the wrong goes: a slip at the cited line, a missing invariant, or a structure the code must converge to. The depth tells the worker how big a change you expect; omitting it is how a structural demand gets answered with a point-patch."

[schema.fields.rule-quote]
schema = "schema:text"
description = "The exact authoritative line(s) the cited rule quotes, verified against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.rule-source]
schema = "schema:text"
description = "Repo-relative path + section for the house rule this blocker cites, verified directly against the rule-authority resource. Present only when the blocker cites a standing product rule."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note, verbatim, when one applies to the whole blocker — its order, its scope, its standing. Applied by the reviewer when the annotation was made; carried verbatim while the blocker survives. Blockers are listed in the order the worker executes them, and an owner's ordering ruling is what moves a blocker in that list."

[schema.fields.stage]
schema = "schema:text"
description = "The id of the plan stage this blocker belongs to: the stage whose goal it prevents. A blocker on the first open stage, or a regression of a done stage's goal, is the worker's work now; a blocker on a later stage is filed here and not worked until that stage is the first open one. Absent only when the plan carries no stages."

[schema.fields.steps]
schema = "[schema:blocker-step]"
required = true
description = """The fix as an ordered list of typed steps — you are the smarter model here, and this list exists to spend that intelligence on the worker's behalf (owner ruling 2026-07-30). Each step is one operation: what to create and what it owns, what must cease to exist or shrink to a delegate, which call sites to route. A destination ("replace the separate paths with one renderer") is not a step; the operations that reach it are. THIS LIST IS CUMULATIVE STATE, not a fresh derivation: when this blocker appeared in your prior verdict (attached), carry its steps forward VERBATIM — same order, same text — flipping status to done only where you verified the evidence with your own tools, and appending genuinely new findings as new steps at the end. Never renumber, reword, drop, or re-derive a carried step: a vanished step erases the worker's credit, a reworded one moves the target, and both teach the worker that completing steps is pointless — the four-day stall this field exists to end."""

[schema.fields.what]
schema = "schema:text"
required = true
description = "The defect and the concrete failure it causes."

[schema.fields.where]
schema = "schema:text"
required = true
description = "Repo-relative files and paths involved."

[[schema]]
id = "blocker-step"
description = "One step of a blocker's required fix: its frozen text, its verified status, why the status is what it is, how to get it accepted while it is open, and the owner's ruling on it when one exists."

[schema.fields.explanation]
schema = "schema:text"
required = true
description = "Why the status is what it is, every round, for every step. Done: the proof — file:line, a test name, or a command and its observed result. Open after the worker attempted it: what you verified in the tree and exactly what is still missing or wrong, so the owner reading the surface and the worker reading the verdict see the same reason. Open and never attempted: 'not yet attempted'. Never empty."

[schema.fields.guidance]
schema = "schema:text"
description = "For an open step: how to get it accepted next round — the concrete change and the proof you will look for (a test that must exist and pass, a grep that must come back empty, a call site that must route through X). You are the smarter model here; this is where that goes. Absent for done, deferred and dropped steps."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note, verbatim, when one applies to this step. The worker executes a ruled step as the ruling says, not as the step text alone says; a ruled step done differently from its ruling is a blocker next round. Carried verbatim while the step survives."

[schema.fields.status]
schema = "schema:text"
required = true
description = """"open", "done", "deferred" or "dropped". Flips to done only when the reviewer has verified the evidence against the working tree — never on the worker's claim alone. deferred and dropped are set only when the reviewer applies an owner annotation (recorded in the verdict's dispositions): deferred is the owner's "not now" — kept on record, not executed until the owner or its stage says so; dropped is the owner's "no" — kept on record, never executed. Neither blocks approval, and the reviewer never reopens either on its own."""

[schema.fields.step]
schema = "schema:text"
required = true
description = "The operation, frozen once written: imperative, concrete, one action. Carried verbatim across rounds."

[[schema]]
id = "disposition"
description = "One owner annotation applied to the verdict by the reviewer: anchor text, note, target, action taken, and a one-sentence account. Annotations are binding edits, never arguments; where the reviewer disagrees it applies the annotation anyway and records the disagreement in the advisory."

[schema.fields.action]
schema = "schema:text"
required = true
description = "What the reviewer did: deferred (the owner said not now — the step keeps status deferred until the owner or its stage brings it back); dropped (the owner said no — the step keeps status dropped, never executed, never reopened); done (the owner accepted it as is — status done with the note as its explanation); added (the note asked for something new — a new step or blocker carrying the note as its ruling); ordered (the note changed what comes first — the blocker list is reordered); ruled (the note changes how a step or blocker is done — carried as its ruling and executed as ruled); answered (the note answered or asked something that changes no item — the answer is in note); unclear (the note could not be mapped or understood — note carries a one-sentence question for the owner, and nothing was changed)."
allowed = [
    "deferred",
    "dropped",
    "done",
    "added",
    "ordered",
    "ruled",
    "answered",
    "unclear",
]

[schema.fields.applied-to]
schema = "schema:text"
required = true
description = 'Where the annotation landed: a blocker id, "<blocker-id>/step <n>", "stage <id>", "advisory", or "plan".'

[schema.fields.note]
schema = "schema:text"
required = true
description = "One sentence: what changed in this verdict because of the annotation, or the question back to the owner when action is unclear."

[schema.fields.raw]
schema = "schema:text"
required = true
description = "The annotated surface text, verbatim from the gate answer's raw field. This is the anchor: it is an exact substring of the verdict's own blocker, step, stage or advisory text."

[schema.fields.text]
schema = "schema:text"
required = true
description = "The owner's note, verbatim from the gate answer's text field."

[[schema]]
id = "owner-item"
description = "A checklist item outside in-run capability or authority, with verified substitute evidence and the owner action that closes it."

[schema.fields.class]
schema = "schema:text"
required = true
description = "Why no in-run effort can satisfy it: needs a real screen; needs money or an owner-authorized live execution; needs an owner authority call; or contradicts landed code/authoritative rule and the resolution is the owner's."
allowed = [
    "gui-or-visual",
    "paid-or-live-execution",
    "owner-decision",
    "contract-conflict",
]

[schema.fields.close-out]
schema = "schema:text"
required = true
description = "The exact command the owner runs or decision the owner makes to finish the item."

[schema.fields.item]
schema = "schema:text"
required = true
description = "The checklist item or Done-when clause, quoted or tightly paraphrased."

[schema.fields.reason]
schema = "schema:text"
required = true
description = "One sentence: why this item is outside in-run capability or authority."

[schema.fields.substitute-evidence]
schema = "schema:text"
required = true
description = 'The closest in-run verification actually produced and verified by the reviewer (tests, dry runs, static checks); "none possible" only when truly nothing applies.'

[[schema]]
id = "review-verdict"
description = "Typed review verdict. The loop blocks on genuine defects, clear over-build, and un-abstracted duplication — not on taste; status is revise if and only if an open step remains; escalation flags run-level owner blockers for triage without stopping the loop; owner-items records the verified outside-capability remainder so the run can complete honestly; owner annotations are applied to this verdict by the reviewer and accounted for in dispositions — they are binding edits, never arguments, and a step the owner deferred or dropped is never reopened by the reviewer."

[schema.fields.advisory]
schema = "schema:text"
description = "Non-blocking notes: subjective style, naming, taste, optional improvements, follow-up work. Never affects status and never forces another refinement round."

[schema.fields.blockers]
schema = "[schema:blocker]"
required = true
description = "The blocking defects that must be fixed before merge: correctness bugs, failing validation gates, clear over-build (accretion, defensive validation for states that cannot occur, scope creep beyond the task), OR un-abstracted duplication — logic that duplicates or closely resembles code elsewhere and should be unified into a shared abstraction instead of re-implemented or copied beside. Each entry carries a stable id, root cause, the required-fix invariant, and a falsifiable done-when. Listed in the order the worker executes them — the plan's order, then the owner's ordering rulings; never sorted by how cheap a fix is. Non-empty when status is revise. When approved the list holds no open step: a blocker whose steps are all done or dropped is removed and named in the advisory, a blocker still holding a deferred step stays listed so the deferral is on record. Always return the key (an empty list, never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.dispositions]
schema = "[schema:disposition]"
description = "One entry per owner annotation applied to this verdict, in the order annotated. Present exactly when the gate answer carried annotations; absent otherwise. Every annotation gets exactly one entry — none dropped, none merged into another, none reworded — and the edit each entry describes is visible in this same verdict (a status, a ruling, an order, a new step). The next surface shows these lines so the owner can check the application and correct it by annotating again. A later round carries earlier rulings in the items they landed on, not here: this list is this application only."

[schema.fields.escalation]
schema = "schema:text"
required = true
description = "needs-owner if and only if at least one blocker cannot be cleared by the worker from inside this run: the task file is a placeholder or lacks a falsifiable Done-when; a prerequisite task it names has not landed in this tree; the task is marked superseded or cancelled; resolving it requires an owner/authority decision; or a required gate fails for reasons outside the task's scope (tooling conflict). Escalation is RECORDED for owner triage — it does not stop the loop; refinement continues on every fixable blocker. none otherwise."
allowed = [
    "none",
    "needs-owner",
]

[schema.fields.escalation-reason]
schema = "schema:text"
required = true
description = "One plain sentence: WHY the flagged blocker set is outside this run's authority and what owner action would clear it. Non-empty when escalation is needs-owner; an empty string (never omitted — always return the key) otherwise. Always present so the runtime can deterministically copy it into a park report without a missing-field failure."

[schema.fields.owner-items]
schema = "[schema:owner-item]"
description = "Checklist items of THIS task that no in-run effort can satisfy, accepted per the draft's SCOPE SPLIT (or a verified mid-run wall claim), each with its reason class, the substitute evidence you verified, and the owner close-out. Approving with this list certifies every agent-doable item is 100% implemented. Never doable work — promote any owner-only claim a shell could satisfy to a blocker; an entry with missing or unverified substitute evidence belongs in blockers, not here. Absent when every item is agent-doable."

[schema.fields.remaining]
schema = "schema:text"
description = "Cross-task seam citations ONLY: counterpart work belonging to a DIFFERENT task on the task board, each citing that task's file name. Never in-task scope — an unimplemented item of THIS task's checklist is a blocker, and unimplemented in-task scope recorded here instead of in blockers falsifies the verdict. Absent when no cross-task seam exists."

[schema.fields.stages]
schema = "[schema:stage-status]"
description = "The plan's stage ledger: every stage of the plan's stages list, in plan order, carried verbatim across rounds with only status, evidence and ruling moving. The first open stage is the worker's objective; blockers name the stage they belong to; nothing outside the first open stage's goal and the goals of done stages is required, so a red suite or a failing gate a later stage covers is neither a defect nor a regression and never a blocker. The stage is the unit of completeness: this verdict grades the stage, never the round — a round is one attempt at finishing the current stage, and a worker that could not finish reports what is left. In the first round, also verify that the stages cover every Done-when goal of the task file (read it with your tools) and block any uncovered goal as a blocker on the last stage. Absent only when the plan carries no stages."

[schema.fields.status]
schema = "schema:text"
required = true
description = "approved when no step in any blocker has status open (advisory notes, deferred steps and dropped steps may still exist); revise when at least one step is open. A step the owner deferred or dropped never keeps status at revise."
allowed = [
    "approved",
    "revise",
]

[schema.fields.wall-id]
schema = "schema:text"
required = true
description = 'Stable wall id copied VERBATIM from an explicit "**Wall:** <id>" label in the task file, non-empty only when status is revise and that label exists — never inferred from prose similarity or blocker content. Enables cross-run standing-wall refusal (P414); an empty string here never blocks a sibling run no matter how related its blockers look. Always present (never omitted) so the runtime can deterministically copy it into a park report without a missing-field failure.'

[[schema]]
id = "stage-status"
description = "One plan stage in the verdict's ledger: id, whether its goal holds, the evidence, and the owner's ruling on it when one exists."

[schema.fields.evidence]
schema = "schema:text"
required = true
description = "Why the status is what it is: what you ran or read. Empty only for a stage nobody has reached yet."

[schema.fields.id]
schema = "schema:text"
required = true
description = "The stage id exactly as the plan's stages list names it."

[schema.fields.ruling]
schema = "schema:text"
description = "The owner's annotation note on this stage, verbatim, when one exists (an order to start it now, to treat it as done, to change its goal). Applied by the reviewer and carried verbatim."

[schema.fields.status]
schema = "schema:text"
required = true
description = "done only when you verified with your own tools that the stage's goal is observable in the working tree; open otherwise. A done stage whose goal stops holding goes back to open, with the evidence that shows it — that is the only kind of regression there is."
allowed = [
    "open",
    "done",
]

[[schema]]
id = "task-unchanged"

[schema.fields.argv]
schema = "[schema:text]"
required = true
description = "The exact argv that verified the target snapshot."

[schema.fields.ok]
schema = "schema:boolean"
required = true
description = "True only when the target file exists and still matches its snapshot."

[[agent]]
id = "smart"
description = "Grounds, rewrites, and critiques one task execution plan."
summary = "Review role."

[prompt.criticize-open-endedness]
text = """
Read-only adversarial review of {slot:target} and {slot:receipt} against {slot:grounding}. Inspect the actual task file — and, when the receipt records children, every child file too; edit nothing.
Split shape (when children exist): block a child whose key is not the parent key plus a positional ordinal in receipt order, whose [relations] parent is not the parent key, or whose depends-on names a non-sibling without code-proven need; block the parent if it still carries an execution plan instead of charter intent and the umbrella stop condition; block a split that is packaging — children with no genuine shared umbrella. Every child is judged by the same Done-when/approach bars as a standalone plan below. Block ONLY these: a Done-when goal that is missing, unobservable, hedged ("or", "either", "consider", "optionally", "TBD", "as appropriate" inside a goal statement), or lacking a "Source:" line quoting verbatim the parent plan or design line(s) that state it (a quote the grounding cannot find, or one that does not say what the goal says, blocks — that is distillation); Decisions or Watch text that instructs commit granularity, round mechanics, or how a review must block (the process owns those); any [[checks]] table (the reviewer validates the goal; tasks carry no checks); approach text presented as binding or restrictive rather than suggested — the plan must state in its own text that files, symbols, edit order, commands, and proof mechanics are the suggested route and that deviation in service of a goal is legitimate and reported, not escalated; pinned internal proof mechanics (exact fixtures, matchers, or literal expected output) that the grounding does not evidence as already occurring; status other than ready; changed filename, key, raised date, or relations without a code-proven correction. Also block unless receipt.key and receipt.file exactly match target, receipt records status-before draft and status-after ready, and relations-correction is present exactly when the task's relations changed and explains that code-proven correction. Do not block on taste, general quality, or hedge words inside approach suggestions.

Return the typed review verdict: revise only for those blockers, approved when none remain: slot:critic-verdict"""
input = [
    "slot:target",
    "slot:receipt",
    "slot:grounding",
]
output = ["slot:critic-verdict"]

[prompt.ground-the-task]
text = """
Read-only grounding for {slot:target}: read that exact task, its parent and siblings where present, relevant code, existing commands, invariants, and reusable logic. Establish every concrete fact the execution plan needs. Do not edit any file.

Return evidence-grounded context for the one rewrite: slot:grounding"""
input = ["slot:target"]
output = ["slot:grounding"]

[prompt.resolve-the-task]
text = """
Read-only resolution: locate exactly one unambiguous TaskDocument TOML file under .internal/tasks/ for {port:task}, accepting its key, name, or filename. Inspect filenames and TOML metadata with tools. Do not edit any file. Refuse ambiguity rather than selecting a candidate.

Return the resolved immutable key and repo-relative file path: slot:target"""
input = ["port:task"]
output = ["slot:target"]

[prompt.rewrite-the-task-in-place]
text = """
Architect {slot:target}: judge its scope first, then shape the board accordingly (owner ruling 2026-09-01 — architect owns decomposition; plan delivers one parent). Scope target: work one agent run can progress through swiftly. Two legitimate outcomes:
     SPLIT OF ONE (the parent is already that scope): rewrite only target.file in place from draft to a ready execution plan, exactly as before. Create no other file.
     SPLIT (the parent is materially larger): create child TaskDocument TOML files in .internal/tasks/, keyed positionally as <parent-key>.1, <parent-key>.2, ... in dependency order (ordinals continue .10, .11 — never zero-padded, never renumber existing children), each a complete ready execution plan at the swift-run scope with parent = "<parent-key>" in [relations] and depends-on listing only real prerequisite siblings; then rewrite target.file itself as the charter — the shared intent, the umbrella stop condition no single child owns, and the acceptance shape — carrying no execution plan of its own. Split only when a genuine umbrella exists; never split as packaging.
     In both outcomes: modify no file other than target.file and the child files you create. Preserve the parent's filename, key, and raised date; stamp each child's raised date with today's. Keep the parent's relations unchanged unless code reading proves a dependency is wrong; if changed, explain the proof in relations-correction. Change the parent's status from draft to ready and add no execution-plan header.
     Use grounding {slot:grounding} and checksum context {slot:task-snapshot}. The plan separates goals from approach, and must say so in its own text. GOALS are explicit and binding: each Done-when states an observable outcome plus explicit exclusions, and is followed by a line "Source:" quoting VERBATIM the line(s) of the parent plan or design it comes from — a goal is carried, never distilled, and a goal with no source line to quote is not a goal of this plan. APPROACH is the suggested route, never a boundary: expected files, symbols and signatures, edit order, commands to run, and proof mechanics are the architect's best guidance — stated precisely where the grounding supports them — and the run may deviate from any of it whenever a goal requires it, reporting deviations in the work summary rather than treating them as violations or escalating them. Never pin internal proof mechanics (exact fixtures, matchers, or literal expected output) beyond what the grounding evidences as already occurring: state what must be proven and let the run choose how to observe it. Reuse points stay named. Decisions and Watch state outcome decisions and risks only — never commit granularity, round mechanics, or how a review must block; the process owns those. Emit no [[checks]]: the reviewer validates the work against the goals with its own tools (owner ruling 2026-09-04).
Prior critic verdict, when present: {slot:critic-verdict}. Fix its blockers only.
Owner corrections, when present, are the owner's binding instructions for this iteration and override every other consideration: {slot:owner-answer}

Return the typed receipt for this rewrite, recording draft to ready, any permitted relations correction, and — when you split — every child's key and file in order: slot:receipt"""
input = [
    "slot:target",
    "slot:grounding",
    "slot:task-snapshot",
]
output = ["slot:receipt"]

[[sequence.architect-refinement-body.sequence]]
id = "assert-task-unchanged-before-rewrite"
title = "Assert task unchanged before rewrite"
kind = "check"
input = [
    "slot:target-file",
    "slot:task-snapshot",
]
output = ["slot:task-check"]

[sequence.architect-refinement-body.sequence.command]
argv = [
    "sh",
    "-c",
    'test -f "$1" && cksum < "$1" | grep -qxF -- "$2"',
    "_",
    "{slot:target-file}",
    "{slot:task-snapshot}",
]

[[sequence.architect-refinement-body.sequence]]
id = "assert-task-unchanged-before-rewrite-failed"
title = "Assert task unchanged before rewrite failed"
kind = "branch"
sequence = "sequence:ctx-branch-arm-s-25-architect-refinement-body-43-assert-task-unchanged-before-rewrite-failed-then"

[sequence.architect-refinement-body.sequence.when]
slot = "slot:task-check"
field = "ok"
equals = false

[[sequence.architect-refinement-body.sequence]]
id = "rewrite-the-task-in-place"
title = "Rewrite the task in place"
agent = "agent:smart"
prompt = "prompt:rewrite-the-task-in-place"
input = [
    "slot:target",
    "slot:grounding",
    "slot:task-snapshot",
    { slot = "slot:critic-verdict", optional = true },
    { slot = "slot:owner-answer", optional = true },
]
output = ["slot:receipt"]

