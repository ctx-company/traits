[sequence.architect-refinement-body.sequence.when]
slot = "slot:critic-verdict"
field = "status"
equals = "approved"

[[sequence.ctx-branch-arm-s-25-architect-refinement-body-29-present-the-plan-to-the-owner-then.sequence]]
id = "owner-approval-gate"
title = "Await the owner's verdict"
input = [
    "slot:target-file",
    "port:owner-gate",
]
output = ["slot:owner-answer"]

[sequence.ctx-branch-arm-s-25-architect-refinement-body-29-present-the-plan-to-the-owner-then.sequence.command]
argv = [
    "sh",
    "-c",
    '''
if [ "$2" = "off" ]; then
  printf approved
  exit 0
fi
files=$(git status --porcelain .internal/tasks | sed "s/^...//" | grep -v "^$" || true)
[ -n "$files" ] || files="$1"
out=$(for f in $files; do printf "==> %s <==\n" "$f"; cat "$f"; printf "\n"; done | ctx-annotate --stdin)
if printf '%s' "$out" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("annotations")==[] else 1)' 2>/dev/null; then
  printf approved
else
  if [ -n "$out" ]; then printf '%s' "$out"; else printf 'annotation gate returned no decision; retrying next iteration'; fi
fi''',
    "_",
    "{slot:target-file}",
    "{port:owner-gate}",
]

